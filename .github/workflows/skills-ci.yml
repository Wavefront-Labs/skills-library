name: skills-ci
# Runs on every pull request, so a contribution is checked against the schema before a maintainer reads it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --changed-since needs the base branch history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Lint skill frontmatter and bodies against SCHEMA.md
        run: python tools/lint.py
      - name: Published ids never vanish; changed skills bump version
        if: github.event_name == 'pull_request'
        run: python tools/lint.py --changed-since origin/${{ github.base_ref }}
      - name: Build the manifest and indexes
        run: python tools/reindex.py
      - name: Every served response starts with the licence notice
        run: python tools/serve.py --selftest
      - name: Taxonomy checks
        run: |
          python taxonomy/fields/check.py
          python taxonomy/products/check.py
          python tools/coverage_check.py
