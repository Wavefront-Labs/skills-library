# Level 1 (top level) of the skills taxonomy. FROZEN at v1.3 (13 Oct 2026, after 12 gap-hunt
# rounds, ~6,700 probes; owner's call: six straight rounds in a 93-96% clean band with the
# category structure unchanged since round 6 is the plateau, not a path to 100%). Further
# edge cases found during Level 2/3/4 work get fixed opportunistically, logged in gap-hunts/,
# with a version bump — not blocked on another abstract gap-hunt round. See PLAN.md.
# The global rules decide most placements; each category then lists what it covers, what it
# excludes (and where that goes), and the tie-breaks for the boundaries the gap hunts found.

version: 1.4
rules:
  - id: activity
    rule: "Place by the ACTIVITY. Who does it, whether it is paid, sacred or secular, amateur or professional never moves a skill; amateur vs professional is the skill's level. Purpose may decide only where a tie-break below explicitly names it, and every such tie-break must give an OBJECTIVE test (what was made, who it was made for, who treats whom), never an unobservable intent."
  - id: utility
    rule: "Order of preference for a leisure-shaped activity: (1) a codified sport or game with rules and scoring is sports-recreation; (2) moving your own body, vessel or vehicle for its own sake, with no destination, cargo or delivery (climbing, swimming, diving, skiing, hiking, skateboarding, camping, paddling, pleasure riding, joyriding, pleasure boating, jet-skiing, sailing with no destination) is sports-recreation; (3) otherwise, if it uses the same skills as a work or utility form that has a listed home, it lives there (vehicle/vessel handling with a destination or cargo, birdwatching's identification, foraging's gathering). sports-recreation also holds collecting (acquiring, organising and valuing a collection; identifying or studying the items goes to their own field), spectating and fandom. Tie-break: operating a vehicle, vessel or craft, or a descent such as a parachute jump, as part of a military or law-enforcement operation (combat, patrol, deterrence, insertion) is defence-public-safety regardless of tier 2; the same act for transport, sport, record or recreation follows the tiers above."
  - id: study-vs-practice
    rule: "Producing new knowledge about a field through research (natural-sciences, social-sciences, humanities, mathematics) stays in the research category. Practising the field, including applying established science or scholarship in a job, goes to the field. Teaching about the field academically is education-training; teaching one practical skill is that skill's category."
  - id: method-vs-domain
    rule: "A cross-sector SUPPORT function stays in its own category in every sector: general management and administration, HR including labour and industrial relations (collective bargaining, works councils, grievance handling), finance, procurement, internal communications strategy and planning, humanitarian/development programme-cycle management (needs assessment, monitoring and evaluation, cluster coordination) (all business-finance) — EXCEPT where a category's own named tie-break sends a specific technical sub-task (such as construction cost estimating and scheduling) to the field instead, because it genuinely needs that field's content, not just its general process; compliance monitoring, policy and training performed by a regulated entity's own staff (business-finance), versus inspection, audit or certification carried out by or for an external regulator (law-government or defence-public-safety, see their tie-breaks); occupational health and safety (law-government); statistics and general quantitative method (mathematics); scientific method (natural-sciences, by study-vs-practice); pedagogy, and academic peer review, grant writing for research funding and research ethics regardless of the field under review (education-training); translation and interpreting (languages-linguistics). Drafting or editing a specific organisational message, document or campaign is media-communication even inside an organisation; deciding the channel strategy and plan is business-finance; editing someone else's creative writing, music or performance so as to change its creative content (not just correctness or house style) is creative-arts. Objective test for everything else: if making the decision correctly requires the field's own technical content (a recipe, a crop, a clinical protocol, a legal text, a creative judgement) it is that field; a task performed the same way whatever the content (payroll, scheduling, generic contracting, a lease) is the cross-sector function. A role that both shapes creative or technical content AND manages its budget, staffing or schedule is business-finance unless it holds final sign-off over the work's content, which is that field (creative-arts for a director's cut, the domain for a clinical or engineering call) — this sign-off clause decides which field owns a MIXED role's title, such as producer or principal; it never pulls a generic admin task (payroll, scheduling, procurement, a lease) out of business-finance just because the same person also has content sign-off, and it never overrides a category's own named ownership tie-break (hospitality-culinary, agriculture-environment). Writing and filing a regulatory submission or dossier on an organisation's own behalf (a device 510(k), a drug IND, a quality-management-system file) is business-finance, like other compliance paperwork; the regulator's own review and decision is law-government or defence-public-safety."
  - id: tool
    rule: "Using a tool for a task places the skill by the task, not the tool. Writing software or firmware as the deliverable, and building, training or operating the general-purpose methods, frameworks and infrastructure of AI and machine learning, is computing-software. Code, a model or a script (in Python, R or similar, including a trained ML model) used only as an instrument to analyse or automate one task within a domain — an astronomer's classifier, a retailer's demand model, a scientist's notebook — is placed by the domain. A model calibrated to a specific product, portfolio, client or patient population (derivatives pricing, credit scoring, actuarial pricing, a clinical diagnostic or risk model) is always the domain, however general the underlying mathematical method or the ML technique used to build it; mathematics is reserved for teaching, publishing or researching the uncalibrated method itself. Building, training and operating the general-purpose ML platforms, frameworks and infrastructure that such a model runs on is still computing-software. Programming a machine to shape or move material (CAM/toolpath, teach-pendant, PLC ladder logic for a production line) is manufacturing-production."
  - id: making
    rule: "Applies to movable objects only; anything built into land or a structure is always architecture-construction regardless of method. For movable objects: a hand guiding a tool to shape, cut or join material, or hand-tended batch transformation (soap, candles, dyeing, tanning, perfumery, bronze casting), is handcrafts, in any setting and at any scale. Setting up, programming or tending a production line, plant or automated process, and hand work at a paced line station (assembly, hand-sorting, hand-soldering on a line) is manufacturing-production. Making food and drink is hospitality-culinary. The object's default home is handcrafts (or manufacturing, by the clause above); creative-arts is only for a work whose purpose is to be exhibited, performed or sold as art rather than used — tag `fine_art` instead of moving the skill when intent varies piece to piece."
  - id: mend-make-change
    rule: "Applies to physical, movable objects only; altering a digital or intangible good (modding software, a game, a document, an app) is computing-software or that domain, not this rule. For a physical movable object: repairing it like for like, OR altering, modifying or upgrading it without rebuilding it from scratch (clothing alterations, car modding, furniture upcycling, PC upgrades) is repair-maintenance for any non-art object. Making a new one from raw material is handcrafts or manufacturing-production. Conserving or restoring a movable artwork or heritage object (painting, textile, artefact) is creative-arts. A structure, whatever is done to it — building, extending, altering or restoring it, including heritage and historic-fabric restoration — is always architecture-construction, by the making rule, EXCEPT operating, fault-finding and maintaining utility plant and equipment built into land (a wind turbine, a substation, a solar array), which stays energy-mining-utilities even though it is a structure; only new civil or structural work on the supporting structure is architecture-construction."
  - id: self-vs-others
    rule: "Carrying out a treatment, medication or monitoring step for a named condition is health-medicine, whoever does it (family carer, aide or clinician). General daily-living help, supervision and company is human-services. A technique you apply to your own mind sits with the technique (mind-self); a condition-specific self-management plan sits with health-medicine."
  - id: ritual
    rule: "religion-philosophy holds the rite, prayer and belief. A technique used inside a rite goes elsewhere only if it is also a recognised practice outside the rite (calligraphy, cooking, dance, attention training); it is then placed by technique and tagged ceremonial."
  - id: era
    rule: "Era is an attribute, not a place: historical and traditional ways of doing an activity live in that activity's category. History as a discipline is humanities, under study-vs-practice."
  - id: every-skill
    rule: "Every human skill gets a home, including ones that can be misused; misuse is a use, not a separate skill. A skill that exists only as a crime (pickpocketing, extortion) sits with the category that defends against it (defence-public-safety)."
  - id: knowledge-systems
    rule: "Holistic knowledge systems (songlines, matauranga Maori, Ifa, a craft tradition) are placed piece by piece by activity and bound together by a shared knowledge_system tag and an overview entry; sacred or restricted knowledge is marked, never placed differently. (Applied from Level 2 down.)"

categories:
  agriculture-environment:
    covers: "Growing plants and raising animals; gardening, horticulture, grounds keeping and living-plant arts (bonsai, ikebana, topiary); forestry; hunting, trapping, fishing and aquaculture; foraging and gathering wild food; harvest and post-harvest handling up to a storable raw commodity; killing and field-dressing an animal; the care, breeding and training of all animals; water for land, crops and stock; land and soil management; conservation, cultural burning and environmental programmes; applied agricultural and environmental practice (study-vs-practice)."
    excludes: "Environmental science research (natural-sciences); cutting meat for cooking (hospitality-culinary); drinking-water supply (energy-mining-utilities)."
    tie_breaks: "Driving an animal to move people or goods is transportation-logistics; competing with an animal is sports-recreation. Teaching a craft or trade as part of a funded livelihoods or vocational programme is that craft's category (handcrafts or otherwise); designing, funding and running the programme (targeting, stipends, grants) is business-finance. Owning or running a farm: decisions needing crop or livestock content knowledge (crop-mix planning, breeding choices) are here; pure financial, staffing or legal ownership tasks are business-finance, by method-vs-domain."
  energy-mining-utilities:
    covers: "Extracting minerals, oil, gas, peat and stone; generating, storing and distributing power; fire-making, household fuel and heating; drinking-water and household water supply and treatment; sewerage; waste collection, scavenging, recycling and disposal; operating, fault-finding and maintaining live utility and telecommunications networks and amateur radio stations; operating shared industry clearinghouse functions (number portability, inter-carrier settlement) and carrier fraud detection and prevention, as part of operating telecom networks."
    excludes: "Designing these systems (engineering-technology); building new networks and plant (architecture-construction); configuring network software (computing-software); radio presenting (media-communication); railway signalling (transportation-logistics)."
    tie_breaks: "Negotiating interconnection, peering, roaming or site-lease commercial terms between operators is business-finance or sales-marketing; engineering the technical capacity, routing or link-budget content that underlies those terms is here or engineering-technology."
  architecture-construction:
    covers: "Architecture, landscape architecture, urban and regional planning, climate adaptation planning; surveying, cartography and geospatial mapping; building and civil construction, including new utility networks; all building trades and work done on land or structures (bricklaying, plastering, framing, structural welding) whatever the hand or machine method used; renovation and extension that changes a structure; shelters and dwellings of every tradition; demolition; operating construction machinery; construction cost estimating, quantity takeoff, unit pricing, and CPM/sequencing schedule logic (an exception to method-vs-domain's named finance and project-management functions, because this genuinely needs construction content, not just the general process); trade coordination, sequencing and on-site quality sign-off; applied engineering and planning practice (study-vs-practice)."
    tie_breaks: "Contracting, payment terms and procurement of subcontractors is business-finance; trade coordination, sequencing and on-site quality sign-off on the same job is here."
    excludes: "Like-for-like repair, and altering a movable object (repair-maintenance); structural analysis (engineering-technology)."
  repair-maintenance:
    covers: "Repairing, maintaining, altering, modifying, upgrading and restoring any existing movable object that is not an artwork: vehicles, machinery, appliances, electronics, tools, instruments, clocks, furniture, antiques, books, clothing, shoes and textiles; facilities and building maintenance; all cleaning, laundry and ironing, home organising, decluttering and packing to move; pest control; chimney sweeping."
    excludes: "New making (handcrafts or manufacturing-production); a structure (architecture-construction); any artwork or heritage object (creative-arts); grounds keeping (agriculture-environment); live utility plant and networks (energy-mining-utilities, by the making rule's exception)."
    tie_breaks: "The analytical and engineering layer of keeping an existing object running — reliability-centred maintenance design, failure-mode analysis, root-cause failure investigation, corrective redesign of an existing part without rebuilding the whole from scratch — is here; designing new equipment or a new process from scratch is engineering-technology. Fixed building-services equipment that is not utility plant (a lift or elevator motor, an HVAC chiller, plumbing risers) is here, maintained as part of the building; it is not a structure for the purposes of the making rule. Servicing or modifying a competitor's equipment, by a named team role (pit crew, cycling mechanic, ice resurfacer), is here even during a codified event; only the competitor's own actions in the event are sports-recreation."
  manufacturing-production:
    covers: "Setting up, programming and tending production lines, plant and automated processes at any scale (including CAM/toolpath and PLC programming); hand work at a paced line station (assembly, hand-sorting, hand-soldering); chemical, pharmaceutical, textile and print production; industrial food and drink processing; quality control against the producer's own spec; production planning."
    excludes: "A whole object individually shaped or hand-tended by one maker (handcrafts); product design (engineering-technology or creative-arts); regulatory inspection (law-government)."
  handcrafts:
    covers: "Making or hand-tending a whole movable object individually, at any scale and in any era: woodworking, joinery, coopering, wheelwrighting, boatbuilding, blacksmithing, metalsmithing and manual welding, manual machining, pottery, glassblowing, weaving, spinning, knitting, sewing and tailoring, leatherwork, basketry, knots, lashing and cordage, jewellery, bookbinding, stage props, scenery and costumes, model and kit building; hand-tended batch transformation (soap, candles, natural dyeing, tanning, perfumery, bronze casting, taxidermy, floristry). Brewing, winemaking and distilling, including craft scale, are hospitality-culinary (one home for all drink-making, by their own covers)."
    excludes: "Land or structures (architecture-construction); paced-line and automated work (manufacturing-production); repairing or altering an existing object (repair-maintenance); works made to be exhibited, performed or sold as art, tagged fine_art (creative-arts); food and drink service (hospitality-culinary)."
  transportation-logistics:
    covers: "Moving people or goods with a destination or cargo: driving, riding, cycling, piloting, sailing and boating, rail and railway signalling, driving animals for transport, spaceflight and spacecraft and satellite operations, navigation and wayfinding of every tradition, operating diving and other life-support craft (gas-mixture and decompression management, dive bells and chambers, saturation diving), traffic and transport signalling, logistics, warehousing of general goods, supply chain, postal and delivery."
    excludes: "Vehicle repair (repair-maintenance); vehicle engineering (engineering-technology); machines that work in place (the industry where the work is done); self-propelled movement with no destination, and motorsport (sports-recreation); kitchen, retail or restaurant food preservation (hospitality-culinary) — cold storage and cold-chain transport within a distribution network stays here whatever the commodity (food, pharma, chemicals); a military operation using the same vehicle, vessel or craft (defence-public-safety, by the utility tie-break); strategic-goods export licensing (arms, dual-use technology) even when filed by in-house staff (business-finance, as a regulatory submission on the organisation's own behalf) — the customs-brokerage tie-break below covers tariff and customs declarations specifically, not export-control classification."
    tie_breaks: "Trade-compliance declarations, tariff classification and customs brokerage filed by a carrier, forwarder, broker, or an importer/exporter's own in-house trade-compliance staff are here, by method-vs-domain (it needs the logistics professional's cargo knowledge); only the customs authority's own review, audit or enforcement is law-government. Sourcing strategy — make-or-buy, offshoring, choosing a manufacturing supplier — is business-finance; negotiating and selecting a carrier, forwarder or 3PL, and the physical movement, warehousing and scheduling of the resulting flow, is here (freight procurement is core transportation-logistics practice, not business-finance sourcing). Operating ground-station antenna and RF plant as generic telecom infrastructure (power, pointing, link-budget maintenance, no mission content) is energy-mining-utilities; commanding or monitoring a specific spacecraft's health, trajectory or payload through that link, and space traffic management and collision-avoidance tracking, is here, with the usual utility tie-break sending a military or intelligence mission context to defence-public-safety."
  engineering-technology:
    covers: "Engineering design and analysis in every discipline; function, structure and specification of products; technical drawing and CAD; robotics and control systems; systems engineering; invention; applied engineering practice (study-vs-practice)."
    excludes: "Code as the deliverable (computing-software); a pure form study or concept render with no functional deliverable (creative-arts); hands-on building and making (architecture-construction, handcrafts, manufacturing-production); technical authentication or testing of a product commissioned for prosecution or enforcement (defence-public-safety)."
    tie_breaks: "Industrial design of a utilitarian product (a phone chassis, a hinge, an enclosure) is here as one integrated skill, even though it defines both function and form in the same deliverable; creative-arts is reserved for work whose deliverable is form alone (a concept render with no engineering content). Technical authentication or testing of a product (counterfeit-component detection, failure analysis) is here unless the work is commissioned BY the prosecution or an enforcement agency for a criminal case, or is itself a coercive enforcement action (defence-public-safety); testing for a civil action (an IP-infringement suit) or for the DEFENCE in a criminal case stays here, since no coercive power is held either way. Firing or detonating a weapon to test or qualify it against a specification is here; firing it for operational training or deployment is defence-public-safety."
  computing-software:
    covers: "Writing software or firmware as the deliverable; building and operating software and computer systems; systems and network administration and configuration; cloud and infrastructure; data engineering and databases; securing and defending computer systems, digital forensics and incident response as technique; AI and machine-learning engineering; general digital literacy; digital privacy and hygiene; cryptography as implementation."
    excludes: "Code used only as an instrument of domain analysis (that domain, or mathematics; by the tool rule); conducting a cyber operation as part of a conflict or criminal investigation, and the evidential chain of custody (defence-public-safety); statistics and cryptographic theory (mathematics)."
    tie_breaks: "Configuring a line-of-business SaaS platform's own domain settings (a store's catalogue or pricing rules, a seller dashboard's shipping and tax rules, an LMS course structure, a legal practice-management template, a TMS routing rule) is placed by the domain — sales-marketing or business-finance for the retail examples, or any other field's own content; the underlying software, hosting, API, integration and security administration of that platform is here."
  natural-sciences:
    covers: "Physics, chemistry, biology, earth and atmospheric sciences, astronomy, ecology and environmental science; scientific method and research producing new knowledge (study-vs-practice); laboratory and field methods; identifying and observing nature as a hobby (birding, plant and fungus identification, rockhounding, amateur astronomy)."
    excludes: "Practising a field's established applied science (that field, by study-vs-practice); treating people (health-medicine); designing things (engineering-technology); interpreting the heavens or omens for meaning (religion-philosophy)."
    tie_breaks: "Applied industrial R&D that uses scientific method to develop a genuinely new formulation or product (flavour and fragrance chemistry, a new food or material formulation, a new drug candidate) stays here, whatever industry it serves, until the result is handed to a production line or an unrelated maker to produce. It does NOT apply where a craft already named in handcrafts or hospitality-culinary covers the work outright — a brewer, distiller, perfumer or soap-maker developing their own new recipe within their own craft stays in that craft's category throughout, even while experimenting."
  mathematics:
    covers: "Pure and applied mathematics, statistics, probability, formal logic, numeracy and mental calculation, operations research, general actuarial and quantitative methods, cryptographic theory, general data analysis and visualisation not embedded in code (method-vs-domain)."
  health-medicine:
    covers: "Assessing and treating a person, and any treatment, medication or monitoring step for a named condition whoever performs it: medicine, nursing, dentistry, pharmacy, allied health, therapeutic massage, clinical psychology and psychiatry, public health, first aid, midwifery, nutrition and dietetics, veterinary medicine (treating an animal); traditional, complementary and ritual healing whenever a named afflicted person is assessed and treated; health self-management and condition-specific self-management plans; medical and clinical administration, coding, billing and insurance claims processing (method-vs-domain: needs clinical content knowledge)."
    excludes: "Routine hygiene and body care (personal-care-services); general daily-living help and supervision (human-services); fitness (sports-recreation); self-applied psychological techniques with no named condition (mind-self); divination or spirit work with no afflicted person treated (religion-philosophy)."
  human-services:
    covers: "Caring for and supporting other people: physical childcare and children's daily routines whoever does them, aged care, disability support, social work, non-clinical counselling, life and career coaching, bereavement support and death doulas, community services and development, case management, advocacy for others, the non-ritual, emotional-support side of pastoral and chaplaincy visits, volunteering in care; navigating services and self-advocacy as a service user (the same activity, by the activity rule)."
    excludes: "Clinical treatment (health-medicine); teaching a skill (education-training or that skill); attachment, communication and discipline in family life (relationships-social); organising for civic or political power (law-government)."
    tie_breaks: "Coordinating a structured, repeatable mutual-aid or informal-support network (intake, matching requests to offers, logistics) is here; one-off reciprocal help between acquaintances is relationships-social. Coaching someone's mindset, identity and adjustment through a transition (a veteran's reintegration, a career change) is here; coaching the job search itself (CV, applications, employer targeting) is business-finance, by its own 'job seeking and career management' cover."
  education-training:
    covers: "General teaching method and pedagogy, curriculum and assessment design, instructional design, running schools and training programmes, tutoring across subjects; the pedagogical content of a textbook or course (scope and sequence, explanations, course design); writing the eligibility determination, goals and services plan for a student (an IEP) from a clinical assessment; academic practice across disciplines (literature review, peer review, grant writing for research funding, academic publishing, evaluating scholarly or scientific merit for prizes and honours) as a cross-cutting method; research-ethics and safety committee review requiring field-specific scientific or technical judgement (institutional biosafety, animal-care and human-subjects review, dual-use risk) regardless of the field under review."
    excludes: "Assessing a student with a clinical instrument for a named condition (health-medicine, by self-vs-others); house-style editing, production, print and distribution of a textbook (media-communication); teaching one specific practical skill (that skill's category); a field's own research (that field, by study-vs-practice); the learner's own learning skills (mind-self)."
    tie_breaks: "Developmental or pedagogical editing of a textbook or course (reshaping how the content teaches, not just house style) is here, mirroring creative-arts' parallel split for editing a creative work; copyediting for correctness and style is media-communication; correcting factual or technical accuracy follows the field's own domain, by method-vs-domain. A 504 plan, like an IEP, is written here from a health-medicine assessment."
  humanities:
    covers: "History, archaeology, genealogy including personal and family-reunification research (tracing an adoptee's birth family), literary studies, classics, cultural and area studies, art history, musicology, religious studies as scholarship, criminology as scholarship, bioethics and other applied-ethics scholarship and publication, provenance and art authentication, museum and archive collections management and heritage interpretation; keeping and passing on an accurate account of the past or of lineage, including oral history performed by griots and tradition keepers; critical analysis and scholarly writing about creative works."
    excludes: "Composing new literature or performance (creative-arts); philosophy, theology and ethics as a discipline, including applied and bioethics (religion-philosophy); published criticism and reviews for an audience (media-communication)."
    tie_breaks: "Guiding a heritage or historic-building interpretation tour, like foraging or rockhounding guiding, stays here throughout, paid or not, by hospitality-culinary's generalised eco-guiding carve-out."
  social-sciences:
    covers: "Psychology, sociology, anthropology, economics, political science, human geography, demography, futures studies, sports science and kinesiology research, food science research, as research producing new knowledge (study-vs-practice); research methods for studying people."
    excludes: "Clinical psychology (health-medicine); practising within a sport, kitchen or field (that field); running organisations (business-finance)."
  languages-linguistics:
    covers: "Using and learning specific languages (spoken, written, signed, whistled, drummed), translation and interpreting in any setting including medical, legal and conflict-zone (method-vs-domain: cross-sector support function; a combined interpreter/fixer role is here unless an active security threat makes security judgement the primary task, in which case defence-public-safety), linguistics, scripts and writing systems including non-script records, signalling codes, reading and literacy, braille, general composition and everyday writing (letters, essays, explanations)."
    excludes: "Writing as art (creative-arts); journalism, publishing and professional writing (media-communication); operating signal networks (energy-mining-utilities); communication and information assistive technology (by the tool rule, placed by the task); certifying a transcript as the official record of a court or deposition (law-government, by media-communication's tie-break)."
  law-government:
    covers: "Law and legal practice, including religious and customary law; courts, religious courts and justice administration; mediation, arbitration and customary adjudication by a third party; statutory public functions (licensing, benefits, census, tax assessment, elections) and applying to the state for them (asylum, visas, benefits, tax filing); policy-making; politics and campaigns; diplomacy; regulatory inspection, compliance checking and certification by or for a regulator, authority or a recognised voluntary or private certification/accreditation body (a carbon-offset verifier, a green-building certifier, a sustainable-sourcing auditor, a school or professional accreditor) checking conformance to a standard, in any sector, including occupational health and safety and environmental or food-safety inspection; civic participation; community organising for civic or political power; platform and community policy-making; drafting and interpreting wills, contracts and customary settlements."
    excludes: "Coercive field enforcement, operational safety practice and physical investigation (defence-public-safety); checking work against the producer's own spec (that domain); generic administration, finance and procurement in any sector (business-finance); claims against a non-state body such as an insurer (business-finance); bidding strategy, valuation and financing for a spectrum or similar licence auction (business-finance) — only the auction's conduct and the licence grant are here."
    tie_breaks: "The hearing or decision in an internal CUSTODIAL adjudication (a prison disciplinary hearing, a custody-classification appeal, a detention-facility decision), where facility staff rather than a true third party decide someone's confinement or custody status, is here, mirroring the probation/parole revocation-hearing split below; the custody and control context around it stays defence-public-safety. This is distinct from an ordinary employment grievance panel, which stays business-finance HR throughout, by method-vs-domain; the trigger here is custody or confinement, not the word 'grievance'. If the certifying body's own staff must exercise field-specific expert judgement to issue the certificate, not just check conformance to a standard (a ship classification society's hull survey, an aviation type-certification review, a gemstone-grading lab, a wine-appellation board), it is the relevant technical, craft or science field (engineering-technology, transportation-logistics, or the domain's own home — the parenthetical examples are illustrative, not exhaustive); only the state's licensing of the certifying body, and checklist-only conformance audits, are here. The same logic applies inside business-finance for a technical PROPERTY or engineering survey done to price an insurer's own risk (a fire-risk or boiler survey): it is business-finance when the output is the insurer's own underwriting decision, and the technical field when the same judgement is sold as independent consulting; a survey that also serves a certifying body (a dual-purpose marine survey) follows the certification half, since assessing an object for conformance or class is the primary act. This business-finance clause never covers assessing a PERSON (a paramedical or life-insurance medical exam), which is always health-medicine, by self-vs-others, whoever pays for it. A state body's own monetary or financial-policy decisions (central-bank rate-setting, reserve requirements, a sovereign wealth fund's mandate) are here; executing the resulting trades, custody or settlement is business-finance. Choosing or calculating a tax or offshore structuring strategy is business-finance; drafting the resulting legal instrument (a trust deed, articles of incorporation) is here. Judicial bail-setting is here; commercial bail bonding is business-finance; recovering a bail-jumping fugitive is defence-public-safety. Supervising an offender in the community (probation, parole, diversion): acting under search, arrest or detain authority is defence-public-safety; non-coercive service navigation and support is human-services; the resulting report or revocation hearing is here."
  defence-public-safety:
    covers: "Military operations and warfare of every era, including planning psychological operations in a military campaign; weapons handling for operational use; coercive field enforcement (patrol, search, seizure, arrest) by police, customs, border, wildlife and other officers; criminal investigation and forensic science; intelligence and espionage, including conducting cyber operations as part of a conflict or criminal investigation and the evidential chain of custody; firefighting; emergency and disaster management and household preparedness; rescue; physical security including locks; corrections; explosives disposal; skills that exist only as crimes; operating a vehicle, vessel, craft or parachute descent as part of a military or law-enforcement operation (by the utility tie-break); criminal and civil investigative locating work for a legal, financial or security purpose (skip tracing, fugitive and bail-jumper recovery, asset location for litigation) — not personal or family-reunification genealogy, which is humanities; designing and enforcing physical or access security against industrial espionage and trade-secret theft (the organisation's own training and policy for this is business-finance; drafting the legal instrument, an NDA, is law-government); investigation or surveillance handed to law enforcement or conducted for a criminal prosecution."
    excludes: "Securing and defending computer systems as technique (computing-software); regulatory and paperwork-based inspection (law-government); first aid (health-medicine); codified martial arts and weapon sports (sports-recreation); making persuasive messages (media-communication); an insurer's own staff or contracted special-investigation unit looking into a claim it will pay or deny (business-finance, by method-vs-domain); a security feature built into a structure — a cell-door lock system, a perimeter fence, a guard tower, wired-in cameras and sensors — which is architecture-construction, by mend-make-change (a structure is always architecture-construction); only freestanding or portable security hardware, security policy and operational practice (patrols, access-control procedures) is here."
  business-finance:
    covers: "General management and administration, finance, procurement and HR as cross-sector support functions in any organisation, sector or household (planning, staffing, provisioning); running a household or personal life as an economic unit, allocating wealth and inheritance; strategy and foresight; entrepreneurship; accounting and carbon accounting; banking, informal finance, investing and trading, insurance, real-estate acquisition underwriting and portfolio finance (not client-facing sales or leasing); project and risk management; research administration; personal and household finance, consumer purchasing, shopping and procurement as a buyer (including haggling as a buyer); job seeking and career management; personal trip and travel planning; product management (coordinating requirements and roadmap, not the technical specification); fundraising and donor development, including grant writing for programme or project funding (not research grants, which are education-training) and soliciting and stewarding a named sponsorship or naming-rights gift; claims made against a non-state body (an insurer, a bank); an organisation's own staff training and policy for protecting trade secrets and sensitive information."
    excludes: "A field's own core work even when administered (that field, by method-vs-domain); selling and marketing (sales-marketing); economic theory (social-sciences); applying to the state (law-government); a paying sponsor's own brand or marketing decision-making on a sponsorship deal (sales-marketing), whatever sector the sponsor is in; fee-based recruiting or staffing sold as a service to clients (sales-marketing, brokering)."
    tie_breaks: "Any organisation's own solicitation and stewardship of a gift, grant or sponsorship it receives is here (a state body's own solicitation of a gift is law-government instead, a cross-sector statutory function); recruiting for an organisation's own openings, by its own staff, is here; a third-party agency or headhunter selling placement services for a fee is sales-marketing. RMA and warranty claims processing defaults here; customer-facing intake and triage only is sales-marketing. A technical survey commissioned by a lender or bank to price a loan follows the same split as an insurer's risk survey, by law-government's certification tie-break. A single, one-off personal crowdfunding campaign for an individual's own need is here (personal/informal finance); a loose, unstructured help exchange with no campaign or intake process is relationships-social. General management of a composite business (a cruise line, a casino resort) defaults here; a named operational function with its own listed home (vessel navigation and deployment, casino dealing and pit operations) follows that home instead. Designing a pricing, rebate or discount STRATEGY (what to offer, who to offer it to) is here; the live negotiation call with the customer is sales-marketing, mirroring the construction contracting split. Choosing an intellectual-property or exclusivity strategy (what patents to file, when, and how to extend protection) is here; drafting and filing the resulting patent or legal instrument is law-government, mirroring the tax-structuring split."
  sales-marketing:
    covers: "Selling, brokering and leasing to clients and customer-facing sales in any sector (insurance, real estate including residential and commercial leasing/letting, travel, technical products), negotiating sales, bartering, haggling and market trading as a seller, street and informal trade, marketing, advertising, branding, sponsorship and brand deals, retail, merchandising, customer service, audience growth and digital marketing for anything sold (SEO, social media management, a creator's brand deals)."
    excludes: "The sector's own technical content (valuation, underwriting, itinerary design — that domain); buying and procurement for an organisation's own use (business-finance); audience growth for editorial or creative output with nothing sold (media-communication); an organisation's own recruiting for its own openings (business-finance)."
    tie_breaks: "Visual merchandising and window dressing is here throughout, by method-vs-domain (it is retail content); hand-building the physical props or fixtures used is handcrafts, unless the fixture is fixed or built into the structure, which is architecture-construction, by the making rule; it is creative-arts only where the display is itself exhibited or sold as art, not made to sell other goods. Merchandise or assortment buying FOR RESALE (a department-store or fast-fashion buyer choosing stock) is here, because it needs trend and product-category judgement, not generic procurement; buying for an organisation's own internal use (office supplies, raw materials for its own production) is business-finance. Commercial photography made to sell a product (a campaign, catalogue or e-commerce shoot) defaults here; it is creative-arts, tagged fine_art, only where the image itself is exhibited or sold as a photographic work. A single player's own gambling is sports-recreation; dealing, pit-boss and table-game floor operations are hospitality-culinary, by the same ownership logic as hotel or restaurant staff (corrected 13 Oct 2026 — this sentence previously said 'here' while sitting in sales-marketing's block, contradicting the logic it cites); casino surveillance for fraud by the operator's own staff is business-finance, by the insurer-SIU tie-break, and handed to police is defence-public-safety. The live negotiation call setting a specific deal's price or terms with a customer is here, even where the strategy behind it was set in business-finance (mirroring the construction contracting split). Packaging or cover design made to sell a specific product (a book jacket, a magazine cover, box packaging) defaults here, by the same logic as commercial photography; it is creative-arts, tagged fine_art, only where the artwork is itself exhibited or sold separately. Curating what to stock or feature for subscribers or customers (a book club, a subscription box, a retail buyer) is here, needing the same trend/category judgement as merchandise buying; an institution's own collection-development selection (a library, an archive, for its own holdings, not for resale) is humanities or media-communication instead, needing scholarly content expertise, not commercial judgement."
  media-communication:
    covers: "Journalism, broadcasting, radio presenting, publishing, public relations, making persuasive messages for an audience (campaigns, propaganda, information operations), published criticism and reviews, content publishing and audience growth with nothing sold, online community management and moderation, technical and professional writing, public speaking and delivering rhetoric to an audience, library and archive information and knowledge management (what information means, metadata, governance), including a research dataset's management where no field-specific scientific judgement is needed."
    excludes: "Constructing an argument (mind-self); general persuasion and negotiation between people (relationships-social); making the creative work itself (creative-arts); audience growth for something sold (sales-marketing); storing and moving data (computing-software); museum collections management (humanities); a research dataset's metadata and curation where scientific judgement is needed (provenance, units, instrument calibration) (the research's own domain)."
    tie_breaks: "Growing an audience for ad- or generic, automatic affiliate-monetised editorial content (an Amazon Associates-style link, platform ad revenue) is here by default; it is sales-marketing only when the growth work is tied to a specific, negotiated named sponsor or affiliate partnership, or the creator's own product. A published trend-forecasting report or service sold to subscribers is here; forecasting done in-house to set a brand's own line is business-finance strategy. Verbatim transcription or captioning technique is languages-linguistics; certifying a transcript as the official record of a court or deposition is law-government. Editorial photography illustrating a story, with no specific named product sold and not itself exhibited or sold as art, is here (like news photography), not sales-marketing or creative-arts. An unbranded campaign is sales-marketing if it shares a sponsor or brand with a specific marketed product, even without naming the product; otherwise it is here. A scientific or technical exchange (a medical science liaison's conversation with a clinician) is here when it goes through medical-affairs or scientific review with no promotional sign-off, tagged non_promotional; the same content under promotional/marketing sign-off is sales-marketing, by method-vs-domain's sign-off clause."
  creative-arts:
    covers: "A work whose purpose is to be exhibited, performed or sold as art rather than used (tagged fine_art where the same technique also serves utility): visual arts, music and dance composed or performed for an audience, theatre and performance, circus, fashion modelling, film, animation, photography and camera/sound/editing work made as the artwork, creative writing and oral composition, design for form, aesthetics and user experience, game design and game-mastering, magic and illusion; judging others' creative work for a non-academic prize (a literary or arts prize committee, parallel to education-training's scholarly-prize clause); conservation and restoration of any artwork or heritage object."
    excludes: "The same technique made to be used, by default (handcrafts); stagecraft trades (handcrafts, by technique); food and drink (hospitality-culinary); publishing and audience growth (media-communication); news and forensic photography (by the tool rule)."
    tie_breaks: "Performance judged under a sport's rulebook is sports-recreation; dance and music done socially or for fun (not staged for an audience, not judged, not a fitness class) default to here; a fitness-framed class (Zumba, dance-fitness) is sports-recreation. Editing someone else's creative writing, music or performance so as to reshape its creative content (developmental book editing, dramaturgy, arranging) is here, by method-vs-domain; editing for correctness or house style only is media-communication."
  hospitality-culinary:
    covers: "Making food and drink by hand or at craft scale: cooking, baking, butchery and cutting meat for cooking, ritual slaughter preparation, cheesemaking, brewing, winemaking, distilling; preserving and storing food and drink; food and drink service, bartending, ceremonial food and drink preparation; sensory evaluation of food, drink and fragrance; guest accommodation services; tourism, commercial travel services and events, including funeral receptions; amusement and theme-park attraction and ride operations (dispatch, safety cycles, queue and capacity management, parade and character-performer scheduling), as a tourism/events service."
    excludes: "Growing, harvesting and killing an animal (agriculture-environment); industrial-line food production (manufacturing-production); domestic cleaning (repair-maintenance); personal trip planning for yourself (business-finance); developing a genuinely new formulation (natural-sciences, by its tie-break)."
    tie_breaks: "Owning or running a food business: decisions needing recipe, menu or kitchen content knowledge (menu engineering, recipe costing) are here; pure financial, staffing or legal ownership tasks (financing, leases, payroll) are business-finance, by method-vs-domain. Guiding a paid sightseeing, birding or park tour where the content is interpretation for visitors is here; the same identification and interpretation done primarily for conservation, research or non-commercial education, even if the participants pay, is natural-sciences or agriculture-environment. Guiding any activity that has its own listed category home — hunting or fishing (agriculture-environment), foraging (agriculture-environment), rockhounding or plant identification for their own sake (natural-sciences), heritage or historic-building interpretation (humanities) — stays in that category throughout, paid or not; it is here only for general sightseeing interpretation with no more specific home. On a cruise, vessel navigation and deployment is transportation-logistics; onboard guest hospitality and the tourism product is here; general cruise-line management defaults to business-finance."
  personal-care-services:
    covers: "Functional mobility, motor skills and activities of daily living, and adaptive living with mobility and daily-living aids (wheelchairs, prostheses, white canes, guide dogs); routine hygiene and body care; hair, beauty, cosmetics, SFX make-up, tattooing and body art; grooming; bathing, heat and cold practices; massage for wellbeing; sexual and intimate services whether paid or unpaid; care of the dead body and mortuary work."
    excludes: "Treating a named condition (health-medicine); general daily-living supervision by a carer (human-services); communication and information assistive technology (placed by task); the funeral ceremony (religion-philosophy); grooming, bathing, coat and nail care of an animal (agriculture-environment); training a service or guide animal (agriculture-environment) — only the handler's own orientation and mobility training with the finished aid is here."
    tie_breaks: "Care of the dead body and mortuary work includes a companion animal's remains (pet cremation, cemetery, euthanasia body-handling), not only a human body."
  sports-recreation:
    covers: "Codified sport and competition, motorsport; moving your own body for its own sake with no destination or delivery (climbing, swimming, diving, skiing, hiking, skateboarding, camping, paddling, pleasure riding); fitness, exercise and body training; fitness-framed dance and movement classes; codified martial arts and weapon sports; games and play, mind sports and competitive debate; gambling and wagering; esports; collecting (acquiring, organising, valuing); spectating, fandom and appreciation."
    excludes: "Movement with a destination or cargo, and vehicle/vessel handling (transportation-logistics); identifying or studying collected items (that field); survival under threat (defence-public-safety); social dance and music not staged or judged (creative-arts)."
  religion-philosophy:
    covers: "The rite and the belief: religious and spiritual practice, worship, prayer, praise and offering addressed to the sacred, ritual and ceremony, observances and religious calendars, theology as belief and practice, scripture study for faith, divination, astrology and esoteric practice, ceremonial use of altered states, ethics and philosophy as a practised discipline including bioethics consultation (a clinical ethics consult, an ethics committee seat) (study-vs-practice); the ritual, prayer or sacrament given within a chaplaincy or pastoral visit."
    excludes: "Scholarly study and publication about religion, ethics or bioethics (humanities); techniques also practised outside the rite (by the ritual rule); repeated attention training (mind-self); assessing and treating an afflicted person (health-medicine); religious law (law-government); formal logic (mathematics); the non-ritual, emotional-support part of a chaplaincy visit (human-services)."
  mind-self:
    covers: "Thinking, reasoning, critical thinking and evaluating information, constructing an argument, problem solving, decision making, creativity techniques, learning how to learn, memory, attention and focus, self-awareness, emotional regulation, coping with stress and grief, motivation, habits, vows and rules of life, self-management, meditation and contemplative attention training whatever the tradition, altered states, self-applied psychological techniques with no named condition, mutual-aid recovery, sensory perception training, general persuasion, negotiation and detecting deception between people."
    excludes: "Clinical mental health care of others and condition-specific plans (health-medicine); prayer addressed to the sacred (religion-philosophy); delivering rhetoric to an audience (media-communication); competitive debate (sports-recreation); domain-specific negotiation (that domain, by method-vs-domain)."
  relationships-social:
    covers: "Conversation and listening, empathy, friendship, dating, romance, intimacy and sexuality, family relationships, parenting as attachment, communication and discipline, supporting a friend through hardship or grief, resolving your own conflicts, leading and working in groups, etiquette, manners and social norms, matchmaking, gift exchange, community belonging."
    excludes: "Hands-on caregiving (human-services); third-party mediation (law-government); general persuasion and negotiation technique (mind-self); domain-specific negotiation (that domain)."
