# Drawn from: Mathematics Subject Classification (MSC2020) top-level areas, and ISCED-F 2013
# subject fields 0541 (Mathematics) / 0542 (Statistics), collapsed to the categories.yaml cover
# list (pure/applied math, statistics, probability, formal logic, numeracy, operations
# research, actuarial method, cryptographic theory, data analysis/visualisation not in code).
category: mathematics
fields:
  - id: algebra
    name: Algebra
    scope: "Structures built from sets with operations: groups, rings, fields, linear and abstract algebra, and their applications."
    examples: [linear algebra, abstract algebra, group theory, algebraic structures]
    status: live
  - id: mathematical-analysis
    name: Mathematical Analysis
    scope: "Limits, continuity, calculus and its rigorous foundations: real and complex analysis, differential equations, and functional analysis."
    examples: [real analysis, complex analysis, differential equations, functional analysis]
    status: live
  - id: geometry-and-topology
    name: Geometry and Topology
    scope: "The shape and structure of space: classical and differential geometry, topology, and their applications to other fields."
    examples: [differential geometry, topology, trigonometry, computational geometry]
    status: live
  - id: number-theory
    name: Number Theory
    scope: "Properties of integers and related structures, from elementary number theory to analytic and algebraic number theory."
    examples: [prime numbers, modular arithmetic, Diophantine equations, analytic number theory]
    status: live
  - id: combinatorics-and-discrete-mathematics
    name: Combinatorics and Discrete Mathematics
    scope: "Counting, arrangement and structure of discrete objects: graph theory, combinatorics, and discrete optimisation."
    examples: [graph theory, combinatorics, discrete optimisation, enumeration]
    status: live
  - id: formal-logic-and-foundations
    name: Formal Logic and Foundations
    scope: "Symbolic and mathematical logic, set theory, proof theory, and the foundations of mathematics."
    examples: [propositional logic, predicate logic, set theory, proof theory]
    status: live
  - id: probability-theory
    name: Probability Theory
    scope: "The mathematics of randomness and uncertainty: probability distributions, stochastic processes, and their theoretical foundations."
    examples: [probability distributions, stochastic processes, Markov chains, measure-theoretic probability]
    status: live
  - id: statistics
    name: Statistics
    scope: "Collecting, analysing and interpreting data: experimental design, inference, hypothesis testing, and statistical modelling."
    examples: [statistical inference, hypothesis testing, experimental design, regression modelling]
    status: live
  - id: operations-research
    name: Operations Research
    scope: "Mathematical optimisation and decision science applied to resource allocation, scheduling, and systems efficiency."
    examples: [linear programming, queueing theory, scheduling optimisation, decision analysis]
    status: live
  - id: actuarial-science
    name: Actuarial Science
    scope: "General actuarial and quantitative methods for assessing risk and uncertainty, independent of any one insurer's calibrated model."
    examples: [risk modelling methods, survival analysis, premium calculation theory, loss reserving methods]
    status: live
  - id: cryptographic-theory
    name: Cryptographic Theory
    scope: "The mathematics underlying encryption, hashing and secure communication, as theory rather than software implementation."
    examples: [number-theoretic cryptography, cryptographic protocol theory, complexity-based security proofs, coding theory]
    status: live
  - id: numerical-and-computational-mathematics
    name: Numerical and Computational Mathematics
    scope: "Algorithms for approximating and solving mathematical problems: numerical analysis, error estimation, and computational methods."
    examples: [numerical analysis, root-finding methods, numerical linear algebra, error analysis]
    status: live
  - id: applied-data-analysis-and-visualization
    name: Applied Data Analysis and Visualization
    scope: "General-purpose data analysis and visualisation as a mathematical method, not embedded in a software deliverable or calibrated to one domain."
    examples: [exploratory data analysis, chart and graph design, descriptive statistics, general quantitative reasoning]
    status: live
  - id: numeracy-and-mental-calculation
    name: Numeracy and Mental Calculation
    scope: "Everyday number sense and calculation: arithmetic fluency, mental math techniques, and estimation."
    examples: [mental arithmetic, estimation, speed calculation, basic numeracy instruction]
    status: live
