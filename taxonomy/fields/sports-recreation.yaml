# Drawn from IOC/SportAccord sport-federation groupings, common recreation-industry taxonomies
# (outdoor rec, fitness, gaming), and SOC/ISCO coach-official-umpire occupational groups.
category: sports-recreation
fields:
  - id: team-ball-sports
    name: Team Ball Sports
    scope: "Codified team games played with a ball under a shared rulebook and scoring system."
    examples: [football, basketball, cricket, rugby, volleyball]
    status: live
  - id: racket-and-net-sports
    name: Racket and Net Sports
    scope: "Codified individual or doubles sports played with a racket, bat or hand across a net or at a wall."
    examples: [tennis, squash, badminton, table tennis, padel]
    status: live
  - id: athletics-and-track-and-field
    name: Athletics and Track and Field
    scope: "Codified running, jumping and throwing events judged by time, distance or height."
    examples: [sprinting, distance running, long jump, javelin, race walking]
    status: live
  - id: combat-sports-and-martial-arts
    name: Combat Sports and Martial Arts
    scope: "Codified martial arts and weapon sports contested under rules, whether striking, grappling or armed."
    examples: [boxing, judo, fencing, wrestling, taekwondo]
    status: live
  - id: motorsport
    name: Motorsport
    scope: "Competitive racing and timed events using powered vehicles on road, track, water or off-road courses."
    examples: [circuit racing, rally, drag racing, powerboat racing, motocross]
    status: live
  - id: cycling-sport
    name: Cycling Sport
    scope: "Competitive and recreational cycling disciplines ridden for sport rather than transport."
    examples: [track cycling, BMX, mountain biking, road racing, cyclocross]
    status: live
  - id: water-sports-and-aquatics
    name: Water Sports and Aquatics
    scope: "Moving one's own body in or on water for sport or recreation with no destination or cargo."
    examples: [swimming, diving, surfing, water polo, kayaking for recreation]
    status: live
  - id: winter-and-ice-sports
    name: Winter and Ice Sports
    scope: "Sport and recreation performed on snow or ice."
    examples: [alpine skiing, snowboarding, ice skating, ice hockey, curling]
    status: live
  - id: climbing-and-mountaineering
    name: Climbing and Mountaineering
    scope: "Ascending rock, ice or indoor walls for sport or recreation, with no cargo or destination purpose."
    examples: [sport climbing, bouldering, alpinism, ice climbing, via ferrata]
    status: live
  - id: extreme-and-adventure-sports
    name: Extreme and Adventure Sports
    scope: "High-risk, self-propelled recreational disciplines pursued for thrill rather than competition scoring alone."
    examples: [skateboarding, parkour, BASE jumping, bungee jumping, freerunning]
    status: live
  - id: gymnastics-and-artistic-sports
    name: Gymnastics and Artistic Sports
    scope: "Codified sports judged on artistic and technical execution of body movement."
    examples: [artistic gymnastics, rhythmic gymnastics, trampolining, diving (artistic), cheerleading]
    status: live
  - id: strength-and-fitness-training
    name: Strength and Fitness Training
    scope: "Structured training of the body's strength, endurance and conditioning outside a group class format."
    examples: [weightlifting, bodybuilding, personal training, functional fitness, powerlifting]
    status: live
  - id: group-fitness-and-dance-fitness
    name: Group Fitness and Dance Fitness
    scope: "Instructor-led group exercise classes framed around fitness rather than performance or social dance."
    examples: [Zumba, aerobics, spin class, bootcamp classes, step classes]
    status: live
  - id: hiking-camping-and-outdoor-recreation
    name: Hiking, Camping and Outdoor Recreation
    scope: "Self-propelled travel on foot and outdoor living pursued for its own sake, with no destination, cargo or delivery purpose."
    examples: [hiking, backpacking, camping, orienteering, trail running]
    status: live
  - id: target-and-precision-sports
    name: Target and Precision Sports
    scope: "Codified sports scored on accuracy against a fixed target."
    examples: [archery, shooting sports, darts, bowling, curling-adjacent precision games]
    status: live
  - id: golf
    name: Golf
    scope: "The sport of golf and its course-based variants."
    examples: [stroke play, match play, disc golf, mini golf, golf coaching]
    status: live
  - id: equestrian-sport
    name: Equestrian Sport
    scope: "Riding a horse for sport or pleasure with no destination or cargo, including competitive disciplines."
    examples: [dressage, show jumping, polo, pleasure riding, rodeo]
    status: live
  - id: mind-sports-and-games
    name: Mind Sports and Games
    scope: "Codified strategy games and structured competitive debate scored by rules rather than physical skill."
    examples: [chess, bridge, go, competitive debate, poker as a mind sport]
    status: live
  - id: tabletop-and-recreational-gaming
    name: Tabletop and Recreational Gaming
    scope: "Non-competitive or casually competitive play with board games, card games and puzzles."
    examples: [board games, card games, jigsaw puzzles, role-playing games, party games]
    status: live
  - id: esports
    name: Esports
    scope: "Competitive video gaming played under organised rules and scoring."
    examples: [competitive gaming leagues, esports coaching, team strategy, casting and shoutcasting]
    status: live
  - id: gambling-and-wagering
    name: Gambling and Wagering
    scope: "Placing wagers and playing games of chance or skill for stakes, as a player."
    examples: [casino games, sports betting, lottery play, bingo, fantasy sports betting]
    status: live
  - id: collecting
    name: Collecting
    scope: "Acquiring, organising and valuing a personal collection of objects."
    examples: [coin collecting, stamp collecting, trading cards, memorabilia, vinyl records]
    status: live
  - id: spectating-fandom-and-sports-appreciation
    name: Spectating, Fandom and Sports Appreciation
    scope: "Following, watching and participating in fan culture around sport and competition."
    examples: [match-day fandom, fantasy leagues, fan clubs, tailgating, sports trivia]
    status: live
  - id: coaching-officiating-and-sports-administration
    name: Coaching, Officiating and Sports Administration
    scope: "Coaching athletes, officiating and running the on-field administration of a sport."
    examples: [team coaching, refereeing, umpiring, scorekeeping, league administration]
    status: live
  - id: air-sports
    name: Air Sports
    scope: "Recreational and competitive flight of one's own craft or body with no destination or cargo."
    examples: [skydiving, paragliding, hang gliding, glider soaring, hot-air ballooning, aerobatics]
    status: live
  - id: animal-sports
    name: Animal Sports
    scope: "Competing with animals other than horses; the care and training of the animal stays agriculture-environment."
    examples: [dog agility, sled-dog racing, pigeon racing, camel racing, sheepdog trials]
    status: live
