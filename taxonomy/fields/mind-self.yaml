# This category is practice- not occupation-shaped, so fields are named techniques and traditions
# rather than job titles, drawn from cognitive-science and self-help practice taxonomies: CBT and
# related talk-therapy-derived self-technique, positive psychology, contemplative-studies traditions
# (secular meditation, mindfulness), classical rhetoric, and philosophy-as-life-practice literature
# (Stoicism, mutual-aid recovery programmes).
category: mind-self
fields:
  - id: critical-thinking-and-argumentation
    name: Critical Thinking and Argumentation
    scope: "Reasoning, evaluating information and constructing or deconstructing an argument."
    examples: [logical fallacy spotting, source evaluation, argument mapping, Socratic questioning, informal logic]
    status: live
  - id: decision-making-and-problem-solving
    name: Decision Making and Problem Solving
    scope: "Structured techniques for making decisions and solving problems under uncertainty."
    examples: [decision matrices, root-cause analysis, scenario planning, heuristics, trade-off analysis]
    status: live
  - id: creativity-and-ideation-technique
    name: Creativity and Ideation Technique
    scope: "Deliberate techniques for generating novel ideas and creative solutions."
    examples: [brainstorming, lateral thinking, mind mapping, SCAMPER, incubation and insight technique]
    status: live
  - id: learning-how-to-learn
    name: Learning How to Learn
    scope: "Metacognitive strategies for acquiring and retaining knowledge and skill."
    examples: [spaced repetition, active recall, study planning, deliberate practice, self-testing]
    status: live
  - id: mnemonics-and-memory-technique
    name: Mnemonics and Memory Technique
    scope: "Deliberate techniques for encoding and recalling information."
    examples: [memory palace, chunking, peg systems, rhyme and acronym mnemonics, spaced recall]
    status: live
  - id: attention-and-focus-training
    name: Attention and Focus Training
    scope: "Deliberate practice of sustaining, directing and recovering attention."
    examples: [single-tasking practice, distraction management, focus intervals, concentration drills, flow-state cultivation]
    status: live
  - id: mindfulness-and-contemplative-practice
    name: Mindfulness and Contemplative Practice
    scope: "Attention-training and contemplative meditation practised outside any particular rite, whatever tradition it draws on."
    examples: [secular mindfulness meditation, body scan, breath-focused meditation, loving-kindness practice, walking meditation]
    status: live
  - id: stoic-and-philosophical-life-practice
    name: Stoic and Philosophical Life Practice
    scope: "Applying a philosophical school's exercises to one's own daily life and emotional responses."
    examples: [Stoic practice, negative visualisation, Epicurean practice, journaling as philosophical exercise, virtue-ethics self-examination]
    status: live
  - id: cognitive-behavioural-technique
    name: Cognitive Behavioural Technique
    scope: "Self-applied cognitive and behavioural techniques for reshaping thought and behaviour patterns, with no named clinical condition."
    examples: [cognitive reframing, thought records, behavioural activation, exposure practice, cognitive distortion spotting]
    status: live
  - id: emotional-regulation-and-self-awareness
    name: Emotional Regulation and Self-Awareness
    scope: "Recognising and managing one's own emotional states."
    examples: [emotion labelling, self-soothing technique, journaling for insight, body-awareness practice, triggers mapping]
    status: live
  - id: habit-and-self-management
    name: Habit and Self-Management
    scope: "Building, breaking and sustaining personal habits and routines."
    examples: [habit stacking, implementation intentions, routine design, self-monitoring, willpower and temptation management]
    status: live
  - id: motivation-and-goal-setting
    name: Motivation and Goal Setting
    scope: "Sustaining drive and setting effective personal goals."
    examples: [SMART goals, intrinsic motivation technique, accountability systems, visioning, procrastination management]
    status: live
  - id: grief-and-stress-coping-technique
    name: Grief and Stress Coping Technique
    scope: "Self-applied techniques for coping with one's own stress, loss and grief, with no named clinical condition."
    examples: [grief processing exercises, stress-response regulation, relaxation technique, resilience practice, journaling through loss]
    status: live
  - id: mutual-aid-recovery-practice
    name: Mutual Aid Recovery Practice
    scope: "Peer-based recovery practice following a structured mutual-aid programme."
    examples: [12-step programmes, sponsorship, step work, peer-support meetings, relapse-prevention planning]
    status: live
  - id: hypnosis-and-altered-states-technique
    name: Hypnosis and Altered-States Technique
    scope: "Inducing and using altered states of consciousness for self-directed, non-clinical purposes."
    examples: [self-hypnosis, trance induction, guided visualisation, breathwork-induced altered states, lucid dreaming practice]
    status: live
  - id: sensory-perception-training
    name: Sensory Perception Training
    scope: "Deliberately sharpening the acuity and discrimination of one's own senses."
    examples: [taste and aroma calibration, ear training for pitch, visual discrimination drills, tactile sensitivity practice, perceptual attention exercises]
    status: live
  - id: persuasion-negotiation-and-deception-detection
    name: Persuasion, Negotiation and Deception Detection
    scope: "General interpersonal technique for influencing others, negotiating outcomes and detecting dishonesty, outside any specific domain's own negotiation practice."
    examples: [rapport building, framing and anchoring, reading body language, lie-detection cues, general negotiation tactics]
    status: live
  - id: vows-and-personal-discipline-practice
    name: Vows and Personal Discipline Practice
    scope: "Self-imposed rules of life and personal commitments adopted for self-discipline, outside a religious rite."
    examples: [personal vows, fasting for self-discipline, minimalism commitments, digital detox pledges, rule-of-life design]
    status: live
