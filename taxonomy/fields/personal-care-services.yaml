# Drawn from SOC 39-xxxx (Personal Care and Service), ISCO-08 unit groups 5141/5142/3221,
# and named body-care, beauty and mortuary disciplines.
category: personal-care-services
fields:
  - id: hairdressing-and-barbering
    name: Hairdressing and Barbering
    scope: "Cutting, styling, colouring and chemically treating hair for clients."
    examples: [haircutting, colour formulation, perming and relaxing, beard trimming, scalp treatments]
    status: live
  - id: beauty-therapy-and-esthetics
    name: Beauty Therapy and Esthetics
    scope: "Providing skin and beauty treatments for cosmetic and wellbeing purposes, including facials and waxing."
    examples: [facials, waxing, eyebrow and lash shaping, skin analysis, chemical peels]
    status: live
  - id: makeup-artistry
    name: Makeup Artistry
    scope: "Applying cosmetic makeup for everyday, bridal, editorial and performance purposes."
    examples: [bridal makeup, editorial makeup, airbrush application, colour matching, makeup lesson coaching]
    status: live
  - id: sfx-and-prosthetic-makeup
    name: Special-Effects and Prosthetic Makeup
    scope: "Creating special-effects and prosthetic makeup for film, theatre and performance."
    examples: [prosthetic application, wound and ageing effects, creature makeup, mould and cast work, continuity for multi-day shoots]
    status: live
  - id: tattooing-and-body-art
    name: Tattooing and Body Art
    scope: "Applying permanent and semi-permanent body art, including tattooing and scarification."
    examples: [tattoo design, needle technique, aftercare guidance, henna and mehndi, scarification]
    status: live
  - id: body-piercing
    name: Body Piercing
    scope: "Performing body piercings and fitting jewellery, including aftercare guidance."
    examples: [piercing technique, jewellery fitting, aftercare guidance, sterilisation practice, anatomy assessment for placement]
    status: live
  - id: nail-care
    name: Nail Care
    scope: "Providing manicure, pedicure and nail enhancement services."
    examples: [manicure, pedicure, gel and acrylic application, nail art, cuticle care]
    status: live
  - id: spa-and-bathing-therapies
    name: Spa and Bathing Therapies
    scope: "Providing heat, cold and water-based body treatments for relaxation and wellbeing."
    examples: [sauna and steam therapy, hammam ritual bathing, hydrotherapy, cold-plunge practice, body wraps]
    status: live
  - id: wellness-massage
    name: Wellness Massage
    scope: "Providing massage for relaxation and general wellbeing rather than treatment of a named medical condition."
    examples: [relaxation massage, hot-stone massage, aromatherapy massage, Thai massage, reflexology for wellbeing]
    status: live
  - id: grooming-and-hygiene-care
    name: Grooming and Personal Hygiene Care
    scope: "Assisting with or performing routine personal hygiene and grooming tasks."
    examples: [bathing assistance, shaving, oral hygiene care, dressing assistance, skin and hair hygiene routines]
    status: live
  - id: mobility-and-daily-living-support
    name: Functional Mobility and Daily-Living Support
    scope: "Supporting functional mobility, motor skills and activities of daily living, including orientation and training with adaptive aids."
    examples: [wheelchair orientation training, prosthetic use coaching, white-cane mobility training, guide-dog handler orientation]
    status: live
  - id: sexual-and-intimate-services
    name: Sexual and Intimate Services
    scope: "Providing sexual and intimate services to clients, whether paid or unpaid."
    examples: [sex work practice, intimacy coaching with physical touch, erotic massage, companionship services, consent and safety practice]
    status: live
  - id: mortuary-and-funeral-body-care
    name: Mortuary and Funeral Body Care
    scope: "Caring for the dead body, including human and companion-animal remains, apart from the funeral ceremony itself."
    examples: [embalming, cosmetic restoration of remains, body transport and handling, cremation operations, pet euthanasia body-handling]
    status: live
  - id: funeral-directing
    name: Funeral Directing and Arranging
    scope: "Arranging and coordinating funerals with families, around the body-care, ceremony and reception tiers."
    examples: [at-need arranging, pre-need planning, cremation and burial coordination, cortege logistics]
    status: live
  - id: personal-styling-and-image
    name: Personal Styling and Image Consulting
    scope: "Advising and dressing a client's wardrobe, colours and overall presentation."
    examples: [wardrobe styling, colour analysis, personal shopping guidance, editorial and celebrity styling, image consulting]
    status: live
