# Drawn from: named software/IT disciplines as organised by SWEBOK and SFIA skill groups,
# SOC/ISCO computing occupation detail (software developers, sysadmins, DBAs, security
# analysts, ML engineers), and how practitioners name their own specialisations.
category: computing-software
fields:
  - id: software-engineering
    name: Software Engineering
    scope: "Designing, writing and maintaining application and systems software as the deliverable."
    examples: [backend development, frontend development, mobile app development, API design, software architecture]
    status: live
  - id: firmware-embedded-development
    name: Firmware & Embedded Development
    scope: "Writing low-level software that runs directly on hardware devices and controllers."
    examples: [microcontroller firmware, RTOS development, device driver development, bootloader development]
    status: live
  - id: systems-network-administration
    name: Systems & Network Administration
    scope: "Configuring, operating and maintaining servers, operating systems and network infrastructure."
    examples: [Linux/Windows server administration, network configuration, Active Directory administration, DNS/DHCP management]
    status: live
  - id: cloud-infrastructure-engineering
    name: Cloud & Infrastructure Engineering
    scope: "Designing, provisioning and operating cloud and on-premises computing infrastructure."
    examples: [infrastructure as code, cloud architecture, container orchestration, site reliability engineering]
    status: live
  - id: devops-ci-cd
    name: DevOps & CI/CD Engineering
    scope: "Building and operating the automated pipelines and practices that build, test and deploy software."
    examples: [CI/CD pipeline design, release engineering, build automation, deployment automation]
    status: live
  - id: data-engineering
    name: Data Engineering
    scope: "Designing and operating pipelines and systems that move, transform and store data at scale."
    examples: [ETL/ELT pipeline development, data warehouse engineering, streaming data pipelines, data pipeline orchestration]
    status: live
  - id: database-administration
    name: Database Administration & Engineering
    scope: "Designing, tuning and operating database systems."
    examples: [relational database administration, NoSQL database engineering, query optimisation, database replication and backup]
    status: live
  - id: cybersecurity-defensive
    name: Cybersecurity (Defensive)
    scope: "Securing and defending computer systems and networks against attack, as technique."
    examples: [security operations, vulnerability management, security architecture, identity and access management]
    status: live
  - id: offensive-security
    name: Offensive Security & Penetration Testing
    scope: "Authorised adversarial testing of systems to find exploitable weaknesses."
    examples: [penetration testing, red teaming, exploit development for testing, bug bounty hunting]
    status: draft
  - id: digital-forensics-incident-response
    name: Digital Forensics & Incident Response
    scope: "Investigating and responding to security incidents and recovering digital evidence, as a technical practice."
    examples: [malware analysis, incident response, forensic disk and memory analysis, log analysis for intrusion]
    status: live
  - id: ai-ml-engineering
    name: AI & Machine Learning Engineering
    scope: "Building, training and operating general-purpose machine-learning models, frameworks and infrastructure."
    examples: [model training pipelines, MLOps, LLM application engineering, ML platform engineering]
    status: live
  - id: qa-testing-engineering
    name: QA & Software Testing Engineering
    scope: "Designing and executing tests and quality processes for software, as a software-delivery discipline."
    examples: [test automation, manual QA testing, performance testing, test-case design]
    status: live
  - id: it-support-helpdesk
    name: IT Support & Helpdesk
    scope: "Diagnosing and resolving end-user computing problems and providing technical support."
    examples: [desktop support, helpdesk ticketing, device provisioning, end-user troubleshooting]
    status: live
  - id: web-development
    name: Web Development
    scope: "Building websites and web applications, spanning client and server technologies."
    examples: [full-stack web development, CMS development, e-commerce platform development, web performance optimisation]
    status: live
  - id: game-programming
    name: Game Programming
    scope: "Writing the software systems that run video games, distinct from the game's creative design."
    examples: [gameplay programming, graphics engine programming, physics engine programming, multiplayer networking code]
    status: live
  - id: computer-graphics-engineering
    name: Computer Graphics Engineering
    scope: "Writing software that renders and processes images, 3D scenes and visual effects."
    examples: [rendering engine development, shader programming, computer vision engineering, graphics pipeline optimisation]
    status: live
  - id: cryptography-implementation
    name: Cryptography (Implementation)
    scope: "Implementing cryptographic algorithms and protocols in software systems."
    examples: [applied cryptographic library implementation, protocol implementation (TLS, etc.), key-management system implementation]
    status: live
  - id: digital-privacy-hygiene
    name: Digital Privacy & Hygiene
    scope: "Everyday practices and configuration for protecting one's own digital privacy and security."
    examples: [password management, device hardening, privacy-setting configuration, phishing awareness]
    status: live
  - id: general-digital-literacy
    name: General Digital Literacy
    scope: "Basic competence using computers, software and the internet for everyday tasks."
    examples: [file management, office software use, basic troubleshooting, internet navigation]
    status: live
  - id: data-science-and-analytics
    name: Data Science & Analytics
    scope: "Analysing data with dataframes, statistics, notebooks, visualisation, experiments and BI tools to answer questions."
    examples: [pandas analysis, statistical testing, notebooks, dashboards, A/B tests]
    status: live
  - id: networking-hardware-and-wireless
    name: Networking Hardware & Wireless
    scope: "Deploying and administering switches, routers, Wi-Fi, structured cabling and SD-WAN at the device and link level."
    examples: [Wi-Fi design, structured cabling, switch administration, SD-WAN]
    status: live
  - id: ux-hci-design
    name: UX & HCI Design
    scope: "Designing usable, accessible software interfaces: heuristics, research, interaction design and design systems."
    examples: [usability heuristics, WCAG accessibility, user research, design systems]
    status: live
  - id: ar-vr-development
    name: AR/VR/XR Development
    scope: "Building augmented, virtual and mixed reality applications: OpenXR, Unity and Unreal XR, WebXR, mobile AR and XR comfort and performance."
    examples: [OpenXR sessions, Unity XR Interaction Toolkit, AR Foundation, WebXR, ARKit and ARCore]
    status: live
  - id: erp-crm-administration
    name: ERP & CRM Administration
    scope: "Administering Salesforce, SAP ERP basics and Dynamics 365 plus data migration, master data and integration craft."
    examples: [Salesforce administration, SAP basis basics, Dynamics 365 and Business Central, data migration]
    status: live
  - id: rpa-and-low-code
    name: RPA & Low-Code Platforms
    scope: "Building and governing robotic process automation and low-code apps with UiPath, Power Apps and Power Automate."
    examples: [UiPath REFramework, Orchestrator queues, Power Apps canvas apps, Power Automate flows]
    status: live
  - id: blockchain-and-web3
    name: Blockchain & Web3
    scope: "Understanding and building on blockchains: consensus, Ethereum and Bitcoin, smart contracts, wallets and defensive security."
    examples: [Solidity contracts, EVM, wallet key management, consensus]
  - id: it-governance-risk-compliance
    name: IT Governance, Risk & Compliance
    scope: "Governing, assessing and evidencing IT risk and control: ISMS, control frameworks, audit readiness and GRC tooling."
    examples: [ISO 27001 ISMS, NIST CSF and 800-53 mapping, SOC 2 readiness, IT risk assessment]
    status: live
  - id: robotics-software
    name: Robotics Software
    scope: "Writing the software stack of robots: ROS 2 nodes, navigation, manipulation, perception and simulation."
    examples: [ROS 2 nodes and launch, Nav2 navigation, MoveIt manipulation, Gazebo simulation]
    status: live
  - id: quantum-computing-software
    name: Quantum Computing Software
    scope: "Programming quantum circuits and algorithms with SDKs and running them on simulators and hardware."
    examples: [Qiskit circuits, Cirq and PennyLane, quantum algorithms, noise and error mitigation]
    status: live
  - id: collaboration-platform-administration
    name: Collaboration Platform Administration
    scope: "Administering Microsoft 365 and Google Workspace tenants: mail, collaboration, compliance and migration."
    examples: [Microsoft 365 admin, Exchange Online, Teams and SharePoint, Google Workspace admin]
    status: live
  - id: search-and-information-retrieval
    name: Search & Information Retrieval
    scope: "Building and operating search engines: indexing, analysis, relevance, query DSLs, clustering and search operations."
    examples: [Elasticsearch and OpenSearch, Lucene analysis, relevance tuning, cluster operations]
    status: live
  - id: messaging-and-integration
    name: Messaging & Integration Platforms
    scope: "Running message brokers and integration platforms: queues, exchanges, delivery guarantees, clustering and enterprise integration patterns."
    examples: [RabbitMQ, AMQP, dead-letter handling, integration patterns]
    status: live
  - id: email-administration
    name: Email Administration
    scope: "Operating mail systems: SMTP/IMAP servers, MX and sender authentication, spam filtering, queues and deliverability."
    examples: [Postfix, Dovecot, SPF DKIM DMARC, mail queue triage]
    status: live
