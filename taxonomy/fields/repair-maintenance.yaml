# Drawn from SOC/ISCO Major Group 7 mechanics and repairers (7231-7234 vehicle, 7421 electronics,
# 7312 instrument, 7318 textile repair) and Group 9 cleaning/elementary occupations (9111-9129),
# plus NAICS 811 (repair and maintenance) for the object-class breakdown.
category: repair-maintenance
fields:
  - id: automotive-repair
    name: Automotive Repair
    scope: "Diagnosing, repairing and maintaining cars and light vehicles, including modifying or upgrading them."
    examples: [engine and transmission repair, brake and suspension work, auto electrical diagnostics, car modding]
    status: live
  - id: motorcycle-small-engine-repair
    name: Motorcycle and Small Engine Repair
    scope: "Repairing and maintaining motorcycles and small engines such as those in outdoor power equipment."
    examples: [motorcycle servicing, scooter repair, lawnmower and chainsaw repair, small generator repair]
    status: live
  - id: heavy-equipment-industrial-machinery-repair
    name: Heavy Equipment and Industrial Machinery Repair
    scope: "Maintaining and repairing large mobile and fixed industrial and agricultural machinery."
    examples: [construction equipment repair, agricultural equipment repair, industrial plant machinery maintenance]
    status: live
  - id: aircraft-maintenance
    name: Aircraft Maintenance
    scope: "Inspecting, maintaining and repairing aircraft and their systems to airworthiness standards."
    examples: [airframe maintenance, engine overhaul, avionics repair, scheduled aircraft inspection]
    status: live
  - id: marine-vessel-repair
    name: Marine and Vessel Repair
    scope: "Maintaining and repairing boats and ships, their engines and onboard systems."
    examples: [outboard motor repair, hull repair, marine electrical systems, boatyard haul-out servicing]
    status: live
  - id: bicycle-repair
    name: Bicycle Repair
    scope: "Servicing, repairing and upgrading bicycles and their components."
    examples: [tune-ups, gear and brake adjustment, wheel truing, e-bike servicing]
    status: live
  - id: appliance-repair
    name: Appliance Repair
    scope: "Diagnosing and repairing household and commercial appliances."
    examples: [washing machine repair, refrigerator repair, oven and stove repair, small kitchen appliance repair]
    status: live
  - id: consumer-electronics-repair
    name: Consumer Electronics Repair
    scope: "Diagnosing and repairing phones, computers and other consumer electronic devices."
    examples: [smartphone screen and battery repair, laptop repair, game console repair, component-level board repair]
    status: live
  - id: watch-clock-repair
    name: Watch and Clock Repair
    scope: "Servicing and repairing mechanical and electronic timepieces."
    examples: [mechanical watch servicing, clock movement repair, battery and quartz repair, horological restoration]
    status: live
  - id: musical-instrument-repair
    name: Musical Instrument Repair
    scope: "Repairing, adjusting and restoring musical instruments to playable condition."
    examples: [piano tuning and repair, guitar setup and fret work, brass and woodwind repair, string instrument repair]
    status: live
  - id: furniture-restoration-upholstery
    name: Furniture Restoration and Upholstery Repair
    scope: "Repairing, refinishing and reupholstering existing furniture rather than building new pieces."
    examples: [furniture refinishing, re-upholstery, chair and joint repair, veneer and polish touch-up]
    status: live
  - id: antique-restoration
    name: Antique Restoration
    scope: "Repairing and restoring non-art antiques and collectible objects to working or displayable condition."
    examples: [clock and mechanism restoration, antique furniture repair, toy and mechanical collectible restoration]
    status: live
  - id: book-repair-rebinding
    name: Book Repair and Rebinding
    scope: "Repairing damaged books and rebinding worn volumes outside a heritage-conservation setting."
    examples: [spine and cover repair, rebinding, page and signature repair]
    status: live
  - id: clothing-alterations-repair
    name: Clothing Alterations and Repair
    scope: "Altering, mending and upgrading existing garments rather than making new ones."
    examples: [hemming and resizing, mending and patching, zipper replacement, garment upcycling]
    status: live
  - id: shoe-repair
    name: Shoe Repair
    scope: "Repairing and resoling existing footwear."
    examples: [resoling, heel replacement, stitching repair, shoe stretching]
    status: live
  - id: building-services-equipment-maintenance
    name: Building Services Equipment Maintenance
    scope: "Maintaining fixed mechanical and electrical equipment built into a building that is not utility plant."
    examples: [elevator and lift servicing, HVAC chiller maintenance, plumbing riser maintenance, fire-system servicing]
    status: live
  - id: facilities-maintenance
    name: Facilities Maintenance
    scope: "General upkeep and minor repair of a building and its fixtures as an ongoing facilities function."
    examples: [general handyman repairs, janitorial maintenance rounds, preventive maintenance scheduling, minor fixture repair]
    status: live
  - id: cleaning-services
    name: Cleaning Services
    scope: "Cleaning homes, offices and other spaces and surfaces."
    examples: [residential cleaning, commercial janitorial cleaning, carpet and upholstery cleaning, window cleaning]
    status: live
  - id: laundry-textile-care
    name: Laundry and Textile Care
    scope: "Washing, drying, ironing and otherwise caring for clothing and household textiles."
    examples: [laundering, dry cleaning, ironing and pressing, stain treatment]
    status: live
  - id: home-organizing-declutter-move-prep
    name: Home Organizing, Decluttering and Move Prep
    scope: "Organising, decluttering and packing a home's contents, including preparing for a move."
    examples: [closet and space organising, decluttering consultations, packing for relocation, estate clear-outs]
    status: live
  - id: pest-control
    name: Pest Control
    scope: "Identifying, treating and preventing pest infestations in buildings and their contents."
    examples: [rodent control, termite treatment, fumigation, integrated pest management]
    status: live
  - id: chimney-sweeping
    name: Chimney Sweeping
    scope: "Cleaning and inspecting chimneys and flues for safe operation."
    examples: [flue cleaning, chimney inspection, creosote removal, cap and liner checks]
    status: live
  - id: reliability-engineering-failure-analysis
    name: Reliability Engineering and Failure Analysis
    scope: "Analysing and designing out failure in existing equipment: reliability-centred maintenance, failure-mode analysis and corrective redesign short of a full rebuild."
    examples: [reliability-centred maintenance planning, root-cause failure investigation, failure-mode and effects analysis, corrective part redesign]
    status: live
