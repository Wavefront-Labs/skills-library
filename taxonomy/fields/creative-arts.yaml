# Drawn from named creative disciplines (SOC 27-1xxx/2xxx Arts/Entertainment, ISCO-08 unit
# groups 265x/343x) and how the existing production field (animation) names its own crafts.
category: creative-arts
fields:
  - id: animation
    name: Animation
    scope: "Moving-image storytelling: character and environment art, rigging, lighting, editing, sound, and the production pipeline that turns a script into finished shots."
    examples: [character design, rigging, compositing, voice direction, art direction]
    status: live
  - id: music
    name: Music
    scope: "Composing, arranging, performing, producing and recording music for an audience."
    examples: [composition, songwriting, instrumental performance, music production, arranging]
    status: live
  - id: visual-art
    name: Visual Art
    scope: "Making visual works intended to be exhibited or sold as art, across traditional and digital media."
    examples: [painting, drawing, sculpture, printmaking, digital illustration as fine art]
    status: live
  - id: theatre
    name: Theatre and Live Performance
    scope: "Staging and performing dramatic works for a live audience, including acting, directing and dramaturgy."
    examples: [acting, directing, dramaturgy, stage blocking, improv performance]
    status: live
  - id: literary-writing
    name: Literary Writing
    scope: "Composing creative written and oral works, including prose, poetry and scripted storytelling, as literary art."
    examples: [novel writing, poetry, screenwriting as literature, oral storytelling composition, literary editing for creative content]
    status: live
  - id: film-live-action
    name: Film and Live-Action Video Art
    scope: "Directing, shooting and editing live-action moving-image works made as the artwork, distinct from animation's drawn or modelled pipeline."
    examples: [directing, cinematography, live-action editing, sound design for film, screenwriting for production]
    status: live
  - id: photography-fine-art
    name: Fine-Art Photography
    scope: "Making photographic works whose purpose is to be exhibited or sold as art, tagged fine_art to distinguish from commercial or news photography."
    examples: [art photography series, fine-art printmaking, gallery photo exhibitions, conceptual photography, photographic portfolio curation]
    status: live
  - id: dance
    name: Dance (Staged and Performed)
    scope: "Choreographing and performing dance for an audience, as a staged or judged-for-art performance rather than social or fitness dance."
    examples: [choreography, concert dance performance, dance direction, ensemble staging, dance notation]
    status: live
  - id: fashion-modelling
    name: Fashion Modelling
    scope: "Modelling for fashion, editorial and commercial creative work as a performer in front of the camera or on the runway."
    examples: [runway walking, editorial posing, fitting sessions, lookbook shoots, movement for camera]
    status: live
  - id: design-for-form-and-experience
    name: Design for Form and User Experience
    scope: "Designing the aesthetics and experiential form of a work or interface where the deliverable is form itself, not an engineered function."
    examples: [concept design, aesthetic UX design, visual design systems, mood-boarding, experiential design]
    status: live
  - id: game-design
    name: Game Design and Game-Mastering
    scope: "Designing games and tabletop or live experiences, and running them as a game master or facilitator for players."
    examples: [tabletop game design, game-mastering, level design, narrative game design, live-action role-play facilitation]
    status: live
  - id: circus-arts
    name: Circus Arts
    scope: "Performing circus disciplines for an audience, including aerial, acrobatic and clowning performance."
    examples: [aerial silks, trapeze, acrobatics, clowning, juggling performance]
    status: live
  - id: magic-and-illusion
    name: Magic and Illusion
    scope: "Performing magic and illusion as a staged or close-up art form for an audience."
    examples: [sleight of hand, stage illusion design, close-up magic, mentalism performance, escapology]
    status: live
  - id: conservation-and-restoration
    name: Conservation and Restoration of Artworks
    scope: "Conserving and restoring movable artworks and heritage objects to preserve their creative or cultural content."
    examples: [painting conservation, textile art restoration, sculpture conservation, condition reporting, archival art handling]
    status: live
  - id: graphic-design
    name: Graphic and Visual Communication Design
    scope: "Designing visual communication as the deliverable: layout, typography, logos and illustration for print and screen."
    examples: [logo design, editorial layout, typography, poster design, infographic design]
    status: live
  - id: fashion-design
    name: Fashion and Apparel Design
    scope: "Designing garments, collections, footwear and accessories as creative form, distinct from the sewing and tailoring that makes them."
    examples: [collection design, garment sketching and draping, textile print design, footwear design, accessory design]
    status: live
  - id: comedy-and-variety-performance
    name: Comedy and Variety Performance
    scope: "Performing comedy and variety acts for a live or recorded audience, distinct from scripted theatre."
    examples: [stand-up comedy, sketch comedy, drag performance, cabaret, ventriloquism and MC hosting]
    status: live
  - id: comics-and-sequential-art
    name: Comics and Sequential Art
    scope: "Writing and drawing stories told in sequential images, from strips to graphic novels and manga."
    examples: [comic scripting, cartooning, manga, webcomics, graphic-novel inking and lettering]
    status: live
  - id: puppetry-and-object-theatre
    name: Puppetry and Object Theatre
    scope: "Performing with puppets, marionettes and animated objects for an audience; the making of the puppets is handcrafts."
    examples: [marionette performance, hand and rod puppetry, wayang kulit shadow play, bunraku, object theatre]
    status: live
