# Drawn from SOC/ISCO Major Group 7-8 (8121-8229 plant and machine operators, 8131/8211
# chemical and electronics process workers) and NAICS 31-33 (manufacturing) subsectors for
# the process-type breakdown.
category: manufacturing-production
fields:
  - id: production-line-operations
    name: Production Line Operations
    scope: "Setting up and tending a general production line or plant, running and monitoring the process at speed."
    examples: [assembly line tending, line changeovers, conveyor and batching systems operation, machine minding]
    status: live
  - id: industrial-automation-plc-programming
    name: Industrial Automation and PLC Programming
    scope: "Programming and configuring the automated control logic that runs a production line or process."
    examples: [PLC ladder logic programming, SCADA configuration, robotic cell programming, line automation commissioning]
    status: live
  - id: cnc-machining-production
    name: CNC Machining for Production
    scope: "Programming and running CNC and CAM toolpaths for repeat production runs, as distinct from one-off hand machining."
    examples: [CNC programming, toolpath optimisation, production milling and turning, multi-axis machining setup]
    status: live
  - id: assembly-line-hand-work
    name: Assembly Line Hand Work
    scope: "Hand work performed at a paced line station rather than on a whole object individually."
    examples: [hand assembly, hand-soldering on a line, hand-sorting and grading, kitting and packing stations]
    status: live
  - id: chemical-process-manufacturing
    name: Chemical Process Manufacturing
    scope: "Running chemical production processes at industrial scale, from batch reactors to continuous plant."
    examples: [batch chemical processing, continuous process operation, process plant monitoring, chemical blending]
    status: live
  - id: pharmaceutical-manufacturing
    name: Pharmaceutical Manufacturing
    scope: "Producing pharmaceutical products at industrial scale under good manufacturing practice."
    examples: [tablet and capsule production, sterile fill-finish, biologics production, GMP batch records]
    status: live
  - id: textile-manufacturing
    name: Textile Manufacturing
    scope: "Producing fabric, yarn and garments on industrial machinery at production scale."
    examples: [industrial weaving and knitting, garment line sewing, dyeing and finishing plant operation, nonwoven fabric production]
    status: live
  - id: printing-production
    name: Printing Production
    scope: "Operating industrial printing presses and finishing equipment for print production runs."
    examples: [offset and digital press operation, print finishing and binding, label and packaging printing]
    status: live
  - id: food-beverage-processing
    name: Food and Beverage Processing
    scope: "Processing raw food and drink ingredients into packaged products at industrial line scale."
    examples: [meat and dairy processing lines, canning and bottling, industrial baking, beverage filling lines]
    status: live
  - id: electronics-semiconductor-manufacturing
    name: Electronics and Semiconductor Manufacturing
    scope: "Producing electronic components and assemblies on industrial lines, from wafer fabrication to board assembly."
    examples: [semiconductor fab operations, PCB assembly lines, surface-mount technology production, device packaging and test]
    status: live
  - id: metal-plastics-fabrication-production
    name: Metal and Plastics Fabrication Production
    scope: "Forming metal and plastic parts at production scale through stamping, moulding or extrusion."
    examples: [metal stamping, injection moulding, extrusion lines, die casting production]
    status: live
  - id: packaging-operations
    name: Packaging Operations
    scope: "Running the packaging stage of a production line, from filling through to case packing."
    examples: [filling and sealing lines, case and palletising operations, label application, packaging line changeovers]
    status: live
  - id: production-quality-control
    name: Production Quality Control
    scope: "Inspecting and testing production output against the producer's own manufacturing specification."
    examples: [in-line quality inspection, statistical process control, sampling and batch release testing, defect tracking]
    status: live
  - id: production-planning
    name: Production Planning
    scope: "Scheduling and sequencing what a plant produces, when, and in what quantity to meet demand and capacity."
    examples: [master production scheduling, capacity planning, materials requirements planning, line balancing]
    status: live
