# Practice-shaped, not occupation-shaped: fields are named relationship and social-skill domains
# drawn from relationship-counselling and social-skills literature (family communication studies,
# conflict-resolution practice, etiquette traditions), not a formal occupational classification.
category: relationships-social
fields:
  - id: conversation-and-active-listening
    name: Conversation and Active Listening
    scope: "The everyday skill of talking with and listening to another person."
    examples: [small talk, active listening, turn-taking, open-ended questioning, reading social cues]
    status: live
  - id: empathy-and-emotional-support-between-peers
    name: Empathy and Emotional Support Between Peers
    scope: "Offering emotional understanding and support to another person as a peer, not as a caregiver or counsellor."
    examples: [validating feelings, perspective-taking, comforting a friend, holding space, checking in]
    status: live
  - id: friendship-and-social-bonding
    name: Friendship and Social Bonding
    scope: "Forming, deepening and maintaining friendships."
    examples: [making friends, maintaining long-distance friendships, group bonding, reciprocity in friendship, rebuilding a lapsed friendship]
    status: live
  - id: dating-and-courtship
    name: Dating and Courtship
    scope: "Pursuing and navigating a romantic prospect before a committed relationship forms."
    examples: [flirting, asking someone out, dating-app practice, first-date conduct, courtship customs]
    status: live
  - id: romantic-relationship-and-intimacy-skill
    name: Romantic Relationship and Intimacy Skill
    scope: "Sustaining an established romantic partnership and its emotional intimacy."
    examples: [couple communication, love languages, maintaining closeness, navigating commitment, long-term relationship repair]
    status: live
  - id: sexuality-and-intimate-communication
    name: Sexuality and Intimate Communication
    scope: "Communicating about sexual intimacy between partners."
    examples: [consent negotiation, expressing desire, discussing boundaries, intimacy-building communication, navigating mismatched desire]
    status: live
  - id: family-relationship-and-attachment
    name: Family Relationship and Attachment
    scope: "Maintaining bonds, attachment and communication within a family."
    examples: [sibling relationships, adult-child communication with parents, extended-family ties, attachment repair, family rituals and bonding]
    status: live
  - id: parenting-communication-and-discipline
    name: Parenting Communication and Discipline
    scope: "Attachment, communication and discipline between a parent or carer and a child, as family life rather than clinical treatment."
    examples: [setting boundaries, positive discipline, age-appropriate communication, co-parenting communication, bonding with a child]
    status: live
  - id: conflict-resolution-and-personal-negotiation
    name: Conflict Resolution and Personal Negotiation
    scope: "Resolving one's own interpersonal conflicts directly with the other party, without a third-party mediator."
    examples: [de-escalation, apologising and repair, assertive communication, compromise-seeking, resolving a disagreement with a friend or partner]
    status: live
  - id: grief-and-hardship-peer-support
    name: Grief and Hardship Peer Support
    scope: "Supporting a friend or family member through hardship, loss or grief as a peer."
    examples: [sitting with someone in grief, practical help during a crisis, knowing what to say and not say, sustained check-ins, community rallying around someone]
    status: live
  - id: group-leadership-and-teamwork
    name: Group Leadership and Teamwork
    scope: "Leading and working within informal social and peer groups."
    examples: [informal group leadership, team cohesion, delegating among peers, group decision-making, managing group dynamics]
    status: live
  - id: etiquette-manners-and-social-norms
    name: Etiquette, Manners and Social Norms
    scope: "Observing and navigating the customary rules of polite and acceptable social conduct."
    examples: [table manners, gift-giving etiquette, greetings and forms of address, dress codes, navigating cultural norms]
    status: live
  - id: matchmaking-and-introduction-practice
    name: Matchmaking and Introduction Practice
    scope: "Introducing people to one another for friendship, romance or social connection."
    examples: [informal matchmaking, setting up friends, networking introductions, arranged-introduction customs, social connecting]
    status: live
  - id: gift-exchange-and-reciprocity-practice
    name: Gift Exchange and Reciprocity Practice
    scope: "Giving, receiving and reciprocating gifts within social relationships."
    examples: [gift selection for relationships, reciprocity norms, holiday and occasion gifting, favour exchange, hospitality reciprocity]
    status: live
  - id: community-belonging-and-social-integration
    name: Community Belonging and Social Integration
    scope: "Building and maintaining a sense of belonging within a community or social circle."
    examples: [joining a new community, neighbourliness, social integration after moving, maintaining community ties, informal mutual support networks]
    status: live
