# Drawn from SOC 41-xxxx/13-1xxx (Sales and Related; Advertising/PR/Market Research), ISCO-08
# unit groups 2431/3339/5220s, and how sellers/marketers name their own specialties.
category: sales-marketing
fields:
  - id: retail-sales
    name: Retail Sales
    scope: "Selling and customer service on a retail sales floor or counter, including upselling, returns handling and point-of-sale operation."
    examples: [floor selling, upselling, product demos, till operation, loss-prevention-aware selling]
    status: live
  - id: real-estate-sales-leasing
    name: Real Estate Sales and Leasing
    scope: "Listing, showing and negotiating the sale or lease of residential and commercial property on behalf of a client."
    examples: [listing presentations, buyer representation, lease negotiation, open homes, offer and counter-offer management]
    status: live
  - id: insurance-sales
    name: Insurance Sales
    scope: "Selling and placing insurance policies, matching cover to client need and handling renewals and cross-sell."
    examples: [needs analysis, policy placement, renewal retention, cross-selling, broker relationship management]
    status: live
  - id: financial-products-sales
    name: Financial Products Sales
    scope: "Selling investment, banking, lending and wealth products to retail or institutional clients within suitability rules."
    examples: [mortgage sales, wealth product sales, cold-calling compliance, relationship banking, cross-sell of accounts]
    status: live
  - id: automotive-sales
    name: Automotive and Vehicle Sales
    scope: "Selling new and used vehicles, including trade-in valuation, finance and extras up-sell at point of sale."
    examples: [test-drive conversion, trade-in appraisal, finance and insurance up-sell, lot merchandising, closing techniques]
    status: live
  - id: technical-b2b-sales
    name: Technical and B2B Sales
    scope: "Selling complex technical products or enterprise services to business buyers, translating specifications into a commercial pitch."
    examples: [solution selling, RFP response, proof-of-concept demos, account-based selling, channel partner enablement]
    status: live
  - id: door-to-door-field-sales
    name: Door-to-Door and Field Sales
    scope: "Direct, unsolicited in-person or telephone selling to consumers or businesses outside a retail setting."
    examples: [cold doorstep pitching, canvassing routes, telemarketing scripts, objection handling, appointment setting]
    status: live
  - id: street-informal-trade
    name: Street and Informal Trade
    scope: "Selling and bartering goods in markets, stalls and street settings outside formal retail structures."
    examples: [market-stall pricing, haggling as a seller, stock sourcing for resale, pitch and display setup, mobile vending]
    status: live
  - id: sales-management
    name: Sales Management
    scope: "Leading and coaching a sales team, setting territory and quota structure, and running the sales pipeline process."
    examples: [pipeline forecasting, quota setting, territory design, CRM process design, sales coaching]
    status: live
  - id: negotiation-and-bartering
    name: Negotiation and Bartering (Commercial)
    scope: "Structuring and running a commercial negotiation to close a deal's price and terms, as a seller or broker."
    examples: [anchoring, concession trading, multi-party deal structuring, closing tactics, haggling as a seller]
    status: live
  - id: advertising-creative-and-media-buying
    name: Advertising Creative and Media Buying
    scope: "Planning and buying paid media placements and overseeing the creative brief for an ad campaign."
    examples: [media planning, programmatic buying, creative briefing, campaign budgeting, ad performance reporting]
    status: live
  - id: branding
    name: Branding
    scope: "Defining a brand's identity, positioning and voice across products and touchpoints."
    examples: [brand positioning, naming, visual identity briefs, brand guidelines, brand architecture]
    status: live
  - id: sponsorship-and-brand-deals
    name: Sponsorship and Brand Deals
    scope: "Negotiating and activating paid sponsorship or brand-partnership deals from the sponsor's or property's commercial side."
    examples: [rights-fee negotiation, activation planning, influencer brand deals, naming-rights packages, sponsorship ROI reporting]
    status: live
  - id: digital-marketing
    name: Digital Marketing
    scope: "Growing audience and sales for anything sold through owned, earned and paid digital channels."
    examples: [SEO, paid social campaigns, email marketing, conversion-rate optimisation, marketing analytics]
    status: live
  - id: social-media-management-commercial
    name: Social Media Management (Commercial)
    scope: "Running branded social accounts and creator/influencer relationships for a business whose goal is sales or brand growth."
    examples: [content calendars, community engagement, influencer outreach, platform algorithm strategy, social commerce]
    status: live
  - id: retail-merchandising
    name: Retail Merchandising
    scope: "Deciding what to stock and how to present it on shelf or online to drive sell-through."
    examples: [visual merchandising, planogramming, assortment planning, markdown strategy, window displays]
    status: live
  - id: merchandise-buying
    name: Merchandise and Category Buying
    scope: "Selecting and committing to stock for resale based on trend, margin and category performance."
    examples: [trend forecasting for buying, open-to-buy budgeting, vendor negotiation, assortment planning, markdown decisions]
    status: live
  - id: customer-service-and-support
    name: Customer Service and Support
    scope: "Front-line handling of customer enquiries, complaints and service recovery across any sales channel."
    examples: [complaint de-escalation, returns and refunds, live chat support, service-recovery scripting, CSAT management]
    status: live
  - id: travel-agency-sales
    name: Travel and Tourism Sales
    scope: "Selling travel packages, accommodation and itineraries to consumers, distinct from designing the itinerary content itself."
    examples: [package upselling, commission-based booking, travel insurance add-ons, loyalty program enrolment, group booking sales]
    status: live
  - id: subscription-box-curation
    name: Subscription and Curated-Retail Commercial Curation
    scope: "Choosing what to feature for subscribers or customers in a book club, subscription box or curated-retail commercial program."
    examples: [subscriber box curation, curated-drop selection, member retention offers, curation-driven upsell, seasonal theme planning]
    status: live
  - id: trade-show-and-event-sales
    name: Trade Show and Event Sales
    scope: "Selling and lead-generating at trade shows, conferences and live commercial events."
    examples: [booth staffing, lead capture and scoring, live demo pitching, follow-up cadence, event ROI tracking]
    status: live
  - id: pricing-and-promotions-execution
    name: Pricing and Promotions Execution
    scope: "Running the live customer-facing side of pricing, discounting and promotional offers at point of sale."
    examples: [discount application, loyalty-tier offers, bundling at checkout, promo-code handling, live price negotiation]
    status: live
  - id: talent-representation-brokering
    name: Talent Representation and Agency
    scope: "Representing people and placing them for a fee: pitching, deal-making and career brokering on commission."
    examples: [literary agents, sports agents, talent and booking agents, fee-based headhunting, model agency booking]
    status: live
  - id: auctioneering
    name: Auctioneering
    scope: "Selling by competitive bidding: lot cataloguing, bid calling and auction-house operations."
    examples: [live bid calling, estate and livestock auctions, art-house auctions, online auction management, reserve setting]
    status: live
  - id: market-research-consumer-insights
    name: Market Research and Consumer Insights
    scope: "Researching markets, customers and demand to inform commercial selling and marketing decisions."
    examples: [consumer surveys, commercial focus groups, segmentation studies, brand-tracking research, pricing research]
    status: live
