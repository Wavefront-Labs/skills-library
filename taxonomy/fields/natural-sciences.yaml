# Drawn from: named branches of science as organised by national science foundations and
# university departments (physics, chemistry, biology, earth/atmospheric science, astronomy,
# ecology/environmental science), ISCED-F 2013 broad field "05 Natural sciences, mathematics
# and statistics" subfields, and standard amateur-naturalist hobby names.
category: natural-sciences
fields:
  - id: physics
    name: Physics
    scope: "Research into the fundamental laws of matter, energy, motion and forces, from subatomic to cosmological scale."
    examples: [particle physics, condensed-matter physics, optics, nuclear physics, biophysics]
    status: live
  - id: chemistry
    name: Chemistry
    scope: "Research into the composition, structure, properties and reactions of matter."
    examples: [organic chemistry, inorganic chemistry, physical chemistry, analytical chemistry, biochemistry research]
    status: live
  - id: biology
    name: Biology
    scope: "Research into living organisms, their structure, function, evolution and interaction, from molecules to ecosystems."
    examples: [molecular biology, genetics, microbiology, zoology, botany]
    status: live
  - id: earth-sciences
    name: Earth Sciences (Geology & Geophysics)
    scope: "Research into the structure, composition, history and processes of the solid Earth."
    examples: [geology, seismology, volcanology, mineralogy, paleontology]
    status: live
  - id: atmospheric-sciences
    name: Atmospheric Sciences
    scope: "Research into the composition, dynamics and behaviour of the atmosphere, including weather and climate processes."
    examples: [meteorology research, climatology, atmospheric chemistry, climate modelling]
    status: live
  - id: oceanography
    name: Oceanography
    scope: "Research into the physical, chemical, biological and geological processes of the ocean."
    examples: [physical oceanography, marine chemistry, marine geology, biological oceanography]
    status: live
  - id: astronomy-astrophysics
    name: Astronomy & Astrophysics
    scope: "Research into celestial objects, the universe's structure, and the physics governing them."
    examples: [observational astronomy, astrophysics, planetary science research, cosmology, radio astronomy]
    status: live
  - id: ecology
    name: Ecology
    scope: "Research into the relationships between organisms and their environment, and the structure and dynamics of ecosystems."
    examples: [population ecology, community ecology, ecosystem ecology, conservation biology research, landscape ecology]
    status: live
  - id: environmental-science
    name: Environmental Science
    scope: "Interdisciplinary research into environmental systems, pollution, and human impact on natural systems."
    examples: [environmental chemistry, pollution science, environmental toxicology, biogeochemistry, remote-sensing environmental research]
    status: live
  - id: laboratory-field-methods
    name: Laboratory & Field Methods
    scope: "Cross-disciplinary scientific technique: experimental design, instrumentation, sampling and measurement used to produce new knowledge across the natural sciences."
    examples: [analytical instrumentation, field sampling design, microscopy technique, spectroscopy, specimen collection and curation]
    status: live
  - id: amateur-astronomy
    name: Amateur Astronomy
    scope: "Observing and identifying celestial objects and events as a hobby, without producing original research."
    examples: [telescope observing, astrophotography, meteor watching, variable-star monitoring]
    status: live
  - id: birding
    name: Birding (Bird Identification)
    scope: "Identifying and observing wild birds as a hobby."
    examples: [field identification, birdsong recognition, listing and twitching, bird photography for ID]
    status: live
  - id: botanical-fungal-identification
    name: Plant & Fungus Identification
    scope: "Identifying wild plants and fungi as a hobby, including edibility and species knowledge for its own sake."
    examples: [wildflower identification, mushroom identification, lichen spotting, tree identification]
    status: live
  - id: rockhounding
    name: Rockhounding & Mineral Collecting
    scope: "Identifying, finding and collecting rocks, minerals and fossils as a hobby."
    examples: [mineral identification, fossil hunting, gem hunting, field geology as a hobby]
    status: live
  - id: applied-industrial-rd
    name: Applied Industrial R&D
    scope: "Using scientific method to develop a genuinely new formulation or product for industry, up to the point it is handed to production or an unrelated maker."
    examples: [flavour and fragrance chemistry, new material formulation, new drug candidate research, food-science formulation research]
    status: live
  - id: neuroscience
    name: Neuroscience
    scope: "Research into the structure and function of the nervous system, from molecules to behaviour."
    examples: [cellular neuroscience, systems neuroscience, cognitive neuroscience, computational neuroscience]
    status: live
  - id: agricultural-science
    name: Agricultural Science
    scope: "Research producing new knowledge about crops, livestock and farming systems."
    examples: [agronomy research, animal science, plant breeding research, soil science research]
    status: live
