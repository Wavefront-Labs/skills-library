# Sources: linguistics subfields as named in academic departments, ISO 639/ISCED-F language
# fields, SOC/ISCO translator-interpreter occupation groups (SOC 27-3091, ISCO 2643), and how
# practising translators/interpreters name their own specialisms (medical, legal, conference,
# community, conflict-zone, sign-language).
category: languages-linguistics
fields:
  - id: language-learning
    name: Language learning and acquisition
    scope: "Learning and using a specific spoken, written or signed language as a practical skill: vocabulary, grammar, pronunciation and fluency building."
    examples: [second-language acquisition, pronunciation coaching, vocabulary building, immersion practice, heritage-language maintenance]
    status: live
  - id: sign-language
    name: Sign language
    scope: "Using, learning and studying signed languages as full natural languages, including fingerspelling and regional sign varieties."
    examples: [ASL, BSL, fingerspelling, sign language linguistics, Deaf community communication norms]
    status: live
  - id: whistled-and-drummed-languages
    name: Whistled and drummed languages
    scope: "Non-vocal spoken-language surrogates that encode a language's phonology or tone in whistles, drum patterns or other non-speech sound."
    examples: [Silbo Gomero, talking drums, whistled Turkish, surrogate-speech systems, long-distance call-and-response signalling]
    status: live
  - id: translation
    name: Translation
    scope: "Converting written text from one language to another while preserving meaning, register and intent."
    examples: [literary translation, technical translation, legal document translation, medical translation, localisation]
    status: live
  - id: interpreting
    name: Interpreting
    scope: "Converting spoken or signed language in real time between parties, across the settings interpreters actually specialise in."
    examples: [conference interpreting, medical interpreting, legal/court interpreting, community interpreting, conflict-zone interpreting]
    status: live
  - id: linguistics
    name: Linguistics
    scope: "Scientific study of language structure, meaning, use and change, producing descriptive and theoretical knowledge about language."
    examples: [phonetics and phonology, syntax, semantics and pragmatics, sociolinguistics, historical and comparative linguistics]
    status: live
  - id: lexicography
    name: Lexicography
    scope: "Compiling, defining and documenting the vocabulary of a language in dictionaries and reference works."
    examples: [dictionary compilation, terminology management, etymology research, glossary building, corpus-based definition writing]
    status: live
  - id: writing-systems-and-scripts
    name: Writing systems and scripts
    scope: "Reading, writing and analysing the scripts and non-script recording systems a language or tradition uses to represent itself."
    examples: [script literacy (e.g. Cyrillic, Devanagari, Hanzi), calligraphic script forms as writing systems, quipu and other non-script record-keeping, undeciphered-script analysis, orthography design]
    status: live
  - id: braille-and-tactile-literacy
    name: Braille and tactile literacy
    scope: "Reading and writing tactile systems that represent a language for people who are blind or low vision."
    examples: [braille reading, braille transcription, braille music notation, tactile literacy instruction materials, refreshable-braille use]
    status: live
  - id: signalling-and-coded-communication
    name: Signalling and coded communication
    scope: "Encoding and decoding language in non-verbal signal systems used for communication at a distance or under constraint."
    examples: [Morse code, maritime semaphore and flag signals, smoke and light signalling, drum/horn relay codes, tap codes]
    status: live
  - id: literacy-and-reading
    name: Literacy and reading
    scope: "The practical skill of reading and comprehending written language, independent of a school curriculum's pedagogy."
    examples: [adult literacy, reading fluency, speed reading, functional literacy for daily life, multilingual literacy]
    status: live
  - id: everyday-composition
    name: Everyday composition and writing
    scope: "General-purpose written communication for ordinary life and work: letters, essays, explanations and plain prose, not journalism or creative writing."
    examples: [letter writing, essay writing, explanatory writing, correspondence, personal statements]
    status: live
  - id: transcription-and-captioning
    name: Transcription and Captioning
    scope: "Producing verbatim transcripts, captions and subtitles from speech, for media, courts, accessibility and records — the technique tier; certifying a transcript as an official court record is law-government."
    examples: [closed captioning, subtitling timing, verbatim transcription, real-time captioning (CART), speaker labelling]
    status: live
