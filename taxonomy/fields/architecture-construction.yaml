# Drawn from SOC/ISCO Major Group 7 building trades (7111-7129 ISCO), Group 2 architecture
# and planning professionals (2161-2165, 3112-3118 technicians), and NAICS 236-238
# (construction) for the trade and planning breakdown.
category: architecture-construction
fields:
  - id: architecture
    name: Architecture
    scope: "Designing buildings and dwellings of every tradition, from concept through construction documentation."
    examples: [residential architecture, commercial architecture, vernacular and traditional dwelling design, heritage-sensitive design]
    status: live
  - id: landscape-architecture
    name: Landscape Architecture
    scope: "Designing outdoor and public spaces, including planting, grading and hardscape, at site to regional scale."
    examples: [park and public-realm design, site landscape design, green infrastructure design]
    status: live
  - id: urban-regional-planning
    name: Urban and Regional Planning
    scope: "Planning land use, zoning and development at city, regional and climate-adaptation scale."
    examples: [zoning and land-use planning, master planning, climate adaptation planning, transport-land use integration]
    status: live
  - id: surveying-geomatics
    name: Surveying and Geomatics
    scope: "Measuring and recording land, boundaries and built features on the ground to produce authoritative spatial data."
    examples: [land surveying, boundary and cadastral surveying, construction setting-out, laser scanning and LiDAR survey]
    status: live
  - id: cartography-geospatial-mapping
    name: Cartography and Geospatial Mapping
    scope: "Compiling and producing maps and geospatial datasets from survey and remote-sensing sources."
    examples: [GIS mapping, topographic mapping, aerial and satellite map compilation, cadastral mapping]
    status: live
  - id: civil-construction
    name: Civil Construction
    scope: "Building and maintaining roads, bridges, earthworks and new utility networks as heavy civil works."
    examples: [road construction, bridge building, earthworks, trenching for new utility lines]
    status: live
  - id: structural-trades
    name: Structural Trades
    scope: "Erecting and joining a building's load-bearing structure in timber, steel or concrete."
    examples: [framing, structural steel erection, structural welding, concrete formwork and pouring]
    status: live
  - id: masonry-bricklaying
    name: Masonry and Bricklaying
    scope: "Laying brick, block and stone to build walls and other structural or facing work on site."
    examples: [bricklaying, blockwork, stonemasonry on buildings, chimney and fireplace construction]
    status: live
  - id: plastering-drywall
    name: Plastering and Drywall
    scope: "Finishing interior and exterior wall and ceiling surfaces with plaster, render or drywall systems."
    examples: [solid plastering, drywall/gypsum board installation and taping, rendering, decorative plaster mouldings]
    status: live
  - id: roofing
    name: Roofing
    scope: "Installing and repairing roof structures and coverings on buildings."
    examples: [shingle and tile roofing, thatching, metal roofing, flat and membrane roofing]
    status: live
  - id: building-carpentry-joinery
    name: Building Carpentry and Joinery
    scope: "Fitting timber structural and finish work into a building on site, as distinct from freestanding furniture making."
    examples: [rough and finish carpentry, door and window fitting, staircase installation, site joinery]
    status: live
  - id: electrical-installation
    name: Electrical Installation
    scope: "Installing and wiring a building's fixed electrical systems as a construction trade."
    examples: [residential and commercial wiring, panel and circuit installation, fixture and fit-out wiring]
    status: live
  - id: plumbing-building-services
    name: Plumbing and Building Services Installation
    scope: "Installing a building's fixed plumbing, heating, ventilation and mechanical services during construction."
    examples: [plumbing rough-in and fit-out, HVAC ductwork installation, gas fitting, sprinkler system installation]
    status: live
  - id: painting-decorating
    name: Painting and Decorating
    scope: "Applying paint, wallpaper and decorative finishes to buildings during construction, renovation or extension."
    examples: [interior painting, exterior painting, wallpapering, decorative and specialist finishes]
    status: live
  - id: glazing
    name: Glazing
    scope: "Fitting glass and glazed units into buildings, including curtain walling and window systems."
    examples: [window glazing, curtain wall installation, shopfront glazing, stained glass installation in a structure]
    status: live
  - id: demolition
    name: Demolition
    scope: "Dismantling or razing structures, in whole or in part, safely and in sequence."
    examples: [controlled demolition, selective strip-out, salvage demolition, implosion planning]
    status: live
  - id: construction-equipment-operation
    name: Construction Equipment Operation
    scope: "Operating heavy machinery used on a construction or civil site."
    examples: [excavator operation, crane operation, bulldozer and grader operation, pile driving rig operation]
    status: live
  - id: construction-estimating-scheduling
    name: Construction Estimating and Scheduling
    scope: "Costing, quantifying and sequencing construction work: quantity takeoff, unit pricing and CPM scheduling logic."
    examples: [quantity takeoff, bid estimating, CPM scheduling, unit-price cost databases]
    status: live
  - id: site-supervision-trade-coordination
    name: Site Supervision and Trade Coordination
    scope: "Coordinating trades on site and signing off on-site work quality and sequencing."
    examples: [site foreman work, trade sequencing, on-site quality sign-off, clerk of works inspection]
    status: live
  - id: vernacular-traditional-building
    name: Vernacular and Traditional Building
    scope: "Building shelters and dwellings using traditional, indigenous or non-industrial methods and materials."
    examples: [earth and adobe building, thatched vernacular construction, timber-frame traditional building, nomadic shelter building]
    status: live
  - id: interior-design
    name: Interior Design
    scope: "Designing a building's interior spaces, finishes, furnishings and lighting as a professional discipline distinct from the architecture of the structure."
    examples: [residential interior design, commercial fit-out design, space planning, lighting design, finishes specification]
    status: live
  - id: flooring-tiling-insulation
    name: Flooring, Tiling and Finishing Trades
    scope: "Installing floor coverings, wall and floor tile, terrazzo and insulation in buildings."
    examples: [ceramic tiling, carpet laying, hardwood flooring, terrazzo work, insulation installation]
    status: live
