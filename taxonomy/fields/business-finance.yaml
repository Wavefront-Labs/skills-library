# Sources: SOC/ISCO management, finance and business occupation groups (SOC 11-xxxx
# management, 13-xxxx business/financial operations, ISCO 1 managers, 24 business/admin
# professionals), and how practitioners name their own specialisms (FP&A, M&E, trade
# compliance HR vs. legal).
category: business-finance
fields:
  - id: general-management
    name: General management and administration
    scope: "Running an organisation's day-to-day operations: planning, staffing, provisioning and administration across any sector."
    examples: [operations management, office administration, general manager duties, administrative coordination, organisational planning]
    status: live
  - id: strategy-and-foresight
    name: Strategy and foresight
    scope: "Setting an organisation's long-term direction and anticipating the environment it will operate in."
    examples: [corporate strategy, competitive analysis, scenario planning for a business, management consulting, strategic foresight]
    status: live
  - id: entrepreneurship
    name: Entrepreneurship
    scope: "Founding, launching and growing a new venture."
    examples: [startup founding, business model design, venture fundraising pitching, bootstrapping, small-business ownership]
    status: live
  - id: accounting
    name: Accounting
    scope: "Recording, classifying and reporting an organisation's financial and carbon transactions."
    examples: [financial accounting, management accounting, bookkeeping, carbon accounting, tax accounting]
    status: live
  - id: auditing
    name: Auditing
    scope: "Independently examining an organisation's financial records and internal controls for accuracy and compliance."
    examples: [internal audit, financial statement audit, internal controls testing, forensic accounting, compliance audit]
    status: live
  - id: corporate-finance
    name: Corporate finance
    scope: "Managing an organisation's capital structure, funding and financial decision-making."
    examples: [financial planning and analysis, capital budgeting, treasury management, mergers and acquisitions finance, investor relations]
    status: live
  - id: banking
    name: Banking
    scope: "Deposit-taking, lending and payment services provided by banks and informal financial institutions."
    examples: [retail banking, commercial lending, investment banking, credit analysis, informal savings and lending (ROSCAs, microfinance)]
    status: live
  - id: investing-and-trading
    name: Investing and trading
    scope: "Allocating capital and executing trades across asset classes."
    examples: [portfolio management, securities trading, wealth management, venture capital investing, personal investing]
    status: live
  - id: insurance
    name: Insurance
    scope: "Underwriting, pricing and administering insurance coverage and claims against the insurer's own risk."
    examples: [underwriting, claims adjusting, insurance product design, reinsurance, insurer special-investigation units]
    status: live
  - id: real-estate-finance
    name: Real estate finance
    scope: "Underwriting, financing and managing a portfolio of real-estate assets, not client-facing sales or leasing."
    examples: [real estate acquisition underwriting, property portfolio finance, real estate investment trusts, commercial mortgage underwriting, development finance]
    status: live
  - id: human-resources
    name: Human resources
    scope: "Managing an organisation's workforce: hiring, compensation, labour relations and workplace policy."
    examples: [recruiting and staffing, compensation and benefits design, labour and industrial relations, HR policy, workforce planning]
    status: live
  - id: procurement-and-supply-management
    name: Procurement and supply management
    scope: "Buying goods and services for an organisation's own use."
    examples: [vendor sourcing, contract negotiation for purchasing, supplier management, procurement strategy, strategic sourcing]
    status: live
  - id: project-and-program-management
    name: Project and program management
    scope: "Planning, scheduling and delivering projects and programs across any sector, as a cross-cutting discipline."
    examples: [project scheduling, program management, agile/scrum facilitation, portfolio management, PMO governance]
    status: live
  - id: risk-management
    name: Risk management
    scope: "Identifying, assessing and mitigating an organisation's operational, financial and strategic risks."
    examples: [enterprise risk management, business continuity planning, financial risk modelling, compliance risk assessment, credit risk management]
    status: live
  - id: compliance
    name: Compliance
    scope: "A regulated entity's own monitoring, policy-setting and staff training to meet regulatory requirements."
    examples: [regulatory compliance monitoring, anti-money-laundering programs, compliance training, policy implementation, internal compliance investigations]
    status: live
  - id: research-administration
    name: Research administration
    scope: "Administering the funding, compliance and operations of a research program, as distinct from the research itself."
    examples: [grant administration, research contracting, sponsored-programs management, lab operations management, research budget management]
    status: live
  - id: personal-and-household-finance
    name: Personal and household finance
    scope: "Running a household or personal life as an economic unit: budgeting, saving, inheritance and consumer buying decisions."
    examples: [household budgeting, personal financial planning, consumer purchasing and haggling, inheritance and estate allocation, personal debt management]
    status: live
  - id: career-management
    name: Job seeking and career management
    scope: "Finding, applying for and advancing in employment."
    examples: [resume and CV writing, job search strategy, salary negotiation preparation, career planning, networking for employment]
    status: live
  - id: personal-travel-planning
    name: Personal trip and travel planning
    scope: "Planning one's own trips and travel logistics for personal use."
    examples: [itinerary planning, travel budgeting, booking logistics, personal travel research, trip risk assessment]
    status: live
  - id: product-management
    name: Product management
    scope: "Coordinating a product's requirements and roadmap, not its technical specification or engineering."
    examples: [product roadmapping, requirements gathering, stakeholder prioritisation, go-to-market coordination, product-market fit analysis]
    status: live
  - id: fundraising-and-donor-development
    name: Fundraising and donor development
    scope: "Raising and stewarding funds, grants and sponsorships for an organisation's programs."
    examples: [donor cultivation, grant writing for programs, sponsorship solicitation, capital campaigns, major-gift fundraising]
    status: live
  - id: humanitarian-program-management
    name: Humanitarian and development program management
    scope: "Managing the project cycle of humanitarian and development programs: needs assessment, monitoring and evaluation, and cluster coordination."
    examples: [needs assessment, monitoring and evaluation (M&E), cluster coordination, logframe design, program budgeting for aid projects]
    status: live
  - id: grant-making-philanthropy
    name: Grant-Making and Philanthropy Programme Management
    scope: "The giving side of philanthropy: designing grant programmes, reviewing applications, awarding and monitoring grants."
    examples: [foundation programme officer work, grant review and award, grantee impact measurement, endowment payout strategy]
    status: live
  - id: property-management
    name: Property Management
    scope: "Managing tenanted real estate for owners: lettings administration, rent and service charges, tenant relations and coordinating upkeep."
    examples: [residential property management, commercial asset management, HOA and strata management, lease administration]
    status: live
  - id: valuation-and-appraisal
    name: Valuation and Appraisal
    scope: "Estimating the market value of property, businesses and goods as a professional opinion of value."
    examples: [real-estate appraisal, business valuation, antiques and personal-property appraisal, jewellery and gem appraisal, probate and insurance valuation]
    status: live
