# Sources: legal practice areas as bar associations and practitioners name them, SOC/ISCO
# legal and government occupation groups (SOC 23-xxxx legal, 13-1041 compliance officers,
# ISCO 261 legal professionals, 111 legislators/senior officials), and named public-sector
# functions (electoral administration, diplomacy, ADR).
category: law-government
fields:
  - id: criminal-law
    name: Criminal law
    scope: "Prosecuting and defending criminal charges, from charging decisions through trial and sentencing advocacy."
    examples: [criminal prosecution, criminal defence, plea negotiation, sentencing advocacy, appellate criminal practice]
    status: live
  - id: civil-litigation
    name: Civil litigation
    scope: "Bringing and defending non-criminal court claims between parties, including pre-trial procedure and trial advocacy."
    examples: [pleadings and motions practice, discovery, trial advocacy, appellate practice, class action litigation]
    status: live
  - id: corporate-and-commercial-law
    name: Corporate and commercial law
    scope: "Legal work on business formation, contracts, mergers, securities and commercial transactions."
    examples: [contract drafting, M&A due diligence, securities compliance, corporate governance advice, commercial contract negotiation]
    status: live
  - id: family-law
    name: Family law
    scope: "Legal practice on marriage, divorce, child custody, support and domestic relations."
    examples: [divorce proceedings, child custody disputes, child support calculation, adoption law, domestic violence protective orders]
    status: live
  - id: immigration-law
    name: Immigration law
    scope: "Legal practice on entry, visas, asylum, residency and citizenship status."
    examples: [visa petitions, asylum claims, deportation defence, citizenship applications, employment-based immigration]
    status: live
  - id: intellectual-property-law
    name: Intellectual property law
    scope: "Legal practice drafting, filing, licensing and enforcing patents, trademarks, copyrights and trade secrets."
    examples: [patent prosecution, trademark registration, copyright licensing, IP infringement litigation, trade-secret enforcement]
    status: live
  - id: tax-law
    name: Tax law
    scope: "Legal practice on tax liability, structuring, compliance and disputes with tax authorities."
    examples: [tax controversy, corporate tax structuring, estate tax planning, international tax law, tax appeals]
    status: live
  - id: employment-and-labor-law
    name: Employment and labor law
    scope: "Legal practice on the employment relationship, workplace disputes and collective bargaining's legal framework."
    examples: [wrongful termination claims, discrimination litigation, union representation law, workplace safety litigation, employment contract review]
    status: live
  - id: real-estate-and-property-law
    name: Real estate and property law
    scope: "Legal practice on ownership, transfer, financing and disputes over land and property."
    examples: [property conveyancing, title examination, landlord-tenant disputes, zoning and land-use law, eminent domain cases]
    status: live
  - id: environmental-law
    name: Environmental law
    scope: "Legal practice on environmental regulation, permitting and liability."
    examples: [environmental permitting, pollution liability litigation, climate litigation, conservation law, environmental compliance counsel]
    status: live
  - id: constitutional-and-administrative-law
    name: Constitutional and administrative law
    scope: "Legal practice on government power, constitutional rights and challenges to agency action."
    examples: [judicial review, administrative appeals, civil rights litigation, constitutional challenges, agency rulemaking challenges]
    status: live
  - id: international-and-human-rights-law
    name: International and human rights law
    scope: "Legal practice across borders and before international or human-rights bodies."
    examples: [international arbitration, treaty interpretation, human rights advocacy, war crimes tribunals, cross-border trade law]
    status: live
  - id: bankruptcy-and-insolvency-law
    name: Bankruptcy and insolvency law
    scope: "Legal practice on debt restructuring, insolvency proceedings and creditor claims."
    examples: [personal bankruptcy filings, corporate restructuring, creditor representation, insolvency administration, debt workout negotiation]
    status: live
  - id: wills-trusts-and-estates
    name: Wills, trusts and estates
    scope: "Drafting and interpreting wills, trusts and customary inheritance settlements, and administering estates."
    examples: [will drafting, trust drafting, probate administration, estate settlement, customary inheritance mediation]
    status: live
  - id: religious-and-customary-law
    name: Religious and customary law
    scope: "Legal practice and adjudication under a religious or customary legal system."
    examples: [canon law, Sharia law practice, Halakha, customary land tribunals, indigenous customary law]
    status: live
  - id: judiciary-and-courts-administration
    name: Judiciary and courts administration
    scope: "Deciding cases from the bench and administering courts and religious courts as institutions."
    examples: [judging, magistracy, court clerking, case management administration, judicial ethics]
    status: live
  - id: mediation-arbitration-and-adr
    name: Mediation, arbitration and ADR
    scope: "Resolving disputes between parties as a neutral third party outside litigation, including customary adjudication."
    examples: [commercial mediation, labour arbitration, family mediation, customary dispute resolution, online dispute resolution]
    status: live
  - id: public-administration-and-civil-service
    name: Public administration and civil service
    scope: "Delivering statutory public functions: licensing, benefits administration, census, tax assessment and election administration, and helping people apply to the state for them."
    examples: [benefits administration, electoral administration, census operations, licensing and permitting, tax assessment]
    status: live
  - id: policy-making-and-analysis
    name: Policy-making and analysis
    scope: "Developing, analysing and advising on government policy options."
    examples: [policy analysis, legislative drafting, regulatory impact assessment, think-tank policy research, public-sector program design]
    status: live
  - id: politics-and-campaigns
    name: Politics and campaigns
    scope: "Seeking and exercising elected office and running political campaigns."
    examples: [campaign management, political fundraising compliance, legislative work, political strategy, voter outreach]
    status: live
  - id: diplomacy
    name: Diplomacy
    scope: "Representing a state or organisation in formal relations with other states and international bodies."
    examples: [treaty negotiation, consular affairs, foreign service administration, multilateral diplomacy, protocol and accreditation]
    status: live
  - id: regulatory-inspection-and-certification
    name: Regulatory inspection and certification
    scope: "Checking conformance to a standard and issuing licences or certificates on behalf of a regulator or recognised certification body, across sectors."
    examples: [health and safety inspection, environmental compliance auditing, building code inspection, accreditation review, carbon-offset verification]
    status: live
  - id: civic-participation-and-organising
    name: Civic participation and organising
    scope: "Organising and participating in civic and political life outside formal office, including building power for a cause."
    examples: [community organising, advocacy coalitions, petition campaigns, voter registration drives, civic education]
    status: live
  - id: platform-and-community-governance
    name: Platform and community governance
    scope: "Making and applying the rules that govern an online platform or community as a quasi-governmental function."
    examples: [platform policy-making, content moderation policy, community governance charters, digital rights adjudication, trust-and-safety rulemaking]
    status: live
  - id: occupational-health-and-safety-practice
    name: Occupational Health and Safety Practice
    scope: "Assessing workplace hazards and designing and running safety programmes, the practitioner side of OHS distinct from regulator-side inspection."
    examples: [hazard and risk assessment, industrial hygiene monitoring, safety programme design, incident investigation, ergonomics assessment]
    status: live
  - id: lobbying-government-affairs
    name: Lobbying and Government Affairs
    scope: "Influencing legislation and regulation on behalf of a client or organisation as paid representation."
    examples: [legislative lobbying, regulatory affairs advocacy, lobbying-disclosure compliance, coalition lobbying, government-relations strategy]
    status: live
