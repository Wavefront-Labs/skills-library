# Drawn from: SOC/ISCO transportation and logistics detail groups (drivers, pilots, mariners,
# rail, dispatch, logistics/supply-chain occupations), named transport-mode disciplines, and
# wayfinding/navigation traditions.
category: transportation-logistics
fields:
  - id: road-driving
    name: Road Driving
    scope: "Operating road vehicles to move people or goods with a destination, from personal driving to commercial trucking and transit."
    examples: [truck driving, bus and coach driving, taxi and rideshare driving, defensive driving, heavy-haul driving]
    status: live
  - id: motorcycling-transport
    name: Motorcycling (Transport Riding)
    scope: "Riding a motorcycle or moped to move oneself or goods with a destination."
    examples: [commuting riding, courier riding, delivery riding, touring riding]
    status: live
  - id: cycling-transport
    name: Cycling (Transport Riding)
    scope: "Riding a bicycle to move oneself or goods with a destination, as distinct from recreational or sport cycling."
    examples: [bike courier work, commuter cycling, cargo-bike delivery, bikeshare operation]
    status: live
  - id: rail-operations
    name: Rail Operations
    scope: "Driving and dispatching trains and trams, and controlling rail traffic."
    examples: [train driving, tram driving, rail dispatching, train conducting]
    status: live
  - id: railway-signalling
    name: Railway Signalling
    scope: "Controlling rail traffic movement through signalling and interlocking systems."
    examples: [signal box operation, interlocking control, train control centre work, level-crossing control]
    status: live
  - id: aviation-piloting
    name: Aviation Piloting
    scope: "Piloting powered or unpowered aircraft to move people or goods with a destination."
    examples: [commercial airline piloting, general aviation flying, helicopter piloting, glider piloting, agricultural aerial application flying]
    status: live
  - id: air-traffic-control
    name: Air Traffic Control
    scope: "Directing and separating aircraft in flight and on the ground to ensure safe, orderly movement."
    examples: [tower control, approach control, en-route control, ground control]
    status: live
  - id: unmanned-aircraft-operations
    name: Unmanned Aircraft (Drone) Operations
    scope: "Piloting and managing uncrewed aircraft for transport, delivery or inspection missions with a destination or task."
    examples: [drone delivery piloting, BVLOS operations, drone fleet dispatch, remote piloting]
    status: live
  - id: maritime-navigation-seamanship
    name: Maritime Navigation & Seamanship
    scope: "Navigating and operating ships and boats to move people or goods, including deck and engine-room watchkeeping."
    examples: [merchant marine navigation, ship's engineering watchkeeping, harbour piloting, tugboat operation, cargo ship operations]
    status: live
  - id: sailing-boating-transport
    name: Sailing & Boating (Transport)
    scope: "Sailing or boating with a destination or cargo, as distinct from pleasure sailing with no destination."
    examples: [ferry operation, water-taxi operation, delivery sailing, charter boat operation]
    status: live
  - id: diving-life-support-craft
    name: Diving & Life-Support Craft Operations
    scope: "Operating diving and other life-support systems for underwater work, including gas management and decompression control."
    examples: [commercial diving operations, saturation diving, dive-bell and chamber operation, gas-mixture management]
    status: live
  - id: animal-driving-transport
    name: Animal Driving (Transport)
    scope: "Driving or guiding animals to move people or goods with a destination."
    examples: [carriage driving, sled-dog mushing for transport, pack-animal droving, camel caravanning]
    status: live
  - id: spaceflight-spacecraft-operations
    name: Spaceflight & Spacecraft Operations
    scope: "Piloting, commanding and operating spacecraft, and managing satellite health, trajectory and payload through flight."
    examples: [astronaut piloting, spacecraft flight control, satellite operations, mission control console work]
    status: live
  - id: space-traffic-management
    name: Space Traffic Management
    scope: "Tracking orbital objects and managing collision-avoidance and traffic coordination in space."
    examples: [conjunction assessment, orbital debris tracking, satellite collision avoidance, space situational awareness]
    status: live
  - id: navigation-wayfinding
    name: Navigation & Wayfinding
    scope: "Determining position and course across land, sea, air or space, by instrument or traditional method."
    examples: [celestial navigation, dead reckoning, GPS-based navigation, traditional Pacific wayfinding, orienteering for travel]
    status: live
  - id: traffic-transport-signalling
    name: Traffic & Transport Signal Control
    scope: "Managing road and transport-network traffic flow through signals and control systems, outside rail."
    examples: [traffic signal management, traffic control centre operation, highway incident management, port traffic coordination]
    status: live
  - id: logistics-supply-chain
    name: Logistics & Supply Chain Management
    scope: "Planning and coordinating the flow of goods from origin to destination across a network."
    examples: [supply chain planning, freight forwarding, fleet routing, inventory and distribution planning]
    status: live
  - id: warehousing
    name: Warehousing
    scope: "Storing, handling and moving general goods within a warehouse or distribution facility."
    examples: [order picking and packing, forklift operation, warehouse management systems operation, cross-docking]
    status: live
  - id: postal-courier-delivery
    name: Postal & Courier Delivery
    scope: "Collecting, sorting and delivering mail and parcels to recipients."
    examples: [mail delivery, parcel courier work, mail sorting, last-mile delivery dispatch]
    status: live
  - id: trade-compliance-customs-brokerage
    name: Trade Compliance & Customs Brokerage
    scope: "Classifying goods and filing customs and trade-compliance declarations on behalf of a carrier, forwarder or importer/exporter."
    examples: [tariff classification, customs declaration filing, customs brokerage, bonded-warehouse compliance]
    status: live
