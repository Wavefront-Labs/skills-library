# Drawn from: ISCED-F 2013 subject field 01 (Education), and academic-discipline practice
# norms, collapsed to the categories.yaml cover list (pedagogy, curriculum/assessment design,
# instructional design, running schools/training programmes, tutoring, IEP writing, academic
# practice such as peer review and grant writing, and research-ethics/safety committee review).
category: education-training
fields:
  - id: pedagogy-and-teaching-method
    name: Pedagogy and Teaching Method
    scope: "General teaching method and classroom practice: how material is presented, paced and checked for understanding."
    examples: [classroom management, differentiated instruction, formative assessment technique, lesson delivery]
    status: live
  - id: curriculum-and-assessment-design
    name: Curriculum and Assessment Design
    scope: "Designing what is taught and how learning is measured: scope and sequence, standards alignment, and test and rubric design."
    examples: [curriculum mapping, standards alignment, rubric design, standardized test design]
    status: live
  - id: instructional-design
    name: Instructional Design
    scope: "Designing the pedagogical content and structure of a course or training product, including its e-learning delivery."
    examples: [e-learning course design, learning-objective design, training-module design, multimedia instructional design]
    status: live
  - id: school-and-training-program-administration
    name: School and Training Program Administration
    scope: "Running a school, training centre or education programme: staffing, scheduling and operational leadership of teaching delivery."
    examples: [school principal leadership, training-centre administration, enrollment and scheduling, academic program coordination]
    status: live
  - id: tutoring-and-subject-instruction
    name: Tutoring and Subject Instruction
    scope: "One-on-one or small-group instruction in a specific academic subject, across any subject area."
    examples: [math tutoring, test-prep tutoring, language tutoring, homework help]
    status: live
  - id: special-education-and-iep-planning
    name: Special Education and IEP Planning
    scope: "Teaching students with disabilities and writing the eligibility determination, goals and services plan from a clinical assessment."
    examples: [IEP writing, 504 plan writing, special-education instruction, inclusive classroom accommodation planning]
    status: live
  - id: vocational-and-workforce-training
    name: Vocational and Workforce Training
    scope: "Training programmes that build job-ready skills for a trade or occupation, outside degree-granting academic education."
    examples: [apprenticeship training design, technical skills training, on-the-job training programmes, certification exam preparation]
    status: live
  - id: adult-and-continuing-education
    name: Adult and Continuing Education
    scope: "Teaching and program design aimed at adult learners returning to study, upskilling, or pursuing lifelong learning."
    examples: [adult literacy instruction, continuing professional education, community education classes, GED/high-school-equivalency instruction]
    status: live
  - id: higher-education-and-academic-practice
    name: Higher Education and Academic Practice
    scope: "The cross-cutting practice of academic work itself: literature review, peer review, grant writing for research funding, and evaluating scholarly merit."
    examples: [peer review, academic publishing, research grant writing, scholarly prize and honours evaluation]
    status: live
  - id: research-ethics-and-integrity-review
    name: Research Ethics and Integrity Review
    scope: "Committee review of research for ethics, safety and integrity, requiring field-specific scientific or technical judgement regardless of the field under review."
    examples: [institutional review board (human subjects) review, animal-care and use committee review, biosafety committee review, dual-use research review]
    status: live
