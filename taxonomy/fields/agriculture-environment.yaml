# Drawn from SOC/ISCO Major Group 6 (Skilled Agricultural, Forestry and Fishery Workers) and
# detailed groups 6111-6210, plus ISCO 9212/5164 and NAICS 111/112/113/114/115 for the
# sub-trades (apiculture, living-plant arts, conservation work) that SOC groups too coarsely.
category: agriculture-environment
fields:
  - id: crop-farming
    name: Crop Farming / Agronomy
    scope: "Growing field and row crops at any scale, from variety and crop-mix choice through planting, tending and field-level harvest decisions."
    examples: [arable farming, agronomy, crop rotation planning, smallholder subsistence farming]
    status: live
  - id: horticulture
    name: Horticulture
    scope: "Growing fruit, vegetables, nursery stock and ornamental plants under intensive cultivation, including greenhouse and orchard production."
    examples: [market gardening, orchard management, greenhouse growing, nursery production, viticulture]
    status: live
  - id: gardening
    name: Gardening
    scope: "Planning, planting and tending a domestic or amateur garden for its own sake rather than as a commercial crop."
    examples: [kitchen gardening, ornamental bedding, container gardening, companion planting]
    status: live
  - id: landscape-grounds-keeping
    name: Landscaping and Grounds Keeping
    scope: "Installing and maintaining lawns, turf, planted beds and grounds for parks, sports fields, cemeteries and commercial or public property."
    examples: [turf management, lawn care, park maintenance, golf course grounds keeping]
    status: live
  - id: living-plant-arts
    name: Living-Plant Arts
    scope: "Shaping and training living plants as an ongoing discipline rather than a one-off cut: bonsai, ikebana display gardening, and topiary."
    examples: [bonsai cultivation, ikebana, topiary, espalier training]
    status: live
  - id: forestry
    name: Forestry
    scope: "Managing, planting, tending and harvesting trees and woodland at stand or landscape scale, including timber extraction."
    examples: [silviculture, logging, woodland management, arboriculture, reforestation]
    status: live
  - id: livestock-farming
    name: Livestock Farming / Animal Husbandry
    scope: "Day-to-day raising, feeding, housing and care of farmed animals for meat, milk, eggs, fibre or draught, including killing and field-dressing."
    examples: [dairy farming, poultry farming, swine production, sheep and wool production, equine stud management]
    status: live
  - id: animal-breeding
    name: Animal Breeding
    scope: "Planning and carrying out breeding programmes for farmed, working or companion animals, including genetics and bloodline selection."
    examples: [livestock breeding, pedigree dog breeding, bloodstock breeding, artificial insemination]
    status: live
  - id: animal-training
    name: Animal Training
    scope: "Teaching animals behaviours and responses for work, service, performance or companionship, across any species."
    examples: [working dog training, horse breaking and schooling, service animal training, falconry]
    status: live
  - id: apiculture
    name: Apiculture
    scope: "Keeping and managing honeybee colonies for honey, pollination services or hive products."
    examples: [beekeeping, queen rearing, hive management, pollination contracting]
    status: live
  - id: aquaculture
    name: Aquaculture
    scope: "Farming fish, shellfish and other aquatic organisms in controlled ponds, tanks, cages or coastal plots."
    examples: [fish farming, shellfish farming, hatchery operations, pond management]
    status: live
  - id: commercial-fishing
    name: Commercial Fishing
    scope: "Catching wild fish and other aquatic animals at commercial or subsistence scale, including vessel-based and inland fishing."
    examples: [trawling, net fishing, line fishing, inland and artisanal fishing]
    status: live
  - id: hunting-trapping
    name: Hunting and Trapping
    scope: "Pursuing, killing and field-dressing wild game and furbearing animals, for subsistence, pest control, commercial or guided purposes."
    examples: [big-game hunting, fur trapping, pest trapping, game field-dressing]
    status: live
  - id: foraging-wild-food
    name: Foraging and Wild Food Gathering
    scope: "Identifying, gathering and preparing wild plants, fungi and other foodstuffs for personal, subsistence or commercial use."
    examples: [wild mushroom foraging, wild edible plant gathering, seaweed harvesting]
    status: live
  - id: soil-land-management
    name: Soil and Land Management
    scope: "Assessing and managing soil health, fertility and structure, and land-use decisions that support crop or livestock production."
    examples: [soil testing and amendment, fertiliser management, land reclamation, erosion control]
    status: live
  - id: irrigation-water-management
    name: Irrigation and Agricultural Water Management
    scope: "Supplying, distributing and scheduling water for crops, livestock and land, from field irrigation to drainage."
    examples: [irrigation scheduling, drainage systems, drip and pivot irrigation, stock watering]
    status: live
  - id: conservation-land-stewardship
    name: Conservation and Land Stewardship
    scope: "Managing land and habitats for ecological, cultural or environmental outcomes, including fire and restoration programmes."
    examples: [cultural burning, habitat restoration, invasive species control, rangeland stewardship, environmental programme fieldwork]
    status: live
  - id: companion-animal-care
    name: Companion Animal Care Services
    scope: "Day-to-day non-clinical care of pets: grooming, boarding, exercise and sitting."
    examples: [pet grooming, kennel and cattery boarding, dog walking, pet sitting, doggy daycare]
    status: live
