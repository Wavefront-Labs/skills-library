# Drawn from SOC 35-xxxx (Food Preparation and Serving) and 39-xxxx/37-xxxx (Hospitality,
# Travel), ISCO-08 unit groups 512x/513x/515x, and named craft and service disciplines.
category: hospitality-culinary
fields:
  - id: culinary-arts
    name: Culinary Arts
    scope: "Cooking and preparing food by hand or at craft scale, including menu development and kitchen technique."
    examples: [knife skills, sauce work, menu engineering, recipe costing, plating]
    status: live
  - id: baking-and-pastry
    name: Baking and Pastry
    scope: "Baking bread, pastry and desserts, including recipe formulation and decorative finishing."
    examples: [bread baking, pastry lamination, cake decorating, chocolate work, dessert plating]
    status: live
  - id: butchery
    name: Butchery and Meat Cutting
    scope: "Cutting and preparing meat for cooking, including ritual slaughter preparation where it precedes culinary use."
    examples: [primal breakdown, portion cutting, charcuterie, ritual slaughter preparation, offal processing]
    status: live
  - id: cheesemaking
    name: Cheesemaking
    scope: "Making and aging cheese by hand or at craft scale."
    examples: [curdling and culturing, affinage, mould-ripened cheese, fresh cheese production, cheese tasting evaluation]
    status: live
  - id: brewing
    name: Brewing
    scope: "Making beer and other fermented malt beverages by hand or at craft scale."
    examples: [mashing and wort production, fermentation management, hop scheduling, cask conditioning, beer sensory evaluation]
    status: live
  - id: winemaking
    name: Winemaking
    scope: "Making wine from grapes or other fruit by hand or at craft scale, including cellar practice."
    examples: [crush and fermentation, blending, barrel aging, bottling, wine tasting evaluation]
    status: live
  - id: distilling
    name: Distilling
    scope: "Distilling spirits by hand or at craft scale, including cut selection and barrel aging."
    examples: [still operation, cut selection, barrel aging, botanical blending, spirit tasting evaluation]
    status: live
  - id: food-preservation
    name: Food and Drink Preservation
    scope: "Preserving and storing food and drink for later consumption, at household or craft scale."
    examples: [canning, fermenting, curing, smoking, pickling]
    status: live
  - id: food-and-drink-service
    name: Food and Drink Service
    scope: "Serving food and drink to guests in a restaurant, bar or event setting, including table-side service."
    examples: [table service, order taking, wine service, food runner coordination, service recovery]
    status: live
  - id: bartending
    name: Bartending
    scope: "Mixing and serving drinks at a bar, including cocktail craft and bar management."
    examples: [cocktail mixing, flair bartending, bar inventory, menu design for drinks, responsible-service practice]
    status: live
  - id: sensory-evaluation
    name: Sensory Evaluation of Food, Drink and Fragrance
    scope: "Assessing food, drink and fragrance by taste, smell and texture for quality and description."
    examples: [cupping, tasting panels, flavour wheel use, fragrance evaluation, sommelier assessment]
    status: live
  - id: ceremonial-food-and-drink
    name: Ceremonial Food and Drink Preparation
    scope: "Preparing food and drink for ceremonial or ritual occasions, including funeral receptions."
    examples: [ceremonial tea preparation, ritual feast cooking, funeral reception catering, religious dietary preparation, celebratory food traditions]
    status: live
  - id: guest-accommodation
    name: Guest Accommodation Services
    scope: "Running and staffing guest lodging, from check-in to housekeeping to guest-facing hospitality."
    examples: [front-desk operations, concierge service, housekeeping standards, guest-relations recovery, revenue-neutral upsell at check-in]
    status: live
  - id: tourism-and-travel-services
    name: Tourism and Travel Services
    scope: "Designing and delivering commercial travel services and itineraries, including guiding where content is general sightseeing interpretation."
    examples: [itinerary design, group tour guiding, destination interpretation, excursion logistics, tour-group management]
    status: live
  - id: event-planning-and-hospitality
    name: Event Planning and Hospitality
    scope: "Planning and running hospitality-side events: weddings, conferences, banquets and functions."
    examples: [banquet coordination, wedding-day run-of-show, catering logistics, venue hospitality staffing, guest-flow management]
    status: live
  - id: amusement-and-attraction-operations
    name: Amusement and Attraction Operations
    scope: "Operating theme-park and attraction rides and shows as a tourism and events service."
    examples: [ride dispatch and safety cycles, queue and capacity management, parade scheduling, character-performer scheduling, guest-flow at attractions]
    status: live
  - id: barista-and-coffee-craft
    name: Barista and Coffee Craft
    scope: "Preparing and serving coffee and espresso-based drinks, including bean selection and brew-method craft."
    examples: [espresso extraction, latte art, pour-over brewing, bean sourcing knowledge, cafe service]
    status: live
  - id: passenger-service-cabin-crew
    name: Passenger Service and Cabin Crew
    scope: "In-journey passenger care and safety service aboard aircraft, ships and trains."
    examples: [flight attendant duties, cabin safety procedures, onboard meal service, rail onboard service, cruise passenger hosting]
    status: live
  - id: casino-gaming-operations
    name: Casino and Gaming Floor Operations
    scope: "Dealing, pit supervision and table-game floor operations as a guest-service function of the gaming operator."
    examples: [table dealing, croupier craft, pit-boss supervision, slot floor operations, player hosting and comps]
    status: live
