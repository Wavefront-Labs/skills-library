# Drawn from: ISCED-F 2013 subject field 02 (Arts and humanities) and standard academic
# discipline names (history, archaeology, literary studies, classics, area studies, art
# history, musicology, religious studies), collapsed to the categories.yaml cover list, which
# also adds genealogy, criminology-as-scholarship, bioethics scholarship, provenance/
# authentication, museum/archive collections management, heritage interpretation and oral history.
category: humanities
fields:
  - id: history
    name: History
    scope: "Researching, interpreting and writing an accurate account of the past."
    examples: [social history, military history, economic history, local history research]
    status: live
  - id: archaeology
    name: Archaeology
    scope: "Studying past human life through material remains: excavation, artefact analysis and site interpretation."
    examples: [field excavation, artefact analysis, bioarchaeology, underwater archaeology]
    status: live
  - id: genealogy-and-family-history
    name: Genealogy and Family History
    scope: "Tracing lineage and personal or family history, including family-reunification research such as tracing an adoptee's birth family."
    examples: [family-tree research, adoption reunification research, DNA genealogy, heraldic and surname research]
    status: live
  - id: literary-studies-and-criticism
    name: Literary Studies and Criticism
    scope: "Scholarly critical analysis and writing about literature and creative works."
    examples: [literary criticism, comparative literature, narrative theory, close reading and textual analysis]
    status: live
  - id: classics
    name: Classics
    scope: "Study of the languages, literature, history and culture of ancient Greece and Rome."
    examples: [classical philology, ancient Greek studies, Latin studies, classical reception studies]
    status: live
  - id: cultural-and-area-studies
    name: Cultural and Area Studies
    scope: "Interdisciplinary scholarly study of a specific culture, region or population."
    examples: [regional area studies, ethnic and cultural studies, folklore studies, diaspora studies]
    status: live
  - id: art-history
    name: Art History
    scope: "Scholarly study of visual art's history, meaning and context."
    examples: [art historical research, iconography, art criticism scholarship, period and movement studies]
    status: live
  - id: musicology
    name: Musicology
    scope: "Scholarly study of music's history, theory and cultural context."
    examples: [historical musicology, ethnomusicology, music theory scholarship, music analysis]
    status: live
  - id: religious-studies
    name: Religious Studies
    scope: "Scholarly, academic study of religion as a subject of research rather than as practised faith."
    examples: [comparative religion, scriptural scholarship, history of religion, sociology-adjacent religious scholarship]
    status: live
  - id: criminology
    name: Criminology
    scope: "Scholarly study of crime, criminal behaviour and the justice system, as research rather than enforcement practice."
    examples: [criminological theory, victimology research, penology scholarship, crime-pattern research]
    status: live
  - id: bioethics-and-applied-ethics-scholarship
    name: Bioethics and Applied Ethics Scholarship
    scope: "Scholarly research and publication on ethical questions arising in medicine, science and public life."
    examples: [bioethics research, research-ethics scholarship, applied-ethics publication, ethics case-study analysis]
    status: live
  - id: provenance-and-art-authentication
    name: Provenance and Art Authentication
    scope: "Researching an object's history of ownership and determining its authenticity."
    examples: [provenance research, authentication assessment, forgery detection scholarship, ownership-history documentation]
    status: live
  - id: museum-and-archive-collections-management
    name: Museum and Archive Collections Management
    scope: "Acquiring, cataloguing, preserving and managing collections held by a museum or archive."
    examples: [collections cataloguing, archival processing, conservation planning for collections, exhibition curation]
    status: live
  - id: heritage-interpretation
    name: Heritage Interpretation
    scope: "Presenting and explaining historical sites, buildings and heritage to visitors and the public."
    examples: [heritage-site tour guiding, historic-building interpretation, interpretive signage writing, living-history presentation]
    status: live
  - id: oral-history-and-tradition-keeping
    name: Oral History and Tradition Keeping
    scope: "Recording, preserving and passing on an accurate account of the past or of lineage through spoken tradition."
    examples: [oral-history interviewing, griot and tradition-keeper practice, community memory projects, elder knowledge transmission]
    status: live
