# Sources: named academic social-science disciplines (as departments/degrees are actually
# organised) cross-checked against ISCED-F 2013 narrow fields and SOC/ISCO social-science
# researcher occupation groups (e.g. SOC 19-3xxx, ISCO 263).
category: social-sciences
fields:
  - id: psychology
    name: Psychology (research)
    scope: "Scientific study of mind and behaviour: experimental design, cognition, developmental, social and personality psychology research producing new knowledge (clinical application and treatment is health-medicine)."
    examples: [cognitive psychology, developmental psychology, social psychology, personality research, psychometrics]
    status: live
  - id: sociology
    name: Sociology
    scope: "Study of societies, social structures, institutions and group behaviour through theory and empirical research."
    examples: [social stratification, urban sociology, sociology of religion, social network analysis, survey research]
    status: live
  - id: anthropology
    name: Anthropology
    scope: "Study of human societies, cultures and their development, including fieldwork-based cultural, linguistic, biological and archaeological-adjacent social inquiry."
    examples: [cultural anthropology, ethnography, linguistic anthropology, medical anthropology, kinship studies]
    status: live
  - id: economics
    name: Economics
    scope: "Study of production, distribution and consumption of resources, markets and economic behaviour, from theory-building to empirical modelling."
    examples: [microeconomics, macroeconomics, econometrics, behavioural economics, development economics]
    status: live
  - id: political-science
    name: Political science
    scope: "Study of governance, political institutions, power, elections and political behaviour."
    examples: [comparative politics, international relations theory, political behaviour, public policy analysis, political theory]
    status: live
  - id: human-geography
    name: Human geography
    scope: "Study of how people, economies and societies are organised across space and place."
    examples: [urban geography, economic geography, population geography, political geography, GIS-based social research]
    status: live
  - id: demography
    name: Demography
    scope: "Study of population size, structure, migration, fertility and mortality using quantitative methods."
    examples: [population projection, migration studies, fertility research, mortality analysis, census analysis]
    status: live
  - id: futures-studies
    name: Futures studies
    scope: "Systematic study of possible, probable and preferable futures using scenario and forecasting methods."
    examples: [scenario planning, horizon scanning, trend forecasting research, foresight methodology, forecasting critique]
    status: live
  - id: sports-science-kinesiology
    name: Sports science and kinesiology (research)
    scope: "Research into human movement, exercise physiology and athletic performance, producing new knowledge rather than coaching practice."
    examples: [exercise physiology research, biomechanics research, sports psychology research, motor control studies, athletic performance modelling]
    status: live
  - id: food-science-research
    name: Food science (research)
    scope: "Research into the composition, safety, processing and sensory properties of food, producing new knowledge rather than production or craft practice."
    examples: [food chemistry research, sensory science research, food safety research, nutrition science research, food processing research]
    status: live
  - id: communication-studies
    name: Communication studies
    scope: "Academic research into how messages, media and interpersonal communication shape behaviour and society."
    examples: [media effects research, organisational communication research, intercultural communication studies, rhetoric research, public opinion research]
    status: live
  - id: social-research-methods
    name: Social research methods
    scope: "Cross-disciplinary methods for studying people: survey design, qualitative methods, experimental and quasi-experimental design, and social statistics applied to human subjects."
    examples: [survey methodology, qualitative coding, focus-group moderation for research, social statistics, mixed-methods design]
    status: live
  - id: education-research
    name: Education Research
    scope: "Research producing new knowledge about learning, teaching and education systems."
    examples: [learning sciences, educational psychology research, comparative education, education policy research]
    status: live
  - id: management-and-organisational-research
    name: Management and Organisational Research
    scope: "Academic study of organisations, management and work."
    examples: [organisational behaviour, management science research, consumer behaviour research, accounting research]
    status: live
