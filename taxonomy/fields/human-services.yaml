# Drawn from: ISCO-08 social and welfare occupational groups (341, 263.1, 532) and ISCED-F 2013
# subject field 0923 (Welfare), collapsed to the categories.yaml cover list (childcare, aged
# care, disability support, social work, non-clinical counselling, coaching, bereavement
# support, community development, case management, advocacy, chaplaincy's emotional-support
# side, volunteering, and service navigation by the service user).
category: human-services
fields:
  - id: childcare-and-early-childhood-care
    name: Childcare and Early Childhood Care
    scope: "Daily physical care, supervision and routines for infants and children, in home or group settings, whoever provides it."
    examples: [daycare provision, nannying, babysitting, after-school care]
    status: live
  - id: aged-care
    name: Aged Care
    scope: "Daily-living support, supervision and companionship for older adults, in home or residential settings."
    examples: [home care aide work, residential aged-care support, respite care, dementia-friendly daily support]
    status: live
  - id: disability-support
    name: Disability Support
    scope: "Daily-living assistance, supervision and skill-building support for people with physical, intellectual or developmental disabilities."
    examples: [personal support work, supported independent living, job coaching for disability employment, respite support]
    status: live
  - id: social-work
    name: Social Work
    scope: "Assessing people's needs, connecting them to services, and intervening to protect and support individuals, families and communities."
    examples: [child protection casework, medical social work, family social work, school social work]
    status: live
  - id: non-clinical-counselling
    name: Non-Clinical Counselling
    scope: "Supportive listening and guidance for personal or life difficulties that does not diagnose or treat a named clinical condition."
    examples: [peer support counselling, pastoral counselling, crisis-line listening, relationship support groups]
    status: live
  - id: life-and-career-coaching
    name: Life and Career Coaching
    scope: "Structured, goal-directed support to help a person clarify and pursue personal or career direction, distinct from job-search tactics."
    examples: [life coaching, executive coaching, career-transition coaching, wellness coaching]
    status: live
  - id: bereavement-support-and-death-doula-work
    name: Bereavement Support and Death Doula Work
    scope: "Non-clinical emotional and practical support for people facing death, dying or loss."
    examples: [grief support groups, death doula companionship, end-of-life planning support, widow/widower support]
    status: live
  - id: community-services-and-development
    name: Community Services and Development
    scope: "Organising and delivering services and programmes that build community capacity and wellbeing."
    examples: [community outreach, neighbourhood development programmes, settlement services for migrants, youth community programmes]
    status: live
  - id: case-management
    name: Case Management
    scope: "Coordinating a person's access to multiple services over time, tracking needs, referrals and follow-through."
    examples: [social-service case management, housing case management, benefits case coordination, re-entry case management]
    status: live
  - id: advocacy-for-others
    name: Advocacy for Others
    scope: "Representing and championing another person's interests and rights with services, institutions or decision-makers."
    examples: [disability rights advocacy, patient advocacy, tenant advocacy, child advocacy]
    status: live
  - id: pastoral-and-chaplaincy-support
    name: Pastoral and Chaplaincy Support
    scope: "The non-ritual, emotional-support side of a pastoral or chaplaincy visit: listening, presence and comfort."
    examples: [hospital chaplaincy visiting, hospice pastoral support, prison chaplaincy support, military chaplaincy support]
    status: live
  - id: volunteer-care-work
    name: Volunteer Care Work
    scope: "Unpaid caregiving, companionship and support delivered through organised volunteering."
    examples: [hospital volunteering, befriending programmes, volunteer home visiting, charity helpline volunteering]
    status: live
  - id: service-navigation-and-self-advocacy
    name: Service Navigation and Self-Advocacy
    scope: "Finding, understanding and asserting one's own access to human services as the person who needs them."
    examples: [benefits navigation, self-advocacy skills, peer navigator support, patient/client self-representation]
    status: live
