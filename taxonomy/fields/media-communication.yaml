# Drawn from SOC 27-3xxx (Media and Communication), ISCO-08 unit groups 2642/2643/2651s,
# and named beats/disciplines within journalism, broadcasting, publishing and PR.
category: media-communication
fields:
  - id: journalism
    name: Journalism
    scope: "Investigating, reporting and writing news and feature stories for publication or broadcast."
    examples: [beat reporting, investigative journalism, fact-checking, interviewing, news writing]
    status: live
  - id: broadcasting
    name: Broadcasting
    scope: "Producing and presenting audio and video content for radio, television and streaming channels."
    examples: [radio presenting, news anchoring, live broadcast production, podcast hosting, on-air continuity]
    status: live
  - id: publishing
    name: Publishing
    scope: "Acquiring, editing, producing and distributing books, magazines and other print or digital editorial output."
    examples: [acquisitions editing, copyediting, production scheduling, rights and permissions, print and digital distribution]
    status: live
  - id: public-relations
    name: Public Relations
    scope: "Managing an organisation's or individual's public image and media relationships, including crisis communication."
    examples: [media pitching, press release writing, crisis communications, reputation management, spokesperson prep]
    status: live
  - id: persuasive-messaging
    name: Persuasive Messaging and Information Operations
    scope: "Crafting persuasive messages for an audience, including campaign messaging, propaganda and information operations."
    examples: [message testing, campaign messaging, propaganda analysis, counter-messaging, narrative strategy]
    status: live
  - id: criticism-and-review
    name: Criticism and Review
    scope: "Writing published criticism and reviews of creative, cultural or consumer works for an audience."
    examples: [film criticism, book reviews, restaurant reviews, art criticism, review-score methodology]
    status: live
  - id: content-creation-and-audience-growth
    name: Content Creation and Audience Growth (Unmonetised Sale)
    scope: "Publishing editorial or creative content and growing its audience where nothing is directly sold."
    examples: [newsletter growth, blog audience building, content calendars, platform algorithm literacy, editorial SEO]
    status: live
  - id: online-community-management
    name: Online Community Management and Moderation
    scope: "Running and moderating online communities and forums, setting and enforcing platform or community conduct norms."
    examples: [moderation policy, community guidelines enforcement, escalation handling, community event hosting, platform tooling]
    status: live
  - id: technical-writing
    name: Technical and Professional Writing
    scope: "Writing clear technical, procedural or professional documents for a defined audience."
    examples: [user manuals, API documentation, white papers, process documentation, style-guide compliance]
    status: live
  - id: public-speaking-and-rhetoric
    name: Public Speaking and Rhetoric
    scope: "Composing and delivering spoken rhetoric to an audience, including speechwriting and oratory delivery."
    examples: [speechwriting, keynote delivery, debate-style rhetoric, presentation coaching, audience engagement techniques]
    status: live
  - id: library-and-archive-science
    name: Library and Archive Information Science
    scope: "Managing what information means for retrieval and governance: metadata, classification and information architecture in libraries, archives and organisational records programmes."
    examples: [cataloguing, metadata schemas, information architecture, digital preservation, reference services, corporate records management]
    status: live
  - id: documentary-and-nonfiction-media
    name: Documentary and Nonfiction Media Production
    scope: "Producing nonfiction video, audio or multimedia works intended to inform rather than function as fine art."
    examples: [documentary research, nonfiction scripting, verite filming, nonfiction editing, archival footage licensing]
    status: live
  - id: sports-and-entertainment-commentary
    name: Sports and Entertainment Commentary
    scope: "Providing live or recorded commentary and analysis on sports or entertainment events for an audience."
    examples: [play-by-play commentary, colour commentary, post-event analysis, pre-show hosting, commentary team coordination]
    status: live
  - id: editorial-photography-and-photojournalism
    name: Editorial Photography and Photojournalism
    scope: "Capturing and editing photographs to illustrate news or editorial stories, not as fine art or a product sale."
    examples: [news photography, photo essays, press-pool logistics, photo editing for publication, caption writing]
    status: live
  - id: internal-and-organisational-communications-content
    name: Organisational Communications Content
    scope: "Drafting and editing a specific organisational message, document or internal campaign (not setting channel strategy)."
    examples: [internal newsletters, leadership messaging drafts, all-hands scripting, intranet content, change-communication copy]
    status: live
  - id: media-relations-and-press-liaison
    name: Media Relations and Press Liaison
    scope: "Acting as the day-to-day point of contact between an organisation and journalists or outlets."
    examples: [press list management, embargo coordination, interview brokering, press kit assembly, media monitoring]
    status: live
  - id: scientific-and-medical-communication
    name: Scientific and Medical Communication (Non-Promotional)
    scope: "Communicating scientific or medical information to professional or lay audiences without promotional sign-off."
    examples: [medical science liaison conversations, lay-summary writing, conference abstract writing, science journalism, regulatory-neutral medical education]
    status: live
