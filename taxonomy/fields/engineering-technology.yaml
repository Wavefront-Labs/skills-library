# Drawn from: named engineering disciplines as organised by professional engineering bodies
# (mechanical, electrical, civil/structural, chemical, aerospace, etc.) and ABET/Washington
# Accord discipline lists, plus cross-cutting engineering functions (systems engineering, CAD,
# robotics) named in the category's own covers text.
category: engineering-technology
fields:
  - id: mechanical-engineering
    name: Mechanical Engineering
    scope: "Designing and analysing mechanisms, machines, thermal and fluid systems."
    examples: [machine design, thermodynamics analysis, HVAC system design, mechanism design, kinematics]
    status: live
  - id: electrical-engineering
    name: Electrical Engineering
    scope: "Designing and analysing electrical power, circuits and electromagnetic systems."
    examples: [power systems design, circuit design, motor and drive design, electromagnetics analysis]
    status: live
  - id: electronics-engineering
    name: Electronics Engineering
    scope: "Designing and analysing electronic components, circuits and embedded hardware."
    examples: [PCB design, analog circuit design, RF circuit design, embedded hardware design, signal integrity analysis]
    status: live
  - id: civil-engineering
    name: Civil Engineering
    scope: "Designing infrastructure and civil works: transport, water and geotechnical systems, as engineering analysis distinct from on-site construction."
    examples: [transportation engineering design, geotechnical engineering, hydraulic engineering, pavement design]
    status: live
  - id: structural-engineering
    name: Structural Engineering
    scope: "Analysing and designing load-bearing structures for strength, stability and safety."
    examples: [structural analysis, seismic design, bridge engineering, foundation design]
    status: live
  - id: chemical-engineering
    name: Chemical Engineering
    scope: "Designing processes and equipment for transforming materials through chemical, physical or biological means at engineering scale."
    examples: [process design, reactor design, separation-process engineering, plant design]
    status: live
  - id: aerospace-engineering
    name: Aerospace Engineering
    scope: "Designing and analysing aircraft, spacecraft and their propulsion and systems."
    examples: [aerodynamics design, aircraft structural design, propulsion engineering, flight-systems design]
    status: live
  - id: automotive-vehicle-engineering
    name: Automotive & Vehicle Engineering
    scope: "Designing and analysing road vehicles and their subsystems."
    examples: [powertrain design, chassis engineering, vehicle dynamics, crash safety engineering]
    status: live
  - id: marine-naval-engineering
    name: Marine & Naval Engineering
    scope: "Designing and analysing ships, boats and marine structures and their systems."
    examples: [naval architecture, ship structural design, marine propulsion engineering, offshore platform engineering]
    status: live
  - id: materials-engineering
    name: Materials Engineering
    scope: "Designing and selecting materials and analysing their structure-property relationships for engineering use."
    examples: [metallurgical engineering, polymer engineering, composite materials design, corrosion engineering]
    status: live
  - id: industrial-manufacturing-systems-engineering
    name: Industrial & Manufacturing Systems Engineering
    scope: "Designing production systems, workflows and facility layouts for efficiency and quality, as an engineering discipline distinct from running the line."
    examples: [process layout design, manufacturing systems design, lean/Six Sigma engineering, factory automation design]
    status: live
  - id: biomedical-engineering
    name: Biomedical Engineering
    scope: "Designing medical devices, implants and biomedical instrumentation."
    examples: [medical device design, prosthetics engineering, biomechanics engineering, diagnostic instrument design]
    status: live
  - id: environmental-engineering
    name: Environmental Engineering
    scope: "Designing systems for water, waste and pollution control at engineering scale."
    examples: [water treatment system design, waste management engineering, air-quality control engineering, remediation engineering]
    status: live
  - id: mining-geological-engineering
    name: Mining & Geological Engineering
    scope: "Designing extraction methods and engineering works for mineral and resource extraction."
    examples: [mine design, slope stability engineering, drilling engineering, ore-processing engineering]
    status: live
  - id: petroleum-engineering
    name: Petroleum Engineering
    scope: "Designing and analysing systems for oil and gas extraction and reservoir management."
    examples: [reservoir engineering, drilling engineering, production engineering, well design]
    status: live
  - id: nuclear-engineering
    name: Nuclear Engineering
    scope: "Designing and analysing nuclear reactors and radiation-based systems."
    examples: [reactor design, radiation shielding design, nuclear safety analysis, fuel-cycle engineering]
    status: live
  - id: industrial-design
    name: Industrial Design (Product Form & Function)
    scope: "Designing a utilitarian product's function, structure and form as one integrated deliverable."
    examples: [consumer product design, enclosure and hinge design, ergonomic design, product CMF design]
    status: live
  - id: systems-engineering
    name: Systems Engineering
    scope: "Integrating requirements, interfaces and verification across subsystems of a complex engineered system."
    examples: [requirements engineering, interface management, verification and validation planning, systems architecture]
    status: live
  - id: robotics-control-systems
    name: Robotics & Control Systems Engineering
    scope: "Designing robots, automation and feedback-control systems."
    examples: [robot kinematics and dynamics design, control-loop design, motion planning, sensor fusion engineering]
    status: live
  - id: technical-drawing-cad
    name: Technical Drawing & CAD
    scope: "Producing precise technical drawings and parametric models that specify a design."
    examples: [2D drafting, parametric CAD modelling, GD&T annotation, assembly drawing]
    status: live
  - id: invention-prototyping
    name: Invention & Prototyping
    scope: "Conceiving and proving out novel technical solutions ahead of formal engineering design."
    examples: [concept prototyping, patent-disclosure invention work, proof-of-concept builds, maker-level engineering invention]
    status: live
  - id: technical-authentication-testing
    name: Technical Authentication & Product Testing
    scope: "Testing and authenticating products against engineering specification, including counterfeit-component detection and failure analysis, outside a criminal-enforcement context."
    examples: [failure analysis, counterfeit-component detection, reliability testing, IP-dispute technical testing]
    status: live
  - id: agricultural-and-biosystems-engineering
    name: Agricultural and Biosystems Engineering
    scope: "Designing machinery, irrigation and processing systems for agriculture and biological materials."
    examples: [farm machinery design, irrigation system design, food process engineering, grain storage and handling design]
    status: live
  - id: telecommunications-engineering
    name: Telecommunications Engineering
    scope: "Designing communication networks and transmission systems."
    examples: [network architecture design, link-budget engineering, fibre and microwave transmission design, antenna system design]
    status: live
