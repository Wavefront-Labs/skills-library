# Drawn from SOC/ISCO Major Group 7-8 extraction and plant-operator detailed groups
# (8111 mining, 8121-8122 metal processing plant, 3133/8162-8163 power plant operators,
# 7215/9333 line and network installers), and NAICS 211/212/221/562 for the
# extraction/utility/waste sectors this category spans.
category: energy-mining-utilities
fields:
  - id: mineral-mining
    name: Mineral and Coal Mining
    scope: "Extracting ore, coal, peat and other solid minerals from surface or underground workings, through to a storable raw commodity."
    examples: [underground coal mining, open-pit metal mining, peat cutting, mineral processing and beneficiation]
    status: live
  - id: oil-gas-extraction
    name: Oil and Gas Extraction
    scope: "Drilling, well operation and upstream production of crude oil and natural gas, onshore and offshore."
    examples: [drilling operations, well servicing, offshore production platform operations, wellhead maintenance]
    status: live
  - id: quarrying
    name: Quarrying and Stone Extraction
    scope: "Extracting and primary-cutting building stone, aggregate, sand and gravel from quarries and pits."
    examples: [dimension stone quarrying, aggregate extraction, sand and gravel pits]
    status: live
  - id: power-generation
    name: Power Generation
    scope: "Operating and controlling plant that generates electricity from fossil, nuclear, hydro or thermal sources."
    examples: [fossil-fuel power plant operation, nuclear plant operation, hydroelectric plant operation, combined-heat-and-power operation]
    status: live
  - id: renewable-energy-field-operations
    name: Renewable Energy Field Operations
    scope: "Installing, operating and fault-finding wind, solar and other renewable generation equipment in the field."
    examples: [wind turbine technician, solar PV plant operations, geothermal plant operations]
    status: live
  - id: power-transmission-distribution
    name: Power Transmission and Distribution
    scope: "Operating, fault-finding and maintaining the grid that carries electricity from generation to the end user, including substations and lines."
    examples: [substation operation, line maintenance, grid dispatch and load balancing, smart-meter network operations]
    status: live
  - id: energy-storage-operations
    name: Energy Storage Operations
    scope: "Operating and maintaining grid- or facility-scale energy storage plant that buffers generation and demand."
    examples: [battery storage plant operation, pumped-hydro storage operation, grid-scale storage dispatch]
    status: live
  - id: household-fuel-heating-supply
    name: Household Fuel and Heating Supply
    scope: "Making fire and supplying and delivering household fuel and heating energy, from traditional fire-making to fuel distribution."
    examples: [fire-making, firewood and charcoal supply, LPG and heating-oil delivery, coal delivery]
    status: live
  - id: water-treatment-supply
    name: Water Treatment and Supply
    scope: "Treating, storing and distributing drinking and household water from source to tap."
    examples: [water treatment plant operation, distribution network operation, water quality monitoring]
    status: live
  - id: wastewater-sewerage
    name: Wastewater and Sewerage
    scope: "Collecting and treating sewage and wastewater, and operating and maintaining the sewer network."
    examples: [sewage treatment plant operation, sewer network maintenance, septic system servicing]
    status: live
  - id: waste-management-recycling
    name: Waste Management and Recycling
    scope: "Collecting, sorting, recycling and disposing of household and commercial waste, including informal scavenging and reclamation."
    examples: [waste collection, materials recovery and sorting, landfill operation, informal waste scavenging]
    status: live
  - id: telecommunications-network-operations
    name: Telecommunications Network Operations
    scope: "Operating, fault-finding and maintaining live telecom networks and their shared industry clearinghouse and fraud-prevention functions."
    examples: [network operations centre technician, cable and line splicing, cell site maintenance, inter-carrier settlement and fraud detection]
    status: live
  - id: amateur-radio
    name: Amateur Radio
    scope: "Operating amateur (ham) radio stations and equipment for communication, experimentation and emergency backup."
    examples: [HF/VHF operating, emergency communications nets, antenna building and tuning, contesting]
    status: live
