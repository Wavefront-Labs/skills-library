# Drawn from: ABMS/recognised medical specialty boards, ISCO-08 health-professional groups
# (221-226: physicians, nursing, allied health), and ISCED-F 2013 subject field 091 (Health),
# collapsed to the categories.yaml cover list (medicine, nursing, dentistry, pharmacy, allied
# health, massage, clinical psychology/psychiatry, public health, first aid, midwifery,
# nutrition, veterinary medicine, traditional/complementary healing, clinical administration).
category: health-medicine
fields:
  - id: family-and-general-medicine
    name: Family and General Medicine
    scope: "Primary, continuing and whole-person medical care across ages and conditions, including care of older adults."
    examples: [family medicine, primary care, geriatric medicine, hospitalist medicine]
    status: live
  - id: internal-medicine
    name: Internal Medicine
    scope: "Diagnosis and non-surgical treatment of adult disease across body systems, as a general and consultative specialty."
    examples: [general internal medicine, hospital medicine, consultative medicine, adult diagnostics]
    status: live
  - id: pediatrics
    name: Pediatrics
    scope: "Medical care of infants, children and adolescents, including development, growth and childhood illness."
    examples: [neonatology, pediatric primary care, adolescent medicine, developmental pediatrics]
    status: live
  - id: obstetrics-and-gynecology
    name: Obstetrics and Gynecology
    scope: "Medical and surgical care of pregnancy, childbirth and the female reproductive system."
    examples: [obstetrics, gynecologic surgery, maternal-fetal medicine, reproductive endocrinology]
    status: live
  - id: general-and-subspecialty-surgery
    name: General and Subspecialty Surgery
    scope: "Operative treatment of disease and injury, from general surgery through its named subspecialties."
    examples: [general surgery, orthopedic surgery, neurosurgery, cardiothoracic surgery, plastic surgery]
    status: live
  - id: anesthesiology
    name: Anesthesiology
    scope: "Managing pain, sedation and physiological stability during surgical and other invasive procedures."
    examples: [general anesthesia, regional anesthesia, pain management, critical care anesthesia]
    status: live
  - id: emergency-medicine
    name: Emergency Medicine
    scope: "Immediate assessment and treatment of acute illness and injury in an emergency or urgent-care setting."
    examples: [trauma care, urgent care, triage, resuscitation medicine]
    status: live
  - id: cardiology
    name: Cardiology
    scope: "Diagnosis and treatment of diseases of the heart and blood vessels."
    examples: [interventional cardiology, electrophysiology, heart failure management, echocardiography]
    status: live
  - id: oncology
    name: Oncology
    scope: "Diagnosis and treatment of cancer, including medical, surgical and radiation approaches."
    examples: [medical oncology, radiation oncology, surgical oncology, hematologic oncology]
    status: live
  - id: neurology
    name: Neurology
    scope: "Diagnosis and treatment of disorders of the brain, spinal cord, nerves and muscles."
    examples: [stroke medicine, epilepsy care, movement disorders, neuromuscular medicine]
    status: live
  - id: psychiatry
    name: Psychiatry
    scope: "Medical diagnosis, medication management and treatment of mental illness."
    examples: [general psychiatry, child and adolescent psychiatry, addiction psychiatry, forensic psychiatry]
    status: live
  - id: dermatology
    name: Dermatology
    scope: "Diagnosis and treatment of diseases of the skin, hair and nails."
    examples: [medical dermatology, dermatologic surgery, cosmetic dermatology, dermatopathology]
    status: live
  - id: radiology-and-medical-imaging
    name: Radiology and Medical Imaging
    scope: "Diagnostic interpretation of medical images and image-guided treatment."
    examples: [diagnostic radiology, interventional radiology, nuclear medicine imaging, ultrasonography]
    status: live
  - id: pathology-and-laboratory-medicine
    name: Pathology and Laboratory Medicine
    scope: "Diagnosing disease through examination of tissue, blood and other laboratory specimens."
    examples: [anatomic pathology, clinical pathology, cytopathology, medical microbiology]
    status: live
  - id: ophthalmology
    name: Ophthalmology
    scope: "Medical and surgical diagnosis and treatment of eye disease."
    examples: [cataract surgery, retinal disease, glaucoma management, corneal disease]
    status: live
  - id: otolaryngology
    name: Otolaryngology
    scope: "Medical and surgical treatment of the ear, nose, throat, head and neck."
    examples: [ENT surgery, head and neck oncology, otology, laryngology]
    status: live
  - id: urology
    name: Urology
    scope: "Medical and surgical treatment of the urinary tract and male reproductive system."
    examples: [urologic surgery, urologic oncology, kidney stone treatment, male infertility]
    status: live
  - id: endocrinology
    name: Endocrinology
    scope: "Diagnosis and treatment of hormonal and metabolic disorders."
    examples: [diabetes management, thyroid disease, metabolic bone disease, reproductive hormone disorders]
    status: live
  - id: gastroenterology
    name: Gastroenterology
    scope: "Diagnosis and treatment of diseases of the digestive system."
    examples: [endoscopy, liver disease, inflammatory bowel disease, hepatology]
    status: live
  - id: pulmonology
    name: Pulmonology
    scope: "Diagnosis and treatment of diseases of the lungs and respiratory system."
    examples: [asthma and COPD management, sleep medicine, critical care pulmonology, interventional bronchoscopy]
    status: live
  - id: nephrology-and-rheumatology
    name: Nephrology and Rheumatology
    scope: "Diagnosis and treatment of kidney disease and of autoimmune and inflammatory joint and connective-tissue disease."
    examples: [dialysis management, chronic kidney disease, rheumatoid arthritis treatment, lupus management]
    status: live
  - id: infectious-disease
    name: Infectious Disease
    scope: "Diagnosis and treatment of infections caused by bacteria, viruses, fungi and parasites."
    examples: [antimicrobial stewardship, HIV medicine, tropical medicine, hospital infection control]
    status: live
  - id: hematology
    name: Hematology
    scope: "Diagnosis and treatment of diseases of the blood and blood-forming organs."
    examples: [anemia treatment, clotting disorders, leukemia care, transfusion medicine]
    status: live
  - id: physical-medicine-and-rehabilitation
    name: Physical Medicine and Rehabilitation
    scope: "Medical diagnosis and treatment planning to restore function after injury, illness or disability."
    examples: [rehabilitation medicine, sports medicine, electrodiagnostics, spasticity management]
    status: live
  - id: nursing
    name: Nursing
    scope: "Direct patient assessment, care and monitoring across clinical settings, from bedside to advanced practice."
    examples: [bedside nursing, critical care nursing, nurse practitioner practice, community health nursing]
    status: live
  - id: dentistry
    name: Dentistry
    scope: "Diagnosis, treatment and prevention of diseases and conditions of the teeth, gums and mouth."
    examples: [general dentistry, orthodontics, oral surgery, endodontics]
    status: live
  - id: pharmacy
    name: Pharmacy
    scope: "Dispensing, compounding and clinical management of medications, including patient medication counselling."
    examples: [clinical pharmacy, compounding, medication therapy management, hospital pharmacy]
    status: live
  - id: midwifery
    name: Midwifery
    scope: "Care of women through pregnancy, labour, birth and the postpartum period."
    examples: [prenatal care, labour and delivery support, postpartum care, birth-centre midwifery]
    status: live
  - id: public-health
    name: Public Health
    scope: "Protecting and improving the health of populations through surveillance, prevention and health-policy practice."
    examples: [epidemiology practice, health promotion, disease surveillance, outbreak investigation]
    status: live
  - id: nutrition-and-dietetics
    name: Nutrition and Dietetics
    scope: "Assessing dietary needs and planning nutrition, including clinical medical nutrition therapy."
    examples: [clinical dietetics, sports nutrition, pediatric nutrition, nutritional counselling]
    status: live
  - id: clinical-psychology
    name: Clinical Psychology
    scope: "Assessment and non-medication psychological treatment of mental health conditions."
    examples: [psychotherapy, psychological testing and assessment, cognitive behavioral therapy, trauma treatment]
    status: live
  - id: physical-therapy
    name: Physical Therapy
    scope: "Restoring movement and function through exercise, manual therapy and rehabilitation techniques."
    examples: [orthopedic physical therapy, neurological rehabilitation, sports physiotherapy, pediatric physical therapy]
    status: live
  - id: occupational-therapy
    name: Occupational Therapy
    scope: "Helping people regain or adapt the skills needed for daily activities after injury, illness or disability."
    examples: [hand therapy, pediatric occupational therapy, workplace rehabilitation, sensory integration therapy]
    status: live
  - id: speech-language-pathology-and-audiology
    name: Speech-Language Pathology and Audiology
    scope: "Assessing and treating communication, swallowing and hearing disorders."
    examples: [speech therapy, swallowing therapy, audiology, hearing aid fitting]
    status: live
  - id: optometry
    name: Optometry
    scope: "Examining eyes for vision problems and prescribing corrective lenses and non-surgical eye treatment."
    examples: [vision testing, contact lens fitting, low-vision care, binocular vision therapy]
    status: live
  - id: podiatry
    name: Podiatry
    scope: "Medical and minor surgical care of the foot, ankle and lower limb."
    examples: [diabetic foot care, sports podiatry, orthotic fitting, nail surgery]
    status: live
  - id: complementary-and-traditional-medicine
    name: Complementary and Traditional Medicine
    scope: "Assessing and treating a named afflicted person using traditional, complementary or ritual healing practices."
    examples: [traditional Chinese medicine, acupuncture, naturopathy, herbal medicine, ritual healing]
    status: live
  - id: veterinary-medicine
    name: Veterinary Medicine
    scope: "Diagnosis, treatment and surgical care of animal disease and injury."
    examples: [small animal practice, large animal practice, veterinary surgery, exotic animal medicine]
    status: live
  - id: emergency-medical-services-and-first-aid
    name: Emergency Medical Services and First Aid
    scope: "Immediate, pre-hospital assessment and stabilising treatment of injury and illness, from lay first aid to paramedicine."
    examples: [paramedicine, CPR and first aid training, ambulance care, wilderness first response]
    status: live
  - id: medical-and-clinical-administration
    name: Medical and Clinical Administration
    scope: "Administrative and informatics work that needs clinical content knowledge: medical coding, billing, and insurance claims processing."
    examples: [medical coding, clinical billing, health information management, insurance claims review]
    status: live
  - id: allergy-and-immunology
    name: Allergy and Immunology
    scope: "Diagnosing and treating allergic, asthmatic and immune-system disorders."
    examples: [allergen immunotherapy, anaphylaxis management, immunodeficiency care, food allergy care]
    status: live
  - id: medical-genetics-and-genomics
    name: Medical Genetics and Genomics
    scope: "Diagnosing and managing inherited conditions and counselling patients and families on genetic risk."
    examples: [clinical genetics, genetic counselling, genomic test interpretation, prenatal genetic diagnosis]
    status: live
  - id: occupational-and-environmental-medicine
    name: Occupational and Environmental Medicine
    scope: "Preventing and treating work- and environment-related illness and certifying fitness for duty."
    examples: [occupational health assessment, aerospace medicine, undersea and hyperbaric medicine, fitness-for-work certification, toxic-exposure management]
    status: live
  - id: palliative-and-hospice-care
    name: Palliative and Hospice Care
    scope: "Symptom relief, comfort care and end-of-life clinical management for serious illness."
    examples: [hospice medicine, symptom management, advance-care planning, end-of-life clinical care]
    status: live
  - id: critical-care-medicine
    name: Critical Care Medicine
    scope: "Managing life-threatening organ failure in intensive-care settings."
    examples: [ICU management, mechanical ventilation, sepsis management, multi-organ support]
    status: live
  - id: allied-health-technologies
    name: Allied Health Technologies
    scope: "Operating clinical diagnostic and therapeutic technology on patients, the hands-on operator tier."
    examples: [radiography and MRI acquisition, respiratory therapy, cardiac perfusion, sonography acquisition, orthotics and prosthetics fitting]
    status: live
  - id: clinical-research-operations
    name: Clinical Research Operations
    scope: "Running clinical trials and drug-safety monitoring where clinical content knowledge is required."
    examples: [CRA site monitoring, study coordination, GCP compliance, pharmacovigilance and adverse-event assessment]
    status: live
