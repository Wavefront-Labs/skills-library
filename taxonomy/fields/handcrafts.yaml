# Drawn from: named craft guilds/trades (woodworking, blacksmithing, textile crafts), ISCO-08
# group 73 (handicraft and printing workers) and 731x/732x detail, and how practitioners name
# their own disciplines (e.g. "coopering", "bookbinding").
category: handcrafts
fields:
  - id: woodworking-joinery
    name: Woodworking & Joinery
    scope: "Shaping, joining and finishing wood into furniture, structures and objects by hand or hand-guided tool, outside paced production lines."
    examples: [furniture making, cabinetry, wood carving, marquetry, turnery]
    status: live
  - id: coopering
    name: Coopering
    scope: "Making and repairing wooden casks, barrels and tubs from staved construction."
    examples: [cask making, barrel raising, hooping, toasting and charring]
    status: live
  - id: wheelwrighting
    name: Wheelwrighting
    scope: "Building and repairing wooden (and wood-and-metal) wheels for carts, carriages and wagons."
    examples: [spoke shaping, wheel hooping, hub turning, tyring]
    status: live
  - id: boatbuilding
    name: Boatbuilding
    scope: "Hand-building and shaping small to mid-size wooden or composite boat hulls and fittings."
    examples: [clinker building, strip-plank construction, canoe building, spar making]
    status: live
  - id: blacksmithing
    name: Blacksmithing
    scope: "Shaping iron and steel by forging, hammering and heat treatment into tools, fittings and ironwork."
    examples: [forging, farriery-adjacent ironwork, ornamental ironwork, knifemaking, tool forging]
    status: live
  - id: metalsmithing-manual-welding
    name: Metalsmithing & Manual Welding
    scope: "Shaping, joining and finishing non-ferrous and sheet metal by hand tools, hand-guided welding or manual machining, for a whole individually made object."
    examples: [silversmithing, coppersmithing, sheet-metal fabrication, manual TIG/MIG welding, repousse]
    status: live
  - id: manual-machining
    name: Manual Machining
    scope: "Hand-operated lathe, mill and other machine-tool work to shape a single part or small batch, as a craft rather than a programmed production run."
    examples: [manual lathe turning, manual milling, fitting and filing, gunsmithing machine work]
    status: live
  - id: pottery-ceramics
    name: Pottery & Ceramics
    scope: "Forming, glazing and firing clay into functional or decorative vessels and objects."
    examples: [wheel throwing, hand-building, glaze chemistry, kiln firing, raku]
    status: live
  - id: glassblowing-glasswork
    name: Glassblowing & Glasswork
    scope: "Shaping molten or cold glass by hand into vessels, objects and decorative pieces."
    examples: [furnace glassblowing, lampworking, stained glass, glass fusing, glass engraving]
    status: live
  - id: weaving
    name: Weaving
    scope: "Interlacing thread or fibre on a loom or frame into cloth, rugs or structural textiles."
    examples: [handloom weaving, tapestry weaving, tablet weaving, rug weaving]
    status: live
  - id: spinning-fibre-arts
    name: Spinning & Fibre Preparation
    scope: "Turning raw fibre into yarn or thread, and preparing fibre for other textile crafts."
    examples: [hand spinning, wool carding, felting, fibre dyeing prep]
    status: live
  - id: knitting-crochet
    name: Knitting & Crochet
    scope: "Forming fabric from yarn by interlocking loops with needles or a hook."
    examples: [hand knitting, machine knitting (hand-tended), crochet, lace knitting]
    status: live
  - id: sewing-tailoring
    name: Sewing & Tailoring
    scope: "Cutting and joining fabric by hand or machine into garments and textile goods, fitted to an individual or pattern."
    examples: [bespoke tailoring, dressmaking, pattern drafting, quilting, embroidery]
    status: live
  - id: leatherwork
    name: Leatherwork
    scope: "Cutting, shaping, tooling and joining leather into goods."
    examples: [saddlery, leather tooling, bag and wallet making, bookbinding leatherwork, shoemaking]
    status: live
  - id: basketry
    name: Basketry
    scope: "Weaving or coiling plant fibre, cane, willow or similar material into baskets and woven objects."
    examples: [willow basketry, coiled basketry, chair caning, rush weaving]
    status: live
  - id: knots-lashing-cordage
    name: Knots, Lashing & Cordage
    scope: "Making and using rope, cord and knotted or lashed structures by hand."
    examples: [rope making, macrame, rigging knots, lashing, net making]
    status: live
  - id: jewellery-making
    name: Jewellery Making
    scope: "Shaping metal, stone and other materials by hand into wearable jewellery and small decorative objects."
    examples: [goldsmithing, lapidary setting, wire wrapping, enamelling, engraving]
    status: live
  - id: bookbinding
    name: Bookbinding
    scope: "Assembling, sewing and covering printed or blank pages into bound books."
    examples: [case binding, hand sewing, marbling endpapers, restoration binding, box making]
    status: live
  - id: stage-props-scenery-costume
    name: Stage Props, Scenery & Costume Craft
    scope: "Hand-building props, scenic elements and costumes for theatre, film and events."
    examples: [prop fabrication, scenic painting, costume construction, armour making, mask making]
    status: live
  - id: model-kit-building
    name: Model & Kit Building
    scope: "Hand-assembling and detailing scale models, dioramas and kits."
    examples: [scale modelling, diorama building, miniature painting, RC model building]
    status: live
  - id: soap-candle-making
    name: Soap & Candle Making
    scope: "Hand-tended batch transformation of fats, oils and waxes into soap and candles."
    examples: [cold-process soap, melt-and-pour soap, candle pouring, wick setting]
    status: live
  - id: natural-dyeing
    name: Natural Dyeing
    scope: "Hand-tended extraction and application of plant, mineral and other natural dyes to fibre and cloth."
    examples: [indigo dyeing, mordanting, shibori, eco printing]
    status: live
  - id: tanning
    name: Tanning
    scope: "Hand-tended batch processing of hide into leather."
    examples: [vegetable tanning, brain tanning, bark tanning, hide fleshing]
    status: live
  - id: perfumery
    name: Perfumery
    scope: "Hand-tended compounding of fragrance from essential oils, absolutes and aroma chemicals."
    examples: [scent blending, natural perfumery, enfleurage, formulation at craft scale]
    status: live
  - id: bronze-casting
    name: Bronze & Metal Casting
    scope: "Hand-tended melting and casting of metal into objects by lost-wax or sand-casting methods at craft scale."
    examples: [lost-wax casting, sand casting, bell founding, patination]
    status: live
  - id: taxidermy
    name: Taxidermy
    scope: "Preparing, preserving and mounting animal skins and forms for display."
    examples: [mammal mounting, bird mounting, fish replication, tanning for taxidermy]
    status: live
  - id: floristry
    name: Floristry
    scope: "Hand-arranging cut flowers and foliage into bouquets, arrangements and installations."
    examples: [bridal floristry, wreath making, floral installation, flower pressing]
    status: live
  - id: musical-instrument-making
    name: Musical Instrument Making
    scope: "Hand-building and voicing musical instruments across wood, metal, skin and string."
    examples: [luthiery, piano making, drum making, flute and whistle making, organ building]
    status: live
  - id: paper-crafts
    name: Papermaking and Paper Crafts
    scope: "Hand papermaking and shaping paper into objects."
    examples: [washi hand papermaking, origami, paper cutting (jianzhi), papier-mache, quilling]
    status: live
  - id: hand-printing
    name: Hand Printing
    scope: "Hand-pulled printing of text and images as a craft for use; art-intent printmaking is creative-arts, industrial press lines are manufacturing-production."
    examples: [letterpress, woodblock printing, screen printing, hand typesetting, block carving for print]
    status: live
  - id: stone-and-surface-decoration-crafts
    name: Stone Carving, Mosaic and Lacquerwork
    scope: "Hand-shaping stone into movable objects and building decorative surfaces by inlay or coating."
    examples: [stone carving, mosaic, lacquerware (urushi), intarsia and inlay, alabaster work]
    status: live
  - id: medical-dental-appliance-crafting
    name: Medical and Dental Appliance Crafting
    scope: "Hand-fabricating custom medical and dental devices to an individual's prescription."
    examples: [dental prosthetics fabrication, crown and bridge work, custom orthotic fabrication, ophthalmic lens grinding, hearing-mould making]
    status: live
