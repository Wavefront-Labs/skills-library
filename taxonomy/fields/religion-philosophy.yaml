# Drawn from major world-religion traditions (as grouped by comparative-religion references such
# as the World Religion Database/Pew classification) plus academic philosophy subfields (the
# APA/PhilPapers area taxonomy) and the esoteric-practice literature (divination, astrology, occultism).
category: religion-philosophy
fields:
  - id: christian-practice
    name: Christian Practice
    scope: "Worship, liturgy, sacraments and devotional practice across Christian traditions."
    examples: [Catholic Mass and sacraments, Orthodox liturgy, Protestant worship, prayer and devotion, pilgrimage]
    status: live
  - id: islamic-practice
    name: Islamic Practice
    scope: "Worship, ritual observance and devotional practice within Islam."
    examples: [salat, Quranic recitation, hajj, dhikr, Ramadan observance]
    status: live
  - id: jewish-practice
    name: Jewish Practice
    scope: "Worship, ritual observance and devotional practice within Judaism."
    examples: [prayer services, Shabbat observance, Torah study for faith, kashrut practice, life-cycle rituals]
    status: live
  - id: hindu-practice
    name: Hindu Practice
    scope: "Worship, ritual and devotional practice within Hindu traditions."
    examples: [puja, bhakti devotion, temple ritual, pilgrimage, yoga as spiritual practice]
    status: live
  - id: buddhist-practice
    name: Buddhist Practice
    scope: "Devotional, ritual and monastic practice within Buddhist traditions, as faith rather than secular technique."
    examples: [monastic ordination, sutra recitation for faith, devotional ritual, pilgrimage, merit-making]
    status: live
  - id: sikh-practice
    name: Sikh Practice
    scope: "Worship, ritual and devotional practice within Sikhism."
    examples: [Gurdwara worship, kirtan, langar service, Guru Granth Sahib recitation, Khalsa observance]
    status: live
  - id: jain-practice
    name: Jain Practice
    scope: "Worship, ritual and ascetic devotional practice within Jainism."
    examples: [ahimsa-based observance, temple ritual, fasting practice, pilgrimage, monastic discipline]
    status: live
  - id: taoist-and-confucian-practice
    name: Taoist and Confucian Practice
    scope: "Ritual, devotional and ceremonial practice within Taoist and Confucian traditions."
    examples: [temple ritual, ancestor veneration, Taoist ceremony, Confucian rites, divination within the tradition]
    status: live
  - id: shinto-practice
    name: Shinto Practice
    scope: "Worship, ritual and shrine practice within Shinto."
    examples: [shrine ritual, kami veneration, purification rites, festivals, offerings]
    status: live
  - id: indigenous-and-traditional-religious-practice
    name: Indigenous and Traditional Religious Practice
    scope: "Worship, ritual and spirit practice within indigenous and traditional religious systems."
    examples: [African traditional religion, Native American spiritual practice, Aboriginal Australian spirituality, animist practice, ancestor veneration]
    status: live
  - id: neopaganism-and-new-religious-movements
    name: Neopaganism and New Religious Movements
    scope: "Worship and ritual practice within modern pagan and newer religious movements."
    examples: [Wicca, Druidry, modern paganism, new age religious practice, syncretic faiths]
    status: live
  - id: chaplaincy-and-pastoral-ministry
    name: Chaplaincy and Pastoral Ministry
    scope: "The ritual, prayer and sacrament given within a chaplaincy or pastoral visit, across faith traditions."
    examples: [hospital chaplaincy rites, military chaplaincy, prison ministry sacraments, last rites, pastoral blessing]
    status: live
  - id: clergy-and-religious-leadership
    name: Clergy and Religious Leadership
    scope: "Ordained and lay leadership of a faith community's worship life and religious instruction."
    examples: [preaching, congregational leadership, ordination, religious instruction of the faithful, officiating rites of passage]
    status: live
  - id: divination-and-fortune-telling
    name: Divination and Fortune-Telling
    scope: "Seeking knowledge of the unknown or future through symbolic or ritual methods."
    examples: [tarot reading, I Ching, geomancy, scrying, rune casting]
    status: live
  - id: astrology
    name: Astrology
    scope: "Interpreting celestial positions for guidance on character, events or fortune."
    examples: [natal chart reading, horoscopes, electional astrology, synastry, Vedic astrology]
    status: live
  - id: esoteric-and-occult-practice
    name: Esoteric and Occult Practice
    scope: "Ceremonial and mystical practice outside mainstream religious institutions."
    examples: [ceremonial magic, Kabbalistic mysticism, Hermeticism, alchemy as esoteric practice, spirit mediumship]
    status: live
  - id: western-philosophy
    name: Western Philosophy
    scope: "The practised discipline of Western philosophical traditions and their schools."
    examples: [Stoicism as a philosophical school, existentialism, analytic philosophy, metaphysics, epistemology]
    status: live
  - id: eastern-and-comparative-philosophy
    name: Eastern and Comparative Philosophy
    scope: "The practised discipline of Eastern philosophical traditions and cross-tradition comparative philosophy."
    examples: [Confucian philosophy, Buddhist philosophy, Taoist philosophy, Vedanta, comparative philosophy]
    status: live
  - id: applied-ethics-and-bioethics
    name: Applied Ethics and Bioethics
    scope: "Practising ethics as a discipline applied to real decisions, including bioethics consultation."
    examples: [clinical ethics consults, ethics committee service, moral reasoning in practice, applied normative ethics, professional ethics advising]
    status: live
  - id: minority-world-religions
    name: Minority and Other World Religions
    scope: "Worship and observance within established world religions not covered by a named field."
    examples: [Zoroastrian fire-temple ritual, Baha'i devotional practice, Druze observance, Yazidi observance, Mandaean practice]
    status: live
  - id: celebrancy-and-officiating
    name: Celebrancy and Ceremony Officiating
    scope: "Crafting and officiating weddings, funerals and rites of passage as a celebrant, sacred or secular."
    examples: [wedding officiating, funeral celebrancy, naming ceremonies, vow renewals, humanist congregational practice]
    status: live
