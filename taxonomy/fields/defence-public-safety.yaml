# Sources: military branch/occupation structure (army, navy, air force, special operations),
# SOC/ISCO protective-service occupation groups (SOC 33-xxxx, ISCO 54 protective services
# workers), and how security/investigative practitioners name their own specialisms.
category: defence-public-safety
fields:
  - id: land-warfare
    name: Land warfare
    scope: "Ground combat operations and the infantry, armour and artillery disciplines that conduct them, across every era."
    examples: [infantry tactics, armoured warfare, artillery, combat engineering, siege warfare]
    status: live
  - id: naval-warfare
    name: Naval warfare
    scope: "Combat and operational practice conducted at sea, including surface, subsurface and naval aviation operations."
    examples: [surface warfare, submarine warfare, carrier aviation operations, naval gunnery, amphibious assault]
    status: live
  - id: air-and-space-warfare
    name: Air and space warfare
    scope: "Combat and operational practice conducted in the air or space domain."
    examples: [fighter combat tactics, strategic bombing, air defence, close air support, military space operations]
    status: live
  - id: special-operations
    name: Special operations
    scope: "Unconventional and high-risk military missions conducted by specially trained forces."
    examples: [direct action raids, unconventional warfare, hostage rescue, special reconnaissance, counter-terrorism assault operations]
    status: live
  - id: military-planning-and-command
    name: Military planning and command
    scope: "Planning, commanding and coordinating a military campaign or operation, including its psychological-operations planning."
    examples: [operational planning, campaign strategy, command and control, psychological operations planning, logistics planning for operations]
    status: live
  - id: weapons-handling
    name: Weapons handling
    scope: "Operating and maintaining weapons for operational military or law-enforcement use, as distinct from test-firing to a specification or sport shooting."
    examples: [small-arms marksmanship, crew-served weapons operation, weapons maintenance in the field, ammunition handling, deployment of ordnance]
    status: live
  - id: intelligence-and-espionage
    name: Intelligence and espionage
    scope: "Collecting, analysing and acting on intelligence for military, security or criminal-justice purposes, including cyber operations conducted as part of a conflict or criminal investigation."
    examples: [HUMINT tradecraft, signals intelligence analysis, counterintelligence, offensive cyber operations, covert surveillance]
    status: live
  - id: policing-and-patrol
    name: Policing and patrol
    scope: "General law-enforcement patrol, response and coercive field enforcement by police officers."
    examples: [patrol procedure, traffic stops, arrest and use-of-force, community policing, crowd and riot control]
    status: live
  - id: criminal-investigation
    name: Criminal investigation
    scope: "Investigating crimes to identify and build a case against offenders."
    examples: [detective work, interview and interrogation technique, case-building, cold-case investigation, undercover investigation]
    status: live
  - id: forensic-science
    name: Forensic science
    scope: "Applying scientific method to physical evidence for criminal investigation and prosecution."
    examples: [fingerprint analysis, DNA forensics, ballistics analysis, digital forensics for a criminal case, forensic pathology]
    status: live
  - id: customs-border-and-wildlife-enforcement
    name: Customs, border and wildlife enforcement
    scope: "Coercive field enforcement at borders and over regulated goods and protected species."
    examples: [customs search and seizure, border patrol, wildlife and poaching enforcement, smuggling interdiction, agricultural biosecurity enforcement]
    status: live
  - id: firefighting
    name: Firefighting
    scope: "Suppressing fires and the associated hazardous-conditions response."
    examples: [structural firefighting, wildland firefighting, hazmat response, fire investigation, aircraft rescue firefighting]
    status: live
  - id: emergency-and-disaster-management
    name: Emergency and disaster management
    scope: "Planning for, responding to and recovering from large-scale emergencies and disasters, including household preparedness."
    examples: [disaster response coordination, emergency operations centre management, household emergency preparedness, mass-casualty incident management, humanitarian emergency logistics coordination]
    status: live
  - id: search-and-rescue
    name: Search and rescue
    scope: "Locating and recovering people in distress or danger."
    examples: [wilderness search and rescue, urban search and rescue, water rescue, mountain rescue, swift-water rescue]
    status: live
  - id: corrections
    name: Corrections
    scope: "Custody, control and operation of correctional and detention facilities."
    examples: [prison officer duties, inmate supervision, facility security procedures, use-of-force in custody, transport of detainees]
    status: live
  - id: physical-and-access-security
    name: Physical and access security
    scope: "Designing, installing and operating freestanding or portable physical and access-control security, including against espionage and trade-secret theft."
    examples: [locksmithing security practice, access-control systems, executive/close protection, security guarding, counter-surveillance for industrial espionage]
    status: live
  - id: explosives-disposal
    name: Explosives disposal
    scope: "Locating, disarming and safely disposing of explosive ordnance and devices."
    examples: [improvised-device disposal, unexploded ordnance clearance, bomb-threat response, demining, render-safe procedures]
    status: live
  - id: investigative-locating-work
    name: Investigative locating work
    scope: "Locating people or assets for a legal, financial or security purpose, outside personal or family-reunification genealogy."
    examples: [skip tracing, fugitive and bail-jumper recovery, asset location for litigation, private investigation, process serving]
    status: live
  - id: criminal-tradecraft
    name: Criminal tradecraft
    scope: "Skills that exist only as a crime, kept as a defended-against discipline rather than a legitimate trade."
    examples: [pickpocketing, lock picking for burglary, confidence tricks and fraud schemes, counterfeiting, extortion]
    status: live
