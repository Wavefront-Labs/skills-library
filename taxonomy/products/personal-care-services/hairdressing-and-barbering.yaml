category: personal-care-services
field: hairdressing-and-barbering
products:
  - id: haircutting
    name: Haircutting
    kind: craft
    scope: "Cutting hair to a designed shape: sectioning, layering, graduation, texturising and precision scissor work."
    examples: [layering, graduation, texturising, one-length precision cuts]
    status: live
  - id: hair-colouring
    name: Hair Colouring
    kind: craft
    scope: "Colouring hair: formulation, lightening, toning, dimensional techniques and colour correction."
    examples: [colour formulation, balayage and foiling, toning, colour correction]
    status: live
  - id: chemical-texture-services
    name: Chemical Texture Services
    kind: craft
    scope: "Chemically changing hair texture: perming, relaxing, and keratin and smoothing systems."
    examples: [perm wrapping, relaxer application, keratin smoothing, strand testing]
    status: live
  - id: styling-and-finishing
    name: Styling and Finishing
    kind: craft
    scope: "Styling and finishing hair without cutting it: blow-drying, heat styling, setting and occasion updos."
    examples: [blow-dry technique, hot-tool styling, updos, braiding]
    status: live
  - id: barbering-and-shaving
    name: Barbering and Shaving
    kind: craft
    scope: "Traditional barbering: fades and tapers, beard design and trimming, and straight-razor wet shaving."
    examples: [fades and tapers, beard shaping, hot-towel wet shave, razor line-ups]
    status: live
  - id: hair-extensions-and-wigs
    name: Hair Extensions and Wigs
    kind: craft
    scope: "Adding hair: extension application and removal, weaves, and wig fitting, cutting and care."
    examples: [tape and bond extensions, weaving, wig fitting, blending added hair]
    status: live
  - id: scalp-and-hair-treatments
    name: Scalp and Hair Treatments
    kind: craft
    scope: "Treating the scalp and hair condition for cosmetic and wellbeing purposes: conditioning, scalp massage and treatment services."
    examples: [deep conditioning, scalp massage, dandruff and oil-balance services]
    status: live
  - id: clipper-systems
    name: Clipper Systems
    kind: application
    scope: "Working with clipper and trimmer systems: guard systems, blade care, clipper-over-comb and freehand clipper technique."
    examples: [guard-length systems, clipper-over-comb, blade maintenance, freehand sculpting]
    status: live
