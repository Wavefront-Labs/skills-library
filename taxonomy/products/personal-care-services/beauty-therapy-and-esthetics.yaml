category: personal-care-services
field: beauty-therapy-and-esthetics
products:
  - id: skin-analysis-and-consultation
    name: Skin Analysis and Consultation
    kind: craft
    scope: "Assessing a client's skin type, condition and contraindications and planning a treatment and home-care programme."
    examples: [skin typing, contraindication screening, treatment planning, home-care advice]
    status: live
  - id: facial-treatments
    name: Facial Treatments
    kind: craft
    scope: "Performing facials: cleansing, exfoliation, extraction, massage and mask work matched to skin condition."
    examples: [classic facials, extractions, facial massage, mask selection]
    status: live
  - id: chemical-peels
    name: Chemical Peels and Resurfacing
    kind: craft
    scope: "Cosmetic chemical exfoliation within esthetic scope: peel selection, application, neutralising and aftercare."
    examples: [AHA and BHA peels, enzyme peels, layering protocols, post-peel care]
    status: live
  - id: waxing-and-hair-removal
    name: Waxing and Hair Removal
    kind: craft
    scope: "Temporary hair removal: strip and hot waxing, sugaring and threading across face and body areas."
    examples: [strip waxing, hot wax, sugaring, threading, intimate waxing]
    status: live
  - id: lash-services
    name: Lash Services
    kind: craft
    scope: "Lash work: extension application and infills, lash lifts and tinting."
    examples: [classic and volume extensions, infills, lash lifts, tinting]
    status: live
  - id: brow-services
    name: Brow Services
    kind: craft
    scope: "Shaping and defining eyebrows: mapping, tweezing and waxing, tinting and lamination."
    examples: [brow mapping, shaping, tinting, lamination]
    status: live
  - id: spray-tanning
    name: Spray Tanning
    kind: craft
    scope: "Applying sunless tanning: skin preparation, solution selection and even spray application."
    examples: [skin prep, solution matching, even application, contouring]
    status: live
  - id: esthetic-machines
    name: Esthetic Machines
    kind: application
    scope: "Operating electrical esthetic equipment: microdermabrasion, high-frequency, galvanic, LED and steamer units."
    examples: [microdermabrasion, high-frequency, LED therapy, facial steamers]
    status: live
