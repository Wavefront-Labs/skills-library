category: personal-care-services
field: sfx-and-prosthetic-makeup
products:
  - id: lifecasting-and-moulding
    name: Lifecasting and Moulding
    kind: craft
    scope: "Capturing the performer: lifecasting faces and body parts, and making the moulds prosthetics are run from."
    examples: [face casting, alginate and silicone casting, mould making, flashing and cutting edges]
    status: live
  - id: prosthetic-sculpting-and-fabrication
    name: Prosthetic Sculpting and Fabrication
    kind: craft
    scope: "Sculpting and running prosthetic appliances: clay sculpture, texture work, and casting in silicone, foam latex and encapsulated materials."
    examples: [appliance sculpting, skin texture, foam latex running, encapsulated silicone]
    status: live
  - id: prosthetic-application
    name: Prosthetic Application and Blending
    kind: craft
    scope: "Applying appliances to the performer: adhesion, edge blending, intrinsic and extrinsic colouring, and safe removal."
    examples: [appliance gluing, edge blending, painting prosthetics, removal and skin care]
    status: live
  - id: wounds-and-trauma-effects
    name: Wounds and Trauma Effects
    kind: craft
    scope: "Out-of-kit injury effects: cuts, bruises, burns, blood rigs and gore built directly on the skin."
    examples: [bruising, cuts and gashes, burns, blood work]
    status: live
  - id: ageing-and-character-makeup
    name: Ageing and Character Makeup
    kind: craft
    scope: "Transforming the performer's apparent age or identity: stretch-and-stipple ageing, stippling, and character likeness work."
    examples: [old-age makeup, stretch and stipple, character likeness, subtle transformation]
    status: live
  - id: creature-and-fantasy-makeup
    name: Creature and Fantasy Makeup
    kind: craft
    scope: "Full creature and fantasy transformations: multi-piece appliances, body painting and non-human design on a performer."
    examples: [creature suits of appliances, fantasy body paint, full-head transformations]
    status: live
  - id: bald-caps-and-hair-work
    name: Bald Caps and Hair Work
    kind: craft
    scope: "Hair effects for makeup: bald cap application, laying facial hair, and punching and dressing prosthetic hair."
    examples: [bald caps, laid-on beards, hair punching, wig and hairline blends]
    status: live
  - id: on-set-continuity
    name: On-Set Continuity and Procedure
    kind: craft
    scope: "Keeping effects consistent and the set moving: continuity across takes and days, maintenance, and reapplication under schedule."
    examples: [continuity photography, makeup maintenance, multi-day reapplication, set etiquette]
    status: live
