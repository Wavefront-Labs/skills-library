    name: Tattoo Design and Composition
    kind: craft
    scope: "Designing tattoos for skin: composition on the body, stencil preparation, style conventions and cover-up design."
    examples: [flash and custom design, stencil making, placement composition, cover-up design]
    status: live
  - id: tattoo-application
    name: Tattoo Application Technique
    kind: craft
    scope: "Putting ink in skin: lining, shading, colour packing, needle depth and working different skin types."
    examples: [lining, black-and-grey shading, colour packing, skin-type adjustment]
    status: live
  - id: cosmetic-tattooing
    name: Cosmetic Tattooing
    kind: craft
    scope: "Permanent makeup and paramedical tattooing: microblading, lip and liner work, and areola and scar camouflage tattooing."
    examples: [microblading, powder brows, lip blush, areola restoration]
    status: live
  - id: henna-and-mehndi
    name: Henna and Mehndi
    kind: craft
    scope: "Temporary body art with henna and jagua: paste preparation, traditional mehndi patterns and freehand application."
    examples: [bridal mehndi, paste mixing, freehand pattern work, aftercare]
    status: live
  - id: scarification-and-branding
    name: Scarification and Branding
    kind: craft
    scope: "Body modification by controlled scarring: cutting and branding design, technique and healing management."
    examples: [cutting designs, branding, keloid-aware planning, healing management]
    status: live
  - id: studio-hygiene-and-aftercare
    name: Studio Hygiene and Aftercare
    kind: craft
    scope: "Keeping body-art work safe: bloodborne-pathogen control, station setup and breakdown, and client aftercare guidance."
    examples: [cross-contamination control, station setup, sharps handling, aftercare instruction]
    status: live
  - id: tattoo-machines
    name: Tattoo Machines
    kind: application
    scope: "Working with tattoo machines: coil and rotary setup, tuning, needle and cartridge configurations, and power supplies."
