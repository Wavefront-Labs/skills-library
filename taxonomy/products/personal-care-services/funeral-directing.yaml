category: personal-care-services
field: funeral-directing
products:
  - id: at-need-arranging
    name: At-Need Arranging
    kind: craft
    scope: "Meeting a bereaved family and arranging the funeral: the arrangement conference, choices, costs and the service plan."
    examples: [arrangement conferences, service planning, cost presentation, family liaison]
    status: live
  - id: pre-need-planning
    name: Pre-Need Planning
    kind: craft
    scope: "Arranging funerals in advance: pre-paid plans, recording wishes and keeping plans current until needed."
    examples: [pre-paid plans, recording wishes, plan reviews]
    status: live
  - id: burial-and-cremation-coordination
    name: Burial and Cremation Coordination
    kind: craft
    scope: "Coordinating the disposition: cemetery and crematorium bookings, committal logistics and graveside arrangements."
    examples: [cemetery liaison, crematorium booking, committal logistics, interment of ashes]
    status: live
  - id: cortege-and-transport-logistics
    name: Cortege and Transport Logistics
    kind: craft
    scope: "Running the funeral's movements: hearse and limousine scheduling, cortege routes and day-of coordination."
    examples: [hearse scheduling, cortege routing, bearer coordination, day-of timing]
    status: live
  - id: documentation-and-compliance
    name: Documentation and Compliance
    kind: craft
    scope: "The paperwork of death care: death registration, permits, cremation authorisations and regulatory compliance."
    examples: [death registration, burial and cremation permits, authorisations, statutory compliance]
    status: live
  - id: repatriation
    name: Repatriation of Remains
    kind: craft
    scope: "Moving the dead across borders: international shipping of remains, consular paperwork and airline coordination."
    examples: [international shipping, consular documentation, airline coordination, receiving repatriated remains]
    status: live
