category: personal-care-services
field: mobility-and-daily-living-support
products:
  - id: wheelchair-skills-training
    name: Wheelchair Skills Training
    kind: craft
    scope: "Teaching wheelchair users to handle their chair: propulsion, kerbs and ramps, wheelies and powerchair control."
    examples: [propulsion technique, kerb and ramp skills, wheelies, powerchair driving]
    status: live
  - id: prosthetic-use-coaching
    name: Prosthetic and Orthotic Use Coaching
    kind: craft
    scope: "Coaching everyday use of a fitted prosthesis or orthosis: donning and doffing, gait practice and daily-task use."
    examples: [donning and doffing, gait practice, daily-task use, skin and socket care routines]
    status: live
  - id: white-cane-orientation-and-mobility
    name: White-Cane Orientation and Mobility
    kind: craft
    scope: "Orientation and mobility with a long cane: cane technique, route learning, street crossings and environmental reading."
    examples: [two-point touch, route planning, street crossings, indoor navigation]
    status: live
  - id: guide-dog-handler-orientation
    name: Guide and Service Dog Handler Orientation
    kind: craft
    scope: "The handler's own orientation and travel with a finished guide or service animal: teamwork, commands and route work."
    examples: [handler teamwork, harness work, route travel, public-access routines]
    status: live
  - id: transfers-and-hoisting
    name: Transfers and Hoisting
    kind: craft
    scope: "Moving a person safely between surfaces: assisted transfers, slide sheets, hoists and slings."
    examples: [bed-to-chair transfers, slide sheets, hoist and sling use, fall-safe technique]
    status: live
  - id: daily-living-aids-training
    name: Daily-Living Aids Training
    kind: craft
    scope: "Training everyday use of adaptive aids: eating, dressing, kitchen and bathroom aids matched to the person's abilities."
    examples: [adaptive cutlery, dressing aids, kitchen aids, bathroom equipment use]
    status: live
