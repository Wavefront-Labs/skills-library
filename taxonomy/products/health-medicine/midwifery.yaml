category: health-medicine
field: midwifery
products:
  - id: antenatal-care
    name: Antenatal Care
    kind: craft
    scope: "Midwifery care through pregnancy: scheduled assessments, screening conversations, risk recognition and referral thresholds."
    examples: [antenatal assessment, screening discussions, risk recognition, referral decisions]
    status: live
  - id: labour-and-birth-care
    name: Labour and Birth Care
    kind: craft
    scope: "Supporting physiological labour and birth: labour assessment, intermittent auscultation, positioning and normal birth facilitation."
    examples: [labour assessment, intermittent auscultation, birth positions, perineal protection]
    status: live
  - id: obstetric-emergency-response
    name: Obstetric Emergency Response
    kind: craft
    scope: "The midwife's emergency drills: postpartum hemorrhage, shoulder dystocia, cord prolapse and newborn resuscitation first response."
    examples: [PPH response, shoulder dystocia manoeuvres, cord prolapse drill, newborn resuscitation]
    status: live
  - id: postpartum-care
    name: Postpartum Care
    kind: craft
    scope: "Care after birth: maternal recovery assessment, perineal care, mental-health surveillance and postpartum warning signs."
    examples: [postnatal checks, perineal care, mood screening, warning-sign education]
    status: live
  - id: newborn-assessment-and-care
    name: Newborn Assessment and Care
    kind: craft
    scope: "The well newborn in midwifery care: examination of the newborn, feeding establishment, jaundice surveillance and screening tests."
    examples: [newborn examination, jaundice monitoring, newborn screening, safe-sleep guidance]
    status: live
  - id: lactation-support
    name: Lactation Support
    kind: craft
    scope: "Establishing and troubleshooting breastfeeding: positioning and attachment, supply problems and feeding-plan support."
    examples: [attachment technique, supply management, nipple pain troubleshooting, feeding plans]
    status: live
  - id: birth-preparation-and-education
    name: Birth Preparation and Education
    kind: craft
    scope: "Preparing families for birth: childbirth education, birth-plan conversations and informed-choice discussions."
    examples: [childbirth classes, birth-plan discussions, informed choice conversations, pain-option education]
    status: live
