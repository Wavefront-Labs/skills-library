category: health-medicine
field: clinical-research-operations
products:
  - id: clinical-trial-site-monitoring
    name: Clinical Trial Site Monitoring
    kind: craft
    scope: "The CRA's work: site qualification and initiation, source-data verification, and monitoring visits that keep a site inspection-ready."
    examples: [site initiation, source-data verification, monitoring visit reports, issue escalation]
    status: live
  - id: study-coordination
    name: Study Coordination
    kind: craft
    scope: "Running a trial at the site: participant recruitment and screening, visit conduct per protocol, and investigational-product accountability."
    examples: [participant screening, visit scheduling, protocol adherence, drug accountability]
    status: live
  - id: informed-consent-and-participant-protection
    name: Informed Consent and Participant Protection
    kind: craft
    scope: "Protecting research participants: the consent conversation, eligibility judgement, and safeguarding vulnerable participants in trials."
    examples: [consent conversations, eligibility confirmation, re-consent management, vulnerable-participant safeguards]
    status: live
  - id: gcp-and-protocol-compliance
    name: GCP and Protocol Compliance
    kind: craft
    scope: "Good Clinical Practice in daily conduct: deviation identification and reporting, essential-document upkeep and audit and inspection readiness."
    examples: [deviation handling, essential documents, audit preparation, CAPA follow-up]
    status: live
  - id: pharmacovigilance-and-safety-assessment
    name: Pharmacovigilance and Safety Assessment
    kind: craft
    scope: "Drug-safety work needing clinical judgement: adverse-event assessment, causality and expectedness calls, and safety-signal evaluation."
    examples: [adverse-event assessment, causality determination, SAE reporting, signal evaluation]
    status: live
  - id: clinical-data-management
    name: Clinical Data Management
    kind: craft
    scope: "Keeping trial data clean: case-report-form design input, query management, medical coding of events and database-lock readiness."
    examples: [CRF review, query resolution, MedDRA coding, database lock]
    status: live
  - id: edc-and-ctms-systems
    name: EDC and CTMS Systems
    kind: application
    scope: "The software class of trial conduct: electronic data capture, trial-management and eTMF platforms."
    examples: [EDC data entry, CTMS tracking, eTMF filing, system audit trails]
    status: live
