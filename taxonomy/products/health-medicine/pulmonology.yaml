category: health-medicine
field: pulmonology
products:
  - id: respiratory-diagnosis
    name: Respiratory Diagnosis
    kind: craft
    scope: "Working up respiratory presentations: dyspnea and cough evaluation, chest imaging correlation and the pulmonary differential."
    examples: [dyspnea workup, chronic cough pathways, nodule evaluation, imaging correlation]
    status: live
  - id: airway-disease-management
    name: Airway Disease Management
    kind: craft
    scope: "Asthma and COPD care: inhaler strategy, exacerbation management, biologic therapy and severity-guided escalation."
    examples: [inhaler regimens, exacerbation management, asthma biologics, COPD escalation]
    status: live
  - id: interstitial-and-occupational-lung-disease
    name: Interstitial and Occupational Lung Disease
    kind: craft
    scope: "Diffuse parenchymal lung disease: ILD pattern diagnosis, antifibrotic therapy and exposure-related lung disease."
    examples: [ILD pattern recognition, multidisciplinary ILD diagnosis, antifibrotic therapy, exposure histories]
    status: live
  - id: sleep-medicine
    name: Sleep Medicine
    kind: craft
    scope: "Sleep-disordered breathing and sleep disorders: sleep-study interpretation, CPAP management and hypoventilation syndromes."
    examples: [polysomnography interpretation, CPAP titration, adherence management, hypoventilation care]
    status: live
  - id: bronchoscopy-and-interventional-pulmonology
    name: Bronchoscopy and Interventional Pulmonology
    kind: craft
    scope: "Endoscopy of the airways: diagnostic bronchoscopy, EBUS, transbronchial biopsy and therapeutic airway intervention."
    examples: [flexible bronchoscopy, EBUS staging, transbronchial biopsy, airway stenting]
    status: live
  - id: pulmonary-vascular-and-pleural-disease
    name: Pulmonary Vascular and Pleural Disease
    kind: craft
    scope: "Pulmonary embolism, pulmonary hypertension and pleural disease: risk-stratified PE care, effusion workup and pleural procedures."
    examples: [PE risk stratification, pulmonary hypertension workup, effusion analysis, chest drain and pleurodesis]
    status: live
  - id: home-and-noninvasive-ventilation
    name: Home and Noninvasive Ventilation
    kind: craft
    scope: "Ventilatory support outside the ICU: NIV initiation, home ventilation programmes and long-term oxygen therapy."
    examples: [NIV initiation, home ventilation setup, oxygen prescription, mask interface management]
    status: live
  - id: pulmonary-function-systems
    name: Pulmonary Function Systems
    kind: application
    scope: "Spirometry and full lung-function equipment: test performance standards, quality grading and interpretation workflows."
    examples: [spirometry quality, diffusion testing, lung volumes, interpretation algorithms]
    status: live
