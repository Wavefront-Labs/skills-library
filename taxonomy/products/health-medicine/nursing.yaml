category: health-medicine
field: nursing
products:
  - id: patient-assessment-and-monitoring
    name: Patient Assessment and Monitoring
    kind: craft
    scope: "The nurse's clinical eye: head-to-toe assessment, vital-sign trends, early-warning scoring and recognising deterioration first."
    examples: [head-to-toe assessment, vital-sign trending, early warning scores, escalation calls]
    status: live
  - id: medication-administration
    name: Medication Administration
    kind: craft
    scope: "Giving medicines safely: rights of administration, route-specific technique, high-alert drug practice and error prevention."
    examples: [administration rights, IV medication practice, high-alert drugs, double-check procedures]
    status: live
  - id: vascular-access-and-infusion-care
    name: Vascular Access and Infusion Care
    kind: craft
    scope: "Lines and infusions: peripheral cannulation, central-line care, infusion management and access-site surveillance."
    examples: [peripheral cannulation, central-line dressing care, infusion management, phlebitis surveillance]
    status: live
  - id: wound-and-skin-care
    name: Wound and Skin Care
    kind: craft
    scope: "Nursing care of wounds and skin: pressure-injury prevention and staging, dressing selection and chronic wound management."
    examples: [pressure-injury staging, dressing selection, wound assessment, prevention bundles]
    status: live
  - id: critical-care-nursing
    name: Critical Care Nursing
    kind: craft
    scope: "Nursing the critically ill: ventilated-patient care, titrating infusions against hemodynamics and ICU surveillance ratios."
    examples: [ventilated-patient care, vasoactive titration, sedation scoring, ICU monitoring]
    status: live
  - id: perioperative-nursing
    name: Perioperative Nursing
    kind: craft
    scope: "Nursing around surgery: scrub and circulating roles, counts and sterility, and recovery-room care."
    examples: [scrub technique, surgical counts, sterility maintenance, PACU recovery care]
    status: live
  - id: emergency-and-triage-nursing
    name: Emergency and Triage Nursing
    kind: craft
    scope: "Nursing in emergency care: triage decisions, rapid intervention and managing the waiting room's hidden risk."
    examples: [triage categorisation, rapid interventions, re-triage vigilance, violence de-escalation]
    status: live
  - id: advanced-practice-nursing
    name: Advanced Practice Nursing
    kind: craft
    scope: "Nurse practitioner and advanced practice: independent assessment, diagnosis and prescribing within scope of practice."
    examples: [NP consultations, prescribing practice, scope management, collaborative agreements]
    status: live
  - id: patient-education-and-discharge
    name: Patient Education and Discharge
    kind: craft
    scope: "Teaching patients and planning discharge: self-care education, teach-back technique and safe transitions home."
    examples: [teach-back method, discharge planning, self-care education, medication teaching]
    status: live
  - id: care-planning-and-documentation
    name: Care Planning and Documentation
    kind: craft
    scope: "The nursing process on paper: care plans, nursing diagnoses, shift handover and defensible documentation."
    examples: [care planning, nursing diagnoses, SBAR handover, documentation standards]
    status: live
  - id: infusion-pumps-and-bedside-devices
    name: Infusion Pumps and Bedside Devices
    kind: application
    scope: "The equipment of bedside nursing: infusion and syringe pumps, bedside monitors and alarm management."
    examples: [pump programming, drug libraries, monitor alarms, device troubleshooting]
    status: live
