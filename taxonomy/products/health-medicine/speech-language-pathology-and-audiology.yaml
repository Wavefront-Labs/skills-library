category: health-medicine
field: speech-language-pathology-and-audiology
products:
  - id: speech-and-language-assessment
    name: Speech and Language Assessment
    kind: craft
    scope: "Assessing communication: standardised and dynamic assessment of speech, language and fluency across ages."
    examples: [standardised testing, language sampling, fluency assessment, bilingual considerations]
    status: live
  - id: speech-sound-and-fluency-therapy
    name: Speech Sound and Fluency Therapy
    kind: craft
    scope: "Treating speech production: articulation and phonology therapy, motor-speech intervention and stuttering treatment."
    examples: [articulation therapy, phonological approaches, apraxia treatment, stuttering programmes]
    status: live
  - id: language-and-cognitive-communication-therapy
    name: Language and Cognitive-Communication Therapy
    kind: craft
    scope: "Treating language disorders: developmental language intervention, aphasia therapy and cognitive-communication rehabilitation."
    examples: [developmental language therapy, aphasia therapy, cognitive-communication rehab, discourse intervention]
    status: live
  - id: voice-therapy
    name: Voice Therapy
    kind: craft
    scope: "Treating voice disorders: perceptual and instrumental voice assessment, therapy techniques and vocal-load management."
    examples: [voice assessment, resonant voice therapy, vocal hygiene, professional-voice care]
    status: live
  - id: dysphagia-assessment-and-therapy
    name: Dysphagia Assessment and Therapy
    kind: craft
