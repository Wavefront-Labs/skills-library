    status: live
  - id: aac-systems
    name: AAC Systems
    kind: application
    scope: "Augmentative and alternative communication systems: device selection, vocabulary setup and implementation coaching."
    examples: [device trials, vocabulary configuration, access methods, partner training]
    status: live
