category: health-medicine
field: family-and-general-medicine
products:
  - id: primary-care-diagnosis
    name: Primary Care Diagnosis
    kind: craft
    scope: "Working up undifferentiated presentations in primary care: history, examination and differential diagnosis across all ages and body systems."
    examples: [undifferentiated symptoms, red-flag recognition, watchful waiting, diagnostic uncertainty]
    status: live
  - id: chronic-disease-management
    name: Chronic Disease Management
    kind: craft
    scope: "Longitudinal management of chronic conditions in primary care: hypertension, diabetes, asthma, depression and multimorbidity over years of continuity."
    examples: [hypertension control, diabetes reviews, medication titration, annual care plans]
    status: live
  - id: preventive-care-and-screening
    name: Preventive Care and Screening
    kind: craft
    scope: "Age- and risk-appropriate prevention: screening programmes, immunisation schedules, lifestyle risk assessment and health checks."
    examples: [cancer screening intervals, adult immunisation, cardiovascular risk scoring, health checks]
    status: live
  - id: geriatric-care
    name: Geriatric Care
    kind: craft
    scope: "Medical care of older adults: comprehensive geriatric assessment, frailty, falls, polypharmacy review and cognitive decline."
    examples: [frailty assessment, falls workup, deprescribing, dementia screening]
    status: live
  - id: office-procedures
    name: Office Procedures
    kind: craft
    scope: "Minor procedures performed in the primary-care office: skin lesion removal, joint injections, wound closure, cryotherapy and IUD insertion."
    examples: [skin excisions, joint injections, suturing, cryotherapy]
    status: live
  - id: patient-communication-and-counselling
    name: Patient Communication and Counselling
    kind: craft
    scope: "The consultation itself as a skill: shared decision-making, behaviour-change counselling, breaking bad news and managing difficult consultations."
    examples: [shared decision-making, motivational interviewing, breaking bad news, consultation models]
    status: live
  - id: care-coordination-and-referral
    name: Care Coordination and Referral
    kind: craft
    scope: "Steering patients through the health system: referral decisions, specialist letters, results follow-up and coordinating care across providers."
    examples: [referral thresholds, specialist correspondence, results safety-netting, care transitions]
    status: live
  - id: ehr-charting
    name: EHR Charting
    kind: application
    scope: "Clinical documentation and order workflows in electronic health record systems as used in primary-care practice."
    examples: [encounter notes, problem lists, order entry, inbox management]
    status: live
