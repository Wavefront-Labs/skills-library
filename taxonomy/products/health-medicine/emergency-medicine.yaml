category: health-medicine
field: emergency-medicine
products:
  - id: triage-and-initial-assessment
    name: Triage and Initial Assessment
    kind: craft
    scope: "Sorting and first-assessing emergency presentations: triage scales, rapid primary assessment and recognising the sickest patient in the room."
    examples: [triage scales, primary survey, early warning scores, queue management]
    status: live
  - id: resuscitation
    name: Resuscitation
    kind: craft
    scope: "Restoring and stabilising vital function: cardiac arrest management, shock resuscitation and the structured resuscitation team."
    examples: [cardiac arrest algorithms, shock resuscitation, team leadership, post-arrest care]
    status: live
  - id: emergency-differential-diagnosis
    name: Emergency Differential Diagnosis
    kind: craft
    scope: "Diagnosis under time pressure: ruling out the deadly causes of chest pain, dyspnea, headache, abdominal pain and altered consciousness."
    examples: [worst-first differentials, chest pain pathways, risk stratification tools, safe discharge decisions]
    status: live
  - id: trauma-management
    name: Trauma Management
    kind: craft
    scope: "Systematic care of the injured patient: trauma surveys, hemorrhage control, imaging decisions and trauma-team coordination."
    examples: [primary and secondary survey, hemorrhage control, trauma imaging decisions, transfer criteria]
    status: live
  - id: emergency-procedures
    name: Emergency Procedures
    kind: craft
    scope: "The emergency physician's procedural set: rapid-sequence intubation, chest drains, fracture reduction, wound repair and procedural sedation."
    examples: [rapid-sequence intubation, chest drains, fracture and dislocation reduction, wound repair]
    status: live
  - id: point-of-care-ultrasound
    name: Point-of-Care Ultrasound
    kind: craft
    scope: "Bedside ultrasound to answer focused clinical questions: FAST exams, cardiac and lung windows, and procedural guidance."
    examples: [FAST exam, focused cardiac views, lung ultrasound, vascular access guidance]
    status: live
  - id: toxicology-and-envenomation
    name: Toxicology and Envenomation
    kind: craft
    scope: "Managing poisoning, overdose and envenomation: toxidrome recognition, decontamination, antidotes and supportive care."
    examples: [toxidrome recognition, antidote use, overdose management, envenomation care]
    status: live
  - id: pediatric-emergencies
    name: Pediatric Emergencies
    kind: craft
    scope: "Emergency care of children: age-adjusted assessment, weight-based dosing, pediatric resuscitation and the critically ill child."
    examples: [pediatric assessment triangle, weight-based dosing, pediatric resuscitation, croup and bronchiolitis emergencies]
    status: live
  - id: disposition-and-handover
    name: Disposition and Handover
    kind: craft
    scope: "Deciding what happens next: admit-versus-discharge judgement, safety-netting, referral negotiation and structured handover."
    examples: [admission decisions, safety-netting, specialty referral, shift handover]
    status: live
