category: health-medicine
field: palliative-and-hospice-care
products:
  - id: pain-and-symptom-management
    name: Pain and Symptom Management
    kind: craft
    scope: "Relieving the symptoms of serious illness: pain, breathlessness, nausea and agitation management, including opioid titration and rotation."
    examples: [opioid titration, breathlessness management, nausea control, syringe-driver prescribing]
    status: live
  - id: serious-illness-communication
    name: Serious Illness Communication
    kind: craft
    scope: "The conversations of palliative care: prognosis discussion, goals-of-care elicitation and family-conference facilitation."
    examples: [prognosis conversations, goals-of-care elicitation, family conferences, conflict navigation]
    status: live
  - id: advance-care-planning
    name: Advance Care Planning
    kind: craft
    scope: "Planning ahead with patients: advance directives, treatment-limitation decisions and documenting wishes that travel with the patient."
    examples: [advance directives, resuscitation discussions, treatment-limitation orders, plan portability]
    status: live
  - id: end-of-life-care
    name: End-of-Life Care
    kind: craft
    scope: "Care in the final days: recognising dying, terminal-phase prescribing, de-escalating interventions and care after death."
    examples: [recognising dying, anticipatory prescribing, intervention de-escalation, care after death]
    status: live
  - id: hospice-and-community-palliative-care
    name: Hospice and Community Palliative Care
    kind: craft
    scope: "Palliative care outside the hospital: hospice admission criteria, home-based symptom management and out-of-hours planning."
    examples: [hospice eligibility, home visits, crisis medication kits, out-of-hours planning]
    status: live
  - id: pediatric-palliative-care
    name: Pediatric Palliative Care
    kind: craft
    scope: "Palliative care for children: symptom management in the young, parallel planning and supporting families through a child's illness."
    examples: [pediatric symptom control, parallel planning, family support conversations, sibling considerations]
    status: live
