category: health-medicine
field: pharmacy
products:
  - id: dispensing-and-verification
    name: Dispensing and Verification
    kind: craft
    scope: "The dispensing process: prescription verification, interaction and dose checking, and final-check accuracy."
    examples: [prescription verification, interaction screening, dose checking, final accuracy checks]
    status: live
  - id: clinical-pharmacy-practice
    name: Clinical Pharmacy Practice
    kind: craft
    scope: "Pharmacist-led medication optimisation: medication review, ward rounds, reconciliation and therapy recommendations."
    examples: [medication review, reconciliation, ward-round interventions, deprescribing input]
    status: live
  - id: pharmacokinetic-dosing
    name: Pharmacokinetic Dosing
    kind: craft
    scope: "Individualising doses: therapeutic drug monitoring, renal and hepatic adjustment, and kinetics-based regimen design."
    examples: [vancomycin dosing, TDM interpretation, renal adjustment, loading-dose calculation]
    status: live
  - id: sterile-compounding
    name: Sterile Compounding
    kind: craft
    scope: "Preparing sterile products: aseptic technique, IV admixtures, chemotherapy preparation and cleanroom practice."
    examples: [aseptic technique, IV admixture, chemotherapy compounding, cleanroom standards]
    status: live
  - id: nonsterile-compounding
    name: Nonsterile Compounding
    kind: craft
    scope: "Extemporaneous preparation: creams, suspensions and capsules compounded to formula with stability and beyond-use dating."
    examples: [formulation technique, suspension compounding, stability dating, documentation]
    status: live
  - id: patient-medication-counselling
    name: Patient Medication Counselling
    kind: craft
    scope: "Talking patients through their medicines: counselling points, adherence support, device teaching and OTC triage."
    examples: [counselling technique, inhaler teaching, adherence conversations, OTC recommendations]
    status: live
  - id: medication-safety
    name: Medication Safety
    kind: craft
    scope: "Preventing medication harm at system level: error analysis, high-alert safeguards, look-alike-sound-alike controls and reporting."
    examples: [error analysis, high-alert safeguards, LASA controls, incident reporting]
    status: live
  - id: pharmacy-information-systems
    name: Pharmacy Information Systems
    kind: application
    scope: "Dispensing software, automated dispensing cabinets and pharmacy robotics: workflow, overrides and inventory control."
    examples: [dispensing workflow, cabinet overrides, robotic dispensing, inventory management]
    status: live
