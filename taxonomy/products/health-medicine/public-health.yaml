category: health-medicine
field: public-health
products:
  - id: disease-surveillance
    name: Disease Surveillance
    kind: craft
    scope: "Watching population health: surveillance system operation, case definitions, notifiable-disease reporting and signal detection."
    examples: [surveillance systems, case definitions, signal detection, notification workflows]
    status: live
  - id: outbreak-investigation
    name: Outbreak Investigation
    kind: craft
    scope: "Investigating and controlling outbreaks: the stepwise field investigation, case finding, analytic studies and control measures."
    examples: [outbreak steps, case-control studies, contact tracing, control measures]
    status: live
  - id: applied-epidemiology
    name: Applied Epidemiology
    kind: craft
    scope: "Epidemiologic method in practice: study design, measures of association, bias assessment and interpreting population health data."
    examples: [study design, rate calculation, bias assessment, data interpretation]
    status: live
  - id: health-promotion-and-education
    name: Health Promotion and Education
    kind: craft
    scope: "Changing population health behaviour: programme design, campaign content with health expertise, and community engagement."
    examples: [behaviour-change programmes, campaign content, community engagement, settings-based promotion]
    status: live
  - id: immunization-programmes
    name: Immunization Programmes
    kind: craft
    scope: "Running vaccination at population scale: programme planning, cold chain, coverage monitoring and outbreak-response immunisation."
    examples: [programme planning, cold-chain management, coverage monitoring, catch-up campaigns]
    status: live
  - id: community-health-assessment
    name: Community Health Assessment
    kind: craft
    scope: "Measuring a community's health needs: needs assessment, health-indicator analysis and priority setting for programmes."
    examples: [needs assessment, indicator analysis, priority setting, stakeholder consultation]
    status: live
  - id: health-policy-and-programme-evaluation
    name: Health Policy and Programme Evaluation
    kind: craft
    scope: "Public-health policy practice and evaluation: evidence briefs, intervention evaluation and programme improvement."
    examples: [policy briefs, programme evaluation, logic models, impact measurement]
    status: live
  - id: public-health-emergency-preparedness
    name: Public Health Emergency Preparedness
    kind: craft
    scope: "The health side of emergencies: epidemic preparedness planning, health-system surge and public-health incident response."
    examples: [epidemic preparedness, surge planning, incident management for health, risk communication]
    status: live
