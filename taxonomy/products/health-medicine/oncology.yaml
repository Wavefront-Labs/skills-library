category: health-medicine
field: oncology
products:
  - id: cancer-diagnosis-and-staging
    name: Cancer Diagnosis and Staging
    kind: craft
    scope: "Establishing and staging a cancer diagnosis: biopsy strategy, staging systems, prognostication and multidisciplinary tumor-board presentation."
    examples: [biopsy planning, TNM staging, prognostic assessment, tumor-board presentation]
    status: live
  - id: systemic-therapy
    name: Systemic Therapy
    kind: craft
    scope: "Treating cancer with drugs: chemotherapy regimens, targeted agents, immunotherapy, dosing, toxicity management and response assessment."
    examples: [regimen selection, dose modification, immunotherapy toxicity, response assessment]
    status: live
  - id: radiation-oncology
    name: Radiation Oncology
    kind: craft
    scope: "Treating cancer with radiation: treatment intent and dose decisions, target delineation, fractionation and managing radiation toxicity."
    examples: [treatment planning decisions, target delineation, fractionation schemes, toxicity management]
    status: live
  - id: surgical-oncology
    name: Surgical Oncology
    kind: craft
    scope: "The operative treatment of cancer: resection margins, lymph-node management, and sequencing surgery with systemic and radiation therapy."
    examples: [margin planning, nodal staging surgery, neoadjuvant sequencing, cytoreduction decisions]
    status: live
  - id: hematologic-oncology
    name: Hematologic Oncology
    kind: craft
    scope: "Cancers of blood and lymphoid tissue: leukemia, lymphoma and myeloma diagnosis and treatment, including cellular therapies."
    examples: [leukemia induction, lymphoma staging and therapy, myeloma management, CAR-T pathways]
    status: live
  - id: oncologic-emergencies
    name: Oncologic Emergencies
    kind: craft
    scope: "Recognising and managing cancer emergencies: neutropenic sepsis, cord compression, tumor lysis and hypercalcemia."
    examples: [neutropenic sepsis response, cord compression pathways, tumor lysis management, hypercalcemia treatment]
    status: live
  - id: survivorship-and-supportive-care
    name: Survivorship and Supportive Care
    kind: craft
    scope: "Care alongside and after cancer treatment: symptom control during therapy, late-effect surveillance and survivorship planning."
    examples: [nausea and pain control, late-effect surveillance, survivorship plans, fertility preservation referral]
    status: live
  - id: oncology-communication
    name: Oncology Communication
    kind: craft
    scope: "The conversations of cancer care: delivering a cancer diagnosis, discussing prognosis and treatment trade-offs, and transitions to palliative intent."
    examples: [breaking a cancer diagnosis, prognosis discussions, treatment trade-off counselling, transition conversations]
    status: live
  - id: radiation-therapy-systems
    name: Radiation Therapy Systems
    kind: application
    scope: "Linear accelerators, brachytherapy units and treatment-planning systems as the equipment class of radiation treatment."
    examples: [linac workflows, planning-system use, image-guided setup, brachytherapy afterloaders]
    status: live
