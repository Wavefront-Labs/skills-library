category: health-medicine
field: general-and-subspecialty-surgery
products:
  - id: preoperative-assessment-and-planning
    name: Preoperative Assessment and Planning
    kind: craft
    scope: "Deciding whether and how to operate: indications, risk assessment, operative planning and informed consent."
    examples: [operative indications, risk stratification, surgical planning, consent discussions]
    status: live
  - id: open-surgical-technique
    name: Open Surgical Technique
    kind: craft
    scope: "The foundational manual craft of open surgery: incision, exposure, dissection, hemostasis, suturing and wound closure."
    examples: [tissue handling, dissection planes, hemostasis, suturing and knot tying]
    status: live
  - id: minimally-invasive-surgery
    name: Minimally Invasive Surgery
    kind: craft
    scope: "Laparoscopic, endoscopic and robotic-assisted operating: access, camera work, instrument triangulation and conversion judgement."
    examples: [laparoscopic access, camera navigation, intracorporeal suturing, conversion decisions]
    status: live
  - id: general-abdominal-surgery
    name: General Abdominal Surgery
    kind: craft
    scope: "The general surgeon's core territory: hernia, gallbladder, appendix, bowel resection and the acute abdomen."
    examples: [hernia repair, cholecystectomy, bowel anastomosis, acute abdomen management]
    status: live
  - id: trauma-and-emergency-surgery
    name: Trauma and Emergency Surgery
    kind: craft
    scope: "Operative care of the injured and acutely ill: damage-control surgery, trauma laparotomy and emergency operative decision-making."
    examples: [trauma laparotomy, damage control, hemorrhage control, operative triage]
    status: live
  - id: orthopedic-surgery
    name: Orthopedic Surgery
    kind: craft
    scope: "Surgery of bones and joints: fracture fixation, arthroplasty, arthroscopy and spine procedures."
    examples: [fracture fixation, joint replacement, arthroscopy, spinal instrumentation]
    status: live
  - id: neurosurgery
    name: Neurosurgery
    kind: craft
    scope: "Surgery of the brain, spine and peripheral nerves: craniotomy, spinal decompression, tumor resection and neurotrauma."
    examples: [craniotomy, spinal decompression, tumor resection, ICP management surgery]
    status: live
  - id: cardiothoracic-surgery
    name: Cardiothoracic Surgery
    kind: craft
    scope: "Surgery of the heart, great vessels and chest: bypass grafting, valve surgery, lung resection and the use of cardiopulmonary bypass."
    examples: [coronary bypass, valve repair and replacement, lung resection, bypass management]
    status: live
  - id: vascular-surgery
    name: Vascular Surgery
    kind: craft
    scope: "Open and endovascular treatment of arteries and veins: aneurysm repair, bypass, endarterectomy and catheter-based intervention."
    examples: [aneurysm repair, peripheral bypass, carotid endarterectomy, endovascular stenting]
    status: live
  - id: plastic-and-reconstructive-surgery
    name: Plastic and Reconstructive Surgery
    kind: craft
    scope: "Reconstructing form and function: flaps and grafts, hand surgery, burn reconstruction and aesthetic procedures."
    examples: [flap design, skin grafting, hand surgery, breast reconstruction]
    status: live
  - id: postoperative-care
    name: Postoperative Care
    kind: craft
    scope: "Care after the operation: recovery pathways, complication recognition and management, drains and wounds, and return-to-theatre judgement."
    examples: [enhanced recovery, complication recognition, wound management, reoperation decisions]
    status: live
  - id: surgical-robotics-systems
    name: Surgical Robotics Systems
    kind: application
    scope: "Robotic surgical platforms: docking, console operation, instrument exchange and team workflow around the robot."
    examples: [docking and setup, console skills, instrument exchange, emergency undocking]
    status: live
