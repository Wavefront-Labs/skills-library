category: health-medicine
field: obstetrics-and-gynecology
products:
  - id: prenatal-care
    name: Prenatal Care
    kind: craft
    scope: "Care through pregnancy: scheduled antenatal assessment, screening, risk identification and management of common pregnancy problems."
    examples: [antenatal schedules, prenatal screening, gestational diabetes care, hypertension in pregnancy]
    status: live
  - id: labour-and-delivery-management
    name: Labour and Delivery Management
    kind: craft
    scope: "Managing labour and birth: labour progress assessment, fetal surveillance in labour, vaginal delivery and intrapartum emergencies."
    examples: [labour progress assessment, operative decision points, shoulder dystocia drills, postpartum hemorrhage response]
    status: live
  - id: obstetric-surgery
    name: Obstetric Surgery
    kind: craft
    scope: "The surgical side of obstetrics: cesarean delivery, operative vaginal delivery, perineal repair and surgical management of obstetric complications."
    examples: [cesarean technique, forceps and vacuum delivery, perineal repair, cesarean hysterectomy]
    status: live
  - id: maternal-fetal-medicine
    name: Maternal-Fetal Medicine
    kind: craft
    scope: "High-risk pregnancy care: maternal disease in pregnancy, fetal anomalies, multiple gestation and timing-of-delivery decisions."
    examples: [preeclampsia management, fetal growth restriction, multiple gestation care, delivery timing]
    status: live
  - id: gynecologic-diagnosis
    name: Gynecologic Diagnosis
    kind: craft
    scope: "Working up gynecologic complaints: abnormal bleeding, pelvic pain, pelvic masses and cervical screening follow-up."
    examples: [abnormal bleeding workup, pelvic pain assessment, colposcopy pathways, adnexal mass triage]
    status: live
  - id: gynecologic-surgery
    name: Gynecologic Surgery
    kind: craft
    scope: "Operative gynecology: hysteroscopy, laparoscopy, hysterectomy and pelvic-floor procedures."
    examples: [laparoscopic technique, hysterectomy approaches, hysteroscopic procedures, prolapse repair]
    status: live
  - id: reproductive-endocrinology-and-fertility
    name: Reproductive Endocrinology and Fertility
    kind: craft
    scope: "Fertility and reproductive hormone care: infertility workup, ovulation induction, assisted reproduction and menopause management."
    examples: [infertility workup, ovulation induction, IVF cycle management, menopause care]
    status: live
  - id: contraception-and-family-planning
    name: Contraception and Family Planning
    kind: craft
    scope: "Contraceptive care: method selection and counselling, long-acting device placement and pregnancy-options care."
    examples: [method counselling, IUD and implant placement, emergency contraception, options counselling]
    status: live
  - id: obstetric-ultrasound-systems
    name: Obstetric Ultrasound Systems
    kind: application
    scope: "Ultrasound platforms used in obstetric and gynecologic care: dating, anatomy surveys, growth scans and gynecologic imaging."
    examples: [dating scans, anatomy surveys, growth assessment, transvaginal imaging]
    status: live
  - id: fetal-monitoring-systems
    name: Fetal Monitoring Systems
    kind: application
    scope: "Electronic fetal monitoring equipment and the interpretation workflows built around it in labour and antenatal care."
    examples: [cardiotocography setup, tracing categories, antenatal testing, documentation workflow]
    status: live
