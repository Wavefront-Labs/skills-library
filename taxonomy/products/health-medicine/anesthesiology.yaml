category: health-medicine
field: anesthesiology
products:
  - id: preanesthetic-assessment
    name: Preanesthetic Assessment
    kind: craft
    scope: "Evaluating patients before anesthesia: airway assessment, risk grading, fasting and medication planning, and anesthetic choice."
    examples: [airway examination, ASA grading, medication management plans, anesthetic technique selection]
    status: live
  - id: general-anesthesia
    name: General Anesthesia
    kind: craft
    scope: "Conducting general anesthesia: induction, maintenance, emergence and the physiological management in between."
    examples: [induction technique, depth management, hemodynamic control, smooth emergence]
    status: live
  - id: airway-management
    name: Airway Management
    kind: craft
    scope: "Securing and rescuing the airway: mask ventilation, intubation, supraglottic devices, video laryngoscopy and difficult-airway algorithms."
    examples: [intubation technique, difficult-airway algorithms, video laryngoscopy, front-of-neck access]
    status: live
  - id: regional-anesthesia
    name: Regional Anesthesia
    kind: craft
    scope: "Nerve blocks and neuraxial anesthesia: spinal and epidural technique, ultrasound-guided peripheral blocks and local anesthetic safety."
    examples: [spinal and epidural technique, ultrasound-guided blocks, catheter techniques, local anesthetic toxicity response]
    status: live
  - id: sedation-and-monitored-care
    name: Sedation and Monitored Care
    kind: craft
    scope: "Procedural sedation and monitored anesthesia care outside full general anesthesia: depth titration, monitoring and rescue."
    examples: [sedation depth titration, procedural sedation, monitoring standards, rescue from oversedation]
    status: live
  - id: perioperative-pain-management
    name: Perioperative Pain Management
    kind: craft
    scope: "Managing acute and procedural pain: multimodal analgesia, opioid stewardship, patient-controlled analgesia and acute pain services."
    examples: [multimodal analgesia, PCA management, opioid-sparing strategies, acute pain rounds]
    status: live
  - id: obstetric-anesthesia
    name: Obstetric Anesthesia
    kind: craft
    scope: "Anesthesia for labour and childbirth: labour epidurals, cesarean anesthesia and the obstetric patient's altered physiology."
    examples: [labour epidurals, cesarean anesthesia, obstetric emergencies, maternal physiology]
    status: live
  - id: anesthetic-crisis-management
    name: Anesthetic Crisis Management
    kind: craft
    scope: "Recognising and managing intraoperative emergencies: anaphylaxis, malignant hyperthermia, massive hemorrhage and cardiac arrest under anesthesia."
    examples: [crisis algorithms, malignant hyperthermia response, massive transfusion, team crisis communication]
    status: live
  - id: anesthesia-workstations
    name: Anesthesia Workstations
    kind: application
    scope: "Anesthesia machines and integrated monitoring systems: machine checks, vaporisers, ventilator modes and alarm management."
    examples: [machine checkout, vaporiser use, ventilator settings, alarm configuration]
    status: live
