category: health-medicine
field: ophthalmology
products:
  - id: comprehensive-eye-examination
    name: Comprehensive Eye Examination
    kind: craft
    scope: "The ophthalmic examination: slit-lamp technique, fundoscopy, intraocular pressure and the systematic eye workup."
    examples: [slit-lamp examination, dilated fundoscopy, tonometry, visual field assessment]
    status: live
  - id: cataract-surgery
    name: Cataract Surgery
    kind: craft
    scope: "Cataract assessment and surgery: biometry and lens selection, phacoemulsification technique and complication management."
    examples: [biometry and IOL selection, phacoemulsification, capsule complications, postoperative care]
    status: live
  - id: retinal-disease-management
    name: Retinal Disease Management
    kind: craft
    scope: "Medical and surgical retina: diabetic retinopathy, macular degeneration, intravitreal injections and retinal detachment care."
    examples: [diabetic retinopathy grading, anti-VEGF therapy, intravitreal injection, detachment triage]
    status: live
  - id: glaucoma-management
    name: Glaucoma Management
    kind: craft
    scope: "Diagnosing and controlling glaucoma: pressure and nerve assessment, medical therapy ladders, laser and surgical options."
    examples: [optic nerve assessment, drop therapy ladders, laser trabeculoplasty, filtration surgery decisions]
    status: live
  - id: cornea-and-external-disease
    name: Cornea and External Disease
    kind: craft
    scope: "Diseases of the cornea and ocular surface: infections, dry eye, keratoconus and corneal transplantation."
    examples: [microbial keratitis, dry-eye management, keratoconus care, corneal grafting]
    status: live
  - id: oculoplastics-and-strabismus
    name: Oculoplastics and Strabismus
    kind: craft
    scope: "Surgery around and alignment of the eye: eyelid and lacrimal procedures, orbital disease and strabismus correction."
    examples: [eyelid surgery, lacrimal procedures, orbital assessment, strabismus surgery]
    status: live
  - id: neuro-ophthalmology
    name: Neuro-Ophthalmology
    kind: craft
    scope: "Vision problems of neurological origin: optic neuropathies, pupil and eye-movement disorders, and visual field interpretation."
    examples: [optic neuritis workup, pupil abnormalities, diplopia assessment, field defect localisation]
    status: live
  - id: ophthalmic-imaging-systems
    name: Ophthalmic Imaging Systems
    kind: application
    scope: "OCT, fundus photography and angiography platforms: acquisition, artifact recognition and longitudinal analysis."
    examples: [OCT acquisition, fundus photography, angiography reading, progression analysis]
    status: live
  - id: ophthalmic-laser-systems
    name: Ophthalmic Laser Systems
    kind: application
    scope: "Therapeutic lasers of eye care: YAG, retinal photocoagulation, SLT and refractive laser platforms."
    examples: [YAG capsulotomy, panretinal photocoagulation, SLT delivery, refractive platforms]
    status: live
