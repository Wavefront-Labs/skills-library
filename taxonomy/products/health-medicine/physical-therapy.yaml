category: health-medicine
field: physical-therapy
products:
  - id: physical-therapy-assessment
    name: Physical Therapy Assessment
    kind: craft
    scope: "The physiotherapy examination: movement analysis, outcome measures, special tests and clinical reasoning to a treatment plan."
    examples: [movement analysis, special tests, outcome measures, treatment planning]
    status: live
  - id: therapeutic-exercise-prescription
    name: Therapeutic Exercise Prescription
    kind: craft
    scope: "Exercise as treatment: dosing and progressing rehabilitation exercise, motor-control retraining and adherence design."
    examples: [exercise dosing, progression rules, motor-control drills, home programme design]
    status: live
  - id: manual-therapy
    name: Manual Therapy
    kind: craft
    scope: "Hands-on treatment techniques: joint mobilisation and manipulation, soft-tissue techniques and neural mobilisation."
    examples: [joint mobilisation, manipulation technique, soft-tissue work, neural mobilisation]
    status: live
  - id: orthopedic-rehabilitation
    name: Orthopedic Rehabilitation
    kind: craft
    scope: "Rehabilitating musculoskeletal injury and surgery: post-operative protocols, tendinopathy loading and spinal pain care."
    examples: [post-op protocols, tendinopathy loading, low back pain care, return-to-function criteria]
    status: live
  - id: neurological-rehabilitation
    name: Neurological Rehabilitation
    kind: craft
    scope: "Physiotherapy for neurological conditions: gait retraining, balance rehabilitation and task-specific training after stroke and in progressive disease."
    examples: [gait retraining, balance training, task-specific practice, Parkinson programmes]
    status: live
  - id: cardiopulmonary-rehabilitation
    name: Cardiopulmonary Rehabilitation
    kind: craft
    scope: "Physiotherapy for heart and lung conditions: cardiac and pulmonary rehab programmes, airway clearance and exercise testing."
    examples: [cardiac rehab, pulmonary rehab, airway clearance techniques, exercise testing]
    status: live
  - id: sports-physiotherapy
    name: Sports Physiotherapy
    kind: craft
    scope: "Physiotherapy in sport: acute injury management on and off field, return-to-sport testing and load management."
    examples: [pitch-side assessment, return-to-sport testing, load management, taping technique]
    status: live
  - id: pediatric-physical-therapy
    name: Pediatric Physical Therapy
    kind: craft
    scope: "Physiotherapy for children: developmental assessment, cerebral palsy management and play-based motor intervention."
    examples: [developmental assessment, CP management, play-based therapy, equipment recommendations]
    status: live
  - id: vestibular-rehabilitation
    name: Vestibular Rehabilitation
    kind: craft
    scope: "Treating dizziness and balance disorders: BPPV repositioning, vestibular assessment and habituation programmes."
    examples: [BPPV manoeuvres, vestibular assessment, habituation exercises, gaze stabilisation]
    status: live
