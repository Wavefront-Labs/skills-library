category: health-medicine
field: infectious-disease
products:
  - id: infection-diagnosis
    name: Infection Diagnosis
    kind: craft
    scope: "Working up suspected infection: fever evaluation, culture-driven diagnosis, source identification and fever of unknown origin."
    examples: [fever workup, source identification, culture interpretation, FUO evaluation]
    status: live
  - id: antimicrobial-therapy-and-stewardship
    name: Antimicrobial Therapy and Stewardship
    kind: craft
    scope: "Choosing and governing antimicrobials: empiric and directed therapy, de-escalation, resistance interpretation and stewardship programmes."
    examples: [empiric selection, de-escalation, resistance interpretation, stewardship rounds]
    status: live
  - id: hiv-medicine
    name: HIV Medicine
    kind: craft
    scope: "HIV care: antiretroviral therapy, opportunistic infection management, prevention including PrEP, and long-term HIV health."
    examples: [ART regimens, opportunistic infections, PrEP, resistance testing]
    status: live
  - id: tropical-and-travel-medicine
    name: Tropical and Travel Medicine
    kind: craft
    scope: "Infections of travel and the tropics: malaria diagnosis and treatment, returned-traveller workup and pre-travel consultation."
    examples: [malaria management, returned-traveller fever, travel vaccination, parasitic disease care]
    status: live
  - id: healthcare-infection-prevention
    name: Healthcare Infection Prevention
    kind: craft
    scope: "Preventing infection in healthcare settings: isolation precautions, outbreak response in facilities and device-related infection reduction."
    examples: [isolation precautions, facility outbreak response, line-infection prevention, hand-hygiene programmes]
    status: live
  - id: immunocompromised-host-infections
    name: Immunocompromised Host Infections
    kind: craft
    scope: "Infections in transplant, oncology and immunosuppressed patients: prophylaxis strategy, atypical presentations and invasive fungal disease."
    examples: [transplant prophylaxis, febrile neutropenia, invasive fungal disease, CMV management]
    status: live
  - id: bone-joint-and-deep-infections
    name: Bone, Joint and Deep Infections
    kind: craft
    scope: "Complex localized infections: endocarditis, osteomyelitis, prosthetic-joint infection and deep abscess management with long-course therapy."
    examples: [endocarditis management, osteomyelitis therapy, prosthetic-joint infection, OPAT planning]
    status: live
