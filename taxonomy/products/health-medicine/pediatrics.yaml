category: health-medicine
field: pediatrics
products:
  - id: pediatric-differential-diagnosis
    name: Pediatric Differential Diagnosis
    kind: craft
    scope: "Diagnosing illness in infants, children and adolescents: age-specific presentations, red flags and the sick-versus-well judgement."
    examples: [febrile child assessment, age-specific differentials, red-flag recognition, sick-vs-well triage]
    status: live
  - id: well-child-care
    name: Well-Child Care
    kind: craft
    scope: "Health supervision of the growing child: growth monitoring, developmental surveillance, anticipatory guidance and routine screening."
    examples: [growth charts, developmental milestones, anticipatory guidance, vision and hearing screening]
    status: live
  - id: childhood-immunization
    name: Childhood Immunization
    kind: craft
    scope: "Delivering childhood vaccination: schedules, catch-up planning, contraindications and vaccine-hesitancy conversations."
    examples: [schedule management, catch-up immunisation, contraindication screening, hesitancy counselling]
    status: live
  - id: neonatal-care
    name: Neonatal Care
    kind: craft
    scope: "Care of the newborn: delivery-room assessment, newborn examination, common neonatal problems and neonatal intensive care."
    examples: [newborn resuscitation, jaundice management, newborn examination, NICU care]
    status: live
  - id: pediatric-acute-care
    name: Pediatric Acute Care
    kind: craft
    scope: "Managing acute childhood illness and injury: respiratory distress, dehydration, fever workups and the deteriorating child."
    examples: [bronchiolitis management, fluid resuscitation, febrile infant workup, deterioration recognition]
    status: live
  - id: developmental-behavioral-pediatrics
    name: Developmental-Behavioral Pediatrics
    kind: craft
    scope: "Assessing and managing developmental and behavioural conditions: autism, ADHD, learning difficulties and developmental delay."
    examples: [developmental assessment, ADHD management, autism diagnosis pathways, school liaison]
    status: live
  - id: adolescent-medicine
    name: Adolescent Medicine
    kind: craft
