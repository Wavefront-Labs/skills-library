category: health-medicine
field: occupational-therapy
products:
  - id: occupational-assessment
    name: Occupational Assessment
    kind: craft
    scope: "Assessing what a person needs to do and can do: ADL and IADL assessment, standardised measures and goal setting around occupations."
    examples: [ADL assessment, standardised measures, occupational profiling, goal setting]
    status: live
  - id: adl-retraining
    name: ADL Retraining
    kind: craft
    scope: "Rebuilding daily-living skills: task analysis, graded practice, compensatory technique and energy conservation."
    examples: [task analysis, graded activity, compensatory techniques, energy conservation]
    status: live
  - id: hand-therapy
    name: Hand Therapy
    kind: craft
    scope: "Rehabilitation of the hand and upper limb: splinting and orthosis fabrication, tendon protocols and functional retraining."
    examples: [splint fabrication, tendon protocols, edema management, fine-motor retraining]
    status: live
  - id: cognitive-rehabilitation
    name: Cognitive Rehabilitation
    kind: craft
    scope: "Therapy for cognitive impairment in daily life: compensatory strategies, routine building and functional cognitive retraining."
    examples: [memory strategies, routine design, functional cognition tasks, errorless learning]
    status: live
  - id: pediatric-occupational-therapy
    name: Pediatric Occupational Therapy
    kind: craft
    scope: "OT for children: developmental and school-function assessment, fine-motor and self-care intervention, and family coaching."
    examples: [school-function assessment, fine-motor intervention, self-care training, family coaching]
    status: live
  - id: sensory-integration-therapy
    name: Sensory Integration Therapy
    kind: craft
    scope: "Assessing and treating sensory processing differences: sensory profiling, regulation strategies and sensory-informed intervention."
    examples: [sensory profiling, regulation strategies, sensory diets, environmental adaptation]
    status: live
  - id: home-and-equipment-modification
    name: Home and Equipment Modification
    kind: craft
    scope: "Prescribing the environment: home-safety assessment, equipment and wheelchair prescription, and modification recommendations for a clinical need."
    examples: [home assessments, equipment prescription, wheelchair seating, modification reports]
    status: live
  - id: work-rehabilitation-and-ergonomics
    name: Work Rehabilitation and Ergonomics
    kind: craft
    scope: "Returning people to work after illness or injury: functional capacity evaluation, graded return plans and clinical workplace adjustment."
    examples: [functional capacity evaluation, graded return-to-work, workstation adjustment, duty modification advice]
    status: live
