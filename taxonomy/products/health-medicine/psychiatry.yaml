category: health-medicine
field: psychiatry
products:
  - id: psychiatric-assessment-and-diagnosis
    name: Psychiatric Assessment and Diagnosis
    kind: craft
    scope: "The psychiatric interview and diagnostic formulation: mental state examination, diagnostic criteria and biopsychosocial formulation."
    examples: [mental state examination, diagnostic interviewing, differential formulation, collateral history]
    status: live
  - id: psychopharmacology
    name: Psychopharmacology
    kind: craft
    scope: "Medication treatment of mental illness: antidepressant, antipsychotic and mood-stabiliser strategy, switching, augmentation and side-effect management."
    examples: [antidepressant selection, antipsychotic management, lithium monitoring, treatment-resistance strategies]
    status: live
  - id: risk-assessment-and-crisis-care
    name: Risk Assessment and Crisis Care
    kind: craft
    scope: "Assessing and managing psychiatric risk: suicide and violence risk assessment, crisis intervention and involuntary-care decisions."
    examples: [suicide risk assessment, safety planning, crisis de-escalation, involuntary admission criteria]
    status: live
  - id: child-and-adolescent-psychiatry
    name: Child and Adolescent Psychiatry
    kind: craft
    scope: "Psychiatric care of young people: developmentally informed assessment, family involvement and prescribing in the young."
    examples: [developmental assessment, school and family liaison, pediatric prescribing, early psychosis recognition]
    status: live
  - id: addiction-psychiatry
    name: Addiction Psychiatry
    kind: craft
    scope: "Treating substance use disorders: withdrawal management, substitution and relapse-prevention pharmacotherapy, and co-occurring disorder care."
    examples: [withdrawal management, opioid agonist therapy, relapse-prevention medication, dual diagnosis care]
    status: live
  - id: consultation-liaison-psychiatry
    name: Consultation-Liaison Psychiatry
    kind: craft
    scope: "Psychiatry in the general hospital: delirium management, capacity assessment, and psychiatric care of the medically ill."
    examples: [delirium workup, capacity assessment, somatic symptom management, med-psych interface]
    status: live
  - id: forensic-psychiatry
    name: Forensic Psychiatry
    kind: craft
    scope: "Psychiatry at the legal interface: fitness and responsibility evaluations, risk reporting for courts and secure-setting care."
    examples: [fitness evaluations, court reporting, violence risk instruments, secure-unit care]
    status: live
  - id: neurostimulation-systems
    name: Neurostimulation Systems
    kind: application
    scope: "ECT, TMS and related neurostimulation equipment: patient selection workflows, treatment delivery and course management."
    examples: [ECT delivery, TMS protocols, seizure threshold titration, course monitoring]
    status: live
