category: health-medicine
field: pathology-and-laboratory-medicine
products:
  - id: surgical-pathology
    name: Surgical Pathology
    kind: craft
    scope: "Diagnosing disease from tissue: gross examination, histopathologic diagnosis, margins, grading and staging on specimens."
    examples: [grossing technique, histologic diagnosis, margin assessment, tumor grading]
    status: live
  - id: cytopathology
    name: Cytopathology
    kind: craft
    scope: "Diagnosis from cells: cervical screening cytology, fine-needle aspiration interpretation and rapid on-site evaluation."
    examples: [Pap test reading, FNA interpretation, rapid on-site evaluation, fluid cytology]
    status: live
  - id: autopsy-pathology
    name: Autopsy Pathology
    kind: craft
    scope: "The hospital post-mortem examination: technique, cause-of-death determination and clinicopathologic correlation."
    examples: [autopsy technique, cause-of-death reasoning, organ examination, autopsy reporting]
    status: live
  - id: clinical-chemistry
    name: Clinical Chemistry
    kind: craft
    scope: "The chemistry laboratory's diagnostic work: assay interpretation, reference intervals, interferences and method validation."
    examples: [assay interpretation, interference recognition, reference intervals, method validation]
    status: live
  - id: hematopathology
    name: Hematopathology
    kind: craft
    scope: "Laboratory diagnosis of blood and marrow disease: blood film and marrow morphology, flow cytometry and lymphoma pathology."
    examples: [blood film morphology, marrow interpretation, flow cytometry gating, lymphoma workup]
    status: live
  - id: medical-microbiology
    name: Medical Microbiology
    kind: craft
    scope: "Identifying infectious agents in the laboratory: culture and susceptibility interpretation, organism identification and result-driven clinical advice."
    examples: [culture interpretation, susceptibility reporting, organism identification, blood-culture workflows]
    status: live
  - id: molecular-pathology
    name: Molecular Pathology
    kind: craft
    scope: "Molecular diagnostics on patient specimens: tumor molecular profiling, PCR-based testing and interpretation of molecular results."
    examples: [tumor profiling, PCR assay interpretation, fusion detection, molecular reporting]
    status: live
  - id: transfusion-medicine-laboratory
    name: Transfusion Medicine Laboratory
    kind: craft
    scope: "The blood bank's work: compatibility testing, antibody identification, component selection and transfusion-reaction investigation."
    examples: [crossmatching, antibody panels, component selection, reaction workup]
    status: live
  - id: laboratory-quality-management
    name: Laboratory Quality Management
    kind: craft
    scope: "Keeping the laboratory's results right: quality control, proficiency testing, pre-analytic error control and accreditation readiness."
    examples: [QC rules, proficiency testing, pre-analytic error control, document control]
    status: live
  - id: laboratory-information-systems
    name: Laboratory Information Systems
    kind: application
    scope: "LIS and digital-pathology platforms: specimen tracking, result reporting workflows, interfaces and whole-slide imaging."
    examples: [specimen tracking, result verification, instrument interfaces, whole-slide imaging]
    status: live
