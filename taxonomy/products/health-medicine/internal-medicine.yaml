category: health-medicine
field: internal-medicine
products:
  - id: adult-differential-diagnosis
    name: Adult Differential Diagnosis
    kind: craft
    scope: "Clinical reasoning across adult disease: building and narrowing differentials from history, examination and investigations."
    examples: [problem representation, illness scripts, diagnostic schemas, avoiding anchoring]
    status: live
  - id: hospital-inpatient-management
    name: Hospital Inpatient Management
    kind: craft
    scope: "Running an adult inpatient service: admission workup, daily management, deterioration response and discharge planning."
    examples: [admission assessment, ward rounds, escalation decisions, discharge summaries]
    status: live
  - id: consultative-and-perioperative-medicine
    name: Consultative and Perioperative Medicine
    kind: craft
    scope: "Internal-medicine consultation for other services: perioperative risk assessment, medical optimisation and co-management of surgical patients."
    examples: [perioperative risk stratification, anticoagulation bridging, medical clearance, co-management]
    status: live
  - id: multimorbidity-and-pharmacotherapy
    name: Multimorbidity and Pharmacotherapy
    kind: craft
    scope: "Managing patients with multiple interacting conditions: prioritisation, drug interactions, polypharmacy and rational prescribing."
    examples: [polypharmacy review, drug-interaction management, prescribing cascades, treatment prioritisation]
    status: live
  - id: bedside-procedures
    name: Bedside Procedures
    kind: craft
    scope: "Procedures performed at the adult bedside: lumbar puncture, paracentesis, thoracentesis, central venous access and arterial lines."
    examples: [lumbar puncture, paracentesis, central lines, ultrasound guidance]
    status: live
  - id: diagnostic-test-interpretation
    name: Diagnostic Test Interpretation
    kind: craft
    scope: "Interpreting the internist's everyday data: laboratory panels, ECGs, blood gases and basic imaging in clinical context."
    examples: [electrolyte patterns, ECG reading, acid-base analysis, pre-test probability]
    status: live
  - id: inpatient-communication
    name: Inpatient Communication
    kind: craft
    scope: "Communication in hospital medicine: family meetings, handoffs between teams, goals-of-care discussions and documentation that carries the plan."
    examples: [structured handoffs, family meetings, goals-of-care conversations, consult etiquette]
    status: live
