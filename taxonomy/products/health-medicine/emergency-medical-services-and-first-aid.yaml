category: health-medicine
field: emergency-medical-services-and-first-aid
products:
  - id: first-aid-and-cpr
    name: First Aid and CPR
    kind: craft
    scope: "Lay and workplace first response: CPR and AED use, bleeding control, choking response and the recovery position."
    examples: [CPR technique, AED use, bleeding control, choking response]
    status: live
  - id: basic-life-support-ambulance-care
    name: Basic Life Support Ambulance Care
    kind: craft
    scope: "EMT-level prehospital care: patient assessment, oxygen and airway adjuncts, immobilisation and safe transport decisions."
    examples: [prehospital assessment, airway adjuncts, spinal precautions, transport decisions]
    status: live
  - id: paramedicine
    name: Paramedicine
    kind: craft
    scope: "Advanced prehospital care: field diagnosis, prehospital medications, advanced airway management and protocol-driven ALS."
    examples: [field diagnosis, drug protocols, advanced airways, 12-lead interpretation in the field]
    status: live
  - id: scene-management-and-mass-casualty-triage
    name: Scene Management and Mass Casualty Triage
    kind: craft
    scope: "Running the medical side of a scene: scene safety, multi-casualty triage systems and coordination with other responders."
    examples: [scene assessment, START triage, casualty flow, inter-agency handover]
    status: live
  - id: wilderness-and-remote-first-response
    name: Wilderness and Remote First Response
    kind: craft
    scope: "Medical care far from help: improvised treatment, prolonged field care, evacuation decisions and environment-specific emergencies."
    examples: [improvised splinting, prolonged field care, evacuation triggers, hypothermia management]
    status: live
  - id: emergency-medical-dispatch
    name: Emergency Medical Dispatch
    kind: craft
    scope: "The call-taker's clinical craft: protocol-based call triage, pre-arrival instructions and dispatch prioritisation."
    examples: [call triage protocols, telephone CPR coaching, priority dispatch, caller management]
    status: live
  - id: patient-handover-and-transport-care
    name: Patient Handover and Transport Care
    kind: craft
    scope: "Care in motion and at the door: en-route monitoring, deterioration management in transit and structured hospital handover."
    examples: [en-route monitoring, transport positioning, interfacility transfers, structured handover]
    status: live
  - id: defibrillators-and-ems-equipment
    name: Defibrillators and EMS Equipment
    kind: application
    scope: "The ambulance equipment class: monitor-defibrillators, extrication and immobilisation gear, and powered stretchers."
    examples: [monitor-defibrillator use, 12-lead acquisition, extrication equipment, stretcher operation]
    status: live
