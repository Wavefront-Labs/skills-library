category: health-medicine
field: cardiology
products:
  - id: cardiac-differential-diagnosis
    name: Cardiac Differential Diagnosis
    kind: craft
    scope: "Working up cardiovascular presentations: chest pain, dyspnea, syncope, palpitations and murmurs from history, examination and first-line tests."
    examples: [chest pain workup, syncope evaluation, murmur assessment, palpitations pathways]
    status: live
  - id: ecg-interpretation
    name: ECG Interpretation
    kind: craft
    scope: "Reading the electrocardiogram: rhythm analysis, ischemia patterns, conduction disease and the subtle traces that change management."
    examples: [rhythm analysis, STEMI recognition, conduction blocks, high-risk ECG patterns]
    status: live
  - id: acute-coronary-care
    name: Acute Coronary Care
    kind: craft
    scope: "Managing acute coronary syndromes and cardiac emergencies: reperfusion decisions, antithrombotic strategy and coronary-care-unit management."
    examples: [reperfusion pathways, antithrombotic selection, cardiogenic shock, CCU management]
    status: live
  - id: interventional-cardiology
    name: Interventional Cardiology
    kind: craft
    scope: "Catheter-based diagnosis and treatment: coronary angiography, angioplasty and stenting, and structural heart intervention."
    examples: [coronary angiography, PCI technique, access management, structural interventions]
    status: live
  - id: electrophysiology
    name: Electrophysiology
    kind: craft
    scope: "Diagnosing and treating heart rhythm disorders: arrhythmia mechanisms, ablation, and antiarrhythmic strategy."
    examples: [arrhythmia diagnosis, catheter ablation, antiarrhythmic selection, EP study interpretation]
    status: live
  - id: heart-failure-management
    name: Heart Failure Management
    kind: craft
    scope: "Longitudinal and acute care of heart failure: medication optimisation, decompensation management, device candidacy and advanced-therapy referral."
    examples: [guideline-directed therapy, decompensation management, device candidacy, transplant referral timing]
    status: live
  - id: preventive-cardiology
    name: Preventive Cardiology
    kind: craft
    scope: "Reducing cardiovascular risk: lipid management, hypertension strategy, risk scoring and cardiac rehabilitation prescription."
    examples: [risk scoring, lipid management, blood pressure strategy, cardiac rehabilitation]
    status: live
  - id: cardiac-imaging-interpretation
    name: Cardiac Imaging Interpretation
    kind: craft
    scope: "Reading cardiac imaging across modalities: echo studies, stress tests, cardiac CT and MRI in clinical context."
    examples: [echo reporting, stress test interpretation, cardiac CT reading, viability assessment]
    status: live
  - id: echocardiography-systems
    name: Echocardiography Systems
    kind: application
    scope: "Echocardiography platforms: acquisition of transthoracic and transesophageal studies, measurement packages and study workflow."
    examples: [standard views, Doppler measurement, TEE acquisition, strain packages]
    status: live
  - id: cardiac-rhythm-devices
    name: Cardiac Rhythm Devices
    kind: application
    scope: "Pacemakers, defibrillators and loop recorders as a device class: implantation support, programming, interrogation and remote monitoring."
    examples: [device programming, interrogation, remote monitoring, troubleshooting]
    status: live
