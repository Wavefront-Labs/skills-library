category: health-medicine
field: occupational-and-environmental-medicine
products:
  - id: fitness-for-duty-assessment
    name: Fitness for Duty Assessment
    kind: craft
    scope: "Certifying medical fitness for work: role-specific medical standards, functional assessment and fitness certification."
    examples: [pre-placement examinations, safety-critical standards, fitness certification, restriction writing]
    status: live
  - id: occupational-injury-and-illness-management
    name: Occupational Injury and Illness Management
    kind: craft
    scope: "Treating work-related conditions: occupational injury care, work-relatedness determination and graded return-to-work planning."
    examples: [injury management, work-relatedness assessment, return-to-work plans, treating-doctor reports]
    status: live
  - id: toxic-exposure-assessment
    name: Toxic Exposure Assessment
    kind: craft
    scope: "Clinical management of hazardous exposure: exposure history, biological monitoring interpretation and treatment of occupational and environmental poisoning."
    examples: [exposure histories, biological monitoring, heavy-metal management, chemical-incident care]
    status: live
  - id: health-surveillance-programmes
    name: Health Surveillance Programmes
    kind: craft
    scope: "Medical surveillance of exposed workers: statutory surveillance schedules, audiometry and spirometry programmes and trend response."
    examples: [surveillance schedules, occupational audiometry, respiratory surveillance, abnormal-result pathways]
    status: live
  - id: aerospace-medicine
    name: Aerospace Medicine
    kind: craft
    scope: "Medicine of flight and space: aircrew medical certification, altitude physiology and aeromedical decision-making."
    examples: [aviation medicals, hypoxia considerations, aeromedical dispositions, spaceflight medicine]
    status: live
  - id: undersea-and-hyperbaric-medicine
    name: Undersea and Hyperbaric Medicine
    kind: craft
    scope: "Diving and pressure medicine: dive-fitness assessment, decompression-illness treatment and hyperbaric oxygen therapy."
    examples: [dive medicals, decompression-illness management, chamber treatment tables, hyperbaric indications]
    status: live
  - id: disability-and-impairment-evaluation
    name: Disability and Impairment Evaluation
    kind: craft
    scope: "Independent medical evaluation: impairment rating against published guides, causation analysis and medicolegal reporting."
    examples: [impairment rating, causation analysis, independent examinations, medicolegal reports]
    status: live
