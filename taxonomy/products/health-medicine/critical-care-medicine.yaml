category: health-medicine
field: critical-care-medicine
products:
  - id: icu-assessment-and-triage
    name: ICU Assessment and Triage
    kind: craft
    scope: "Deciding who needs intensive care and what they need: ICU admission triage, severity scoring and the daily systems review."
    examples: [admission triage, severity scores, systems-based rounds, step-down decisions]
    status: live
  - id: mechanical-ventilation-management
    name: Mechanical Ventilation Management
    kind: craft
    scope: "Ventilating the critically ill: mode selection, lung-protective strategy, ARDS management and weaning to extubation."
    examples: [mode selection, lung-protective settings, ARDS strategies, weaning protocols]
    status: live
  - id: hemodynamic-and-shock-management
    name: Hemodynamic and Shock Management
    kind: craft
    scope: "Supporting the failing circulation: shock classification, fluid strategy, vasoactive drug titration and monitoring interpretation."
    examples: [shock classification, fluid responsiveness, vasopressor titration, monitor interpretation]
    status: live
  - id: sepsis-management
    name: Sepsis Management
    kind: craft
    scope: "The ICU's commonest killer: sepsis recognition, bundle-driven early treatment and source control coordination."
    examples: [sepsis recognition, bundle delivery, source control, antimicrobial timing]
    status: live
  - id: sedation-analgesia-and-delirium
    name: Sedation, Analgesia and Delirium
    kind: craft
    scope: "Keeping ICU patients comfortable and awake enough: sedation targets, analgesia-first strategies and delirium prevention and treatment."
    examples: [sedation scoring, analgosedation, delirium screening, sedation holds]
    status: live
  - id: renal-and-multi-organ-support
    name: Renal and Multi-Organ Support
    kind: craft
    scope: "Supporting failing organs in the ICU: continuous renal replacement, liver-failure care and coordinating multi-organ support."
    examples: [CRRT management, anticoagulation circuits, liver-failure care, support prioritisation]
    status: live
  - id: ecmo-and-mechanical-circulatory-support
    name: ECMO and Mechanical Circulatory Support
    kind: craft
    scope: "Extracorporeal support: ECMO candidacy, circuit management and the ventricular-assist and balloon-pump patient in the ICU."
    examples: [ECMO candidacy, circuit surveillance, VA versus VV decisions, weaning from support]
    status: live
  - id: icu-procedures
    name: ICU Procedures
    kind: craft
    scope: "Procedures of intensive care: central and arterial access, percutaneous tracheostomy, chest drains and bronchoscopy in the ICU."
    examples: [central access, percutaneous tracheostomy, chest drains, ICU bronchoscopy]
    status: live
  - id: icu-family-communication-and-ethics
    name: ICU Family Communication and Ethics
    kind: craft
    scope: "The human work of intensive care: family updates under uncertainty, treatment-limitation discussions and organ-donation conversations."
    examples: [family meetings, prognostic uncertainty, treatment-limitation discussions, donation conversations]
    status: live
  - id: mechanical-ventilators
    name: Mechanical Ventilators
    kind: application
    scope: "ICU ventilators as an equipment class: setup, mode configuration, waveform reading and alarm troubleshooting."
    examples: [ventilator setup, waveform analysis, alarm troubleshooting, circuit management]
    status: live
  - id: icu-monitoring-systems
    name: ICU Monitoring Systems
    kind: application
    scope: "Bedside and advanced hemodynamic monitoring platforms: invasive pressure setups, cardiac-output devices and alarm management."
    examples: [arterial-line setup, cardiac-output monitoring, alarm configuration, data trending]
    status: live
