category: natural-sciences
field: neuroscience
products:
  - id: electrophysiology
    name: Electrophysiology
    kind: craft
    scope: "Recording electrical activity of neurons: patch clamp, extracellular and multi-electrode recording, and spike analysis."
    examples: [patch clamp, multi-electrode arrays, spike sorting]
    status: live
  - id: neuroimaging
    name: Neuroimaging
    kind: craft
    scope: "Imaging brain structure and function: fMRI, EEG/MEG and PET study design, preprocessing and statistical analysis."
    examples: [fMRI analysis, EEG preprocessing, connectivity analysis]
    status: live
  - id: cellular-molecular-neuroscience
    name: Cellular & Molecular Neuroscience
    kind: craft
    scope: "Neurons at the bench: neuronal culture, synaptic biology, optogenetics and chemogenetics, and circuit-tracing tools."
    examples: [neuronal culture, optogenetics, viral tracing, synaptic assays]
    status: live
  - id: behavioural-neuroscience
    name: Behavioural Neuroscience
    kind: craft
    scope: "Linking brain to behaviour in animals: behavioural assays and apparatus, conditioning paradigms and behavioural scoring."
    examples: [maze tasks, fear conditioning, behavioural scoring, video tracking]
    status: live
  - id: cognitive-neuroscience
    name: Cognitive Neuroscience
    kind: craft
    scope: "Human cognition experiments: task design, psychophysics, combining behaviour with imaging or stimulation, and human-subject protocols."
    examples: [task design, psychophysics, TMS studies]
    status: live
  - id: computational-neuroscience
    name: Computational Neuroscience
    kind: craft
    scope: "Modelling brains: neuron and network models, neural data analysis methods and theory-driven simulation."
    examples: [spiking-network models, dimensionality reduction, encoding models]
    status: live
  - id: neuroanatomy-histology
    name: Neuroanatomy & Histology
    kind: craft
    scope: "The brain's structure on slides: sectioning, staining and immunohistochemistry, atlas registration and microscopy of neural tissue."
    examples: [brain sectioning, immunostaining, atlas registration]
    status: live
