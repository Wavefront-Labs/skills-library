  - id: spectroscopy
    name: Spectroscopy
    kind: craft
    scope: "Light as a measurement tool across disciplines: UV-Vis, IR, Raman, fluorescence and atomic spectroscopy, acquisition through interpretation."
    examples: [UV-Vis, FTIR, Raman, atomic absorption]
