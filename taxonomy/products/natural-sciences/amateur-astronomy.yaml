category: natural-sciences
field: amateur-astronomy
products:
  - id: telescope-observing
    name: Telescope Observing
    kind: craft
    scope: "Visual observing with telescopes and binoculars: choosing and collimating equipment, star-hopping, and observing planets, deep-sky objects and double stars."
    examples: [collimation, star-hopping, eyepiece selection, deep-sky observing]
    status: live
  - id: astrophotography
    name: Astrophotography
    kind: craft
    scope: "Imaging the night sky: mounts and guiding, camera settings, stacking and processing from nightscapes to deep-sky imaging."
    examples: [polar alignment, autoguiding, image stacking, narrowband imaging]
    status: live
  - id: solar-lunar-observing
    name: Solar & Lunar Observing
    kind: craft
    scope: "Observing the Sun and Moon safely: solar filters and hydrogen-alpha viewing, eclipses, lunar features and transits."
    examples: [solar filters, eclipse observing, lunar feature identification]
    status: live
  - id: variable-star-citizen-science
    name: Variable-Star & Citizen Science Observing
    kind: craft
    scope: "Amateur observations with scientific value: variable-star estimates, occultation timing, exoplanet transits and reporting to databases."
    examples: [magnitude estimation, AAVSO reporting, occultation timing]
    status: live
  - id: meteor-satellite-watching
    name: Meteor & Sky-Event Watching
    kind: craft
    scope: "Transient sky events without a telescope: meteor showers and counts, aurora, comets, satellite passes and naked-eye sky knowledge."
    examples: [meteor counts, aurora forecasting, satellite pass prediction]
    status: live
  - id: stellarium
    name: Stellarium
    kind: application
    scope: "Planning and learning the sky with Stellarium: session planning, object finding, telescope control and sky simulation."
    examples: [session planning, object search, telescope control]
    status: live
  - id: pixinsight
    name: PixInsight
    kind: application
    scope: "Processing astrophotos in PixInsight: calibration, integration, stretching and noise reduction workflows."
    examples: [image calibration, stacking, histogram stretching, noise reduction]
    status: live
