category: natural-sciences
field: astronomy-astrophysics
products:
  - id: observational-astronomy
    name: Observational Astronomy
    kind: craft
    scope: "Professional optical/IR observing: writing proposals, planning runs, operating instruments, and reducing imaging and spectroscopy data."
    examples: [observing proposals, data reduction, photometry, spectroscopy pipelines]
    status: live
  - id: radio-astronomy
    name: Radio Astronomy
    kind: craft
    scope: "Observing at radio wavelengths: single-dish and interferometric observing, calibration, imaging and interference mitigation."
    examples: [interferometry, CLEAN imaging, flux calibration, RFI mitigation]
    status: live
  - id: time-domain-astronomy
    name: Time-Domain Astronomy
    kind: craft
    scope: "The changing sky: transient detection and follow-up, variable-star and exoplanet light curves, and survey alert streams."
    examples: [light-curve analysis, transit detection, transient follow-up, period finding]
    status: live
  - id: planetary-science
    name: Planetary Science
    kind: craft
    scope: "Solar-system research: spacecraft and telescopic data analysis, surface and atmosphere studies, meteoritics and small bodies."
    examples: [spacecraft data analysis, crater counting, meteorite analysis, orbital dynamics]
    status: live
  - id: stellar-galactic-astrophysics
    name: Stellar & Galactic Astrophysics
    kind: craft
    scope: "Stars and galaxies as physics: stellar spectra and evolution models, stellar populations, galactic structure and interstellar medium."
    examples: [spectral classification, stellar models, galaxy morphology, ISM studies]
    status: live
  - id: cosmology
    name: Cosmology
    kind: craft
    scope: "The universe at large: CMB and large-scale-structure analysis, cosmological parameter estimation and survey statistics."
    examples: [CMB analysis, power spectra, parameter estimation, weak lensing]
    status: live
  - id: astrostatistics
    name: Astrostatistics & Survey Analysis
    kind: craft
    scope: "Statistical craft specific to astronomical data: selection effects, upper limits, Bayesian model fitting and catalogue cross-matching."
    examples: [selection effects, Bayesian fitting, cross-matching, upper limits]
    status: live
  - id: astropy
    name: Astropy
    kind: application
    scope: "The Astropy ecosystem for astronomical computing: coordinates, units, FITS handling, tables and affiliated packages."
    examples: [FITS I/O, coordinate transforms, units, photutils]
    status: live
  - id: ds9
    name: SAOImage DS9
    kind: application
    scope: "Inspecting astronomical images with DS9: scaling, regions, WCS overlays and multi-frame comparison."
    examples: [image scaling, region files, WCS alignment]
    status: live
