category: natural-sciences
field: ecology
products:
  - id: population-ecology
    name: Population Ecology
    kind: craft
    scope: "Dynamics of populations: abundance estimation, mark-recapture, demographic modelling and population viability analysis."
    examples: [mark-recapture, population models, viability analysis]
    status: live
  - id: community-ecology
    name: Community Ecology
    kind: craft
    scope: "Species together: diversity measurement, community composition analysis, species interactions and ordination methods."
    examples: [diversity indices, ordination, interaction networks]
    status: live
  - id: ecosystem-ecology
    name: Ecosystem Ecology
    kind: craft
    scope: "Energy and matter through ecosystems: productivity, nutrient cycling, carbon flux and decomposition studies."
    examples: [nutrient cycling, carbon flux, litter decomposition, productivity measurement]
    status: live
  - id: wildlife-survey-methods
    name: Wildlife & Vegetation Survey Methods
    kind: craft
    scope: "Counting nature in the field: transects and plots, camera traps, acoustic monitoring, eDNA sampling and telemetry."
    examples: [camera trapping, point counts, vegetation plots, radio telemetry, eDNA]
    status: live
  - id: statistical-ecology
    name: Statistical Ecology
    kind: craft
    scope: "Models fitted to ecological data: occupancy and distance sampling, species-distribution models and hierarchical models for detection."
    examples: [occupancy models, distance sampling, species-distribution models]
    status: live
  - id: landscape-spatial-ecology
    name: Landscape & Spatial Ecology
    kind: craft
    scope: "Ecology across space: habitat mapping and fragmentation analysis, connectivity modelling and spatial pattern analysis for research."
    examples: [fragmentation metrics, connectivity modelling, habitat mapping]
    status: live
  - id: conservation-biology
    name: Conservation Biology
    kind: craft
    scope: "The science behind conservation: threat assessment, extinction-risk analysis, reserve-design research and monitoring design."
    examples: [extinction-risk assessment, reserve design, monitoring programmes]
    status: live
  - id: behavioural-ecology
    name: Behavioural Ecology
    kind: craft
    scope: "Why animals do what they do: behavioural observation and sampling methods, experimental design for behaviour, and evolutionary interpretation."
    examples: [ethograms, focal sampling, behavioural experiments]
    status: live
