category: natural-sciences
field: birding
products:
  - id: field-identification
    name: Field Identification
    kind: craft
    scope: "Identifying birds by sight: field marks, GISS/jizz, plumages and moult, flight style and separating confusion species."
    examples: [field marks, plumage cycles, flight identification, confusion species]
    status: live
  - id: birdsong-identification
    name: Birdsong & Call Identification
    kind: craft
    scope: "Identifying birds by ear: learning songs and calls, mnemonics, nocturnal flight calls and recording technique."
    examples: [song learning, call mnemonics, nocturnal flight calls, sound recording]
    status: live
  - id: listing-twitching
    name: Listing & Twitching
    kind: craft
    scope: "The pursuit side of birding: keeping lists, big days and years, chasing rarities, and documenting records for review."
    examples: [list keeping, rarity documentation, big day strategy]
    status: live
  - id: bird-surveys-atlasing
    name: Bird Surveys & Atlasing
    kind: craft
    scope: "Structured counting as a hobbyist: breeding-bird atlases, Christmas counts, point counts and migration watches."
    examples: [point counts, atlasing protocols, migration counts]
    status: live
  - id: bird-photography-for-id
    name: Bird Photography for Identification
    kind: craft
    scope: "Photographing birds to document and identify them: fieldcraft, gear for distance and flight shots, and diagnostic photos."
    examples: [flight shots, diagnostic angles, fieldcraft and hides]
    status: live
  - id: ebird
    name: eBird
    kind: application
    scope: "Using eBird as a birder: checklists and protocols, exploring hotspots and bar charts, alerts and trip planning."
    examples: [checklist protocols, hotspot exploration, rare-bird alerts]
    status: live
  - id: merlin
    name: Merlin Bird ID
    kind: application
    scope: "Identifying birds with Merlin: sound ID in the field, photo ID and using packs and results critically."
    examples: [sound ID, photo ID, verifying suggestions]
    status: live
