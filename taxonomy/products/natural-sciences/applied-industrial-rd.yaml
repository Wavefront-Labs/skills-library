category: natural-sciences
field: applied-industrial-rd
products:
  - id: formulation-science
    name: Formulation Science
    kind: craft
    scope: "General craft of developing new formulations: design-of-experiments screening, ingredient interaction, scale-up readiness and stability."
    examples: [DoE screening, ingredient compatibility, prototype iteration]
    status: live
  - id: flavour-fragrance-chemistry
    name: Flavour & Fragrance Chemistry
    kind: craft
    scope: "Creating new flavours and fragrances: aroma-chemical palettes, accord building, sensory evaluation and brief-to-formula development."
    examples: [accord building, GC-O analysis, sensory panels, brief interpretation]
    status: live
  - id: food-science-formulation
    name: Food Science Formulation
    kind: craft
    scope: "Developing new food and drink formulations: texture and shelf-life science, reformulation, sensory testing and pilot-plant trials."
    examples: [shelf-life studies, texture analysis, sensory testing, reformulation]
    status: live
  - id: materials-development
    name: Materials Development
    kind: craft
    scope: "Inventing new materials: composition screening, property characterisation, coatings, polymers and composites up to handover to production."
    examples: [composition screening, mechanical testing, coating development]
    status: live
  - id: drug-discovery
    name: Drug Discovery Research
    kind: craft
    scope: "Finding new drug candidates: target validation, hit-finding and screening, medicinal-chemistry optimisation and preclinical candidate profiling."
    examples: [high-throughput screening, SAR optimisation, ADMET profiling]
    status: live
  - id: cosmetic-personal-care-rd
    name: Cosmetic & Personal-Care R&D
    kind: craft
    scope: "Developing new cosmetic and personal-care formulations: emulsion science, preservative systems, claims-support testing and stability protocols."
    examples: [emulsion formulation, preservative challenge tests, stability protocols]
    status: live
  - id: agrochemical-rd
    name: Agrochemical & Specialty-Chemical R&D
    kind: craft
    scope: "Developing new crop-protection and specialty-chemical products: active-ingredient screening, formulation types and efficacy trials."
    examples: [efficacy trials, formulation types, adjuvant screening]
    status: live
