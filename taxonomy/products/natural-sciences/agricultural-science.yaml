    status: live
  - id: crop-protection-research
    name: Crop Protection Research
    kind: craft
    scope: "Pests, diseases and weeds as science: pathogen and pest identification, resistance screening, and efficacy and IPM research."
    examples: [pathogen diagnostics, resistance screening, efficacy trials]
    status: live
  - id: agricultural-systems-modelling
    name: Agricultural Systems Modelling
    kind: craft
    scope: "Simulating farms and crops: crop-growth models, climate-impact studies and remote sensing of crops for research."
