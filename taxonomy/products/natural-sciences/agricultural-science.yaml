    examples: [plot-trial design, yield measurement, treatment randomisation]
    status: live
  - id: plant-breeding-research
    name: Plant Breeding Research
    kind: craft
    scope: "Developing better crop genetics: crossing and selection, marker-assisted and genomic selection, and variety-trial evaluation."
    examples: [crossing programmes, marker-assisted selection, variety trials]
    status: live
  - id: soil-science-research
    name: Soil Science Research
    kind: craft
    scope: "Soil as a research subject: soil sampling and classification, physical and chemical analysis, and soil-health studies."
