category: natural-sciences
field: oceanography
products:
  - id: physical-oceanography
    name: Physical Oceanography
    kind: craft
    scope: "Ocean circulation and physics: currents, water masses, mixing, tides and waves, analysed from observations and theory."
    examples: [water-mass analysis, current measurement, tide analysis, mixing studies]
    status: live
  - id: chemical-oceanography
    name: Chemical Oceanography
    kind: craft
    scope: "Chemistry of seawater: nutrient and carbonate-system analysis, dissolved gases, ocean acidification and tracer studies."
    examples: [nutrient analysis, carbonate chemistry, dissolved oxygen, tracers]
    status: live
  - id: biological-oceanography
    name: Biological Oceanography
    kind: craft
    scope: "Life in the ocean as a system: plankton ecology, primary-productivity measurement, net and acoustic sampling of marine life."
    examples: [plankton tows, chlorophyll measurement, primary productivity, acoustic surveys]
    status: live
  - id: marine-geology-geophysics
    name: Marine Geology & Geophysics
    kind: craft
    scope: "The sea floor: bathymetric mapping, sediment coring, sub-bottom profiling and seafloor-process research."
    examples: [multibeam bathymetry, sediment coring, sub-bottom profiling]
    status: live
  - id: ocean-observation
    name: Ocean Observation & Instrumentation
    kind: craft
    scope: "Getting measurements from the sea: CTD casts, moorings, gliders and floats, shipboard operations and sensor calibration."
    examples: [CTD casts, mooring design, Argo/glider data, sensor calibration]
    status: live
  - id: ocean-modelling
    name: Ocean Modelling
    kind: craft
    scope: "Simulating the ocean: circulation and biogeochemical models, grid and forcing choices, and model-data comparison."
    examples: [circulation models, biogeochemical modelling, model validation]
    status: live
  - id: satellite-oceanography
    name: Satellite Oceanography
    kind: craft
    scope: "The ocean from space: altimetry, sea-surface temperature and ocean-colour data, retrieval limits and validation."
    examples: [altimetry, SST products, ocean colour, matchup validation]
    status: live
