    status: live
  - id: blast
    name: BLAST
    kind: application
    scope: "Sequence searching with NCBI BLAST: choosing programs and databases, tuning parameters and interpreting hits and E-values."
    examples: [blastn/blastp choice, E-value interpretation, custom databases]
    status: live
  - id: bioconductor
    name: R / Bioconductor
    kind: application
    scope: "Analysing omics data with R and Bioconductor packages: expression analysis, annotation and genomic ranges."
