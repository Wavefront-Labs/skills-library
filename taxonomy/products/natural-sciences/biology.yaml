category: natural-sciences
field: biology
products:
  - id: molecular-biology
    name: Molecular Biology
    kind: craft
    scope: "The molecular toolkit: cloning, PCR and qPCR, gel electrophoresis, CRISPR editing and nucleic-acid work at the bench."
    examples: [molecular cloning, PCR troubleshooting, CRISPR design, gel electrophoresis]
    status: live
  - id: cell-culture
    name: Cell Culture
    kind: craft
    scope: "Growing and manipulating cells: aseptic technique, cell lines and primary culture, transfection, and contamination control."
    examples: [aseptic technique, passaging, transfection, mycoplasma testing]
    status: live
  - id: protein-biochemistry
    name: Protein Biochemistry
    kind: craft
    scope: "Working with proteins: expression and purification, enzyme assays, western blotting and structural-biology sample preparation."
    examples: [protein purification, enzyme kinetics, western blot, crystallisation screens]
    status: live
  - id: microbiology-methods
    name: Microbiology Methods
    kind: craft
    scope: "Culturing and studying microorganisms: isolation, identification, antimicrobial testing and sterile microbial technique."
    examples: [bacterial isolation, plate counting, antibiotic susceptibility, anaerobic culture]
    status: live
  - id: genomics-sequencing
    name: Genomics & Sequencing
    kind: craft
    scope: "Producing and handling sequence data: library preparation, NGS platforms, genome assembly and variant analysis."
    examples: [library prep, RNA-seq, genome assembly, variant calling]
    status: live
  - id: bioinformatics
    name: Bioinformatics
    kind: craft
    scope: "Computational analysis of biological data: sequence analysis, annotation, omics pipelines and biological databases."
    examples: [sequence alignment, pipeline building, differential expression, database mining]
    status: live
  - id: phylogenetics
    name: Phylogenetics
    kind: craft
    scope: "Inferring evolutionary relationships: alignment, tree-building methods, molecular clocks and interpreting phylogenies."
    examples: [tree inference, model selection, molecular dating, bootstrap support]
    status: live
  - id: model-organism-research
