category: natural-sciences
field: atmospheric-sciences
products:
  - id: synoptic-dynamic-meteorology
    name: Synoptic & Dynamic Meteorology
    kind: craft
    scope: "The physics and analysis of weather systems: synoptic chart analysis, atmospheric dynamics, and mesoscale and severe-weather research."
    examples: [synoptic analysis, frontal dynamics, convective-storm research]
    status: live
  - id: numerical-weather-prediction
    name: Numerical Weather Prediction
    kind: craft
    scope: "Modelling the atmosphere forward in time: model configuration, data assimilation, ensemble methods and verification."
    examples: [data assimilation, ensemble forecasting, model verification]
    status: live
  - id: climate-modelling
    name: Climate Modelling & Climatology
    kind: craft
    scope: "Climate as a system: general-circulation and Earth-system models, scenario experiments, downscaling and climate-data analysis."
    examples: [GCM experiments, downscaling, reanalysis data, trend attribution]
    status: live
  - id: atmospheric-chemistry
    name: Atmospheric Chemistry
    kind: craft
    scope: "Chemistry of the air: trace-gas and aerosol measurement, chemical-transport modelling, ozone and air-composition research."
    examples: [trace-gas measurement, aerosol sampling, chemical-transport models]
    status: live
  - id: atmospheric-observation
    name: Atmospheric Observation
    kind: craft
    scope: "Measuring the atmosphere: surface stations, radiosondes and upper-air soundings, flux towers and observation quality control."
    examples: [radiosonde launches, weather-station siting, eddy-covariance flux, sounding interpretation]
    status: live
  - id: radar-satellite-meteorology
    name: Radar & Satellite Meteorology
    kind: craft
    scope: "Remote sensing of weather: interpreting weather radar, satellite imagery and derived products for research and nowcasting."
    examples: [radar interpretation, satellite imagery channels, dual-pol products]
    status: live
  - id: paleoclimatology
    name: Paleoclimatology
    kind: craft
    scope: "Reconstructing past climate: ice cores, tree rings, sediment proxies and proxy calibration."
    examples: [ice-core analysis, dendroclimatology, proxy calibration]
    status: live
  - id: wrf
    name: WRF
    kind: application
    scope: "Running the Weather Research and Forecasting model: domain setup, physics options, nesting and output post-processing."
    examples: [domain configuration, physics schemes, nesting, post-processing]
    status: live
