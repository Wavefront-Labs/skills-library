category: natural-sciences
field: chemistry
products:
  - id: organic-synthesis
    name: Organic Synthesis
    kind: craft
    scope: "Planning and running organic reactions: retrosynthesis, air-free technique, work-up, purification and reaction optimisation."
    examples: [retrosynthesis, Schlenk technique, column chromatography, reaction optimisation]
    status: live
  - id: inorganic-organometallic-chemistry
    name: Inorganic & Organometallic Chemistry
    kind: craft
    scope: "Synthesis and study of inorganic and organometallic compounds: coordination chemistry, catalysis research and air-sensitive metal chemistry."
    examples: [ligand synthesis, glovebox technique, homogeneous catalysis studies]
    status: live
  - id: physical-chemistry
    name: Physical Chemistry
    kind: craft
    scope: "Measuring the physics of chemical systems: kinetics, thermodynamics, surface chemistry and reaction-dynamics experiments."
    examples: [reaction kinetics, calorimetry, surface analysis, photochemistry]
    status: live
  - id: analytical-chemistry
    name: Analytical Chemistry
    kind: craft
    scope: "Quantitative chemical analysis as a discipline: method development and validation, titrimetry, electro-analysis and trace analysis."
    examples: [method validation, trace analysis, titration, ion chromatography methods]
    status: live
  - id: structure-elucidation
    name: Structure Elucidation
    kind: craft
    scope: "Working out what a molecule is: interpreting NMR, mass spectra, IR and X-ray crystallography data to assign structures."
    examples: [NMR interpretation, mass-spectrum assignment, small-molecule crystallography]
    status: live
  - id: computational-chemistry
    name: Computational Chemistry
    kind: craft
    scope: "Modelling molecules and reactions in silico: DFT and ab initio calculations, conformational searching, transition-state finding and basis-set choices."
    examples: [DFT calculations, geometry optimisation, transition-state search]
    status: live
  - id: electrochemistry
    name: Electrochemistry
    kind: craft
    scope: "Electrochemical measurement and research: voltammetry, impedance spectroscopy, battery and electrolysis research technique."
    examples: [cyclic voltammetry, EIS, battery-cell testing, reference electrodes]
    status: live
  - id: polymer-chemistry
    name: Polymer Chemistry
    kind: craft
    scope: "Synthesis and characterisation of polymers: controlled polymerisation, molecular-weight analysis and thermal characterisation."
    examples: [RAFT/ATRP polymerisation, GPC analysis, DSC/TGA characterisation]
    status: live
  - id: chemdraw
    name: ChemDraw
    kind: application
    scope: "Drawing and communicating chemistry with ChemDraw: structures, reaction schemes, name-to-structure and publication figures."
    examples: [structure drawing, reaction schemes, NMR prediction]
    status: live
  - id: gaussian
    name: Gaussian
    kind: application
    scope: "Running quantum-chemistry calculations in Gaussian: input preparation, job types, convergence troubleshooting and output interpretation."
    examples: [input files, frequency calculations, solvent models, output parsing]
    status: live
