category: natural-sciences
field: physics
products:
  - id: condensed-matter-physics
    name: Condensed-Matter Physics
    kind: craft
    scope: "Experimental and theoretical study of solids and soft matter: crystal growth, transport and magnetisation measurements, low-temperature and high-field technique."
    examples: [crystal growth, transport measurements, superconductivity experiments, 2D materials]
    status: live
  - id: particle-physics
    name: Particle Physics
    kind: craft
    scope: "Accelerator and detector physics: designing analyses, detector calibration, event reconstruction and statistical searches on collider and neutrino data."
    examples: [event selection, detector calibration, cross-section measurement, trigger design]
    status: live
  - id: nuclear-physics
    name: Nuclear Physics
    kind: craft
    scope: "Nuclear structure and reactions: radiation detection and spectrometry, activation analysis, reactor and accelerator-based experiments, radiation safety in the lab."
    examples: [gamma spectrometry, neutron activation analysis, decay measurements]
    status: live
  - id: optics-photonics
    name: Optics & Photonics
    kind: craft
    scope: "Building and aligning optical experiments: lasers, interferometry, optical-table practice, fibre optics and quantum-optics setups."
    examples: [laser alignment, interferometry, optical-cavity locking, nonlinear optics]
    status: live
  - id: plasma-physics
    name: Plasma Physics
    kind: craft
    scope: "Laboratory and fusion plasma research: plasma diagnostics, confinement experiments and plasma-source operation."
    examples: [Langmuir probes, tokamak diagnostics, plasma spectroscopy]
    status: live
  - id: biophysics
    name: Biophysics
    kind: craft
    scope: "Physical measurement of biological systems: single-molecule methods, optical tweezers, force spectroscopy and biological imaging physics."
    examples: [optical tweezers, single-molecule FRET, patch-clamp physics]
    status: live
  - id: computational-physics
    name: Computational Physics
    kind: craft
    scope: "Simulation as a physics instrument: molecular dynamics, Monte Carlo, finite-element and lattice methods, and HPC practice for physics problems."
    examples: [molecular dynamics, Monte Carlo simulation, density functional theory runs]
    status: live
  - id: vacuum-cryogenic-technique
    name: Vacuum & Cryogenic Technique
    kind: craft
    scope: "The hardware craft under most physics experiments: high-vacuum systems, leak hunting, cryostats, dilution refrigerators and cryogen handling."
    examples: [UHV practice, leak detection, cryostat operation, dilution refrigerators]
    status: live
  - id: labview
    name: LabVIEW
    kind: application
    scope: "Instrument control and data acquisition with LabVIEW: wiring experiments, DAQ hardware and automated measurement runs."
    examples: [DAQ programming, instrument drivers, automated measurement sequences]
    status: live
  - id: root
    name: ROOT
    kind: application
    scope: "CERN's ROOT framework for physics data analysis: histogramming, fitting, ntuple processing and statistical tools."
    examples: [histogram fitting, TTree analysis, RooFit statistics]
    status: live
  - id: comsol
    name: COMSOL Multiphysics
    kind: application
    scope: "Finite-element modelling of coupled physics problems in COMSOL: electromagnetic, thermal, acoustic and structural simulation for experiment design."
    examples: [EM field modelling, thermal simulation, mesh design]
    status: live
