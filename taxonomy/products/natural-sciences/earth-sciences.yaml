category: natural-sciences
field: earth-sciences
products:
  - id: field-geology
    name: Field Geology & Mapping
    kind: craft
    scope: "Reading rocks in the field: geological mapping, structural measurements, outcrop description and field-note practice."
    examples: [geological mapping, strike and dip, outcrop logging, cross-sections]
    status: live
  - id: sedimentology-stratigraphy
    name: Sedimentology & Stratigraphy
    kind: craft
    scope: "Sedimentary rocks and the record they keep: facies analysis, logging sections, correlation and depositional-environment interpretation."
    examples: [facies analysis, measured sections, sequence stratigraphy]
    status: live
  - id: mineralogy-petrology
    name: Mineralogy & Petrology
    kind: craft
    scope: "Identifying and interpreting minerals and rocks: thin-section petrography, optical mineralogy and igneous/metamorphic interpretation."
    examples: [thin-section petrography, optical mineralogy, phase diagrams]
    status: live
  - id: geochemistry
    name: Geochemistry
    kind: craft
    scope: "Chemical analysis of Earth materials: isotope systems, whole-rock analysis, and interpreting elemental and isotopic signatures."
    examples: [isotope analysis, XRF whole-rock data, trace-element interpretation]
    status: live
  - id: geochronology
    name: Geochronology
    kind: craft
    scope: "Dating rocks and events: radiometric dating methods, sample selection and interpreting ages within geological context."
    examples: [U-Pb zircon dating, Ar-Ar dating, radiocarbon limits, age interpretation]
    status: live
  - id: seismology
    name: Seismology
    kind: craft
    scope: "Earthquakes and Earth's interior: seismic networks, waveform analysis, earthquake location and seismic-hazard research."
    examples: [earthquake location, waveform analysis, focal mechanisms, seismic networks]
    status: live
  - id: geophysical-surveying
    name: Geophysical Surveying
    kind: craft
    scope: "Imaging the subsurface: gravity, magnetic, resistivity, GPR and seismic-reflection surveys, acquisition through interpretation."
    examples: [magnetic surveys, resistivity, ground-penetrating radar, seismic reflection]
    status: live
  - id: volcanology
    name: Volcanology
    kind: craft
    scope: "Studying volcanoes: eruption-deposit analysis, volcano monitoring, gas measurement and hazard assessment research."
    examples: [tephra analysis, volcano monitoring, gas flux measurement]
    status: live
  - id: paleontology
    name: Paleontology
    kind: craft
    scope: "Fossils as science: excavation and preparation technique, taxonomy, biostratigraphy and paleoecological interpretation."
    examples: [fossil preparation, taxonomic description, biostratigraphy]
    status: live
