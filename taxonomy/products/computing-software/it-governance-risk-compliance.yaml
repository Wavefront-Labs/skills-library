category: computing-software
field: it-governance-risk-compliance
products:
- id: iso-27001-isms
  name: ISO/IEC 27001 ISMS
  kind: craft
  scope: 'Building, running and certifying an information security management system to ISO/IEC 27001:2022: clauses 4-10, risk treatment, Statement of Applicability and Annex A controls.'
  examples:
  - context and scope
  - Statement of Applicability
  - internal audit
  - Annex A controls
  status: live
- id: nist-csf-800-53
  name: NIST CSF 2.0, SP 800-53 and RMF
  kind: craft
  scope: Applying the NIST Cybersecurity Framework 2.0, SP 800-53 Rev 5 control families and baselines, and the SP 800-37 Risk Management Framework to authorise and monitor systems.
  examples:
  - CSF profile
  - control baseline tailoring
  - SSP and POA&M
  - ATO package
  status: live
- id: risk-assessment-methods
  name: IT Risk Assessment Methods
  kind: craft
  scope: 'Identifying, analysing, quantifying and treating information risk: NIST SP 800-30, FAIR, risk registers, third-party risk and business impact analysis.'
  examples:
  - risk register
  - FAIR analysis
  - risk treatment plan
  - business impact analysis
  status: live
- id: soc2-audit
  name: SOC 2 and IT Audit
  kind: craft
  scope: Preparing for and supporting SOC 2 examinations against the AICPA Trust Services Criteria, plus ISACA-style IT audit planning, evidence and general controls testing.
  examples:
  - readiness assessment
  - system description
  - control testing
  - ITGC audit
  status: live
- id: compliance-regulations-grc
  name: Regulatory Compliance and GRC Tooling
  kind: craft
  scope: Meeting PCI DSS v4, GDPR, HIPAA and SOX obligations and running a unified compliance programme with control mapping, evidence automation and GRC platforms.
  examples:
  - PCI scoping
  - GDPR DPIA
  - unified control mapping
  - evidence automation
  status: live
- id: it-governance-cobit-itil
  name: IT Governance, COBIT and ITIL
  kind: craft
  scope: Designing IT governance and management with COBIT 2019 and ITIL 4, and applying CISM and CRISC practice domains to security governance and risk.
  examples:
  - governance system design
  - COBIT objectives
  - ITIL practices
  - security governance reporting
  status: live
