category: computing-software
field: digital-forensics-incident-response
products:
  - id: volatility
    name: Volatility
    kind: application
    scope: "Memory forensics with the Volatility framework: analysing RAM captures for processes, network state and artefacts."
    examples: [process listing, network artefacts, injected-code detection, plugin use]
    status: live
  - id: autopsy-sleuthkit
    name: Autopsy / The Sleuth Kit
    kind: application
    scope: "Disk forensics with Autopsy and The Sleuth Kit: imaging, filesystem analysis, timeline building and artefact recovery."
    examples: [disk imaging, filesystem analysis, timeline building, deleted-file recovery]
    status: live
  - id: wireshark-forensics
    name: Wireshark (Forensic Analysis)
    kind: application
    scope: "Network forensic analysis with Wireshark: reconstructing sessions from captures and extracting indicators."
    examples: [session reconstruction, indicator extraction, protocol analysis, capture triage]
    status: live
  - id: incident-response-process
    name: Incident Response Process
    kind: craft
    scope: "Running the incident lifecycle regardless of tool: preparation, detection, containment, eradication, recovery and lessons learned."
    examples: [containment decisions, eradication, recovery validation, postmortem]
    status: live
  - id: malware-analysis
    name: Malware Analysis
    kind: craft
    scope: "Understanding malicious software in a controlled lab: static and dynamic analysis, behaviour profiling and indicator extraction."
    examples: [static triage, sandbox dynamic analysis, behaviour profiling, indicator extraction]
    status: live
  - id: disk-memory-forensics
    name: Disk & Memory Forensics
    kind: craft
    scope: "Recovering and interpreting evidence from storage and RAM regardless of tool: imaging, artefact analysis and timelines."
    examples: [forensic imaging, artefact interpretation, super-timeline, anti-forensics awareness]
    status: live
  - id: log-analysis
    name: Log Analysis & Threat Hunting
    kind: craft
    scope: "Finding intrusion evidence in logs and telemetry: correlation, hypothesis-driven hunting and detection-gap discovery."
    examples: [log correlation, hypothesis-driven hunting, timeline reconstruction, detection gaps]
    status: live
  - id: evidence-handling
    name: Evidence Handling & Preservation
    kind: craft
    scope: "Preserving digital evidence soundly for an investigation: acquisition order, integrity verification and documentation."
    examples: [order of volatility, hashing and integrity, acquisition documentation, write-blocking]
    status: live
