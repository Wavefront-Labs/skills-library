category: computing-software
field: cryptography-implementation
products:
  - id: openssl
    name: OpenSSL
    kind: application
    scope: "Using OpenSSL and its library: certificates, key generation, TLS testing and the command-line crypto toolkit."
    examples: [certificate generation, CSR handling, TLS testing, cipher inspection]
    status: live
  - id: libsodium
    name: libsodium / NaCl
    kind: application
    scope: "Applied cryptography with libsodium: authenticated encryption, key exchange, signatures and safe-by-default APIs."
    examples: [authenticated encryption, key exchange, digital signatures, secure defaults]
    status: live
  - id: crypto-libraries
    name: Platform Crypto Libraries
    kind: application
    scope: "Using built-in crypto libraries (Web Crypto, Java JCA, .NET, Go crypto) correctly for application needs."
    examples: [API selection, algorithm parameters, random generation, interop]
    status: live
  - id: applied-cryptography
    name: Applied Cryptography
    kind: craft
    scope: "Using cryptographic primitives correctly in software regardless of library: choosing algorithms, modes and avoiding misuse."
    examples: [primitive selection, mode choice, nonce handling, misuse avoidance]
    status: live
  - id: protocol-implementation
    name: Cryptographic Protocol Implementation
    kind: craft
    scope: "Implementing and integrating secure protocols regardless of library: TLS, handshakes, session handling and conformance."
    examples: [TLS integration, handshake handling, certificate validation, protocol conformance]
    status: live
  - id: key-management
    name: Key Management
    kind: craft
    scope: "Handling keys safely across their lifecycle in software: generation, storage, rotation, HSM/KMS use and destruction."
    examples: [key generation, secure storage, rotation, KMS/HSM integration]
    status: live
  - id: secure-implementation
    name: Secure Cryptographic Implementation
    kind: craft
    scope: "Avoiding implementation pitfalls regardless of algorithm: constant-time code, side-channel awareness and validation."
    examples: [constant-time coding, side-channel awareness, input validation, known-answer tests]
    status: live
