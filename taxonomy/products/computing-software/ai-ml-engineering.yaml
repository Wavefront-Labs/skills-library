  - id: hugging-face
    name: Hugging Face Transformers
    kind: application
    scope: "Working with pretrained models via Hugging Face: loading, fine-tuning, tokenisation and inference with transformers."
    examples: [model loading, fine-tuning, tokenisation, inference pipelines]
    status: live
  - id: langchain
    name: LangChain / LLM Frameworks
    kind: application
    scope: "Building LLM applications with orchestration frameworks: chains, agents, retrieval integration and prompt plumbing."
    examples: [retrieval chains, agent tools, memory, output parsing]
    status: live
  - id: mlflow
    name: MLflow
    kind: application
