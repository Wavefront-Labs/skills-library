    examples: [vllm serve, tensor parallel size, gpu memory utilization, prefix caching, Prometheus metrics]
    status: live
  - id: litellm
    name: LiteLLM
    kind: application
    scope: "Running LiteLLM SDK and proxy: model routing, config.yaml, virtual keys, budgets, fallbacks, load balancing, caching, guardrails, logging callbacks and deployment."
    examples: [model_list, virtual keys, router fallbacks, budget limits, Langfuse callback]
    status: live
  - id: llama-cpp
    name: llama.cpp
    kind: application
    scope: "Running llama.cpp locally and as a server: building backends, GGUF models, quantization, llama-cli, llama-server API, sampling, grammars, speculative decoding, LoRA, multimodal, RPC and benchmarking."
    examples: [llama-server, llama-cli, llama-quantize, GGUF, grammars]
    status: live
  - id: kubeflow
    name: Kubeflow
    kind: application
    scope: "Operating the Kubeflow ML platform on Kubernetes: Pipelines, Katib hyperparameter tuning, Notebooks, Central Dashboard and profiles, Spark Operator, Trainer and Model Registry Hub."
    examples: [Katib Experiment, Pipelines, Profiles, Notebook images, Model Registry]
    status: live
  - id: kserve
    name: KServe
    kind: application
    scope: "Serving models with KServe on Kubernetes: InferenceService and ServingRuntime resources, serverless and raw deployment installs, storage providers, framework runtimes, transformers, logging, autoscaling, canary rollouts, observability and LLM inference services."
    examples: [InferenceService, ServingRuntime, canaryTrafficPercent, storageUri, scale to zero]
