    examples: [functions-pipe-filter-action, env-configuration, rag, web-search, sqlite]
    status: live
  - id: vercel-ai-sdk
    name: Vercel Ai Sdk
    kind: application
    scope: "Vercel Ai Sdk: Choose and wire persistent memory for a ToolLoopAgent using the Anthropic memory tool, a memory provider such as Mem0 or Letta, or a custom tool."
    examples: [usechat, tool-calling, toolloopagent, generate-text, tool-approval]
    status: live
