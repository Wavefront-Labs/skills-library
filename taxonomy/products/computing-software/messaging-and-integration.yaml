category: computing-software
field: messaging-and-integration
products:
  - id: rabbitmq
    name: RabbitMQ
    kind: application
    scope: "Operating and using RabbitMQ: AMQP 0-9-1 model, queue types, reliability, clustering, security and monitoring."
    examples: [exchanges and bindings, quorum queues, dead-lettering, cluster operations]
    status: live
  - id: apache-activemq-artemis
    name: Apache ActiveMQ Artemis
    kind: application
    scope: "Operating Apache ActiveMQ Artemis: address model and settings, queue types, paging, flow control, bridges, delivery guarantees, metrics and logging."
    examples: [address-settings, paging, dead-letter addresses, core bridges]
    status: live
  - id: nats
    name: NATS
    kind: application
    scope: "Running and using NATS: core messaging, JetStream persistence, clustering and leaf nodes, security, monitoring and client patterns."
    examples: [JetStream streams and consumers, subject-based messaging, accounts and leaf nodes]
    status: live
  - id: apache-pulsar
    name: Apache Pulsar
    kind: application
    scope: "Operating Apache Pulsar: topics and subscriptions, namespaces and tenants, geo-replication, tiered storage, security, functions and administration."
    examples: [subscription types, geo-replication, tiered storage, namespace policies]
    status: live
  - id: temporal
    name: Temporal
    kind: application
    scope: "Building and operating Temporal: workflows, activities, workers, task queues, signals and queries, retries, timeouts, versioning, visibility, and the CLI."
    examples: [workflow determinism, activity retries, signals, schedules]
    status: live
  - id: debezium
    name: Debezium
    kind: application
    scope: "Running Debezium change data capture: PostgreSQL, MySQL, SQL Server, MongoDB and Oracle connectors, snapshots and signaling, outbox and routing transformations, Debezium Server, the embedded engine and monitoring."
    examples: [PostgreSQL replication slots, incremental snapshot signals, outbox event router, Debezium Server sinks]
    status: live
  - id: strimzi
    name: Strimzi
    kind: application
    scope: "Running Apache Kafka on Kubernetes with Strimzi: Kafka and node pool resources, listeners, users and topics, Kafka Connect, MirrorMaker 2, Cruise Control, security, upgrades and monitoring."
    examples: [Kafka custom resource, KafkaNodePool, listeners and authentication, KafkaConnect, rolling updates]
    status: live
  - id: mosquitto
    name: Eclipse Mosquitto
    kind: application
    scope: "Running the Mosquitto MQTT broker: mosquitto.conf, listeners, TLS, password files, ACLs, persistence, bridges, websockets, logging and the mosquitto_pub, mosquitto_sub and mosquitto_passwd tools."
    examples: [listener and allow_anonymous, password_file, acl_file patterns, bridge connections, persistence_location]
    status: live
  - id: apache-kafka
    name: Apache Kafka
    kind: application
    scope: "Operating Apache Kafka: brokers and KRaft, topics, producers, consumers, consumer groups, security, replication, Kafka Connect, Kafka Streams, the admin tools and monitoring."
    examples: [kafka-topics.sh, acks and idempotence, consumer group rebalancing, KRaft controllers, Kafka Connect connectors]
    status: live
  - id: node-red
    name: Node-RED
    kind: application
    scope: "Running and building flows in Node-RED: Docker and boot setup, settings.js, securing the editor, context, Function nodes, error handling, environment variables, subflows, projects and the admin CLI."
    examples: [settings.js adminAuth, context storage, Catch node, subflow properties, node-red admin]
    status: live
  - id: dapr
    name: Dapr
    kind: application
    scope: "Operating and using the Dapr distributed application runtime: Kubernetes and self-hosted install and upgrade, mTLS and Sentry, Configuration and Resiliency resources, observability, access control, component handling and the service invocation, pub/sub, state, bindings, actors, workflow, jobs and lock building blocks."
    examples: [dapr init -k, daprsystem Configuration, Resiliency retries and circuit breakers, dead letter topics, actor reminders]
    status: live
  - id: redpanda
    name: Redpanda
    kind: application
    scope: "Operating Redpanda, the Kafka-API streaming platform: Linux install and tuning, listeners, rpk, topics, balancing, compaction and retention, TLS, SASL, ACLs and RBAC, Schema Registry, HTTP Proxy, transactions, Tiered Storage and rolling upgrades."
    examples: [rpk redpanda tune, rpk cluster config edit, maintenance mode rolling restart, kafka_api_tls and mTLS, Schema Registry compatibility, redpanda.storage.mode tiered]
    status: live
  - id: apache-zookeeper
    name: Apache ZooKeeper
    kind: application
    scope: "Running Apache ZooKeeper coordination ensembles: zoo.cfg, quorum and observers, data model, watches, ACLs and authentication, TLS, dynamic reconfiguration, four-letter words, zkCli, monitoring, backup and recipes."
    examples: [zoo.cfg tickTime initLimit syncLimit, zkCli create -e, reconfig, ruok and mntr, SASL Digest auth]
    status: live
  - id: apache-camel
    name: Apache Camel
    kind: application
    scope: "Building Apache Camel integrations: routes and endpoint URIs, enterprise integration patterns, expression languages, components, error handling, transactions, testing, and Camel Main, JBang, Spring Boot and Quarkus runtimes."
    examples: [from timer to log route, choice and when, onException, file component options, Kafka component]
    status: live
  - id: prosody
    name: Prosody
    kind: application
    scope: "Running the Prosody XMPP server: prosody.cfg.lua, virtual hosts and components, TLS and certificates, prosodyctl, multi-user chat, storage and authentication backends, HTTP/BOSH/WebSocket, and mod_* modules."
    examples: [VirtualHost, modules_enabled, prosodyctl cert, mod_mam, mod_smacks]
    status: live
  - id: ntfy
    name: ntfy
    kind: application
    scope: "Running and using ntfy: publishing and subscribing over HTTP, actions and scheduling, templates, server config, access control, proxies, mobile and web clients, and troubleshooting."
    examples: [publish headers, scheduled delivery, access control and tokens, behind a reverse proxy, UnifiedPush]
    status: live
