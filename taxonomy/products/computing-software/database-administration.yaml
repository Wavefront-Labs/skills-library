category: computing-software
field: database-administration
products:
  - id: postgresql
    name: PostgreSQL
    kind: application
    scope: "Running and tuning PostgreSQL: configuration, indexing, EXPLAIN analysis, vacuum, replication and extensions."
    examples: [index design, EXPLAIN analysis, autovacuum tuning, streaming replication]
    status: live
  - id: time-series-databases
    name: Time-Series Databases (InfluxDB, TimescaleDB, Prometheus TSDB)
    kind: application
    scope: "Running time-series stores: InfluxDB 2 and 3, TimescaleDB hypertables, Prometheus TSDB internals, retention, downsampling, cardinality and query languages."
    examples: [hypertable chunking, continuous aggregates, Flux and InfluxQL, TSDB cardinality control]
    status: live
  - id: mysql
    name: MySQL / MariaDB
    kind: application
    scope: "Running and tuning MySQL and MariaDB: InnoDB internals, replication topologies, upgrades and backup tooling."
    examples: [InnoDB tuning, replication topologies, online schema change, binlog management]
    status: live
  - id: cloud-nosql-databases
    name: Cloud NoSQL (DynamoDB, Cosmos DB, Firestore)
    kind: application
    scope: "Designing and operating managed NoSQL stores: DynamoDB, Azure Cosmos DB and Firestore data modelling, partitioning, capacity, consistency, indexing, security and cost."
    examples: [single-table design, partition keys, RU budgeting, Firestore security rules]
    status: live
  - id: sql-server
    name: Microsoft SQL Server
    kind: application
    scope: "Running and tuning SQL Server: query store, execution plans, Always On availability groups and maintenance plans."
    examples: [execution-plan analysis, Always On groups, index maintenance, TempDB tuning]
    status: live
  - id: oracle-database
    name: Oracle Database
    kind: application
    scope: "Running and tuning Oracle Database: PL/SQL, RMAN backup, Data Guard and AWR-driven performance work."
    examples: [RMAN backup, Data Guard, AWR analysis, PL/SQL packages]
    status: live
  - id: mongodb
    name: MongoDB
    kind: application
    scope: "Running MongoDB: document schema design, aggregation pipelines, replica sets and sharding."
    examples: [document modelling, aggregation pipelines, replica sets, shard-key selection]
    status: live
  - id: redis
    name: Redis
    kind: application
    scope: "Running Redis: data-structure selection, caching patterns, persistence modes, clustering and eviction."
    examples: [caching patterns, data-structure choice, persistence configuration, cluster mode]
    status: live
  - id: cassandra
    name: Apache Cassandra
    kind: application
    scope: "Running Apache Cassandra: query-first data modeling, CQL, compaction, repair, topology changes, backups, tuning and security."
    examples: [partition key design, compaction strategy, repair scheduling, multi-DC topology]
    status: live
  - id: neo4j
    name: Neo4j
    kind: application
    scope: "Running Neo4j: Cypher, indexes and constraints, graph modelling, import, clustering, security, backup, Graph Data Science and operations."
    examples: [Cypher tuning, graph modelling, bulk import, cluster operations]
    status: live
  - id: elasticsearch
    name: Elasticsearch / OpenSearch
    kind: application
    scope: "Running search clusters: mappings, analyzers, query DSL, index lifecycle and cluster sizing."
    examples: [mapping design, analyzers, query DSL, index lifecycle management]
    status: live
  - id: sqlite
    name: SQLite
    kind: application
    scope: "Embedded data with SQLite: schema design, WAL mode, pragmas and application-local storage patterns."
    examples: [WAL mode, pragma tuning, embedded schema design, migration handling]
    status: live
  - id: query-optimisation
    name: SQL & Query Optimisation
    kind: craft
    scope: "Writing and tuning queries regardless of engine: SQL fluency, execution plans, join strategies and index reasoning."
    examples: [advanced SQL, reading query plans, join-order reasoning, covering indexes]
    status: live
  - id: schema-design
    name: Schema Design & Normalisation
    kind: craft
    scope: "Designing database schemas regardless of engine: normalisation, keys, constraints and evolution through migrations."
    examples: [normal forms, key and constraint design, soft-delete trade-offs, migration strategy]
    status: live
  - id: replication-high-availability
    name: Replication & High Availability
    kind: craft
    scope: "Keeping databases available regardless of engine: replication topologies, failover, consistency trade-offs and connection routing."
    examples: [failover design, read replicas, split-brain avoidance, connection pooling]
    status: live
  - id: database-backup-recovery
    name: Database Backup & Recovery
    kind: craft
    scope: "Protecting database data: backup strategies, point-in-time recovery, restore testing and retention."
    examples: [point-in-time recovery, backup verification, restore drills, retention design]
    status: live
  - id: sql
    name: SQL (language)
    kind: application
    scope: "SQL as a language across engines: ISO SQL concepts, DML and DDL, joins, transactions, constraints, portability and safe query writing."
    examples: [join semantics, transaction isolation, constraint design, dialect portability, parameterised queries]
    status: live
  - id: cockroachdb
    name: CockroachDB
    kind: application
    scope: "Running CockroachDB: distributed architecture, SQL features, deployment, security, performance tuning, monitoring, backup and migration."
    examples: [multi-region, changefeeds, backup and restore, query tuning]
    status: live
  - id: clickhouse
    name: ClickHouse
    kind: application
    scope: "Running ClickHouse: MergeTree design, queries, ingestion, replication, access control, backup and server operations."
    examples: [table engines, replication, query tuning]
    status: live
  - id: valkey
    name: Valkey
    kind: application
    scope: "Running Valkey: commands by data type, persistence, replication, Cluster, Sentinel, ACLs, eviction, pub/sub, streams and administration."
    examples: [streams, cluster, ACL, persistence, eviction]
    status: live
  - id: supabase
    name: Supabase
    kind: application
    scope: "Running apps on Supabase: Postgres with row level security, Auth, Storage, Realtime, Edge Functions, the CLI and local development, migrations and project operations."
    examples: [row level security policies, Auth providers, Edge Functions, migrations with the CLI]
    status: live
  - id: pgbouncer
    name: PgBouncer
    kind: application
    scope: "Running PgBouncer: pool modes, pgbouncer.ini settings, authentication, TLS, the admin console, limits, online restart and troubleshooting."
    examples: [pool modes, auth_type and auth_file, SHOW commands, online restart]
    status: live
  - id: pgbackrest
    name: pgBackRest
    kind: application
    scope: "Running pgBackRest: stanzas, backup types, retention, restore and PITR, repositories, encryption, archiving and the command reference."
    examples: [full/diff/incr backups, point-in-time restore, S3 repositories, retention]
    status: live
  - id: patroni
    name: Patroni
    kind: application
    scope: "Running Patroni: PostgreSQL high availability with a DCS, patroni.yml, dynamic configuration, patronictl, REST API, failover and switchover."
    examples: [patronictl switchover, dynamic configuration, REST API health checks, standby clusters]
    status: live
  - id: tidb
    name: TiDB
    kind: application
    scope: "Running TiDB: the TiDB, TiKV, PD and TiFlash architecture, transactions, garbage collection, clustered indexes and AUTO_RANDOM, BR backup and PITR, TiCDC, TiDB Lightning, DM and TiUP."
    examples: [TiKV Regions, pessimistic transactions, BR PITR, TiCDC changefeed, TiUP cluster]
    status: live
  - id: scylladb
    name: ScyllaDB
    kind: application
    scope: "Operating ScyllaDB: nodetool, repair, backup and restore, adding, removing and replacing nodes, security, scylla.yaml and system configuration, CQL specifics, monitoring and troubleshooting."
    examples: [nodetool repair, scylla.yaml, replace dead node, snapshot restore, tombstones]
    status: live
  - id: yugabytedb
    name: YugabyteDB
    kind: application
    scope: "Running YugabyteDB: DocDB architecture, yb-master and yb-tserver deployment and flags, yb-admin, multi-region and xCluster replication, backup and PITR, security, monitoring, upgrades and change data capture."
    examples: [yb-admin, yb-tserver flags, xCluster, PITR snapshot schedule, tablet splitting]
    status: live
  - id: influxdb
    name: InfluxDB
    kind: application
    scope: "Operating InfluxDB 2.x OSS: buckets and retention, tokens, users, organizations and secrets, backup and restore, TLS and hardening, logging, storage internals, write and delete practices, replication, tasks and alerting, and upgrades."
    examples: [influx backup, influx restore, retention policy, API tokens, influxd inspect, replication, Flux tasks]
    status: live
  - id: cloudnative-pg
    name: CloudNativePG
    kind: application
    scope: "Running PostgreSQL on Kubernetes with the CloudNativePG operator: installation and upgrades, Cluster bootstrap, configuration, replication and failover, backup and recovery, replica clusters, PgBouncer poolers, fencing, hibernation and resource management."
    examples: [Cluster, ScheduledBackup, Pooler, kubectl cnpg, recoveryTarget, synchronous replication, replica cluster]
    status: live
  - id: vitess
    name: Vitess
    kind: application
    scope: "Operating Vitess sharded MySQL: topology and tablet types, sharding and vindexes, sequences, VReplication workflows (MoveTables, Reshard, VDiff, Materialize), online DDL, reparenting and VTOrc, durability policies, query serving and buffering, connection pools, 2PC, backup and PITR, upgrades and monitoring."
    examples: [MoveTables, Reshard, vindex, online DDL strategy, PlannedReparentShard, VTOrc, vtctldclient Backup, tablet throttler]
    status: live
  - id: memcached
    name: Memcached
    kind: application
    scope: "Operating Memcached: startup options, slab and LRU memory behaviour, stats and troubleshooting, text and meta protocol usage, caching patterns, TLS and authentication, warm restart, extstore flash storage, the built-in proxy, and capacity planning."
    examples: [memcached -m, stats slabs, lru_crawler metadump, meta get mg, extstore ext_path, memcached proxy, warm restart, slabs automove]
    status: live
  - id: dragonfly
    name: Dragonfly
    kind: application
    scope: "Running DragonflyDB: installation, flags, snapshots and S3, replication, emulated and multi-shard cluster, ACL, TLS and JWT, metrics and memory diagnostics, SSD tiering, Lua flags, cache mode, migration from Redis and the Kubernetes operator."
    examples: [snapshot_cron, REPLICAOF, DFLYCLUSTER, tiered_prefix, MEMORY DEFRAGMENT, cache_mode, dragonfly-operator]
    status: live
  - id: couchdb
    name: Apache CouchDB
    kind: application
    scope: "Administering Apache CouchDB: installation, local.ini configuration, databases and documents, MVCC revisions, design documents, views and Mango queries, replication, clustering, sharding, compaction, authentication and security, the changes feed, the HTTP API, monitoring and backup."
    examples: [_replicator, _design, Mango _find, _changes, _security, _all_dbs, local.ini, cluster setup, compaction]
    status: live
