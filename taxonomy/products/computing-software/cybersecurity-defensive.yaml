category: computing-software
field: cybersecurity-defensive
products:
  - id: splunk
    name: Splunk & SIEM Platforms
    kind: application
    scope: "Operating SIEM platforms (Splunk, Sentinel, Elastic Security): data onboarding, search, detection rules and dashboards."
    examples: [SPL searches, detection rules, data onboarding, alert dashboards]
    status: live
  - id: nessus
    name: Nessus & Vulnerability Scanners
    kind: application
    scope: "Running vulnerability scanners (Nessus, Qualys, OpenVAS): scan configuration, authenticated scans and result triage."
    examples: [scan policies, authenticated scanning, false-positive triage, scan scheduling]
    status: live
  - id: security-operations
    name: Security Operations (SOC)
    kind: craft
    scope: "Running day-to-day defence: alert triage, detection engineering, escalation and SOC workflow regardless of tooling."
    examples: [alert triage, detection engineering, escalation playbooks, shift handover]
    status: live
  - id: vulnerability-management
    name: Vulnerability Management
    kind: craft
    scope: "Finding, prioritising and driving remediation of weaknesses: scanning programmes, risk scoring and patch coordination."
    examples: [risk-based prioritisation, remediation SLAs, asset coverage, exception handling]
    status: live
  - id: security-architecture
    name: Security Architecture
    kind: craft
    scope: "Designing systems to resist attack: zero trust, segmentation, defence in depth and secure design review."
    examples: [zero-trust design, network segmentation, defence in depth, design review]
    status: live
  - id: threat-modelling
    name: Threat Modelling
    kind: craft
    scope: "Systematically finding what can go wrong in a design before it ships: STRIDE, attack trees and mitigations."
    examples: [STRIDE analysis, attack trees, trust boundaries, mitigation planning]
    status: live
  - id: identity-access-management
    name: Identity & Access Management
    kind: craft
    scope: "Controlling who can do what: authentication protocols, SSO, MFA, privileged access and lifecycle governance."
    examples: [SSO and federation, MFA rollout, privileged access management, access reviews]
    status: live
  - id: network-defence
    name: Network Defence
    kind: craft
    scope: "Defending networks in operation: firewalls, IDS/IPS, VPNs, traffic monitoring and egress control."
    examples: [firewall policy, IDS/IPS tuning, VPN architecture, egress filtering]
    status: live
  - id: endpoint-security
    name: Endpoint Security
    kind: craft
    scope: "Protecting workstations and servers: EDR deployment and tuning, application control and device policy."
    examples: [EDR tuning, application allowlisting, device policy, malware containment]
    status: live
  - id: cloud-security
    name: Cloud Security
    kind: craft
    scope: "Securing cloud estates: IAM least privilege, posture management, workload protection and cloud logging."
    examples: [least-privilege IAM, posture management, cloud logging strategy, workload isolation]
    status: live
  - id: application-security
    name: Application Security
    kind: craft
    scope: "Securing software through the development lifecycle: secure coding review, SAST/DAST, dependency risk and the OWASP canon."
    examples: [secure code review, OWASP Top 10, dependency scanning, security requirements]
    status: live
  - id: system-hardening
    name: System Hardening
    kind: craft
    scope: "Reducing attack surface on hosts and services: benchmarks, baseline configuration and least-functionality builds."
    examples: [CIS benchmarks, baseline images, service minimisation, secure defaults]
    status: live
  - id: threat-intelligence
    name: Threat Intelligence
    kind: craft
    scope: "Using knowledge of adversaries to defend: intel sources, IOC handling, ATT&CK mapping and intel-driven detection."
    examples: [ATT&CK mapping, IOC management, intel source triage, adversary profiling]
    status: live
  - id: palo-alto-pan-os
    name: Palo Alto Networks PAN-OS
    kind: application
    scope: "Administering PAN-OS next-generation firewalls and Panorama: zones, policy, App-ID, decryption, HA, GlobalProtect and logging."
    examples: [security policy, App-ID, Panorama, GlobalProtect]
    status: live
  - id: fortinet-fortios
    name: Fortinet FortiGate (FortiOS)
    kind: application
    scope: "Administering FortiGate firewalls and Security Fabric: policies, VDOMs, SD-WAN, VPN, UTM profiles, HA and FortiManager."
    examples: [firewall policy, VDOM, FortiManager, IPsec]
    status: live
  - id: keycloak
    name: Keycloak
    kind: application
    scope: "Administering Keycloak: realms, clients, users, federation, authentication flows, authorization services, sessions, hardening and server operation."
    examples: [realm setup, OIDC clients, SSO, hardening]
    status: live
  - id: authentik
    name: authentik
    kind: application
    scope: "Administering the authentik identity provider: flows and stages, providers (OAuth2, SAML, LDAP, proxy), applications, policies, outposts, sources, users and groups, RBAC and operations."
    examples: [flows and stages, OAuth2 provider, outposts, policy bindings]
    status: live
  - id: wazuh
    name: Wazuh
    kind: application
    scope: "Administering Wazuh for defensive monitoring: FIM, SCA, log collection, rules and decoders, active response, vulnerability detection, agents and server cluster."
    examples: [FIM syscheck, custom rules and decoders, active response, SCA policies]
    status: live
  - id: trivy
    name: Trivy
    kind: application
    scope: "Using Trivy to scan images, filesystems and repositories for vulnerabilities, secrets and licenses: databases, registries, VEX, plugins and compliance reports."
    examples: [trivy image, secret config, VEX, compliance report]
    status: live
  - id: falco
    name: Falco
    kind: application
    scope: "Runtime threat detection with Falco: rules and macros, drivers, outputs, Falcosidekick, plugins and deployment on Kubernetes."
    examples: [Falco rules, macros and lists, modern eBPF driver, Falcosidekick outputs]
    status: live
  - id: authelia
    name: Authelia
    kind: application
    scope: "Administering Authelia as a forward-auth SSO and OIDC provider: access control rules, sessions, authentication backends, second factors, storage, notifications and deployment."
    examples: [access control rules, session and Redis, LDAP backend, OIDC clients]
    status: live
  - id: zitadel
    name: ZITADEL
    kind: application
    scope: "Administering ZITADEL identity management: instances, organizations, projects and roles, login policies, service accounts, OIDC and token handling, actions, and self-hosted operations."
    examples: [organizations and projects, service accounts, OIDC scopes, Helm deployment]
    status: live
  - id: dex
    name: Dex
    kind: application
    scope: "Administering Dex as an OpenID Connect identity provider: connectors (LDAP, GitHub, OIDC, SAML and more), tokens and signing, OAuth2 grants, clients and scopes, storage backends, the gRPC API and Kubernetes integration."
    examples: [LDAP connector, OIDC connector claim mapping, token expiry and signers, Kubernetes OIDC authentication]
    status: live
  - id: crowdsec
    name: CrowdSec
    kind: application
    scope: "Defending hosts and web apps with CrowdSec: Security Engine architecture, acquisition datasources, parsers, scenarios and whitelists, Local API, bouncers and profiles, allowlists, notifications, TLS authentication, metrics, cscli and the AppSec WAF with rules, hooks and rate limiting."
    examples: [acquis.d datasource, profiles.yaml ban duration, cscli allowlists, appsec rule deployment, RateLimit helper]
    status: live
  - id: suricata
    name: Suricata
    kind: application
    scope: "Running Suricata IDS/IPS: suricata.yaml configuration, rule syntax and keywords, rule management, capture modes, EVE JSON logging, performance tuning and Lua scripting."
    examples: [suricata.yaml, rule keywords, suricata-update, EVE JSON, AF_PACKET]
    status: live
  - id: zeek
    name: Zeek
    kind: application
    scope: "Running Zeek network security monitoring: deployment and cluster, logs, scripting language, frameworks, protocol analysis, signatures, Intel and file analysis, Management framework."
    examples: [zeekctl, conn.log, Zeek scripts, Intelligence framework, cluster]
    status: live
  - id: cosign
    name: Sigstore Cosign
    kind: application
    scope: "Signing and verifying container images and artifacts with Cosign: keyless and key-based signing, attestations, SBOMs, transparency log, Fulcio and Rekor, verification policy, bundles, KMS keys and CI use."
    examples: [cosign sign, cosign verify, cosign attest, keyless OIDC, cosign verify-attestation]
    status: live
  - id: pomerium
    name: Pomerium
    kind: application
    scope: "Running Pomerium identity-aware access proxy: authentication and SSO, policy language, routes, bearer tokens, Kubernetes and native SSH access, session recording, TCP and MCP routes, mTLS, device identity, Ingress Controller, health and troubleshooting."
    examples: [pomerium config.yaml, PPL policy, pomerium-cli, ssh_address, mcp_tool, X-Pomerium-Jwt-Assertion]
    status: live
