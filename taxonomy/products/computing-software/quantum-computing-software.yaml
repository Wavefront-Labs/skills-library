category: computing-software
field: quantum-computing-software
products:
  - id: quantum-fundamentals
    name: Quantum Computing Fundamentals
    kind: craft
    scope: "Quantum mechanics for computing: qubits, gates, entanglement, measurement and density matrices as used in code."
    examples: [qubits, entanglement, gates, measurement]
    status: live
  - id: qiskit
    name: Qiskit
    kind: application
    scope: "Building, transpiling and running circuits with Qiskit, primitives and IBM Quantum Runtime."
    examples: [QuantumCircuit, SamplerV2, transpile, Runtime]
    status: live
  - id: cirq-pennylane
    name: Cirq and PennyLane
    kind: application
    scope: "Writing circuits and variational models in Cirq and PennyLane, with gradients and framework interop."
    examples: [Cirq circuits, QNodes, gradients, conversion]
    status: live
  - id: quantum-algorithms
    name: Quantum Algorithms
    kind: craft
    scope: "Implementing and reasoning about Grover, QFT, phase estimation, Shor, VQE, QAOA, Hamiltonian simulation and QML."
    examples: [Grover, QPE, VQE, Trotter]
    status: live
  - id: quantum-error-correction-noise
    name: Quantum Error Correction and Noise
    kind: craft
    scope: "Modelling noise, mitigating errors, benchmarking devices and understanding QEC codes and resource estimation."
    examples: [noise models, ZNE, randomized benchmarking, surface code]
    status: live
  - id: quantum-cloud-hardware
    name: Quantum Cloud, Hardware and PQC
    kind: craft
    scope: "OpenQASM 3, cloud quantum services, hardware constraints, IBM certification prep and NIST post-quantum standards at a software level."
    examples: [OpenQASM 3, Braket, ML-KEM, hybrid TLS]
    status: live
