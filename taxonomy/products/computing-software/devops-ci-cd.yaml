category: computing-software
field: devops-ci-cd
products:
  - id: github-actions
    name: GitHub Actions
    kind: application
    scope: "CI/CD on GitHub Actions: workflows, runners, matrix builds, caching, reusable workflows and release automation."
    examples: [workflow design, matrix builds, caching strategy, reusable workflows]
    status: live
  - id: gitlab-ci
    name: GitLab CI
    kind: application
    scope: "CI/CD on GitLab: pipeline configuration, runners, environments, and merge-request pipelines."
    examples: [pipeline stages, runner setup, environments and review apps, DAG pipelines]
    status: live
  - id: jenkins
    name: Jenkins
    kind: application
    scope: "CI/CD with Jenkins: declarative pipelines, agents, shared libraries and plugin administration."
    examples: [declarative pipelines, agent management, shared libraries, plugin upkeep]
    status: live
  - id: argo-cd
    name: Argo CD & GitOps Tooling
    kind: application
    scope: "GitOps delivery with Argo CD and Flux: app-of-apps layouts, sync policies and progressive delivery hooks."
    examples: [app-of-apps, sync waves, automated vs manual sync, rollback]
    status: live
  - id: ci-pipeline-design
    name: CI Pipeline Design
    kind: craft
    scope: "Designing build-and-test pipelines regardless of platform: stages, parallelism, flaky-test control and fast feedback."
    examples: [stage ordering, test parallelisation, flaky-test quarantine, pipeline speed budgets]
    status: live
  - id: release-engineering
    name: Release Engineering
    kind: craft
    scope: "Shipping software predictably: versioning, changelogs, release trains, feature flags and artifact promotion."
    examples: [semantic versioning, release branching, feature flags, artifact promotion]
    status: live
  - id: deployment-strategies
    name: Deployment Strategies
    kind: craft
    scope: "Rolling changes into production safely: blue-green, canary, rolling deploys, rollbacks and database migrations in flight."
    examples: [canary releases, blue-green cutover, rollback planning, zero-downtime migrations]
    status: live
  - id: build-systems
    name: Build Systems & Automation
    kind: craft
    scope: "Making builds fast, reproducible and cacheable: build graphs, dependency caching, monorepo tooling and hermetic builds."
    examples: [incremental builds, dependency caching, monorepo build tooling, reproducible builds]
    status: live
  - id: secrets-management
    name: Secrets & Supply-Chain Hygiene
    kind: craft
    scope: "Keeping credentials and dependencies safe in the delivery pipeline: secret stores, rotation, signing and SBOMs."
    examples: [vault integration, secret rotation, artifact signing, dependency pinning]
    status: live
  - id: nomad
    name: HashiCorp Nomad
    kind: application
    scope: "Scheduling and operating workloads with Nomad: job specs, task drivers, scheduling, networking, Consul/Vault integration, ACLs, clustering and operations."
    examples: [job specification, task drivers, ACL policies, autoscaling]
    status: live
  - id: gitea
    name: Gitea
    kind: application
    scope: "Self-hosting and administering Gitea: installation, configuration, authentication, Actions CI, packages, webhooks, backup and upgrade."
    examples: [app.ini settings, Gitea Actions, act_runner, backup and restore]
    status: live
  - id: argo-workflows
    name: Argo Workflows
    kind: application
    scope: "Running Argo Workflows on Kubernetes: workflow specs, templates, artifacts, cron workflows, retries, Argo Server, security and operations."
    examples: [WorkflowTemplate, CronWorkflow, artifact repository, Argo Server]
    status: live
  - id: flux
    name: Flux
    kind: application
    scope: "GitOps delivery with Flux: bootstrap, sources, Kustomizations, HelmReleases, image automation, notifications, multi-tenancy and operations."
    examples: [flux bootstrap, Kustomization, HelmRelease, image update automation]
    status: live
  - id: renovate
    name: Renovate
    kind: application
    scope: "Automating dependency updates with Renovate: configuration and presets, package rules, managers and datasources, scheduling and noise reduction, automerge, self-hosting and platform setup."
    examples: [packageRules, shareable presets, grouping and schedules, self-hosted configuration]
    status: live
  - id: backstage
    name: Backstage
    kind: application
    scope: "Running Backstage as a developer portal: software catalog and descriptors, software templates, TechDocs, search, authentication, configuration, deployment and plugins."
    examples: [catalog-info.yaml, scaffolder templates, TechDocs, sign-in resolvers]
    status: live
  - id: woodpecker-ci
    name: Woodpecker CI
    kind: application
    scope: "Using and operating Woodpecker CI: pipeline syntax, steps, services, workflows, secrets, plugins, server and agent configuration, forges, backends and the CLI."
    examples: [pipeline YAML, when filters, matrix builds, agent backends, woodpecker-cli]
    status: live
  - id: argo-rollouts
    name: Argo Rollouts
    kind: application
    scope: "Progressive delivery on Kubernetes with Argo Rollouts: blue-green and canary strategies, traffic routers, analysis templates, experiments, notifications and the kubectl plugin."
    examples: [canary steps, blue-green promotion, AnalysisTemplate, traffic routing, kubectl argo rollouts]
    status: live
  - id: kustomize
    name: Kustomize
    kind: application
    scope: "Template-free Kubernetes configuration with Kustomize: bases and overlays, patches, generators, images, replacements, Helm inflation and the CLI."
    examples: [kustomization.yaml, patches, configMapGenerator, replacements, kustomize build]
    status: live
  - id: skaffold
    name: Skaffold
    kind: application
    scope: "Continuous development and delivery for Kubernetes with Skaffold: builders, tagging, renderers, deployers, profiles, dev loop, file sync, tests and CI/CD."
    examples: [skaffold dev, skaffold run, profiles, file sync, skaffold render]
    status: live
  - id: forgejo
    name: Forgejo
    kind: application
    scope: "Administering and using Forgejo: installation, app.ini configuration, authentication, repositories, Actions runners, packages, federation, backups and upgrades."
    examples: [app.ini, Forgejo Actions, forgejo-runner, forgejo CLI, package registry]
    status: live
  - id: helm
    name: Helm
    kind: application
    scope: "Packaging and releasing Kubernetes applications with Helm: charts, templates, values, hooks, dependencies, repositories, OCI registries, signing, plugins and release lifecycle."
    examples: [helm install, helm upgrade, values.yaml, chart hooks, helm template]
    status: live
  - id: packer
    name: Packer
    kind: application
    scope: "Building machine images with HashiCorp Packer: HCL templates, sources, builders, provisioners, post-processors, variables, plugins, CLI and HCP Packer."
    examples: [packer build, source blocks, provisioner shell, packer init, post-processors]
    status: live
  - id: gitlab-runner
    name: GitLab Runner
    kind: application
    scope: "Installing, registering, configuring and securing GitLab Runner and its executors"
    examples: [Docker executor, Kubernetes executor, autoscaler]
    status: live
  - id: atlantis
    name: Atlantis
    kind: application
    scope: "Running Atlantis for Terraform and OpenTofu pull request automation: comment commands, atlantis.yaml projects, autoplan and autodiscovery, server-side repo config, custom workflows, hooks, locking, policy checking, security and metrics."
    examples: [atlantis plan, atlantis.yaml, repos.yaml, workflows, conftest policy checks]
    status: live
  - id: gradle
    name: Gradle
    kind: application
    scope: "Using Gradle build tool: command line, wrapper, daemon, build cache, configuration cache, version catalogs, dependency locking and verification, constraints and platforms, composite builds, init scripts, toolchains, testing and upgrades."
    examples: [gradlew, libs.versions.toml, build cache, configuration cache, includeBuild]
    status: live
  - id: bazel
    name: Bazel
    kind: application
    scope: "Using Bazel build system: bazelrc, bzlmod modules and lockfile, remote and disk caching, query/cquery/aquery, toolchain resolution, labels, testing and coverage, output directories and build event protocol."
    examples: [bazelrc, MODULE.bazel, bazel query, remote cache, bazel coverage]
    status: live
  - id: tekton
    name: Tekton Pipelines
    kind: application
    scope: "Building CI/CD on Kubernetes with Tekton Pipelines: Tasks, steps, Pipelines, TaskRuns and PipelineRuns, parameters, results, workspaces, matrix and when expressions, finally tasks, retries and timeouts, remote resolvers, authentication, events, metrics, HA and security."
    examples: [Task, PipelineRun, workspaces, git resolver, onError, taskRunSpecs]
    status: live
  - id: flagger
    name: Flagger
    kind: application
    scope: "Progressive delivery on Kubernetes with Flagger: Canary resource, canary, blue/green and A/B strategies, traffic weights, metric checks and MetricTemplates, webhooks and manual gating, alerting, monitoring, installation and mesh or ingress integration."
    examples: [Canary, MetricTemplate, thresholdRange, confirm-rollout, AlertProvider]
    status: live
  - id: sealed-secrets
    name: Sealed Secrets
    kind: application
    scope: "Storing Kubernetes secrets safely in Git with Sealed Secrets: the controller and kubeseal CLI, sealing scopes, templates, key renewal and rotation, backup and recovery, and installation."
    examples: [kubeseal, SealedSecret scopes, key renewal, offline sealing, re-encrypt]
    status: live
  - id: argo-events
    name: Argo Events
    kind: application
    scope: "Event-driven automation on Kubernetes with Argo Events: EventSources, Sensors and triggers, EventBus (JetStream, Kafka, NATS Streaming), filters, trigger conditions and parameterization, high availability, RBAC, metrics, linting and installation."
    examples: [EventSource, Sensor, EventBus, conditions, dataTemplate]
    status: live
  - id: awx-operator
    name: AWX Operator
    kind: application
    scope: "Deploying and configuring AWX on Kubernetes with the AWX Operator: installation and upgrade, database, networking and ingress, extra settings, images, volumes, scheduling, resources, scaling, mesh ingress, certificates and persistence."
    examples: [AWX custom resource, extra_settings, AWXMeshIngress, postgres_configuration_secret, ingress_type]
    status: live
  - id: argocd-image-updater
    name: Argo CD Image Updater
    kind: application
    scope: "Automating container image updates for Argo CD applications: installation, image annotations, update strategies, argocd and git write-back, registries and credentials, webhooks, the run and test commands and migration."
    examples: [update-strategy, write-back-method, allow-tags, registries.conf, argocd-image-updater test]
    status: live
  - id: concourse-ci
    name: Concourse CI
    kind: application
    scope: "Running Concourse CI: architecture and workers, pipelines, jobs, resources and resource types, steps (get, put, task, set_pipeline, across), task config, vars and credential managers (Vault, AWS, Kubernetes, CredHub, Conjur), the fly CLI, teams and authentication, container placement, garbage collection and tuning."
    examples: [fly set-pipeline, across step, get step, task config, instanced pipelines, container placement, credential manager, fly intercept]
    status: live
  - id: spinnaker
    name: Spinnaker
    kind: application
    scope: "Operating Spinnaker continuous delivery with Halyard: microservice architecture, cloud provider and artifact accounts, storage and Redis or SQL persistence, authentication (OAuth2, SAML, LDAP, x509), Fiat authorization, SSL, scaling and sharding, rate limiting, sizing, and monitoring."
    examples: [hal config provider, hal deploy apply, Fiat roles, orca-local.yml, clouddriver sharding, monitoring daemon]
    status: live
  - id: verdaccio
    name: Verdaccio
    kind: application
    scope: "Running Verdaccio, the lightweight private npm proxy registry: installation, config.yaml, storage and tokens, uplinks and caching, package access groups, htpasswd and plugins, feature flags (staged publishing, two-factor, web login), web UI, notifications, logging, Docker, Helm, reverse proxies, services and npm, pnpm, yarn and bun client setup."
    examples: [verdaccio --config, uplinks, packages access, npm stage publish, htpasswd, url_prefix, publishConfig.registry]
    status: live
  - id: rundeck
    name: Rundeck
    kind: application
    scope: "Running Rundeck runbook automation: installation, projects, nodes and resource models, jobs and workflow steps, options, scheduling, ACL policies, authentication, plugins, execution logs and storage, webhooks, API, CLI, clustering, and administration."
    examples: [job definition YAML, node source resource-model, aclpolicy files, rd CLI, webhook plugin, rundeck-config.properties]
    status: live
