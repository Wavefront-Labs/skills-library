category: computing-software
field: offensive-security
products:
  - id: metasploit
    name: Metasploit Framework
    kind: application
    scope: "Using the Metasploit framework within authorised, scoped security assessments to validate findings and demonstrate impact."
    examples: [workspace organisation, reporting evidence, test automation, session management]
    status: draft
  - id: burp-suite
    name: Burp Suite
    kind: application
    scope: "Assessing web application security with Burp Suite during authorised engagements: proxying, scanning and documenting findings."
    examples: [intercepting proxy, authenticated scanning, finding triage, reporting]
    status: draft
  - id: nmap
    name: Nmap
    kind: application
    scope: "Authorised network and service discovery with Nmap: host inventory, service identification and scan scripting for assessments."
    examples: [host discovery, service identification, scan scripting, output parsing]
    status: draft
  - id: kali-linux
    name: Kali Linux
    kind: application
    scope: "Using the Kali Linux assessment distribution: tooling setup, environment management and workflow for authorised testing."
    examples: [tooling setup, environment management, lab configuration, workflow organisation]
    status: draft
  - id: penetration-testing
    name: Penetration Testing
    kind: craft
    scope: "Conducting authorised, scoped security assessments regardless of tool: scoping, methodology, evidence capture and reporting."
    examples: [engagement scoping, methodology (PTES/OWASP), evidence capture, remediation reporting]
    status: draft
  - id: web-application-testing
    name: Web Application Security Testing
    kind: craft
    scope: "Assessing web applications for weaknesses under authorisation: the OWASP methodology, common weakness classes and reporting."
    examples: [OWASP testing guide, authorisation-flaw assessment, input-handling review, findings write-up]
    status: draft
  - id: red-teaming
    name: Red Teaming
    kind: craft
    scope: "Running authorised adversary-simulation engagements that test detection and response end to end, with rules of engagement."
    examples: [objective-based engagements, rules of engagement, detection testing, purple-team debrief]
    status: draft
  - id: vulnerability-research
    name: Vulnerability Research
    kind: craft
    scope: "Finding and responsibly disclosing software weaknesses: analysis technique, proof-of-concept validation and coordinated disclosure."
    examples: [weakness analysis, proof-of-concept validation, coordinated disclosure, CVE handling]
    status: draft
  - id: bug-bounty-hunting
    name: Bug Bounty Hunting
    kind: craft
    scope: "Working within published bug-bounty programmes: reading program scope, reproducible reporting and disclosure etiquette."
    examples: [scope reading, reconnaissance, reproducible reports, disclosure etiquette]
    status: draft
  - id: social-engineering-assessment
    name: Social Engineering Assessment
    kind: craft
    scope: "Testing the human attack surface under authorisation: phishing simulations, awareness assessment and ethical boundaries."
    examples: [phishing simulation, pretext design within scope, awareness measurement, ethical boundaries]
    status: draft
