category: computing-software
field: email-administration
products:
  - id: mail-server-administration
    name: Mail Server Administration
    kind: craft
    scope: "Running SMTP and IMAP mail systems (Postfix, Dovecot style): DNS records, authentication, filtering, queues and deliverability."
    examples: [Postfix configuration, SPF DKIM DMARC, queue triage, TLS for mail]
    status: live
  - id: dovecot
    name: Dovecot
    kind: application
    scope: "Running Dovecot IMAP/POP3/LMTP servers: configuration syntax, authentication, mailbox formats, TLS, Sieve, quotas, replication and doveadm."
    examples: [dovecot.conf, passdb and userdb, doveadm, Sieve, dsync replication]
    status: live
  - id: mailcow
    name: Mailcow
    kind: application
    scope: "Running a mailcow-dockerized mail server: installation, DNS, certificates, reverse proxy, updates, backup and restore, migration, Rspamd, ClamAV, netfilter, authentication, Dovecot, SOGo, monitoring and troubleshooting."
    examples: [mailcow.conf and update.sh, backup and restore scripts, Rspamd learning, SNAT bindings, Keycloak OIDC login]
    status: live
