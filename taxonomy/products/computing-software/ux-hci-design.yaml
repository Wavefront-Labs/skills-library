category: computing-software
field: ux-hci-design
products:
  - id: usability-heuristics
    name: Usability Heuristics & Evaluation
    kind: craft
    scope: "Applying Nielsen's 10 usability heuristics and running heuristic evaluations on interfaces."
    examples: [heuristic evaluation, severity rating, error prevention, consistency]
    status: live
  - id: wcag-accessibility
    name: WCAG & Web Accessibility
    kind: application
    scope: "Meeting WCAG 2.2 success criteria and WAI-ARIA authoring practices in web interfaces, and testing for them."
    examples: [colour contrast, keyboard access, ARIA patterns, accessibility audit]
    status: live
  - id: interaction-design
    name: Interaction Design
    kind: craft
    scope: "Designing forms, navigation, feedback and input behaviour using established interaction principles."
    examples: [form design, navigation patterns, microinteractions, Fitts and Hick laws]
    status: live
  - id: ux-research-methods
    name: UX Research Methods
    kind: craft
    scope: "Planning and running qualitative and quantitative user research, following ISO 9241-210 human-centred design."
    examples: [usability testing, interviews, card sorting, SUS surveys]
    status: live
  - id: design-systems
    name: Design Systems
    kind: craft
    scope: "Building and governing design tokens, component libraries and documentation shared by product teams."
    examples: [design tokens, component API, theming, governance]
    status: live
  - id: platform-guidelines
    name: Platform Design Guidelines
    kind: application
    scope: "Designing to Apple Human Interface Guidelines and Material Design 3 conventions."
    examples: [Apple HIG, Material 3, touch targets, adaptive layout]
    status: live
