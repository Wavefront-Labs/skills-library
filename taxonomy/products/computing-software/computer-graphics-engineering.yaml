category: computing-software
field: computer-graphics-engineering
products:
  - id: opengl
    name: OpenGL / Vulkan
    kind: application
    scope: "Real-time graphics with OpenGL and Vulkan: the rendering pipeline, buffers, shaders and GPU resource management."
    examples: [pipeline setup, vertex/fragment stages, buffer management, synchronisation]
    status: live
  - id: directx
    name: DirectX
    kind: application
    scope: "Real-time graphics on Windows with Direct3D: the pipeline, HLSL shaders, resource binding and command lists."
    examples: [Direct3D pipeline, HLSL, resource binding, command lists]
    status: live
  - id: opencv
    name: OpenCV
    kind: application
    scope: "Image processing and computer vision with OpenCV: filtering, feature detection, transforms and camera calibration."
    examples: [image filtering, feature detection, geometric transforms, camera calibration]
    status: live
  - id: webgl-threejs
    name: WebGL / Three.js
    kind: application
    scope: "Graphics in the browser with WebGL and Three.js: scenes, meshes, materials, shaders and real-time rendering."
    examples: [scene graph, materials, custom shaders, performance budgets]
    status: live
  - id: shader-programming
    name: Shader Programming
    kind: craft
    scope: "Writing GPU shaders regardless of API: vertex and fragment programs, lighting models, and effects on the GPU."
    examples: [lighting models, post-processing effects, procedural patterns, shader optimisation]
    status: live
  - id: rendering-techniques
    name: Rendering Techniques
    kind: craft
    scope: "The algorithms that turn scenes into images regardless of API: rasterisation, ray tracing, lighting and shadows."
    examples: [rasterisation, ray tracing, global illumination, shadow mapping]
    status: live
  - id: computer-vision
    name: Computer Vision Engineering
    kind: craft
    scope: "Extracting information from images regardless of tool: detection, tracking, segmentation and geometric reconstruction."
    examples: [object detection, tracking, segmentation, 3D reconstruction]
    status: live
  - id: graphics-math
    name: Graphics Mathematics
    kind: craft
    scope: "The applied maths graphics code rests on: linear algebra for transforms, projection, quaternions and colour spaces."
    examples: [transform matrices, projection, quaternions, colour spaces]
    status: live
  - id: gpu-optimisation
    name: GPU Performance Optimisation
    kind: craft
    scope: "Making graphics code fast on the GPU regardless of API: profiling, batching, memory bandwidth and overdraw control."
    examples: [draw-call batching, bandwidth reduction, overdraw control, GPU profiling]
    status: live
