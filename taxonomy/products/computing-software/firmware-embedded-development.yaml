category: computing-software
field: firmware-embedded-development
products:
  - id: arduino
    name: Arduino
    kind: application
    scope: "Firmware on the Arduino platform and its library ecosystem: sketches, cores, sensors and rapid prototyping."
    examples: [sketch structure, sensor libraries, serial debugging, custom board cores]
    status: live
  - id: esp-idf
    name: ESP32 / ESP-IDF
    kind: application
    scope: "Firmware for Espressif ESP32-family chips with ESP-IDF and Arduino cores: Wi-Fi, BLE, deep sleep and OTA."
    examples: [Wi-Fi provisioning, BLE services, deep-sleep budgeting, OTA updates]
    status: live
  - id: stm32
    name: STM32 / STM32Cube
    kind: application
    scope: "Firmware for STM32 microcontrollers with the STM32Cube toolchain: HAL, peripherals, clocks and low-power modes."
    examples: [HAL peripheral setup, clock-tree configuration, DMA transfers, low-power modes]
    status: live
  - id: platformio
    name: PlatformIO
    kind: application
    scope: "Cross-platform embedded build and dependency tooling with PlatformIO: environments, libraries and CI for firmware."
    examples: [multi-board environments, library management, unit testing on-target, CI builds]
    status: live
  - id: freertos
    name: FreeRTOS
    kind: application
    scope: "Real-time firmware on FreeRTOS: tasks, queues, semaphores, timing guarantees and memory configuration."
    examples: [task priorities, queue-based design, ISR-safe APIs, stack sizing]
    status: live
  - id: iot-protocols
    name: IoT Protocols (MQTT, CoAP, LoRaWAN, Matter)
    kind: application
    scope: "Designing and operating IoT messaging and device protocols: MQTT 3.1.1 and 5, CoAP, LwM2M, LoRaWAN, Thread and Matter, with security and fleet provisioning."
    examples: [MQTT QoS and sessions, CoAP observe, LoRaWAN device classes, Matter commissioning]
    status: live
  - id: zephyr
    name: Zephyr RTOS
    kind: application
    scope: "Firmware on the Zephyr RTOS: devicetree, Kconfig, west workspaces and the driver model."
    examples: [devicetree overlays, Kconfig tuning, west manifests, driver bindings]
    status: live
  - id: bare-metal-programming
    name: Bare-Metal Programming
    kind: craft
    scope: "Writing firmware without an OS: startup code, linker scripts, registers, interrupts and memory-mapped peripherals."
    examples: [linker scripts, vector tables, register-level peripheral control, volatile correctness]
    status: live
  - id: device-driver-development
    name: Device Driver Development
    kind: craft
    scope: "Writing drivers that connect hardware to software: bus protocols, datasheet reading and kernel or HAL driver models."
    examples: [I2C/SPI/UART drivers, datasheet interpretation, interrupt handling, Linux kernel modules]
    status: live
  - id: bootloader-development
    name: Bootloader Development
    kind: craft
    scope: "Writing and securing the code that brings a device up: boot stages, firmware update paths and secure boot."
    examples: [boot sequencing, dual-bank updates, secure boot chains, rollback protection]
    status: live
  - id: hardware-debugging
    name: Hardware-Level Debugging
    kind: craft
    scope: "Diagnosing firmware faults with hardware tools: JTAG/SWD debuggers, logic analysers and oscilloscopes."
    examples: [JTAG/SWD sessions, logic analyser capture, hard-fault analysis, signal-level diagnosis]
    status: live
  - id: low-power-design
    name: Low-Power Firmware Design
    kind: craft
    scope: "Designing firmware for battery and energy budgets: sleep states, duty cycling and power measurement."
    examples: [sleep-state selection, wake-source design, current profiling, duty-cycle budgeting]
    status: live
  - id: esphome
    name: ESPHome
    kind: application
    scope: "Building device firmware from YAML with ESPHome: core configuration, WiFi, native API, OTA, safe mode, logger, deep sleep, substitutions, packages, external components, web server and automations."
    examples: [wifi fallback ap, api encryption, safe_mode, deep_sleep, packages]
    status: live
