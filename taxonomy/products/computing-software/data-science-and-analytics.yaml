category: computing-software
field: data-science-and-analytics
products:
  - id: pandas-numpy
    name: pandas & NumPy
    kind: application
    scope: "Tabular and array analysis in Python with pandas and NumPy: loading, cleaning, reshaping, aggregating and vectorised computation."
    examples: [DataFrame cleaning, groupby aggregation, merges, vectorised arrays]
    status: live
  - id: statistics-for-practitioners
    name: Statistics for Practitioners
    kind: craft
    scope: "Applied statistics with SciPy and statsmodels: describing data, testing hypotheses, intervals, regression and Bayesian basics."
    examples: [t-tests, confidence intervals, linear regression, multiple testing]
    status: live
  - id: jupyter-notebooks
    name: Jupyter Notebooks
    kind: application
    scope: "Working with Jupyter notebooks: kernels, magics, reproducibility, parameterised execution and conversion."
    examples: [magics, nbconvert, papermill runs, reproducible notebooks]
    status: live
  - id: data-visualization
    name: Data Visualization
    kind: craft
    scope: "Charting with matplotlib, seaborn and Plotly plus the design principles that make charts honest and readable."
    examples: [matplotlib figures, seaborn plots, chart choice, colour use]
    status: live
  - id: experiment-design
    name: Experiment Design & Causal Inference
    kind: craft
    scope: "Designing and analysing online controlled experiments and observational causal studies."
    examples: [A/B test design, sample ratio mismatch, power analysis, difference-in-differences]
    status: live
  - id: bi-tools
    name: BI Tools (Tableau & Power BI)
    kind: application
    scope: "Building analytic models, calculations and dashboards in Tableau and Power BI."
    examples: [LOD expressions, DAX measures, star-schema models, scheduled refresh]
    status: live
  - id: apache-superset
    name: Apache Superset
    kind: application
    scope: "Administering and using Apache Superset: datasets, charts, dashboards, SQL Lab, security roles, caching, alerts and reports and deployment configuration."
