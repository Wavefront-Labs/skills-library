category: computing-software
field: blockchain-and-web3
products:
  - id: ethereum-evm
    name: Ethereum & the EVM
    kind: application
    scope: "Ethereum accounts, transactions, gas, EVM execution, ABI, JSON-RPC and layer-2 concepts."
    examples: [gas, ABI encoding, JSON-RPC, rollups]
    status: live
  - id: solidity
    name: Solidity
    kind: application
    scope: "Writing Solidity smart contracts: types, storage, errors, events, upgradeability, ERC standards and gas."
    examples: [storage layout, ERC-20, proxies, custom errors]
    status: live
  - id: smart-contract-security
    name: Smart Contract Security (defensive)
    kind: craft
    scope: "Defensive review and hardening of smart contracts: vulnerability patterns, fixes, audit process."
    examples: [reentrancy fixes, access control review, oracle safety, invariants]
    status: live
  - id: foundry-hardhat-tooling
    name: Foundry & Hardhat Tooling
    kind: application
    scope: "Building, testing, deploying and verifying contracts with Foundry, Hardhat and static analysers."
    examples: [forge test, cast, hardhat deploy, slither]
    status: live
  - id: bitcoin
    name: Bitcoin
    kind: application
    scope: "Bitcoin UTXOs, Script, transactions, fees, bitcoin-cli and running a node."
    examples: [UTXO model, Script types, bitcoin-cli, fee bumping]
    status: live
  - id: wallets-and-keys
    name: Wallets & Keys
    kind: craft
    scope: "Key generation, HD wallets, addresses, signing and safe custody practices."
    examples: [BIP-39 seeds, multisig, hardware wallets, EIP-712 signing]
    status: live
  - id: consensus-and-protocols
    name: Consensus & Protocols
    kind: craft
    scope: "Proof of work, proof of stake, BFT consensus, peer-to-peer networking, forks and finality."
    examples: [Gasper finality, slashing, mempool, reorgs]
    status: live
