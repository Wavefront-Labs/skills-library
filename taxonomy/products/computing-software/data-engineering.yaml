category: computing-software
field: data-engineering
products:
  - id: apache-spark
    name: Apache Spark
    kind: application
    scope: "Large-scale data processing with Spark: DataFrame pipelines, partitioning, joins at scale and job tuning."
    examples: [DataFrame pipelines, partition strategy, shuffle tuning, skew handling]
    status: live
  - id: apache-airflow
    name: Apache Airflow
    kind: application
    scope: "Orchestrating data pipelines with Airflow: DAG design, scheduling, sensors, backfills and operational hygiene."
    examples: [DAG design, backfills, sensor patterns, task retries and SLAs]
    status: live
  - id: dbt
    name: dbt
    kind: application
    scope: "Transformations in the warehouse with dbt: model layering, tests, documentation, incremental models and deployment."
    examples: [model layering, incremental models, dbt tests, exposure documentation]
    status: live
  - id: apache-kafka
    name: Apache Kafka
    kind: application
    scope: "Event streaming with Kafka: topics, partitions, producers/consumers, delivery semantics and cluster operations."
    examples: [topic and partition design, consumer groups, exactly-once semantics, retention policy]
    status: live
  - id: snowflake
    name: Snowflake
    kind: application
    scope: "Warehousing on Snowflake: virtual warehouses, micro-partitioning behaviour, cost control and data sharing."
    examples: [warehouse sizing, clustering keys, cost monitoring, secure data sharing]
    status: live
  - id: databricks
    name: Databricks
    kind: application
    scope: "Lakehouse engineering on Databricks: Delta Lake tables, jobs and workflows, Unity Catalog and cluster policy."
    examples: [Delta Lake tables, workflow jobs, Unity Catalog governance, cluster sizing]
    status: live
  - id: apache-flink
    name: Apache Flink
    kind: application
    scope: "Stateful stream processing with Flink: event time, watermarks, state backends and exactly-once pipelines."
    examples: [event-time windows, watermark strategy, state management, checkpoint tuning]
    status: live
  - id: data-modelling
    name: Data Modelling
    kind: craft
    scope: "Shaping data for analytics regardless of platform: dimensional models, slowly changing dimensions and wide-table trade-offs."
    examples: [star schemas, slowly changing dimensions, grain decisions, One Big Table trade-offs]
    status: live
  - id: etl-pipeline-design
    name: ETL/ELT Pipeline Design
    kind: craft
    scope: "Designing batch data pipelines regardless of tool: idempotency, incremental loads, late data and failure recovery."
    examples: [idempotent loads, incremental extraction, late-arriving data, replayable pipelines]
    status: live
  - id: streaming-architecture
    name: Streaming Architecture
    kind: craft
    scope: "Designing real-time data systems regardless of engine: delivery guarantees, ordering, backpressure and stream-table duality."
    examples: [delivery guarantees, ordering and keys, backpressure handling, lambda vs kappa]
    status: live
  - id: data-quality
    name: Data Quality Engineering
    kind: craft
    scope: "Keeping data trustworthy: validation rules, anomaly detection on pipelines, contracts, lineage and freshness SLAs."
    examples: [validation checks, data contracts, freshness SLAs, lineage tracking]
    status: live
  - id: data-warehouse-architecture
    name: Warehouse & Lakehouse Architecture
    kind: craft
    scope: "Structuring an organisation's analytical estate: layered zones, medallion layouts, governance and platform selection."
    examples: [medallion architecture, raw/staging/mart layering, access governance, platform selection]
    status: live
  - id: dagster
    name: Dagster
    kind: application
    scope: "Building and operating Dagster data pipelines: assets, ops and jobs, resources, partitions, schedules and sensors, IO managers, testing, and deployment."
    examples: [software-defined assets, partitions, sensors, resources]
    status: live
  - id: metabase
    name: Metabase
    kind: application
    scope: "Administering and using Metabase: SQL variables, query builder, dashboards, models, transforms, permissions, caching, deployment, SSO and embedding."
    examples: [SQL field filters, data permissions, serialization, JWT SSO]
    status: live
  - id: prefect
    name: Prefect
    kind: application
    scope: "Orchestrating workflows with Prefect: flows and tasks, deployments, work pools and workers, schedules, automations, blocks and variables, and Prefect Server operation."
    examples: [deployments with prefect.yaml, work pools and workers, retries and caching, automations]
    status: live
  - id: druid
    name: Apache Druid
    kind: application
    scope: "Operating Apache Druid real-time analytics: service architecture, segments and deep storage, metadata storage, rollup and partitioning, Kafka and Kinesis supervisors, compaction, retention and deletion, multi-stage query ingestion, query tuning and caching, security, TLS and rolling updates."
    examples: [supervisor spec, retention rules, auto-compaction, useConcurrentLocks, druid.msq.dart.enabled]
    status: live
  - id: trino
    name: Trino
    kind: application
    scope: "Operating Trino distributed SQL query engine: deployment and configuration, Kubernetes Helm, resource groups, fault-tolerant execution and exchange manager, dynamic filtering, cost-based optimizer and pushdown, TLS, LDAP and password authentication, access control, Web UI, event listeners, OpenMetrics, OpenTelemetry and query limits."
    examples: [resource groups, retry-policy, exchange manager, dynamic filtering, EXPLAIN ANALYZE, MERGE]
    status: live
  - id: apache-pinot
    name: Apache Pinot
    kind: application
    scope: "Operating Apache Pinot real-time OLAP: controller, broker, server and minion components, tenants, schemas and table configs, segments, indexing, batch and stream ingestion, upsert, multi-stage queries, minion tasks, deep storage, rebalance, security and troubleshooting."
    examples: [table config, star-tree index, upsert, rebalance, multi-stage query engine]
    status: live
  - id: apache-nifi
    name: Apache NiFi
    kind: application
    scope: "Building and running Apache NiFi dataflows: flow design, processors and connections, back pressure, Expression Language, parameters, controller services, clustering, security, provenance, registry versioning, nifi.properties and the REST API."
    examples: [back pressure thresholds, RouteOnAttribute, parameter contexts, nifi.properties cluster keys, provenance repository]
    status: live
  - id: apache-hadoop
    name: Apache Hadoop
    kind: application
    scope: "Running Apache Hadoop clusters: HDFS NameNode and DataNodes, replication and erasure coding, YARN scheduling and resources, MapReduce, Kerberos security, high availability, balancers, quotas, snapshots, and core, hdfs, yarn and mapred configuration."
    examples: [dfs.replication, fsck, yarn capacity scheduler queues, HDFS snapshots, hdfs balancer]
    status: live
  - id: kestra
    name: Kestra
    kind: application
    scope: "Orchestrating workflows with Kestra: installation and deployment, flow YAML, tasks and plugins, inputs and outputs, triggers and schedules, flowable tasks, expressions and Pebble templating, namespaces and files, secrets and variables, errors and retries, the API and CLI and server configuration."
    examples: [flow YAML, triggers, Pebble, namespace files, flowable tasks, Subflow, kestra.yml, retry, execution]
    status: live
  - id: polars
    name: Polars
    kind: application
    scope: "Polars: Move Polars data to and from pyarrow zero-copy using to_arrow, CompatLevel, the Arrow PyCapsule Interface (v1.3+) and the Arrow C Data Interface."
    examples: [expressions, io, lazy, group-by, lazyframe]
    status: live
