category: computing-software
field: networking-hardware-and-wireless
products:
  - id: wifi-80211
    name: Wi-Fi (IEEE 802.11)
    kind: craft
    scope: "Designing, securing, surveying and troubleshooting 802.11 wireless LANs from RF basics to roaming and 6 GHz."
    examples: [channel planning, WPA3 deployment, site surveys, roaming tuning]
    status: live
  - id: structured-cabling
    name: Structured Cabling & Physical Layer
    kind: craft
    scope: "Copper and fibre cabling, termination, certification testing, PoE and optics at the physical layer."
    examples: [Cat6A termination, fibre OTDR testing, PoE budgets, optics selection]
    status: live
  - id: switching-routing-hardware
    name: Switching & Routing Hardware
    kind: craft
    scope: "How switches and routers forward in hardware, plus stacking, high availability, data-centre fabrics and hardware lifecycle."
    examples: [TCAM sizing, MLAG design, spine-leaf fabrics, switch upgrades]
    status: live
  - id: network-device-administration
    name: Network Device Administration (Cisco, Juniper, Ubiquiti)
    kind: craft
    scope: "Vendor-style device administration concepts: config models, commit/rollback, controllers, AAA, monitoring and firmware lifecycle."
    examples: [Junos commit model, IOS-XE config archive, UniFi controller, device backups]
    status: live
  - id: sd-wan
    name: SD-WAN
    kind: craft
    scope: "Designing and operating software-defined WANs: overlay architecture, policies, transports, security and operations."
    examples: [overlay design, application-aware routing, hub-and-spoke templates, WAN assurance]
    status: live
  - id: juniper-junos
    name: Juniper Junos OS
    kind: application
    scope: "Configuring and operating Juniper routers, switches and firewalls with Junos: hierarchy, commit model, routing, EVPN-VXLAN and automation."
    examples: [commit confirmed, policy-options, EVPN-VXLAN, PyEZ]
    status: live
  - id: arista-eos
    name: Arista EOS
    kind: application
    scope: "Configuring and operating Arista switches with EOS and CloudVision: MLAG, EVPN-VXLAN, eAPI, CVP and telemetry."
    examples: [MLAG, VXLAN, eAPI, CloudVision]
    status: live
  - id: f5-big-ip
    name: F5 BIG-IP
    kind: application
    scope: "Administering F5 BIG-IP: LTM virtual servers, pools, profiles, iRules, GTM/DNS, ASM/Advanced WAF, APM, HA and TMSH."
    examples: [configuration, troubleshooting, high availability, security]
    status: live
  - id: check-point
    name: Check Point
    kind: application
    scope: "Administering Check Point firewalls: SmartConsole, policy layers, NAT, VPN, Gaia, clustering, logging and troubleshooting."
    examples: [configuration, troubleshooting, high availability, security]
    status: live
  - id: haproxy
    name: HAProxy
    kind: application
    scope: "Running HAProxy: frontends, backends, ACLs, health checks, stick tables, TLS, runtime API, logging and tuning."
    examples: [configuration, troubleshooting, high availability, security]
    status: live
  - id: envoy
    name: Envoy Proxy
    kind: application
    scope: "Running Envoy: listeners, clusters, routes, filters, xDS, load balancing, health checks, TLS, observability and operations."
    examples: [configuration, xDS, load balancing, troubleshooting]
    status: live
  - id: traefik
    name: Traefik Proxy
    kind: application
    scope: "Running Traefik v3: entrypoints, routers, services, middlewares, providers, TLS and ACME, observability and Kubernetes ingress."
    examples: [routers, middlewares, ACME, Kubernetes]
    status: live
  - id: opnsense
    name: OPNsense
    kind: application
    scope: "Running OPNsense firewalls: interfaces, rules, NAT, VPNs, DHCP/DNS, traffic shaping, high availability, plugins and maintenance."
    examples: [firewall rules, OpenVPN and WireGuard, CARP failover, Unbound DNS]
    status: live
  - id: caddy
    name: Caddy
    kind: application
    scope: "Running Caddy 2: Caddyfile structure, site addresses, matchers, reverse proxy, automatic HTTPS, TLS, logging and the JSON/API config."
    examples: [Caddyfile directives, reverse_proxy, automatic HTTPS, request matchers]
    status: live
  - id: tailscale
    name: Tailscale
    kind: application
    scope: "Running a Tailscale tailnet: installation, authentication, ACLs and grants, subnet routers, exit nodes, Tailscale SSH, MagicDNS, Serve and Funnel, key expiry, admin console and CLI."
    examples: [tailscale up, ACL policy file, subnet routers, exit nodes, MagicDNS]
    status: live
  - id: wireguard
    name: WireGuard
    kind: application
    scope: "Administering WireGuard VPN: key generation, wg and wg-quick configuration, live peer management, routing and fwmark, network namespaces, keepalive and NAT, preshared keys, handshake timers, limitations, userspace implementations and debugging."
    examples: [wg-quick, wg set, AllowedIPs, PersistentKeepalive, network namespaces]
    status: live
  - id: squid
    name: Squid
    kind: application
    scope: "Running Squid caching proxy: squid.conf, ACLs and access rules, caching, authentication, SSL bump, delay pools, logging and reverse proxy."
    examples: [squid.conf ACLs, cache_peer, ssl_bump, http_access, refresh_pattern]
    status: live
  - id: apache-httpd
    name: Apache HTTP Server
    kind: application
    scope: "Running Apache HTTP Server 2.4: configuration files, virtual hosts, modules, rewrite, proxy, TLS, access control, MPMs, logging and performance."
    examples: [VirtualHost, mod_rewrite, mod_proxy, mod_ssl, MPM tuning]
    status: live
  - id: kea
    name: Kea DHCP
    kind: application
    scope: "Running ISC Kea DHCPv4/DHCPv6: subnets, pools, reservations, host backends, lease databases, high availability, hooks, DDNS, client classification and the control agent."
    examples: [subnets, reservations, high availability, lease databases]
    status: live
  - id: asterisk
    name: Asterisk
    kind: application
    scope: "Running the Asterisk open source PBX: PJSIP endpoints and trunks, dialplan, voicemail, queues, ConfBridge, call features, ARI/AMI/AGI, CDR/CEL, realtime databases, codecs, TLS/SRTP, STIR/SHAKEN, logging and performance."
    examples: [PJSIP, dialplan, queues, ARI]
    status: live
  - id: unbound
    name: Unbound
    kind: application
    scope: "Running the Unbound recursive DNS resolver: unbound.conf, access control, caching, forwarding and stub zones, DNSSEC, local data, views, RPZ, unbound-control and performance tuning."
    examples: [forwarding, DNSSEC, local zones, tuning]
    status: live
  - id: frrouting
    name: FRRouting
    kind: application
    scope: "Running FRRouting: zebra, BGP, OSPF, IS-IS, static and policy routing, route maps, BFD, VRFs, EVPN and vtysh operations."
    examples: [BGP, OSPF, route maps, vtysh]
    status: live
  - id: bind9
    name: BIND 9
    kind: application
    scope: "Running ISC BIND 9 DNS: named.conf, zones, views, ACLs, DNSSEC signing and validation, dynamic update, TSIG, transfers, RPZ, response rate limiting, rndc and logging."
    examples: [named.conf, zone transfers, DNSSEC, views, RPZ]
    status: live
  - id: strongswan
    name: strongSwan
    kind: application
    scope: "Running strongSwan IPsec/IKEv2: swanctl.conf connections, authentication, certificates and PKI, virtual IPs, EAP, routing and policies, VICI and plugins."
    examples: [swanctl.conf, IKEv2 connections, certificates, virtual IPs, EAP]
    status: live
  - id: open-vswitch
    name: Open vSwitch
    kind: application
    scope: "Running Open vSwitch: bridges, ports, interfaces, tunnels, OpenFlow flows and tables, ovs-vsctl and ovs-ofctl, ovs-appctl, OVSDB, bonding, QoS and mirroring, DPDK, conntrack and NAT, and troubleshooting."
    examples: [ovs-vsctl add-port, ovs-ofctl add-flow, VXLAN tunnels, ovs-appctl dpif/dump-flows]
    status: live
  - id: powerdns
    name: PowerDNS
    kind: application
    scope: "Running PowerDNS Authoritative Server: backends (SQL, BIND, LMDB, pipe, remote, GeoIP, lua2), primary/secondary and catalog zones, TSIG, DNSSEC and key rollovers, ALIAS and LUA records, views, pdnsutil, pdns_control, the HTTP API and ixfrdist."
    examples: [pdnsutil zone secure, gmysql-backend, catalog zones, LUA records, key rollover]
    status: live
