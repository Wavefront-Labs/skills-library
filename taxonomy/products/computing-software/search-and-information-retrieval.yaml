category: computing-software
field: search-and-information-retrieval
products:
  - id: elasticsearch-opensearch
    name: Elasticsearch & OpenSearch
    kind: application
    scope: "Indexing, querying, tuning and operating Elasticsearch and OpenSearch clusters: mappings, analysis, query DSL, aggregations, shards and lifecycle."
    examples: [mappings and analyzers, query DSL, shard allocation, ILM and snapshots]
    status: live
  - id: meilisearch
    name: Meilisearch
    kind: application
    scope: "Running and tuning Meilisearch: indexes, documents, search parameters, ranking, filtering, typo tolerance, hybrid search, tasks, keys and operations."
    examples: [filterable attributes, ranking rules, hybrid search, tenant tokens]
    status: live
  - id: typesense
    name: Typesense
    kind: application
    scope: "Running and tuning Typesense: collections, schemas, search parameters, curation, vector search, API keys, clustering and operations."
    examples: [collection schema, faceting, synonyms and overrides, high availability]
    status: live
  - id: qdrant
    name: Qdrant
    kind: application
    scope: "Running Qdrant vector search: collections, points, payloads, filtering, HNSW indexing, quantization, hybrid and sparse vectors, snapshots, distributed mode, security and operations."
    examples: [create collection, payload filter, HNSW, quantization, snapshots]
    status: live
  - id: apache-solr
    name: Apache Solr
    kind: application
    scope: "Running Apache Solr search: schema and analysis, indexing and updates, query parsers, faceting, highlighting, SolrCloud collections, replicas and routing, configuration APIs, security, monitoring and operations."
    examples: [schema design, edismax query, faceting, SolrCloud collection, autocommit tuning, security.json]
    status: live
