category: computing-software
field: collaboration-platform-administration
products:
- id: microsoft-365-admin
  name: Microsoft 365 Admin Center & Tenant Administration
  kind: application
  scope: 'Administering a Microsoft 365 tenant: domains, users, licences, roles, service health, apps deployment and PowerShell automation.'
  examples: [tenant setup, licensing, admin roles, service health, PowerShell]
  status: live
- id: exchange-online
  name: Exchange Online Administration
  kind: application
  scope: 'Administering Exchange Online: mailboxes, mail flow, email authentication, EOP/MDO protection, retention and troubleshooting.'
  examples: [mailboxes, mail flow rules, SPF DKIM DMARC, message trace]
  status: live
- id: teams-sharepoint-onedrive-admin
  name: Teams, SharePoint & OneDrive Administration
  kind: application
  scope: 'Administering Microsoft Teams, SharePoint Online and OneDrive: policies, governance, voice, sharing, permissions and sync.'
  examples: [Teams policies, external sharing, site permissions, OneDrive sync]
  status: live
- id: google-workspace-admin
  name: Google Workspace Administration
  kind: application
  scope: 'Administering Google Workspace: org units, groups, user lifecycle, security, Gmail, Drive, Vault, devices and audit.'
  examples: [org units, 2-step verification, Gmail routing, Vault holds]
  status: live
- id: m365-security-compliance-purview
  name: Microsoft 365 Security & Purview Compliance
  kind: application
  scope: 'Configuring Microsoft Purview and Defender in Microsoft 365: labels, DLP, retention, eDiscovery, audit and secure score.'
  examples: [sensitivity labels, DLP policies, eDiscovery, audit log]
  status: live
- id: tenant-migration
  name: Tenant & Mailbox Migration
  kind: application
  scope: 'Planning and running migrations into and between Microsoft 365 and Google Workspace: mail, files, tenant-to-tenant and cutover.'
  examples: [cutover migration, SharePoint Migration Tool, tenant to tenant, DNS cutover]
  status: live
- id: mattermost
  name: Mattermost
  kind: application
  scope: 'Deploying and administering Mattermost: installation, configuration, authentication, permissions, compliance, integrations, calls and scaling.'
  examples: [config.json settings, SAML and LDAP, high availability, slash commands and webhooks]
  status: live
- id: zulip
  name: Zulip
  kind: application
  scope: 'Administering a self-hosted Zulip server: installation, configuration, authentication, email, upgrades, backups, scaling, security and monitoring.'
  examples: [zulip.conf settings, LDAP authentication, backups, upgrades]
  status: live
- id: nextcloud
  name: Nextcloud
  kind: application
  scope: 'Administering a self-hosted Nextcloud server: installation, config.php, users and groups, sharing, storage, caching, background jobs, backups, upgrades and security hardening.'
  examples: [config.php, occ commands, external storage, background jobs]
  status: live
- id: bookstack
  name: BookStack
  kind: application
  scope: 'Administering a self-hosted BookStack wiki: installation, updates, backup and restore, artisan commands, security settings, mail, LDAP and OIDC authentication, storage, caching, PDF export, roles and permissions, search and export.'
  examples: [.env settings, artisan commands, LDAP group sync, OIDC login, roles and permissions]
  status: live
- id: matrix-synapse
  name: Matrix Synapse
  kind: application
  scope: 'Operating Matrix Synapse homeservers: homeserver.yaml, listeners and reverse proxy, delegation and federation, PostgreSQL, workers and Redis, SSO and OIDC, registration, media repository, retention, admin APIs, modules, metrics and upgrades.'
  examples: [homeserver.yaml, workers, well-known delegation, admin API, OIDC providers, media repository]
  status: live
- id: vikunja
  name: Vikunja
  kind: application
  scope: 'Administering a self-hosted Vikunja to-do and project app: install, configuration, database, authentication (OIDC, LDAP), mailer, CalDAV, migration, API, webhooks, projects, tasks, teams and sharing.'
  examples: [config.yml, OIDC login, CalDAV, importers, webhooks]
  status: live
