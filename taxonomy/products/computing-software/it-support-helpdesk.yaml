category: computing-software
field: it-support-helpdesk
products:
  - id: servicenow
    name: ServiceNow & ITSM Platforms
    kind: application
    scope: "Working in ITSM platforms (ServiceNow, Jira Service Management, Zendesk): ticket workflow, queues and knowledge base."
    examples: [ticket workflow, queue management, knowledge articles, SLA tracking]
    status: live
  - id: intune-mdm
    name: Microsoft Intune & MDM
    kind: application
    scope: "Managing endpoints with Intune and MDM tools: device enrolment, policy, app deployment and compliance."
    examples: [device enrolment, compliance policy, app deployment, remote actions]
    status: live
  - id: apple-device-management
    name: Apple Device Management (Jamf, Apple Business Manager, MDM)
    kind: application
    scope: "Managing Mac, iPhone and iPad fleets: Apple Business Manager, ADE enrolment, MDM profiles and declarative management, Jamf Pro, FileVault, updates and app deployment."
    examples: [ADE zero-touch enrolment, configuration profiles, Jamf smart groups, managed app deployment]
    status: live
  - id: remote-support-tools
    name: Remote Support Tools
    kind: application
    scope: "Supporting users remotely with tools like TeamViewer and remote desktop: session control, file transfer and diagnostics."
    examples: [remote session control, screen sharing, file transfer, unattended access]
    status: live
  - id: desktop-support
    name: Desktop Support
    kind: craft
    scope: "Resolving end-user hardware and software problems hands-on or remotely: OS issues, peripherals and application faults."
    examples: [OS troubleshooting, peripheral issues, application repair, profile problems]
    status: live
  - id: troubleshooting-methodology
    name: Troubleshooting Methodology
    kind: craft
    scope: "Diagnosing end-user problems systematically regardless of platform: isolating variables, reproducing and root-causing."
    examples: [problem isolation, reproduction, hypothesis testing, root-cause confirmation]
    status: live
  - id: device-provisioning
    name: Device Provisioning & Imaging
    kind: craft
    scope: "Preparing and handing over end-user devices: imaging, setup, account configuration and lifecycle (onboarding/offboarding)."
    examples: [imaging, standard build, onboarding setup, offboarding wipe]
    status: live
  - id: user-support-communication
    name: User Support Communication
    kind: craft
    scope: "Handling the human side of support: expectation setting, plain-language explanation, escalation and ticket documentation."
    examples: [expectation setting, plain-language explanation, escalation, ticket documentation]
    status: live
