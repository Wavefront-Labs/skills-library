category: computing-software
field: robotics-software
products:
- id: ros2-core
  name: ROS 2 Core
  kind: application
  scope: 'Building ROS 2 systems: nodes, topics, services, actions, parameters, launch, QoS, lifecycle, tf2, colcon, rosbag2 and middleware.'
  examples:
  - ros2 CLI
  - rclcpp and rclpy
  - launch files
  - rosbag2
  status: live
- id: ros2-navigation-nav2
  name: ROS 2 Navigation (Nav2)
  kind: application
  scope: 'Configuring and tuning Nav2 for mobile robots: costmaps, planners, controllers, behavior trees, localization and docking.'
  examples:
  - costmap_2d
  - behavior trees
  - AMCL
  - controller server
  status: live
- id: moveit-manipulation
  name: MoveIt 2 Manipulation
  kind: application
  scope: 'Motion planning and manipulation with MoveIt 2: setup assistant, planning pipelines, MoveGroup, collision scenes and Servo.'
  examples:
  - setup assistant
  - OMPL
  - planning scene
  - MoveIt Servo
  status: live
- id: robot-simulation-gazebo
  name: Gazebo Robot Simulation
  kind: application
  scope: 'Simulating robots in Gazebo (gz-sim): SDF worlds, models, sensors, plugins and the ros_gz bridge.'
  examples:
  - SDF worlds
  - gz-sim sensors
  - ros_gz_bridge
  - physics tuning
  status: live
- id: robot-perception-slam
  name: Robot Perception and SLAM
  kind: craft
  scope: 'Robot perception pipelines in ROS 2: camera calibration, image transport, point clouds, 2D and 3D SLAM, and sensor fusion.'
  examples:
  - camera calibration
  - slam_toolbox
  - point clouds
  - robot_localization
  status: live
- id: robot-control-and-kinematics
  name: Robot Control and Kinematics
  kind: craft
  scope: 'Robot kinematics, dynamics and control: ros2_control, controllers, forward and inverse kinematics, trajectories and PID tuning.'
  examples:
  - ros2_control
  - inverse kinematics
  - joint trajectory
  - PID tuning
  status: live
