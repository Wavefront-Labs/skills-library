category: mathematics
field: actuarial-science
products:
  - id: life-contingencies
    name: Life Contingencies
    kind: craft
    scope: "The mathematics of life insurance and annuities: life tables, survival models for lives, premiums and reserves for life products."
    examples: [life tables, annuity valuation, net premiums, policy reserves]
    status: live
  - id: survival-analysis
    name: Survival Analysis
    kind: craft
    scope: "Modelling time-to-event data: censoring, Kaplan-Meier estimation, hazard models and proportional-hazards regression as general method."
    examples: [Kaplan-Meier curves, Cox regression, censoring handling, hazard modelling]
    status: live
  - id: loss-modelling
    name: Loss Modelling
    kind: craft
    scope: "Modelling claim frequency and severity: loss distributions, aggregate-loss models, ruin theory and heavy-tail technique."
    examples: [severity distributions, aggregate loss models, ruin probability, tail estimation]
    status: live
  - id: loss-reserving
    name: Loss Reserving
    kind: craft
    scope: "Estimating unpaid claims: run-off triangles, chain-ladder and Bornhuetter-Ferguson methods, and reserve uncertainty."
    examples: [chain ladder, Bornhuetter-Ferguson, triangle diagnostics, reserve ranges]
    status: live
  - id: premium-rating
    name: Premium Rating
    kind: craft
    scope: "Pricing risk transfer as method: exposure and experience rating, GLM-based ratemaking theory and rate adequacy."
    examples: [experience rating, GLM ratemaking, exposure bases, rate indications]
    status: live
  - id: credibility-theory
    name: Credibility Theory
    kind: craft
    scope: "Blending individual experience with collective data: classical and Bühlmann credibility, shrinkage and partial-credibility technique."
    examples: [Bühlmann credibility, limited-fluctuation credibility, shrinkage estimation]
    status: live
  - id: financial-mathematics
    name: Financial Mathematics
    kind: craft
    scope: "The time value of money as actuarial method: interest theory, annuities-certain, bond and cash-flow valuation, duration and immunisation."
    examples: [interest theory, cash-flow valuation, duration matching, immunisation]
    status: live
