category: mathematics
field: numerical-and-computational-mathematics
products:
  - id: numerical-analysis-fundamentals
    name: Numerical Analysis Fundamentals
    kind: craft
    scope: "The core numerical toolkit: floating-point and error analysis, conditioning and stability, root finding, and numerical integration and differentiation."
    examples: [error analysis, conditioning, Newton's method, quadrature rules]
    status: live
  - id: numerical-linear-algebra
    name: Numerical Linear Algebra
    kind: craft
    scope: "Matrix computation at scale: direct and iterative solvers, factorisations, eigenvalue algorithms and exploiting sparsity."
    examples: [LU and QR factorisation, iterative solvers, eigenvalue algorithms, sparse technique]
    status: live
  - id: numerical-differential-equations
    name: Numerical Differential Equations
    kind: craft
    scope: "Solving ODEs and PDEs numerically: time-stepping schemes, stiffness, finite-difference and finite-element methods, and convergence analysis."
    examples: [Runge-Kutta methods, stiff solvers, finite differences, finite elements]
    status: live
  - id: approximation-and-interpolation
    name: Approximation and Interpolation
    kind: craft
    scope: "Representing functions from data: polynomial and spline interpolation, least-squares and Chebyshev approximation, and curve fitting."
    examples: [spline interpolation, Chebyshev approximation, least-squares fitting]
    status: live
  - id: monte-carlo-methods
    name: Monte Carlo Methods
    kind: craft
    scope: "Computing with random sampling: random-number generation, Monte Carlo integration, variance reduction and quasi-Monte Carlo."
    examples: [Monte Carlo integration, variance reduction, quasi-random sequences, sampling technique]
    status: live
  - id: matlab
    name: MATLAB
    kind: application
    scope: "Numerical computing in MATLAB: matrix-oriented programming, toolboxes, visualisation and translating mathematics into efficient MATLAB code."
    examples: [vectorised code, ODE suite, toolbox use, plotting]
    status: live
  - id: mathematica
    name: Mathematica
    kind: application
    scope: "Symbolic and numeric computation with Mathematica/Wolfram Language: symbolic algebra and calculus, equation solving, visualisation and notebook workflows."
    examples: [symbolic manipulation, Solve and DSolve, visualisation, notebook workflows]
    status: live
  - id: numpy-scipy
    name: NumPy / SciPy
    kind: application
    scope: "Scientific computing in the Python stack as mathematical instrument: array computation, SciPy solvers and SymPy symbolic work for mathematical problems."
    examples: [array computation, SciPy optimisation and ODE solvers, SymPy symbolic math]
    status: live
  - id: sagemath
    name: SageMath
    kind: application
    scope: "Open-source mathematical computation with SageMath: unified interface over algebra, number theory, calculus and graph computation."
    examples: [symbolic computation, number-theory computation, graph computation]
    status: live
