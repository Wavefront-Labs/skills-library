category: mathematics
field: cryptographic-theory
products:
  - id: symmetric-cryptography-theory
    name: Symmetric Cryptography Theory
    kind: craft
    scope: "The theory of ciphers and hashes: block and stream cipher design principles, modes of operation, hash and MAC constructions as mathematics."
    examples: [block cipher design, modes of operation, hash constructions, MAC theory]
    status: live
  - id: public-key-cryptography-theory
    name: Public-Key Cryptography Theory
    kind: craft
    scope: "Number-theoretic and algebraic cryptography: RSA, discrete-log and elliptic-curve systems, key exchange and digital-signature theory."
    examples: [RSA mathematics, elliptic-curve cryptography, Diffie-Hellman, signature schemes]
    status: live
  - id: provable-security
    name: Provable Security
    kind: craft
    scope: "Security as theorem: formal security definitions, reduction proofs, random-oracle arguments and complexity-based hardness assumptions."
    examples: [security reductions, IND-CPA/CCA definitions, random-oracle proofs, hardness assumptions]
    status: live
  - id: cryptographic-protocol-theory
    name: Cryptographic Protocol Theory
    kind: craft
    scope: "Multi-party cryptography as theory: zero-knowledge proofs, secret sharing, secure multi-party computation and protocol analysis."
    examples: [zero-knowledge proofs, secret sharing, MPC theory, commitment schemes]
    status: live
  - id: post-quantum-cryptography
    name: Post-Quantum Cryptography
    kind: craft
    scope: "Cryptography resisting quantum attack: lattice, code, hash and isogeny-based constructions and their underlying hardness problems."
    examples: [lattice-based schemes, learning with errors, hash-based signatures]
    status: live
  - id: cryptanalysis
    name: Cryptanalysis
    kind: craft
    scope: "Breaking cryptosystems as mathematics: classical cipher attacks, differential and linear cryptanalysis, and attacks on number-theoretic schemes."
    examples: [differential cryptanalysis, linear cryptanalysis, lattice attacks, classical cipher breaking]
    status: live
  - id: coding-theory
    name: Coding Theory
    kind: craft
    scope: "Error-correcting codes and information theory as mathematics: linear and cyclic codes, bounds, decoding theory and entropy arguments."
    examples: [linear codes, Reed-Solomon codes, decoding bounds, entropy arguments]
    status: live
