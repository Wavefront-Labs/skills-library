category: mathematics
field: combinatorics-and-discrete-mathematics
products:
  - id: enumerative-combinatorics
    name: Enumerative Combinatorics
    kind: craft
    scope: "Counting discrete structures: permutations and combinations, generating functions, recurrences, inclusion-exclusion and bijective proof."
    examples: [generating functions, recurrence solving, inclusion-exclusion, bijective proofs]
    status: live
  - id: graph-theory
    name: Graph Theory
    kind: craft
    scope: "The mathematics of networks: connectivity, colouring, matchings, planarity, trees and structural graph theorems."
    examples: [graph colouring, matchings, planarity, spectral graph arguments]
    status: live
  - id: extremal-and-probabilistic-combinatorics
    name: Extremal and Probabilistic Combinatorics
    kind: craft
    scope: "How large or dense a structure can be before patterns are forced: extremal set and graph theory, Ramsey theory and the probabilistic method."
    examples: [Ramsey-type arguments, extremal graph theory, probabilistic method]
    status: live
  - id: combinatorial-optimisation
    name: Combinatorial Optimisation
    kind: craft
    scope: "Optimising over discrete structures: shortest paths, flows and matchings, matroids, NP-hard problems and approximation as mathematics."
    examples: [network flows, matching algorithms, matroid technique, approximation bounds]
    status: live
  - id: discrete-structures
    name: Discrete Structures
    kind: craft
    scope: "The working toolkit of discrete mathematics: relations, orders and lattices, Boolean algebra, induction and recursion, and combinatorial designs."
    examples: [partial orders, Boolean algebra, induction proofs, block designs]
    status: live
