category: mathematics
field: formal-logic-and-foundations
products:
  - id: propositional-and-predicate-logic
    name: Propositional and Predicate Logic
    kind: craft
    scope: "Symbolic logic as a working tool: truth tables, natural deduction, first-order formalisation, soundness and completeness at user level."
    examples: [natural deduction, formalising arguments, truth-table method, quantifier reasoning]
    status: live
  - id: set-theory
    name: Set Theory
    kind: craft
    scope: "The set-theoretic foundation of mathematics: ZFC axioms, ordinals and cardinals, the axiom of choice and transfinite technique."
    examples: [cardinal arithmetic, transfinite induction, axiom of choice, Zorn's lemma]
    status: live
  - id: model-theory
    name: Model Theory
    kind: craft
    scope: "Structures satisfying theories: compactness, elementary equivalence, types, and model-theoretic technique applied across algebra."
    examples: [compactness arguments, elementary embeddings, quantifier elimination]
    status: live
  - id: proof-theory
    name: Proof Theory
    kind: craft
    scope: "Proofs as mathematical objects: formal systems, cut elimination, incompleteness phenomena and the limits of formalisation."
    examples: [sequent calculus, cut elimination, Gödel incompleteness, consistency arguments]
    status: live
  - id: computability-theory
    name: Computability Theory
    kind: craft
    scope: "What can be computed in principle: Turing machines, decidability, reductions, recursive functions and degrees of unsolvability."
    examples: [decidability proofs, Turing reductions, halting-problem arguments, recursion theorem]
    status: live
  - id: proof-writing
    name: Mathematical Proof Writing
    kind: craft
    scope: "The craft of constructing and writing rigorous proofs in any area: proof strategies, counterexamples, rigour standards and mathematical exposition."
    examples: [proof strategies, contradiction and contrapositive, counterexample hunting, mathematical writing]
    status: live
  - id: lean-prover
    name: Lean Prover
    kind: application
    scope: "Formalising mathematics in Lean: writing definitions and proofs with mathlib, tactic use and maintaining formal developments."
    examples: [tactic proofs, mathlib navigation, formalising theorems]
    status: live
  - id: isabelle
    name: Isabelle/HOL
    kind: application
    scope: "Interactive theorem proving in Isabelle/HOL: structured Isar proofs, automation tools and building verified theories."
    examples: [Isar proofs, sledgehammer automation, theory development]
    status: live
