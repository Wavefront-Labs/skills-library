category: mathematics
field: algebra
products:
  - id: elementary-algebra
    name: Elementary Algebra
    kind: craft
    scope: "Working with symbols and equations below the abstract level: manipulating expressions, solving polynomial and simultaneous equations, inequalities and factorisation."
    examples: [equation solving, factorisation, inequalities, polynomial manipulation]
    status: live
  - id: linear-algebra
    name: Linear Algebra
    kind: craft
    scope: "Vector spaces, matrices and linear maps: solving linear systems, eigenvalues, decompositions, inner-product spaces and their applications."
    examples: [matrix decompositions, eigenvalue problems, vector-space proofs, least squares]
    status: live
  - id: group-theory
    name: Group Theory
    kind: craft
    scope: "The theory of symmetry: group axioms, subgroups, homomorphisms, group actions, classification results and finite-group technique."
    examples: [group actions, Sylow theorems, quotient groups, symmetry classification]
    status: live
  - id: ring-and-field-theory
    name: Ring and Field Theory
    kind: craft
    scope: "Rings, ideals, fields and their extensions: polynomial rings, factorisation, Galois theory and the structure of commutative and non-commutative rings."
    examples: [ideal arithmetic, field extensions, Galois theory, unique factorisation]
    status: live
  - id: representation-theory
    name: Representation Theory
    kind: craft
    scope: "Realising abstract algebraic structures as linear maps: group and algebra representations, characters, modules and decomposition."
    examples: [character tables, irreducible representations, module decomposition]
    status: live
  - id: commutative-and-homological-algebra
    name: Commutative and Homological Algebra
    kind: craft
    scope: "The algebra underlying modern geometry and topology: commutative rings and modules, localisation, exact sequences, chain complexes and derived functors."
    examples: [localisation, exact sequences, Ext and Tor, Noetherian arguments]
    status: live
  - id: gap
    name: GAP
    kind: application
    scope: "Computational group theory and discrete algebra with the GAP system: constructing groups, computing with representations and character tables."
    examples: [group construction, character table computation, permutation groups]
    status: live
