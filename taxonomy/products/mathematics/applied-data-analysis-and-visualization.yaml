category: mathematics
field: applied-data-analysis-and-visualization
products:
  - id: exploratory-data-analysis
    name: Exploratory Data Analysis
    kind: craft
    scope: "Getting to know a dataset before modelling: distributions, outliers, relationships, and iterating between questions, summaries and plots."
    examples: [distribution inspection, outlier hunting, correlation exploration, hypothesis generation]
    status: live
  - id: descriptive-statistics
    name: Descriptive Statistics
    kind: craft
    scope: "Summarising data honestly: central tendency and spread, rates and ratios, index numbers and choosing summaries that do not mislead."
    examples: [summary-statistic choice, rates and ratios, weighted averages, misleading-summary avoidance]
    status: live
  - id: data-cleaning-and-preparation
    name: Data Cleaning and Preparation
    kind: craft
    scope: "Making data analysable: missing values, inconsistencies, reshaping and joining, validation and documenting what was done."
    examples: [missing-data handling, deduplication, reshaping and joining, validation checks]
    status: live
  - id: data-visualisation-design
    name: Data Visualisation Design
    kind: craft
    scope: "Designing charts and graphs that communicate: chart-type selection, visual encoding, scales and axes, colour and avoiding distortion."
    examples: [chart-type selection, visual encoding, axis and scale choices, colour use]
    status: live
  - id: quantitative-reasoning
    name: Quantitative Reasoning
    kind: craft
    scope: "Reasoning with numbers in the wild: back-of-envelope estimation, interpreting statistics in claims and reports, uncertainty and base-rate thinking."
    examples: [Fermi estimation, interpreting reported statistics, base-rate reasoning, sanity checks]
    status: live
  - id: excel
    name: Excel
    kind: application
    scope: "Data analysis in Excel as mathematical instrument: formulas, pivot tables, lookups, charts and spreadsheet models that stay correct."
    examples: [pivot tables, lookup formulas, chart building, spreadsheet auditing]
    status: live
  - id: tableau
    name: Tableau
    kind: application
    scope: "Visual analysis with Tableau: connecting data, building views and dashboards, calculated fields and interactive exploration."
    examples: [dashboard building, calculated fields, level-of-detail expressions]
    status: live
