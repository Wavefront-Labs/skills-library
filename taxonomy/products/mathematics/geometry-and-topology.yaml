category: mathematics
field: geometry-and-topology
products:
  - id: euclidean-geometry-and-trigonometry
    name: Euclidean Geometry and Trigonometry
    kind: craft
    scope: "Classical geometry of the plane and space: synthetic and coordinate geometry, trigonometric identities and solution of triangles, geometric construction and proof."
    examples: [geometric proof, trigonometric identities, coordinate geometry, constructions]
    status: live
  - id: differential-geometry
    name: Differential Geometry
    kind: craft
    scope: "Geometry via calculus: curves and surfaces, curvature, manifolds, Riemannian metrics and the geometry behind relativity and graphics."
    examples: [curvature computation, manifolds, geodesics, Riemannian metrics]
    status: live
  - id: algebraic-geometry
    name: Algebraic Geometry
    kind: craft
    scope: "Geometry of polynomial equations: varieties, schemes at working level, Gröbner-basis computation and the interplay of algebra with geometric shape."
    examples: [affine and projective varieties, Gröbner bases, elliptic curves as geometry]
    status: live
  - id: general-topology
    name: General Topology
    kind: craft
    scope: "Point-set topology: topological spaces, continuity, compactness, connectedness, metric spaces and separation axioms."
    examples: [compactness arguments, metric-space technique, quotient spaces]
    status: live
  - id: algebraic-topology
    name: Algebraic Topology
    kind: craft
    scope: "Algebraic invariants of shape: fundamental group, homology and cohomology, covering spaces and homotopy technique."
    examples: [fundamental group, homology computation, covering spaces, homotopy equivalence]
    status: live
  - id: computational-geometry
    name: Computational Geometry
    kind: craft
    scope: "Geometric algorithms and data structures as mathematics: convex hulls, triangulations, Voronoi diagrams, intersection and proximity problems."
    examples: [convex hulls, Delaunay triangulation, Voronoi diagrams, intersection tests]
    status: live
