category: mathematics
field: numeracy-and-mental-calculation
products:
  - id: mental-arithmetic
    name: Mental Arithmetic
    kind: craft
    scope: "Calculating in your head: addition through division without aids, fractions, percentages and the number bonds that make it automatic."
    examples: [mental multiplication, percentage calculation, fraction arithmetic, number bonds]
    status: live
  - id: estimation
    name: Estimation
    kind: craft
    scope: "Fast approximate answers: rounding strategies, order-of-magnitude checks, and judging when an exact answer is not needed."
    examples: [rounding strategies, order-of-magnitude checks, answer plausibility]
    status: live
  - id: speed-calculation-systems
    name: Speed Calculation Systems
    kind: craft
    scope: "Named systems for rapid calculation: Vedic and Trachtenberg methods, cross-multiplication shortcuts and calendar or square tricks."
    examples: [Vedic methods, Trachtenberg system, squaring shortcuts, calendar calculation]
    status: live
  - id: everyday-numeracy
    name: Everyday Numeracy
    kind: craft
    scope: "Numbers in daily life: money and budgeting arithmetic, unit conversion, proportions and reading everyday quantitative information."
    examples: [budgeting arithmetic, unit conversion, proportional reasoning, reading bills and rates]
    status: live
  - id: abacus
    name: Abacus (Soroban)
    kind: application
    scope: "Calculation on the abacus: soroban technique for the four operations and the mental-abacus (anzan) method built on it."
    examples: [soroban technique, four operations, anzan mental abacus]
    status: live
