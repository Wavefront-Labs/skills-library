category: mathematics
field: mathematical-analysis
products:
  - id: calculus
    name: Calculus
    kind: craft
    scope: "Working differential and integral calculus: differentiation and integration technique, series, multivariable calculus and applied problem solving."
    examples: [integration technique, Taylor series, multivariable calculus, optimisation problems]
    status: live
  - id: real-analysis
    name: Real Analysis
    kind: craft
    scope: "Rigorous foundations of calculus on the real line: limits, continuity, sequences and series, Riemann and Lebesgue integration, measure theory."
    examples: [epsilon-delta proofs, uniform convergence, Lebesgue integration, measure theory]
    status: live
  - id: complex-analysis
    name: Complex Analysis
    kind: craft
    scope: "Functions of a complex variable: holomorphic functions, contour integration, residues, conformal maps and analytic continuation."
    examples: [contour integration, residue calculus, conformal mapping, Laurent series]
    status: live
  - id: ordinary-differential-equations
    name: Ordinary Differential Equations
    kind: craft
    scope: "Solving and analysing ODEs: exact solution methods, qualitative theory, stability, dynamical systems and modelling with ODEs."
    examples: [solution methods, phase-plane analysis, stability theory, dynamical systems]
    status: live
  - id: partial-differential-equations
    name: Partial Differential Equations
    kind: craft
    scope: "PDEs and the physics they model: classical equations, separation of variables, transform methods, weak solutions and qualitative theory."
    examples: [heat and wave equations, separation of variables, Fourier methods, weak solutions]
    status: live
  - id: functional-analysis
    name: Functional Analysis
    kind: craft
    scope: "Analysis in infinite dimensions: Banach and Hilbert spaces, bounded operators, spectral theory and distributions."
    examples: [Hilbert-space technique, operator theory, spectral theorem, distributions]
    status: live
  - id: harmonic-and-fourier-analysis
    name: Harmonic and Fourier Analysis
    kind: craft
    scope: "Decomposing functions into frequencies: Fourier series and transforms, wavelets, and harmonic-analysis technique applied to signals and PDEs."
    examples: [Fourier transforms, convolution, wavelets, signal decomposition]
    status: live
