category: mathematics
field: number-theory
products:
  - id: elementary-number-theory
    name: Elementary Number Theory
    kind: craft
    scope: "Integers from first principles: divisibility, primes, congruences and modular arithmetic, Diophantine equations and classical theorems."
    examples: [modular arithmetic, Diophantine equations, quadratic residues, Chinese remainder theorem]
    status: live
  - id: analytic-number-theory
    name: Analytic Number Theory
    kind: craft
    scope: "Number theory via analysis: prime distribution, the zeta function, Dirichlet series, sieve methods and asymptotic estimates."
    examples: [prime counting, zeta-function technique, sieve methods, asymptotic estimates]
    status: live
  - id: algebraic-number-theory
    name: Algebraic Number Theory
    kind: craft
    scope: "Number fields and their arithmetic: rings of integers, ideal factorisation, class groups, units and local methods."
    examples: [number fields, ideal class groups, ramification, p-adic methods]
    status: live
  - id: computational-number-theory
    name: Computational Number Theory
    kind: craft
    scope: "Algorithms on integers and number-theoretic structures: primality testing, integer factorisation, discrete logarithms and lattice computation."
    examples: [primality testing, factorisation algorithms, discrete logarithms, lattice reduction]
    status: live
  - id: pari-gp
    name: PARI/GP
    kind: application
    scope: "Number-theoretic computation with the PARI/GP system: arithmetic in number fields, elliptic-curve computation and scripted experiments."
    examples: [number-field arithmetic, elliptic-curve computation, GP scripting]
    status: live
