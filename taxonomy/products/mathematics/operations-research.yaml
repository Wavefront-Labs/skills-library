category: mathematics
field: operations-research
products:
  - id: linear-programming
    name: Linear Programming
    kind: craft
    scope: "Optimising linear objectives under linear constraints: model formulation, the simplex method, duality and sensitivity analysis."
    examples: [LP formulation, simplex method, duality, sensitivity analysis]
    status: live
  - id: integer-programming
    name: Integer and Mixed-Integer Programming
    kind: craft
    scope: "Optimisation with discrete decisions: MIP formulation technique, branch and bound, cutting planes and strengthening formulations."
    examples: [MIP formulation, branch and bound, valid inequalities, big-M modelling]
    status: live
  - id: nonlinear-optimisation
    name: Nonlinear Optimisation
    kind: craft
    scope: "Optimising smooth and convex problems: convexity, KKT conditions, gradient and Newton methods, and convex-programming formulations."
    examples: [convex formulation, KKT conditions, gradient methods, Lagrangian duality]
    status: live
  - id: queueing-theory
    name: Queueing Theory
    kind: craft
    scope: "The mathematics of waiting lines: arrival and service models, queueing networks, performance measures and capacity analysis."
    examples: [M/M/1 analysis, queueing networks, Little's law, capacity planning]
    status: live
  - id: simulation-modelling
    name: Simulation Modelling
    kind: craft
    scope: "Studying systems by simulating them: discrete-event simulation, input modelling, variance reduction and output analysis."
    examples: [discrete-event simulation, input distribution fitting, output analysis, variance reduction]
    status: live
  - id: scheduling-optimisation
    name: Scheduling Optimisation
    kind: craft
    scope: "Sequencing work over time and resources: machine scheduling, timetabling, routing and rostering as optimisation problems."
    examples: [job-shop scheduling, timetabling, vehicle routing, crew rostering]
    status: live
  - id: decision-analysis
    name: Decision Analysis
    kind: craft
    scope: "Structuring decisions under uncertainty: decision trees, utility theory, multi-criteria methods and the value of information."
    examples: [decision trees, utility elicitation, multi-criteria analysis, value of information]
    status: live
  - id: game-theory
    name: Game Theory
    kind: craft
    scope: "Strategic interaction as mathematics: equilibrium concepts, repeated and cooperative games, auctions and mechanism design theory."
    examples: [Nash equilibrium, repeated games, auction theory, mechanism design]
    status: live
  - id: gurobi
    name: Gurobi
    kind: application
    scope: "Solving optimisation models with the Gurobi solver: model building through its APIs, parameter tuning and interpreting solver output."
    examples: [gurobipy modelling, parameter tuning, infeasibility diagnosis]
    status: live
