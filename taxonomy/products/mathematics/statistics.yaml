category: mathematics
field: statistics
products:
  - id: statistical-inference
    name: Statistical Inference
    kind: craft
    scope: "Frequentist inference: estimators and their properties, confidence intervals, hypothesis testing, likelihood methods and multiple-testing control."
    examples: [maximum likelihood, confidence intervals, hypothesis testing, power analysis]
    status: live
  - id: bayesian-inference
    name: Bayesian Inference
    kind: craft
    scope: "Inference via posterior distributions: prior choice, conjugate and computational posteriors, hierarchical models, MCMC in practice and model checking."
    examples: [prior elicitation, hierarchical models, MCMC diagnostics, posterior predictive checks]
    status: live
  - id: regression-modelling
    name: Regression Modelling
    kind: craft
    scope: "Modelling outcomes from predictors: linear and generalised linear models, mixed models, diagnostics, model selection and interpretation."
    examples: [linear models, GLMs, mixed-effects models, residual diagnostics]
    status: live
  - id: experimental-design
    name: Experimental Design
    kind: craft
    scope: "Designing studies that answer the question: randomisation, blocking, factorial designs, sample-size determination, A/B tests and clinical-trial designs as method."
    examples: [randomisation schemes, factorial designs, sample-size calculation, A/B testing]
    status: live
  - id: survey-sampling
    name: Survey and Sampling Methods
    kind: craft
    scope: "Learning about populations from samples: sampling designs, weighting, nonresponse adjustment and estimation from complex surveys."
    examples: [stratified sampling, survey weighting, nonresponse adjustment, design effects]
    status: live
  - id: time-series-analysis
    name: Time Series Analysis
    kind: craft
    scope: "Statistics of data over time: ARIMA and state-space models, seasonality, forecasting, volatility models and spectral methods."
    examples: [ARIMA modelling, forecasting, seasonal decomposition, GARCH models]
    status: live
  - id: multivariate-analysis
    name: Multivariate Analysis
    kind: craft
    scope: "Many variables at once: principal components and factor analysis, clustering, discriminant analysis and dimension reduction as statistical method."
    examples: [PCA, factor analysis, cluster analysis, discriminant analysis]
    status: live
  - id: causal-inference
    name: Causal Inference
    kind: craft
    scope: "Estimating cause from data: potential outcomes, confounding control, matching and propensity scores, instrumental variables and causal diagrams."
    examples: [propensity scores, instrumental variables, difference-in-differences, DAGs]
    status: live
  - id: r
    name: R
    kind: application
    scope: "Statistical analysis in R: the language, tidyverse data handling, statistical modelling packages, and reproducible analysis with R Markdown/Quarto."
    examples: [tidyverse workflows, model fitting, ggplot2 graphics, reproducible reports]
    status: live
  - id: sas
    name: SAS
    kind: application
    scope: "Statistical analysis with SAS: DATA step programming, statistical procedures, macros and regulated-industry analysis workflows."
    examples: [DATA step, PROC-based modelling, macro programming, clinical reporting]
    status: live
  - id: spss
    name: SPSS
    kind: application
    scope: "Statistical analysis with IBM SPSS: menu- and syntax-driven analysis, common social-science procedures and output interpretation."
    examples: [SPSS syntax, ANOVA procedures, survey analysis]
    status: live
  - id: stan
    name: Stan
    kind: application
    scope: "Bayesian modelling with Stan: writing model programs, HMC sampling, diagnostics and interfaces such as RStan, PyStan and brms."
    examples: [Stan model code, HMC diagnostics, brms workflows]
    status: live
