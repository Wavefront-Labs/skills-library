category: mathematics
field: probability-theory
products:
  - id: foundations-of-probability
    name: Foundations of Probability
    kind: craft
    scope: "Measure-theoretic probability: probability spaces, random variables, expectation, independence, convergence modes and the classical limit theorems."
    examples: [measure-theoretic arguments, laws of large numbers, central limit theorem, convergence modes]
    status: live
  - id: probability-modelling
    name: Probability Modelling
    kind: craft
    scope: "Working probability for applications: distributions and their properties, conditioning, moment technique and building probabilistic models of real situations."
    examples: [distribution selection, conditional probability, moment generating functions, model building]
    status: live
  - id: stochastic-processes
    name: Stochastic Processes
    kind: craft
    scope: "Random evolution in time: Poisson processes, renewal theory, branching processes, Brownian motion and stationary processes."
    examples: [Poisson processes, Brownian motion, renewal arguments, stationarity]
    status: live
  - id: markov-chains
    name: Markov Chains
    kind: craft
    scope: "Memoryless random dynamics: discrete and continuous-time chains, stationary distributions, ergodicity, mixing and MCMC foundations."
    examples: [stationary distributions, ergodicity, hitting times, MCMC theory]
    status: live
  - id: stochastic-calculus
    name: Stochastic Calculus
    kind: craft
    scope: "Calculus for random paths: martingales, Itô integration, stochastic differential equations and their use in finance and physics."
    examples: [martingale arguments, Itô's lemma, SDE solving, Girsanov technique]
    status: live
