# Reconciles the 20 product folders that existed before this schema (98 live skills).
# Kept as-is by decision 13 Oct 2026: renaming for naming-style consistency (tool-named vs
# function-named) would move ~55 skill files with aliases for no structural gain. Several
# function-named entries each wrap one of our private *craft CLIs; the tool is named in scope.
category: creative-arts
field: animation
products:
  - id: blender
    name: Blender
    kind: application
    scope: "Headless and interactive Blender for the animation pipeline: modelling, sculpt, rigging, lighting, cel-shading, FX, rendering on AMD."
    examples: [cel-shading, rigging, lighting, mocap retarget, headless automation]
    status: live
  - id: voice-tts
    name: Voice and TTS (Piper/Kokoro)
    kind: application
    scope: "Neural text-to-speech for character voices: Piper/Kokoro setup, voice casting and per-character consistency."
    examples: [Piper setup, voice casting, speaker consistency]
    status: live
  - id: vector-graphics
    name: Vector Graphics (vectorcraft)
    kind: application
    scope: "Headless 2D vector work with our vectorcraft CLI: shapes, paths, SVG export for concept art, sheets and 2D assets."
    examples: [shapes and paths, SVG export, rasterising]
    status: live
  - id: scripting
    name: Motion-Graphics Scripting (effectcraft)
    kind: application
    scope: "Scripting our After-Effects-like effectcraft engine: 2D animation, compositing passes, titles and overlays to MP4."
    examples: [JS/JSX scripting, titles, overlays]
    status: live
  - id: encode-delivery
    name: Encode and Delivery (filmcraft)
    kind: application
    scope: "Probing, assembling, encoding and muxing renders with our filmcraft CLI; platform delivery masters."
    examples: [probe, concat, mux, YouTube master]
    status: live
  - id: texturing
    name: Texturing (photocraft)
    kind: application
    scope: "Raster texture maps, mattes and grade plates with our photocraft CLI for materials and comp."
    examples: [texture maps, matte painting, grade plates]
    status: live
  - id: motion-graphics
    name: Motion Graphics
    kind: craft
    scope: "Designed moving graphics layered on shots: title cards, HUD elements, glitch and scanline treatments."
    examples: [title cards, HUD counters, glitch-scanline]
    status: live
  - id: character-design
    name: Character Design
    kind: craft
    scope: "Designing characters that read instantly and stay on-model: shape language, silhouettes, model sheets and turnarounds."
    examples: [design craft, model sheets, turnarounds]
    status: live
  - id: environment-design
    name: Environment Design
    kind: craft
    scope: "Designing and building locations that stage the action and stay on-model across shots."
    examples: [set building, modularity, depth composition]
    status: live
  - id: visual-development
    name: Visual Development
    kind: craft
    scope: "Exploring and locking a production's look: mood, palette, style frames before assets are built."
    examples: [style frames, look exploration, colour scripts]
    status: live
  - id: art-direction
    name: Art Direction
    kind: craft
    scope: "Holding the visual whole together across departments: approving the look, keeping every shot on-style."
    examples: [style guides, look approval, cross-department review]
    status: live
  - id: production-design
    name: Production Design
    kind: craft
    scope: "Designing the world of the production: sets, props and staging design upstream of asset building."
    examples: [world design, prop design, staging design]
    status: live
  - id: storywriting
    name: Storywriting
    kind: craft
    scope: "Writing for the screen: novel-to-teleplay adaptation, screenwriting craft, shotlisting."
    examples: [teleplay adaptation, screenwriting, shotlist boarding]
    status: live
  - id: storyboarding
    name: Storyboarding
    kind: craft
    scope: "Drawing the film before it exists: boards that stage, frame and time each shot."
    examples: [board drawing, staging, previs handoff]
    status: live
  - id: editorial
    name: Editorial
    kind: craft
    scope: "Cutting the film: animatics, dailies review, pacing and the editorial pipeline."
    examples: [animatic cutting, dailies review, pacing]
    status: live
  - id: editing
    name: Editing
    kind: craft
    scope: "Assembly editing of boards and shots to voice track; superseded in part by editorial, kept for its live skill."
    examples: [animatic assembly]
    status: live
  - id: color
    name: Colour
    kind: craft
    scope: "Colour grading and colour management across shots for a consistent finished image."
    examples: [grading, colour pipeline]
    status: live
  - id: sound-design
    name: Sound Design
    kind: craft
    scope: "The film's sound: SFX, ambience beds, scoring, dialogue mix and master."
    examples: [SFX design, scoring, dialogue mix]
    status: live
  - id: principles
    name: Animation Principles
    kind: craft
    scope: "The animator's craft of performance: the 12 principles applied as keyframe recipes."
    examples: [timing and spacing, squash and stretch, anticipation]
    status: live
  - id: pipeline
    name: Production Pipeline
    kind: craft
    scope: "The machinery that scales episodes: shot/sequence structure, data-driven renderers, consistency systems, pipeline architecture."
    examples: [shot renderer, character consistency, vo-lipsync chain]
    status: live
  - id: methods
    name: Production Methods (recipes)
    kind: method
    scope: "Recipes that bundle the field's skills into an outcome at a named quality tier: which skills, in what order, with measurable gates between phases."
    examples: [stylized-series tier, feature-CG tier and its economics]
    status: live
  - id: comfyui
    name: Comfyui
    kind: application
    scope: "Comfyui: Run ComfyUI on an AMD GPU under Windows (torch-directml, pinned v0.3.59) and get clean modern-anime character stills from Animagine XL 4.0; the sample."
    examples: [directml, animagine-xl, sdxl, anime, consistency]
    status: live
