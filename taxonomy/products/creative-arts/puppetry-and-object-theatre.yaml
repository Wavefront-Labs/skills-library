  - id: marionette-performance
    name: Marionette Performance
    kind: craft
    scope: "Performing string puppets: control bar technique, walking and gesture, stringing-aware manipulation, bridge work."
    examples: [control bar technique, marionette walking, gesture vocabulary, bridge operation]
    status: live
  - id: shadow-puppetry
    name: Shadow Puppetry
    kind: craft
    scope: "Shadow theatre: figures against the screen, light sources, traditions such as wayang kulit, modern shadow work."
    examples: [screen and light setup, figure articulation, wayang kulit performance, layered shadows]
