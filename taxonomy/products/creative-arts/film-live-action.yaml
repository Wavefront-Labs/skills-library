category: creative-arts
field: film-live-action
products:
  - id: directing
    name: Film Directing
    kind: craft
    scope: "Directing live-action film: visual storytelling, shot design, working with actors, set leadership from prep to picture lock."
    examples: [shot design, directing actors, coverage planning, directing the edit]
    status: live
  - id: screenwriting
    name: Screenwriting
    kind: craft
    scope: "Writing scripts for live-action production: feature and episodic structure, scene writing, formatting, rewriting."
    examples: [feature structure, scene writing, dialogue, rewriting from notes]
    status: live
  - id: final-draft
    name: Final Draft
    kind: application
    scope: "Screenwriting in Final Draft: industry formatting, revision modes, beat board, production drafts."
    examples: [script formatting, revision colours, beat board, production drafts]
    status: live
  - id: cinematography
    name: Cinematography
    kind: craft
    scope: "The photographed image: lensing, camera movement, exposure, lighting the scene for live-action film."
    examples: [lens choice, lighting setups, camera movement, exposure control]
    status: live
  - id: cinema-cameras
    name: Cinema Cameras and Rigs
    kind: application
    scope: "Operating cinema camera systems and support: camera builds, gimbals and dollies, monitoring, on-set data."
    examples: [camera builds, gimbal operation, focus pulling, media management]
    status: live
  - id: film-editing
    name: Film Editing
    kind: craft
    scope: "Cutting live-action film: assembly, scene construction, rhythm, performance selection, story restructuring in the edit."
    examples: [scene cutting, pacing, performance selection, restructure in post]
    status: live
  - id: davinci-resolve
    name: DaVinci Resolve
    kind: application
    scope: "Editing, grading and finishing in DaVinci Resolve: edit and colour pages, node grading, Fairlight, delivery."
    examples: [edit page workflow, node-based grading, Fairlight mixing, render delivery]
    status: live
  - id: premiere-pro
    name: Adobe Premiere Pro
    kind: application
    scope: "Editing in Premiere Pro: project and proxy workflows, timeline craft, effects, export pipelines."
    examples: [proxy workflows, timeline editing, essential graphics, export settings]
    status: live
  - id: color-grading
    name: Colour Grading
    kind: craft
    scope: "Grading the final image: look development, shot matching, colour-managed pipelines for live-action work."
    examples: [look development, shot matching, LUT pipelines, HDR delivery]
    status: live
  - id: production-sound
    name: Production Sound
    kind: craft
    scope: "Recording sound on set: boom and lav technique, mixing on location, timecode and sync."
    examples: [boom operation, lav rigging, location mixing, timecode sync]
    status: live
  - id: film-sound-design
    name: Film Sound Post
    kind: craft
    scope: "Sound after the shoot: dialogue editing, sound effects and ambiences, ADR, the final mix."
    examples: [dialogue editing, SFX and ambience, ADR, re-recording mix]
    status: live
  - id: documentary
    name: Documentary Filmmaking
    kind: craft
    scope: "Making documentary works: access and interview craft, verite shooting, structuring reality in the edit."
    examples: [interview technique, verite shooting, archive integration, structuring in the edit]
    status: live
