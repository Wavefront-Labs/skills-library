category: creative-arts
field: literary-writing
products:
  - id: novel-writing
    name: Novel Writing
    kind: craft
    scope: "Writing long-form fiction: drafting, revision, point of view and sustaining a book-length narrative."
    examples: [drafting, point of view, pacing a novel, revision passes]
    status: live
  - id: short-fiction
    name: Short Fiction
    kind: craft
    scope: "Writing short stories and flash fiction: compression, single-effect structure, openings and endings."
    examples: [flash fiction, story openings, compression, twist endings]
    status: live
  - id: plot-structure
    name: Plot Structure
    kind: craft
    scope: "Structuring narrative: act structures, beat sheets, scene-sequel rhythm, outlining and causality."
    examples: [three-act structure, beat sheets, outlining, midpoint reversals]
    status: live
  - id: character-development
    name: Character Development
    kind: craft
    scope: "Creating characters that drive story: motivation and want, arcs, voice differentiation, ensemble dynamics."
    examples: [character arcs, motivation and stakes, distinct voices, antagonists]
    status: live
  - id: prose-style
    name: Prose Style
    kind: craft
    scope: "The sentence-level craft of fiction and literary prose: voice, rhythm, imagery, dialogue and description."
    examples: [narrative voice, dialogue, description, sentence rhythm]
    status: live
  - id: poetry
    name: Poetry
    kind: craft
    scope: "Writing poems: form and free verse, metre, image, line breaks, revision and spoken-word composition."
    examples: [metre and form, imagery, line breaks, spoken word]
    status: live
  - id: worldbuilding
    name: Worldbuilding
    kind: craft
    scope: "Inventing coherent fictional worlds: cultures, magic and technology systems, geography and history that serve story."
    examples: [magic systems, invented cultures, consistent geography, exposition control]
    status: live
  - id: creative-nonfiction
    name: Creative Nonfiction
    kind: craft
    scope: "True stories told with literary craft: memoir, personal essay, narrative nonfiction and literary reportage."
    examples: [memoir, personal essay, scene reconstruction, narrative research]
    status: live
  - id: oral-storytelling
    name: Oral Storytelling
    kind: craft
    scope: "Composing and telling stories aloud for listeners: story shaping for the voice, timing, audience connection."
    examples: [story shaping, timing and delivery, folktale telling, story slams]
    status: live
  - id: developmental-editing
    name: Developmental Editing
    kind: craft
    scope: "Editing another writer's creative work at the story level: manuscript assessment, structural notes, line editing for voice."
    examples: [manuscript assessment, structural edit letters, line editing, author collaboration]
    status: live
  - id: scrivener
    name: Scrivener
    kind: application
    scope: "Long-form writing in Scrivener: binder organisation, drafting workflow, snapshots, compiling to manuscript formats."
    examples: [binder organisation, corkboard outlining, snapshots, compile to manuscript]
    status: live
