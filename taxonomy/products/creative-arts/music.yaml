category: creative-arts
field: music
products:
  - id: composition
    name: Composition
    kind: craft
    scope: "Writing original music: harmony, melody, form and orchestral or ensemble writing for concert, screen and media."
    examples: [harmony and voice leading, melodic writing, film scoring, thematic development]
    status: live
  - id: songwriting
    name: Songwriting
    kind: craft
    scope: "Writing songs: lyrics, toplines, hooks, song structure and co-writing craft across popular genres."
    examples: [lyric writing, topline melody, verse-chorus structure, co-writing]
    status: live
  - id: arranging
    name: Arranging and Orchestration
    kind: craft
    scope: "Adapting existing music for a new ensemble, voicing and instrumentation: horn charts, string arrangements, vocal harmony stacks."
    examples: [orchestration, horn and string charts, vocal arrangement, reduction]
    status: live
  - id: conducting
    name: Conducting and Ensemble Direction
    kind: craft
    scope: "Leading ensembles in rehearsal and performance: beat patterns, score study, balance and interpretive direction."
    examples: [score study, rehearsal technique, choral direction, cueing]
    status: live
  - id: vocal-performance
    name: Vocal Performance
    kind: craft
    scope: "Singing as performance: technique, breath support, registers, style and stage delivery across genres."
    examples: [breath support, belting and head voice, harmony singing, microphone technique]
    status: live
  - id: keyboard-instruments
    name: Keyboard Instruments
    kind: application
    scope: "Playing piano, organ and synthesizers: technique, repertoire, accompaniment and keyboard harmony."
    examples: [piano technique, sight reading, accompaniment, synth performance]
    status: live
  - id: guitar-and-fretted
    name: Guitar and Fretted Instruments
    kind: application
    scope: "Playing guitar, bass, ukulele and other fretted instruments: technique, rhythm and lead playing, fingerstyle."
    examples: [rhythm guitar, lead and improvisation, fingerstyle, bass lines]
    status: live
  - id: bowed-strings
    name: Bowed String Instruments
    kind: application
    scope: "Playing violin, viola, cello and double bass: bowing technique, intonation, ensemble and solo playing."
    examples: [bowing technique, intonation, shifting, orchestral playing]
    status: live
  - id: wind-and-brass
    name: Wind and Brass Instruments
    kind: application
    scope: "Playing woodwind and brass instruments: embouchure, breath control, articulation and section playing."
    examples: [embouchure, breath control, articulation, section blend]
    status: live
  - id: drums-and-percussion
    name: Drums and Percussion
    kind: application
    scope: "Playing drum kit and percussion: grooves, rudiments, timekeeping and hand percussion traditions."
    examples: [groove and timekeeping, rudiments, fills, hand percussion]
    status: live
  - id: music-production
    name: Music Production
    kind: craft
    scope: "Producing records: arrangement decisions, sound selection, recording sessions, directing performers toward a finished track."
    examples: [track arrangement, sound design, session direction, vocal production]
    status: live
  - id: mixing-mastering
    name: Mixing and Mastering
    kind: craft
    scope: "Balancing and finishing recorded music: EQ, compression, spatial treatment, loudness and delivery masters."
    examples: [mix balance, EQ and compression, stereo imaging, mastering chain]
    status: live
  - id: ableton-live
    name: Ableton Live
    kind: application
    scope: "Writing, producing and performing music in Ableton Live: session and arrangement views, racks, warping, live sets."
    examples: [session view workflow, instrument and effect racks, warping, live performance sets]
    status: live
  - id: dj-performance
    name: DJ Performance
    kind: craft
    scope: "Performing recorded music for an audience: beatmatching, set construction, crowd reading, turntablism."
    examples: [beatmatching, set programming, transitions, turntablism]
    status: live
