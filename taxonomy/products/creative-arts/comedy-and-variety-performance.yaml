  - id: sketch-comedy
    name: Sketch Comedy
    kind: craft
    scope: "Writing and performing sketches: game of the sketch, heightening, character sketches for stage and screen."
    examples: [sketch premises, heightening the game, character sketches, blackouts]
    status: live
  - id: drag-performance
    name: Drag Performance
    kind: craft
    scope: "Drag as a staged art: persona creation, lip-sync and live numbers, hosting, the stagecraft of a drag act."
    examples: [persona development, lip-sync numbers, drag hosting, reveal staging]
    status: live
  - id: cabaret-and-variety
    name: Cabaret and Variety Acts
    kind: craft
    scope: "Variety-stage performance: cabaret numbers, burlesque, novelty acts, building a variety bill."
