    name: Stand-Up Set Construction
    kind: craft
    scope: "Writing the stand-up set: joke structure, premises and tags, ordering material, callbacks, tightening five to sixty minutes."
    examples: [joke structure, tags and toppers, set ordering, callbacks]
    status: live
  - id: stand-up-performance
    name: Stand-Up Performance
    kind: craft
    scope: "Delivering stand-up live: timing, persona, crowd work, handling hecklers and rooms of every size."
    examples: [timing and delivery, stage persona, crowd work, heckler handling]
