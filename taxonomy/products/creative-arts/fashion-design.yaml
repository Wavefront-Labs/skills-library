category: creative-arts
field: fashion-design
products:
  - id: collection-design
    name: Collection Design
    kind: craft
    scope: "Designing a cohesive collection: concept, silhouettes, line planning and range building from research to lineup."
    examples: [concept research, silhouette development, line planning, lineup editing]
    status: live
  - id: fashion-illustration
    name: Fashion Illustration and Sketching
    kind: craft
    scope: "Drawing garments and looks: croquis, design sketches, technical flats and presentation illustration."
    examples: [croquis drawing, design sketching, technical flats, fabric rendering]
    status: live
  - id: draping
    name: Draping and Form Development
    kind: craft
    scope: "Developing garment form on the stand: draping muslin, shaping silhouettes, translating drape to design; production patternmaking and sewing are handcrafts."
    examples: [draping on the stand, silhouette shaping, muslin toiles, drape-to-flat translation]
    status: live
  - id: textile-and-print-design
    name: Textile and Print Design
    kind: craft
    scope: "Designing fabric surfaces: prints and repeats, colourways, embellishment direction and fabric selection for a line."
    examples: [print repeats, colourways, surface embellishment, fabric sourcing direction]
    status: live
  - id: knitwear-design
    name: Knitwear Design
    kind: craft
    scope: "Designing knitted garments: stitch and gauge design, shaping, knit-specific silhouettes and swatch development."
    examples: [stitch design, gauge planning, knit silhouettes, swatch development]
    status: live
  - id: footwear-design
    name: Footwear Design
    kind: craft
    scope: "Designing shoes: last-driven design, uppers and soles, materials and construction direction as creative form."
    examples: [last selection, upper design, sole units, material direction]
    status: live
  - id: accessory-design
    name: Accessory Design
    kind: craft
    scope: "Designing bags, hats, eyewear and jewellery lines as fashion: form, hardware, materials and collection coherence."
    examples: [bag design, millinery design, hardware selection, capsule coherence]
    status: live
  - id: clo-3d
    name: CLO 3D
    kind: application
    scope: "Digital garment design in CLO 3D: 3D draping and simulation, virtual fittings, fabric physics, digital showrooms."
    examples: [3D garment simulation, virtual fitting, fabric physics tuning, digital lookbooks]
    status: live
