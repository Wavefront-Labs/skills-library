category: creative-arts
field: design-for-form-and-experience
products:
  - id: concept-design
    name: Concept Design
    kind: craft
    scope: "Designing the form of imagined things: concept art and form studies for products, vehicles, environments where the deliverable is the look."
    examples: [form studies, concept sketching, ideation rounds, presentation renders]
    status: live
  - id: ux-design
    name: UX Design
    kind: craft
    scope: "Designing how an experience feels and flows: user flows, information architecture, wireframes, usability of the form."
    examples: [user flows, information architecture, wireframing, usability review]
    status: live
  - id: interaction-design
    name: Interaction and UI Design
    kind: craft
    scope: "Designing interface behaviour and appearance: components, states, micro-interactions, motion in the interface."
    examples: [component design, interaction states, micro-interactions, UI motion]
    status: live
  - id: design-systems
    name: Visual Design Systems
    kind: craft
    scope: "Building coherent visual languages: tokens, type scales, component libraries and system governance."
    examples: [design tokens, type scales, component libraries, system documentation]
    status: live
  - id: mood-boarding
    name: Mood-Boarding and Visual Research
    kind: craft
    scope: "Setting aesthetic direction: reference gathering, mood boards, style tiles and look-and-feel exploration."
    examples: [reference curation, mood boards, style tiles, direction presentations]
    status: live
  - id: experiential-design
    name: Experiential and Environmental Design
    kind: craft
    scope: "Designing experiences in space: exhibitions, brand environments, immersive and event experiences as form."
    examples: [exhibition design, immersive experiences, visitor journeys, spatial storytelling]
    status: live
  - id: prototyping
    name: Design Prototyping
    kind: craft
    scope: "Making designs tangible to evaluate their form: clickable prototypes, mockups, prototype testing of the experience."
    examples: [clickable prototypes, high-fidelity mockups, prototype walkthroughs, concept validation]
    status: live
  - id: figma
    name: Figma
    kind: application
    scope: "Designing in Figma: frames and auto layout, components and variables, prototyping, team libraries."
    examples: [auto layout, components and variants, prototyping, team libraries]
    status: live
