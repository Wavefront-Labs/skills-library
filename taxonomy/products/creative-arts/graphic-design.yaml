category: creative-arts
field: graphic-design
products:
  - id: typography
    name: Typography
    kind: craft
    scope: "Working with type: typeface selection and pairing, hierarchy, spacing, typesetting for print and screen."
    examples: [typeface pairing, hierarchy, kerning and spacing, grid typesetting]
    status: live
  - id: brand-identity
    name: Brand Identity and Logo Design
    kind: craft
    scope: "Designing visual identities: logo design, identity systems, brand guidelines as the creative deliverable."
    examples: [logo design, identity systems, brand guidelines, logo refinement]
    status: live
  - id: editorial-layout
    name: Editorial and Layout Design
    kind: craft
    scope: "Designing pages and publications: grids, layout, magazines, books and multi-page documents."
    examples: [grid systems, magazine layout, book design, cover-to-cover pacing]
    status: live
  - id: poster-and-campaign-graphics
    name: Poster and Campaign Graphics
    kind: craft
    scope: "Single-surface visual communication: posters, key art and campaign graphics built around one strong image and message."
    examples: [poster composition, key art, visual hierarchy at distance, series consistency]
    status: live
  - id: information-design
    name: Information and Infographic Design
    kind: craft
    scope: "Making information visual: infographics, data visualisation design, diagrams, wayfinding and signage graphics."
    examples: [infographics, chart design, diagramming, wayfinding graphics]
    status: live
  - id: commercial-illustration
    name: Commercial Illustration
    kind: craft
    scope: "Illustration commissioned for communication: editorial, advertising, icon and spot illustration to a brief."
    examples: [editorial illustration, icon sets, spot illustration, working to a brief]
    status: live
  - id: lettering-and-calligraphy
    name: Lettering and Calligraphy
    kind: craft
    scope: "Drawing and writing letters as design: hand lettering, calligraphic scripts, custom logotypes and type design basics."
    examples: [hand lettering, broad-pen scripts, custom logotypes, letterform drawing]
    status: live
  - id: adobe-illustrator
    name: Adobe Illustrator
    kind: application
    scope: "Vector design in Illustrator: pen tool and paths, shape building, effects, artwork for print and screen."
    examples: [pen tool mastery, shape builder, vector effects, artboard export]
    status: live
  - id: adobe-indesign
    name: Adobe InDesign
    kind: application
    scope: "Layout in InDesign: master pages, styles, long-document tools, print-ready and digital output."
    examples: [master pages, paragraph styles, data merge, print-ready PDFs]
    status: live
  - id: adobe-photoshop
    name: Adobe Photoshop
    kind: application
    scope: "Raster work in Photoshop for design: compositing, retouching, masking and asset preparation."
    examples: [compositing, retouching, masking, mockup assembly]
    status: live
