category: creative-arts
field: theatre
products:
  - id: acting
    name: Acting
    kind: craft
    scope: "Performing a role for a live audience: script analysis, characterisation, scene work and technique traditions."
    examples: [script analysis, characterisation, scene work, audition technique]
    status: live
  - id: directing
    name: Stage Direction
    kind: craft
    scope: "Directing a production: interpreting the text, staging and blocking, shaping performances through rehearsal to opening."
    examples: [concept and interpretation, blocking, rehearsal process, tech week]
    status: live
  - id: dramaturgy
    name: Dramaturgy
    kind: craft
    scope: "Shaping the play's text and context: script development, research, adaptation and new-play development."
    examples: [script development, production research, adaptation, new-play workshops]
    status: live
  - id: improv
    name: Improv Performance
    kind: craft
    scope: "Improvised theatre for an audience: scene creation, long and short form, ensemble listening."
    examples: [yes-and scene work, long-form formats, game of the scene, ensemble play]
    status: live
  - id: voice-and-speech
    name: Voice and Speech
    kind: craft
    scope: "The performer's voice: projection, articulation, accents and dialects, verse speaking."
    examples: [projection, dialect work, verse speaking, vocal health]
    status: live
  - id: stage-movement-and-combat
    name: Stage Movement and Combat
    kind: craft
    scope: "Physical performance craft: movement vocabularies, mask and physical theatre, staged combat and falls."
    examples: [physical theatre, mask work, unarmed stage combat, falls and lifts]
    status: live
  - id: stage-management
    name: Stage Management
    kind: craft
    scope: "Running the production: prompt book, calling cues, rehearsal coordination and show operation."
    examples: [prompt book, calling the show, rehearsal reports, backstage coordination]
    status: live
  - id: scenic-design
    name: Scenic Design
    kind: craft
    scope: "Designing the stage world: set concepts, models, ground plans and the look of the playing space; building it is handcrafts."
    examples: [set concept, white-card models, ground plans, design presentation]
    status: live
  - id: lighting-design
    name: Lighting Design
    kind: craft
    scope: "Designing stage lighting: angle and colour, cue structure, plots and focus for live performance."
    examples: [lighting concept, cue design, light plots, focus sessions]
    status: live
  - id: costume-design
    name: Costume Design
    kind: craft
    scope: "Designing what characters wear: renderings, period research and character through clothing; making garments is handcrafts."
    examples: [costume renderings, period research, character palettes, fittings direction]
    status: live
  - id: theatre-sound-design
    name: Theatre Sound Design
    kind: craft
    scope: "Designing sound for live performance: effects, underscore, reinforcement design and show playback."
    examples: [effects design, underscore, QLab-style playback, reinforcement design]
    status: live
  - id: musical-theatre
    name: Musical Theatre Performance
    kind: craft
    scope: "The triple-threat craft: singing, acting and dancing integrated in musical staging and audition books."
    examples: [song interpretation, acting through song, audition book, ensemble tracks]
    status: live
