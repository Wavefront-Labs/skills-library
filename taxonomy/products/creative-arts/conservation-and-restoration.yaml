category: creative-arts
field: conservation-and-restoration
products:
  - id: paintings-conservation
    name: Paintings Conservation
    kind: craft
    scope: "Conserving and restoring paintings: cleaning, consolidation, inpainting, lining and varnish treatment."
    examples: [surface cleaning, consolidation, inpainting, varnish removal]
    status: live
  - id: paper-and-books-conservation
    name: Paper and Book Conservation
    kind: craft
    scope: "Conserving works on paper, books and archives: washing, mending, deacidification, binding repair as heritage treatment."
    examples: [tear mending, washing and deacidification, binding repair, flattening]
    status: live
  - id: textile-conservation
    name: Textile Conservation
    kind: craft
    scope: "Conserving textile artworks and heritage dress: stabilisation, stitching supports, cleaning and mounting fragile textiles."
    examples: [stabilisation stitching, support mounts, wet and dry cleaning, costume mounting]
    status: live
  - id: objects-and-sculpture-conservation
    name: Objects and Sculpture Conservation
    kind: craft
    scope: "Conserving three-dimensional artworks and artefacts: stone, metal, ceramic, wood and composite object treatment."
    examples: [metal corrosion treatment, ceramic reassembly, stone cleaning, loss compensation]
    status: live
  - id: condition-reporting
    name: Condition Reporting and Documentation
    kind: craft
    scope: "Examining and documenting artworks: condition reports, treatment documentation, photographic and technical imaging records."
    examples: [condition reports, treatment records, raking-light photography, UV examination]
    status: live
  - id: preventive-conservation
    name: Preventive Conservation
    kind: craft
    scope: "Keeping collections from deteriorating: environment and light control, pest management, storage and display standards."
    examples: [environmental monitoring, light budgets, integrated pest management, storage design]
    status: live
  - id: art-handling-and-mounting
    name: Art Handling and Mounting
    kind: craft
    scope: "Moving and presenting artworks safely: handling, packing, crating, installation and display mounts for heritage objects."
    examples: [safe handling, packing and crating, installation, display mounts]
    status: live
