category: agriculture-environment
field: hunting-trapping
products:
  - id: big-game-hunting
    name: Big-Game Hunting
    kind: craft
    scope: "Hunting large game: stalking and still-hunting, stand hunting, shot placement and ethical shot judgement."
    examples: [stalking, stand placement, shot placement, wind management]
    status: live
  - id: bird-hunting
    name: Bird Hunting and Wingshooting
    kind: craft
    scope: "Hunting upland birds and waterfowl: wingshooting technique, decoy spreads, blinds and working with dogs."
    examples: [wingshooting, decoy spreads, blind placement, dog handling]
    status: live
  - id: bowhunting
    name: Bowhunting
    kind: craft
    scope: "Hunting with archery tackle: bow setup and tuning, close-range stalking, shot discipline and recovery at archery distances."
    examples: [bow tuning, close stalking, shot discipline, blood trailing]
    status: live
  - id: fur-trapping
    name: Fur Trapping
    kind: craft
    scope: "Trapping furbearers: trap selection and sets, trapline management, dispatch, and skinning and fur handling to a saleable pelt."
    examples: [trap sets, trapline routes, pelt skinning, fur stretching]
    status: live
  - id: pest-animal-control
    name: Pest Animal Trapping and Control
    kind: craft
    scope: "Controlling pest and nuisance animals in the field: species-specific trapping, exclusion, shooting programmes and control-programme judgement."
    examples: [cage trapping, exclusion, control shooting, monitoring take]
    status: live
  - id: game-tracking
    name: Game Tracking and Sign Reading
    kind: craft
    scope: "Reading animal sign to find and follow game: tracks, scat, trails and bedding, and following wounded animals."
    examples: [track identification, aging sign, trail following, wounded-game recovery]
    status: live
  - id: calling-decoying
    name: Game Calling and Decoying
    kind: craft
    scope: "Bringing game to you: vocal and mechanical calling, decoy use and setup across species and seasons."
    examples: [deer calling, predator calling, duck calling, decoy setups]
    status: live
  - id: field-dressing
    name: Field Dressing and Game Handling
    kind: craft
    scope: "From kill to storable meat and hide: field dressing, skinning, quartering, meat cooling and pack-out."
    examples: [gutting, gutless quartering, meat cooling, cape and hide care]
    status: live
  - id: hunting-guiding
    name: Hunting Guiding and Outfitting
    kind: craft
    scope: "Guiding clients to game safely and successfully: area knowledge, client management, camp operations and trophy care."
    examples: [client management, spot-and-stalk guiding, camp operations, trophy preparation]
    status: live
