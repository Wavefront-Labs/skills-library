category: agriculture-environment
field: forestry
products:
  - id: silviculture
    name: Silviculture
    kind: craft
    scope: "Growing stands deliberately: regeneration systems, thinning regimes, pruning for timber quality and rotation planning."
    examples: [thinning regimes, regeneration systems, form pruning, rotation planning]
    status: live
  - id: tree-planting-establishment
    name: Tree Planting and Reforestation
    kind: craft
    scope: "Establishing new trees at scale: site preparation, stock handling, planting technique and early survival care."
    examples: [site preparation, planting technique, stock handling, survival assessment]
    status: live
  - id: timber-harvesting
    name: Timber Harvesting
    kind: craft
    scope: "Planning and executing timber extraction: coupe planning, directional felling, extraction methods and landing operations."
    examples: [coupe planning, directional felling, skid trail layout, log landing work]
    status: live
  - id: chainsaw-operation
    name: Chainsaw Operation
    kind: application
    scope: "Safe, skilled chainsaw work: felling cuts, limbing, bucking, tension and compression reading, and saw maintenance."
    examples: [felling cuts, limbing and bucking, chain sharpening, hung-tree handling]
    status: live
  - id: mechanised-harvesting
    name: Mechanised Harvesting Equipment
    kind: application
    scope: "Operating harvester, forwarder and skidder machinery: cut-to-length work, machine settings, extraction and load management."
    examples: [harvester head settings, cut-to-length bucking, forwarder loading, skidder extraction]
    status: live
  - id: forest-inventory
    name: Forest Inventory and Mensuration
    kind: craft
    scope: "Measuring the forest: plot sampling, tree measurement, volume estimation and timber cruising for management decisions."
    examples: [plot sampling, DBH and height measurement, volume tables, cruise design]
    status: live
  - id: arboriculture
    name: Arboriculture
    kind: craft
    scope: "Caring for individual trees, often in towns: climbing and rigging, crown work, tree risk assessment and removals."
    examples: [climbing and rigging, crown reduction, tree risk assessment, sectional removal]
    status: live
  - id: forest-health
    name: Forest Health and Protection
    kind: craft
    scope: "Keeping stands healthy: identifying and managing forest pests, pathogens and browse damage, and monitoring stand condition."
    examples: [bark beetle management, pathogen identification, browse protection, health surveys]
    status: live
  - id: fuels-management
    name: Forest Fuels Management
    kind: craft
    scope: "Reducing wildfire fuel loads in forests: fuel assessment, mechanical treatment, slash management and firebreak maintenance."
    examples: [fuel load assessment, slash treatment, firebreak maintenance, thinning for fire risk]
    status: live
  - id: woodland-management
    name: Small Woodland Management and Coppicing
    kind: craft
    scope: "Managing small and traditional woodlands: coppice rotations, ride and edge management, firewood production and multi-purpose woodland plans."
    examples: [coppice rotations, ride management, firewood production, woodland plans]
    status: live
  - id: agroforestry
    name: Agroforestry
    kind: craft
    scope: "Combining trees with crops or livestock on the same land: shelterbelts, silvopasture, alley cropping and tree-crop integration."
    examples: [shelterbelt design, silvopasture, alley cropping, windbreak establishment]
    status: live
