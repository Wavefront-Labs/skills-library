category: agriculture-environment
field: crop-farming
products:
  - id: crop-rotation-planning
    name: Crop Rotation and Crop-Mix Planning
    kind: craft
    scope: "Deciding what to grow where and when across seasons: rotations, crop-mix choice and break crops that manage fertility, pests and market risk."
    examples: [rotation design, break crops, crop-mix economics, double cropping]
    status: live
  - id: variety-selection
    name: Seed and Variety Selection
    kind: craft
    scope: "Choosing cultivars and seed for the paddock and season: maturity, disease resistance, seed quality and seeding-rate decisions."
    examples: [cultivar comparison, maturity matching, seed testing, seeding rates]
    status: live
  - id: planting-establishment
    name: Planting and Crop Establishment
    kind: craft
    scope: "Getting a crop out of the ground: sowing timing and depth, seedbed preparation, plant population and early-stand assessment."
    examples: [sowing windows, seedbed preparation, plant population, replant decisions]
    status: live
  - id: crop-scouting
    name: Crop Scouting and Diagnosis
    kind: craft
    scope: "Walking crops to find and identify weeds, pests, diseases and nutrient disorders early enough to act, and judging thresholds for intervention."
    examples: [weed identification, pest thresholds, disease diagnosis, deficiency symptoms]
    status: live
  - id: integrated-pest-management
    name: Integrated Pest and Weed Management
    kind: craft
    scope: "Controlling weeds, insects and diseases with combined cultural, biological and chemical tactics while managing resistance."
    examples: [herbicide programmes, resistance management, beneficial insects, spray timing]
    status: live
  - id: cover-cropping
    name: Cover Cropping and Green Manures
    kind: craft
    scope: "Growing non-cash crops to protect and feed the soil between cash crops: species mixes, termination timing and fitting covers into the rotation."
    examples: [species selection, termination timing, grazing covers, nitrogen credits]
    status: live
  - id: organic-crop-production
    name: Organic Crop Production
    kind: craft
    scope: "Growing certified-organic field crops: non-chemical weed and pest control, organic fertility programmes and certification compliance."
    examples: [mechanical weed control, organic fertility, certification records, transition planning]
    status: live
  - id: harvest-management
    name: Harvest Management
    kind: craft
    scope: "Judging crop maturity and running the harvest: timing, moisture, losses, logistics and weather risk at field level."
    examples: [maturity testing, harvest timing, loss monitoring, harvest logistics]
    status: live
  - id: grain-storage-handling
    name: Grain Storage and Post-Harvest Handling
    kind: craft
    scope: "Keeping harvested grain and seed in condition up to a storable commodity: drying, aeration, insect control and quality monitoring in store."
    examples: [grain drying, aeration management, storage insect control, moisture monitoring]
    status: live
  - id: precision-agriculture
    name: Precision Agriculture
    kind: craft
    scope: "Using positioning, sensing and field data to vary inputs within the paddock: yield maps, zones, variable-rate plans and guidance workflows."
    examples: [yield mapping, management zones, variable-rate prescriptions, NDVI imagery]
    status: live
  - id: tractor-implements
    name: Tractor and Implement Operation
    kind: application
    scope: "Operating and setting up tractors and towed implements for field work: hitching, ballasting, calibration and in-field adjustment of tillage, seeding and spreading gear."
    examples: [implement setup, seeder calibration, ballasting, GPS autosteer]
    status: live
  - id: combine-harvester
    name: Combine Harvester Operation
    kind: application
    scope: "Operating and setting a combine harvester: header, threshing, cleaning and loss settings per crop and condition."
    examples: [concave settings, sieve adjustment, loss checks, header setup]
    status: live
  - id: crop-sprayer
    name: Crop Sprayer Operation
    kind: application
    scope: "Operating boom and specialist sprayers: nozzle selection, calibration, drift management, tank mixing and safe chemical handling."
    examples: [nozzle selection, sprayer calibration, drift management, tank mixing]
    status: live
