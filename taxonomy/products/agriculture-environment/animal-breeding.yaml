category: agriculture-environment
field: animal-breeding
products:
  - id: breeding-programme-design
    name: Breeding Programme Design
    kind: craft
    scope: "Planning genetic improvement: selection objectives, estimated breeding values, inbreeding management and mating plans across generations."
    examples: [selection indices, EBV interpretation, inbreeding management, trait prioritisation]
    status: live
  - id: artificial-insemination
    name: Artificial Insemination
    kind: craft
    scope: "Breeding by AI: semen handling and thawing, insemination technique per species and conception-rate troubleshooting."
    examples: [semen handling, insemination technique, timing to oestrus, conception troubleshooting]
    status: live
  - id: embryo-transfer
    name: Embryo Transfer and Reproductive Technologies
    kind: craft
    scope: "Advanced reproduction programmes: donor and recipient management, synchronisation protocols and working with ET and IVF services."
    examples: [donor selection, synchronisation protocols, recipient management, flush scheduling]
    status: live
  - id: mating-management
    name: Mating and Oestrus Management
    kind: craft
    scope: "Getting animals in calf, in lamb or in pup naturally: heat detection, joining management, sire soundness and pregnancy follow-up."
    examples: [heat detection, joining ratios, sire soundness checks, pregnancy testing follow-up]
    status: live
  - id: pedigree-registry
    name: Pedigree Recording and Registries
    kind: craft
    scope: "Keeping bloodlines straight: pedigree records, breed-society registration, identification and performance recording."
    examples: [pedigree records, breed registration, animal identification, performance recording]
    status: live
  - id: dog-cat-breeding
    name: Dog and Cat Breeding
    kind: craft
    scope: "Breeding companion animals responsibly: health testing, whelping and queening, litter rearing and placement."
    examples: [health screening, whelping management, litter socialisation, puppy placement]
    status: live
  - id: bloodstock-breeding
    name: Bloodstock and Horse Breeding
    kind: craft
    scope: "Breeding horses: stallion and mare selection, stud management, foaling programmes and young-stock development for sale."
    examples: [mating selection, stud season management, foaling, yearling preparation]
    status: live
