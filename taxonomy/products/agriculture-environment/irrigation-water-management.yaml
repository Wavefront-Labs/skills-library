category: agriculture-environment
field: irrigation-water-management
products:
  - id: irrigation-scheduling
    name: Irrigation Scheduling
    kind: craft
    scope: "Deciding when and how much to water: soil moisture monitoring, evapotranspiration budgeting and matching applications to crop demand."
    examples: [soil moisture monitoring, ET budgeting, deficit irrigation, scheduling tools]
    status: live
  - id: drip-microirrigation
    name: Drip and Micro-Irrigation
    kind: craft
    scope: "Running drip and micro-sprinkler systems: layout, emitter selection, filtration, fertigation and keeping lines clean."
    examples: [emitter selection, filtration, fertigation, line flushing]
    status: live
  - id: sprinkler-pivot-irrigation
    name: Sprinkler and Centre-Pivot Irrigation
    kind: craft
    scope: "Operating sprinkler and pivot systems: application uniformity, nozzle packages, pivot management and system auditing."
    examples: [uniformity testing, nozzle packages, pivot speed settings, system audits]
    status: live
  - id: surface-irrigation
    name: Surface and Flood Irrigation
    kind: craft
    scope: "Irrigating by gravity: border-check, furrow and basin layouts, flow management and tailwater recovery."
    examples: [border-check layout, furrow management, siphon setting, tailwater recovery]
    status: live
  - id: agricultural-drainage
    name: Agricultural Drainage
    kind: craft
    scope: "Getting excess water off and out of the land: surface drains, subsurface tile and mole drainage, and waterlogging management."
    examples: [tile drainage, mole drains, surface drains, waterlogging diagnosis]
    status: live
  - id: water-storage-harvesting
    name: Farm Water Storage and Harvesting
    kind: craft
    scope: "Capturing and holding water on-farm: dams, tanks and rainwater harvesting, storage management and water budgeting across the season."
    examples: [farm dams, tank systems, rainwater harvesting, water budgeting]
    status: live
  - id: stock-water-systems
    name: Stock Water Systems
    kind: craft
    scope: "Watering livestock reliably: trough and pipeline reticulation, pumps and solar pumping, and water-quality checks for stock."
    examples: [reticulation layout, solar pumping, trough maintenance, stock water quality]
    status: live
  - id: irrigation-pumps-systems
    name: Irrigation Pumps and System Upkeep
    kind: application
    scope: "Operating and maintaining the hardware that moves irrigation water: pumps, mainlines, valves, filters and controllers at field level."
    examples: [pump operation, valve maintenance, filter servicing, controller programming]
    status: live
