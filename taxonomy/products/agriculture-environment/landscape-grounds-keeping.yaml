category: agriculture-environment
field: landscape-grounds-keeping
products:
  - id: turf-management
    name: Turf Management
    kind: craft
    scope: "Establishing and maintaining professional turf: grass selection, mowing regimes, feeding, aeration and renovation."
    examples: [turf establishment, aeration programmes, fertility schedules, renovation]
    status: live
  - id: sports-turf
    name: Sports Turf Management
    kind: craft
    scope: "Preparing and maintaining playing surfaces for sport: wear management, line marking, surface performance and match-day preparation."
    examples: [pitch preparation, wear rotation, line marking, drainage upkeep]
    status: live
  - id: golf-course-keeping
    name: Golf Course Greenkeeping
    kind: craft
    scope: "Maintaining greens, tees, fairways and bunkers to playing standard: cutting heights, green speed, topdressing and disease control."
    examples: [green speed management, topdressing, bunker maintenance, fine-turf disease control]
    status: live
  - id: landscape-installation
    name: Landscape Installation
    kind: craft
    scope: "Installing planted landscapes to a plan: ground preparation, planting out trees, shrubs and beds, turfing and establishment care."
    examples: [planting out, soil preparation, turf laying, establishment watering]
    status: live
  - id: planted-bed-maintenance
    name: Planted Bed and Grounds Maintenance
    kind: craft
    scope: "Routine upkeep of beds, borders and grounds on parks and commercial sites: weeding, mulching, seasonal planting and litter-to-presentation standards."
    examples: [seasonal bedding, mulching rounds, weed control, presentation standards]
    status: live
  - id: amenity-tree-shrub-care
    name: Amenity Tree and Shrub Care
    kind: craft
    scope: "Maintaining trees and shrubs on managed grounds: formative pruning, hedge cutting, staking and basic tree health checks."
    examples: [hedge cutting, formative pruning, staking, tree health checks]
    status: live
  - id: grounds-irrigation
    name: Grounds Irrigation Maintenance
    kind: craft
    scope: "Running and maintaining turf and landscape irrigation: controllers, sprinkler auditing, scheduling and winterisation."
    examples: [controller programming, sprinkler audits, leak finding, winterisation]
    status: live
  - id: snow-ice-management
    name: Snow and Ice Management
    kind: craft
    scope: "Keeping grounds and hard surfaces safe and open in winter: ploughing routes, de-icing materials and event response."
    examples: [de-icing programmes, plough routes, salt rates, storm response]
    status: live
  - id: grounds-equipment
    name: Grounds Equipment Operation
    kind: application
    scope: "Operating and field-maintaining grounds machinery: commercial mowers, trimmers, blowers, aerators and utility vehicles."
    examples: [reel and rotary mowers, blade sharpening, aerator operation, pre-start checks]
    status: live
