category: agriculture-environment
field: aquaculture
products:
  - id: pond-culture
    name: Pond Culture
    kind: craft
    scope: "Farming fish in earthen ponds: pond preparation, stocking, fertilisation, feeding and partial or total harvest."
    examples: [pond preparation, stocking rates, pond fertilisation, seine harvesting]
    status: live
  - id: cage-culture
    name: Cage and Net-Pen Culture
    kind: craft
    scope: "Growing fish in marine or lake cages: net management, grading and splitting, feeding at sea and predator control."
    examples: [net changes, fish grading, sea-cage feeding, predator exclusion]
    status: live
  - id: recirculating-aquaculture
    name: Recirculating Aquaculture Systems
    kind: craft
    scope: "Running land-based RAS: biofilter management, oxygenation, system monitoring and tank husbandry at high density."
    examples: [biofilter management, oxygen management, tank hygiene, alarm response]
    status: live
  - id: hatchery-operations
    name: Hatchery Operations
    kind: craft
    scope: "Producing juveniles: broodstock conditioning, spawning, egg incubation, larval rearing and live-feed culture."
    examples: [broodstock conditioning, egg incubation, larval rearing, rotifer and artemia culture]
    status: live
  - id: shellfish-culture
    name: Shellfish Culture
    kind: craft
    scope: "Farming oysters, mussels and other shellfish: spat collection, longline and rack systems, grading and harvest."
    examples: [spat collection, longline management, oyster grading, depuration]
    status: live
  - id: seaweed-culture
    name: Seaweed Culture
    kind: craft
    scope: "Farming seaweeds: seeding line, grow-out site management, harvest and primary drying."
    examples: [line seeding, grow-out management, harvest timing, primary drying]
    status: live
  - id: fish-health
    name: Fish Health Management
    kind: craft
    scope: "Keeping farmed stock healthy: disease recognition, parasite management, treatments and farm biosecurity."
    examples: [disease recognition, sea-lice management, bath treatments, biosecurity]
    status: live
  - id: fish-feeding
    name: Fish Nutrition and Feeding
    kind: craft
    scope: "Feeding aquatic stock for growth and feed efficiency: ration setting, feed response observation and feed conversion management."
    examples: [feed rates, appetite observation, FCR tracking, feed sizing]
    status: live
  - id: water-quality-management
    name: Aquaculture Water Quality
    kind: craft
    scope: "Managing the water the stock lives in: dissolved oxygen, ammonia and pH monitoring, aeration and corrective action."
    examples: [DO management, ammonia cycling, aeration, emergency response]
    status: live
