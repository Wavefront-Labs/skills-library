  - id: pig-husbandry
    name: Pig Husbandry
    kind: craft
    scope: "Raising pigs: farrowing management, weaner care, growing-finishing, housing environment and herd hygiene."
    examples: [farrowing management, weaner care, pen environment, biosecurity]
    status: live
  - id: poultry-husbandry
    name: Poultry Husbandry
    kind: craft
    scope: "Keeping chickens and other poultry for eggs or meat: brooding, housing and ventilation, flock health and egg handling."
    examples: [brooding, layer management, broiler growing, egg collection and grading]
    status: live
  - id: equine-management
    name: Equine Management
    kind: craft
