category: agriculture-environment
field: livestock-farming
products:
  - id: dairy-husbandry
    name: Dairy Husbandry
    kind: craft
    scope: "Running a milking herd: milking routine, parlour hygiene, mastitis prevention, calf rearing and lactation management."
    examples: [milking routine, mastitis control, calf rearing, dry-off management]
    status: live
  - id: beef-cattle-husbandry
    name: Beef Cattle Husbandry
    kind: craft
    scope: "Raising cattle for meat: cow-calf management, weaning, growing and finishing, and body condition scoring."
    examples: [calving management, weaning, finishing, condition scoring]
