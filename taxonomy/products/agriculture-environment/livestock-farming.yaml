  - id: farm-fencing
    name: Farm Fencing and Stock Infrastructure
    kind: craft
    scope: "Building and maintaining the infrastructure that holds and waters stock: fencing, gates, yards and stock-water plumbing at farm level."
    examples: [strainer assemblies, electric fencing, yard repairs, trough plumbing]
    status: live
