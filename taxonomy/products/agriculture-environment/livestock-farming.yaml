    name: Routine Livestock Health Care
    kind: craft
    scope: "The husbandry side of keeping stock healthy: vaccination programmes, parasite control, biosecurity and recognising when to call the vet."
    examples: [vaccination programmes, parasite control, biosecurity, sick-animal recognition]
    status: live
