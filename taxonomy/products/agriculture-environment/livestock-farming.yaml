  - id: sheep-goat-husbandry
    name: Sheep and Goat Husbandry
    kind: craft
    scope: "Keeping small ruminants: lambing and kidding, flock health routines, foot care and wool, meat or milk production management."
    examples: [lambing, foot care, drenching programmes, flock recording]
