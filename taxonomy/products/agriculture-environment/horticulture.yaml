category: agriculture-environment
field: horticulture
products:
  - id: market-gardening
    name: Market Gardening
    kind: craft
    scope: "Intensive outdoor vegetable production for sale: bed systems, succession planting, crop planning and harvest for market."
    examples: [succession planting, bed planning, intensive spacing, CSA box planning]
    status: live
  - id: greenhouse-production
    name: Greenhouse and Protected Cropping
    kind: craft
    scope: "Growing crops under glass, poly or tunnel: climate management, crop steering, trellising and year-round production planning."
    examples: [climate management, crop steering, tunnel cropping, supplemental lighting]
    status: live
  - id: hydroponics
    name: Hydroponics and Soilless Culture
    kind: craft
    scope: "Growing in nutrient solution or inert media: system types, nutrient recipes, EC/pH management and root-zone health."
    examples: [NFT systems, nutrient dosing, EC and pH management, substrate choice]
    status: live
  - id: orchard-management
    name: Orchard Management
    kind: craft
    scope: "Running tree-fruit and nut orchards: planting systems, pollination, thinning, pest programmes and crop-load management."
    examples: [crop-load thinning, pollination planning, orchard pest programmes, frost protection]
    status: live
  - id: viticulture
    name: Viticulture
    kind: craft
    scope: "Growing wine and table grapes: trellis and canopy management, pruning, vine balance and harvest-quality decisions."
    examples: [canopy management, winter pruning, veraison assessment, harvest timing]
    status: live
  - id: nursery-production
    name: Nursery Production
    kind: craft
    scope: "Producing container and field-grown nursery stock: potting, growing-on, root health and finishing plants for sale."
    examples: [potting mixes, growing-on schedules, root pruning, hardening off]
    status: live
  - id: plant-propagation
    name: Plant Propagation
    kind: craft
    scope: "Multiplying plants deliberately: seed raising, cuttings, grafting, budding, layering and division for production."
    examples: [grafting, softwood cuttings, seed stratification, budding]
    status: live
  - id: pruning-training
    name: Fruit Pruning and Training
    kind: craft
    scope: "Pruning and training fruiting plants for structure, light and yield: formative and maintenance pruning across tree and vine crops."
    examples: [formative pruning, renewal pruning, central leader training, summer pruning]
    status: live
  - id: cut-flower-production
    name: Cut Flower Production
    kind: craft
    scope: "Growing flowers as a harvested crop: scheduling for bloom windows, stem quality, harvesting stage and post-harvest conditioning."
    examples: [bloom scheduling, harvest stage, stem conditioning, cool-chain handling]
    status: live
  - id: mushroom-cultivation
    name: Mushroom Cultivation
    kind: craft
    scope: "Growing edible fungi under controlled conditions: substrate preparation, spawn, fruiting environment and contamination control."
    examples: [substrate pasteurisation, spawn runs, fruiting conditions, contamination control]
    status: live
  - id: hort-pest-disease
    name: Horticultural Pest and Disease Management
    kind: craft
    scope: "Protecting intensive crops from pests and disease: scouting, biological control, spray programmes and greenhouse hygiene."
    examples: [biocontrol releases, scouting routines, spray rotations, greenhouse hygiene]
    status: live
  - id: produce-post-harvest
    name: Produce Post-Harvest Handling
    kind: craft
    scope: "Getting fruit and vegetables from field to storable, saleable condition: maturity grading, cooling, packing and storage."
    examples: [maturity grading, hydrocooling, packing lines, controlled-atmosphere storage]
    status: live
