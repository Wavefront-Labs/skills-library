category: agriculture-environment
field: soil-land-management
products:
  - id: soil-testing
    name: Soil Testing and Interpretation
    kind: craft
    scope: "Sampling and reading soils: sampling design, lab test interpretation, pH and texture assessment, and turning results into decisions."
    examples: [sampling design, test interpretation, pH management, texture assessment]
    status: live
  - id: nutrient-management
    name: Nutrient and Fertiliser Management
    kind: craft
    scope: "Feeding crops and pasture economically: nutrient budgets, fertiliser product choice, rates and timing, and manure use."
    examples: [nutrient budgeting, fertiliser rates, split applications, manure management]
    status: live
  - id: soil-health-building
    name: Soil Health and Organic Matter Building
    kind: craft
    scope: "Improving soil biology and structure over time: organic-matter strategies, compost and amendments at field scale, and soil-life assessment."
    examples: [organic matter strategies, field composting, biological assessment, compaction remediation]
    status: live
  - id: conservation-tillage
    name: Conservation Tillage and No-Till
    kind: craft
    scope: "Reducing or eliminating tillage: no-till establishment, residue management, controlled traffic and the transition from conventional tillage."
    examples: [no-till seeding, residue management, controlled traffic, tillage transition]
    status: live
  - id: erosion-control
    name: Erosion Control
    kind: craft
    scope: "Keeping soil in place: contour works, ground cover management, gully repair and wind-erosion defences."
    examples: [contour banks, gully repair, ground cover thresholds, windbreak layout]
    status: live
  - id: land-reclamation
    name: Land Reclamation and Problem Soils
    kind: craft
    scope: "Bringing degraded or difficult land into production: salinity and sodicity management, acid soils, and rehabilitating compacted or scalded ground."
    examples: [salinity management, gypsum and lime programmes, acid-soil correction, scald rehabilitation]
    status: live
  - id: soil-survey-mapping
    name: Soil Survey and Land Capability Mapping
    kind: craft
    scope: "Mapping what the land can do: field soil description, soil pits, land-capability classes and paddock-scale soil maps."
    examples: [soil pit description, land capability classes, paddock mapping, EM surveys]
    status: live
