category: agriculture-environment
field: conservation-land-stewardship
products:
  - id: habitat-restoration
    name: Habitat Restoration
    kind: craft
    scope: "Restoring degraded habitats: restoration planning, site works, riparian and wetland repair, and judging recovery over years."
    examples: [restoration planning, riparian repair, site works, recovery monitoring]
    status: live
  - id: native-revegetation
    name: Native Revegetation
    kind: craft
    scope: "Re-establishing native vegetation: seed collection and provenance, direct seeding, tubestock planting and establishment care."
    examples: [seed collection, direct seeding, tubestock planting, guard and water regimes]
    status: live
  - id: invasive-species-control
    name: Invasive Species Control
    kind: craft
    scope: "Controlling invasive plants and animals on managed land: mapping infestations, control methods, follow-up and integrating control over seasons."
    examples: [weed mapping, cut-and-paint control, pest animal programmes, follow-up regimes]
    status: live
  - id: prescribed-burning
    name: Prescribed and Cultural Burning
    kind: craft
    scope: "Putting fire on the land deliberately: burn planning, weather windows, ignition and containment, and cultural burning practice."
    examples: [burn planning, ignition patterns, containment lines, cool-burn practice]
    status: live
  - id: wildlife-monitoring
    name: Wildlife Monitoring and Surveys
    kind: craft
    scope: "Knowing what lives on the land: survey design, camera trapping, call and sign surveys, and handling survey data for management."
    examples: [camera trapping, transect surveys, call surveys, survey data handling]
    status: live
  - id: rangeland-stewardship
    name: Rangeland Stewardship
    kind: craft
    scope: "Managing extensive rangelands for condition: assessing range health, managing total grazing pressure and balancing production with ecological outcomes."
    examples: [range condition assessment, grazing pressure management, water-point placement, ground cover targets]
    status: live
  - id: wetland-management
    name: Wetland Management
    kind: craft
    scope: "Managing wetlands: water-regime management, wetland vegetation, and maintaining habitat value through wetting and drying cycles."
    examples: [water regime management, wetland vegetation, drawdown timing, bird habitat management]
    status: live
  - id: conservation-gis
    name: Conservation GIS and Field Mapping
    kind: application
    scope: "Mapping conservation work with GIS and GPS tools such as QGIS and field data apps: site maps, infestation layers, monitoring points and work records."
    examples: [QGIS site mapping, GPS field capture, infestation layers, monitoring databases]
    status: live
