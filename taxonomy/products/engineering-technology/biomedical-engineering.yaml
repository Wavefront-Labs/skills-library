category: engineering-technology
field: biomedical-engineering
products:
  - id: medical-device-design
    name: Medical Device Design
    kind: craft
    scope: "Designing medical devices and implants: clinical-need translation, usability, sterilisation and design for the body's environment."
    examples: [device concept design, implant design, usability engineering, sterilisation-compatible design]
    status: live
  - id: biomechanics
    name: Biomechanics Engineering
    kind: craft
    scope: "Applying mechanics to the body: musculoskeletal load analysis, gait, tissue mechanics and device-tissue interaction."
    examples: [joint-load analysis, gait analysis, tissue mechanics, implant FEA]
    status: live
  - id: prosthetics-orthotics-design
    name: Prosthetics & Orthotics Engineering
    kind: craft
    scope: "Engineering prosthetic limbs and orthoses: socket and interface design, componentry selection and powered prosthesis design."
    examples: [socket design, prosthetic componentry, orthosis design, powered limb design]
    status: live
  - id: biomedical-instrumentation
    name: Biomedical Instrumentation
    kind: craft
    scope: "Designing devices that measure the body: biosignal acquisition, electrodes and sensors, patient-safe electronics and isolation."
    examples: [ECG/EEG front-ends, biosensor design, patient isolation, signal conditioning]
    status: live
  - id: medical-imaging-systems
    name: Medical Imaging Systems
    kind: craft
    scope: "Engineering imaging modalities: ultrasound, X-ray/CT and MRI system principles, image chain design and image-quality trade-offs."
    examples: [ultrasound transducer design, image-chain analysis, dose vs image quality, MRI coil basics]
    status: live
  - id: biomaterials
    name: Biomaterials Engineering
    kind: craft
    scope: "Selecting and engineering materials for the body: biocompatibility, degradation behaviour and implantable material choice."
    examples: [biocompatibility assessment, implant alloy selection, bioresorbable materials, surface treatments]
    status: live
  - id: device-verification-validation
    name: Device Verification & Validation
    kind: craft
    scope: "Engineering proof that a device meets its requirements: design controls, V&V test design and risk management per ISO 14971 (the regulatory filing itself is business-finance)."
    examples: [design-control traceability, V&V protocols, ISO 14971 risk files, bench-test design]
    status: live
