category: engineering-technology
field: technical-authentication-testing
products:
  - id: failure-analysis
    name: Failure Analysis
    kind: craft
    scope: "Determining why a product failed: fractography, root-cause methodology, evidence preservation and failure reporting for non-enforcement contexts."
    examples: [fractography, root-cause trees, evidence handling, failure reports]
    status: live
  - id: counterfeit-detection
    name: Counterfeit Component Detection
    kind: craft
    scope: "Authenticating parts and products: visual and marking inspection, decapsulation and X-ray of components, supply-chain authenticity testing."
    examples: [marking analysis, decap inspection, X-ray screening, authenticity reporting]
    status: live
  - id: nondestructive-testing
    name: Nondestructive Testing
    kind: craft
    scope: "Inspecting without destroying: ultrasonic, radiographic, dye-penetrant, magnetic-particle and eddy-current methods and their interpretation."
    examples: [UT scanning, radiograph reading, penetrant inspection, defect sizing]
    status: live
  - id: reliability-testing
    name: Reliability & Environmental Testing
    kind: craft
    scope: "Proving products survive their life: accelerated life testing, HALT/HASS, vibration/thermal/humidity testing and test-to-spec design."
    examples: [accelerated life tests, HALT/HASS, environmental test plans, Weibull analysis]
    status: live
  - id: product-compliance-testing
    name: Product Compliance Testing
    kind: craft
    scope: "Testing products against standards: EMC, electrical-safety and performance testing to IEC/UL-class specifications in the lab."
    examples: [EMC test runs, safety testing, test-plan design, standards interpretation]
    status: live
  - id: dimensional-metrology
    name: Dimensional Metrology
    kind: craft
    scope: "Measuring parts against specification: CMM and surface measurement, measurement uncertainty and first-article inspection."
    examples: [CMM programming, GD&T verification, uncertainty budgets, first-article inspection]
    status: live
