category: engineering-technology
field: structural-engineering
products:
  - id: etabs-sap2000
    name: ETABS / SAP2000
    kind: application
    scope: "Structural analysis and design in CSI's ETABS and SAP2000: building and general structure models, load cases, design checks."
    examples: [building modelling, load combinations, lateral analysis, code design checks]
    status: live
  - id: structural-analysis
    name: Structural Analysis
    kind: craft
    scope: "Determining forces and deflections in structures: statics, indeterminate analysis, influence lines and hand-check discipline against software."
    examples: [frame analysis, moment distribution, deflection checks, sanity-checking models]
    status: live
  - id: structural-loads
    name: Loads & Load Paths
    kind: craft
    scope: "Deriving design actions and tracing load paths: dead, live, wind, snow and load combinations per code."
    examples: [wind loading, live-load reduction, load combinations, load-path tracing]
    status: live
  - id: steel-design
    name: Steel Design
    kind: craft
    scope: "Designing structural steelwork: member design for flexure, compression and buckling, plate girders and composite action to code."
    examples: [beam and column design, buckling checks, composite beams, portal frames]
    status: live
  - id: reinforced-concrete-design
    name: Reinforced Concrete Design
    kind: craft
    scope: "Designing reinforced and prestressed concrete: beams, slabs, columns, shear walls, detailing and serviceability."
    examples: [beam and slab design, column interaction, crack control, prestress design]
    status: live
  - id: timber-masonry-design
    name: Timber & Masonry Design
    kind: craft
    scope: "Designing timber and masonry structures: member and wall design, connections and code-based capacity checks."
    examples: [timber beam design, stud wall design, masonry wall capacity, timber connections]
    status: live
  - id: connection-design
    name: Connection Design
    kind: craft
    scope: "Designing structural connections: bolted and welded steel joints, base plates, and concrete anchorage and embedments."
    examples: [bolted joint design, weld sizing, base plates, anchor design]
    status: live
  - id: foundation-design
    name: Foundation Design
    kind: craft
    scope: "Designing footings, rafts and piled foundations from geotechnical parameters: sizing, structural design and settlement control."
    examples: [pad and strip footings, raft design, pile design, pile-cap design]
    status: live
  - id: seismic-design
    name: Seismic Design
    kind: craft
    scope: "Designing structures for earthquakes: response spectra, ductility and detailing, lateral systems and seismic assessment of existing buildings."
    examples: [response-spectrum analysis, ductile detailing, lateral-system selection, seismic retrofit]
    status: live
  - id: bridge-engineering
    name: Bridge Engineering
    kind: craft
    scope: "Designing and assessing bridges: superstructure and substructure design, traffic loading, bearings and load rating."
    examples: [girder design, bridge loading, bearing and joint design, load rating]
    status: live
