category: engineering-technology
field: robotics-control-systems
products:
  - id: ros
    name: ROS
    kind: application
    scope: "Building robot systems on ROS/ROS 2: nodes and topics, tf frames, simulation with Gazebo and the navigation/manipulation stacks."
    examples: [node and topic design, tf frames, Gazebo simulation, Nav2/MoveIt use]
    status: live
  - id: matlab-simulink
    name: MATLAB / Simulink
    kind: application
    scope: "Control design in MATLAB and Simulink: plant modelling, controller synthesis and tuning, and code-generation-ready control models."
    examples: [plant modelling, controller tuning, Control System Toolbox, model-in-the-loop tests]
    status: live
  - id: control-system-design
    name: Control System Design
    kind: craft
    scope: "Designing feedback control: PID and loop shaping, state-space and optimal control, stability margins and discrete implementation."
    examples: [PID tuning, loop shaping, LQR/state feedback, discretisation effects]
    status: live
  - id: robot-kinematics-dynamics
    name: Robot Kinematics & Dynamics
    kind: craft
    scope: "Modelling robot motion and forces: forward/inverse kinematics, Jacobians, dynamics and manipulator/mobile-robot modelling."
    examples: [inverse kinematics, Jacobian analysis, dynamic modelling, workspace analysis]
    status: live
  - id: motion-planning
    name: Motion Planning
    kind: craft
    scope: "Planning robot motion: sampling- and search-based planners, trajectory generation and collision-free path design."
    examples: [RRT/PRM planning, trajectory generation, collision checking, path smoothing]
    status: live
  - id: state-estimation-sensor-fusion
    name: State Estimation & Sensor Fusion
    kind: craft
    scope: "Estimating robot and system state from sensors: Kalman filtering, IMU/GNSS/vision fusion and localisation/SLAM foundations."
    examples: [Kalman filter design, IMU fusion, localisation, SLAM foundations]
    status: live
  - id: mechatronic-design
    name: Mechatronic System Design
    kind: craft
    scope: "Integrating mechanics, actuation, sensing and control into one machine: actuator and sensor selection, drivetrain sizing and system integration."
    examples: [actuator sizing, sensor selection, drivetrain design, integration architecture]
    status: live
