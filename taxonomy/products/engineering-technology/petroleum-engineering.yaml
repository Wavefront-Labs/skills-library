category: engineering-technology
field: petroleum-engineering
products:
  - id: petrel-eclipse
    name: Petrel / Eclipse
    kind: application
    scope: "SLB's Petrel and Eclipse for subsurface work: reservoir modelling, simulation decks and development-scenario forecasting."
    examples: [static modelling, simulation decks, history matching, forecast scenarios]
    status: live
  - id: reservoir-engineering
    name: Reservoir Engineering
    kind: craft
    scope: "Managing reservoir performance: material balance, decline analysis, recovery mechanisms and reserves estimation."
    examples: [material balance, decline-curve analysis, waterflood design, reserves estimation]
    status: live
  - id: drilling-engineering
    name: Drilling Engineering
    kind: craft
    scope: "Engineering wells being drilled: well planning, casing design, drilling fluids, directional drilling and well control."
    examples: [casing design, mud programmes, directional planning, well-control calculations]
    status: live
  - id: well-completion-design
    name: Well Completion Design
    kind: craft
    scope: "Designing how wells produce: completion architecture, perforating, sand control and stimulation (fracturing, acidising) design."
    examples: [completion selection, frac design, sand-control design, perforating strategy]
    status: live
  - id: production-engineering
    name: Production Engineering
    kind: craft
    scope: "Optimising producing wells and surface systems: nodal analysis, artificial lift selection and production surveillance."
    examples: [nodal analysis, artificial-lift design, choke and tubing sizing, production diagnostics]
    status: live
  - id: formation-evaluation
    name: Formation Evaluation
    kind: craft
    scope: "Interpreting well logs and tests to characterise formations: petrophysics, log analysis and pressure-transient interpretation."
    examples: [log interpretation, petrophysical calculations, well-test analysis, pay identification]
    status: live
