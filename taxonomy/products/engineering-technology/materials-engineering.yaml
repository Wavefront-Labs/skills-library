category: engineering-technology
field: materials-engineering
products:
  - id: materials-selection
    name: Materials Selection
    kind: craft
    scope: "Choosing materials for engineering use: property charts and indices, trade-offs of strength, weight, cost and environment."
    examples: [Ashby charts, selection indices, cost-performance trade-offs, substitution studies]
    status: live
  - id: metallurgy-heat-treatment
    name: Metallurgy & Heat Treatment
    kind: craft
    scope: "Engineering metals and their processing: phase diagrams, heat-treatment design, welding metallurgy and alloy behaviour."
    examples: [heat-treatment schedules, phase-diagram reading, weldability assessment, alloy selection]
    status: live
  - id: polymer-engineering
    name: Polymer Engineering
    kind: craft
    scope: "Engineering with plastics and elastomers: grade selection, processing effects on properties, creep and environmental behaviour."
    examples: [resin selection, creep design, moulding effects, elastomer selection]
    status: live
  - id: composites-design
    name: Composites Engineering
    kind: craft
    scope: "Designing with fibre-reinforced composites: laminate theory, layup design, joining and failure prediction."
    examples: [laminate analysis, layup design, composite joints, failure criteria]
    status: live
  - id: corrosion-engineering
    name: Corrosion Engineering
    kind: craft
    scope: "Predicting and preventing corrosion: mechanism identification, material and coating selection, cathodic protection design."
    examples: [corrosion mechanism diagnosis, coating selection, cathodic protection, galvanic compatibility]
    status: live
  - id: materials-characterisation
    name: Materials Testing & Characterisation
    kind: craft
    scope: "Measuring material structure and properties: mechanical testing, hardness, microscopy and interpreting results for engineering decisions."
    examples: [tensile testing, hardness surveys, metallography, fractography reading]
    status: live
