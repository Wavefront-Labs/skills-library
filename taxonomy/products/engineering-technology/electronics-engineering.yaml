category: engineering-technology
field: electronics-engineering
products:
  - id: altium-designer
    name: Altium Designer
    kind: application
    scope: "Schematic capture and PCB layout in Altium Designer: libraries, multi-layer layout, rules, outputs for fabrication and assembly."
    examples: [schematic capture, layer stack design, design rules, Gerber/ODB++ output]
    status: live
  - id: kicad
    name: KiCad
    kind: application
    scope: "Open-source electronics design in KiCad: schematic, PCB layout, footprint libraries and fabrication outputs."
    examples: [schematic entry, PCB routing, footprint creation, fab outputs]
    status: live
  - id: ltspice
    name: LTspice
    kind: application
    scope: "Circuit simulation in LTspice: transient, AC and noise analysis, device models and verifying analog designs before layout."
    examples: [transient simulation, AC sweeps, model import, converter simulation]
    status: live
  - id: pcb-design
    name: PCB Design
    kind: craft
    scope: "Tool-agnostic board design craft: stack-up choice, placement, routing discipline, power distribution and manufacturability."
    examples: [stack-up design, placement strategy, power-plane design, DFM for boards]
    status: live
  - id: analog-circuit-design
    name: Analog Circuit Design
    kind: craft
    scope: "Designing analog circuits: amplifiers, filters, references, sensor front-ends and precision/noise trade-offs."
    examples: [op-amp circuits, filter design, sensor front-ends, noise budgeting]
    status: live
  - id: digital-circuit-design
    name: Digital Circuit Design
    kind: craft
    scope: "Designing digital hardware: logic design, timing, clocking, memory interfaces and bus selection at board level."
    examples: [timing closure, clock distribution, DDR interfacing, logic-family selection]
    status: live
  - id: rf-circuit-design
    name: RF & Microwave Circuit Design
    kind: craft
    scope: "Designing radio-frequency circuits: matching networks, amplifiers, filters, transmission lines and RF layout."
    examples: [impedance matching, LNA/PA design, microstrip design, S-parameter work]
    status: live
  - id: embedded-hardware-design
    name: Embedded Hardware Design
    kind: craft
    scope: "Designing microcontroller and SoC-based hardware: part selection, power trees, resets, debug access and peripherals (the firmware itself is computing-software)."
    examples: [MCU selection, power-tree design, reset and boot strapping, debug headers]
    status: live
  - id: fpga-design
    name: FPGA & HDL Design
    kind: craft
    scope: "Designing digital logic for FPGAs: RTL in VHDL/Verilog, constraints, timing closure and verification of programmable hardware."
    examples: [RTL design, timing constraints, testbenches, resource optimisation]
    status: live
  - id: signal-integrity
    name: Signal & Power Integrity
    kind: craft
    scope: "Keeping high-speed signals and supplies clean: impedance control, termination, crosstalk, decoupling and PDN analysis."
    examples: [impedance control, termination schemes, crosstalk mitigation, decoupling strategy]
    status: live
  - id: emc-design
    name: EMC Design
    kind: craft
    scope: "Designing electronics to pass emissions and immunity requirements: grounding, filtering, shielding and layout for compliance."
    examples: [grounding strategy, input filtering, shielding, pre-compliance debugging]
    status: live
  - id: hardware-bringup-test
    name: Hardware Bring-up & Test
    kind: craft
    scope: "Bringing up and debugging new boards: instrumented measurement, fault isolation, rework decisions and design-validation testing."
    examples: [first-power-on procedure, scope/logic-analyser technique, fault isolation, validation plans]
    status: live
