category: engineering-technology
field: electrical-engineering
products:
  - id: etap
    name: ETAP
    kind: application
    scope: "Power-system modelling and study work in ETAP: load flow, short circuit, protection coordination and arc-flash studies."
    examples: [load-flow studies, short-circuit analysis, coordination curves, arc-flash labels]
    status: live
  - id: matlab-simulink
    name: MATLAB / Simulink
    kind: application
    scope: "Simulating electrical systems in MATLAB and Simulink: power electronics, machines and drives with Simscape Electrical."
    examples: [converter simulation, motor-drive models, grid dynamics, control prototyping]
    status: live
  - id: power-system-analysis
    name: Power System Analysis
    kind: craft
    scope: "Analysing generation, transmission and distribution networks: load flow, fault analysis, stability and power quality."
    examples: [load-flow interpretation, fault calculations, voltage regulation, harmonics assessment]
    status: live
  - id: protection-coordination
    name: Protection & Coordination
    kind: craft
    scope: "Designing power-system protection: relay settings, CT/VT selection, selectivity between devices and protection philosophy."
    examples: [relay setting, time-current coordination, CT sizing, protection schemes]
    status: live
  - id: motor-drive-design
    name: Electrical Machines & Drives
    kind: craft
    scope: "Designing and applying motors, generators and variable-speed drives: machine selection, sizing, VFD application and starting methods."
    examples: [motor sizing, VFD selection, starting-method design, generator sizing]
    status: live
  - id: power-electronics
    name: Power Electronics Design
    kind: craft
    scope: "Designing power converters: topologies, switching devices, magnetics, gate drive and thermal design of SMPS, inverters and chargers."
    examples: [topology selection, magnetics design, gate-drive design, converter thermal design]
    status: live
  - id: circuit-analysis
    name: Circuit Analysis
    kind: craft
    scope: "Analysing electrical circuits rigorously: network theorems, AC/transient analysis and three-phase systems as the base craft of the discipline."
    examples: [nodal analysis, phasor analysis, transient response, three-phase calculations]
    status: live
  - id: electrical-installation-design
    name: Electrical Installation Design
    kind: craft
    scope: "Designing building and plant electrical installations to code: cable sizing, switchboard design, earthing and lighting circuits per NEC/IEC practice."
    examples: [cable sizing, switchboard schedules, earthing design, voltage-drop checks]
    status: live
  - id: electromagnetics
    name: Applied Electromagnetics
    kind: craft
    scope: "Applying field theory to engineering problems: magnetic circuits, transformers, shielding and electromagnetic compatibility at the systems level."
    examples: [magnetic circuit design, transformer design, shielding, field calculations]
    status: live
