category: engineering-technology
field: industrial-manufacturing-systems-engineering
products:
  - id: facility-layout-design
    name: Facility & Layout Design
    kind: craft
    scope: "Designing production facilities: process and cellular layouts, material-flow analysis and capacity-driven floor planning."
    examples: [block layouts, material-flow analysis, cell design, capacity planning]
    status: live
  - id: manufacturing-process-selection
    name: Manufacturing Process Selection
    kind: craft
    scope: "Choosing and specifying how parts will be made: process capability vs geometry, cost modelling and make-route design (programming the machines themselves is manufacturing-production)."
    examples: [process selection, should-cost modelling, process-capability matching, route design]
    status: live
  - id: lean-six-sigma
    name: Lean & Six Sigma Engineering
    kind: craft
    scope: "Engineering waste and variation out of production systems: value-stream design, flow and pull design, DMAIC improvement engineering."
    examples: [value-stream mapping, takt and flow design, DMAIC projects, SMED design]
    status: live
  - id: discrete-event-simulation
    name: Discrete-Event Simulation
    kind: craft
    scope: "Simulating production and service systems to size and de-risk them: model building (Arena/FlexSim-class tools), experiments and bottleneck analysis."
    examples: [throughput models, bottleneck analysis, buffer sizing, scenario experiments]
    status: live
  - id: work-design-ergonomics
    name: Work Design & Ergonomics
    kind: craft
    scope: "Engineering human work: time study and work measurement, workstation ergonomics and line balancing."
    examples: [time studies, line balancing, workstation ergonomics, standard work design]
    status: live
  - id: quality-engineering
    name: Quality Engineering
    kind: craft
    scope: "Designing quality into products and processes: SPC design, measurement-system analysis, DOE and FMEA as engineering methods."
    examples: [control-chart design, gauge R&R, designed experiments, process FMEA]
    status: live
  - id: factory-automation-design
    name: Factory Automation Design
    kind: craft
    scope: "Specifying and architecting automated production: automation concepts, robot-cell and conveyor system design, safety integration (line-side PLC/robot programming is manufacturing-production)."
    examples: [automation concept design, robot-cell layout, conveyor system design, machine safety design]
    status: live
