category: engineering-technology
field: chemical-engineering
products:
  - id: aspen
    name: Aspen Plus / HYSYS
    kind: application
    scope: "Process simulation in Aspen Plus and HYSYS: flowsheet models, property methods, column and reactor blocks, case studies."
    examples: [flowsheet convergence, property-method selection, column simulation, sensitivity cases]
    status: live
  - id: process-design
    name: Process Design
    kind: craft
    scope: "Designing chemical processes end to end: mass and energy balances, flowsheet synthesis, utility design and economics screening."
    examples: [mass and energy balances, flowsheet synthesis, utility systems, design-basis setting]
    status: live
  - id: reactor-design
    name: Reactor Design
    kind: craft
    scope: "Designing chemical reactors: kinetics, reactor selection and sizing, heat management and scale-up."
    examples: [kinetic modelling, reactor sizing, heat-removal design, scale-up]
    status: live
  - id: separation-processes
    name: Separation Processes
    kind: craft
    scope: "Designing separations: distillation, absorption, extraction, membranes and crystallisation equipment and sequences."
    examples: [distillation column design, absorber design, separation sequencing, membrane selection]
    status: live
  - id: heat-exchanger-design
    name: Heat Exchanger Design
    kind: craft
    scope: "Thermal and mechanical design of heat exchangers: shell-and-tube and compact exchangers, fouling and network integration (pinch)."
    examples: [shell-and-tube rating, exchanger selection, fouling allowances, pinch analysis]
    status: live
  - id: piping-instrumentation
    name: Piping & Instrumentation Design
    kind: craft
    scope: "Developing P&IDs and hydraulic design: line sizing, pump and valve selection, instrumentation and relief locations on the drawing set."
    examples: [P&ID development, line sizing, pump hydraulics, control-valve sizing]
    status: live
  - id: process-control
    name: Process Control
    kind: craft
    scope: "Designing regulatory and advanced control for processes: loop pairing, PID tuning, cascade and model-based strategies."
    examples: [loop pairing, PID tuning, cascade control, alarm rationalisation]
    status: live
  - id: process-safety
    name: Process Safety Engineering
    kind: craft
    scope: "Engineering processes to be safe: HAZOP and LOPA studies, relief and flare sizing, consequence modelling and inherently safer design."
    examples: [HAZOP facilitation, relief-valve sizing, LOPA, dispersion modelling]
    status: live
