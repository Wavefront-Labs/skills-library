category: engineering-technology
field: civil-engineering
products:
  - id: civil-3d
    name: Autodesk Civil 3D
    kind: application
    scope: "Civil design in Civil 3D: surfaces, corridors, grading, pipe networks and plan production for land and transport projects."
    examples: [corridor modelling, grading design, pipe networks, plan sheets]
    status: live
  - id: hec-ras
    name: HEC-RAS
    kind: application
    scope: "River and floodplain modelling in HEC-RAS: 1D/2D hydraulic models, bridge hydraulics and flood-extent mapping."
    examples: [water-surface profiles, 2D flood modelling, bridge hydraulics, model calibration]
    status: live
  - id: plaxis
    name: PLAXIS
    kind: application
    scope: "Geotechnical finite-element modelling in PLAXIS: soil constitutive models, staged construction, excavations and settlement prediction."
    examples: [staged excavation models, settlement analysis, soil model selection, retaining-wall analysis]
    status: live
  - id: geotechnical-engineering
    name: Geotechnical Engineering
    kind: craft
    scope: "Soil and rock engineering: site investigation interpretation, bearing capacity, settlement, slopes and retaining structures."
    examples: [bearing-capacity design, settlement prediction, slope stability, retaining-wall design]
    status: live
  - id: hydraulic-hydrologic-design
    name: Hydraulic & Hydrologic Design
    kind: craft
    scope: "Engineering water conveyance: rainfall-runoff estimation, open-channel and culvert hydraulics, and hydraulic structures."
    examples: [runoff estimation, open-channel design, culvert sizing, weir and outlet design]
    status: live
  - id: stormwater-drainage-design
    name: Stormwater & Drainage Design
    kind: craft
    scope: "Designing urban drainage: pit-and-pipe networks, detention, water-sensitive design and overland flow paths."
    examples: [pipe-network sizing, detention basin design, WSUD measures, overland flow checks]
    status: live
  - id: transportation-highway-design
    name: Transportation & Highway Design
    kind: craft
    scope: "Designing roads and transport infrastructure: geometric design, intersections, sight distance and traffic-capacity analysis."
    examples: [horizontal and vertical alignment, intersection design, sight-distance checks, capacity analysis]
    status: live
  - id: pavement-design
    name: Pavement Design
    kind: craft
    scope: "Designing flexible and rigid pavements: traffic loading, layer thickness design, materials selection and rehabilitation design."
    examples: [ESA traffic estimation, layer thickness design, pavement materials, overlay design]
    status: live
  - id: site-grading-earthworks
    name: Site Grading & Earthworks Design
    kind: craft
    scope: "Engineering site works: grading plans, cut-and-fill balance, erosion and sediment control design."
    examples: [grading plans, earthworks balance, batter design, erosion control plans]
    status: live
