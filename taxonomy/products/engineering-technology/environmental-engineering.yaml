category: engineering-technology
field: environmental-engineering
products:
  - id: epanet-swmm
    name: EPANET / SWMM
    kind: application
    scope: "EPA's EPANET and SWMM for water-network and stormwater modelling: distribution hydraulics, water quality and urban runoff models."
    examples: [network hydraulics, water-quality modelling, runoff simulation, model calibration]
    status: live
  - id: water-treatment-design
    name: Water Treatment Design
    kind: craft
    scope: "Designing drinking-water treatment: coagulation, filtration, disinfection and membrane process selection and sizing."
    examples: [treatment-train selection, filter design, disinfection CT, membrane sizing]
    status: live
  - id: wastewater-treatment-design
    name: Wastewater Treatment Design
    kind: craft
    scope: "Designing sewage and industrial wastewater treatment: activated sludge, clarifiers, nutrient removal and biosolids handling."
    examples: [activated-sludge design, clarifier sizing, nutrient-removal design, biosolids processing]
    status: live
  - id: air-pollution-control
    name: Air Pollution Control Engineering
    kind: craft
    scope: "Designing emission controls and assessing air quality: scrubbers, baghouses, dispersion modelling and stack design."
    examples: [scrubber design, baghouse sizing, dispersion modelling, emissions estimation]
    status: live
  - id: solid-waste-engineering
    name: Solid Waste Engineering
    kind: craft
    scope: "Engineering waste systems: landfill design, leachate and gas management, and recycling/resource-recovery facility design."
    examples: [landfill cell design, leachate collection, landfill gas systems, MRF design]
    status: live
  - id: site-remediation
    name: Contaminated Site Remediation
    kind: craft
    scope: "Engineering clean-up of contaminated land and groundwater: site characterisation, remedy selection and remediation system design."
    examples: [plume characterisation, remedy selection, pump-and-treat design, in-situ treatment design]
    status: live
