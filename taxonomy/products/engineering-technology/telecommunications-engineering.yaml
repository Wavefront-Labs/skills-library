    status: live
  - id: radio-network-planning
    name: Radio Network Planning
    kind: craft
    scope: "Planning cellular and wireless networks: site placement, coverage and capacity planning, and microwave backhaul design."
    examples: [coverage planning, site selection, capacity planning, microwave backhaul design]
    status: live
  - id: antenna-design
    name: Antenna Design
