category: engineering-technology
field: aerospace-engineering
products:
  - id: matlab-simulink
    name: MATLAB / Simulink
    kind: application
    scope: "Aerospace modelling in MATLAB and Simulink: flight-dynamics models, GNC prototyping and trajectory analysis."
    examples: [6-DOF models, GNC prototyping, trajectory analysis, Monte Carlo dispersions]
    status: live
  - id: ansys-fluent
    name: Ansys Fluent
    kind: application
    scope: "CFD in Ansys Fluent for aerospace flows: meshing, turbulence models, compressible flow and aerodynamic force extraction."
    examples: [external aero runs, turbulence-model selection, compressible solutions, force coefficients]
    status: live
  - id: aerodynamics
    name: Aerodynamics
    kind: craft
    scope: "Analysing and shaping airflow around vehicles: airfoil and wing design, lift and drag estimation, high-speed effects."
    examples: [airfoil selection, drag build-up, wing design, transonic effects]
    status: live
  - id: computational-fluid-dynamics
    name: Computational Fluid Dynamics
    kind: craft
    scope: "Tool-agnostic CFD practice: mesh quality, turbulence-model judgement, convergence, and validating simulations against data."
    examples: [mesh independence, turbulence modelling, convergence judgement, validation against test]
    status: live
  - id: aircraft-structures
    name: Aircraft Structures
    kind: craft
    scope: "Designing airframe structures: thin-walled analysis, fatigue and damage tolerance, composite airframe design to airworthiness loads."
    examples: [wing-box sizing, fatigue and damage tolerance, composite layup design, loads cases]
    status: live
  - id: propulsion-engineering
    name: Propulsion Engineering
    kind: craft
    scope: "Designing and analysing aerospace propulsion: gas turbines, rockets and electric propulsion, cycle analysis and performance matching."
    examples: [turbofan cycle analysis, nozzle design, rocket performance, engine-airframe matching]
    status: live
  - id: flight-dynamics-control
    name: Flight Dynamics & Control
    kind: craft
    scope: "Modelling and controlling vehicle flight: stability derivatives, handling qualities, autopilot and GNC design."
    examples: [stability analysis, control-law design, handling qualities, autopilot design]
    status: live
  - id: orbital-mechanics
    name: Orbital Mechanics & Mission Design
    kind: craft
    scope: "Designing orbits and space missions: transfers, manoeuvre budgets, launch windows and constellation geometry."
    examples: [transfer design, delta-v budgets, launch windows, orbit perturbations]
    status: live
  - id: spacecraft-systems-design
    name: Spacecraft Systems Design
    kind: craft
    scope: "Designing spacecraft buses and payloads: power, thermal, ADCS, comms sizing and the mass/power budget trade space."
    examples: [subsystem sizing, mass and power budgets, ADCS design, thermal control design]
    status: live
