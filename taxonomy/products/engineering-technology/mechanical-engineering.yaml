category: engineering-technology
field: mechanical-engineering
products:
  - id: solidworks
    name: SolidWorks
    kind: application
    scope: "Mechanical design in SolidWorks: part and assembly modelling, configurations, simulation add-ins and design tables for machine and product design."
    examples: [part modelling, assembly mates, design tables, SolidWorks Simulation]
    status: live
  - id: ansys-mechanical
    name: Ansys Mechanical
    kind: application
    scope: "Structural and thermal simulation in Ansys Mechanical: meshing, contacts, load cases, modal and nonlinear analysis of mechanical parts."
    examples: [static structural runs, modal analysis, contact setup, mesh convergence]
    status: live
  - id: matlab-simulink
    name: MATLAB / Simulink
    kind: application
    scope: "Modelling and simulating mechanical and thermo-fluid systems in MATLAB and Simulink: dynamics models, Simscape physical networks, parameter studies."
    examples: [lumped-parameter dynamics, Simscape models, parameter sweeps, result post-processing]
    status: live
  - id: machine-design
    name: Machine Design
    kind: craft
    scope: "Designing machine elements and whole machines: shafts, bearings, gears, fasteners, springs, sized against strength and fatigue criteria."
    examples: [shaft sizing, bearing selection, gear design, bolted-joint analysis]
    status: live
  - id: mechanism-kinematics
    name: Mechanism & Kinematics Design
    kind: craft
    scope: "Synthesising and analysing mechanisms: linkages, cams, transmissions and their position, velocity and force behaviour."
    examples: [four-bar synthesis, cam profile design, degree-of-freedom analysis, transmission layout]
    status: live
  - id: thermodynamics-power-cycles
    name: Thermodynamics & Power Cycles
    kind: craft
    scope: "Analysing and designing thermal systems around thermodynamic cycles: Rankine, Brayton, refrigeration and combined cycles, component sizing and efficiency."
    examples: [cycle analysis, refrigeration sizing, combustion energy balance, waste-heat recovery]
    status: live
  - id: heat-transfer-analysis
    name: Heat Transfer Analysis
    kind: craft
    scope: "Predicting and managing heat flow in designs: conduction, convection and radiation calculations, heat-sink and cooling design."
    examples: [heat-sink sizing, thermal resistance networks, electronics cooling, insulation design]
    status: live
  - id: hvac-design
    name: HVAC System Design
    kind: craft
    scope: "Designing heating, ventilation and air-conditioning systems: load calculation, equipment selection, duct and hydronic layout to ASHRAE practice."
    examples: [cooling load calcs, duct sizing, equipment selection, ventilation rates]
    status: live
  - id: fluid-power
    name: Fluid Power Systems
    kind: craft
    scope: "Designing hydraulic and pneumatic systems: circuit design, actuator and pump sizing, valves and control of fluid power."
    examples: [hydraulic circuit design, cylinder sizing, pump selection, pneumatic logic]
    status: live
  - id: vibration-analysis
    name: Vibration & Dynamics Analysis
    kind: craft
    scope: "Analysing and controlling vibration in machines and structures: natural frequencies, rotor dynamics, isolation and balancing."
    examples: [modal analysis, rotor balancing, vibration isolation, resonance avoidance]
    status: live
  - id: finite-element-analysis
    name: Finite Element Analysis
    kind: craft
    scope: "Tool-agnostic FEA practice: idealisation, meshing judgement, boundary conditions, validation and interpreting stress results honestly."
    examples: [model idealisation, boundary-condition choice, mesh convergence, result validation]
    status: live
  - id: design-for-manufacture
    name: Design for Manufacture & Assembly
    kind: craft
    scope: "Shaping mechanical designs so they can be made and assembled economically: process-driven part design, tolerance strategy, part-count reduction."
    examples: [DFM reviews, moulding draft and ribs, machining-friendly features, part-count reduction]
    status: live
  - id: tolerance-design
    name: Tolerance Design
    kind: craft
    scope: "Allocating and analysing tolerances so assemblies fit and function: stack-up analysis, datum strategy, statistical tolerancing."
    examples: [tolerance stack-ups, datum selection, statistical tolerancing, fit selection]
    status: live
