category: religion-philosophy
field: jain-practice
products:
  - id: temple-ritual-and-puja
    name: Temple Ritual and Puja
    kind: craft
    scope: "Jain temple worship: darshan and puja of the tirthankaras, abhisheka, and the eightfold puja."
    examples: [ashtaprakari puja, abhisheka, darshan]
    status: live
  - id: daily-practice-and-avashyakas
    name: Daily Practice and Avashyakas
    kind: craft
    scope: "The six daily essentials: samayika equanimity practice, pratikramana confession, vandana veneration and daily vows."
    examples: [samayika, pratikramana, vandana]
    status: live
  - id: fasting-and-austerities
    name: Fasting and Austerities
    kind: craft
    scope: "Tapas as religious observance: fasting practices from upvas to extended fasts, Paryushana austerities and sallekhana as rite."
    examples: [upvas fasting, Paryushana fasts, ayambil]
    status: live
  - id: ahimsa-observance
    name: Ahimsa Observance
    kind: craft
    scope: "Living non-violence as religious discipline: dietary observance, care in daily conduct and the vows that encode ahimsa."
    examples: [Jain dietary observance, anuvrata vows, care of small life]
    status: live
  - id: monastic-discipline
    name: Monastic Discipline
    kind: craft
    scope: "The ascetic path: diksha initiation, the mahavratas, vihara wandering and the conduct rules of Jain monks and nuns."
    examples: [diksha, mahavrata vows, gochari alms practice]
    status: live
  - id: festivals-and-calendar
    name: Festivals and the Jain Calendar
    kind: craft
    scope: "Keeping the Jain year: Paryushana and Das Lakshana, Mahavir Janma Kalyanak, Diwali as nirvana observance, and kshamavani forgiveness."
    examples: [Paryushana, kshamavani, Mahavir Jayanti]
    status: live
  - id: pilgrimage
    name: Pilgrimage
    kind: craft
    scope: "Jain pilgrimage as devotion: tirtha sites such as Shatrunjaya, Shikharji and Shravanabelagola and the rites of the journey."
    examples: [Shatrunjaya yatra, Shikharji pilgrimage, mastakabhisheka]
    status: live
