category: religion-philosophy
field: sikh-practice
products:
  - id: gurdwara-worship
    name: Gurdwara Worship
    kind: craft
    scope: "Worship in the gurdwara: the diwan service, care and ceremony of the Guru Granth Sahib, ardas and hukamnama."
    examples: [diwan service, ardas, hukamnama, palki ceremony]
    status: live
  - id: kirtan
    name: Kirtan
    kind: craft
    scope: "Devotional singing of gurbani as worship: shabad kirtan in the sangat and its place in the service."
    examples: [shabad kirtan, rababi tradition in worship, kirtan in diwan]
    status: live
  - id: scripture-recitation
    name: Gurbani Recitation and Nitnem
    kind: craft
    scope: "Reciting and engaging the Guru Granth Sahib as faith practice: nitnem daily prayers, akhand path and sehaj path readings, naam simran."
    examples: [nitnem banis, akhand path, naam simran]
    status: live
  - id: langar-and-seva
    name: Langar and Seva
    kind: craft
    scope: "Selfless service as religious practice: running langar as an institution of worship, seva in the gurdwara."
    examples: [langar service, gurdwara seva]
    status: live
  - id: khalsa-observance
    name: Khalsa Observance
    kind: craft
    scope: "Living the Khalsa discipline: amrit sanchar initiation, the five Ks, and rehat maryada observance."
    examples: [amrit sanchar, five Ks observance, rehat maryada]
    status: live
  - id: festivals-and-calendar
    name: Festivals and the Sikh Calendar
    kind: craft
    scope: "Keeping the Sikh year: Vaisakhi, gurpurabs, Bandi Chhor Divas and nagar kirtan processions."
    examples: [Vaisakhi, gurpurab observance, nagar kirtan]
    status: live
  - id: rites-of-passage
    name: Rites of Passage
    kind: craft
    scope: "Sikh life-cycle rites: naming from the Guru Granth Sahib, anand karaj marriage, and antam sanskar funeral rites."
    examples: [naam karan, anand karaj, antam sanskar]
    status: live
