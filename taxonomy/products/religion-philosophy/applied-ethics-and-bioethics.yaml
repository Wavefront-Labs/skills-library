category: religion-philosophy
field: applied-ethics-and-bioethics
products:
  - id: clinical-ethics-consultation
    name: Clinical Ethics Consultation
    kind: craft
    scope: "Ethics consultation at the bedside: case analysis, capacity and consent questions, end-of-life decision support and consult documentation."
    examples: [bedside consults, end-of-life decisions, consent analysis]
    status: live
  - id: ethics-committee-service
    name: Ethics Committee Service
    kind: craft
    scope: "Serving on institutional ethics committees: policy review, case deliberation and committee process in hospitals and organisations."
    examples: [committee deliberation, ethics policy review, case conferences]
    status: live
  - id: research-ethics-review
    name: Research Ethics Review
    kind: craft
    scope: "Ethics review of research with humans and animals: IRB/REC service, protocol review and informed-consent assessment."
    examples: [IRB protocol review, consent-form assessment, risk-benefit analysis]
    status: live
  - id: professional-ethics-advising
    name: Professional and Business Ethics Advising
    kind: craft
    scope: "Advising professions and organisations on ethics: codes of conduct, dilemma analysis and ethics guidance in professional practice."
    examples: [code-of-conduct advising, dilemma analysis, organisational ethics guidance]
    status: live
  - id: technology-and-ai-ethics
    name: Technology and AI Ethics
    kind: craft
    scope: "Applied ethics of technology: AI and data ethics assessment, algorithmic fairness deliberation and technology ethics advising in practice."
    examples: [AI ethics assessment, data ethics review, fairness deliberation]
    status: live
  - id: environmental-ethics
    name: Environmental Ethics
    kind: craft
    scope: "Applied ethical reasoning about the environment: environmental and animal ethics brought to real decisions and policy deliberation."
    examples: [environmental decision ethics, animal ethics advising, sustainability deliberation]
    status: live
  - id: public-health-ethics
    name: Public Health Ethics
    kind: craft
    scope: "Ethics of population-level health decisions: resource allocation, vaccination and quarantine ethics, and public-health policy deliberation."
    examples: [allocation frameworks, quarantine ethics, vaccination policy deliberation]
    status: live
