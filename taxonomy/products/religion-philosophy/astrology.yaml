category: religion-philosophy
field: astrology
products:
  - id: natal-charting
    name: Natal Charting
    kind: craft
    scope: "Casting and interpreting birth charts: planets, signs, houses and aspects in natal delineation."
    examples: [chart casting, aspect interpretation, house delineation]
    status: live
  - id: transits-and-forecasting
    name: Transits and Forecasting
    kind: craft
    scope: "Predictive astrology over time: transits, progressions, solar returns and horoscope forecasting."
    examples: [transit reading, secondary progressions, solar returns, horoscope writing]
    status: live
  - id: horary-astrology
    name: Horary Astrology
    kind: craft
    scope: "Answering a specific question from the chart of the moment it is asked: horary technique and judgment."
    examples: [horary judgment, significators, question charts]
    status: live
  - id: electional-astrology
    name: Electional Astrology
    kind: craft
    scope: "Choosing auspicious times: electing charts for weddings, ventures and undertakings."
    examples: [wedding elections, business launch timing, electional rules]
    status: live
  - id: synastry-and-relationship
    name: Synastry and Relationship Astrology
    kind: craft
    scope: "Comparing charts for relationships: synastry aspects, composite charts and compatibility readings."
    examples: [synastry overlays, composite charts, compatibility readings]
    status: live
  - id: mundane-astrology
    name: Mundane Astrology
    kind: craft
    scope: "Astrology of nations and world events: ingress charts, eclipses and great conjunctions in mundane judgment."
    examples: [ingress charts, eclipse interpretation, national charts]
    status: live
  - id: vedic-astrology
    name: Vedic Astrology (Jyotish)
    kind: craft
    scope: "The Indian astrological system: sidereal charts, nakshatras, dashas and jyotish remedial tradition."
    examples: [sidereal chart reading, nakshatras, dasha periods]
    status: live
  - id: chinese-astrology
    name: Chinese Astrology
    kind: craft
    scope: "The Chinese system: the zodiac animals and elements, four pillars (BaZi) charting and its readings."
