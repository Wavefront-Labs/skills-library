category: religion-philosophy
field: western-philosophy
products:
  - id: ancient-philosophy
    name: Ancient Greek and Roman Philosophy
    kind: craft
    scope: "The classical schools as practised traditions: Platonism, Aristotelianism, Stoicism, Epicureanism and Scepticism, including Stoicism lived as a discipline."
    examples: [Stoic practice, Socratic method, Aristotelian ethics, Epicureanism]
    status: live
  - id: medieval-and-scholastic-philosophy
    name: Medieval and Scholastic Philosophy
    kind: craft
    scope: "The scholastic tradition as a practised method: Thomism, disputation, and medieval synthesis of faith and reason."
    examples: [Thomist method, scholastic disputation, natural theology]
    status: live
  - id: analytic-philosophy
    name: Analytic Philosophy
    kind: craft
    scope: "The analytic tradition's method: conceptual analysis, thought experiments, rigorous argument and the style of anglophone philosophy."
    examples: [conceptual analysis, thought experiments, argument reconstruction]
    status: live
  - id: continental-philosophy
    name: Continental Philosophy
    kind: craft
    scope: "The continental traditions as practised: phenomenology, existentialism, hermeneutics and critical theory as methods of inquiry."
    examples: [phenomenological method, existentialist analysis, hermeneutics, critical theory]
    status: live
  - id: metaphysics
    name: Metaphysics
    kind: craft
    scope: "Practising metaphysical inquiry: existence, identity, causation, time, modality and the structure of reality."
    examples: [identity puzzles, causation, modality, free will]
    status: live
  - id: epistemology
    name: Epistemology
    kind: craft
    scope: "Practising the theory of knowledge: justification, scepticism, perception and the analysis of knowing."
    examples: [justification theories, scepticism, Gettier problems]
    status: live
  - id: moral-philosophy
    name: Moral Philosophy
    kind: craft
    scope: "Normative ethics and metaethics as a practised discipline: consequentialism, deontology, virtue ethics and the status of moral claims; applied ethics consultation is its own field."
    examples: [normative theories, metaethics, virtue ethics, moral reasoning]
    status: live
  - id: political-philosophy
    name: Political and Social Philosophy
    kind: craft
    scope: "Practising philosophy of politics and society: justice, liberty, authority, rights and political legitimacy."
    examples: [theories of justice, liberty debates, social contract reasoning]
    status: live
  - id: philosophy-of-mind-and-language
    name: Philosophy of Mind and Language
    kind: craft
    scope: "Practising inquiry into mind and meaning: consciousness, intentionality, reference and the mind-body problem."
    examples: [consciousness debates, mind-body problem, theories of reference]
    status: live
  - id: argumentation-and-philosophical-method
    name: Argumentation and Philosophical Method
    kind: craft
    scope: "The philosopher's working method: argument construction and critique, informal logic and fallacies, philosophical writing and dialectic; formal logic as a calculus is mathematics."
    examples: [argument mapping, fallacy analysis, philosophical writing, dialectic]
    status: live
