  - id: prison-chaplaincy
    name: Prison Chaplaincy
    kind: craft
    scope: "Religious ministry in correctional settings: worship services inside, sacraments for inmates and multi-faith provision."
    examples: [prison worship services, sacraments for inmates, multi-faith provision]
