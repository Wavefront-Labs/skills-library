category: religion-philosophy
field: hindu-practice
products:
  - id: puja-and-home-worship
    name: Puja and Home Worship
    kind: craft
    scope: "Daily puja and household worship: the home shrine, offerings, arati, and devotional care of deities."
    examples: [home shrine puja, arati, prasad offering, deity care]
    status: live
  - id: temple-ritual
    name: Temple Ritual
    kind: craft
    scope: "Worship in the temple: darshan, priestly ritual (archana, abhisheka), temple festivals and processions as rite."
    examples: [darshan, abhisheka, archana, temple procession rites]
    status: live
  - id: bhakti-devotion
    name: Bhakti Devotion
    kind: craft
    scope: "The path of devotion: kirtan and bhajan as worship, japa with a mala, satsang and devotional surrender to a chosen deity."
    examples: [japa practice, bhajan and kirtan as worship, satsang]
    status: live
  - id: scripture-recitation-and-study
    name: Scripture Recitation and Study
    kind: craft
    scope: "Engaging sacred texts as faith practice: Vedic chanting, Gita and Ramayana recitation, svadhyaya self-study."
    examples: [Vedic chanting, Bhagavad Gita recitation, Ramayana path]
    status: live
  - id: festivals-and-calendar
    name: Festivals and the Hindu Calendar
    kind: craft
    scope: "Keeping the Hindu year: Diwali, Holi, Navaratri, Ekadashi fasts, and the panchang calendar's observances and vrata vows."
    examples: [Diwali puja, Navaratri observance, Ekadashi fasting, vrata vows]
    status: live
  - id: samskaras
    name: Samskaras and Rites of Passage
    kind: craft
    scope: "Hindu life-cycle rites: naming (namakarana), sacred thread (upanayana), the wedding ceremony and antyeshti funeral rites."
    examples: [namakarana, upanayana, Vedic wedding rites, antyeshti]
    status: live
  - id: pilgrimage
    name: Pilgrimage (Yatra)
    kind: craft
    scope: "Hindu pilgrimage as devotion: tirtha sites, the Char Dham, Kumbh Mela and river rites of the journey."
    examples: [Char Dham yatra, Kumbh Mela, Ganga rites]
    status: live
  - id: sadhana-and-spiritual-discipline
    name: Sadhana and Spiritual Discipline
    kind: craft
    scope: "Yoga and tapas as spiritual practice within the tradition: the devotional and ascetic side of sadhana, guru-disciple practice and vows; posture and attention technique as exercised outside the rite belongs elsewhere."
    examples: [guru-disciple practice, ascetic vows, devotional sadhana]
    status: live
