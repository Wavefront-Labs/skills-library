category: humanities
field: provenance-and-art-authentication
products:
  - id: provenance-research
    name: Provenance Research
    kind: craft
    scope: "Reconstructing an object's ownership history: sale catalogues, dealer and collector archives, labels and marks, and documenting the chain of custody."
    examples: [auction records, dealer archives, labels and stamps, gap analysis]
    status: live
  - id: restitution-research
    name: Restitution and Spoliation Research
    kind: craft
    scope: "Researching looted and displaced objects: Nazi-era and colonial-era loss, claims documentation and due diligence for acquisitions."
    examples: [Nazi-era loss research, claims documentation, acquisition due diligence, colonial-collection histories]
    status: live
  - id: connoisseurship-and-attribution
    name: Connoisseurship and Attribution
    kind: craft
    scope: "Judging authorship by trained eye: comparative analysis of hand, style and quality, attribution language and the limits of eye-based judgement."
    examples: [comparative-eye method, attribution grading, workshop vs autograph, attribution language]
    status: live
  - id: technical-examination
    name: Technical Examination
    kind: craft
    scope: "Interpreting scientific examination for authenticity: imaging (X-ray, infrared, UV), pigment and material dating evidence, and anachronism detection."
    examples: [infrared reflectography, pigment analysis interpretation, anachronism detection, forgery indicators]
    status: live
  - id: provenance-and-loss-databases
    name: Provenance and Loss Databases
    kind: application
    scope: "Databases used in provenance work as a class (Getty Provenance Index, Art Loss Register, lost-art registries): effective search and interpreting a hit or its absence."
    examples: [registry searches, interpreting matches, due-diligence reports, database limitations]
    status: live
