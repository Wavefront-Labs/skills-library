category: humanities
field: criminology
products:
  - id: criminological-theory
    name: Criminological Theory
    kind: craft
    scope: "Developing and testing theories of crime and deviance: strain, control, labelling, rational-choice and life-course perspectives in scholarship."
    examples: [theory application, theory testing, literature synthesis, theoretical critique]
    status: live
  - id: crime-data-analysis
    name: Crime Data and Pattern Research
    kind: craft
    scope: "Quantitative study of crime: official statistics and victimisation surveys, trend and pattern analysis, and the limits of crime data."
    examples: [crime statistics, victimisation surveys, trend analysis, dark-figure problems]
    status: live
  - id: qualitative-criminology
    name: Qualitative Criminology
    kind: craft
    scope: "Studying crime up close: offender and desistance interviews, ethnography of criminal and justice settings, and research ethics with vulnerable subjects."
    examples: [offender interviews, prison ethnography, desistance narratives, sensitive-research ethics]
    status: live
  - id: victimology
    name: Victimology
    kind: craft
    scope: "Research on victims of crime: victimisation risk and impact, repeat victimisation and victims' experience of the justice process."
    examples: [victimisation risk, repeat victimisation, victim impact research, justice-process experience]
    status: live
  - id: penology-research
    name: Penology and Corrections Research
    kind: craft
    scope: "Scholarship on punishment and corrections: sentencing, imprisonment effects, rehabilitation evidence and recidivism research."
    examples: [sentencing research, imprisonment effects, what-works evidence, recidivism studies]
    status: live
