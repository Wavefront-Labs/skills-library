category: humanities
field: cultural-and-area-studies
products:
  - id: area-studies-research
    name: Area Studies Research
    kind: craft
    scope: "Interdisciplinary scholarship on a region: combining its history, languages, politics and culture into regional expertise and publication."
    examples: [regional literature synthesis, in-country sources, interdisciplinary method, area expertise writing]
    status: live
  - id: folklore-research
    name: Folklore Research
    kind: craft
    scope: "Collecting and studying folklore: tale types and motifs, legend and custom documentation, and folklore archive work."
    examples: [tale-type indexing, motif analysis, custom documentation, folklore archives]
    status: live
  - id: ethnic-and-indigenous-studies
    name: Ethnic and Indigenous Studies
    kind: craft
    scope: "Scholarship on ethnic and indigenous cultures and histories: community-engaged research, decolonising methods and cultural-knowledge protocols."
    examples: [community-engaged research, indigenous research protocols, ethnic-studies scholarship, cultural revitalisation studies]
    status: live
  - id: diaspora-and-migration-studies
    name: Diaspora and Migration Studies
    kind: craft
    scope: "Studying dispersed and migrating populations: diaspora identity, transnational ties and migration histories as humanities scholarship."
    examples: [diaspora identity studies, migration histories, transnationalism, memory of displacement]
    status: live
  - id: popular-culture-studies
    name: Popular Culture Studies
    kind: craft
    scope: "Scholarly analysis of popular and media culture: film, music, games, fandom and everyday cultural practice as objects of study."
    examples: [media culture analysis, fandom studies, subculture studies, cultural-studies method]
    status: live
