category: humanities
field: archaeology
products:
  - id: field-survey
    name: Field Survey and Prospection
    kind: craft
    scope: "Finding and mapping sites before excavation: fieldwalking, landscape survey, geophysics, aerial and remote-sensing prospection."
    examples: [fieldwalking transects, magnetometry, LiDAR interpretation, site mapping]
    status: live
  - id: stratigraphic-excavation
    name: Stratigraphic Excavation
    kind: craft
    scope: "Digging a site by its layers: single-context recording, section drawing, sampling strategy and maintaining the stratigraphic record."
    examples: [single-context recording, Harris matrix, section drawing, trowel technique]
    status: live
  - id: site-recording-and-reporting
    name: Site Recording and Reporting
    kind: craft
    scope: "Documenting and publishing fieldwork: context sheets, site photography and planning, archives and the excavation report."
    examples: [context sheets, site planning, photographic record, grey-literature reports]
    status: live
  - id: artefact-analysis
    name: Artefact Analysis
    kind: craft
    scope: "Identifying, classifying and interpreting finds: typology, ceramics, lithics, metalwork and use-wear analysis."
    examples: [ceramic typology, lithic analysis, seriation, use-wear study]
    status: live
  - id: bioarchaeology
    name: Bioarchaeology
    kind: craft
    scope: "Studying human remains from archaeological contexts: osteology, age and sex estimation, palaeopathology and burial analysis."
    examples: [skeletal inventory, age-at-death estimation, palaeopathology, burial taphonomy]
    status: live
  - id: environmental-archaeology
    name: Environmental Archaeology
    kind: craft
    scope: "Reconstructing past environments and diets from biological remains: zooarchaeology, archaeobotany, soils and sediments."
    examples: [faunal analysis, seed and pollen identification, flotation sampling, soil micromorphology]
    status: live
  - id: archaeological-dating
    name: Archaeological Dating
    kind: craft
    scope: "Placing sites and finds in time: choosing and interpreting radiocarbon, dendrochronological, luminescence and relative dating methods."
    examples: [radiocarbon calibration, dendrochronology, OSL sampling, seriation dating]
    status: live
  - id: underwater-archaeology
    name: Underwater and Maritime Archaeology
    kind: craft
    scope: "Investigating submerged sites and shipwrecks: underwater survey and excavation technique, recording and conservation-aware recovery."
    examples: [wreck survey, underwater recording, airlift excavation, waterlogged-finds handling]
    status: live
  - id: gis-for-archaeology
    name: GIS for Archaeology
    kind: application
    scope: "Geographic information systems applied to archaeology (QGIS/ArcGIS class): site databases, spatial analysis, viewsheds and predictive modelling."
    examples: [site gazetteers, viewshed analysis, predictive modelling, survey data integration]
    status: live
