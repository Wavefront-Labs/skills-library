category: humanities
field: history
products:
  - id: archival-research
    name: Archival Research
    kind: craft
    scope: "Locating, accessing and working primary sources in archives: finding aids, reading-room practice, citation and systematic note-taking."
    examples: [finding-aid navigation, reading-room workflow, archival citation, research logs]
    status: live
  - id: primary-source-criticism
    name: Primary Source Criticism
    kind: craft
    scope: "Evaluating sources for authenticity, authorship, bias and reliability, and weighing conflicting evidence into a defensible account."
    examples: [external and internal criticism, bias assessment, corroboration, dating a document]
    status: live
  - id: palaeography-and-diplomatics
    name: Palaeography and Diplomatics
    kind: craft
    scope: "Reading historical handwriting and analysing the form of old documents: scripts, abbreviations, seals, dating conventions and transcription standards."
    examples: [secretary hand, Latin abbreviations, transcription conventions, charter analysis]
    status: live
  - id: historiography
    name: Historiography
    kind: craft
    scope: "The study of how history is written: schools of interpretation, debates in the literature and positioning new work against them."
    examples: [literature review, interpretive schools, revisionism debates, methodological framing]
    status: live
  - id: historical-writing
    name: Historical Writing
    kind: craft
    scope: "Writing the account itself: structuring narrative and argument from evidence, scholarly apparatus and publication-ready prose."
    examples: [narrative structure, argument from evidence, footnoting, monograph and article writing]
    status: live
  - id: quantitative-and-digital-history
    name: Quantitative and Digital History
    kind: craft
    scope: "Historical research with data and computation: building datasets from records, cliometrics, text mining and mapping historical sources."
    examples: [record linkage, cliometrics, text mining corpora, historical mapping]
    status: live
  - id: local-history-research
    name: Local History Research
    kind: craft
    scope: "Researching the history of a place or community from parish, land, court and municipal records, buildings and local memory."
    examples: [parish registers, land and deed records, house histories, community history projects]
    status: live
