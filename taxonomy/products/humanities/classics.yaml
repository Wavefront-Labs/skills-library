category: humanities
field: classics
products:
  - id: classical-philology
    name: Classical Philology
    kind: craft
    scope: "Scholarly work on ancient Greek and Latin texts: close grammatical reading, textual criticism, commentary and scholarly translation."
    examples: [textual criticism, commentary writing, scholarly translation, metrical analysis]
    status: live
  - id: epigraphy
    name: Epigraphy
    kind: craft
    scope: "Reading and publishing ancient inscriptions: squeezes and photographs, restoration conventions, dating and corpus work."
    examples: [Leiden conventions, inscription restoration, squeeze reading, corpus citation]
    status: live
  - id: papyrology
    name: Papyrology
    kind: craft
    scope: "Editing texts preserved on papyrus and related media: decipherment of documentary and literary hands, conservation-aware handling and edition."
    examples: [documentary hands, lacuna restoration, papyrus edition, dating by hand]
    status: live
  - id: numismatics
    name: Numismatics
    kind: craft
    scope: "Studying ancient coinage as evidence: identification, die studies, hoard analysis and what coins show about economy and ideology."
    examples: [coin identification, die studies, hoard analysis, iconographic reading]
    status: live
  - id: classical-reception-studies
    name: Classical Reception Studies
    kind: craft
    scope: "Studying how later cultures reuse antiquity: reception of classical texts, myth and imagery from the Renaissance to modern media."
    examples: [reception of myth, translation history, antiquity in modern media, tradition studies]
    status: live
