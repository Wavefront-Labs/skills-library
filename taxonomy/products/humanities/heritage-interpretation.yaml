category: humanities
field: heritage-interpretation
products:
  - id: interpretive-planning
    name: Interpretive Planning
    kind: craft
    scope: "Deciding what a site says and how: themes, audiences, media selection and site-wide interpretation plans."
    examples: [theme development, audience analysis, media selection, interpretation plans]
    status: live
  - id: heritage-tour-guiding
    name: Heritage Tour Guiding
    kind: craft
    scope: "Leading visitors through sites and historic buildings: route and narrative design, accurate storytelling, group handling and answering on your feet."
    examples: [tour narrative, route design, group management, handling questions]
    status: live
  - id: interpretive-writing
    name: Interpretive Writing and Signage
    kind: craft
    scope: "Writing interpretation visitors actually read: panels, labels, trail leaflets and guidebooks that are accurate, brief and engaging."
    examples: [panel text, trail leaflets, readability, accuracy review]
    status: live
  - id: living-history
    name: Living History and Demonstration
    kind: craft
    scope: "Interpreting the past in person: costumed first- and third-person interpretation, historical demonstration and authenticity standards."
    examples: [first-person interpretation, costumed demonstration, authenticity standards, visitor interaction in role]
    status: live
  - id: digital-and-audio-interpretation
    name: Digital and Audio Interpretation
    kind: craft
    scope: "Interpretation through media: audio guides, mobile apps, AR reconstructions and virtual tours of heritage sites."
    examples: [audio-guide scripting, heritage apps, AR reconstruction, virtual tours]
    status: live
