category: humanities
field: genealogy-and-family-history
products:
  - id: records-research
    name: Genealogical Records Research
    kind: craft
    scope: "Tracing lineage through documents: vital, census, church, immigration, military and probate records, evidence evaluation to the Genealogical Proof Standard."
    examples: [vital records, census research, immigration records, Genealogical Proof Standard]
    status: live
  - id: genetic-genealogy
    name: Genetic Genealogy
    kind: craft
    scope: "Using DNA results to establish relationships: match analysis, shared-cM interpretation, triangulation and combining DNA with documentary evidence."
    examples: [shared-cM analysis, match clustering, triangulation, endogamy handling]
    status: live
  - id: adoption-and-reunification-research
    name: Adoption and Reunification Research
    kind: craft
    scope: "Tracing an adoptee's birth family or reconnecting separated relatives: sealed and non-identifying records, DNA search strategy, sensitive contact."
    examples: [non-identifying information, DNA search angles, unknown-parentage method, first contact]
    status: live
  - id: heraldry-and-surname-studies
    name: Heraldry and Surname Studies
    kind: craft
    scope: "Researching coats of arms, surname origins and distribution, and one-name or one-place studies."
    examples: [blazon reading, surname distribution, one-name studies, armorial records]
    status: live
  - id: family-history-writing
    name: Family History Writing
    kind: craft
    scope: "Turning research into a readable, sourced family history: narrative structure, charts, citation and privacy of living people."
    examples: [narrative family histories, pedigree charts, source citation, living-person privacy]
    status: live
  - id: genealogy-research-platforms
    name: Genealogy Research Platforms
    kind: application
    scope: "Record and DNA platforms as a class (Ancestry, FamilySearch, MyHeritage, findmypast, 23andMe): effective search, hints hygiene and cross-platform strategy."
    examples: [search strategy, hint evaluation, DNA transfer between platforms, record-image reading]
    status: live
  - id: family-tree-software
    name: Family Tree Software
    kind: application
    scope: "Desktop and open genealogy data tools as a class (Gramps, RootsMagic, Family Tree Maker): tree management, sourcing and GEDCOM interchange."
    examples: [tree data entry, source templates, GEDCOM import/export, report generation]
    status: live
