category: humanities
field: art-history
products:
  - id: formal-and-stylistic-analysis
    name: Formal and Stylistic Analysis
    kind: craft
    scope: "Analysing how a work is made and what its form does: composition, technique, style and placing a work within a period or hand."
    examples: [compositional analysis, stylistic comparison, period placement, medium and technique reading]
    status: live
  - id: iconography
    name: Iconography and Iconology
    kind: craft
    scope: "Identifying and interpreting subject matter and symbolism: attributes, programmes, textual sources and cultural meaning of images."
    examples: [attribute identification, symbolic programmes, textual sources, Panofskian method]
    status: live
  - id: architectural-history
    name: Architectural History
    kind: craft
    scope: "Studying buildings as historical evidence: dating fabric, reading plans and styles, and researching a building's construction and alteration history."
    examples: [fabric dating, plan analysis, stylistic dating, building-history research]
    status: live
  - id: catalogue-raisonne-research
    name: Catalogue Raisonné Research
    kind: craft
    scope: "Compiling the complete documented record of an artist's works: locating works, establishing chronology, exhibition and literature histories."
    examples: [work documentation, chronology building, exhibition histories, literature citations]
    status: live
  - id: visual-culture-studies
    name: Visual Culture Studies
    kind: craft
    scope: "Scholarship on images beyond fine art: photography, print culture, design and everyday visual material in their social contexts."
    examples: [photography history, print culture, design history, image-and-society analysis]
    status: live
