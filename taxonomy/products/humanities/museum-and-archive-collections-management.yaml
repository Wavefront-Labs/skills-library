category: humanities
field: museum-and-archive-collections-management
products:
  - id: acquisitions-and-accessioning
    name: Acquisitions and Accessioning
    kind: craft
    scope: "Bringing objects into a collection and out again: collecting policy, due diligence, accessioning, deaccessioning and disposal ethics."
    examples: [collecting policy, accession records, deaccessioning process, acquisition due diligence]
    status: live
  - id: cataloguing-and-documentation
    name: Cataloguing and Documentation
    kind: craft
    scope: "Describing museum objects to standard: object records, numbering and marking, terminology control and documentation standards such as Spectrum."
    examples: [object records, Spectrum procedures, controlled vocabularies, object numbering]
    status: live
  - id: archival-processing
    name: Archival Processing and Description
    kind: craft
    scope: "Arranging and describing archival collections: appraisal, original order, finding aids and descriptive standards (ISAD(G), DACS, EAD)."
    examples: [appraisal, arrangement, finding aids, ISAD(G)/EAD description]
    status: live
  - id: registration-and-loans
    name: Registration and Loans
    kind: craft
    scope: "The registrar's work: inward and outward loans, insurance and indemnity, couriering, movement control and location tracking."
    examples: [loan agreements, insurance and indemnity, courier practice, location control]
    status: live
  - id: exhibition-curation
    name: Exhibition Curation
    kind: craft
    scope: "Making exhibitions from collections: concept and object selection, interpretation strategy, label writing and working with designers to install."
    examples: [exhibition concept, object selection, label writing, installation oversight]
    status: live
  - id: digitisation-and-digital-preservation
    name: Digitisation and Digital Preservation
    kind: craft
    scope: "Creating and keeping digital surrogates and born-digital records: imaging standards, metadata, OAIS-style preservation and online access."
    examples: [imaging standards, preservation metadata, born-digital ingest, online collections access]
    status: live
  - id: collection-management-systems
    name: Collection Management Systems
    kind: application
    scope: "Collections software as a class (TMS, Axiell, PastPerfect, ArchivesSpace, AtoM): data entry standards, migrations, reporting and public-portal publishing."
    examples: [CMS data entry, system migration, reporting, public portal publishing]
    status: live
