# Scholarship and publication only; ethics as a philosophical discipline is religion-philosophy
# per categories.yaml excludes.
category: humanities
field: bioethics-and-applied-ethics-scholarship
products:
  - id: ethics-case-analysis
    name: Ethics Case Analysis
    kind: craft
    scope: "Analysing ethical cases as scholarship: structured case method, principlist and casuist frameworks, and writing case commentaries."
    examples: [four-principles analysis, casuistry, case commentaries, dilemma framing]
    status: live
  - id: research-ethics-scholarship
    name: Research Ethics Scholarship
    kind: craft
    scope: "Scholarship on the ethics of research itself: consent, risk-benefit, vulnerable populations and the history and critique of oversight systems."
    examples: [informed-consent scholarship, risk-benefit analysis, IRB critique, research-misconduct studies]
    status: live
  - id: clinical-bioethics-research
    name: Clinical Bioethics Research
    kind: craft
    scope: "Scholarship on ethical questions in clinical care: end-of-life decisions, resource allocation, reproductive ethics and clinical-ethics literature."
    examples: [end-of-life scholarship, allocation ethics, reproductive-ethics publication, clinical-ethics literature review]
    status: live
  - id: empirical-bioethics
    name: Empirical Bioethics
    kind: craft
    scope: "Studying ethical questions with empirical methods: interviews, surveys and qualitative analysis of stakeholder views, integrated with normative argument."
    examples: [stakeholder interviews, attitude surveys, qualitative coding, empirical-normative integration]
    status: live
  - id: emerging-technology-ethics
    name: Emerging-Technology Ethics Scholarship
    kind: craft
    scope: "Published scholarship on the ethics of new technologies: AI, genome editing, neurotechnology and data ethics as research output."
    examples: [AI-ethics publication, genome-editing ethics, neuroethics, data-ethics scholarship]
    status: live
