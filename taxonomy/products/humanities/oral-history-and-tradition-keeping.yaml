category: humanities
field: oral-history-and-tradition-keeping
products:
  - id: oral-history-interviewing
    name: Oral-History Interviewing
    kind: craft
    scope: "Recording life stories and testimony: question design, rapport and listening technique, recording practice and interviewing about difficult memories."
    examples: [question design, active listening, recording setup, trauma-aware interviewing]
    status: live
  - id: consent-and-ethics
    name: Consent, Release and Ethics
    kind: craft
    scope: "The legal and ethical frame of oral history: informed consent, release agreements, restrictions and embargoes, and narrator rights."
    examples: [release forms, informed consent, embargoes and restrictions, shared authority]
    status: live
  - id: transcription-and-archiving
    name: Transcription, Indexing and Archiving
    kind: craft
    scope: "Making interviews usable and durable: transcription standards, audit-checking, indexing and summarising, and depositing in archives."
    examples: [transcription conventions, audit checking, interview indexing, archival deposit]
    status: live
  - id: community-memory-projects
    name: Community Memory Projects
    kind: craft
    scope: "Running oral-history projects with and for a community: scoping, recruiting narrators, training interviewers and returning results to the community."
    examples: [project scoping, narrator recruitment, volunteer training, community outputs]
    status: live
  - id: tradition-keeping
    name: Tradition Keeping and Transmission
    kind: craft
    scope: "Keeping an accurate spoken record across generations: griot and elder practice, memorisation and recitation technique, lineage recitation and protocols for passing knowledge on."
    examples: [memorisation technique, lineage recitation, apprentice transmission, custodianship protocols]
    status: live
