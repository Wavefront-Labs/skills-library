category: humanities
field: musicology
products:
  - id: historical-musicology
    name: Historical Musicology
    kind: craft
    scope: "Researching music's past: composers, institutions, performance practice and repertoire history from archival and printed sources."
    examples: [composer studies, performance-practice research, repertoire history, music archives]
    status: live
  - id: ethnomusicology
    name: Ethnomusicology
    kind: craft
    scope: "Studying music in culture through fieldwork: participant observation, recording in the field, transcription of oral traditions and cultural analysis."
    examples: [field recording, participant observation, oral-tradition transcription, music-culture analysis]
    status: live
  - id: music-analysis
    name: Music Analysis and Theory Scholarship
    kind: craft
    scope: "Analysing musical works as scholarship: harmonic, Schenkerian, formal and post-tonal analysis and theory publication."
    examples: [harmonic analysis, Schenkerian graphs, formal analysis, post-tonal methods]
    status: live
  - id: music-source-studies
    name: Music Source Studies and Editing
    kind: craft
    scope: "Working from musical sources: manuscript and early-print study, collation, critical editions and editorial method for music."
    examples: [manuscript study, collation of sources, critical editions, watermark and paper evidence]
    status: live
  - id: organology
    name: Organology
    kind: craft
    scope: "The study of musical instruments: classification, construction history, dating and documentation of instruments and collections."
    examples: [instrument classification, construction analysis, instrument dating, collection documentation]
    status: live
  - id: music-encoding-and-notation-tools
    name: Music Encoding and Notation Tools
    kind: application
    scope: "Notation and encoding software as a class (MuseScore, Sibelius, Finale, MEI/Verovio, music21) used for scholarly editions and computational musicology."
    examples: [edition engraving, MEI encoding, music21 corpus analysis, OMR cleanup]
    status: live
