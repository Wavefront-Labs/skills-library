category: humanities
field: religious-studies
products:
  - id: comparative-religion
    name: Comparative Religion
    kind: craft
    scope: "Comparing religious traditions as scholarship: concepts, practices and institutions across traditions, with method that avoids false equivalence."
    examples: [cross-tradition comparison, category critique, typologies of religion, comparative method]
    status: live
  - id: scriptural-scholarship
    name: Scriptural Scholarship and Exegesis
    kind: craft
    scope: "Academic study of sacred texts: historical-critical method, form and redaction criticism, commentary and interpretation history."
    examples: [historical-critical method, redaction criticism, scholarly commentary, reception of scripture]
    status: live
  - id: sacred-language-philology
    name: Sacred-Language Philology
    kind: craft
    scope: "Working with the manuscript and language traditions of sacred texts: textual criticism, manuscript families and scholarly translation."
    examples: [manuscript families, textual variants, scholarly translation, critical editions of scripture]
    status: live
  - id: history-of-religion
    name: History of Religion
    kind: craft
    scope: "Researching how religions arose, spread and changed: institutional, intellectual and social histories of religious traditions."
    examples: [religious movements history, institutional history, conversion and spread, religion-and-society history]
    status: live
  - id: lived-religion-research
    name: Lived Religion Research
    kind: craft
    scope: "Studying religion as practised: fieldwork on ritual, pilgrimage, material religion and everyday religious life, as observation rather than participation in faith."
    examples: [ritual observation, pilgrimage studies, material religion, congregational studies]
    status: live
