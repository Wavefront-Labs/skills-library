category: humanities
field: literary-studies-and-criticism
products:
  - id: close-reading
    name: Close Reading and Textual Analysis
    kind: craft
    scope: "Detailed analysis of a text's language, form and structure: imagery, prosody, narrative technique and building interpretation from the words on the page."
    examples: [explication, prosody and metre, narrative technique, imagery analysis]
    status: live
  - id: literary-theory-and-criticism
    name: Literary Theory and Criticism
    kind: craft
    scope: "Applying and arguing with critical frameworks: formalism to poststructuralism, feminist, postcolonial and ecocritical readings, and writing scholarly criticism."
    examples: [theoretical frameworks, critical essays, scholarly argument, theory-informed reading]
    status: live
  - id: comparative-literature
    name: Comparative Literature
    kind: craft
    scope: "Studying literature across languages, periods and traditions: influence and reception, translation studies and cross-cultural comparison."
    examples: [cross-tradition comparison, influence studies, translation analysis, world literature]
    status: live
  - id: scholarly-editing
    name: Scholarly Editing and Textual Scholarship
    kind: craft
    scope: "Establishing and presenting reliable texts: manuscript and edition collation, variant analysis, critical apparatus and editorial principles."
    examples: [collation, variant analysis, critical apparatus, copy-text decisions]
    status: live
  - id: computational-literary-analysis
    name: Computational Literary Analysis
    kind: craft
    scope: "Studying literature at scale with computation: stylometry, distant reading, corpus building and authorship attribution."
    examples: [stylometry, distant reading, corpus construction, authorship attribution]
    status: live
