category: transportation-logistics
field: warehousing
products:
  - id: warehouse-management-systems
    name: Warehouse Management Systems
    kind: application
    scope: "Operating WMS software: wave and task management, inventory transactions, RF workflows and system-directed work."
    examples: [wave planning, RF-directed tasks, inventory transactions, exception queues]
    status: live
  - id: forklifts-industrial-trucks
    name: Forklifts & Industrial Trucks
    kind: application
    scope: "Operating forklifts, reach trucks, order pickers and pallet jacks: load handling, racking work and pedestrian safety."
    examples: [load handling, high-rack work, ramp and trailer entry, pedestrian-zone discipline]
    status: live
  - id: automated-handling-systems
    name: Automated Storage & Handling Systems
    kind: application
    scope: "Operating AS/RS, conveyor and sortation systems and warehouse robots: running, monitoring and clearing automated flows."
    examples: [AS/RS operation, sorter monitoring, robot-fleet supervision, jam clearing and recovery]
    status: live
  - id: receiving-putaway
    name: Receiving & Putaway
    kind: craft
    scope: "Taking goods into the building: unloading, checking against documents, labelling and putaway logic."
    examples: [dock unloading, receipt verification, discrepancy handling, putaway strategies]
    status: live
  - id: order-picking-packing
    name: Order Picking & Packing
    kind: craft
    scope: "Fulfilling orders: pick methods and paths, accuracy habits, carton selection and pack-out quality."
    examples: [batch and zone picking, pick-path efficiency, carton selection, pack quality checks]
    status: live
  - id: shipping-dispatch
    name: Shipping & Dispatch
    kind: craft
    scope: "Getting orders out the door: staging, trailer loading, manifesting, and carrier cut-off management."
    examples: [outbound staging, trailer load building, manifesting, cut-off scheduling]
    status: live
  - id: cross-docking
    name: Cross-Docking
    kind: craft
    scope: "Flowing goods dock to dock without storage: inbound-outbound matching, staging-lane control and flow timing."
    examples: [inbound-outbound matching, staging-lane management, flow-through timing, door assignment]
    status: live
  - id: inventory-control
    name: Inventory Control & Cycle Counting
    kind: craft
    scope: "Keeping stock records true: cycle-count programs, discrepancy investigation, stock adjustments and shrinkage control."
    examples: [cycle-count design, discrepancy root-causing, adjustment discipline, shrinkage analysis]
    status: live
  - id: slotting-layout
    name: Slotting & Warehouse Layout
    kind: craft
    scope: "Placing products and designing flows: velocity-based slotting, pick-face design and layout for throughput and safety."
    examples: [velocity slotting, pick-face sizing, aisle and flow layout, reslotting programs]
    status: live
