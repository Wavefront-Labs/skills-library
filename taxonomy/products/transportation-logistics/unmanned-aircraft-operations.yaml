category: transportation-logistics
field: unmanned-aircraft-operations
products:
  - id: multirotor-drones
    name: Multirotor Drones
    kind: application
    scope: "Piloting multirotor UAS: manual and GPS-assisted flight, payload handling and precision positioning."
    examples: [manual-mode flying, precision hovering, payload release, battery and failsafe management]
    status: live
  - id: fixed-wing-vtol-drones
    name: Fixed-Wing & VTOL Drones
    kind: application
    scope: "Operating fixed-wing and hybrid-VTOL UAS for range and endurance missions: launch, transition, cruise and recovery."
    examples: [launch and recovery, VTOL transition management, long-range cruise monitoring, loss-of-link handling]
    status: live
  - id: fleet-management-utm-software
    name: Drone Fleet & UTM Software
    kind: application
    scope: "Operating drone fleet-management and UTM platforms: mission dispatch, airspace authorisation and multi-aircraft monitoring."
    examples: [fleet dispatch, LAANC-style authorisations, multi-aircraft monitoring, flight-log management]
    status: live
  - id: bvlos-operations
    name: BVLOS Operations
    kind: craft
    scope: "Flying beyond visual line of sight: detect-and-avoid, C2 link management, contingency planning and regulatory casework."
    examples: [detect-and-avoid procedures, C2 link budgets, contingency and lost-link planning, operational approvals]
    status: live
  - id: drone-delivery
    name: Drone Delivery Operations
    kind: craft
    scope: "Delivering goods by drone: route design over people and property, drop and winch delivery, and network scheduling."
    examples: [delivery route design, winch and drop procedures, ground-risk mitigation, delivery-network scheduling]
    status: live
  - id: inspection-survey-missions
    name: Inspection & Survey Missions
    kind: craft
    scope: "Flying infrastructure inspection and mapping missions: grid and orbit patterns, sensor-driven flight and data capture discipline."
    examples: [mapping grid planning, structure orbits, GSD and overlap settings, capture QA in the field]
    status: live
  - id: mission-planning-airspace
    name: UAS Mission Planning & Airspace Compliance
    kind: craft
    scope: "Planning drone missions: site assessment, airspace rules, weather limits, risk assessment and crew roles."
    examples: [site risk assessment, airspace checks, SORA-style risk analysis, visual-observer briefing]
    status: live
