category: transportation-logistics
field: air-traffic-control
products:
  - id: surveillance-systems
    name: ATC Surveillance & Console Systems
    kind: application
    scope: "Operating radar, ADS-B and electronic flight-strip consoles: display management, data blocks and system degradation handling."
    examples: [radar display management, electronic strip handling, data-block housekeeping, surveillance failure fallback]
    status: live
  - id: aerodrome-tower-control
    name: Aerodrome Tower Control
    kind: craft
    scope: "Controlling the runway and visual circuit: takeoff and landing clearances, sequencing, and runway-incursion prevention."
    examples: [runway sequencing, circuit integration, go-around handling, incursion prevention]
    status: live
  - id: ground-control
    name: Ground & Clearance Delivery
    kind: craft
    scope: "Controlling aircraft and vehicles on the manoeuvring area: taxi routing, pushbacks, and departure clearance delivery."
    examples: [taxi routing, pushback coordination, clearance delivery, low-visibility ground operations]
    status: live
  - id: approach-control
    name: Approach & Terminal Control
    kind: craft
    scope: "Sequencing arrivals and departures in terminal airspace: vectoring, speed control and spacing to final approach."
    examples: [vectoring to final, speed control, arrival sequencing, missed-approach handling]
    status: live
  - id: en-route-control
    name: En-Route Control
    kind: craft
    scope: "Separating aircraft in en-route airspace: conflict detection, level and route management across sector boundaries."
    examples: [conflict detection, level allocation, sector handoffs, weather-deviation management]
    status: live
  - id: oceanic-procedural-control
    name: Oceanic & Procedural Control
    kind: craft
    scope: "Controlling without surveillance: procedural separation, position reports, and oceanic track management."
    examples: [procedural separation standards, position-report processing, oceanic clearances, datalink coordination]
    status: live
  - id: traffic-flow-management
    name: Traffic Flow Management
    kind: craft
    scope: "Balancing demand against capacity across a network: ground delay programs, flow rates and reroute strategies."
    examples: [ground delay programs, miles-in-trail restrictions, reroute planning, capacity forecasting]
    status: live
