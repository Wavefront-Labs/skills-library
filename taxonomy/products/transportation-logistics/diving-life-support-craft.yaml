category: transportation-logistics
field: diving-life-support-craft
products:
  - id: surface-supplied-systems
    name: Surface-Supplied Diving Systems
    kind: application
    scope: "Operating surface-supplied diving spreads: panels, umbilicals, helmets and diver communications."
    examples: [gas panel operation, umbilical management, helmet and bailout checks, diver comms]
    status: live
  - id: bells-chambers
    name: Dive Bells & Hyperbaric Chambers
    kind: application
    scope: "Operating diving bells and deck decompression chambers: pressurisation, environmental control and lock operations."
    examples: [chamber pressurisation runs, bell launch and recovery, medical-lock operation, environmental control]
    status: live
  - id: saturation-systems
    name: Saturation Diving Systems
    kind: application
    scope: "Operating saturation living and excursion systems: life-support watches, sat control and long-duration habitat management."
    examples: [sat control watchkeeping, habitat environmental management, excursion planning, hyperbaric evacuation readiness]
    status: live
  - id: commercial-air-diving
    name: Commercial Air Diving
    kind: craft
    scope: "Working dives on air and nitrox: dive planning, underwater work technique and in-water problem management."
    examples: [dive planning, underwater tool work, zero-visibility technique, emergency ascent protocols]
    status: live
  - id: saturation-diving
    name: Saturation Diving
    kind: craft
    scope: "The sat diver's craft: living under pressure, bell runs, lockout work and deep-excursion discipline."
    examples: [bell-run routines, lockout work procedure, storage-depth living, excursion limits]
    status: live
  - id: gas-blending-management
    name: Gas Blending & Management
    kind: craft
    scope: "Mixing and managing breathing gases: heliox and nitrox blending, gas analysis, quads and consumption planning."
    examples: [heliox blending, oxygen analysis, gas quad logistics, consumption planning]
    status: live
  - id: decompression-management
    name: Decompression Management
    kind: craft
    scope: "Planning and controlling decompression: table and schedule selection, surface decompression, and omitted-decompression response."
    examples: [table selection, surface-decompression runs, altitude and repetitive factors, DCI response]
    status: live
  - id: dive-supervision
    name: Dive Supervision
    kind: craft
    scope: "Running the dive from topside: operations planning, hazard control, standby management and emergency command."
    examples: [dive operations planning, toolbox briefings, standby-diver readiness, incident command]
    status: live
