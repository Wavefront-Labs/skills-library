category: transportation-logistics
field: logistics-supply-chain
products:
  - id: transportation-management-systems
    name: Transportation Management Systems
    kind: application
    scope: "Operating TMS platforms: shipment planning and tendering, carrier management, tracking and freight audit."
    examples: [shipment tendering, rate management, track-and-trace workflows, freight audit]
    status: live
  - id: supply-chain-planning
    name: Supply Chain Planning
    kind: craft
    scope: "Planning supply to meet demand: demand forecasting, S&OP, capacity balancing and inventory targets across the network."
    examples: [demand forecasting, S&OP cycles, capacity balancing, safety-stock setting]
    status: live
  - id: freight-forwarding
    name: Freight Forwarding
    kind: craft
    scope: "Arranging international shipments end to end: mode selection, booking, documentation and shipment troubleshooting."
    examples: [mode and routing selection, carrier booking, shipping documentation, exception handling]
    status: live
  - id: freight-procurement
    name: Freight Procurement & Carrier Management
    kind: craft
    scope: "Buying transport capacity: tendering lanes, negotiating rates, selecting carriers and 3PLs, and managing performance."
    examples: [lane tendering, rate negotiation, carrier scorecards, 3PL selection]
    status: live
  - id: fleet-routing-scheduling
    name: Fleet Routing & Scheduling
    kind: craft
    scope: "Routing and scheduling vehicle fleets: stop sequencing, time windows, driver assignment and dynamic re-routing."
    examples: [route optimisation, time-window scheduling, driver assignment, dynamic re-routing]
    status: live
  - id: inventory-distribution-planning
    name: Inventory & Distribution Planning
    kind: craft
    scope: "Positioning stock across a distribution network: replenishment, allocation, deployment and service-level trade-offs."
    examples: [replenishment planning, stock allocation, DC deployment, service-level trade-offs]
    status: live
  - id: network-design
    name: Logistics Network Design
    kind: craft
    scope: "Designing the physical network: facility location, flow-path analysis, mode mix and cost-to-serve modelling."
    examples: [facility location analysis, flow-path modelling, mode-mix strategy, cost-to-serve analysis]
    status: live
  - id: load-planning-consolidation
    name: Load Planning & Consolidation
    kind: craft
    scope: "Filling vehicles and containers well: cube and weight optimisation, consolidation, pallet patterns and axle-weight compliance."
    examples: [container cube optimisation, shipment consolidation, pallet-pattern design, axle-weight compliance]
    status: live
  - id: intermodal-container-operations
    name: Intermodal & Container Operations
    kind: craft
    scope: "Moving freight across modes in containers: intermodal routing, container fleet control, drayage and terminal interfaces."
    examples: [intermodal routing, container repositioning, drayage coordination, terminal cut-off management]
    status: live
  - id: cold-chain-logistics
    name: Cold Chain Logistics
    kind: craft
    scope: "Moving temperature-controlled goods: reefer setup, temperature monitoring, cold-store interfaces and excursion response."
    examples: [reefer setpoint management, temperature monitoring, cold-store handoffs, excursion response]
    status: live
  - id: dangerous-goods-transport
    name: Dangerous Goods Transport
    kind: craft
    scope: "Shipping hazardous materials: classification, packaging and marking, documentation, segregation and mode-specific rules."
    examples: [DG classification, packaging and marking, segregation rules, DG documentation]
    status: live
  - id: reverse-logistics
    name: Reverse Logistics
    kind: craft
    scope: "Running the return flow: returns processing, disposition decisions, refurbishment routing and recall logistics."
    examples: [returns processing, disposition rules, refurbishment routing, product recalls]
    status: live
