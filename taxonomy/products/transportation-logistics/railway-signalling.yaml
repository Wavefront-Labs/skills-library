category: transportation-logistics
field: railway-signalling
products:
  - id: mechanical-signal-boxes
    name: Mechanical Signal Boxes
    kind: application
    scope: "Operating lever-frame signal boxes: mechanical interlocking, block instruments and token working."
    examples: [lever-frame operation, block bell codes, token exchange, box-to-box regulation]
    status: live
  - id: panel-relay-interlockings
    name: Panel & Relay Interlockings
    kind: application
    scope: "Operating entrance-exit panels and relay interlockings: route setting, track-circuit indications and panel failures."
    examples: [NX route setting, track-circuit reading, route release, panel failure response]
    status: live
  - id: computer-based-control-centres
    name: Computer-Based Control Centres
    kind: application
    scope: "Operating computer-based interlockings and traffic-management workstations in rail operating centres, including ETCS supervision."
    examples: [workstation route setting, ARS supervision, ETCS/CBTC oversight, alarm handling]
    status: live
  - id: signalling-regulation
    name: Train Regulation
    kind: craft
    scope: "Regulating train order and priority through a controlled area: pathing decisions, junction margins and perturbation management."
    examples: [junction margin judgement, priority decisions, pathing out-of-course trains, perturbation recovery]
    status: live
  - id: level-crossing-operation
    name: Level-Crossing Operation
    kind: craft
    scope: "Controlling and monitoring level crossings: barrier operation, CCTV monitoring, obstruction response and local release."
    examples: [barrier sequencing, CCTV crossing checks, obstruction response, failure working]
    status: live
  - id: possession-protection
    name: Possessions & Protection
    kind: craft
    scope: "Protecting engineering work and staff on the line: possession management, line blockages and protection arrangements."
    examples: [possession planning, line blockages, protecting staff on track, handback procedures]
    status: live
  - id: signalling-degraded-working
    name: Degraded Signalling Working
    kind: craft
    scope: "Keeping trains moving safely when signalling fails: talking trains past signals, temporary block working and failure protocols."
    examples: [authorising past signals at danger, temporary block working, points failure response, incident logging]
    status: live
