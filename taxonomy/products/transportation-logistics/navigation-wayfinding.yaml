category: transportation-logistics
field: navigation-wayfinding
products:
  - id: gnss-navigation-systems
    name: GNSS Navigation Systems
    kind: application
    scope: "Navigating with GPS and other satellite systems: receiver operation, waypoint and route work, accuracy limits and failure awareness."
    examples: [waypoint and route management, datum and coordinate formats, accuracy and multipath limits, GPS-denied fallback]
    status: live
  - id: celestial-navigation
    name: Celestial Navigation
    kind: craft
    scope: "Fixing position from the sky: sextant work, sight reduction, time management and star identification."
    examples: [sextant sights, sight reduction, noon latitude, star identification]
    status: live
  - id: dead-reckoning
    name: Dead Reckoning
    kind: craft
    scope: "Projecting position from course, speed and time: DR plots, set and drift, and estimated-position discipline."
    examples: [DR plotting, set and drift allowance, speed-time-distance work, estimated positions]
    status: live
  - id: pilotage-coastal-navigation
    name: Pilotage & Coastal Navigation
    kind: craft
    scope: "Navigating by visible reference near land: transits, bearings, buoyage, tides and chartwork in coastal waters."
    examples: [transit and clearing bearings, three-point fixes, buoyage systems, tidal-stream chartwork]
    status: live
  - id: map-compass-land-navigation
    name: Map & Compass Land Navigation
    kind: craft
    scope: "Navigating terrain with topographic map and compass: terrain association, bearings, pacing and route choice on foot."
    examples: [terrain association, bearing work, pace counting, catching features]
    status: live
  - id: radio-navigation
    name: Radio Navigation Aids
    kind: craft
    scope: "Navigating by ground-based radio aids: VOR, DME, NDB and ILS interpretation, and cross-aid position fixing."
    examples: [VOR tracking, NDB bearings, DME arcs, cross-aid fixing]
    status: live
  - id: traditional-pacific-wayfinding
    name: Traditional Pacific Wayfinding
    kind: craft
    scope: "Non-instrument ocean navigation in the Pacific tradition: star compass, swell reading, and landfinding signs."
    examples: [star compass courses, swell-pattern reading, bird and cloud landfinding, etak positioning]
    status: live
  - id: route-planning
    name: Route Planning
    kind: craft
    scope: "Choosing the path before moving: route selection against terrain, traffic, weather and constraints, for any mode of travel."
    examples: [route selection criteria, alternate planning, constraint mapping, timing and checkpoint design]
    status: live
