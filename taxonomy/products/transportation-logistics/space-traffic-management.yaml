category: transportation-logistics
field: space-traffic-management
products:
  - id: ssa-catalog-systems
    name: SSA Catalog & Screening Systems
    kind: application
    scope: "Operating space-situational-awareness catalogs and screening tools: ingest, correlation and conjunction screening runs."
    examples: [catalog maintenance, object correlation, screening-run configuration, ephemeris exchange]
    status: live
  - id: orbital-object-tracking
    name: Orbital Object Tracking
    kind: craft
    scope: "Tracking objects in orbit: sensor tasking, observation association, orbit determination quality and uncataloged-object handling."
    examples: [sensor tasking, track association, breakup-event tracking, uncorrelated-target resolution]
    status: live
  - id: conjunction-assessment
    name: Conjunction Assessment
    kind: craft
    scope: "Assessing close approaches: probability-of-collision analysis, covariance interpretation and risk thresholds."
    examples: [probability-of-collision calculation, covariance realism, miss-distance analysis, risk-threshold judgement]
    status: live
  - id: collision-avoidance-coordination
    name: Collision Avoidance & Operator Coordination
    kind: craft
    scope: "Acting on conjunctions: avoidance-maneuver trades, operator-to-operator coordination and post-maneuver screening."
    examples: [avoidance-maneuver design trades, operator coordination, maneuver timing decisions, post-maneuver re-screening]
    status: live
  - id: launch-reentry-screening
    name: Launch & Reentry Screening
    kind: craft
    scope: "Clearing launches and reentries through traffic: collision-avoidance windows, reentry prediction and debris-footprint awareness."
    examples: [launch COLA windows, reentry prediction, debris-footprint assessment, window coordination]
    status: live
