category: transportation-logistics
field: traffic-transport-signalling
products:
  - id: adaptive-signal-systems
    name: Traffic Signal Control Systems
    kind: application
    scope: "Operating urban traffic signal systems (SCATS, SCOOT and fixed-time): timing plans, coordination and detector management."
    examples: [timing-plan management, green-wave coordination, detector fault handling, adaptive-system tuning]
    status: live
  - id: traffic-management-centre-operations
    name: Traffic Management Centre Operations
    kind: craft
    scope: "Running a road-network control room: CCTV monitoring, congestion response, variable signage and traveller information."
    examples: [CCTV network monitoring, congestion response plans, variable message signing, traveller information]
    status: live
  - id: highway-incident-management
    name: Highway Incident Management
    kind: craft
    scope: "Clearing road incidents: scene protection, lane closures, responder coordination and traffic recovery."
    examples: [lane-closure tapers, responder coordination, quick-clearance practice, queue protection]
    status: live
  - id: work-zone-traffic-control
    name: Work Zone Traffic Control
    kind: craft
    scope: "Controlling traffic through roadworks: temporary traffic management plans, flagging and stop/slow operations."
    examples: [traffic-management plans, flagging operations, taper and buffer design, night-works control]
    status: live
  - id: port-vessel-traffic-services
    name: Port & Vessel Traffic Services
    kind: craft
    scope: "Coordinating vessel movements in ports and waterways: VTS watchkeeping, traffic organisation and berth scheduling."
    examples: [VTS watchkeeping, traffic-clearance decisions, channel-movement sequencing, berth coordination]
    status: live
  - id: event-traffic-management
    name: Event & Emergency Traffic Management
    kind: craft
    scope: "Planning and running traffic for planned events and evacuations: crowd egress routing, contraflow and detour design."
    examples: [event traffic plans, contraflow operations, evacuation routing, detour design]
    status: live
