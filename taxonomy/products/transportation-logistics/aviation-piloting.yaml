category: transportation-logistics
field: aviation-piloting
products:
  - id: transport-jets
    name: Transport Jets & Airliners
    kind: application
    scope: "Flying multi-crew jet transports: SOP-driven operation, automation management, high-altitude and high-speed flight."
    examples: [SOP flows and callouts, autoflight management, high-altitude aerodynamics, rejected takeoff decisions]
    status: live
  - id: general-aviation-airplanes
    name: General Aviation Airplanes
    kind: application
    scope: "Flying piston and turboprop light airplanes: stick-and-rudder skill, single-pilot operations and short-field work."
    examples: [stick-and-rudder technique, crosswind landings, short and soft field work, single-pilot workload]
    status: live
  - id: helicopters
    name: Helicopters
    kind: application
    scope: "Flying helicopters: hovering, confined-area and off-airport operations, autorotation and external loads."
    examples: [hover work, confined-area approaches, autorotation, sling-load operations]
    status: live
  - id: gliders
    name: Gliders & Sailplanes
    kind: application
    scope: "Flying unpowered sailplanes: launch methods, soaring energy management and outlanding decisions."
    examples: [aerotow and winch launches, thermal soaring, final-glide management, field outlandings]
    status: live
  - id: seaplanes
    name: Seaplanes & Floatplanes
    kind: application
    scope: "Flying float- and hull-equipped aircraft: water handling, glassy and rough water technique, and docking."
    examples: [glassy-water landings, step taxiing, water-surface reading, docking and beaching]
    status: live
  - id: flight-management-avionics
    name: Flight Management & Avionics Systems
    kind: application
    scope: "Operating FMS, glass-cockpit avionics and autoflight systems: programming, mode awareness and failure reversion."
    examples: [FMS route programming, autopilot mode management, glass-cockpit workflows, avionics failure reversion]
    status: live
  - id: instrument-flying
    name: Instrument Flying
    kind: craft
    scope: "Flying by reference to instruments: scans, procedures, approaches and operating in instrument weather."
    examples: [instrument scan, precision and non-precision approaches, holding, partial-panel flying]
    status: live
  - id: crew-resource-management
    name: Crew Resource Management
    kind: craft
    scope: "The multi-crew cockpit craft: communication, workload sharing, threat-and-error management and decision discipline."
    examples: [threat-and-error management, sterile cockpit discipline, cross-checking, assertive challenge]
    status: live
  - id: flight-planning-performance
    name: Flight Planning & Performance
    kind: craft
    scope: "Planning flights: weather analysis, fuel and alternates, weight and balance, and takeoff and landing performance."
    examples: [weather decision-making, fuel planning, weight and balance, runway performance calculations]
    status: live
  - id: aerial-application-flying
    name: Aerial Application Flying
    kind: craft
    scope: "Low-level agricultural and utility flying: swath runs, turnarounds, obstacle environments and load management."
    examples: [swath-run patterns, low-level turnarounds, wire and obstacle avoidance, dispersal load management]
    status: live
  - id: bush-mountain-flying
    name: Bush & Mountain Flying
    kind: craft
    scope: "Flying into unimproved strips and mountain terrain: density altitude, canyon work, and remote self-sufficiency."
    examples: [one-way strip operations, density-altitude judgement, canyon turn technique, off-strip assessment]
    status: live
  - id: abnormal-emergency-handling
    name: Abnormal & Emergency Handling
    kind: craft
    scope: "Managing aircraft malfunctions and emergencies: engine failures, upset recovery, forced landings and checklist discipline."
    examples: [engine-out procedure, upset recovery, forced-landing site selection, memory items]
    status: live
  - id: radiotelephony
    name: Radiotelephony & Airspace Procedure
    kind: craft
    scope: "Working the aviation radio environment: standard phraseology, clearance readbacks and operating through controlled airspace."
    examples: [standard phraseology, clearance readback, uncontrolled-field calls, airspace transition requests]
    status: live
