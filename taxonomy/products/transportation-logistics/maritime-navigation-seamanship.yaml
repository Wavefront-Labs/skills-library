category: transportation-logistics
field: maritime-navigation-seamanship
products:
  - id: ecdis
    name: ECDIS
    kind: application
    scope: "Operating electronic chart display and information systems: chart management, route checking, alarms and sensor integration."
    examples: [route planning and checking, safety-contour settings, chart updates, alarm management]
    status: live
  - id: radar-arpa
    name: Radar & ARPA
    kind: application
    scope: "Marine radar and automatic plotting for collision avoidance and navigation: tuning, target acquisition and CPA analysis."
    examples: [radar tuning, target plotting, CPA/TCPA analysis, parallel indexing]
    status: live
  - id: gmdss-communications
    name: GMDSS Communications
    kind: application
    scope: "Operating maritime distress and safety communications: DSC, radio watchkeeping, distress traffic and safety broadcasts."
    examples: [DSC alerting, distress traffic procedure, NAVTEX and safety broadcasts, radio watchkeeping]
    status: live
  - id: dynamic-positioning
    name: Dynamic Positioning Systems
    kind: application
    scope: "Operating DP systems to hold station and track: reference systems, capability analysis and degraded-mode operation."
    examples: [DP setup and reference selection, capability plots, drift-off and drive-off response, DP watchkeeping]
    status: live
  - id: tugboats
    name: Tugboats
    kind: application
    scope: "Operating harbour and ocean tugs: towing gear, ship-assist work and girting avoidance."
    examples: [ship-assist maneuvers, towline handling, escort towing, girting avoidance]
    status: live
  - id: bridge-watchkeeping
    name: Bridge Watchkeeping
    kind: craft
    scope: "Keeping a safe navigational watch: lookout, position monitoring, traffic assessment and watch handover."
    examples: [lookout discipline, position fixing routine, traffic assessment, watch handover]
    status: live
  - id: passage-planning
    name: Passage Planning
    kind: craft
    scope: "Planning a voyage berth to berth: appraisal, route design, under-keel clearance, weather routing and contingency anchorages."
    examples: [berth-to-berth planning, under-keel clearance, weather routing, contingency planning]
    status: live
  - id: ship-handling
    name: Ship Handling
    kind: craft
    scope: "Maneuvering vessels: pivot-point use, propeller and rudder effects, interaction, berthing and unberthing."
    examples: [berthing approaches, propeller walk use, bank and squat interaction, maneuvering in wind and current]
    status: live
  - id: harbour-pilotage
    name: Harbour Pilotage
    kind: craft
    scope: "The pilot's craft: local-knowledge shiphandling in confined waters, master-pilot exchange and tug coordination."
    examples: [master-pilot exchange, confined-channel transits, tug orchestration, local current knowledge]
    status: live
  - id: colregs-collision-avoidance
    name: COLREGs & Collision Avoidance
    kind: craft
    scope: "Applying the collision regulations at sea: risk assessment, give-way and stand-on action, lights, shapes and sound signals."
    examples: [crossing-situation action, restricted-visibility conduct, lights and shapes recognition, sound signals]
    status: live
  - id: anchoring-mooring
    name: Anchoring & Mooring
    kind: craft
    scope: "Anchor and mooring work: scope and holding calculations, anchoring maneuvers, line plans and safe mooring-deck practice."
    examples: [anchoring maneuvers, scope calculation, mooring line plans, snap-back zone safety]
    status: live
  - id: engine-room-watchkeeping
    name: Engine-Room Watchkeeping
    kind: craft
    scope: "Keeping the machinery watch: plant monitoring, fuel and systems management, UMS rounds and machinery emergencies."
    examples: [plant rounds, fuel changeovers, alarm response, blackout recovery]
    status: live
  - id: cargo-operations-stability
    name: Cargo Operations & Stability
    kind: craft
    scope: "Loading and discharging ships: stowage planning, stability and stress control, draught surveys and cargo care at sea."
    examples: [stowage planning, stability calculations, ballast sequencing, draught surveys]
    status: live
  - id: deck-seamanship
    name: Deck Seamanship
    kind: craft
    scope: "Traditional deck skills: ropework and splicing, rigging, boat launching and small-boat handling from the ship."
    examples: [knots and splicing, rigging gear, lifeboat launching, pilot-ladder rigging]
    status: live
