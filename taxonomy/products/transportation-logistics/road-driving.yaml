    status: live
  - id: eco-driving
    name: Eco-Driving & Fuel Management
    kind: craft
    scope: "Driving technique and trip habits that minimise fuel or battery use: anticipation, progressive shifting, EV range management."
    examples: [anticipatory braking, progressive shifting, idle reduction, EV range planning]
