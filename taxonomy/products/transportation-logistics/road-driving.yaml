    examples: [following distance, hazard scanning, escape-route planning, intersection discipline]
    status: live
  - id: adverse-conditions-driving
    name: Winter & Adverse-Conditions Driving
    kind: craft
    scope: "Driving in snow, ice, rain, fog, wind and extreme heat: traction management, chains, and go/no-go judgement."
