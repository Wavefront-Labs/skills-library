  - id: trip-planning-compliance
    name: Trip Planning & Hours Compliance
    kind: craft
    scope: "Planning commercial road trips within hours-of-service and fatigue rules: rest scheduling, fuel stops and delivery windows."
    examples: [hours-of-service budgeting, rest-stop planning, delivery-window sequencing, fatigue management]
    status: live
  - id: emergency-response-driving
    name: Emergency Response Driving
    kind: craft
    scope: "Driving ambulances and other response vehicles under urgency: intersection clearing, due regard, and patient-smooth technique."
    examples: [lights-and-siren intersection clearing, due-regard judgement, smooth patient transport, staging approach]
    status: live
