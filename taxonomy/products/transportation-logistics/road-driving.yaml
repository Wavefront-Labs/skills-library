category: transportation-logistics
field: road-driving
products:
  - id: semi-trailer-trucks
    name: Semi-Trailer Trucks
    kind: application
    scope: "Operating articulated tractor-trailer combinations: pre-trip inspection, coupling, highway operation and delivery."
    examples: [pre-trip inspection, coupling and uncoupling, highway lane discipline, dock approach]
    status: live
  - id: rigid-trucks-vans
    name: Rigid Trucks & Vans
    kind: application
    scope: "Operating rigid trucks, box vans and delivery vans for urban and regional freight and multi-drop work."
    examples: [multi-drop delivery, urban maneuvering, tail-lift operation, height and bridge awareness]
    status: live
  - id: buses-coaches
    name: Buses & Coaches
    kind: application
    scope: "Operating buses and coaches in scheduled transit, charter and long-distance service, including passenger handling."
    examples: [stop approach and kneeling, schedule adherence, passenger safety, coach touring]
    status: live
  - id: tanker-trucks
    name: Tanker Trucks
    kind: application
    scope: "Operating liquid and gas tankers: surge control, loading and discharge, and product-specific handling."
    examples: [liquid surge management, loading rack procedure, baffled vs smooth-bore handling, fuel delivery]
    status: live
  - id: telematics-eld-systems
    name: Telematics & ELD Systems
    kind: application
    scope: "Operating in-cab telematics, electronic logging devices and fleet tracking systems as a driver or fleet operator."
    examples: [ELD duty-status logging, fault and inspection reporting, geofence workflows, driver scoring review]
    status: live
  - id: heavy-haul-oversize
    name: Heavy-Haul & Oversize Moves
    kind: craft
    scope: "Moving overweight and overdimensional loads by road: permits, route surveys, escorts and multi-axle equipment."
    examples: [route surveying, permit planning, pilot-car coordination, multi-axle load distribution]
    status: live
  - id: passenger-service-driving
    name: Passenger Service Driving (Taxi & Rideshare)
    kind: craft
    scope: "Driving passengers for hire in cars and small vehicles: taxi, rideshare, chauffeur and paratransit work."
