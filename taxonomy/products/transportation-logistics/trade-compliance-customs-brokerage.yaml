category: transportation-logistics
field: trade-compliance-customs-brokerage
products:
  - id: customs-filing-systems
    name: Customs Filing Systems
    kind: application
    scope: "Operating electronic customs filing platforms (ACE, CDS and national equivalents): entry transmission, status handling and amendments."
    examples: [entry transmission, response-message handling, entry amendments, filing-system account management]
    status: live
  - id: tariff-classification
    name: Tariff Classification
    kind: craft
    scope: "Classifying goods under the Harmonized System: GRI application, chapter notes, rulings research and classification defence."
    examples: [GRI application, chapter and section notes, ruling research, classification databases]
    status: live
  - id: customs-declaration-filing
    name: Customs Declaration Filing
    kind: craft
    scope: "Preparing and filing import and export declarations: entry construction, duty and tax calculation and release follow-through."
    examples: [entry preparation, duty and tax calculation, release troubleshooting, post-entry corrections]
    status: live
  - id: valuation-rules-of-origin
    name: Customs Valuation & Rules of Origin
    kind: craft
    scope: "Determining customs value and origin: valuation methods, additions and deductions, FTA qualification and origin documentation."
    examples: [transaction-value analysis, assists and additions, FTA origin qualification, certificates of origin]
    status: live
  - id: bonded-transit-procedures
    name: Bonded Warehouse & Transit Procedures
    kind: craft
    scope: "Managing goods under customs control: bonded-warehouse regimes, transit movements, drawback and inward processing."
    examples: [bonded-warehouse compliance, transit declarations, duty drawback, inward-processing relief]
    status: live
  - id: trade-documentation
    name: Import-Export Documentation
    kind: craft
    scope: "Producing the commercial document set that moves cargo through borders: invoices, packing lists, bills of lading and Incoterms use."
    examples: [commercial invoice standards, bill-of-lading handling, Incoterms application, document-set consistency checks]
    status: live
