category: transportation-logistics
field: spaceflight-spacecraft-operations
products:
  - id: crewed-spacecraft
    name: Crewed Spacecraft
    kind: application
    scope: "Piloting and operating crewed vehicles: ascent and entry monitoring, manual piloting modes and onboard systems management."
    examples: [ascent and entry procedures, manual piloting modes, onboard systems management, abort modes]
    status: live
  - id: mission-control-systems
    name: Mission Control & Ground Systems
    kind: application
    scope: "Operating mission-control consoles and satellite ground-control software: telemetry displays, commanding and pass automation."
    examples: [telemetry monitoring, command uplink procedure, pass scheduling, ground-system configuration]
    status: live
  - id: rendezvous-docking
    name: Rendezvous, Proximity Operations & Docking
    kind: craft
    scope: "Bringing spacecraft together: phasing, approach corridors, piloted and automated docking, and capture operations."
    examples: [phasing burns, approach-corridor control, manual docking technique, robotic-arm capture]
    status: live
  - id: flight-control-console-work
    name: Flight Control Console Operations
    kind: craft
    scope: "The flight controller's craft: console discipline, flight rules, anomaly response and Go/No-Go decision flow."
    examples: [console voice-loop discipline, flight-rule application, anomaly response, Go/No-Go polling]
    status: live
  - id: satellite-operations
    name: Satellite Operations
    kind: craft
    scope: "Flying satellites day to day: health monitoring, station-keeping, momentum and power management, and anomaly recovery."
    examples: [station-keeping maneuvers, power and thermal budgeting, momentum management, safe-mode recovery]
    status: live
  - id: flight-dynamics
    name: Flight Dynamics & Maneuver Planning
    kind: craft
    scope: "Planning trajectories and burns: orbit determination, maneuver design, launch windows and deorbit planning."
    examples: [orbit determination, maneuver targeting, launch-window analysis, deorbit planning]
    status: live
  - id: eva-operations
    name: EVA Operations
    kind: craft
    scope: "Spacewalk work: suit operations, translation and tethering, worksite tasks and EVA choreography with ground support."
    examples: [suit checkout, tether protocol, worksite task execution, EVA timeline management]
    status: live
  - id: launch-range-operations
    name: Launch & Range Operations
    kind: craft
    scope: "Conducting launch campaigns: countdown operations, range safety coordination, hold management and recycle decisions."
    examples: [countdown procedure, hold and recycle management, range safety coordination, weather launch-commit criteria]
    status: live
