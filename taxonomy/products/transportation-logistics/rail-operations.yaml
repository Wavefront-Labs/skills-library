category: transportation-logistics
field: rail-operations
products:
  - id: mainline-locomotives
    name: Mainline Locomotives
    kind: application
    scope: "Driving mainline freight and passenger locomotives: traction and brake control, in-cab systems and route running."
    examples: [dynamic braking, traction management, cab systems, route running]
    status: live
  - id: metro-commuter-trains
    name: Metro & Commuter Trains
    kind: application
    scope: "Driving metro and commuter multiple-units: high-frequency stopping service, platform work and automated operation modes."
    examples: [precision platform stopping, door and dispatch cycle, ATO supervision, timetable recovery]
    status: live
  - id: trams-light-rail
    name: Trams & Light Rail
    kind: application
    scope: "Driving trams and light rail in mixed street traffic: line-of-sight driving, road interfaces and stop service."
    examples: [line-of-sight braking, road-junction negotiation, pedestrian awareness, stop service]
    status: live
  - id: yard-shunting-locomotives
    name: Shunting & Yard Locomotives
    kind: application
    scope: "Operating shunting locomotives and remote-control units in yards and sidings: low-speed moves, coupling and spotting cars."
    examples: [remote-control operation, coupling moves, car spotting, kick and flat switching]
    status: live
  - id: train-handling
    name: Train Handling
    kind: craft
    scope: "The driver's craft of managing a train's mass: braking technique, slack control, gradient strategy and energy-efficient running."
    examples: [brake-point judgement, slack action control, gradient braking, energy-efficient driving]
    status: live
  - id: rules-route-knowledge
    name: Rules & Route Knowledge
    kind: craft
    scope: "Operating rulebook mastery and route learning: signal sighting and compliance, speed profiles, and degraded-working rules from the cab."
    examples: [signal sighting, route learning, temporary speed restrictions, rulebook application]
    status: live
  - id: train-dispatching
    name: Train Dispatching
    kind: craft
    scope: "Planning and authorising train movements across a territory: meets and passes, track authority, and service recovery."
    examples: [meet-pass planning, track-warrant authority, conflict resolution, disruption recovery]
    status: live
  - id: conducting-onboard-operations
    name: Conducting & Onboard Operations
    kind: craft
    scope: "The conductor's and guard's work: train preparation, brake tests, dispatch, onboard safety and freight documentation."
    examples: [brake tests, train dispatch, consist paperwork, passenger safety duties]
    status: live
  - id: yard-marshalling
    name: Yard & Marshalling Operations
    kind: craft
    scope: "Ground-side yard work: building and breaking trains, switching plans, hump operations and hand signals."
    examples: [switch-list execution, hump sequencing, securement and handbrakes, ground-crew signalling]
    status: live
  - id: degraded-working
    name: Degraded & Emergency Working
    kind: craft
    scope: "Running trains when systems fail: single-line working, failed-train assistance, evacuation and incident protection."
    examples: [single-line working, assisting failed trains, passenger evacuation, track protection]
    status: live
