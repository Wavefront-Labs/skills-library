category: manufacturing-production
field: production-quality-control
products:
  - id: minitab
    name: Minitab
    kind: application
    scope: "Quality statistics in Minitab: control charts, capability analysis, gage R&R studies and designed experiments for production data."
    examples: [control charts, Cp/Cpk studies, gage R&R, DOE analysis]
    status: live
  - id: cmm-programming
    name: CMM Programming (PC-DMIS / Calypso)
    kind: application
    scope: "Programming and running coordinate measuring machines: probe calibration, measurement routines from CAD, GD&T evaluation and reporting."
    examples: [probe qualification, CAD-based routines, GD&T evaluation, measurement reports]
    status: live
  - id: statistical-process-control
    name: Statistical Process Control
    kind: craft
    scope: "Keeping a process in control with SPC: control chart selection and interpretation, rational subgrouping, capability indices and reaction plans."
    examples: [chart selection, out-of-control rules, capability analysis, reaction plans]
    status: live
  - id: measurement-system-analysis
    name: Measurement System Analysis
    kind: craft
    scope: "Proving the measurement before trusting the data: gage R&R, bias and linearity studies, attribute agreement analysis and gauge calibration management."
    examples: [gage R&R studies, attribute agreement, calibration schedules, measurement uncertainty]
    status: live
  - id: dimensional-inspection-metrology
    name: Dimensional Inspection and Metrology
    kind: craft
    scope: "Measuring parts against drawing: hand tools and surface plates, GD&T interpretation, optical and vision systems, and first-article inspection."
    examples: [GD&T interpretation, surface plate work, vision systems, first-article inspection]
    status: live
  - id: in-line-visual-inspection
    name: In-Line and Visual Inspection
    kind: craft
    scope: "Inspecting product at line speed: visual standards and boundary samples, defect catalogues, inspection station design and escape analysis."
    examples: [boundary samples, defect catalogues, inspection at rate, escape analysis]
    status: live
  - id: sampling-batch-release
    name: Sampling and Batch Release Testing
    kind: craft
    scope: "Deciding whether a lot ships: AQL sampling plans, incoming/in-process/final inspection points, lab test coordination and release/hold decisions."
    examples: [AQL plans, skip-lot sampling, hold and release, certificate of analysis]
    status: live
  - id: nonconformance-root-cause
    name: Nonconformance and Root Cause Analysis
    kind: craft
    scope: "Handling defective output: nonconformance reporting and disposition, containment, 8D/A3 problem solving, 5-why and fishbone analysis and corrective action closure."
    examples: [8D reports, containment actions, 5-why analysis, CAPA closure]
    status: live
  - id: quality-planning-ppap
    name: Quality Planning (APQP/PPAP)
    kind: craft
    scope: "Qualifying parts and processes before volume production: control plans, process FMEA participation, PPAP submission packages and run-at-rate studies."
    examples: [control plans, PFMEA input, PPAP packages, run-at-rate]
    status: live
  - id: production-ndt
    name: Production Non-Destructive Testing
    kind: craft
    scope: "NDT applied as an in-production check: dye penetrant, magnetic particle, ultrasonic and leak testing stations integrated into the production flow."
    examples: [dye penetrant stations, mag particle checks, UT in production, leak test rigs]
    status: live
