  - id: swiss-type-turning
    name: Swiss-Type Turning
    kind: craft
    scope: "Programming and setting sliding-headstock lathes for small precision parts: guide bushing setup, simultaneous front/back working and thin-part strategies."
    examples: [guide bushing setup, pinch turning, back working, small-diameter strategies]
