  - id: workholding-fixturing
    name: Workholding and Fixturing
    kind: craft
    scope: "Holding production parts repeatably: vice, chuck and collet selection, dedicated fixtures, zero-point systems and distortion control."
    examples: [fixture design for repeat runs, zero-point clamping, soft jaws, distortion control]
    status: live
  - id: cutting-tool-selection
    name: Cutting Tool Selection
    kind: craft
    scope: "Choosing and managing production tooling: insert grades and geometries, tool life management, coolant strategy and cost-per-part thinking."
    examples: [insert grade selection, tool life tracking, coolant strategy, cost per edge]
    status: live
  - id: in-process-probing
    name: In-Process Probing and Tool Setting
    kind: craft
    scope: "Automating setup and in-cycle measurement: spindle probes, tool setters, probing cycles for offset update and adaptive machining."
    examples: [probing cycles, automatic offset update, broken tool detection, adaptive control]
    status: live
