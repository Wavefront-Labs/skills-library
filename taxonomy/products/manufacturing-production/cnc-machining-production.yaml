category: manufacturing-production
field: cnc-machining-production
products:
  - id: mastercam
    name: Mastercam
    kind: application
    scope: "CAM programming in Mastercam for production runs: 2D/3D milling and turning toolpaths, dynamic motion, multiaxis strategies and post-processor use."
    examples: [dynamic milling, mill-turn programming, multiaxis toolpaths, post configuration]
    status: live
  - id: fusion-360-cam
    name: Fusion 360 CAM
    kind: application
    scope: "CAM programming in Autodesk Fusion 360 Manufacturing: adaptive clearing, setups and stock, turning, and post-processing for common controls."
    examples: [adaptive clearing, setup and stock definition, turning paths, post editing]
    status: live
  - id: fanuc-cnc-control
    name: FANUC CNC Control
    kind: application
    scope: "Operating and programming at a FANUC control: MDI, offsets and tool geometry, macro B programming, parameter work and alarm diagnosis."
    examples: [work and tool offsets, macro B, parameter setting, alarm recovery]
    status: live
  - id: siemens-sinumerik
    name: Siemens SINUMERIK
    kind: application
    scope: "Operating and programming SINUMERIK controls: ShopMill/ShopTurn conversational programming, cycles, R-parameters and setup at the control."
    examples: [ShopMill programming, canned cycles, R-parameter programming, control-side setup]
    status: live
  - id: gcode-programming
    name: G-code Programming
    kind: craft
    scope: "Hand-written and hand-edited part programs: G and M codes, canned cycles, subprograms, cutter compensation and control-agnostic program structure."
    examples: [canned cycles, subprograms, cutter compensation, program proving]
    status: live
  - id: toolpath-optimisation
    name: Toolpath Optimisation
    kind: craft
    scope: "Cutting cycle time and tool cost on repeat work: high-efficiency milling strategies, feeds and speeds tuning, chip thinning and air-cut elimination."
    examples: [cycle time reduction, feeds and speeds, trochoidal strategies, air-cut elimination]
    status: live
  - id: multi-axis-machining-setup
