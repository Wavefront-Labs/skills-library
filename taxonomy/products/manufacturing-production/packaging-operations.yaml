category: manufacturing-production
field: packaging-operations
products:
  - id: filling-sealing-lines
    name: Filling and Sealing Lines
    kind: craft
    scope: "Running filling and sealing equipment: volumetric/gravimetric filler setup, seal parameter control, fill-weight compliance and leak/seal integrity checks."
    examples: [filler setup, seal integrity, fill-weight control, leak testing]
    status: live
  - id: form-fill-seal
    name: Form-Fill-Seal Operation
    kind: craft
    scope: "Running vertical and horizontal form-fill-seal machines: film threading and splicing, jaw temperature and dwell, bag/pouch quality and film tracking."
    examples: [film threading, seal jaw setup, pouch quality, film tracking]
    status: live
  - id: labelling-coding
    name: Labelling and Coding
    kind: craft
    scope: "Applying labels and codes on line: label applicator setup, inkjet/laser date coders, print-and-apply systems and code verification."
    examples: [applicator setup, date coder operation, print-and-apply, code verification]
    status: live
  - id: case-packing-palletising
    name: Case Packing and Palletising
    kind: craft
    scope: "End-of-line operations: case erector and packer setup, robotic and conventional palletisers, pallet pattern programming and stretch wrapping."
    examples: [case packer setup, palletiser patterns, stretch wrapper settings, pallet quality]
    status: live
  - id: checkweighing-inspection-systems
    name: Checkweighing and Inspection Systems
    kind: craft
    scope: "Running inline check equipment: checkweighers, metal detectors and x-ray inspection — setup, challenge testing and reject handling."
    examples: [checkweigher setup, metal detector challenge tests, x-ray inspection, reject handling]
    status: live
  - id: map-vacuum-packaging
    name: MAP and Vacuum Packaging
    kind: craft
    scope: "Packing under modified atmosphere or vacuum: gas mix control, tray sealer and thermoformer operation, residual oxygen testing and shelf-life protection."
    examples: [gas flushing, tray sealing, residual O2 testing, vacuum chamber operation]
    status: live
  - id: shrink-wrapping-bundling
    name: Shrink Wrapping and Bundling
    kind: craft
    scope: "Collating and wrapping multipacks: shrink tunnel and film settings, bundle collation, sleeve application and pack presentation quality."
    examples: [shrink tunnel profiles, collation setup, sleeving, pack presentation]
    status: live
  - id: packaging-line-changeover
    name: Packaging Line Changeover
    kind: craft
    scope: "Converting a packaging line between formats: change parts management, recipe recall, line re-timing and first-pack verification across every machine on the line."
    examples: [change parts management, format recipes, line re-timing, first-pack checks]
    status: live
