category: manufacturing-production
field: food-beverage-processing
products:
  - id: haccp-food-safety
    name: HACCP and Food Safety on the Line
    kind: craft
    scope: "Running food production inside a HACCP plan: critical control point monitoring, allergen control, hygiene zoning and corrective action when a CCP drifts."
    examples: [CCP monitoring, allergen changeovers, hygiene zoning, corrective actions]
    status: live
  - id: thermal-processing
    name: Thermal Processing and Canning
    kind: craft
    scope: "Cooking and sterilising food at scale: retort operation, pasteurisation, scheduled process execution and seam/seal integrity on canning lines."
    examples: [retort operation, pasteuriser control, scheduled processes, can seam checks]
    status: live
  - id: aseptic-uht-processing
    name: Aseptic and UHT Processing
    kind: craft
    scope: "Running UHT and aseptic lines: sterilisation and aseptic tank management, aseptic filling, and maintaining sterility through production runs."
    examples: [UHT plant operation, aseptic tank management, aseptic filling, sterility breaks]
    status: live
  - id: beverage-filling-lines
    name: Beverage Filling Lines
    kind: craft
    scope: "Running bottling and canning lines for drinks: filler and capper/seamer operation, carbonation control, fill-level and torque checks, and line efficiency."
    examples: [filler operation, carbonation control, cap torque checks, line efficiency]
    status: live
  - id: dairy-processing
    name: Dairy Processing
    kind: craft
    scope: "Processing milk at plant scale: separation and standardisation, pasteurisation, homogenisation, and cultured/cheese/powder production lines."
    examples: [separator operation, standardisation, cheese vat lines, spray drying]
    status: live
  - id: meat-poultry-processing
    name: Meat and Poultry Processing Lines
    kind: craft
    scope: "Running slaughter, cutting and further-processing lines: line butchery at pace, portioning and injection equipment, and chilled-chain discipline."
    examples: [line butchery, portion cutting, injection/marination, chill chain control]
    status: live
  - id: industrial-baking
    name: Industrial Baking
    kind: craft
    scope: "Baking at line scale: continuous mixing and dough handling, proofing, travelling ovens, and crumb/crust quality control at rate."
    examples: [continuous mixing, proofer control, tunnel oven profiles, crumb quality]
    status: live
  - id: extrusion-snack-processing
    name: Food Extrusion and Snack Processing
    kind: craft
    scope: "Running food extruders and frying/seasoning lines: extruder parameter control, expansion and texture, frying and oil management, and seasoning application."
    examples: [extruder parameters, expansion control, fryer oil management, seasoning drums]
    status: live
  - id: cip-sanitation
    name: CIP and Plant Sanitation
    kind: craft
    scope: "Cleaning food plant: clean-in-place cycle operation and verification, manual cleaning and swabbing, and sanitation scheduling between runs."
    examples: [CIP cycles, ATP swabbing, sanitation schedules, allergen cleans]
    status: live
  - id: frozen-chilled-processing
    name: Frozen and Chilled Processing
    kind: craft
    scope: "Freezing and chilling product at scale: blast and spiral freezer operation, IQF lines, temperature mapping and cold-chain handoff."
    examples: [spiral freezer operation, IQF lines, temperature mapping, cold-chain handoff]
    status: live
