category: manufacturing-production
field: metal-plastics-fabrication-production
products:
  - id: injection-moulding
    name: Injection Moulding Operation
    kind: craft
    scope: "Running injection moulding at production scale: mould setting and changeover, process parameter setup, defect diagnosis (short shots, flash, warp) and cycle optimisation."
    examples: [mould changeovers, process setup, defect diagnosis, cycle time optimisation]
    status: live
  - id: scientific-moulding
    name: Scientific Moulding
    kind: craft
    scope: "Data-driven injection moulding process development: decoupled moulding, viscosity and gate-seal studies, cavity pressure monitoring and process windows."
    examples: [decoupled moulding, viscosity curves, gate seal studies, cavity pressure]
    status: live
  - id: metal-stamping
    name: Metal Stamping
    kind: craft
    scope: "Running stamping presses: die setting, coil feed and straightener setup, progressive die operation, and hit-to-hit quality and die protection."
    examples: [die setting, progressive die runs, coil feed setup, die protection sensors]
    status: live
  - id: die-casting
    name: Die Casting Production
    kind: craft
    scope: "Running high-pressure die casting cells: shot parameter control, die spray and thermal balance, porosity control and trim operations."
    examples: [shot profile control, die thermal management, porosity control, trim press operation]
    status: live
  - id: plastic-extrusion
    name: Plastic Extrusion Lines
    kind: craft
    scope: "Running profile, pipe, sheet and film extrusion: screw and die setup, melt temperature and pressure control, haul-off and gauge control, and startup scrap reduction."
    examples: [die setup, melt control, gauge control, line startup]
    status: live
  - id: blow-moulding
    name: Blow Moulding
    kind: craft
    scope: "Running extrusion and stretch blow moulding: parison control, preform handling, wall-thickness distribution and bottle/container quality at rate."
    examples: [parison programming, stretch-blow setup, wall thickness control, leak testing]
    status: live
  - id: thermoforming
    name: Thermoforming Production
    kind: craft
    scope: "Running thermoforming lines: sheet heating profiles, forming and plug assist setup, trimming in line and material distribution control."
    examples: [heating profiles, plug assist setup, inline trimming, material distribution]
    status: live
  - id: roll-forming-tube
    name: Roll Forming and Tube Production
    kind: craft
    scope: "Running roll forming and tube/pipe mills: roll setup and alignment, inline welding (ERW), cutoff systems and profile tolerance control."
    examples: [roll tooling setup, ERW weld control, flying cutoff, profile tolerance]
    status: live
  - id: production-laser-cutting
    name: Production Laser and Punch Cutting
    kind: craft
    scope: "Running laser cutters and turret punches for production sheet work: nesting, machine parameter libraries, automation towers and part sorting."
    examples: [nesting efficiency, cut parameter libraries, load/unload automation, part sorting]
    status: live
  - id: robotic-production-welding
    name: Robotic and Production Welding
    kind: craft
    scope: "Welding at production scale: robotic weld cell operation and touch-up programming, fixture loading, spot welding lines and weld quality at rate."
    examples: [weld cell operation, program touch-up, spot weld schedules, weld quality checks]
    status: live
  - id: powder-coating-finishing
    name: Production Coating and Finishing Lines
    kind: craft
    scope: "Running finishing lines for formed parts: powder coating and e-coat lines, pretreatment baths, cure ovens and film-thickness control."
    examples: [powder booth operation, pretreatment control, cure oven profiles, film thickness]
    status: live
