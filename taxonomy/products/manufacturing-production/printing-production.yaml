category: manufacturing-production
field: printing-production
products:
  - id: offset-press-operation
    name: Offset Press Operation
    kind: craft
    scope: "Running sheetfed and web offset presses: makeready, ink-water balance, register and colour control at speed, and blanket/plate care."
    examples: [makeready, ink-water balance, register control, running colour to OK sheet]
    status: live
  - id: digital-press-operation
    name: Digital Press Operation
    kind: craft
    scope: "Running production digital presses (toner and inkjet): job setup and imposition at the DFE, media profiling, calibration and variable-data jobs."
    examples: [DFE job setup, media profiles, calibration routines, variable data printing]
    status: live
  - id: flexographic-printing
    name: Flexographic Printing
    kind: craft
    scope: "Running flexo presses for labels and packaging: plate mounting, anilox selection, impression setting, and web tension and register control."
    examples: [plate mounting, anilox management, impression setting, web tension control]
    status: live
  - id: gravure-printing
    name: Gravure Printing
    kind: craft
    scope: "Running rotogravure presses: cylinder handling, doctor blade setup, solvent ink and viscosity control, and long-run colour consistency."
    examples: [cylinder changeover, doctor blade setup, viscosity control, long-run consistency]
    status: live
  - id: screen-printing-production
    name: Industrial Screen Printing
    kind: craft
    scope: "Screen printing at production scale on textiles, graphics and industrial parts: screen making and tension, ink systems, multi-colour registration and curing."
    examples: [screen making, multi-colour registration, ink curing, automatic carousel operation]
    status: live
  - id: prepress-workflow
    name: Prepress Workflow
    kind: craft
    scope: "Preparing jobs for press: PDF preflight, imposition, trapping, proofing and platesetting through workflow systems such as Prinergy or Esko."
    examples: [preflight, imposition, trapping, CTP platesetting]
    status: live
  - id: print-colour-management
    name: Print Colour Management
    kind: craft
    scope: "Keeping colour right from proof to press: ICC profiling, G7/ISO 12647 calibration, spectrophotometer use and press-side colour OK decisions."
    examples: [ICC profiling, G7 calibration, delta-E measurement, press OK decisions]
    status: live
  - id: print-finishing-binding
    name: Print Finishing and Binding
    kind: craft
    scope: "Finishing printed work at scale: guillotine cutting, folding, saddle-stitching and perfect binding, laminating/UV coating and die-cutting."
    examples: [guillotine programs, folder setup, perfect binding, die-cutting]
    status: live
  - id: label-packaging-printing
    name: Label and Packaging Printing
    kind: craft
    scope: "Producing labels, cartons and flexible packaging: substrate handling, inline converting (die-cut, laminate, slit), barcode verification and brand-colour matching."
    examples: [inline die-cutting, slitting and rewinding, barcode grades, brand colour matching]
    status: live
