category: manufacturing-production
field: production-planning
products:
  - id: sap-pp
    name: SAP Production Planning (PP)
    kind: application
    scope: "Planning production in SAP ERP/S4HANA PP: material masters and BOMs, MRP runs, production orders, confirmations and capacity views."
    examples: [MRP runs, production orders, order confirmations, capacity levelling]
    status: live
  - id: master-production-scheduling
    name: Master Production Scheduling
    kind: craft
    scope: "Building and maintaining the master schedule: translating demand into a feasible build plan, time fences, available-to-promise and schedule stability."
    examples: [MPS construction, time fences, available-to-promise, schedule stability]
    status: live
  - id: materials-requirements-planning
    name: Materials Requirements Planning
    kind: craft
    scope: "Planning material to the schedule: BOM explosion, lot sizing and safety stock, planned order management, and exception message triage."
    examples: [BOM explosion, lot sizing, safety stock setting, exception handling]
    status: live
  - id: capacity-planning
    name: Capacity Planning
    kind: craft
    scope: "Matching load to capacity: rough-cut capacity planning, work centre loading, bottleneck identification and overtime/shift decisions."
    examples: [rough-cut capacity, work centre loading, bottleneck analysis, shift planning]
    status: live
  - id: finite-scheduling-sequencing
    name: Finite Scheduling and Sequencing
    kind: craft
    scope: "Sequencing jobs on real machines: changeover-aware sequencing, dispatching rules, schedule repair when the plan breaks, and APS tool use."
    examples: [changeover sequencing, dispatching rules, schedule repair, APS scheduling]
    status: live
  - id: line-balancing
    name: Line Balancing
    kind: craft
    scope: "Distributing work across line stations: takt calculation, task assignment and precedence, rebalancing for volume changes and operator loading charts."
    examples: [takt calculation, station assignment, rebalance for volume, Yamazumi charts]
    status: live
  - id: sales-operations-planning
    name: Sales and Operations Planning
    kind: craft
    scope: "Reconciling demand and supply monthly: demand review, supply planning, inventory and backlog trade-offs and the executive S&OP cycle."
    examples: [demand review, supply review, inventory trade-offs, S&OP cadence]
    status: live
  - id: kanban-pull-systems
    name: Kanban and Pull Systems
    kind: craft
    scope: "Running production on pull: kanban sizing and loop design, supermarkets, heijunka levelling and CONWIP alternatives."
    examples: [kanban sizing, supermarket design, heijunka boxes, CONWIP loops]
    status: live
  - id: shop-floor-scheduling-execution
    name: Shop Floor Scheduling Execution
    kind: craft
    scope: "Keeping the daily plan honest on the floor: dispatch lists, progress tracking, expediting decisions and shortage management with the planner."
    examples: [dispatch lists, progress tracking, expedite decisions, shortage meetings]
    status: live
