category: manufacturing-production
field: electronics-semiconductor-manufacturing
products:
  - id: smt-line-operation
    name: SMT Line Operation
    kind: craft
    scope: "Running surface-mount lines: solder paste printing, pick-and-place programming and feeder setup, line changeovers and first-article buy-off."
    examples: [stencil printing, placement programming, feeder setup, first-article buy-off]
    status: live
  - id: reflow-wave-soldering
    name: Reflow and Wave Soldering
    kind: craft
    scope: "Soldering boards at scale: reflow profile development and verification, wave and selective soldering setup, and solder defect diagnosis."
    examples: [reflow profiling, wave solder setup, selective soldering, defect diagnosis]
    status: live
  - id: aoi-spi-inspection
    name: AOI and SPI Inspection
    kind: craft
    scope: "Programming and running automated optical and solder paste inspection: test program creation, false-call tuning and defect classification to IPC-A-610."
    examples: [AOI programming, SPI thresholds, false-call reduction, IPC defect classification]
    status: live
  - id: ict-functional-test
    name: In-Circuit and Functional Test
    kind: craft
    scope: "Testing assembled boards: ICT fixture and program operation, flying probe, functional test stations, boundary scan and failure triage to repair."
    examples: [ICT operation, flying probe, functional test stations, failure triage]
    status: live
  - id: pcb-rework-repair
    name: PCB Rework and Repair
    kind: craft
    scope: "Reworking assembled boards: BGA removal and replacement, hot-air and infrared rework stations, pad repair and post-rework verification."
    examples: [BGA rework, hot-air stations, pad repair, post-rework inspection]
    status: live
  - id: conformal-coating-potting
    name: Conformal Coating and Potting
    kind: craft
    scope: "Protecting assemblies: selective coating line operation, masking, cure and coverage inspection, and potting/encapsulation dispensing."
    examples: [selective coating, masking, UV cure inspection, potting dispense]
    status: live
  - id: esd-cleanroom-practice
    name: ESD and Cleanroom Practice
    kind: craft
    scope: "Working safely with sensitive product: ESD-protected area discipline and auditing, cleanroom gowning and protocol, and contamination control for electronics."
    examples: [EPA discipline, ESD auditing, cleanroom gowning, contamination control]
    status: live
  - id: wafer-fab-operations
    name: Wafer Fab Operations
    kind: craft
    scope: "Operating semiconductor front-end tools: lot handling and tracking, tool qualification runs, SECS/GEM automation awareness and excursion response."
    examples: [lot management, tool quals, run-to-run awareness, excursion response]
    status: live
  - id: photolithography-operations
    name: Photolithography Operations
    kind: craft
    scope: "Running litho cells: track and scanner/stepper operation, resist processing, overlay and CD monitoring, and rework decisions."
    examples: [track operation, overlay monitoring, CD measurement, resist rework]
    status: live
  - id: thin-film-etch-operations
    name: Deposition and Etch Operations
    kind: craft
    scope: "Running deposition and etch tools: CVD/PVD and plasma etch operation, endpoint monitoring, chamber conditioning and particle control."
    examples: [plasma etch operation, endpoint detection, chamber seasoning, particle checks]
    status: live
  - id: ic-packaging-test
    name: IC Packaging and Test
    kind: craft
    scope: "Back-end semiconductor production: die attach, wire bonding, moulding and singulation, wafer probe and final test handler operation."
    examples: [wire bonding, die attach, wafer probe, final test handlers]
    status: live
