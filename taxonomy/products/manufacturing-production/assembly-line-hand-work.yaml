category: manufacturing-production
field: assembly-line-hand-work
products:
  - id: hand-assembly
    name: Hand Assembly at Station
    kind: craft
    scope: "Assembling components at a paced station: work instruction reading, part orientation, fit and snap/press operations, and keeping quality at takt."
    examples: [paced assembly technique, part orientation, press-fit operations, takt discipline]
    status: live
  - id: hand-soldering-line
    name: Line Hand-Soldering (IPC)
    kind: craft
    scope: "Hand-soldering and touch-up on an electronics line to IPC-A-610/J-STD-001: through-hole and SMD rework stations, iron technique and solder joint acceptance."
    examples: [IPC-class soldering, through-hole soldering, SMD touch-up, joint inspection]
    status: live
  - id: wire-harness-assembly
    name: Wire Harness Assembly
    kind: craft
    scope: "Building cable and wire harnesses on boards and jigs: cutting and stripping, crimping to spec, routing on formboards, taping and connector population."
    examples: [crimping to IPC/WHMA-A-620, formboard routing, connector population, pull testing]
    status: live
  - id: torque-controlled-fastening
    name: Torque-Controlled Fastening
    kind: craft
    scope: "Fastening at a line station with controlled torque: clutch and DC tool use, torque sequence and verification, and error-proofed bolt-count systems."
    examples: [DC tool operation, torque sequences, joint verification, fastener error-proofing]
    status: live
  - id: kitting-packing-stations
    name: Kitting and Packing Stations
    kind: craft
    scope: "Assembling kits and packing product at a paced station: pick-to-light and pick lists, count accuracy, protective packing and station-level labelling."
    examples: [pick-to-light work, kit verification, protective packing, carton labelling]
    status: live
  - id: hand-sorting-grading
    name: Hand Sorting and Grading
    kind: craft
    scope: "Sorting and grading product by hand at line speed: grade criteria application, defect spotting at pace, and consistent judgement across a shift."
    examples: [grade standards, defect spotting at speed, consistency across shift, reject handling]
    status: live
  - id: adhesive-bonding-sealing
    name: Adhesive Bonding and Sealing at Station
    kind: craft
    scope: "Applying adhesives, sealants and gaskets at a line station: surface prep, bead application and dispensing guns, open-time management and cure handling."
    examples: [bead application, surface preparation, open-time management, dispensing equipment]
    status: live
