category: manufacturing-production
field: pharmaceutical-manufacturing
products:
  - id: gmp-practice
    name: GMP Practice
    kind: craft
    scope: "Working to current good manufacturing practice: data integrity (ALCOA+), gowning and hygiene, deviation and CAPA handling, and audit-ready behaviour on the floor."
    examples: [ALCOA+ data integrity, deviation reporting, CAPA participation, gowning discipline]
    status: live
  - id: batch-record-documentation
    name: Batch Record Documentation
    kind: craft
    scope: "Executing and reviewing batch records: contemporaneous entries, electronic batch record systems, exception documentation and review-by-exception for release."
    examples: [MBR execution, EBR systems, exception handling, batch record review]
    status: live
  - id: solid-dose-production
    name: Solid Dose Production
    kind: craft
    scope: "Making tablets and capsules at scale: granulation, blending, tablet compression, coating and encapsulation — setup, in-process controls and troubleshooting."
    examples: [granulation, tablet press setup, coating pans, capsule filling]
    status: live
  - id: sterile-aseptic-processing
    name: Sterile and Aseptic Processing
    kind: craft
    scope: "Working in aseptic production: cleanroom behaviour, aseptic technique, isolator/RABS operation, media fills and environmental monitoring to Annex 1."
    examples: [aseptic technique, isolator operation, media fill participation, environmental monitoring]
    status: live
  - id: sterile-fill-finish
    name: Sterile Fill-Finish
    kind: craft
    scope: "Running fill-finish lines: vial and syringe filling, stoppering and capping, lyophilisation cycles and visual inspection of filled units."
    examples: [vial filling lines, stoppering/capping, lyophiliser operation, filled-unit inspection]
    status: live
  - id: biologics-upstream
    name: Biologics Upstream Processing
    kind: craft
    scope: "Running cell culture and fermentation at production scale: seed trains, bioreactor operation, in-process monitoring and harvest."
    examples: [seed train expansion, bioreactor operation, single-use systems, harvest operations]
    status: live
  - id: biologics-downstream
    name: Biologics Downstream Processing
    kind: craft
    scope: "Purifying biologic product: chromatography operation, tangential flow filtration, viral clearance steps and buffer preparation at scale."
    examples: [chromatography skids, TFF operation, viral filtration, buffer prep]
    status: live
  - id: cleaning-validation-cip
    name: Cleaning and Cleaning Validation
    kind: craft
    scope: "Cleaning pharmaceutical equipment and proving it: CIP/SIP cycles, manual cleaning procedures, swab and rinse sampling and cross-contamination control."
    examples: [CIP/SIP operation, swab sampling, changeover cleaning, cross-contamination control]
    status: live
  - id: equipment-qualification
    name: Equipment Qualification and Validation Support
    kind: craft
    scope: "Qualifying production equipment and processes: IQ/OQ/PQ execution, process validation batches and requalification from the manufacturing side."
    examples: [IQ/OQ/PQ execution, process validation runs, protocol execution, requalification]
    status: live
  - id: serialisation-packaging-pharma
    name: Pharmaceutical Packaging and Serialisation
    kind: craft
    scope: "Packing medicines under GMP: blister and bottle lines, label control and reconciliation, and serialisation/track-and-trace systems."
    examples: [blister line operation, label reconciliation, serialisation systems, tamper evidence]
    status: live
