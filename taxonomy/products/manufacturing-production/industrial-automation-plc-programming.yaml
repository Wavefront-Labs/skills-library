category: manufacturing-production
field: industrial-automation-plc-programming
products:
  - id: siemens-tia-portal
    name: Siemens TIA Portal
    kind: application
    scope: "Programming Siemens S7 PLCs and HMIs in TIA Portal: ladder/FBD/SCL, hardware configuration, PROFINET networks and WinCC panels."
    examples: [S7-1500 programming, SCL function blocks, PROFINET setup, WinCC HMI screens]
    status: live
  - id: rockwell-studio-5000
    name: Rockwell Studio 5000
    kind: application
    scope: "Programming Allen-Bradley ControlLogix/CompactLogix PLCs in Studio 5000: ladder and structured text, Add-On Instructions, EtherNet/IP and FactoryTalk View HMIs."
    examples: [ControlLogix programming, Add-On Instructions, EtherNet/IP configuration, FactoryTalk View]
    status: live
  - id: codesys
    name: CODESYS
    kind: application
    scope: "Programming IEC 61131-3 controllers in CODESYS and its vendor derivatives (TwinCAT, Schneider Machine Expert): all five languages, fieldbus configuration and visualisation."
    examples: [structured text, fieldbus setup, CODESYS visualisation, library management]
    status: live
  - id: ignition-scada
    name: Ignition SCADA
    kind: application
    scope: "Building and configuring Inductive Automation Ignition: tag architecture, Perspective/Vision screens, alarming, historian and MQTT/OPC-UA integration."
    examples: [tag design, Perspective screens, alarm pipelines, historian queries]
    status: live
  - id: aveva-wonderware
    name: AVEVA System Platform (Wonderware)
    kind: application
    scope: "Configuring AVEVA/Wonderware SCADA and HMI: InTouch applications, System Platform object templates, galaxy deployment and historian."
    examples: [InTouch screens, ArchestrA object templates, galaxy deployment, Historian trends]
    status: live
  - id: fanuc-robot-programming
    name: FANUC Robot Programming
    kind: application
    scope: "Programming and integrating FANUC industrial robots: TP programming, frames and payloads, iRVision, and cell integration with the line PLC."
    examples: [TP programs, frame setup, iRVision guidance, PLC handshaking]
    status: live
  - id: abb-robotstudio
    name: ABB RobotStudio / RAPID
    kind: application
    scope: "Programming ABB robots in RAPID and simulating cells in RobotStudio: motion programming, work objects, offline programming and virtual commissioning."
    examples: [RAPID programming, work object calibration, offline programming, cell simulation]
    status: live
  - id: hmi-design
    name: HMI Design
    kind: craft
    scope: "Designing operator interfaces that work under pressure: high-performance HMI principles, alarm philosophy, navigation and situational awareness, independent of SCADA vendor."
    examples: [high-performance HMI, alarm rationalisation, screen hierarchy, colour discipline]
    status: live
  - id: plc-programming-practice
    name: PLC Programming Practice
    kind: craft
    scope: "Vendor-agnostic control logic craft: IEC 61131-3 language choice, state machines, interlocks, sequencing, fault handling and code structure that maintenance can read."
    examples: [state machine design, interlock logic, fault handling patterns, code organisation]
    status: live
  - id: industrial-networking
    name: Industrial Networking
    kind: craft
    scope: "Designing and troubleshooting plant-floor networks: PROFINET, EtherNet/IP, Modbus and OPC-UA, network segmentation, device commissioning and diagnostics."
    examples: [fieldbus selection, network segmentation, OPC-UA setup, protocol diagnostics]
    status: live
  - id: machine-safety-systems
    name: Machine Safety Systems
    kind: craft
    scope: "Engineering functional safety on machines and lines: risk assessment to ISO 13849/IEC 62061, safety PLC logic, guard interlocks, light curtains and validation."
    examples: [risk assessment, safety PLC logic, performance level calculation, safety validation]
    status: live
  - id: motion-control-drives
    name: Motion Control and Drives
    kind: craft
    scope: "Configuring servo and variable-frequency drives: sizing, tuning, camming and gearing, synchronised multi-axis motion and drive fault diagnosis."
    examples: [VFD commissioning, servo tuning, electronic camming, axis synchronisation]
    status: live
  - id: automation-commissioning
    name: Line Automation Commissioning
    kind: craft
    scope: "Taking an automated line from installed to production-ready: I/O checkout, loop testing, dry and wet runs, FAT/SAT protocols and performance ramp-up."
    examples: [I/O checkout, FAT/SAT execution, dry-run testing, ramp-up to rate]
    status: live
