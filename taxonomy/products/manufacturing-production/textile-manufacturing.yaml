category: manufacturing-production
field: textile-manufacturing
products:
  - id: yarn-spinning
    name: Yarn Spinning Production
    kind: craft
    scope: "Producing yarn on industrial spinning systems: ring and open-end/rotor spinning, drawing and roving, count and twist control, and piecing/doffing routines."
    examples: [ring frame operation, rotor spinning, count and twist control, doffing]
    status: live
  - id: industrial-weaving
    name: Industrial Weaving
    kind: craft
    scope: "Running production looms: warping and drawing-in, rapier/air-jet/projectile loom operation, weave fault diagnosis and loom efficiency."
    examples: [warp preparation, air-jet loom operation, broken-end repair, weave fault diagnosis]
    status: live
  - id: industrial-knitting
    name: Industrial Knitting
    kind: craft
    scope: "Running circular and flat knitting machines: machine setup and gauge, pattern programming on electronic machines, needle fault handling and fabric quality."
    examples: [circular machine setup, flat-bed programming, needle fault repair, GSM control]
    status: live
  - id: dyeing-finishing
    name: Dyeing and Finishing Plant Operation
    kind: craft
    scope: "Dyeing and finishing fabric and yarn at scale: recipe dosing, jet/jig/pad dyeing, shade matching and approval, stenter and finishing line operation."
    examples: [jet dyeing, shade matching, stenter operation, finishing recipes]
    status: live
  - id: textile-printing-production
    name: Textile Printing Production
    kind: craft
    scope: "Printing fabric at production scale: rotary and flat-bed screen printing, digital textile printing, colour kitchen work and print registration."
    examples: [rotary screen printing, digital textile printing, colour kitchen, registration control]
    status: live
  - id: cutting-room-operations
    name: Cutting Room Operations
    kind: craft
    scope: "Preparing garment pieces at scale: marker making and nesting, spreading, automated and manual cutting, and bundling for the sewing line."
    examples: [marker efficiency, spreading, auto-cutter operation, bundling]
    status: live
  - id: garment-line-sewing
    name: Garment Line Sewing
    kind: craft
    scope: "Sewing garments on a paced production line: industrial machine classes (lockstitch, overlock, coverstitch), operation breakdown, SMV-paced work and seam quality."
    examples: [lockstitch/overlock operation, operation sequencing, SMV pacing, seam defect prevention]
    status: live
  - id: nonwovens-production
    name: Nonwovens Production
    kind: craft
    scope: "Producing nonwoven fabric: spunbond/meltblown and carded lines, web formation and bonding (thermal, needlepunch, hydroentangling), and basis-weight control."
    examples: [spunbond lines, needlepunching, web uniformity, basis-weight control]
    status: live
