category: manufacturing-production
field: chemical-process-manufacturing
products:
  - id: emerson-deltav
    name: Emerson DeltaV
    kind: application
    scope: "Operating and configuring the DeltaV distributed control system: control modules, batch executive, operator graphics and alarm management on running plant."
    examples: [control module configuration, DeltaV Batch, operator graphics, alarm handling]
    status: live
  - id: honeywell-experion
    name: Honeywell Experion
    kind: application
    scope: "Operating and configuring Honeywell Experion PKS: control strategies, HMIWeb displays, and console operation of continuous plant."
    examples: [control strategy building, HMIWeb displays, console operation, alarm shelving]
    status: live
  - id: control-room-operation
    name: Control Room Operation
    kind: craft
    scope: "Running a process plant from the board: monitoring trends, managing alarms, coordinating field operators, and steering the process through disturbances and transitions."
    examples: [trend reading, alarm flood management, field coordination, grade transitions]
    status: live
  - id: batch-processing
    name: Batch Processing
    kind: craft
    scope: "Running batch chemical production: recipe execution to ISA-88 thinking, charging and sampling, reaction monitoring and batch-to-batch consistency."
    examples: [recipe execution, reactor charging, in-process sampling, batch consistency]
    status: live
  - id: continuous-process-operation
    name: Continuous Process Operation
    kind: craft
    scope: "Operating continuous plant: startup and shutdown sequences, steady-state optimisation, rate changes and upset recovery."
    examples: [plant startup, steady-state tuning, rate changes, upset recovery]
    status: live
  - id: distillation-separation-operation
    name: Distillation and Separation Operation
    kind: craft
    scope: "Running separation units: distillation columns, extraction, crystallisation and filtration — composition control, flooding/weeping response and energy balance."
    examples: [column composition control, flooding response, crystalliser operation, filtration cycles]
    status: live
  - id: chemical-blending-formulation
    name: Chemical Blending and Formulation Production
    kind: craft
    scope: "Blending and compounding to formulation at scale: weigh-up accuracy, addition order, mixing parameters and in-spec adjustment."
    examples: [weigh-up and charging, addition sequencing, mix parameter control, spec adjustment]
    status: live
  - id: process-safety-operations
    name: Process Safety in Operations
    kind: craft
    scope: "Operating within the process safety envelope: safe operating limits, permit-to-work and isolation, management of change awareness and HAZOP action follow-through."
    examples: [safe operating limits, lockout/isolation, permit-to-work, MOC discipline]
    status: live
  - id: process-troubleshooting
    name: Process Troubleshooting
    kind: craft
    scope: "Diagnosing why the process is off: mass and energy balance reasoning, instrument-versus-process discrimination, and systematic cause isolation on live plant."
    examples: [mass balance checks, instrument validation, deviation diagnosis, cause isolation]
    status: live
