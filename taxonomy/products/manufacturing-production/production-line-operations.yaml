category: manufacturing-production
field: production-line-operations
products:
  - id: machine-tending
    name: Machine Tending
    kind: craft
    scope: "Setting up, loading, running and monitoring a production machine or cell: startup and shutdown sequences, feed and takeaway, fault clearing and escalation."
    examples: [startup/shutdown routines, jam clearing, cycle monitoring, operator-level fault response]
    status: live
  - id: line-changeover-smed
    name: Line Changeover (SMED)
    kind: craft
    scope: "Converting a line between products fast and right: single-minute exchange of die method, internal/external task separation, changeover standard work and verification."
    examples: [SMED analysis, changeover checklists, first-off verification, tooling staging]
    status: live
  - id: conveyor-batching-systems
    name: Conveyor and Batching Systems Operation
    kind: craft
    scope: "Running conveyor, accumulation, dosing and batching systems that move and meter material through a plant: balancing flow, managing buffers, clearing blockages."
    examples: [line balancing at speed, accumulation management, batch dosing, blockage recovery]
    status: live
  - id: standard-work
    name: Standard Work and Visual Management
    kind: craft
    scope: "Writing and running to standard work: takt-paced operator instructions, 5S workplace organisation, visual controls and andon response."
    examples: [standard work combination sheets, 5S audits, andon escalation, takt time pacing]
    status: live
  - id: lean-manufacturing
    name: Lean Manufacturing Methods
    kind: craft
    scope: "Applying the lean toolkit on a running line: value stream mapping, waste identification, kaizen events, pull systems and continuous flow."
    examples: [value stream mapping, seven wastes analysis, kaizen facilitation, one-piece flow]
    status: live
  - id: total-productive-maintenance
    name: Total Productive Maintenance (TPM)
    kind: craft
    scope: "Operator-led equipment care and loss elimination: autonomous maintenance routines, cleaning-inspection-lubrication standards and the TPM pillar structure."
    examples: [autonomous maintenance, CIL standards, minor-stop elimination, TPM audits]
    status: live
  - id: oee-performance-monitoring
    name: OEE and Performance Monitoring
    kind: craft
    scope: "Measuring and improving line performance: overall equipment effectiveness, availability/performance/quality loss trees, downtime logging and shift reporting."
    examples: [OEE calculation, downtime Pareto, loss tree analysis, shift handover reports]
    status: live
  - id: mes-operation
    name: MES Operation
    kind: craft
    scope: "Working a manufacturing execution system from the shop floor: order start and completion, material consumption booking, electronic work instructions and traceability scans."
    examples: [order confirmation, consumption booking, e-work instructions, lot traceability]
    status: live
