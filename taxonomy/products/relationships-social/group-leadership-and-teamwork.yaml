category: relationships-social
field: group-leadership-and-teamwork
products:
  - id: informal-leadership
    name: Informal Group Leadership
    kind: craft
    scope: "Leading a peer group without formal authority: setting direction, earning followership, leading among equals."
    examples: [leading without authority, setting group direction, earning buy-in]
    status: live
  - id: group-decision-making
    name: Group Decision-Making
    kind: craft
    scope: "Getting a group to a decision it will keep: surfacing options, building consensus, breaking deadlocks."
    examples: [consensus building, deadlock breaking, decision closure]
    status: live
  - id: team-cohesion
    name: Team Cohesion
    kind: craft
    scope: "Making a group feel like a team: inclusion, trust between members, morale through setbacks."
    examples: [building trust, including quiet members, morale through setbacks]
    status: live
  - id: delegating-among-peers
    name: Delegating Among Peers
    kind: craft
    scope: "Dividing work in a group of equals: matching tasks to people, asking without ordering, following up without nagging."
    examples: [task matching, asking not ordering, follow-up without nagging]
    status: live
  - id: managing-group-dynamics
    name: Managing Group Dynamics
    kind: craft
    scope: "Handling the frictions of group life: dominating members, cliques, free-riders, tensions between members."
    examples: [handling a dominator, defusing cliques, addressing free-riding]
    status: live
  - id: facilitating-gatherings
    name: Facilitating Group Gatherings
    kind: craft
    scope: "Running meetings and gatherings of an informal group: agendas people tolerate, airtime balance, ending with next steps."
    examples: [light-touch agendas, balancing airtime, closing with actions]
    status: live
