category: relationships-social
field: empathy-and-emotional-support-between-peers
products:
  - id: validating-feelings
    name: Validating Feelings
    kind: craft
    scope: "Acknowledging another person's emotions as legitimate without judging, minimising or rushing to fix."
    examples: [naming the feeling, avoiding minimising, resisting the fix reflex]
    status: live
  - id: perspective-taking
    name: Perspective-Taking
    kind: craft
    scope: "Seeing a situation from the other person's position: imagining their constraints, history and stakes before responding."
    examples: [steel-manning their view, imagining constraints, suspending your own frame]
    status: live
  - id: holding-space
    name: Holding Space
    kind: craft
    scope: "Being present with someone in distress without steering, advising or filling silence."
    examples: [comfortable silence, non-directive presence, staying with discomfort]
    status: live
  - id: comforting
    name: Comforting a Friend
    kind: craft
    scope: "Responding when a friend is upset: what to say and not say, offering comfort matched to what they need."
    examples: [comfort vs solutions, matching their need, physical and verbal comfort]
    status: live
  - id: checking-in
    name: Checking In
    kind: craft
    scope: "Proactively reaching out to someone who may be struggling: when, how often, and how to ask so they can answer honestly."
    examples: [timing a check-in, questions that invite honesty, sustained follow-up]
    status: live
  - id: receiving-disclosure
    name: Receiving a Disclosure
    kind: craft
    scope: "Responding well in the moment someone confides something heavy: first reactions, confidentiality, knowing your limits as a peer."
    examples: [first-response composure, keeping confidence, recognising when it exceeds peer support]
    status: live
