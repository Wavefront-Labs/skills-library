category: relationships-social
field: parenting-communication-and-discipline
products:
  - id: age-appropriate-communication
    name: Age-Appropriate Communication
    kind: craft
    scope: "Explaining things to a child at their level: hard topics, honest answers, matching language to developmental stage."
    examples: [explaining death or divorce, answering awkward questions, matching language to age]
    status: live
  - id: boundary-setting
    name: Boundary Setting with Children
    kind: craft
    scope: "Setting and holding limits with a child: clear rules, consistent follow-through, limits without power struggles."
    examples: [clear limits, consistent follow-through, avoiding power struggles]
    status: live
  - id: positive-discipline
    name: Positive Discipline Methods
    kind: craft
    scope: "Non-punitive discipline practice: natural consequences, redirection, praise and reinforcement, repair after misbehaviour."
    examples: [natural consequences, redirection, repair after misbehaviour]
    status: live
  - id: parent-child-bonding
    name: Parent-Child Bonding
    kind: craft
    scope: "Building secure attachment through everyday life: play, one-on-one time, responsive attention."
    examples: [child-led play, one-on-one rituals, responsive attention]
    status: live
  - id: emotion-coaching
    name: Emotion Coaching
    kind: craft
    scope: "Helping a child name and manage feelings in the moment: tantrum response, co-regulation, talking through big emotions."
    examples: [tantrum response, naming feelings, co-regulation]
    status: live
  - id: co-parenting-communication
    name: Co-Parenting Communication
    kind: craft
    scope: "Communicating between parents about raising the child: presenting a united front, handoffs, separated co-parenting."
    examples: [united-front agreements, separated co-parenting logistics, disagreement away from the child]
    status: live
  - id: parenting-teens
    name: Communicating with Teenagers
    kind: craft
    scope: "The distinct craft of parenting adolescents: autonomy negotiation, staying connected through withdrawal, hard conversations."
    examples: [autonomy negotiation, staying connected through withdrawal, risk conversations]
    status: live
