category: relationships-social
field: grief-and-hardship-peer-support
products:
  - id: sitting-with-grief
    name: Sitting with Someone in Grief
    kind: craft
    scope: "Being present with a bereaved friend or relative: presence over fixing, tolerating tears and silence."
    examples: [presence over fixing, tolerating silence, following their lead]
    status: live
  - id: what-to-say
    name: What to Say and Not Say
    kind: craft
    scope: "The words for loss and hardship: condolences that land, platitudes to avoid, acknowledging rather than explaining."
    examples: [condolence wording, platitudes to avoid, acknowledging the loss]
    status: live
  - id: practical-crisis-help
    name: Practical Help in a Crisis
    kind: craft
    scope: "Giving concrete help to someone in crisis: specific offers over 'let me know', meals, errands, logistics cover."
    examples: [specific offers, meal and errand support, covering logistics]
    status: live
  - id: sustained-support
    name: Sustained Check-Ins Over Time
    kind: craft
    scope: "Supporting beyond the first weeks: anniversaries, the long tail of grief, keeping contact after others drop away."
    examples: [anniversary remembrance, long-tail contact, pacing support over months]
    status: live
  - id: community-rallying
    name: Rallying a Community Around Someone
    kind: craft
    scope: "Informally organising friends and neighbours around a person in hardship: meal trains, rosters, coordinating without overwhelming."
    examples: [meal trains, support rosters, coordinating without crowding]
    status: live
  - id: supporting-through-illness
    name: Supporting Through Illness and Setback
    kind: craft
    scope: "Peer support through serious illness, job loss or other hardship short of bereavement: visits, morale, respecting dignity."
    examples: [hospital visits, job-loss support, preserving the person's dignity]
    status: live
