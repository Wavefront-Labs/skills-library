category: relationships-social
field: conversation-and-active-listening
products:
  - id: small-talk
    name: Small Talk
    kind: craft
    scope: "Starting and sustaining light conversation with strangers and acquaintances: openers, safe topics, graceful exits."
    examples: [conversation openers, topic selection, exiting gracefully]
    status: live
  - id: active-listening
    name: Active Listening
    kind: craft
    scope: "Listening so the other person feels heard: full attention, reflecting back, paraphrasing and summarising without hijacking."
    examples: [reflective listening, paraphrasing, non-verbal attending]
    status: live
  - id: questioning
    name: Questioning Technique
    kind: craft
    scope: "Asking questions that open a conversation up: open-ended questions, follow-ups, curiosity without interrogation."
    examples: [open-ended questions, follow-up questions, avoiding interrogation feel]
    status: live
  - id: turn-taking-and-flow
    name: Turn-Taking and Conversational Flow
    kind: craft
    scope: "Managing the rhythm of a conversation: balancing airtime, handling interruptions, repairing stalls and awkward silences."
    examples: [balancing airtime, interruption repair, reviving a stalled conversation]
    status: live
  - id: reading-social-cues
    name: Reading Social Cues
    kind: craft
    scope: "Noticing and interpreting tone, body language and context signals, and adjusting your conversation in response."
    examples: [body-language reading, tone detection, noticing disengagement]
    status: live
  - id: storytelling-in-conversation
    name: Conversational Storytelling
    kind: craft
    scope: "Telling anecdotes and personal stories in conversation: pacing, relevance, knowing when and how long."
    examples: [anecdote pacing, landing a story, matching story to audience]
    status: live
  - id: difficult-conversation-entry
    name: Raising Difficult Topics
    kind: craft
    scope: "Opening a sensitive or awkward subject with someone: timing, framing the first sentence, lowering defensiveness."
    examples: [timing the raise, softening the opener, naming the awkwardness]
    status: live
