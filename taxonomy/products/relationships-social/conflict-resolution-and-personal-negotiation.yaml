category: relationships-social
field: conflict-resolution-and-personal-negotiation
products:
  - id: de-escalation
    name: De-escalation
    kind: craft
    scope: "Bringing the temperature of a personal conflict down: calming language, timeouts, interrupting escalation spirals."
    examples: [calming language, taking a timeout, breaking the escalation spiral]
    status: live
  - id: repair-conversations
    name: Repair Conversations
    kind: craft
    scope: "The conversation after the fight: apologising well, owning your part, re-establishing goodwill."
    examples: [effective apology, owning your part, the follow-up after a blow-up]
    status: live
  - id: fair-fighting
    name: Fair-Fighting Structure
    kind: craft
    scope: "Arguing within rules that keep a disagreement productive: one issue at a time, no contempt, I-statements, time and place."
    examples: [one issue at a time, I-statements, banning contempt and stonewalling]
    status: live
  - id: assertive-communication
    name: Assertive Communication
    kind: craft
    scope: "Stating your needs and refusals directly without aggression: saying no, making requests, standing ground under pushback."
    examples: [saying no, making a direct request, holding ground without hostility]
    status: live
  - id: compromise-seeking
    name: Compromise and Agreement-Seeking
    kind: craft
    scope: "Finding workable middle ground in your own disputes: naming interests, generating options, settling on terms both can keep."
    examples: [separating positions from interests, option generation, durable agreements]
    status: live
  - id: receiving-grievances
    name: Receiving a Grievance
    kind: craft
    scope: "Responding when someone confronts you: listening non-defensively, acknowledging impact, deciding what to change."
    examples: [non-defensive listening, acknowledging impact, responding to criticism]
    status: live
