category: relationships-social
field: gift-exchange-and-reciprocity-practice
products:
  - id: gift-selection
    name: Gift Selection
    kind: craft
    scope: "Choosing gifts that land: matching gift to person and relationship stage, budget calibration, avoiding misfires."
    examples: [matching gift to recipient, budget calibration, avoiding gift misfires]
    status: live
  - id: occasion-gifting
    name: Occasion and Holiday Gifting
    kind: craft
    scope: "The gifting calendar: birthdays, weddings, holidays, registries and group gifts, culture-specific occasions."
    examples: [wedding and registry norms, group gifts, holiday gifting rounds]
    status: live
  - id: receiving-gifts
    name: Receiving Gifts Well
    kind: craft
    scope: "Gracious receiving: in-the-moment reactions, thanks, handling unwanted gifts and regifting discreetly."
    examples: [gracious reactions, thank-yous, handling unwanted gifts]
    status: live
  - id: reciprocity-norms
    name: Reciprocity Norms
    kind: craft
    scope: "Keeping exchange balanced over time: matching value and effort, avoiding over- and under-giving, reading obligation."
    examples: [matching value, avoiding over-giving, reading gift obligation]
    status: live
  - id: favour-exchange
    name: Favour Exchange
    kind: craft
    scope: "The informal economy of favours between friends and neighbours: asking, repaying, keeping rough accounts without scorekeeping."
    examples: [asking for favours, repaying in kind, balance without scorekeeping]
    status: live
  - id: hospitality-reciprocity
    name: Hospitality Reciprocity
    kind: craft
    scope: "The give-and-take of hosting: host gifts, returning invitations, reciprocating meals and stays."
    examples: [host gifts, returning invitations, reciprocating a stay]
    status: live
