category: sales-marketing
field: insurance-sales
products:
  - id: needs-analysis
    name: Insurance Needs Analysis
    kind: craft
    scope: "Fact-finding a client's risk and cover needs to recommend policies: discovery interviews, gap analysis against existing cover, documenting the advice basis."
    examples: [fact-find interviews, cover gap analysis, advice documentation]
    status: live
  - id: policy-placement
    name: Policy Placement
    kind: craft
    scope: "Getting the risk covered: presenting quotes, matching insurer appetite to the risk, handling declines and subjectivities, binding cover."
    examples: [quote presentation, insurer appetite matching, handling subjectivities, binding]
    status: live
  - id: renewal-retention
    name: Renewal and Retention
    kind: craft
    scope: "Keeping the book at renewal: pre-renewal reviews, premium-increase conversations, remarketing threats, win-back of lapsed clients."
    examples: [pre-renewal review, premium-increase conversation, remarketing defence, lapse win-back]
    status: live
  - id: cross-selling-cover
    name: Cross-Selling Cover
    kind: craft
    scope: "Rounding out the account: spotting uncovered exposures in an existing client and selling the additional lines without triggering a full remarket."
    examples: [account rounding, exposure spotting, mono-line to multi-line conversion]
    status: live
  - id: broker-and-carrier-relations
    name: Broker and Carrier Relations
    kind: craft
    scope: "Working the market as an intermediary: building insurer relationships, negotiating terms and commission, escalating hard-to-place risks."
    examples: [underwriter relationships, commission negotiation, hard-to-place escalation]
    status: live
  - id: agency-management-systems
    name: Agency Management Systems
    kind: application
    scope: "Running the sales side of agency and broker platforms (Applied Epic, EZLynx, Vertafore and comparative raters): quoting workflows, renewal lists, pipeline and commission tracking."
    examples: [comparative rating, renewal work lists, commission tracking]
    status: live
