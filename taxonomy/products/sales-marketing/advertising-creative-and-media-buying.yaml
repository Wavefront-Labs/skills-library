category: sales-marketing
field: advertising-creative-and-media-buying
products:
  - id: media-planning
    name: Media Planning
    kind: craft
    scope: "Deciding where the campaign money goes: audience and reach/frequency planning, channel mix across TV, radio, out-of-home, print and digital, flighting and budget allocation."
    examples: [channel mix, reach and frequency, flighting, budget allocation]
    status: live
  - id: media-buying-negotiation
    name: Media Buying and Rate Negotiation
    kind: craft
    scope: "Buying the placements: rate negotiation with publishers and networks, upfronts and spot buys, added-value negotiation, makegoods when delivery falls short."
    examples: [rate negotiation, upfront commitments, added value, makegoods]
    status: live
  - id: creative-briefing
    name: Creative Briefing
    kind: craft
    scope: "Commissioning the ad: writing the creative brief, single-minded proposition, feedback rounds that improve work without rewriting it, approval against the brief."
    examples: [brief writing, proposition sharpening, creative feedback, brief-based approval]
    status: live
  - id: campaign-budgeting-and-reporting
    name: Campaign Budgeting and Performance Reporting
    kind: craft
    scope: "The money and the proof: campaign budget management, pacing, post-campaign reporting against objectives, media-mix learnings for the next brief."
    examples: [budget pacing, post-campaign reports, delivery reconciliation]
    status: live
  - id: copy-testing
    name: Copy and Creative Testing
    kind: craft
    scope: "Testing ads before and during spend: pre-flight copy testing, A/B creative tests in market, reading lift and recall results into kill-or-scale decisions."
    examples: [pre-flight copy tests, A/B creative tests, recall and lift reads]
    status: live
  - id: programmatic-platforms
    name: Programmatic Buying Platforms
    kind: application
    scope: "Trading display, video and CTV through demand-side platforms (The Trade Desk, DV360, Amazon DSP): deal setup, audience targeting, bid strategy, brand-safety and fraud controls."
    examples: [DSP deal setup, audience targeting, bid strategies, brand-safety settings]
    status: live
