category: sales-marketing
field: financial-products-sales
products:
  - id: mortgage-and-lending-sales
    name: Mortgage and Lending Sales
    kind: craft
    scope: "Selling home loans and credit products: lead conversion, structuring the application conversation, rate and feature comparison, refinance win-back."
    examples: [pre-approval conversion, rate conversation, refinance win-back, broker lead handling]
    status: live
  - id: wealth-and-investment-product-sales
    name: Wealth and Investment Product Sales
    kind: craft
    scope: "Selling managed funds, pensions and investment products to retail clients: goals-based discovery, product presentation, fee conversations."
    examples: [goals-based discovery, fund presentation, fee justification, review-meeting selling]
    status: live
  - id: relationship-banking
    name: Relationship Banking
    kind: craft
    scope: "Growing a banking book through the branch or portfolio relationship: account cross-sell, needs-based referrals to specialists, business-client retention."
    examples: [account cross-sell, specialist referrals, portfolio reviews, client retention]
    status: live
  - id: suitability-compliant-selling
    name: Suitability-Compliant Selling
    kind: craft
    scope: "Selling inside the rules: know-your-client and suitability obligations, disclosure scripts, cold-calling and anti-hawking compliance, documenting the sale."
    examples: [KYC in the sales conversation, disclosure scripting, cold-call compliance, sale documentation]
    status: live
  - id: institutional-product-distribution
    name: Institutional Product Distribution
    kind: craft
    scope: "Selling funds and financial products to institutional buyers and adviser networks: roadshows, platform placement, adviser education as distribution."
    examples: [adviser roadshows, platform shelf placement, consultant relations]
    status: live
