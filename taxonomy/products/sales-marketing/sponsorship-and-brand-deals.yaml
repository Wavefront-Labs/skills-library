category: sales-marketing
field: sponsorship-and-brand-deals
products:
  - id: sponsorship-packaging
    name: Sponsorship Packaging and Valuation
    kind: craft
    scope: "Building what's for sale: rights inventories, tiered packages, naming-rights structures, valuing assets so the rights fee holds up in negotiation."
    examples: [rights inventories, package tiering, naming-rights structures, asset valuation]
    status: live
  - id: rights-fee-negotiation
    name: Rights-Fee Negotiation
    kind: craft
    scope: "Negotiating the deal from either commercial side: fee and term negotiation, category exclusivity, performance clauses, renewal and escalation terms."
    examples: [fee negotiation, category exclusivity, performance clauses, renewals]
    status: live
  - id: activation-planning
    name: Activation Planning
    kind: craft
    scope: "Making the sponsorship work in market: activation concepts, leveraging rights across media and events, hospitality programs, activation budget ratios."
    examples: [activation concepts, rights leverage, hospitality programs]
    status: live
  - id: influencer-and-creator-deals
    name: Influencer and Creator Deals
    kind: craft
    scope: "Brand partnerships with creators, from either side of the deal: creator selection and vetting, deliverable and usage-rights negotiation, disclosure compliance, performance review."
    examples: [creator vetting, deliverable negotiation, usage rights, disclosure compliance]
    status: live
  - id: sponsorship-roi-measurement
    name: Sponsorship ROI Measurement
    kind: craft
    scope: "Proving the deal paid: exposure and media-value measurement, brand-lift reads, activation attribution, the renewal business case."
    examples: [media-value measurement, brand-lift reads, renewal business case]
    status: live
