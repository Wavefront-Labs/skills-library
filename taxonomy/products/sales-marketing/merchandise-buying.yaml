category: sales-marketing
field: merchandise-buying
products:
  - id: assortment-planning
    name: Assortment Planning
    kind: craft
    scope: "Deciding the range: breadth vs depth by category, good-better-best architecture, size and option plans, localisation by store cluster."
    examples: [range architecture, option planning, size curves, store-cluster localisation]
    status: live
  - id: open-to-buy-budgeting
    name: Open-to-Buy Budgeting
    kind: craft
    scope: "Managing the buy money: OTB planning and reforecasting, receipt flow against sales and stock targets, in-season chase and cancel decisions."
    examples: [OTB reforecasts, receipt flow, chase and cancel calls]
    status: live
  - id: trend-forecasting-for-buying
    name: Trend Forecasting for Buying
    kind: craft
    scope: "Reading what will sell next season: trend services and comp shopping, runway and social signal reading, translating trend into buyable commercial product."
    examples: [comp shopping, trend translation, seasonal direction calls]
    status: live
  - id: vendor-negotiation
    name: Vendor Negotiation
    kind: craft
    scope: "Negotiating the buy with suppliers: cost price and margin negotiation, terms (returns, markdown money, rebates, exclusives), range reviews with vendors."
    examples: [cost negotiation, markdown money, exclusivity deals, range reviews]
    status: live
  - id: in-season-trading
    name: In-Season Trading and Markdown Decisions
    kind: craft
    scope: "Trading the range week by week: best/worst seller reads, repeat and rebuy decisions, markdown triggers, weekly trade meetings."
    examples: [weekly trade reads, rebuy decisions, markdown triggers]
    status: live
