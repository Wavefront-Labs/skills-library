category: sales-marketing
field: retail-merchandising
products:
  - id: visual-merchandising
    name: Visual Merchandising
    kind: craft
    scope: "Presenting product in store to sell: focal points and sight lines, fixture styling, colour blocking, mannequin and table presentation, store standards."
    examples: [focal points, colour blocking, fixture styling, store standards]
    status: live
  - id: planogramming
    name: Planogramming
    kind: craft
    scope: "Engineering the shelf: planogram design, facings and shelf-position logic, space-to-sales allocation, compliance auditing in store."
    examples: [planogram design, facings allocation, space-to-sales, compliance audits]
    status: live
  - id: window-displays
    name: Window Displays
    kind: craft
    scope: "The shop window as a selling tool: seasonal window concepts, product-story composition, sight-line and lighting judgement, changeover scheduling."
    examples: [window concepts, product storytelling, changeover scheduling]
    status: live
  - id: online-merchandising
    name: Online Merchandising
    kind: craft
    scope: "Merchandising the digital shelf: category and collection curation, product sort orders, search merchandising, cross-sell placements on product pages."
    examples: [collection curation, sort-order rules, search merchandising, cross-sell slots]
    status: live
  - id: markdown-and-clearance-strategy
    name: Markdown and Clearance Strategy
    kind: craft
    scope: "Exiting stock at the best achievable margin: markdown timing and depth, clearance zoning in store, outlet and jobber channels for terminal stock."
    examples: [markdown cadence, clearance zoning, terminal-stock exits]
    status: live
  - id: space-planning-software
    name: Space Planning Software
    kind: application
    scope: "Building and maintaining planograms in the space-planning tools (Blue Yonder/JDA Space Planning, Relex, Nexgen): fixture libraries, product placement, store-cluster versions, compliance exports."
    examples: [fixture libraries, planogram builds, store-cluster versions]
    status: live
