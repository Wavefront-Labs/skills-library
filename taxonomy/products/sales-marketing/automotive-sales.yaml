category: sales-marketing
field: automotive-sales
products:
  - id: test-drive-conversion
    name: Test-Drive Conversion
    kind: craft
    scope: "Turning a lot visitor into a buyer through the drive: meet-and-greet, vehicle walkaround, demonstration drive routing and the post-drive close."
    examples: [walkaround presentation, demo-drive routing, post-drive trial close]
    status: live
  - id: trade-in-appraisal-negotiation
    name: Trade-In Appraisal and Negotiation
    kind: craft
    scope: "Handling the trade-in inside the deal: appraisal walkaround with the customer, presenting the trade figure, keeping trade and purchase numbers separate."
    examples: [appraisal walkaround, trade-figure presentation, over-allowance handling]
    status: live
  - id: finance-and-insurance-upsell
    name: Finance and Insurance Upsell
    kind: craft
    scope: "The F&I office sell: finance penetration, warranty and protection-product menus, payment packing avoidance and compliant disclosure."
    examples: [finance menu presentation, warranty attach, protection products, compliant disclosure]
    status: live
  - id: deal-closing-and-desking
    name: Deal Closing and Desking
    kind: craft
    scope: "Structuring and closing the vehicle deal: four-square and payment-based negotiation, manager turnovers, handling the 'think about it' walk-out."
    examples: [payment-based negotiation, manager turnover, walk-out saves, delivery handoff]
    status: live
  - id: lot-merchandising
    name: Lot and Showroom Merchandising
    kind: craft
    scope: "Presenting inventory to sell: lot layout and lining, showroom display rotation, online vehicle listings with photos and pricing badges."
    examples: [lot lining, showroom rotation, online vehicle listings, price badging]
    status: live
  - id: dealership-crm-dms
    name: Dealership CRM and DMS
    kind: application
    scope: "Working deals through dealership systems (VinSolutions, DealerSocket, CDK, Reynolds & Reynolds): internet lead response, showroom traffic logging, desking tools, follow-up cadences."
    examples: [internet lead response, showroom logging, desking tools, be-back follow-up]
    status: live
