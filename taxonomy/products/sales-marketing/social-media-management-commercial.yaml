category: sales-marketing
field: social-media-management-commercial
products:
  - id: content-calendar-planning
    name: Content Calendar Planning
    kind: craft
    scope: "Planning what a branded account posts and when: content pillars, calendar cadence, campaign and always-on balance, trend-jacking decisions."
    examples: [content pillars, posting cadence, campaign vs always-on, trend-jacking calls]
    status: live
  - id: community-management
    name: Community Management
    kind: craft
    scope: "Running the brand's presence in replies and DMs: engagement responses, complaint triage into support, crisis-moment judgement, brand-voice consistency at speed."
    examples: [reply handling, complaint triage, crisis judgement, voice at speed]
    status: live
  - id: platform-algorithm-strategy
    name: Platform Algorithm Strategy
    kind: craft
    scope: "Growing reach platform by platform: format and hook choices for each feed's ranking, posting-time and frequency tuning, reading analytics into the next post."
    examples: [hook design per platform, format selection, analytics-driven iteration]
    status: live
  - id: influencer-outreach
    name: Influencer Outreach and Management
    kind: craft
    scope: "Building the brand's creator bench: identifying and vetting creators, outreach and briefing, seeding and gifting programs, ongoing relationship management."
    examples: [creator identification, outreach and briefing, gifting programs]
    status: live
  - id: social-commerce
    name: Social Commerce
    kind: craft
    scope: "Selling directly in the feed: shoppable posts and catalogs, live shopping, TikTok Shop and Instagram Shopping operations, conversion from content."
    examples: [shoppable posts, live shopping, TikTok Shop operations]
    status: live
  - id: social-management-platforms
    name: Social Management Platforms
    kind: application
    scope: "The scheduling and listening stack (Hootsuite, Sprout Social, Buffer, Later): multi-account scheduling, inbox consolidation, social listening and reporting."
    examples: [multi-account scheduling, unified inbox, listening queries, reporting]
    status: live
