category: sales-marketing
field: auctioneering
products:
  - id: bid-calling
    name: Bid Calling
    kind: craft
    scope: "Running the live auction from the rostrum: the auctioneer's chant, bid spotting and increments, ringwork with spotters, pace control and the hammer decision."
    examples: [auction chant, bid spotting, increment control, hammer timing]
    status: live
  - id: lot-cataloguing-and-estimates
    name: Lot Cataloguing and Estimates
    kind: craft
    scope: "Preparing lots for sale: lot descriptions and condition notes, estimate setting, lot ordering for sale momentum, catalogue production for buyers."
    examples: [lot descriptions, estimate setting, sale-order sequencing]
    status: live
  - id: reserve-setting-and-vendor-management
    name: Reserve Setting and Vendor Management
    kind: craft
    scope: "The consignor side of the house: winning consignments, reserve negotiation, vendor expectations through the sale, unsold-lot and post-sale negotiation."
    examples: [consignment winning, reserve negotiation, post-sale deals on passed lots]
    status: live
  - id: specialist-auction-formats
    name: Specialist Auction Formats
    kind: craft
    scope: "Running the formats beyond the saleroom: livestock and estate auctions, real-estate auctions on site, charity galas, Dutch and sealed-bid variants."
    examples: [livestock sales, on-site property auctions, charity auctioneering, Dutch auctions]
    status: live
  - id: online-auction-management
    name: Online Auction Management
    kind: application
    scope: "Selling through online and hybrid bidding platforms (LiveAuctioneers, Invaluable, eBay, timed-auction software): listing setup, timed vs live-stream formats, absentee and phone-bid coordination."
    examples: [timed-auction setup, live-stream integration, absentee-bid coordination]
    status: live
