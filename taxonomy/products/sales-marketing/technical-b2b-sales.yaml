category: sales-marketing
field: technical-b2b-sales
products:
  - id: discovery-calls
    name: Discovery Calls
    kind: craft
    scope: "Qualifying and diagnosing a business buyer: question frameworks (SPIN, MEDDIC-style qualification), pain quantification, multi-stakeholder mapping, next-step commitment."
    examples: [qualification frameworks, pain quantification, stakeholder mapping, securing next steps]
    status: live
  - id: solution-selling
    name: Solution Selling
    kind: craft
    scope: "Translating technical capability into a commercial case: value propositions against the buyer's problem, ROI and business-case building, competitive positioning."
    examples: [value proposition design, ROI business case, competitive displacement]
    status: live
  - id: objection-handling
    name: Objection Handling
    kind: craft
    scope: "Working through buyer resistance across the cycle: price, status-quo, competitor and risk objections; isolate-acknowledge-respond technique; late-stage stall breaking."
    examples: [price objections, status-quo inertia, competitor comparisons, stall breaking]
    status: live
  - id: rfp-and-proposal-response
    name: RFP and Proposal Response
    kind: craft
    scope: "Winning structured procurement: bid/no-bid calls, RFP response writing, compliance matrices, pricing the proposal and presentation to evaluation panels."
    examples: [bid/no-bid decisions, compliance matrices, proposal writing, panel presentations]
    status: live
  - id: proof-of-concept-demos
    name: Proof-of-Concept and Demos
    kind: craft
    scope: "Selling with the product: tailored demonstrations, scoping and running evaluations and pilots with success criteria that convert to the sale."
    examples: [tailored demo flows, POC success criteria, pilot-to-contract conversion]
    status: live
  - id: account-based-selling
    name: Account-Based Selling
    kind: craft
    scope: "Working named enterprise accounts: account planning, multi-threading across the org, executive sponsorship, land-and-expand sequencing."
    examples: [account plans, multi-threading, executive alignment, expansion plays]
    status: live
  - id: channel-partner-enablement
    name: Channel and Partner Selling
    kind: craft
    scope: "Selling through resellers, distributors and integrators: partner recruitment, deal registration, co-selling and keeping partners trained and motivated to lead with you."
    examples: [partner recruitment, deal registration, co-sell motions, partner training]
    status: live
  - id: sales-engagement-platforms
    name: Sales Engagement Platforms
    kind: application
    scope: "Running outbound at volume through sequencing tools (Outreach, Salesloft, Apollo): multi-touch cadences, personalisation at scale, reply handling and meeting booking."
    examples: [cadence design, personalisation at scale, reply triage]
    status: live
