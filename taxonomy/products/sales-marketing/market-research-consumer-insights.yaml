category: sales-marketing
field: market-research-consumer-insights
products:
  - id: survey-design-and-analysis
    name: Survey Design and Analysis
    kind: craft
    scope: "Quantitative consumer surveys for commercial decisions: questionnaire design without bias, sampling and quotas, significance reads, reporting that answers the business question."
    examples: [questionnaire design, sampling and quotas, significance reads, insight reporting]
    status: live
  - id: focus-group-moderation
    name: Focus Group Moderation
    kind: craft
    scope: "Qualitative research with consumers: discussion guides, moderation technique, projective exercises, in-depth interviews, synthesising talk into findings."
    examples: [discussion guides, moderation technique, projectives, qual synthesis]
    status: live
  - id: segmentation-studies
    name: Segmentation Studies
    kind: craft
    scope: "Dividing a market into actionable groups: segmentation design, needs/attitude/behaviour bases, sizing segments, making segments usable by sales and marketing."
    examples: [segmentation bases, segment sizing, activation handoff]
    status: live
  - id: brand-tracking
    name: Brand Tracking
    kind: craft
    scope: "Measuring the brand over time: awareness, consideration and image tracking, tracker design and norm reading, reporting movement the brand team can act on."
    examples: [awareness tracking, image attributes, norm comparisons, wave reporting]
    status: live
  - id: pricing-research
    name: Pricing Research
    kind: craft
    scope: "Researching what buyers will pay: Van Westendorp and Gabor-Granger methods, conjoint for price-feature trade-offs, promotion-response reads."
    examples: [Van Westendorp, conjoint trade-offs, promotion-response analysis]
    status: live
  - id: copy-and-concept-testing
    name: Concept and Copy Testing
    kind: craft
    scope: "Testing products and messages before launch: concept screening, monadic and sequential test designs, ad copy testing, action standards for go/no-go."
    examples: [concept screens, monadic tests, copy-test action standards]
    status: live
  - id: survey-platforms
    name: Survey Platforms
    kind: application
    scope: "Fielding research through the survey stack (Qualtrics, SurveyMonkey, Google Forms, panel marketplaces): survey programming, logic and quotas, panel sourcing, export for analysis."
    examples: [survey programming, quota setup, panel sourcing]
    status: live
