category: sales-marketing
field: pricing-and-promotions-execution
products:
  - id: promotional-offer-execution
    name: Promotional Offer Execution
    kind: craft
    scope: "Running the promotion at the customer-facing end: offer setup and signage accuracy, promo-code handling, stacking rules, honouring and ending offers cleanly."
    examples: [offer setup, promo-code handling, stacking rules, offer sunset]
    status: live
  - id: discount-application-and-overrides
    name: Discount Application and Overrides
    kind: craft
    scope: "Applying discounts correctly at point of sale: discount authority limits, price-match requests, override judgement and audit trails."
    examples: [authority limits, price-match handling, override judgement]
    status: live
  - id: bundling-at-checkout
    name: Bundling at Checkout
    kind: craft
    scope: "Building the bigger basket at the moment of payment: bundle offers, multi-buy mechanics, add-on prompts framed as value rather than pressure."
    examples: [bundle offers, multi-buy mechanics, value framing]
    status: live
  - id: loyalty-tier-offers
    name: Loyalty and Tier Offers
    kind: craft
    scope: "Working the loyalty program at the customer interface: points and tier-benefit application, targeted-offer redemption, enrolment pitches that land."
    examples: [tier-benefit application, offer redemption, enrolment pitches]
    status: live
  - id: live-price-negotiation
    name: Live Price Negotiation
    kind: craft
    scope: "The discretionary discount conversation with a customer: when to hold list, trading discount for commitment, staying inside the margin floor set upstream."
    examples: [holding list price, discount-for-commitment trades, margin-floor discipline]
    status: live
