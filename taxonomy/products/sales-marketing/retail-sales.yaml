category: sales-marketing
field: retail-sales
products:
  - id: floor-selling
    name: Floor Selling
    kind: craft
    scope: "Approaching, qualifying and serving customers on a retail floor: greeting, needs discovery, product matching and closing at the counter."
    examples: [approach and greeting, needs discovery, product matching, counter closing]
    status: live
  - id: upselling-cross-selling
    name: Upselling and Cross-Selling
    kind: craft
    scope: "Raising basket size at the moment of sale: add-ons, accessories, warranties and step-up products offered without killing the primary sale."
    examples: [accessory attach, warranty attach, step-up suggestion, basket building]
    status: live
  - id: product-demonstration
    name: Product Demonstration
    kind: craft
    scope: "Showing a product working to sell it: demo setup, feature-to-benefit translation, handling the product into the customer's hands."
    examples: [demo scripting, feature-benefit translation, trial close from demo]
    status: live
  - id: returns-and-exchanges
    name: Returns and Exchanges Handling
    kind: craft
    scope: "Handling returns, exchanges and refunds at the counter so the customer stays a customer: policy application, save attempts, fraud awareness."
    examples: [return-to-exchange saves, policy edge cases, refund fraud awareness]
    status: live
  - id: loss-prevention-aware-selling
    name: Loss-Prevention-Aware Selling
    kind: craft
    scope: "Selling while deterring theft: floor awareness, approach-as-deterrent, high-shrink merchandise handling within store policy."
    examples: [customer-service-as-deterrent, high-shrink handling, incident reporting]
    status: live
  - id: pos-operation
    name: Point-of-Sale Operation
    kind: application
    scope: "Operating retail POS and till systems: tendering, discounts and overrides, loyalty lookups, end-of-day reconciliation. Square, Shopify POS and Lightspeed are the common modern systems."
    examples: [tender handling, discount overrides, loyalty lookup, till reconciliation]
    status: live
