category: sales-marketing
field: talent-representation-brokering
products:
  - id: talent-pitching
    name: Talent Pitching
    kind: craft
    scope: "Selling a client to buyers: submission packages, pitch calls to publishers, casting directors, clubs or employers, positioning the client against the market."
    examples: [submission packages, pitch calls, client positioning]
    status: live
  - id: representation-deal-negotiation
    name: Representation Deal Negotiation
    kind: craft
    scope: "Negotiating the client's deal: fees, advances, royalties and transfer terms, options and riders, commission structures, walking a deal away."
    examples: [fee negotiation, royalty terms, rider negotiation, commission structures]
    status: live
  - id: booking-management
    name: Booking Management
    kind: craft
    scope: "Placing and scheduling the client's work: availability and calendar brokering, booking confirmation and contracts, double-booking avoidance, cancellation handling."
    examples: [availability brokering, booking confirmations, cancellation handling]
    status: live
  - id: roster-development
    name: Roster Development
    kind: craft
    scope: "Building and managing the book of clients: scouting and signing talent, career-arc brokering across deals, pruning the roster, conflicts between clients."
    examples: [scouting and signing, career-arc brokering, roster pruning, client conflicts]
    status: live
  - id: fee-based-headhunting
    name: Fee-Based Headhunting
    kind: craft
    scope: "Recruiting as a sold service: client-side mandate winning, candidate sourcing and selling the opportunity, placement-fee negotiation, offer brokering between sides."
    examples: [mandate winning, candidate selling, placement-fee negotiation, offer brokering]
    status: live
