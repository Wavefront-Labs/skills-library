category: sales-marketing
field: branding
products:
  - id: brand-positioning
    name: Brand Positioning
    kind: craft
    scope: "Deciding what the brand stands for and against whom: category framing, differentiation, positioning statements and value propositions that survive contact with the market."
    examples: [positioning statements, category framing, differentiation mapping]
    status: live
  - id: brand-naming
    name: Naming
    kind: craft
    scope: "Naming brands, products and lines: generation methods, shortlist screening for meaning, pronunciation and availability, stakeholder selling of the name."
    examples: [name generation, linguistic screening, availability screening, name selling]
    status: live
  - id: visual-identity-briefing
    name: Visual Identity Direction
    kind: craft
    scope: "Commissioning and steering the brand's look: identity briefs, evaluating logo and system work against strategy, rollout across touchpoints — direction and judgement, not the design execution itself."
    examples: [identity briefs, logo evaluation, touchpoint rollout]
    status: live
  - id: brand-voice-and-guidelines
    name: Brand Voice and Guidelines
    kind: craft
    scope: "Codifying how the brand speaks and shows up: tone-of-voice definition, brand guidelines and usage rules, governance that keeps teams on-brand."
    examples: [tone-of-voice definition, guideline writing, brand governance]
    status: live
  - id: brand-architecture
    name: Brand Architecture
    kind: craft
    scope: "Organising a portfolio of brands: branded house vs house of brands, sub-brand and endorsement structures, migration and retirement of brands after mergers or pivots."
    examples: [portfolio structure, sub-brand systems, brand migration]
    status: live
