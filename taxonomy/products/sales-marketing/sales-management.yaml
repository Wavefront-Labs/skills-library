category: sales-marketing
field: sales-management
products:
  - id: pipeline-forecasting
    name: Pipeline Forecasting
    kind: craft
    scope: "Calling the number: pipeline inspection, stage and probability hygiene, commit/best-case rollups, forecast accuracy improvement."
    examples: [pipeline inspection, weighted forecasting, commit calls, forecast post-mortems]
    status: live
  - id: territory-and-quota-design
    name: Territory and Quota Design
    kind: craft
    scope: "Carving the market into fair, workable patches: territory design, quota setting and relief, capacity planning, carve rebalancing."
    examples: [territory carving, quota setting, capacity planning, mid-year rebalances]
    status: live
  - id: sales-coaching
    name: Sales Coaching
    kind: craft
    scope: "Making reps better: call reviews and ride-alongs, deal coaching, skill-gap diagnosis, performance conversations and improvement plans."
    examples: [call reviews, deal coaching, ride-alongs, performance plans]
    status: live
  - id: sales-process-design
    name: Sales Process Design
    kind: craft
    scope: "Defining how the team sells: stage definitions and exit criteria, qualification standards, playbooks, handoffs between SDR, AE and customer success."
    examples: [stage exit criteria, playbook writing, SDR-AE handoffs]
    status: live
  - id: sales-hiring-and-onboarding
    name: Sales Hiring and Ramping
    kind: craft
    scope: "Building the team: interviewing and auditioning sellers, ramp plans and time-to-productivity, early-tenure retention of good hires."
    examples: [role-play interviews, ramp plans, 30-60-90 onboarding]
    status: live
  - id: crm-systems
    name: CRM Systems
    kind: application
    scope: "Running the sales operation in CRM platforms — Salesforce and HubSpot dominate, with Pipedrive, Zoho and Dynamics behind: pipeline configuration, reporting and dashboards, data hygiene, adoption enforcement."
    examples: [Salesforce pipeline config, HubSpot deal stages, dashboarding, data hygiene]
    status: live
