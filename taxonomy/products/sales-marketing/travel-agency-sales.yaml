category: sales-marketing
field: travel-agency-sales
products:
  - id: package-and-upsell-selling
    name: Package Selling and Upselling
    kind: craft
    scope: "Selling the trip and growing it: matching packages to the enquiry, room and cabin upgrades, tour and excursion add-ons, premium-class upsell."
    examples: [package matching, upgrade selling, excursion add-ons, class upsell]
    status: live
  - id: commission-based-booking
    name: Commission-Based Booking
    kind: craft
    scope: "Booking to earn: supplier commission structures, preferred-supplier steering within client interest, override targets, fee-vs-commission pricing of the agency's service."
    examples: [commission structures, preferred-supplier steering, service-fee pricing]
    status: live
  - id: travel-insurance-and-add-ons
    name: Travel Insurance and Add-Ons
    kind: craft
    scope: "Attaching the extras: travel insurance offer and disclosure, transfers, car hire and ancillaries sold at booking and in pre-departure contact."
    examples: [insurance attach, disclosure scripts, pre-departure add-on calls]
    status: live
  - id: group-booking-sales
    name: Group Booking Sales
    kind: craft
    scope: "Selling group travel: group quotes and holds, negotiating group rates with suppliers, managing deposits and name lists, group-leader incentives."
    examples: [group quotes, rate negotiation, deposit management, group-leader deals]
    status: live
  - id: loyalty-and-repeat-client-sales
    name: Loyalty and Repeat-Client Sales
    kind: craft
    scope: "Keeping travellers booking with you: loyalty program enrolment, welcome-home follow-up, anniversary and next-trip prompts, client preference records that make rebooking easy."
    examples: [loyalty enrolment, welcome-home calls, next-trip prompts]
    status: live
  - id: gds-and-booking-systems
    name: GDS and Booking Systems
    kind: application
    scope: "Booking through the trade systems: GDS work in Amadeus, Sabre and Travelport, tour-operator and cruise-line booking portals, PNR management, fare and availability displays."
    examples: [PNR building, fare displays, cruise-portal bookings]
    status: live
