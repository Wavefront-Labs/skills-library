category: sales-marketing
field: trade-show-and-event-sales
products:
  - id: booth-selling
    name: Booth Selling
    kind: craft
    scope: "Working the stand: aisle engagement without pouncing, rapid qualification on the floor, managing booth traffic peaks, staffing rotations that keep energy up."
    examples: [aisle engagement, 30-second qualification, traffic management, staffing rotations]
    status: live
  - id: live-demo-pitching
    name: Live Demo Pitching
    kind: craft
    scope: "Demonstrating to a standing crowd: scheduled demo theatre, pitch timing to draw and hold a crowd, handling hecklers and competitors in the audience."
    examples: [demo theatre, crowd-drawing timing, competitor-in-audience handling]
    status: live
  - id: lead-capture-and-scoring
    name: Lead Capture and Scoring
    kind: craft
    scope: "Getting usable leads out of the show: badge-scan and capture discipline, qualification notes at speed, hot/warm/cold scoring on the floor."
    examples: [capture discipline, qualification notes, floor scoring]
    status: live
  - id: post-event-follow-up
    name: Post-Event Follow-Up
    kind: craft
    scope: "Converting the lead pile after the show: follow-up cadence by lead score, reference-the-conversation personalisation, routing to the field, keeping leads warm until the cycle starts."
    examples: [cadence by score, conversation-referenced outreach, field routing]
    status: live
  - id: event-roi-and-selection
    name: Event ROI and Show Selection
    kind: craft
    scope: "Deciding which shows earn their cost: cost-per-lead and pipeline-sourced measurement, booth-size and sponsorship-level decisions, the go-again call."
    examples: [cost-per-lead measurement, pipeline attribution, go-again decisions]
    status: live
