category: sales-marketing
field: real-estate-sales-leasing
products:
  - id: listing-presentations
    name: Listing Presentations
    kind: craft
    scope: "Winning the mandate to sell a property: comparative market presentation, pricing conversation, commission defence and vendor management."
    examples: [CMA presentation, pricing the listing, commission defence, vendor reporting]
    status: live
  - id: buyer-representation
    name: Buyer Representation
    kind: craft
    scope: "Working the buyer side: qualifying buyers, shortlisting and showing property, advising on offers and guiding to settlement."
    examples: [buyer qualification, shortlist curation, offer advice, settlement shepherding]
    status: live
  - id: open-homes-and-showings
    name: Open Homes and Showings
    kind: craft
    scope: "Running open homes and private showings that convert: property presentation, visitor capture, reading buyer signals, follow-up."
    examples: [home staging for opens, visitor registration, buyer-signal reading, follow-up calls]
    status: live
  - id: offer-and-counter-offer-management
    name: Offer and Counter-Offer Management
    kind: craft
    scope: "Negotiating a property sale between parties: soliciting offers, managing multiple-offer situations, counter-offers, conditions and deadlines to exchange."
    examples: [multi-offer management, counter-offer strategy, condition negotiation, deadline pressure]
    status: live
  - id: lease-negotiation
    name: Lease Negotiation and Letting
    kind: craft
    scope: "Leasing residential and commercial property: tenant prospecting and qualification, rent and incentive negotiation, renewals."
    examples: [tenant qualification, incentive structuring, rent reviews, renewal negotiation]
    status: live
  - id: prospecting-and-farming
    name: Prospecting and Farming
    kind: craft
    scope: "Building a pipeline of future listings: geographic farming, sphere-of-influence work, expired and withdrawn listings, referral cultivation."
    examples: [geographic farming, expired-listing approach, referral cultivation, database touch plans]
    status: live
  - id: listing-portals-and-mls
    name: Listing Portals and MLS
    kind: application
    scope: "Marketing property through listing platforms: MLS entry, portal listings (Zillow, Rightmove, Domain and local equivalents), listing copy and photo order, enquiry handling."
    examples: [MLS data entry, portal listing optimisation, listing copy, enquiry triage]
    status: live
  - id: real-estate-crm
    name: Real Estate CRM
    kind: application
    scope: "Running an agent's pipeline in real-estate CRM systems (Follow Up Boss, kvCORE, agency-supplied CRMs): contact management, drip campaigns, appraisal-to-listing tracking."
    examples: [pipeline stages, drip campaigns, past-client nurture]
    status: live
