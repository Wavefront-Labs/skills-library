category: sales-marketing
field: street-informal-trade
products:
  - id: stall-pitch-and-display
    name: Stall Pitch and Display
    kind: craft
    scope: "Setting up a market stall or street pitch that pulls buyers: site selection, display layout, signage, the spoken pitch and crowd-drawing patter."
    examples: [site selection, display layout, crowd-drawing patter, signage]
    status: live
  - id: haggling-as-a-seller
    name: Haggling as a Seller
    kind: craft
    scope: "Bargaining from the seller's side of the stall: opening prices, reading the buyer, concession rhythm, bundle deals, walking-away theatre."
    examples: [opening price setting, concession rhythm, bundle closes, walk-away recovery]
    status: live
  - id: market-pricing
    name: Market Pricing
    kind: craft
    scope: "Pricing informal-trade stock day to day: cost-plus and what-the-market-bears pricing, end-of-day clearance, seasonal and event pricing."
    examples: [day pricing, end-of-day clearance, event pricing]
    status: live
  - id: stock-sourcing-for-resale
    name: Stock Sourcing for Resale
    kind: craft
    scope: "Finding sellable stock at a margin: wholesale markets, job lots, imports and second-hand sourcing, judging what the pitch's buyers will take."
    examples: [wholesale buying, job lots, second-hand sourcing, margin judgement]
    status: live
  - id: mobile-vending
    name: Mobile Vending
    kind: craft
    scope: "Selling on the move: hawking rounds, venue and event vending, carrying stock, quick transactions and cash handling without a fixed pitch."
    examples: [hawking rounds, event vending, cash handling on foot]
    status: live
