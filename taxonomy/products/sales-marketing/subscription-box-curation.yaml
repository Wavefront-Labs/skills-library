category: sales-marketing
field: subscription-box-curation
products:
  - id: subscriber-box-curation
    name: Subscriber Box Curation
    kind: craft
    scope: "Choosing what goes in the box: product selection against subscriber profiles and cost targets, perceived-value building, variant and allergy/preference handling."
    examples: [product selection, perceived-value building, preference variants, cost-per-box targets]
    status: live
  - id: curated-drop-selection
    name: Curated Drop Selection
    kind: craft
    scope: "Picking the featured item for a club or drop: book-club and feature-of-the-month selection, limited-drop curation, balancing discovery against broad appeal."
    examples: [feature-of-the-month picks, limited drops, discovery vs appeal balance]
    status: live
  - id: seasonal-theme-planning
    name: Seasonal Theme Planning
    kind: craft
    scope: "Planning the curation calendar: box themes by season and event, sourcing lead times against theme dates, theme reveal and teaser sequencing."
    examples: [theme calendars, sourcing lead times, reveal sequencing]
    status: live
  - id: member-retention-offers
    name: Member Retention Offers
    kind: craft
    scope: "Keeping subscribers subscribed: churn-signal reading, pause-instead-of-cancel flows, win-back offers, milestone and loyalty perks."
    examples: [churn signals, pause flows, win-back offers, milestone perks]
    status: live
  - id: curation-driven-upsell
    name: Curation-Driven Upsell
    kind: craft
    scope: "Selling beyond the subscription: add-to-box offers, member shops and flash sales, upgrading to higher tiers off the back of a loved curation."
    examples: [add-to-box offers, member flash sales, tier upgrades]
    status: live
