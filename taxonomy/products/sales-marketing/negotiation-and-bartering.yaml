category: sales-marketing
field: negotiation-and-bartering
products:
  - id: anchoring-and-framing
    name: Anchoring and Framing
    kind: craft
    scope: "Setting the negotiation's reference points as the seller: opening offers, price framing and justification, managing the first-number decision."
    examples: [opening offers, price justification framing, first-number strategy]
    status: live
  - id: concession-trading
    name: Concession Trading
    kind: craft
    scope: "Giving to get: planning a concession ladder, trading price against terms, never conceding without return, protecting the floor."
    examples: [concession ladders, price-for-terms trades, floor protection]
    status: live
  - id: closing-tactics
    name: Closing Tactics
    kind: craft
    scope: "Converting agreement in principle into a signed deal: trial closes, deadline and scarcity use, splitting the difference well, handling last-minute nibbles."
    examples: [trial closes, deadline use, nibble defence, final-offer delivery]
    status: live
  - id: multi-party-deal-structuring
    name: Multi-Party Deal Structuring
    kind: craft
    scope: "Negotiating with more than two seats at the table: coalition reading, sequencing side agreements, package deals across parties and brokered middles."
    examples: [coalition mapping, side-agreement sequencing, package deals]
    status: live
  - id: terms-and-contract-negotiation
    name: Terms and Contract Negotiation
    kind: craft
    scope: "Negotiating the non-price terms that decide a deal's value: payment terms, exclusivity, volume commitments, renewal and exit clauses — as the commercial seller, upstream of legal drafting."
    examples: [payment-terms trades, exclusivity pricing, volume commitments, renewal clauses]
    status: live
  - id: bartering-and-non-cash-deals
    name: Bartering and Non-Cash Deals
    kind: craft
    scope: "Trading without money changing hands: valuing goods-for-goods and services-in-kind swaps, part-exchange deals, contra arrangements between businesses."
    examples: [goods-for-goods valuation, part exchange, contra deals]
    status: live
