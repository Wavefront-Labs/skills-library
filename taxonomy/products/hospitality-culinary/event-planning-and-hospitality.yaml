category: hospitality-culinary
field: event-planning-and-hospitality
products:
  - id: banquet-coordination
    name: Banquet Coordination
    kind: craft
    scope: "Running banquets and functions: banquet event orders, room sets, service timing for plated and buffet meals, client liaison."
    examples: [banquet event orders, room set diagrams, plated-service timing, buffet management]
    status: live
  - id: wedding-coordination
    name: Wedding Coordination
    kind: craft
    scope: "Coordinating weddings: run-of-show for the day, vendor wrangling, ceremony-to-reception transitions and couple management under pressure."
    examples: [day-of run-of-show, vendor coordination, ceremony transitions, timeline recovery]
    status: live
  - id: conference-and-function-planning
    name: Conference and Function Planning
    kind: craft
    scope: "Planning conferences and corporate functions: program and space planning, AV and catering coordination, delegate flow and breakout logistics."
    examples: [program planning, space allocation, AV coordination, delegate registration flow]
    status: live
  - id: catering-logistics
    name: Catering Logistics
    kind: craft
    scope: "Off-premise and large-scale catering: production scheduling, transport and holding, on-site kitchen setup and food-safety in the field."
    examples: [production scheduling, transport and holding, field kitchen setup, quantity planning]
    status: live
  - id: venue-staffing-and-briefing
    name: Venue Staffing and Briefing
    kind: craft
    scope: "Staffing the event: rostering casual service teams, pre-event briefings, station assignments and floor supervision during the function."
    examples: [casual rostering, pre-event briefings, station assignments, floor supervision]
    status: live
  - id: guest-flow-management
    name: Guest Flow Management
    kind: craft
    scope: "Moving people through an event: arrivals and registration, seating and room transitions, crowd pinch-points and departure flow."
    examples: [arrival surges, seating plans, room transitions, departure flow]
    status: live
  - id: event-management-systems
    name: Event Management Systems
    kind: application
    scope: "Event software platforms: function diaries and BEO generation, registration and ticketing tools, floor-plan and seating software."
    examples: [function diary management, registration setup, seating-chart tools, BEO generation]
