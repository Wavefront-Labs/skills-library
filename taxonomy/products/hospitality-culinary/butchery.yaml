category: hospitality-culinary
field: butchery
products:
  - id: primal-breakdown
    name: Primal Breakdown
    kind: craft
    scope: "Breaking carcasses and primals into subprimals: seam butchery, bone-out work and yield-conscious cutting of beef, pork and lamb."
    examples: [seam butchery, boning out, beef primal breakdown, yield tracking]
    status: live
  - id: portion-cutting
    name: Portion Cutting
    kind: craft
    scope: "Cutting retail and kitchen portions: steaks, chops and roasts to weight, trimming, tying and counter presentation."
    examples: [steak cutting to weight, trimming and denuding, roast tying, counter display]
    status: live
  - id: poultry-and-game-butchery
    name: Poultry and Game Butchery
    kind: craft
    scope: "Breaking down poultry and game: jointing, deboning, ballotines, and furred and feathered game preparation."
    examples: [jointing a bird, glove boning, ballotine preparation, game dressing]
    status: live
  - id: fish-butchery
    name: Fish Butchery
    kind: craft
    scope: "Fishmongery for the kitchen: scaling, gutting, filleting round and flat fish, portioning and shellfish preparation."
    examples: [filleting round fish, flat fish filleting, pin boning, shellfish shucking]
    status: live
  - id: charcuterie
    name: Charcuterie
    kind: craft
    scope: "Cured and cooked meat craft: sausages, dry curing, whole-muscle cures, pâtés and salumi with safety controls."
    examples: [sausage making, dry-cured salumi, whole-muscle cures, curing-safety controls]
    status: live
  - id: offal-processing
    name: Offal Processing
    kind: craft
    scope: "Preparing offal and the fifth quarter for cooking: cleaning, trimming and handling organ meats, tripe and bones."
    examples: [liver and kidney prep, tripe cleaning, marrow bones, blood handling]
    status: live
  - id: ritual-slaughter-preparation
    name: Ritual Slaughter Preparation
    kind: craft
    scope: "Meat preparation under religious law where it precedes culinary use: kosher and halal cutting, inspection, soaking and salting."
    examples: [kosher deveining, soaking and salting, halal cutting practice, inspection standards]
    status: live
