category: hospitality-culinary
field: food-and-drink-service
products:
  - id: table-service
    name: Table Service
    kind: craft
    scope: "Serving the table: service styles and sequence, order taking, carrying and clearing technique, guest reading and timing."
    examples: [service sequence, order taking, plate carrying and clearing, pacing a table]
    status: live
  - id: wine-service
    name: Wine Service
    kind: craft
    scope: "Serving wine at the table: presentation and opening, decanting, temperature and glassware, by-the-glass programs and pairing guidance."
    examples: [presenting and opening, decanting, glassware and temperature, pairing recommendations]
    status: live
  - id: tableside-preparation
    name: Tableside Preparation
    kind: craft
    scope: "Guéridon and tableside craft: carving, flambé, salads and desserts finished at the table with showmanship and safety."
    examples: [tableside carving, flambé work, Caesar salad tableside, crêpes suzette]
    status: live
  - id: floor-and-section-management
    name: Floor and Section Management
    kind: craft
    scope: "Running the room: section planning, seating flow, coordinating runners and the pass, and keeping covers moving in service."
    examples: [section planning, seating flow, runner coordination, pre-service briefings]
    status: live
  - id: allergen-and-dietary-service
    name: Allergen and Dietary Service
    kind: craft
    scope: "Serving guests with allergies and dietary needs: allergen protocols, kitchen communication and cross-contact prevention at the table."
    examples: [allergen protocols, dietary order flagging, cross-contact prevention, religious dietary requests]
    status: live
  - id: service-recovery
    name: Service Recovery
    kind: craft
    scope: "Fixing service failures in the moment: complaint handling, comp judgement, de-escalation and turning a bad visit around."
    examples: [complaint handling, comp judgement, de-escalation, follow-up gestures]
    status: live
  - id: pos-systems
    name: POS Systems
    kind: application
    scope: "Restaurant point-of-sale systems: order entry and modifiers, coursing and fire controls, split checks, menu setup and end-of-day."
    examples: [order entry and modifiers, coursing and firing, split checks, menu programming]
    status: live
