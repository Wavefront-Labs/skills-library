category: education-training
field: pedagogy-and-teaching-method
products:
  - id: classroom-management
    name: Classroom Management
    kind: craft
    scope: "Establishing and keeping the conditions for learning: routines, expectations, behaviour response, and classroom climate."
    examples: [routines and procedures, behaviour de-escalation, restorative practice, seating and transitions]
    status: live
  - id: lesson-planning-and-delivery
    name: Lesson Planning and Delivery
    kind: craft
    scope: "Structuring and delivering a single lesson: objectives, sequencing, pacing, modelling and guided-to-independent practice."
    examples: [lesson structure, pacing, direct instruction, gradual release of responsibility]
    status: live
  - id: differentiated-instruction
    name: Differentiated Instruction
    kind: craft
    scope: "Adapting content, process and product to learner readiness, interest and profile within one classroom."
    examples: [tiered tasks, flexible grouping, scaffolding, readiness-based adaptation]
    status: live
  - id: formative-assessment
    name: Formative Assessment
    kind: craft
    scope: "Checking for understanding during instruction and adjusting teaching in response: low-stakes checks, exit tickets, responsive re-teaching."
    examples: [checks for understanding, exit tickets, hinge questions, responsive re-teaching]
    status: live
  - id: questioning-and-discussion
    name: Questioning and Discussion Facilitation
    kind: craft
    scope: "Leading classroom talk that builds thinking: question design, wait time, cold calling and structured discussion protocols."
    examples: [Socratic seminar, cold call technique, wait time, talk moves]
    status: live
  - id: feedback-and-grading
    name: Feedback and Grading Practice
    kind: craft
    scope: "Giving feedback students act on and grading work consistently and defensibly against criteria."
    examples: [actionable written feedback, whole-class feedback, grading consistency, marking workload management]
    status: live
  - id: classroom-response-tools
    name: Classroom Response Tools
    kind: application
    scope: "Live quiz and response platforms used during lessons (Kahoot, Quizizz, Nearpod, Mentimeter): building activities and reading the live data."
    examples: [Kahoot quiz design, live polling, Nearpod lessons, reading response data]
    status: live
  - id: google-classroom
    name: Google Classroom
    kind: application
    scope: "Running day-to-day class workflow in Google Classroom: posting work, collecting and returning submissions, and class communication."
    examples: [assignment posting, submission workflow, rubric attachment, guardian summaries]
    status: live
