category: education-training
field: special-education-and-iep-planning
products:
  - id: iep-writing
    name: IEP Writing
    kind: craft
    scope: "Writing the individualized education program from a clinical assessment: present levels, measurable goals, services and placement decisions."
    examples: [present levels statements, measurable annual goals, service minutes, placement justification]
    status: live
  - id: 504-plan-writing
    name: 504 Plan Writing
    kind: craft
    scope: "Writing Section 504 accommodation plans: eligibility reasoning, accommodation selection and documentation that holds up."
    examples: [eligibility reasoning, accommodation selection, plan documentation, annual review]
    status: live
  - id: accommodation-planning
    name: Inclusive Accommodation Planning
    kind: craft
    scope: "Planning classroom accommodations and modifications so students with disabilities access the general curriculum in inclusive settings."
    examples: [accommodations vs modifications, co-teaching models, access planning, assistive low-tech supports]
    status: live
  - id: specially-designed-instruction
    name: Specially Designed Instruction
    kind: craft
    scope: "Delivering instruction adapted to a disability: explicit, systematic teaching methods and intervention delivery tied to IEP goals."
    examples: [explicit systematic instruction, structured literacy intervention, task analysis, goal-aligned teaching]
    status: live
  - id: behavior-intervention-planning
    name: Behavior Intervention Planning
    kind: craft
    scope: "School-based behaviour support: translating a functional behaviour assessment into a behaviour intervention plan and running it in class."
    examples: [BIP writing, antecedent strategies, replacement behaviours, plan fidelity monitoring]
    status: live
  - id: progress-monitoring
    name: Progress Monitoring
    kind: craft
    scope: "Measuring progress against IEP goals: data collection design, curriculum-based measurement and reporting to the team and family."
    examples: [data collection design, curriculum-based measurement, goal progress reports, data-based decisions]
    status: live
  - id: transition-planning
    name: Transition Planning
    kind: craft
    scope: "Planning the move from school to adult life for students with disabilities: postsecondary goals, transition services and agency linkage."
    examples: [postsecondary goal writing, transition assessments, service coordination, self-advocacy preparation]
    status: live
