category: education-training
field: instructional-design
products:
  - id: learning-objective-design
    name: Learning Objective Design
    kind: craft
    scope: "Writing measurable learning objectives and deriving course structure from them: needs analysis, objective taxonomies and alignment to activities and assessment."
    examples: [Bloom-aligned objectives, needs analysis, backward design, objective-assessment alignment]
    status: live
  - id: elearning-course-design
    name: E-Learning Course Design
    kind: craft
    scope: "Designing self-paced online courses: storyboarding, screen-by-screen interaction design, knowledge checks and completion logic."
    examples: [course storyboarding, interaction design, knowledge checks, branching navigation]
    status: live
  - id: multimedia-learning-design
    name: Multimedia Learning Design
    kind: craft
    scope: "Applying multimedia learning principles to instructional media: narration and visuals, segmenting, and avoiding extraneous load."
    examples: [Mayer's principles applied, narration scripting, visual-text pairing, segmenting content]
    status: live
  - id: scenario-based-learning
    name: Scenario-Based Learning
    kind: craft
    scope: "Designing branching scenarios, simulations and case-based practice that teach decisions, not just facts."
    examples: [branching scenario design, decision-point writing, feedback consequences, case-based modules]
    status: live
  - id: instructional-video
    name: Instructional Video
    kind: craft
    scope: "Planning and producing teaching video: scripting for learning, screencasts, demonstrations and lecture capture that hold attention."
    examples: [screencast production, teaching scripts, demonstration filming, engagement pacing]
    status: live
  - id: articulate
    name: Articulate (Storyline/Rise)
    kind: application
    scope: "Building courses in the dominant e-learning authoring suite: Storyline interactions, triggers and variables, and Rise block-based courses."
    examples: [Storyline triggers and variables, Rise block courses, quiz building, publishing to LMS]
    status: live
  - id: lms-platforms
    name: LMS Platforms
    kind: application
    scope: "Learning management systems as a class (Moodle, Canvas, Blackboard, corporate LMSs): course setup, enrolment, gradebook and reporting."
    examples: [Moodle course setup, Canvas gradebook, enrolment management, completion reporting]
    status: live
  - id: scorm-and-xapi
    name: SCORM and xAPI
    kind: application
    scope: "E-learning interoperability standards: packaging courses as SCORM, xAPI statement design, and debugging LMS tracking."
    examples: [SCORM packaging, xAPI statements, completion tracking debug, LRS basics]
    status: live
