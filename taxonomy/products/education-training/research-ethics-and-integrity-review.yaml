category: education-training
field: research-ethics-and-integrity-review
products:
  - id: irb-review
    name: IRB / Human-Subjects Review
    kind: craft
    scope: "Reviewing human-subjects research protocols: risk-benefit analysis, consent adequacy, vulnerable-population protections and exempt/expedited determinations."
    examples: [risk-benefit analysis, consent form review, vulnerable-population protections, exemption determinations]
    status: live
  - id: iacuc-review
    name: Animal Care and Use Review
    kind: craft
    scope: "IACUC-style review of animal research protocols: the 3Rs, pain-category judgement, justification of numbers and facility oversight."
    examples: [3Rs assessment, pain categorisation, animal-number justification, protocol amendments]
    status: live
  - id: biosafety-review
    name: Biosafety Committee Review
    kind: craft
    scope: "Institutional biosafety review: containment-level assignment, recombinant and pathogen work assessment, and incident response oversight."
    examples: [containment-level assignment, rDNA protocol review, pathogen risk assessment, incident oversight]
    status: live
  - id: dual-use-research-review
    name: Dual-Use Research Review
    kind: craft
    scope: "Assessing research for misuse potential: DURC screening, risk-mitigation planning and publication-risk judgement."
    examples: [DURC screening, misuse risk assessment, mitigation planning, publication risk review]
    status: live
  - id: research-integrity-investigation
    name: Research Integrity Investigation
    kind: craft
    scope: "Handling allegations of research misconduct: inquiry and investigation procedure, evidence assessment for fabrication, falsification and plagiarism, and findings reports."
    examples: [misconduct inquiry procedure, image and data forensics triage, plagiarism assessment, findings reports]
    status: live
