category: education-training
field: curriculum-and-assessment-design
products:
  - id: curriculum-mapping
    name: Curriculum Mapping
    kind: craft
    scope: "Designing a course or programme's scope and sequence: what is taught, in what order, and how units build on each other."
    examples: [scope and sequence, unit planning, spiral curriculum, vertical alignment]
    status: live
  - id: standards-alignment
    name: Standards Alignment
    kind: craft
    scope: "Mapping curriculum and assessment to external standards and frameworks, and evidencing coverage for review."
    examples: [standards unpacking, coverage mapping, alignment documentation, framework crosswalks]
    status: live
  - id: rubric-design
    name: Rubric Design
    kind: craft
    scope: "Writing rubrics that score reliably: criteria selection, performance-level descriptors, and calibration across markers."
    examples: [analytic vs holistic rubrics, descriptor writing, marker calibration, single-point rubrics]
    status: live
  - id: test-item-writing
    name: Test and Item Writing
    kind: craft
    scope: "Writing valid test questions and assembling tests: item formats, distractor design, blueprinting and bias avoidance."
    examples: [multiple-choice distractor design, assessment blueprints, constructed-response prompts, item bias review]
    status: live
  - id: item-analysis-and-psychometrics
    name: Item Analysis and Psychometrics
    kind: craft
    scope: "Judging whether a test measured what it should: difficulty and discrimination statistics, reliability, and standard setting."
    examples: [item difficulty and discrimination, reliability analysis, standard setting, equating basics]
    status: live
  - id: pedagogical-content-editing
    name: Pedagogical Content Editing
    kind: craft
    scope: "Developmental editing of textbooks and course materials for how they teach: explanation quality, worked examples, sequencing and cognitive load."
    examples: [explanation rewriting, worked-example design, sequencing review, cognitive-load reduction]
    status: live
  - id: assessment-platforms
    name: Assessment Platforms
    kind: application
    scope: "Digital assessment and item-banking tools as a class (Formative, Edulastic, ExamSoft, Gradescope): authoring, delivery and results analysis."
    examples: [item banking, online test delivery, Gradescope workflows, results dashboards]
    status: live
