    name: Math Tutoring
    kind: craft
    scope: "One-on-one and small-group mathematics instruction: diagnosing misconceptions, worked guidance and building procedural and conceptual fluency."
    examples: [misconception diagnosis, worked-example guidance, fluency building, exam-topic coaching]
    status: live
  - id: literacy-and-reading-tutoring
    name: Literacy and Reading Tutoring
    kind: craft
    scope: "Teaching reading and early literacy individually: phonics, decoding, fluency and comprehension intervention."
