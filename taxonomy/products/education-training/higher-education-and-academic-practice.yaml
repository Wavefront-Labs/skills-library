category: education-training
field: higher-education-and-academic-practice
products:
  - id: literature-review
    name: Literature Review
    kind: craft
    scope: "Surveying and synthesising scholarship as a cross-cutting method: search strategy, screening, synthesis and systematic-review discipline."
    examples: [search strategy, screening and inclusion criteria, narrative synthesis, systematic review method]
    status: live
  - id: peer-review
    name: Peer Review
    kind: craft
    scope: "Reviewing manuscripts and proposals for scholarly merit: structured critique, constructive reports and reviewer ethics."
    examples: [manuscript critique, review report writing, reviewer ethics, revise-and-resubmit judgement]
    status: live
  - id: research-grant-writing
    name: Research Grant Writing
    kind: craft
    scope: "Writing competitive research funding proposals: aims and significance framing, budget justification and responding to funder criteria."
    examples: [specific aims writing, significance framing, budget justification, resubmission response]
    status: live
  - id: academic-publishing
    name: Academic Publishing
    kind: craft
    scope: "Getting scholarship published: journal selection, manuscript preparation, cover letters, revisions and navigating editorial process."
    examples: [journal selection, manuscript preparation, response to reviewers, authorship norms]
    status: live
  - id: scholarly-merit-evaluation
    name: Scholarly Merit Evaluation
    kind: craft
    scope: "Evaluating scholarly and scientific merit for prizes, honours, promotion and tenure: dossier reading, letter writing and committee judgement."
    examples: [tenure dossier review, prize committee judgement, external letters, research impact assessment]
    status: live
  - id: doctoral-supervision
    name: Doctoral Supervision
    kind: craft
    scope: "Supervising research students: project scoping, milestone management, feedback on draft chapters and examination preparation."
    examples: [project scoping, milestone management, chapter feedback, viva preparation]
    status: live
  - id: reference-managers
    name: Reference Managers
    kind: application
    scope: "Reference management tools as a class (Zotero, EndNote, Mendeley): library curation, citation styles and collaborative bibliographies."
    examples: [Zotero library curation, citation style setup, PDF annotation workflow, shared group libraries]
    status: live
