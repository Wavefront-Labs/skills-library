category: social-sciences
field: social-research-methods
products:
  - id: survey-design
    name: Survey design and methodology
    kind: craft
    scope: "Designing surveys of people: questionnaire construction, question wording, sampling design, modes, nonresponse and weighting."
    examples: [questionnaire design, sampling, weighting, nonresponse adjustment]
    status: live
  - id: qualitative-coding-analysis
    name: Qualitative coding and analysis
    kind: craft
    scope: "Analysing qualitative data across disciplines: thematic analysis, grounded theory coding, framework analysis and saturation judgement."
    examples: [thematic analysis, grounded theory, framework matrices]
    status: live
  - id: focus-groups
    name: Focus group research
    kind: craft
    scope: "Focus groups as a research method: recruitment, moderation guides, group dynamics management and group-level analysis."
    examples: [moderation guides, recruitment screeners, group-level analysis]
    status: live
  - id: experimental-quasi-experimental-design
    name: Experimental and quasi-experimental design
    kind: craft
    scope: "Designing studies to support causal claims about people: randomisation, quasi-experiments, threats to validity and field-trial logistics."
    examples: [randomisation schemes, validity threats, quasi-experimental designs]
    status: live
  - id: social-statistics
    name: Social statistics
    kind: craft
    scope: "Applied statistics for human-subjects data: regression for social data, categorical and multilevel models, missing data and measurement error."
    examples: [multilevel models, logistic regression, missing-data methods]
    status: live
  - id: mixed-methods-design
    name: Mixed-methods design
    kind: craft
    scope: "Combining qualitative and quantitative approaches: sequencing designs, integration strategies and joint displays."
    examples: [sequential designs, triangulation, joint displays]
    status: live
  - id: research-ethics-human-subjects
    name: Human-subjects research ethics
    kind: craft
    scope: "Ethical design and conduct of research on people: informed consent, risk assessment, vulnerable populations and IRB/ethics-committee applications."
    examples: [consent procedures, IRB applications, data-protection planning]
    status: live
  - id: systematic-review-meta-analysis
    name: Systematic review and meta-analysis (social)
    kind: craft
    scope: "Synthesising social-science evidence: search protocols, screening, effect-size extraction, meta-analytic models and bias assessment."
    examples: [PRISMA protocols, effect-size extraction, publication-bias tests]
    status: live
  - id: statistical-software
    name: Statistical packages (SPSS/R/Stata)
    kind: application
    scope: "Using the social-science statistical workhorses — SPSS, R and Stata — for data management, analysis and reproducible social-research workflows."
    examples: [SPSS syntax, R tidyverse workflows, Stata do-files]
    status: live
  - id: qualitative-software
    name: QDA software (NVivo/ATLAS.ti/MAXQDA)
    kind: application
    scope: "Qualitative data analysis software: project setup, coding frameworks, queries and team coding in NVivo, ATLAS.ti or MAXQDA."
    examples: [NVivo coding, code queries, team-coding workflows]
    status: live
  - id: survey-platforms
    name: Survey platforms (Qualtrics/REDCap/LimeSurvey)
    kind: application
    scope: "Building and fielding surveys on research platforms: instrument programming, logic and randomisation, quotas and data export in Qualtrics, REDCap or LimeSurvey."
    examples: [Qualtrics programming, branching logic, quota management]
    status: live
