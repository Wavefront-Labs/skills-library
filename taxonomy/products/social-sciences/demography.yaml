category: social-sciences
field: demography
products:
  - id: demographic-rates-life-tables
    name: Demographic rates and life tables
    kind: craft
    scope: "Core demographic measurement: constructing rates, standardisation, life tables and decomposition of mortality and fertility measures."
    examples: [life tables, age standardisation, rate decomposition]
    status: live
  - id: population-projection
    name: Population projection
    kind: craft
    scope: "Projecting population size and structure: cohort-component method, assumption setting and probabilistic projections."
    examples: [cohort-component projections, assumption setting, probabilistic projection]
    status: live
  - id: fertility-analysis
    name: Fertility analysis
    kind: craft
    scope: "Measuring and modelling fertility: TFR and parity measures, tempo adjustment, birth histories and fertility-survey analysis."
    examples: [TFR estimation, tempo adjustment, birth-history analysis]
    status: live
  - id: mortality-analysis
    name: Mortality analysis
    kind: craft
    scope: "Measuring and modelling mortality: cause-of-death analysis, survival methods, mortality forecasting and healthy-life-expectancy measures."
    examples: [cause-of-death analysis, Lee-Carter forecasting, healthy life expectancy]
    status: live
  - id: migration-studies
    name: Migration measurement and analysis
    kind: craft
    scope: "Measuring internal and international migration: flow estimation, migrant-stock data, residual methods and migration-survey analysis."
    examples: [flow estimation, migrant stocks, residual methods]
    status: live
  - id: census-survey-data
    name: Census and demographic survey data
    kind: craft
    scope: "Working with censuses and large demographic surveys (DHS, IPUMS): microdata handling, data-quality assessment and indirect estimation where data are incomplete."
    examples: [IPUMS microdata, DHS analysis, data-quality evaluation, indirect estimation]
    status: live
