category: social-sciences
field: anthropology
products:
  - id: ethnographic-fieldwork
    name: Ethnographic fieldwork
    kind: craft
    scope: "Long-term participant observation: entering the field, building rapport, fieldnotes, positionality and ethical conduct with communities."
    examples: [participant observation, fieldnotes, field entry, research ethics]
    status: live
  - id: ethnographic-writing
    name: Ethnographic writing and analysis
    kind: craft
    scope: "Turning field data into ethnography: thick description, analytic coding of fieldnotes, reflexivity and ethnographic monograph or article writing."
    examples: [thick description, fieldnote coding, reflexive writing]
    status: live
  - id: kinship-social-organisation
    name: Kinship and social organisation
    kind: craft
    scope: "Documenting and analysing kinship systems, descent, marriage and social organisation: genealogical method, kinship notation and terminology analysis."
    examples: [genealogical method, kinship diagrams, descent systems]
    status: live
  - id: linguistic-anthropology
    name: Linguistic anthropology
    kind: craft
    scope: "Studying language in social and cultural context: speech-community ethnography, language ideology and discourse in cultural settings."
    examples: [ethnography of speaking, language ideology, verbal art]
    status: live
  - id: medical-anthropology
    name: Medical anthropology
    kind: craft
    scope: "Studying health, illness and healing as cultural phenomena: illness narratives, ethnomedicine and health systems ethnography."
    examples: [illness narratives, ethnomedicine, health systems ethnography]
    status: live
  - id: visual-anthropology
    name: Visual and multimodal anthropology
    kind: craft
    scope: "Using photography, film and multimodal media as anthropological method and output: ethnographic film, photo elicitation and media ethics."
    examples: [ethnographic film, photo elicitation, multimodal fieldwork]
    status: live
  - id: cross-cultural-comparison
    name: Cross-cultural comparison
    kind: craft
    scope: "Systematic comparison across cultures: using ethnographic databases (HRAF), coding cultural traits and testing cross-cultural hypotheses."
    examples: [HRAF research, trait coding, comparative hypothesis testing]
    status: live
