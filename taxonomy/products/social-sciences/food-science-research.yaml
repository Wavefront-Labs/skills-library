category: social-sciences
field: food-science-research
products:
  - id: sensory-science
    name: Sensory science
    kind: craft
    scope: "Sensory evaluation research: discrimination and descriptive tests, consumer hedonic testing, panel training and sensory-data statistics."
    examples: [triangle tests, descriptive analysis, hedonic scaling, panel training]
    status: live
  - id: food-chemistry-research
    name: Food chemistry research
    kind: craft
    scope: "Studying food composition and reactions: compositional analysis, flavour chemistry, Maillard and lipid-oxidation studies and analytical method development."
    examples: [compositional analysis, flavour chemistry, oxidation studies]
    status: live
  - id: food-microbiology-safety-research
    name: Food microbiology and safety research
    kind: craft
    scope: "Research on microbial behaviour in food: challenge studies, predictive microbiology, shelf-life studies and pathogen-risk research."
    examples: [challenge studies, predictive microbiology, shelf-life testing]
    status: live
  - id: food-processing-research
    name: Food processing and engineering research
    kind: craft
    scope: "Studying how processing changes food: thermal and novel processing studies, texture and rheology measurement and process-structure-property research."
    examples: [thermal processing studies, rheology, novel processing evaluation]
    status: live
  - id: nutrition-science-research
    name: Nutrition science research
    kind: craft
    scope: "Research on diet and nutrients in populations: dietary assessment methods, nutritional epidemiology designs and controlled feeding studies (clinical dietetics is health-medicine)."
    examples: [dietary assessment, food-frequency questionnaires, feeding studies]
    status: live
  - id: consumer-food-research
    name: Consumer food research
    kind: craft
    scope: "Studying food choice and consumer behaviour around food: choice experiments, labelling studies and acceptance research for new foods."
    examples: [choice experiments, labelling studies, novel-food acceptance]
    status: live
