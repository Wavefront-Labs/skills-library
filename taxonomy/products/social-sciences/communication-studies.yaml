category: social-sciences
field: communication-studies
products:
  - id: media-effects-research
    name: Media effects research
    kind: craft
    scope: "Studying how media exposure shapes attitudes and behaviour: exposure measurement, framing and agenda-setting experiments and panel designs."
    examples: [framing experiments, agenda-setting studies, exposure measurement]
    status: live
  - id: content-analysis
    name: Content analysis
    kind: craft
    scope: "Systematic analysis of message content: codebook development, coder training, intercoder reliability and computational text analysis of media."
    examples: [codebook development, intercoder reliability, computational content analysis]
    status: live
  - id: discourse-analysis
    name: Discourse analysis
    kind: craft
    scope: "Analysing talk and text as social action: critical discourse analysis, conversation analysis and multimodal discourse methods."
    examples: [critical discourse analysis, conversation analysis, transcription conventions]
    status: live
  - id: rhetoric-research
    name: Rhetorical criticism
    kind: craft
    scope: "Scholarly analysis of persuasion and public address: rhetorical criticism methods, argumentation analysis and genre study."
    examples: [rhetorical criticism, argumentation analysis, public-address study]
    status: live
  - id: public-opinion-research
    name: Public opinion research
    kind: craft
    scope: "Measuring and modelling public opinion: opinion polling for research, question-wording effects and opinion-dynamics analysis."
    examples: [polling design, wording effects, opinion dynamics]
    status: live
  - id: interpersonal-organisational-communication-research
    name: Interpersonal and organisational communication research
    kind: craft
    scope: "Studying communication in relationships and organisations: interaction coding, network and diary methods and organisational communication audits."
    examples: [interaction coding, diary studies, communication audits]
    status: live
  - id: digital-media-research
    name: Digital and social media research
    kind: craft
    scope: "Studying communication on digital platforms: platform data collection, APIs and scraping ethics, virality and misinformation research."
    examples: [platform data collection, misinformation studies, virality analysis]
    status: live
