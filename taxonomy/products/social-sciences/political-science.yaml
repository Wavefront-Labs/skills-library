category: social-sciences
field: political-science
products:
  - id: comparative-politics-research
    name: Comparative politics research
    kind: craft
    scope: "Comparing political systems and institutions across countries: case selection, small-N comparison and cross-national datasets."
    examples: [case selection, cross-national datasets, regime classification]
    status: live
  - id: international-relations-research
    name: International relations research
    kind: craft
    scope: "Studying interstate behaviour, conflict and cooperation: conflict datasets, alliance and trade analysis and IR theory testing."
    examples: [conflict data, dyadic analysis, IR theory testing]
    status: live
  - id: political-behaviour-research
    name: Political behaviour and elections
    kind: craft
    scope: "Studying voting, participation and attitudes: election studies, polling analysis, electoral-system effects and turnout research."
    examples: [election studies, polling analysis, turnout models]
    status: live
  - id: public-opinion-survey-experiments
    name: Survey and field experiments (politics)
    kind: craft
    scope: "Experimental methods on political attitudes and behaviour: survey experiments, conjoint designs, list experiments and field experiments like GOTV."
    examples: [conjoint analysis, list experiments, GOTV field experiments]
    status: live
  - id: public-policy-analysis
    name: Public policy analysis (research)
    kind: craft
    scope: "Scholarly analysis of policy processes and outcomes: policy evaluation research, agenda-setting studies and implementation research."
    examples: [policy evaluation, agenda-setting studies, implementation research]
    status: live
  - id: political-theory-scholarship
    name: Political theory
    kind: craft
    scope: "Normative and conceptual political theory: textual interpretation of the canon, conceptual analysis and normative argumentation about politics."
    examples: [canonical interpretation, conceptual analysis, normative argument]
    status: live
  - id: political-methodology
    name: Political methodology
    kind: craft
    scope: "Quantitative and text-as-data methods for political data: ideal-point estimation, text scaling of speeches and manifestos, and event data."
    examples: [ideal-point estimation, text scaling, event data, roll-call analysis]
    status: live
