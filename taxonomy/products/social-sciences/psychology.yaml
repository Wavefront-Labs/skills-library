category: social-sciences
field: psychology
products:
  - id: experimental-design
    name: Experimental design (psychology)
    kind: craft
    scope: "Designing behavioural and cognitive experiments: manipulations, counterbalancing, within/between-subjects designs, power analysis and preregistration."
    examples: [factorial designs, counterbalancing, power analysis, preregistration]
    status: live
  - id: psychometrics
    name: Psychometrics
    kind: craft
    scope: "Constructing and validating psychological measures: scale development, reliability, factor analysis, item response theory and test norming."
    examples: [scale development, reliability analysis, IRT, construct validation]
    status: live
  - id: cognitive-psychology-research
    name: Cognitive psychology research
    kind: craft
    scope: "Studying perception, attention, memory, language and reasoning: chronometric paradigms, reaction-time tasks and cognitive modelling."
    examples: [RT paradigms, memory tasks, attention studies, cognitive modelling]
    status: live
  - id: developmental-psychology-research
    name: Developmental psychology research
    kind: craft
    scope: "Studying psychological change across the lifespan: infant paradigms, longitudinal cohort designs and age-appropriate measurement."
    examples: [looking-time paradigms, longitudinal designs, cohort studies]
    status: live
  - id: social-personality-research
    name: Social and personality research
    kind: craft
    scope: "Studying attitudes, group processes, individual differences and social behaviour: vignette studies, implicit measures and trait assessment."
    examples: [attitude measurement, vignette experiments, implicit measures, Big Five research]
    status: live
  - id: behavioural-data-analysis
    name: Behavioural data analysis
    kind: craft
    scope: "Statistical analysis of behavioural data: ANOVA and mixed models, effect sizes, Bayesian approaches, and handling of messy human-subjects data."
    examples: [mixed-effects models, ANOVA, Bayesian analysis, effect sizes]
    status: live
  - id: experiment-software
    name: Experiment software (PsychoPy/E-Prime/jsPsych)
    kind: application
    scope: "Building and running computerised experiments with PsychoPy, E-Prime, jsPsych and online platforms such as Gorilla or Pavlovia."
    examples: [PsychoPy scripting, jsPsych tasks, online data collection, timing accuracy]
    status: live
  - id: replication-open-science
    name: Replication and open science
    kind: craft
    scope: "Replication studies and open-science practice: registered reports, data and materials sharing, multi-lab collaboration and questionable-research-practice avoidance."
    examples: [registered reports, replication design, OSF workflows]
    status: live
