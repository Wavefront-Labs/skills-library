category: social-sciences
field: sociology
products:
  - id: sociological-theory
    name: Sociological theory
    kind: craft
    scope: "Working with and building sociological theory: classical and contemporary frameworks, concept formation and theory-driven research design."
    examples: [theoretical frameworks, concept formation, literature synthesis]
    status: live
  - id: survey-research
    name: Survey research (sociology)
    kind: craft
    scope: "Designing and analysing large-scale social surveys: sampling frames, questionnaire design for social indicators and secondary analysis of panel data."
    examples: [panel data analysis, social indicators, GSS/ESS secondary analysis]
    status: live
  - id: qualitative-interviewing
    name: Qualitative interviewing
    kind: craft
    scope: "In-depth and semi-structured interviewing for sociological research: guides, rapport, probing, transcription and interview-based analysis."
    examples: [interview guides, probing techniques, transcription, thematic analysis]
    status: live
  - id: social-network-analysis
    name: Social network analysis
    kind: craft
    scope: "Measuring and modelling social ties: network data collection, centrality and community detection, and network visualisation for social structure."
    examples: [centrality measures, community detection, name generators, network visualisation]
    status: live
  - id: comparative-historical-sociology
    name: Comparative-historical methods
    kind: craft
    scope: "Comparative and historical sociological analysis: case selection, archival sources, process tracing and qualitative comparative analysis (QCA)."
    examples: [case comparison, archival research, QCA, process tracing]
    status: live
  - id: stratification-demography-analysis
    name: Stratification and mobility analysis
    kind: craft
    scope: "Quantitative study of inequality, class and social mobility: mobility tables, log-linear models and inequality decomposition."
    examples: [mobility tables, inequality measures, log-linear models]
    status: live
  - id: urban-community-research
    name: Urban and community research
    kind: craft
    scope: "Studying cities, neighbourhoods and communities: neighbourhood effects, community studies, spatial inequality and place-based fieldwork."
    examples: [neighbourhood effects, community case studies, spatial inequality]
    status: live
  - id: computational-sociology
    name: Computational sociology
    kind: craft
    scope: "Computational and digital methods for social research: web/social-media data, text-as-data, agent-based models of social processes."
    examples: [social media data, agent-based models, text-as-data, digital trace analysis]
    status: live
