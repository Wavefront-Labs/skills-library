category: social-sciences
field: management-and-organisational-research
products:
  - id: organisational-behaviour-research
    name: Organisational behaviour research
    kind: craft
    scope: "Studying individuals and teams in organisations: survey and diary studies of work attitudes, team research designs and multilevel organisational data."
    examples: [work-attitude surveys, diary studies, team research, multilevel models]
    status: live
  - id: strategy-management-research
    name: Strategy and management research
    kind: craft
    scope: "Empirical study of firms and strategy: firm-level panel data, event studies, performance measurement and strategy-research designs."
    examples: [firm panel data, event studies, performance measures]
    status: live
  - id: consumer-behaviour-research
    name: Consumer behaviour research
    kind: craft
    scope: "Academic study of consumer judgement and choice: lab experiments on consumers, choice modelling and scale-based consumer constructs (commercial market research is sales-marketing)."
    examples: [consumer experiments, choice modelling, construct scales]
    status: live
  - id: organisational-ethnography-case-study
    name: Organisational ethnography and case study
    kind: craft
    scope: "Qualitative study of organisations: access negotiation, workplace ethnography, multi-case designs and process research."
    examples: [workplace ethnography, multi-case designs, process studies]
    status: live
  - id: accounting-finance-research
    name: Accounting and finance research
    kind: craft
    scope: "Scholarly research on accounting and financial behaviour: archival accounting data, disclosure studies and empirical asset-pricing-adjacent methods used in business schools."
    examples: [archival studies, disclosure research, earnings analysis]
    status: live
  - id: operations-management-science-research
    name: Operations and management science research
    kind: craft
    scope: "Research on operations and decision processes in organisations: behavioural operations experiments, empirical operations data and model-based management science."
    examples: [behavioural operations, empirical OM, decision models]
    status: live
  - id: survey-scale-development-management
    name: Measurement and scale development (management)
    kind: craft
    scope: "Developing and validating organisational constructs: scale development, common-method-bias handling, CFA/SEM for management research."
    examples: [scale validation, SEM, common-method bias]
    status: live
