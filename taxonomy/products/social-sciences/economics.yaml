category: social-sciences
field: economics
products:
  - id: microeconomic-theory
    name: Microeconomic theory
    kind: craft
    scope: "Building and solving microeconomic models: consumer and producer theory, game theory, mechanism design and welfare analysis."
    examples: [game theory, mechanism design, general equilibrium, welfare analysis]
    status: live
  - id: macroeconomic-modelling
    name: Macroeconomic modelling
    kind: craft
    scope: "Modelling economies in aggregate: growth models, DSGE and other dynamic models, business-cycle analysis and monetary/fiscal model analysis."
    examples: [DSGE models, growth models, business-cycle analysis]
    status: live
  - id: econometrics
    name: Econometrics
    kind: craft
    scope: "Statistical methods for economic data: regression, panel data, time series, instrumental variables and model specification/diagnostics."
    examples: [panel data methods, time series, instrumental variables, robust inference]
    status: live
  - id: causal-inference-economics
    name: Causal inference and policy evaluation
    kind: craft
    scope: "Identifying causal effects in observational and experimental economic data: difference-in-differences, RDD, matching, synthetic control and RCT evaluation."
    examples: [difference-in-differences, regression discontinuity, synthetic control, RCT analysis]
    status: live
  - id: behavioural-experimental-economics
    name: Behavioural and experimental economics
    kind: craft
    scope: "Lab and field experiments on economic behaviour: incentivised designs, behavioural game paradigms and anomaly documentation."
    examples: [lab experiments, field experiments, incentive design, zTree/oTree paradigms]
    status: live
  - id: development-economics-research
    name: Development economics research
    kind: craft
    scope: "Studying poverty, growth and policy in low- and middle-income settings: household surveys, field RCTs and development-data measurement."
    examples: [household survey analysis, field RCTs, poverty measurement]
    status: live
  - id: stata
    name: Stata
    kind: application
    scope: "Empirical work in Stata, the dominant applied-economics package: do-files, data management, estimation commands and reproducible pipelines."
    examples: [do-file workflows, panel estimation, margins, reproducible pipelines]
    status: live
  - id: economics-r-python
    name: R / Python for economics
    kind: application
    scope: "Econometric and computational economics work in R and Python: tidyverse/pandas data work, estimation libraries and replication packages."
    examples: [fixest/linearmodels, data wrangling, replication packages]
    status: live
  - id: economic-writing-communication
    name: Economic research writing
    kind: craft
    scope: "Writing economics papers and policy-facing research outputs: structuring empirical papers, robustness presentation and seminar/referee response."
    examples: [paper structure, robustness tables, referee responses]
    status: live
