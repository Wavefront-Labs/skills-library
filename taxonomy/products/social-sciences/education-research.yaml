category: social-sciences
field: education-research
products:
  - id: learning-sciences-research
    name: Learning sciences research
    kind: craft
    scope: "Studying how people learn: design-based research, cognitive studies of learning, learning-environment studies and theory building about learning."
    examples: [design-based research, learning studies, cognition and instruction]
    status: live
  - id: educational-measurement
    name: Educational measurement and assessment research
    kind: craft
    scope: "Measuring learning and ability: test design for research, item analysis, IRT and equating, and validity frameworks for educational assessment."
    examples: [item analysis, IRT models, test equating, validity argument]
    status: live
  - id: education-policy-evaluation
    name: Education policy and programme evaluation
    kind: craft
    scope: "Evaluating education interventions and policies: RCTs in schools, quasi-experimental evaluation and cost-effectiveness analysis of education programmes."
    examples: [school-based RCTs, quasi-experimental evaluation, cost-effectiveness]
    status: live
  - id: classroom-research-methods
    name: Classroom and school-based research
    kind: craft
    scope: "Collecting data in classrooms and schools: observation protocols, video analysis of teaching, teacher and pupil interviews and school-site ethics."
    examples: [observation protocols, lesson video analysis, school fieldwork]
    status: live
  - id: comparative-education-research
    name: Comparative and international education
    kind: craft
    scope: "Comparing education systems across countries: international assessment data (PISA, TIMSS), system comparison and cross-cultural validity of measures."
    examples: [PISA/TIMSS analysis, system comparison, cross-cultural measurement]
    status: live
  - id: learning-analytics
    name: Learning analytics and educational data mining
    kind: craft
    scope: "Analysing digital learning data: clickstream and LMS data, predictive models of learning outcomes and ethics of educational data."
    examples: [LMS data analysis, predictive models, dashboard research]
    status: live
