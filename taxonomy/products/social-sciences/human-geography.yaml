category: social-sciences
field: human-geography
products:
  - id: gis-social-research
    name: GIS for social research (QGIS/ArcGIS)
    kind: application
    scope: "Geographic information systems applied to human geography: spatial data handling, geocoding, thematic mapping and spatial joins in QGIS/ArcGIS."
    examples: [thematic mapping, geocoding, spatial joins, census geography]
    status: live
  - id: spatial-analysis
    name: Spatial analysis and statistics
    kind: craft
    scope: "Quantitative spatial methods for social data: spatial autocorrelation, spatial regression, clustering and accessibility analysis."
    examples: [spatial autocorrelation, spatial regression, hot-spot analysis, accessibility measures]
    status: live
  - id: urban-geography-research
    name: Urban geography research
    kind: craft
    scope: "Studying cities as spatial systems: land use change, gentrification, urban form and comparative urbanism research."
    examples: [land-use analysis, gentrification studies, urban form]
    status: live
  - id: economic-geography-research
    name: Economic geography research
    kind: craft
    scope: "Studying the spatial organisation of economies: industrial clusters, global production networks, regional development and labour geographies."
    examples: [cluster analysis, global production networks, regional development]
    status: live
  - id: population-migration-geography
    name: Population and migration geography
    kind: craft
    scope: "Spatial study of population distribution and movement: migration flows, residential segregation measurement and spatial demography."
    examples: [migration flow analysis, segregation indices, spatial demography]
    status: live
  - id: qualitative-geography
    name: Qualitative and participatory geography
    kind: craft
    scope: "Qualitative methods for place and space: go-along interviews, participatory mapping, mental maps and ethnography of place."
    examples: [participatory mapping, go-along interviews, mental maps]
    status: live
  - id: cartographic-communication
    name: Cartographic communication (research)
    kind: craft
    scope: "Designing maps that communicate social-science findings honestly: classification choices, projections, choropleth pitfalls and map critique."
    examples: [choropleth design, classification schemes, map critique]
    status: live
