  - id: bowed-luthiery
    name: Violin-Family Making
    kind: craft
    scope: "The violin maker's tradition: arching and graduating plates, scroll carving, bass bar and soundpost, varnish and fitting up violin, viola and cello."
    examples: [plate graduation, scroll carving, soundpost fitting, violin varnish]
    status: live
  - id: bow-making
    name: Bow Making
    kind: craft
    scope: "The archetier's craft: cambering and graduating the stick, frog and button work, and hairing bows."
    examples: [cambering, frog making, bow hairing]
    status: live
  - id: woodwind-making
    name: Woodwind Making
    kind: craft
    scope: "Making flutes, whistles, recorders, clarinets and bagpipes: bore design and reaming, tone-hole placement, keywork and voicing and tuning."
    examples: [bore reaming, tone-hole tuning, voicing, keywork fitting]
    status: live
  - id: brass-instrument-making
    name: Brass Instrument Making
    kind: craft
    scope: "Making brass winds: bending and tapering tube, bell spinning and seaming, valve and slide fitting and final assembly."
    examples: [tube bending, bell making, valve fitting, assembly]
