category: handcrafts
field: leatherwork
products:
  - id: hand-stitching
    name: Hand Stitching & Construction
    kind: craft
    scope: "The leatherworker's core bench skills: cutting, skiving, edge finishing, saddle stitching with two needles and assembling leather goods."
    examples: [saddle stitch, skiving, edge burnishing, pattern cutting]
    status: live
  - id: leather-tooling
    name: Leather Tooling & Carving
    kind: craft
    scope: "Decorating vegetable-tanned leather: swivel-knife carving, stamping, Sheridan-style floral work and embossed decoration."
    examples: [swivel-knife carving, stamping, Sheridan floral, backgrounding]
    status: live
  - id: leathergoods-making
    name: Leathergoods Making
    kind: craft
    scope: "Making bags, wallets, belts, cases and small goods: pattern design, gussets, linings, hardware setting and clean construction."
    examples: [bag making, wallet interiors, hardware setting, gussets]
    status: live
  - id: saddlery-harness
    name: Saddlery & Harness Making
    kind: craft
    scope: "Making saddles, bridles and harness: tree fitting, heavy stitching, strapwork and the fit and safety demands of tack."
    examples: [saddle construction, bridle work, strapwork, tree fitting]
    status: live
  - id: shoemaking
    name: Shoemaking & Bootmaking
    kind: craft
    scope: "Making footwear by hand: lasting, pattern making for uppers, welted and other constructions, and sole and heel building."
