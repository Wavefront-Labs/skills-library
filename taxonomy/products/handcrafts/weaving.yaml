category: handcrafts
field: weaving
products:
  - id: loom-dressing
    name: Warping & Loom Dressing
    kind: craft
    scope: "Preparing the loom: winding and beaming the warp, threading heddles, sleying the reed, tensioning and tie-up."
    examples: [warp winding, beaming, threading and sleying, tie-up]
    status: live
  - id: weave-drafting
    name: Weave Drafting
    kind: craft
    scope: "Designing cloth on paper: reading and writing drafts, threading and treadling plans, colour-and-weave effects and structure design."
    examples: [draft notation, twill and block design, colour-and-weave]
    status: live
  - id: shaft-loom-weaving
    name: Shaft-Loom Weaving
    kind: craft
    scope: "Weaving cloth on floor and table looms: plain weave through multi-shaft structures, selvedges, beat and finishing woven cloth."
    examples: [twills, overshot, double weave, wet finishing]
    status: live
  - id: tapestry-weaving
    name: Tapestry Weaving
    kind: craft
    scope: "Weft-faced pictorial and flat-woven work on frame or tapestry loom: shapes, joins, hatching and cartoon-led weaving made for use."
    examples: [weft-faced technique, slit and dovetail joins, hatching]
    status: live
  - id: rug-weaving
    name: Rug Weaving
    kind: craft
    scope: "Weaving rugs and heavy textiles: knotted pile, flat-weave kilim and rag-rug traditions, heavy beat and rug finishing."
    examples: [knotted pile, kilim, rag rugs, rug finishing]
    status: live
  - id: tablet-weaving
    name: Tablet Weaving
    kind: craft
    scope: "Weaving patterned bands with turning tablets: threading diagrams, turning sequences and double-face and brocaded techniques."
    examples: [threading diagrams, turning sequences, double-face bands]
    status: live
  - id: band-weaving
    name: Inkle & Band Weaving
    kind: craft
    scope: "Narrow-wares on inkle loom, rigid heddle or backstrap band setups: warp-faced bands, pickup patterns and finished straps and trims."
    examples: [warp-faced bands, pickup patterns, strap making]
    status: live
  - id: backstrap-weaving
    name: Backstrap Weaving
    kind: craft
    scope: "Weaving on body-tensioned looms in the backstrap traditions: loom setup, tension control and the pickup and brocade work of those traditions."
    examples: [body tensioning, pickup brocade, traditional cloth widths]
    status: live
