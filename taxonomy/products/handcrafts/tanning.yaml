category: handcrafts
field: tanning
products:
  - id: hide-preparation
    name: Hide Preparation
    kind: craft
    scope: "From raw hide to tannable stock: fleshing, curing and storage, liming or bucking, dehairing and scudding."
    examples: [fleshing, liming, dehairing, curing]
    status: live
  - id: vegetable-tanning
    name: Vegetable & Bark Tanning
    kind: craft
    scope: "Tanning with plant tannins: bark and extract liquors, pit and drum progression, and handling times from weeks to months."
    examples: [tan-liquor management, bark tanning, pit progression]
    status: live
  - id: brain-tanning
    name: Brain Tanning & Buckskin
    kind: craft
    scope: "The braintan tradition: dressing hides with emulsified oils, wringing and softening by hand, and smoking the finished buckskin."
    examples: [hide dressing, softening and breaking, smoking]
    status: live
  - id: rawhide-parchment
    name: Rawhide & Parchment
    kind: craft
    scope: "Untanned hide products: making rawhide for lacing and drums, and stretching, scraping and finishing parchment and vellum."
    examples: [rawhide making, parchment stretching, vellum finishing]
    status: live
  - id: currying-finishing
    name: Currying & Finishing
    kind: craft
    scope: "Finishing tanned leather: fatliquoring and stuffing, staking and softening, graining and surface finishing of the tanned hide."
    examples: [fatliquoring, staking, graining, surface finish]
    status: live
