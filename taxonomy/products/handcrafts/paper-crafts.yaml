category: handcrafts
field: paper-crafts
products:
  - id: hand-papermaking
    name: Hand Papermaking
    kind: craft
    scope: "Making paper by hand: fibre beating, sheet forming at the vat (Western and washi nagashizuki), couching, pressing and drying."
    examples: [pulp beating, sheet forming, washi nagashizuki, couching and drying]
    status: live
  - id: origami
    name: Origami
    kind: craft
    scope: "Folding paper: traditional and modern models, crease-pattern reading, wet folding, modular and tessellation work."
    examples: [crease patterns, wet folding, modular origami, tessellations]
    status: live
  - id: paper-cutting
    name: Paper Cutting
    kind: craft
    scope: "Cut-paper work: knife and scissor traditions (jianzhi, scherenschnitte, kirigami), design for connectivity and clean cutting."
    examples: [jianzhi, scherenschnitte, knife control, connected design]
    status: live
  - id: papier-mache
    name: Papier-Mâché
    kind: craft
    scope: "Building objects from paper pulp and strip: armatures, layering and pulp sculpting, surfaces and finishes for durable pieces."
    examples: [strip layering, pulp sculpting, armatures, finishing]
    status: live
  - id: quilling
    name: Quilling
    kind: craft
    scope: "Rolled-paper filigree: coiling and shaping strips, on-edge lettering and composing quilled designs."
    examples: [coil shapes, on-edge work, quilled lettering]
    status: live
  - id: paper-engineering
    name: Paper Engineering & Pop-Ups
    kind: craft
    scope: "Making paper move: pop-up mechanisms, v-folds and layers, card mechanisms and designing structures that fold flat."
