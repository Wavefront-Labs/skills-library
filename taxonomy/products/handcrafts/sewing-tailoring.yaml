category: handcrafts
field: sewing-tailoring
products:
  - id: pattern-drafting
    name: Pattern Drafting & Fitting
    kind: craft
    scope: "Drafting garment patterns from measurements and blocks, draping on the stand, grading, and fitting through toiles and muslins."
    examples: [block drafting, draping, toile fitting, grading]
    status: live
  - id: hand-sewing
    name: Hand Sewing
    kind: craft
    scope: "Needle-and-thread technique: the hand stitch repertoire, hand finishing, buttonholes, hemming and couture hand work."
    examples: [hand stitches, hand buttonholes, hemming, couture finishing]
    status: live
  - id: machine-sewing
    name: Machine Sewing & Construction
    kind: craft
    scope: "Garment and textile-goods construction on domestic and industrial machines: seams and finishes, zips, overlocking and order of assembly."
    examples: [seam finishes, zip insertion, overlocking, assembly order]
    status: live
  - id: bespoke-tailoring
    name: Bespoke Tailoring
    kind: craft
    scope: "Structured tailoring to the individual: canvassing, pad stitching, shaping with iron work, fittings and the tailored jacket and trouser."
    examples: [canvassing, pad stitching, iron work, fitting sequence]
    status: live
  - id: dressmaking
    name: Dressmaking
    kind: craft
    scope: "Making dresses, blouses, skirts and soft garments to pattern or client: fabric choice, construction and couture dress techniques."
    examples: [dress construction, fabric handling, linings, closures]
    status: live
  - id: corsetry
    name: Corsetry & Structured Underpinnings
    kind: craft
    scope: "Boned and structured garments: corsets, stays, bras and foundation wear, boning channels, busks, grommets and fit under tension."
    examples: [boning and channels, busk insertion, corset fitting]
    status: live
  - id: millinery
    name: Millinery
    kind: craft
    scope: "Making hats: blocking felt and straw, wiring and shaping brims, trimmings and fascinator and structured-hat construction."
    examples: [felt blocking, brim wiring, trimmings, fascinators]
    status: live
  - id: quilting
    name: Quilting & Patchwork
    kind: craft
    scope: "Piecing and quilting layered textiles: patchwork piecing, appliqué, hand and machine quilting, and binding finished quilts."
    examples: [patchwork piecing, appliqué, hand quilting, binding]
    status: live
  - id: embroidery
    name: Embroidery & Needlework
    kind: craft
    scope: "Decorative stitching on cloth: surface embroidery, counted work, goldwork, crewel and the regional needlework traditions, made for use."
    examples: [surface stitches, counted cross-stitch, goldwork, crewel]
    status: live
