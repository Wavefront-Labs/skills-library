category: handcrafts
field: bookbinding
products:
  - id: case-binding
    name: Case Binding
    kind: craft
    scope: "The standard hardcover: folding and sewing sections, rounding and backing, making the case and casing in cloth and paper bindings."
    examples: [section sewing, rounding and backing, case making, casing in]
    status: live
  - id: fine-binding
    name: Fine Leather Binding
    kind: craft
    scope: "Full and half leather bindings to the fine-binding tradition: paring, covering, raised bands, leather joints and design bindings made to use."
    examples: [leather paring, covering, raised bands, headcaps]
    status: live
  - id: non-adhesive-binding
    name: Non-Adhesive & Historical Structures
    kind: craft
    scope: "Exposed-sewing and historical book structures: Coptic, longstitch, limp vellum and pamphlet bindings, and link-stitch variations."
    examples: [Coptic binding, longstitch, limp vellum, pamphlet stitch]
    status: live
  - id: finishing-tooling
    name: Finishing & Tooling
    kind: craft
    scope: "Decorating bindings: gold and blind tooling, titling, edge gilding and decoration, and handle-letter and hot-foil work."
    examples: [gold tooling, blind tooling, edge gilding, titling]
    status: live
  - id: paper-marbling
    name: Paper Marbling & Decorated Papers
    kind: craft
    scope: "Making decorated papers for bindings: marbling on size, paste papers and pattern traditions for endpapers and covers."
    examples: [marbling patterns, paste papers, endpaper making]
    status: live
  - id: box-making
    name: Box Making & Enclosures
    kind: craft
    scope: "Protective enclosures built to the book: clamshell and slipcases, portfolios and cloth-covered board construction."
    examples: [clamshell boxes, slipcases, portfolios]
    status: live
  - id: restoration-binding
    name: Restoration Binding
    kind: craft
    scope: "Rebinding and conserving books: resewing, rebacking, paper repair and sympathetic rebinding of worn volumes."
    examples: [rebacking, resewing, paper repair, sympathetic rebinds]
    status: live
