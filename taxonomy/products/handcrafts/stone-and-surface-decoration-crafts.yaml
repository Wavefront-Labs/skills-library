category: handcrafts
field: stone-and-surface-decoration-crafts
products:
  - id: stone-carving
    name: Stone Carving
    kind: craft
    scope: "Shaping stone into movable objects with chisel and mallet: roughing out, modelling, tool choice per stone, and alabaster and soapstone work."
    examples: [roughing out, point and claw work, alabaster carving, surface finishing]
    status: live
  - id: lettercutting
    name: Lettercutting in Stone
    kind: craft
    scope: "The letter carver's trade: drawing and spacing inscriptions, v-cut carving by hand, and gilded and painted letters on stone pieces."
    examples: [v-cut letters, inscription layout, letter gilding]
    status: live
  - id: mosaic
    name: Mosaic
    kind: craft
    scope: "Building images and surfaces from tesserae: cutting smalti, stone and tile, direct and indirect methods, andamento and grouting."
    examples: [tesserae cutting, direct and indirect methods, andamento, grouting]
    status: live
  - id: urushi-lacquerware
    name: Lacquerware (Urushi)
    kind: craft
    scope: "Building lacquered surfaces coat by coat: urushi handling and curing, ground layers, polishing, and maki-e and decorated lacquer."
    examples: [urushi application, muro curing, maki-e, polishing between coats]
    status: live
  - id: inlay-intarsia
    name: Inlay & Intarsia
    kind: craft
    scope: "Setting one material into another for decorated surfaces: stone and shell inlay, pietra dura, and metal-into-metal and wood inlay work."
    examples: [pietra dura, shell inlay, metal inlay, fitting recesses]
    status: live
  - id: gilding
    name: Gilding
    kind: craft
    scope: "Applying gold and metal leaf to objects: water and oil gilding, gesso and bole grounds, burnishing and toning gilded surfaces."
    examples: [water gilding, oil gilding, bole and gesso, burnishing]
    status: live
