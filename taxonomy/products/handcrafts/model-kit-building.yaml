category: handcrafts
field: model-kit-building
products:
  - id: scale-model-assembly
    name: Scale Model Assembly
    kind: craft
    scope: "Building plastic and multimedia kits: sprue cleanup, fit and seam work, glues and fillers, and clean sub-assembly sequencing."
    examples: [seam removal, kit fit, glue choice, assembly order]
    status: live
  - id: scratch-building
    name: Scratch Building & Kitbashing
    kind: craft
    scope: "Making model parts and whole subjects from raw stock: styrene fabrication, kitbashing donor parts and scratch detail to drawings."
    examples: [styrene fabrication, kitbashing, working from drawings]
    status: live
  - id: miniature-painting
    name: Miniature Figure Painting
    kind: craft
    scope: "Brush painting miniatures and figures: priming, layering, glazes, non-metallic metal, faces and freehand at small scale."
    examples: [layering and glazing, faces, non-metallic metal, basing]
    status: live
  - id: airbrushing
    name: Airbrushing
    kind: application
    scope: "The airbrush as a tool system: thinning and pressure, masking, fine control, paint systems and airbrush maintenance for model finishes."
    examples: [paint thinning, masking, fine-line control, maintenance]
    status: live
  - id: weathering
    name: Weathering & Finishing
    kind: craft
    scope: "Making models look real: washes, filters, chipping, pigments, decals and clear coats in a finishing sequence."
    examples: [washes and filters, chipping, pigments, decal setting]
    status: live
  - id: diorama-building
    name: Diorama Building
    kind: craft
    scope: "Composing models into scenes: groundwork, water and vegetation effects, structures and the storytelling composition of a base."
    examples: [groundwork, water effects, composition, scale vegetation]
    status: live
  - id: railway-modelling
    name: Railway Modelling
    kind: craft
    scope: "Model railways as a making craft: baseboards, tracklaying, scenery, rolling-stock building and detailing to scale and era."
    examples: [baseboards, tracklaying, layout scenery, stock detailing]
    status: live
  - id: rc-model-building
    name: RC & Working Model Building
    kind: craft
    scope: "Building radio-controlled and working models: airframe and hull construction, covering, linkages and setup for actual operation."
    examples: [balsa airframes, covering, control linkages, trim and setup]
    status: live
