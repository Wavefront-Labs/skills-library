category: handcrafts
field: woodworking-joinery
products:
  - id: hand-cut-joinery
    name: Hand-Cut Joinery
    kind: craft
    scope: "Cutting and fitting wood joints with hand tools: dovetails, mortise-and-tenon, lap and bridle joints, layout and fitting to a piston fit."
    examples: [dovetails, mortise and tenon, joint layout, fitting]
    status: live
  - id: furniture-making
    name: Furniture Making
    kind: craft
    scope: "Designing and building whole pieces of furniture: tables, casework, beds and seating, from stock selection through assembly."
    examples: [table construction, stock selection, glue-ups, design for wood movement]
    status: live
  - id: cabinetmaking
    name: Cabinetmaking
    kind: craft
    scope: "Building carcase-based casework: cabinets, drawers, doors, fitted interiors, hardware fitting and installation-ready units."
    examples: [carcase construction, drawer making, door fitting, hinging]
    status: live
  - id: chairmaking
    name: Chairmaking
    kind: craft
    scope: "The specialised craft of building chairs: compound angles, steam bending, Windsor and ladder-back traditions, seat weaving interfaces."
    examples: [Windsor chairs, steam bending, compound-angle joinery, seat carving]
    status: live
  - id: wood-carving
    name: Wood Carving
    kind: craft
    scope: "Shaping wood by gouge, chisel and knife: relief carving, carving in the round, chip carving and whittling for objects made to use."
    examples: [relief carving, chip carving, spoon carving, letter carving in wood]
    status: live
  - id: woodturning
    name: Woodturning
    kind: craft
    scope: "Shaping wood on the lathe: spindle and faceplate turning, bowls, hollow forms, tool control and sharpening for turning."
    examples: [spindle turning, bowl turning, hollow forms, turning-tool control]
    status: live
  - id: green-woodworking
    name: Green Woodworking
    kind: craft
    scope: "Working unseasoned wood by cleaving and shaving: pole-lathe and shave-horse work, riving, and drying strategy built into the making."
    examples: [riving, pole-lathe turning, shave-horse work, cleft stock]
    status: live
  - id: japanese-joinery
    name: Japanese Joinery
    kind: craft
    scope: "The Japanese tradition of wooden joinery and tool use: pull saws, kanna planes, complex interlocking joints and sashimono fine work."
    examples: [kanna setup, interlocking joints, sashimono, pull-saw technique]
    status: live
  - id: marquetry-veneering
    name: Marquetry & Veneering
    kind: craft
    scope: "Cutting and laying veneer: decorative marquetry and parquetry pictures and patterns, veneer pressing and edge treatment."
    examples: [veneer cutting, marquetry pictures, parquetry, veneer pressing]
    status: live
  - id: wood-finishing
    name: Wood Finishing
    kind: craft
    scope: "Surface preparation and finishing of wood: oils, shellac and French polishing, varnish, lacquer, staining and colour matching."
    examples: [French polishing, oil finishes, staining, surface prep]
    status: live
