category: handcrafts
field: spinning-fibre-arts
products:
  - id: fleece-preparation
    name: Fleece & Fibre Preparation
    kind: craft
    scope: "From raw fibre to spinnable prep: skirting and sorting fleece, scouring, picking, and judging staple and crimp for the intended yarn."
    examples: [skirting, scouring, fibre selection, staple assessment]
    status: live
  - id: carding-combing
    name: Carding & Combing
    kind: craft
    scope: "Aligning fibre into rolags, batts and top: hand cards, drum carder and wool combs, and blending fibres and colours in the prep."
    examples: [hand carding, drum carding, wool combing, blending]
    status: live
  - id: wheel-spinning
    name: Wheel Spinning
    kind: craft
    scope: "Spinning yarn on the spinning wheel: drafting styles, ratios and tension, woollen and worsted spinning, and consistent singles."
    examples: [short-forward draw, long draw, ratio and tension, consistent grist]
    status: live
  - id: spindle-spinning
    name: Spindle Spinning
    kind: craft
    scope: "Spinning on drop and supported spindles: spindle control, drafting on the go and the spindle traditions' techniques."
    examples: [drop spindle, supported spindle, park and draft]
    status: live
  - id: plying-yarn-design
    name: Plying & Yarn Design
    kind: craft
    scope: "Designing and finishing yarn: plying structures, cabled and art yarns, balancing twist, and setting and finishing skeins."
    examples: [2-ply and 3-ply, cabled yarns, twist balance, finishing skeins]
    status: live
  - id: wet-felting
    name: Wet Felting
    kind: craft
    scope: "Felting wool with moisture, soap and agitation: flat felt, seamless 3D forms over resists, and nuno felting onto cloth."
    examples: [flat felt, resist felting, nuno felting, fulling]
    status: live
  - id: needle-felting
    name: Needle Felting
    kind: craft
    scope: "Sculpting and surfacing wool with barbed needles: 3D figures, core building and surface detail, and 2D needle-felted imagery on cloth."
    examples: [core shaping, surface detail, flat appliqué felting]
    status: live
