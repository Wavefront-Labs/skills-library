category: handcrafts
field: wheelwrighting
products:
  - id: hub-making
    name: Hub Making
    kind: craft
    scope: "Turning and morticing the wheel hub (nave): elm stock selection, lathe turning, boring for the axle box and cutting spoke mortices."
    examples: [nave turning, spoke mortices, axle-box boring]
    status: live
  - id: spoke-making
    name: Spoke Making
    kind: craft
    scope: "Cleaving and shaping spokes: riven oak stock, drawknife and spokeshave shaping, tenoning both ends to hub and felloe."
    examples: [spoke shaping, tenoning, dish and gather angles]
    status: live
  - id: felloe-making
    name: Felloe Making
    kind: craft
    scope: "Making the curved rim segments: sawing or bending felloes to pattern, boring for spoke tongues and jointing felloe to felloe."
    examples: [felloe sawing, spoke-tongue boring, rim jointing]
    status: live
  - id: wheel-assembly
    name: Wheel Assembly
    kind: craft
    scope: "Bringing hub, spokes and felloes together with correct dish: driving spokes, fitting felloes and truing the wheel before tyring."
    examples: [driving spokes, setting dish, truing]
    status: live
  - id: tyring
    name: Tyring
    kind: craft
    scope: "Fitting the iron tyre: measuring with the traveller, forging or rolling the hoop, heat-shrinking it onto the wheel and quenching."
    examples: [traveller measurement, tyre bending, hot fitting, quenching]
    status: live
