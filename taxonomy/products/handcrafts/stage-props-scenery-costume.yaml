category: handcrafts
field: stage-props-scenery-costume
products:
  - id: prop-fabrication
    name: Prop Fabrication
    kind: craft
    scope: "Building hand props and set dressing: foam, wood, plastics and found-object builds, weight and handling for performance, paint-ready finishing."
    examples: [foam fabrication, weapon-safe props, found-object builds, prop finishing]
    status: live
  - id: mould-making-casting-props
    name: Mould Making & Casting for Props
    kind: craft
    scope: "Reproducing props and pieces: silicone and plaster moulds, resin and foam casting, life casting and multiples for the run."
    examples: [silicone moulds, resin casting, life casting, batch multiples]
    status: live
  - id: scenic-painting
    name: Scenic Painting
    kind: craft
    scope: "Painting scenery at stage scale: faux finishes, wood and stone effects, backdrops, texture coats and reading under stage light."
    examples: [faux finishes, backdrop painting, texture coats, scale-up from maquette]
    status: live
  - id: scenic-carpentry
    name: Scenic Carpentry
    kind: craft
    scope: "Building flats, platforms, treads and rolling scenic units: theatrical framing methods, light-and-strong builds and tourable breakdown."
    examples: [flat construction, platform builds, stair units, wagon builds]
    status: live
  - id: costume-construction
    name: Costume Construction
    kind: craft
    scope: "Building costumes for performance: quick-rig closures, built-in stretch and movement, durability for the run and period silhouettes."
    examples: [quick-change rigging, period silhouettes, dance-wear builds, costume crafts finishes]
    status: live
  - id: armour-making
    name: Armour & Costume Armour Making
    kind: craft
    scope: "Making wearable armour: thermoplastics (Worbla/EVA), leather and metal armour, articulation, strapping and wearing comfort."
    examples: [thermoplastic forming, EVA builds, articulation, strapping]
    status: live
  - id: mask-making
    name: Mask Making
    kind: craft
    scope: "Making performance masks: sculpting, papier-mâché, leather and thermoplastic masks, fit, sightlines and breathability."
    examples: [mask sculpting, leather masks, fit and sightlines]
    status: live
  - id: puppet-making
    name: Puppet Making
    kind: craft
    scope: "Building puppets: rod, hand, shadow and marionette construction, mechanisms, control bars and materials that survive performance."
    examples: [marionette stringing, rod puppets, mouth mechanisms, shadow puppets]
    status: live
