category: handcrafts
field: jewellery-making
products:
  - id: goldsmithing-fabrication
    name: Goldsmithing & Fabrication
    kind: craft
    scope: "Bench fabrication in precious metal: sawing, filing, soldering, forming, ring making and building jewellery from sheet and wire."
    examples: [piercing and sawing, soldering, ring sizing and forming, sheet-and-wire construction]
    status: live
  - id: stone-setting
    name: Stone Setting
    kind: craft
    scope: "Securing stones in metal: prong, bezel, flush, channel and pavé setting, seat cutting and setting-tool control."
    examples: [bezel setting, prong work, pavé, seat cutting]
    status: live
  - id: lapidary
    name: Lapidary
    kind: craft
    scope: "Cutting and polishing gem and ornamental stone: cabochon cutting, faceting, tumbling and stone selection and orientation."
    examples: [cabochon cutting, faceting, polishing, stone orientation]
    status: live
  - id: jewellery-casting
    name: Jewellery Casting
    kind: craft
    scope: "Small-scale lost-wax casting for jewellery: wax carving and model making, spruing, investment, burnout and casting cleanup."
    examples: [wax carving, investment and burnout, sprue design, casting cleanup]
    status: live
  - id: wire-wrapping
    name: Wirework & Wire Wrapping
    kind: craft
    scope: "Cold-connection wire jewellery: wrapped settings, woven wire, findings made by hand and designs built without solder."
    examples: [wrapped stones, wire weaving, handmade findings]
    status: live
  - id: chainmaking
    name: Chainmaking & Chainmaille
    kind: craft
    scope: "Making chain by hand: loop-in-loop and fused-link chain, drawn wire, and chainmaille weaves for jewellery."
    examples: [loop-in-loop, link fusing, maille weaves]
    status: live
  - id: enamelling
    name: Enamelling
    kind: craft
    scope: "Fusing glass enamel to metal: cloisonné, champlevé, torch and kiln firing, counter-enamel and finishing enamelled surfaces."
    examples: [cloisonné, champlevé, torch firing, enamel finishing]
    status: live
  - id: hand-engraving
    name: Hand Engraving
    kind: craft
    scope: "Cutting designs into metal with gravers: lettering, scrollwork, bright-cut decoration and graver sharpening and control."
    examples: [graver control, lettering, scroll engraving, bright cutting]
    status: live
  - id: jewellery-finishing
    name: Polishing & Surface Finishing
    kind: craft
    scope: "Finishing jewellery surfaces: abrasive sequence, polishing and texturing, patinas on jewellery metals and plating-ready prep."
    examples: [abrasive sequences, mirror polishing, textures, patinas]
    status: live
