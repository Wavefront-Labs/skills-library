category: handcrafts
field: medical-dental-appliance-crafting
products:
  - id: denture-fabrication
    name: Denture Fabrication
    kind: craft
    scope: "Making complete and partial dentures to prescription: model work, occlusal registration, tooth setup, processing and finishing."
    examples: [tooth setup, flasking and processing, occlusion, finishing and polishing]
    status: live
  - id: crown-and-bridge
    name: Crown & Bridge Work
    kind: craft
    scope: "Fixed dental restorations: dies and wax-ups, casting and pressing, ceramics layering and shading, and marginal fit to the die."
    examples: [wax-ups, ceramic layering, shade matching, marginal fit]
    status: live
  - id: orthodontic-appliances
    name: Orthodontic Appliance Making
    kind: craft
    scope: "Fabricating orthodontic devices to prescription: wire bending, acrylic baseplates, retainers, expanders and functional appliances."
    examples: [wire bending, retainer acrylics, expansion appliances]
    status: live
  - id: maxillofacial-prosthetics
    name: Maxillofacial Prosthetics
    kind: craft
    scope: "Facial and body prostheses: sculpting in wax, silicone casting, intrinsic and extrinsic colouring and lifelike texture to the individual."
    examples: [wax sculpting, silicone colouring, ocular and facial prostheses]
    status: live
  - id: limb-prosthetics-fabrication
    name: Limb Prosthetics Fabrication
    kind: craft
    scope: "Fabricating artificial limbs to prescription: casting and rectifying the residual-limb model, socket lamination and thermoforming, and component assembly and alignment."
    examples: [socket lamination, model rectification, component alignment]
    status: live
  - id: orthotic-fabrication
    name: Orthotic Fabrication
    kind: craft
    scope: "Making custom braces and supports: casting and scanning-derived models, thermoplastic moulding, foot orthoses and strap and interface finishing."
    examples: [thermoplastic moulding, foot orthoses, AFO fabrication, strapping]
    status: live
  - id: ophthalmic-lens-work
    name: Ophthalmic Lens Work
    kind: craft
    scope: "Hand-finishing spectacles to prescription: lens surfacing and edging on manually tended equipment, glazing frames and final fitting checks."
    examples: [lens edging, glazing, frame alignment, prescription checking]
    status: live
  - id: hearing-mould-making
    name: Ear & Hearing-Mould Making
    kind: craft
    scope: "Custom ear pieces: taking impressions into finished moulds, casting and curing earmoulds, venting and fit for hearing aids and protection."
    examples: [impression processing, mould casting, venting, fit finishing]
    status: live
