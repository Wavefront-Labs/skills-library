    name: Scent Composition
    kind: craft
    scope: "Composing a perfume: top-heart-base structure, the fragrance families, building a formula and iterating trials to a finished scent."
    examples: [note pyramid, fragrance families, formula building, trial iteration]
    status: live
  - id: accord-building
    name: Accord Building
    kind: craft
    scope: "Constructing the building blocks: balancing materials into named accords (rose, amber, fougère bases) and keeping an accord library."
    examples: [rose accords, amber bases, material balancing]
    status: live
  - id: perfumery-materials
    name: Materials Knowledge & Evaluation
    kind: craft
    scope: "Knowing the palette: naturals and aroma chemicals, smelling technique, dilution evaluation, odour descriptors and safety limits (IFRA)."
    examples: [smelling technique, material dilutions, odour description, IFRA limits]
    status: live
  - id: natural-extraction
    name: Natural Extraction
    kind: craft
    scope: "Extracting aromatics at craft scale: tincturing, enfleurage, infusion and small-still distillation of plant material."
    examples: [tincturing, enfleurage, hydro-distillation, infusions]
    status: live
  - id: compounding-maturation
    name: Compounding & Maturation
    kind: craft
    scope: "Turning a formula into finished perfume: weighing and compounding, dilution in carrier, maceration, filtering and bottling."
