category: handcrafts
field: pottery-ceramics
products:
  - id: wheel-throwing
    name: Wheel Throwing
    kind: craft
    scope: "Forming vessels on the potter's wheel: centring, pulling walls, shaping, trimming, lids, spouts and handles, and throwing in series."
    examples: [centring, pulling cylinders, trimming, lids and spouts]
    status: live
  - id: hand-building
    name: Hand-Building
    kind: craft
    scope: "Forming clay without the wheel: pinch, coil and slab construction, sculptural vessels and large-scale built forms."
    examples: [coil building, slab construction, pinch pots, large forms]
    status: live
  - id: mould-making-slipcasting
    name: Mould Making & Slipcasting
    kind: craft
    scope: "Plaster mould making and casting slip at craft scale: model and mould design, casting, fettling and press moulding."
    examples: [plaster moulds, slip casting, press moulding, fettling]
    status: live
  - id: glaze-development
    name: Glaze Development
    kind: craft
    scope: "Glaze chemistry and testing: materials, recipes, line blends, fit and faults, and developing surfaces for a chosen firing range."
    examples: [glaze recipes, line blends, glaze fit, fault diagnosis]
    status: live
  - id: surface-decoration
    name: Surface Decoration
    kind: craft
    scope: "Decorating clay and glaze surfaces: slip work, sgraffito, underglaze and overglaze painting, carving, inlay and resist techniques."
    examples: [slip trailing, sgraffito, underglaze painting, mishima inlay]
    status: live
  - id: kiln-firing
    name: Kiln Firing
    kind: craft
    scope: "Loading and firing electric and gas kilns: schedules, cones, bisque and glaze firings, reduction control and kiln maintenance habits."
    examples: [firing schedules, cone reading, reduction firing, kiln loading]
    status: live
  - id: raku
    name: Raku
    kind: craft
    scope: "The raku process: fast firing, hot removal, post-fire reduction in combustibles, and the glazes and clay bodies that survive it."
    examples: [raku glazes, post-fire reduction, crackle surfaces]
    status: live
  - id: atmospheric-firing
    name: Atmospheric Firing
    kind: craft
    scope: "Wood, salt and soda firing: building and reading the firing, flame-path effects, wadding and placing work for the atmosphere."
    examples: [wood firing, soda firing, wadding, kiln placement]
    status: live
