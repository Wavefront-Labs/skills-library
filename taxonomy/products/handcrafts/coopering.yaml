category: handcrafts
field: coopering
products:
  - id: stave-preparation
    name: Stave Preparation
    kind: craft
    scope: "Selecting, riving or sawing, seasoning and dressing oak staves: listing, backing, hollowing and jointing to the cask's geometry."
    examples: [stave listing, jointing, hollowing and backing, seasoning]
    status: live
  - id: cask-raising
    name: Cask Raising
    kind: craft
    scope: "Raising staves into a cask: assembling within the raising hoop, firing and bending the body, drawing in with the windlass or truss hoops."
    examples: [raising up, firing and bending, trussing, shaping the belly]
    status: live
  - id: head-making
    name: Head Making
    kind: craft
    scope: "Making and fitting cask heads: dowelled head joints, cutting the cant and middle pieces, chiming, crozing and fitting the head home."
    examples: [heading up, croze cutting, chime work, dowelled joints]
    status: live
  - id: hooping
    name: Hooping
    kind: craft
    scope: "Making and driving hoops: measuring, riveting and fitting steel hoops, and traditional wooden-bound hoop work."
    examples: [hoop riveting, driving hoops, hoop sizing]
    status: live
  - id: toasting-charring
    name: Toasting & Charring
    kind: craft
    scope: "Controlled toasting and charring of cask interiors to the level a distiller or winemaker specifies, and finishing the cask tight."
    examples: [toast levels, char grades, leak testing, final finishing]
    status: live
