category: handcrafts
field: manual-machining
products:
  - id: manual-turning
    name: Manual Lathe Turning
    kind: craft
    scope: "Hand-operated metal lathe work: facing, turning, boring, screw-cutting, taper work and workholding for single parts and small batches."
    examples: [screw cutting, boring, taper turning, four-jaw setup]
    status: live
  - id: manual-milling
    name: Manual Milling
    kind: craft
    scope: "Hand-operated mill work: squaring stock, slotting, pocketing, dividing-head and rotary-table work, and tramming and setup."
    examples: [squaring stock, dividing-head work, slotting, tramming]
    status: live
  - id: benchwork-fitting
    name: Benchwork, Fitting & Filing
    kind: craft
    scope: "Hand finishing and fitting of machined parts: filing, scraping, lapping, hand tapping and reaming, and fitting assemblies to run true."
    examples: [filing flat and square, scraping, lapping, hand fitting]
    status: live
  - id: precision-grinding
    name: Precision Grinding
    kind: craft
    scope: "Manual surface, cylindrical and tool-and-cutter grinding: dressing wheels, holding tenths, and sharpening lathe and mill cutters."
    examples: [surface grinding, wheel dressing, cutter sharpening]
    status: live
  - id: measurement-inspection
    name: Measurement & Inspection
    kind: craft
    scope: "The machinist's measuring craft: micrometers, indicators, gauge blocks, layout work and inspecting a part against the drawing."
    examples: [micrometer technique, indicator work, layout and marking out, gauge blocks]
    status: live
  - id: gunsmithing-machine-work
    name: Gunsmithing Machine Work
    kind: craft
    scope: "Machining craft specific to firearms making: chambering, threading and fitting barrels, actions and small parts to close tolerances."
    examples: [barrel threading, chambering, action fitting]
    status: live
