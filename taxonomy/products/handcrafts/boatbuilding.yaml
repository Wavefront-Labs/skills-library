category: handcrafts
field: boatbuilding
products:
  - id: lofting
    name: Lofting
    kind: craft
    scope: "Drawing the hull full size from the table of offsets: fairing lines, taking off patterns, bevels and moulds before any timber is cut."
    examples: [fairing lines, taking offsets, pattern making, bevel boards]
    status: live
  - id: clinker-construction
    name: Clinker Construction
    kind: craft
    scope: "Lapstrake hull building: spiling and hanging overlapping planks, rolling bevels, riveting or clench-nailing the lands."
    examples: [spiling planks, rolling bevels, copper riveting, lapstrake repair-free fits]
    status: live
  - id: carvel-construction
    name: Carvel Construction
    kind: craft
    scope: "Smooth-skinned traditional hulls: steam-bent or sawn frames, edge-set carvel planking, caulking and paying the seams."
    examples: [framing up, carvel planking, caulking, seam paying]
    status: live
  - id: strip-plank-construction
    name: Strip-Plank & Cold-Moulded Construction
    kind: craft
    scope: "Building hulls from glued strips or laminated veneers over a mould, sheathed in epoxy and cloth: canoes, kayaks and light craft."
    examples: [strip planking, cold moulding, epoxy sheathing, fairing]
    status: live
  - id: stitch-and-glue
    name: Stitch-and-Glue Construction
    kind: craft
    scope: "Plywood hulls wired together and joined with epoxy fillets and tape: kit and plans-built dinghies, kayaks and small craft."
    examples: [panel stitching, epoxy filleting, taped seams, kit assembly]
    status: live
  - id: skin-on-frame
    name: Skin-on-Frame Building
    kind: craft
    scope: "Lashed or pegged lightweight frames covered in skin or fabric: traditional kayak, umiak, currach and coracle construction."
    examples: [steam-bent ribs, frame lashing, skinning and sealing]
    status: live
  - id: spar-making
    name: Spar & Oar Making
    kind: craft
    scope: "Making masts, booms, gaffs, oars and paddles: solid and hollow birdsmouth spars, tapering, shaping and finishing."
    examples: [birdsmouth spars, tapering, oar shaping]
    status: live
  - id: boat-joinery-fitout
    name: Boat Joinery & Fit-Out
    kind: craft
    scope: "Interior and deck joinery on a new hull: thwarts, decks, coamings, rails and fitted cabin work shaped to curved surfaces."
    examples: [deck framing, coamings, scribing to the hull, brightwork]
    status: live
