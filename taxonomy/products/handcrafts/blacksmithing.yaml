category: handcrafts
field: blacksmithing
products:
  - id: forging-fundamentals
    name: Forging Fundamentals
    kind: craft
    scope: "Core hammer-and-anvil skill: fire management, drawing out, upsetting, bending, punching, drifting and hammer control."
    examples: [fire management, drawing out, upsetting, punching and drifting]
    status: live
  - id: bladesmithing
    name: Bladesmithing
    kind: craft
    scope: "Forging knives and edged tools: blade geometry, bevel forging, grinding, handle fitting and the full knife-making sequence."
    examples: [blade forging, bevel grinding, handle fitting, edge geometry]
    status: live
  - id: pattern-welding
    name: Pattern Welding & Damascus
    kind: craft
    scope: "Forge-welding layered billets into patterned steel: stacking, welding, folding and manipulating pattern for blades and fittings."
    examples: [billet stacking, forge welds, pattern manipulation, etching]
    status: live
  - id: tool-forging
    name: Tool Forging
    kind: craft
    scope: "Forging the smith's and other trades' tools: hammers, tongs, chisels, punches, axes and edge tools, including dressing and hafting."
    examples: [tong making, hammer forging, axe making, tool dressing]
    status: live
  - id: ornamental-ironwork
    name: Ornamental Ironwork
    kind: craft
    scope: "Decorative and architectural forged work: scrolls, leaves, gates, railings and brackets, joined by rivets, collars and forge welds."
    examples: [scrollwork, leafwork, collared joints, gate and railing work]
    status: live
  - id: hardware-forging
    name: Hardware Forging
    kind: craft
    scope: "Forged functional fittings: hinges, latches, hooks, nails, handles and household ironmongery made as whole objects."
    examples: [hinge forging, latch mechanisms, hook and nail work]
    status: live
  - id: heat-treatment
    name: Heat Treatment
    kind: craft
    scope: "Hardening, tempering, annealing and normalising forged steel: reading colours, quench selection and steel-specific treatment at the forge."
    examples: [hardening and quenching, tempering colours, annealing, steel selection]
    status: live
