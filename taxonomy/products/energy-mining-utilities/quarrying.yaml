category: energy-mining-utilities
field: quarrying
products:
  - id: dimension-stone-quarrying
    name: Dimension Stone Quarrying
    kind: craft
    scope: "Extracting sound blocks of building stone: reading the rock, wire sawing and drilling lines, splitting, block handling and grading."
    examples: [reading bedding and grain, line drilling and splitting, block extraction, block grading]
    status: live
  - id: aggregate-extraction
    name: Aggregate Extraction
    kind: craft
    scope: "Winning crushed-rock aggregate: face working, bench blasting coordination, feed management to the plant and product stockpiling."
    examples: [face working, blast coordination, plant feed management, stockpile segregation control]
    status: live
  - id: sand-gravel-operations
    name: Sand and Gravel Pit Operations
    kind: craft
    scope: "Working sand and gravel deposits: dry digging and dredging, washing and classifying, water management and pit restoration faces."
    examples: [dredge operation, washing and classifying, pit water management, grade blending]
    status: live
  - id: quarry-blasting
    name: Quarry Blasting
    kind: craft
    scope: "Shotfiring in quarries: bench blast design execution, charging, flyrock and vibration control, post-blast inspection."
    examples: [bench charging, flyrock control, vibration monitoring, post-blast inspection]
    status: live
  - id: primary-stone-cutting
    name: Primary Stone Cutting
    kind: craft
    scope: "First-stage cutting of quarried stone: diamond wire saws, gang and circular saws, slabbing and trimming blocks to merchantable sizes."
    examples: [diamond wire sawing, gang saw slabbing, block trimming, saw blade care]
    status: live
  - id: crushing-screening-plants
    name: Crushing and Screening Plants
    kind: application
    scope: "Operating fixed and mobile crushing and screening trains: jaw, cone and impact crushers, screens and conveyors, settings and blockage clearance."
    examples: [crusher setting adjustment, screen media changes, blockage clearance, conveyor care]
    status: live
  - id: quarry-mobile-plant
    name: Quarry Mobile Plant
    kind: application
    scope: "Operating quarry mobile equipment: excavators, wheel loaders, dump trucks and drill rigs on benches, faces and stockpiles."
    examples: [excavator face work, loader stockpile work, dump truck cycles, bench drilling]
    status: live
