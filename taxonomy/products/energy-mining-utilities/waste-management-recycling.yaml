category: energy-mining-utilities
field: waste-management-recycling
products:
  - id: waste-collection-operations
    name: Waste Collection Operations
    kind: craft
    scope: "Collecting household and commercial waste: round working, refuse vehicle and lifter operation, bin and container handling, contamination spotting."
    examples: [round working, bin lifter operation, contamination checks, commercial container lifts]
    status: live
  - id: materials-recovery-sorting
    name: Materials Recovery and Sorting
    kind: craft
    scope: "Sorting recyclables at MRFs and transfer stations: picking-line work, running screens, eddy-current and optical sorters, bale quality control."
    examples: [picking line technique, optical sorter operation, baler operation, output quality grading]
    status: live
  - id: landfill-operations
    name: Landfill Operations
    kind: craft
    scope: "Operating landfills: tipping face management, compaction and cover, leachate and landfill-gas system operation, environmental monitoring rounds."
    examples: [tipping face control, compactor operation, leachate management, gas well balancing]
    status: live
  - id: composting-operations
    name: Composting Operations
    kind: craft
    scope: "Processing organic waste: windrow and in-vessel composting, turning and moisture control, temperature monitoring and product screening."
    examples: [windrow turning, temperature monitoring, moisture control, compost screening]
    status: live
  - id: incineration-energy-from-waste
    name: Incineration and Energy-from-Waste Operation
    kind: craft
    scope: "Operating waste incinerators and EfW plants: grate and feed control, combustion management, flue-gas treatment and bottom-ash handling."
    examples: [grate feed control, combustion control, flue-gas treatment, ash handling]
    status: live
  - id: hazardous-waste-handling
    name: Hazardous Waste Handling
    kind: craft
    scope: "Handling hazardous and clinical waste: identification and segregation, packaging and labelling, manifest paperwork and spill response."
    examples: [waste identification, segregation and packaging, consignment paperwork, spill response]
    status: live
  - id: scrap-metal-recycling
    name: Scrap Metal Recycling
    kind: craft
    scope: "Recovering and processing scrap metal: grading and sorting alloys, shearing, baling and shredding, weighbridge and depollution work."
    examples: [metal grading, shear and baler operation, vehicle depollution, weighbridge practice]
    status: live
  - id: e-waste-processing
    name: E-Waste Processing
    kind: craft
    scope: "Processing waste electronics: safe dismantling, battery and hazardous component removal, data-bearing device handling and material fraction recovery."
    examples: [device dismantling, battery removal, CRT and screen handling, fraction sorting]
    status: live
  - id: informal-waste-reclamation
    name: Informal Waste Reclamation
    kind: craft
    scope: "Scavenging and reclaiming value from waste: safe picking on dumps and streets, material identification and valuation, collection and sale to buyers."
    examples: [safe picking practice, material valuation, cart and route working, selling to aggregators]
    status: live
