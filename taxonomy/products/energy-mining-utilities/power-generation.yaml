category: energy-mining-utilities
field: power-generation
products:
  - id: fossil-steam-plant-operation
    name: Fossil Steam Plant Operation
    kind: craft
    scope: "Operating coal-, oil- and gas-fired steam plant: boiler firing, feedwater and steam cycle control, soot blowing, startups and shutdowns."
    examples: [boiler firing control, cold startup, drum level control, load ramping]
    status: live
  - id: gas-turbine-plant-operation
    name: Gas Turbine and Combined-Cycle Operation
    kind: craft
    scope: "Operating gas turbines and combined-cycle plant: turbine starts, HRSG operation, duct firing and fast cycling."
    examples: [turbine start sequences, HRSG operation, combined-cycle dispatch, trip diagnosis]
    status: live
  - id: nuclear-plant-operation
    name: Nuclear Plant Operation
    kind: craft
    scope: "Licensed operation of nuclear reactors: reactivity management, primary and secondary plant control, conduct of operations, refuelling outage support."
    examples: [reactivity management, conduct of operations, plant evolutions, outage support]
    status: live
  - id: hydroelectric-plant-operation
    name: Hydroelectric Plant Operation
    kind: craft
    scope: "Operating hydro stations: turbine-governor control, unit starts and synchronisation, reservoir and spillway management, dam patrols."
    examples: [unit synchronisation, governor operation, spillway gate operation, reservoir management]
    status: live
  - id: combined-heat-power-operation
    name: Combined Heat and Power Operation
    kind: craft
    scope: "Running CHP and district-energy generation plant: balancing heat and electrical output, engine and turbine cogeneration sets, heat recovery circuits."
    examples: [heat-electric load balancing, cogeneration set operation, heat recovery tuning]
    status: live
  - id: control-room-operations
    name: Power Plant Control Room Operations
    kind: craft
    scope: "The control-room craft across plant types: panel watchkeeping, alarm response, log keeping, shift turnover and abnormal-event management."
    examples: [alarm flood management, shift turnover, abnormal event response, log keeping]
    status: live
  - id: power-plant-water-chemistry
    name: Power Plant Water Chemistry
    kind: craft
    scope: "Controlling boiler, steam-cycle and cooling-water chemistry: sampling, dosing, demineraliser operation and corrosion-scale prevention."
    examples: [cycle chemistry sampling, chemical dosing, demineraliser regeneration, cooling tower treatment]
    status: live
  - id: turbine-boiler-maintenance
    name: Turbine and Boiler Maintenance
    kind: craft
    scope: "Maintaining live generating plant: turbine-generator overhauls, boiler tube repair, valve and pump maintenance, outage execution."
    examples: [turbine overhaul support, boiler tube repair, valve maintenance, outage planning]
    status: live
  - id: plant-dcs
    name: Plant Distributed Control Systems
    kind: application
    scope: "Operating and tuning power-plant DCS and SCADA: graphics navigation, loop tuning, interlocks and alarm management on live control systems."
    examples: [DCS operation, control loop tuning, alarm rationalisation, interlock testing]
    status: live
  - id: emissions-monitoring-systems
    name: Continuous Emissions Monitoring Systems
    kind: application
    scope: "Running CEMS and stack monitoring: analyser calibration, data validation, availability upkeep and compliance reporting from the plant side."
    examples: [analyser calibration, data validation, span checks, compliance reporting]
    status: live
