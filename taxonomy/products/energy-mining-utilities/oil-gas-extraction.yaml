category: energy-mining-utilities
field: oil-gas-extraction
products:
  - id: drilling-operations
    name: Drilling Operations
    kind: craft
    scope: "Making hole on a rotary rig: tripping pipe, mud handling, casing and cementing support, rig-floor roles from roughneck to driller."
    examples: [tripping pipe, mud management, casing running, rig-floor teamwork]
    status: live
  - id: well-control
    name: Well Control
    kind: craft
    scope: "Detecting and controlling kicks and preventing blowouts: shut-in procedures, kill methods, BOP operation and pressure monitoring."
    examples: [kick detection, shut-in procedure, driller's method, BOP drills]
    status: live
  - id: directional-drilling
    name: Directional Drilling
    kind: craft
    scope: "Steering the wellbore: survey interpretation, toolface control, sliding and rotating with motors and rotary-steerable systems, geosteering with the well plan."
    examples: [toolface control, survey interpretation, slide-rotate sequencing, anti-collision awareness]
    status: live
  - id: well-completion-workover
    name: Well Completion and Workover
    kind: craft
    scope: "Finishing and servicing wells: perforating, stimulation and fracturing support, packer and tubing work, workover rig operations."
    examples: [perforating, frac support, tubing and packer work, workover rig-up]
    status: live
  - id: production-operations
    name: Production Operations
    kind: craft
    scope: "Operating producing wells and gathering facilities: separators, heater-treaters, tank batteries, well surveillance and daily pumper rounds."
    examples: [separator operation, tank battery gauging, well surveillance, pumper rounds]
    status: live
  - id: offshore-platform-operations
    name: Offshore Platform Operations
    kind: craft
    scope: "Running offshore production facilities: process train operation, permit-to-work, helideck and crane logistics, emergency shutdown systems."
    examples: [process train operation, permit-to-work, ESD response, platform logistics]
    status: live
  - id: field-gas-processing
    name: Field Gas Processing
    kind: craft
    scope: "Conditioning produced gas in the field: dehydration, sweetening, compression and dew-point control at gathering and processing plants."
    examples: [glycol dehydration, amine sweetening, compressor operation, dew-point control]
    status: live
  - id: well-testing-measurement
    name: Well Testing and Measurement
    kind: craft
    scope: "Measuring what wells produce: flow testing, custody-transfer metering, sampling and production allocation."
    examples: [flow testing, orifice metering, fluid sampling, production allocation]
    status: live
  - id: drilling-rig-systems
    name: Drilling Rig Systems
    kind: application
    scope: "Operating the rig's machinery: drawworks, top drives, mud pumps, iron roughnecks and pipe-handling systems, plus rig instrumentation."
    examples: [top drive operation, drawworks control, mud pump upkeep, pipe-handling automation]
    status: live
  - id: wireline-coiled-tubing
    name: Wireline and Coiled Tubing Units
    kind: application
    scope: "Running wireline and coiled-tubing interventions: logging and slickline runs, fishing, CT cleanouts and nitrogen lifts."
    examples: [slickline runs, logging support, CT cleanouts, fishing operations]
    status: live
  - id: artificial-lift-systems
    name: Artificial Lift Systems
    kind: application
    scope: "Installing, optimising and troubleshooting artificial lift: beam pumps, ESPs, gas lift and plunger lift."
    examples: [beam pump dyno cards, ESP troubleshooting, gas lift valve staging, plunger lift tuning]
    status: live
