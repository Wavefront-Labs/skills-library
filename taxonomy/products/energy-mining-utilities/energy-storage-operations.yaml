category: energy-mining-utilities
field: energy-storage-operations
products:
  - id: battery-storage-operation
    name: Battery Storage Plant Operation
    kind: craft
    scope: "Operating grid-scale battery plants: state-of-charge management, thermal management, inverter and container monitoring, grid-service response."
    examples: [state-of-charge management, thermal monitoring, inverter fault response, frequency-response events]
    status: live
  - id: battery-plant-maintenance
    name: Battery Plant Maintenance and Safety
    kind: craft
    scope: "Maintaining battery storage safely: module and rack swaps, HVAC and fire-suppression upkeep, thermal-runaway precautions and isolation procedures."
    examples: [module replacement, fire suppression checks, DC isolation, thermal-runaway precautions]
    status: live
  - id: pumped-hydro-operation
    name: Pumped Hydro Storage Operation
    kind: craft
    scope: "Operating pumped-storage stations: pump-generate mode changes, reservoir cycling, unit starts and penstock and waterway care."
    examples: [mode changeovers, reservoir cycling, unit synchronisation, waterway inspection]
    status: live
  - id: thermal-mechanical-storage-operation
    name: Thermal and Mechanical Storage Operation
    kind: craft
    scope: "Running other storage plant: flywheels, compressed-air storage, molten-salt and hot-water thermal stores, charge-discharge cycling."
    examples: [molten-salt loop operation, flywheel monitoring, CAES cycling, thermal store charging]
    status: live
  - id: storage-dispatch
    name: Storage Dispatch and Scheduling
    kind: craft
    scope: "Scheduling and dispatching storage against grid needs: charge-discharge windows, grid-service commitments, cycling limits and availability declarations."
    examples: [charge-discharge scheduling, ancillary service commitment, cycle budgeting, availability declarations]
    status: live
  - id: battery-management-systems
    name: Battery and Energy Management Systems
    kind: application
    scope: "Using BMS and site EMS platforms: cell-level data reading, alarm triage, balancing diagnostics and firmware-driven derating behaviour."
    examples: [cell data interpretation, BMS alarm triage, balancing diagnostics, derating analysis]
    status: live
