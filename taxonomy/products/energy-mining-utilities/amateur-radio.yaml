category: energy-mining-utilities
field: amateur-radio
products:
  - id: hf-operating
    name: HF Operating
    kind: craft
    scope: "Working the HF bands: propagation reading, band plans, phone operating procedure, DXing and pileup technique, logging and QSLing."
    examples: [propagation reading, pileup technique, DXing, logging and QSL]
    status: live
  - id: vhf-uhf-operating
    name: VHF/UHF and Repeater Operating
    kind: craft
    scope: "Local and line-of-sight operating: repeater procedure, simplex work, tropo and sporadic-E openings, satellites and mobile/portable operation."
    examples: [repeater procedure, amateur satellite passes, portable operation, band openings]
    status: live
  - id: cw-morse
    name: CW and Morse Code
    kind: craft
    scope: "Morse operating: sending with straight keys and paddles, head-copying at speed, CW procedure and abbreviations, QRS to contest-speed work."
    examples: [paddle sending, head copying, CW procedure, speed building]
    status: live
  - id: antenna-building-tuning
    name: Antenna Building and Tuning
    kind: craft
    scope: "Making and tuning amateur antennas: wire antennas, verticals and beams, feedline and matching, SWR measurement and practical installation."
    examples: [dipole construction, SWR tuning, matching networks, antenna raising]
    status: live
  - id: emergency-communications
    name: Emergency Communications
    kind: craft
    scope: "Amateur radio in emergencies: net control and directed nets, formal message traffic handling, off-grid power and deployed station setup."
    examples: [net control, formal traffic handling, field station setup, battery and solar power]
    status: live
  - id: contesting
    name: Contesting
    kind: craft
    scope: "Competitive operating: contest strategy, run and search-and-pounce technique, rate management, logging software use and log submission."
    examples: [run technique, search and pounce, rate management, log submission]
    status: live
  - id: radio-direction-finding
    name: Radio Direction Finding
    kind: craft
    scope: "Locating transmitters: foxhunting technique, directional antennas and attenuators, triangulation and interference-source hunting."
    examples: [foxhunting, triangulation, attenuator technique, interference hunting]
    status: live
  - id: digital-mode-software
    name: Digital Mode Software (WSJT-X/fldigi)
    kind: application
    scope: "Operating digital modes with WSJT-X, fldigi and companion tools: FT8/FT4, RTTY and PSK31, rig-computer interfacing, levels and logging integration."
    examples: [FT8 operating, rig interfacing, audio level setup, log integration]
    status: live
  - id: software-defined-radio
    name: Software-Defined Radio
    kind: application
    scope: "Receiving and operating with SDRs: SDR receiver software, panadapter use, decoding utility and amateur signals, SDR transceiver setup."
    examples: [SDR receiver setup, panadapter operating, signal identification, waterfall reading]
    status: live
