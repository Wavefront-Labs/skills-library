category: energy-mining-utilities
field: power-transmission-distribution
products:
  - id: overhead-line-work
    name: Overhead Line Work
    kind: craft
    scope: "Building out, maintaining and fault-fixing overhead lines on the live network: pole-top and tower work, conductor stringing and repair, hardware replacement."
    examples: [pole-top rescue readiness, conductor repair, insulator replacement, storm restoration]
    status: live
  - id: live-line-work
    name: Live-Line Work
    kind: craft
    scope: "Working energised conductors: hot-stick and rubber-glove methods, barehand transmission work, minimum approach distances and insulated tooling."
    examples: [hot-stick technique, rubber-glove work, barehand bonding, minimum approach distances]
    status: live
  - id: underground-cable-jointing
    name: Underground Cable Jointing
    kind: craft
    scope: "Jointing and terminating underground power cables: MV/HV joint and termination builds, cable fault location, pulling and proving."
    examples: [MV joint builds, terminations, cable fault location, cable identification and spiking]
    status: live
  - id: substation-operations
    name: Substation Operations
    kind: craft
    scope: "Operating and maintaining substations: switchgear operation, transformer care, battery and auxiliary systems, inspections and oil sampling."
    examples: [switchgear operation, transformer inspection, DC battery checks, oil sampling]
    status: live
  - id: network-switching
    name: Network Switching and Isolation
    kind: craft
    scope: "Planning and executing switching programs: isolations, earthing, permits and sanction-for-test, safe system of work on the live network."
    examples: [switching schedules, isolation and earthing, permit-to-work, point-of-work risk checks]
    status: live
  - id: protection-relay-testing
    name: Protection and Relay Testing
    kind: craft
    scope: "Testing and maintaining protection schemes in service: relay secondary injection, CT/VT checks, scheme commissioning checks and fault-record analysis."
    examples: [secondary injection testing, CT ratio checks, relay settings verification, fault record analysis]
    status: live
  - id: grid-dispatch
    name: Grid Dispatch and System Operation
    kind: craft
    scope: "Operating the grid from the control room: load balancing, frequency and voltage control, outage coordination and emergency load shedding."
    examples: [load-frequency balancing, voltage control, outage coordination, load shedding]
    status: live
  - id: metering-operations
    name: Metering and AMI Operations
    kind: craft
    scope: "Installing, reading and running meters and smart-meter networks: meter exchange, AMI head-end operations, consumption data validation and revenue-protection checks."
    examples: [meter installation, AMI head-end operation, read validation, tamper detection]
    status: live
  - id: scada-ems
    name: Grid SCADA and EMS
    kind: application
    scope: "Using SCADA and energy management systems on the live grid: telemetry monitoring, remote control, state estimation outputs and alarm handling."
    examples: [telemetry monitoring, remote switching, alarm handling, RTU point checks]
    status: live
