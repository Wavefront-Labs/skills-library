category: energy-mining-utilities
field: mineral-mining
products:
  - id: drilling-blasting
    name: Drilling and Blasting
    kind: craft
    scope: "Production drilling and blasting in mines: blasthole patterns, charging, initiation systems, misfire handling and blast execution."
    examples: [blasthole patterns, charging and stemming, initiation sequencing, misfire procedures]
    status: live
  - id: underground-mining-methods
    name: Underground Mining Methods
    kind: craft
    scope: "Working underground extraction methods day to day: room-and-pillar, longwall, cut-and-fill, sublevel and block caving cycles."
    examples: [room-and-pillar cycles, stoping practice, development headings, drawpoint management]
    status: live
  - id: surface-mining-operations
    name: Surface Mining Operations
    kind: craft
    scope: "Running open-pit and strip-mine extraction: bench development, loading and hauling cycles, dump and stockpile management."
    examples: [bench sequencing, load-and-haul cycles, haul road upkeep, stockpile management]
    status: live
  - id: ground-control
    name: Ground Control and Support
    kind: craft
    scope: "Keeping workings stable: rock bolting, mesh and shotcrete installation, strata monitoring and reading ground conditions."
    examples: [rock bolting, shotcrete and mesh, strata monitoring, scaling loose ground]
    status: live
  - id: mine-ventilation
    name: Mine Ventilation
    kind: craft
    scope: "Operating and adjusting underground ventilation: fans, regulators and stoppings, airflow surveys, gas and dust control."
    examples: [airflow surveys, regulator adjustment, methane control, dust suppression]
    status: live
  - id: mineral-processing
    name: Mineral Processing and Beneficiation
    kind: craft
    scope: "Turning run-of-mine ore into saleable concentrate: crushing, grinding, flotation, gravity and magnetic separation, thickening and dewatering."
    examples: [crusher and mill operation, flotation circuits, gravity separation, dewatering]
    status: live
  - id: tailings-operations
    name: Tailings Facility Operations
    kind: craft
    scope: "Operating tailings storage day to day: deposition plans, decant and water management, dam inspection and monitoring instruments."
    examples: [deposition management, decant operation, dam inspections, piezometer readings]
    status: live
  - id: mine-rescue
    name: Mine Rescue and Emergency Response
    kind: craft
    scope: "Responding to underground emergencies: breathing apparatus work, gas testing, fire fighting, barricade and refuge procedures, casualty recovery."
    examples: [breathing apparatus drills, gas testing, refuge procedures, casualty recovery]
    status: live
  - id: continuous-miner-longwall
    name: Continuous Miner and Longwall Systems
    kind: application
    scope: "Operating mechanised coal-cutting systems: continuous miners, shearers, armoured face conveyors and powered roof supports."
    examples: [shearer operation, powered support advance, continuous miner cutting, AFC management]
    status: live
  - id: load-haul-dump
    name: Load-Haul-Dump and Mine Mobile Plant
    kind: application
    scope: "Operating mine mobile equipment: LHDs, underground trucks, haul trucks, shovels, draglines and drill rigs, including remote and tele-operation."
    examples: [LHD bogging, haul truck operation, shovel loading, tele-remote operation]
    status: live
  - id: mine-dispatch-systems
    name: Mine Fleet Dispatch Systems
    kind: application
    scope: "Running fleet management and dispatch software that assigns trucks and shovels, tracks cycles and reports production in real time."
    examples: [truck assignment, cycle tracking, shift production reporting, delay coding]
    status: live
  - id: gas-monitoring-systems
    name: Mine Gas and Atmosphere Monitoring Systems
    kind: application
    scope: "Using fixed and handheld atmospheric monitors underground: multi-gas detectors, tube bundle systems and telemetric sensors, with calibration and alarm response."
    examples: [multi-gas detector use, sensor calibration, alarm response, tube bundle readings]
    status: live
