category: energy-mining-utilities
field: water-treatment-supply
products:
  - id: water-treatment-plant-operation
    name: Water Treatment Plant Operation
    kind: craft
    scope: "Operating drinking-water treatment: coagulation and flocculation, sedimentation, filtration, disinfection dosing and jar testing."
    examples: [coagulant dosing, filter backwashing, chlorine dosing, jar testing]
    status: live
  - id: water-quality-monitoring
    name: Water Quality Monitoring
    kind: craft
    scope: "Sampling and testing water from source to tap: bacteriological and chemical sampling, online analyser care, compliance interpretation and incident triggers."
    examples: [sampling technique, chlorine residual testing, turbidity monitoring, compliance interpretation]
    status: live
  - id: distribution-network-operations
    name: Water Distribution Network Operations
    kind: craft
    scope: "Running the water network: valve and hydrant operation, pressure management, mains flushing, rezoning and supply interruptions."
    examples: [valve operations, pressure management, mains flushing, planned interruptions]
    status: live
  - id: water-mains-maintenance
    name: Water Mains Repair and Maintenance
    kind: craft
    scope: "Repairing live water mains and services: burst repair, service connections under pressure, disinfection of repaired mains and reinstatement handoff."
    examples: [burst main repair, under-pressure connections, main disinfection, service renewals]
    status: live
  - id: leak-detection
    name: Leak Detection
    kind: craft
    scope: "Finding hidden leaks: acoustic listening and correlation, step testing, minimum night flow analysis and non-revenue water reduction."
    examples: [acoustic correlation, step testing, night flow analysis, listening stick technique]
    status: live
  - id: pumping-storage-operations
    name: Water Pumping and Storage Operations
    kind: craft
    scope: "Operating pump stations, boreholes, reservoirs and water towers: pump scheduling, level control, source switching and reservoir hygiene."
    examples: [pump scheduling, reservoir level control, borehole operation, reservoir inspection]
    status: live
  - id: desalination-plant-operation
    name: Desalination Plant Operation
    kind: craft
    scope: "Operating desalination plants: reverse-osmosis train operation, membrane cleaning, pre-treatment control and brine discharge management."
    examples: [RO train operation, membrane CIP cleaning, pre-treatment control, brine management]
    status: live
  - id: water-scada-telemetry
    name: Water SCADA and Telemetry
    kind: application
    scope: "Using water-utility SCADA and telemetry: outstation alarms, remote pump and valve control, logger data retrieval and trend reading."
    examples: [alarm response, remote pump control, logger data analysis, telemetry fault-finding]
    status: live
