category: energy-mining-utilities
field: telecommunications-network-operations
products:
  - id: noc-operations
    name: Network Operations Centre
    kind: craft
    scope: "Running live networks from the NOC: alarm surveillance, incident triage and escalation, change windows, outage bridges and service restoration."
    examples: [alarm triage, incident escalation, maintenance windows, outage bridge management]
    status: live
  - id: fiber-optic-splicing
    name: Fibre Optic Splicing
    kind: craft
    scope: "Jointing optical fibre in the field: fusion splicing, closure builds, loss budgets in practice, tray management and restoration splicing."
    examples: [fusion splicing, closure preparation, splice loss control, cut restoration]
    status: live
  - id: copper-cable-splicing
    name: Copper Cable Splicing
    kind: craft
    scope: "Jointing and maintaining copper telecom cable: pair identification and splicing, bonding and grounding, pressurised cable care and fault clearing."
    examples: [pair splicing, cable identification, air-pressure maintenance, fault clearing]
    status: live
  - id: outside-plant-maintenance
    name: Outside Plant Maintenance
    kind: craft
    scope: "Maintaining the physical network between exchange and customer: ducts and poles, cabinets and pedestals, drop installation and repair, locating and protecting plant."
    examples: [cabinet maintenance, drop repairs, duct rodding, plant locating]
    status: live
  - id: cell-site-maintenance
    name: Cell Site Maintenance
    kind: craft
    scope: "Keeping mobile sites on air: radio and baseband swaps, antenna and feeder checks, power and battery systems, site alarms and access."
    examples: [radio unit swaps, feeder sweep checks, site power and batteries, alarm clearing]
    status: live
  - id: tower-work
    name: Tower Climbing and Rigging
    kind: craft
    scope: "Working telecom towers and masts: climbing and fall protection, rigging and hoisting equipment, antenna mounting and positioning, rescue readiness."
    examples: [climbing and fall arrest, load rigging, antenna mounting, tower rescue]
    status: live
  - id: microwave-satellite-operations
    name: Microwave and Satellite Link Operations
    kind: craft
    scope: "Operating point-to-point radio and satellite links: dish alignment, link commissioning checks, interference hunting and earth-station watchkeeping."
    examples: [path alignment, link commissioning, interference hunting, earth-station operations]
    status: live
  - id: network-test-instruments
    name: Network Test Instruments
    kind: application
    scope: "Field-testing circuits with OTDRs, light sources and power meters, copper testers, spectrum analysers and Ethernet testers to localise faults and prove service."
    examples: [OTDR trace reading, loss testing, copper pair testing, Ethernet service turn-up tests]
    status: live
  - id: intercarrier-settlement-porting
    name: Inter-Carrier Settlement and Number Portability
    kind: craft
    scope: "Operating shared industry clearinghouse functions: number porting workflows, inter-carrier billing and settlement, dispute reconciliation and routing data upkeep."
    examples: [port order handling, settlement reconciliation, routing database updates, dispute resolution]
    status: live
  - id: carrier-fraud-prevention
    name: Carrier Fraud Detection and Prevention
    kind: craft
    scope: "Detecting and stopping telecom fraud from the operator side: traffic anomaly analysis, bypass and IRSF detection, test-call campaigns and blocking actions."
    examples: [traffic anomaly analysis, SIM-box detection, IRSF response, number-range blocking]
    status: live
