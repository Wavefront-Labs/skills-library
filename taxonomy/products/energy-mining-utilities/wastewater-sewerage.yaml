category: energy-mining-utilities
field: wastewater-sewerage
products:
  - id: sewage-treatment-plant-operation
    name: Sewage Treatment Plant Operation
    kind: craft
    scope: "Operating wastewater treatment works: screening and grit removal, activated sludge and trickling filter processes, clarifiers, aeration control and final effluent quality."
    examples: [activated sludge control, aeration tuning, clarifier operation, effluent compliance]
    status: live
  - id: sludge-biosolids-handling
    name: Sludge and Biosolids Handling
    kind: craft
    scope: "Processing sludge: thickening, anaerobic digestion, dewatering presses and centrifuges, biosolids storage and dispatch to land or disposal."
    examples: [sludge thickening, digester operation, centrifuge dewatering, biosolids dispatch]
    status: live
  - id: sewer-network-maintenance
    name: Sewer Network Maintenance
    kind: craft
    scope: "Maintaining the sewer network: blockage clearance, confined-space manhole entry, repair coordination, fatberg and root removal, overflow response."
    examples: [blockage clearance, confined-space entry, root cutting, overflow response]
    status: live
  - id: lift-station-operations
    name: Sewage Lift Station Operations
    kind: craft
    scope: "Operating and maintaining sewage pumping stations: pump unblocking and changeouts, wet-well cleaning, float and level control, odour management."
    examples: [pump unblocking, wet-well cleaning, level control setup, odour control]
    status: live
  - id: septic-system-servicing
    name: Septic System Servicing
    kind: craft
    scope: "Servicing onsite wastewater systems: tank pump-outs, drainfield assessment, baffle and filter maintenance and system troubleshooting."
    examples: [tank pump-out, drainfield assessment, effluent filter service, system troubleshooting]
    status: live
  - id: wastewater-sampling-analysis
    name: Wastewater Sampling and Analysis
    kind: craft
    scope: "Sampling and testing wastewater: composite sampling, BOD/COD and ammonia testing, settleability and microscopy, trade effluent checks."
    examples: [composite sampling, BOD and ammonia tests, sludge settleability, trade effluent monitoring]
    status: live
  - id: cctv-sewer-inspection
    name: CCTV Sewer Inspection
    kind: application
    scope: "Surveying sewers with CCTV crawlers and push cameras: driving the crawler, condition coding to standard schemes and reporting defects."
    examples: [crawler operation, defect condition coding, survey reporting, camera care]
    status: live
  - id: jetting-vacuum-units
    name: Jetting and Vacuum Units
    kind: application
    scope: "Operating high-pressure jetting and vacuum/combination tankers: nozzle selection, jetting technique, vacuum loading and safe discharge."
    examples: [nozzle selection, jetting technique, vacuum loading, tanker discharge]
    status: live
