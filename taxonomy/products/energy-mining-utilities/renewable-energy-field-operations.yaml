category: energy-mining-utilities
field: renewable-energy-field-operations
products:
  - id: wind-turbine-maintenance
    name: Wind Turbine Maintenance
    kind: craft
    scope: "Servicing and fault-finding wind turbines up-tower: gearbox, generator, pitch and yaw systems, converter faults, scheduled service rounds."
    examples: [pitch system faults, gearbox inspection, converter troubleshooting, scheduled service]
    status: live
  - id: blade-inspection-repair
    name: Blade Inspection and Repair
    kind: craft
    scope: "Inspecting and repairing turbine blades: rope access and platform work, leading-edge erosion repair, composite laminate patching, lightning system checks."
    examples: [leading-edge repair, composite patching, rope access inspection, lightning receptor checks]
    status: live
  - id: solar-pv-plant-operations
    name: Solar PV Plant Operations
    kind: craft
    scope: "Operating and fault-finding utility-scale PV plants: string and inverter fault isolation, tracker maintenance, performance monitoring and panel care."
    examples: [string fault isolation, inverter resets and faults, tracker maintenance, soiling management]
    status: live
  - id: geothermal-plant-operations
    name: Geothermal Plant Operations
    kind: craft
    scope: "Operating geothermal fields and plants: production and injection well management, steam gathering, scaling and brine handling, turbine operation."
    examples: [wellfield management, steam separator operation, scale control, brine reinjection]
    status: live
  - id: biogas-plant-operations
    name: Biogas and Anaerobic Digester Operations
    kind: craft
    scope: "Running anaerobic digestion and biogas plants: feedstock management, digester biology and temperature control, gas cleanup and engine-generator operation."
    examples: [feedstock loading, digester stability, gas scrubbing, CHP engine operation]
    status: live
  - id: wind-farm-scada
    name: Wind Farm SCADA
    kind: application
    scope: "Using wind-farm SCADA and condition monitoring: remote resets, alarm triage, performance and vibration data reading, curtailment handling."
    examples: [remote turbine resets, alarm triage, power curve checks, vibration trend reading]
    status: live
  - id: pv-test-instruments
    name: PV Test Instruments
    kind: application
    scope: "Field-testing PV systems with IV-curve tracers, insulation testers, thermal cameras and irradiance meters to find and prove faults."
    examples: [IV-curve tracing, insulation resistance tests, drone thermography, irradiance measurement]
    status: live
