category: sports-recreation
field: golf
products:
  - id: full-swing-technique
    name: Full Swing Technique
    kind: craft
    scope: "The golf swing with driver through irons: setup, swing mechanics, ball flight laws and fault fixing."
    examples: [swing mechanics, ball flight laws, driver vs iron setup, fault diagnosis]
    status: live
  - id: short-game-and-putting
    name: Short Game and Putting
    kind: craft
    scope: "Scoring from 100 yards in: chipping, pitching, bunker play and putting technique and green reading."
    examples: [chipping technique, bunker play, green reading, putting stroke]
    status: live
  - id: course-management
    name: Course Management
    kind: craft
    scope: "Playing the course rather than the swing: strategy, club selection, risk decisions and scoring formats."
