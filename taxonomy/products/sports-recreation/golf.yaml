    status: live
  - id: club-fitting
    name: Club Fitting
    kind: craft
    scope: "Matching equipment to the golfer: lie and loft, shaft selection, gapping and launch-monitor fitting."
    examples: [shaft fitting, lie and loft adjustment, set gapping, launch-monitor data]
    status: live
  - id: caddying
    name: Caddying
    kind: craft
    scope: "Working the bag: yardages, reads, club advice and managing a player through a round."
    examples: [yardage books, green reads, club advice, player management]
    status: live
  - id: disc-golf
    name: Disc Golf
    kind: craft
    scope: "Disc golf: throwing technique, disc selection, course strategy and putting."
