category: sports-recreation
field: esports
products:
  - id: fps-esports
    name: FPS Esports
    kind: craft
    scope: "Competitive first-person shooters: aim training, utility usage, map control and team executes."
    examples: [aim training, crosshair placement, utility lineups, site executes]
    status: live
  - id: moba-esports
    name: MOBA Esports
    kind: craft
    scope: "Competitive MOBAs: laning, macro play, drafting and team coordination."
    examples: [laning fundamentals, macro rotations, draft strategy, objective control]
    status: live
  - id: fighting-game-esports
    name: Fighting Game Esports
    kind: craft
    scope: "Competitive fighting games: execution, frame data, neutral and matchup study."
    examples: [combo execution, frame data, neutral game, matchup study]
    status: live
  - id: battle-royale-esports
    name: Battle Royale Esports
    kind: craft
    scope: "Competitive battle royale play: drop strategy, zone rotations, loot economy and endgame fights."
    examples: [drop strategy, zone rotations, third-party awareness, endgame positioning]
    status: live
  - id: rts-and-card-esports
    name: RTS and Card Esports
    kind: craft
    scope: "Competitive strategy titles: build orders, economy management, digital card play and ladder climbing."
    examples: [build orders, macro economy, deck piloting, ladder strategy]
    status: live
  - id: sim-racing-esports
    name: Sim Racing Esports
    kind: craft
    scope: "Competitive racing simulation: rig setup, car control in the sim, racecraft and league racing."
    examples: [sim rig setup, braking technique, online racecraft, league etiquette]
    status: live
  - id: esports-coaching-and-analysis
    name: Esports Coaching and Analysis
    kind: craft
    scope: "Coaching esports teams and players: VOD review, scrim structure, stats analysis and preparation."
    examples: [VOD review, scrim blocks, stat analysis, opponent prep]
    status: live
  - id: casting-and-shoutcasting
    name: Casting and Shoutcasting
    kind: craft
    scope: "Broadcasting competitive games: play-by-play, colour analysis and observing the game for viewers."
    examples: [play-by-play delivery, colour analysis, observer craft, co-casting chemistry]
    status: live
  - id: speedrunning
    name: Speedrunning
    kind: craft
    scope: "Completing games as fast as possible: route optimisation, glitches, practice splits and verified submissions."
    examples: [route optimisation, glitch execution, splits practice, category rules]
    status: live
