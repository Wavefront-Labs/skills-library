category: sports-recreation
field: athletics-and-track-and-field
products:
  - id: sprints-and-relays
    name: Sprints and Relays
    kind: craft
    scope: "Sprint events from 60m to 400m and relay running: starts, acceleration, max velocity and baton exchange."
    examples: [block starts, acceleration mechanics, speed endurance, baton exchange]
    status: live
  - id: hurdles
    name: Hurdles
    kind: craft
    scope: "Sprint and long hurdles: hurdle clearance technique, rhythm between barriers and race modelling."
    examples: [lead-leg and trail-leg technique, three-step rhythm, 400m hurdle stride pattern]
    status: live
  - id: middle-and-long-distance-running
    name: Middle and Long Distance Running
    kind: craft
    scope: "Track distance events from 800m to 10,000m and steeplechase: pacing, race tactics and distance training."
    examples: [pacing strategy, kick finishing, steeplechase barriers, threshold training]
    status: live
  - id: road-running-and-marathon
    name: Road Running and Marathon
    kind: craft
    scope: "Road racing from 5k to marathon and ultramarathon: training blocks, fuelling and race execution."
    examples: [marathon build, race fuelling, negative splits, ultra pacing]
    status: live
  - id: cross-country
    name: Cross Country
    kind: craft
    scope: "Cross-country racing over natural terrain: surface technique, pack running and team scoring tactics."
    examples: [hill technique, mud and terrain handling, pack tactics, team scoring]
    status: live
  - id: race-walking
    name: Race Walking
    kind: craft
    scope: "Competitive race walking: legal technique under judging rules, rhythm and distance preparation."
    examples: [contact and knee rules, hip rotation technique, judge-proof form]
    status: live
  - id: horizontal-jumps
    name: Horizontal Jumps
    kind: craft
    scope: "Long jump and triple jump: approach runs, take-off mechanics, phase rhythm and landing."
    examples: [approach consistency, take-off mechanics, hop-step-jump rhythm]
    status: live
  - id: vertical-jumps
    name: Vertical Jumps
    kind: craft
    scope: "High jump and pole vault: approach curves, take-off, bar clearance and vault pole mechanics."
    examples: [fosbury technique, curved approach, pole carry and plant, bar clearance]
    status: live
  - id: throws
    name: Throws
    kind: craft
    scope: "Shot put, discus, hammer and javelin: throwing technique, rotational mechanics and circle rules."
    examples: [glide and spin shot, discus release, hammer turns, javelin run-up]
    status: live
  - id: combined-events
    name: Combined Events
    kind: craft
    scope: "Decathlon and heptathlon: multi-event preparation, scoring tables and competition-day management."
    examples: [event sequencing, scoring-table strategy, recovery between events]
    status: live
