category: sports-recreation
field: cycling-sport
products:
  - id: road-racing
    name: Road Racing
    kind: craft
    scope: "Road cycling as sport: bunch racing, time trials, climbing, pacing and race tactics."
    examples: [peloton craft, breakaways, time-trial pacing, climbing technique]
    status: live
  - id: track-cycling
    name: Track Cycling
    kind: craft
    scope: "Velodrome racing: fixed-gear bike handling, sprint and endurance events and track tactics."
    examples: [standing starts, match sprint tactics, madison changes, pursuit pacing]
    status: live
  - id: mountain-biking
    name: Mountain Biking
    kind: craft
    scope: "Off-road riding and racing: cross-country, downhill and enduro technique and trail craft."
    examples: [cornering and berms, drops and jumps, line choice, technical climbing]
    status: live
  - id: bmx
    name: BMX
    kind: craft
    scope: "BMX racing and freestyle: gate starts, pump technique, jumps and park and street tricks."
    examples: [gate starts, pumping rhythm sections, manuals, park tricks]
    status: live
  - id: cyclocross-and-gravel
    name: Cyclocross and Gravel
    kind: craft
    scope: "Cyclocross racing and gravel riding: dismounts, mud technique, mixed-surface handling and long-course strategy."
    examples: [dismount-remount, mud running, tyre pressure choice, gravel pacing]
    status: live
  - id: endurance-and-sportive-riding
    name: Endurance and Sportive Riding
    kind: craft
    scope: "Long-distance recreational riding: sportives, audax and bikepacking preparation, fuelling and route craft."
    examples: [century preparation, audax pacing, bikepacking setup, ride fuelling]
    status: live
  - id: cycling-training-and-performance
    name: Cycling Training and Performance
    kind: craft
    scope: "Structured cycling training: power-based training, FTP testing, interval design and indoor platforms."
    examples: [power zones, FTP testing, interval sessions, indoor trainer blocks]
    status: live
  - id: bike-fit
    name: Bike Fit
    kind: craft
    scope: "Fitting rider to bike for comfort, power and aerodynamics: position measurement and adjustment."
    examples: [saddle height and setback, cleat alignment, aero positioning, reach and drop]
    status: live
