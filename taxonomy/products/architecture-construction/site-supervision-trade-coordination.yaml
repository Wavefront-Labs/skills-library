category: architecture-construction
field: site-supervision-trade-coordination
products:
  - id: procore
    name: Procore
    kind: application
    scope: "Running site workflows in Procore: RFIs, submittals, daily logs, drawings and punch lists in the field."
    examples: [RFI workflows, daily logs, drawing management, punch lists]
    status: live
  - id: trade-sequencing-coordination
    name: Trade Sequencing and Coordination
    kind: craft
    scope: "Getting the right trade in at the right time: lookahead programming, trade handovers, clash resolution on site and keeping crews productive."
    examples: [lookahead planning, trade handovers, clash resolution, crew flow]
    status: live
  - id: site-quality-signoff
    name: Site Quality Inspection and Sign-Off
    kind: craft
    scope: "Checking work before it's covered: inspection and test plans, hold points, defect identification, punch listing and clerk-of-works practice."
    examples: [ITPs and hold points, pre-pour inspections, defect lists, handover sign-off]
    status: live
  - id: site-safety-management
    name: Site Safety Management
    kind: craft
    scope: "Keeping a site safe day to day: inductions and toolbox talks, SWMS and permits, hazard walks and incident response."
    examples: [toolbox talks, permit-to-work, hazard inspections, incident response]
    status: live
  - id: site-logistics
    name: Site Logistics and Establishment
    kind: craft
    scope: "Organising the site itself: site establishment, laydown and craneage planning, deliveries, waste and access management."
    examples: [site establishment, laydown planning, delivery scheduling, waste management]
    status: live
  - id: rfi-submittal-management
    name: RFI and Submittal Management
    kind: craft
    scope: "Managing the information flow between site and designers: raising and tracking RFIs, shop-drawing and sample submittals, and document control."
    examples: [RFI drafting, submittal registers, shop-drawing tracking, document control]
    status: live
  - id: site-records-reporting
    name: Site Records and Reporting
    kind: craft
    scope: "The paper trail that protects the job: daily diaries, progress photos, delay and dayworks records, and progress reporting."
    examples: [site diaries, progress photos, dayworks records, progress reports]
    status: live
