category: architecture-construction
field: construction-equipment-operation
products:
  - id: excavator
    name: Excavator
    kind: application
    scope: "Operating excavators: digging and grading technique, trenching, lifting with the machine, attachments and working near services."
    examples: [trench digging, batter grading, bucket control, lifting with quick hitch]
    status: live
  - id: mobile-crane
    name: Mobile Crane
    kind: application
    scope: "Operating mobile cranes: setup and outrigger loading, load charts, lift planning and execution, and multi-crane work."
    examples: [load charts, outrigger setup, lift execution, pick-and-carry]
    status: live
  - id: tower-crane
    name: Tower Crane
    kind: application
    scope: "Operating tower cranes: slew and luff control, blind lifts with dogman direction, wind limits and high-rise site logistics."
    examples: [blind lifting, load control, wind limit judgement, hook time management]
    status: live
  - id: bulldozer-grader
    name: Bulldozer and Grader
    kind: application
    scope: "Operating dozers and graders: bulk pushing, blade control, fine grading to level and slope, and finishing surfaces."
    examples: [blade control, fine grading, slope work, windrow management]
    status: live
  - id: loader-backhoe-skidsteer
    name: Loaders, Backhoes and Skid Steers
    kind: application
    scope: "Operating loaders, backhoe loaders and skid steers: loading and carting, backhoe work, attachments and tight-site manoeuvring."
    examples: [bucket loading, backhoe trenching, attachment swaps, confined-site operation]
    status: live
  - id: telehandler-forklift
    name: Telehandler and Forklift
    kind: application
    scope: "Operating telehandlers and rough-terrain forklifts: load charts at reach, pallet and bulk handling, and suspended-load work."
    examples: [reach load charts, pallet placement, suspended loads, slope travel]
    status: live
  - id: piling-rig
    name: Piling Rig
    kind: application
    scope: "Operating piling and drilling rigs: driven and bored piling cycles, verticality control, auger and hammer operation."
    examples: [pile driving, auger boring, verticality control, spoil management]
    status: live
  - id: concrete-pump
    name: Concrete Pump
    kind: application
    scope: "Operating boom and line concrete pumps: setup and boom control, line management, pour coordination and blockage handling."
    examples: [boom control, line pumping, pour coordination, blockage clearing]
    status: live
  - id: elevated-work-platform
    name: Elevated Work Platforms
    kind: application
    scope: "Operating boom and scissor lifts: positioning for work at height, ground assessment, rescue planning and safe basket work."
    examples: [boom positioning, ground assessment, emergency lowering, exclusion zones]
    status: live
