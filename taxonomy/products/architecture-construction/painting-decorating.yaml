category: architecture-construction
field: painting-decorating
products:
  - id: surface-preparation
    name: Surface Preparation
    kind: craft
    scope: "The work before paint: washing, sanding, filling and stopping, priming and sealing, and preparing problem substrates."
    examples: [sanding and filling, priming systems, stain blocking, substrate assessment]
    status: live
  - id: interior-painting
    name: Interior Painting
    kind: craft
    scope: "Painting inside: brush and roller technique, cutting in, sheen and system selection, ceilings, trim and defect-free finishes."
    examples: [cutting in, roller technique, trim enamels, two-coat systems]
    status: live
  - id: exterior-painting
    name: Exterior Painting
    kind: craft
    scope: "Painting building exteriors: weather windows, exterior systems on timber, render and metal, ladder and access work, and durability."
    examples: [exterior systems, timber and render coatings, access planning, weather timing]
    status: live
  - id: spray-application
    name: Spray Application
    kind: craft
    scope: "Spraying paint on buildings: airless spray setup and technique, masking, overspray control and fine-finish spraying of doors and trim."
    examples: [airless spraying, masking, tip selection, fine-finish spraying]
    status: live
  - id: wallpapering
    name: Wallpapering and Wallcoverings
    kind: craft
    scope: "Hanging wallpaper and wallcoverings: measuring and pattern matching, paste systems, seams and corners, and specialty coverings."
    examples: [pattern matching, seam work, corner hanging, lining paper]
    status: live
  - id: decorative-finishes
    name: Decorative and Specialist Finishes
    kind: craft
    scope: "Beyond flat paint: faux and broken-colour finishes, limewash and specialty coatings, gilding on buildings, graining and marbling."
    examples: [faux finishes, limewash, graining and marbling, metallic finishes]
    status: live
  - id: staining-clear-finishing
    name: Staining and Clear Finishing
    kind: craft
    scope: "Finishing timber in buildings: stains and clear coats on doors, floors and trim, exterior timber oils and system compatibility."
    examples: [timber staining, clear coating, floor finishing, exterior oils]
    status: live
