category: architecture-construction
field: architecture
products:
  - id: autocad
    name: AutoCAD
    kind: application
    scope: "2D drafting and documentation in AutoCAD: plans, sections, details, layer standards, blocks and sheet sets for architectural drawings."
    examples: [plan drafting, detail drawing, layer standards, dynamic blocks, sheet sets]
    status: live
  - id: revit
    name: Revit
    kind: application
    scope: "Building information modelling in Revit: architectural modelling, families, views and sheets, phasing, worksharing and documentation from the model."
    examples: [family creation, view templates, worksharing, schedules, design options]
    status: live
  - id: archicad
    name: Archicad
    kind: application
    scope: "BIM authoring in Archicad: modelling, layouts, GDL objects, teamwork and documentation workflows."
    examples: [modelling workflow, layouts and publishing, GDL objects, Teamwork]
    status: live
  - id: sketchup
    name: SketchUp
    kind: application
    scope: "Fast 3D massing, concept and presentation modelling in SketchUp, with LayOut for drawings."
    examples: [massing studies, component modelling, scenes and styles, LayOut drawings]
    status: live
  - id: rhino-grasshopper
    name: Rhino / Grasshopper
    kind: application
    scope: "NURBS modelling in Rhino and parametric design with Grasshopper for complex geometry, facades and design exploration."
    examples: [parametric facades, form finding, panelisation, data trees]
    status: live
  - id: schematic-design
    name: Schematic and Concept Design
    kind: craft
    scope: "Taking a brief to a building concept: site response, massing, plan organisation, circulation and the design moves that set the scheme."
    examples: [brief analysis, massing options, plan diagrams, circulation strategy]
    status: live
  - id: construction-documentation
    name: Construction Documentation
    kind: craft
    scope: "Producing the drawing and specification set a building is built from: detailing, dimensioning, annotation conventions and drawing-set coordination."
    examples: [detail development, dimensioning conventions, spec coordination, drawing-set structure]
    status: live
  - id: building-codes-compliance
    name: Building Codes and Compliance
    kind: craft
    scope: "Designing within building regulations: egress, fire separation, accessibility, occupancy classification and permit documentation."
    examples: [egress design, fire ratings, accessibility compliance, permit sets]
    status: live
  - id: passive-sustainable-design
    name: Passive and Sustainable Design
    kind: craft
    scope: "Designing for climate and low energy: orientation, shading, natural ventilation, envelope performance, daylighting and green-rating pathways."
    examples: [solar orientation, shading design, natural ventilation, envelope detailing, daylight strategy]
    status: live
  - id: residential-design
    name: Residential Design
    kind: craft
    scope: "Designing houses, renovations and multi-unit dwellings: domestic planning, client briefs and the particular constraints of housing."
    examples: [house planning, renovation and extension design, multi-unit layouts, client briefing]
    status: live
  - id: heritage-conservation-design
    name: Heritage and Conservation Design
    kind: craft
    scope: "Designing with existing and protected buildings: significance assessment, sensitive alteration, adaptive reuse and conservation detailing."
    examples: [significance assessment, adaptive reuse, sympathetic extensions, fabric conservation detailing]
    status: live
  - id: architectural-visualisation
    name: Architectural Visualisation
    kind: craft
    scope: "Communicating unbuilt designs: renders, physical and digital models, presentation drawings and client-facing imagery."
    examples: [render composition, presentation plans, physical models, walkthroughs]
    status: live
  - id: contract-administration
    name: Contract Administration
    kind: craft
    scope: "The architect's role during construction: reviewing shop drawings, answering RFIs, site observation, variations and certifying progress."
    examples: [shop-drawing review, RFI responses, site inspections, variation assessment]
    status: live
