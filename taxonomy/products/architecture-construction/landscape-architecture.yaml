category: architecture-construction
field: landscape-architecture
products:
  - id: autocad
    name: AutoCAD
    kind: application
    scope: "Landscape documentation in AutoCAD: site plans, planting plans, grading plans and hardscape details."
    examples: [site plans, planting plans, hardscape details]
    status: live
  - id: vectorworks-landmark
    name: Vectorworks Landmark
    kind: application
    scope: "Landscape-specific BIM and documentation in Vectorworks Landmark: plant databases, site modelling and landscape drawing sets."
    examples: [plant databases, site models, irrigation documentation]
    status: live
  - id: sketchup
    name: SketchUp
    kind: application
    scope: "3D landscape concept and presentation modelling in SketchUp: terrain, planting massing and outdoor-space visualisation."
    examples: [terrain modelling, planting massing, presentation scenes]
    status: live
  - id: site-analysis
    name: Site Analysis
    kind: craft
    scope: "Reading a site before designing it: topography, hydrology, soils, microclimate, views, access and context mapping."
    examples: [slope analysis, hydrology mapping, microclimate assessment, context studies]
    status: live
  - id: planting-design
    name: Planting Design
    kind: craft
    scope: "Selecting and composing plants for place and purpose: species selection, seasonal structure, planting plans and establishment."
    examples: [species selection, planting plans, seasonal interest, native planting]
    status: live
  - id: grading-drainage-design
    name: Grading and Drainage Design
    kind: craft
    scope: "Shaping land to work: contour grading, spot elevations, cut-and-fill balance and surface drainage design."
    examples: [contour grading, spot elevations, swale design, cut-and-fill]
    status: live
  - id: hardscape-detailing
    name: Hardscape Design and Detailing
    kind: craft
    scope: "Designing and detailing paths, paving, walls, steps, ramps and outdoor structures in the landscape."
    examples: [paving patterns, retaining wall design, step and ramp detailing, edge details]
    status: live
  - id: public-realm-design
    name: Parks and Public-Realm Design
    kind: craft
    scope: "Designing parks, plazas, streetscapes and play spaces: programme, movement, furniture, safety and public use."
    examples: [park design, streetscape design, playground design, plaza layout]
    status: live
  - id: green-infrastructure-design
    name: Green Infrastructure Design
    kind: craft
    scope: "Designing landscapes that do environmental work: rain gardens, bioswales, green roofs, urban tree canopy and habitat corridors."
    examples: [rain gardens, bioswales, green roofs, habitat corridors]
    status: live
  - id: irrigation-design
    name: Irrigation Design
    kind: craft
    scope: "Designing landscape irrigation: zoning, head layout, pipe sizing, controllers and water-efficient systems."
    examples: [zone planning, head layout, drip systems, controller scheduling]
    status: live
