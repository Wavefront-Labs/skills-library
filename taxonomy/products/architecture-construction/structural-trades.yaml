category: architecture-construction
field: structural-trades
products:
  - id: timber-framing
    name: Timber Framing
    kind: craft
    scope: "Framing a building's timber structure: wall, floor and roof framing, bracing, tie-downs and reading framing plans."
    examples: [wall framing, floor systems, roof framing, bracing and tie-downs]
    status: live
  - id: structural-steel-erection
    name: Structural Steel Erection
    kind: craft
    scope: "Erecting steel frames: crane sequencing, bolting and plumbing a frame, connections, decking and working to erection drawings."
    examples: [frame erection, bolted connections, plumbing and aligning, metal decking]
    status: live
  - id: structural-welding
    name: Structural Welding
    kind: craft
    scope: "Welding load-bearing steel on site and in the shop: weld procedures, positional welding, prep and fit-up, and inspection standards."
    examples: [weld procedures, positional welding, fit-up, visual inspection criteria]
    status: live
  - id: concrete-formwork
    name: Concrete Formwork
    kind: craft
    scope: "Building and stripping formwork: wall, column and slab forms, falsework and propping, form pressure and stripping times."
    examples: [slab formwork, column boxes, falsework, stripping sequence]
    status: live
  - id: steel-fixing
    name: Steel Fixing / Reinforcement
    kind: craft
    scope: "Placing reinforcement: reading bar schedules, cutting, bending and tying rebar, cover and lap requirements, mesh and couplers."
    examples: [bar schedules, tying patterns, cover control, lap splices]
    status: live
  - id: concrete-placement
    name: Concrete Placement and Finishing
    kind: craft
    scope: "Pouring and finishing structural concrete: pour planning, vibration and compaction, screeding and finishing, curing and joints."
    examples: [pour sequencing, vibration, power floating, curing methods]
    status: live
  - id: precast-erection
    name: Precast and Tilt-Up Erection
    kind: craft
    scope: "Erecting precast and tilt-up elements: panel casting beds, lifting and bracing, connections and grouting."
    examples: [panel lifting, temporary bracing, panel connections, tilt-up casting]
    status: live
  - id: rigging-dogging
    name: Rigging and Dogging
    kind: craft
    scope: "Slinging and directing structural lifts: load estimation, sling selection and angles, crane communication and exclusion zones."
    examples: [sling selection, load estimation, crane signals, lift planning]
    status: live
