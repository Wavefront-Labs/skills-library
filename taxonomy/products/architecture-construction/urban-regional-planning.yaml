category: architecture-construction
field: urban-regional-planning
products:
  - id: arcgis
    name: ArcGIS
    kind: application
    scope: "GIS analysis for planning in ArcGIS: land-use mapping, suitability analysis, demographic overlays and plan-making datasets."
    examples: [land-use mapping, suitability analysis, demographic overlays]
    status: live
  - id: qgis
    name: QGIS
    kind: application
    scope: "Open-source GIS for planning work in QGIS: zoning maps, spatial queries and plan exhibits."
    examples: [zoning maps, spatial queries, print layouts]
    status: live
  - id: zoning-land-use-planning
    name: Zoning and Land-Use Planning
    kind: craft
    scope: "Writing and applying land-use controls: zoning codes, use tables, density and height controls, overlays and rezoning processes."
    examples: [zoning code drafting, use tables, density controls, rezoning assessment]
    status: live
  - id: master-planning
    name: Master Planning
    kind: craft
    scope: "Planning large sites and precincts: structure plans, staging, movement networks, open-space frameworks and development yield."
    examples: [structure plans, precinct staging, movement networks, yield testing]
    status: live
  - id: development-assessment
    name: Development Assessment
    kind: craft
    scope: "Assessing development applications against planning controls: merit assessment, conditions, referrals and recommendation reports."
    examples: [application assessment, drafting conditions, merit evaluation, assessment reports]
    status: live
  - id: strategic-regional-planning
    name: Strategic and Regional Planning
    kind: craft
    scope: "Planning at city and regional scale: growth projections, settlement strategy, infrastructure sequencing and long-range plans."
    examples: [growth strategies, settlement hierarchies, infrastructure sequencing, land supply]
    status: live
  - id: transport-land-use-integration
    name: Transport and Land-Use Integration
    kind: craft
    scope: "Planning land use and movement together: transit-oriented development, corridor planning, parking policy and accessibility analysis."
    examples: [transit-oriented development, corridor plans, parking policy, accessibility mapping]
    status: live
  - id: climate-adaptation-planning
    name: Climate Adaptation Planning
    kind: craft
    scope: "Planning for climate risk: flood and sea-level-rise overlays, heat mitigation, managed retreat and resilience strategies."
    examples: [flood overlays, urban heat mitigation, managed retreat, resilience plans]
    status: live
  - id: urban-design
    name: Urban Design
    kind: craft
    scope: "Designing the public form of the city: street and block patterns, built-form controls, design guidelines and public-space frameworks."
    examples: [block structure, built-form controls, design guidelines, active frontages]
    status: live
  - id: community-engagement
    name: Community Engagement
    kind: craft
    scope: "Involving the public in plans: consultation design, workshops and charrettes, submission analysis and feedback into plan-making."
    examples: [consultation design, charrettes, submission analysis, engagement reporting]
    status: live
