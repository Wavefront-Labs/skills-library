category: architecture-construction
field: surveying-geomatics
products:
  - id: total-station
    name: Total Station
    kind: application
    scope: "Measuring with a total station: setup, backsight, angle and distance observation, traversing, stakeout and data collection."
    examples: [instrument setup, traversing, stakeout, resection]
    status: live
  - id: gnss-rtk
    name: GNSS / RTK Receivers
    kind: application
    scope: "Satellite positioning for survey: RTK base-rover and network workflows, datums, localisation and quality checks."
    examples: [RTK workflows, base-rover setup, site localisation, fix quality checks]
    status: live
  - id: digital-level
    name: Levels and Levelling Instruments
    kind: application
    scope: "Height measurement with automatic and digital levels: level runs, benchmarks, misclosure and precise levelling."
    examples: [level runs, benchmark transfer, two-peg test, misclosure adjustment]
    status: live
  - id: terrestrial-laser-scanner
    name: Terrestrial Laser Scanner
    kind: application
    scope: "Capturing built and ground features with terrestrial LiDAR: scan planning, targets and registration, point-cloud QA and deliverables."
    examples: [scan planning, registration, point-cloud cleanup, scan-to-BIM capture]
    status: live
  - id: drone-photogrammetry
    name: Drone Survey and Photogrammetry
    kind: application
    scope: "Aerial survey by UAV: flight planning, ground control, photogrammetric processing to orthophotos, DEMs and point clouds."
    examples: [flight planning, ground control points, orthophoto generation, volume surveys]
    status: live
  - id: boundary-cadastral-surveying
    name: Boundary and Cadastral Surveying
    kind: craft
    scope: "Determining legal boundaries: title research, monument recovery, re-establishment principles, easements and cadastral plans."
    examples: [boundary re-establishment, monument recovery, title research, subdivision plans]
    status: live
  - id: topographic-surveying
    name: Topographic and Detail Surveying
    kind: craft
    scope: "Capturing the shape and features of land: detail pickup, feature coding, contour generation and site survey deliverables."
    examples: [detail pickup, feature coding, contour surfaces, site plans]
    status: live
  - id: construction-setting-out
    name: Construction Setting-Out
    kind: craft
    scope: "Putting the design on the ground: gridlines, offsets and batter boards, level transfer, as-built checks and tolerance control."
    examples: [gridline setout, offset pegs, level transfer, as-built surveys]
    status: live
  - id: control-networks
    name: Control Networks and Adjustment
    kind: craft
    scope: "Establishing survey control: network design, datums and projections, least-squares adjustment and error propagation."
    examples: [network design, least-squares adjustment, datum transformations, error analysis]
    status: live
  - id: hydrographic-surveying
    name: Hydrographic Surveying
    kind: craft
    scope: "Surveying beneath water: echo-sounder and sonar bathymetry, tide corrections and nautical/dredge survey deliverables."
    examples: [bathymetric survey, tide corrections, dredge volumes, channel surveys]
    status: live
