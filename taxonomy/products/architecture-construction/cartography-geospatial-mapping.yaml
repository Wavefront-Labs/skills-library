category: architecture-construction
field: cartography-geospatial-mapping
products:
  - id: arcgis
    name: ArcGIS
    kind: application
    scope: "Map production and geospatial analysis in ArcGIS Pro: geodatabases, symbology, layouts, geoprocessing and publishing."
    examples: [geodatabase design, symbology, map layouts, geoprocessing models]
    status: live
  - id: qgis
    name: QGIS
    kind: application
    scope: "Open-source mapping in QGIS: data loading and editing, styling, print layouts, plugins and processing toolbox."
    examples: [data styling, print atlases, processing toolbox, plugin workflows]
    status: live
  - id: postgis
    name: PostGIS
    kind: application
    scope: "Spatial databases with PostGIS: spatial schemas, queries and indexing as the data backbone of mapping work."
    examples: [spatial queries, geometry operations, spatial indexing, data loading]
    status: live
  - id: map-design
    name: Map Design and Symbolisation
    kind: craft
    scope: "Making maps that read: visual hierarchy, symbology, colour, generalisation, labelling and layout for the map's purpose and scale."
    examples: [visual hierarchy, label placement, generalisation, thematic symbology]
    status: live
  - id: topographic-mapping
    name: Topographic Mapping
    kind: craft
    scope: "Compiling topographic maps: relief depiction, contours and hillshade, feature classification and national-series conventions."
    examples: [contour depiction, hillshading, feature classification, sheet compilation]
    status: live
  - id: cadastral-mapping
    name: Cadastral Mapping
    kind: craft
    scope: "Maintaining the map of land parcels: parcel fabric, plan lodgement data, boundary depiction and tenure layers."
    examples: [parcel fabric maintenance, plan capture, tenure mapping]
    status: live
  - id: remote-sensing-interpretation
    name: Remote Sensing and Image Interpretation
    kind: craft
    scope: "Turning aerial and satellite imagery into map data: orthorectification, image classification, change detection and feature extraction."
    examples: [image classification, change detection, feature extraction, orthorectification]
    status: live
  - id: geospatial-data-management
    name: Geospatial Data Management
    kind: craft
    scope: "Keeping spatial data authoritative: coordinate reference systems, metadata, data quality, conflation and dataset maintenance."
    examples: [CRS management, metadata standards, data conflation, quality assurance]
    status: live
  - id: web-mapping
    name: Web and Interactive Mapping
    kind: craft
    scope: "Publishing maps for the web: tile services, interactive map design, web GIS apps and story maps."
    examples: [tile services, interactive maps, story maps, web app configuration]
    status: live
