category: mind-self
field: decision-making-and-problem-solving
products:
  - id: decision-matrices
    name: Decision Matrices
    kind: craft
    scope: "Scoring options against weighted criteria to make a comparable, defensible choice: building the matrix, weighting honestly and sanity-checking the result."
    examples: [weighted scoring, criteria selection, sensitivity to weights, pugh matrix]
    status: live
  - id: decision-trees-and-expected-value
    name: Decision Trees and Expected Value
    kind: craft
    scope: "Structuring choices under uncertainty as branching outcomes with probabilities and payoffs, and choosing by expected value and risk tolerance."
    examples: [tree construction, expected-value calculation, risk-of-ruin checks, value of information]
    status: live
  - id: root-cause-analysis
    name: Root-Cause Analysis
    kind: craft
    scope: "Tracing a problem back to its underlying cause rather than its symptom: structured why-chains, cause mapping and verifying the cause before fixing."
    examples: [five whys, fishbone diagrams, cause verification, distinguishing cause from correlation]
    status: live
  - id: problem-decomposition
    name: Problem Decomposition
    kind: craft
    scope: "Breaking an intractable problem into solvable parts: framing, restating, working backwards and solving simpler versions first."
    examples: [problem restatement, working backwards, solving a simpler case, MECE breakdowns]
    status: live
  - id: premortem-and-red-teaming
    name: Premortem and Red-Teaming
    kind: craft
    scope: "Stress-testing a plan before committing: imagining it has already failed, arguing the opposing case and hunting for the failure modes optimism hides."
    examples: [premortem exercise, devil's advocacy, failure-mode listing, assumption busting]
    status: live
  - id: heuristic-decision-making
    name: Heuristic Decision Making
    kind: craft
    scope: "Choosing fast and frugally when full analysis is not worth it: recognising which shortcuts work where, satisficing and setting decision deadlines."
    examples: [satisficing, recognition heuristic, one-reason decisions, reversible vs irreversible choices]
    status: live
