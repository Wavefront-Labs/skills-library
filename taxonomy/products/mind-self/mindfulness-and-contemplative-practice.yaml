category: mind-self
field: mindfulness-and-contemplative-practice
products:
  - id: breath-focused-meditation
    name: Breath-Focused Meditation
    kind: craft
    scope: "Concentration practice anchored on the breath: posture, anchor selection, working with wandering and deepening stability over months of sits."
    examples: [anchor points, returning from wandering, posture setup, session progression]
    status: live
  - id: body-scan
    name: Body Scan
    kind: craft
    scope: "Moving attention systematically through the body: scan order, resolution, meeting sensation (and numbness) without reaction, lying and seated forms."
    examples: [head-to-toe scanning, sensation granularity, working with discomfort, sleep-adjacent scans]
    status: live
  - id: open-monitoring
    name: Open Monitoring
    kind: craft
    scope: "Choiceless awareness practice: resting attention on whatever arises without selecting an object, balancing openness against distraction."
    examples: [choiceless awareness, shifting from anchor to open field, meta-awareness, handling absorption in thought]
    status: live
  - id: noting-practice
    name: Noting Practice
    kind: craft
    scope: "Labelling experience as it arises — thinking, hearing, feeling — to sharpen recognition and loosen identification, in Mahasi-derived and freeform styles."
    examples: [verbal noting, noting speed and granularity, dropping labels, noting in daily life]
    status: live
  - id: loving-kindness-practice
    name: Loving-Kindness Practice
    kind: craft
    scope: "Cultivating goodwill deliberately: phrase-based metta toward self, friends, strangers and difficult people, and its compassion and equanimity variants."
    examples: [metta phrases, widening circles, working with resistance, compassion and equanimity variants]
    status: live
  - id: walking-meditation
    name: Walking Meditation
    kind: craft
    scope: "Meditation in motion: slow formal walking with attention on the stepping cycle, and natural-pace mindful walking as a bridge to daily life."
    examples: [formal slow walking, step-cycle attention, pace variation, outdoor practice]
    status: live
  - id: mantra-meditation
    name: Mantra Meditation
    kind: craft
    scope: "Using a repeated word or phrase as the meditation object, practised outside any rite: mantra selection, repetition styles and settling into effortless repetition."
    examples: [silent repetition, mantra selection, effortless settling, mantra vs breath anchors]
    status: live
  - id: informal-mindfulness
    name: Informal Mindfulness
    kind: craft
    scope: "Weaving mindfulness into ordinary activity: mindful eating, chores and transitions, cue-based micro-practices and sustaining presence off the cushion."
    examples: [mindful eating, cue-based micro-practices, transition pauses, one mindful task daily]
    status: live
