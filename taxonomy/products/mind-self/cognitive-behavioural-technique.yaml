category: mind-self
field: cognitive-behavioural-technique
products:
  - id: thought-records
    name: Thought Records
    kind: craft
    scope: "The written CBT core loop self-applied: catching an automatic thought, logging situation-thought-emotion, weighing evidence and writing a balanced alternative."
    examples: [seven-column records, evidence for and against, balanced-thought writing, mood re-rating]
    status: live
  - id: cognitive-distortion-spotting
    name: Cognitive Distortion Spotting
    kind: craft
    scope: "Learning the catalogue of thinking errors — catastrophising, all-or-nothing, mind reading — and catching them in your own live thoughts."
    examples: [distortion catalogues, labelling in the moment, personal distortion profiles, catch-it drills]
    status: live
  - id: cognitive-reframing
    name: Cognitive Reframing
    kind: craft
    scope: "Deliberately generating alternative interpretations of an event: perspective shifts, decatastrophising and reappraisal as a repeatable move."
    examples: [decatastrophising, best-friend perspective, reappraisal practice, reframing setbacks]
    status: live
  - id: behavioural-activation
    name: Behavioural Activation
    kind: craft
    scope: "Acting your way out of low mood and avoidance: activity scheduling, mastery-and-pleasure tracking and graded task assignment, self-applied without a diagnosis."
    examples: [activity scheduling, mastery-pleasure ratings, graded tasks, avoidance pattern mapping]
    status: live
  - id: behavioural-experiments
    name: Behavioural Experiments
    kind: craft
    scope: "Testing a belief against reality by designing a real-world experiment: prediction, trial, observed outcome and updating the belief on the result."
    examples: [prediction logging, experiment design, survey experiments, belief re-rating]
    status: live
  - id: exposure-practice
    name: Exposure Practice
    kind: craft
    scope: "Self-directed graded exposure to feared but safe situations: building a fear ladder, staying through the wave and dropping safety behaviours, with no named clinical condition."
    examples: [fear ladders, graded steps, dropping safety behaviours, habituation tracking]
    status: live
  - id: worry-scheduling
    name: Worry Scheduling
    kind: craft
    scope: "Containing rumination and worry: postponing worries to a set window, distinguishing solvable from unsolvable, and converting solvable ones into actions."
    examples: [worry windows, worry postponement, solvable vs hypothetical sorting, rumination interrupts]
    status: live
  - id: acceptance-and-defusion
    name: Acceptance and Defusion
    kind: craft
    scope: "ACT-derived self-technique: unhooking from thoughts rather than disputing them, willingness toward discomfort and acting on values with the thought still present."
    examples: [defusion exercises, leaves-on-a-stream, willingness practice, values-based action]
    status: live
