category: mind-self
field: motivation-and-goal-setting
products:
  - id: goal-setting-frameworks
    name: Goal-Setting Frameworks
    kind: craft
    scope: "Turning vague wants into workable goals: SMART and kin, outcome vs process goals, milestone design and keeping goal lists few and honest."
    examples: [SMART goals, process vs outcome goals, milestone laddering, goal triage]
    status: live
  - id: mental-contrasting
    name: Mental Contrasting
    kind: craft
    scope: "The WOOP method: vividly imagining the wish and outcome, then the inner obstacle, then an if-then plan — contrast, not just positive thinking."
    examples: [WOOP sessions, obstacle identification, wish-outcome imaging, pairing with implementation intentions]
    status: live
  - id: visioning
    name: Visioning
    kind: craft
    scope: "Building a motivating picture of a desired future: future-self exercises, written life visions and using the vision to filter present choices."
    examples: [future-self letters, odyssey plans, life-vision writing, vision-to-decision filtering]
    status: live
  - id: accountability-systems
    name: Accountability Systems
    kind: craft
    scope: "Borrowing external pressure deliberately: accountability partners, public commitment, stakes and check-in cadences that actually bite."
    examples: [accountability partners, commitment contracts, public pledges, check-in cadence design]
    status: live
  - id: procrastination-management
    name: Procrastination Management
    kind: craft
    scope: "Diagnosing and defeating your own delay: starting rituals, task-aversion analysis, shrinking the first step and structured unblocking."
    examples: [two-minute starts, aversion diagnosis, temptation-proof scheduling, unstick protocols]
    status: live
  - id: intrinsic-motivation-technique
    name: Intrinsic Motivation Technique
    kind: craft
    scope: "Cultivating drive that doesn't need a whip: connecting tasks to autonomy, mastery and purpose, job-crafting your own work and protecting interest from over-rewarding."
    examples: [autonomy framing, mastery tracking, purpose linking, reward-crowding awareness]
    status: live
