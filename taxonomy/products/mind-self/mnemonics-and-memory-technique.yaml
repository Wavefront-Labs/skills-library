category: mind-self
field: mnemonics-and-memory-technique
products:
  - id: memory-palace
    name: Memory Palace
    kind: craft
    scope: "The method of loci: building familiar spatial routes, placing vivid images at loci, and walking the route to recall ordered information."
    examples: [route construction, image placement, palace reuse and clearing, journey method]
    status: live
  - id: major-system
    name: Major System
    kind: craft
    scope: "Encoding numbers as consonant sounds and words for long-number recall: the digit-sound code, building a word lexicon and chaining encoded images."
    examples: [digit-consonant code, two-digit word lists, phone-number encoding, date memorisation]
    status: live
  - id: peg-systems
    name: Peg Systems
    kind: craft
    scope: "Pre-memorised peg lists (number-rhyme, number-shape, alphabet) that new items are hooked onto for ordered and random-access recall."
    examples: [number-rhyme pegs, number-shape pegs, alphabet pegs, hooking list items]
    status: live
  - id: link-and-story-method
    name: Link and Story Method
    kind: craft
    scope: "Chaining items into vivid pairwise links or a running narrative so each item cues the next: image crafting, exaggeration and chain repair."
    examples: [pairwise linking, story chains, vivid-image construction, recovering a broken chain]
    status: live
  - id: chunking
    name: Chunking
    kind: craft
    scope: "Grouping raw information into larger meaningful units to fit working memory: finding natural boundaries, recoding and hierarchical chunks."
    examples: [number grouping, recoding into words, hierarchical chunking, pattern-based chunks]
    status: live
  - id: acronym-and-rhyme-mnemonics
    name: Acronym and Rhyme Mnemonics
    kind: craft
    scope: "Verbal mnemonics: acronyms, acrostics, rhymes and songs crafted to carry facts, orders and spellings."
    examples: [acronym design, first-letter acrostics, rhyming rules, set-to-music facts]
    status: live
  - id: names-and-faces
    name: Names and Faces
    kind: craft
    scope: "Remembering people: attending at introduction, turning names into images, anchoring them to facial features and rehearsing socially."
    examples: [name-to-image conversion, feature anchoring, introduction rituals, review after events]
    status: live
  - id: card-and-number-systems
    name: Card and Number Systems (PAO)
    kind: craft
    scope: "Competition-grade encoding systems for cards and long digits: person-action-object and similar fixed-image systems, plus speed training."
    examples: [PAO construction, card-deck memorisation, speed-digits training, system drilling]
    status: live
