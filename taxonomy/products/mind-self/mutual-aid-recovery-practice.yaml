category: mind-self
field: mutual-aid-recovery-practice
products:
  - id: twelve-step-work
    name: Twelve-Step Work
    kind: craft
    scope: "Working the steps of a 12-step programme as the member: inventories, amends, daily practice and the written and spoken work each step asks for."
    examples: [fourth-step inventory, making amends, daily tenth step, step study]
    status: live
  - id: sponsorship
    name: Sponsorship
    kind: craft
    scope: "The sponsor-sponsee craft on both sides: choosing and being a sponsor, guiding someone through the steps and holding boundaries in the relationship."
    examples: [choosing a sponsor, guiding step work, sponsor boundaries, sponsee check-ins]
    status: live
  - id: peer-support-meetings
    name: Peer-Support Meetings
    kind: craft
    scope: "Participating in and running mutual-aid meetings: sharing, listening without crosstalk, chairing, service roles and keeping a meeting healthy."
    examples: [sharing practice, chairing a meeting, service positions, newcomer welcome]
    status: live
  - id: relapse-prevention-planning
    name: Relapse-Prevention Planning
    kind: craft
    scope: "Building and maintaining a personal relapse-prevention plan: trigger and warning-sign mapping, coping menus, emergency contacts and lapse response."
    examples: [warning-sign lists, coping menus, emergency plans, post-lapse protocol]
    status: live
  - id: secular-recovery-programmes
    name: Secular Recovery Programmes
    kind: craft
    scope: "Working non-12-step mutual-aid methods: SMART Recovery's CBT-derived tools, LifeRing and similar programmes' practices as the participant."
    examples: [SMART cost-benefit analysis, urge logs, change-plan worksheets, LifeRing sobriety priority]
    status: live
