category: mind-self
field: attention-and-focus-training
products:
  - id: focus-intervals
    name: Focus Intervals
    kind: craft
    scope: "Working in timed, protected blocks with deliberate breaks: pomodoro and its variants, interval length tuning and handling interruptions mid-block."
    examples: [pomodoro technique, timeboxing, break design, interruption logging]
    status: live
  - id: single-tasking-practice
    name: Single-Tasking Practice
    kind: craft
    scope: "Training the habit of doing one thing at a time: task switching cost awareness, open-loop capture and resisting the multitasking reflex."
    examples: [one-tab working, switch-cost awareness, capture lists for intrusions, batching shallow work]
    status: live
  - id: distraction-management
    name: Distraction Management
    kind: craft
    scope: "Engineering your environment and devices so distraction never gets a vote: notification design, friction placement and physical workspace setup."
    examples: [notification audits, app friction, workspace setup, scheduled communication windows]
    status: live
  - id: concentration-drills
    name: Concentration Drills
    kind: craft
    scope: "Direct exercises that strengthen sustained attention: fixed-point focus, counting drills and progressively longer holds, measured over time."
    examples: [candle or point gazing, breath counting, duration progression, attention span benchmarking]
    status: live
  - id: flow-state-cultivation
    name: Flow-State Cultivation
    kind: craft
    scope: "Setting up the conditions for deep absorption: challenge-skill balance, clear goals, immediate feedback and entry rituals, plus recognising and protecting flow."
    examples: [challenge-skill matching, entry rituals, flow triggers, protecting deep-work blocks]
    status: live
  - id: attention-restoration
    name: Attention Restoration
    kind: craft
    scope: "Recovering depleted attention deliberately: restorative breaks, nature exposure, rest scheduling and detecting attention fatigue before it costs you."
    examples: [restorative breaks, nature walks, rest scheduling, fatigue self-detection]
    status: live
