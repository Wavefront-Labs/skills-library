category: mind-self
field: emotional-regulation-and-self-awareness
products:
  - id: emotion-labelling
    name: Emotion Labelling
    kind: craft
    scope: "Naming emotional states precisely as they happen: growing a granular emotion vocabulary, affect labelling in the moment and distinguishing blended states."
    examples: [emotion wheels, granularity practice, name-it-to-tame-it, mixed-emotion untangling]
    status: live
  - id: trigger-mapping
    name: Trigger Mapping
    kind: craft
    scope: "Charting what sets you off: logging episodes, finding patterns in situation, body signal and response, and designing early-warning responses."
    examples: [episode logs, pattern analysis, early-warning signs, if-then response plans]
    status: live
  - id: self-soothing-technique
    name: Self-Soothing Technique
    kind: craft
    scope: "Down-regulating acute emotion on purpose: physiological calmers, sensory grounding and a practised personal toolkit for the heat of the moment."
    examples: [physiological sigh, cold-water reset, five-senses grounding, personal calm-down protocol]
    status: live
  - id: body-awareness-practice
    name: Body-Awareness Practice
    kind: craft
    scope: "Reading emotion through the body: interoceptive attention, locating feelings as sensation, and using bodily signals as early emotional data."
    examples: [interoception drills, sensation mapping, tension inventories, emotion-as-sensation tracking]
    status: live
  - id: journaling-for-insight
    name: Journaling for Insight
    kind: craft
    scope: "Writing to understand your own states and patterns: freewriting, prompted reflection, mood journaling and mining past entries for recurring themes."
    examples: [freewriting, reflective prompts, mood journals, rereading for patterns]
    status: live
  - id: self-compassion-practice
    name: Self-Compassion Practice
    kind: craft
    scope: "Treating yourself as you would a struggling friend, as a trained skill: self-kindness phrases, common-humanity framing and disarming the inner critic."
    examples: [self-compassion breaks, inner-critic dialogue, common-humanity reframes, compassionate letter writing]
    status: live
