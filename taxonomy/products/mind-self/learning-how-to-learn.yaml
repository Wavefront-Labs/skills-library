category: mind-self
field: learning-how-to-learn
products:
  - id: spaced-repetition
    name: Spaced Repetition
    kind: craft
    scope: "Scheduling reviews at expanding intervals to beat the forgetting curve: interval design, card and prompt writing, and fitting review into daily routine. SRS software itself (Anki and kin) lives under languages-linguistics."
    examples: [expanding intervals, prompt design, leech handling, paper-based spaced systems]
    status: live
  - id: active-recall-and-self-testing
    name: Active Recall and Self-Testing
    kind: craft
    scope: "Learning by retrieving rather than re-reading: practice testing, free recall, flashcard discipline and using errors as study signals."
    examples: [free recall after reading, practice tests, closed-book summarising, error logs]
    status: live
  - id: elaboration-and-explanation-technique
    name: Elaboration and Explanation Technique
    kind: craft
    scope: "Deepening understanding by generating explanations: teaching it back, asking why and how, building analogies and connecting new material to known."
    examples: [Feynman technique, elaborative interrogation, self-explanation, analogy building]
    status: live
  - id: interleaving-and-varied-practice
    name: Interleaving and Varied Practice
    kind: craft
    scope: "Mixing topics and problem types within practice to strengthen discrimination and transfer, against the instinct to block by topic."
    examples: [mixed problem sets, topic switching schedules, varied conditions practice, contrast pairs]
    status: live
  - id: deliberate-practice
    name: Deliberate Practice
    kind: craft
    scope: "Structuring practice for skill rather than knowledge: isolating weaknesses, working at the edge of ability, tight feedback loops and rep design."
    examples: [weakness isolation, drill design, feedback loops, practice-session planning]
    status: live
  - id: note-taking-systems
    name: Note-Taking Systems
    kind: craft
    scope: "Capturing and organising knowledge so it compounds: linked and hierarchical note methods, progressive summarisation and maintaining a usable personal knowledge base."
    examples: [Zettelkasten, Cornell notes, progressive summarisation, evergreen notes]
    status: live
  - id: study-planning-and-metacognition
    name: Study Planning and Metacognition
    kind: craft
    scope: "Planning and monitoring your own learning: syllabus mapping, scheduling, judging what you actually know and adjusting strategy mid-course."
    examples: [study schedules, learning goals, judgement-of-learning checks, strategy switching]
    status: live
