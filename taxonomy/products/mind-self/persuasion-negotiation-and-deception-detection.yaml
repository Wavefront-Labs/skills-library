category: mind-self
field: persuasion-negotiation-and-deception-detection
products:
  - id: rapport-building
    name: Rapport Building
    kind: craft
    scope: "Creating quick, genuine connection with another person: matching and mirroring, active interest, finding common ground and calibrating warmth to context."
    examples: [matching and mirroring, common-ground finding, warm openers, calibrating formality]
    status: live
  - id: influence-principles
    name: Influence Principles
    kind: craft
    scope: "The classic levers of persuasion applied ethically: reciprocity, commitment, social proof, liking, authority and scarcity — and recognising them used on you."
    examples: [Cialdini's principles, ethical application, resisting influence, pre-suasion setup]
    status: live
  - id: framing-and-anchoring
    name: Framing and Anchoring
    kind: craft
    scope: "Shaping how a proposal is perceived: anchor placement, loss vs gain framing, contrast effects and re-framing an exchange you've been framed into."
    examples: [first-offer anchoring, loss-gain framing, contrast setups, counter-anchoring]
    status: live
  - id: principled-negotiation
    name: Principled Negotiation
    kind: craft
    scope: "Interest-based negotiation in the Getting-to-Yes tradition: separating people from problems, interests from positions, inventing options and knowing your BATNA."
    examples: [interests vs positions, BATNA analysis, option invention, objective criteria]
    status: live
  - id: tactical-empathy
    name: Tactical Empathy
    kind: craft
    scope: "Negotiating through demonstrated understanding: labelling emotions, mirroring, calibrated questions and strategic silence in the Voss tradition."
    examples: [labelling, mirrors, calibrated questions, accusation audits]
    status: live
  - id: body-language-reading
    name: Body-Language Reading
    kind: craft
    scope: "Reading nonverbal signals with appropriate scepticism: baselining a person, clusters over single tells, comfort vs discomfort signals and your own nonverbal output."
    examples: [baselining, cluster reading, comfort-discomfort signals, managing your own tells]
    status: live
  - id: deception-detection
    name: Deception Detection
    kind: craft
    scope: "Judging truthfulness from behaviour and statements: deviation from baseline, statement analysis, strategic questioning and knowing the technique's real error rates."
    examples: [baseline deviation, statement analysis, strategic question design, verifiable-detail probing]
    status: live
