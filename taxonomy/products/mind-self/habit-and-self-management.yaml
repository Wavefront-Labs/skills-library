category: mind-self
field: habit-and-self-management
products:
  - id: habit-stacking
    name: Habit Stacking
    kind: craft
    scope: "Anchoring a new habit to an existing one: choosing reliable anchors, sizing the new behaviour small enough to stick and chaining stacks over time."
    examples: [anchor selection, after-X-then-Y chains, tiny-habit sizing, stack expansion]
    status: live
  - id: implementation-intentions
    name: Implementation Intentions
    kind: craft
    scope: "If-then planning that pre-decides behaviour: writing concrete situation-action plans for starting, persisting and handling obstacles."
    examples: [if-then plans, obstacle planning, cue specificity, coping plans for lapses]
    status: live
  - id: routine-design
    name: Routine Design
    kind: craft
    scope: "Architecting daily and weekly routines deliberately: morning and evening sequences, energy-matched scheduling and reviewing routines that drift."
    examples: [morning routines, shutdown rituals, energy mapping, weekly review of routines]
    status: live
  - id: self-monitoring
    name: Self-Monitoring
    kind: craft
    scope: "Measuring your own behaviour to change it: choosing what to track, honest recording, streaks and the reactive effect of measurement itself."
    examples: [habit tracking, streak design, don't-break-the-chain, metric selection]
    status: live
  - id: environment-and-temptation-design
    name: Environment and Temptation Design
    kind: craft
    scope: "Shaping surroundings instead of relying on willpower: adding friction to bad habits, removing it from good ones, precommitment and temptation bundling."
    examples: [friction engineering, precommitment devices, temptation bundling, cue removal]
    status: live
  - id: habit-breaking
    name: Habit Breaking
    kind: craft
    scope: "Dismantling an unwanted habit: identifying cue-routine-reward loops, substituting competing responses and planning for relapse without collapse."
    examples: [loop analysis, replacement behaviours, urge surfing, lapse-recovery plans]
    status: live
  - id: journaling-and-planner-systems
    name: Journaling and Planner Systems
    kind: application
    scope: "Structured personal-organisation systems as a tool class: bullet journaling, paper planners and digital journaling or habit apps — running the system, not any one brand."
    examples: [bullet journal method, daily and monthly logs, planner workflows, migrating between systems]
    status: live
