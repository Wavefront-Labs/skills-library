category: mind-self
field: critical-thinking-and-argumentation
products:
  - id: argument-mapping
    name: Argument Mapping
    kind: craft
    scope: "Diagramming the structure of an argument: premises, inferences, objections and rebuttals laid out visually to test whether the reasoning holds."
    examples: [premise-conclusion trees, co-premise identification, objection mapping, mapping a debate]
    status: live
  - id: argument-construction
    name: Argument Construction
    kind: craft
    scope: "Building sound arguments of your own: choosing premises, structuring inferences, anticipating objections and qualifying claims."
    examples: [thesis-support structure, Toulmin model, qualifying claims, pre-empting objections]
    status: live
  - id: fallacy-recognition
    name: Fallacy Recognition
    kind: craft
    scope: "Spotting informal fallacies and rhetorical sleights in arguments: naming the flaw, explaining why it fails and distinguishing fallacy from mere weakness."
    examples: [ad hominem vs relevance, straw man detection, false dilemma, motte-and-bailey]
    status: live
  - id: informal-logic
    name: Informal Logic
    kind: craft
    scope: "Evaluating everyday reasoning for validity and strength: deduction vs induction, argument forms, hidden premises and counterexample testing."
    examples: [validity vs soundness, enthymeme reconstruction, counterexample method, inductive strength]
    status: live
  - id: source-evaluation
    name: Source Evaluation
    kind: craft
    scope: "Judging the reliability of information and its source: provenance, lateral reading, conflicts of interest and evidence quality."
    examples: [lateral reading, SIFT method, checking provenance, evidence hierarchies]
    status: live
  - id: socratic-questioning
    name: Socratic Questioning
    kind: craft
    scope: "Probing a claim or belief through disciplined questioning: clarifying terms, surfacing assumptions, testing implications and examining evidence."
    examples: [clarifying questions, assumption probing, implication testing, questioning your own beliefs]
    status: live
  - id: cognitive-bias-mitigation
    name: Cognitive Bias Mitigation
    kind: craft
    scope: "Recognising systematic reasoning biases in yourself and applying debiasing techniques: consider-the-opposite, base rates, outside view."
    examples: [confirmation bias checks, outside view, base-rate use, consider-the-opposite]
    status: live
  - id: calibration-and-probabilistic-reasoning
    name: Calibration and Probabilistic Reasoning
    kind: craft
    scope: "Reasoning with uncertainty as a personal discipline: assigning probabilities to beliefs, updating on evidence and tracking calibration over time."
    examples: [credence assignment, Bayesian updating, calibration training, forecasting practice]
    status: live
