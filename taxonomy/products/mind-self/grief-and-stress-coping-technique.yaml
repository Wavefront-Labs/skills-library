category: mind-self
field: grief-and-stress-coping-technique
products:
  - id: regulated-breathing
    name: Regulated Breathing
    kind: craft
    scope: "Breath patterns for down-regulating stress in the moment: paced, extended-exhale and box breathing as everyday stress tools, not altered-states breathwork."
    examples: [box breathing, extended exhale, paced breathing, pre-stressor breathing routines]
    status: live
  - id: progressive-muscle-relaxation
    name: Progressive Muscle Relaxation
    kind: craft
    scope: "Systematic tense-and-release through the muscle groups to unwind physical stress: full protocols, abbreviated versions and cue-controlled release."
    examples: [full-body PMR, abbreviated protocols, cue-controlled relaxation, tension spotting]
    status: live
  - id: grounding-techniques
    name: Grounding Techniques
    kind: craft
    scope: "Anchoring attention to the present when stress or distress spikes: sensory grounding, orienting and a rehearsed personal grounding sequence."
    examples: [5-4-3-2-1 senses, orienting to the room, object anchoring, grounding scripts]
    status: live
  - id: expressive-writing
    name: Expressive Writing
    kind: craft
    scope: "Pennebaker-style writing about stressful and painful experience: structured sessions, dosage, and turning raw events into narrative that can be set down."
    examples: [four-day protocols, writing about loss, narrative construction, when to stop writing]
    status: live
  - id: grief-processing-exercises
    name: Grief Processing Exercises
    kind: craft
    scope: "Self-applied practices for moving through loss: continuing-bonds exercises, memory work, unsent letters and marking anniversaries deliberately."
    examples: [unsent letters, memory boxes, continuing bonds, anniversary planning]
    status: live
  - id: resilience-practice
    name: Resilience Practice
    kind: craft
    scope: "Building capacity before and after the blow: stress inoculation through graded challenge, recovery rituals, reframing adversity and support-network upkeep."
    examples: [stress inoculation, recovery rituals, adversity reframing, support mapping]
    status: live
