category: mind-self
field: stoic-and-philosophical-life-practice
products:
  - id: dichotomy-of-control
    name: Dichotomy of Control
    kind: craft
    scope: "The core Stoic discipline of sorting what is up to you from what is not, and redirecting effort and emotion accordingly, moment to moment."
    examples: [control sorting, internalising goals, trichotomy variant, applying it in a crisis]
    status: live
  - id: negative-visualisation
    name: Negative Visualisation
    kind: craft
    scope: "Premeditatio malorum: briefly and deliberately imagining loss and setback to blunt future shocks and renew appreciation of what you have."
    examples: [morning premeditation, loss rehearsal, dosage and stopping, gratitude from imagined loss]
    status: live
  - id: philosophical-journaling
    name: Philosophical Journaling
    kind: craft
    scope: "Journaling as a philosophical exercise in the manner of Marcus Aurelius: morning preparation, evening review of the day against your principles, and writing to yourself as counsel."
    examples: [evening review, morning rehearsal, maxims and hypomnemata, reviewing against virtues]
    status: live
  - id: view-from-above
    name: View from Above
    kind: craft
    scope: "Zooming out in imagination — city, planet, cosmos, deep time — to shrink a present trouble to its true size and recover perspective."
    examples: [cosmic zoom exercise, deep-time framing, perspective on grievances, scripted visualisations]
    status: live
  - id: voluntary-discomfort
    name: Voluntary Discomfort
    kind: craft
    scope: "Practising mild deliberate hardship — cold, hunger, plainness, doing without — to widen your comfort zone and prove fears of deprivation wrong."
    examples: [practising poverty days, cold exposure as exercise, plain meals, doing without a comfort]
    status: live
  - id: memento-mori
    name: Memento Mori
    kind: craft
    scope: "Keeping mortality deliberately in view to sharpen priorities: death reflection, finitude framing of time and choices, and symbols that cue it."
    examples: [daily death reflection, counting remaining summers, last-time meditation, memento objects]
    status: live
  - id: epicurean-practice
    name: Epicurean Practice
    kind: craft
    scope: "The Epicurean discipline of desire: classifying desires as natural or empty, savouring simple pleasures, and the tetrapharmakos applied to daily fears."
    examples: [desire classification, simple-pleasure savouring, tetrapharmakos, hedonic calculus of choices]
    status: live
  - id: virtue-self-examination
    name: Virtue Self-Examination
    kind: craft
    scope: "Auditing your character against a chosen set of virtues: defining them concretely, daily or weekly examination, and targeted practice on the weakest."
    examples: [virtue lists, Franklin's thirteen-virtues method, weekly character audits, targeted virtue drills]
    status: live
