category: mind-self
field: vows-and-personal-discipline-practice
products:
  - id: rule-of-life-design
    name: Rule-of-Life Design
    kind: craft
    scope: "Writing and living a personal rule: choosing commitments, setting their scope and review cycle, and revising the rule as life changes — outside any religious rite."
    examples: [drafting a rule, commitment scoping, periodic rule review, graceful revision]
    status: live
  - id: personal-vows-and-pledges
    name: Personal Vows and Pledges
    kind: craft
    scope: "Making a vow stick: wording it tightly, choosing witnesses and stakes, keeping it visible and handling a broken vow without abandoning the practice."
    examples: [vow wording, witnessed pledges, renewal rituals, repairing a broken vow]
    status: live
  - id: fasting-for-self-discipline
    name: Fasting for Self-Discipline
    kind: craft
    scope: "Abstaining from food or other appetites as a discipline practice: choosing fast forms, duration and frequency, and holding the line safely — fasting as rite is religion, as diet is health."
    examples: [fast selection, duration planning, breaking a fast well, appetite-discipline carryover]
    status: live
  - id: minimalism-practice
    name: Minimalism Practice
    kind: craft
    scope: "Deliberate self-limitation of possessions and consumption as a discipline: decluttering methods, acquisition rules and maintaining the floor once reached."
    examples: [declutter protocols, one-in-one-out rules, no-buy commitments, wardrobe and tool minimums]
    status: live
  - id: digital-detox
    name: Digital Detox
    kind: craft
    scope: "Structured abstinence from devices and platforms: detox design, substitution planning, re-entry rules and converting a detox into a sustainable usage policy."
    examples: [detox periods, platform fasts, re-entry rules, sustainable usage policies]
    status: live
  - id: challenge-commitments
    name: Challenge Commitments
    kind: craft
    scope: "Time-boxed discipline challenges as a practice form: picking the challenge, defining success tightly, surviving the middle slump and harvesting lasting habits at the end."
    examples: [30-day challenges, dry-month commitments, challenge rules design, post-challenge habit harvest]
    status: live
