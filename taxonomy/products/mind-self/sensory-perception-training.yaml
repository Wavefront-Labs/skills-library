category: mind-self
field: sensory-perception-training
products:
  - id: taste-calibration
    name: Taste Calibration
    kind: craft
    scope: "Training the palate as a general perceptual skill: basic-taste thresholds, comparative tasting discipline and building a taste vocabulary — the sommelier's or cupper's trade exam lives with that trade."
    examples: [triangle tests, basic-taste threshold training, comparative tasting, taste vocabulary]
    status: live
  - id: olfactory-training
    name: Olfactory Training
    kind: craft
    scope: "Sharpening smell: structured sniffing practice, aroma-kit work, naming and memorising odours and rebuilding acuity after loss."
    examples: [aroma kits, daily smell training, odour naming drills, scent memory building]
    status: live
  - id: auditory-discrimination
    name: Auditory Discrimination
    kind: craft
    scope: "Training the ear as a general faculty: pitch and interval discrimination, timbre and spatial-sound identification — formal musical ear training lives with music."
    examples: [pitch discrimination drills, timbre identification, sound localisation, environmental-sound naming]
    status: live
  - id: visual-discrimination
    name: Visual Discrimination
    kind: craft
    scope: "Sharpening the eye: colour and shade discrimination, detail spotting, rapid recognition drills and trained observation of scenes."
    examples: [colour discrimination drills, spot-the-difference training, rapid recognition, observational drawing-style looking]
    status: live
  - id: tactile-sensitivity-training
    name: Tactile Sensitivity Training
    kind: craft
    scope: "Refining touch: texture and temperature discrimination, two-point and pressure sensitivity work and reading materials by hand."
    examples: [texture grading, blind material identification, surface-flaw detection by touch, fine-pressure drills]
    status: live
