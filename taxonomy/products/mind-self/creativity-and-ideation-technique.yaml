category: mind-self
field: creativity-and-ideation-technique
products:
  - id: brainstorming
    name: Brainstorming
    kind: craft
    scope: "Generating many ideas fast, alone or in a group: deferring judgement, building on ideas, and structured variants like brainwriting that fix classic brainstorm failures."
    examples: [quantity-first generation, brainwriting 6-3-5, reverse brainstorming, round-robin facilitation]
    status: live
  - id: lateral-thinking
    name: Lateral Thinking
    kind: craft
    scope: "Deliberately breaking out of a dominant pattern of thought: provocation, random entry and concept extraction to reach ideas logic alone won't."
    examples: [provocation (po), random-word entry, concept fans, challenging assumptions]
    status: live
  - id: mind-mapping
    name: Mind Mapping
    kind: craft
    scope: "Radiant diagramming from a central idea to explore, organise and connect thoughts: branch discipline, keywords and using the map to find gaps."
    examples: [radial structure, keyword branches, cross-links, mapping to outline]
    status: live
  - id: scamper
    name: SCAMPER and Checklist Ideation
    kind: craft
    scope: "Systematic idea transformation through prompt checklists: substitute, combine, adapt, modify, put to other use, eliminate, reverse, and related question lists."
    examples: [SCAMPER passes, Osborn's checklist, attribute modification, reversal technique]
    status: live
  - id: six-thinking-hats
    name: Six Thinking Hats
    kind: craft
    scope: "Parallel thinking by deliberately switching modes: facts, feelings, caution, optimism, creativity and process, in sequence rather than argument."
    examples: [hat sequences, solo hat rotation, meeting facilitation with hats, separating critique from generation]
    status: live
  - id: morphological-analysis
    name: Morphological Analysis
    kind: craft
    scope: "Exhaustive combinatorial ideation: decomposing a problem into parameters, listing options for each and systematically exploring the combination space."
    examples: [morphological box, parameter selection, forced combinations, pruning the space]
    status: live
  - id: triz
    name: TRIZ
    kind: craft
    scope: "Inventive problem solving from patterns in past inventions: contradiction analysis, the 40 inventive principles and ideality as a self-applied thinking method."
    examples: [contradiction matrix, inventive principles, ideal final result, resource analysis]
    status: live
  - id: incubation-and-constraint-technique
    name: Incubation and Constraint Technique
    kind: craft
    scope: "Managing the conditions of insight: deliberate incubation breaks, capturing ideas when they arrive, and imposing artificial constraints to force novelty."
    examples: [incubation walks, idea capture habits, oblique strategies, constraint-based prompts]
    status: live
