category: human-services
field: childcare-and-early-childhood-care
products:
  - id: infant-care
    name: Infant Care
    kind: craft
    scope: "Daily physical care of babies under about two: feeding, nappy changing, bathing, safe sleep and soothing."
    examples: [bottle and solids feeding, safe sleep setup, settling techniques, nappy routines]
    status: live
  - id: daily-routines-and-transitions
    name: Daily Routines and Transitions
    kind: craft
    scope: "Running a child's day: mealtimes, naps, toileting, dressing, arrivals and pick-ups, and moving smoothly between activities."
    examples: [nap transitions, toilet training support, mealtime routines, drop-off settling]
    status: live
  - id: play-supervision
    name: Play Supervision and Engagement
    kind: craft
    scope: "Supervising and joining children's play safely and responsively: age-appropriate activities, outdoor play, managing risk without hovering."
    examples: [age-appropriate activity choice, active supervision ratios, risky-play judgement, outdoor play management]
    status: live
  - id: behaviour-guidance
    name: Behaviour Guidance
    kind: craft
    scope: "Responding to tantrums, biting, conflict and testing behaviour in a care setting: calm de-escalation, redirection and consistent limits."
    examples: [tantrum de-escalation, redirection, sibling and peer conflict, consistent limit-setting]
    status: live
  - id: child-safeguarding
    name: Child Safeguarding
    kind: craft
    scope: "Recognising and responding to signs of abuse or neglect in a care role: indicators, disclosure handling, mandatory reporting and safe practice."
    examples: [recognising indicators, handling a disclosure, reporting obligations, safe-practice boundaries]
    status: live
  - id: group-care-management
    name: Group Care Management
    kind: craft
    scope: "Caring for several children at once in daycare, family daycare or after-school settings: ratios, room flow, headcounts and mixed-age dynamics."
    examples: [room management, headcount discipline, mixed-age groups, excursion supervision]
    status: live
  - id: family-communication
    name: Family Communication and Handover
    kind: craft
    scope: "Keeping parents and guardians informed and aligned: daily handovers, incident conversations, routines agreements and day notes."
    examples: [daily handover, incident conversations, routine agreements, written day notes]
    status: live
  - id: in-home-childcare
    name: In-Home Childcare
    kind: craft
    scope: "Nannying, babysitting and au-pair work: caring for children in the family's own home, fitting the household's rules and rhythms."
    examples: [nannying, evening babysitting, school-run care, working within house rules]
    status: live
  - id: childcare-health-and-safety
    name: Childcare Health and Safety
    kind: craft
    scope: "Day-to-day health and safety in a care setting: hygiene and illness exclusion, allergy and medication awareness, childproofing and emergency drills."
    examples: [illness exclusion decisions, allergy-aware food handling, childproofing a space, emergency drills]
    status: live
