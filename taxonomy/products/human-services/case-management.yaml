category: human-services
field: case-management
products:
  - id: intake-and-needs-assessment
    name: Intake and Needs Assessment
    kind: craft
    scope: "Opening a case well: eligibility screening, intake interviews, holistic needs assessment and prioritisation across a waiting list."
    examples: [eligibility screening, intake interviewing, holistic needs assessment, waitlist triage]
    status: live
  - id: service-planning
    name: Service and Care Planning
    kind: craft
    scope: "Turning assessed needs into a plan: goal setting with the client, choosing services, consent and review dates, and plans the client actually owns."
    examples: [collaborative goal setting, service selection, consent and review cycles, client-owned plans]
    status: live
  - id: referral-and-coordination
    name: Referral and Service Coordination
    kind: craft
    scope: "Making the system work for one person: warm referrals, chasing follow-through, coordinating multiple providers and being the single thread across them."
    examples: [warm referrals, provider coordination, follow-through tracking, care-team communication]
    status: live
  - id: monitoring-and-review
    name: Monitoring, Review and Closure
    kind: craft
    scope: "Keeping a case on course: progress reviews, plan adjustment, re-assessment after change, and closing cases deliberately rather than by drift."
    examples: [progress reviews, plan adjustment, re-assessment triggers, planned case closure]
    status: live
  - id: caseload-management
    name: Caseload Management
    kind: craft
    scope: "Managing many cases at once: caseload prioritisation, time allocation across clients, crisis interruptions and not losing the quiet cases."
    examples: [caseload prioritisation, crisis vs routine balance, visit scheduling, quiet-case safeguards]
    status: live
  - id: housing-case-management
    name: Housing and Homelessness Case Management
    kind: craft
    scope: "Case management toward stable housing: homelessness intake, housing applications and advocacy to landlords, tenancy sustainment and rapid rehousing."
    examples: [homelessness intake, housing applications, landlord liaison, tenancy sustainment]
    status: live
  - id: benefits-coordination
    name: Benefits and Entitlements Coordination
    kind: craft
    scope: "Getting clients what they're entitled to: benefits eligibility mapping, application support, documentation gathering and liaison with payment agencies."
    examples: [entitlement mapping, application support, documentation gathering, agency liaison]
    status: live
  - id: reentry-case-management
    name: Re-entry Case Management
    kind: craft
    scope: "Supporting people leaving prison, hospital or out-of-home care back into community life: pre-release planning, first-weeks stabilisation and connection to ongoing supports."
    examples: [pre-release planning, first-weeks stabilisation, parole-condition navigation, transition from care]
    status: live
  - id: case-documentation
    name: Case Documentation
    kind: craft
    scope: "The case record as professional product: case notes, chronologies, information-sharing judgements and records that protect both client and worker."
    examples: [case-note discipline, chronologies, information-sharing decisions, audit-ready records]
    status: live
  - id: case-management-systems
    name: Case-Management Systems
    kind: application
    scope: "Working in client/case-management software as a class (CRM-style case systems, NDIS and welfare platforms): client records, workflows, reporting and data quality."
    examples: [client record keeping, workflow queues, report extraction, data-quality hygiene]
    status: live
