category: human-services
field: pastoral-and-chaplaincy-support
products:
  - id: pastoral-visiting
    name: Pastoral Visiting
    kind: craft
    scope: "The craft of the visit itself: arriving well, presence and compassionate listening at a bedside or cell or home, respecting any faith or none, and leaving well."
    examples: [bedside presence, compassionate listening, interfaith sensitivity, closing a visit]
    status: live
  - id: spiritual-needs-conversation
    name: Spiritual Needs Conversation
    kind: craft
    scope: "Hearing what sustains or troubles a person beneath the surface: gentle spiritual-needs screening, meaning and hope conversations and connecting to the person's own tradition when wanted."
    examples: [spiritual-needs screening, meaning and hope conversations, referral to faith communities, sitting with doubt]
    status: live
  - id: healthcare-chaplaincy-support
    name: Healthcare Chaplaincy Support
    kind: craft
    scope: "The emotional-support side of hospital and hospice chaplaincy: ward rounds, supporting patients and families through diagnosis, dying and death, and supporting staff."
    examples: [ward visiting, family support at end of life, bad-news aftermath support, staff support]
    status: live
  - id: prison-chaplaincy-support
    name: Prison Chaplaincy Support
    kind: craft
    scope: "Emotional support inside custody: cell and wing visiting, listening without judgement, breaking bad news to prisoners and supporting through sentences and release."
    examples: [wing visiting, breaking bad news in custody, release anxiety support, non-judgemental listening]
    status: live
  - id: workplace-and-military-chaplaincy-support
    name: Workplace and Military Chaplaincy Support
    kind: craft
    scope: "Embedded emotional support in workplaces, services and units: being available alongside the work, confidential listening and support through deployments, incidents and job loss."
    examples: [embedded availability, confidential listening, deployment support, critical-incident support]
    status: live
  - id: crisis-and-disaster-chaplaincy
    name: Crisis and Disaster Chaplaincy
    kind: craft
    scope: "Pastoral presence at the worst moments: emergency and disaster response support, death notifications alongside police, and comfort at scenes and vigils."
    examples: [disaster-scene presence, death notification support, community vigils, first-responder support]
    status: live
