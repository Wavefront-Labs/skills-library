category: human-services
field: community-services-and-development
products:
  - id: community-outreach
    name: Community Outreach
    kind: craft
    scope: "Reaching people services miss: street and venue outreach, building trust with hard-to-reach groups and connecting them in."
    examples: [street outreach, assertive outreach, trust building, engagement of hard-to-reach groups]
    status: live
  - id: community-needs-assessment
    name: Community Needs and Asset Assessment
    kind: craft
    scope: "Understanding a community before acting: needs assessment, asset mapping, community consultation and listening projects."
    examples: [needs assessment, asset-based mapping, community consultation, listening campaigns]
    status: live
  - id: programme-design-and-delivery
    name: Programme Design and Delivery
    kind: craft
    scope: "Building and running community programmes: design from identified need, delivery logistics, participant engagement, evaluation and funder reporting."
    examples: [programme design, participant recruitment, outcome evaluation, funder reporting]
    status: live
  - id: group-facilitation
    name: Community Group Facilitation
    kind: craft
    scope: "Facilitating community meetings and groups: inclusive participation, workshop design, decision processes and handling tension in the room."
    examples: [inclusive meeting design, workshop facilitation, consensus processes, handling room tension]
    status: live
  - id: settlement-services
    name: Migrant and Refugee Settlement Services
    kind: craft
    scope: "Supporting newcomers to settle: orientation to systems and life admin, working across language and culture, and building belonging."
    examples: [orientation support, working with interpreters, cultural bridging, settlement casework]
    status: live
  - id: youth-work
    name: Youth Work
    kind: craft
    scope: "Engaging young people on their terms: drop-in and detached youth work, relationship-based practice, youth participation and keeping young people safe."
    examples: [drop-in sessions, detached youth work, youth voice and participation, boundaries with young people]
    status: live
  - id: volunteer-coordination
    name: Volunteer Coordination
    kind: craft
    scope: "Running a volunteer workforce: recruitment and screening, matching to roles, induction, retention and recognising volunteers well."
    examples: [volunteer recruitment and screening, role matching, induction, retention and recognition]
    status: live
  - id: mutual-aid-coordination
    name: Mutual-Aid Network Coordination
    kind: craft
    scope: "Organising structured informal support: intake of requests, matching requests to offers, logistics of food and goods distribution and keeping a network running."
    examples: [request-offer matching, food distribution logistics, network intake, coordinating helpers]
    status: live
  - id: interagency-partnership-work
    name: Interagency and Partnership Work
    kind: craft
    scope: "Making services work together: interagency networks, referral pathways between organisations, joint programmes and place-based collaborations."
    examples: [interagency networks, referral pathway building, joint programme coordination, place-based collaboration]
    status: live
  - id: community-centre-operations
    name: Community Centre and Hub Operations
    kind: craft
    scope: "Running a neighbourhood house, drop-in or community hub day to day: space and timetable management, welcoming all comers and handling incidents on site."
    examples: [space and timetable management, front-desk welcome, incident handling, hub activity mix]
    status: live
