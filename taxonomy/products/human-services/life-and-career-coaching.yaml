category: human-services
field: life-and-career-coaching
products:
  - id: coaching-conversation
    name: Coaching Conversation Craft
    kind: craft
    scope: "The core coaching session: powerful questions, listening for what matters, structured models (GROW and kin) and letting the client find their own answers."
    examples: [powerful questioning, GROW sessions, listening beneath the words, client-led agendas]
    status: live
  - id: goal-setting-and-accountability
    name: Goal Setting and Accountability
    kind: craft
    scope: "Turning intent into movement: clarifying goals, action planning between sessions, accountability structures and working with stuckness."
    examples: [goal clarification, between-session actions, accountability check-ins, working with stuckness]
    status: live
  - id: career-transition-coaching
    name: Career Transition Coaching
    kind: craft
    scope: "Coaching identity and direction through career change: values and strengths clarification, option exploration and adjustment to a new working self — not the job-search tactics themselves."
    examples: [values clarification, career option exploration, identity in transition, return-to-work confidence]
    status: live
  - id: executive-coaching
    name: Executive and Leadership Coaching
    kind: craft
    scope: "Coaching leaders on themselves: self-awareness, stakeholder feedback debriefs, leadership presence and sponsor-involved engagements."
    examples: [360-feedback debriefs, leadership presence, sponsor contracting, derailer work]
    status: live
  - id: life-and-wellness-coaching
    name: Life and Wellness Coaching
    kind: craft
    scope: "Coaching the whole life: habits and wellbeing goals, life balance, motivation and sustainable change, without treating any clinical condition."
    examples: [habit change support, life-wheel reviews, motivation work, sustainable routines]
    status: live
  - id: coaching-contracting-and-ethics
    name: Contracting and Coaching Ethics
    kind: craft
    scope: "The professional frame: engagement contracting, confidentiality, three-way agreements with employers, ethical boundaries and referring out when coaching isn't the answer."
    examples: [engagement contracting, three-way agreements, confidentiality boundaries, referring beyond coaching]
    status: live
  - id: group-and-team-coaching
    name: Group and Team Coaching
    kind: craft
    scope: "Coaching more than one person at once: group coaching programmes, team coaching dynamics and peer learning structures."
    examples: [group programme design, team coaching sessions, peer-coaching circles, managing group dynamics]
    status: live
