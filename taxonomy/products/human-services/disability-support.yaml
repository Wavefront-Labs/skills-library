category: human-services
field: disability-support
products:
  - id: personal-support-work
    name: Personal Support Work
    kind: craft
    scope: "Hands-on daily assistance for people with disability: personal care, transfers, mealtime support and routines, led by the person's preferences."
    examples: [personal care with consent, transfers and hoisting, mealtime assistance, following a support plan]
    status: live
  - id: supported-independent-living
    name: Supported Independent Living
    kind: craft
    scope: "Supporting people with disability to run their own homes and lives: household routines, budgeting support, shared-living dynamics and building independence."
    examples: [household routine support, shared-living facilitation, independence building, overnight support]
    status: live
  - id: daily-living-skill-building
    name: Daily Living Skill-Building
    kind: craft
    scope: "Coaching daily-living capability step by step: cooking, travel training, money handling and self-care, using task breakdown, prompting and fading."
    examples: [task analysis, prompting hierarchies, travel training, cooking skill support]
    status: live
  - id: positive-behaviour-support
    name: Positive Behaviour Support
    kind: craft
    scope: "Understanding behaviours of concern and supporting change: functional thinking, environment and routine adjustments, de-escalation and following behaviour support plans."
    examples: [identifying triggers, de-escalation, implementing behaviour support plans, restrictive-practice awareness]
    status: live
  - id: communication-support
    name: Communication Support
    kind: craft
    scope: "Supporting people who communicate differently: AAC devices and boards in daily use, key word sign, easy-read materials and giving time to be understood."
    examples: [AAC in daily support, key word sign, easy-read documents, supported conversations]
    status: live
  - id: community-participation-support
    name: Community Participation Support
    kind: craft
    scope: "Supporting people with disability to take part in community life: outings, groups, transport, social connection and fading support as confidence grows."
    examples: [supported outings, group participation, transport support, building natural supports]
    status: live
  - id: disability-employment-support
    name: Disability Employment Support
    kind: craft
    scope: "Job coaching in the workplace for employees with disability: on-the-job support, task adaptation, employer liaison and fading to natural supports."
    examples: [on-the-job coaching, task adaptation, employer liaison, support fading]
    status: live
  - id: disability-respite-support
    name: Disability Respite Support
    kind: craft
    scope: "Short-term and emergency support that relieves regular carers of people with disability: familiarisation, routine continuity and camps or centre-based respite."
    examples: [short-notice familiarisation, routine continuity, centre-based respite, respite camps]
    status: live
  - id: disability-safeguarding
    name: Disability Safeguarding and Dignity of Risk
    kind: craft
    scope: "Keeping people with disability safe without taking over: abuse recognition and reporting, supported decision-making and balancing protection with the right to take risks."
    examples: [abuse recognition and reporting, supported decision-making, dignity of risk judgement, complaints support]
    status: live
  - id: support-planning-and-documentation
    name: Support Planning and Documentation
    kind: craft
    scope: "The paperwork side of disability support: shift notes, incident reports, goal tracking against plans and funding-scheme documentation (NDIS-style)."
    examples: [shift notes, incident reporting, goal progress tracking, funding-plan documentation]
    status: live
