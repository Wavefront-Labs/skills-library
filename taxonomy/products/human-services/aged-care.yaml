category: human-services
field: aged-care
products:
  - id: personal-care-assistance
    name: Personal Care Assistance
    kind: craft
    scope: "Helping an older adult with daily living: bathing, dressing, grooming, toileting and continence support, done with dignity."
    examples: [assisted bathing, dressing assistance, continence support, grooming with dignity]
    status: live
  - id: dementia-support
    name: Dementia Support
    kind: craft
    scope: "Day-to-day support for people living with dementia: communication approaches, responding to confusion and distress, routine and environment."
    examples: [validation communication, responding to sundowning, wandering management, dementia-friendly environments]
    status: live
  - id: mobility-and-falls-support
    name: Mobility and Falls Support
    kind: craft
    scope: "Everyday help with moving safely: transfers, walking support, hoists and aids use, and reducing fall risk in the home."
    examples: [safe transfers, walking assistance, hoist and aid use, home fall-risk reduction]
    status: live
  - id: mealtime-and-nutrition-support
    name: Mealtime and Nutrition Support
    kind: craft
    scope: "Supporting eating and drinking in daily care: meal preparation to preference, feeding assistance, hydration and texture-modified meals as directed."
    examples: [feeding assistance, hydration prompting, texture-modified meal handling, meal preparation to preference]
    status: live
  - id: companionship-and-engagement
    name: Companionship and Social Engagement
    kind: craft
    scope: "Keeping older adults connected and occupied: conversation, outings, activities, reminiscence and reducing isolation."
    examples: [reminiscence conversation, outings, activity facilitation, combating isolation]
    status: live
  - id: home-care-work
    name: Home Care Work
    kind: craft
    scope: "Delivering support in the client's own home: visit structure, domestic assistance, working alone safely and respecting the household."
    examples: [visit routines, domestic assistance, lone-worker safety, respecting the client's home]
    status: live
  - id: residential-care-support
    name: Residential Care Support
    kind: craft
    scope: "Daily-living support on a residential aged-care floor: shift routines, working across a resident group, handovers and care documentation."
    examples: [shift routines, resident group support, handover notes, progress documentation]
    status: live
  - id: respite-care
    name: Respite Care
    kind: craft
    scope: "Stepping in so a regular carer can rest: short-notice familiarisation, keeping routines intact and handing back well."
    examples: [rapid familiarisation, routine continuity, carer handback, in-home and centre-based respite]
    status: live
  - id: elder-safeguarding
    name: Elder Safeguarding
    kind: craft
    scope: "Recognising and responding to elder abuse, neglect and financial exploitation in a care role, and escalating appropriately."
    examples: [recognising abuse indicators, financial exploitation signs, raising concerns, dignity and autonomy balance]
    status: live
  - id: end-of-life-companionship
    name: End-of-Life Companionship
    kind: craft
    scope: "Non-clinical presence and comfort for a dying older person and their family in the final weeks: being there, small comforts, supporting the family in the room."
    examples: [bedside presence, comfort measures, supporting visiting family, knowing when to call for help]
    status: live
