category: human-services
field: volunteer-care-work
products:
  - id: befriending
    name: Befriending and Companionship Visiting
    kind: craft
    scope: "Organised friendship for isolated people: regular visits or calls, building a genuine connection within a volunteer frame, and sustaining it over time."
    examples: [regular visiting, telephone befriending, building rapport within a role, sustaining long matches]
    status: live
  - id: helpline-volunteering
    name: Helpline Volunteering
    kind: craft
    scope: "Volunteering on charity phone and chat lines: listening within the service model, following escalation protocols and handling difficult calls without clinical training."
    examples: [listening within a model, escalation protocols, difficult-caller handling, shift debriefs]
    status: live
  - id: hospital-and-hospice-volunteering
    name: Hospital and Hospice Volunteering
    kind: craft
    scope: "Volunteering on wards and in hospices: visiting patients, practical comforts, wayfinding help and fitting around clinical staff and rules."
    examples: [ward visiting, patient comforts, wayfinding and errands, working around clinical teams]
    status: live
  - id: volunteer-home-visiting
    name: Volunteer Home Visiting and Practical Help
    kind: craft
    scope: "Going to people's homes as a volunteer: home visits, shopping, transport and small practical help, done safely and within the scheme's limits."
    examples: [home-visit safety, shopping and errands, volunteer driving, staying within scheme limits]
    status: live
  - id: volunteer-mentoring
    name: Volunteer Mentoring
    kind: craft
    scope: "Being a mentor through an organised scheme: matched relationships with young people or adults in difficulty, consistency, encouragement and healthy endings."
    examples: [mentoring relationships, showing up consistently, encouragement without rescuing, ending a match well]
    status: live
  - id: volunteer-role-craft
    name: Volunteer Role Craft
    kind: craft
    scope: "Being good at being a volunteer: boundaries of the role, reliability, confidentiality, safeguarding basics and knowing when to hand over to staff."
    examples: [role boundaries, reliability and commitment, safeguarding basics, handing over to staff]
    status: live
