category: human-services
field: bereavement-support-and-death-doula-work
products:
  - id: grief-support
    name: One-to-One Grief Support
    kind: craft
    scope: "Supporting a grieving person: listening to loss, normalising grief's shapes, companioning over months and knowing when grief needs clinical help."
    examples: [grief listening, normalising grief reactions, anniversary support, recognising complicated grief]
    status: live
  - id: grief-support-groups
    name: Grief Support Groups
    kind: craft
    scope: "Facilitating groups of bereaved people: loss-specific groups (partner, child, suicide loss), session structure and holding shared sorrow safely."
    examples: [loss-specific group design, holding shared grief, suicide-loss groups, closing rituals for groups]
    status: live
  - id: death-doula-companionship
    name: Death Doula Companionship
    kind: craft
    scope: "Accompanying a dying person: presence at the bedside, vigil planning and keeping, comfort and advocacy for the person's wishes through the dying time."
    examples: [vigil planning and keeping, bedside presence, honouring dying wishes, supporting the room]
    status: live
  - id: end-of-life-planning-support
    name: End-of-Life Planning Support
    kind: craft
    scope: "Helping people prepare for death practically and personally: advance-wishes conversations, legacy and letter projects, funeral preferences and getting affairs in order — not legal drafting."
    examples: [advance-wishes conversations, legacy projects, funeral preference planning, affairs-in-order checklists]
    status: live
  - id: after-death-practical-support
    name: After-Death Practical Support
    kind: craft
    scope: "Walking a family through the days after a death: what has to happen and when, registrations and notifications, funeral liaison and supporting decisions in shock."
    examples: [first-days guidance, notifications and registrations, funeral liaison, decision support in shock]
    status: live
  - id: supporting-bereaved-children
    name: Supporting Bereaved Children
    kind: craft
    scope: "Non-clinical grief support for children and teens: age-honest conversations about death, grief activities and helping the adults around them."
    examples: [age-appropriate death conversations, grief activities for children, memory boxes, guiding surrounding adults]
    status: live
