category: human-services
field: service-navigation-and-self-advocacy
products:
  - id: finding-and-understanding-services
    name: Finding and Understanding Services
    kind: craft
    scope: "Working out what help exists and whether you qualify: searching service systems, decoding eligibility rules and jargon, and choosing where to start."
    examples: [service searching, eligibility decoding, understanding referral chains, choosing an entry point]
    status: live
  - id: benefits-navigation
    name: Benefits and Entitlements Navigation
    kind: craft
    scope: "Claiming what you're entitled to yourself: benefit applications, evidence and documentation, reporting obligations and surviving the process."
    examples: [benefit applications, gathering evidence, reporting obligations, handling rejections]
    status: live
  - id: self-advocacy
    name: Self-Advocacy
    kind: craft
    scope: "Asserting your own needs with services: preparing for appointments, saying what you want clearly, pushing back on fobbing-off and bringing a supporter."
    examples: [appointment preparation, stating needs clearly, pushing back, using a support person]
    status: live
  - id: appeals-and-complaints
    name: Appeals and Complaints as a Service User
    kind: craft
    scope: "Challenging a decision about yourself: requesting reasons and records, internal reviews, appeals and complaints to ombudsmen, and keeping going through delays."
    examples: [requesting your records, internal review requests, ombudsman complaints, persistence through delay]
    status: live
  - id: own-case-paperwork
    name: Managing Your Own Case Paperwork
    kind: craft
    scope: "Staying on top of your own file: organising letters and evidence, tracking deadlines and reference numbers, and keeping a record of every contact."
    examples: [document organisation, deadline tracking, contact logs, evidence files]
    status: live
  - id: peer-navigation
    name: Peer Navigation
    kind: craft
    scope: "Guiding others through a system you've survived yourself: sharing navigation know-how peer to peer, walking alongside through processes and staying in the peer lane."
    examples: [sharing system know-how, accompanying to appointments, process walk-throughs, peer-role limits]
    status: live
