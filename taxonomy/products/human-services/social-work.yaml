category: human-services
field: social-work
products:
  - id: psychosocial-assessment
    name: Intake and Psychosocial Assessment
    kind: craft
    scope: "Assessing a person's situation and needs: intake interviews, risk and strengths assessment, genograms and eco-maps, and forming a professional judgement."
    examples: [intake interviewing, risk assessment, strengths-based assessment, genograms and eco-maps]
    status: live
  - id: child-protection-casework
    name: Child Protection Casework
    kind: craft
    scope: "Statutory child-safety work: investigating concerns, safety planning, home visits, working with resistant families and out-of-home-care decisions."
    examples: [safety and risk assessment, home visits, safety planning, out-of-home-care casework]
    status: live
  - id: family-casework
    name: Family Casework
    kind: craft
    scope: "Working with whole families under strain: family assessment, parenting-capacity support, family violence response and keeping families together safely."
    examples: [family assessment, family violence response, reunification work, whole-family planning]
    status: live
  - id: medical-social-work
    name: Medical Social Work
    kind: craft
    scope: "Social work in hospitals and health settings: discharge planning, adjustment to illness and injury, family conferences and linking patients to community support."
    examples: [discharge planning, family conferences, adjustment support, community linkage]
    status: live
  - id: school-social-work
    name: School Social Work
    kind: craft
    scope: "Social work in schools: attendance and welfare casework, home-school liaison, responding to student crises and connecting families to services."
    examples: [attendance casework, home-school liaison, student crisis response, family referral]
    status: live
  - id: crisis-intervention
    name: Crisis Intervention
    kind: craft
    scope: "Responding when things fall apart: immediate safety, de-escalation, suicide-risk screening and stabilising a person or family through an acute crisis."
    examples: [de-escalation, suicide-risk screening and escalation, safety planning, acute crisis stabilisation]
    status: live
  - id: adult-safeguarding
    name: Adult Safeguarding
    kind: craft
    scope: "Protecting adults at risk: abuse and neglect inquiries, capacity-aware practice, multi-agency safeguarding and balancing protection with autonomy."
    examples: [safeguarding inquiries, capacity-aware practice, multi-agency meetings, self-neglect response]
    status: live
  - id: social-group-work
    name: Group Work
    kind: craft
    scope: "Running therapeutic and support groups as a social worker: group design, stages of group life, managing dynamics and co-facilitation."
    examples: [group design, managing group dynamics, co-facilitation, psychoeducational groups]
    status: live
  - id: case-recording-and-court-work
    name: Case Recording and Court Work
    kind: craft
    scope: "The written and legal face of practice: case notes that stand up to scrutiny, court reports, affidavits and giving evidence."
    examples: [defensible case notes, court report writing, giving evidence, chronologies]
    status: live
  - id: reflective-practice-and-supervision
    name: Reflective Practice and Supervision
    kind: craft
    scope: "Sustaining sound judgement in the profession: using and giving professional supervision, reflective practice, ethical reasoning and managing vicarious trauma."
    examples: [supervision sessions, ethical dilemma reasoning, reflective models, vicarious-trauma management]
    status: live
