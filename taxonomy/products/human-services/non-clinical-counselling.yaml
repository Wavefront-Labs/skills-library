category: human-services
field: non-clinical-counselling
products:
  - id: supportive-listening
    name: Supportive Listening
    kind: craft
    scope: "The core helping conversation: active listening, reflection, open questions, silence and empathy without advice-giving or diagnosis."
    examples: [active listening, reflective responses, open questioning, holding silence]
    status: live
  - id: crisis-line-work
    name: Crisis-Line Work
    kind: craft
    scope: "Supporting callers and texters in distress on helplines: rapid rapport, risk checking, de-escalation and ending calls safely within service protocols."
    examples: [rapid rapport, suicide-risk checking, call de-escalation, safe call endings]
    status: live
  - id: peer-support
    name: Peer Support
    kind: craft
    scope: "Helping from lived experience: sharing your story usefully, mutuality, hope-giving and staying within the peer role."
    examples: [intentional story sharing, mutual support, recovery-oriented conversation, peer-role boundaries]
    status: live
  - id: pastoral-counselling
    name: Pastoral Counselling
    kind: craft
    scope: "Non-clinical counselling in a faith context: listening and guidance for life difficulties where belief matters to the person, without rite or doctrine-teaching."
    examples: [faith-aware listening, meaning and doubt conversations, premarital conversations, congregant support]
    status: live
  - id: support-group-facilitation
    name: Support Group Facilitation
    kind: craft
    scope: "Running peer and mutual-support groups: structure, ground rules, drawing out quiet members, managing dominating ones and holding heavy content."
    examples: [ground-rule setting, balancing airtime, holding heavy disclosures, closing a session well]
    status: live
  - id: boundaries-and-referral
    name: Boundaries and Referral
    kind: craft
    scope: "Knowing the edge of the non-clinical role: recognising when a difficulty needs clinical care, warm referral, confidentiality limits and self-care in helping roles."
    examples: [recognising clinical red flags, warm referral, confidentiality limits, helper self-care]
    status: live
  - id: conflict-and-mediation-support
    name: Informal Mediation and Conflict Support
    kind: craft
    scope: "Helping two people in difficulty hear each other: informal mediation of relationship and neighbour disputes, impartial facilitation and agreement finding."
    examples: [impartial facilitation, hearing both sides, agreement building, knowing when to stop]
    status: live
