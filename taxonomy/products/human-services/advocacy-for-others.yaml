category: human-services
field: advocacy-for-others
products:
  - id: individual-advocacy-casework
    name: Individual Advocacy Casework
    kind: craft
    scope: "The core advocacy case: taking instructions, clarifying what the person wants, representing it faithfully to a service or institution and pursuing it to an outcome."
    examples: [taking instructions, issue clarification, representing wishes faithfully, pursuing outcomes]
    status: live
  - id: meeting-and-tribunal-representation
    name: Meeting and Hearing Representation
    kind: craft
    scope: "Speaking for someone in the room: preparing them for meetings, case conferences and non-legal tribunals, speaking on their behalf and keeping them in control."
    examples: [meeting preparation, speaking on instruction, case conferences, support at hearings]
    status: live
  - id: complaints-and-appeals-advocacy
    name: Complaints and Appeals Advocacy
    kind: craft
    scope: "Challenging decisions for a client: service complaints, internal reviews and appeals, escalation to ombudsmen and watchdogs, and persistence through the process."
    examples: [complaint drafting, internal reviews, ombudsman escalation, appeal persistence]
    status: live
  - id: disability-rights-advocacy
    name: Disability Rights Advocacy
    kind: craft
    scope: "Advocating for people with disability: rights under disability law and funding schemes, supported decision-making in advocacy and challenging exclusion and restrictive practice."
    examples: [funding-scheme advocacy, supported decision-making, challenging exclusion, restrictive-practice challenges]
    status: live
  - id: patient-advocacy
    name: Patient Advocacy
    kind: craft
    scope: "Advocating within health systems: helping patients be heard in their care, consent and treatment-wishes advocacy, navigating hospital hierarchies and health complaints."
    examples: [being heard in care decisions, treatment-wishes advocacy, hospital escalation, health complaints]
    status: live
  - id: tenant-advocacy
    name: Tenant and Housing Advocacy
    kind: craft
    scope: "Advocating for renters and residents: repairs and conditions disputes, eviction response, negotiating with landlords and agents and residential tenancy processes."
    examples: [repairs disputes, eviction response, landlord negotiation, tenancy tribunal support]
    status: live
  - id: child-advocacy
    name: Child Advocacy
    kind: craft
    scope: "Giving children a voice in decisions about them: eliciting a child's views, representing them in care and education processes and independent visitor roles."
    examples: [eliciting children's views, voice in care proceedings, education advocacy, independent visiting]
    status: live
