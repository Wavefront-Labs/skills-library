category: law-government
field: criminal-law
products:
  - id: charging-and-case-assessment
    name: Charging and Case Assessment
    kind: craft
    scope: "Prosecutorial screening and charging: evaluating evidence sufficiency, selecting charges and exercising charging discretion."
    examples: [charge selection, evidence sufficiency review, declination decisions, grand jury presentation]
    status: live
  - id: criminal-defence-strategy
    name: Criminal Defence Strategy
    kind: craft
    scope: "Building the defence case: theory of defence, investigation direction, suppression strategy and client counselling."
    examples: [defence theory, suppression motions, alibi development, client advisement]
    status: live
  - id: plea-negotiation
    name: Plea Negotiation
    kind: craft
    scope: "Negotiating plea agreements between prosecution and defence: charge and sentence bargaining, cooperation agreements."
    examples: [charge bargaining, sentence bargaining, cooperation agreements, plea colloquy preparation]
    status: live
  - id: criminal-trial-advocacy
    name: Criminal Trial Advocacy
    kind: craft
    scope: "Trying criminal cases: jury selection, openings and closings, direct and cross-examination, evidentiary objections."
    examples: [voir dire, cross-examination, closing argument, objection practice]
    status: live
  - id: criminal-motions-practice
    name: Criminal Motions Practice
    kind: craft
    scope: "Pre-trial and trial motions in criminal cases: suppression, dismissal, discovery and in-limine motions."
    examples: [motion to suppress, motion to dismiss, Brady demands, motions in limine]
    status: live
  - id: sentencing-advocacy
    name: Sentencing Advocacy
    kind: craft
    scope: "Advocating at sentencing: guideline analysis, mitigation presentation, sentencing memoranda and allocution preparation."
    examples: [guideline calculation, mitigation evidence, sentencing memoranda, victim impact response]
    status: live
  - id: criminal-appeals-and-post-conviction
    name: Criminal Appeals and Post-Conviction
    kind: craft
    scope: "Appellate and post-conviction criminal practice: issue selection, appellate briefing, habeas and conviction-review petitions."
    examples: [appellate briefing, preservation of error, habeas petitions, conviction integrity review]
