category: law-government
field: civil-litigation
products:
  - id: pleadings-drafting
    name: Pleadings Drafting
    kind: craft
    scope: "Drafting complaints, answers and other pleadings that frame a civil claim and survive early challenge."
    examples: [complaint drafting, answers and defences, counterclaims, amendment strategy]
    status: live
  - id: motions-practice
    name: Motions Practice
    kind: craft
    scope: "Civil motion work: dispositive and procedural motions, supporting briefs and oral argument."
    examples: [motions to dismiss, summary judgment, injunction applications, brief writing]
    status: live
  - id: discovery-practice
    name: Discovery Practice
    kind: craft
    scope: "Running civil discovery: document requests, interrogatories, privilege, depositions and discovery disputes."
    examples: [document requests, deposition taking, privilege logs, discovery motions]
    status: live
  - id: civil-trial-advocacy
    name: Civil Trial Advocacy
    kind: craft
    scope: "Trying civil cases: witness examination, exhibits, jury and bench trial presentation."
    examples: [direct examination, cross-examination, exhibit handling, closing argument]
    status: live
  - id: civil-appellate-practice
    name: Civil Appellate Practice
    kind: craft
    scope: "Appealing civil judgments: issue selection, appellate briefing, the record on appeal and oral argument."
    examples: [appellate briefs, standard-of-review framing, record designation, oral argument]
    status: live
  - id: settlement-negotiation
    name: Settlement Negotiation
    kind: craft
    scope: "Negotiating and documenting civil settlements: valuation, offers, releases and settlement agreements."
    examples: [case valuation, offer strategy, release drafting, structured settlements]
    status: live
  - id: expert-witness-practice
    name: Expert Witness Practice
    kind: craft
    scope: "Working with expert evidence: selecting and preparing experts, expert reports and admissibility challenges."
    examples: [expert selection, report review, Daubert challenges, expert deposition]
    status: live
  - id: class-and-collective-actions
    name: Class and Collective Actions
    kind: craft
    scope: "Litigating aggregated claims: certification, class notice, settlement approval and mass-tort coordination."
    examples: [class certification, class notice, settlement approval, multidistrict coordination]
    status: live
  - id: e-discovery-platforms
    name: E-discovery Platforms
    kind: application
    scope: "Running document review and production on e-discovery platforms such as Relativity: collections, search, review workflows and productions."
    examples: [review workflow setup, search term negotiation, TAR workflows, production formatting]
    status: live
  - id: legal-research-platforms
    name: Legal Research Platforms
    kind: application
    scope: "Case-law and statute research on platforms such as Westlaw and LexisNexis: search strategy, citators and authority checking."
    examples: [case-law search, citator checking, statutory research, secondary sources]
    status: live
  - id: e-filing-systems
    name: E-filing Systems
    kind: application
    scope: "Filing and retrieving court documents through electronic filing systems such as CM/ECF and state e-filing portals."
    examples: [filing procedure, docket retrieval, service of process records, deadline capture]
    status: live
