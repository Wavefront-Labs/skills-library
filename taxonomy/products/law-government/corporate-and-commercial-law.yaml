category: law-government
field: corporate-and-commercial-law
products:
  - id: contract-drafting
    name: Contract Drafting
    kind: craft
    scope: "Drafting commercial contracts: structure, operative clauses, risk allocation and plain-language precision."
    examples: [clause architecture, indemnity drafting, limitation of liability, boilerplate judgement]
    status: live
  - id: contract-negotiation
    name: Contract Negotiation
    kind: craft
    scope: "Negotiating commercial terms: markups, issue lists, fallback positions and closing the redline."
    examples: [redline strategy, issue lists, fallback positions, deal-point trade-offs]
    status: live
  - id: entity-formation-and-governance
    name: Entity Formation and Governance
    kind: craft
    scope: "Forming and governing business entities: incorporation documents, bylaws, board and shareholder matters."
    examples: [articles of incorporation, bylaws drafting, board resolutions, shareholder agreements]
    status: live
  - id: mergers-and-acquisitions
    name: Mergers and Acquisitions
    kind: craft
    scope: "Running M&A transactions: structuring, due diligence, purchase agreements and closing mechanics."
    examples: [due diligence, purchase agreement drafting, disclosure schedules, closing checklists]
    status: live
  - id: securities-and-capital-markets
    name: Securities and Capital Markets
    kind: craft
    scope: "Securities-law work: offerings, disclosure documents, periodic reporting and exchange-rule compliance."
    examples: [prospectus drafting, private placements, periodic reporting, insider-trading policies]
    status: live
  - id: commercial-lending-and-finance
    name: Commercial Lending and Finance
    kind: craft
    scope: "Documenting debt finance: loan agreements, security packages, guarantees and intercreditor terms."
    examples: [loan agreement drafting, security documents, guarantees, intercreditor agreements]
    status: live
  - id: corporate-compliance-counselling
    name: Corporate Compliance Counselling
    kind: craft
    scope: "Advising on regulatory compliance programmes: anti-bribery, sanctions, competition and internal policies."
    examples: [compliance programme design, anti-bribery advice, sanctions screening advice, internal investigations counsel]
    status: live
  - id: commercial-legal-opinions
    name: Commercial Legal Opinions
    kind: craft
    scope: "Giving written legal opinions and structured advice on commercial questions: opinion letters and risk memoranda."
    examples: [opinion letters, enforceability analysis, risk memoranda, qualification language]
