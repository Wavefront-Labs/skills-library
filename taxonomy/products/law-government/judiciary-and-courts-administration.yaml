category: law-government
field: judiciary-and-courts-administration
products:
  - id: judicial-decision-making
    name: Judicial Decision-making
    kind: craft
    scope: "Deciding cases from the bench: weighing evidence, applying law to facts and exercising judicial discretion."
    examples: [evidence weighing, credibility findings, discretion exercise, bench rulings]
    status: live
  - id: judgment-and-opinion-writing
    name: Judgment and Opinion Writing
    kind: craft
    scope: "Writing judicial decisions: structuring reasons, findings of fact, legal analysis and orders that hold up on appeal."
    examples: [reasons structure, findings of fact, appellate-proof analysis, order drafting]
    status: live
  - id: courtroom-and-trial-management
    name: Courtroom and Trial Management
    kind: craft
    scope: "Running proceedings from the bench: controlling the courtroom, ruling on objections, jury management and self-represented parties."
    examples: [objection rulings, jury instructions, courtroom control, self-represented party handling]
    status: live
  - id: court-clerking
    name: Court Clerking
    kind: craft
    scope: "Judicial clerking and registry work: bench memos, draft opinions, order processing and the court record."
    examples: [bench memos, draft opinion preparation, order processing, record maintenance]
    status: live
  - id: docket-and-caseflow-management
    name: Docket and Caseflow Management
    kind: craft
    scope: "Managing the court's caseload: calendaring, caseflow standards, backlog reduction and differentiated case tracks."
    examples: [calendaring, caseflow standards, backlog reduction, case-track assignment]
    status: live
  - id: court-administration
    name: Court Administration
    kind: craft
    scope: "Running the court as an institution: budgeting, staffing, jury operations, security coordination and public access."
    examples: [court budgeting, jury operations, facilities and security coordination, public access services]
    status: live
  - id: judicial-ethics-and-conduct
    name: Judicial Ethics and Conduct
    kind: craft
    scope: "Judicial conduct standards: recusal and disqualification, extrajudicial activity limits and conduct-complaint processes."
    examples: [recusal decisions, conflict screening, extrajudicial activity limits, conduct-complaint response]
    status: live
  - id: court-case-management-systems
    name: Court Case Management Systems
    kind: application
    scope: "Operating court case-management and e-filing systems such as Odyssey and CM/ECF: docketing, scheduling and records workflows."
    examples: [docketing workflows, scheduling modules, e-filing administration, records retrieval]
    status: live
