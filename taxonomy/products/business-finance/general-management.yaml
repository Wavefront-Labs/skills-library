category: business-finance
field: general-management
products:
  - id: operations-management
    name: Operations Management
    kind: craft
    scope: "Running an organisation's day-to-day operations: capacity, workflow, service levels, resourcing and cross-functional coordination in any sector."
    examples: [capacity planning, workflow design, service-level management, operational cadence]
    status: live
  - id: office-administration
    name: Office Administration
    kind: craft
    scope: "The administrative machinery of an organisation: scheduling, correspondence handling, records, travel and expense coordination, front-office procedure."
    examples: [calendar management, records keeping, expense processing, meeting logistics]
    status: live
  - id: executive-leadership
    name: Executive Leadership
    kind: craft
    scope: "Leading an organisation or unit as a general manager: setting priorities, delegating, managing managers, board reporting and organisational decision-making."
    examples: [delegation, management cadence, board reporting, organisational design]
    status: live
  - id: business-process-improvement
    name: Business Process Improvement
    kind: craft
    scope: "Mapping, measuring and redesigning how work gets done: process mapping, lean and continuous-improvement methods applied to office and service processes."
    examples: [process mapping, lean office, bottleneck analysis, standard operating procedures]
    status: live
  - id: okr-planning
    name: OKR and Goal Planning
    kind: craft
    scope: "Setting and cascading organisational goals: OKRs, KPIs and planning cycles that link strategy to team-level commitments and reviews."
    examples: [objective writing, key-result design, quarterly planning cadence, scoring and retrospectives]
    status: live
  - id: meeting-facilitation
    name: Meeting and Workshop Facilitation
    kind: craft
    scope: "Designing and running effective business meetings and workshops: agendas, decision protocols, minutes and follow-through."
    examples: [agenda design, decision frameworks, workshop facilitation, action tracking]
    status: live
