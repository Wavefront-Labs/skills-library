category: business-finance
field: property-management
products:
  - id: residential-property-management
    name: Residential Property Management
    kind: craft
    scope: "Managing tenanted homes for owners: lettings administration, tenant screening and relations, rent collection, inspections and coordinating repairs."
    examples: [tenant screening, rent collection, inspections, repair coordination]
    status: live
  - id: commercial-property-management
    name: Commercial Property Management
    kind: craft
    scope: "Managing commercial buildings for owners: occupier relations, service-charge budgets, facilities coordination and asset-plan delivery."
    examples: [occupier relations, service-charge budgets, facilities coordination, asset plans]
    status: live
  - id: lease-administration
    name: Lease Administration
    kind: craft
    scope: "Administering leases over their life: critical dates, rent reviews and escalations, renewals and break options, lease abstracts and compliance with terms."
    examples: [critical-date tracking, rent reviews, renewals and breaks, lease abstracts]
    status: live
  - id: hoa-strata-management
    name: HOA and Strata Management
    kind: craft
    scope: "Managing owner associations: levies and budgets, committee and AGM administration, bylaw enforcement and common-property upkeep coordination."
    examples: [levy budgeting, AGM administration, bylaw enforcement, common-property upkeep]
    status: live
  - id: rent-and-service-charge-administration
    name: Rent and Service-Charge Administration
    kind: craft
    scope: "The money ledger of managed property: rent demands and arrears, service-charge accounting and reconciliation, deposits and owner statements."
    examples: [arrears management, service-charge reconciliation, deposit handling, owner statements]
    status: live
  - id: property-management-software
    name: Property Management Software
    kind: application
    scope: "Working in property-management platforms (Yardi, AppFolio, Buildium as a class): tenancy records, rent ledgers, maintenance tickets and owner reporting."
    examples: [tenancy setup, rent-ledger management, maintenance ticketing, owner reports]
    status: live
