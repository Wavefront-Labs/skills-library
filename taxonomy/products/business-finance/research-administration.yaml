category: business-finance
field: research-administration
products:
  - id: pre-award-administration
    name: Pre-Award Administration
    kind: craft
    scope: "The administrative side of winning research funding: funding-opportunity management, proposal budgets, institutional approvals and submission logistics."
    examples: [proposal budgeting, institutional sign-off, submission logistics, sponsor requirements]
    status: live
  - id: post-award-administration
    name: Post-Award Administration
    kind: craft
    scope: "Administering awarded grants: account setup, spending and effort monitoring, sponsor reporting, no-cost extensions and closeout."
    examples: [award setup, effort certification, sponsor financial reports, grant closeout]
    status: live
  - id: research-contracting
    name: Research Contracting
    kind: craft
    scope: "Negotiating and administering research agreements: sponsored-research contracts, subawards, material-transfer and data-use agreements from the administration side."
    examples: [sponsored-research agreements, subaward administration, MTAs, data-use agreements]
    status: live
  - id: research-budget-management
    name: Research Budget Management
    kind: craft
    scope: "Managing a research program's money: budget construction, cost allocation and allowability, indirect-cost recovery and forecasting across awards."
    examples: [budget construction, cost allowability, indirect-cost recovery, multi-award forecasting]
    status: live
  - id: lab-operations-management
    name: Lab Operations Management
    kind: craft
    scope: "Running a research group's operations: equipment and space administration, ordering and inventory, personnel logistics and operational compliance paperwork."
    examples: [equipment administration, lab purchasing, space management, operational compliance records]
    status: live
