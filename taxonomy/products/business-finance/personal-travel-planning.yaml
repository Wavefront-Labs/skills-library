category: business-finance
field: personal-travel-planning
products:
  - id: itinerary-planning
    name: Itinerary Planning
    kind: craft
    scope: "Designing one's own trips: destination research, route and day planning, pacing, and balancing must-sees against time and energy."
    examples: [destination research, route planning, day-by-day pacing, multi-city sequencing]
    status: live
  - id: travel-budgeting
    name: Travel Budgeting
    kind: craft
    scope: "Costing and funding a trip: budget construction, cost trade-offs, currency and payment planning, tracking spend while travelling."
    examples: [trip budget construction, cost trade-offs, currency planning, on-trip spend tracking]
    status: live
  - id: booking-logistics
    name: Booking Logistics
    kind: craft
    scope: "Securing the trip's components: flight and fare search, accommodation selection, ground transport, timing bookings and managing changes and cancellations."
    examples: [fare search, accommodation selection, booking timing, change and cancellation handling]
    status: live
  - id: points-and-miles
    name: Points and Miles
    kind: craft
    scope: "Travelling on loyalty currency: earning strategies, transfer partners, award search and redemption value, elite status decisions."
    examples: [earning strategies, transfer partners, award searches, redemption valuation]
    status: live
  - id: travel-risk-and-contingency
    name: Travel Risk and Contingency
    kind: craft
    scope: "Keeping one's own trip safe and recoverable: entry and visa requirements, health and safety research, travel insurance choices and contingency plans."
    examples: [visa and entry requirements, safety research, travel insurance selection, contingency planning]
    status: live
