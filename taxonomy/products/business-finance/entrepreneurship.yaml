category: business-finance
field: entrepreneurship
products:
  - id: startup-founding
    name: Startup Founding
    kind: craft
    scope: "Taking a venture from idea to operating company: incorporation choices, co-founder arrangements, early hiring and the founder's operating rhythm."
    examples: [founding-team formation, equity splits, early hiring, founder operating cadence]
    status: live
  - id: business-model-design
    name: Business Model Design
    kind: craft
    scope: "Designing how a venture creates and captures value: value propositions, revenue models, unit economics and business-model iteration."
    examples: [business model canvas, revenue-model choice, unit economics, pricing structure]
    status: live
  - id: lean-validation
    name: Lean Validation
    kind: craft
    scope: "Testing a venture's assumptions cheaply before building: customer discovery interviews, MVP experiments and pivot-or-persevere decisions."
    examples: [customer discovery, MVP design, experiment metrics, pivot decisions]
    status: live
  - id: venture-fundraising
    name: Venture Fundraising
    kind: craft
    scope: "Raising capital for a venture: pitch narratives and decks, investor targeting, round mechanics, term sheets and cap-table management from the founder's side."
    examples: [pitch decks, investor targeting, term-sheet negotiation, cap-table management]
    status: live
  - id: small-business-ownership
    name: Small-Business Ownership
    kind: craft
    scope: "Owning and running a small business or bootstrapped venture: cash-flow discipline, pricing, licensing and the generalist owner-operator role."
    examples: [bootstrapping, owner cash-flow management, small-business pricing, buying or selling a small business]
    status: live
