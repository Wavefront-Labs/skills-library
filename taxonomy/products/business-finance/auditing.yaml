category: business-finance
field: auditing
products:
  - id: financial-statement-audit
    name: Financial Statement Audit
    kind: craft
    scope: "External audit of financial statements: planning and materiality, risk assessment, substantive testing, sampling and forming the audit opinion."
    examples: [audit planning, materiality, substantive testing, audit opinions]
    status: live
  - id: internal-audit
    name: Internal Audit
    kind: craft
    scope: "An organisation's own assurance function: risk-based audit planning, operational and process audits, findings and follow-up with management."
    examples: [risk-based audit plans, process audits, audit findings, management follow-up]
    status: live
  - id: internal-controls-testing
    name: Internal Controls Testing
    kind: craft
    scope: "Evaluating and testing internal controls: control design assessment, walkthroughs, SOX/ICFR testing and deficiency evaluation."
    examples: [control walkthroughs, SOX testing, design vs operating effectiveness, deficiency evaluation]
    status: live
  - id: forensic-accounting
    name: Forensic Accounting
    kind: craft
    scope: "Investigating financial irregularities: fraud examination, tracing funds, quantifying losses and documenting findings for dispute or claim purposes."
    examples: [fraud examination, funds tracing, loss quantification, investigative interviews]
    status: live
  - id: audit-analytics
    name: Audit Data Analytics
    kind: craft
    scope: "Using data analysis in audit work: full-population testing, journal-entry analytics, anomaly detection and CAATs."
    examples: [journal-entry testing, full-population analytics, anomaly detection, CAATs]
    status: live
