category: business-finance
field: corporate-finance
products:
  - id: financial-modelling
    name: Financial Modelling
    kind: craft
    scope: "Building financial models: three-statement models, DCF and scenario models, model architecture, assumptions design and sanity checks."
    examples: [three-statement models, DCF models, scenario and sensitivity analysis, model review]
    status: live
  - id: fpa
    name: Financial Planning & Analysis
    kind: craft
    scope: "The FP&A function: budgets, rolling forecasts, variance commentary, management reporting and business partnering."
    examples: [annual budgeting, rolling forecasts, variance commentary, management reporting packs]
    status: live
  - id: capital-budgeting
    name: Capital Budgeting
    kind: craft
    scope: "Appraising and allocating capital to investments: NPV/IRR appraisal, hurdle rates, capital allocation and post-investment review."
    examples: [NPV/IRR appraisal, hurdle rates, capital allocation, post-investment review]
    status: live
  - id: treasury-management
    name: Treasury Management
    kind: craft
    scope: "Managing an organisation's cash and funding: cash-flow forecasting, liquidity, debt facilities, FX and interest-rate hedging."
    examples: [cash forecasting, liquidity management, debt facilities, FX hedging]
    status: live
  - id: mergers-acquisitions
    name: Mergers & Acquisitions
    kind: craft
    scope: "Buying and selling companies from the corporate side: deal sourcing and screening, due diligence, deal structuring, synergy cases and integration planning."
    examples: [target screening, due diligence, deal structuring, post-merger integration planning]
    status: live
  - id: investor-relations
    name: Investor Relations
    kind: craft
    scope: "Managing the company's relationship with its investors: earnings materials, guidance, analyst and shareholder engagement, disclosure discipline."
    examples: [earnings calls, guidance setting, analyst engagement, shareholder communications]
    status: live
  - id: excel
    name: Microsoft Excel
    kind: application
    scope: "Excel as the finance professional's core tool: formulas and functions, model layout, pivot tables, Power Query and spreadsheet auditing."
    examples: [lookup and dynamic-array formulas, pivot tables, Power Query, spreadsheet auditing]
    status: live
