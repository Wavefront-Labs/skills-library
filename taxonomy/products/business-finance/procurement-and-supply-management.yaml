category: business-finance
field: procurement-and-supply-management
products:
  - id: strategic-sourcing
    name: Strategic Sourcing
    kind: craft
    scope: "Deciding how and where to buy: spend analysis, make-or-buy, supplier market analysis, RFx design and sourcing events."
    examples: [spend analysis, make-or-buy decisions, RFP design, sourcing events]
    status: live
  - id: category-management
    name: Category Management
    kind: craft
    scope: "Managing a spend category over time: category strategy, demand management, supplier landscape and total-cost-of-ownership thinking."
    examples: [category strategy, demand management, TCO analysis, category reviews]
    status: live
  - id: contract-negotiation
    name: Purchasing Contract Negotiation
    kind: craft
    scope: "Negotiating purchase agreements: pricing and payment terms, SLAs, risk allocation and negotiation strategy from the buyer's side."
    examples: [pricing negotiation, SLA terms, risk allocation, negotiation planning]
    status: live
  - id: supplier-management
    name: Supplier Relationship Management
    kind: craft
    scope: "Managing suppliers after the deal: performance scorecards, reviews, supplier development, risk monitoring and escalation."
    examples: [supplier scorecards, performance reviews, supplier development, supply-risk monitoring]
    status: live
  - id: purchasing-operations
    name: Purchasing Operations
    kind: craft
    scope: "The transactional buying cycle: requisitions and purchase orders, approvals, goods receipt, invoice matching and procure-to-pay hygiene."
    examples: [purchase orders, approval workflows, three-way matching, procure-to-pay process]
    status: live
  - id: eprocurement-platforms
    name: e-Procurement Platforms
    kind: application
    scope: "Working in procurement suites (SAP Ariba, Coupa, Jaggaer as a class): catalogues, sourcing events, workflow configuration and supplier onboarding in-platform."
    examples: [catalogue management, running e-sourcing events, approval workflow setup, supplier onboarding]
    status: live
