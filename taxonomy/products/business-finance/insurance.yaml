category: business-finance
field: insurance
products:
  - id: underwriting
    name: Underwriting
    kind: craft
    scope: "Assessing and accepting insurance risk: risk appraisal, terms and exclusions, pricing judgement within guidelines and portfolio appetite."
    examples: [risk appraisal, terms and exclusions, referral decisions, underwriting guidelines]
    status: live
  - id: claims-adjusting
    name: Claims Adjusting
    kind: craft
    scope: "Handling insurance claims: coverage determination, loss investigation and quantification, reserves, settlement and negotiation."
    examples: [coverage determination, loss quantification, reserving, claim settlement]
    status: live
  - id: actuarial-pricing
    name: Actuarial Pricing and Reserving
    kind: craft
    scope: "Pricing insurance products and setting reserves: rate-making, loss triangles and reserving methods, experience analysis and capital considerations."
    examples: [rate-making, loss triangles, reserving methods, experience studies]
    status: live
  - id: insurance-product-design
    name: Insurance Product Design
    kind: craft
    scope: "Designing insurance products: coverage structure, policy wording intent, distribution fit and product-line profitability."
    examples: [coverage design, policy structure, product profitability, distribution fit]
    status: live
  - id: reinsurance
    name: Reinsurance
    kind: craft
    scope: "Insuring insurers: treaty and facultative structures, cessions and retentions, reinsurance programme design and placement."
    examples: [treaty structures, retention setting, programme design, facultative placement]
    status: live
  - id: claims-fraud-investigation
    name: Claims Fraud Investigation
    kind: craft
    scope: "An insurer's own special-investigation work on suspect claims: red-flag detection, claim-file investigation and referral decisions."
    examples: [fraud red flags, claim-file investigation, SIU casework, referral decisions]
    status: live
