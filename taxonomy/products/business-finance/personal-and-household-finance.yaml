category: business-finance
field: personal-and-household-finance
products:
  - id: household-budgeting
    name: Household Budgeting
    kind: craft
    scope: "Running a household budget: income and expense tracking, envelope and zero-based methods, savings targets and budget review habits."
    examples: [expense tracking, zero-based budgeting, savings rate targets, budget reviews]
    status: live
  - id: personal-financial-planning
    name: Personal Financial Planning
    kind: craft
    scope: "Planning one's financial life: goals and net-worth planning, emergency funds, insurance needs, retirement planning and major-purchase decisions."
    examples: [net-worth planning, emergency funds, retirement planning, major-purchase decisions]
    status: live
  - id: personal-debt-management
    name: Personal Debt Management
    kind: craft
    scope: "Managing and reducing personal debt: repayment strategies, consolidation and refinancing, credit-score management and negotiating with creditors."
    examples: [snowball vs avalanche repayment, refinancing, credit-score management, creditor negotiation]
    status: live
  - id: inheritance-and-estate-allocation
    name: Inheritance and Estate Allocation
    kind: craft
    scope: "Allocating wealth across generations: estate and inheritance planning decisions, beneficiary choices, gifting strategy and administering a household's estate affairs."
    examples: [inheritance planning, beneficiary decisions, gifting strategy, estate administration tasks]
    status: live
  - id: consumer-purchasing
    name: Consumer Purchasing
    kind: craft
    scope: "Buying well as a consumer: researching and comparing purchases, haggling and negotiation as a buyer, timing deals and avoiding purchase traps."
    examples: [comparison research, haggling as a buyer, deal timing, warranty and return decisions]
    status: live
