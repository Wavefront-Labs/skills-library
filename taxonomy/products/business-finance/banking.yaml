category: business-finance
field: banking
products:
  - id: retail-banking
    name: Retail Banking
    kind: craft
    scope: "Serving personal and small-business customers in a bank: accounts and deposits, consumer lending, branch operations and customer onboarding."
    examples: [deposit products, consumer lending, branch operations, customer onboarding]
    status: live
  - id: commercial-lending
    name: Commercial Lending
    kind: craft
    scope: "Lending to businesses: loan structuring, covenants, security and collateral, pricing and the credit approval process."
    examples: [loan structuring, covenant design, collateral assessment, credit approval]
    status: live
  - id: credit-analysis
    name: Credit Analysis
    kind: craft
    scope: "Assessing a borrower's creditworthiness: financial-statement spreading, cash-flow and repayment analysis, ratings and credit memos."
    examples: [statement spreading, repayment capacity analysis, risk rating, credit memos]
    status: live
  - id: investment-banking
    name: Investment Banking
    kind: craft
    scope: "Advisory and capital-markets work: sell-side and buy-side M&A advisory, equity and debt issuance, pitchbooks and deal execution."
    examples: [M&A advisory, equity issuance, pitchbooks, deal execution]
    status: live
  - id: payments-operations
    name: Payments and Banking Operations
    kind: craft
    scope: "The operational machinery of banking: payment schemes and settlement, clearing, reconciliations, SWIFT messaging and exception handling."
    examples: [payment schemes, settlement and clearing, SWIFT messaging, exception handling]
    status: live
  - id: microfinance-informal
    name: Microfinance and Informal Finance
    kind: craft
    scope: "Lending and savings outside mainstream banking: microcredit methodology, group lending, ROSCAs and village savings-and-loan models."
    examples: [group lending, microcredit appraisal, ROSCA operation, village savings and loans]
    status: live
