category: business-finance
field: product-management
products:
  - id: product-strategy
    name: Product Strategy
    kind: craft
    scope: "Setting a product's direction: vision and positioning, product-market fit assessment, pricing input and build-vs-buy framing at product level."
    examples: [product vision, product-market fit analysis, positioning, strategic bets]
    status: live
  - id: product-discovery
    name: Product Discovery
    kind: craft
    scope: "Finding what to build: customer interviews, problem framing, opportunity assessment and validating demand before committing the roadmap."
    examples: [customer interviews, problem framing, opportunity solution trees, demand validation]
    status: live
  - id: roadmapping-and-prioritisation
    name: Roadmapping and Prioritisation
    kind: craft
    scope: "Deciding what to build when: roadmap construction, prioritisation frameworks, stakeholder trade-offs and saying no well."
    examples: [roadmap construction, RICE/weighted scoring, stakeholder trade-offs, scope negotiation]
    status: live
  - id: requirements-writing
    name: Requirements Writing
    kind: craft
    scope: "Specifying what the product should do, short of technical design: PRDs, user stories and acceptance criteria, edge-case thinking and handoff to delivery."
    examples: [PRDs, user stories, acceptance criteria, scope definition]
    status: live
  - id: product-analytics
    name: Product Analytics
    kind: craft
    scope: "Measuring the product: metric trees and north-star metrics, funnel and retention analysis, A/B test interpretation for product decisions."
    examples: [north-star metrics, funnel analysis, retention cohorts, experiment interpretation]
    status: live
  - id: go-to-market-coordination
    name: Go-to-Market Coordination
    kind: craft
    scope: "Coordinating a launch across functions: launch planning, readiness checklists, internal enablement and post-launch review from the product seat."
    examples: [launch plans, readiness checklists, cross-functional coordination, post-launch reviews]
    status: live
