category: business-finance
field: accounting
products:
  - id: double-entry-bookkeeping
    name: Double-Entry Bookkeeping
    kind: craft
    scope: "Recording transactions in a double-entry ledger: journals, chart of accounts, reconciliations, accruals and the month-end close."
    examples: [journal entries, bank reconciliation, accruals and prepayments, month-end close]
    status: live
  - id: financial-reporting
    name: Financial Accounting and Reporting
    kind: craft
    scope: "Preparing financial statements under GAAP/IFRS: recognition and measurement, consolidation, disclosures and statutory reporting."
    examples: [statement preparation, revenue recognition, consolidation, disclosure notes]
    status: live
  - id: management-accounting
    name: Management Accounting
    kind: craft
    scope: "Accounting for internal decisions: cost accounting, budgeting, variance analysis, product and customer profitability."
    examples: [standard costing, budgeting and forecasting, variance analysis, activity-based costing]
    status: live
  - id: tax-accounting
    name: Tax Accounting
    kind: craft
    scope: "Computing and provisioning an organisation's taxes: corporate tax computation, VAT/GST and sales tax, deferred tax and tax-return preparation."
    examples: [corporate tax computation, VAT/GST returns, deferred tax, tax provisioning]
    status: live
  - id: payroll-administration
    name: Payroll Administration
    kind: craft
    scope: "Running payroll: gross-to-net calculation, withholdings and statutory deductions, payroll cycles, year-end filings and payroll compliance."
    examples: [gross-to-net calculation, statutory deductions, payroll cycles, year-end filings]
    status: live
  - id: carbon-accounting
    name: Carbon Accounting
    kind: craft
    scope: "Measuring and reporting an organisation's greenhouse-gas footprint: GHG Protocol scopes, emission factors, inventories and sustainability disclosures."
    examples: [scope 1-3 inventories, emission factors, GHG Protocol reporting, CSRD/ESG disclosures]
    status: live
  - id: quickbooks-xero
    name: QuickBooks / Xero
    kind: application
    scope: "Small-business accounting on QuickBooks and Xero: company setup, bank feeds, invoicing, reconciliation and reporting in the dominant SMB packages."
    examples: [chart-of-accounts setup, bank feeds and rules, invoicing, reconciliation workflows]
    status: live
  - id: erp-systems
    name: ERP Systems
    kind: application
    scope: "Working in enterprise resource planning finance suites (SAP, Oracle, NetSuite, Dynamics as a class): GL configuration, posting flows, period close and reporting modules."
    examples: [GL configuration, posting and document flows, period-end close in ERP, ERP financial reporting]
    status: live
