category: business-finance
field: real-estate-finance
products:
  - id: acquisition-underwriting
    name: Real Estate Acquisition Underwriting
    kind: craft
    scope: "Underwriting property acquisitions: rent rolls and operating statements, cap rates, cash-flow projections and deal-level returns."
    examples: [rent-roll analysis, cap-rate analysis, pro-forma cash flows, IRR and equity-multiple returns]
    status: live
  - id: commercial-mortgage-underwriting
    name: Commercial Mortgage Underwriting
    kind: craft
    scope: "Underwriting debt against real estate: LTV and DSCR analysis, loan sizing and structure, covenants and lender due diligence."
    examples: [DSCR analysis, loan sizing, covenant structure, lender due diligence]
    status: live
  - id: development-finance
    name: Development Finance
    kind: craft
    scope: "Financing property development: development appraisals, residual land value, construction facilities, drawdowns and exit strategies."
    examples: [development appraisals, residual land value, construction loan drawdowns, exit strategy]
    status: live
  - id: portfolio-and-reit-management
    name: Portfolio and REIT Management
    kind: craft
    scope: "Managing real estate as a financial portfolio: fund and REIT structures, portfolio strategy, asset-level hold/sell decisions and investor reporting."
    examples: [portfolio strategy, hold/sell analysis, REIT metrics, fund investor reporting]
    status: live
  - id: argus
    name: ARGUS Enterprise
    kind: application
    scope: "Commercial property cash-flow modelling in ARGUS: lease-by-lease modelling, market assumptions, valuation runs and scenario outputs."
    examples: [lease-by-lease modelling, market leasing assumptions, valuation runs, scenario comparison]
    status: live
