category: business-finance
field: risk-management
products:
  - id: enterprise-risk-management
    name: Enterprise Risk Management
    kind: craft
    scope: "Organisation-wide risk practice: risk identification and registers, appetite and tolerance setting, heat maps, risk reporting and governance."
    examples: [risk registers, risk appetite statements, heat maps, board risk reporting]
    status: live
  - id: financial-risk-modelling
    name: Financial Risk Modelling
    kind: craft
    scope: "Quantifying financial risk for a specific book or portfolio: market-risk measures (VaR), stress testing, scenario analysis and model validation."
    examples: [value-at-risk, stress testing, scenario analysis, model validation]
    status: live
  - id: credit-risk-management
    name: Credit Risk Management
    kind: craft
    scope: "Managing credit risk at portfolio level: PD/LGD/EAD frameworks, exposure limits, concentration monitoring, provisioning and early-warning systems."
    examples: [PD/LGD/EAD frameworks, exposure limits, provisioning, watch-list management]
    status: live
  - id: operational-risk-management
    name: Operational Risk Management
    kind: craft
    scope: "Managing risk from processes, people and systems: risk and control self-assessments, loss-event data, key risk indicators and remediation tracking."
    examples: [RCSAs, loss-event analysis, key risk indicators, remediation tracking]
    status: live
  - id: business-continuity-planning
    name: Business Continuity Planning
    kind: craft
    scope: "Keeping the organisation running through disruption: business impact analysis, continuity and recovery plans, crisis exercises and resilience testing."
    examples: [business impact analysis, continuity plans, crisis exercises, recovery objectives]
    status: live
