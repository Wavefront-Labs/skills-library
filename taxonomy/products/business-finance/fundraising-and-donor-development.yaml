category: business-finance
field: fundraising-and-donor-development
products:
  - id: major-gift-fundraising
    name: Major-Gift Fundraising
    kind: craft
    scope: "Cultivating and soliciting large gifts: prospect research, cultivation plans, the ask, and long-term donor stewardship."
    examples: [prospect research, cultivation plans, solicitation meetings, donor stewardship]
    status: live
  - id: grant-writing
    name: Grant Writing
    kind: craft
    scope: "Winning programme and project grants: funder research, proposal narratives, programme budgets and funder reporting (not research grants)."
    examples: [funder research, proposal narratives, programme budgets, funder reports]
    status: live
  - id: annual-and-digital-giving
    name: Annual and Digital Giving
    kind: craft
    scope: "Broad-base fundraising: annual appeals, direct mail and email campaigns, online giving, membership and donor-retention programmes."
    examples: [annual appeals, email campaigns, online giving pages, donor retention]
    status: live
  - id: capital-campaigns
    name: Capital Campaigns
    kind: craft
    scope: "Running large multi-year campaigns: feasibility studies, campaign structure and phases, gift tables, volunteer leadership and pledge management."
    examples: [feasibility studies, gift tables, campaign phases, pledge management]
    status: live
  - id: sponsorship-solicitation
    name: Sponsorship Solicitation
    kind: craft
    scope: "Securing sponsorships and naming gifts for the organisation: sponsor prospecting, packages and benefits design, solicitation and fulfilment stewardship."
    examples: [sponsor prospecting, package design, naming-rights solicitation, benefit fulfilment]
    status: live
  - id: donor-crm-systems
    name: Donor CRM Systems
    kind: application
    scope: "Working in donor databases (Raiser's Edge, Salesforce Nonprofit, DonorPerfect as a class): donor records, gift entry, segmentation, moves management and fundraising reports."
    examples: [gift entry, donor segmentation, moves-management tracking, fundraising reports]
    status: live
