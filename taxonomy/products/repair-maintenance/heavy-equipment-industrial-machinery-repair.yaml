category: repair-maintenance
field: heavy-equipment-industrial-machinery-repair
products:
  - id: oem-diagnostic-software
    name: OEM Diagnostic Software
    kind: application
    scope: "Diagnosing heavy equipment with manufacturer diagnostic systems such as Cat ET, Cummins INSITE and John Deere Service ADVISOR."
    examples: [fault code diagnosis, parameter configuration, injector cutout tests, software flashing]
    status: live
  - id: diesel-engine-repair
    name: Diesel Engine Repair
    kind: craft
    scope: "Diagnosing, repairing and overhauling heavy-duty diesel engines: fuel systems, turbochargers, emissions systems and in-frame rebuilds."
    examples: [injector and fuel system service, turbo replacement, DPF/SCR emissions repair, in-frame overhaul]
    status: live
  - id: hydraulic-systems-repair
    name: Hydraulic Systems Repair
    kind: craft
    scope: "Diagnosing and repairing hydraulic systems on mobile and fixed plant: pumps, valves, cylinders, hoses and contamination control."
    examples: [pressure and flow testing, cylinder resealing, pump and valve replacement, hose fabrication]
    status: live
  - id: undercarriage-track-service
    name: Undercarriage and Track Service
    kind: craft
    scope: "Inspecting, measuring and replacing undercarriage and track components on tracked equipment."
    examples: [undercarriage wear measurement, track chain replacement, roller and idler service, track tensioning]
    status: live
  - id: mobile-equipment-electrical
    name: Mobile Equipment Electrical
    kind: craft
    scope: "Diagnosing and repairing electrical and electronic systems on heavy mobile equipment: 12/24V systems, ECMs, sensors and machine networks."
    examples: [24V charging diagnosis, sensor and harness repair, ECM troubleshooting, J1939 network diagnosis]
    status: live
  - id: millwrighting-machinery-installation
    name: Millwrighting and Machinery Installation
    kind: craft
    scope: "Installing, levelling, aligning and overhauling fixed industrial machinery: precision alignment, couplings, gearboxes and conveyors."
    examples: [laser shaft alignment, gearbox overhaul, conveyor maintenance, machinery levelling]
    status: live
  - id: bearing-lubrication-maintenance
    name: Bearing and Lubrication Maintenance
    kind: craft
    scope: "Selecting, fitting and maintaining bearings and lubrication programmes on industrial machinery."
    examples: [bearing fitting and removal, grease and oil selection, lubrication routes, bearing failure reading]
    status: live
  - id: field-welding-repair
    name: Field Welding Repair
    kind: craft
    scope: "Repair welding on equipment and machinery: crack repair, build-up and hardfacing, bucket and attachment repair in shop or field."
    examples: [crack gouging and repair, hardfacing wear parts, bucket lip rebuilds, line boring prep]
    status: live
  - id: agricultural-equipment-repair
    name: Agricultural Equipment Repair
    kind: craft
    scope: "Maintaining and repairing tractors, combines and implements: harvest-season readiness, PTO drivelines, headers and precision-ag hardware."
    examples: [combine pre-harvest service, PTO and driveline repair, header and sickle service, planter maintenance]
    status: live
  - id: preventive-maintenance-inspection
    name: Preventive Maintenance and Inspection
    kind: craft
    scope: "Running scheduled PM services and condition inspections on heavy equipment fleets to catch failures before downtime."
    examples: [PM service intervals, fluid sampling, structural crack inspection, pre-delivery inspection]
    status: live
