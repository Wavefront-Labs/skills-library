category: repair-maintenance
field: clothing-alterations-repair
products:
  - id: hemming-resizing
    name: Hemming and Resizing
    kind: craft
    scope: "Everyday garment alterations: hems on trousers, skirts and dresses, taking in and letting out seams, sleeve and waist adjustments."
    examples: [blind and original hems, taking in side seams, waistband adjustment, sleeve shortening]
    status: live
  - id: tailoring-alterations
    name: Tailoring Alterations
    kind: craft
    scope: "Structural alterations to tailored garments: jackets and suits, shoulder and collar work, recutting through canvas and lining."
    examples: [jacket sleeve and body work, shoulder adjustment, trouser recutting, relining a jacket]
    status: live
  - id: bridal-formalwear-alterations
    name: Bridal and Formalwear Alterations
    kind: craft
    scope: "Fitting wedding and formal gowns: bodice fitting, bustles, hemming layered and beaded fabrics, boning and cup adjustments."
    examples: [bustle design and fitting, layered hem work, beaded fabric handling, bodice take-in]
    status: live
  - id: mending-darning
    name: Mending and Darning
    kind: craft
    scope: "Repairing damaged garments and knitwear: patching, darning, invisible mending, seam and tear repair."
    examples: [darning knitwear, patching worn areas, invisible mending, visible mending styles]
    status: live
  - id: zipper-fastener-replacement
    name: Zipper and Fastener Replacement
    kind: craft
    scope: "Replacing and repairing closures: zippers in jeans, jackets and dresses, buttons, hooks, snaps and waist fasteners."
    examples: [jeans fly zipper swap, invisible zipper replacement, jacket separating zippers, button and snap repair]
    status: live
  - id: leather-garment-repair
    name: Leather and Outdoor Garment Repair
    kind: craft
    scope: "Repairing leather garments and technical outdoor wear: panel repair, seam resealing, waterproof patching and hardware."
    examples: [leather panel repair, seam tape resealing, down jacket patching, buckle and hardware swaps]
    status: live
  - id: garment-upcycling
    name: Garment Upcycling
    kind: craft
    scope: "Reworking existing garments into updated pieces: restyling, resizing between forms, combining garments and modernising cuts."
    examples: [restyling dated garments, jeans-to-skirt conversions, cropping and reshaping, fabric reuse planning]
    status: live
