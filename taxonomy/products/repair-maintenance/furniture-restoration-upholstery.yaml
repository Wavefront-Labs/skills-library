category: repair-maintenance
field: furniture-restoration-upholstery
products:
  - id: furniture-refinishing
    name: Furniture Refinishing
    kind: craft
    scope: "Stripping, preparing and refinishing furniture surfaces: stain, varnish, lacquer and oil finishes and colour matching."
    examples: [stripping old finishes, stain colour matching, spray lacquer finishing, surface prep]
    status: live
  - id: french-polishing
    name: French Polishing
    kind: craft
    scope: "Traditional shellac finishing and its repair: building a polish with the rubber, reviving and repairing old shellac surfaces."
    examples: [bodying up with the rubber, reviving dull polish, spiriting off, repairing rings and marks]
    status: live
  - id: frame-joint-repair
    name: Frame and Joint Repair
    kind: craft
    scope: "Repairing loose and broken furniture frames: regluing joints, replacing broken parts, dowel and tenon repairs and chair rebuilds."
    examples: [regluing loose chairs, broken leg repair, dowel and tenon replacement, hide glue work]
    status: live
  - id: veneer-repair
    name: Veneer and Surface Repair
    kind: craft
    scope: "Repairing veneered and marquetry surfaces: patching lifted or missing veneer, blisters, inlay repair and burn-in touch-ups."
    examples: [veneer patching, blister relaying, inlay replacement, burn-in filler touch-up]
    status: live
  - id: reupholstery
    name: Reupholstery
    kind: craft
    scope: "Reupholstering furniture: stripping to frame, webbing and springs, padding, cutting and fitting new covers."
    examples: [traditional spring tying, modern foam build-up, cover cutting and fitting, piping and finishing]
    status: live
  - id: caning-rush-seating
    name: Caning and Rush Seating
    kind: craft
    scope: "Re-weaving traditional seat materials: hand caning, pre-woven cane, rush, Danish cord and splint seats."
    examples: [hand caning patterns, pressed cane replacement, rush seat weaving, Danish cord seats]
    status: live
  - id: leather-furniture-repair
    name: Leather Furniture Repair
    kind: craft
    scope: "Repairing and restoring leather upholstery: cleaning, recolouring, tear and scratch repair and conditioning."
    examples: [leather recolouring, tear and scratch repair, cat-scratch rescue, cleaning and conditioning]
    status: live
