    name: Laundering
    kind: craft
    scope: "Washing and drying clothing and household textiles properly: sorting, care labels, temperatures, detergents and fabric-safe drying."
    examples: [sorting and care label reading, detergent and temperature choice, delicates handling, drying without damage]
    status: live
  - id: stain-treatment
    name: Stain Treatment
    kind: craft
    scope: "Identifying and removing stains from textiles: stain chemistry, pre-treatment, solvent and enzyme choices and what never to do."
    examples: [stain identification, pre-treatment technique, tannin vs protein vs oil stains, set-stain rescue]
    status: live
  - id: dry-cleaning
    name: Dry Cleaning
    kind: craft
    scope: "Professional solvent cleaning of garments: solvent systems, garment inspection and classification, spotting and finishing in a plant workflow."
    examples: [garment classification, solvent cleaning cycles, professional spotting, pressing and finishing]
    status: live
  - id: ironing-pressing
    name: Ironing and Pressing
    kind: craft
    scope: "Ironing, pressing and steaming garments: temperature by fibre, pressing technique for shirts, trousers and tailoring, and steam finishing."
    examples: [shirt pressing sequence, trouser creasing, steaming knits and delicates, press cloth use]
    status: live
  - id: commercial-laundry-operations
    name: Commercial Laundry Operations
    kind: craft
    scope: "Running high-volume laundry: washer-extractors and tunnel systems, wash chemistry programmes, linen flows and quality control."
    examples: [wash programme design, linen flow management, flatwork ironing, rewash and quality control]
    status: live
  - id: leather-suede-care
    name: Leather and Suede Care
    kind: craft
    scope: "Cleaning and caring for leather, suede and fur garments: specialist cleaning, conditioning, recolouring and storage."
    examples: [suede cleaning and refinishing, leather conditioning, salt stain removal, fur and specialty storage]
    status: live
  - id: garment-preservation-storage
    name: Garment Preservation and Storage
    kind: craft
    scope: "Preserving special garments and textiles: wedding gown cleaning and boxing, seasonal storage, moth prevention and archival materials."
