category: repair-maintenance
field: automotive-repair
products:
  - id: obd-scan-tools
    name: OBD Scan Tools
    kind: application
    scope: "Diagnosing vehicles with OBD-II/EOBD scan tools and code readers: reading and interpreting DTCs, live data, freeze frames and bidirectional tests."
    examples: [DTC interpretation, live data analysis, bidirectional actuator tests, readiness monitors]
    status: live
  - id: service-information-systems
    name: Service Information Systems
    kind: application
    scope: "Working from OEM and aftermarket service information systems (ALLDATA, Mitchell 1, OEM portals): wiring diagrams, labour times, TSBs and repair procedures."
    examples: [wiring diagram lookup, TSB research, torque specs, labour-time estimating]
    status: live
  - id: ecu-tuning-software
    name: ECU Tuning Software
    kind: application
    scope: "Reading, modifying and flashing engine and transmission control maps with tuning platforms such as HP Tuners and ECUFlash."
    examples: [map editing, datalogging, flash tuning, safe tune validation]
    status: live
  - id: engine-repair
    name: Engine Repair
    kind: craft
    scope: "Diagnosing and repairing petrol and diesel engines in light vehicles: mechanical diagnosis, timing, head and gasket work, rebuilds."
    examples: [compression and leak-down testing, timing belt/chain replacement, head gasket repair, engine rebuilds]
    status: live
  - id: transmission-drivetrain-repair
    name: Transmission and Drivetrain Repair
    kind: craft
    scope: "Repairing manual and automatic transmissions, clutches, differentials, driveshafts and CV axles."
    examples: [clutch replacement, automatic transmission diagnosis, CV axle replacement, differential service]
    status: live
  - id: brake-systems
    name: Brake Systems
    kind: craft
    scope: "Servicing and repairing hydraulic and electronic brake systems: pads, rotors, hydraulics, ABS and parking brakes."
    examples: [pad and rotor replacement, brake bleeding, ABS diagnosis, electronic parking brake service]
    status: live
  - id: suspension-steering
    name: Suspension and Steering
    kind: craft
    scope: "Repairing suspension and steering systems and setting wheel alignment: struts, bushings, ball joints, racks and alignment geometry."
    examples: [strut replacement, ball joint and bushing work, steering rack replacement, four-wheel alignment]
    status: live
  - id: auto-electrical-diagnostics
    name: Auto Electrical Diagnostics
    kind: craft
    scope: "Finding and fixing electrical faults in vehicles: wiring, charging and starting systems, CAN bus networks, parasitic drains."
    examples: [voltage drop testing, parasitic drain hunting, CAN bus diagnosis, alternator and starter testing]
    status: live
  - id: automotive-hvac
    name: Automotive HVAC
    kind: craft
    scope: "Diagnosing and servicing vehicle heating, ventilation and air-conditioning: refrigerant handling, compressors, blend doors and climate control."
    examples: [refrigerant recovery and recharge, compressor replacement, leak detection, climate control diagnosis]
    status: live
  - id: wheel-tire-service
    name: Wheel and Tire Service
    kind: craft
    scope: "Mounting, balancing and repairing tires and wheels, including TPMS service and puncture repair."
    examples: [tire mounting and balancing, puncture repair, TPMS relearn, wheel damage assessment]
    status: live
  - id: scheduled-servicing
    name: Scheduled Servicing
    kind: craft
    scope: "Routine preventive maintenance of light vehicles: fluid and filter services, inspections and manufacturer service schedules."
    examples: [oil and filter service, multi-point inspection, fluid flushes, service schedule interpretation]
    status: live
  - id: auto-body-repair
    name: Auto Body Repair
    kind: craft
    scope: "Repairing collision and cosmetic damage to vehicle bodies: dent repair, panel replacement, filler work and refinishing."
    examples: [paintless dent repair, panel replacement, filler and sanding, spot refinishing]
    status: live
  - id: car-modding
    name: Car Modding
    kind: craft
    scope: "Modifying and upgrading vehicles beyond stock: performance upgrades, suspension and brake upgrades, aftermarket installs done safely and legally."
    examples: [intake and exhaust upgrades, coilover installs, big brake kits, aftermarket electronics installs]
    status: live
