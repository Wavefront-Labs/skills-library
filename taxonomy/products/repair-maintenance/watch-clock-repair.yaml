category: repair-maintenance
field: watch-clock-repair
products:
  - id: timegrapher
    name: Timegrapher
    kind: application
    scope: "Measuring and regulating mechanical movements with a timegrapher: reading rate, amplitude and beat error and diagnosing from the trace."
    examples: [rate and amplitude reading, beat error correction, positional timing, trace fault diagnosis]
    status: live
  - id: watchmakers-lathe
    name: Watchmaker's Lathe
    kind: application
    scope: "Turning small horological parts on a watchmaker's lathe: staffs, stems and bushings, graver technique and collet work."
    examples: [balance staff turning, stem fitting, bushing manufacture, graver sharpening]
    status: live
  - id: mechanical-watch-servicing
    name: Mechanical Watch Servicing
    kind: craft
    scope: "Full service of mechanical watch movements: disassembly, cleaning, lubrication, reassembly, regulation and water-resistance testing."
    examples: [movement strip and clean, lubrication points, mainspring replacement, pressure testing]
    status: live
  - id: quartz-watch-service
    name: Quartz Watch Service
    kind: craft
    scope: "Servicing quartz and electronic watches: battery replacement, circuit and coil testing, movement swaps and gasket care."
    examples: [battery replacement with reset, coil and circuit testing, movement replacement, crown and gasket service]
    status: live
  - id: clock-movement-repair
    name: Clock Movement Repair
    kind: craft
    scope: "Repairing mechanical clock movements: bushing worn pivot holes, mainsprings, escapements, striking and chiming trains."
    examples: [rebushing pivot holes, mainspring replacement, strike train timing, escapement adjustment]
    status: live
  - id: case-bracelet-refinishing
    name: Case and Bracelet Refinishing
    kind: craft
    scope: "Restoring watch cases, bracelets and crystals: polishing and brushing to original finish, crystal replacement and gasket sealing."
    examples: [case polishing and lapping, bracelet refinishing, crystal replacement, maintaining factory lines]
    status: live
  - id: horological-restoration
    name: Horological Restoration
    kind: craft
    scope: "Restoring vintage and antique timepieces sympathetically: sourcing or making obsolete parts, dial care and preserving originality."
    examples: [obsolete part sourcing and making, dial preservation decisions, vintage-correct refinishing, documentation of work]
    status: live
