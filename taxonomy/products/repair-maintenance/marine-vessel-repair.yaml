    examples: [gelcoat repair, blister and osmosis treatment, laminate structural repair, through-hull fitting replacement]
    status: live
  - id: marine-electrical-systems
    name: Marine Electrical Systems
    kind: craft
    scope: "Installing and repairing boat electrical systems: DC/AC systems, battery banks, shore power, bonding and corrosion protection."
