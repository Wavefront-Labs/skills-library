category: repair-maintenance
field: bicycle-repair
products:
  - id: drivetrain-service
    name: Drivetrain Service
    kind: craft
    scope: "Servicing and adjusting bicycle drivetrains: derailleurs, shifters, chains, cassettes and chainrings, mechanical and electronic."
    examples: [derailleur indexing, chain wear and replacement, cassette and chainring swaps, electronic shifting setup]
    status: live
  - id: brake-service
    name: Brake Service
    kind: craft
    scope: "Adjusting and repairing rim and disc brakes: pad replacement, cable and hydraulic systems, bleeding and rotor truing."
    examples: [hydraulic brake bleeding, pad and rotor replacement, cable brake adjustment, lever feel tuning]
    status: live
  - id: wheel-truing-building
    name: Wheel Truing and Building
    kind: craft
    scope: "Truing, tensioning and building bicycle wheels: spoke replacement, lateral/radial truing, dish and tension balancing."
    examples: [lateral and radial truing, spoke replacement, wheel building from parts, tension balancing]
    status: live
  - id: tire-tubeless-service
    name: Tire and Tubeless Service
    kind: craft
    scope: "Fitting and repairing bicycle tires and tubes, including tubeless setup, sealant service and puncture repair."
    examples: [tubeless conversion, sealant top-up, puncture repair, tire and rim compatibility]
    status: live
  - id: bearing-overhaul
    name: Bearing Overhaul
    kind: craft
    scope: "Overhauling bicycle bearing systems: bottom brackets, headsets, hubs and pedals, cartridge and cup-and-cone."
    examples: [bottom bracket replacement, headset service, cup-and-cone hub adjustment, pedal rebuilds]
    status: live
  - id: suspension-service
    name: Suspension Service
    kind: craft
    scope: "Servicing mountain bike suspension forks and rear shocks: lowers service, air spring and damper work, setup and sag."
    examples: [fork lowers service, air can service, damper service, sag and rebound setup]
    status: live
  - id: e-bike-service
    name: E-Bike Service
    kind: craft
    scope: "Diagnosing and servicing e-bike systems: motors, batteries, controllers, wiring and firmware across major drive systems."
    examples: [battery health diagnosis, motor error codes, firmware updates, wiring and connector faults]
    status: live
