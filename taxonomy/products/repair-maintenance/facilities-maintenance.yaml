category: repair-maintenance
field: facilities-maintenance
products:
  - id: cmms-software
    name: CMMS Software
    kind: application
    scope: "Running maintenance through a CMMS (Maximo, Fiix, UpKeep, Limble): work orders, asset registers, PM schedules and maintenance reporting."
    examples: [work order workflows, PM schedule setup, asset register hygiene, backlog and KPI reporting]
    status: live
  - id: general-handyman-repair
    name: General Handyman Repair
    kind: craft
    scope: "The generalist repair craft across a building: fixing doors, furniture, fixtures, fittings and the daily stream of small faults."
    examples: [door and drawer repairs, fixture refastening, caulking and sealing, small fault triage]
    status: live
  - id: surface-repair-painting
    name: Surface Repair and Painting
    kind: craft
    scope: "Repairing and refinishing interior surfaces: drywall patching, plaster repair, touch-up painting and wall protection."
    examples: [drywall hole patching, plaster crack repair, colour-matched touch-ups, repaint prep]
    status: live
  - id: door-hardware-lock-maintenance
    name: Door Hardware and Lock Maintenance
    kind: craft
    scope: "Maintaining doors and their hardware: locks and cylinders, closers, hinges, panic hardware and access-controlled doors."
    examples: [lock cylinder service and rekeying, door closer adjustment, panic bar maintenance, hinge and alignment fixes]
    status: live
  - id: lighting-maintenance
    name: Lighting Maintenance
    kind: craft
    scope: "Maintaining building lighting: lamp and fixture replacement, LED retrofits, ballast and driver faults and emergency light testing."
    examples: [fixture and driver replacement, LED retrofit, emergency lighting tests, lighting control faults]
    status: live
  - id: minor-plumbing-repair
    name: Minor Plumbing Repair
    kind: craft
    scope: "Day-to-day plumbing fixes in a facility: leaking taps and valves, toilets and urinals, traps, and unblocking fixtures."
    examples: [tap and valve repair, toilet mechanism repair, trap and drain unblocking, leak first response]
    status: live
  - id: minor-electrical-repair
    name: Minor Electrical Repair
    kind: craft
    scope: "Small electrical repairs within a maintenance role: outlets and switches, cord and plug repair, resetting and reporting faults safely."
    examples: [outlet and switch replacement, safe isolation practice, cord and plug repair, knowing when to call an electrician]
    status: live
  - id: preventive-maintenance-planning
    name: Preventive Maintenance Planning
    kind: craft
    scope: "Planning a facility's maintenance: PM task lists and frequencies, seasonal programmes, contractor coordination and budgeting."
    examples: [PM task list design, seasonal maintenance calendars, contractor scheduling, maintenance budgeting]
    status: live
  - id: maintenance-rounds-inspection
    name: Maintenance Rounds and Inspection
    kind: craft
    scope: "Walking the building systematically: daily rounds, meter and plant readings, defect spotting and escalation."
    examples: [rounds route design, plant room checks, defect logging, escalation judgement]
    status: live
