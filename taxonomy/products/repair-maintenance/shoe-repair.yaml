category: repair-maintenance
field: shoe-repair
products:
  - id: resoling
    name: Resoling
    kind: craft
    scope: "Replacing worn soles: full and half soles in leather and rubber, cemented and stitched constructions, sole edge finishing."
    examples: [half sole replacement, full resole, sole material selection, edge trimming and finishing]
    status: live
  - id: heel-repair
    name: Heel Repair and Replacement
    kind: craft
    scope: "Repairing and replacing heels: top lifts, heel blocks, ladies' heel tips and heel base rebuilding."
    examples: [top lift replacement, heel tip swaps, heel block rebuild, heel height corrections]
    status: live
  - id: welt-stitching-repair
    name: Welt and Stitching Repair
    kind: craft
    scope: "Repairing stitched footwear constructions: Goodyear welt work, restitching, seam repair and sole stitching on machines."
    examples: [welt replacement, outsole restitching, upper seam repair, hand stitching repairs]
    status: live
  - id: upper-repair-refinishing
    name: Upper Repair and Refinishing
    kind: craft
    scope: "Repairing and refinishing shoe uppers: leather patching, recolouring and dyeing, polishing, zipper and elastic replacement in boots."
    examples: [leather recolouring, scuff and scratch repair, boot zipper replacement, polish and finish restoration]
    status: live
  - id: stretching-fit-adjustment
    name: Stretching and Fit Adjustment
    kind: craft
    scope: "Adjusting footwear fit: stretching length and width, spot stretching for pressure points, padding and insole fitting."
    examples: [width and length stretching, bunion spot stretching, tongue pads and heel grips, insole fitting]
    status: live
  - id: orthopaedic-shoe-modification
    name: Orthopaedic Shoe Modification
    kind: craft
    scope: "Modifying footwear to prescription or need: sole lifts and raises, rocker soles, flares and wedges built onto existing shoes."
    examples: [heel and sole raises, rocker sole builds, lateral flares and wedges, balancing a modified pair]
    status: live
