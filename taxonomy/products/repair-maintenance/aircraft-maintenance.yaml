category: repair-maintenance
field: aircraft-maintenance
products:
  - id: airframe-structural-repair
    name: Airframe Structural Repair
    kind: craft
    scope: "Inspecting and repairing aircraft structures to approved data: sheet metal, fasteners, corrosion treatment and structural repair manuals."
    examples: [sheet metal patch repair, rivet work, corrosion removal and treatment, SRM compliance]
    status: live
  - id: composite-repair
    name: Composite Repair
    kind: craft
    scope: "Repairing composite aircraft structures: damage assessment, scarf repairs, layup, vacuum bagging and cure control."
    examples: [damage mapping, scarf and patch repair, vacuum bag layup, post-repair inspection]
    status: live
  - id: piston-engine-maintenance
    name: Piston Engine Maintenance
    kind: craft
    scope: "Maintaining and overhauling aircraft piston engines: cylinder work, magnetos, carburettors and 100-hour/annual engine tasks."
    examples: [cylinder compression checks, magneto timing, carburettor service, oil analysis interpretation]
    status: live
  - id: turbine-engine-maintenance
    name: Turbine Engine Maintenance
    kind: craft
    scope: "Maintaining turboprop and turbofan engines: borescope inspection, module replacement, trend monitoring and hot-section care."
    examples: [borescope inspection, hot section inspection, engine trend monitoring, FOD inspection]
    status: live
  - id: avionics-maintenance
    name: Avionics Maintenance
    kind: craft
    scope: "Installing, testing and repairing aircraft avionics: radios, navigation, transponders, autopilots and glass cockpits."
    examples: [transponder and pitot-static checks, GPS/nav installs, autopilot troubleshooting, avionics wiring]
    status: live
  - id: aircraft-electrical-systems
    name: Aircraft Electrical Systems
    kind: craft
    scope: "Maintaining aircraft electrical generation and distribution: batteries, alternators, buses, wiring looms and connectors to aviation standards."
    examples: [wiring loom repair, connector pinning, battery capacity checks, bus fault isolation]
    status: live
  - id: landing-gear-hydraulics
    name: Landing Gear and Hydraulics
    kind: craft
    scope: "Servicing landing gear, wheels, brakes and aircraft hydraulic systems: struts, retraction checks and brake overhaul."
    examples: [strut servicing, gear retraction checks, wheel and brake overhaul, hydraulic leak isolation]
    status: live
  - id: propeller-rotor-maintenance
    name: Propeller and Rotor Maintenance
    kind: craft
    scope: "Maintaining propellers and helicopter rotor systems: blade inspection, dressing, balancing and track-and-balance."
    examples: [blade dressing, dynamic balancing, rotor track and balance, governor checks]
    status: live
  - id: non-destructive-testing
    name: Non-Destructive Testing
    kind: craft
    scope: "Finding hidden defects without damage: dye penetrant, eddy current, ultrasonic, magnetic particle and radiographic inspection of aircraft parts."
    examples: [dye penetrant inspection, eddy current crack detection, ultrasonic thickness checks, inspection reporting]
    status: live
  - id: scheduled-inspection-airworthiness
    name: Scheduled Inspection and Airworthiness
    kind: craft
    scope: "Performing and certifying scheduled inspections: annual/100-hour and letter checks, AD compliance, maintenance records and release to service."
    examples: [annual inspection workflow, AD research and compliance, logbook entries, release to service]
    status: live
