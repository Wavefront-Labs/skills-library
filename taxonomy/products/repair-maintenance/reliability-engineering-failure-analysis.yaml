category: repair-maintenance
field: reliability-engineering-failure-analysis
products:
  - id: reliability-centred-maintenance
    name: Reliability-Centred Maintenance
    kind: craft
    scope: "Building maintenance strategy from failure behaviour: RCM analysis, failure-consequence logic, task selection and PM optimisation."
    examples: [RCM analysis workshops, failure consequence logic, maintenance task selection, PM optimisation]
    status: live
  - id: fmea
    name: FMEA
    kind: craft
    scope: "Failure mode and effects analysis on equipment and processes: failure mode identification, severity/occurrence/detection scoring and action tracking."
    examples: [failure mode brainstorming, RPN scoring, criticality ranking, corrective action tracking]
    status: live
  - id: root-cause-failure-analysis
    name: Root Cause Failure Analysis
    kind: craft
    scope: "Investigating equipment failures to true cause: evidence preservation, fracture and wear reading, cause trees and verified corrective actions."
    examples: [failed part examination, fracture surface reading, 5-why and cause trees, corrective action verification]
    status: live
  - id: vibration-analysis
    name: Vibration Analysis
    kind: craft
    scope: "Condition monitoring with vibration: spectrum and waveform analysis, bearing and gear fault signatures, balancing and alert levels."
    examples: [spectrum fault signatures, bearing defect frequencies, field balancing, alarm limit setting]
    status: live
  - id: infrared-thermography
    name: Infrared Thermography
    kind: craft
    scope: "Finding faults with thermal imaging: electrical and mechanical surveys, emissivity and measurement technique and severity reporting."
    examples: [electrical panel surveys, mechanical hot-spot detection, emissivity correction, severity grading]
    status: live
  - id: oil-analysis
    name: Oil Analysis
    kind: craft
    scope: "Monitoring machine health through lubricant analysis: sampling technique, wear metals and particle counts, and acting on lab results."
    examples: [representative sampling, wear metal interpretation, particle count trends, lubricant condition limits]
    status: live
  - id: life-data-analysis
    name: Life Data Analysis
    kind: craft
    scope: "Quantifying reliability from failure data: Weibull analysis, MTBF and survival statistics, and using them to set replacement and overhaul intervals."
    examples: [Weibull plotting, MTBF estimation, failure pattern identification, replacement interval setting]
    status: live
  - id: corrective-redesign
    name: Corrective Redesign
    kind: craft
    scope: "Designing out recurring failures short of a rebuild: material and component upgrades, design modifications and validating the fix in service."
    examples: [bad-actor elimination, material upgrades, design modification proposals, in-service validation]
    status: live
