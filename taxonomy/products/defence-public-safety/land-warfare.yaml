category: defence-public-safety
field: land-warfare
products:
  - id: infantry-tactics
    name: Infantry Tactics
    kind: craft
    scope: "The practice area of dismounted ground combat: how infantry units are organised, moved and employed, studied across every era."
    examples: [small-unit organisation, fire and movement doctrine, defensive positions, patrolling doctrine]
    status: live
  - id: armoured-warfare
    name: Armoured Warfare
    kind: craft
    scope: "The discipline of employing tanks and armoured formations in ground combat, from doctrine to combined-arms integration."
    examples: [tank doctrine, combined-arms integration, armoured manoeuvre history]
    status: live
  - id: field-artillery
    name: Field Artillery
    kind: craft
    scope: "The discipline of indirect fire support: how artillery units are organised, surveyed and coordinated with manoeuvre forces."
    examples: [fire-support coordination, gunnery organisation, counter-battery doctrine]
    status: live
  - id: combat-engineering
    name: Combat Engineering
    kind: craft
    scope: "Military engineering in support of ground operations: mobility, counter-mobility, fortification and gap crossing as a practice area."
    examples: [obstacle planning, field fortification, bridging operations, route clearance doctrine]
    status: live
  - id: ground-reconnaissance
    name: Ground Reconnaissance
    kind: craft
    scope: "The practice area of scouting and reconnaissance on land: observing terrain and forces and reporting for a ground commander."
    examples: [scout employment, observation posts, reconnaissance reporting]
    status: live
  - id: urban-operations
    name: Urban Operations
    kind: craft
    scope: "The recognised specialism of conducting ground operations in built-up areas, as doctrine and history."
    examples: [urban combat doctrine, siege and city-fighting history, civil-considerations planning]
    status: live
  - id: fieldcraft
    name: Fieldcraft
    kind: craft
    scope: "The soldier's craft of living and moving in the field: camouflage, concealment, navigation and field survival as a discipline."
    examples: [camouflage and concealment, land navigation, field living]
    status: live
  - id: armoured-fighting-vehicles
    name: Armoured Fighting Vehicles
    kind: application
    scope: "The equipment class of tanks, infantry fighting vehicles and other armoured platforms: crew roles, capabilities and operation as part of ground operations."
    examples: [main battle tanks, infantry fighting vehicles, crew roles and drills]
    status: live
  - id: pre-modern-land-warfare
    name: Pre-modern Land Warfare
    kind: craft
    scope: "Historical land warfare before mechanisation as a studied discipline: formations, siegecraft and cavalry across eras."
    examples: [phalanx and legion warfare, medieval siegecraft, cavalry warfare]
    status: live
