category: defence-public-safety
field: intelligence-and-espionage
products:
  - id: humint-tradecraft
    name: HUMINT Tradecraft
    kind: craft
    scope: "The discipline of human-source intelligence: recruiting, handling and debriefing human sources as a professional practice area."
    examples: [source handling as a discipline, agent-running history, debriefing practice]
    status: live
  - id: signals-intelligence
    name: Signals Intelligence
    kind: craft
    scope: "The practice area of collecting and analysing communications and electronic signals for intelligence purposes."
    examples: [SIGINT collection concepts, traffic analysis, codebreaking history]
    status: live
  - id: imagery-and-geospatial-intelligence
    name: Imagery and Geospatial Intelligence
    kind: craft
    scope: "The specialism of deriving intelligence from imagery and geospatial data: interpretation, measurement and reporting."
    examples: [imagery interpretation, geospatial analysis, change detection practice]
    status: live
  - id: open-source-intelligence
    name: Open-source Intelligence
    kind: craft
    scope: "The discipline of collecting and analysing publicly available information for an intelligence or investigative purpose."
    examples: [open-source collection practice, source evaluation, OSINT reporting]
    status: live
  - id: intelligence-analysis
    name: Intelligence Analysis
    kind: craft
    scope: "The analyst's craft of turning collected information into assessed intelligence: structured techniques, estimation and briefing."
    examples: [structured analytic techniques, estimative language, intelligence briefing]
    status: live
  - id: counterintelligence
    name: Counterintelligence
    kind: craft
    scope: "The discipline of detecting and countering hostile intelligence activity: insider-threat, espionage investigation and defensive tradecraft as a field."
    examples: [espionage investigation, insider-threat programmes, defensive-briefing practice]
    status: live
  - id: covert-surveillance
    name: Covert Surveillance
    kind: craft
    scope: "The specialism of following and observing subjects without being detected, for intelligence or criminal-investigation purposes."
    examples: [surveillance team roles, static and mobile surveillance as a discipline, surveillance-detection awareness]
    status: live
  - id: offensive-cyber-operations
    name: Offensive Cyber Operations
    kind: craft
    scope: "Cyber operations conducted as part of a conflict or criminal investigation: the mission area, its authorities and its organisation, as distinct from securing systems (computing-software)."
    examples: [cyber-operations doctrine, authorities and oversight, operational case history]
    status: live
