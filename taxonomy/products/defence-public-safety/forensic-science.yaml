category: defence-public-safety
field: forensic-science
products:
  - id: crime-scene-processing
    name: Crime Scene Processing
    kind: craft
    scope: "The forensic examiner's craft of documenting and recovering physical evidence at a scene: photography, searching, recovery and packaging."
    examples: [forensic photography, scene search patterns, evidence recovery technique]
    status: live
  - id: fingerprint-analysis
    name: Fingerprint Analysis
    kind: craft
    scope: "The discipline of developing, comparing and identifying friction-ridge impressions for criminal cases."
    examples: [latent print development, ridge comparison methodology, court testimony practice]
    status: live
  - id: dna-analysis
    name: DNA Analysis
    kind: craft
    scope: "Forensic DNA work for criminal investigation: profiling, mixture interpretation and database searching as a laboratory discipline."
    examples: [DNA profiling, mixture interpretation, database search practice]
    status: live
  - id: firearms-and-toolmark-analysis
    name: Firearms and Toolmark Analysis
    kind: craft
    scope: "The forensic discipline of examining firearms, fired components and toolmarks to link evidence to weapons and tools."
    examples: [ballistic comparison, cartridge-case examination, toolmark identification]
    status: live
  - id: trace-evidence-analysis
    name: Trace Evidence Analysis
    kind: craft
    scope: "The laboratory specialism of analysing trace materials — fibres, glass, paint, residues — as evidence in criminal cases."
    examples: [fibre comparison, glass analysis, gunshot-residue examination]
    status: live
  - id: forensic-toxicology
    name: Forensic Toxicology
    kind: craft
    scope: "The discipline of detecting and interpreting drugs, alcohol and poisons in casework samples for investigative and court purposes."
    examples: [drug screening and confirmation, post-mortem toxicology, impairment interpretation]
    status: live
  - id: forensic-pathology
    name: Forensic Pathology
    kind: craft
    scope: "The medico-legal specialism of determining cause and manner of death for investigation and prosecution."
    examples: [post-mortem examination, injury interpretation, death certification for court]
    status: live
  - id: questioned-documents
    name: Questioned Documents
    kind: craft
    scope: "The forensic discipline of examining disputed documents: handwriting comparison, alterations and document authentication for legal cases."
    examples: [handwriting comparison, alteration detection, ink and paper examination]
    status: live
  - id: digital-forensics
    name: Digital Forensics (Criminal Casework)
    kind: craft
    scope: "Digital evidence work for a criminal case: forensic acquisition, examination and evidential reporting under chain of custody, as distinct from incident-response technique (computing-software)."
    examples: [forensic imaging for court, mobile-device extraction, evidential reporting]
    status: live
  - id: biometric-identification-systems
    name: Biometric Identification Systems
    kind: application
    scope: "The system class of forensic identification databases: fingerprint (AFIS), DNA and facial-comparison systems and the searching and verification work done on them."
    examples: [AFIS searching, DNA database operation, facial-comparison workflows]
    status: live
