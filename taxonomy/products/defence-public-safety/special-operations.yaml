category: defence-public-safety
field: special-operations
products:
  - id: direct-action
    name: Direct Action
    kind: craft
    scope: "The special-operations discipline of short-duration raids and strikes against designated targets, as a recognised mission area."
    examples: [raid doctrine, target assault organisation, mission-area history]
    status: live
  - id: special-reconnaissance
    name: Special Reconnaissance
    kind: craft
    scope: "The mission area of clandestine reconnaissance and surveillance conducted by special-operations forces in denied areas."
    examples: [clandestine observation doctrine, denied-area reporting, long-range patrol history]
    status: live
  - id: unconventional-warfare
    name: Unconventional Warfare
    kind: craft
    scope: "The discipline of enabling and advising resistance movements and irregular forces, as doctrine and history."
    examples: [guerrilla warfare support doctrine, foreign internal defence, resistance-movement history]
    status: live
  - id: hostage-rescue
    name: Hostage Rescue
    kind: craft
    scope: "The recognised specialism of recovering hostages by specially trained units, military or police, as a mission area."
    examples: [rescue mission organisation, crisis-response unit roles, notable-operation case studies]
    status: live
  - id: counter-terrorism-operations
    name: Counter-terrorism Operations
    kind: craft
    scope: "The mission area of offensive action against terrorist organisations by dedicated units."
    examples: [CT task-force organisation, high-value-target operations as doctrine, interagency coordination]
    status: live
  - id: insertion-and-extraction
    name: Insertion and Extraction
    kind: craft
    scope: "The specialism of getting special-operations forces to and from an objective: parachute, maritime, vehicle and helicopter methods as a practice area."
    examples: [military freefall as a discipline, maritime insertion, helicopter insertion methods]
    status: live
  - id: combat-diving
    name: Combat Diving
    kind: craft
    scope: "The discipline of military diving for operational purposes: closed-circuit and surface swimming employment as a specialism."
    examples: [closed-circuit diving as a discipline, dive-pair employment, underwater navigation practice]
    status: live
  - id: personnel-recovery
    name: Personnel Recovery
    kind: craft
    scope: "The mission area of recovering isolated or captured personnel, including combat search and rescue, as doctrine."
    examples: [combat search and rescue doctrine, isolated-personnel procedures as a field, recovery coordination]
    status: live
