category: defence-public-safety
field: naval-warfare
products:
  - id: surface-warfare
    name: Surface Warfare
    kind: craft
    scope: "The discipline of combat between and from surface warships: how surface forces are organised, screened and fought."
    examples: [surface action doctrine, escort and screening, naval gunnery history]
    status: live
  - id: submarine-warfare
    name: Submarine Warfare
    kind: craft
    scope: "The practice area of operating submarines in conflict: patrol doctrine, stealth employment and the history of undersea campaigns."
    examples: [submarine patrol doctrine, undersea campaign history, deterrent patrols]
    status: live
  - id: anti-submarine-warfare
    name: Anti-submarine Warfare
    kind: craft
    scope: "The recognised specialism of detecting, tracking and countering submarines from ships, aircraft and fixed systems."
    examples: [ASW screening doctrine, sonar employment concepts, convoy protection history]
    status: live
  - id: naval-aviation-operations
    name: Naval Aviation Operations
    kind: craft
    scope: "The discipline of operating aircraft from ships: carrier flight-deck cycles, embarked squadron practice and maritime air operations."
    examples: [carrier deck cycles, embarked squadron practice, maritime patrol aviation]
    status: live
  - id: amphibious-operations
    name: Amphibious Operations
    kind: craft
    scope: "The practice area of projecting force from sea to shore: amphibious assault, landing operations and ship-to-shore movement as doctrine."
    examples: [amphibious assault doctrine, landing-craft operations, ship-to-shore logistics]
    status: live
  - id: mine-warfare
    name: Mine Warfare
    kind: craft
    scope: "The discipline of naval mining and mine countermeasures: minefield doctrine and the specialism of sweeping and hunting mines."
    examples: [minelaying doctrine, minesweeping, mine-hunting operations]
    status: live
  - id: shipboard-damage-control
    name: Shipboard Damage Control
    kind: craft
    scope: "The warship crew's craft of keeping a damaged ship fighting and afloat: flooding, fire and stability response as a discipline."
    examples: [flooding response, shipboard firefighting organisation, stability management]
    status: live
  - id: shipboard-combat-systems
    name: Shipboard Combat Systems
    kind: application
    scope: "The equipment class of integrated naval combat systems: sensors, combat-information centres and weapon-direction systems and the watchstanding roles that run them."
    examples: [combat information centre watchstanding, radar and sonar suites, weapon-direction systems]
    status: live
  - id: age-of-sail-warfare
    name: Age of Sail Warfare
    kind: craft
    scope: "Historical naval warfare under sail as a studied discipline: line-of-battle tactics, gunnery and boarding across eras."
    examples: [line-of-battle tactics, broadside gunnery history, boarding actions]
    status: live
