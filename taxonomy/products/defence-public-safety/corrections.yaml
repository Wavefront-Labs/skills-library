category: defence-public-safety
field: corrections
products:
  - id: custodial-supervision
    name: Custodial Supervision
    kind: craft
    scope: "The prison officer's core discipline: supervising people in custody day to day, dynamic security and professional boundaries."
    examples: [unit supervision, dynamic security, professional boundaries in custody]
    status: live
  - id: facility-security-procedures
    name: Facility Security Procedures
    kind: craft
    scope: "The practice area of operating a secure facility: counts, movement control, key and tool control and perimeter procedure."
    examples: [counts and movement control, key and tool control, perimeter procedure]
    status: live
  - id: contraband-control
    name: Contraband Control
    kind: craft
    scope: "The discipline of preventing and finding contraband in custody: searches of people, cells and mail as governed procedure."
    examples: [cell search procedure, person search policy, mail and property screening]
    status: live
  - id: use-of-force-in-custody
    name: Use of Force in Custody
    kind: craft
    scope: "The governed practice area of force and restraint in correctional settings: policy, de-escalation and planned interventions."
    examples: [custody use-of-force policy, de-escalation in custody, planned removal teams]
    status: live
  - id: custodial-emergency-response
    name: Custodial Emergency Response
    kind: craft
    scope: "The specialism of responding to emergencies in custody: disturbances, hostage incidents and escapes as planned institutional response."
    examples: [disturbance response planning, hostage incident protocols, escape response]
    status: live
  - id: prisoner-transport
    name: Prisoner Transport
    kind: craft
    scope: "The discipline of moving people in custody securely: escorts, court moves and transport risk management."
    examples: [escort procedure, court transport, transport risk assessment]
    status: live
  - id: inmate-classification
    name: Inmate Classification
    kind: craft
    scope: "The practice area of assessing and placing people in custody: risk and needs classification, housing decisions and review."
    examples: [risk classification, housing placement, classification review]
    status: live
  - id: offender-management-systems
    name: Offender Management Systems
    kind: application
    scope: "The system class of custody records and offender-management software: booking, sentence calculation and case records as operated by correctional staff."
    examples: [booking systems, sentence calculation tools, custody case records]
