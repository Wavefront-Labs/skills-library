category: defence-public-safety
field: criminal-investigation
products:
  - id: detective-casework
    name: Detective Casework
    kind: craft
    scope: "The detective's core craft: case-building from first report to prosecution file, lines of enquiry and case management."
    examples: [lines of enquiry, case-file preparation, investigative decision logs]
    status: live
  - id: interview-and-interrogation
    name: Interview and Interrogation
    kind: craft
    scope: "The discipline of interviewing witnesses, victims and suspects: investigative interviewing models, legal safeguards and statement taking."
    examples: [investigative interviewing models, suspect interview practice, statement taking]
    status: live
  - id: crime-scene-management
    name: Crime Scene Management
    kind: craft
    scope: "The practice area of securing and managing a crime scene: cordons, scene logs and coordinating examiners, upstream of laboratory forensics."
    examples: [scene preservation, scene logs and cordons, examiner coordination]
    status: live
  - id: evidence-handling
    name: Evidence Handling
    kind: craft
    scope: "The discipline of collecting, packaging, storing and tracking evidence so it stands up in court: chain of custody as professional practice."
    examples: [chain of custody, exhibit packaging and storage, disclosure preparation]
    status: live
  - id: undercover-operations
    name: Undercover Operations
    kind: craft
    scope: "The recognised specialism of covert investigation using an assumed role, as an organised, legally governed practice area."
    examples: [undercover programme governance, legend management as a discipline, operational welfare and oversight]
    status: live
  - id: confidential-source-management
    name: Confidential Source Management
    kind: craft
    scope: "The discipline of registering, handling and protecting informants in criminal investigation, under its legal and ethical framework."
    examples: [informant registration regimes, handler-controller models, source protection policy]
    status: live
  - id: cold-case-investigation
    name: Cold Case Investigation
    kind: craft
    scope: "The specialism of reinvestigating unsolved cases: case review methodology, re-examining evidence with new techniques and witness re-engagement."
    examples: [case review methodology, forensic re-examination, familial-DNA case studies]
    status: live
  - id: financial-crime-investigation
    name: Financial Crime Investigation
    kind: craft
    scope: "The practice area of investigating fraud, money laundering and financial crime for prosecution: following the money as an investigative discipline."
    examples: [money-flow tracing, fraud case-building, asset-restraint casework]
    status: live
