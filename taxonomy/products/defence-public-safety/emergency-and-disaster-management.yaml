category: defence-public-safety
field: emergency-and-disaster-management
products:
  - id: incident-command
    name: Incident Command
    kind: craft
    scope: "The discipline of standardised incident management across agencies: incident command systems, unified command and scaling an organisation to an incident."
    examples: [ICS structure and roles, unified command, span-of-control practice]
    status: live
  - id: emergency-planning
    name: Emergency Planning
    kind: craft
    scope: "The practice area of preparing for emergencies before they happen: risk assessment, emergency plans and exercising them."
    examples: [hazard risk assessment, emergency operations plans, exercise design and evaluation]
    status: live
  - id: emergency-operations-centre-management
    name: Emergency Operations Centre Management
    kind: craft
    scope: "The discipline of running an EOC during an emergency: coordination cycles, situational awareness and resource tracking."
    examples: [EOC activation and battle rhythm, situation reporting, resource coordination]
    status: live
  - id: disaster-response-coordination
    name: Disaster Response Coordination
    kind: craft
    scope: "The practice area of coordinating multi-agency response to a disaster in the field: mutual aid, task assignment and interagency liaison."
    examples: [mutual-aid coordination, multi-agency liaison, field task assignment]
    status: live
  - id: disaster-recovery
    name: Disaster Recovery
    kind: craft
    scope: "The discipline of recovering communities after a disaster: damage assessment, recovery programmes and continuity of community services."
    examples: [damage assessment, recovery programme management, community continuity planning]
    status: live
  - id: mass-casualty-incident-management
    name: Mass-casualty Incident Management
    kind: craft
    scope: "The specialism of organising response when casualties overwhelm normal capacity: triage organisation, casualty flow and surge coordination."
    examples: [triage organisation, casualty-flow management, hospital surge coordination]
    status: live
  - id: humanitarian-emergency-logistics
    name: Humanitarian Emergency Logistics
    kind: craft
    scope: "The practice area of coordinating relief supply in humanitarian emergencies: supply chains, distribution and camp support logistics."
    examples: [relief supply chains, aid distribution coordination, logistics cluster practice]
    status: live
  - id: household-emergency-preparedness
    name: Household Emergency Preparedness
    kind: craft
    scope: "The practical discipline of preparing a household for emergencies: kits, family plans and sheltering decisions."
    examples: [emergency kits, family emergency plans, shelter-in-place vs evacuate decisions]
    status: live
  - id: public-warning-and-alerting-systems
    name: Public Warning and Alerting Systems
    kind: application
    scope: "The system class of emergency public warning: sirens, cell broadcast and alerting platforms and the discipline of issuing effective warnings."
    examples: [alert origination, warning message craft, siren and cell-broadcast systems]
    status: live
