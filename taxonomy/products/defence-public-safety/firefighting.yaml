category: defence-public-safety
field: firefighting
products:
  - id: structural-firefighting
    name: Structural Firefighting
    kind: craft
    scope: "The firefighter's core discipline of suppressing fires in buildings: fire behaviour, attack and ventilation practice, and primary search."
    examples: [interior attack practice, ventilation discipline, fire behaviour reading]
    status: live
  - id: wildland-firefighting
    name: Wildland Firefighting
    kind: craft
    scope: "The discipline of wildfire suppression: handcrew and engine work, line construction, burn operations and wildland fire behaviour."
    examples: [fireline construction, burnout operations practice, wildland fire behaviour]
    status: live
  - id: hazmat-response
    name: Hazmat Response
    kind: craft
    scope: "The specialism of responding to hazardous-materials incidents: identification, protective postures, containment and decontamination practice."
    examples: [hazard identification, protective-level selection, decontamination corridors]
    status: live
  - id: aircraft-rescue-firefighting
    name: Aircraft Rescue Firefighting
    kind: craft
    scope: "The airport fire service discipline: aircraft fire suppression, rescue access and airfield response standards."
    examples: [aircraft fire attack practice, rescue access points, airfield response standards]
    status: live
  - id: fireground-command
    name: Fireground Command
    kind: craft
    scope: "The fire officer's discipline of commanding an incident scene: size-up, sector assignment and firefighter safety management."
    examples: [scene size-up, sector management, mayday and accountability systems]
    status: live
  - id: fire-investigation
    name: Fire Investigation
    kind: craft
    scope: "The discipline of determining a fire's origin and cause, including arson investigation for prosecution."
    examples: [origin-and-cause methodology, burn-pattern analysis, arson case-building]
    status: live
  - id: breathing-apparatus
    name: Breathing Apparatus
    kind: application
    scope: "The equipment class of self-contained breathing apparatus and respiratory protection: use discipline, air management and maintenance."
    examples: [SCBA use discipline, air management, apparatus servicing]
    status: live
  - id: fire-apparatus-and-pumps
    name: Fire Apparatus and Pumps
    kind: application
    scope: "The equipment class of fire engines, pumps, aerial appliances and hydraulics: operating them to deliver water and access on the fireground."
    examples: [pump operation, aerial appliance work, hydraulic calculations in practice]
    status: live
