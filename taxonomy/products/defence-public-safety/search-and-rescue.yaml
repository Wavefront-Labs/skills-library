category: defence-public-safety
field: search-and-rescue
products:
  - id: wilderness-search-and-rescue
    name: Wilderness Search and Rescue
    kind: craft
    scope: "The discipline of finding and recovering missing people in wild terrain: lost-person behaviour, search tactics and field recovery."
    examples: [lost-person behaviour, search tactics, ground team fieldwork]
    status: live
  - id: search-management
    name: Search Management
    kind: craft
    scope: "The planner's craft of running a search: probability-based planning, segment assignment and multi-team coordination."
    examples: [search area segmentation, probability of detection planning, multi-team coordination]
    status: live
  - id: urban-search-and-rescue
    name: Urban Search and Rescue
    kind: craft
    scope: "The specialism of locating and extricating people from collapsed structures: structural triage, void search and heavy rescue."
    examples: [structural triage, void search practice, breaching and shoring]
    status: live
  - id: swiftwater-rescue
    name: Swiftwater Rescue
    kind: craft
    scope: "The discipline of rescuing people from moving water: swiftwater hazards, rescue progressions and flood response."
    examples: [swiftwater hazard reading, rescue progressions, flood rescue operations]
    status: live
  - id: maritime-search-and-rescue
    name: Maritime Search and Rescue
    kind: craft
    scope: "The practice area of SAR at sea and on open water: coastal rescue, lifeboat operations and maritime search coordination."
    examples: [lifeboat operations, maritime search patterns, surf rescue practice]
    status: live
  - id: mountain-rescue
    name: Mountain Rescue
    kind: craft
    scope: "The specialism of rescue in steep and alpine terrain: technical access, avalanche response and casualty evacuation from mountains."
    examples: [steep-terrain access, avalanche rescue, alpine casualty evacuation]
    status: live
  - id: technical-rope-rescue
    name: Technical Rope Rescue
    kind: craft
    scope: "The rigging discipline shared across rescue teams: rope systems, mechanical advantage and litter work for raising and lowering casualties."
    examples: [rope system rigging, mechanical advantage, litter attending]
    status: live
  - id: search-dog-handling
    name: Search Dog Handling
    kind: craft
    scope: "The handler's discipline of working air-scent, trailing and disaster dogs to find missing or trapped people."
    examples: [air-scent deployments, trailing work, disaster dog certification]
    status: live
