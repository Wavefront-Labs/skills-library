category: defence-public-safety
field: customs-border-and-wildlife-enforcement
products:
  - id: customs-search-and-seizure
    name: Customs Search and Seizure
    kind: craft
    scope: "The customs officer's discipline of inspecting travellers, baggage and cargo and seizing prohibited or undeclared goods."
    examples: [passenger inspection procedure, cargo examination, seizure processing]
    status: live
  - id: border-patrol
    name: Border Patrol
    kind: craft
    scope: "The practice area of patrolling and controlling land and maritime borders between ports of entry."
    examples: [line patrol practice, sign cutting and tracking, border surveillance operations]
    status: live
  - id: immigration-field-enforcement
    name: Immigration Field Enforcement
    kind: craft
    scope: "Coercive field enforcement of immigration law: status checks, detention and removal operations as officer practice, distinct from paperwork adjudication (law-government)."
    examples: [status verification in the field, detention procedure, removal operations]
    status: live
  - id: wildlife-and-fisheries-enforcement
    name: Wildlife and Fisheries Enforcement
    kind: craft
    scope: "The game warden's and wildlife officer's discipline: anti-poaching patrol, fisheries boarding and wildlife-trafficking enforcement."
    examples: [anti-poaching patrol, fisheries boarding and inspection, wildlife-trafficking casework]
    status: live
  - id: smuggling-interdiction
    name: Smuggling Interdiction
    kind: craft
    scope: "The specialism of detecting and interdicting smuggling across borders: concealment detection, targeting and interdiction operations."
    examples: [concealment detection practice, risk targeting of shipments, maritime interdiction]
    status: live
  - id: agricultural-biosecurity-enforcement
    name: Agricultural Biosecurity Enforcement
    kind: craft
    scope: "Border enforcement against biological risk: inspecting and seizing plant, animal and food material at the border."
    examples: [quarantine inspection, prohibited-material seizure, pest-pathway interception]
    status: live
  - id: detection-dog-handling
    name: Detection Dog Handling
    kind: craft
    scope: "The handler's discipline of working detection dogs at borders and checkpoints: drug, currency, explosive and biosecurity detection roles."
    examples: [handler-dog search patterns, odour disciplines, screening deployments]
    status: live
  - id: inspection-and-screening-systems
    name: Inspection and Screening Systems
    kind: application
    scope: "The equipment class of border screening technology: baggage and cargo scanners, radiation portals and trace-detection equipment and their operation."
    examples: [x-ray image reading, radiation portal monitoring, trace detection operation]
    status: live
