# Crafts carve translation by the specialisms translators actually sell; applications name the
# two dominant CAT tools. Terminology management lives in lexicography; subtitle timing in
# transcription-and-captioning.
category: languages-linguistics
field: translation
products:
  - id: literary-translation
    name: Literary Translation
    kind: craft
    scope: "Translating literature: voice, register, rhythm, cultural allusion and the trade-offs between fidelity and readability."
    examples: [voice and register, translating dialect, poetry translation, translator's notes]
    status: live
  - id: technical-translation
    name: Technical Translation
    kind: craft
    scope: "Translating manuals, specifications and scientific text: terminology consistency, controlled language and subject-matter accuracy."
    examples: [terminology consistency, controlled language, spec translation]
    status: live
  - id: legal-translation
    name: Legal Translation
    kind: craft
    scope: "Translating contracts, judgments and official documents: legal-system mismatches, certified/sworn translation conventions and formatting."
    examples: [contract translation, sworn translation conventions, legal-system equivalence]
    status: live
  - id: medical-translation
    name: Medical Translation
    kind: craft
    scope: "Translating clinical, pharmaceutical and patient-facing material: medical terminology, regulatory templates and back-translation QA."
    examples: [clinical-trial documents, patient information, back-translation]
    status: live
  - id: localisation
    name: Localisation
    kind: craft
    scope: "Adapting software, games and websites for a locale: string constraints, placeholders, pseudo-localisation and cultural adaptation."
    examples: [string length limits, placeholder handling, game localisation, locale testing]
    status: live
  - id: transcreation
    name: Transcreation
    kind: craft
    scope: "Re-creating marketing and brand copy across languages: preserving intent and effect rather than wording, with rationale-backed options."
    examples: [slogan adaptation, brand voice transfer, creative briefs]
    status: live
  - id: mt-post-editing
    name: Machine Translation Post-Editing
    kind: craft
    scope: "Editing machine-translation output to spec: light vs full post-editing, typical MT error patterns and productivity discipline."
    examples: [light vs full PE, MT error patterns, PE productivity]
    status: live
  - id: translation-revision
    name: Translation Revision and QA
    kind: craft
    scope: "Reviewing another translator's work: bilingual revision, QA tooling, error typologies and feedback that improves the text without rewriting it."
    examples: [bilingual revision, MQM error typology, QA checks]
    status: live
  - id: trados
    name: Trados Studio
    kind: application
    scope: "Translating and managing projects in Trados Studio: translation memories, termbases, project packages and QA settings."
    examples: [TM management, project packages, QA checker, alignment]
    status: live
  - id: memoq
    name: memoQ
    kind: application
    scope: "Translating and managing projects in memoQ: TMs and LiveDocs, term bases, server workflows and file-format filters."
    examples: [LiveDocs, term bases, server projects, format filters]
    status: live
