# Technique tier only: certifying a transcript as the official court record is law-government.
# Subtitle translation craft draws on the translation field; timing and conventions live here.
category: languages-linguistics
field: transcription-and-captioning
products:
  - id: verbatim-transcription
    name: Verbatim Transcription
    kind: craft
    scope: "Producing accurate transcripts from audio: verbatim vs clean-read conventions, speaker labelling, timestamping and difficult-audio technique."
    examples: [verbatim conventions, speaker labelling, timestamping, difficult audio]
    status: live
  - id: closed-captioning
    name: Closed Captioning
    kind: craft
    scope: "Captioning for accessibility: caption segmentation, sound and music description, positioning and broadcast caption standards."
    examples: [caption segmentation, sound description, positioning, FCC/Ofcom standards]
    status: live
  - id: subtitling
    name: Subtitling
    kind: craft
    scope: "Timing and writing subtitles: spotting, reading-speed limits, line breaks, condensation and subtitle style guides."
    examples: [spotting, reading-speed limits, condensation, style guides]
    status: live
  - id: realtime-captioning
    name: Real-Time Captioning (CART)
    kind: craft
    scope: "Live captioning as it is spoken: CART provision, live accuracy strategies, dictionary preparation and correction on the fly."
    examples: [CART provision, dictionary prep, live corrections]
    status: live
  - id: respeaking
    name: Respeaking
    kind: craft
    scope: "Live captioning via speech recognition: respeaking technique, punctuation voicing, housestyle macros and latency management."
    examples: [respeaking technique, punctuation voicing, latency management]
    status: live
  - id: stenotype
    name: Machine Stenography
    kind: craft
    scope: "Writing on a steno machine: stenotype theory, brief forms, speed building and realtime dictionary maintenance."
    examples: [steno theory, brief forms, speed building, dictionary maintenance]
    status: live
  - id: asr-post-editing
    name: ASR Transcript Post-Editing
    kind: craft
    scope: "Correcting automatic speech-recognition output: typical ASR error patterns, efficient correction workflow and QA against the audio."
    examples: [ASR error patterns, correction workflow, audio QA]
    status: live
  - id: aegisub
    name: Aegisub
    kind: application
    scope: "Subtitle creation in Aegisub: timing to audio and video, ASS styling, typesetting and export to delivery formats."
    examples: [audio timing, ASS styling, typesetting, format export]
    status: live
