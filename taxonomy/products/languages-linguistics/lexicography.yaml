# A compact field: the core dictionary crafts, terminology management (placed here rather than
# translation — it serves both), and the dominant corpus-query tool lexicographers use.
category: languages-linguistics
field: lexicography
products:
  - id: dictionary-compilation
    name: Dictionary Compilation
    kind: craft
    scope: "Planning and building dictionaries: headword selection, entry structure, sense division and corpus-based evidence gathering."
    examples: [headword selection, sense division, entry microstructure, corpus evidence]
    status: live
  - id: definition-writing
    name: Definition Writing
    kind: craft
    scope: "Writing dictionary definitions and usage notes: defining-vocabulary discipline, genus-differentia style, full-sentence definitions and example selection."
    examples: [defining vocabulary, genus-differentia, example sentences, usage labels]
    status: live
  - id: terminology-management
    name: Terminology Management
    kind: craft
    scope: "Building and governing termbases and glossaries: concept-oriented term records, TBX exchange, term extraction and enforcing approved terms."
    examples: [termbase design, term extraction, TBX exchange, forbidden terms]
    status: live
  - id: etymology-research
    name: Etymology Research
    kind: craft
    scope: "Tracing word histories: dating first attestations, borrowing chains, folk-etymology detection and writing etymological entries."
    examples: [first attestations, borrowing chains, folk-etymology detection]
    status: live
  - id: sketch-engine
    name: Sketch Engine
    kind: application
    scope: "Corpus querying for lexicography in Sketch Engine: word sketches, concordances, thesaurus functions and building custom corpora."
    examples: [word sketches, CQL queries, custom corpora, keyword extraction]
    status: live
