# Ordinary prose for life and work. Professional/technical writing for an audience is
# media-communication; writing as art is creative-arts.
category: languages-linguistics
field: everyday-composition
products:
  - id: letter-writing
    name: Letter Writing
    kind: craft
    scope: "Writing letters that do their job: formal and personal letter conventions, complaints, requests, thanks and condolence."
    examples: [formal letters, complaint letters, condolence, cover notes]
    status: live
  - id: email-correspondence
    name: Email and Correspondence
    kind: craft
    scope: "Everyday written correspondence: clear subject lines, tone calibration, asking and declining gracefully and threading discipline."
    examples: [tone calibration, requests and refusals, follow-ups]
    status: live
  - id: essay-writing
    name: Essay Writing
    kind: craft
    scope: "Structured expository essays: thesis and argument structure, paragraphing, evidence use and revision."
    examples: [thesis construction, paragraph structure, revision passes]
    status: live
  - id: explanatory-writing
    name: Explanatory and Plain-Language Writing
    kind: craft
    scope: "Explaining things clearly in plain prose: audience-matched explanation, plain-language principles and cutting jargon without losing accuracy."
    examples: [plain-language principles, audience matching, jargon removal]
    status: live
  - id: personal-statements
    name: Personal Statements and Applications
    kind: craft
    scope: "Writing about yourself for a decision-maker: personal statements, application answers and bios that are specific, honest and persuasive."
    examples: [personal statements, application answers, short bios]
    status: live
  - id: summarising-paraphrasing
    name: Summarising and Paraphrasing
    kind: craft
    scope: "Condensing and restating others' words faithfully: summary at different lengths, paraphrase without distortion and quoting judiciously."
    examples: [length-targeted summary, faithful paraphrase, quotation choice]
    status: live
  - id: self-editing
    name: Self-Editing and Proofreading
    kind: craft
    scope: "Fixing your own prose: structural self-editing, sentence-level tightening, grammar and punctuation accuracy and proofreading method."
    examples: [structural edit, sentence tightening, proofreading passes]
    status: live
