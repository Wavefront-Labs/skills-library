    status: live
  - id: braille-transcription
    name: Braille Transcription
    kind: craft
    scope: "Transcribing print into braille to standard: UEB rules, contraction usage, formatting codes and proofreading transcriptions."
    examples: [UEB rules, contractions, braille formatting, transcription proofreading]
