  - id: technical-braille-codes
    name: Technical Braille Codes
    kind: craft
    scope: "Braille for maths, science and music: Nemeth and UEB maths, music braille notation and technical-material layout."
    examples: [Nemeth code, UEB maths, music braille, spatial layout]
    status: live
  - id: refreshable-braille
    name: Refreshable Braille Technology
    kind: craft
    scope: "Working with refreshable braille displays and notetakers: pairing with screen readers, braille-input typing and display navigation."
    examples: [display navigation, braille input, screen-reader pairing]
    status: live
  - id: tactile-graphics
    name: Tactile Graphics
    kind: craft
    scope: "Designing and reading tactile diagrams, maps and images: simplification for touch, texture and symbol conventions and production methods."
    examples: [diagram simplification, texture conventions, swell-paper production]
