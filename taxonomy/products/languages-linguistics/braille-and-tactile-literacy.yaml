  - id: tactile-literacy-instruction
    name: Tactile Literacy Instruction
    kind: craft
    scope: "Teaching braille and tactile reading: pre-braille skills, instruction sequencing for children and adult late learners and materials preparation."
    examples: [pre-braille skills, adult late learners, materials preparation]
    status: live
  - id: duxbury
    name: Duxbury Braille Translator
    kind: application
    scope: "Producing braille with Duxbury DBT: translation tables, formatting styles, embosser setup and fixing translation errors."
