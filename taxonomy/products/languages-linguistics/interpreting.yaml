# Modes (simultaneous, consecutive, sight) and the settings interpreters certify in. Court
# certification itself and official-record questions are law-government; the interpreting
# technique is here.
category: languages-linguistics
field: interpreting
products:
  - id: simultaneous-interpreting
    name: Simultaneous Interpreting
    kind: craft
    scope: "Interpreting in real time while the speaker talks: booth technique, décalage, anticipation and split attention under cognitive load."
    examples: [booth technique, décalage control, anticipation, relay interpreting]
    status: live
  - id: consecutive-interpreting
    name: Consecutive Interpreting
    kind: craft
    scope: "Interpreting after the speaker pauses: memory technique, structured note-taking symbols and delivery of long segments."
    examples: [note-taking symbols, memory training, segment delivery]
    status: live
  - id: sight-translation
    name: Sight Translation
    kind: craft
    scope: "Rendering a written document aloud in another language on the spot: scanning, chunking and register control."
    examples: [document scanning, chunking, register control]
    status: live
  - id: conference-interpreting
    name: Conference Interpreting
    kind: craft
    scope: "Working multilingual conferences: preparation from agendas and glossaries, booth teamwork, relay and AIIC-style professional practice."
    examples: [glossary preparation, booth teamwork, relay via pivot, AIIC norms]
    status: live
  - id: medical-interpreting
    name: Medical Interpreting
    kind: craft
    scope: "Interpreting in clinical settings: medical terminology, accuracy under distress, ethics of advocacy vs conduit and certification norms."
    examples: [clinical terminology, conduit vs advocate, triadic positioning]
    status: live
  - id: court-interpreting
    name: Court and Legal Interpreting
    kind: craft
    scope: "Interpreting in legal proceedings: verbatim fidelity, legal register, interpreting objections and testimony, and the ethics of the record."
    examples: [verbatim fidelity, legal register, witness testimony mode]
    status: live
  - id: community-interpreting
    name: Community and Public-Service Interpreting
    kind: craft
    scope: "Interpreting in social services, schools, housing and asylum settings: dialogue interpreting, cultural brokering boundaries and vicarious-trauma management."
    examples: [dialogue interpreting, asylum interviews, role boundaries]
    status: live
  - id: sign-language-interpreting
    name: Sign Language Interpreting
    kind: craft
    scope: "Interpreting between signed and spoken languages: voicing, platform interpreting, Deaf-hearing team interpreting and processing time."
    examples: [voicing, platform work, Deaf interpreter teaming, lag management]
    status: live
  - id: remote-interpreting
    name: Remote Interpreting
    kind: craft
    scope: "Interpreting over video and phone: RSI platform technique, audio discipline, turn management without physical presence and home-booth setup."
    examples: [RSI platforms, VRI technique, audio setup, remote turn-taking]
    status: live
  - id: conflict-zone-interpreting
    name: Conflict-Zone and Field Interpreting
    kind: craft
    scope: "Interpreting in conflict and crisis settings: military and humanitarian field technique, impartiality under pressure and interpreter self-protection."
    examples: [field technique, impartiality under pressure, fixer-interpreter practice]
    status: live
