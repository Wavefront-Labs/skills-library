# The reader's skill, not classroom pedagogy (education-training owns curriculum and teaching
# method as a profession; coaching the skill itself is here).
category: languages-linguistics
field: literacy-and-reading
products:
  - id: reading-fluency
    name: Reading Fluency
    kind: craft
    scope: "Building accurate, automatic reading: decoding practice, repeated reading, prosody and fluency measurement."
    examples: [repeated reading, decoding practice, fluency measurement]
    status: live
  - id: reading-comprehension
    name: Reading Comprehension Strategies
    kind: craft
    scope: "Getting meaning from text deliberately: previewing, questioning, summarising, inference and monitoring one's own understanding."
    examples: [active-reading strategies, summarising, inference, comprehension monitoring]
    status: live
  - id: speed-reading
    name: Speed Reading
    kind: craft
    scope: "Reading faster without losing the comprehension the task needs: skimming, scanning, chunking and knowing when speed techniques fail."
    examples: [skimming and scanning, chunking, subvocalisation reduction, speed-accuracy trade-off]
    status: live
  - id: adult-literacy
    name: Adult Literacy
    kind: craft
    scope: "Building reading and writing as an adult beginner or returner: adult-appropriate methods, confidence rebuilding and tutoring one-to-one."
    examples: [adult beginner methods, confidence rebuilding, one-to-one tutoring]
    status: live
  - id: functional-literacy
    name: Functional and Everyday Literacy
    kind: craft
    scope: "Reading for daily life: forms, medication labels, contracts, timetables and official letters, including in a second language."
    examples: [form filling, label reading, official letters, multilingual literacy]
    status: live
