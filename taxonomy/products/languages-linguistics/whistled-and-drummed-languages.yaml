# A narrow field: the two dominant named traditions, the general techniques, and the
# documentation/revitalisation work that keeps them alive.
category: languages-linguistics
field: whistled-and-drummed-languages
products:
  - id: silbo-gomero
    name: Silbo Gomero
    kind: craft
    scope: "The whistled form of Spanish from La Gomera: whistle production, vowel and consonant substitution and long-distance comprehension."
    examples: [whistle articulation, vowel mapping, distance signalling]
    status: live
  - id: whistled-speech-technique
    name: Whistled Speech Technique
    kind: craft
    scope: "Whistled surrogates of spoken languages generally: encoding pitch, tone or formants in whistle, across traditions such as whistled Turkish and Sfyria."
    examples: [whistled Turkish, formant whistling, tonal whistling, reception training]
    status: live
  - id: talking-drums
    name: Talking Drums
    kind: craft
    scope: "Drummed surrogates of tonal languages: hourglass-drum technique, tone-and-rhythm encoding and the stock phrases that disambiguate messages."
    examples: [dùndún technique, tone encoding, drummed praise names, message formulas]
    status: live
  - id: surrogate-speech-documentation
    name: Surrogate Speech Documentation
    kind: craft
    scope: "Recording and analysing whistled, drummed and other speech surrogates: field recording, acoustic analysis and mapping surrogate to source language."
    examples: [field recording, acoustic analysis, surrogate-to-phonology mapping]
    status: live
  - id: surrogate-language-revitalisation
    name: Surrogate Language Revitalisation
    kind: craft
    scope: "Keeping endangered surrogate languages in use: teaching programmes, community transmission and UNESCO-style safeguarding practice."
    examples: [school programmes, community transmission, safeguarding plans]
    status: live
