# Crafts follow the canonical subfield split linguists train in; Praat is the one tool dominant
# enough to name. Computational NLP engineering is computing-software, not here.
category: languages-linguistics
field: linguistics
products:
  - id: phonetic-transcription
    name: Phonetics and IPA Transcription
    kind: craft
    scope: "Hearing, producing and transcribing speech sounds: broad and narrow IPA transcription, articulatory description and ear training."
    examples: [narrow IPA transcription, articulatory description, ear training]
    status: live
  - id: phonology
    name: Phonology
    kind: craft
    scope: "Analysing sound systems: phoneme inventories, rule and constraint analysis, syllable structure, stress and tone systems."
    examples: [phonemic analysis, rule ordering, tone systems, syllabification]
    status: live
  - id: morphology-syntax
    name: Morphology and Syntax
    kind: craft
    scope: "Analysing word and sentence structure: morphological parsing, glossing conventions, constituency and grammatical-relations analysis."
    examples: [interlinear glossing, constituency tests, agreement systems, argument structure]
    status: live
  - id: semantics-pragmatics
    name: Semantics and Pragmatics
    kind: craft
    scope: "Analysing meaning in language and context: lexical and compositional semantics, implicature, presupposition and speech acts."
    examples: [compositional analysis, implicature, presupposition tests, speech acts]
    status: live
  - id: sociolinguistics
    name: Sociolinguistics
    kind: craft
    scope: "Studying language in society: variation analysis, dialectology, register and style, multilingualism and language attitudes."
    examples: [variationist analysis, dialect mapping, code-switching, language attitudes]
    status: live
  - id: historical-linguistics
    name: Historical and Comparative Linguistics
    kind: craft
    scope: "Reconstructing language history: the comparative method, sound-change laws, internal reconstruction and language-family classification."
    examples: [comparative method, sound-change laws, proto-form reconstruction, cognate sets]
    status: live
  - id: corpus-linguistics
    name: Corpus Linguistics
    kind: craft
    scope: "Building and querying language corpora for evidence: corpus design, annotation, concordancing and frequency/collocation analysis."
    examples: [corpus design, concordancing, collocation analysis, annotation schemes]
    status: live
  - id: language-documentation
    name: Language Documentation and Fieldwork
    kind: craft
    scope: "Documenting under-described languages: elicitation technique, field recording, archiving standards and working with speaker communities."
    examples: [elicitation sessions, field recording, ELAN annotation, archiving standards]
    status: live
  - id: praat
    name: Praat
    kind: application
    scope: "Acoustic analysis in Praat: spectrograms, formant and pitch measurement, annotation TextGrids and Praat scripting."
    examples: [formant measurement, pitch tracks, TextGrids, Praat scripting]
    status: live
