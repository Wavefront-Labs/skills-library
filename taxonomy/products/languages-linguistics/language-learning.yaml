# Products are method/skill areas, not individual languages (a skill for learning Spanish
# vocabulary lives under vocabulary-building, tagged by language).
category: languages-linguistics
field: language-learning
products:
  - id: vocabulary-building
    name: Vocabulary Building
    kind: craft
    scope: "Acquiring and retaining vocabulary in a target language: frequency-based selection, mnemonics, sentence mining and review scheduling."
    examples: [frequency lists, sentence mining, mnemonic keywords, review scheduling]
    status: live
  - id: spaced-repetition
    name: Spaced Repetition (Anki)
    kind: application
    scope: "Spaced-repetition software for language study, Anki foremost: deck design, card templates, scheduling settings and shared-deck workflows."
    examples: [deck design, cloze cards, FSRS scheduling, shared decks]
    status: live
  - id: pronunciation-training
    name: Pronunciation and Accent Training
    kind: craft
    scope: "Training target-language pronunciation and prosody: minimal pairs, shadowing, IPA-guided articulation and accent reduction."
    examples: [minimal-pair drills, shadowing, tone and stress, articulation placement]
    status: live
  - id: grammar-acquisition
    name: Grammar Acquisition
    kind: craft
    scope: "Internalising a target language's grammar: pattern drills, form-focused study and turning explicit rules into fluent use."
    examples: [pattern drills, error correction, conjugation mastery, case systems]
    status: live
  - id: listening-comprehension
    name: Listening Comprehension
    kind: craft
    scope: "Building listening skill through comprehensible input: graded listening, extensive input routines and native-speed adaptation."
    examples: [comprehensible input, graded podcasts, dictation, native-speed training]
    status: live
  - id: speaking-fluency
    name: Speaking and Conversation Fluency
    kind: craft
    scope: "Developing spoken fluency: conversation practice structure, output routines, circumlocution and language-exchange technique."
    examples: [conversation tactics, circumlocution, language exchange, output drills]
    status: live
  - id: extensive-reading
    name: Extensive Reading in a Second Language
    kind: craft
    scope: "Reading as an acquisition method: graded readers, intensive vs extensive reading balance and dictionary discipline."
    examples: [graded readers, intensive vs extensive, lookup strategy, narrow reading]
    status: live
  - id: immersion-technique
    name: Immersion Technique
    kind: craft
    scope: "Structuring an immersion environment at home or abroad: media immersion routines, domain sequencing and sustaining input volume."
    examples: [media immersion, home-environment setup, study-abroad strategy, input volume]
    status: live
  - id: heritage-language-maintenance
    name: Heritage Language Maintenance
    kind: craft
    scope: "Maintaining and rebuilding a family or community language across generations: re-activation, literacy catch-up and intergenerational transmission."
    examples: [re-activation, literacy catch-up, family language policy]
    status: live
  - id: proficiency-assessment
    name: Proficiency Assessment and Exam Preparation
    kind: craft
    scope: "Measuring and certifying language level: CEFR self-assessment and preparing for proficiency exams such as IELTS, JLPT, DELE or HSK."
    examples: [CEFR levelling, IELTS preparation, JLPT strategy, mock-exam routines]
    status: live
