# Encoding/decoding technique only; operating signal networks is energy-mining-utilities and
# military signals operations are defence-public-safety.
category: languages-linguistics
field: signalling-and-coded-communication
products:
  - id: morse-code
    name: Morse Code
    kind: craft
    scope: "Sending and receiving Morse: character learning methods, head-copy at speed, keying technique and standard abbreviations and prosigns."
    examples: [Koch method, head copy, keying technique, prosigns]
    status: live
  - id: flag-semaphore
    name: Flag Semaphore
    kind: craft
    scope: "Signalling with semaphore flags: arm positions, sending and reading rhythm and error-correction conventions."
    examples: [arm positions, reading rhythm, error correction]
    status: live
  - id: maritime-flag-signals
    name: Maritime Flag Signals
    kind: craft
    scope: "The International Code of Signals: flag hoists, single-flag meanings, code groups and dressing and answering conventions."
    examples: [single-flag meanings, flag hoists, code groups]
    status: live
  - id: light-signalling
    name: Light Signalling
    kind: craft
    scope: "Signalling by directed light: Aldis-lamp Morse procedure, heliograph technique and light-signal conventions between stations."
    examples: [Aldis lamp procedure, heliograph, station procedure]
    status: live
  - id: tap-codes
    name: Tap and Knock Codes
    kind: craft
    scope: "Communicating by taps through walls or pipes: the 5x5 tap code, abbreviation conventions and sending under constraint."
    examples: [5x5 grid, abbreviation conventions, covert pacing]
    status: live
  - id: ground-and-smoke-signals
    name: Ground and Smoke Signals
    kind: craft
    scope: "Visual distress and field signalling: ground-to-air symbols, smoke signalling, mirror flashes and body-signal conventions for search and rescue."
    examples: [ground-to-air symbols, signal mirrors, smoke signals]
    status: live
  - id: radio-voice-procedure
    name: Phonetic Alphabets and Voice Procedure
    kind: craft
    scope: "Spoken coded communication: the NATO phonetic alphabet, prowords, message formats and readability conventions for voice channels."
    examples: [NATO alphabet, prowords, message format, radio checks]
    status: live
