# Products are script-skill areas, not one product per script (learning Cyrillic or Devanagari
# lives under script-acquisition, tagged by script); logographic systems get their own product
# because the learning craft is genuinely different. Calligraphy as visual art is creative-arts;
# the script-system side is here.
category: languages-linguistics
field: writing-systems-and-scripts
products:
  - id: script-acquisition
    name: Script Acquisition
    kind: craft
    scope: "Learning to read and write a new alphabet, abjad or abugida: letterform recognition, handwriting, diacritics and reading-speed building."
    examples: [Cyrillic literacy, Arabic script, Devanagari, hangul]
    status: live
  - id: logographic-literacy
    name: Logographic Literacy
    kind: craft
    scope: "Learning character-based writing: hanzi/kanji component analysis, stroke order, radical-based lookup and long-term retention systems."
    examples: [radical analysis, stroke order, kanji retention, character lookup]
    status: live
  - id: transliteration-romanisation
    name: Transliteration and Romanisation
    kind: craft
    scope: "Converting text between scripts: standard romanisation systems, reversible transliteration and choosing a scheme for a purpose."
    examples: [pinyin, Hepburn, ISO transliteration, scheme selection]
    status: live
  - id: orthography-design
    name: Orthography Design
    kind: craft
    scope: "Designing or reforming how a language is written: grapheme-phoneme mapping, script choice for unwritten languages and spelling-reform trade-offs."
    examples: [grapheme-phoneme mapping, script selection, spelling reform]
    status: live
  - id: script-decipherment
    name: Script Decipherment
    kind: craft
    scope: "Analysing undeciphered and historical scripts: sign inventories, frequency and positional analysis, bilingual anchors and decipherment method."
    examples: [sign inventories, frequency analysis, bilingual anchors, Linear B method]
    status: live
  - id: shorthand
    name: Shorthand Systems
    kind: craft
    scope: "Writing and reading pen shorthand: Gregg, Pitman and Teeline outlines, speed building and transcribing shorthand notes back to longhand."
    examples: [Teeline outlines, Gregg forms, speed building, note transcription]
    status: live
  - id: non-script-records
    name: Non-Script Record Systems
    kind: craft
    scope: "Reading and making non-script recording systems: quipu knot records, tally systems and other structured records that encode information without writing."
    examples: [quipu structure, tally sticks, pictographic records]
    status: live
  - id: calligraphic-script-forms
    name: Calligraphic Script Forms
    kind: craft
    scope: "Scripts whose standard forms are calligraphic: reading and producing the formal hands of a tradition as writing-system literacy, not decorative art."
    examples: [Arabic calligraphic hands, Chinese script styles, blackletter literacy]
    status: live
