# Major sign languages named where their communities and materials are distinct (ASL, BSL);
# other national sign languages fall under sign-language-acquisition until one earns its own
# product. Sign-language interpreting lives in the interpreting field.
category: languages-linguistics
field: sign-language
products:
  - id: asl
    name: American Sign Language
    kind: craft
    scope: "Using and learning ASL: core vocabulary and grammar, non-manual markers, classifiers and regional variation."
    examples: [ASL grammar, classifiers, non-manual markers, regional signs]
    status: live
  - id: bsl
    name: British Sign Language
    kind: craft
    scope: "Using and learning BSL: vocabulary, grammar, two-handed fingerspelling and the BSL qualification ladder."
    examples: [BSL grammar, two-handed fingerspelling, placement, BSL levels]
    status: live
  - id: sign-language-acquisition
    name: Sign Language Acquisition
    kind: craft
    scope: "Methods for learning any signed language: receptive skills, production practice, spatial grammar and learning from Deaf signers."
    examples: [receptive training, spatial grammar, production practice, learning etiquette]
    status: live
  - id: fingerspelling
    name: Fingerspelling
    kind: craft
    scope: "Fluent fingerspelling production and reception: manual alphabets, lexicalised fingerspelling and speed-reading fingerspelled words."
    examples: [manual alphabets, receptive speed, lexicalised signs]
    status: live
  - id: international-sign
    name: International Sign
    kind: craft
    scope: "Cross-national signed communication: International Sign conventions and strategies for signing across sign-language boundaries."
    examples: [IS conventions, cross-linguistic strategies, conference IS]
    status: live
  - id: tactile-signing
    name: Tactile and Protactile Signing
    kind: craft
    scope: "Signed communication with DeafBlind people: tactile adaptation of sign languages, protactile principles and backchanneling by touch."
    examples: [tactile ASL, protactile, touch backchanneling, guiding conventions]
    status: live
  - id: deaf-community-norms
    name: Deaf Community Communication Norms
    kind: craft
    scope: "Communicating appropriately in Deaf spaces: attention-getting, turn-taking, name signs and Deaf cultural conventions."
    examples: [attention-getting, name signs, turn-taking, Deaf-space etiquette]
    status: live
  - id: sign-linguistics
    name: Sign Language Linguistics
    kind: craft
    scope: "Analysing signed languages as languages: phonology of handshape and movement, sign morphology, syntax and notation systems."
    examples: [handshape phonology, sign notation, verb agreement, corpus annotation]
    status: live
