category: media-communication
field: technical-writing
products:
  - id: api-documentation
    name: API Documentation
    kind: craft
    scope: "Documenting programmatic interfaces: reference pages, quickstarts, code samples that run, OpenAPI-driven docs and versioned changes."
    examples: [reference structure, quickstarts, runnable samples, changelog discipline]
    status: live
  - id: end-user-documentation
    name: End-User Documentation
    kind: craft
    scope: "Manuals and help for product users: task-based topics, screenshots and callouts, help-centre structure, writing for non-experts."
    examples: [task-based topics, help-centre IA, screenshot standards, plain-language rewrites]
    status: live
  - id: process-documentation
    name: Process and Procedure Documentation
    kind: craft
    scope: "Writing SOPs, runbooks and work instructions: step accuracy, decision points, compliance-ready structure, keeping procedures current."
    examples: [SOP structure, runbooks, work instructions, review cycles]
    status: live
  - id: white-papers-and-reports
    name: White Papers and Reports
    kind: craft
    scope: "Long-form professional documents: white papers, technical reports and briefs — argument structure, evidence handling, executive summaries."
    examples: [white-paper structure, executive summaries, evidence presentation, technical briefs]
    status: live
  - id: style-guides
    name: Style Guides and Terminology
    kind: craft
    scope: "Keeping a documentation set consistent: house style guides, terminology management, voice and tone rules, linting prose against them."
    examples: [style-guide authoring, terminology bases, voice and tone, prose linting]
    status: live
  - id: ux-writing
    name: UX Writing
    kind: craft
    scope: "The words inside the product: microcopy, error messages, empty states, labels and flows written with the design team."
    examples: [microcopy, error messages, empty states, label consistency]
    status: live
  - id: docs-as-code
    name: Docs-as-Code Toolchains
    kind: application
    scope: "Documentation toolchains as a class (Sphinx, MkDocs, Docusaurus, AsciiDoc; Markdown in git with CI): site structure, versioning, build and publish pipelines."
    examples: [MkDocs setup, versioned docs, CI publishing, migration between generators]
    status: live
