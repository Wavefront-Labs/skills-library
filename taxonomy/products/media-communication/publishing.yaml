category: media-communication
field: publishing
products:
  - id: acquisitions-editing
    name: Acquisitions Editing
    kind: craft
    scope: "Deciding what gets published: evaluating submissions and proposals, P&L cases, author negotiation and list building."
    examples: [manuscript evaluation, P&L cases, list strategy, author negotiation]
    status: live
  - id: copyediting
    name: Copyediting
    kind: craft
    scope: "Editing copy for correctness and house style: grammar, consistency, style-sheet keeping and querying authors without rewriting them."
    examples: [house style, style sheets, author queries, consistency passes]
    status: live
  - id: proofreading
    name: Proofreading
    kind: craft
    scope: "The last pass before print or release: reading proofs against copy, standard proof marks, catching typesetting and layout errors."
    examples: [proof marks, press checks, cold reads, layout error catching]
    status: live
  - id: production-editing
    name: Production Editing
    kind: craft
    scope: "Shepherding a title from final manuscript to printed and digital product: schedules, typesetting rounds, vendor management, print specs."
    examples: [production schedules, typesetting rounds, print specs, vendor handoff]
    status: live
  - id: rights-and-permissions
    name: Rights and Permissions
    kind: craft
    scope: "Trading and clearing publishing rights: subsidiary and translation rights, permissions requests, territory and licence terms."
    examples: [translation rights, permissions clearance, territory deals, licence terms]
    status: live
  - id: indexing
    name: Indexing
    kind: craft
    scope: "Writing back-of-book and embedded indexes: term selection, cross-references, locator accuracy and index structure readers can actually use."
    examples: [term selection, cross-references, embedded indexing, index editing]
    status: live
  - id: indesign
    name: Adobe InDesign
    kind: application
    scope: "Page layout and typesetting in InDesign: master pages, styles, long-document tools, preflight and export to print PDF and EPUB."
    examples: [master pages, paragraph styles, preflight, EPUB export]
    status: live
  - id: ebook-production
    name: Ebook Production
    kind: application
    scope: "Building and distributing digital editions with the EPUB/Kindle toolchain as a class (Sigil, Calibre, Kindle Previewer): markup, validation, retailer delivery."
    examples: [EPUB markup, validation, Kindle conversion, retailer delivery]
    status: live
