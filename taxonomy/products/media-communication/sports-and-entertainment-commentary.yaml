category: media-communication
field: sports-and-entertainment-commentary
products:
  - id: play-by-play
    name: Play-by-Play Commentary
    kind: craft
    scope: "Calling live action as it happens: identification at speed, pace and excitement control, scene-setting, working to broadcast cues."
    examples: [action calling, name identification, excitement control, broadcast cues]
    status: live
  - id: colour-commentary
    name: Colour Commentary and Analysis
    kind: craft
    scope: "The expert chair: adding analysis between the action, telestration and replay breakdowns, chemistry with the lead commentator."
    examples: [replay analysis, tactical insight, booth chemistry, concise analysis windows]
    status: live
  - id: commentary-preparation
    name: Commentary Preparation
    kind: craft
    scope: "The homework behind the call: spotter charts and boards, stats and storyline prep, pronunciation research, prep that surfaces naturally on air."
    examples: [spotter boards, storyline prep, pronunciation research, stat packs]
    status: live
  - id: event-hosting
    name: Event Hosting and Studio Presentation
    kind: craft
    scope: "Fronting the show around the event: pre/post-show hosting, panel moderation, throws and handovers, filling when schedules slip."
    examples: [pre-show hosting, panel moderation, handovers, filling time]
    status: live
  - id: esports-commentary
    name: Esports Casting
    kind: craft
    scope: "Casting competitive games: reading fast game states, play-by-play/analyst duos for game audiences, online event formats and co-streaming norms."
    examples: [game-state reading, caster duos, online event formats, hype management]
    status: live
