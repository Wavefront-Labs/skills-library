category: media-communication
field: scientific-and-medical-communication
products:
  - id: science-journalism
    name: Science Journalism
    kind: craft
    scope: "Reporting science for general audiences: reading papers critically, interviewing researchers, uncertainty and risk framing, avoiding hype."
    examples: [paper appraisal, researcher interviews, uncertainty framing, hype avoidance]
    status: live
  - id: lay-summaries
    name: Lay and Plain-Language Summaries
    kind: craft
    scope: "Translating technical findings for non-specialists: plain-language summaries of trials and papers, patient-facing explanations, readability standards."
    examples: [trial lay summaries, patient-facing text, readability levels, accuracy under simplification]
    status: live
  - id: conference-and-publication-writing
    name: Conference Abstracts and Publication Support
    kind: craft
    scope: "Non-promotional medical writing for professional audiences: conference abstracts and posters, manuscript support, GPP and authorship standards."
    examples: [abstract writing, poster content, manuscript support, GPP compliance]
    status: live
  - id: msl-engagement
    name: Medical Science Liaison Engagement
    kind: craft
    scope: "The MSL's scientific exchange with clinicians: KOL conversations under medical-affairs sign-off, responding to unsolicited questions, insight gathering — strictly non-promotional."
    examples: [KOL conversations, unsolicited-request responses, insight capture, compliance boundaries]
    status: live
  - id: medical-education-content
    name: Medical Education Content
    kind: craft
    scope: "Regulatory-neutral education for health professionals: CME/CPD materials, slide decks and modules under medical (not promotional) sign-off, fair-balance presentation."
    examples: [CME modules, education slide decks, fair balance, needs assessments]
    status: live
  - id: public-science-engagement
    name: Public Science Engagement
    kind: craft
    scope: "Science communication direct to the public: talks and explainers, museum and festival content, social-media science communication, misinformation-aware framing."
    examples: [public talks, explainer writing, festival content, misinformation-aware framing]
    status: live
