category: media-communication
field: library-and-archive-science
products:
  - id: metadata-cataloguing
    name: Metadata Cataloguing
    kind: craft
    scope: "Describing items so they can be found: descriptive cataloguing, MARC/RDA and Dublin Core practice, authority control, metadata quality."
    examples: [descriptive cataloguing, MARC/RDA, Dublin Core, authority control]
    status: live
  - id: classification-and-taxonomy
    name: Classification and Taxonomy
    kind: craft
    scope: "Organising knowledge into schemes: Dewey/LCC classification, building controlled vocabularies, thesauri and subject taxonomies."
    examples: [DDC/LCC classification, controlled vocabularies, thesaurus construction, subject analysis]
    status: live
  - id: information-architecture
    name: Information Architecture
    kind: craft
    scope: "Structuring information spaces for findability: site and intranet IA, navigation and labelling systems, card sorting, search tuning."
    examples: [navigation design, labelling systems, card sorting, findability testing]
    status: live
  - id: digital-preservation
    name: Digital Preservation
    kind: craft
    scope: "Keeping digital materials usable over decades: format migration, fixity and checksums, OAIS-model workflows, web archiving."
    examples: [format migration, fixity checking, OAIS workflows, web archiving]
    status: live
  - id: records-management
    name: Records Management
    kind: craft
    scope: "Governing an organisation's records: retention schedules, disposition, compliance holds, filing systems and records policy."
    examples: [retention schedules, disposition, legal holds, records policy]
    status: live
  - id: reference-services
    name: Reference and Research Services
    kind: craft
    scope: "Helping people find what they need: the reference interview, search strategy across databases, teaching information literacy."
    examples: [reference interviews, database search strategy, information literacy, literature-search help]
    status: live
  - id: library-systems
    name: Library and Archive Systems
    kind: application
    scope: "The systems the work runs on, as a class (Koha, Alma, ArchivesSpace, DSpace, Omeka): configuration, cataloguing modules, circulation, digital collections."
    examples: [ILS configuration, ArchivesSpace workflows, DSpace repositories, digital-collection publishing]
    status: live
