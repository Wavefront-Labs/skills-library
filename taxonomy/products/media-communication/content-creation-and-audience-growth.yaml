category: media-communication
field: content-creation-and-audience-growth
products:
  - id: wordpress
    name: WordPress
    kind: application
    scope: "Publishing with WordPress as a CMS: editorial workflow in the block editor, themes and plugins for publishing, categories/tags, SEO and performance plugins."
    examples: [block editor workflow, plugin selection, taxonomy setup, publishing automation]
    status: live
  - id: substack
    name: Substack and Newsletter Platforms
    kind: application
    scope: "Publishing on Substack and its peers (Ghost, Beehiiv, Buttondown): newsletter setup, recommendations and growth features, deliverability, migrations."
    examples: [publication setup, recommendations network, deliverability, platform migration]
    status: live
  - id: cms-platforms
    name: CMS Platforms
    kind: application
    scope: "Editorial content management systems as a class beyond WordPress (Drupal, Contentful, Sanity, newsroom CMSes): content modelling, editorial workflow, multi-channel publishing."
    examples: [content modelling, editorial workflow, headless publishing, CMS selection]
    status: live
  - id: editorial-seo
    name: Editorial SEO
    kind: craft
    scope: "Making editorial content findable: search intent for stories, keyword-informed headlines, evergreen updates, structured data and topical authority."
    examples: [search intent, evergreen refreshes, structured data, topic clusters]
    status: live
  - id: newsletter-growth
    name: Newsletter Growth
    kind: craft
    scope: "Growing an email audience with nothing sold: signup funnels, welcome sequences, open/click reading, list hygiene and cross-promotion."
    examples: [signup funnels, welcome sequences, list hygiene, cross-promotion]
    status: live
  - id: content-planning
    name: Content Planning and Calendars
    kind: craft
    scope: "Deciding what to publish when: editorial calendars, series and format design, cadence, repurposing one piece across channels."
    examples: [editorial calendars, format design, cadence setting, repurposing]
    status: live
  - id: platform-distribution
    name: Platform Distribution and Algorithm Literacy
    kind: craft
    scope: "Getting editorial content seen on feeds: how each platform's ranking rewards and punishes, packaging per platform, posting strategy, surviving algorithm changes."
    examples: [feed ranking literacy, per-platform packaging, posting strategy, algorithm-change response]
    status: live
  - id: audience-analytics
    name: Audience Analytics
    kind: craft
    scope: "Reading audience data to steer editorial: traffic and retention metrics, cohort reading, deciding what the numbers do and don't justify."
    examples: [retention reading, traffic analysis, cohort interpretation, metric-led commissioning]
    status: live
