    examples: [structure from rushes, interview-driven cuts, ethical cutting, test screenings]
    status: live
  - id: archival-sourcing
    name: Archival Sourcing and Licensing
    kind: craft
    scope: "Finding and clearing existing material: archive research, footage and photo licensing, fair use/dealing judgement, music clearance for nonfiction."
    examples: [archive research, footage licensing, fair-use judgement, clearance budgets]
