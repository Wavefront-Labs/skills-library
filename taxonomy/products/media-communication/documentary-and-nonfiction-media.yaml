category: media-communication
field: documentary-and-nonfiction-media
products:
  - id: documentary-research
    name: Documentary Research and Development
    kind: craft
    scope: "Finding and developing nonfiction stories: subject research, access negotiation, treatments and pitch decks, ethical groundwork with participants."
    examples: [subject research, access negotiation, treatments, participant ethics]
    status: live
  - id: nonfiction-scripting
    name: Nonfiction Scripting
    kind: craft
    scope: "Writing for factual screen and audio: narration scripts, paper edits from transcripts, structure for films built from real material."
    examples: [narration writing, paper edits, transcript structuring, factual accuracy in script]
    status: live
