  - id: audio-documentary
    name: Audio Documentary
    kind: craft
    scope: "Nonfiction storytelling in sound: narrative podcast and radio-feature craft, scene recording, sound-led structure, host narration."
    examples: [narrative podcast structure, scene recording, sound-led storytelling, host narration]
