category: media-communication
field: media-relations-and-press-liaison
products:
  - id: media-pitching
    name: Media Pitching
    kind: craft
    scope: "Selling stories to journalists: pitch writing, outlet and reporter targeting, exclusives vs broad offers, follow-up without burning contacts."
    examples: [pitch emails, reporter targeting, exclusive strategy, follow-up etiquette]
    status: live
  - id: press-office-operations
    name: Press Office Operations
    kind: craft
    scope: "Running the day-to-day press desk: inbound journalist queries, embargo coordination, interview brokering and briefing, on-the-record discipline."
    examples: [inbound query handling, embargo coordination, interview brokering, briefing notes]
    status: live
  - id: press-kits
    name: Press Kits and Materials
    kind: craft
    scope: "Assembling what journalists need: press kits, fact sheets, approved imagery and b-roll, online newsrooms kept current."
    examples: [press-kit assembly, fact sheets, b-roll packages, online newsrooms]
    status: live
  - id: media-monitoring
    name: Media Monitoring and Coverage Analysis
    kind: craft
    scope: "Tracking what's being said: monitoring setups, coverage reports, sentiment and share-of-voice reading, spotting a story about to break."
    examples: [monitoring setup, coverage reports, share of voice, early-warning signals]
    status: live
  - id: media-database-platforms
    name: Media Database Platforms
    kind: application
    scope: "Journalist-database and media-relations platforms as a class (Cision, Muck Rack, Roxhill, Meltwater): list building, distribution, monitoring modules."
    examples: [press-list building, Muck Rack workflows, distribution sends, monitoring modules]
    status: live
