category: media-communication
field: persuasive-messaging
products:
  - id: message-development
    name: Message Development
    kind: craft
    scope: "Crafting the core persuasive message for an audience: framing, values language, message hierarchies and adapting one message across segments."
    examples: [framing, message hierarchies, values language, audience segmentation]
    status: live
  - id: message-testing
    name: Message Testing
    kind: craft
    scope: "Finding out which message actually moves people: polling and focus-group design for messages, A/B message trials, reading results honestly."
    examples: [focus-group design, message polling, A/B trials, uplift reading]
    status: live
  - id: campaign-messaging
    name: Campaign Messaging
    kind: craft
    scope: "Running message discipline across a political, advocacy or public-information campaign: message calendars, surrogate scripts, rapid response."
    examples: [message calendars, surrogate scripts, rapid response, line-to-take drafting]
    status: live
  - id: narrative-strategy
    name: Narrative Strategy
    kind: craft
    scope: "Shaping the larger story a campaign or operation tells over time: narrative arcs, audience worldview mapping, long-horizon theme building."
    examples: [narrative arcs, worldview mapping, theme building, story-of-change design]
    status: live
  - id: propaganda-analysis
    name: Propaganda and Influence Analysis
    kind: craft
    scope: "Reading other people's influence operations: identifying techniques, attribution signals, network and narrative tracking in information operations."
    examples: [technique identification, narrative tracking, network analysis, attribution signals]
    status: live
  - id: counter-messaging
    name: Counter-Messaging
    kind: craft
    scope: "Responding to hostile or false narratives: prebunking and debunking technique, inoculation messaging, choosing when not to amplify."
    examples: [prebunking, debunking formats, inoculation messages, amplification judgement]
    status: live
