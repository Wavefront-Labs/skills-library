category: media-communication
field: broadcasting
products:
  - id: news-anchoring
    name: News Anchoring and Presenting
    kind: craft
    scope: "Presenting television and streaming news: autocue delivery, breaking-news ad-lib, interview segments and handling the gallery in your ear."
    examples: [autocue delivery, breaking-news ad-lib, two-ways, talkback discipline]
    status: live
  - id: radio-presenting
    name: Radio Presenting
    kind: craft
    scope: "Live radio and audio presenting: links, timing to the clock, self-op desk driving, phone-ins and keeping a show moving solo."
    examples: [link writing, backtiming, self-op driving, phone-in handling]
    status: live
  - id: podcast-production
    name: Podcast Production
    kind: craft
    scope: "Making podcasts end to end: show formats, hosting and interview craft for audio, episode editing, publishing and feed management."
    examples: [show format design, episode editing, RSS distribution, interview-show hosting]
    status: live
  - id: live-production
    name: Live Broadcast Production
    kind: craft
    scope: "Producing and directing live output: running orders, gallery calling, timing to the second, and recovering on air when things break."
    examples: [running orders, gallery directing, live timing, on-air recovery]
    status: live
  - id: vision-mixing
    name: Vision Mixing and Switching
    kind: application
    scope: "Operating production switchers and vision mixers as a class (ATEM, TriCaster, broadcast panels): cutting cameras, keys, transitions and playout to a director's calls."
    examples: [camera cutting, keying, ATEM operation, playout rolls]
    status: live
  - id: broadcast-audio
    name: Broadcast Audio Consoles
    kind: application
    scope: "Mixing live broadcast sound on studio and OB consoles as a class (Calrec, Lawo, Wheatstone, radio self-op desks): mic balance, mix-minus, levels to spec."
    examples: [mix-minus setup, mic balancing, loudness compliance, OB audio]
    status: live
  - id: obs
    name: OBS Studio
    kind: application
    scope: "Live streaming and recording with OBS Studio: scenes, sources, encoding settings, stream keys, plugins and multi-platform output."
    examples: [scene setup, encoder settings, stream automation, multi-platform output]
    status: live
  - id: continuity-and-voice
    name: Continuity and Voice Work
    kind: craft
    scope: "On-air continuity, station imaging and announcer reads: junction scripting, promo voicing and keeping a channel's voice consistent."
    examples: [junction scripts, promo reads, station imaging, announcer delivery]
    status: live
