category: media-communication
field: online-community-management
products:
  - id: moderation-policy
    name: Moderation Policy and Guidelines
    kind: craft
    scope: "Writing the rules a community runs on: conduct guidelines, enforcement ladders, appeals, edge-case precedent and policy updates."
    examples: [community guidelines, enforcement ladders, appeals design, precedent keeping]
    status: live
  - id: frontline-moderation
    name: Frontline Moderation
    kind: craft
    scope: "Enforcing the rules day to day: queue triage, consistent calls under volume, de-escalation in threads, escalation of threats and legal risk."
    examples: [queue triage, consistent enforcement, thread de-escalation, escalation handling]
    status: live
  - id: community-engagement
    name: Community Engagement and Programming
    kind: craft
    scope: "Making a community worth being in: onboarding, rituals and events, AMAs, surfacing members' work, reviving quiet spaces."
    examples: [onboarding flows, community events, AMA hosting, engagement rituals]
    status: live
  - id: community-health
    name: Community Health and Growth
    kind: craft
    scope: "Reading and steering a community over time: health metrics, lifecycle stages, scaling volunteer mod teams, managing splits and raids."
    examples: [health metrics, volunteer-mod scaling, lifecycle management, raid response]
    status: live
  - id: discord
    name: Discord
    kind: application
    scope: "Running communities on Discord: server architecture, roles and permissions, moderation bots and automod, onboarding and events features."
    examples: [server architecture, role permissions, automod setup, bot tooling]
    status: live
  - id: forum-platforms
    name: Forum and Community Platforms
    kind: application
    scope: "Community platforms as a class (Discourse, Reddit's mod tooling, Circle, Facebook Groups): platform-specific moderation tools, configuration and norms."
    examples: [Discourse configuration, subreddit mod tooling, group settings, platform norms]
    status: live
