category: media-communication
field: journalism
products:
  - id: interviewing
    name: Interviewing
    kind: craft
    scope: "Getting people to tell you things on the record: preparation, question design, rapport, hostile and reluctant subjects, on/off-record ground rules."
    examples: [question design, hostile interviews, off-record negotiation, accountability interviews]
    status: live
  - id: fact-checking
    name: Fact-Checking
    kind: craft
    scope: "Verifying claims before and after publication: sourcing standards, document and image verification, checking copy line by line, corrections practice."
    examples: [claim verification, primary-source tracing, pre-publication checks, corrections policy]
    status: live
  - id: news-writing
    name: News Writing
    kind: craft
    scope: "Writing hard news to deadline: ledes, inverted pyramid, attribution, wire style and tight copy under time pressure."
    examples: [lede writing, inverted pyramid, attribution, deadline rewrites]
    status: live
  - id: headline-writing
    name: Headline and Display Copy
    kind: craft
    scope: "Writing headlines, standfirsts, captions and push alerts that are accurate, findable and clicked: print heads, SEO heads, A/B-tested variants."
    examples: [news headlines, SEO headlines, standfirsts, push-alert copy]
    status: live
  - id: feature-writing
    name: Feature Writing
    kind: craft
    scope: "Long-form and narrative journalism: profiles, scene reconstruction, structure, voice and the reporting that feeds them."
    examples: [profiles, narrative structure, scene reconstruction, long-form pacing]
    status: live
  - id: investigative-reporting
    name: Investigative Reporting
    kind: craft
    scope: "Sustained accountability investigations: public-records requests, document analysis, source protection, legal review and bulletproofing a story."
    examples: [FOI requests, document analysis, source protection, story bulletproofing]
    status: live
  - id: beat-reporting
    name: Beat Reporting
    kind: craft
    scope: "Owning a patch over time: building a contact book, reading the beat's documents and data, spotting stories competitors miss."
    examples: [source cultivation, beat mapping, agenda scanning, exclusive development]
    status: live
  - id: data-journalism
    name: Data Journalism
    kind: craft
    scope: "Finding and telling stories in datasets: acquiring and cleaning data, analysis that survives scrutiny, and turning numbers into accurate copy and graphics briefs."
    examples: [data acquisition, bulletproof analysis, FOI datasets, visualisation briefs]
    status: live
  - id: news-editing
    name: News Editing
    kind: craft
    scope: "Running copy and the desk: story selection, assigning, editing reporters' copy for accuracy and legal risk, news judgement."
    examples: [copy editing, story selection, legal-risk reading, newsroom assigning]
    status: live
