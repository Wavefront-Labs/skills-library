# Coverage spec: hugo. Topics from the Hugo docs (gohugoio/hugoDocs).
subject: hugo
scope:
  category: computing-software
  field: web-development
  products: [hugo]
sources:
  - "Hugo docs (github.com/gohugoio/hugoDocs)"
topics:
  - id: quick-start
    name: "Quick start: create and serve a site"
    source: "https://gohugo.io/getting-started/quick-start/"
    match: [quick-start, new-project, first-post]
  - id: project-directory-structure
    name: "Directory structure and unified file system"
    source: "https://gohugo.io/getting-started/directory-structure/"
    match: [directory-structure, project-layout, unified-file-system]
  - id: build-and-serve-commands
    name: "Build and serve commands"
    source: "https://gohugo.io/getting-started/quick-start/"
    match: [hugo-build, hugo-server, livereload]
  - id: config-files-and-merge
    name: "Configuration files, directories and merge"
    source: "https://gohugo.io/configuration/introduction/"
    match: [configuration, hugo-toml, config-directory, merge-strategy]
  - id: build-config-and-stats
    name: "Build configuration and build stats"
    source: "https://gohugo.io/configuration/build/"
    match: [build-config, build-stats, hugo-stats-json, cachebusters]
  - id: file-caches
    name: "File caches"
    source: "https://gohugo.io/configuration/caches/"
    match: [caches, file-cache, maxage]
  - id: cascade
    name: "Cascade front matter"
    source: "https://gohugo.io/configuration/cascade/"
    match: [cascade, page-matcher]
  - id: menus-config
    name: "Menus in site configuration"
    source: "https://gohugo.io/configuration/menus/"
    match: [menus, menu-entries, pageref]
  - id: markup-goldmark-config
    name: "Markup and Goldmark configuration"
    source: "https://gohugo.io/configuration/markup/"
    match: [markup, goldmark, typographer]
  - id: module-config
    name: "Module configuration"
    source: "https://gohugo.io/configuration/module/"
    match: [module-config, mounts, replacements]
  - id: output-formats
    name: "Custom output formats and media types"
    source: "https://gohugo.io/configuration/output-formats/"
    match: [output-formats, media-types, atom-feed]
  - id: outputs-per-page-kind
    name: "Outputs per page kind"
    source: "https://gohugo.io/configuration/outputs/"
    match: [outputs, page-kinds, primary-output-format]
  - id: site-params
    name: "Site parameters"
    source: "https://gohugo.io/configuration/params/"
    match: [site-params, custom-parameters]
  - id: permalinks-config
    name: "Permalinks configuration"
    source: "https://gohugo.io/configuration/permalinks/"
    match: [permalinks, url-patterns]
  - id: related-content
    name: "Related content configuration"
    source: "https://gohugo.io/configuration/related-content/"
    match: [related-content, indices, tokenize]
  - id: security-policy
    name: "Security policy"
    source: "https://gohugo.io/configuration/security/"
    match: [security, allowlist, exec-allow]
  - id: dev-server-config
    name: "Development server configuration"
    source: "https://gohugo.io/configuration/server/"
    match: [server-config, dev-server, spa-rewrite]
  - id: sitemap-config
    name: "Sitemap configuration"
    source: "https://gohugo.io/configuration/sitemap/"
    match: [sitemap, changefreq, sitemap-xml]
  - id: taxonomies-config
    name: "Taxonomies configuration"
    source: "https://gohugo.io/configuration/taxonomies/"
    match: [taxonomies-config, singular-plural]
  - id: ugly-urls
    name: "Ugly URLs"
    source: "https://gohugo.io/configuration/ugly-urls/"
    match: [ugly-urls, pretty-urls, html-extension]
  - id: languages-config
    name: "Languages configuration"
    source: "https://gohugo.io/configuration/languages/"
    match: [languages, multilingual-config, default-content-language]
  - id: render-segments
    name: "Render segments"
    source: "https://gohugo.io/configuration/segments/"
    match: [segments, render-segments, partial-build]
  - id: archetypes
    name: "Archetypes"
    source: "https://gohugo.io/content-management/archetypes/"
    match: [archetypes, hugo-new-content, front-matter-template]
  - id: page-bundles
    name: "Page bundles"
    source: "https://gohugo.io/content-management/page-bundles/"
    match: [page-bundles, leaf-bundle, branch-bundle]
  - id: page-resources
    name: "Page resources"
    source: "https://gohugo.io/content-management/page-resources/"
    match: [page-resources, resources-get, resources-metadata]
  - id: sections
    name: "Sections"
    source: "https://gohugo.io/content-management/sections/"
    match: [sections, subsections, breadcrumbs]
  - id: shortcodes-in-content
    name: "Using shortcodes in content"
    source: "https://gohugo.io/content-management/shortcodes/"
    match: [shortcodes, shortcode-arguments, inline-shortcodes]
  - id: content-summaries
    name: "Content summaries"
    source: "https://gohugo.io/content-management/summaries/"
    match: [summaries, more-divider, summarylength]
  - id: syntax-highlighting
    name: "Syntax highlighting"
    source: "https://gohugo.io/content-management/syntax-highlighting/"
    match: [syntax-highlighting, chroma, hl-lines]
  - id: taxonomies-content
    name: "Taxonomies and terms in content"
    source: "https://gohugo.io/content-management/taxonomies/"
    match: [taxonomies, terms, getterms]
  - id: url-slug-and-aliases
    name: "URLs, slugs and aliases"
    source: "https://gohugo.io/content-management/urls/"
    match: [urls, slug, aliases]
  - id: multilingual-content
    name: "Multilingual content and translations"
    source: "https://gohugo.io/content-management/multilingual/"
    match: [multilingual, translations, translationkey]
  - id: image-processing
    name: "Image processing"
    source: "https://gohugo.io/content-management/image-processing/"
    match: [image-processing, resize, image-cache]
  - id: content-adapters
    name: "Content adapters"
    source: "https://gohugo.io/content-management/content-adapters/"
    match: [content-adapters, content-gotmpl, addpage]
  - id: math-in-markdown
    name: "Mathematical notation"
    source: "https://gohugo.io/content-management/mathematics/"
    match: [mathematics, latex, katex]
  - id: diagrams
    name: "Diagrams with Mermaid and GoAT"
    source: "https://gohugo.io/content-management/diagrams/"
    match: [diagrams, mermaid, goat]
  - id: front-matter-fields
    name: "Front matter fields"
    source: "https://gohugo.io/content-management/front-matter/"
    match: [front-matter, reserved-fields]
  - id: content-build-options
    name: "Content build options"
    source: "https://gohugo.io/content-management/build-options/"
    match: [build-options, headless, list-render]
  - id: template-lookup-order
    name: "Template lookup order"
    source: "https://gohugo.io/templates/lookup-order/"
    match: [template-lookup, layout, page-kind]
  - id: template-types
    name: "Template types"
    source: "https://gohugo.io/templates/types/"
    match: [templates, baseof, layouts-directory]
  - id: go-template-basics
    name: "Introduction to Go templates"
    source: "https://gohugo.io/templates/introduction/"
    match: [go-templates, variables, whitespace]
  - id: menu-templates
    name: "Menu templates"
    source: "https://gohugo.io/templates/menu/"
    match: [menu-templates, ismenucurrent, hasmenucurrent]
  - id: pagination
    name: "Pagination"
    source: "https://gohugo.io/templates/pagination/"
    match: [pagination, paginator, pager]
  - id: shortcode-templates
    name: "Shortcode templates"
    source: "https://gohugo.io/templates/shortcode/"
    match: [shortcode-templates, inner, isnamedparams]
  - id: error-404-template
    name: "404 page template"
    source: "https://gohugo.io/templates/404/"
    match: [404-page, error-template]
  - id: rss-feeds
    name: "RSS templates"
    source: "https://gohugo.io/templates/rss/"
    match: [rss, feeds, rss-template]
  - id: robots-txt
    name: "robots.txt"
    source: "https://gohugo.io/templates/robots/"
    match: [robots-txt, enablerobotstxt]
  - id: embedded-partials
    name: "Embedded partial templates"
    source: "https://gohugo.io/templates/embedded/"
    match: [embedded-templates, opengraph, schema]
  - id: render-hooks-overview
    name: "Render hooks overview"
    source: "https://gohugo.io/render-hooks/introduction/"
    match: [render-hooks, markup-templates, per-kind-hooks]
  - id: render-hook-images
    name: "Image render hooks"
    source: "https://gohugo.io/render-hooks/images/"
    match: [render-hook-image, render-image, embedded-image-hook]
  - id: render-hook-links
    name: "Link render hooks"
    source: "https://gohugo.io/render-hooks/links/"
    match: [render-hook-link, render-link, embedded-link-hook]
  - id: render-hook-headings
    name: "Heading render hooks"
    source: "https://gohugo.io/render-hooks/headings/"
    match: [render-hook-heading, render-heading, heading-anchors]
  - id: render-hook-code-blocks
    name: "Code block render hooks"
    source: "https://gohugo.io/render-hooks/code-blocks/"
    match: [render-hook-codeblock, render-codeblock, language-specific-hooks]
  - id: render-hook-blockquotes
    name: "Blockquote render hooks and alerts"
    source: "https://gohugo.io/render-hooks/blockquotes/"
    match: [render-hook-blockquote, alerts, callouts]
  - id: sass
    name: "Transpile Sass to CSS"
    source: "https://gohugo.io/functions/css/sass/"
    match: [sass, css-sass, dart-sass]
  - id: postcss
    name: "Process CSS with PostCSS"
    source: "https://gohugo.io/functions/css/postcss/"
    match: [postcss, css-postcss, autoprefixer]
  - id: tailwind-css
    name: "Tailwind CSS"
    source: "https://gohugo.io/functions/css/tailwindcss/"
    match: [tailwind, css-tailwindcss, templates-defer]
  - id: js-build
    name: "Bundle JavaScript with js.Build"
    source: "https://gohugo.io/functions/js/build/"
    match: [js-build, esbuild, typescript]
  - id: fingerprint
    name: "Fingerprinting and SRI"
    source: "https://gohugo.io/functions/resources/fingerprint/"
    match: [fingerprint, cache-busting, subresource-integrity]
  - id: minify-and-concat
    name: "Minify and concatenate resources"
    source: "https://gohugo.io/functions/resources/minify/"
    match: [minify, concat, resources-concat]
  - id: get-remote-resources
    name: "Remote resources with resources.GetRemote"
    source: "https://gohugo.io/functions/resources/getremote/"
    match: [resources-getremote, remote-data, try-statement]
  - id: resources-from-string
    name: "Resources from strings"
    source: "https://gohugo.io/functions/resources/fromstring/"
    match: [resources-fromstring, execute-as-template, generated-files]
  - id: partial-caching
    name: "Cached partials"
    source: "https://gohugo.io/functions/partials/includecached/"
    match: [partialcached, partials-includecached, variant-cache-key]
  - id: where-filter
    name: "Filtering collections with where"
    source: "https://gohugo.io/functions/collections/where/"
    match: [where, collections-where, page-filtering]
  - id: hugo-modules-basics
    name: "Use Hugo Modules"
    source: "https://gohugo.io/hugo-modules/use-modules/"
    match: [hugo-mod, go-mod, vendoring]
  - id: github-pages-deploy
    name: "Deploy to GitHub Pages"
    source: "https://gohugo.io/host-and-deploy/deploy-to-github-pages/"
    match: [github-pages, github-actions, ci-deploy]
  - id: hugo-deploy-cloud-buckets
    name: "Deploy with hugo deploy"
    source: "https://gohugo.io/host-and-deploy/deploy-with-hugo-deploy/"
    match: [hugo-deploy, s3, azure-blob, google-cloud-storage]
  - id: template-performance-metrics
    name: "Template performance metrics"
    source: "https://gohugo.io/troubleshooting/performance/"
    match: [template-metrics, performance, cache-potential]
  - id: inspect-data-in-templates
    name: "Inspecting data in templates"
    source: "https://gohugo.io/troubleshooting/inspection/"
    match: [debug-dump, printf, warnf]
