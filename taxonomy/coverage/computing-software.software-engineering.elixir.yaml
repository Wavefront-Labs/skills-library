      - {id: elixir-deps-hex-hex-deps, name: "Declaring dependencies and version requirements", match: [hex-deps]}
      - {id: elixir-deps-hex-hex-publish, name: "Publishing a package to Hex", match: [hex-publish]}
  - id: elixir-umbrella
    name: "Umbrella and multi-app projects"
    source: "Elixir umbrella projects, in_umbrella"
    match: [elixir-umbrella]
    subtopics:
      - {id: elixir-umbrella-umbrella-apps, name: "Umbrella projects", match: [umbrella-apps]}
  - id: elixir-testing
    name: "Testing with ExUnit"
    source: "ExUnit documentation, Mox, StreamData"
    match: [elixir-testing]
    subtopics:
      - {id: elixir-testing-exunit-basics, name: "ExUnit tests, assertions and describe", match: [exunit-basics]}
      - {id: elixir-testing-exunit-setup-tags, name: "setup, tags, async and context", match: [exunit-setup-tags]}
      - {id: elixir-testing-mocks-mox, name: "Mocking with Mox and behaviours", match: [mocks-mox]}
      - {id: elixir-testing-property-testing, name: "Property-based testing with StreamData", match: [property-testing]}
  - id: elixir-releases
    name: "Releases and deployment"
