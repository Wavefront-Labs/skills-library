  - id: elixir-config
    name: "Configuration"
    source: "Elixir Config module, Application env, runtime.exs"
    match: [elixir-config]
    subtopics:
      - {id: elixir-config-runtime-config, name: "config.exs, runtime.exs and Application.get_env", match: [runtime-config]}
  - id: elixir-mix-build
