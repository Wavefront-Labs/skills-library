    source: "Erlang/OTP ETS, persistent_term, Elixir :ets usage"
    match: [elixir-ets]
    subtopics:
      - {id: elixir-ets-ets-tables, name: "ETS tables: types, access and ownership", match: [ets-tables]}
      - {id: elixir-ets-ets-alternatives, name: "persistent_term, DETS and Mnesia choices", match: [ets-alternatives]}
  - id: elixir-distribution
    name: "Distribution and clustering"
    source: "Erlang distribution protocol, Node, :erpc, :pg"
    match: [elixir-distribution]
    subtopics:
      - {id: elixir-distribution-distributed-nodes, name: "Nodes, cookies and connecting", match: [distributed-nodes]}
