# Canonical coverage spec: Elixir language and ecosystem.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: elixir-language
scope:
  category: computing-software
  field: software-engineering
  products: [elixir]
sources:
  - "Elixir documentation (hexdocs.pm/elixir) - Getting Started guides, Kernel, Enum, Stream, String, Map, Process, Task, Agent, Typespecs, Writing Documentation, Naming Conventions, Library and Code/Design/Process anti-patterns guides"
  - "Erlang/OTP documentation (erlang.org/doc) - GenServer, Supervisor, ETS, Telemetry, kernel and stdlib applications"
  - "Mix and Hex documentation (hexdocs.pm/mix, hex.pm/docs), ExUnit, Ecto and Phoenix documentation"
  - "Credo and mix format documentation and the Elixir community style guide"
topics:
  - id: elixir-basic-types
    name: "Basic types and literals"
    source: "Elixir Getting Started - Basic types"
    match: [elixir-basic-types]
    subtopics:
      - {id: elixir-basic-types-numbers-atoms, name: "Integers, floats and atoms", match: [numbers-atoms]}
      - {id: elixir-basic-types-strings-binaries, name: "Strings, binaries and charlists", match: [strings-binaries]}
      - {id: elixir-basic-types-collection-literals, name: "Tuples, lists and keyword lists", match: [collection-literals]}
  - id: elixir-pattern-matching
    name: "Pattern matching"
    source: "Elixir Getting Started - Pattern matching"
    match: [elixir-pattern-matching]
    subtopics:
      - {id: elixir-pattern-matching-match-operator-pin, name: "The match operator, pin and underscores", match: [match-operator-pin]}
      - {id: elixir-pattern-matching-guards-clauses, name: "Guards and multi-clause matching", match: [guards-clauses]}
  - id: elixir-control-flow
    name: "Control flow"
    source: "Elixir Getting Started - case, cond, and if"
    match: [elixir-control-flow]
    subtopics:
      - {id: elixir-control-flow-case-cond-if, name: "case, cond, if and unless", match: [case-cond-if]}
      - {id: elixir-control-flow-with-expression, name: "The with special form", match: [with-expression]}
  - id: elixir-functions
    name: "Functions"
    source: "Elixir Getting Started - Anonymous functions, Modules and functions"
    match: [elixir-functions]
    subtopics:
      - {id: elixir-functions-anonymous-functions, name: "Anonymous functions and the capture operator", match: [anonymous-functions]}
      - {id: elixir-functions-named-functions, name: "Named functions, defaults and private functions", match: [named-functions]}
      - {id: elixir-functions-recursion-tail, name: "Recursion and tail calls", match: [recursion-tail]}
  - id: elixir-modules
    name: "Modules and directives"
    source: "Elixir Getting Started - Modules, alias, require, import, use"
    match: [elixir-modules]
    subtopics:
      - {id: elixir-modules-alias-import-require, name: "alias, import, require and use", match: [alias-import-require]}
      - {id: elixir-modules-module-attributes, name: "Module attributes and compile-time values", match: [module-attributes]}
      - {id: elixir-modules-structs, name: "Structs", match: [structs]}
  - id: elixir-protocols-behaviours
    name: "Protocols and behaviours"
    source: "Elixir Getting Started - Protocols, behaviours"
    match: [elixir-protocols-behaviours]
    subtopics:
      - {id: elixir-protocols-behaviours-protocols-defimpl, name: "Protocols and implementations", match: [protocols-defimpl]}
      - {id: elixir-protocols-behaviours-behaviours-callbacks, name: "Behaviours and callbacks", match: [behaviours-callbacks]}
  - id: elixir-metaprogramming
    name: "Macros and metaprogramming"
    source: "Elixir Getting Started - Meta-programming, Kernel.SpecialForms"
    match: [elixir-metaprogramming]
    subtopics:
      - {id: elixir-metaprogramming-quote-macros, name: "quote, unquote and macros", match: [quote-macros]}
      - {id: elixir-metaprogramming-sigils, name: "Sigils and custom sigils", match: [sigils]}
  - id: elixir-enum-stream
    name: "Enum, comprehensions and Stream"
    source: "Elixir Enum, Stream and Kernel.SpecialForms for"
    match: [elixir-enum-stream]
    subtopics:
      - {id: elixir-enum-stream-enum-essentials, name: "Enum functions: map, filter, reduce, group_by", match: [enum-essentials]}
      - {id: elixir-enum-stream-comprehensions, name: "for comprehensions", match: [comprehensions]}
      - {id: elixir-enum-stream-stream-lazy, name: "Stream and lazy evaluation", match: [stream-lazy]}
  - id: elixir-collections
    name: "Maps and nested data"
    source: "Elixir Map, MapSet, Access, Keyword"
    match: [elixir-collections]
    subtopics:
      - {id: elixir-collections-map-api, name: "Map and MapSet", match: [map-api]}
      - {id: elixir-collections-nested-access, name: "Nested access: get_in, put_in, update_in", match: [nested-access]}
  - id: elixir-strings-text
    name: "Strings and regular expressions"
    source: "String and Regex modules"
    match: [elixir-strings-text]
    subtopics:
      - {id: elixir-strings-text-string-module, name: "String module: split, replace, trim, normalize", match: [string-module]}
      - {id: elixir-strings-text-regex-usage, name: "Regex: run, scan, named captures", match: [regex-usage]}
  - id: elixir-datetime
    name: "Dates, times and calendars"
    source: "Elixir Calendar, Date, Time, DateTime"
    match: [elixir-datetime]
    subtopics:
      - {id: elixir-datetime-date-time-types, name: "Date, Time, NaiveDateTime and DateTime", match: [date-time-types]}
      - {id: elixir-datetime-time-zones, name: "Time zones with tzdata or tz", match: [time-zones]}
  - id: elixir-typespecs
    name: "Typespecs and static analysis"
    source: "Elixir Typespecs reference, Dialyxir"
    match: [elixir-typespecs]
    subtopics:
      - {id: elixir-typespecs-spec-type, name: "@type, @spec and @typep", match: [spec-type]}
      - {id: elixir-typespecs-dialyzer, name: "Dialyzer with dialyxir", match: [dialyzer]}
  - id: elixir-docs
    name: "Documentation"
    source: "Elixir Writing Documentation guide, ExDoc"
    match: [elixir-docs]
    subtopics:
      - {id: elixir-docs-moduledoc-doctest, name: "@moduledoc, @doc and doctests", match: [moduledoc-doctest]}
      - {id: elixir-docs-exdoc, name: "Generating docs with ExDoc", match: [exdoc]}
  - id: elixir-naming-style
    name: "Naming conventions and formatting"
    source: "Elixir Naming Conventions, mix format, community style guide"
    match: [elixir-naming-style]
    subtopics:
      - {id: elixir-naming-style-naming-conventions, name: "Naming conventions", match: [naming-conventions]}
      - {id: elixir-naming-style-formatter, name: "mix format and .formatter.exs", match: [formatter]}
  - id: elixir-anti-patterns
    name: "Anti-patterns"
    source: "Elixir Library Guidelines and Code, Design, Process, Meta-programming anti-patterns guides"
    match: [elixir-anti-patterns]
    subtopics:
      - {id: elixir-anti-patterns-code-anti-patterns, name: "Code-related anti-patterns", match: [code-anti-patterns]}
      - {id: elixir-anti-patterns-design-anti-patterns, name: "Design-related anti-patterns", match: [design-anti-patterns]}
      - {id: elixir-anti-patterns-process-anti-patterns, name: "Process-related anti-patterns", match: [process-anti-patterns]}
  - id: elixir-errors
    name: "Error handling"
    source: "Elixir try/catch/rescue, exceptions, tagged tuples"
    match: [elixir-errors]
    subtopics:
      - {id: elixir-errors-tagged-tuples, name: "Tagged tuples and {:ok, _}/{:error, _}", match: [tagged-tuples]}
      - {id: elixir-errors-raise-rescue, name: "raise, try/rescue/catch/after", match: [raise-rescue]}
      - {id: elixir-errors-defexception, name: "Custom exceptions with defexception", match: [defexception]}
  - id: elixir-processes
    name: "Processes"
    source: "Elixir Process module, spawn, send and receive"
    match: [elixir-processes]
    subtopics:
      - {id: elixir-processes-spawn-send-receive, name: "spawn, send and receive", match: [spawn-send-receive]}
      - {id: elixir-processes-links-monitors, name: "Links, monitors and trapping exits", match: [links-monitors]}
  - id: elixir-task
    name: "Tasks"
    source: "Elixir Task and Task.Supervisor"
    match: [elixir-task]
    subtopics:
      - {id: elixir-task-task-async, name: "Task.async, await and async_stream", match: [task-async]}
      - {id: elixir-task-task-supervisor, name: "Task.Supervisor for fire-and-forget and isolated work", match: [task-supervisor]}
  - id: elixir-agent
    name: "Agent"
    source: "Elixir Agent"
    match: [elixir-agent]
    subtopics:
      - {id: elixir-agent-agent-state, name: "Agent for simple shared state", match: [agent-state]}
  - id: elixir-genserver
    name: "GenServer"
    source: "Elixir GenServer, Erlang gen_server"
    match: [elixir-genserver]
    subtopics:
      - {id: elixir-genserver-genserver-callbacks, name: "GenServer callbacks: init, call, cast, info", match: [genserver-callbacks]}
      - {id: elixir-genserver-genserver-timeouts, name: "GenServer timeouts, continue and calling pitfalls", match: [genserver-timeouts]}
      - {id: elixir-genserver-genserver-naming, name: "Naming and registering GenServers", match: [genserver-naming]}
  - id: elixir-supervision
    name: "Supervision trees"
    source: "Elixir Supervisor, DynamicSupervisor, Application"
    match: [elixir-supervision]
    subtopics:
      - {id: elixir-supervision-supervisor-strategies, name: "Supervisor strategies and child specs", match: [supervisor-strategies]}
      - {id: elixir-supervision-dynamic-supervisor, name: "DynamicSupervisor and PartitionSupervisor", match: [dynamic-supervisor]}
      - {id: elixir-supervision-application-callback, name: "Application module and the supervision tree root", match: [application-callback]}
  - id: elixir-registry
