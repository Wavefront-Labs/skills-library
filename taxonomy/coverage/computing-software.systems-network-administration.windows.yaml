# Canonical coverage spec: Windows administration (Windows Server, Active Directory, PowerShell).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (the AZ-800 and AZ-801 Windows Server Hybrid
# Administrator skills-measured outlines, the Microsoft Learn Windows Server and AD DS docs tables of
# contents, and the PowerShell docs about_ topics and module reference), not from what we wrote.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (exam objective
# bullets, Learn docs page headings, cmdlet groups in the module reference, about_ topic sections).
# Depth round 2 adds the next level: Microsoft Learn Windows Server and AD DS how-to and troubleshoot
# pages, AZ-800/AZ-801 skill sub-bullets, PowerShell about_ topics and module cmdlet reference pages.
subject: windows-admin
scope:
  category: computing-software
  field: systems-network-administration
  products: [windows-server, active-directory, powershell]
sources:
  - "AZ-800 Administering Windows Server Hybrid Core Infrastructure, skills measured - Deploy and manage AD DS in on-premises and cloud environments (DCs, RODCs, FSMO, trusts, sites, replication, users/groups, gMSA, hybrid identity with Entra Connect/Cloud Sync, Group Policy, password policies); Manage Windows Servers and workloads in a hybrid environment (Windows Admin Center, PowerShell remoting, second-hop, JEA, Azure Arc); Manage virtual machines and containers (Hyper-V, Windows containers); Implement and manage an on-premises and hybrid networking infrastructure (DNS, DHCP, IPAM, VPN/RRAS, SET); Manage storage and file services (file servers, FSRM, Storage Spaces, S2D, Data Deduplication, iSCSI, SMB over QUIC, Azure File Sync)"
  - "AZ-801 Configuring Windows Server Hybrid Advanced Services, skills measured - Secure Windows Server on-premises and hybrid infrastructures (OS hardening, WDAC, Credential Guard, Defender, updates, AD security, LAPS, firewall and IPsec, BitLocker); Implement and manage Windows Server high availability (failover clustering, quorum, CAU, rolling upgrades, SOFS, S2D); Implement disaster recovery (Hyper-V Replica, Windows Server Backup, Azure Site Recovery); Migrate servers and workloads (Storage Migration Service, ADMT, AD DS upgrades, IIS migration); Monitor and troubleshoot Windows Server environments (Performance Monitor, event logs, boot, AD recovery)"
  - "Microsoft Learn Windows Server docs ToC (learn.microsoft.com/windows-server) - Get started/install (Server Core, Desktop Experience, activation), Manage (Windows Admin Center, Server Manager, Remote Server Administration Tools), Identity and access (AD DS, AD CS, AD FS, NPS), Networking (DNS, DHCP, IPAM, Remote Access, SDN), Storage (Storage Spaces, S2D, Storage Replica, File Server, FSRM, Dedup, SMB), Virtualization (Hyper-V, containers), Failover Clustering, Remote Desktop Services, Security (Credential Guard, BitLocker, Windows Defender Firewall), Troubleshooting, Windows Commands reference"
  - "Microsoft Learn AD DS docs ToC (learn.microsoft.com/windows-server/identity/ad-ds) - Deploy (install DC, add DC, RODC, upgrade, virtualized DCs, cloning), Plan (sites, FSMO, trusts), Manage (AD Administrative Center, Recycle Bin, fine-grained password policy, gMSA, Protected Users, authentication policies and silos, time service, AD DS backup and restore, DSRM, ntdsutil), Troubleshoot (replication, DC locator, Kerberos)"
  - "PowerShell docs (learn.microsoft.com/powershell) - about_ conceptual topics (Pipelines, Functions_Advanced, Parameters, Splatting, Try_Catch_Finally, Preference_Variables, Remote, Jobs, Thread_Jobs, Scheduled_Jobs, Classes, Modules, Execution_Policies, Profiles, Scopes, Providers, Regular_Expressions, Operators, Hash_Tables, Debuggers, Language_Modes, Logging, Signing, Calculated_Properties, Format.ps1xml), module reference (CimCmdlets, Microsoft.PowerShell.Utility/Management/Security, PSReadLine, ThreadJob, PSResourceGet, SecretManagement, ActiveDirectory, ScheduledTasks), Installing PowerShell 7, JEA docs, Pester and PSScriptAnalyzer docs"
