# Canonical coverage spec: Cryptography Implementation (whole field, defensive engineering only).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal to
# one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (NIST SP/FIPS document outlines, RFC section
# structure, library documentation tables of contents, Cryptography Engineering chapters, the OWASP
# Cryptographic Storage cheat sheet), not from what the library already holds.
# Depth: every topic lists `subtopics` taken from that source's own sub-structure (document
# sections, man-page lists, API families, chapter sub-sections).
subject: cryptography-implementation
scope:
  category: computing-software
  field: cryptography-implementation
  products: [openssl, libsodium, crypto-libraries, applied-cryptography, protocol-implementation, key-management, secure-implementation]
sources:
  - "NIST SP 800-57 Part 1 Rev 5 (Recommendation for Key Management) - 5 General Key-Management Guidance (key types, cryptoperiods, security strengths, key usage, compromise), 6 Protection Requirements, 7 Key States and Transitions, 8 Key-Management Phases and Functions (pre-operational, operational, post-operational, destroyed); Part 2 Rev 1 (policy and best practices, key management policy, CKMS); Part 3 Rev 1 (application-specific guidance - PKI, IPsec, TLS, S/MIME, Kerberos, DNSSEC)"
  - "NIST SP 800-38 series - 38A modes (ECB, CBC, CFB, OFB, CTR), 38A addendum (CBC ciphertext stealing), 38B CMAC, 38C CCM, 38D GCM/GMAC, 38E XTS-AES, 38F key wrap (KW, KWP), 38G format-preserving encryption (FF1, FF3-1)"
  - "NIST SP 800-90A Rev 1 (Hash_DRBG, HMAC_DRBG, CTR_DRBG, instantiate/reseed/generate, prediction resistance), 800-90B (entropy source design, health tests, min-entropy estimation), 800-90C (RBG constructions)"
  - "NIST SP 800-131A (transitioning algorithms and key lengths), SP 800-133 (key generation), SP 800-56A/56B/56C (key establishment and key derivation), SP 800-108 (KBKDF), SP 800-132 (PBKDF), SP 800-63B (memorized secret storage), SP 800-208 (LMS/XMSS), FIPS 180-4, FIPS 202, FIPS 186-5, FIPS 198-1"
  - "FIPS 140-3 / ISO 19790 (security levels 1-4, module specification and boundary, interfaces, roles and authentication, software/firmware security, physical security, SSP management, self-tests, approved mode) and CMVP program guidance"
  - "FIPS 203 (ML-KEM - parameter sets, KeyGen/Encaps/Decaps, input checking), FIPS 204 (ML-DSA - parameter sets, hedged/deterministic signing, context strings, HashML-DSA), FIPS 205 (SLH-DSA - parameter sets, small vs fast, prehash); NIST IR 8547 transition timeline"
  - "RFC 8446 TLS 1.3 - 2 Protocol overview (full handshake, HRR, resumption/PSK, 0-RTT), 4 Handshake protocol (key exchange messages, extensions, server parameters, authentication messages, post-handshake messages), 5 Record protocol, 7 Cryptographic computations (key schedule, traffic key calculation, exporters), 8 0-RTT and anti-replay, 9 Compliance requirements, Appendix C/D/E (implementation notes, backward compatibility, security analysis); plus RFC 5280 path validation, RFC 6125/9525 service identity, RFC 9180 HPKE, RFC 7515-7519 JOSE, RFC 4251-4253 SSH"
  - "OpenSSL 3 manual ToC (docs.openssl.org) - man1 commands (genpkey, pkey, req, x509, ca, verify, s_client, s_server, ciphers, pkcs12, cms, dgst, pkeyutl, enc, rand, kdf, mac, speed, list, fipsinstall), man5 config (openssl.cnf, x509v3_config, fips_config), man7 (provider, migration_guide, ossl-guide-tls-client/server), man3 SSL_CTX/EVP/OSSL_PARAM/ERR families"
  - "libsodium documentation ToC (doc.libsodium.org) - Quickstart/usage (sodium_init), Helpers (constant-time compare, hex/base64, padding), Secure memory, Generating random data, Secret-key cryptography (secretbox, secretstream, auth), Public-key cryptography (box, signatures, sealed boxes), Hashing (generic, short-input), Password hashing, Key derivation, Key exchange, AEAD constructions (XChaCha20-Poly1305, AEGIS, AES256-GCM), Advanced (scalarmult, Ed25519 to Curve25519, ristretto255, HKDF, SHA-2), Bindings"
  - "Platform library documentation ToCs - BoringSSL API docs and porting notes, AWS-LC, Go standard library crypto packages (crypto/cipher, crypto/rand, crypto/tls, crypto/x509, crypto/subtle, crypto/mlkem, crypto/hkdf, FIPS 140-3 mode), Java Cryptography Architecture reference guide (Cipher, KeyGenerator, SecureRandom, KeyStore, providers, JSSE), W3C Web Cryptography API, .NET System.Security.Cryptography, pyca/cryptography docs (Fernet, hazmat primitives, x509), rustls/ring docs"
  - "Cryptography Engineering (Ferguson, Schneier, Kohno) - 1-2 design philosophy and threat model, 3 block ciphers, 4 block cipher modes, 5 hash functions, 6 MACs, 7 secure channel, 8 implementation issues I, 9 generating randomness (Fortuna), 10 primes, 11 Diffie-Hellman, 12 RSA, 13 cryptographic protocols, 14 key negotiation, 15 implementation issues II, 16 clock, 17 key servers, 18 PKI dream, 19 PKI reality, 20 PKI practicalities, 21 storing secrets, 22 standards and patents"
  - "OWASP Cheat Sheet Series - Cryptographic Storage (architectural design, algorithms, cipher modes, random padding, secure random, defence in depth, key management - generation, rotation, storage, separation of keys and data, encrypting stored keys), Password Storage, Key Management, Transport Layer Security, Pinning; Wycheproof and NIST CAVP/ACVP testing programs"
