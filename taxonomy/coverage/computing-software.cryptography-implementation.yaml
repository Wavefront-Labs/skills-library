      - {id: bcm-cfb-ofb-legacy, name: Handling legacy CFB/OFB data, match: [cfb-ofb-legacy]}
      - {id: bcm-cts, name: CBC ciphertext stealing for length-preserving encryption, match: [ciphertext-stealing]}
      - {id: bcm-iv-unpredictability, name: Generating unpredictable IVs for CBC and CFB (SP 800-38A App C), match: [iv-unpredictability]}
      - {id: bcm-nonce-reuse-incident, name: Responding to a CTR or GCM nonce-reuse incident, match: [nonce-reuse-incident]}
      - {id: bcm-chacha20-counter, name: ChaCha20 stream cipher nonce and block counter layout (RFC 8439 2.4), match: [chacha20-counter]}
