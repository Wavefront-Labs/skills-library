# Coverage spec: patroni. Topics from the official docs table of contents.
subject: patroni
scope:
  category: computing-software
  field: database-administration
  products: [patroni]
sources:
  - "patroni official docs"
topics:
  - id: patroni-leader-race-and-failover
    name: "Patroni leader race and failover"
    source: "https://patroni.readthedocs.io/en/latest/faq.html"
    match: [patroni, ha, failover, leader-lock, dcs]
  - id: patroni-config-layers-precedence
    name: "Patroni config layers precedence"
    source: "https://patroni.readthedocs.io/en/latest/patroni_configuration.html"
    match: [patroni, configuration, dynamic-config, environment, sighup]
  - id: patroni-ttl-loop-wait-retry-timeout
    name: "Patroni ttl loop wait retry timeout"
    source: "https://patroni.readthedocs.io/en/latest/dynamic_configuration.html"
    match: [patroni, ttl, loop-wait, retry-timeout, tuning]
  - id: patroni-failover-timeouts-and-lag-limits
    name: "Patroni failover timeouts and lag limits"
    source: "https://patroni.readthedocs.io/en/latest/dynamic_configuration.html"
    match: [patroni, primary-start-timeout, maximum-lag, durability, failover]
  - id: patroni-bootstrap-dcs-and-initdb
    name: "Patroni bootstrap dcs and initdb"
    source: "https://patroni.readthedocs.io/en/latest/yaml_configuration.html"
    match: [patroni, bootstrap, initdb, dcs, data-checksums]
  - id: patroni-custom-bootstrap-method
    name: "Patroni custom bootstrap method"
    source: "https://patroni.readthedocs.io/en/latest/replica_bootstrap.html"
    match: [patroni, bootstrap, custom-script, recovery, pgbackrest]
  - id: patroni-replica-creation-methods
    name: "Patroni replica creation methods"
    source: "https://patroni.readthedocs.io/en/latest/replica_bootstrap.html"
    match: [patroni, replica, create-replica-methods, basebackup, wal-e]
  - id: patroni-basebackup-options
    name: "Patroni basebackup options"
    source: "https://patroni.readthedocs.io/en/latest/replica_bootstrap.html"
    match: [patroni, basebackup, pg-basebackup, waldir, replica]
  - id: patroni-postgres-parameters-owned-by-patroni
    name: "Patroni postgres parameters owned by patroni"
    source: "https://patroni.readthedocs.io/en/latest/patroni_configuration.html"
    match: [patroni, postgres-parameters, max-connections, wal-level, dynamic-config]
  - id: patroni-shared-memory-restart-order
    name: "Patroni shared memory restart order"
    source: "https://patroni.readthedocs.io/en/latest/patroni_configuration.html"
    match: [patroni, restart, max-connections, shared-memory, pending-restart]
  - id: patroni-postgresql-conf-layering
    name: "Patroni postgresql conf layering"
    source: "https://patroni.readthedocs.io/en/latest/patroni_configuration.html"
    match: [patroni, postgresql-conf, custom-conf, alter-system, configuration]
  - id: patroni-pg-hba-and-ident-management
    name: "Patroni pg hba and ident management"
    source: "https://patroni.readthedocs.io/en/latest/yaml_configuration.html"
    match: [patroni, pg-hba, pg-ident, authentication, bootstrap]
  - id: patroni-synchronous-mode
    name: "Patroni synchronous mode"
    source: "https://patroni.readthedocs.io/en/latest/replication_modes.html"
    match: [patroni, synchronous-mode, replication, durability, strict-mode]
  - id: patroni-synchronous-node-count-and-lag
    name: "Patroni synchronous node count and lag"
