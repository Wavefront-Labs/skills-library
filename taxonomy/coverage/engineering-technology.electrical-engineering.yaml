# Canonical coverage spec: electrical engineering (whole field). Topics and subtopics follow the exam specifications, textbook chapter structures,
# standards and tool manuals named in `sources` (not the library's own contents).
subject: electrical-engineering
scope:
  category: engineering-technology
  field: electrical-engineering
  products: [etap, matlab-simulink, power-system-analysis, protection-coordination, motor-drive-design, power-electronics, circuit-analysis, electrical-installation-design, electromagnetics]
sources:
  - "NCEES PE Electrical and Computer - Power exam specifications and NCEES FE Electrical and Computer exam specifications (topic lists)"
  - "ABET program criteria for electrical engineering programs; IEEE Power and Energy Society and IEEE Industry Applications Society technical committee scopes"
  - "Grainger and Stevenson Power System Analysis; Glover Sarma and Overbye Power System Analysis and Design; Kundur Power System Stability and Control; Blackburn and Domin Protective Relaying"
  - "Mohan Undeland and Robbins Power Electronics; Erickson and Maksimovic Fundamentals of Power Electronics; Chapman Electric Machinery Fundamentals; Alexander and Sadiku Fundamentals of Electric Circuits; Hayt and Buck Engineering Electromagnetics"
  - "Standards by designation (editions to be checked by the reader) - NFPA 70 NEC; NFPA 70E; IEC 60364; IEC 61439; IEC 60909; IEC 60034; IEC 61000; IEC 61850; IEC 62305; IEC 60079; IEEE 80; IEEE 519; IEEE 1547; IEEE 1584; IEEE C57.13"
  - "Vendor manuals: ETAP help and user guide; MathWorks Simscape Electrical and Simulink Control Design documentation"
topics:
