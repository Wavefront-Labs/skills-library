# Coverage spec for Vaultwarden, from the Vaultwarden wiki.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: vaultwarden
scope:
  category: computing-software
  field: systems-network-administration
  products: [vaultwarden]
sources:
  - "Vaultwarden GitHub wiki (github.com/dani-garcia/vaultwarden/wiki)"
topics:
  - id: configuration-overview
    name: "configuration overview"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Configuration-overview
    match: [vaultwarden-configuration]
  - id: other-configuration
    name: "other configuration"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Other-configuration
    match: [vaultwarden-other-config]
  - id: starting-a-container
    name: "starting a container"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Starting-a-Container
    match: [vaultwarden-docker-run]
  - id: docker-compose
    name: "using docker compose"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose
    match: [vaultwarden-compose]
  - id: podman
    name: "using podman"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Using-Podman
    match: [vaultwarden-podman]
  - id: which-image
    name: "which container image to use"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Which-container-image-to-use
    match: [container-image, latest-alpine]
  - id: updating-image
    name: "updating the image"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Updating-the-vaultwarden-image
    match: [update, watchtower]
  - id: non-root
    name: "running as non-root"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Running-docker-container-with-non-root-user
    match: [non-root, rocket-port]
  - id: deployment-examples
    name: "deployment examples"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Deployment-examples
    match: [vaultwarden-deployment]
  - id: kubernetes
    name: "kubernetes deployment"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Kubernetes-deployment
    match: [vaultwarden-kubernetes]
  - id: systemd-service
    name: "systemd service"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Setup-as-a-systemd-service
    match: [vaultwarden-systemd]
  - id: prebuilt-binaries
    name: "pre-built binaries"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Pre-built-binaries
    match: [vaultwarden-binaries]
  - id: building-binary
    name: "building the binary"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Building-binary
    match: [vaultwarden-build]
  - id: building-docker-image
    name: "building your own docker image"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Building-your-own-docker-image
    match: [vaultwarden-build-image]
  - id: backup
    name: "backing up your vault"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Backing-up-your-vault
    match: [vaultwarden-backup, sqlite]
  - id: data-location
    name: "changing persistent data location"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Changing-persistent-data-location
    match: [data-folder]
  - id: alternate-base-dir
    name: "using an alternate base dir"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Using-an-alternate-base-dir
    match: [base-dir]
  - id: without-wal
    name: "running without WAL"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Running-without-WAL-enabled
    match: [sqlite-wal]
  - id: postgresql
    name: "postgresql backend"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Using-the-PostgreSQL-Backend
    match: [postgresql, pgloader]
  - id: mariadb
    name: "mariadb mysql backend"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Using-the-MariaDB-(MySQL)-Backend
    match: [mariadb]
  - id: mariadb-to-sqlite
    name: "migrating mariadb to sqlite"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Migrating-from-MariaDB-(MySQL)-to-SQLite
    match: [mariadb-migration]
  - id: https
    name: "enabling https"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-HTTPS
    match: [https, rocket-tls]
  - id: proxy-examples
    name: "proxy examples"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Proxy-examples
    match: [reverse-proxy]
  - id: caddy-cloudflare-dns
    name: "caddy with cloudflare dns"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Caddy-2.x-with-Cloudflare-DNS
    match: [caddy]
  - id: traefik-modsecurity
    name: "traefik modsecurity"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Docker---Traefik---ModSecurity-Setup
    match: [traefik]
  - id: lets-encrypt-private
    name: "private instance with lets encrypt"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Running-a-private-vaultwarden-instance-with-Let's-Encrypt-certs
    match: [lets-encrypt]
  - id: private-ca
    name: "private CA and self-signed certificates"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Private-CA-and-self-signed-certs-that-work-with-Chrome
    match: [private-ca]
  - id: admin-page
    name: "enabling the admin page"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page
    match: [admin-page, admin-token, argon2id]
  - id: disable-admin-token
    name: "disable admin token"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Disable-admin-token
    match: [disable-admin-token]
  - id: disable-registration
    name: "disable registration"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Disable-registration-of-new-users
    match: [signups-allowed, registration]
  - id: disable-invitations
    name: "disable invitations"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Disable-invitations
    match: [invitations]
  - id: password-hint-display
    name: "password hint display"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Password-hint-display
    match: [password-hints]
  - id: smtp
    name: "smtp configuration"
    source: https://github.com/dani-garcia/vaultwarden/wiki/SMTP-Configuration
    match: [smtp, email]
  - id: websocket
    name: "websocket notifications"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-WebSocket-notifications
    match: [websocket]
  - id: push-notifications
    name: "mobile push notifications"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-Mobile-Client-push-notification
    match: [push-notifications]
  - id: webauthn
    name: "fido2 webauthn authentication"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-U2F-(and-FIDO2-WebAuthn)-authentication
    match: [webauthn, fido2]
  - id: yubikey-otp
    name: "yubikey otp"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-Yubikey-OTP-authentication
    match: [yubikey]
  - id: sso-oidc
    name: "sso with openid connect"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-SSO-support-using-OpenId-Connect
    match: [sso, openid-connect]
  - id: ldap-sync
    name: "syncing users from ldap"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Syncing-users-from-LDAP
    match: [ldap]
  - id: fail2ban
    name: "fail2ban setup"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Fail2Ban-Setup
    match: [fail2ban]
  - id: hardening
    name: "hardening guide"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Hardening-Guide
    match: [hardening]
  - id: logging
    name: "logging"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Logging
    match: [logging, log-level]
  - id: logrotate
    name: "logrotate example"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Logrotate-example
    match: [logrotate]
  - id: workers
    name: "changing the number of workers"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Changing-the-number-of-workers
    match: [workers]
  - id: api-size-limit
    name: "api request size limit"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Changing-the-API-request-size-limit
    match: [api-size-limit]
  - id: custom-icons
    name: "custom website icons"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Using-custom-website-icons
    match: [custom-icons]
  - id: icon-fetching-internal
    name: "icon fetching from internal services"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Allow-icon-fetching-from-internal-services
    match: [icon-fetching]
  - id: custom-css
    name: "customize css"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Customize-Vaultwarden-CSS
    match: [custom-css]
  - id: vault-hosting
    name: "disabling or overriding vault hosting"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Disabling-or-overriding-the-Vault-interface-hosting
    match: [web-vault-override]
  - id: keepass-import
    name: "importing from keepass"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Importing-data-from-Keepass-or-KeepassX
    match: [keepass]
  - id: upstream-differences
    name: "differences from upstream api"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Differences-from-the-upstream-API-implementation
    match: [upstream-differences]
  - id: android-troubleshooting
    name: "android troubleshooting"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Bitwarden-Android-troubleshooting
    match: [android]
  - id: clients-troubleshooting
    name: "clients troubleshooting"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Bitwarden-clients-troubleshooting
    match: [client-troubleshooting]
  - id: translating-admin
    name: "translating admin page"
    source: https://github.com/dani-garcia/vaultwarden/wiki/Translating-admin-page
    match: [translation]
  - id: faqs
    name: "faqs"
    source: https://github.com/dani-garcia/vaultwarden/wiki/FAQs
    match: [vaultwarden-faq]
