# Coverage spec: healthchecks. Topics from the Healthchecks docs (healthchecks/healthchecks, templates/docs/*.md).
subject: healthchecks
scope:
  category: computing-software
  field: systems-network-administration
  products: [healthchecks]
sources:
  - "Healthchecks docs (github.com/healthchecks/healthchecks/tree/master/templates/docs)"
topics:
  - id: ping-api-basics
    name: "Pinging API protocols, methods and signals"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/http_api.md"
    match: [pinging-api, ping-url, ping-body-limit]
  - id: uuid-slug-urls
    name: "UUID and slug ping URLs"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/slug_urls.md"
    match: [slug-url, uuid-url, ping-key, ambiguous-slug]
  - id: start-signal
    name: "Start signal"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/http_api.md"
    match: [start-signal, execution-time]
  - id: fail-signal
    name: "Failure signal"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/signaling_failures.md"
    match: [fail-signal, failure-alerts]
  - id: log-signal
    name: "Log signal"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/http_api.md"
    match: [log-signal, events-log]
  - id: exit-status-signal
    name: "Exit status signal"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/http_api.md"
    match: [exit-status, exit-code]
  - id: run-ids
    name: "Run IDs for concurrent runs"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/measuring_script_run_time.md"
    match: [run-id, rid-parameter, concurrent-runs]
  - id: ping-rate-limits
    name: "Ping rate limits"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/http_api.md"
    match: [rate-limit, ping-frequency]
  - id: ping-response-codes
    name: "Ping response codes"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/http_api.md"
    match: [response-codes, http-409, http-404]
  - id: attaching-logs
    name: "Attaching logs to pings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/attaching_logs.md"
    match: [attach-logs, post-body, curl-data-binary]
  - id: auto-provisioning
    name: "Auto provisioning"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/autoprovisioning.md"
    match: [auto-provisioning, create-parameter]
  - id: check-states
    name: "Check states and concepts"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/introduction.md"
    match: [check-states, dead-mans-switch, late-status]
  - id: grace-time
    name: "Grace time"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/introduction.md"
    match: [grace-time, alert-delay]
  - id: simple-schedule
    name: "Simple schedules"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_checks.md"
    match: [simple-schedule, period]
  - id: cron-schedule
    name: "Cron schedules and time zones"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_checks.md"
    match: [cron-schedule, cron-expression, tz-parameter]
  - id: oncalendar-schedule
    name: "OnCalendar schedules"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_checks.md"
    match: [oncalendar-schedule, systemd-timer]
  - id: check-metadata
    name: "Name, slug, tags and description"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_checks.md"
    match: [check-name, check-tags, check-description]
  - id: method-filtering
    name: "Allowed HTTP methods and sticky pause"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_checks.md"
    match: [allowed-methods, post-only, manual-resume]
  - id: keyword-filtering
    name: "Keyword content filtering"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_checks.md"
    match: [keyword-filtering, success-keywords, failure-keywords]
  - id: email-pinging
    name: "Email pinging"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/email.md"
    match: [email-pinging, ping-by-email]
  - id: run-time-measurement
    name: "Measuring script run time"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/measuring_script_run_time.md"
    match: [run-time, duration-display]
  - id: cloning-checks
    name: "Cloning checks"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/cloning_checks.md"
    match: [clone-check, migrate-checks]
  - id: curl-options
    name: "curl options for pings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/bash.md"
    match: [curl-flags, retry-timeout, silent-ping]
  - id: cron-monitoring
    name: "Monitoring cron jobs"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/monitoring_cron_jobs.md"
    match: [crontab, cron-monitoring, heartbeat]
  - id: cron-troubleshooting
    name: "Cron troubleshooting"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/monitoring_cron_jobs.md"
    match: [timedatectl, journalctl-cron, timezone-mismatch]
  - id: shell-pipefail
    name: "Pipelines and pipefail"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/bash.md"
    match: [pipefail, shell-pipeline]
  - id: systemd-curl
    name: "systemd tasks with curl"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/monitoring_systemd_tasks.md"
    match: [systemd-service, execstartpre, execstoppost]
  - id: systemd-runitor
    name: "systemd tasks with runitor"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/monitoring_systemd_tasks.md"
    match: [runitor, command-wrapper]
  - id: github-actions
    name: "GitHub Actions monitoring"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/github_actions.md"
    match: [github-actions, workflow-run]
  - id: python-client
    name: "Python pings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/python.md"
    match: [python, requests-library, urllib]
  - id: nodejs-client
    name: "Node.js and browser pings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/javascript.md"
    match: [nodejs, axios, browser-xhr]
  - id: powershell-client
    name: "PowerShell pings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/powershell.md"
    match: [powershell, task-scheduler, invoke-restmethod]
  - id: arduino-client
    name: "Arduino pings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/arduino.md"
    match: [arduino, arduinohttpclient]
  - id: other-language-clients
    name: "Go, PHP, Ruby and C# pings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/go.md"
    match: [go-client, php-client, ruby-client, csharp-client]
  - id: router-monitoring
    name: "Router monitoring"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/network_routers.md"
    match: [dd-wrt, mikrotik, wan-outage]
  - id: reliability-tips
    name: "Reliable pinging tips"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/reliability_tips.md"
    match: [request-timeout, retries, exception-handling]
  - id: community-tools
    name: "Third-party tools"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/resources.md"
    match: [terraform-provider, ansible-collection, backup-integrations]
  - id: notification-integrations
    name: "Notification integrations"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_notifications.md"
    match: [integrations, notification-channels, sms-quota]
  - id: repeated-alerts
    name: "Repeated notifications"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_notifications.md"
    match: [repeated-alerts, pushover-emergency, email-reminders]
  - id: email-reports
    name: "Email reports"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_notifications.md"
    match: [weekly-report, monthly-report, report-opt-out]
  - id: project-roles
    name: "Project roles and team access"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/projects_teams.md"
    match: [project-roles, team-access]
  - id: project-transfers
    name: "Transfers and check limits"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/projects_teams.md"
    match: [transfer-check, transfer-project, check-limit]
  - id: api-auth
    name: "Management API authentication"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/api.md"
    match: [api-key, x-api-key, management-api]
  - id: api-list-get
    name: "API list and get checks"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/api.md"
    match: [api-list-checks, tag-filter, unique-key]
  - id: api-create
    name: "API create check"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/api.md"
    match: [api-create-check, unique-upsert, channels-parameter]
  - id: api-update-delete
    name: "API update, pause, resume, delete"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/api.md"
    match: [api-update-check, api-pause-check, api-delete-check]
  - id: api-pings-flips
    name: "API pings log and flips"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/api.md"
    match: [api-pings-log, api-flips, status-changes]
  - id: api-badges-status
    name: "API channels, badges, status"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/api.md"
    match: [api-badges, api-channels, status-endpoint]
  - id: badges
    name: "Status badges"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/badges.md"
    match: [status-badges, svg-badge, shields-io]
  - id: prometheus
    name: "Prometheus metrics"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/configuring_prometheus.md"
    match: [prometheus, hc-metrics, grafana-cloud]
  - id: self-hosted-setup
    name: "Self-hosted source setup"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted.md"
    match: [self-hosted, virtualenv-setup, sendalerts-command]
  - id: smtp-sending
    name: "Outgoing SMTP"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted.md"
    match: [smtp-settings, implicit-tls, explicit-tls]
  - id: smtpd-listener
    name: "Incoming email listener"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted.md"
    match: [smtpd-listener, smtpd-port, ping-email-domain]
  - id: db-cleanup
    name: "Database cleanup"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted.md"
    match: [pruneusers, pruneobjects, ping-log-limit]
  - id: docker-setup
    name: "Docker setup"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_docker.md"
    match: [docker-compose, env-file, prebuilt-images]
  - id: docker-proxy
    name: "Reverse proxy and TLS"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_docker.md"
    match: [reverse-proxy, x-forwarded-for, csrf-403]
  - id: docker-self-signed
    name: "Trusting self-signed certificates"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_docker.md"
    match: [self-signed-certificate, ca-certificates]
  - id: docker-postgres-upgrade
    name: "PostgreSQL upgrade"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_docker.md"
    match: [postgres-upgrade, pgautoupgrade]
  - id: docker-runtime
    name: "Gunicorn and IPv6 options"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_docker.md"
    match: [gunicorn-workers, listen-ipv6]
  - id: config-core
    name: "Core and database settings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_configuration.md"
    match: [site-root, secret-key, db-settings]
  - id: config-s3-email
    name: "S3 storage and email settings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_configuration.md"
    match: [s3-object-storage, ping-body-storage, secret-files]
  - id: config-integrations
    name: "Integration settings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_configuration.md"
    match: [integration-toggles, slack-oauth, telegram-bot, twilio-settings]
  - id: config-security
    name: "Security and auth settings"
    source: "https://raw.githubusercontent.com/healthchecks/healthchecks/master/templates/docs/self_hosted_configuration.md"
    match: [webauthn-rp-id, remote-user-header, registration-open]
