# Coverage spec: influxdb. Topics from the InfluxDB OSS v2 docs (docs.influxdata.com/influxdb/v2).
subject: influxdb
scope:
  category: computing-software
  field: database-administration
  products: [influxdb]
sources:
  - "InfluxDB OSS v2 docs (docs.influxdata.com/influxdb/v2)"
topics:
  # --- Buckets and retention ---
  - id: create-bucket
    name: "Create buckets and naming rules"
    source: "https://docs.influxdata.com/influxdb/v2/admin/buckets/create-bucket/"
    match: [buckets, create-bucket]
  - id: update-bucket
    name: "Rename a bucket and change retention"
    source: "https://docs.influxdata.com/influxdb/v2/admin/buckets/update-bucket/"
    match: [buckets, retention]
  - id: delete-bucket
    name: "Delete a bucket"
    source: "https://docs.influxdata.com/influxdb/v2/admin/buckets/delete-bucket/"
    match: [buckets, delete-bucket]
  - id: view-buckets
    name: "List and inspect buckets"
    source: "https://docs.influxdata.com/influxdb/v2/admin/buckets/view-buckets/"
    match: [buckets]
  - id: data-retention
    name: "Retention enforcement service"
    source: "https://docs.influxdata.com/influxdb/v2/reference/internals/data-retention/"
    match: [retention, enforcement]
  - id: shards
    name: "Shard groups and durations"
    source: "https://docs.influxdata.com/influxdb/v2/reference/internals/shards/"
    match: [shard, shard-group]
  # --- Tokens, users and organizations ---
  - id: create-token
    name: "Create all-access and custom API tokens"
    source: "https://docs.influxdata.com/influxdb/v2/admin/tokens/create-token/"
    match: [tokens, api-token]
  - id: view-tokens
    name: "View tokens"
    source: "https://docs.influxdata.com/influxdb/v2/admin/tokens/view-tokens/"
    match: [tokens]
  - id: update-tokens
    name: "Activate and deactivate tokens"
    source: "https://docs.influxdata.com/influxdb/v2/admin/tokens/update-tokens/"
    match: [tokens]
  - id: delete-token
    name: "Delete tokens"
    source: "https://docs.influxdata.com/influxdb/v2/admin/tokens/delete-token/"
    match: [tokens]
  - id: use-tokens
    name: "Use tokens in the CLI and environment"
    source: "https://docs.influxdata.com/influxdb/v2/admin/tokens/use-tokens/"
    match: [tokens, env]
  - id: create-user
    name: "Create users"
    source: "https://docs.influxdata.com/influxdb/v2/admin/users/create-user/"
    match: [users]
  - id: change-password
    name: "Change user passwords"
    source: "https://docs.influxdata.com/influxdb/v2/admin/users/change-password/"
    match: [users, password]
  - id: recover-credentials
    name: "Recover credentials with influxd recovery"
    source: "https://docs.influxdata.com/influxdb/v2/admin/users/recover-credentials/"
    match: [recovery, credentials]
  - id: create-org
    name: "Create organizations"
    source: "https://docs.influxdata.com/influxdb/v2/admin/organizations/create-org/"
    match: [organizations]
  - id: org-members
    name: "Add and remove organization members"
    source: "https://docs.influxdata.com/influxdb/v2/admin/organizations/members/add-member/"
    match: [organizations, members]
  # --- Secrets ---
  - id: add-secrets
    name: "Add and delete secrets"
    source: "https://docs.influxdata.com/influxdb/v2/admin/secrets/add/"
    match: [secrets]
  - id: use-secrets
    name: "Use secrets in Flux"
    source: "https://docs.influxdata.com/influxdb/v2/admin/secrets/use/"
    match: [secrets, flux]
  - id: vault
    name: "Store secrets in Vault"
    source: "https://docs.influxdata.com/influxdb/v2/admin/secrets/use-vault/"
    match: [vault, secrets]
  # --- Backup, restore and upgrade ---
  - id: backup
    name: "Back up with influx backup"
    source: "https://docs.influxdata.com/influxdb/v2/admin/backup-restore/backup/"
    match: [backup]
  - id: restore
    name: "Restore with influx restore"
    source: "https://docs.influxdata.com/influxdb/v2/admin/backup-restore/restore/"
    match: [restore, disaster-recovery]
  - id: upgrade-v2
    name: "Upgrade 2.x in place"
    source: "https://docs.influxdata.com/influxdb/v2/install/upgrade/v2-to-v2/"
    match: [upgrade]
  - id: downgrade
    name: "Downgrade with influxd downgrade"
    source: "https://docs.influxdata.com/influxdb/v2/install/upgrade/downgrade/"
    match: [downgrade]
  - id: upgrade-v1
    name: "Upgrade from 1.x with influxd upgrade"
    source: "https://docs.influxdata.com/influxdb/v2/install/upgrade/v1-to-v2/automatic-upgrade/"
    match: [upgrade, v1-to-v2]
  - id: upgrade-docker
    name: "Upgrade 1.x in Docker"
    source: "https://docs.influxdata.com/influxdb/v2/install/upgrade/v1-to-v2/docker/"
    match: [docker, upgrade]
  - id: migrate-cqs
    name: "Migrate continuous queries to tasks"
    source: "https://docs.influxdata.com/influxdb/v2/install/upgrade/v1-to-v2/migrate-cqs/"
    match: [continuous-queries]
  - id: docker-compose
    name: "Docker Compose and secret files"
    source: "https://docs.influxdata.com/influxdb/v2/install/use-docker-compose/"
    match: [docker-compose]
  - id: identify-version
    name: "Identify the InfluxDB version"
    source: "https://docs.influxdata.com/influxdb/v2/admin/identify-version/"
    match: [version]
  # --- Security and operations ---
  - id: enable-tls
    name: "Enable TLS and troubleshoot certificates"
    source: "https://docs.influxdata.com/influxdb/v2/admin/security/enable-tls/"
    match: [tls, https]
  - id: hardening
    name: "Hardening and private IP validation"
    source: "https://docs.influxdata.com/influxdb/v2/admin/security/enable-hardening/"
    match: [hardening, security]
  - id: disable-devel
    name: "Disable pprof, metrics and UI"
    source: "https://docs.influxdata.com/influxdb/v2/admin/security/disable-devel/"
    match: [pprof, metrics, ui]
  - id: logs
    name: "Logging and log levels"
    source: "https://docs.influxdata.com/influxdb/v2/admin/logs/"
    match: [logs]
  - id: tsi-rebuild
    name: "Rebuild the TSI index"
    source: "https://docs.influxdata.com/influxdb/v2/admin/internals/tsi/rebuild-index/"
    match: [tsi, rebuild]
  - id: tsi-inspect
    name: "Inspect the TSI index"
    source: "https://docs.influxdata.com/influxdb/v2/admin/internals/tsi/inspect/"
    match: [tsi, dump-tsi]
  # --- Internals ---
  - id: file-layout
    name: "File system layout and default paths"
    source: "https://docs.influxdata.com/influxdb/v2/reference/internals/file-system-layout/"
    match: [file-system, paths]
  - id: storage-engine
    name: "Storage engine: WAL, cache, TSM, TSI"
    source: "https://docs.influxdata.com/influxdb/v2/reference/internals/storage-engine/"
    match: [storage-engine, wal, tsm]
  - id: runtime
    name: "Runtime profiling with pprof"
    source: "https://docs.influxdata.com/influxdb/v2/reference/internals/runtime/"
    match: [pprof, profiling]
  - id: metrics
    name: "Internal metrics endpoint"
    source: "https://docs.influxdata.com/influxdb/v2/reference/internals/metrics/"
    match: [metrics, prometheus]
  - id: system-buckets
    name: "System buckets"
    source: "https://docs.influxdata.com/influxdb/v2/reference/internals/system-buckets/"
    match: [system-buckets]
  # --- Writing and deleting data ---
  - id: optimize-writes
    name: "Optimize writes"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/best-practices/optimize-writes/"
    match: [writes, batching, gzip]
  - id: duplicate-points
    name: "Duplicate points"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/best-practices/duplicate-points/"
    match: [duplicate-points]
  - id: high-cardinality
    name: "Resolve high cardinality"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/best-practices/resolve-high-cardinality/"
    match: [cardinality]
  - id: schema-design
    name: "Schema design"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/best-practices/schema-design/"
    match: [schema-design]
  - id: delete-data
    name: "Delete data"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/delete-data/"
    match: [delete, delete-predicate]
  - id: write-troubleshoot
    name: "Troubleshoot writes"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/troubleshoot/"
    match: [writes, http-status, rejected-points]
  - id: write-api
    name: "Write API"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/developer-tools/api/"
    match: [write-api]
  - id: write-csv
    name: "Write CSV"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/developer-tools/csv/"
    match: [csv, influx-write]
  - id: replication
    name: "Replicate data to a remote instance"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/replication/replicate-data/"
    match: [replication]
  - id: migrate-oss
    name: "Export and migrate OSS data"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/migrate-data/migrate-oss/"
    match: [migration, export-lp]
  - id: migrate-cloud
    name: "Migrate Cloud data to OSS"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/migrate-data/migrate-cloud-to-oss/"
    match: [migration, cloud]
  - id: scrapers
    name: "Scrapers"
    source: "https://docs.influxdata.com/influxdb/v2/write-data/no-code/scrape-data/manage-scrapers/create-a-scraper/"
    match: [scrapers, prometheus]
  - id: telegraf-configs
    name: "Telegraf configurations"
    source: "https://docs.influxdata.com/influxdb/v2/tools/telegraf-configs/create/"
    match: [telegraf]
  # --- Tasks, alerting and queries ---
  - id: task-options
    name: "Task options and scheduling"
    source: "https://docs.influxdata.com/influxdb/v2/process-data/task-options/"
    match: [tasks, every, cron]
  - id: manage-tasks
    name: "Manage and retry tasks"
    source: "https://docs.influxdata.com/influxdb/v2/process-data/manage-tasks/run-task/"
    match: [tasks, retry]
  - id: downsample
    name: "Downsample with tasks"
    source: "https://docs.influxdata.com/influxdb/v2/process-data/common-tasks/downsample-data/"
    match: [downsampling]
  - id: checks
    name: "Threshold and deadman checks"
    source: "https://docs.influxdata.com/influxdb/v2/monitor-alert/checks/create/"
    match: [checks, deadman]
  - id: notification-endpoints
    name: "Notification endpoints"
    source: "https://docs.influxdata.com/influxdb/v2/monitor-alert/notification-endpoints/create/"
    match: [notifications, endpoints]
  - id: notification-rules
    name: "Notification rules"
    source: "https://docs.influxdata.com/influxdb/v2/monitor-alert/notification-rules/create/"
    match: [notifications, rules]
  - id: send-email
    name: "Send alert emails"
    source: "https://docs.influxdata.com/influxdb/v2/monitor-alert/send-email/"
    match: [email, alerting]
  - id: variables
    name: "Dashboard variables"
    source: "https://docs.influxdata.com/influxdb/v2/visualize-data/variables/variable-types/"
    match: [variables, dashboards]
  - id: dbrp
    name: "DBRP mappings"
    source: "https://docs.influxdata.com/influxdb/v2/query-data/influxql/dbrp/"
    match: [dbrp, influxql]
  - id: optimize-queries
    name: "Optimize Flux queries"
    source: "https://docs.influxdata.com/influxdb/v2/query-data/optimize-queries/"
    match: [flux, query-performance]
  - id: query-api
    name: "Execute queries over the API"
    source: "https://docs.influxdata.com/influxdb/v2/query-data/execute-queries/influx-api/"
    match: [query-api]
  - id: templates
    name: "Templates and stacks"
    source: "https://docs.influxdata.com/influxdb/v2/tools/influxdb-templates/use/"
    match: [templates, stacks]
