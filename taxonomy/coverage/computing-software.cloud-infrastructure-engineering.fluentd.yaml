# Coverage spec: fluentd. Topics from the external structures named in `sources`.
subject: fluentd
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [fluentd]
sources:
  - "Fluentd documentation (https://docs.fluentd.org/)"
  - "Fluentd docs source (https://github.com/fluent/fluentd-docs-gitbook)"
topics:
  - id: before-install-os-tuning
    name: "before install os tuning"
    source: https://docs.fluentd.org/installation/before-install
    match: ["before install os tuning", "ntp", "file descriptors", "sysctl", "ulimit", "kernel parameters"]
  - id: buffer-chunk-keys
    name: "buffer chunk keys"
    source: https://docs.fluentd.org/configuration/buffer-section
    match: ["buffer chunk keys", "buffer", "chunk keys", "timekey", "timekey wait", "tag"]
  - id: buffer-chunk-lifecycle-and-evacuation
    name: "buffer chunk lifecycle and evacuation"
    source: https://docs.fluentd.org/buffer
    match: ["buffer chunk lifecycle and evacuation", "buffer", "stage", "queue", "evacuate limit size", "chunk backup"]
  - id: buffer-file-plugin
    name: "buffer file plugin"
    source: https://docs.fluentd.org/buffer/file
    match: ["buffer file plugin", "buf file", "buffer", "persistent buffer", "path", "file permission"]
  - id: buffer-flush-parameters
    name: "buffer flush parameters"
    source: https://docs.fluentd.org/configuration/buffer-section
    match: ["buffer flush parameters", "buffer", "flush mode", "flush interval", "flush thread count", "flush at shutdown"]
  - id: buffer-memory-and-file-single-plugins
    name: "buffer memory and file single plugins"
    source: https://docs.fluentd.org/buffer/memory
    match: ["buffer memory and file single plugins", "buf memory", "buf file single", "buffer", "chunk format", "calc num records"]
  - id: buffer-placeholders-and-path-validation
    name: "buffer placeholders and path validation"
    source: https://docs.fluentd.org/configuration/buffer-section
    match: ["buffer placeholders and path validation", "buffer", "placeholders", "chunk id", "path traversal", "out file"]
  - id: buffer-retry-and-backoff
    name: "buffer retry and backoff"
    source: https://docs.fluentd.org/configuration/buffer-section
    match: ["buffer retry and backoff", "buffer", "retry", "exponential backoff", "retry timeout", "secondary"]
  - id: buffer-size-limits-and-compression
    name: "buffer size limits and compression"
    source: https://docs.fluentd.org/configuration/buffer-section
    match: ["buffer size limits and compression", "buffer", "chunk limit size", "total limit size", "compress", "overflow action"]
  - id: command-line-options-and-tools
    name: "command line options and tools"
    source: https://docs.fluentd.org/deployment/command-line-option
    match: ["command line options and tools", "command line", "fluent cat", "fluent plugin config format", "fluent plugin generate", "dry run"]
  - id: common-plugin-parameters
    name: "common plugin parameters"
    source: https://docs.fluentd.org/configuration/plugin-common-parameters
    match: ["common plugin parameters", "plugin parameters", "id", "log level", "label"]
  - id: config-file-directives-and-locations
    name: "config file directives and locations"
    source: https://docs.fluentd.org/configuration/config-file
    match: ["config file directives and locations", "config file", "source", "match", "filter", "system"]
  - id: config-file-yaml-syntax
    name: "config file yaml syntax"
    source: https://docs.fluentd.org/configuration/config-file-yaml
    match: ["config file yaml syntax", "yaml", "config file", "include", "fluent s"]
  - id: config-value-types-and-ruby-embedding
    name: "config value types and ruby embedding"
    source: https://docs.fluentd.org/configuration/config-file
    match: ["config value types and ruby embedding", "config types", "size", "time", "hash", "array"]
  - id: docker-compose-efk-stack
    name: "docker compose efk stack"
    source: https://docs.fluentd.org/container-deployment/docker-compose
    match: ["docker compose efk stack", "docker compose", "efk", "elasticsearch", "kibana", "dockerfile"]
  - id: docker-image-deployment
    name: "docker image deployment"
    source: https://docs.fluentd.org/container-deployment/install-by-docker
    match: ["docker image deployment", "docker", "container", "fluent fluentd", "edge debian", "jemalloc"]
  - id: docker-logging-driver
    name: "docker logging driver"
    source: https://docs.fluentd.org/container-deployment/docker-logging-driver
    match: ["docker logging driver", "docker", "logging driver", "fluentd address", "log opt", "concat"]
  - id: extract-and-inject-sections
    name: "extract and inject sections"
    source: https://docs.fluentd.org/configuration/extract-section
    match: ["extract and inject sections", "extract section", "inject section", "tag key", "time key", "hostname key"]
  - id: failure-scenarios
    name: "failure scenarios"
    source: https://docs.fluentd.org/deployment/failure-scenarios
    match: ["failure scenarios", "data loss", "buf memory", "buf file", "logger libraries"]
  - id: format-section
    name: "format section"
    source: https://docs.fluentd.org/configuration/format-section
    match: ["format section", "formatter", "time type", "out file", "json"]
  - id: high-availability-forwarder-aggregator
    name: "high availability forwarder aggregator"
    source: https://docs.fluentd.org/deployment/high-availability
    match: ["high availability forwarder aggregator", "high availability", "forwarder", "aggregator", "standby", "at least once"]
  - id: http-rpc-endpoints
    name: "http rpc endpoints"
    source: https://docs.fluentd.org/deployment/rpc
    match: ["http rpc endpoints", "rpc", "rpc endpoint", "flush buffers", "config reload", "windows"]
  - id: in-forward-receiving-events
    name: "in forward receiving events"
    source: https://docs.fluentd.org/input/forward
    match: ["in forward receiving events", "in forward", "forward", "aggregator", "shared key", "security"]
  - id: in-http-rest-endpoint
    name: "in http rest endpoint"
    source: https://docs.fluentd.org/input/http
    match: ["in http rest endpoint", "in http", "http", "rest", "content type", "cors"]
  - id: in-tail-paths-globbing-and-rotation
    name: "in tail paths globbing and rotation"
    source: https://docs.fluentd.org/input/tail
    match: ["in tail paths globbing and rotation", "in tail", "tail", "path", "glob", "follow inodes"]
  - id: in-tail-position-file-and-read-tuning
    name: "in tail position file and read tuning"
    source: https://docs.fluentd.org/input/tail
    match: ["in tail position file and read tuning", "in tail", "pos file", "read from head", "read lines limit", "encoding"]
  - id: in-tail-unmatched-lines-and-faq
    name: "in tail unmatched lines and faq"
    source: https://docs.fluentd.org/input/tail
    match: ["in tail unmatched lines and faq", "in tail", "emit unmatched lines", "multiline", "pattern not match", "incomplete line"]
  - id: in-tail-watchers-and-group-rate-limit
    name: "in tail watchers and group rate limit"
    source: https://docs.fluentd.org/input/tail
    match: ["in tail watchers and group rate limit", "in tail", "inotify", "enable watch timer", "enable stat watcher", "group"]
  - id: in-tcp-udp-unix-sockets
    name: "in tcp udp unix sockets"
    source: https://docs.fluentd.org/input/tcp
    match: ["in tcp udp unix sockets", "in tcp", "in udp", "in unix", "delimiter", "remove newline"]
  - id: kubernetes-daemonset
    name: "kubernetes daemonset"
    source: https://docs.fluentd.org/container-deployment/kubernetes
    match: ["kubernetes daemonset", "kubernetes", "daemonset", "elasticsearch", "fluentd kubernetes daemonset", "environment variables"]
  - id: labels-and-error-routing
    name: "labels and error routing"
    source: https://docs.fluentd.org/configuration/config-file
    match: ["labels and error routing", "label", "error label", "root label", "routing"]
  - id: linux-capabilities-for-in-tail
    name: "linux capabilities for in tail"
    source: https://docs.fluentd.org/deployment/linux-capability
    match: ["linux capabilities for in tail", "linux capabilities", "fluent cap ctl", "capng c", "cap dac read search", "in tail"]
  - id: logging-levels-and-fluent-log-label
    name: "logging levels and fluent log label"
    source: https://docs.fluentd.org/deployment/logging
    match: ["logging levels and fluent log label", "logging", "log level", "fluent log", "per plugin log", "verbosity"]
  - id: logging-output-and-rotation
    name: "logging output and rotation"
    source: https://docs.fluentd.org/deployment/logging
    match: ["logging output and rotation", "logging", "log file", "rotate age", "rotate size", "json log"]
  - id: match-patterns-and-order
    name: "match patterns and order"
    source: https://docs.fluentd.org/configuration/config-file
    match: ["match patterns and order", "match", "filter", "tag patterns", "wildcards", "routing"]
  - id: monitor-agent-rest-api
    name: "monitor agent rest api"
    source: https://docs.fluentd.org/monitoring-fluentd/monitoring-rest-api
    match: ["monitor agent rest api", "monitor agent", "rest api", "metrics", "include retry", "include config"]
  - id: monitoring-overview-and-debug-port
    name: "monitoring overview and debug port"
    source: https://docs.fluentd.org/monitoring-fluentd/overview
    match: ["monitoring overview and debug port", "monitoring", "process monitoring", "port monitoring", "debug agent", "fluent debug"]
  - id: multi-process-workers
    name: "multi process workers"
    source: https://docs.fluentd.org/deployment/multi-process-workers
    match: ["multi process workers", "workers", "multi process", "worker id", "in tail", "server helper"]
  - id: parse-format-time-parameters
    name: "parse format time parameters"
    source: https://docs.fluentd.org/configuration/parse-section
    match: ["parse format time parameters", "time format", "timezone", "time type", "localtime", "utc"]
  - id: parse-section-and-types
    name: "parse section and types"
    source: https://docs.fluentd.org/configuration/parse-section
    match: ["parse section and types", "parse section", "parser", "types", "time key", "null value pattern"]
  - id: performance-tuning-single-process
    name: "performance tuning single process"
    source: https://docs.fluentd.org/deployment/performance-tuning-single-process
    match: ["performance tuning single process", "performance tuning", "flush thread count", "gzip command", "gc", "ruby gc heap oldobject limit factor"]
  - id: plugin-management-and-versions
    name: "plugin management and versions"
    source: https://docs.fluentd.org/deployment/plugin-management
    match: ["plugin management and versions", "fluent gem", "plugins", "gemfile", "td agent gem", "plugin directory"]
  - id: prometheus-monitoring
    name: "prometheus monitoring"
    source: https://docs.fluentd.org/monitoring-fluentd/monitoring-prometheus
    match: ["prometheus monitoring", "prometheus", "fluent plugin prometheus", "metrics", "scrape", "monitoring"]
  - id: routing-examples-and-rerouting
    name: "routing examples and rerouting"
    source: https://docs.fluentd.org/configuration/routing-examples
    match: ["routing examples and rerouting", "routing", "relabel", "copy", "rewrite tag filter", "fluent plugin route"]
  - id: service-discovery-srv
    name: "service discovery srv"
    source: https://docs.fluentd.org/service_discovery/srv
    match: ["service discovery srv", "service discovery", "srv", "dns", "out forward"]
  - id: service-discovery-static-and-file
    name: "service discovery static and file"
    source: https://docs.fluentd.org/configuration/service_discovery-section
    match: ["service discovery static and file", "service discovery", "static", "file", "out forward", "sd yaml"]
  - id: signals-and-process-model
    name: "signals and process model"
    source: https://docs.fluentd.org/deployment/signals
    match: ["signals and process model", "signals", "sighup", "sigusr1", "sigusr2", "supervisor"]
  - id: source-only-mode
    name: "source only mode"
    source: https://docs.fluentd.org/deployment/source-only-mode
    match: ["source only mode", "with source only", "sigwinch", "source only buffer"]
  - id: storage-section-and-local-plugin
    name: "storage section and local plugin"
    source: https://docs.fluentd.org/configuration/storage-section
    match: ["storage section and local plugin", "storage section", "storage local", "persistent", "autosave", "state"]
  - id: system-directive-settings
    name: "system directive settings"
    source: https://docs.fluentd.org/deployment/system-config
    match: ["system directive settings", "system", "workers", "root dir", "log level", "umask"]
  - id: transport-section-tls
    name: "transport section tls"
    source: https://docs.fluentd.org/configuration/transport-section
    match: ["transport section tls", "transport section", "tls", "certificates", "private ca", "linger timeout"]
  - id: troubleshooting-and-debug-dumps
    name: "troubleshooting and debug dumps"
    source: https://docs.fluentd.org/deployment/trouble-shooting
    match: ["troubleshooting and debug dumps", "troubleshooting", "verbose logging", "sigdump", "sigcont", "high cpu"]
  - id: troubleshooting-guide-common-problems
    name: "troubleshooting guide common problems"
    source: https://docs.fluentd.org/troubleshooting-guide
    match: ["troubleshooting guide common problems", "troubleshooting", "buffer overflow", "missing data", "retry", "parsing"]
  - id: worker-directive-and-include
    name: "worker directive and include"
    source: https://docs.fluentd.org/configuration/config-file
    match: ["worker directive and include", "worker", "include", "multi worker", "config reuse"]
  - id: zero-downtime-restart
    name: "zero downtime restart"
    source: https://docs.fluentd.org/deployment/zero-downtime-restart
    match: ["zero downtime restart", "sigusr2", "shared socket", "in udp", "in tcp"]
