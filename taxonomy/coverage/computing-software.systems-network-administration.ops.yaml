# Canonical coverage spec: systems operations (virtualisation, patch management, backup and recovery).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (VCP-DCV exam objectives and the vSphere
# documentation set, the Proxmox VE Administration Guide and Hyper-V on Windows Server docs ToCs,
# NIST SP 800-40r4 and SP 800-34r1, Veeam/restic/Bacula manuals, ITIL 4 practice guides), not
# from what the library already holds.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (exam objective
# bullets, manual chapter sub-sections, CLI sub-commands, standard sections).
subject: sysadmin-ops
scope:
  category: computing-software
  field: systems-network-administration
  products: [virtualisation, patch-management, backup-and-recovery]
sources:
  - "VMware VCP-DCV (2V0-21.23 / vSphere 8) exam guide - Section 1 Architectures and Technologies (vCenter, ESXi, storage, networking, HA/DRS/FT, vSAN, lifecycle, security), Section 4 Installation/Configuration/Setup (vCenter deployment, SSO/identity sources, vSphere networking/storage config, HA/DRS/EVC, content library, host profiles, VM encryption), Section 5 Performance tuning/optimization/upgrades (VLCM images, alarms, resource management), Section 7 Administrative and operational tasks (VM management, snapshots, vMotion, RBAC, certificates, logs, troubleshooting)"
  - "vSphere 8 documentation set ToC (docs.vmware.com / techdocs.broadcom.com) - ESXi Installation and Setup, vCenter Server Installation and Setup, vCenter Server Configuration, vSphere Networking, vSphere Storage, vSAN Planning and Deployment, vSphere Availability, vSphere Resource Management, vSphere Virtual Machine Administration, vSphere Security, vSphere Lifecycle Manager, vSphere Monitoring and Performance, PowerCLI and ESXCLI references"
  - "Proxmox VE Administration Guide ToC (pve.proxmox.com/pve-docs) - Installation, Host System Administration (package repositories, system software updates, network configuration, ZFS on Linux), Cluster Manager (pvecm, corosync, QDevice), Proxmox Cluster File System, Storage (storage.cfg, LVM-thin, ZFS, NFS/CIFS, Ceph RBD/CephFS), Hyper-converged Ceph (pveceph), Storage Replication (pvesr), QEMU/KVM Virtual Machines (qm), Proxmox Container Toolkit (pct), Software Defined Network, Proxmox VE Firewall, User Management (pveum, realms, API tokens), High Availability (ha-manager), Backup and Restore (vzdump); Proxmox Backup Server docs ToC"
  - "Hyper-V on Windows Server docs ToC (learn.microsoft.com/windows-server/virtualization/hyper-v) - Get started/install, Plan (VM generation, networking, scalability, security), Deploy (virtual switches, SET, live migration, Hyper-V Replica, export/import), Manage (checkpoints, Integration Services, dynamic memory, nested virtualization, DDA), Failover Clustering with CSV and Cluster-Aware Updating, Guarded fabric and shielded VMs"
  - "NIST SP 800-40 Rev. 4 Guide to Enterprise Patch Management Planning - Section 2 risk responses (accept, mitigate, transfer, avoid), Section 3 maintenance plans (software inventory, asset groups, maintenance groups, routine and emergency plans, EOL software), Section 4 metrics; patch lifecycle (identify, plan, prepare, acquire, validate, deploy, verify, monitor); companion SP 1800-31"
  - "ITIL 4 practice guides - Change Enablement (standard/normal/emergency changes, change authority, change schedule, risk assessment, PIR), Release Management (release planning, release types, release records), Deployment Management (phased, continuous, big bang, pull deployment), Service Configuration Management (CMDB, baselines)"
  - "NIST SP 800-34 Rev. 1 Contingency Planning Guide for Federal Information Systems - Section 3 process (policy, BIA with MTD/RTO/RPO, preventive controls, recovery strategies incl. backup methods and alternate sites, plan testing/training/exercises, plan maintenance), Section 4 ISCP development (activation and notification, recovery, reconstitution, appendices), Section 5 technical considerations (client/server, telecom, mainframe)"
  - "Veeam Backup & Replication 12 User Guide ToC - architecture (backup server, proxies, repositories, SOBR, hardened repository, WAN accelerators), backup jobs (methods, retention, GFS, encryption, health check), backup copy, replication and failover, restore (instant recovery, file-level, application items), SureBackup, Veeam Agents, configuration backup; restic documentation (init, backends, backup, forget/prune, check, restore, mount, keys); Bacula Main Reference (Director, Storage, File daemons, FileSet, Schedule, Pool, Volume, Catalog, bconsole restore, autochangers)"
