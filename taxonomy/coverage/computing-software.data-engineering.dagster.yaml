# Coverage spec: dagster. Topics from the official docs.
subject: dagster
scope:
  category: computing-software
  field: data-engineering
  products: [dagster]
sources:
  - "Dagster docs (docs.dagster.io) guides and deployment sections"
topics:
  - id: arbitrary-python-automation-conditions
    name: "arbitrary python automation conditions"
    source: "https://docs.dagster.io/guides/automate/declarative-automation/customizing-automation-conditions/arbitrary-python-automation-conditions"
    match: [dagster, custom-automation-condition, use-user-code-server]
  - id: asset-dependencies-and-code-locations
    name: "asset dependencies and code locations"
    source: "https://docs.dagster.io/guides/build/assets/defining-assets-with-asset-dependencies"
    match: [dagster, asset-dependencies, deps]
  - id: asset-factories-with-components
    name: "asset factories with components"
    source: "https://docs.dagster.io/guides/build/assets/creating-asset-factories"
    match: [dagster, asset-factory, components]
  - id: asset-groups-and-nested-groups
    name: "asset groups and nested groups"
    source: "https://docs.dagster.io/guides/build/assets/metadata-and-tags/groups"
    match: [dagster, groups, group-name]
  - id: asset-observations
    name: "asset observations"
    source: "https://docs.dagster.io/guides/build/assets/metadata-and-tags/asset-observations"
    match: [dagster, asset-observation, log-event]
