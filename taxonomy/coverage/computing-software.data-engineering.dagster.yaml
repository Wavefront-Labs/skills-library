    match: [dagster, asset-selection, key-filter]
  - id: asset-sensors
    name: "asset sensors"
    source: "https://docs.dagster.io/guides/automate/asset-sensors"
    match: [dagster, asset-sensor, multi-asset-sensor]
  - id: asset-versioning-and-caching
    name: "asset versioning and caching"
    source: "https://docs.dagster.io/guides/build/assets/asset-versioning-and-caching"
    match: [dagster, code-version, data-version]
