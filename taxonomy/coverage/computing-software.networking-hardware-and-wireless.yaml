# Canonical coverage spec: Networking Hardware & Wireless (whole field).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: networking-hardware-and-wireless
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [wifi-80211, structured-cabling, switching-routing-hardware, network-device-administration, sd-wan]
sources:
  - "IEEE 802.11 standard family (ieee802.org/11; standards.ieee.org) - amendments by designation: a/b/g/n/ac/ax/be, e (QoS), i (security), k/v/r (roaming), w (PMF)"
  - "Wi-Fi Alliance programme pages (wi-fi.org) - Wi-Fi 4/5/6/6E/7, WPA3, Enhanced Open, Passpoint, Agile Multiband"
  - "CWNP CWNA/CWDP/CWSP exam objectives (cwnp.com) - RF fundamentals, hardware, design, security, troubleshooting"
  - "ANSI/TIA-568 series, TIA-569 pathways and spaces, TIA-606 administration, TIA-942 data centres (designations only; tiaonline.org); ISO/IEC 11801 generic cabling"
  - "BICSI Information Technology Systems Installation Methods Manual and CommScope/Fluke Networks cabling test guides (site roots)"
  - "IEEE 802.3 Ethernet standard clauses (ieee802.org/3) - 802.3af/at/bt PoE, 802.3an 10GBASE-T, 802.3bz multigig, fibre PMDs"
  - "Cisco documentation and CCNA 200-301 blueprint (cisco.com) - switching, routing, wireless, SD-WAN design and operations guides"
  - "Juniper documentation (juniper.net/documentation) - Junos OS fundamentals, configuration/commit model, EVPN-VXLAN data-centre guides"
  - "Ubiquiti UniFi help centre (help.ui.com) - UniFi Network application, gateways, switches, access points"
  - "RFC 7348 VXLAN, RFC 4271 BGP-4, RFC 2328 OSPFv2, RFC 5880 BFD, RFC 5798 VRRPv3, RFC 7432 EVPN"
  - "MEF and ONUG SD-WAN service definitions (site roots); vendor SD-WAN design guides (Cisco, Fortinet, Palo Alto, HPE Aruba)"
topics:
  - id: wifi-standards-generations
    name: "802.11 amendments and Wi-Fi generations"
    source: "IEEE 802.11 amendments; Wi-Fi Alliance generations"
    match: [wifi-standards-generations]
    subtopics:
      - {id: wifi-standards-generations-wifi-generations-and-phy-rates, name: "Map Wi-Fi 4/5/6/6E/7 to 802.11n/ac/ax/be and PHY rates", match: [wifi-generations]}
      - {id: wifi-standards-generations-wifi-mcs-and-guard-interval, name: "Read MCS index, spatial streams, channel width and guard interval", match: [wifi-mcs-index]}
      - {id: wifi-standards-generations-wifi-airtime-and-legacy-protection, name: "Explain airtime, legacy rates and protection overhead", match: [wifi-airtime]}
  - id: wifi-bands-channels
    name: "Bands, channel plans and regulatory domains"
    source: "IEEE 802.11 channelisation; CWNA RF chapters"
    match: [wifi-bands-channels]
    subtopics:
      - {id: wifi-bands-channels-wifi-24ghz-channel-plan, name: "Plan 2.4 GHz channels 1/6/11 and avoid overlap", match: [wifi-24ghz-channels]}
      - {id: wifi-bands-channels-wifi-5ghz-dfs-channels, name: "Use 5 GHz UNII bands, DFS channels and channel width safely", match: [wifi-5ghz-dfs]}
      - {id: wifi-bands-channels-wifi-6ghz-psc-and-afc, name: "Deploy 6 GHz: PSC channels, AFC and standard power", match: [wifi-6ghz]}
  - id: wifi-rf-fundamentals
    name: "RF fundamentals"
    source: "CWNA exam objectives; RF physics for WLAN"
    match: [wifi-rf-fundamentals]
    subtopics:
      - {id: wifi-rf-fundamentals-wifi-link-budget-and-rssi-snr, name: "Compute link budget and read RSSI, SNR and noise floor", match: [wifi-link-budget]}
      - {id: wifi-rf-fundamentals-wifi-antenna-patterns-and-polarisation, name: "Choose AP antennas: omni, patch, directional and polarisation", match: [wifi-antennas]}
      - {id: wifi-rf-fundamentals-wifi-mimo-mu-mimo-ofdma, name: "Explain MIMO, MU-MIMO, beamforming and OFDMA", match: [wifi-mimo]}
  - id: wifi-security
    name: "WLAN security: WPA2/WPA3, 802.1X, PMF"
    source: "IEEE 802.11i/w; Wi-Fi Alliance WPA3; CWSP objectives"
    match: [wifi-security]
    subtopics:
      - {id: wifi-security-wifi-wpa3-sae-transition, name: "Deploy WPA3-Personal (SAE) with transition mode", match: [wifi-wpa3-sae]}
      - {id: wifi-security-wifi-8021x-eap-design, name: "Design WPA2/WPA3-Enterprise with 802.1X, EAP-TLS and RADIUS", match: [wifi-8021x]}
      - {id: wifi-security-wifi-pmf-and-deauth-protection, name: "Enable Protected Management Frames and handle deauth attacks", match: [wifi-pmf-80211w]}
      - {id: wifi-security-wifi-guest-captive-portal-and-owe, name: "Build a guest WLAN: isolation, captive portal and Enhanced Open", match: [wifi-guest-network]}
  - id: wifi-roaming
    name: "Roaming and fast transition"
    source: "IEEE 802.11k/v/r; CWNA roaming"
    match: [wifi-roaming]
    subtopics:
      - {id: wifi-roaming-wifi-80211r-fast-transition, name: "Configure 802.11r Fast BSS Transition", match: [wifi-80211r]}
      - {id: wifi-roaming-wifi-80211k-v-assisted-roaming, name: "Use 802.11k neighbor reports and 802.11v BSS transition", match: [wifi-80211k]}
      - {id: wifi-roaming-wifi-layer2-vs-layer3-roaming, name: "Design L2 and L3 roaming and mobility tunnels", match: [wifi-layer3-roaming]}
  - id: wifi-site-survey
    name: "Surveys and WLAN design"
    source: "CWNP CWDP; Ekahau/AirMagnet vendor survey workflows"
    match: [wifi-site-survey]
    subtopics:
      - {id: wifi-site-survey-wifi-predictive-vs-onsite-survey, name: "Choose predictive, pre-deployment and post-deployment surveys", match: [wifi-site-survey]}
      - {id: wifi-site-survey-wifi-capacity-and-density-design, name: "Design for capacity: clients per AP, cell sizing and high density", match: [wifi-capacity-planning]}
      - {id: wifi-site-survey-wifi-wired-uplink-and-poe-for-aps, name: "Size AP uplinks and PoE class for Wi-Fi 6/7", match: [wifi-ap-uplink]}
  - id: wifi-troubleshooting
    name: "Troubleshooting WLANs"
    source: "CWNA troubleshooting; Wireshark WLAN capture practices"
    match: [wifi-troubleshooting]
    subtopics:
      - {id: wifi-troubleshooting-wifi-connectivity-triage, name: "Triage WLAN problems: association, auth, DHCP, roaming, throughput", match: [wifi-troubleshooting]}
      - {id: wifi-troubleshooting-wifi-packet-capture-80211, name: "Capture 802.11 traffic in monitor mode and decode association problems", match: [wifi-packet-capture]}
      - {id: wifi-troubleshooting-wifi-interference-and-spectrum-analysis, name: "Identify interference with spectrum analysis", match: [wifi-spectrum-analysis]}
  - id: wifi-architectures
    name: "WLAN architectures: controller, cloud, mesh, bridge"
    source: "Vendor architecture guides; 802.11s"
    match: [wifi-architectures]
    subtopics:
      - {id: wifi-architectures-wifi-controller-cloud-autonomous, name: "Compare controller-based, cloud-managed and autonomous WLAN architectures", match: [wlan-architectures]}
      - {id: wifi-architectures-wifi-mesh-and-wireless-backhaul, name: "Design wireless mesh and point-to-point backhaul", match: [wifi-mesh]}
      - {id: wifi-architectures-wifi-qos-wmm-and-voice, name: "Configure WMM QoS and voice/video on WLAN", match: [wifi-wmm-qos]}
  - id: cabling-categories-channels
