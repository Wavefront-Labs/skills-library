      - {id: bc-evm-execution-opcode-reading-and-disassembly, name: "Reading opcodes and bytecode", match: [opcode-reading]}
      - {id: bc-evm-execution-create-create2-deployment, name: "CREATE and CREATE2 addresses", match: [create2-address]}
  - id: bc-eth-abi
    name: "ABI encoding, selectors and logs"
