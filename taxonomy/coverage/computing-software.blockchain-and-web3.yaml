# Canonical coverage spec: Blockchain & Web3 (whole field).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: blockchain-and-web3
scope:
  category: computing-software
  field: blockchain-and-web3
  products: [ethereum-evm, solidity, smart-contract-security, foundry-hardhat-tooling, bitcoin, wallets-and-keys, consensus-and-protocols]
sources:
  - "Ethereum.org developer docs (ethereum.org/en/developers/docs) - accounts, transactions, gas, EVM, nodes, APIs, scaling, consensus mechanisms, smart contracts, standards"
  - "Solidity documentation (docs.soliditylang.org) - language description, types, contracts, ABI spec, security considerations, Yul, style guide"
  - "Ethereum Yellow Paper and EIP repository (eips.ethereum.org) for EIP-20, 55, 712, 721, 1155, 1559, 1967, 4626"
  - "OpenZeppelin Contracts documentation (docs.openzeppelin.com) - access control, tokens, proxy upgrade patterns"
  - "ConsenSys Smart Contract Best Practices and SWC Registry - known attacks, development recommendations"
  - "Foundry Book (book.getfoundry.sh) and Hardhat docs (hardhat.org/docs) - forge, cast, anvil, testing, scripting, deployment, verification"
  - "Bitcoin Developer Documentation (developer.bitcoin.org) and BIPs 32, 39, 44, 125, 141, 340, 341 - transactions, Script, wallets, RPC"
  - "Bitcoin whitepaper (bitcoin.org/bitcoin.pdf) and Ethereum consensus docs - proof of work, proof of stake, Gasper, slashing, finality"
topics:
  - id: bc-eth-accounts
    name: "Accounts and state"
    source: "ethereum.org docs/Accounts, Ethereum stack"
    match: [bc-eth-accounts]
    subtopics:
      - {id: bc-eth-accounts-eoa-vs-contract-accounts, name: "EOA versus contract accounts", match: [eoa-vs-contract]}
      - {id: bc-eth-accounts-account-nonce-management, name: "Nonce handling and stuck transactions", match: [account-nonce]}
      - {id: bc-eth-accounts-state-trie-and-merkle-proofs, name: "State trie and Merkle proofs", match: [state-trie]}
  - id: bc-eth-transactions
    name: "Transactions and fees"
    source: "ethereum.org docs/Transactions, Gas and fees"
    match: [bc-eth-transactions]
    subtopics:
      - {id: bc-eth-transactions-eip1559-fee-fields, name: "EIP-1559 fee fields", match: [eip1559-fees]}
      - {id: bc-eth-transactions-transaction-types-and-receipts, name: "Transaction types, status and receipts", match: [transaction-types]}
      - {id: bc-eth-transactions-access-lists-and-blob-txs, name: "Access lists and blob transactions", match: [access-list-tx]}
  - id: bc-eth-gas
    name: "Gas accounting"
    source: "ethereum.org docs/Gas, Yellow Paper"
    match: [bc-eth-gas]
    subtopics:
      - {id: bc-eth-gas-intrinsic-gas-and-estimation, name: "Intrinsic gas and gas estimation", match: [intrinsic-gas]}
      - {id: bc-eth-gas-storage-gas-and-refunds, name: "Storage gas costs and refunds", match: [sstore-cost]}
  - id: bc-evm-execution
    name: "EVM execution model"
    source: "ethereum.org docs/EVM, evm.codes"
    match: [bc-evm-execution]
    subtopics:
