# Coverage spec: netbird. Topics from the NetBird docs (docs.netbird.io, github.com/netbirdio/docs).
subject: netbird
scope:
  category: computing-software
  field: systems-network-administration
  products: [netbird]
sources:
  - "NetBird docs (docs.netbird.io, github.com/netbirdio/docs)"
topics:
  - id: install-linux
    name: "Linux client installation"
    source: "https://docs.netbird.io/get-started/install/linux"
    match: [install-linux, install-script, apt, dnf, rpm-ostree, homebrew]
  - id: install-docker
    name: "Docker and rootless client"
    source: "https://docs.netbird.io/get-started/install/docker"
    match: [docker, container-client, cap-net-admin, rootless-image]
  - id: cli-global
    name: "CLI global flags and precedence"
    source: "https://docs.netbird.io/get-started/cli"
    match: [global-flags, nb-env-vars, config-precedence]
  - id: cli-up
    name: "netbird up flags"
    source: "https://docs.netbird.io/get-started/cli"
    match: [netbird-up, interface-name, wireguard-port, mtu, foreground-mode]
  - id: cli-status
    name: "Status output and health probes"
    source: "https://docs.netbird.io/get-started/cli"
    match: [netbird-status, health-check, json-output, peer-filtering]
  - id: cli-service
    name: "Service management"
    source: "https://docs.netbird.io/get-started/cli"
    match: [service-install, service-reconfigure, service-env, daemon]
  - id: cli-debug
    name: "Debug bundles, tracing and log level"
    source: "https://docs.netbird.io/get-started/cli"
    match: [debug-bundle, trace-logging, packet-trace, log-level]
  - id: cli-profiles-networks
    name: "Profiles and network selection"
    source: "https://docs.netbird.io/get-started/cli"
    match: [profiles, networks-select, routes-alias, multi-account]
  - id: setup-keys
    name: "Setup keys"
    source: "https://docs.netbird.io/manage/peers/register-machines-using-setup-keys"
    match: [setup-keys, one-off-key, reusable-key, ephemeral-peers, auto-groups]
  - id: peer-approval
    name: "Peer approval"
    source: "https://docs.netbird.io/manage/peers/approve-peers"
    match: [peer-approval, device-admission, pending-peers]
  - id: client-auto-update
    name: "Client automatic updates"
    source: "https://docs.netbird.io/manage/peers/auto-update"
    match: [auto-update, force-update, pinned-version, client-versions]
  - id: bootstrap-config
    name: "Bootstrapping peers via config file"
    source: "https://docs.netbird.io/manage/peers/bootstrap-via-config-file"
    match: [default-json, bootstrap, unattended-deployment, kubernetes-init-container]
  - id: lazy-connections
    name: "Lazy connections"
    source: "https://docs.netbird.io/manage/peers/lazy-connection"
    match: [lazy-connections, inactivity-threshold, dns-warmup, nb-lazy-conn]
  - id: ssh-enable
    name: "Built-in SSH server"
    source: "https://docs.netbird.io/manage/peers/ssh"
    match: [netbird-ssh, allow-server-ssh, ssh-sftp, ssh-port-forwarding]
  - id: ssh-auth
    name: "SSH connecting and authentication"
    source: "https://docs.netbird.io/manage/peers/ssh"
    match: [jwt-authentication, machine-identity, openssh-client]
  - id: ssh-troubleshooting
    name: "SSH troubleshooting"
    source: "https://docs.netbird.io/manage/peers/ssh"
    match: [ssh-troubleshooting, permission-denied, sftp-unavailable]
  - id: browser-client
    name: "Browser client (SSH and RDP)"
    source: "https://docs.netbird.io/manage/peers/browser-client"
    match: [browser-client, webassembly, browser-ssh, browser-rdp]
  - id: remote-jobs
    name: "Remote jobs"
    source: "https://docs.netbird.io/manage/peers/remote-jobs"
    match: [remote-jobs, remote-debug-bundle, allow-remote-jobs]
  - id: access-policies
    name: "Access policies"
    source: "https://docs.netbird.io/manage/access-control/manage-network-access"
    match: [access-policies, default-policy, bidirectional, port-ranges, allow-only]
  - id: groups
    name: "Groups"
    source: "https://docs.netbird.io/manage/access-control/manage-network-access"
    match: [groups, all-group, auto-grouping, idp-synced-groups]
  - id: posture-checks
    name: "Posture checks"
    source: "https://docs.netbird.io/manage/access-control/posture-checks"
    match: [posture-checks, zero-trust, geo-restriction, os-version-check, process-check]
  - id: posture-office
    name: "Office bypass with network range checks"
    source: "https://docs.netbird.io/manage/access-control/posture-checks/connecting-from-the-office"
    match: [office-network, network-range-check, on-site-bypass]
  - id: device-certificates
    name: "Device certificate posture check"
    source: "https://docs.netbird.io/manage/access-control/posture-checks/device-certificates"
    match: [device-certificates, certificate-posture-check, tpm, pkcs11]
  - id: networks
    name: "Networks and resources"
    source: "https://docs.netbird.io/manage/networks"
    match: [networks, network-resources, clientless-devices]
  - id: routing-peers
    name: "Routing peers"
    source: "https://docs.netbird.io/manage/networks/how-routing-peers-work"
    match: [routing-peers, ip-forwarding, ha-failover, input-chain-policy]
  - id: masquerade
    name: "Masquerade off and return routes"
    source: "https://docs.netbird.io/manage/networks/masquerade"
    match: [masquerade, return-route, source-ip-visibility, netplan]
  - id: sizing
    name: "Sizing routing peers"
    source: "https://docs.netbird.io/manage/networks/sizing-routing-peers"
    match: [capacity-planning, routing-peer-sizing, throughput, jumbo-frames]
  - id: legacy-routes
    name: "Network routes (legacy)"
    source: "https://docs.netbird.io/manage/network-routes"
    match: [network-routes, routing-groups, distribution-groups, acl-groups]
  - id: dns-routes
    name: "DNS routes"
    source: "https://docs.netbird.io/manage/network-routes"
    match: [dns-routes, domain-routing, keep-routes, dns-router-interval]
  - id: exit-nodes
    name: "Exit nodes"
    source: "https://docs.netbird.io/manage/network-routes"
    match: [exit-nodes, default-route, block-lan-access, dns-leak]
  - id: overlapping-routes
    name: "Overlapping route selection"
    source: "https://docs.netbird.io/manage/network-routes/overlapping-routes"
    match: [overlapping-routes, route-selection, desktop-app-resources]
  - id: site-to-site
    name: "Site-to-site routing"
    source: "https://docs.netbird.io/manage/network-routes/use-cases/site-to-site"
    match: [site-to-site, static-routes, cloud-forwarding, routing-peer-groups]
  - id: dns-nameservers
    name: "Nameservers and match domains"
    source: "https://docs.netbird.io/manage/dns"
    match: [nameservers, match-domains, search-domains, platform-dns]
  - id: peer-dns-names
    name: "Peer DNS names"
    source: "https://docs.netbird.io/manage/dns"
    match: [peer-dns-names, netbird-cloud-domain, hostname-collisions, rename-peer]
  - id: dns-zones
    name: "Custom DNS zones"
    source: "https://docs.netbird.io/manage/dns/custom-zones"
    match: [custom-zones, dns-records, split-horizon]
  - id: dns-settings
    name: "DNS management modes"
    source: "https://docs.netbird.io/manage/dns/dns-settings"
    match: [dns-settings, unmanaged-dns, disable-dns, domain-controllers]
  - id: dns-aliases
    name: "DNS aliases for routed networks"
    source: "https://docs.netbird.io/manage/dns/dns-aliases-for-routed-networks"
    match: [dns-aliases, domain-resources, routing-peer-dns]
  - id: extra-labels
    name: "Extra DNS labels"
    source: "https://docs.netbird.io/manage/dns/extra-dns-labels"
    match: [extra-dns-labels, wildcard-labels, round-robin-dns]
  - id: dns-troubleshooting
    name: "DNS troubleshooting"
    source: "https://docs.netbird.io/manage/dns/troubleshooting"
    match: [dns-troubleshooting, resolvectl, nrpt, flush-dns, isolation-test]
  - id: dns-domain-resource-debug
    name: "Domain resource debugging"
    source: "https://docs.netbird.io/manage/dns/troubleshooting"
    match: [dns-forwarder, port-22054, routing-peer-debug]
  - id: audit-events
    name: "Audit events"
    source: "https://docs.netbird.io/manage/activity"
    match: [audit-events, activity-log, encryption-key, unknown-events]
  - id: traffic-events
    name: "Traffic events logging"
    source: "https://docs.netbird.io/manage/activity/traffic-events-logging"
    match: [traffic-events, flow-logs, kernel-reporting, siem-correlation]
  - id: event-streaming
    name: "Event streaming to SIEM"
    source: "https://docs.netbird.io/manage/activity/event-streaming"
    match: [event-streaming, siem, delivery-retries, streaming-cache-ttl]
  - id: streaming-datadog
    name: "Datadog event streaming"
    source: "https://docs.netbird.io/manage/activity/event-streaming/datadog"
    match: [datadog, cloud-siem, log-collection-api, integration-test]
  - id: client-metrics
    name: "Client metrics push"
    source: "https://docs.netbird.io/manage/client-metrics"
    match: [client-metrics, share-performance-metrics, nb-metrics-push-enabled]
  - id: local-metrics
    name: "Local Prometheus metrics endpoint"
    source: "https://docs.netbird.io/client/local-metrics"
    match: [prometheus, local-metrics, grafana-dashboard, mdm-metrics]
  - id: service-users
    name: "Service users and access tokens"
    source: "https://docs.netbird.io/manage/public-api"
    match: [service-users, personal-access-tokens, api-automation, msp-tenant-token]
  - id: api-auth
    name: "API authentication"
    source: "https://docs.netbird.io/ipa/guides/authentication"
    match: [rest-api, bearer-token, authorization-header, api-rate-limits]
  - id: mfa
    name: "Multi-factor authentication"
    source: "https://docs.netbird.io/manage/settings/multi-factor-authentication"
    match: [mfa, recovery-codes, reset-mfa, cloud-authentication]
  - id: session-expiration
    name: "Peer session expiration"
    source: "https://docs.netbird.io/manage/settings/enforce-periodic-user-authentication"
    match: [session-expiration, login-required, reauthentication, per-peer-exemption]
  - id: user-roles
    name: "User roles"
    source: "https://docs.netbird.io/manage/team/user-roles"
    match: [user-roles, rbac, network-admin, auditor]
  - id: user-approval
    name: "User approval"
    source: "https://docs.netbird.io/manage/team/approve-users"
    match: [user-approval, domain-matching, pending-users]
  - id: offboarding
    name: "Offboarding via IdP sync"
    source: "https://docs.netbird.io/manage/team/auto-offboard-users"
    match: [offboarding, idp-sync-revocation, group-access-revocation]
  - id: idp-sync
    name: "IdP sync overview"
    source: "https://docs.netbird.io/manage/team/idp-sync"
    match: [idp-sync, scim, user-provisioning, synced-groups]
  - id: sso-cloud
    name: "Cloud SSO providers"
    source: "https://docs.netbird.io/manage/team/single-sign-on"
    match: [single-sign-on, oidc-providers, okta, cloud-plans]
  - id: sign-in-domains
    name: "Sign-in domains"
    source: "https://docs.netbird.io/manage/team/sign-in-domains"
    match: [sign-in-domains, domain-verification, txt-record, cloud-onboarding]
  - id: selfhosted-setup-api
    name: "Self-hosted automated setup"
    source: "https://docs.netbird.io/selfhosted/automated-setup"
    match: [self-hosted, api-setup, setup-pat, nb-setup-pat-enabled]
  - id: selfhosted-backup
    name: "Self-hosted backup and restore"
    source: "https://docs.netbird.io/selfhosted/maintenance/backup"
    match: [backup, restore, docker-compose-volumes]
  - id: selfhosted-upgrade
    name: "Self-hosted upgrade"
    source: "https://docs.netbird.io/selfhosted/maintenance/upgrade"
    match: [upgrade, traefik-upgrade, rollback]
  - id: external-relays
    name: "External relay servers"
    source: "https://docs.netbird.io/selfhosted/maintenance/scaling/set-up-external-relays"
    match: [external-relay, stun, relay-secret]
  - id: relayed-troubleshooting
    name: "Relayed connection troubleshooting"
    source: "https://docs.netbird.io/help/troubleshooting-relayed-connections"
    match: [relayed-connections, symmetric-nat, hole-punching, stun-blocked]
  - id: ports-firewalls
    name: "Ports and firewalls"
    source: "https://docs.netbird.io/about-netbird/ports-and-firewalls"
    match: [firewall-rules, stun-ports, relay-ports, ufw-wt0, static-wireguard-port]
  - id: architecture
    name: "Architecture overview"
    source: "https://docs.netbird.io/about-netbird/how-netbird-works"
    match: [architecture, management-service, signal-service, relay-service, wireguard-mesh]
  - id: client-troubleshooting
    name: "Client troubleshooting"
    source: "https://docs.netbird.io/help/troubleshooting-client"
    match: [client-troubleshooting, client-logs, foreground-debug, login-failures]
  - id: resource-access-troubleshooting
    name: "Resource access troubleshooting"
    source: "https://docs.netbird.io/help/troubleshooting-resource-connectivity"
    match: [resource-access, routing-peer-checks, route-table, access-control-check]
