# Coverage spec for portainer, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: portainer
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [portainer]
sources:
  - "Portainer documentation (docs in portainer/portainer-docs, folder 2.39-lts)"
topics:
  - id: architecture
    name: "Server and Agent architecture"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/swarm/linux.md"
    match: [architecture, server, agent]
  - id: edge-vs-classic-agent
    name: "Edge Agent versus classic Agent"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/swarm/linux.md"
    match: [edge-agent, agent]
  - id: air-gapped
    name: "Air-gapped operation"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/security.md"
    match: [air-gapped]
  - id: install-docker-linux
    name: "Install on Docker Standalone Linux"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/swarm/linux.md"
    match: [install, docker, linux]
  - id: install-ports-volumes
    name: "Ports and data volume"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/edge-agent.md"
    match: [ports, volumes]
  - id: install-selinux
    name: "SELinux and privileged mode"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/docker/linux.md"
    match: [selinux]
  - id: install-swarm
    name: "Install on Docker Swarm"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/swarm/linux.md"
    match: [docker-swarm, stack, manager-node]
  - id: install-podman
    name: "Install on Podman"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/podman/linux.md"
    match: [podman, docker-compatible-api]
  - id: install-kubernetes
    name: "Install on Kubernetes"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/kubernetes/baremetal.md"
    match: [kubernetes, helm]
  - id: kubernetes-storageclass
    name: "Default StorageClass requirement"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/kubernetes/baremetal.md"
    match: [storageclass]
  - id: setup-token
    name: "Setup token"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/setup.md"
    match: [setup-token]
  - id: initial-setup
    name: "First-time admin and license setup"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/setup.md"
    match: [setup, admin-user, license]
  - id: environment-wizard
    name: "Environment wizard"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/setup.md"
    match: [environment-wizard]
  - id: classic-agent-docker
    name: "Classic Agent on Docker"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/environments/add/docker/agent.md"
    match: [agent-secret, port-9001]
  - id: edge-standard
    name: "Edge Agent standard mode"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/environments/add/docker/edge.md"
    match: [standard-mode, tunnel]
  - id: edge-async
    name: "Edge Agent async mode"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/environments/add/docker/edge.md"
    match: [async-mode]
  - id: edge-insecure-poll
    name: "Self-signed certificate polling"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/environments/add/docker/edge.md"
    match: [edge-insecure-poll]
  - id: edge-key
    name: "Edge key and edge ID"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/edge-agent.md"
    match: [edge-key, edge-id]
  - id: edge-ports
    name: "Edge ports and join token"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/edge-agent.md"
    match: [ports]
  - id: edge-mtls
    name: "Edge Agent mutual TLS"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/mtls.md"
    match: [mtls, certificates]
  - id: edge-troubleshooting
    name: "Edge connection troubleshooting"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/troubleshooting/agents-and-environment-management/troubleshooting-edge-agent-connection-issues.md"
    match: [troubleshooting, firewall]
  - id: edge-update-rollback
    name: "Update and rollback Edge Agents"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/environments/update.md"
    match: [update, rollback, edge-groups]
  - id: environment-groups
    name: "Environment groups"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/environments/groups.md"
    match: [groups, environments]
  - id: environment-tags
    name: "Environment tags"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/registries/manage.md"
    match: [tags, organisation]
  - id: ldap-auth
    name: "LDAP authentication"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/settings/authentication/ldap.md"
    match: [ldap, openldap]
  - id: oauth-auth
    name: "OAuth authentication"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/settings/authentication/oauth.md"
    match: [oauth, sso, entra-id]
  - id: general-settings
    name: "General settings"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/settings/general.md"
    match: [settings, snapshot-interval]
  - id: rbac-roles
    name: "Roles and RBAC"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/start/install/server/kubernetes/baremetal.md"
    match: [rbac, roles, privileges]
  - id: teams
    name: "Teams"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/user/roles.md"
    match: [teams]
  - id: access-control-docker
    name: "Resource access control"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/access-control.md"
    match: [access-control, ownership]
  - id: database-encryption
    name: "Database encryption"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/db-encryption.md"
    match: [encryption, boltdb]
  - id: reset-admin-password
    name: "Reset admin password"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/reset-admin.md"
    match: [admin-password, recovery]
  - id: reverse-proxy
    name: "Reverse proxy with nginx or Traefik"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/reverse-proxy/nginx.md"
    match: [reverse-proxy, nginx, traefik]
  - id: own-ssl-certificate
    name: "Own SSL certificate"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/ssl.md"
    match: [ssl, sslcert, pem]
  - id: custom-ca
    name: "Custom certificate authority"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/troubleshooting/certificates-and-security/how-can-i-use-my-custom-certificate-authority-ca-with-portainer.md"
    match: [custom-ca, trust-store]
  - id: security-hardening
    name: "Security model and hardening"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/security.md"
    match: [security, shared-responsibility]
  - id: syslog
    name: "Audit logs to syslog"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/siem.md"
    match: [syslog, siem, audit-logs]
  - id: cli-flags
    name: "Server command line flags"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/cli.md"
    match: [cli, flags]
  - id: backup-restore
    name: "Backup and restore"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/getting-started/what-does-portainers-backup-include.md"
    match: [backup, restore, portainer-db]
  - id: upgrade-rollback
    name: "Upgrade and roll back"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/upgrading/how-can-i-roll-back-to-a-previous-version-of-portainer.md"
    match: [upgrade, schema]
  - id: persistence
    name: "Persistent configuration"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/installing/how-can-i-ensure-portainers-configuration-is-retained.md"
    match: [persistence, placement-constraint]
  - id: git-auto-updates
    name: "Git stack auto updates"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/troubleshooting/stacks-deployments-and-updates/how-do-automatic-updates-for-stacks-applications-work.md"
    match: [gitops, webhooks]
  - id: relative-paths
    name: "Relative path volumes"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/troubleshooting/stacks-deployments-and-updates/how-do-automatic-updates-for-stacks-applications-work.md"
    match: [relative-paths, bind-mounts]
  - id: stack-env
    name: "stack.env and compose variables"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/faqs/troubleshooting/stacks-deployments-and-updates/environment-variable-management-in-docker-.env-vs.-stack.env.md"
    match: [stack-env, env-vars]
  - id: app-templates
    name: "App templates JSON format"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/app-templates/format.md"
    match: [app-templates, json]
  - id: custom-templates
    name: "Custom templates"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/advanced/app-templates/format.md"
    match: [custom-templates]
  - id: api-access
    name: "API access tokens"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/api/access.md"
    match: [api, access-token]
  - id: registry-tags
    name: "Registry tag management"
    source: "https://github.com/portainer/portainer-docs/blob/HEAD/2.39-lts/admin/registries/manage.md"
    match: [registries, retag]
