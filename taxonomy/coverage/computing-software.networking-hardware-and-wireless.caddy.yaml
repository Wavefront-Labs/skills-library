    name: "Reverse proxy active health checks"
    source: "https://caddyserver.com/docs/caddyfile/directives/reverse_proxy"
    match: [health-checks, active-health, health-uri]
  - id: reverse-proxy-dynamic-upstreams
    name: "Reverse proxy dynamic upstreams"
    source: "https://caddyserver.com/docs/caddyfile/directives/reverse_proxy"
    match: [dynamic-upstreams, srv-records, a-records]
