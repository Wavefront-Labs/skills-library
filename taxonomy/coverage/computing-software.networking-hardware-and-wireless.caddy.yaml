    name: "Redir redirects"
    source: "https://caddyserver.com/docs/caddyfile/directives/redir"
    match: [redir, redirect, 301]
  - id: respond-static-responses
    name: "Respond static responses"
    source: "https://caddyserver.com/docs/caddyfile/directives/respond"
    match: [respond, static-response, health-check]
