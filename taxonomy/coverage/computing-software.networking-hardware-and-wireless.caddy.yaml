# Coverage spec: caddy. Topics from the official docs ToC in sources.
subject: caddy
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [caddy]
sources:
  - "https://caddyserver.com/docs/"
topics:
  - id: acme-challenges-http-tls-alpn-dns
    name: "Acme challenges http tls alpn dns"
    source: "https://caddyserver.com/docs/automatic-https"
    match: [acme-challenges, http-01, tls-alpn-01]
  - id: acme-server-internal-ca
    name: "Acme server internal ca"
    source: "https://caddyserver.com/docs/caddyfile/directives/acme_server"
    match: [acme-server, internal-ca, pki]
  - id: automatic-https-activation
    name: "Automatic https activation"
    source: "https://caddyserver.com/docs/automatic-https"
    match: [automatic-https, activation, http-redirect]
  - id: automatic-https-hostname-eligibility
    name: "Automatic https hostname eligibility"
    source: "https://caddyserver.com/docs/automatic-https"
    match: [hostname-requirements, certificate-eligibility, wildcard]
  - id: basic-auth-directive
    name: "Basic auth directive"
    source: "https://caddyserver.com/docs/caddyfile/directives/basic_auth"
    match: [basic-auth, authentication, caddyfile]
  - id: bind-listener-interface
    name: "Bind listener interface"
    source: "https://caddyserver.com/docs/caddyfile/directives/bind"
    match: [bind, listener, loopback]
  - id: certificate-errors-retries-issuer-fallback
    name: "Certificate errors retries issuer fallback"
    source: "https://caddyserver.com/docs/automatic-https"
    match: [acme-errors, retries, issuer-fallback]
  - id: client-ip-remote-ip-not
    name: "Client ip remote ip not"
    source: "https://caddyserver.com/docs/caddyfile/matchers"
    match: [client-ip, remote-ip, private-ranges]
  - id: encode-compression
    name: "Encode compression"
    source: "https://caddyserver.com/docs/caddyfile/directives/encode"
    match: [encode, compression, gzip]
  - id: encrypted-clienthello-ech
    name: "Encrypted clienthello ech"
    source: "https://caddyserver.com/docs/automatic-https"
    match: [ech, encrypted-clienthello, sni]
  - id: error-directive-trigger
    name: "Error directive trigger"
    source: "https://caddyserver.com/docs/caddyfile/directives/error"
    match: [error, handle-errors, status-code]
  - id: expression-matcher-cel
    name: "Expression matcher cel"
    source: "https://caddyserver.com/docs/caddyfile/matchers"
    match: [expression-matcher, cel, boolean-logic]
  - id: file-matcher-and-placeholders
    name: "File matcher and placeholders"
    source: "https://caddyserver.com/docs/caddyfile/matchers"
    match: [file-matcher, try-policy, split-path]
  - id: file-server-basics
    name: "File server basics"
    source: "https://caddyserver.com/docs/caddyfile/directives/file_server"
    match: [file-server, static-files, canonical-uris]
  - id: file-server-browse-listings
    name: "File server browse listings"
    source: "https://caddyserver.com/docs/caddyfile/directives/file_server"
    match: [browse, directory-listing, file-server]
  - id: file-server-precompressed
    name: "File server precompressed"
    source: "https://caddyserver.com/docs/caddyfile/directives/file_server"
    match: [precompressed, sidecar-files, brotli]
  - id: forward-auth-gateway
    name: "Forward auth gateway"
    source: "https://caddyserver.com/docs/caddyfile/directives/forward_auth"
    match: [forward-auth, authelia, tailscale]
  - id: fs-custom-filesystem
    name: "Fs custom filesystem"
    source: "https://caddyserver.com/docs/caddyfile/directives/fs"
    match: [fs, filesystem, global-option]
  - id: handle-directive
    name: "Handle directive"
    source: "https://caddyserver.com/docs/caddyfile/directives/handle"
    match: [handle, routing, mutual-exclusion]
  - id: handle-errors-custom-pages
    name: "Handle errors custom pages"
    source: "https://caddyserver.com/docs/caddyfile/directives/handle_errors"
    match: [handle-errors, error-pages, err-status-code]
  - id: handle-path-prefix-stripping
    name: "Handle path prefix stripping"
    source: "https://caddyserver.com/docs/caddyfile/directives/handle_path"
    match: [handle-path, strip-prefix, path-matcher]
  - id: header-matchers
    name: "Header matchers"
    source: "https://caddyserver.com/docs/caddyfile/matchers"
    match: [header-matcher, header-regexp, capture-groups]
  - id: header-response-headers
    name: "Header response headers"
    source: "https://caddyserver.com/docs/caddyfile/directives/header"
    match: [header, response-headers, defer]
  - id: host-method-query-protocol-matchers
    name: "Host method query protocol matchers"
    source: "https://caddyserver.com/docs/caddyfile/matchers"
    match: [host-matcher, method-matcher, query-matcher]
  - id: import-snippets-and-args
    name: "Import snippets and args"
    source: "https://caddyserver.com/docs/caddyfile/directives/import"
    match: [import, snippets, args]
  - id: intercept-responses
    name: "Intercept responses"
    source: "https://caddyserver.com/docs/caddyfile/directives/intercept"
    match: [intercept, handle-response, replace-status]
  - id: invoke-named-routes
    name: "Invoke named routes"
    source: "https://caddyserver.com/docs/caddyfile/directives/invoke"
    match: [invoke, named-routes, route-reuse]
  - id: local-https-internal-ca
    name: "Local https internal ca"
    source: "https://caddyserver.com/docs/automatic-https"
    match: [local-https, internal-ca, root-certificate]
  - id: log-append-custom-fields
    name: "Log append custom fields"
    source: "https://caddyserver.com/docs/caddyfile/directives/log_append"
    match: [log-append, access-log, custom-fields]
  - id: log-name-multiple-loggers
    name: "Log name multiple loggers"
    source: "https://caddyserver.com/docs/caddyfile/directives/log_name"
    match: [log-name, no-hostname, access-log]
  - id: map-directive-placeholders
    name: "Map directive placeholders"
    source: "https://caddyserver.com/docs/caddyfile/directives/map"
    match: [map, custom-placeholders, regexp]
  - id: matchers-syntax-named-matchers
    name: "Matchers syntax named matchers"
    source: "https://caddyserver.com/docs/caddyfile/matchers"
    match: [matchers, named-matchers, matcher-set]
  - id: on-demand-tls
    name: "On demand tls"
    source: "https://caddyserver.com/docs/automatic-https"
    match: [on-demand-tls, ask-endpoint, sni]
  - id: path-matcher-wildcards
    name: "Path matcher wildcards"
    source: "https://caddyserver.com/docs/caddyfile/matchers"
    match: [path-matcher, wildcard, prefix-match]
