    source: "https://caddyserver.com/docs/caddyfile/directives/reverse_proxy"
    match: [handle-response, replace-status, copy-response]
  - id: reverse-proxy-header-manipulation
    name: "Reverse proxy header manipulation"
    source: "https://caddyserver.com/docs/caddyfile/directives/reverse_proxy"
