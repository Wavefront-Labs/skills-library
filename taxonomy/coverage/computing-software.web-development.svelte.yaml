# Coverage spec: svelte. Topics from the Svelte 5 docs (sveltejs/svelte, documentation/docs/ folder).
subject: svelte
scope:
  category: computing-software
  field: web-development
  products: [svelte]
sources:
  - "Svelte docs (raw markdown in github.com/sveltejs/svelte, documentation/docs/ folder)"
topics:
  - id: runes-overview
    name: "What runes are"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/01-what-are-runes.md"
    match: [runes, rune-keywords, svelte-5, dollar-prefix]
  - id: state-basics
    name: "Reactive state with $state"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/02-%24state.md"
    match: [state-rune, reactive-state, deep-reactivity, state-proxy, state-class-fields]
  - id: state-raw-snapshot
    name: "$state.raw, $state.snapshot and $state.eager"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/02-%24state.md"
    match: [state-raw, state-snapshot, state-eager, structured-clone]
  - id: state-sharing
    name: "Sharing state across modules"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/02-%24state.md"
    match: [shared-state, svelte-js-modules, export-state, reactive-getter]
  - id: derived-basics
    name: "Computed values with $derived"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/03-%24derived.md"
    match: [derived-rune, derived-by, computed-state, reactive-dependencies]
  - id: derived-semantics
    name: "Derived overrides, destructuring and update propagation"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/03-%24derived.md"
    match: [derived-override, optimistic-ui, push-pull-reactivity, derived-destructuring, derived-equality]
  - id: effect-basics
    name: "Side effects with $effect"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/04-%24effect.md"
    match: [effect-rune, effect-teardown, effect-dependencies, side-effects, untrack]
  - id: effect-variants
    name: "$effect.pre, $effect.tracking, $effect.pending and $effect.root"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/04-%24effect.md"
    match: [effect-pre, effect-tracking, effect-pending, effect-root, create-subscriber]
  - id: effect-when-not
    name: "When not to use $effect"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/04-%24effect.md"
    match: [effect-antipattern, derived-instead-of-effect, sync-state, effect-loop]
  - id: props-basics
    name: "Component props with $props"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/05-%24props.md"
    match: [props-rune, component-props, destructuring-props, fallback-values, rest-props]
  - id: props-updating
    name: "Updating and mutating props"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/05-%24props.md"
    match: [prop-mutation, ownership-invalid-mutation, callback-props, prop-reassignment]
  - id: props-types-id
    name: "Typing props and $props.id"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/05-%24props.md"
    match: [props-typing, props-id, unique-id, aria-labelledby]
  - id: bindable
    name: "Two-way component props with $bindable"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/06-%24bindable.md"
    match: [bindable-rune, two-way-binding, bind-component-prop, bindable-fallback]
  - id: inspect
    name: "Debugging with $inspect"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/07-%24inspect.md"
    match: [inspect-rune, inspect-trace, reactive-debugging, dev-only]
  - id: host
    name: "Custom element host with $host"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/02-runes/08-%24host.md"
    match: [host-rune, custom-element-host, dispatch-custom-event, shadow-host]
  - id: markup-basics
    name: "Basic markup, attributes and expressions"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/01-basic-markup.md"
    match: [basic-markup, attribute-expressions, spread-attributes, shorthand-attributes, text-expressions]
  - id: event-attributes
    name: "Event attributes and delegation"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/01-basic-markup.md"
    match: [event-attributes, onclick, event-delegation, svelte-events-on, passive-touch-events]
  - id: if-block
    name: "Conditional rendering with {#if}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/02-if.md"
    match: [if-block, conditional-rendering, else-if, template-if]
  - id: each-block
    name: "Lists with {#each}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/03-each.md"
    match: [each-block, keyed-each, list-rendering, each-else, destructuring-each]
  - id: key-block
    name: "Re-creating content with {#key}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/04-key.md"
    match: [key-block, reinstantiate-component, replay-transition, destroy-recreate]
  - id: await-block
    name: "Promises with {#await}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/05-await.md"
    match: [await-block, promise-states, lazy-component-import, pending-then-catch]
  - id: snippets
    name: "Reusable markup with {#snippet}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/06-snippet.md"
    match: [snippet-block, reusable-markup, snippet-scope, recursive-snippet, snippet-parameters]
  - id: snippet-props
    name: "Passing snippets to components and children"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/06-snippet.md"
    match: [snippet-props, children-snippet, implicit-snippet-props, optional-snippet, slots-replacement]
  - id: snippet-typing
    name: "Typing and exporting snippets"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/06-snippet.md"
    match: [snippet-type, export-snippet, script-module, typed-snippets]
  - id: render-tag
    name: "Rendering snippets with {@render}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/07-%40render.md"
    match: [render-tag, at-render, render-snippet, optional-chaining-render, dynamic-snippet]
  - id: html-tag
    name: "Raw HTML with {@html}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/08-%40html.md"
    match: [html-tag, at-html, raw-html, xss-prevention]
  - id: attach-tag
    name: "Attachments with {@attach}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/09-%40attach.md"
    match: [attach-tag, attachments, attachment-factory, inline-attachment, conditional-attachment]
  - id: attach-components
    name: "Attachments on components and re-running"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/09-%40attach.md"
    match: [attachment-symbol-key, wrapper-components, create-attachment-key, from-action, attachment-rerun]
  - id: declaration-tags
    name: "Local declarations with {@const}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/10-%40const.md"
    match: [declaration-tags, local-const, at-const, lexical-scope]
  - id: debug-tag
    name: "Template debugging with {@debug}"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/11-%40debug.md"
    match: [debug-tag, at-debug, debugger-statement, template-debugging]
  - id: bind-inputs
    name: "Binding form inputs"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/12-bind.md"
    match: [bind-directive, bind-value, bind-checked, bind-group, function-bindings]
  - id: bind-select-media
    name: "Binding select, files, media and details"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/12-bind.md"
    match: [bind-files, bind-select, bind-audio-video, bind-details-open, bind-contenteditable]
  - id: bind-dimensions-this
    name: "Dimension bindings and bind:this"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/12-bind.md"
    match: [bind-this, bind-client-width, resize-observer, component-instance-binding]
  - id: actions
    name: "Actions with use:"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/13-use.md"
    match: [use-directive, actions, action-typing, svelte-action, legacy-action-update]
  - id: transition-basics
    name: "Transitions"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/14-transition.md"
    match: [transition-directive, svelte-transition, local-vs-global-transition, transition-events]
  - id: transition-custom
    name: "Custom transition functions"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/14-transition.md"
    match: [custom-transition, transition-css-function, transition-tick, easing]
  - id: in-out
    name: "in: and out: directives"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/15-in-and-out.md"
    match: [in-directive, out-directive, unidirectional-transition, aborted-outro]
  - id: animate
    name: "Animations with animate:"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/16-animate.md"
    match: [animate-directive, svelte-animate, flip, keyed-each-reorder, custom-animation]
  - id: style-directive
    name: "style: directive"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/17-style.md"
    match: [style-directive, inline-styles, important-modifier, style-precedence]
  - id: class-attribute
    name: "class attribute and clsx"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/18-class.md"
    match: [class-attribute, clsx-classes, class-directive, conditional-classes]
  - id: await-expressions
    name: "await expressions in components"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/19-await-expressions.md"
    match: [await-expressions, experimental-async, synchronized-updates, concurrency, settled]
  - id: async-ssr
    name: "Async rendering on the server and fork"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/03-template-syntax/19-await-expressions.md"
    match: [async-ssr, fork-api, preloading, pending-snippet-ssr]
  - id: scoped-styles
    name: "Scoped styles"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/04-styling/01-scoped-styles.md"
    match: [scoped-styles, component-css, specificity, scoped-keyframes, style-element]
  - id: global-styles
    name: "Global styles"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/04-styling/02-global-styles.md"
    match: [global-modifier, global-block, global-keyframes, unscoped-css]
  - id: custom-properties
    name: "CSS custom properties on components"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/04-styling/03-custom-properties.md"
    match: [css-custom-properties, component-theming, svelte-css-wrapper, var-fallback]
  - id: svelte-boundary
    name: "Error and pending boundaries"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/05-special-elements/01-svelte-boundary.md"
    match: [svelte-boundary, error-boundary, pending-snippet, failed-snippet, onerror-handler]
  - id: global-elements
    name: "svelte:window, svelte:document and svelte:body"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/05-special-elements/02-svelte-window.md"
    match: [svelte-window, svelte-document, svelte-body, global-event-listeners, scroll-binding]
  - id: head-element
    name: "svelte:head and svelte:element"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/05-special-elements/05-svelte-head.md"
    match: [svelte-head, svelte-element, dynamic-tag, document-head, seo-meta]
  - id: svelte-options
    name: "Per-component compiler options with svelte:options"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/05-special-elements/07-svelte-options.md"
    match: [svelte-options, runes-mode-flag, css-injected, namespace-option, customelement-option]
  - id: stores
    name: "Stores and auto-subscription"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/01-stores.md"
    match: [svelte-stores, store-auto-subscription, dollar-store-prefix, runes-vs-stores]
  - id: store-factories
    name: "writable, readable, derived and readonly stores"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/01-stores.md"
    match: [writable-store, readable-store, derived-store, readonly-store, store-get]
  - id: store-contract
    name: "Store contract and custom stores"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/01-stores.md"
    match: [store-contract, custom-store, subscribe-method, rxjs-interop]
  - id: context
    name: "Context API"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/02-context.md"
    match: [create-context, set-context, get-context, prop-drilling, has-context]
  - id: context-state
    name: "Context with state and SSR safety"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/02-context.md"
    match: [context-with-state, ssr-global-state-leak, wrapper-component-context, mount-with-context]
  - id: lifecycle
    name: "Lifecycle hooks"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/03-lifecycle-hooks.md"
    match: [onmount, ondestroy, tick, before-update-deprecated, after-update-deprecated]
  - id: imperative-api
    name: "Imperative component API"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/04-imperative-component-api.md"
    match: [mount-function, unmount-function, hydrate-function, server-render, flush-sync]
  - id: hydratable
    name: "Hydratable data and CSP"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/06-runtime/05-hydratable.md"
    match: [hydratable, hydration-data, devalue-serialization, csp-nonce, csp-hash]
  - id: best-practices
    name: "Svelte best practices"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/01-best-practices.md"
    match: [svelte-best-practices, runes-mode, avoid-legacy, keyed-each-index, styling-child-components]
  - id: testing-unit
    name: "Unit and component testing with Vitest"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/02-testing.md"
    match: [vitest-setup, svelte-unit-testing, effect-root-testing, jsdom-component-test, testing-library-svelte]
  - id: testing-storybook-e2e
    name: "Storybook and Playwright testing"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/02-testing.md"
    match: [storybook-play-function, playwright-e2e, sv-add-storybook, define-meta, web-server-config]
  - id: typescript-setup
    name: "TypeScript setup"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/03-typescript.md"
    match: [script-lang-ts, type-only-features, vite-plugin-preprocess, tsconfig-verbatim-module-syntax, svelte-check]
  - id: typescript-props
    name: "Typing props and generic components"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/03-typescript.md"
    match: [typed-props, generics-script-attribute, html-button-attributes, svelte-html-elements, wrapper-component-types]
  - id: typescript-components
    name: "Typing state, components and DOM augmentation"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/03-typescript.md"
    match: [typed-state, component-type, component-props-type, augment-svelte-elements, dom-type-enhancement]
  - id: custom-elements
    name: "Custom elements"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/04-custom-elements.md"
    match: [custom-elements, web-components, element-constructor, wrapper-lifecycle, connected-callback]
  - id: custom-elements-options
    name: "Custom element options and caveats"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/04-custom-elements.md"
    match: [custom-element-options, shadow-root-option, props-reflect-attribute, extend-option, custom-element-caveats]
  - id: v4-migration
    name: "Svelte 4 migration guide"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/06-v4-migration-guide.md"
    match: [svelte-4-migration, browser-condition-bundlers, transitions-local-default, preprocessor-order, custom-element-option]
  - id: v5-migration-syntax
    name: "Svelte 5 migration: syntax changes"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/07-v5-migration-guide.md"
    match: [svelte-5-migration, migrate-script, let-to-state, export-let-to-props, slots-to-snippets, callback-props]
  - id: v5-migration-breaking
    name: "Svelte 5 migration: components and breaking changes"
    source: "https://raw.githubusercontent.com/sveltejs/svelte/main/documentation/docs/07-misc/07-v5-migration-guide.md"
    match: [mount-hydrate-migration, components-not-classes, runes-mode-breaking-changes, whitespace-handling, scoped-css-where]
