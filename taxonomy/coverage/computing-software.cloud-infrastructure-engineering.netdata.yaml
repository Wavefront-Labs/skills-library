# Coverage spec: netdata. Topics from the Netdata docs (netdata/netdata, docs/ and src/).
subject: netdata
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [netdata]
sources:
  - "Netdata docs (github.com/netdata/netdata/tree/master/docs and src)"
topics:
  - id: edit-config
    name: "Editing configuration with edit-config"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/README.md"
    match: [edit-config, netdata-conf, config-directory]
  - id: start-stop-unix
    name: "Start, stop and restart on UNIX"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/start-stop-restart.md"
    match: [systemctl, restart-agent, init-script]
  - id: start-stop-windows-macos
    name: "Service control on Windows and macOS"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/start-stop-restart.md"
    match: [windows-service, homebrew, brew-services]
  - id: netdatacli
    name: "netdatacli runtime commands"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/start-stop-restart.md"
    match: [netdatacli, reload-health, readiness-check]
  - id: backup-restore
    name: "Backup and restore an Agent"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/backup-and-restore-an-agent.md"
    match: [backup, restore, var-cache-netdata]
  - id: bearer-token
    name: "Bearer token protection"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/secure-your-netdata-agent-with-bearer-token.md"
    match: [bearer-token, cloud-sso, mcp-key]
  - id: network-access
    name: "Restricting dashboard network access"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/securing-netdata-agents.md"
    match: [bind-to, allow-connections-from, access-lists]
  - id: disable-dashboard
    name: "Disabling the local dashboard"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/securing-netdata-agents.md"
    match: [web-mode-none, disable-dashboard, healthcheck-target]
  - id: dyncfg
    name: "Dynamic Configuration Manager"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/dynamic-configuration.md"
    match: [dynamic-configuration, collector-jobs, dyncfg]
  - id: dyncfg-errors
    name: "Dynamic Configuration troubleshooting"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/dynamic-configuration.md"
    match: [http-412, http-403, disable-alert]
  - id: agent-performance
    name: "Optimizing Agent performance"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/optimize-the-netdata-agents-performance.md"
    match: [resource-usage, ram-mode, ml-disable]
  - id: custom-ca
    name: "Custom CA certificates"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/using-custom-ca-certificates-with-netdata.md"
    match: [custom-ca, tls-intercepting-proxy, update-ca-certificates]
  - id: sizing-overview
    name: "Sizing Agents overview"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/sizing-netdata-agents/README.md"
    match: [sizing, resource-requirements, capacity-planning]
  - id: dbengine-retention
    name: "dbengine tiers and retention"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/sizing-netdata-agents/disk-requirements-and-retention.md"
    match: [dbengine, retention, db-tiers]
  - id: parent-ram
    name: "Parent RAM sizing"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/sizing-netdata-agents/ram-requirements.md"
    match: [parent-sizing, ram-requirements, journal-centralization]
  - id: parent-cpu
    name: "Parent CPU sizing"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/sizing-netdata-agents/cpu-requirements.md"
    match: [cpu-requirements, ml-training]
  - id: stream-bandwidth
    name: "Streaming bandwidth and compression"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/sizing-netdata-agents/bandwidth-requirements.md"
    match: [bandwidth, stream-compression, zstd]
  - id: firewall-egress
    name: "Firewall ports and egress endpoints"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configure-netdata-for-cybersecurity-platforms.md"
    match: [firewall, egress-allowlist, port-19999]
  - id: streaming-setup
    name: "Parent-Child streaming setup"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/metrics-centralization-points/configuration.md"
    match: [stream-conf, parent-child, api-key]
  - id: streaming-tls
    name: "TLS for streaming"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/metrics-centralization-points/configuration.md"
    match: [streaming-tls, ssl-destination, certificate-verification]
  - id: streaming-logs
    name: "Streaming troubleshooting via logs"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/metrics-centralization-points/configuration.md"
    match: [journalctl, message-id, streaming-logs]
  - id: parent-ha
    name: "Parent clustering and high availability"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/metrics-centralization-points/clustering-and-high-availability-of-netdata-parents.md"
    match: [parent-cluster, high-availability, failover]
  - id: replication
    name: "Replication of past samples"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/metrics-centralization-points/replication-of-past-samples.md"
    match: [replication, replication-period, replication-threads]
  - id: parent-retention
    name: "Parent retention planning"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/best-practices.md"
    match: [retention-time, retention-size, disk-planning]
  - id: topology
    name: "Streaming topology rules"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/metrics-centralization-points/README.md"
    match: [thin-mode, parent-hierarchy, grand-parent]
  - id: ephemeral-nodes
    name: "Ephemeral nodes"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/nodes-ephemerality.md"
    match: [ephemeral-node, remove-stale-node, disconnect-alerts]
  - id: central-alerts
    name: "Centralizing alerts on a Parent"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/metrics-centralization-points/faq.md"
    match: [central-alerts, duplicate-alerts, health-enabled]
  - id: alert-syntax
    name: "Alert definition syntax"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/REFERENCE.md"
    match: [health-d, alarm-template, alert-lines]
  - id: alert-lookup
    name: "Alert lookup syntax"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/REFERENCE.md"
    match: [alert-lookup, percentage-of-time, anomaly-bit]
  - id: override-alerts
    name: "Overriding stock alerts"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/overriding-stock-alerts.md"
    match: [override-alert, stock-alerts, chart-id]
  - id: alert-precedence
    name: "Alert configuration ordering"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/alert-configuration-ordering.md"
    match: [alert-precedence, file-shadowing, health-config]
  - id: disable-silence
    name: "Disabling and silencing alerts"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/REFERENCE.md"
    match: [enabled-alarms, to-silent, health-disable]
  - id: alert-flapping
    name: "Alert hysteresis, delay and repeat"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/REFERENCE.md"
    match: [alert-flapping, delay-line, repeat-line]
  - id: alert-labels
    name: "Host and chart label scoping"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/REFERENCE.md"
    match: [host-labels, chart-labels, alert-scope]
  - id: missing-alerts
    name: "Troubleshooting missing stock alerts"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/README.md"
    match: [missing-alerts, dyncfg-override]
  - id: email-notifications
    name: "Agent email notifications"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/health/README.md"
    match: [health-alarm-notify, email-notifications, duplicate-emails]
  - id: reverse-proxy-nginx
    name: "Reverse proxy with Nginx"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/running-the-netdata-agent-behind-a-reverse-proxy/Running-behind-nginx.md"
    match: [reverse-proxy, nginx, basic-auth]
  - id: reverse-proxy-haproxy
    name: "Reverse proxy with HAProxy"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/running-the-netdata-agent-behind-a-reverse-proxy/Running-behind-haproxy.md"
    match: [haproxy, subpath]
  - id: reverse-proxy-caddy
    name: "Reverse proxy with Caddy"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-agent/configuration/running-the-netdata-agent-behind-a-reverse-proxy/Running-behind-caddy.md"
    match: [caddy, caddyfile]
  - id: exporting
    name: "Exporting connectors"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/exporting-metrics/enable-an-exporting-connector.md"
    match: [exporting-conf, graphite, opentsdb]
  - id: cardinality
    name: "Extreme cardinality protection"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/extreme-cardinality-protection.md"
    match: [extreme-cardinality, ephemerality, meta-db]
  - id: secret-references
    name: "Collector secret references"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/collectors/SECRETS.md"
    match: [secrets, env-file-cmd, urienc]
  - id: secretstores
    name: "Secretstore backends"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/collectors/SECRETS.md"
    match: [secretstore, vault, aws-secrets-manager]
  - id: disable-collectors
    name: "Disabling plugins and collectors"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/collectors/REFERENCE.md"
    match: [go-d-conf, plugins-section, disable-collector]
  - id: collection-frequency
    name: "Collection frequency"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/collectors/REFERENCE.md"
    match: [update-every, sampling-interval, plugin-frequency]
  - id: debug-collector
    name: "Debugging collectors"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/src/collectors/REFERENCE.md"
    match: [plugins-d, go-d-plugin, collector-debug]
  - id: text-logs
    name: "Text logs to journals"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/logs/text-files-to-journals.md"
    match: [log2journal, systemd-cat-native, journal-namespace]
  - id: log-retention
    name: "Journal and Event Log retention"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/logs/log-storage-and-retention.md"
    match: [journald-conf, log-retention, wevtutil]
  - id: otel-log-store
    name: "OpenTelemetry log store retention"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/logs/log-storage-and-retention.md"
    match: [otel-yaml, s3-offload]
  - id: log-centralization
    name: "Log centralization design"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/observability-centralization-points/logs-centralization-points-with-systemd-journald/README.md"
    match: [log-centralization, journal-remote, windows-event-forwarding]
  - id: node-states
    name: "Node states and transitions"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-cloud/node-states-and-transitions.md"
    match: [node-states, stale-node, tcp-keepalive]
  - id: lightweight-child
    name: "Lightweight Child configuration"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/deployment-guides/deployment-strategies.md"
    match: [lightweight-child, iot]
  - id: tiered-parent
    name: "Tiered storage Parent example"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/deployment-guides/deployment-strategies.md"
    match: [tiered-storage, backfill, page-cache]
  - id: active-active
    name: "Active-active Parents configuration"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/deployment-guides/deployment-strategies.md"
    match: [active-active, destination-list]
  - id: windows-msi
    name: "Windows MSI install and channels"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/install/windows-release-channels.md"
    match: [windows-msi, msiexec, nightly-channel]
  - id: cloud-ips
    name: "Cloud outbound IP allowlist"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/netdata-cloud/netdata-cloud-outbound-ips.md"
    match: [ip-allowlist, webhook-notifications, mcp-endpoint]
  - id: standalone-cloud
    name: "Standalone versus Cloud deployment"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/deployment-guides/standalone-deployment.md"
    match: [standalone-deployment, cloud-connected, claim-token]
  - id: ai-troubleshooting
    name: "AI alert troubleshooting"
    source: "https://raw.githubusercontent.com/netdata/netdata/master/docs/troubleshooting/troubleshoot.md"
    match: [ai-troubleshooting, ask-ai, ai-credits]
