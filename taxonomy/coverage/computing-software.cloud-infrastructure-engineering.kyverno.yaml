# Coverage spec: Kyverno. Topics from the Kyverno docs table of contents.
subject: Kyverno
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [kyverno]
sources:
  - "Kyverno docs (kyverno.io/docs)"
topics:
  - id: quick-start
    name: "Quick start"
    source: "https://kyverno.io/docs/introduction/quick-start/"
    match: [quick-start, helm-install]
  - id: how-kyverno-works
    name: "How Kyverno works"
    source: "https://kyverno.io/docs/introduction/how-kyverno-works/"
    match: [architecture, admission-controller]
  - id: installation
    name: "Installation"
    source: "https://kyverno.io/docs/installation/"
    match: [install, helm]
  - id: platform-notes
    name: "Platform notes"
    source: "https://kyverno.io/docs/installation/platform-notes/"
    match: [argocd, openshift, eks, aks]
  - id: configuring-kyverno
    name: "Configuring Kyverno"
    source: "https://kyverno.io/docs/installation/customization/"
    match: [configmap, resourcefilters, flags]
  - id: scaling-kyverno
    name: "Scaling Kyverno"
    source: "https://kyverno.io/docs/installation/scaling/"
    match: [scaling, sizing]
  - id: upgrading-kyverno
    name: "Upgrading Kyverno"
    source: "https://kyverno.io/docs/installation/upgrading/"
    match: [upgrade, breaking-changes]
  - id: uninstalling-kyverno
    name: "Uninstalling Kyverno"
    source: "https://kyverno.io/docs/installation/uninstallation/"
    match: [uninstall, webhook-cleanup]
  - id: policy-types-overview
    name: "Policy types overview"
    source: "https://kyverno.io/docs/policy-types/"
    match: [policy-types, cel-policies]
  - id: validating-policy
    name: "ValidatingPolicy"
    source: "https://kyverno.io/docs/policy-types/validating-policy/"
    match: [validatingpolicy, validationactions]
  - id: mutating-policy
    name: "MutatingPolicy"
    source: "https://kyverno.io/docs/policy-types/mutating-policy/"
    match: [mutatingpolicy, applyconfiguration]
  - id: generating-policy
    name: "GeneratingPolicy"
    source: "https://kyverno.io/docs/policy-types/generating-policy/"
    match: [generatingpolicy, generator-apply]
  - id: deleting-policy
    name: "DeletingPolicy"
    source: "https://kyverno.io/docs/policy-types/deleting-policy/"
    match: [deletingpolicy, schedule]
  - id: image-validating-policy
    name: "ImageValidatingPolicy"
    source: "https://kyverno.io/docs/policy-types/image-validating-policy/"
    match: [imagevalidatingpolicy, cosign]
  - id: cel-libraries
    name: "CEL libraries"
    source: "https://kyverno.io/docs/policy-types/cel-libraries/"
    match: [cel-libraries, http-client]
  - id: clusterpolicy-settings
    name: "ClusterPolicy settings"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/policy-settings/"
    match: [policy-settings, applyrules]
  - id: match-and-exclude
    name: "Match and exclude"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/match-exclude/"
    match: [match, exclude]
  - id: validate-rules
    name: "Validate rules"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/validate/"
    match: [validate, anypattern]
  - id: mutate-rules
    name: "Mutate rules"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/mutate/"
    match: [mutate, patchstrategicmerge]
  - id: generate-rules
    name: "Generate rules"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/generate/"
    match: [generate, clonelist]
  - id: verify-images-rules
    name: "Verify images rules"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/verify-images/overview/"
    match: [verifyimages, mutatedigest]
  - id: autogen-rules
    name: "Auto-gen rules for Pod controllers"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/autogen/"
    match: [autogen, autogen-controllers]
  - id: variables-and-context
    name: "Variables and context"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/variables/"
    match: [variables, context]
  - id: jmespath-in-kyverno
    name: "JMESPath in Kyverno"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/jmespath/"
    match: [jmespath, custom-filters]
  - id: preconditions
    name: "Preconditions"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/preconditions/"
    match: [preconditions, operators]
  - id: external-data-sources
    name: "External data sources"
    source: "https://kyverno.io/docs/policy-types/cluster-policy/external-data-sources/"
    match: [apicall, globalcontextentry]
  - id: cleanup-policy
    name: "CleanupPolicy and TTL label"
    source: "https://kyverno.io/docs/policy-types/cleanup-policy/"
    match: [cleanuppolicy, ttl-label]
  - id: applying-policies
    name: "Applying policies"
    source: "https://kyverno.io/docs/guides/applying-policies/"
    match: [applying-policies, application-modes]
  - id: migration-to-cel
    name: "Migration to CEL policies"
    source: "https://kyverno.io/docs/guides/migration-to-cel/"
    match: [migration-to-cel, field-mapping]
  - id: policy-exceptions
    name: "Policy exceptions"
    source: "https://kyverno.io/docs/guides/exceptions/"
    match: [policyexception, reportresult]
  - id: policy-reports
    name: "Policy reports"
    source: "https://kyverno.io/docs/guides/reports/"
    match: [policyreport, allowedresults]
  - id: monitoring-metrics
    name: "Monitoring"
    source: "https://kyverno.io/docs/guides/monitoring/"
    match: [monitoring, servicemonitor]
  - id: tracing
    name: "Tracing"
    source: "https://kyverno.io/docs/guides/tracing/"
    match: [tracing, opentelemetry]
  - id: high-availability
    name: "High availability"
    source: "https://kyverno.io/docs/guides/high-availability/"
    match: [high-availability, leader-election]
  - id: security-hardening
    name: "Security hardening"
    source: "https://kyverno.io/docs/guides/security/"
    match: [security-hardening, sbom]
  - id: troubleshooting
    name: "Troubleshooting"
    source: "https://kyverno.io/docs/guides/troubleshooting/"
    match: [troubleshooting, webhook-recovery]
  - id: pod-security-policies
    name: "Pod Security Standards policies"
    source: "https://kyverno.io/docs/guides/pod-security/"
    match: [pod-security, pod-security-standards]
  - id: metrics-reference
    name: "Metrics reference"
    source: "https://kyverno.io/docs/reference/metrics/"
    match: [metrics-reference, prometheus-metrics]
  - id: cli-apply
    name: "kyverno apply"
    source: "https://kyverno.io/docs/kyverno-cli/reference/kyverno_apply/"
    match: [kyverno-apply, warn-exit-code]
  - id: cli-test
    name: "kyverno test"
    source: "https://kyverno.io/docs/kyverno-cli/reference/kyverno_test/"
    match: [kyverno-test, test-case-selector]
  - id: cli-jp-query
    name: "kyverno jp query"
    source: "https://kyverno.io/docs/kyverno-cli/reference/kyverno_jp_query/"
    match: [kyverno-jp, jp-query]
  - id: cli-create-exception
    name: "kyverno create exception"
    source: "https://kyverno.io/docs/kyverno-cli/reference/kyverno_create_exception/"
    match: [create-exception, kyverno-create]
  - id: subprojects-overview
    name: "Sub-projects"
    source: "https://kyverno.io/docs/subprojects/chainsaw/"
    match: [subprojects, chainsaw]
