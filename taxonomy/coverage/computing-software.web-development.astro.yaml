# Coverage spec: astro. Topics from the Astro docs (withastro/docs, src/content/docs/en).
subject: astro
scope:
  category: computing-software
  field: web-development
  products: [astro]
sources:
  - "Astro docs (github.com/withastro/docs/tree/main/src/content/docs/en)"
topics:
  - id: component-script-and-template
    name: "Astro component script and template"
    source: "https://docs.astro.build/en/basics/astro-components/"
    match: [component-script-and-template, astro-components]
  - id: component-props
    name: "Component props"
    source: "https://docs.astro.build/en/basics/astro-components/"
    match: [component-props]
  - id: slots
    name: "Slots: default, named and fallback"
    source: "https://docs.astro.build/en/basics/astro-components/"
    match: [slots-default-and-named, slot-fallback-and-transfer]
  - id: html-components
    name: "HTML components"
    source: "https://docs.astro.build/en/basics/astro-components/"
    match: [html-components]
  - id: pages-and-error-pages
    name: "Pages, file types, 404 and 500 pages"
    source: "https://docs.astro.build/en/basics/astro-pages/"
    match: [pages-file-types-and-linking, custom-404-and-500-pages, error-pages]
  - id: page-partials
    name: "Page partials and htmx"
    source: "https://docs.astro.build/en/basics/astro-pages/"
    match: [page-partials-htmx]
  - id: layouts
    name: "Layout components"
    source: "https://docs.astro.build/en/basics/layouts/"
    match: [layout-components]
  - id: markdown-mdx-layouts
    name: "Markdown and MDX page layouts"
    source: "https://docs.astro.build/en/basics/layouts/"
    match: [markdown-page-layouts, mdx-layouts-manual-import]
  - id: project-structure
    name: "Project structure and config files"
    source: "https://docs.astro.build/en/basics/project-structure/"
    match: [project-structure-directories, project-config-files]
  - id: static-routes
    name: "Static routes and navigation"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [static-routes-and-navigation]
  - id: dynamic-routes
    name: "Dynamic routes with getStaticPaths"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [dynamic-routes-getstaticpaths, rest-parameters-and-props]
  - id: on-demand-dynamic-routes
    name: "On-demand dynamic routes"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [on-demand-dynamic-routes]
  - id: redirects
    name: "Configured and dynamic redirects"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [configured-redirects, dynamic-redirects-astro-redirect]
  - id: rewrites
    name: "Rewrites"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [rewrites]
  - id: route-priority
    name: "Route priority and reserved routes"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [route-priority-and-reserved-routes]
  - id: pagination
    name: "Pagination and nested pagination"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [pagination-paginate, nested-pagination]
  - id: advanced-routing
    name: "Advanced routing with the fetch entrypoint"
    source: "https://docs.astro.build/en/guides/routing/"
    match: [advanced-routing-fetch-entrypoint]
  - id: content-collections-define
    name: "Define content collections"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [content-collections-define]
  - id: collection-loaders
    name: "Glob and file loaders"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [glob-loader-and-custom-ids, file-loader-and-parsers]
  - id: collection-schema
    name: "Collection schemas with Zod"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [collection-schema-zod]
  - id: collection-references
    name: "Collection references"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [collection-references]
  - id: query-collections
    name: "Query and filter collections"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [query-collections-and-filter]
  - id: render-collection-entries
    name: "Render collection entry content"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [render-collection-entry-content]
  - id: collection-routes
    name: "Generate routes from collections"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [generate-routes-from-collections]
  - id: live-collections
    name: "Live content collections, errors and cache hints"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [live-content-collections, live-collection-errors-and-cache-hints]
  - id: collection-json-schema
    name: "JSON schema for editors"
    source: "https://docs.astro.build/en/guides/content-collections/"
    match: [collection-json-schema-editor]
  - id: static-endpoints
    name: "Static file endpoints"
    source: "https://docs.astro.build/en/guides/endpoints/"
    match: [static-file-endpoints]
  - id: server-endpoints
    name: "Server endpoints and API routes"
    source: "https://docs.astro.build/en/guides/endpoints/"
    match: [server-endpoints-api-routes]
  - id: middleware-basics
    name: "Middleware basics and locals"
    source: "https://docs.astro.build/en/guides/middleware/"
    match: [middleware-basics-and-locals]
  - id: middleware-sequence
    name: "Middleware types and sequence"
    source: "https://docs.astro.build/en/guides/middleware/"
    match: [middleware-types-and-sequence]
  - id: middleware-rewrite
    name: "Middleware rewrites and error pages"
    source: "https://docs.astro.build/en/guides/middleware/"
    match: [middleware-rewrite-and-error-pages]
  - id: server-islands
    name: "Server islands"
    source: "https://docs.astro.build/en/guides/server-islands/"
    match: [server-islands-defer, server-islands-caching-url-and-key]
  - id: on-demand-rendering
    name: "On-demand rendering and adapters"
    source: "https://docs.astro.build/en/guides/on-demand-rendering/"
    match: [enable-on-demand-rendering, on-demand-cookies-request-response]
  - id: env-vars
    name: "Environment variables"
    source: "https://docs.astro.build/en/guides/environment-variables/"
    match: [env-vars-import-meta-env]
  - id: astro-env
    name: "Type-safe astro:env schema"
    source: "https://docs.astro.build/en/guides/environment-variables/"
    match: [astro-env-type-safe-schema]
  - id: prefetch
    name: "Prefetching links"
    source: "https://docs.astro.build/en/guides/prefetch/"
    match: [prefetch-links, prefetch-api-and-browser-support]
  - id: client-scripts
    name: "Client-side scripts"
    source: "https://docs.astro.build/en/guides/client-side-scripts/"
    match: [client-scripts-processing, script-events-and-custom-elements]
  - id: template-directives
    name: "Template directives"
    source: "https://docs.astro.build/en/reference/directives-reference/"
    match: [template-directives-class-list-set-html, script-style-directives]
  - id: client-directives
    name: "Client directives and hydration"
    source: "https://docs.astro.build/en/reference/directives-reference/"
    match: [client-directives-hydration]
  - id: sessions
    name: "Sessions"
    source: "https://docs.astro.build/en/guides/sessions/"
    match: [sessions-configure-drivers, sessions-use-and-types]
  - id: framework-components
    name: "Framework components and islands"
    source: "https://docs.astro.build/en/guides/framework-components/"
    match: [framework-components-islands]
  - id: framework-children-slots
    name: "Framework children and named slots"
    source: "https://docs.astro.build/en/guides/framework-components/"
    match: [framework-children-and-named-slots]
  - id: cli-dev-build-preview
    name: "CLI: dev, build and preview"
    source: "https://docs.astro.build/en/reference/cli-reference/"
    match: [cli-dev-build-preview, astro-dev, astro-build, astro-preview]
  - id: cli-check-sync-info
    name: "CLI: check, sync, info, preferences, telemetry"
    source: "https://docs.astro.build/en/reference/cli-reference/"
    match: [cli-check-sync-info, astro-check, astro-sync, astro-info]
  - id: cli-background-server
    name: "CLI: background server and lock file"
    source: "https://docs.astro.build/en/reference/cli-reference/"
    match: [cli-background-server, background-server, ignore-lock]
