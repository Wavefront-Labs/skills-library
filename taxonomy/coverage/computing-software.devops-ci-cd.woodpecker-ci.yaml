  - id: -yaml-anchors
    name: Yaml anchors
    source: https://woodpecker-ci.org/docs/usage/advanced-usage
    match: [yaml-anchors, variables, dry]
  - id: -multiple-workflows
    name: Multiple workflows
    source: https://woodpecker-ci.org/docs/usage/workflows
