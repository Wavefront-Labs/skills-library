# Coverage spec for Woodpecker CI (devops-ci-cd).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: woodpecker-ci
scope:
  category: computing-software
  field: devops-ci-cd
  products: [woodpecker-ci]
sources:
  - https://woodpecker-ci.org/docs/usage
  - https://woodpecker-ci.org/docs/administration/installation
  - https://woodpecker-ci.org/docs/administration/configuration
  - https://woodpecker-ci.org/docs/administration/configuration/backends
  - https://woodpecker-ci.org/docs/administration/configuration/forges
  - https://woodpecker-ci.org/docs/cli
topics:
  - id: -steps-and-commands
    name: Steps and commands
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [steps, commands, workflow-yaml]
  - id: -image-and-pull
    name: Image and pull
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [image, pull, registry-images]
  - id: -failure-handling
    name: Failure handling
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [failure, ignore, cancel]
  - id: -when-conditions
    name: When conditions
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [when, conditions, conditional-steps]
  - id: -branch-filter
    name: Branch filter
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [branch, glob, doublestar]
  - id: -events
    name: Events
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [event, triggers, pull-request]
  - id: -status-filter
    name: Status filter
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [status, notifications, on-failure]
  - id: -path-filter
    name: Path filter
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [path, monorepo, changed-files]
  - id: -evaluate-expressions
    name: Evaluate expressions
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [evaluate, expr, expressions]
  - id: -other-when-filters
    name: Other when filters
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [ref, cron-filter, platform-filter, instance]
  - id: -step-dependencies
    name: Step dependencies
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [depends-on, dag, parallel-steps]
  - id: -workspace
    name: Workspace
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [workspace, base-path, shared-volume]
  - id: -clone-step
    name: Clone step
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
    match: [clone, submodules, skip-clone]
  - id: -workflow-labels
    name: Workflow labels
    source: https://woodpecker-ci.org/docs/usage/workflow-syntax
