      - {id: arithmetic, name: Arithmetic expansion and let, match: [arithmetic-expansion, bash-arithmetic]}
      - {id: printf, name: printf formatting, match: [bash-printf, printf]}
      - {id: globbing, name: Globbing/extglob/brace expansion, match: [globbing, extglob, brace-expansion]}
      - {id: local-scope, name: local variables and returning values from functions, match: [local-variables, function-return]}
