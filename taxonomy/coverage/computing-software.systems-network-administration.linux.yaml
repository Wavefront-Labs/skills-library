      - {id: process-substitution, name: Process substitution, match: [process-substitution]}
      - {id: tee, name: tee and splitting output, match: [tee]}
      - {id: file-descriptors, name: Custom file descriptors and exec, match: [file-descriptors, exec-redirect]}
      - {id: named-pipes, name: Named pipes (mkfifo), match: [named-pipes, mkfifo, fifo]}
      - {id: buffering, name: Pipeline buffering and stdbuf, match: [stdbuf, buffering]}
