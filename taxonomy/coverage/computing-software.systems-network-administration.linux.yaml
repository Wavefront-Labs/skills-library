# Canonical coverage spec: Linux administration.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (LFCS, RHCSA/RHCE, LPIC-1/2 objectives),
# not from what we happened to write.
subject: linux
scope:
  category: computing-software
  field: systems-network-administration
  products: [linux, bash]
sources:
  - "LFCS domains (Linux Foundation): Operations Deployment 25%, Networking 25%, Storage 20%, Essential Commands 20%, Users and Groups 10%"
  - "RHCSA (EX200) objectives: essential tools, shell scripts, running systems, local storage, file systems, deploy/configure/maintain, networking, users/groups, security, containers"
  - "RHCE (EX294) objectives: Ansible automation of RHEL tasks"
  - "LPIC-1 objectives: system architecture, installation and package management, GNU/Unix commands, devices/filesystems/FHS, shells/scripting, UI/desktops, admin tasks, essential services, networking fundamentals, security"
  - "LPIC-2 objectives: capacity planning, kernel, system startup, filesystems/devices, advanced storage, network configuration, system maintenance, DNS, web services, file sharing, network client management, email, system security"
topics:
  # --- Boot, kernel, init (LPIC-1 101, LPIC-2 201/202; RHCSA running systems)
  - id: boot-process-grub
    name: Boot sequence, GRUB2 configuration and rescue
    source: LPIC-1/System Architecture
    match: [grub, grub2, boot-process, bootloader, rescue-mode]
    subtopics:
      - {id: grub-mkconfig, name: Regenerate grub.cfg from /etc/default/grub, match: [grub-mkconfig, etc-default-grub]}
      - {id: grub-rescue-shell, name: Boot by hand from the GRUB rescue/command shell, match: [grub-rescue, grub-shell]}
      - {id: kernel-cmdline, name: Edit kernel command-line parameters at boot, match: [kernel-cmdline, kernel-command-line]}
      - {id: grub-install, name: Reinstall the bootloader to MBR or EFI system partition, match: [grub-install, bootloader-reinstall]}
      - {id: grub-default-entry, name: Pick the default boot entry with grubby/GRUB_DEFAULT, match: [grubby, grub-default, saved-entry]}
      - {id: boot-timing, name: Analyse boot time with systemd-analyze, match: [systemd-analyze, boot-timing]}
      - {id: grub-custom-entries, name: Custom menu entries via /etc/grub.d/40_custom, match: [grub-d-40-custom, grub-custom-entry]}
      - {id: grub-serial-console, name: Serial console for GRUB and the kernel (console=ttyS0), match: [serial-console, grub-serial]}
      - {id: bootloader-spec, name: BootLoaderSpec entries in /boot/loader/entries (blscfg), match: [bootloader-spec, blscfg]}
      - {id: systemd-boot, name: systemd-boot and bootctl on UEFI, match: [bootctl]}
      - {id: grub-menu-timeout, name: GRUB_TIMEOUT_STYLE hidden menus and reaching the menu, match: [grub-timeout, grub-timeout-style]}
  - id: initramfs-dracut
    name: initramfs/dracut and early userspace
    source: LPIC-2/System Startup
    match: [initramfs, dracut, initrd]
    subtopics:
      - {id: dracut-conf, name: Configure dracut via dracut.conf.d and module lists, match: [dracut-conf, dracut-modules]}
      - {id: update-initramfs, name: Rebuild initramfs on Debian/Ubuntu and Arch, match: [update-initramfs, mkinitcpio]}
      - {id: lsinitrd, name: Inspect initramfs contents, match: [lsinitrd, initramfs-inspection]}
      - {id: rd-break, name: Drop to the initramfs emergency shell, match: [rd-break, initramfs-shell]}
      - {id: dracut-hostonly, name: Host-only vs generic images and driver inclusion, match: [hostonly, dracut-hostonly]}
      - {id: dracut-cmdline, name: rd.* kernel parameters for early boot (rd.lvm.lv/rd.luks.uuid), match: [rd-cmdline, dracut-cmdline]}
      - {id: dracut-custom-module, name: Write a custom dracut module (module-setup.sh), match: [dracut-custom-module, module-setup-sh]}
      - {id: rdsosreport, name: Debug early boot with rd.debug and rdsosreport.txt, match: [rdsosreport, rd-debug]}
      - {id: dracut-extra-files, name: Add drivers and files to the image (add_drivers/install_items), match: [install-items, add-drivers]}
      - {id: mkinitcpio-hooks, name: mkinitcpio HOOKS ordering (udev vs systemd/sd-encrypt), match: [mkinitcpio-hooks, sd-encrypt]}
      - {id: initramfs-tools-hooks, name: Debian initramfs-tools hooks/scripts and MODULES=, match: [initramfs-tools, initramfs-tools-hooks]}
  - id: kernel-modules-params
    name: Kernel modules, modprobe and kernel parameters
    source: LPIC-2/Kernel
    match: [kernel-module, kernel-modules, modprobe, kernel-parameters]
    subtopics:
      - {id: modprobe-d, name: Set module options in modprobe.d, match: [modprobe-d, module-options]}
      - {id: module-blacklist, name: Blacklist modules, match: [blacklist, module-blacklist]}
      - {id: dkms, name: Build out-of-tree modules with DKMS, match: [dkms, out-of-tree-module]}
      - {id: depmod, name: Dependency maps with depmod/modules.dep, match: [depmod, modules-dep]}
      - {id: modules-load-d, name: Autoload modules at boot, match: [modules-load-d, module-autoload]}
      - {id: modinfo-lsmod, name: Inspect loaded modules and live parameters (lsmod/modinfo/sys/module), match: [modinfo, lsmod]}
      - {id: module-sig-enforce, name: Module signature enforcement and unsigned module errors, match: [module-sig-enforce, module-signing]}
      - {id: kernel-taint, name: Read kernel taint flags, match: [kernel-taint, tainted-kernel]}
      - {id: firmware-loading, name: Firmware files and failed firmware loads (linux-firmware), match: [linux-firmware, firmware-loading]}
      - {id: module-unload, name: Unload modules and resolve module in use errors (modprobe -r/rmmod), match: [modprobe-r, rmmod]}
      - {id: kernel-compile, name: Configure and compile a custom kernel (menuconfig/localmodconfig), match: [kernel-compile, menuconfig, localmodconfig]}
  - id: sysctl-tuning
    name: sysctl and kernel runtime tuning
    source: LPIC-2/Kernel
    match: [sysctl, kernel-tuning, sysctl-tuning]
    subtopics:
      - {id: sysctl-d, name: Persist settings in sysctl.d with correct precedence, match: [sysctl-d, sysctl-system]}
      - {id: vm-tuning, name: Virtual memory knobs (swappiness/overcommit/dirty ratio), match: [vm-swappiness, vm-dirty-ratio]}
      - {id: network-sysctl, name: TCP/IP stack tuning, match: [network-sysctl, tcp-tuning, somaxconn]}
      - {id: kernel-hardening-sysctl, name: Kernel hardening sysctls, match: [kernel-hardening, kptr-restrict]}
      - {id: file-limits, name: File handle and inotify limits, match: [fs-file-max, inotify-limits]}
      - {id: ip-forwarding-rp-filter, name: ip_forward and rp_filter routing sysctls, match: [ip-forward, rp-filter]}
      - {id: sysrq-panic, name: Magic SysRq and panic/panic_on_oops behaviour, match: [kernel-sysrq, panic-on-oops]}
      - {id: ipv6-sysctl, name: Per-interface IPv6 sysctls (disable_ipv6/accept_ra), match: [disable-ipv6]}
      - {id: pid-max, name: Process and thread limits (pid_max/threads-max), match: [pid-max, threads-max]}
      - {id: tcp-congestion, name: TCP congestion control and BBR, match: [tcp-bbr, congestion-control]}
  - id: kernel-upgrade-rollback
    name: Kernel upgrades and rollback
    source: LPIC-2/Kernel
    match: [kernel-upgrade, kernel-rollback, kernel-update]
    subtopics:
      - {id: kernel-install, name: Install kernels and bootloader entries (kernel-install), match: [kernel-install, installkernel]}
      - {id: boot-previous-kernel, name: Boot a previous kernel after a bad update, match: [boot-previous-kernel, grub-default-kernel]}
      - {id: kernel-retention, name: Keep N kernels (installonly_limit/apt autoremove), match: [installonly-limit, kernel-retention]}
      - {id: old-kernel-removal, name: Remove old kernels safely, match: [old-kernels, kernel-removal]}
      - {id: alternative-kernels, name: Mainline/ELRepo/HWE kernels, match: [mainline-kernel, elrepo, hwe-kernel]}
      - {id: kexec, name: Fast reboot into a new kernel with kexec, match: [kexec-reboot, kexec-load]}
      - {id: kernel-headers, name: Matching kernel headers/devel packages for module builds, match: [kernel-headers, kernel-devel]}
      - {id: kernel-pin, name: Pin or hold a kernel version, match: [kernel-pin, kernel-hold]}
      - {id: kernel-rt, name: Real-time kernels (PREEMPT_RT/kernel-rt), match: [kernel-rt, preempt-rt]}
  - id: systemd-units
    name: systemd units, dependencies and ordering
    source: RHCSA/Running systems
    match: [systemd, systemd-unit, systemd-units, unit-file, unit-files]
    subtopics:
      - {id: unit-dependencies, name: Wants/Requires/BindsTo dependency types, match: [wants, requires, bindsto]}
      - {id: unit-ordering, name: Before/After ordering vs dependency, match: [before-after, ordering]}
      - {id: drop-in, name: Override units with drop-ins, match: [drop-in, systemctl-edit]}
      - {id: service-type, name: Service Type= semantics (simple/forking/notify/oneshot), match: [service-type, type-notify, type-forking]}
      - {id: exec-directives, name: ExecStart/ExecStartPre/ExecReload and specifiers, match: [execstart, execstartpre, unit-specifiers]}
      - {id: unit-conditions, name: ConditionPathExists and friends, match: [unit-conditions, conditionpathexists]}
      - {id: service-sandboxing, name: Hardening services with sandboxing directives, match: [sandboxing, protectsystem]}
      - {id: user-units, name: Per-user systemd units, match: [user-units, systemd-user]}
      - {id: restart-policy, name: Restart=/RestartSec/StartLimitBurst crash-loop policy, match: [restart-policy, startlimitburst]}
      - {id: socket-activation, name: Socket activation with .socket units, match: [socket-activation, socket-unit]}
      - {id: path-units, name: Trigger services on file changes with .path units, match: [path-unit, pathchanged]}
      - {id: template-units, name: Template and instantiated @ units, match: [template-unit, instantiated-units]}
  - id: systemd-timers-journal
    name: systemd timers and journald
    source: RHCSA/Running systems
    match: [systemd-timer, systemd-timers, journald, journalctl]
    subtopics:
      - {id: oncalendar, name: OnCalendar calendar expressions, match: [oncalendar, calendar-events]}
      - {id: timer-accuracy, name: Persistent/AccuracySec/RandomizedDelaySec, match: [persistent-timer, accuracysec, randomizeddelaysec]}
      - {id: journalctl-filtering, name: Filter journal by unit/time/priority, match: [journalctl-filtering, since-until, journal-priority]}
      - {id: journald-persistent, name: Persistent journal storage, match: [journald-persistent, storage-persistent]}
      - {id: journal-vacuum, name: Vacuum and size limits, match: [vacuum, systemmaxuse]}
      - {id: journal-remote, name: Ship journals with systemd-journal-remote/upload, match: [journal-remote, systemd-journal-remote]}
      - {id: journal-boots, name: Per-boot journals and list-boots, match: [list-boots, journal-boots]}
      - {id: monotonic-timers, name: Monotonic timers (OnBootSec/OnUnitActiveSec), match: [onbootsec, onunitactivesec]}
      - {id: transient-timers, name: Transient timers with systemd-run --on-calendar, match: [transient-timer, systemd-run-timer]}
      - {id: journal-fss, name: Forward Secure Sealing and journalctl --verify, match: [forward-secure-sealing, journal-verify]}
      - {id: journal-rate-limit, name: journald rate limiting (RateLimitBurst), match: [journald-rate-limit, ratelimitburst]}
      - {id: journal-output, name: journalctl output formats and --grep (json/cat/short-precise), match: [journalctl-output, journal-json]}
  - id: systemd-targets-rescue
    name: systemd targets, boot into rescue/emergency
    source: RHCSA/Running systems
    match: [systemd-target, targets, emergency-mode, rescue-target]
    subtopics:
      - {id: default-target, name: Get/set the default target, match: [default-target, set-default]}
      - {id: isolate, name: Switch targets with systemctl isolate, match: [isolate, systemctl-isolate]}
      - {id: standard-targets, name: multi-user vs graphical targets, match: [multi-user-target, graphical-target]}
      - {id: emergency-mode, name: Emergency vs rescue mode, match: [emergency-mode, rescue-mode]}
      - {id: custom-target, name: Write a custom target unit, match: [custom-target, target-unit]}
      - {id: debug-shell, name: Early root shell with debug-shell.service, match: [debug-shell]}
      - {id: systemd-kernel-args, name: systemd.unit= and systemd.log_level kernel arguments, match: [systemd-unit-kernel-param, systemd-log-level]}
      - {id: shutdown-scheduling, name: Scheduled shutdown/reboot and reboot to firmware setup, match: [shutdown-schedule, firmware-setup]}
      - {id: list-dependencies, name: Inspect target trees with systemctl list-dependencies, match: [list-dependencies]}
  - id: root-password-recovery
    name: Root password recovery
    source: RHCSA/Running systems
    match: [root-password-recovery, password-reset, lost-root]
    subtopics:
      - {id: rd-break-recovery, name: rd.break on RHEL-family, match: [rd-break, switch-root]}
      - {id: init-bin-bash, name: init=/bin/bash on Debian/Ubuntu, match: [init-bin-bash]}
      - {id: chroot-recovery, name: Recovery from live media with chroot, match: [chroot, live-usb]}
      - {id: selinux-relabel, name: Relabel after recovery, match: [selinux-relabel, autorelabel]}
      - {id: grub-password, name: Protect GRUB editing with a password, match: [grub-password, grub-pbkdf2]}
      - {id: sulogin, name: sulogin and locked root in rescue mode, match: [sulogin]}
      - {id: cloud-root-recovery, name: Recover root on a cloud VM via rescue instance or serial console, match: [cloud-root-recovery, rescue-instance]}
      - {id: encrypted-root-chroot, name: Chroot into LUKS/LVM root from live media, match: [chroot-luks, vgchange-ay]}
      - {id: sudoers-recovery, name: Recover from a broken sudoers file, match: [sudoers-recovery, broken-sudoers]}
  # --- Essential commands and shell (LFCS 20%; LPIC-1 103)
  - id: text-processing
    name: grep/sed/awk text processing
    source: LFCS/Essential Commands
    match: [grep, sed, awk, text-processing, regex]
    subtopics:
      - {id: grep-recursive, name: Recursive and context grep, match: [grep-recursive, grep-context]}
      - {id: sed-in-place, name: In-place edits with sed, match: [sed-in-place]}
      - {id: awk-aggregation, name: awk reports and aggregation, match: [awk-aggregation, awk-report]}
      - {id: sort-uniq, name: sort/uniq/comm pipelines, match: [sort-uniq, sort-k]}
      - {id: ere-bre, name: BRE vs ERE vs PCRE, match: [ere, bre, pcre]}
      - {id: jq, name: JSON with jq, match: [jq]}
      - {id: cut-tr, name: cut/tr/paste field extraction, match: [cut, tr]}
      - {id: yq, name: YAML editing with yq, match: [yq]}
      - {id: diff-patch, name: diff -u and patch, match: [diff-patch, unified-diff]}
      - {id: column-fmt-nl, name: Formatting with column/fmt/fold/nl/pr, match: [column-t, fmt-fold, nl-command]}
      - {id: split-join, name: split/csplit/join file splitting and joining, match: [split-command, csplit, join-command]}
      - {id: od-xxd, name: Binary inspection with od/xxd/hexdump, match: [xxd, hexdump]}
  - id: file-management-find
    name: find, xargs, file management and archives
    source: LFCS/Essential Commands
    match: [find, xargs, tar, archives, file-management]
    subtopics:
      - {id: find-exec, name: find -exec/-delete actions, match: [find-exec, find-delete]}
      - {id: find-tests, name: find by time/size/perm/owner, match: [find-mtime, find-size, find-newer]}
      - {id: xargs-null, name: xargs -0 and parallelism, match: [xargs-0, xargs-null]}
      - {id: tar-usage, name: tar create/extract/compress/incremental, match: [tar-compression, tar-incremental]}
      - {id: cpio-dd, name: cpio and dd for archives and images, match: [cpio, dd]}
      - {id: locate, name: locate/plocate and updatedb, match: [locate, plocate, updatedb]}
      - {id: links, name: Hard and symbolic links, match: [hardlinks, symlinks, ln]}
      - {id: file-stat, name: file/stat metadata inspection, match: [file-command, stat]}
      - {id: batch-rename, name: Batch renaming with rename/mmv, match: [batch-rename, rename-command]}
