# Coverage spec for Kopia (systems-network-administration).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: kopia
scope:
  category: computing-software
  field: systems-network-administration
  products: [kopia]
sources:
  - https://kopia.io/docs/getting-started/
  - https://kopia.io/docs/repositories/
  - https://kopia.io/docs/advanced/
  - https://kopia.io/docs/repository-server/
  - https://kopia.io/docs/faqs/
