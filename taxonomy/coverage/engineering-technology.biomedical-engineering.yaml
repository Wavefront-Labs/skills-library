# Canonical coverage spec: biomedical engineering (professional practice guidance; whole field).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
# Topics and subtopics come from external structures named in sources, not from existing skills.
# Regulated and safety-critical field: skills are practice guidance, not regulatory or clinical advice.
subject: biomedical-engineering
scope:
  category: engineering-technology
  field: biomedical-engineering
  products: [medical-device-design, biomechanics, prosthetics-orthotics-design, biomedical-instrumentation, medical-imaging-systems, biomaterials, device-verification-validation]
sources:
  - "Webster (ed.), Medical Instrumentation: Application and Design (chapter lists)"
  - "Enderle and Bronzino, Introduction to Biomedical Engineering (chapter lists)"
  - "Ratner et al., Biomaterials Science: An Introduction to Materials in Medicine (chapter lists)"
  - "Nordin and Frankel, Basic Biomechanics of the Musculoskeletal System; Winter, Biomechanics and Motor Control of Human Movement"
  - "Bushberg et al., The Essential Physics of Medical Imaging; Prince and Links, Medical Imaging Signals and Systems"
  - "Smith, Michael and Bowker (eds.), Atlas of Amputations and Limb Deficiencies; AAOS Atlas of Orthoses and Assistive Devices"
  - "Zenios et al., Biodesign: The Process of Innovating Medical Technologies (chapter lists)"
  - "ISO 13485 Medical devices - Quality management systems; ISO 14971 Medical devices - Application of risk management"
  - "IEC 60601-1 and collateral standards (-1-2 EMC, -1-6 usability, -1-8 alarms, -1-11 home healthcare)"
  - "IEC 62304 Medical device software - Software life cycle processes; IEC 62366-1 Usability engineering"
  - "ISO 10993 series Biological evaluation of medical devices (parts list)"
  - "ISO 11607, ISO 11135, ISO 11137, ISO 17665 sterilisation and packaging standards (scope lists)"
  - "ASTM F04 Medical and Surgical Materials and Devices committee standards index"
  - "US FDA 21 CFR Part 820 and FDA design controls guidance (confirm current QMSR status)"
  - "EU Regulation 2017/745 (MDR) Annex I and Annex II structure"
  - "ASME V&V 40 Assessing Credibility of Computational Modeling for Medical Devices"
  - "OpenSim documentation table of contents (https://opensim.stanford.edu)"
