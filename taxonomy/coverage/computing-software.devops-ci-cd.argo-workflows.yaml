# Coverage spec: argo-workflows. Topics from the Argo Workflows docs table of contents.
subject: argo-workflows
scope:
  category: computing-software
  field: devops-ci-cd
  products: [argo-workflows]
sources:
  - "Argo Workflows docs (argo-workflows.readthedocs.io/en/latest)"
topics:
  - id: cron-workflow-spec
    name: "CronWorkflow spec and options"
    source: "https://argo-workflows.readthedocs.io/en/latest/cron-workflows/"
    match: [cron-workflow, schedules, concurrency-policy]
  - id: cron-dst-and-stop-strategy
    name: "Cron daylight saving and stopStrategy"
    source: "https://argo-workflows.readthedocs.io/en/latest/cron-workflows/"
    match: [cron-dst, stop-strategy, last-scheduled-time]
  - id: retry-strategy
    name: "Retry strategy and policies"
    source: "https://argo-workflows.readthedocs.io/en/latest/retries/"
    match: [retry-strategy, retry-policy, on-transient-error]
  - id: step-memoization
    name: "Step level memoization"
    source: "https://argo-workflows.readthedocs.io/en/latest/memoization/"
    match: [memoize, memoization, cache-configmap]
  - id: synchronization-locks
    name: "Mutexes and semaphores"
    source: "https://argo-workflows.readthedocs.io/en/latest/synchronization/"
    match: [synchronization, mutex, semaphore]
  - id: synchronization-database-locks
    name: "Multi-controller database locks"
    source: "https://argo-workflows.readthedocs.io/en/latest/synchronization/"
    match: [database-lock, sync-limit, sync-state]
  - id: workflow-templates-reuse
    name: "WorkflowTemplate reuse with templateRef"
    source: "https://argo-workflows.readthedocs.io/en/latest/workflow-templates/"
    match: [workflow-template, template-ref, workflow-template-ref]
  - id: cluster-workflow-templates
    name: "ClusterWorkflowTemplates"
    source: "https://argo-workflows.readthedocs.io/en/latest/cluster-workflow-templates/"
    match: [cluster-workflow-template, cluster-scope, template-ref]
  - id: lifecycle-hooks
    name: "Lifecycle hooks"
    source: "https://argo-workflows.readthedocs.io/en/latest/lifecyclehook/"
    match: [lifecycle-hook, hooks, exit-handler]
  - id: container-set-template
    name: "ContainerSet template"
    source: "https://argo-workflows.readthedocs.io/en/latest/container-set-template/"
    match: [container-set, containerset, empty-dir]
  - id: container-set-resources-and-retry
    name: "ContainerSet resource sizing and retry"
    source: "https://argo-workflows.readthedocs.io/en/latest/container-set-template/"
    match: [container-set-retry, resource-requests, retry-strategy]
  - id: http-template
    name: "HTTP template"
    source: "https://argo-workflows.readthedocs.io/en/latest/http-template/"
    match: [http-template, success-condition, argo-agent]
  - id: http-agent-failures-and-limits
    name: "Argo Agent failures and WorkflowTaskSet limits"
    source: "https://argo-workflows.readthedocs.io/en/latest/http-template/"
    match: [agent-pod-failed, workflow-task-set-size, http-template-limits]
  - id: dag-enhanced-depends
    name: "Enhanced depends logic"
    source: "https://argo-workflows.readthedocs.io/en/latest/enhanced-depends-logic/"
    match: [enhanced-depends, dag-depends, task-results]
  - id: controller-parallelism-priority
    name: "Controller parallelism and priority"
    source: "https://argo-workflows.readthedocs.io/en/latest/parallelism/"
    match: [parallelism, namespace-parallelism, parallelism-limit]
  - id: workflow-inputs-and-outputs
    name: "Workflow inputs and passing outputs"
    source: "https://argo-workflows.readthedocs.io/en/latest/workflow-inputs/"
    match: [workflow-inputs, arguments, inputs-parameters]
  - id: artifact-repository-ref
    name: "Artifact repository ref"
    source: "https://argo-workflows.readthedocs.io/en/latest/artifact-repository-ref/"
    match: [artifact-repository-ref, artifact-repositories, default-artifact-repository]
  - id: key-only-artifacts
    name: "Key-only artifacts"
    source: "https://argo-workflows.readthedocs.io/en/latest/key-only-artifacts/"
    match: [key-only-artifacts, artifact-key, s3-key]
  - id: conditional-outputs
    name: "Conditional artifacts and parameters"
    source: "https://argo-workflows.readthedocs.io/en/latest/conditional-artifacts-parameters/"
    match: [conditional-outputs, from-expression, value-from-expression]
  - id: workflow-event-binding
    name: "WorkflowEventBinding submit"
    source: "https://argo-workflows.readthedocs.io/en/latest/events/"
    match: [workflow-event-binding, events-endpoint, discriminator]
  - id: event-expressions
    name: "Event expression environment"
    source: "https://argo-workflows.readthedocs.io/en/latest/events/"
    match: [event-expressions, event-payload, event-metadata]
  - id: events-ha-and-scaling
    name: "Events endpoint capacity and HA"
    source: "https://argo-workflows.readthedocs.io/en/latest/events/"
    match: [event-worker-count, event-operation-queue-size, events-high-availability]
  - id: webhook-clients
    name: "Webhook client setup"
    source: "https://argo-workflows.readthedocs.io/en/latest/webhooks/"
    match: [webhooks, webhook-clients-secret, github-webhook]
  - id: access-token
    name: "Argo access tokens"
    source: "https://argo-workflows.readthedocs.io/en/latest/access-token/"
    match: [access-token, service-account-token, bearer-token]
  - id: workflow-rbac-service-accounts
    name: "Workflow RBAC and service accounts"
    source: "https://argo-workflows.readthedocs.io/en/latest/workflow-rbac/"
    match: [workflow-rbac, service-account, workflowtaskresults]
  - id: security-permissions
    name: "Controller and user permissions model"
    source: "https://argo-workflows.readthedocs.io/en/latest/security/"
    match: [security, controller-permissions, ui-read-only-role]
  - id: security-network-and-server
    name: "Argo Server and network security"
    source: "https://argo-workflows.readthedocs.io/en/latest/security/"
    match: [argo-server-security, network-policy, transport-layer-security]
  - id: argo-server-auth-mode
    name: "Argo Server auth modes"
    source: "https://argo-workflows.readthedocs.io/en/latest/argo-server-auth-mode/"
    match: [auth-mode, argo-server-auth, client-auth]
  - id: controller-scaling
    name: "Scaling the controller vertically"
    source: "https://argo-workflows.readthedocs.io/en/latest/scaling/"
    match: [controller-scaling, workflow-workers, qps-burst]
  - id: controller-sharding-and-limits
    name: "Sharding, pod rate limit and recursion"
    source: "https://argo-workflows.readthedocs.io/en/latest/scaling/"
    match: [instance-id, resource-rate-limit, namespaced-install]
  - id: node-status-offload-and-compression
    name: "Large workflow status offload and compression"
    source: "https://argo-workflows.readthedocs.io/en/latest/offloading-large-workflows/"
    match: [node-status-offload, compressed-nodes, workflow-compression-algorithm]
  - id: container-args-offloading
    name: "Container arguments offloading"
    source: "https://argo-workflows.readthedocs.io/en/latest/offloading-large-workflows/"
    match: [container-args-offload, argo-container-args-file, at-filename-syntax]
  - id: workflow-archive
    name: "Workflow archive"
    source: "https://argo-workflows.readthedocs.io/en/latest/workflow-archive/"
    match: [workflow-archive, persistence, archive-ttl]
  - id: database-iam-authentication
    name: "Database IAM token authentication"
    source: "https://argo-workflows.readthedocs.io/en/latest/workflow-archive/"
    match: [azure-token, aws-rds-token, iam-authentication]
  - id: archive-logs
    name: "Archive pod logs"
    source: "https://argo-workflows.readthedocs.io/en/latest/configure-archive-logs/"
    match: [archive-logs, archive-location, log-archival]
  - id: template-defaults
    name: "Template defaults"
    source: "https://argo-workflows.readthedocs.io/en/latest/template-defaults/"
    match: [template-defaults, strategic-merge-patch, default-timeout]
  - id: workflow-defaults-controller
    name: "Controller workflowDefaults"
    source: "https://argo-workflows.readthedocs.io/en/latest/default-workflow-specs/"
    match: [workflow-defaults, default-workflow-spec, ttl-strategy]
  - id: workflow-defaults-namespace
    name: "Namespace level workflow defaults"
    source: "https://argo-workflows.readthedocs.io/en/latest/default-workflow-specs/"
    match: [namespace-defaults, workflow-defaults-configmap, configmap-type]
  - id: workflow-of-workflows
    name: "Workflow of workflows"
    source: "https://argo-workflows.readthedocs.io/en/latest/workflow-of-workflows/"
    match: [workflow-of-workflows, resource-template, child-workflows]
  - id: automatic-pod-restarts
    name: "Automatic pod restarts"
    source: "https://argo-workflows.readthedocs.io/en/latest/pod-restarts/"
    match: [failed-pod-restart, pod-restarts, node-eviction]
  - id: progress-and-estimated-duration
    name: "Workflow progress and estimated duration"
    source: "https://argo-workflows.readthedocs.io/en/latest/progress/"
    match: [workflow-progress, argo-progress-file, estimated-duration]
  - id: resource-duration
    name: "Resource duration"
    source: "https://argo-workflows.readthedocs.io/en/latest/resource-duration/"
    match: [resource-duration, cpu-seconds, memory-base-amount]
  - id: intermediate-parameters
    name: "Intermediate parameters and approvals"
    source: "https://argo-workflows.readthedocs.io/en/latest/intermediate-inputs/"
    match: [intermediate-parameters, suspend-template, supplied-parameter]
  - id: debug-pause
    name: "Debug pause"
    source: "https://argo-workflows.readthedocs.io/en/latest/debug-pause/"
    match: [debug-pause, argo-debug-pause-after, ephemeral-containers]
  - id: node-field-selector
    name: "Node field selectors"
    source: "https://argo-workflows.readthedocs.io/en/latest/node-field-selector/"
    match: [node-field-selector, resume-stop-retry, restart-successful]
  - id: work-avoidance
    name: "Work avoidance with marker files"
    source: "https://argo-workflows.readthedocs.io/en/latest/work-avoidance/"
    match: [work-avoidance, marker-files, optional-artifacts]
  - id: high-availability
    name: "High availability for controller and server"
    source: "https://argo-workflows.readthedocs.io/en/latest/high-availability/"
    match: [high-availability, leader-election, recreate-strategy]
  - id: workflow-restrictions
    name: "Workflow restrictions"
    source: "https://argo-workflows.readthedocs.io/en/latest/workflow-restrictions/"
    match: [workflow-restrictions, template-referencing, strict-mode]
  - id: managed-namespace
    name: "Namespaced and managed namespace installs"
    source: "https://argo-workflows.readthedocs.io/en/latest/managed-namespace/"
    match: [managed-namespace, namespaced-install, cluster-scoped]
  - id: sidecar-injection
    name: "Injected sidecars and kill commands"
    source: "https://argo-workflows.readthedocs.io/en/latest/sidecar-injection/"
    match: [sidecar-injection, istio, kill-cmd]
  - id: argo-server-tls
    name: "Argo Server transport security"
    source: "https://argo-workflows.readthedocs.io/en/latest/tls/"
    match: [argo-server-tls, argo-secure, insecure-skip-verify]
  - id: cli-mutual-tls
    name: "CLI mutual TLS to Argo Server"
    source: "https://argo-workflows.readthedocs.io/en/latest/tls/"
    match: [mutual-tls, client-certificate, certificate-authority]
