# Coverage spec: nextcloud. Topics from the official documentation pages in sources.
subject: nextcloud
scope:
  category: computing-software
  field: collaboration-platform-administration
  products: [nextcloud]
sources:
  - "https://docs.nextcloud.com/server/latest/admin_manual/"
topics:
  - id: apcu-shared-memory-sizing
    name: "Apcu shared memory sizing"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/caching_configuration.html"
    match: [apcu, apc-shm-size, php-ini]
  - id: background-jobs-scheduling-modes
    name: "Background jobs scheduling modes"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/background_jobs_configuration.html"
    match: [background-jobs, cron, ajax]
  - id: backup-contents-and-maintenance-mode
    name: "Backup contents and maintenance mode"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/maintenance/backup.html"
    match: [backup, maintenance-mode, rsync]
  - id: brute-force-protection-behaviour
    name: "Brute force protection behaviour"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/bruteforce_configuration.html"
    match: [brute-force, throttling, bruteforcesettings]
  - id: built-in-updater-steps-and-cli
    name: "Built in updater steps and cli"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/maintenance/update.html"
    match: [updater, updater-phar, occ-upgrade]
  - id: client-resync-after-restore
    name: "Client resync after restore"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/maintenance/restore.html"
    match: [data-fingerprint, files-scan, restore]
  - id: convert-sqlite-to-production-database
    name: "Convert sqlite to production database"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_database/db_conversion.html"
    match: [db-convert-type, sqlite, mariadb]
  - id: database-dump-commands-per-engine
    name: "Database dump commands per engine"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/maintenance/backup.html"
    match: [mariadb-dump, mysqldump, single-transaction]
  - id: database-isolation-level-and-binlog-format
    name: "Database isolation level and binlog format"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_database/linux_database_configuration.html"
    match: [transaction-isolation, read-committed, binlog-format]
  - id: enable-sse-and-team-folder-encryption
    name: "Enable sse and team folder encryption"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/encryption_configuration.html"
    match: [encryption-enable, default-encryption-module, groupfolders]
  - id: encryption-method-selection
    name: "Encryption method selection"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/encryption_configuration.html"
    match: [encryption, sse, e2ee]
  - id: file-version-retention-pattern
    name: "File version retention pattern"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/file_versioning.html"
    match: [files-versions, versions-retention-obligation, expiry]
  - id: large-file-upload-php-limits
    name: "Large file upload php limits"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/big_file_upload_configuration.html"
    match: [upload-max-filesize, post-max-size, user-ini]
  - id: ldap-backend-capabilities-and-server-tab
    name: "Ldap backend capabilities and server tab"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_user/user_auth_ldap.html"
    match: [ldap, active-directory, base-dn]
  - id: ldap-users-tab-filters
    name: "Ldap users tab filters"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_user/user_auth_ldap.html"
    match: [ldap, user-filter, object-classes]
  - id: log-levels-and-log-type
    name: "Log levels and log type"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/logging_configuration.html"
    match: [logging, loglevel, log-type]
  - id: log-rotation-and-debug-options
    name: "Log rotation and debug options"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/logging_configuration.html"
    match: [log-rotate-size, log-backtrace, log-query]
  - id: maintenance-window-start-setting
    name: "Maintenance window start setting"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/background_jobs_configuration.html"
    match: [maintenance-window-start, config-php, background-jobs]
  - id: memory-cache-choice-by-deployment
    name: "Memory cache choice by deployment"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/caching_configuration.html"
    match: [memcache, apcu, redis]
  - id: mysql-4byte-support-and-emoji
    name: "Mysql 4byte support and emoji"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_database/mysql_4byte_support.html"
    match: [utf8mb4, mysql, mariadb]
  - id: oidc-user-backend-and-identity-provider
    name: "Oidc user backend and identity provider"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_user/user_auth_oidc.html"
    match: [oidc, user-oidc, single-sign-on]
  - id: password-hash-and-auth-token-storage
    name: "Password hash and auth token storage"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/installation/harden_server.html"
    match: [hardening, argon2id, authentication-token]
  - id: password-length-limits-and-bcrypt-truncation
    name: "Password length limits and bcrypt truncation"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/installation/harden_server.html"
    match: [password-length, 469-bytes, bcrypt]
  - id: password-policy-options
    name: "Password policy options"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_user/user_password_policy.html"
    match: [password-policy, haveibeenpwned, password-history]
  - id: php-modules-required-and-recommended
    name: "Php modules required and recommended"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/installation/php_configuration.html"
    match: [php-modules, pdo-mysql, intl]
  - id: preview-providers-and-external-binaries
    name: "Preview providers and external binaries"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/previews_configuration.html"
    match: [previews, enabledpreviewproviders, ffmpeg]
  - id: reset-lost-admin-password-with-occ
    name: "Reset lost admin password with occ"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_user/reset_admin_password.html"
    match: [password-reset, occ, user-resetpassword]
  - id: restore-folders-and-database
    name: "Restore folders and database"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/maintenance/restore.html"
    match: [restore, rsync, drop-database]
  - id: reverse-proxy-overwrite-parameters
    name: "Reverse proxy overwrite parameters"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/reverse_proxy_configuration.html"
    match: [overwritehost, overwriteprotocol, overwritewebroot]
  - id: selinux-contexts-for-nextcloud
    name: "Selinux contexts for nextcloud"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/installation/selinux_configuration.html"
    match: [selinux, semanage, restorecon]
  - id: share-expiration-defaults-and-enforcement
    name: "Share expiration defaults and enforcement"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/file_sharing_configuration.html"
    match: [share-expiration, enforce-expiration-date, public-shares]
  - id: sharing-policy-admin-settings
    name: "Sharing policy admin settings"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/file_sharing_configuration.html"
    match: [file-sharing, share-api, public-links]
  - id: smtp-email-setup-and-auth-methods
    name: "Smtp email setup and auth methods"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/email_configuration.html"
    match: [email, smtp, starttls]
  - id: sse-key-management-modes
    name: "Sse key management modes"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/encryption_configuration.html"
    match: [master-key, user-keys, recovery-key]
  - id: sse-limitations-and-key-loss-risks
    name: "Sse limitations and key loss risks"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/encryption_configuration.html"
    match: [server-side-encryption, key-loss, filenames]
  - id: stored-login-password-setting
    name: "Stored login password setting"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/installation/harden_server.html"
    match: [auth-storecryptedpassword, token-password, external-storage]
  - id: systemd-timer-for-cron-php
    name: "Systemd timer for cron php"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/background_jobs_configuration.html"
    match: [systemd, timer, cron-php]
  - id: transactional-file-locking-with-redis
    name: "Transactional file locking with redis"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/files_locking_transactional.html"
    match: [file-locking, memcache-locking, keyvaluecache]
  - id: trashbin-retention-and-size-policy
    name: "Trashbin retention and size policy"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_files/trashbin_configuration.html"
    match: [files-trashbin, trashbin-retention-obligation, deleted-files]
  - id: trusted-proxies-and-forwarded-headers
    name: "Trusted proxies and forwarded headers"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/reverse_proxy_configuration.html"
    match: [reverse-proxy, trusted-proxies, forwarded-for-headers]
  - id: two-factor-provider-cleanup-and-disable
    name: "Two factor provider cleanup and disable"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_user/two_factor-auth.html"
    match: [twofactorauth-cleanup, twofactorauth-disable, occ]
  - id: two-factor-providers-and-enforcement
    name: "Two factor providers and enforcement"
    source: "https://docs.nextcloud.com/server/latest/admin_manual/configuration_user/two_factor-auth.html"
    match: [two-factor, 2fa, totp]
