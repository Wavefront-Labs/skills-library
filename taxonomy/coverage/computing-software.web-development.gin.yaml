# Coverage spec: gin. Topics taken from the official Gin documentation table of contents.
subject: gin
scope:
  category: computing-software
  field: web-development
  products: [gin]
sources:
  - "gin official documentation (gin-gonic.com docs)"
topics:
  - id: gin-quickstart
    name: "Quickstart"
    source: quickstart/index.md
    match: [quickstart]
  - id: gin-routing-param-in-path
    name: "Parameters in path"
    source: routing/param-in-path.md
    match: [path-parameters, named-parameter]
  - id: gin-routing-querystring-param
    name: "Querystring parameters"
    source: routing/querystring-param.md
    match: [query-string, c-query]
  - id: gin-routing-query-and-post-form
    name: "Query and post form"
    source: routing/query-and-post-form.md
    match: [post-form, c-postform]
  - id: gin-routing-map-as-querystring
    name: "Map as querystring or postform parameters"
    source: routing/map-as-querystring-or-postform.md
    match: [c-querymap, c-postformmap]
  - id: gin-routing-multipart-urlencoded-form
    name: "Multipart urlencoded form"
    source: routing/multipart-urlencoded-form.md
    match: [multipart-form, urlencoded]
  - id: gin-routing-upload-file
    name: "Upload files"
    source: routing/upload-file
    match: [upload-file, saveuploadedfile]
  - id: gin-routing-grouping-routes
    name: "Grouping routes"
    source: routing/grouping-routes.md
    match: [grouping-routes, route-group]
  - id: gin-routing-http-method
    name: "Using HTTP method"
    source: routing/http-method.md
    match: [http-methods]
  - id: gin-routing-redirects
    name: "Redirects"
    source: routing/redirects.md
    match: [redirect, c-redirect]
  - id: gin-routing-api-design
    name: "API design"
    source: routing/api-design.md
    match: [api-design, api-versioning]
  - id: gin-binding-and-validation
    name: "Model binding and validation"
    source: binding/binding-and-validation.md
    match: [binding, shouldbind]
  - id: gin-binding-different-structs
    name: "Bind body into different structs"
    source: binding/bind-body-into-different-structs.md
    match: [shouldbindbodywith]
  - id: gin-binding-custom-unmarshaler
    name: "Bind custom unmarshaler"
    source: binding/bind-custom-unmarshaler.md
    match: [textunmarshaler, bindunmarshaler]
  - id: gin-binding-default-values
    name: "Bind default values"
    source: binding/bind-default-values.md
    match: [default, form-tag]
  - id: gin-binding-form-custom-struct-tag
    name: "Bind form data with custom struct tag"
    source: binding/bind-form-data-custom-struct-tag.md
    match: [struct-tag, form-tag]
  - id: gin-binding-form-custom-struct
    name: "Bind form data request with custom struct"
    source: binding/bind-form-data-request-with-custom-struct.md
    match: [nested-struct, form]
  - id: gin-binding-header
    name: "Bind header"
    source: binding/bind-header.md
    match: [shouldbindheader, header-tag]
  - id: gin-binding-html-checkbox
    name: "Bind HTML checkboxes"
    source: binding/bind-html-checkbox.md
    match: [html-checkbox]
  - id: gin-binding-query-or-post
    name: "Bind query string or post data"
    source: binding/bind-query-or-post.md
    match: [shouldbind, query-string]
  - id: gin-binding-uri
    name: "Bind URI"
    source: binding/bind-uri.md
    match: [shouldbinduri, uri-tag]
  - id: gin-binding-collection-format
    name: "Collection format for arrays"
    source: binding/collection-format-for-arrays.md
    match: [collection-format]
  - id: gin-binding-custom-validators
    name: "Custom validators"
    source: binding/custom-validators.md
    match: [custom-validator, registervalidation]
  - id: gin-binding-multipart-urlencoded
    name: "Multipart urlencoded binding"
    source: binding/multipart-urlencoded-binding.md
    match: [multipart, urlencoded]
  - id: gin-binding-only-query-string
    name: "Only bind query string"
    source: binding/only-bind-query-string.md
    match: [shouldbind, query-string]
  - id: gin-rendering-ascii-json
    name: "AsciiJSON"
    source: rendering/ascii-json.md
    match: [asciijson]
  - id: gin-rendering-single-binary-template
    name: "Build a single binary with templates"
    source: rendering/bind-single-binary-with-template.md
    match: [single-binary, embed-fs]
  - id: gin-rendering-html
    name: "HTML rendering"
    source: rendering/html-rendering.md
    match: [html-rendering, html-template]
  - id: gin-rendering-jsonp
    name: "JSONP"
    source: rendering/jsonp.md
    match: [jsonp]
  - id: gin-rendering-multiple-template
    name: "Multiple template"
    source: rendering/multiple-template.md
    match: [multitemplate]
  - id: gin-rendering-pure-json
    name: "PureJSON"
    source: rendering/pure-json.md
    match: [purejson]
  - id: gin-rendering-formats
    name: "XML JSON YAML ProtoBuf rendering"
    source: rendering/rendering.md
    match: [rendering, c-xml, c-yaml]
  - id: gin-rendering-secure-json
    name: "SecureJSON"
    source: rendering/secure-json.md
    match: [securejson]
  - id: gin-rendering-serving-file
    name: "Serving data from file"
    source: rendering/serving-data-from-file.md
    match: [c-file, c-fileattachment]
  - id: gin-rendering-serving-reader
    name: "Serving data from reader"
    source: rendering/serving-data-from-reader.md
    match: [datafromreader]
  - id: gin-rendering-static-files
    name: "Serving static files"
    source: rendering/serving-static-files.md
    match: [static, staticfs]
  - id: gin-middleware-custom
    name: "Custom middleware"
    source: middleware/custom-middleware.md
    match: [middleware, c-next]
  - id: gin-middleware-custom-recovery
    name: "Custom recovery"
    source: middleware/custom-recovery.md
    match: [custom-recovery, recovery]
  - id: gin-middleware-dependency-injection
    name: "Dependency injection"
    source: middleware/dependency-injection.md
    match: [dependency-injection]
  - id: gin-middleware-error-handling
    name: "Error handling middleware"
    source: middleware/error-handling-middleware.md
    match: [error-handling, c-error]
  - id: gin-middleware-goroutines
    name: "Goroutines inside a middleware"
    source: middleware/goroutines-inside-a-middleware.md
    match: [goroutine, c-copy]
  - id: gin-middleware-security-guide
    name: "Security guide"
    source: middleware/security-guide.md
    match: [security]
  - id: gin-middleware-security-headers
    name: "Security headers"
    source: middleware/security-headers.md
    match: [security-headers]
  - id: gin-middleware-session-management
    name: "Session management"
    source: middleware/session-management.md
    match: [sessions]
  - id: gin-middleware-basicauth
    name: "Using BasicAuth middleware"
    source: middleware/using-basicauth-middleware.md
    match: [basicauth]
  - id: gin-middleware-using
    name: "Using middleware"
    source: middleware/using-middleware.md
    match: [group-use, per-route-middleware]
  - id: gin-middleware-without-default
    name: "Without default middleware"
    source: middleware/without-middleware.md
    match: [gin-new]
  - id: gin-logging-avoid-query-strings
    name: "Avoid logging query strings"
    source: logging/avoid-logging-query-strings.md
    match: [skipquerystring]
  - id: gin-logging-console-coloring
    name: "Controlling log output coloring"
    source: logging/controlling-log-output-coloring.md
    match: [disableconsolecolor]
  - id: gin-logging-custom-format
    name: "Custom log format"
    source: logging/custom-log-format.md
    match: [custom-format, loggerwithformatter]
  - id: gin-logging-route-format
    name: "Define format for the log of routes"
    source: logging/define-format-for-the-log-of-routes.md
    match: [debugprintroutefunc]
  - id: gin-logging-skip
    name: "Skip logging"
    source: logging/skip-logging.md
    match: [skippaths]
  - id: gin-logging-structured
    name: "Structured logging"
    source: logging/structured-logging.md
    match: [structured-logging]
  - id: gin-logging-write-log
    name: "How to write log file"
    source: logging/write-log.md
    match: [io-multiwriter]
  - id: gin-server-context
    name: "Goroutines and context"
    source: server-config/context.md
    match: [request-context, cancellation]
  - id: gin-server-cookie
    name: "Set and get a cookie"
    source: server-config/cookie.md
    match: [cookie, setcookie]
  - id: gin-server-custom-http-config
    name: "Custom HTTP configuration"
    source: server-config/custom-http-config.md
    match: [http-server]
  - id: gin-server-custom-json-codec
    name: "Custom JSON codec"
    source: server-config/custom-json-codec.md
    match: [codec]
  - id: gin-server-database
    name: "Database"
    source: server-config/database.md
    match: [database-sql, gorm]
  - id: gin-server-graceful
    name: "Graceful restart or stop"
    source: server-config/graceful-restart-or-stop.md
    match: [graceful-shutdown]
  - id: gin-server-health-check
    name: "Health check"
    source: server-config/health-check.md
    match: [health-check]
  - id: gin-server-metrics
    name: "Metrics"
    source: server-config/metrics.md
    match: [prometheus]
  - id: gin-server-multiple-service
    name: "Run multiple services"
    source: server-config/run-multiple-service.md
    match: [multiple-servers]
  - id: gin-server-lets-encrypt
    name: "Support Lets Encrypt"
    source: server-config/support-lets-encrypt.md
    match: [lets-encrypt, autotls]
  - id: gin-server-trusted-proxies
    name: "Trusted proxies"
    source: server-config/trusted-proxies.md
    match: [trusted-proxies]
  - id: gin-server-websocket
    name: "WebSocket"
    source: server-config/websocket.md
    match: [websocket]
  - id: gin-testing
    name: "Testing"
    source: testing/index.md
    match: [testing, httptest]
  - id: gin-build-tags-json-replacement
    name: "Build tags JSON replacement"
    source: build-tags/json-replacement.md
    match: [go-json, build-tags]
  - id: gin-build-tags-nomsgpack
    name: "Build tags nomsgpack"
    source: build-tags/nomsgpack.md
    match: [nomsgpack]
  - id: gin-deployment
    name: "Deployment"
    source: deployment/index.md
    match: [deployment, release-mode]
