# Coverage spec: ntfy. Topics from the official docs (binwiederhier/ntfy docs folder) in sources.
subject: ntfy
scope:
  category: computing-software
  field: messaging-and-integration
  products: [ntfy]
sources:
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish/template-functions.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/api.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/cli.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/phone.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/web.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/pwa.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/install.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/troubleshooting.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/known-issues.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/deprecations.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/faq.md"
  - "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/examples.md"
topics:
  - id: publish-basics
    name: "Publish basics"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [publish, curl, post, put, topic]
  - id: topic-naming-security
    name: "Topic naming and security"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [topic, security, brute-force, acl]
  - id: message-title
    name: "Message title"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [title, x-title, rfc-2047, headers]
  - id: message-priority
    name: "Message priority"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [priority, x-priority, urgent, headers]
  - id: tags-and-emojis
    name: "Tags and emojis"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [tags, emoji, x-tags, headers]
  - id: markdown-messages
    name: "Markdown messages"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [markdown, x-markdown, formatting]
  - id: click-and-icon
    name: "Click action and icon"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [click, icon, x-click, x-icon]
  - id: attachments-local-file
    name: "Attachments from a local file"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [attachments, upload, x-filename, put]
  - id: attachments-from-url
    name: "Attachments from a URL"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [attachments, x-attach, url, external-file]
  - id: action-buttons-header
    name: "Action buttons header format"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [actions, action-buttons, x-actions, view]
  - id: action-http-broadcast
    name: "HTTP and broadcast actions"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [actions, http-action, broadcast, cors]
  - id: scheduled-delivery
    name: "Scheduled delivery"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [delay, scheduled, x-delay, timezone]
  - id: dead-mans-switch
    name: "Dead man's switch"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [heartbeat, dead-mans-switch, sequence-id, scheduled]
  - id: update-notifications
    name: "Updating notifications"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [sequence-id, update, x-sequence-id, replace]
  - id: clear-delete-notifications
    name: "Clearing and deleting notifications"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [clear, delete, message-clear, message-delete]
  - id: templating-basics
    name: "Message templating basics"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [template, templating, webhook, go-template]
  - id: templating-custom-inline
    name: "Custom and inline templates"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [template, inline-template, custom-template, globoff]
  - id: template-functions
    name: "Template functions"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish/template-functions.md"
    match: [template, template-functions, sprig, go-template]
  - id: publish-as-json
    name: "Publish as JSON"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [json, publish-json, root-url, fields]
  - id: webhooks-get-publish
    name: "Webhooks via GET"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [webhooks, get, trigger, query-parameters]
  - id: email-notifications
    name: "Email notifications"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [email, x-email, smtp, forwarding]
  - id: email-publishing
    name: "Email publishing"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [email, email-publishing, smtp-server, topic-address]
  - id: phone-calls
    name: "Phone calls"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [phone-call, x-call, twilio, alerts]
  - id: publish-authentication
    name: "Publish authentication"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [authentication, basic-auth, bearer, access-token]
  - id: cache-and-firebase-headers
    name: "Cache and Firebase headers"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [cache, firebase, x-cache, x-firebase]
  - id: unifiedpush-matrix
    name: "UnifiedPush and Matrix gateway"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [unifiedpush, matrix, push-gateway, up]
  - id: publish-limits
    name: "Default limits"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [limits, rate-limit, quota, attachments]
  - id: publish-parameter-aliases
    name: "Publish parameter aliases"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/publish.md"
    match: [headers, aliases, query-parameters, parameters]
  - id: subscribe-streams
    name: "Subscribe streams"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/api.md"
    match: [subscribe, json-stream, sse, websocket]
  - id: subscribe-polling-since
    name: "Polling and since"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/api.md"
    match: [polling, since, scheduled, replay]
  - id: subscribe-filters
    name: "Subscription filters"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/api.md"
    match: [filters, priority, tags, subscribe]
  - id: subscribe-multiple-topics
    name: "Multiple topics"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/api.md"
    match: [multiple-topics, subscribe, ordering, comma-separated]
  - id: json-message-format
    name: "JSON message format"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/api.md"
    match: [json, message-format, events, fields]
  - id: cli-subscribe-command
    name: "CLI subscribe command"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/cli.md"
    match: [cli, subscribe, command, environment-variables]
  - id: cli-client-config
    name: "CLI client config"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/cli.md"
    match: [cli, client-yml, from-config, defaults]
  - id: cli-systemd-service
    name: "CLI systemd service"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/cli.md"
    match: [systemd, ntfy-client, service, user-service]
  - id: android-instant-delivery
    name: "Android instant delivery"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/phone.md"
    match: [android, instant-delivery, foreground-service, fcm]
  - id: android-ntfy-links-and-sharing
    name: "Android links and sharing"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/phone.md"
    match: [android, deep-links, share, message-bar]
  - id: android-advanced-settings
    name: "Android advanced settings"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/phone.md"
    match: [android, certificates, custom-headers, mutual-tls]
  - id: android-intents
    name: "Android intents"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/phone.md"
    match: [android, intents, tasker, macrodroid]
  - id: web-app-background-notifications
    name: "Web app background notifications"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/web.md"
    match: [web-app, background-notifications, web-push, browser-support]
  - id: pwa-install
    name: "Installing the PWA"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/subscribe/pwa.md"
    match: [pwa, install, desktop, web-push]
  - id: server-quick-start
    name: "Server quick start"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [server, serve, server-yml, environment-variables]
  - id: server-database
    name: "Server database"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [database, postgresql, sqlite, database-url]
  - id: behind-proxy
    name: "Behind a reverse proxy"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [reverse-proxy, behind-proxy, nginx, websockets]
  - id: message-cache-config
    name: "Message cache config"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [message-cache, cache-file, cache-duration, persistence]
  - id: attachment-storage
    name: "Attachment storage"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [attachments, attachment-cache-dir, s3, storage]
  - id: access-control-users-acl
    name: "Access control users and ACLs"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [access-control, acl, users, auth-default-access]
  - id: access-control-tokens
    name: "Access control tokens"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [access-tokens, token, auth-tokens, provisioning]
  - id: private-instance-setup
    name: "Private instance setup"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [private-instance, deny-all, auth-users, auth-access]
  - id: smtp-config
    name: "SMTP config"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [smtp, smtp-sender, email-server, smtp-sender-verify]
  - id: firebase-ios-upstream
    name: "Firebase and iOS upstream"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [firebase, ios, upstream-base-url, apns]
  - id: web-push-config
    name: "Web Push config"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [web-push, vapid, web-push-public-key, pwa]
  - id: tiers-payments
    name: "Tiers and payments"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [tiers, payments, stripe, user-limits]
  - id: rate-limit-config
    name: "Rate limit config"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [rate-limit, visitor-limits, burst, replenish]
  - id: scale-tuning-metrics
    name: "Scale tuning and metrics"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [metrics, prometheus, health, tuning]
  - id: logging-config
    name: "Logging config"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [logging, log-level, log-format, debug]
  - id: web-ui-options
    name: "Web UI options"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/config.md"
    match: [web-ui, web-root, require-login, enable-signup]
  - id: install-linux
    name: "Install on Linux"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/install.md"
    match: [install, linux, systemd, packages]
  - id: install-docker
    name: "Install with Docker and Kubernetes"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/install.md"
    match: [docker, docker-compose, kubernetes, container]
  - id: troubleshooting-debug
    name: "Troubleshooting and debug logs"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/troubleshooting.md"
    match: [troubleshooting, debug, logs, adb]
  - id: troubleshooting-reconnecting
    name: "Troubleshooting Reconnecting"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/troubleshooting.md"
    match: [reconnecting, late-notifications, websocket, http-403]
  - id: known-issues-ios-safari
    name: "Known issues on iOS and Safari"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/known-issues.md"
    match: [known-issues, ios, safari, workarounds]
  - id: deprecations
    name: "Deprecations"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/deprecations.md"
    match: [deprecations, env-topic, since-id, upgrade]
  - id: examples-cron-ssh
    name: "Examples cron and SSH"
    source: "https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/examples.md"
    match: [cron, ssh, pam, ntfy-run]
