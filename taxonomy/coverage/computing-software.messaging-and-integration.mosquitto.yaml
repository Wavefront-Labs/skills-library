# Coverage spec: mosquitto. Topics from the official docs.
subject: mosquitto
scope:
  category: computing-software
  field: messaging-and-integration
  products: [mosquitto]
sources:
  - "https://mosquitto.org/documentation/"
  - "https://mosquitto.org/man/mosquitto-conf-5.html"
topics:
  - id: listener-ports-and-binding
    name: "Listener ports and binding"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [listener]
  - id: default-listener-loopback
    name: "Default listener loopback"
    source: "https://mosquitto.org/man/mosquitto-8.html"
    match: [default-listener]
  - id: allow-anonymous-option
    name: "Allow anonymous option"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [allow-anonymous]
  - id: password-file-option
    name: "Password file option"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [password-file]
  - id: mosquitto-passwd-usage
    name: "Mosquitto passwd usage"
    source: "https://mosquitto.org/man/mosquitto_passwd-1.html"
    match: [mosquitto-passwd]
  - id: password-hash-algorithms
    name: "Password hash algorithms"
    source: "https://mosquitto.org/man/mosquitto_passwd-1.html"
    match: [argon2id]
  - id: acl-file-syntax
    name: "Acl file syntax"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [acl-file]
  - id: acl-pattern-substitution
    name: "Acl pattern substitution"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [pattern]
  - id: per-listener-settings-option
    name: "Per listener settings option"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [per-listener-settings]
  - id: plugin-loading-options
    name: "Plugin loading options"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [plugin]
  - id: tls-listener-certificates
    name: "Tls listener certificates"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [certfile]
  - id: tls-generate-certificates
    name: "Tls generate certificates"
    source: "https://mosquitto.org/man/mosquitto-tls-7.html"
    match: [mosquitto-tls]
  - id: client-certificate-authentication
    name: "Client certificate authentication"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [require-certificate]
  - id: tls-versions-and-ciphers
    name: "Tls versions and ciphers"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [tls-version]
  - id: tls-psk-listener
    name: "Tls psk listener"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [psk-file]
  - id: websockets-listener
    name: "Websockets listener"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [websockets]
  - id: connection-limits
    name: "Connection limits"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [max-connections]
  - id: persistence-settings
    name: "Persistence settings"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [persistence]
  - id: persistent-client-expiration
    name: "Persistent client expiration"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [persistent-client-expiration]
  - id: queue-and-inflight-limits
    name: "Queue and inflight limits"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [max-queued-messages]
  - id: message-and-packet-size-limits
    name: "Message and packet size limits"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [message-size-limit]
  - id: retained-message-options
    name: "Retained message options"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [retain-available]
  - id: client-id-policy-options
    name: "Client id policy options"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [allow-zero-length-clientid]
  - id: log-destinations
    name: "Log destinations"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [log-dest]
  - id: sys-topic-interval
    name: "Sys topic interval"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [sys-interval]
  - id: sys-broker-statistics
    name: "Sys broker statistics"
    source: "https://mosquitto.org/man/mosquitto-8.html"
    match: [sys-broker]
  - id: include-dir-config-files
    name: "Include dir config files"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [include-dir]
  - id: reload-and-signals
    name: "Reload and signals"
    source: "https://mosquitto.org/man/mosquitto-8.html"
    match: [sighup]
  - id: mosquitto-signal-tool
    name: "Mosquitto signal tool"
    source: "https://mosquitto.org/man/mosquitto_signal-1.html"
    match: [config-reload]
  - id: broker-command-line-options
    name: "Broker command line options"
    source: "https://mosquitto.org/man/mosquitto-8.html"
    match: [test-config]
  - id: wildcard-subscriptions
    name: "Wildcard subscriptions"
    source: "https://mosquitto.org/man/mosquitto-8.html"
    match: [wildcard]
  - id: bridge-connection-definition
    name: "Bridge connection definition"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [connection]
  - id: bridge-topic-mapping
    name: "Bridge topic mapping"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [topic]
  - id: bridge-start-types-and-restart
    name: "Bridge start types and restart"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [start-type]
  - id: bridge-notifications
    name: "Bridge notifications"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [notifications]
  - id: bridge-protocol-and-session
    name: "Bridge protocol and session"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [bridge-protocol-version]
  - id: bridge-tls-options
    name: "Bridge tls options"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [bridge-cafile]
  - id: pub-payload-modes
    name: "Pub payload modes"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [mosquitto-pub]
  - id: pub-retain-qos-repeat
    name: "Pub retain qos repeat"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [repeat]
  - id: client-connection-url-auth
    name: "Client connection url auth"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [url]
  - id: client-config-files
    name: "Client config files"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [option-files]
  - id: client-tls-options
    name: "Client tls options"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [cafile]
  - id: client-wills
    name: "Client wills"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [will-topic]
  - id: client-sessions-and-ids
    name: "Client sessions and ids"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [session-expiry]
  - id: client-v5-properties
    name: "Client v5 properties"
    source: "https://mosquitto.org/man/mosquitto_pub-1.html"
    match: [property-option]
  - id: sub-output-format-strings
    name: "Sub output format strings"
    source: "https://mosquitto.org/man/mosquitto_sub-1.html"
    match: [output-format]
  - id: sub-json-output
    name: "Sub json output"
    source: "https://mosquitto.org/man/mosquitto_sub-1.html"
    match: [json-output]
  - id: sub-retained-message-handling
    name: "Sub retained message handling"
    source: "https://mosquitto.org/man/mosquitto_sub-1.html"
    match: [retain-handling]
  - id: sub-filtering-and-stopping
    name: "Sub filtering and stopping"
    source: "https://mosquitto.org/man/mosquitto_sub-1.html"
    match: [count]
  - id: rr-request-response
    name: "Rr request response"
    source: "https://mosquitto.org/man/mosquitto_rr-1.html"
    match: [mosquitto-rr]
  - id: ctrl-command-line-tool
    name: "Ctrl command line tool"
    source: "https://mosquitto.org/man/mosquitto_ctrl-1.html"
    match: [mosquitto-ctrl]
  - id: ctrl-interactive-shell
    name: "Ctrl interactive shell"
    source: "https://mosquitto.org/man/mosquitto_ctrl_shell-1.html"
    match: [shell]
  - id: dynsec-concepts-objects
    name: "Dynsec concepts objects"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [dynamic-security]
  - id: dynsec-install-and-init
    name: "Dynsec install and init"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [dynsec]
  - id: dynsec-default-acl-access
    name: "Dynsec default acl access"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [setdefaultaclaccess]
  - id: dynsec-acl-types
    name: "Dynsec acl types"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [subscribeliteral]
  - id: dynsec-priority-evaluation
    name: "Dynsec priority evaluation"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [priority]
  - id: dynsec-client-commands
    name: "Dynsec client commands"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [createclient]
  - id: dynsec-groups-and-anonymous
    name: "Dynsec groups and anonymous"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [setanonymousgroup]
  - id: dynsec-role-and-acl-commands
    name: "Dynsec role and acl commands"
    source: "https://mosquitto.org/documentation/dynamic-security/"
    match: [addroleacl]
