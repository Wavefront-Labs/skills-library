# Canonical coverage spec: C++ language, toolchain and build ecosystem.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: cpp-language
scope:
  category: computing-software
  field: software-engineering
  products: [cpp]
sources:
  - "C++ Core Guidelines (isocpp.github.io/CppCoreGuidelines)"
  - "cppreference.com language and library sections"
  - "CMake reference documentation (cmake.org/cmake/help/latest)"
  - "GCC and Clang manuals: warning options, sanitizers, static analyzer"
  - "SEI CERT C++ Coding Standard"
topics:
  - {id: cpp-interfaces, name: "Interface design", source: "Core Guidelines: I Interfaces", match: [cpp-interfaces], subtopics: [
      {id: cpp-if-strong-types, name: "Strongly typed interfaces", match: [strongly-typed-interfaces]},
      {id: cpp-if-params, name: "Passing parameters", match: [parameter-passing-conventions]},
      {id: cpp-if-globals, name: "Avoiding globals and singletons", match: [avoid-globals-singletons]}]}
  - {id: cpp-functions, name: "Function design", source: "Core Guidelines: F Functions", match: [cpp-functions], subtopics: [
      {id: cpp-fn-returns, name: "Return values and out-parameters", match: [return-values-out-params]},
      {id: cpp-fn-noexcept, name: "noexcept functions", match: [noexcept]},
      {id: cpp-fn-overload, name: "Overloading and default arguments", match: [overloading-default-args]}]}
  - {id: cpp-classes, name: "Class design", source: "Core Guidelines: C Classes", match: [cpp-classes], subtopics: [
      {id: cpp-cl-zero, name: "Rule of zero", match: [rule-of-zero]},
      {id: cpp-cl-virtual-dtor, name: "Virtual destructors", match: [virtual-destructors]},
      {id: cpp-cl-special, name: "Special member functions", match: [special-member-functions]}]}
  - {id: cpp-hierarchies, name: "Class hierarchies", source: "Core Guidelines: C.hier", match: [cpp-hierarchies], subtopics: [
      {id: cpp-hi-override, name: "override and final", match: [override-final]},
      {id: cpp-hi-crtp, name: "CRTP", match: [crtp-static-polymorphism]},
      {id: cpp-hi-slicing, name: "Object slicing", match: [object-slicing]}]}
  - {id: cpp-operators, name: "Operators and conversions", source: "cppreference: operator overloading", match: [cpp-operators], subtopics: [
      {id: cpp-op-spaceship, name: "Three-way comparison", match: [three-way-comparison]},
      {id: cpp-op-udl, name: "User-defined literals", match: [user-defined-literals]},
      {id: cpp-op-conv, name: "Conversion operators", match: [conversion-operators-explicit]}]}
  - {id: cpp-types, name: "Enumerations and type tools", source: "Core Guidelines: Enum", match: [cpp-types], subtopics: [
      {id: cpp-ty-enumclass, name: "enum class", match: [enum-class-scoped]},
      {id: cpp-ty-bitflags, name: "Bit flags", match: [bit-flags-bitset]},
      {id: cpp-ty-casts, name: "Casts and std::byte", match: [casts-std-byte]}]}
  - {id: cpp-resource, name: "Resource management", source: "Core Guidelines: R Resource management", match: [cpp-resource], subtopics: [
      {id: cpp-rs-raii, name: "RAII", match: [raii]},
      {id: cpp-rs-unique, name: "unique_ptr", match: [unique-ptr]},
      {id: cpp-rs-weak, name: "weak_ptr and cycles", match: [weak-ptr]}]}
  - {id: cpp-expressions, name: "Expressions and arithmetic", source: "Core Guidelines: ES Expressions; CERT INT", match: [cpp-expressions], subtopics: [
      {id: cpp-ex-promotion, name: "Integer promotion and sign conversion", match: [integer-promotion-sign-conversion]},
      {id: cpp-ex-order, name: "Evaluation order", match: [evaluation-order-sequencing]},
      {id: cpp-ex-const, name: "const correctness", match: [const-correctness]}]}
  - {id: cpp-performance, name: "Performance", source: "Core Guidelines: Per Performance", match: [cpp-performance], subtopics: [
      {id: cpp-pf-bench, name: "Microbenchmarks", match: [google-benchmark]},
      {id: cpp-pf-sso, name: "Small buffer optimisation", match: [small-string-optimization]},
      {id: cpp-pf-layout, name: "Data layout and cache locality", match: [cache-locality-data-layout]}]}
  - {id: cpp-concurrency, name: "Concurrency rules", source: "Core Guidelines: CP Concurrency", match: [cpp-concurrency], subtopics: [
      {id: cpp-cc-locks, name: "Mutexes and scoped_lock", match: [scoped-lock-mutex]},
      {id: cpp-cc-atomics, name: "Atomics and memory order", match: [atomics-memory-order]},
      {id: cpp-cc-race, name: "Data races", match: [data-race]}]}
  - {id: cpp-errors, name: "Error handling", source: "Core Guidelines: E Error handling", match: [cpp-errors], subtopics: [
      {id: cpp-er-exceptions, name: "Exception safety", match: [exception-safety]},
      {id: cpp-er-expected, name: "std::expected", match: [std-expected]},
      {id: cpp-er-codes, name: "error_code and system_error", match: [error-code-system-error]}]}
  - {id: cpp-constants, name: "Compile-time evaluation", source: "Core Guidelines: Con Constants", match: [cpp-constants], subtopics: [
      {id: cpp-co-constexpr, name: "constexpr", match: [constexpr]},
      {id: cpp-co-consteval, name: "consteval and constinit", match: [consteval]},
      {id: cpp-co-static-assert, name: "static_assert", match: [static-assert]}]}
  - {id: cpp-templates, name: "Templates and generic code", source: "Core Guidelines: T Templates", match: [cpp-templates], subtopics: [
      {id: cpp-tp-concepts, name: "Concepts", match: [cpp-concepts]},
      {id: cpp-tp-variadic, name: "Variadic templates and fold expressions", match: [variadic-fold-expressions]},
      {id: cpp-tp-traits, name: "Type traits", match: [type-traits-metaprogramming]}]}
  - {id: cpp-stl, name: "Standard library containers and algorithms", source: "cppreference: containers, algorithms", match: [cpp-stl], subtopics: [
      {id: cpp-st-containers, name: "Choosing containers", match: [stl-containers]},
      {id: cpp-st-algorithms, name: "Algorithms", match: [stl-algorithms]},
      {id: cpp-st-tuple, name: "array, tuple and pair", match: [array-tuple-pair]}]}
  - {id: cpp-text-io, name: "Text, I/O and time", source: "cppreference: strings, input/output, chrono, filesystem", match: [cpp-text-io], subtopics: [
      {id: cpp-ti-format, name: "std::format", match: [std-format]},
      {id: cpp-ti-iostreams, name: "iostreams and filesystem", match: [iostreams-filesystem]},
      {id: cpp-ti-chrono, name: "chrono", match: [std-chrono]}]}
  - {id: cpp-c-interop, name: "C interoperability", source: "Core Guidelines: CPL C-style programming", match: [cpp-c-interop], subtopics: [
      {id: cpp-ci-malloc, name: "C memory management", match: [malloc]},
      {id: cpp-ci-extern, name: "extern C boundaries", match: [extern-c-boundaries]},
      {id: cpp-ci-deleters, name: "Wrapping C handles", match: [custom-deleters]}]}
  - {id: cpp-source, name: "Source organisation", source: "Core Guidelines: SF Source files", match: [cpp-source], subtopics: [
