# Coverage spec: trivy. Topics from the Trivy docs table of contents.
subject: trivy
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [trivy]
sources:
  - "Trivy docs (trivy.dev/latest/docs)"
topics:
  - id: air-gapped-and-restricted-network-trivy
    name: "Air gapped and restricted network trivy"
    source: "https://trivy.dev/latest/docs/guide/advanced/air-gap/"
    match: [air-gap, offline-scan, skip-version-check]
  - id: cache-directory-and-scan-cache-backends
    name: "Cache directory and scan cache backends"
    source: "https://trivy.dev/latest/docs/guide/configuration/cache/"
    match: [cache-dir, cache-backend, redis]
  - id: compliance-reports-with-compliance-flag
    name: "Compliance reports with compliance flag"
    source: "https://trivy.dev/latest/docs/guide/compliance/compliance/"
    match: [compliance, cis, nsa]
  - id: custom-compliance-spec-yaml
    name: "Custom compliance spec yaml"
    source: "https://trivy.dev/latest/docs/guide/compliance/compliance/"
    match: [custom-compliance, compliance-spec, controls]
  - id: custom-license-classification-config
    name: "Custom license classification config"
    source: "https://trivy.dev/latest/docs/guide/scanner/license/"
    match: [custom-classification, generate-default-config, trivy-yaml]
  - id: detection-priority-precise-vs-comprehensive
    name: "Detection priority precise vs comprehensive"
    source: "https://trivy.dev/latest/docs/guide/scanner/vulnerability/"
    match: [detection-priority, precise, comprehensive]
  - id: discover-and-install-trivy-plugins
    name: "Discover and install trivy plugins"
    source: "https://trivy.dev/latest/docs/guide/plugin/user-guide/"
    match: [trivy-plugin, plugin-index, plugin-search]
  - id: enable-vex-methods-and-priority
    name: "Enable vex methods and priority"
    source: "https://trivy.dev/latest/docs/guide/supply-chain/vex/"
    match: [vex, openvex, vex-repo]
  - id: filter-by-package-relationships
    name: "Filter by package relationships"
    source: "https://trivy.dev/latest/docs/guide/scanner/vulnerability/"
    match: [pkg-relationships, direct-dependencies, indirect]
  - id: filter-package-types-with-pkg-types
    name: "Filter package types with pkg types"
    source: "https://trivy.dev/latest/docs/guide/scanner/vulnerability/"
    match: [pkg-types, os-packages, library-packages]
  - id: first-steps-trivy-command-pattern
    name: "First steps trivy command pattern"
    source: "https://trivy.dev/latest/docs/getting-started/"
    match: [trivy-cli, targets, scanners]
  - id: install-trivy-official-channels
    name: "Install trivy official channels"
    source: "https://trivy.dev/latest/docs/getting-started/installation/"
    match: [install, installation, docker-image]
  - id: license-ignore-and-confidence-level
    name: "License ignore and confidence level"
    source: "https://trivy.dev/latest/docs/guide/scanner/license/"
    match: [ignored-licenses, license-confidence-level, classifier]
  - id: license-scanning-classification-and-severity
    name: "License scanning classification and severity"
    source: "https://trivy.dev/latest/docs/guide/scanner/license/"
    match: [license-scanning, license-full, google-license-classification]
  - id: override-severity-source-and-distro
    name: "Override severity source and distro"
    source: "https://trivy.dev/latest/docs/guide/scanner/vulnerability/"
    match: [vuln-severity-source, distro, os-version]
  - id: private-registries-ecr-acr-gar
    name: "Private registries ecr acr gar"
    source: "https://trivy.dev/latest/docs/guide/advanced/private-registries/ecr/"
    match: [ecr, acr, gar]
  - id: private-registry-login-and-credentials
    name: "Private registry login and credentials"
    source: "https://trivy.dev/latest/docs/guide/advanced/private-registries/"
    match: [trivy-registry-login, trivy-username, trivy-password]
  - id: run-trivy-plugins-and-output-mode
    name: "Run trivy plugins and output mode"
    source: "https://trivy.dev/latest/docs/guide/plugin/user-guide/"
    match: [plugin-run, run-as-plugin, output-plugin]
  - id: scan-asset-version-support-and-end-of-updates
    name: "Scan asset version support and end of updates"
    source: "https://trivy.dev/latest/docs/guide/references/compatibility/"
    match: [scan-assets, trivy-db, trivy-java-db]
  - id: scan-code-repositories-trivy-repo
    name: "Scan code repositories trivy repo"
    source: "https://trivy.dev/latest/docs/guide/target/repository/"
    match: [trivy-repo, repository, lock-files]
  - id: scan-local-projects-trivy-fs
    name: "Scan local projects trivy fs"
    source: "https://trivy.dev/latest/docs/guide/target/filesystem/"
    match: [trivy-fs, filesystem-scan, lock-files]
  - id: scan-remote-git-branch-commit-tag-private
    name: "Scan remote git branch commit tag private"
    source: "https://trivy.dev/latest/docs/guide/target/repository/"
    match: [git-branch, git-commit, git-tag]
  - id: scan-rootfs-and-speed-up-traversal
    name: "Scan rootfs and speed up traversal"
    source: "https://trivy.dev/latest/docs/guide/target/rootfs/"
    match: [trivy-rootfs, rootfs, host-scan]
  - id: secret-allow-rules
    name: "Secret allow rules"
    source: "https://trivy.dev/latest/docs/guide/scanner/secret/"
    match: [allow-rules, false-positives, known-secrets]
  - id: secret-config-file-and-custom-rules
    name: "Secret config file and custom rules"
    source: "https://trivy.dev/latest/docs/guide/scanner/secret/"
    match: [secret-config, trivy-secret-yaml, custom-rules]
  - id: secret-enable-and-disable-builtin-rules
    name: "Secret enable and disable builtin rules"
    source: "https://trivy.dev/latest/docs/guide/scanner/secret/"
    match: [enable-builtin-rules, disable-rules, disable-allow-rules]
  - id: secret-scanning-quick-start
    name: "Secret scanning quick start"
    source: "https://trivy.dev/latest/docs/guide/scanner/secret/"
    match: [secret-scanning, secrets, builtin-rules]
  - id: secret-skip-patterns-and-speed
    name: "Secret skip patterns and speed"
    source: "https://trivy.dev/latest/docs/guide/scanner/secret/"
    match: [skip-patterns, doublestar, glob]
  - id: select-and-skip-files-for-scanning
    name: "Select and skip files for scanning"
    source: "https://trivy.dev/latest/docs/guide/configuration/skipping/"
    match: [skip-files, skip-dirs, file-patterns]
  - id: self-host-trivy-databases
    name: "Self host trivy databases"
    source: "https://trivy.dev/latest/docs/guide/advanced/self-hosting/"
    match: [self-hosting, oras, crane]
  - id: third-party-packages-skipped
    name: "Third party packages skipped"
    source: "https://trivy.dev/latest/docs/guide/scanner/vulnerability/"
    match: [third-party, epel, false-positives]
  - id: trivy-compatibility-and-stability-policy
    name: "Trivy compatibility and stability policy"
    source: "https://trivy.dev/latest/docs/guide/references/compatibility/"
    match: [compatibility, stability, stable-interfaces]
  - id: trivy-databases-locations-and-updates
    name: "Trivy databases locations and updates"
    source: "https://trivy.dev/latest/docs/guide/configuration/db/"
    match: [trivy-db, trivy-java-db, trivy-checks]
  - id: trivy-plugin-overview-and-security
    name: "Trivy plugin overview and security"
    source: "https://trivy.dev/latest/docs/guide/plugin/"
    match: [trivy-plugins, plugin-security, sandbox]
  - id: trivy-usage-telemetry-and-opt-out
    name: "Trivy usage telemetry and opt out"
    source: "https://trivy.dev/latest/docs/guide/advanced/telemetry/"
    match: [telemetry, disable-telemetry, privacy]
  - id: verify-trivy-signatures-cosign-gpg
    name: "Verify trivy signatures cosign gpg"
    source: "https://trivy.dev/latest/docs/getting-started/signature-verification/"
    match: [cosign, signature-verification, sigstore]
  - id: vex-oci-attestation-discovery
    name: "Vex oci attestation discovery"
    source: "https://trivy.dev/latest/docs/guide/supply-chain/vex/oci/"
    match: [vex-oci, cosign-attest, openvex]
  - id: vex-sbom-reference-external-documents
    name: "Vex sbom reference external documents"
    source: "https://trivy.dev/latest/docs/guide/supply-chain/vex/sbom-ref/"
    match: [vex-sbom-ref, cyclonedx, external-references]
  - id: vulnerability-data-sources-selection
    name: "Vulnerability data sources selection"
    source: "https://trivy.dev/latest/docs/guide/scanner/vulnerability/"
    match: [vulnerability, advisory, data-source]
  - id: vulnerability-severity-selection-logic
    name: "Vulnerability severity selection logic"
    source: "https://trivy.dev/latest/docs/guide/scanner/vulnerability/"
    match: [severity, vendor-severity, cvss]
