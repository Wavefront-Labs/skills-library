# Coverage spec: mastra. Topics from the official docs.
subject: mastra
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [mastra]
sources:
  - "https://mastra.ai/docs"
topics:
  - id: agents-overview
    name: "Agents overview and quickstart"
    source: "https://mastra.ai/docs/agents/overview"
    match: [agent,instructions,generate]
  - id: agent-tools
    name: "Agent tools"
    source: "https://mastra.ai/docs/agents/tools"
    match: [tool,createtool]
  - id: structured-output
    name: "Structured output"
    source: "https://mastra.ai/docs/agents/structured-output"
    match: [structuredoutput,schema,zod]
  - id: processors
    name: "Processors"
    source: "https://mastra.ai/docs/agents/processors"
    match: [processor,inputprocessors,outputprocessors]
  - id: guardrails
    name: "Guardrails"
    source: "https://mastra.ai/docs/agents/guardrails"
    match: [guardrail,moderation,pii]
  - id: agent-hitl
    name: "Agent human-in-the-loop"
    source: "https://mastra.ai/docs/agents/human-in-the-loop"
    match: [requireapproval,suspend,approvetoolcall]
  - id: agent-networks
    name: "Agent networks"
    source: "https://mastra.ai/docs/agents/networks"
    match: [network,routing]
  - id: code-mode
    name: "Code mode"
    source: "https://mastra.ai/docs/agents/code-mode"
    match: [codemode,sandbox]
  - id: subagents
    name: "Subagents"
    source: "https://mastra.ai/docs/subagents"
    match: [subagent,delegation]
  - id: multi-agent-patterns
    name: "Multi-agent patterns"
    source: "https://mastra.ai/docs/guides/multi-agent-systems"
    match: [handoff,supervisor,council]
  - id: agent-skills
    name: "Agent skills"
    source: "https://mastra.ai/docs/skills"
    match: [skill,skillmd]
  - id: agent-lifecycle
    name: "Agent lifecycle"
    source: "https://mastra.ai/docs/guides/agent-lifecycle"
    match: [lifecycle,loop,requestcontext]
  - id: context-engineering
    name: "Context engineering"
    source: "https://mastra.ai/docs/guides/context-engineering"
    match: [context,compaction]
  - id: streaming
    name: "Streaming"
    source: "https://mastra.ai/docs/guides/streaming"
    match: [stream,fullstream,aisdk]
  - id: workflows-overview
    name: "Workflows overview"
    source: "https://mastra.ai/docs/workflows/overview"
    match: [workflow,createstep,createworkflow]
  - id: workflow-control-flow
    name: "Workflow control flow"
    source: "https://mastra.ai/docs/workflows/control-flow"
    match: [then,parallel,branch,dountil]
  - id: workflow-suspend
    name: "Suspend and resume"
    source: "https://mastra.ai/docs/workflows/suspend-and-resume"
    match: [suspend,resume,sleep]
  - id: workflow-hitl
    name: "Workflow human-in-the-loop"
    source: "https://mastra.ai/docs/workflows/human-in-the-loop"
    match: [bail,humaninput]
  - id: workflow-errors
    name: "Workflow error handling"
    source: "https://mastra.ai/docs/workflows/error-handling"
    match: [onfinish,onerror,retries]
  - id: workflow-snapshots
    name: "Workflow snapshots"
    source: "https://mastra.ai/docs/workflows/snapshots"
    match: [snapshot]
  - id: workflow-agents-tools
    name: "Agents and tools in workflows"
    source: "https://mastra.ai/docs/workflows/agents-and-tools"
    match: [agentstep,toolstep]
  - id: scheduled-workflows
    name: "Scheduled workflows"
    source: "https://mastra.ai/docs/workflows/scheduled-workflows"
    match: [schedule,cron]
  - id: memory-history
    name: "Memory and message history"
    source: "https://mastra.ai/docs/memory/overview"
    match: [memory,thread,resourceid]
  - id: working-memory
    name: "Working memory"
    source: "https://mastra.ai/docs/memory/working-memory"
    match: [workingmemory,template]
  - id: semantic-recall
    name: "Semantic recall"
    source: "https://mastra.ai/docs/memory/semantic-recall"
    match: [semanticrecall,embedder,vector]
  - id: observational-memory
    name: "Observational memory"
    source: "https://mastra.ai/docs/memory/observational-memory"
    match: [observationalmemory,reflection]
  - id: multi-user-threads
    name: "Multi-user threads"
    source: "https://mastra.ai/docs/memory/multi-user-threads"
    match: [multiuser,participants]
  - id: storage
    name: "Storage"
    source: "https://mastra.ai/docs/storage"
    match: [storage,libsql,postgres]
  - id: knowledge
    name: "Knowledge"
    source: "https://mastra.ai/docs/knowledge/overview"
    match: [knowledge,scopes,pinned]
  - id: server
    name: "Mastra server"
    source: "https://mastra.ai/docs/server/overview"
    match: [server,rest,openai]
  - id: server-adapters
    name: "Server adapters"
    source: "https://mastra.ai/docs/server/server-adapters"
    match: [adapter,hono,express]
  - id: request-context
    name: "Request context"
    source: "https://mastra.ai/docs/server/request-context"
    match: [requestcontext]
  - id: mastra-client
    name: "Mastra client"
    source: "https://mastra.ai/docs/server/mastra-client"
    match: [mastraclient]
  - id: pubsub
    name: "PubSub"
    source: "https://mastra.ai/docs/server/pubsub"
    match: [pubsub,resumable]
  - id: auth
    name: "Authentication"
    source: "https://mastra.ai/docs/auth/simple-auth"
    match: [auth,jwt,rbac]
  - id: fga
    name: "Fine-grained authorization"
    source: "https://mastra.ai/docs/auth/fga"
    match: [fga]
  - id: identity-guides
    name: "Identity guides"
    source: "https://mastra.ai/docs/guides/authentication-identity"
    match: [identity,oauth]
  - id: mcp
    name: "Model Context Protocol"
    source: "https://mastra.ai/docs/connections/mcp"
    match: [mcp,mcpclient,mcpserver]
  - id: a2a-acp
    name: "A2A and ACP"
    source: "https://mastra.ai/docs/connections/a2a"
    match: [a2a,acp]
  - id: sdk-agents
    name: "SDK agents"
    source: "https://mastra.ai/docs/connections/sdk-agents"
    match: [claudeagentsdk,cursor]
  - id: evals
    name: "Evals and scorers"
    source: "https://mastra.ai/docs/evals/overview"
    match: [scorer,runevals]
  - id: eval-datasets-experiments
    name: "Datasets and experiments"
    source: "https://mastra.ai/docs/evals/datasets"
    match: [dataset,experiment]
  - id: eval-ci
    name: "Evals in CI"
    source: "https://mastra.ai/docs/evals/vitest-integration"
    match: [vitest,expectevals]
  - id: tracing
    name: "Tracing"
    source: "https://mastra.ai/docs/observability/overview"
    match: [tracing,observability,sampling]
  - id: logs-metrics-feedback
    name: "Logs, metrics and feedback"
    source: "https://mastra.ai/docs/observability/logging"
    match: [pinologger,feedback,metrics]
  - id: sandbox
    name: "Sandbox and workspace"
    source: "https://mastra.ai/docs/sandbox/overview"
    match: [sandbox,workspace,filesystem]
  - id: browser
    name: "Browser tools"
    source: "https://mastra.ai/docs/browser"
    match: [browser,screencast]
  - id: harness
    name: "Harness"
    source: "https://mastra.ai/docs/harness/agent-controller"
    match: [harness,agentcontroller,goals]
  - id: signals
    name: "Signals"
    source: "https://mastra.ai/docs/signals/sending-signals"
    match: [signal,notification]
  - id: channels
    name: "Channels"
    source: "https://mastra.ai/docs/channels"
    match: [channel,slack,discord]
  - id: deployment
    name: "Deployment"
    source: "https://mastra.ai/docs/deployment/mastra-server"
    match: [deploy,build,monorepo]
  - id: platform
    name: "Mastra platform"
    source: "https://mastra.ai/docs/mastra-platform/deploy"
    match: [platform,environments,connect]
  - id: studio
    name: "Studio"
    source: "https://mastra.ai/docs/studio/auth"
    match: [studio,editor]
