# Coverage spec: strongswan. Topics from the external structures named in `sources`.
subject: strongswan
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [strongswan]
sources:
  - "strongSwan documentation (https://docs.strongswan.org/docs/latest/index.html)"
topics:
  - id: attr-plugin-ike-attributes
    name: "attr plugin ike attributes"
    source: https://docs.strongswan.org/docs/latest/plugins/attr.html
    match: ["attr plugin ike attributes", "attr-plugin", "dns", "config-payload", "modeconfig"]
  - id: auth-rounds-local-and-remote
    name: "auth rounds local and remote"
    source: https://docs.strongswan.org/docs/latest/swanctl/swanctlConf.html
    match: ["auth rounds local and remote", "authentication", "local-remote", "identities", "revocation", "signature-constraints"]
  - id: authorities-section
    name: "authorities section"
    source: https://docs.strongswan.org/docs/latest/swanctl/swanctlConf.html
    match: ["authorities section", "authorities", "crl-uris", "ocsp-uris", "cert-uri-base"]
  - id: bypass-lan-plugin
    name: "bypass lan plugin"
    source: https://docs.strongswan.org/docs/latest/plugins/bypass-lan.html
    match: ["bypass lan plugin", "bypass-lan", "local-network", "passthrough", "split-tunnel"]
  - id: charon-cmd-client
    name: "charon cmd client"
    source: https://docs.strongswan.org/docs/latest/daemons/charon-cmd.html
    match: ["charon cmd client", "charon-cmd", "command-line-client", "auth-profiles", "roadwarrior"]
  - id: charon-core-options
