    match: ["charon core options", "charon", "install-routes", "routing-table", "keep-alive", "dos-protection", "interfaces-use"]
  - id: charon-logging-configuration
    name: "charon logging configuration"
    source: https://docs.strongswan.org/docs/latest/config/logging.html
    match: ["charon logging configuration", "logging", "filelog", "syslog", "log-levels", "subsystems"]
  - id: charon-systemd-daemon
    name: "charon systemd daemon"
    source: https://docs.strongswan.org/docs/latest/daemons/charon-systemd.html
    match: ["charon systemd daemon", "charon-systemd", "systemd", "journal", "service-unit"]
  - id: child-sa-start-close-and-dpd-actions
    name: "child sa start close and dpd actions"
