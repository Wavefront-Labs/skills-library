# Coverage spec for MetalLB (computing-software / cloud-infrastructure-engineering).
subject: MetalLB
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [metallb]
sources:
  - "MetalLB website documentation (https://github.com/metallb/metallb/tree/main/website/content)"
topics:
  - id: address-allocation
    name: "Address allocation and pools"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/_index.md
    match: ["address-allocation", "ip-pool", "rfc1918"]
  - id: announcement-modes
    name: "External announcement modes"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/_index.md
    match: ["announcement", "arp", "ndp"]
  - id: l2-mode-failover
    name: "Layer 2 mode and failover"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/layer2.md
    match: ["layer2", "failover", "memberlist"]
  - id: l2-gratuitous-arp
    name: "Periodic gratuitous ARP"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/layer2.md
    match: ["gratuitous-arp", "fdb-aging"]
  - id: l2-leader-election
    name: "Layer 2 leader election and Keepalived comparison"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/layer2.md
    match: ["leader-election", "brain-split", "keepalived"]
  - id: bgp-load-balancing
    name: "BGP load-balancing behaviour"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/bgp.md
    match: ["ecmp", "packet-hash"]
  - id: bgp-reset-mitigation
    name: "BGP connection resets and mitigations"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/bgp.md
    match: ["resilient-ecmp", "connection-reset"]
  - id: frr-k8s-mode
    name: "FRR-K8s mode and FRR limitations"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/bgp.md
    match: ["frr-k8s", "frr-limitations"]
  - id: project-maturity
    name: "Project maturity and config format stability"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/concepts/maturity.md
    match: ["maturity", "beta"]
  - id: requirements
    name: "Requirements"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/_index.md
    match: ["requirements", "port-7946"]
  - id: strict-arp
    name: "Strict ARP for kube-proxy IPVS"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["strict-arp", "ipvs"]
  - id: manifest-install
    name: "Install by manifest or Kustomize"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["manifest", "kustomize"]
  - id: helm-install
    name: "Install with Helm"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["helm"]
  - id: pod-security
    name: "Pod security admission"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["pod-security", "privileged"]
  - id: operator
    name: "MetalLB Operator"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["operator", "operatorhub"]
  - id: bgp-backend-selection
    name: "BGP backend selection and FRR logging"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["backend-selection", "frr-logging"]
  - id: upgrade
    name: "Upgrading MetalLB"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["upgrade", "release-notes"]
  - id: lb-class
    name: "LoadBalancerClass"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/_index.md
    match: ["lb-class", "loadbalancerclass"]
  - id: cloud-compat
    name: "Cloud compatibility"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/clouds.md
    match: ["cloud-compatibility", "floating-ip"]
  - id: openshift-openstack
    name: "OpenShift and OpenStack notes"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/installation/clouds.md
    match: ["openshift", "openstack"]
  - id: network-addons
