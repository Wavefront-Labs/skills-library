    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/configuration/k3s.md
    match: ["k3s", "klipper"]
  - id: ipaddresspool
    name: "IPAddressPool basics"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/configuration/_index.md
    match: ["ipaddresspool", "cidr"]
  - id: l2advertisement
    name: "L2Advertisement basics"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/configuration/_index.md
    match: ["l2advertisement"]
  - id: bgp-peer-advertisement
    name: "BGPPeer and BGPAdvertisement basics"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/configuration/_index.md
    match: ["bgppeer", "bgpadvertisement"]
  - id: bfd
    name: "BFD profiles"
    source: https://raw.githubusercontent.com/metallb/metallb/main/website/content/configuration/_index.md
