# Coverage spec for Apache Solr, from the official Solr Reference Guide (solr.apache.org/guide/solr/latest).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: apache-solr
scope:
  category: computing-software
  field: search-and-information-retrieval
  products: [apache-solr]
sources:
  - "Apache Solr Reference Guide (solr.apache.org/guide/solr/latest)"
topics:
  - id: schema-api
    name: "Schema API"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/schema-api.html"
    match: [schema-api, solr]
  - id: field-properties
    name: "field type properties"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/field-type-definitions-and-properties.html"
    match: [field-properties, indexed-stored]
  - id: dynamic-fields
    name: "dynamic fields"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/dynamic-fields.html"
    match: [dynamic-fields, wildcard-field]
  - id: copy-fields
    name: "copyField and catch-all fields"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/copy-fields.html"
    match: [copy-fields, copy-field]
  - id: docvalues
    name: "docValues for sort and facets"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/docvalues.html"
    match: [docvalues, use-docvalues-as-stored]
  - id: partial-updates
    name: "atomic and in-place updates"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/partial-document-updates.html"
    match: [partial-updates, atomic-updates]
  - id: optimistic-concurrency
    name: "optimistic concurrency with _version_"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/partial-document-updates.html"
    match: [optimistic-concurrency, version-field]
  - id: nested-documents
    name: "nested document indexing"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/indexing-nested-documents.html"
    match: [nested-documents, nest-path]
  - id: reindexing
    name: "reindexing strategies"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/reindexing.html"
    match: [reindexing, reindex-collection]
  - id: json-updates
    name: "JSON update commands"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/indexing-with-update-handlers.html"
    match: [json-updates, json-update]
  - id: post-tool
    name: "bin/solr post tool"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/post-command.html"
    match: [post-tool, bin-solr-post]
  - id: solr-cell
    name: "Solr Cell and Tika extraction"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/indexing-with-tika.html"
    match: [solr-cell, tika-server]
  - id: deduplication
    name: "signature de-duplication"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/de-duplication.html"
    match: [deduplication, signature-processor]
  - id: analyzers
    name: "analyzer chains and text analysis"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/analyzers.html"
    match: [analyzers, analyzer-chain]
  - id: synonyms
    name: "synonym graph filter"
    source: "https://solr.apache.org/guide/solr/latest/indexing-guide/filters.html"
    match: [synonyms, synonym-graph]
  - id: update-processors
    name: "update request processor chains"
    source: "https://solr.apache.org/guide/solr/latest/configuration-guide/update-request-processors.html"
    match: [update-processors, update-request-processor]
  - id: standard-parser
    name: "standard query parser syntax"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/standard-query-parser.html"
    match: [standard-parser, standard-query-parser]
  - id: dismax
    name: "DisMax query parser"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/dismax-query-parser.html"
    match: [dismax, qf-mm]
  - id: edismax
    name: "eDisMax query parser"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/edismax-query-parser.html"
    match: [edismax, pf-boost]
  - id: local-params
    name: "local params syntax"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/local-params.html"
    match: [local-params, query-parser-switch]
  - id: filter-queries
    name: "filter queries and post filters"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/common-query-parameters.html"
    match: [filter-queries, filter-query]
  - id: sorting
    name: "sorting results"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/common-query-parameters.html"
    match: [sorting, sort-parameter]
  - id: pagination
    name: "start and rows pagination"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/pagination-of-results.html"
    match: [pagination, start-rows]
  - id: deep-paging
    name: "cursorMark deep paging"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/pagination-of-results.html"
    match: [deep-paging, cursormark]
  - id: field-faceting
    name: "field and query faceting"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/faceting.html"
    match: [field-faceting, facet-field]
  - id: range-pivot-facets
    name: "range and pivot facets"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/faceting.html"
    match: [range-pivot-facets, facet-range]
  - id: json-facets
    name: "JSON Facet API"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/json-facet-api.html"
    match: [json-facets, json-facet]
  - id: json-request
    name: "JSON Request API and query DSL"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/json-request-api.html"
    match: [json-request, json-request-api]
  - id: highlighting
    name: "highlighting"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/highlighting.html"
    match: [highlighting, unified-highlighter]
  - id: spellcheck
    name: "spell checking"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/spell-checking.html"
    match: [spellcheck, collation]
  - id: suggester
    name: "suggester"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/suggester.html"
    match: [suggester, autosuggest]
  - id: collapse-grouping
    name: "collapse, expand and result grouping"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/collapse-and-expand-results.html"
    match: [collapse-grouping, collapse-expand]
  - id: rerank
    name: "re-ranking queries"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/query-re-ranking.html"
    match: [rerank, rq-parameter]
  - id: ltr
    name: "learning to rank"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/learning-to-rank.html"
    match: [ltr, learning-to-rank]
  - id: spatial
    name: "spatial search"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/spatial-search.html"
    match: [spatial, spatial-search]
  - id: dense-vector
    name: "dense vector kNN search"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/dense-vector-search.html"
    match: [dense-vector, knn-query]
  - id: block-join
    name: "block join parent and child queries"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/block-join-query-parser.html"
    match: [block-join, parent-child-query]
  - id: join-parser
    name: "join query parser"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/join-query-parser.html"
    match: [join-parser, join-query-parser]
  - id: export
    name: "export handler and streaming"
    source: "https://solr.apache.org/guide/solr/latest/query-guide/exporting-result-sets.html"
    match: [export, export-handler]
  - id: commits
    name: "commits and transaction logs"
    source: "https://solr.apache.org/guide/solr/latest/configuration-guide/commits-transaction-logs.html"
    match: [commits, autocommit]
  - id: caches-warming
    name: "caches and query warming"
    source: "https://solr.apache.org/guide/solr/latest/configuration-guide/caches-warming.html"
    match: [caches-warming, caches]
  - id: configsets
    name: "configsets and ZooKeeper storage"
    source: "https://solr.apache.org/guide/solr/latest/configuration-guide/config-sets.html"
    match: [configsets, configset-api]
  - id: config-api
    name: "Config API and request parameters"
    source: "https://solr.apache.org/guide/solr/latest/configuration-guide/config-api.html"
    match: [config-api, configoverlay]
  - id: bin-solr
    name: "bin/solr control script"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/solr-control-script-reference.html"
    match: [bin-solr, solr-cli]
  - id: collections-api
    name: "Collections API create and manage"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/collection-management.html"
    match: [collections-api, create-collection]
  - id: shard-split
    name: "splitting shards"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/shard-management.html"
    match: [shard-split, splitshard]
  - id: replica-types
    name: "NRT, TLOG and PULL replicas"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/solrcloud-shards-indexing.html"
    match: [replica-types, nrt-replica]
  - id: doc-routing
    name: "document routing to shards"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/solrcloud-shards-indexing.html"
    match: [doc-routing, document-routing]
  - id: aliases
    name: "collection aliases and routed aliases"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/alias-management.html"
    match: [aliases, createalias]
  - id: backup-restore
    name: "backup and restore"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/backup-restore.html"
    match: [backup-restore, backup]
  - id: basic-auth
    name: "basic authentication and security.json"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/basic-authentication-plugin.html"
    match: [basic-auth, basic-authentication]
  - id: rule-auth
    name: "rule-based authorization"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/rule-based-authorization-plugin.html"
    match: [rule-auth, authorization]
  - id: ssl
    name: "SSL and TLS"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/enabling-ssl.html"
    match: [ssl, tls]
  - id: zookeeper
    name: "ZooKeeper ensemble"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/zookeeper-ensemble.html"
    match: [zookeeper, zookeeper-ensemble]
  - id: production-install
    name: "production service install"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/taking-solr-to-production.html"
    match: [production-install, install-solr-service]
  - id: jvm
    name: "JVM heap settings"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/jvm-settings.html"
    match: [jvm, jvm-settings]
  - id: docker
    name: "Solr in Docker"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/solr-in-docker.html"
    match: [docker, solr-precreate]
  - id: metrics
    name: "metrics and monitoring"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/metrics-reporting.html"
    match: [metrics, prometheus]
  - id: circuit-breakers
    name: "circuit breakers and rate limiters"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/circuit-breakers.html"
    match: [circuit-breakers, rate-limiting]
  - id: upgrade
    name: "rolling cluster upgrade"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/upgrading-a-solr-cluster.html"
    match: [upgrade, rolling-upgrade]
  - id: distributed-requests
    name: "distributed requests and shard preference"
    source: "https://solr.apache.org/guide/solr/latest/deployment-guide/solrcloud-distributed-requests.html"
    match: [distributed-requests, distributed-search]
