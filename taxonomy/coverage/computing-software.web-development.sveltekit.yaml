# Coverage spec: sveltekit. Topics from the official docs table of contents.
subject: sveltekit
scope:
  category: computing-software
  field: web-development
  products: [sveltekit]
sources:
  - "https://svelte.dev/docs/kit"
  - "https://github.com/sveltejs/kit/tree/main/documentation/docs"
topics:
  - id: create-project
    name: Creating a project
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/10-getting-started/20-creating-a-project.md"
    match: [create-project]
  - id: project-types
    name: Project types
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/10-getting-started/25-project-types.md"
    match: [project-types]
  - id: project-structure
    name: Project structure
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/10-getting-started/30-project-structure.md"
    match: [project-structure]
  - id: web-standards
    name: Web standards
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/10-getting-started/40-web-standards.md"
    match: [web-standards]
  - id: routing-files
    name: 'Routing: +page, +layout, +error, $types'
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/10-routing.md"
    match: [routing-files]
  - id: server-endpoints
    name: 'Routing: +server'
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/10-routing.md"
    match: [server-endpoints]
  - id: rest-params
    name: Rest and optional parameters
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/10-advanced-routing.md"
    match: [rest-params]
  - id: param-matchers
    name: Matching and sorting
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/10-advanced-routing.md"
    match: [param-matchers]
  - id: layout-groups
    name: Advanced layouts
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/10-advanced-routing.md"
    match: [layout-groups]
  - id: error-handling
    name: Errors
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/25-errors.md"
    match: [error-handling]
  - id: link-options
    name: Link options
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/30-link-options.md"
    match: [link-options]
  - id: load-functions
    name: Page data, layout data and universal vs server load
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/20-load.md"
    match: [load-functions]
  - id: load-fetch
    name: Using URL data, fetch, cookies and headers in load
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/20-load.md"
    match: [load-fetch]
  - id: load-parent-errors
    name: Parent data, errors, redirects, auth and getRequestEvent
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/20-load.md"
    match: [get-request-event]
  - id: load-streaming
    name: Streaming with promises
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/20-load.md"
    match: [streaming]
  - id: load-rerun
    name: Rerunning load functions
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/20-load.md"
    match: [dependency-tracking]
  - id: page-options-prerender
    name: prerender and entries page options
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/40-page-options.md"
    match: [prerender]
  - id: page-options-render
    name: ssr, csr, trailingSlash and config page options
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/40-page-options.md"
    match: [trailing-slash]
  - id: state-management
    name: State management
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/50-state-management.md"
    match: [state-management]
  - id: environment-variables
    name: Environment variables
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/70-environment-variables.md"
    match: [define-env-vars]
  - id: shallow-routing
    name: Page state and shallow routing
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/67-shallow-routing.md"
    match: [shallow-routing]
  - id: snapshots
    name: Snapshots
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/65-snapshots.md"
    match: [snapshots]
  - id: default-and-named-actions
    name: Default actions, Named actions, GET vs POST
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/30-form-actions.md"
    match: [form-actions-default-named]
  - id: action-data-validation-redirects
    name: Anatomy of an action, Validation errors, Redirects, Loading data
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/30-form-actions.md"
    match: [form-action-fail]
  - id: progressive-enhancement
    name: 'Progressive enhancement: use:enhance, Customising use:enhance'
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/30-form-actions.md"
    match: [use-enhance]
  - id: custom-event-listener
    name: Custom event listener, Alternatives
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/30-form-actions.md"
    match: [action-custom-fetch]
  - id: remote-functions-setup
    name: Remote functions overview, Handling validation errors, getRequestEvent, Redirects
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-functions-setup]
  - id: remote-query
    name: query
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-query]
  - id: remote-query-batch-live
    name: query.batch and query.live
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-query-batch-live]
  - id: remote-form-fields
    name: form and Fields
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-form-fields]
  - id: remote-form-validation
    name: Programmatic validation, Validation, Getting/setting inputs, Handling sensitive data
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-form-validation]
  - id: remote-form-enhance
    name: Returns and redirects, enhance, Multiple instances, Multiple submit buttons
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-form-enhance]
  - id: remote-command-single-flight
    name: command and Single-flight mutations
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-command-single-flight]
  - id: remote-prerender
    name: prerender
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/20-core-concepts/60-remote-functions.md"
    match: [remote-prerender]
  - id: building-your-app
    name: Building your app
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/10-building-your-app.md"
    match: [build-stages]
  - id: adapters
    name: Adapters and zero-config deployments
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/20-adapters.md"
    match: [adapter-auto]
  - id: adapter-node
    name: Node servers
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/40-adapter-node.md"
    match: [adapter-node]
  - id: adapter-bun
    name: Bun servers
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/45-adapter-bun.md"
    match: [adapter-bun]
  - id: adapter-static
    name: Static site generation
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/50-adapter-static.md"
    match: [adapter-static]
  - id: single-page-apps
    name: Single-page apps
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/55-single-page-apps.md"
    match: [single-page-app]
  - id: adapter-cloudflare
    name: Cloudflare
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/60-adapter-cloudflare.md"
    match: [adapter-cloudflare]
  - id: adapter-cloudflare-workers
    name: Cloudflare Workers
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/70-adapter-cloudflare-workers.md"
    match: [adapter-cloudflare-workers]
  - id: adapter-netlify
    name: Netlify
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/80-adapter-netlify.md"
    match: [adapter-netlify]
  - id: adapter-vercel
    name: Vercel
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/90-adapter-vercel.md"
    match: [adapter-vercel]
  - id: writing-adapters
    name: Writing adapters
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/25-build-and-deploy/99-writing-adapters.md"
    match: [writing-adapters]
  - id: hooks-handle
    name: 'Hooks: handle and locals'
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/20-hooks.md"
    match: [handle]
  - id: hooks-handlefetch
    name: 'Hooks: handleFetch'
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/20-hooks.md"
    match: [handlefetch]
  - id: hooks-handleerror
    name: 'Hooks: handleError'
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/20-hooks.md"
    match: [handleerror]
  - id: hooks-init-reroute-transport
    name: 'Hooks: init, reroute, transport'
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/20-hooks.md"
    match: [reroute, transport]
  - id: service-workers
    name: Service workers
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/40-service-workers.md"
    match: [service-workers]
  - id: server-only-modules
    name: Server-only modules
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/50-server-only-modules.md"
    match: [server-only-modules]
  - id: observability
    name: Observability
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/68-observability.md"
    match: [observability, opentelemetry]
  - id: packaging
    name: Packaging
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/30-advanced/70-packaging.md"
    match: [packaging]
  - id: auth
    name: Auth
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/40-best-practices/03-auth.md"
    match: [auth]
  - id: performance
    name: Performance
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/40-best-practices/05-performance.md"
    match: [performance]
  - id: icons
    name: Icons
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/40-best-practices/06-icons.md"
    match: [icons]
  - id: images
    name: Images
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/40-best-practices/07-images.md"
    match: [images]
  - id: accessibility
    name: Accessibility
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/40-best-practices/10-accessibility.md"
    match: [accessibility]
  - id: seo
    name: SEO
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/40-best-practices/20-seo.md"
    match: [seo]
  - id: migrating-to-sveltekit-2
    name: Migrating to SvelteKit v2
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/60-appendix/30-migrating-to-sveltekit-2.md"
    match: [migrate-v2]
  - id: migrating-to-sveltekit-3
    name: Migrating to SvelteKit v3
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/60-appendix/35-migrating-to-sveltekit-3.md"
    match: [migrate-v3]
  - id: migrating-from-sapper
    name: Migrating from Sapper
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/60-appendix/40-migrating.md"
    match: [migrate-sapper]
  - id: faq
    name: Frequently asked questions
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/60-appendix/10-faq.md"
    match: [faq]
  - id: types-and-tsconfig
    name: Types and $app/tsconfig
    source: "https://github.com/sveltejs/kit/blob/main/documentation/docs/98-reference/54-types.md"
    match: [tsconfig, generated-types]
