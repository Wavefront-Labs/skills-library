      - {id: destroy-planning, name: plan -destroy and reviewing a destroy plan, match: [plan-destroy, destroy-plan]}
      - {id: json-ui-output, name: -json machine-readable UI output for plan/apply, match: [json-ui, machine-readable-output, apply-json]}
      - {id: compact-warnings-no-color, name: -compact-warnings and -no-color for log-friendly output, match: [compact-warnings, no-color]}
      - {id: legacy-state-flags, name: "Legacy -state, -state-out and -backup local-backend flags", match: [state-out-flag, backup-flag, legacy-state-flags]}
