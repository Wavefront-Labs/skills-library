# Canonical coverage spec: Terraform / OpenTofu.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (HashiCorp exam objectives and the
# Terraform docs table of contents), not from what we happened to write.
# Subtopics (depth) come from the sub-headings of the developer.hashicorp.com/terraform language
# and CLI reference pages (function families, command flags, backend types, meta-arguments) and
# the OpenTofu docs.
subject: terraform
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [terraform]
sources:
  - "HashiCorp Certified: Terraform Associate (003) objectives: IaC concepts, Terraform purpose, basics, CLI outside core workflow, modules, core workflow, state, read/generate/modify configuration, HCP Terraform capabilities"
  - "HashiCorp Certified: Terraform Authoring & Operations Professional objectives: manage resource lifecycle, develop and troubleshoot dynamic configuration, develop collaborative Terraform workflows, create/maintain/use Terraform modules, configure and use Terraform providers, collaborate on infrastructure as code"
  - "developer.hashicorp.com/terraform/language table of contents: Files/syntax, Resources, Data Sources, Providers, Variables/Outputs, Modules, Functions, Expressions, State, Backends, Import, Checks/Tests, Stacks"
  - "developer.hashicorp.com/terraform/cli commands: init, plan, apply, destroy, fmt, validate, state, import, taint/untaint, workspace, console, providers, graph, refresh, force-unlock"
  - "developer.hashicorp.com/terraform/language/functions: string, collection, encoding, filesystem, numeric, date/time, hash/crypto, IP network, type conversion families"
  - "developer.hashicorp.com/terraform/language/backend: local, remote, s3, gcs, azurerm, kubernetes, pg, consul, http, oss, cos"
  - "developer.hashicorp.com/terraform/language/meta-arguments: depends_on, count, for_each, provider, lifecycle"
  - "OpenTofu docs: state encryption, provider-defined functions, early variable evaluation, provider for_each, -exclude"
