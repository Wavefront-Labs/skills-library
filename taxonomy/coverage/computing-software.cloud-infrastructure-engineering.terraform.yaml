      - {id: init-upgrade, name: init -upgrade semantics and when it changes the lock file, match: [init-upgrade, upgrade-flag]}
      - {id: init-reconfigure-migrate, name: init -reconfigure vs -migrate-state, match: [init-reconfigure, init-migrate-state]}
      - {id: partial-backend-config, name: init -backend-config partial backend configuration, match: [backend-config-flag, partial-backend-configuration, partial-backend-config]}
      - {id: init-from-module, name: init -from-module to bootstrap a root module, match: [init-from-module, from-module]}
