subject: Verdaccio
scope:
  category: computing-software
  field: devops-ci-cd
  products: [verdaccio]
sources:
  - "Verdaccio documentation, https://verdaccio.org/docs/"
topics:
  - id: apache
    name: apache reverse proxy
    source: "https://verdaccio.org/docs/reverse-proxy/"
    match: [apache, mod-proxy, allowencodedslashes]
  - id: audit
    name: npm audit middleware
    source: "https://verdaccio.org/docs/configuration/"
    match: [audit, npm-audit, middleware]
  - id: basic-login
    name: basic login and bearer tokens
    source: "https://verdaccio.org/docs/configuration/"
    match: [basic-login, bearer-token, http-basic]
  - id: caching
    name: caching strategies
    source: "https://verdaccio.org/docs/caching/"
    match: [caching, ci-cache, maxage]
  - id: cli-flags-and-config-location
    name: cli flags and config location
    source: "https://verdaccio.org/docs/cli/"
    match: [cli, config-path, listen-flag]
  - id: config-builder
    name: config builder api
    source: "https://verdaccio.org/docs/configuration/"
    match: [config-builder, programmatic-config, configbuilder]
  - id: cors
    name: cors settings
    source: "https://verdaccio.org/docs/configuration/"
    match: [cors, access-control, preflight]
  - id: default-configuration
    name: default configuration
    source: "https://verdaccio.org/docs/configuration/"
    match: [default-config, config-yaml, packages-section]
  - id: docker
    name: docker run and tags
    source: "https://verdaccio.org/docs/docker/"
    match: [docker, docker-image, tags]
  - id: docker-plugins
    name: docker plugins and compose
    source: "https://verdaccio.org/docs/docker/"
    match: [docker-plugins, docker-compose, multi-stage]
  - id: docker-runtime
    name: docker runtime settings
    source: "https://verdaccio.org/docs/docker/"
    match: [docker-env, healthcheck, docker-port]
  - id: docker-storage
    name: docker volumes and permissions
    source: "https://verdaccio.org/docs/docker/"
    match: [docker-volume, bind-mount, uid-10001]
  - id: e2e
    name: end to end testing registry
    source: "https://verdaccio.org/docs/e2e/"
    match: [e2e-testing, throwaway-registry, ci-registry]
  - id: env
    name: environment variables
    source: "https://verdaccio.org/docs/env/"
    match: [environment-variables, verdaccio-public-url, forwarded-proto]
  - id: feature-flags
    name: feature flags
    source: "https://verdaccio.org/docs/configuration/"
    match: [feature-flags, experiments, flags]
  - id: groups
    name: access groups
    source: "https://verdaccio.org/docs/packages/"
    match: [groups, authenticated, anonymous]
  - id: helm
    name: helm chart deployment
    source: "https://verdaccio.org/docs/kubernetes/"
    match: [helm, kubernetes, chart]
  - id: helm-config
    name: helm custom configuration
    source: "https://verdaccio.org/docs/kubernetes/"
    match: [configmap, secretenvvars, helm-values]
  - id: htpasswd
    name: htpasswd authentication
    source: "https://verdaccio.org/docs/authentication/"
    match: [htpasswd, bcrypt, max-users]
  - id: https
    name: https certificates
    source: "https://verdaccio.org/docs/ssl/"
    match: [https, ssl-certificate, pfx]
  - id: installation-and-first-run
    name: installation and first run
    source: "https://verdaccio.org/docs/installation/"
    match: [install, npm-install, first-run]
  - id: jwt-token-signature
    name: jwt token signature and expiry
    source: "https://verdaccio.org/docs/configuration/"
    match: [jwt, token-expiry, security-api]
  - id: legacy-token-signature
    name: legacy token signature
    source: "https://verdaccio.org/docs/env/"
    match: [legacy-token, aes-256-ctr, token-encryption]
  - id: listen
    name: listen addresses
    source: "https://verdaccio.org/docs/configuration/"
    match: [listen, unix-socket, ipv6]
  - id: lockdown
    name: locking down a registry
    source: "https://verdaccio.org/docs/best/"
    match: [lockdown, anonymous-publish, authenticated-access]
  - id: logging
    name: logger and log rotation
    source: "https://verdaccio.org/docs/logger/"
    match: [logger, log-level, logrotate]
  - id: multi-uplink
    name: multiple uplinks and offline registry
    source: "https://verdaccio.org/docs/linking-remote-registry/"
    match: [multiple-uplinks, failover, offline-registry]
  - id: nginx
    name: nginx reverse proxy
    source: "https://verdaccio.org/docs/reverse-proxy/"
    match: [nginx, reverse-proxy, client-max-body-size]
  - id: notifications
    name: webhook notifications
    source: "https://verdaccio.org/docs/notifications/"
    match: [notify, webhook, handlebars]
  - id: npm-client
    name: npm client setup
    source: "https://verdaccio.org/docs/setup-npm/"
    match: [npm, npmrc, npm-login]
  - id: outbound-proxy
    name: outbound http proxy
    source: "https://verdaccio.org/docs/configuration/"
    match: [http-proxy, https-proxy, no-proxy]
  - id: package-access
    name: package patterns and blocking
    source: "https://verdaccio.org/docs/packages/"
    match: [packages, glob-patterns, pattern-order]
  - id: package-filter
    name: package filtering and quarantine
    source: "https://verdaccio.org/docs/configuration/"
    match: [package-filter, quarantine, min-age-days]
  - id: password-policy
    name: password validation policy
    source: "https://verdaccio.org/docs/configuration/"
    match: [password-policy, password-regex, validation]
  - id: plugins
    name: plugin types and naming
    source: "https://verdaccio.org/docs/plugins/"
    match: [plugins, plugin-prefix, auth-plugin]
  - id: pnpm-bun
    name: pnpm and bun clients
    source: "https://verdaccio.org/docs/setup-pnpm/"
    match: [pnpm, bun, bunfig]
  - id: publish-options
    name: publish options
    source: "https://verdaccio.org/docs/configuration/"
    match: [allow-offline, check-owners, keep-readmes]
  - id: rate-limit
    name: user rate limit
    source: "https://verdaccio.org/docs/best/"
    match: [rate-limit, user-rate-limit, brute-force]
  - id: release-age
    name: release age gate
    source: "https://verdaccio.org/docs/cli-registry/"
    match: [release-age, minimum-release-age, supply-chain]
  - id: routing
    name: private versus public routing
    source: "https://verdaccio.org/docs/best/"
    match: [proxy-routing, private-packages, dependency-confusion]
  - id: scoped
    name: scoped registry routing
    source: "https://verdaccio.org/docs/cli-registry/"
    match: [scoped-registry, publishconfig, registry-routing]
  - id: server-tuning
    name: server tuning and hidden logs
    source: "https://verdaccio.org/docs/configuration/"
    match: [server-settings, keepalive, max-body-size]
  - id: staged-publishing
    name: staged publishing
    source: "https://verdaccio.org/docs/staged-publishing/"
    match: [staged-publishing, npm-stage, four-eyes]
  - id: storage-and-secret
    name: storage and verdaccio-db secret
    source: "https://verdaccio.org/docs/configuration/"
    match: [storage, verdaccio-db, secret]
  - id: systemd
    name: systemd and service user
    source: "https://verdaccio.org/docs/server-configuration/"
    match: [systemd, system-user, linux-service]
  - id: team-access
    name: team access and unpublish
    source: "https://verdaccio.org/docs/protect-your-dependencies/"
    match: [team-access, unpublish, group-permissions]
  - id: trust-proxy
    name: trust proxy and client ip
    source: "https://verdaccio.org/docs/configuration/"
    match: [trust-proxy, x-forwarded-for, client-ip]
  - id: two-factor
    name: two-factor authentication
    source: "https://verdaccio.org/docs/two-factor-authentication/"
    match: [two-factor, totp, otp]
  - id: uplink-auth
    name: uplink authentication
    source: "https://verdaccio.org/docs/uplinks/"
    match: [uplink-auth, token-env, private-registry]
  - id: uplink-tarball
    name: uplink tarball 404 recovery
    source: "https://verdaccio.org/docs/uplinks/"
    match: [tarball-404, distfiles, cdn-registry]
  - id: uplinks
    name: uplink definitions and timeouts
    source: "https://verdaccio.org/docs/uplinks/"
    match: [uplinks, uplink-timeout, fail-timeout]
  - id: url-prefix
    name: url prefix and public url
    source: "https://verdaccio.org/docs/configuration/"
    match: [url-prefix, public-url, subpath]
  - id: web-login
    name: browser based login
    source: "https://verdaccio.org/docs/web-login/"
    match: [web-login, browser-login, weblogin-flag]
  - id: web-user
    name: web registration and password change
    source: "https://verdaccio.org/docs/user-registration/"
    match: [user-registration, change-password, createuser-flag]
  - id: webui-brand
    name: web ui branding
    source: "https://verdaccio.org/docs/webui/"
    match: [web-ui, branding, dark-mode]
  - id: webui-toggle
    name: web ui toggles and content
    source: "https://verdaccio.org/docs/webui/"
    match: [web-ui-options, footer, search]
  - id: windows
    name: windows service
    source: "https://verdaccio.org/docs/windows/"
    match: [windows-service, nssm, winsw]
  - id: yarn
    name: yarn client setup
    source: "https://verdaccio.org/docs/setup-yarn/"
    match: [yarn, yarnrc, yarn-plugin]
