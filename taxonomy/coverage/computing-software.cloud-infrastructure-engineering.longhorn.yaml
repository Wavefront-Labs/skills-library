# Coverage spec: longhorn. Topics from the official docs 1.13.0 sections in sources.
subject: longhorn
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [longhorn]
sources:
  - "https://longhorn.io/docs/1.13.0/"
topics:
  - id: architecture-and-components
    name: "Architecture and components"
    source: "https://longhorn.io/docs/1.13.0/concepts/"
    match: [architecture, instance-manager, engine]
  - id: install-with-helm
    name: "Install with Helm"
    source: "https://longhorn.io/docs/1.13.0/deploy/install/install-with-helm/"
    match: [helm, install, longhorn-system]
  - id: install-with-kubectl
    name: "Install with kubectl"
    source: "https://longhorn.io/docs/1.13.0/deploy/install/install-with-kubectl/"
    match: [kubectl, install, manifest]
  - id: best-practices
    name: "Best practices"
    source: "https://longhorn.io/docs/1.13.0/best-practices/"
    match: [best-practices, hardware, kernel]
  - id: rwx-volumes
    name: "RWX volumes"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/volumes/rwx-volumes/"
    match: [rwx, nfs, share-manager]
  - id: volume-expansion
    name: "Volume expansion"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/volumes/expansion/"
    match: [expansion, resize, pvc]
  - id: trim-filesystem
    name: "Trim filesystem"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/volumes/trim-filesystem/"
    match: [trim, fstrim, unmap]
  - id: storage-class-parameters
    name: "StorageClass parameters"
    source: "https://longhorn.io/docs/1.13.0/references/storage-class-parameters/"
    match: [storageclass, parameters, replicas]
  - id: data-locality
    name: "Data locality"
    source: "https://longhorn.io/docs/1.13.0/high-availability/data-locality/"
    match: [data-locality, best-effort, strict-local]
  - id: auto-balance-replicas
    name: "Auto balance replicas"
    source: "https://longhorn.io/docs/1.13.0/high-availability/auto-balance-replicas/"
    match: [auto-balance, replicas, least-effort]
  - id: node-failure-handling
    name: "Node failure handling"
    source: "https://longhorn.io/docs/1.13.0/high-availability/node-failure/"
    match: [node-failure, pod-deletion-policy, statefulset]
  - id: volume-auto-salvage
    name: "Volume auto salvage"
    source: "https://longhorn.io/docs/1.13.0/high-availability/recover-volume/"
    match: [salvage, recovery, faulty-replicas]
  - id: snapshots
    name: "Snapshots"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/setup-a-snapshot/"
    match: [snapshots, snapshot-crd, volume-head]
  - id: snapshot-space-management
    name: "Snapshot space management"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/snapshot-space-management/"
    match: [snapshot-limits, snapshot-max-count, toomanysnapshots]
  - id: recurring-jobs
    name: "Recurring jobs"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/scheduling-backups-and-snapshots/"
    match: [recurring-job, cron, retain]
  - id: backup-target-setup
    name: "Backup target setup"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/backup-and-restore/set-backup-target/"
    match: [backup-target, s3, nfs]
  - id: create-backup
    name: "Create a backup"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/backup-and-restore/create-a-backup/"
    match: [backup, incremental, backup-crd]
  - id: restore-from-backup
    name: "Restore from a backup"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/backup-and-restore/restore-from-a-backup/"
    match: [restore, from-backup, volume-cr]
  - id: disaster-recovery-volumes
    name: "Disaster recovery volumes"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/setup-disaster-recovery-volumes/"
    match: [disaster-recovery, dr-volume, standby]
  - id: csi-volume-clone
    name: "CSI volume clone"
    source: "https://longhorn.io/docs/1.13.0/snapshots-and-backups/csi-volume-clone/"
    match: [clone, csi, datasource]
  - id: prometheus-grafana-monitoring
    name: "Prometheus and Grafana monitoring"
    source: "https://longhorn.io/docs/1.13.0/monitoring/prometheus-and-grafana-setup/"
    match: [prometheus, grafana, servicemonitor]
  - id: taint-toleration
    name: "Taint and toleration"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/deploy/taint-toleration/"
    match: [taints, tolerations, taint-toleration]
  - id: node-selector
    name: "Node selector"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/deploy/node-selector/"
    match: [node-selector, system-managed-components, helm]
  - id: priority-class
    name: "Priority class"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/deploy/priority-class/"
    match: [priority-class, longhorn-critical, setting]
  - id: storage-network
    name: "Storage network"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/deploy/storage-network/"
    match: [storage-network, multus, network-attachment-definition]
  - id: customizing-default-settings
    name: "Customizing default settings"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/deploy/customizing-default-settings/"
    match: [default-settings, configmap, helm-values]
  - id: volume-encryption
    name: "Volume encryption"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/security/volume-encryption/"
    match: [encryption, luks, cryptsetup]
  - id: orphaned-data-cleanup
    name: "Orphaned data cleanup"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/data-cleanup/orphaned-data-cleanup/"
    match: [orphans, orphaned-data, replica-data]
  - id: fast-replica-rebuild
    name: "Fast replica rebuild"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/rebuilding/fast-replica-rebuilding/"
    match: [fast-replica-rebuild, rebuild, checksum]
  - id: install-longhornctl
    name: "Install longhornctl"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/longhornctl/install-longhornctl/"
    match: [longhornctl, cli, install]
  - id: upgrade-longhorn
    name: "Upgrade Longhorn"
    source: "https://longhorn.io/docs/1.13.0/deploy/upgrade/longhorn-manager/"
    match: [upgrade, helm-upgrade, rollback]
  - id: upgrade-engine
    name: "Upgrade engine"
    source: "https://longhorn.io/docs/1.13.0/deploy/upgrade/upgrade-engine/"
    match: [engine-upgrade, live-upgrade, offline-upgrade]
  - id: uninstall-longhorn
    name: "Uninstall Longhorn"
    source: "https://longhorn.io/docs/1.13.0/deploy/uninstall/"
    match: [uninstall, deleting-confirmation-flag, helm-uninstall]
  - id: replica-scheduling
    name: "Replica scheduling"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/nodes/scheduling/"
    match: [scheduling, anti-affinity, over-provisioning]
  - id: multi-disk-support
    name: "Multiple disk support"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/nodes/multidisk/"
    match: [multidisk, disks, block-disk]
  - id: storage-tags
    name: "Storage tags"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/nodes/storage-tags/"
    match: [storage-tags, node-tags, disk-tags]
  - id: disk-node-eviction
    name: "Disk and node eviction"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/nodes/disks-or-nodes-eviction/"
    match: [eviction, eviction-requested, scheduling-disabled]
  - id: node-space-usage
    name: "Node space usage"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/nodes/node-space-usage/"
    match: [space-usage, allocable, over-provisioning]
  - id: backing-images
    name: "Backing images"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/backing-image/backing-image/"
    match: [backing-image, source-type, checksum]
  - id: snapshot-data-integrity
    name: "Snapshot data integrity check"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/data-integrity/snapshot-data-integrity-check/"
    match: [data-integrity, snapshot-data-integrity, fast-check]
  - id: airgap-install
    name: "Air-gapped installation"
    source: "https://longhorn.io/docs/1.13.0/deploy/install/airgap/"
    match: [airgap, private-registry, images]
  - id: system-backup
    name: "System backup"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/system-backup-restore/backup-longhorn-system/"
    match: [system-backup, systembackup, volume-backup-policy]
  - id: system-restore
    name: "System restore"
    source: "https://longhorn.io/docs/1.13.0/advanced-resources/system-backup-restore/restore-longhorn-system/"
    match: [system-restore, systemrestore, rollout]
  - id: support-bundle
    name: "Support bundle"
    source: "https://longhorn.io/docs/1.13.0/troubleshoot/support-bundle/"
    match: [support-bundle, troubleshooting, logs]
  - id: create-volumes
    name: "Create volumes"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/volumes/create-volumes/"
    match: [create-volumes, storageclass, v2-volumes]
  - id: delete-volumes
    name: "Delete volumes"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/volumes/delete-volumes/"
    match: [delete-volumes, reclaim-policy, pvc]
  - id: node-maintenance-and-drain
    name: "Node maintenance and drain"
    source: "https://longhorn.io/docs/1.13.0/maintenance/maintenance/"
    match: [maintenance, drain, node-drain-policy]
  - id: volume-size-and-thin-provisioning
    name: "Volume size and thin provisioning"
    source: "https://longhorn.io/docs/1.13.0/nodes-and-volumes/volumes/volume-size/"
    match: [volume-size, actual-size, thin-provisioning]
