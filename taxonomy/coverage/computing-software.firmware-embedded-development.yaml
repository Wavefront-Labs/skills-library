# Canonical coverage spec: Firmware / embedded development (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (official docs tables of contents, the
# ARMv7-M/ARMv8-M Architecture Reference Manuals, MISRA C and the Barr Embedded C standard, the
# Yocto and Linux kernel driver-api manuals), not from what we happened to write.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (docs page
# sub-headings, API group lists, manual chapter sections, CLI sub-commands).
# Match keywords are unique across the field: every product is in one scope, so a shared keyword
# would let one skill cover two unrelated subtopics.
subject: firmware-embedded-development
scope:
  category: computing-software
  field: firmware-embedded-development
  products: [arduino, esp-idf, stm32, platformio, freertos, zephyr, bare-metal-programming, device-driver-development, bootloader-development, hardware-debugging, low-power-design]
sources:
  - "Zephyr Project documentation ToC (docs.zephyrproject.org) - Getting Started, Developing with Zephyr (west, build system/CMake, sysbuild, snippets, Kconfig, devicetree, application development, testing with Twister/ztest), Kernel services (threads, scheduling, interrupts, synchronization, data passing, timers, memory), Device driver model, OS services (logging, shell, settings, storage NVS/ZMS/flash map/file systems, DFU/MCUmgr, networking, Bluetooth, power management, userspace/memory protection), Hardware support (board porting, hardware model v2, pinctrl)"
  - "FreeRTOS kernel documentation (freertos.org/Documentation) - Tasks and co-routines, Queues/queue sets, Semaphores and mutexes, Direct-to-task notifications, Stream and message buffers, Event groups, Software timers, Interrupt management, Memory management (heap_1..5, static allocation), Low power/tickless idle, Customisation (FreeRTOSConfig.h), Debugging (stack overflow, configASSERT, run-time stats, trace hooks), SMP and MPU, FreeRTOS-Plus libraries; Mastering the FreeRTOS Real Time Kernel (Barry) chapter sub-sections"
  - "ESP-IDF Programming Guide ToC (docs.espressif.com/projects/esp-idf) - API Guides (build system, partition tables, sleep modes, deep-sleep stub, ULP, OTA/bootloader, core dump, fatal errors, JTAG debugging, app trace, Wi-Fi/BLE coexistence), API Reference (Wi-Fi, ESP-NOW, NimBLE, provisioning, peripherals GPIO/LEDC/RMT/I2C/ADC, storage NVS/VFS/FAT/SPIFFS, system logging/heap/watchdogs/event loop/power management, protocols HTTP/MQTT/SNTP/mDNS), Security (flash encryption, secure boot v2, eFuse, NVS encryption), Tools (idf.py, IDF monitor, esptool, component manager)"
  - "STM32Cube documentation - UM1718 STM32CubeMX user manual, UM2609 STM32CubeIDE, UM2237 STM32CubeProgrammer, HAL/LL driver user manuals (e.g. UM1725/UM1884), STM32 reference manual chapters (RCC, PWR, GPIO, EXTI, DMA/DMAMUX, ADC, TIM, RTC, IWDG/WWDG, USART, I2C, SPI, FLASH option bytes), AN2606 system bootloader, AN4013 timer cookbook, AN2834 ADC accuracy, AN4776 general-purpose timer cookbook"
  - "ARMv7-M and ARMv8-M Architecture Reference Manuals and Cortex-M Generic User Guides - exception model and NVIC, SysTick, System Control Block, fault status registers, MPU, FPU and lazy stacking, memory barriers and exclusive access, power management WFI/WFE/SLEEPDEEP, debug (DWT, ITM, ETM, FPB), Cortex-M7 caches/TCM, ARMv8-M Security Extension (SAU, NSC, CMSE); CMSIS-Core documentation"
  - "Arduino documentation (docs.arduino.cc) - Language reference, Arduino CLI reference (compile/upload/core/lib, sketch project files), Library specification (library.properties, keywords.txt, Library Manager), Arduino platform specification (boards.txt, platform.txt, programmers.txt, variants), Built-in libraries (Wire, SPI, Servo, EEPROM, SoftwareSerial)"
  - "PlatformIO documentation ToC (docs.platformio.org) - Project configuration platformio.ini (sections, options, extends, extra_configs), Library Management (lib_deps, LDF, library.json, publishing), Unit Testing (test runner, native/embedded, frameworks), Debugging (debug options, SVD, tools), Advanced scripting (extra_scripts, middlewares, custom targets), Custom boards/platforms, Static code analysis (pio check), Remote development, CI integration"
  - "MISRA C:2012 (with Amendments) guideline categories (directives, rules, essential type model, deviation records) and the Barr Group Embedded C Coding Standard (BARR-C:2018); SEI CERT C"
  - "Yocto Project Mega-Manual (docs.yoctoproject.org) - Board Support Package developer guide, Linux kernel development manual (out-of-tree modules, kernel bbappend, config fragments), devtool reference, SDK manual; Linux kernel driver-api documentation (driver model, platform devices, devres, regmap, IIO, GPIO, I2C/SPI client drivers, threaded IRQs)"
  - "MCUboot design docs and imgtool reference, U-Boot documentation (environment, FIT, SPL, verified boot), Trusted Firmware-M docs, OpenOCD user guide, GDB manual, SEGGER J-Link/RTT/SystemView docs, sigrok documentation, Tektronix ABCs of Probes, Nordic and ST low-power application notes (AN4365, AN4621)"
