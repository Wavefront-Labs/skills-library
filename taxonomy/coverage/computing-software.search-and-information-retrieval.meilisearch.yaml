# Coverage spec: meilisearch. Topics from the external structures named in `sources`.
subject: meilisearch
scope:
  category: computing-software
  field: search-and-information-retrieval
  products: [meilisearch]
sources:
  - "Meilisearch documentation (www.meilisearch.com/docs) - sidebar sections: full-text search, filtering sorting and faceting, geo search, hybrid search, multi-search, indexing, tasks and batches, security, self-hosting"
topics:
  - id: add-and-update-documents
    name: add and update documents
    source: "https://www.meilisearch.com/docs/capabilities/indexing/how_to/add_and_update_documents"
    match: [add-documents, partial-update, skip-creation]
  - id: ai-search-getting-started
    name: ai search getting started
    source: "https://www.meilisearch.com/docs/capabilities/hybrid_search/getting_started"
    match: [hybrid-search, embedders, document-template]
  - id: basic-search
    name: basic search
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/getting_started/basic_search"
    match: [basic-search, search-response, estimated-total-hits]
  - id: binary-quantization
    name: binary quantization
    source: "https://www.meilisearch.com/docs/capabilities/hybrid_search/advanced/binary_quantization"
    match: [binary-quantization, vector-compression, binary-quantized]
  - id: build-disjunctive-facets
    name: build disjunctive facets
    source: "https://www.meilisearch.com/docs/capabilities/filtering_sorting_faceting/advanced/disjunctive_facets"
    match: [disjunctive-facets, faceted-navigation, multi-search-facets]
  - id: built-in-ranking-rules
    name: built in ranking rules
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/relevancy/ranking_rules"
    match: [ranking-rules, bucket-sort, attribute-rank]
  - id: compact-an-index
    name: compact an index
    source: "https://www.meilisearch.com/docs/capabilities/indexing/how_to/compact_an_index"
    match: [index-compaction, fragmentation, index-size]
  - id: configure-dictionary
    name: configure dictionary
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/configure_dictionary"
    match: [dictionary, custom-tokens, tokenizer]
  - id: configure-distinct-attribute
    name: configure distinct attribute
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/configure_distinct_attribute"
    match: [distinct-attribute, deduplicate-results, product-variants]
  - id: configure-openai-embedder
    name: configure openai embedder
    source: "https://www.meilisearch.com/docs/capabilities/hybrid_search/how_to/configure_openai_embedder"
    match: [openai-embedder, text-embedding-3, embedder-dimensions]
  - id: configure-prefix-search
    name: configure prefix search
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/configure_prefix_search"
    match: [prefix-search, search-as-you-type, indexing-time]
  - id: configure-search-cutoff
    name: configure search cutoff
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/configure_search_cutoff"
    match: [search-cutoff, search-cutoff-ms, response-time]
  - id: configure-searchable-attributes
    name: configure searchable attributes
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/configure_searchable_attributes"
    match: [searchable-attributes, attributes-to-search-on, attribute-ranking]
  - id: configure-stop-words
    name: configure stop words
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/configure_stop_words"
    match: [stop-words, common-terms, language-indexes]
  - id: configure-synonyms
    name: configure synonyms
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/relevancy/synonyms"
    match: [synonyms, one-way-synonyms, multi-word-synonyms]
  - id: create-your-first-search-rule
    name: create your first search rule
    source: "https://www.meilisearch.com/docs/capabilities/search_rules/create_your_first_rule"
    match: [search-rules, pin-document, dynamic-search-rules]
  - id: custom-ranking-rules
    name: custom ranking rules
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/relevancy/custom_ranking_rules"
    match: [custom-ranking-rules, asc-desc, business-ranking]
  - id: delete-documents-at-scale
    name: delete documents at scale
    source: "https://www.meilisearch.com/docs/capabilities/indexing/how_to/delete_documents_at_scale"
    match: [delete-by-filter, delete-batch, document-lifecycle]
  - id: design-primary-keys
    name: design primary keys
    source: "https://www.meilisearch.com/docs/capabilities/indexing/how_to/design_primary_keys"
    match: [primary-key, document-id, index-creation]
  - id: enable-http2-with-ssl
    name: enable http2 with ssl
    source: "https://www.meilisearch.com/docs/resources/self_hosting/security/http2_ssl"
    match: [http2, ssl-certificate, ssl-cert-path]
  - id: export-and-import-dumps
    name: export and import dumps
    source: "https://www.meilisearch.com/docs/resources/self_hosting/data_backup/dumps"
    match: [dumps, import-dump, version-migration]
  - id: export-and-use-snapshots
    name: export and use snapshots
    source: "https://www.meilisearch.com/docs/resources/self_hosting/data_backup/snapshots"
    match: [snapshots, schedule-snapshot, import-snapshot]
  - id: facet-search
    name: facet search
    source: "https://www.meilisearch.com/docs/capabilities/filtering_sorting_faceting/how_to/facet_search"
    match: [facet-search, facet-query, exhaustive-facet-count]
  - id: federated-search
    name: federated search
    source: "https://www.meilisearch.com/docs/capabilities/multi_search/getting_started/federated_search"
    match: [federated-search, multi-search, federation-weight]
  - id: filter-by-geo-bounding-box
    name: filter by geo bounding box
    source: "https://www.meilisearch.com/docs/capabilities/geo_search/how_to/filter_by_geo_bounding_box"
    match: [geo-bounding-box, map-viewport, geo-filter]
  - id: filter-by-geo-polygon
    name: filter by geo polygon
    source: "https://www.meilisearch.com/docs/capabilities/geo_search/how_to/filter_by_geo_polygon"
    match: [geo-polygon, delivery-zones, geo-filter]
  - id: filter-by-geo-radius
    name: filter by geo radius
    source: "https://www.meilisearch.com/docs/capabilities/geo_search/how_to/filter_by_geo_radius"
    match: [geo-radius, geo-filter, geo-distance]
  - id: filter-expression-syntax
    name: filter expression syntax
    source: "https://www.meilisearch.com/docs/capabilities/filtering_sorting_faceting/advanced/filter_expression_syntax"
    match: [filter-expression, filterable-attributes, filter-operators]
  - id: filter-tasks
    name: filter tasks
    source: "https://www.meilisearch.com/docs/capabilities/indexing/tasks_and_batches/filter_tasks"
    match: [filter-tasks, task-filters, batches-route]
  - id: handle-multilingual-data
    name: handle multilingual data
    source: "https://www.meilisearch.com/docs/capabilities/indexing/how_to/handle_multilingual_data"
    match: [multilingual, localized-attributes, query-locales]
  - id: manage-api-keys
    name: manage api keys
    source: "https://www.meilisearch.com/docs/capabilities/security/how_to/manage_api_keys"
    match: [api-keys, key-actions, key-rotation]
  - id: multiple-embedders
    name: multiple embedders
    source: "https://www.meilisearch.com/docs/capabilities/hybrid_search/advanced/multiple_embedders"
    match: [multiple-embedders, hybrid-embedder-selection, image-embedder]
  - id: paginate-search-results
    name: paginate search results
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/paginate_search_results"
    match: [pagination, hits-per-page, max-total-hits]
  - id: phrase-search
    name: phrase search
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/getting_started/phrase_search"
    match: [phrase-search, double-quotes, exact-phrase]
  - id: placeholder-search
    name: placeholder search
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/getting_started/placeholder_search"
    match: [placeholder-search, empty-query, browse-results]
  - id: ranking-score-and-details
    name: ranking score and details
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/relevancy/ranking_score"
    match: [ranking-score, show-ranking-score, relevancy-debugging]
  - id: running-in-production
    name: running in production
    source: "https://www.meilisearch.com/docs/resources/self_hosting/deployment/running_production"
    match: [production-deployment, systemd-service, reverse-proxy]
  - id: search-snippets-highlight-and-crop
    name: search snippets highlight and crop
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/getting_started/search_with_snippets"
    match: [search-snippets, attributes-to-crop, crop-length]
  - id: sort-by-geo-point
    name: sort by geo point
    source: "https://www.meilisearch.com/docs/capabilities/geo_search/how_to/sort_by_geo_point"
    match: [geo-point-sort, nearest-first, geo-distance]
  - id: sort-search-results
    name: sort search results
    source: "https://www.meilisearch.com/docs/capabilities/filtering_sorting_faceting/how_to/sort_results"
    match: [sortable-attributes, sort-parameter, sort-ranking-rule]
  - id: tasks-and-async-operations
    name: tasks and async operations
    source: "https://www.meilisearch.com/docs/capabilities/indexing/tasks_and_batches/async_operations"
    match: [tasks, task-queue, auto-batching]
  - id: tenant-token-payload
    name: tenant token payload
    source: "https://www.meilisearch.com/docs/capabilities/security/advanced/tenant_token_payload"
    match: [tenant-tokens, search-rules, multi-tenancy]
  - id: typo-tolerance-settings
    name: typo tolerance settings
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/relevancy/typo_tolerance_settings"
    match: [typo-tolerance, min-word-size-for-typos, disable-on-words]
  - id: use-geojson-format
    name: use geojson format
    source: "https://www.meilisearch.com/docs/capabilities/geo_search/how_to/use_geojson_format"
    match: [geojson, multipolygon, geo-shapes]
  - id: use-matching-strategy
    name: use matching strategy
    source: "https://www.meilisearch.com/docs/capabilities/full_text_search/how_to/use_matching_strategy"
    match: [matching-strategy, last-all-frequency, query-terms]
