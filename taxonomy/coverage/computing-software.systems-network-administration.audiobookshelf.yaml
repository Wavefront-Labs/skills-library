# Coverage spec: audiobookshelf. Topics from the Audiobookshelf docs.
subject: audiobookshelf
scope:
  category: computing-software
  field: systems-network-administration
  products: [audiobookshelf]
sources:
  - "Audiobookshelf docs (github.com/audiobookshelf/audiobookshelf-docs, www.audiobookshelf.org/docs)"
topics:
  # --- Docker and container deployment ---
  - id: docker-compose-and-run
    name: "Docker Compose and docker run deployment"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/2.docker-compose-install.md"
    match: [docker, docker-compose, volumes]
  - id: image-tags-and-upgrades
    name: "Image tags, upgrades and caching-manager fixes"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/2.docker-compose-install.md"
    match: [image-tags, upgrade, portainer]
  - id: config-on-local-disk
    name: "Keeping /config on local disk"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/2.docker-compose-install.md"
    match: [sqlite, config, network-mount]
  - id: container-user-and-healthcheck
    name: "Container user and healthchecks"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/2.docker-compose-install.md"
    match: [user, healthcheck]
  - id: podman-quadlet
    name: "Podman Quadlet and SELinux"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/7.podman.md"
    match: [podman, quadlet, selinux]
  # --- Native package installs ---
  - id: debian-package
    name: "Debian apt package"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/linux/3.linux-install-deb.md"
    match: [debian, apt]
  - id: rhel-package
    name: "RHEL and CentOS package"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/linux/4.linux-install-rpm.md"
    match: [rhel, dnf]
  - id: nixos-module
    name: "NixOS install and module"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/linux/5.linux-install-nix.md"
    match: [nixos]
  - id: windows-install
    name: "Windows installer and tray app"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/6.windows-install.md"
    match: [windows]
  - id: install-method-backup-limits
    name: "Install-method backup compatibility"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/6.windows-install.md"
    match: [backup-compatibility]
  # --- Environment configuration ---
  - id: env-paths-and-binaries
    name: "Filesystem and ffmpeg path variables"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/11.env-configuration.md"
    match: [config-path, ffmpeg]
  - id: env-network
    name: "HOST, PORT and proxy support variables"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/11.env-configuration.md"
    match: [host, port]
  - id: env-tokens
    name: "JWT secret and token expiry variables"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/11.env-configuration.md"
    match: [jwt, tokens]
  - id: env-ssrf
    name: "SSRF filter variables"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/11.env-configuration.md"
    match: [ssrf]
  - id: env-other-tuning
    name: "Podcast, query logging and SQLite pragma variables"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/11.env-configuration.md"
    match: [sqlite, podcasts]
  # --- Reverse proxies ---
  - id: proxy-nginx
    name: "NGINX"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/reverse-proxy/1.nginx-proxy-setup.md"
    match: [nginx, websocket]
  - id: proxy-npm
    name: "Nginx Proxy Manager"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/reverse-proxy/2.nginx-proxy-manager-setup.md"
    match: [nginx-proxy-manager]
  - id: proxy-apache
    name: "Apache and ACME challenge"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/reverse-proxy/3.apache-proxy-setup.md"
    match: [apache, acme]
  - id: proxy-swag-caddy
    name: "SWAG and Caddy"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/reverse-proxy/7.caddy-proxy-setup.md"
    match: [swag, caddy]
  - id: proxy-synology
    name: "Synology reverse proxy"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/reverse-proxy/5.synology-proxy-setup.md"
    match: [synology]
  - id: proxy-traefik
    name: "Traefik CORS warning"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/reverse-proxy/6.traefik.md"
    match: [traefik, cors]
  - id: proxy-haproxy
    name: "HAProxy and pfSense health checks"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/install/reverse-proxy/8.ha-proxy-setup.md"
    match: [haproxy, pfsense]
  - id: remote-access
    name: "Remote access via VPN or proxy"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/faq/server.md"
    match: [remote-access, vpn]
  # --- Server management ---
  - id: api-keys
    name: "API keys"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/api-keys.md"
    match: [api-keys, bearer]
  - id: backups
    name: "Backups and restore"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/backups.md"
    match: [backups, restore]
  - id: migration
    name: "Migrating OS or paths"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/migration-os.md"
    match: [migration, paths]
  - id: cors
    name: "CORS allowed origins and mixed content"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/cors.md"
    match: [cors]
  - id: listening-sessions
    name: "Listening sessions"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/listening-sessions.md"
    match: [sessions, stats]
  - id: notifications
    name: "Apprise notifications"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/notifications.md"
    match: [apprise, notifications]
  - id: oidc
    name: "OIDC single sign-on"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/oidc-authentication.md"
    match: [oidc, sso]
  - id: logs
    name: "Server logs"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/server-logs.md"
    match: [logs]
  - id: cache
    name: "File and API cache"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/server-settings.md"
    match: [cache]
  - id: uploading
    name: "Web upload"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/uploading.md"
    match: [upload]
  - id: users
    name: "Users, roles and access control"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/server-management/user-management.md"
    match: [users, tags]
  - id: root-password-reset
    name: "Password and root reset"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/faq/server.md"
    match: [password, sqlite]
  # --- Book libraries and metadata ---
  - id: book-folder-layout
    name: "Book folder layout and grouping"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/1.book-directory-structure.md"
    match: [folders, grouping]
  - id: folder-naming
    name: "Author and book folder naming"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/1.book-directory-structure.md"
    match: [naming, series]
  - id: tag-mapping-and-tracks
    name: "ID3 tag mapping and track order"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/1.book-directory-structure.md"
    match: [id3, tracks]
  - id: metadata-priority
    name: "Metadata priority and sidecar files"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/2.book-metadata.md"
    match: [metadata, opf, nfo]
  - id: online-matching
    name: "Match and Quick Match"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/2.book-metadata.md"
    match: [match]
  - id: embed-and-probe
    name: "Embedding and ffprobe repair"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/2.book-metadata.md"
    match: [embed, ffprobe]
  - id: series
    name: "Series management"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/3.series-management.md"
    match: [series]
  - id: ebooks
    name: "E-books and send to e-reader"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/book-library/4.ebooks.md"
    match: [ebooks, smtp]
  - id: codec-issues
    name: "xHE-AAC and format choice"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/faq/server.md"
    match: [xhe-aac, codec]
  - id: library-scope
    name: "Library scope"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/common-content/1.overview.md"
    match: [libraries]
  - id: collections-playlists
    name: "Collections and playlists"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/common-content/3.playlists.md"
    match: [collections, playlists]
  - id: public-shares
    name: "RSS feeds and public shares"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/common-content/4.public-shares.md"
    match: [rss, shares]
  # --- Podcasts and mobile ---
  - id: podcast-layout
    name: "Podcast folder layout and tags"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/podcast-library/1.podcast-directory-structure.md"
    match: [podcasts]
  - id: podcast-downloads
    name: "Podcast adding and auto download"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/libraries/podcast-library/1.podcast-directory-structure.md"
    match: [rss, schedule]
  - id: mobile-connection
    name: "Connection profiles and sync"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/mobile-apps/connection-profiles.md"
    match: [mobile]
  - id: mobile-history-logs
    name: "Listen history and mobile logs"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/mobile-apps/listen-history.md"
    match: [history, logs]
  - id: mobile-shared-storage
    name: "Android shared storage"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/documentation/mobile-apps/shared-storage.md"
    match: [android]
  - id: app-faq
    name: "App FAQ and third-party clients"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/faq/app.md"
    match: [app, third-party]
  - id: ios-testflight
    name: "iOS TestFlight beta"
    source: "https://github.com/audiobookshelf/audiobookshelf-docs/blob/master/docs/faq/beta-app.md"
    match: [ios, testflight]
