# Canonical coverage spec: DevOps / CI-CD (whole field).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (official docs tables of contents, the
# DORA/Accelerate capability list, SLSA levels, the Continuous Delivery book), not from what we
# happened to write, so the check measures the library against the subject.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (docs page
# sub-headings, workflow-syntax keywords, the GitLab keyword reference, Jenkins step reference,
# Argo CD docs sections, SLSA requirements, CD book sub-sections).
# Depth round 2: every topic expanded to at least 8 subtopics from the next level of each source
# (workflow-syntax keys and docs sub-pages, GitLab keyword entries, Jenkins steps, Argo CD/Flux
# sub-pages, SLSA requirements, CD book sub-sections).
subject: devops-ci-cd
scope:
  category: computing-software
  field: devops-ci-cd
  products: [github-actions, gitlab-ci, jenkins, argo-cd, ci-pipeline-design, release-engineering, deployment-strategies, build-systems, secrets-management]
sources:
  - "GitHub Actions docs ToC (docs.github.com/actions) - Writing workflows (syntax, triggers, expressions, contexts, concurrency), Using jobs (matrix, outputs, services), Managing workflow runs (artifacts, cache, debugging, re-runs), Sharing automations (reusable workflows, composite/JS/Docker actions, Marketplace), Security (GITHUB_TOKEN, OIDC, secrets, hardening, SHA pinning), Hosting runners (self-hosted, ARC, larger runners), Monitoring/usage limits, Publishing packages; subtopics from the Workflow syntax reference keyword list and each page's sub-headings"
  - "GitLab CI/CD docs ToC (docs.gitlab.com/ee/ci) - .gitlab-ci.yml keyword reference, Pipelines (stages/needs, MR pipelines, merge trains, parent-child, multi-project, schedules, triggers), Jobs (rules, retry/timeout, artifacts reports, caching), Variables, Environments & deployments (review apps, protected environments, deployment safety, freeze periods, resource_group), Runners, Docker (dind, kaniko, registry), Services, Components/catalog, Security scanning (SAST/DAST/dependency/container/secret detection), Releases, Package registry, Auto DevOps, Agent for Kubernetes, Pipeline efficiency, Debugging; subtopics from the CI/CD YAML keyword reference sub-keywords"
  - "Jenkins User Handbook (jenkins.io/doc/book) - Pipeline (getting started, Jenkinsfile, running pipelines, branches & PRs/multibranch, dev tools, shared libraries, pipeline syntax, Docker), Managing Jenkins (JCasC, plugins, security, credentials, system config), Securing Jenkins, Scaling Jenkins (controller tuning, agents, cloud agents), Managing nodes, Build triggers, Glossary; plus Kubernetes plugin, Job DSL, Blue Ocean, Pipeline durability docs; subtopics from the Pipeline Steps Reference and directive sections"
  - "Argo CD docs ToC (argo-cd.readthedocs.io) - Core concepts, Getting started/Installation (HA), Operator manual (declarative setup, RBAC, SSO, cluster management, resource tracking/health/exclusions, sync windows, notifications, metrics, disaster recovery, ingress, high availability, config management plugins, ApplicationSet generators), User guide (sync options, sync waves/hooks, diffing, Helm/Kustomize/Jsonnet, private repos, orphaned resources, CLI), Argo Rollouts, Image Updater; Flux v2 docs (sources, Kustomization, HelmRelease, image automation); subtopics from each docs section's headings"
  - "DORA / Accelerate (Forsgren, Humble, Kim) - four key metrics (deployment frequency, lead time, change failure rate, time to restore) + reliability; 24 capabilities incl. version control, deployment automation, continuous integration, trunk-based development, test automation, test data management, shift left on security, continuous delivery, loosely coupled architecture, monitoring, proactive notification, lightweight change approval, database change management"
  - "SLSA v1.0 (slsa.dev) - Build track L0-L3 (provenance exists, hosted build platform, hardened build/isolation), provenance generation and verification, in-toto attestations; Sigstore cosign; SBOM (SPDX/CycloneDX); dependency pinning; subtopics from the SLSA requirements list and Sigstore/Syft docs"
  - "Continuous Delivery (Humble & Farley) chapters - 2 Configuration Management, 3 Continuous Integration, 4 Testing Strategy, 5 Anatomy of the Deployment Pipeline, 6 Build and Deployment Scripting, 7 Commit Stage, 8 Automated Acceptance Testing, 9 Testing Nonfunctional Requirements, 10 Deploying and Releasing, 11 Managing Infrastructure and Environments, 12 Managing Data, 13 Managing Components and Dependencies, 14 Advanced Version Control, 15 Managing Continuous Delivery (maturity, compliance and auditing); subtopics from chapter sub-sections"
