# Coverage spec: wazuh. Topics from the Wazuh user manual table of contents (defensive use only).
subject: wazuh
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [wazuh]
sources:
  - "Wazuh documentation (documentation.wazuh.com/current)"
topics:
  - id: fim-configure-directories
    name: "FIM configure directories"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/how-to-configure-fim.html"
    match: [syscheck, directories, fim]
  - id: fim-realtime-and-check-attributes
    name: "FIM realtime and check attributes"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/basic-settings.html"
    match: [realtime, check-all, fim-attributes]
  - id: fim-whodata-monitoring
    name: "FIM who-data monitoring"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/advanced-settings.html"
    match: [whodata, ebpf, windows-audit]
  - id: fim-custom-rules
    name: "FIM custom rules"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/creating-custom-fim-rules.html"
    match: [fim-rules, changed-fields, rule-550]
  - id: fim-windows-registry
    name: "FIM Windows registry monitoring"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/windows-registry-monitoring.html"
    match: [windows-registry, registry-ignore, recursion-level]
  - id: fim-scheduled-scans
    name: "FIM scheduled scans"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/use-cases/monitoring-files-at-specific-intervals.html"
    match: [frequency, scheduled-scan, fim-interval]
  - id: fim-report-changes-and-nodiff
    name: "FIM report changes and nodiff"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/use-cases/reporting-file-changes.html"
    match: [report-changes, nodiff, syscheck-diff]
  - id: sca-policy-management
    name: "SCA policy management"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/how-to-configure.html"
    match: [sca, security-configuration-assessment, policies]
  - id: sca-custom-policy-syntax
    name: "SCA custom policy syntax"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/creating-custom-policies.html"
    match: [sca-policy, checks, rule-types]
  - id: active-response-server-config
    name: "Active response server configuration"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/active-response/how-to-configure.html"
    match: [active-response, command, location]
  - id: active-response-custom-scripts
    name: "Active response custom scripts"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/active-response/custom-active-response-scripts.html"
    match: [custom-active-response, stdin-json, stateful]
  - id: active-response-default-scripts
    name: "Active response default scripts"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/active-response/default-active-response-scripts.html"
    match: [firewall-drop, host-deny, default-scripts]
  - id: log-collection-localfile
    name: "Log collection with localfile"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/log-data-collection/monitoring-log-files.html"
    match: [localfile, log-format, logcollector]
  - id: syslog-listener
    name: "Syslog listener on the server"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/log-data-collection/syslog.html"
    match: [syslog, remote, allowed-ips]
  - id: journald-collection
    name: "Journald log collection"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/log-data-collection/journald.html"
    match: [journald, only-future-events, systemd-unit]
  - id: vulnerability-detection-config
    name: "Vulnerability detection configuration"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/vulnerability-detection/configuring-scans.html"
    match: [vulnerability-detection, feed-update-interval, offline-url]
  - id: command-monitoring-config
    name: "Command monitoring configuration"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/command-monitoring/configuration.html"
    match: [command-monitoring, wodle-command, full-command]
  - id: docker-listener-wodle
    name: "Docker listener wodle"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/container-security/monitoring-docker.html"
    match: [docker-listener, container-security, wodle]
  - id: syscollector-inventory-config
    name: "Syscollector inventory configuration"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/system-inventory/configuration.html"
    match: [syscollector, system-inventory, inventory-harvester]
  - id: auditd-log-monitoring
    name: "Auditd log monitoring"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/system-calls-monitoring/audit-configuration.html"
    match: [auditd, audit-keys, auditctl]
  - id: agentless-monitoring-config
    name: "Agentless monitoring configuration"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/agentless-monitoring/agentless-configuration.html"
    match: [agentless, ssh-integrity-check, periodic-diff]
  - id: custom-rules-and-overwrite
    name: "Custom rules and overwrite"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/rules/custom.html"
    match: [custom-rules, local-rules, overwrite]
  - id: custom-decoders-and-exclusion
    name: "Custom decoders and exclusion"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/decoders/custom.html"
    match: [custom-decoders, local-decoder, decoder-exclude]
  - id: rule-syntax-attributes
    name: "Rule XML syntax and attributes"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/ruleset-xml-syntax/rules.html"
    match: [rule-syntax, timeframe, noalert]
  - id: decoder-syntax-options
    name: "Decoder XML syntax options"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/ruleset-xml-syntax/decoders.html"
    match: [decoder-syntax, prematch, plugin-decoder]
  - id: os-regex-syntax
    name: "OS_Regex syntax"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/ruleset-xml-syntax/regex.html"
    match: [os-regex, osregex, sregex]
  - id: wazuh-logtest-usage
    name: "wazuh-logtest usage"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/testing.html"
    match: [wazuh-logtest, rule-test, sessions]
  - id: cdb-lists
    name: "CDB lists"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/cdb-list.html"
    match: [cdb-list, lookup, match-key]
  - id: mitre-attack-mapping
    name: "MITRE ATT&CK mapping"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/mitre.html"
    match: [mitre-attack, mitre-id, rule-mitre]
  - id: decoder-dynamic-fields
    name: "Decoder dynamic fields"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/decoders/dynamic-fields.html"
    match: [dynamic-fields, static-fields, decoder-order-size]
  - id: sibling-decoders
    name: "Sibling decoders"
    source: "https://documentation.wazuh.com/current/user-manual/ruleset/decoders/sibling-decoders.html"
    match: [sibling-decoders, parent-child, decoder-order]
  - id: agent-enrollment-password
    name: "Agent enrollment password"
    source: "https://documentation.wazuh.com/current/user-manual/agent/agent-enrollment/security-options/using-password-authentication.html"
    match: [use-password, authd-pass, enrollment]
  - id: agent-groups-and-shared-files
    name: "Agent groups and shared files"
    source: "https://documentation.wazuh.com/current/user-manual/agent/agent-management/grouping-agents.html"
    match: [agent-groups, shared-files, merged-mg]
  - id: agent-labels
    name: "Agent labels"
    source: "https://documentation.wazuh.com/current/user-manual/agent/agent-management/labels.html"
    match: [labels, agent-labels, alert-enrichment]
  - id: agent-queue-antiflooding
    name: "Agent queue and anti-flooding"
    source: "https://documentation.wazuh.com/current/user-manual/agent/agent-management/antiflooding.html"
    match: [client-buffer, antiflooding, events-per-second]
  - id: agent-anti-tampering
    name: "Agent anti-tampering"
    source: "https://documentation.wazuh.com/current/user-manual/agent/agent-management/anti-tampering.html"
    match: [anti-tampering, package-uninstallation, uninstall-validation]
  - id: agent-remote-upgrade
    name: "Agent remote upgrade"
    source: "https://documentation.wazuh.com/current/user-manual/agent/agent-management/remote-upgrading/upgrading-agent.html"
    match: [agent-upgrade, remote-upgrade, outdated-agents]
  - id: server-cluster-node-config
    name: "Server cluster node configuration"
    source: "https://documentation.wazuh.com/current/user-manual/wazuh-server-cluster/cluster-nodes-configuration.html"
    match: [cluster, node-type, cluster-control]
  - id: server-api-hardening
    name: "Server API hardening"
    source: "https://documentation.wazuh.com/current/user-manual/api/securing-api.html"
    match: [server-api, api-yaml, wazuh-wui]
  - id: centralized-configuration-agent-conf
    name: "Centralized configuration with agent.conf"
    source: "https://documentation.wazuh.com/current/user-manual/reference/centralized-configuration.html"
    match: [centralized-configuration, agent-conf, agent-config]
  - id: virustotal-integration
    name: "VirusTotal integration"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/malware-detection/virus-total-integration.html"
    match: [virustotal, integration, integrator]
  - id: yara-active-response
    name: "YARA active response"
    source: "https://documentation.wazuh.com/current/user-manual/capabilities/malware-detection/fim-yara.html"
    match: [yara, yara-rules, fim-yara]
  - id: alert-levels-and-outputs
    name: "Alert levels and outputs"
    source: "https://documentation.wazuh.com/current/user-manual/manager/alert-management.html"
    match: [alerts, log-alert-level, email-alert-level]
  - id: agent-groups-cli
    name: "agent_groups command reference"
    source: "https://documentation.wazuh.com/current/user-manual/reference/tools/agent-groups.html"
    match: [agent-groups-tool, agent-groups-flags, sync-status]
  - id: remote-connection-settings
    name: "Remote connection settings"
    source: "https://documentation.wazuh.com/current/user-manual/reference/ossec-conf/remote.html"
    match: [remote, rids-closing-time, connection-overtake-time]
  - id: verify-agent-conf-tool
    name: "verify-agent-conf tool"
    source: "https://documentation.wazuh.com/current/user-manual/reference/tools/verify-agent-conf.html"
    match: [verify-agent-conf, validation, shared-folder]
  - id: rootcheck-config
    name: "Rootcheck configuration"
    source: "https://documentation.wazuh.com/current/user-manual/reference/ossec-conf/rootcheck.html"
    match: [rootcheck, rootkit-files, rootkit-trojans]
