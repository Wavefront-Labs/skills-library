# Canonical coverage spec for v-language, drawn from external sources listed below.
subject: v-language
scope:
  category: computing-software
  field: software-engineering
  products:
  - v-lang
sources:
- 'V documentation (https://docs.vlang.io/): table of contents covering hello world, functions, variables, types, strings, arrays, maps, structs, sum types, option/result, interfaces, generics, modules,
  control flow, memory management, concurrency, testing, attributes, comptime, C interop, JS/WASM backends'
- 'V standard library modules index (https://modules.vlang.io/): os, io, net.http, json, arrays, math, time, strconv, regex, cli, flag, sync, term, gg, ui, veb, orm, db.sqlite, db.pg'
- 'V command line help and CLI docs (https://github.com/vlang/v/blob/master/doc/docs.md and v help): run, build, fmt, doc, test, up, install, self, translate, backends, cross compilation'
- 'V Tour and Awesome V (https://github.com/vlang/v/blob/master/doc/docs.md and https://github.com/vlang/awesome-v): learning resources, packages, ecosystem; VPM (https://vpm.vlang.io/)'
