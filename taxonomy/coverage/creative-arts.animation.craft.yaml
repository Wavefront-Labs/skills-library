# Canonical coverage spec: Animation craft (tool-agnostic principles, design, visual development,
# art direction, production design, story writing and storyboarding).
# Checked by tools/coverage_check.py: a topic is covered when a skill in scope has a tag equal to
# one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from the external structures listed in `sources` (book chapter and
# section headings, studio curricula, guild job classifications), not from what the library has.
subject: animation-craft
scope:
  category: creative-arts
  field: animation
  products: [principles, character-design, environment-design, visual-development, art-direction, production-design, storywriting, storyboarding]
sources:
  - "Thomas and Johnston - The Illusion of Life (1981) ch.3 The Principles of Animation - squash and stretch / anticipation / staging / straight ahead and pose to pose / follow through and overlapping action / slow in and slow out / arcs / secondary action / timing / exaggeration / solid drawing / appeal; ch.15 Acting and Emotions"
  - "Richard Williams - The Animator's Survival Kit (2001, expanded 2009) sections - Timing / Spacing / Charts / Keys extremes breakdowns / Inbetweens / Flexibility (successive breaking of joints / overlapping) / Weight / Walks / Runs jumps and skips / Animal action / Dialogue / Acting / Directing (accents / takes / staggers / vibrations / wave and whip)"
  - "CalArts Character Animation BFA curriculum (Animation I-IV / Figure drawing / Character design / Story development / Layout / Color and design); Gobelins Character Animation and Interactive Design curriculum; Sheridan Bachelor of Animation curriculum (animation principles / life drawing / layout and backgrounds / story / colour theory / thesis film production)"
  - "Francis Glebas - Directing the Story (2009) parts - What is story / Visual storytelling / Staging and composition / Continuity and the 180 rule / Camera / Cutting and transitions / Pitching"
  - "Sergio Paez and Anson Jew - Professional Storyboarding (2013); John Hart - The Art of the Storyboard; Giuseppe Cristiano - Storyboard Design Course; Prepare to Board (Nancy Beiman, 2007/2013) chapters - Story structure / Character / Thumbnails and beat boards / Staging / Camera / Continuity / Board formats / Pitching"
  - "Marcos Mateu-Mestre - Framed Ink (2010) - Composition / Framing / Value and light / Points of view and lenses / Continuity / Narrative clarity"
  - "Bruce Block - The Visual Story (3rd ed.) - The principle of contrast and affinity / Space (deep / flat / limited / ambiguous) / Line and shape / Tone / Color / Movement / Rhythm / Story structure and visual structure"
  - "James Gurney - Color and Light (2010) ToC - Light sources (direct sun / overcast / window / candle and firelight / skylight / artificial / luminescence) / Elements (form principle / cast shadows / occlusion shadows) / Color (wheel / gamut mapping / local color / warm and cool / color accents) / Properties of light (reflected light / subsurface / rim and backlight / specular) / Atmospheric effects (fog / haze / sunbeams / time of day / weather) - and Imaginative Realism (thumbnails / reference / maquettes / worldbuilding)"
  - "Tom Bancroft - Creating Characters with Personality (2006) chapters - The character spectrum (iconic / simple / broad / comedy relief / lead / realistic) / Shapes / Silhouette / Line / Variety / Proportions and height / Posing / Line-ups / Expressions / Model sheets / Hands"
  - "Blake Snyder - Save the Cat (2005) - logline and title / ten genres / 15-beat sheet (opening image / theme stated / set-up / catalyst / debate / break into two / B story / fun and games / midpoint / bad guys close in / all is lost / dark night of the soul / break into three / finale / final image) / the board"
  - "Robert McKee - Story (1997) - structure spectrum / inciting incident / progressive complications / crisis climax resolution / scene design and story values / gap between expectation and result / controlling idea / character dimension / exposition / dialogue"
  - "Emma Coats - Pixar's 22 Rules of Storytelling (2011) and the story spine (Kenn Adams); Pixar in a Box (Khan Academy) Art of Storytelling lessons - character / structure / visual language / pitching"
  - "The Animation Guild IATSE Local 839 job classifications - story artist / storyboard revisionist / character designer / visual development artist / layout artist / background painter / color stylist / art director / production designer / timing director / animator / assistant animator / inbetweener / writer"
