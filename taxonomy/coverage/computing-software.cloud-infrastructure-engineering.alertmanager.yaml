# Coverage spec for Alertmanager, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: alertmanager
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [alertmanager]
sources:
  - "Prometheus Alertmanager documentation (configuration, notifications, clients, management API, HTTPS, README and amtool)"
