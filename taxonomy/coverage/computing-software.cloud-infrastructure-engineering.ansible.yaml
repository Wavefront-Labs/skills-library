# Canonical coverage spec: Ansible and tool-agnostic infrastructure-as-code practice.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (Red Hat exam objectives, the Ansible
# documentation table of contents, the IaC discipline as described by HashiCorp/AWS/Google
# well-architected guidance), not from what we happened to write. Tool-agnostic IaC practice
# topics live under the infrastructure-as-code product; Ansible-specific ones under ansible.
# Subtopics (depth) come from the sub-headings of the docs.ansible.com user/developer guide pages,
# the ansible.builtin module index, the ansible-lint rule list, the Molecule command list and the
# AWX / Ansible Automation Platform documentation sections named in each topic's source.
subject: ansible
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [ansible, infrastructure-as-code]
sources:
  - "RHCE EX294 exam objectives (Red Hat Certified Engineer, RHEL 9) - core components, roles and collections, control node, managed nodes, ansible-navigator, plays and playbooks, RHCSA task automation, templates and Vault"
  - "EX374 Red Hat Certified Specialist in Developing Automation with Ansible Automation Platform objectives - collections, filters/lookups, execution environments, ansible-builder, task execution control, testing with ansible-lint and molecule"
  - "EX467 Red Hat Certified Specialist in Managing Automation with Ansible Automation Platform objectives - automation controller (organizations, RBAC, credentials, projects, inventories, job and workflow templates, surveys, notifications, schedules), automation hub, backup and restore"
  - "Ansible documentation user guide table of contents - Building inventories, Command line tools, Playbooks (variables, facts, conditionals, loops, handlers, blocks, error handling, tags, delegation, strategies, async, templating, filters, tests, lookups, module defaults, prompts, debugging), Roles, Collections, Vault, Windows, Network automation, Plugins"
  - "Ansible developer guide table of contents - developing modules, module utilities, plugins, collections (galaxy.yml, build, publish), ansible-test sanity/units/integration"
  - "Ansible ecosystem docs - Molecule, ansible-lint, ansible-builder/execution environments, ansible-navigator, ansible-runner, AWX/automation controller, Event-Driven Ansible"
  - "IaC discipline - HashiCorp Terraform recommended practices (workflow, environments), AWS Well-Architected Operational Excellence (infrastructure as code, change management), Google Cloud architecture framework (IaC, CI/CD, policy), OpenGitOps principles"
  - "Subtopic sources - docs.ansible.com page sub-headings (Installation guide, Configuring Ansible, Privilege escalation, Connection methods, Building inventories, Patterns, Playbook guide pages), ansible.builtin and ansible.posix/community.general module index grouped by files/packages/services/users/storage, ansible-lint rule index and profiles page, Molecule command reference, ansible-builder definition reference, ansible-navigator settings and subcommands, AWX/AAP controller user guide and administration guide sections, EDA rulebook reference"
