# Coverage spec: spinnaker. Topics from the Spinnaker docs (spinnaker.io/docs).
subject: spinnaker
scope:
  category: computing-software
  field: devops-ci-cd
  products: [spinnaker]
sources:
  - "Spinnaker docs (spinnaker.io/docs)"
topics:
  # --- Architecture and Halyard ---
  - id: spinnaker-microservices
    name: "Microservice architecture"
    source: "https://spinnaker.io/docs/reference/architecture/"
    match: [architecture,microservices,gate,orca,clouddriver]
  - id: spinnaker-service-ports
    name: "Service dependencies and ports"
    source: "https://spinnaker.io/docs/reference/architecture/"
    match: [architecture,ports,dependencies,gate,orca]
  - id: spinnaker-halyard-install
    name: "Installing Halyard"
    source: "https://spinnaker.io/docs/setup/install/halyard/"
    match: [halyard,install,hal,docker,debian]
  - id: spinnaker-halyard-deploy
    name: "Deploying and connecting to Spinnaker"
    source: "https://spinnaker.io/docs/setup/install/deploy/"
    match: [halyard,hal-deploy-apply,hal-version,deploy,ui-access]
  - id: spinnaker-halyard-config
    name: "Halyard configuration areas"
    source: "https://spinnaker.io/docs/setup/install/configuration/"
    match: [halyard,hal-config,configuration,providers,security]
  - id: spinnaker-halyard-backup
    name: "Halyard backup and restore"
    source: "https://github.com/spinnaker/spinnaker.github.io/blob/master/setup/install/backups.md"
    match: [halyard,backup,restore,hal-backup,disaster-recovery]
  - id: spinnaker-halyard-secrets
    name: "Halyard secrets management"
    source: "https://spinnaker.io/docs/reference/secrets/"
    match: [secrets,halyard,encrypted,s3,gcs]
  # --- Cloud providers and registries ---
  - id: spinnaker-kubernetes-provider
    name: "Kubernetes provider accounts"
    source: "https://spinnaker.io/docs/setup/install/providers/kubernetes/"
    match: [kubernetes,provider,kubeconfig,kubectl,rbac]
  - id: spinnaker-kubernetes-artifacts
    name: "Kubernetes artifacts and versioned resources"
    source: "https://spinnaker.io/docs/reference/artifacts/in-kubernetes/"
    match: [kubernetes,artifacts,versioned-resources,configmap,manifests]
  - id: spinnaker-aws-ec2
    name: "AWS EC2 IAM setup"
    source: "https://spinnaker.io/docs/setup/install/providers/aws/aws-ec2/"
    match: [aws,ec2,iam,cloudformation,managing-account]
  - id: spinnaker-aws-ecs
    name: "AWS ECS prerequisites"
    source: "https://spinnaker.io/docs/setup/install/providers/aws/aws-ecs/"
    match: [aws,ecs,fargate,iam,service-linked-role]
  - id: spinnaker-gce
    name: "Google Compute Engine accounts"
    source: "https://spinnaker.io/docs/setup/install/providers/gce/"
    match: [gce,google-cloud,provider,service-account,iam]
  - id: spinnaker-azure
    name: "Azure accounts"
    source: "https://spinnaker.io/docs/setup/install/providers/azure/"
    match: [azure,provider,service-principal,key-vault,vm-scale-sets]
  - id: spinnaker-cloud-foundry
    name: "Cloud Foundry accounts"
    source: "https://spinnaker.io/docs/setup/install/providers/cf/"
    match: [cloud-foundry,provider,hal-config-provider,accounts,foundation]
  - id: spinnaker-docker-registry
    name: "Docker registry accounts"
    source: "https://spinnaker.io/docs/setup/install/providers/docker-registry/"
    match: [docker-registry,dockerhub,gcr,ecr,provider]
  # --- Artifacts and storage ---
  - id: spinnaker-artifact-types
    name: "Artifact types and references"
    source: "https://spinnaker.io/docs/reference/artifacts/types/docker-image/"
    match: [artifacts,docker-image,embedded-base64,artifact-types,references]
  - id: spinnaker-github-artifacts
    name: "GitHub artifact account"
    source: "https://spinnaker.io/docs/setup/other_config/artifacts/"
    match: [artifacts,github,hal-config-artifact,access-token,accounts]
  - id: spinnaker-gcs-artifacts
    name: "GCS artifact account"
    source: "https://spinnaker.io/docs/setup/other_config/artifacts/gcs/"
    match: [artifacts,gcs,google-cloud,service-account,hal-config-artifact]
  - id: spinnaker-helm-artifacts
    name: "Helm chart artifact account"
    source: "https://spinnaker.io/docs/setup/other_config/artifacts/helm/"
    match: [artifacts,helm,chartmuseum,basic-auth,hal-config-artifact]
  - id: spinnaker-storage-backends
    name: "Persistent storage backends and S3"
    source: "https://spinnaker.io/docs/setup/install/storage/"
    match: [storage,front50,s3,gcs,azure-storage,aws,hal-config-storage]
  - id: spinnaker-externalize-redis
    name: "Externalizing Redis"
    source: "https://spinnaker.io/docs/setup/productionize/caching/externalize-redis/"
    match: [redis,externalize,caching,service-settings,gate]
  # --- Authentication, authorization and TLS ---
  - id: spinnaker-authentication-overview
    name: "Authentication overview"
    source: "https://spinnaker.io/docs/setup/other_config/security/authentication/"
    match: [authentication,gate,deck,identity-provider,oauth2]
  - id: spinnaker-oauth2
    name: "OAuth 2.0 and OIDC authentication"
    source: "https://spinnaker.io/docs/setup/other_config/security/authentication/oauth/"
    match: [oauth2,authentication,gate,userinfomapping,redirect-uri]
  - id: spinnaker-saml
    name: "SAML authentication"
    source: "https://spinnaker.io/docs/setup/other_config/security/authentication/saml/"
    match: [saml,authentication,gate,keystore,metadata]
  - id: spinnaker-ldap
    name: "LDAP authentication"
    source: "https://spinnaker.io/docs/setup/other_config/security/authentication/ldap/"
    match: [ldap,authentication,active-directory,bind,user-dn-pattern]
  - id: spinnaker-x509
    name: "X.509 client certificates"
    source: "https://spinnaker.io/docs/setup/other_config/security/authentication/x509/"
    match: [x509,authentication,client-certificates,openssl,roles]
  - id: spinnaker-ssl
    name: "SSL termination for Gate and Deck"
    source: "https://spinnaker.io/docs/setup/other_config/security/ssl/"
    match: [ssl,tls,gate,deck,load-balancer]
  - id: spinnaker-fiat-model
    name: "Fiat authorization model"
    source: "https://spinnaker.io/docs/setup/other_config/security/authorization/"
    match: [fiat,authorization,rbac,permissions,roles]
  - id: spinnaker-fiat-github-teams
    name: "GitHub Teams role provider"
    source: "https://spinnaker.io/docs/setup/other_config/security/authorization/github-teams/"
    match: [fiat,authorization,github-teams,role-provider,hal-config-security]
  - id: spinnaker-fiat-service-accounts
    name: "Fiat service accounts"
    source: "https://spinnaker.io/docs/setup/other_config/security/authorization/service-accounts/"
    match: [fiat,service-accounts,run-as-user,front50,automated-triggers]
  - id: spinnaker-pipeline-permissions
    name: "Pipeline permissions and managed service accounts"
    source: "https://spinnaker.io/docs/setup/other_config/security/authorization/pipeline-permissions/"
    match: [fiat,pipeline-permissions,managed-service-accounts,orca,front50]
  # --- SQL persistence, scaling and tuning ---
  - id: spinnaker-front50-sql
    name: "Front50 SQL persistence"
    source: "https://spinnaker.io/docs/setup/productionize/persistence/front50-sql/"
    match: [front50,sql,mysql,persistence,compositestorageservice]
  - id: spinnaker-orca-sql
    name: "Orca SQL setup and migration from Redis"
    source: "https://spinnaker.io/docs/setup/productionize/persistence/orca-sql/"
    match: [orca,sql,mysql,persistence,keiko,redis,migration,dualexecutionrepository]
  - id: spinnaker-clouddriver-sql
    name: "Clouddriver SQL persistence"
    source: "https://spinnaker.io/docs/setup/productionize/persistence/clouddriver-sql/"
    match: [clouddriver,sql,mysql,persistence,caching]
  - id: spinnaker-horizontal-scaling
    name: "Horizontal scaling and HA"
    source: "https://spinnaker.io/docs/setup/productionize/scaling/horizontal-scaling/"
    match: [scaling,clouddriver,orca,horizontal-scaling,queue-ready-depth,high-availability,echo,halyard,hal-config-deploy-ha]
  - id: spinnaker-request-sharding
    name: "Request sharding selectors"
    source: "https://spinnaker.io/docs/guides/runbooks/sharding-spinnaker/"
    match: [sharding,gate,orca,clouddriver,read-only-shards]
  - id: spinnaker-gate-rate-limiting
    name: "Gate API rate limiting"
    source: "https://spinnaker.io/docs/guides/runbooks/api-rate-limiting/"
    match: [rate-limiting,gate,redis,api,learning-mode]
  - id: spinnaker-component-sizing
    name: "Component sizing and Java options"
    source: "https://spinnaker.io/docs/reference/halyard/component-sizing/"
    match: [sizing,kubernetes,resources,java-opts,halconfig]
  - id: spinnaker-orca-qos
    name: "Orca quality of service"
    source: "https://spinnaker.io/docs/guides/runbooks/orca-quality-of-service/"
    match: [orca,qos,buffering,executions,bufferpolicy]
  - id: spinnaker-orca-zombies
    name: "Orca zombie executions"
    source: "https://spinnaker.io/docs/guides/runbooks/orca-zombie-executions/"
    match: [orca,zombie-executions,troubleshooting,queue,redis]
  # --- Monitoring ---
  - id: spinnaker-monitoring-daemon
    name: "Monitoring daemon"
    source: "https://spinnaker.io/docs/setup/other_config/monitoring/"
    match: [monitoring,metrics,spinnaker-monitoring,prometheus,datadog]
  - id: spinnaker-prometheus
    name: "Prometheus and Grafana integration"
    source: "https://github.com/spinnaker/spinnaker.github.io/blob/master/setup/monitoring/prometheus.md"
    match: [prometheus,grafana,monitoring,metrics,metric-stores]
