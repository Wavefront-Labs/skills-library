      - {id: pg-mo-archiver, name: WAL archiver monitoring (pg_stat_archiver / failed_count), match: [pg-stat-archiver]}
      - {id: pg-mo-ps, name: Process titles with ps and top, match: [postgres-process-title]}
      - {id: pg-mo-exporter, name: Prometheus postgres_exporter metrics and alerts, match: [postgres-exporter]}
