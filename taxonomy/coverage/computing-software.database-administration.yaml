      - {id: pg-rm-repack, name: Removing table bloat online (pg_repack), match: [pg-repack, table-bloat]}
      - {id: pg-rm-logfiles, name: Log file maintenance (logging_collector / rotation), match: [logging-collector, log-rotation]}
      - {id: pg-rm-vacuum-full, name: VACUUM FULL and recovering disk space, match: [vacuum-full]}
      - {id: pg-rm-multixact, name: Multixacts and multixact wraparound, match: [multixact]}
      - {id: pg-rm-visibility-map, name: The visibility map and index-only scan freshness, match: [visibility-map]}
      - {id: pg-rm-analyze, name: Updating planner statistics (ANALYZE / autovacuum_analyze_scale_factor), match: [autovacuum-analyze, postgres-analyze]}
      - {id: pg-rm-autovac-workers, name: Autovacuum workers and cost limits / diagnosing autovacuum that never finishes, match: [autovacuum-vacuum-cost-limit, autovacuum-max-workers]}
