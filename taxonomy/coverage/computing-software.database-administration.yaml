      - {id: pg-ha-monitor, name: Monitoring replication lag (pg_stat_replication / pg_stat_wal_receiver), match: [pg-stat-replication]}
      - {id: pg-ha-archive-always, name: Archiving from a standby (archive_mode = always) and restore_command fallback, match: [archive-mode-always]}
      - {id: pg-ha-delayed, name: Delayed standbys (recovery_min_apply_delay), match: [recovery-min-apply-delay]}
      - {id: pg-ha-repmgr, name: repmgr-managed replication clusters, match: [repmgr]}
