# Canonical coverage spec: Database Administration (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (official manual tables of contents,
# certification skills outlines), not from what the library happened to hold.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (manual chapter
# sections, exam objective bullets, docs page headings).
subject: database-administration
scope:
  category: computing-software
  field: database-administration
  products: [postgresql, mysql, sql-server, oracle-database, mongodb, redis, elasticsearch, sqlite, query-optimisation, schema-design, replication-high-availability, database-backup-recovery]
sources:
  - "PostgreSQL 17 documentation Part III Server Administration (postgresql.org/docs/current/admin.html) - 18 Server Setup and Operation, 19 Server Configuration, 20 Client Authentication, 21 Database Roles, 22 Managing Databases, 23 Localization, 24 Routine Database Maintenance Tasks, 25 Backup and Restore, 26 High Availability Load Balancing and Replication, 27 Monitoring Database Activity, 28 Reliability and the Write-Ahead Log, 29 Logical Replication; Part II chapters 5.12 Table Partitioning, 11 Indexes, 13 Concurrency Control, 14 Performance Tips; Appendix F Additional Supplied Modules; PgBouncer docs (config, usage)"
  - "MySQL 8.4 Reference Manual ToC (dev.mysql.com/doc/refman/8.4/en) - 3 Upgrading MySQL, 7 MySQL Server Administration (configuring the server, option files, server logs), 8 Security (access control and account management, encrypted connections, authentication plugins, keyring), 9 Backup and Recovery (mysqldump, point-in-time recovery using binary log), 10 Optimization (EXPLAIN, optimizer hints, histograms, invisible indexes), 17 The InnoDB Storage Engine (buffer pool, redo/undo logs, locking, online DDL, crash recovery), 19 Replication (GTID, filters, multithreaded and delayed replicas, semisynchronous), 20 Group Replication, MySQL Shell AdminAPI InnoDB Cluster and MySQL Router docs; gh-ost and Percona Toolkit docs"
  - "Microsoft Exam DP-300 Administering Microsoft Azure SQL Solutions skills outline - Plan and implement data platform resources; Implement a secure environment (authentication, authorization, TDE, Always Encrypted, auditing, dynamic data masking); Monitor configure and optimize database resources (wait stats, Extended Events, Query Store, DMVs, index and statistics maintenance, intelligent query processing); Configure and manage automation of tasks (SQL Server Agent, alerts, elastic jobs); Plan and configure a high availability and disaster recovery environment (backup/restore, log shipping, FCI, availability groups, geo-replication, failover groups); plus SQL Server docs Backup and Restore, DBCC CHECKDB, Server configuration options, tempdb"
  - "Oracle Database Administration certification topics (1Z0-082 Administration I, 1Z0-083 Administration II, 1Z0-1093 Oracle Database Administration 2019+ exam topics) and Oracle 19c Administrator's Guide ToC - instance startup/shutdown and parameter files, ADR and alert log, memory management, multitenant CDB/PDB, users roles profiles and unified auditing, tablespaces undo and temp, ASM, Oracle Net (listener, tnsnames, services), Data Pump and SQL*Loader, RMAN (duplicate, recovery catalog, flashback, block media recovery), performance (AWR, SQL Tuning Advisor, SQL plan management, optimizer statistics), Data Guard, patching (OPatch, datapatch, AutoUpgrade), RAC (srvctl, services, Application Continuity)"
  - "MongoDB Manual ToC (mongodb.com/docs/manual) - Aggregation, Indexes (compound, wildcard, text, geospatial, TTL, hidden, index builds on populated collections), Data Modeling, Replication (read preference, member configuration, oplog, initial sync), Sharding (shard keys, resharding, balancer, jumbo chunks), Security (authentication SCRAM/x.509, RBAC, TLS, CSFLE/Queryable Encryption, auditing), Administration and Production Notes (WiredTiger, profiler, mongostat/mongotop, FCV), Transactions, Change Streams"
  - "Redis documentation ToC (redis.io/docs) - Data types (strings, hashes, lists, sets, sorted sets, streams, bitmaps, HyperLogLog, pub/sub), Management - Persistence, Replication, Sentinel, Scaling with Cluster, Security (ACL, TLS, protected mode), Optimization (memory optimization, latency monitor and diagnosis, slowlog), Programmability (Lua EVAL, Functions, transactions, pipelining), Distributed locks"
  - "Elasticsearch Guide ToC (elastic.co/guide) - Set up Elasticsearch (important settings, discovery and cluster formation, node roles, important system configuration), Secure the Elastic Stack (TLS, users and roles, API keys, document/field level security, audit logging), Query DSL, Aggregations, Ingest pipelines, Index lifecycle and data tiers, Snapshot and restore, Cross-cluster replication, Monitoring, Upgrade, Circuit breakers, Slow logs"
  - "SQLite documentation (sqlite.org/docs.html) - Command Line Shell, ALTER TABLE and the 12-step generalized schema change, Datatypes and type affinity, Query Planner and EXPLAIN QUERY PLAN, ANALYZE, FTS5, JSON functions, WAL, Pragmas, Backup API, Recovering data"
  - "Use The Index Luke / SQL Performance Explained (Winand) ToC - anatomy of an index, the where clause, performance and scalability, the join operation, clustering data, sorting and grouping, partial results (pagination), insert/delete/update; PostgreSQL docs 7 Queries (window functions, WITH queries, LATERAL, grouping sets)"
  - "Database Design for Mere Mortals (Hernandez) and Refactoring Databases (Ambler and Sadalage) chapter structure - keys, field specifications/data types, relationships, business rules, views, integrity; refactoring categories (structural, data quality, referential integrity, architectural) and transition periods; SQL Antipatterns (Karwin) - EAV, polymorphic associations, naive trees"
  - "Designing Data-Intensive Applications (Kleppmann) ch.5 Replication and ch.7 Transactions; NIST SP 800-34 contingency planning and backup verification guidance"
topics:
  # ---------------- PostgreSQL (Server Administration part)
  - id: pg-server-setup
    name: Server setup and operation
    source: PostgreSQL docs 18 Server Setup and Operation
    match: [initdb, pg-ctl, postgres-server-setup]
    subtopics:
      - {id: pg-ss-initdb, name: Creating a cluster with initdb (locale / encoding / data checksums), match: [initdb-options, data-checksums]}
      - {id: pg-ss-shutdown, name: Shutting down the server (smart / fast / immediate), match: [shutdown-modes, pg-ctl-stop]}
      - {id: pg-ss-kernel, name: Managing kernel resources (shared memory / huge pages / overcommit), match: [huge-pages, vm-overcommit-postgres, kernel-resources]}
      - {id: pg-ss-systemd, name: Starting the server under systemd, match: [postgres-systemd, systemd-unit-postgres]}
      - {id: pg-ss-startup-failures, name: Diagnosing server start-up failures (port in use / stale postmaster.pid / shared memory), match: [postgres-startup-failure, postmaster-pid]}
      - {id: pg-ss-removeipc, name: systemd-logind RemoveIPC removing shared memory and semaphores, match: [removeipc]}
      - {id: pg-ss-spoofing, name: Preventing server spoofing (unix_socket_directories / requirepeer / verify-full), match: [server-spoofing, unix-socket-directories]}
      - {id: pg-ss-ssh-tunnel, name: Secure TCP/IP connections with SSH tunnels, match: [ssh-tunnel-postgres]}
  - id: pg-configuration
    name: Server configuration (postgresql.conf / GUCs)
    source: PostgreSQL docs 19 Server Configuration
    match: [postgresql-conf, alter-system]
    subtopics:
      - {id: pg-cf-contexts, name: Parameter contexts / reload vs restart / pending_restart, match: [pending-restart, pg-reload-conf, parameter-context]}
      - {id: pg-cf-logging, name: Error reporting and logging (log_line_prefix / log_min_duration_statement / jsonlog), match: [log-line-prefix, log-min-duration-statement, jsonlog]}
      - {id: pg-cf-connections, name: Connections and timeouts (max_connections / statement_timeout / idle timeouts), match: [max-connections, statement-timeout, idle-session-timeout]}
      - {id: pg-cf-memory, name: Resource consumption - memory (shared_buffers / work_mem), match: [shared-buffers, work-mem]}
      - {id: pg-cf-planner, name: Query planning cost constants, match: [random-page-cost, effective-io-concurrency]}
      - {id: pg-cf-include, name: Configuration file includes (include_dir / conf.d), match: [include-dir]}
      - {id: pg-cf-pg-settings, name: Inspecting settings with pg_settings and pg_file_settings, match: [pg-settings, pg-file-settings]}
      - {id: pg-cf-parallel, name: Parallel query workers (max_worker_processes / max_parallel_workers_per_gather), match: [max-parallel-workers, parallel-query]}
      - {id: pg-cf-maintenance-mem, name: maintenance_work_mem and autovacuum_work_mem, match: [maintenance-work-mem]}
      - {id: pg-cf-jit, name: JIT compilation settings (jit / jit_above_cost), match: [postgres-jit]}
      - {id: pg-cf-locks, name: Lock management (deadlock_timeout / max_locks_per_transaction), match: [max-locks-per-transaction, deadlock-timeout]}
  - id: pg-client-auth
    name: Client authentication (pg_hba.conf)
    source: PostgreSQL docs 20 Client Authentication
    match: [pg-hba-conf, client-authentication]
    subtopics:
      - {id: pg-ca-scram, name: Password authentication with SCRAM-SHA-256, match: [scram-sha-256, password-encryption]}
      - {id: pg-ca-ssl, name: Secure TCP/IP connections with SSL (hostssl / sslmode), match: [postgres-ssl, sslmode, hostssl]}
      - {id: pg-ca-cert, name: Certificate authentication, match: [cert-authentication, clientcert]}
      - {id: pg-ca-ident-ldap, name: User name maps and LDAP authentication, match: [pg-ident-conf, ldap-authentication]}
      - {id: pg-ca-hba-order, name: pg_hba.conf record matching order and pg_hba_file_rules, match: [pg-hba-file-rules]}
      - {id: pg-ca-peer, name: Peer and ident authentication for local connections, match: [peer-authentication]}
      - {id: pg-ca-gssapi, name: GSSAPI / Kerberos authentication, match: [gssapi-authentication, kerberos]}
      - {id: pg-ca-problems, name: Troubleshooting authentication failures (no pg_hba.conf entry / password authentication failed), match: [no-pg-hba-entry, authentication-failed]}
      - {id: pg-ca-pam-radius, name: PAM and RADIUS authentication, match: [pam-authentication]}
      - {id: pg-ca-md5-migration, name: Migrating stored passwords from md5 to SCRAM, match: [md5-to-scram]}
  - id: pg-roles
    name: Database roles and privileges
    source: PostgreSQL docs 21 Database Roles + 5.8 Privileges
    match: [database-roles, role-privileges]
    subtopics:
      - {id: pg-ro-membership, name: Role membership / INHERIT / SET ROLE, match: [role-membership, set-role]}
      - {id: pg-ro-default-privs, name: ALTER DEFAULT PRIVILEGES, match: [alter-default-privileges]}
      - {id: pg-ro-predefined, name: Predefined roles (pg_read_all_data / pg_monitor), match: [predefined-roles, pg-monitor-role]}
      - {id: pg-ro-rls, name: Row security policies, match: [row-level-security]}
      - {id: pg-ro-attributes, name: Role attributes (LOGIN / CREATEROLE / BYPASSRLS / CONNECTION LIMIT / VALID UNTIL), match: [role-attributes, connection-limit]}
      - {id: pg-ro-drop, name: Dropping roles with REASSIGN OWNED and DROP OWNED, match: [reassign-owned, drop-owned]}
      - {id: pg-ro-secdef, name: SECURITY DEFINER functions and safe search_path, match: [security-definer]}
      - {id: pg-ro-column, name: Column-level privileges, match: [column-privileges]}
      - {id: pg-ro-public-schema, name: Public schema privileges and revoking CREATE from PUBLIC, match: [public-schema]}
      - {id: pg-ro-pgaudit, name: Session and object audit logging with pgAudit, match: [pgaudit]}
  - id: pg-databases-locale
    name: Managing databases and localization
    source: PostgreSQL docs 22 Managing Databases + 23 Localization
    match: [managing-databases, postgres-tablespaces]
    subtopics:
      - {id: pg-db-templates, name: Template databases and createdb, match: [template-databases, createdb]}
      - {id: pg-db-tablespaces, name: Tablespaces, match: [tablespace]}
      - {id: pg-db-search-path, name: Schemas and search_path, match: [search-path]}
      - {id: pg-db-collation, name: Collation support / ICU / glibc collation-version changes, match: [icu-collation, collation-version, glibc-collation]}
      - {id: pg-db-config, name: Per-database and per-role settings (ALTER DATABASE SET / ALTER ROLE SET), match: [alter-database-set, alter-role-set]}
      - {id: pg-db-drop, name: Dropping a database with active connections (DROP DATABASE WITH FORCE), match: [drop-database-force]}
      - {id: pg-db-encoding, name: Character set encodings and client_encoding conversion, match: [client-encoding, server-encoding]}
      - {id: pg-db-nondeterministic, name: Nondeterministic collations for case-insensitive comparison, match: [nondeterministic-collation]}
      - {id: pg-db-locale-provider, name: Locale providers (libc / icu / builtin) and LC_COLLATE / LC_CTYPE, match: [locale-provider]}
  - id: pg-routine-maintenance
    name: Routine maintenance (vacuum / reindex / log files)
    source: PostgreSQL docs 24 Routine Database Maintenance Tasks
    match: [autovacuum, vacuum]
    subtopics:
      - {id: pg-rm-autovac-tuning, name: Per-table autovacuum tuning, match: [autovacuum-vacuum-scale-factor]}
      - {id: pg-rm-wraparound, name: Preventing transaction ID wraparound failures, match: [xid-wraparound]}
