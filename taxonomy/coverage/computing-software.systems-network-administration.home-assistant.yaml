# Coverage spec: home-assistant. Topics from the official docs section https://www.home-assistant.io/docs/ in sources.
subject: home-assistant
scope:
  category: computing-software
  field: systems-network-administration
  products: [home-assistant]
sources:
  - "https://www.home-assistant.io/docs/"
topics:
  - id: yaml-syntax-basics
    name: "YAML syntax basics"
    source: "https://www.home-assistant.io/docs/configuration/yaml/"
    match: [yaml, indentation, mapping]
  - id: yaml-common-errors
    name: "YAML common errors"
    source: "https://www.home-assistant.io/docs/configuration/yaml/"
    match: [tab-character, booleans, case-sensitive]
  - id: yaml-env-var-and-include
    name: "Environment variables and includes in YAML"
    source: "https://www.home-assistant.io/docs/configuration/yaml/"
    match: [env-var, include, core-install]
  - id: splitting-configuration
    name: "Splitting configuration"
    source: "https://www.home-assistant.io/docs/configuration/splitting_configuration/"
    match: [include, default-config, split]
  - id: multiple-top-level-keys
    name: "Multiple top-level keys"
    source: "https://www.home-assistant.io/docs/configuration/splitting_configuration/"
    match: [top-level-keys, labelled-keys, light-groups]
  - id: packages
    name: "Packages"
    source: "https://www.home-assistant.io/docs/configuration/packages/"
    match: [packages, include-dir-named, merge]
  - id: secrets-yaml
    name: "secrets.yaml"
    source: "https://www.home-assistant.io/docs/configuration/secrets/"
    match: [secrets, secret, password]
  - id: secrets-in-automations
    name: "Secrets in automations and scripts"
    source: "https://www.home-assistant.io/docs/configuration/secrets/"
    match: [read-only, automations-secret, ui-editor]
  - id: check-config-script
    name: "Configuration check script"
    source: "https://www.home-assistant.io/docs/tools/check_config/"
    match: [check-config, hass, fail-on-warnings]
  - id: securing-checklist
    name: "Securing Home Assistant"
    source: "https://www.home-assistant.io/docs/configuration/securing/"
    match: [security, mfa, updates]
  - id: remote-access-options
    name: "Remote access options"
    source: "https://www.home-assistant.io/docs/configuration/remote/"
    match: [remote-access, vpn, port-forwarding]
  - id: reverse-proxy-trust
    name: "Reverse proxy trust"
    source: "https://www.home-assistant.io/docs/configuration/remote/"
    match: [reverse-proxy, trusted-proxies, x-forwarded-for]
  - id: hostname-and-static-ip
    name: "Hostname and static IP address"
    source: "https://www.home-assistant.io/docs/configuration/network/"
    match: [hostname, static-ip, dhcp-reservation]
  - id: entity-naming
    name: "Entity naming"
    source: "https://www.home-assistant.io/docs/configuration/customizing-entities/"
    match: [entity-id, naming, rename]
  - id: helpers-overview
    name: "Helper kinds"
    source: "https://www.home-assistant.io/docs/configuration/helpers/"
    match: [helpers, input-boolean, utility-meter]
  - id: long-term-statistics
    name: "Long-term statistics"
    source: "https://www.home-assistant.io/docs/configuration/long-term-statistics/"
    match: [statistics, state-class, recorder]
  - id: events-and-state-changed
    name: "Events and state_changed"
    source: "https://www.home-assistant.io/docs/configuration/events/"
    match: [events, state-changed, call-service]
  - id: account-security
    name: "Account security and tokens"
    source: "https://www.home-assistant.io/docs/authentication/"
    match: [refresh-tokens, long-lived-token, password]
  - id: mfa-totp
    name: "TOTP multi-factor authentication"
    source: "https://www.home-assistant.io/docs/authentication/multi-factor-auth/"
    match: [totp, auth-mfa-modules, authenticator]
  - id: auth-providers
    name: "Authentication providers"
    source: "https://www.home-assistant.io/docs/authentication/providers/"
    match: [auth-providers, lockout, fallback]
  - id: trusted-networks
    name: "Trusted networks provider"
    source: "https://www.home-assistant.io/docs/authentication/providers/"
    match: [trusted-networks, allowlist, cidr]
  - id: automation-parts
    name: "Parts of an automation"
    source: "https://www.home-assistant.io/docs/automation/basics/"
    match: [trigger, condition, action]
  - id: automation-yaml
    name: "Automations in YAML"
    source: "https://www.home-assistant.io/docs/automation/yaml/"
    match: [automation-yaml, alias, automations-yaml]
  - id: trigger-ids
    name: "Trigger IDs"
    source: "https://www.home-assistant.io/docs/automation/trigger/"
    match: [trigger-id, multiple-triggers, id]
  - id: sun-trigger
    name: "Sun trigger"
    source: "https://www.home-assistant.io/docs/automation/trigger/"
    match: [sunset, offset, elevation]
  - id: webhook-trigger
    name: "Webhook trigger"
    source: "https://www.home-assistant.io/docs/automation/trigger/"
    match: [webhook, allowed-methods, local-only]
  - id: trigger-data
    name: "Trigger data"
    source: "https://www.home-assistant.io/docs/automation/trigger-data/"
    match: [trigger-data, trigger-idx, from-state]
  - id: automation-modes
    name: "Automation modes"
    source: "https://www.home-assistant.io/docs/automation/modes/"
    match: [mode, max-exceeded, queued]
  - id: durations
    name: "Durations"
    source: "https://www.home-assistant.io/docs/automation/durations/"
    match: [duration, for, delay]
  - id: testing-and-traces
    name: "Testing automations and traces"
    source: "https://www.home-assistant.io/docs/automation/testing/"
    match: [traces, run-actions, simulated-trigger]
  - id: blueprint-schema
    name: "Blueprint schema"
    source: "https://www.home-assistant.io/docs/blueprint/schema/"
    match: [blueprint, input, sections]
  - id: using-blueprints
    name: "Using blueprints"
    source: "https://www.home-assistant.io/docs/automation/using_blueprints/"
    match: [import-blueprint, take-control, reimport]
  - id: script-start-methods
    name: "Starting scripts"
    source: "https://www.home-assistant.io/docs/script/"
    match: [script-turn-on, wait, call-script]
  - id: script-fields-response
    name: "Script fields and responses"
    source: "https://www.home-assistant.io/docs/script/"
    match: [fields, response, stop]
  - id: template-syntax
    name: "Template syntax"
    source: "https://www.home-assistant.io/docs/templating/syntax/"
    match: [jinja, expressions, filters]
  - id: template-states
    name: "Reading states in templates"
    source: "https://www.home-assistant.io/docs/templating/states/"
    match: [states, state-attr, is-state]
  - id: template-conditions-loops
    name: "Template conditions and loops"
    source: "https://www.home-assistant.io/docs/templating/loops-and-conditions/"
    match: [if, for-loop, set]
  - id: template-dates-times
    name: "Dates and times in templates"
    source: "https://www.home-assistant.io/docs/templating/dates-and-times/"
    match: [now, strftime, today-at]
  - id: template-debugging
    name: "Debugging templates"
    source: "https://www.home-assistant.io/docs/templating/debugging/"
    match: [template-editor, tojson, typeof]
  - id: template-yaml-quoting
    name: "Templates in YAML"
    source: "https://www.home-assistant.io/docs/templating/yaml/"
    match: [quoting, value-template, multiline]
  - id: areas
    name: "Areas"
    source: "https://www.home-assistant.io/docs/organizing/areas/"
    match: [areas, aliases, rooms]
  - id: floors
    name: "Floors"
    source: "https://www.home-assistant.io/docs/organizing/floors/"
    match: [floors, level, targets]
  - id: labels
    name: "Labels"
    source: "https://www.home-assistant.io/docs/organizing/labels/"
    match: [labels, grouping, filtering]
  - id: energy-dashboard
    name: "Energy dashboard setup"
    source: "https://www.home-assistant.io/docs/energy/"
    match: [energy, riemann-sum, kwh]
  - id: dev-tools-reload
    name: "Reloading YAML configuration"
    source: "https://www.home-assistant.io/docs/tools/dev-tools/"
    match: [reload, dev-tools, restart]
