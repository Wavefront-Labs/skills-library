# Canonical coverage spec for d-language, drawn from external sources listed below.
subject: d-language
scope:
  category: computing-software
  field: software-engineering
  products:
  - d
sources:
- 'D language specification index (https://dlang.org/spec/spec.html): lexical, types, attributes, expressions, statements, declarations, templates, CTFE, memory, interop, traits and asm chapters'
- 'Phobos library reference (https://dlang.org/phobos/index.html): std.algorithm, std.range, std.array, std.string, std.file, std.stdio, std.json, std.datetime, std.format, std.regex, std.conv, std.concurrency,
  std.parallelism'
- 'DUB package manager documentation (https://dub.pm/): dub.sdl and dub.json settings, commands, configurations, build types'
- 'Programming in D by Ali Cehreli (https://ddili.org/ders/d.en/index.html): tutorial chapter order for fundamentals, ranges, templates, concurrency, memory'
- 'dlang.org articles and tools (https://dlang.org/dmd-windows.html, https://dlang.org/articles.html): dmd switches, rdmd, DIP1000, betterC, C++ interop, code coverage'
- 'code.dlang.org registry, vibe.d and Mir docs (https://vibed.org/, https://mir.dlang.io/): ecosystem libraries'
