  - id: objc-security
    name: "Security"
    source: "Apple Platform Security; Security framework reference; Secure Coding Guide"
    match: [objc-security]
    subtopics:
      - {id: objc-security-keychain-services, name: "Keychain Services", match: [keychain-services]}
      - {id: objc-security-code-signing-notarization, name: "Code signing, hardened runtime and notarization", match: [code-signing-notarization]}
