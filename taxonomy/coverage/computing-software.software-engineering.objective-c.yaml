      - {id: objc-debugging-exception-breakpoints, name: "Exception and symbolic breakpoints", match: [exception-breakpoints]}
      - {id: objc-debugging-oslog-logging, name: "os_log and NSLog logging", match: [oslog-logging]}
      - {id: objc-debugging-crash-symbolication, name: "Crash logs and dSYM symbolication", match: [crash-symbolication]}
  - id: objc-memory-tools
