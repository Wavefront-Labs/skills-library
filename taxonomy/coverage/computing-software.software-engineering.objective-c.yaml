      - {id: objc-style-lint-clang-tidy-objc, name: "clang-tidy Objective-C checks", match: [clang-tidy-objc]}
      - {id: objc-style-lint-naming-conventions, name: "Cocoa naming conventions", match: [naming-conventions]}
  - id: objc-static-analysis
