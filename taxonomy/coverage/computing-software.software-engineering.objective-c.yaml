  - id: objc-localization
    name: "Localization"
    source: "Apple: Localizing your app; Strings catalog"
    match: [objc-localization]
    subtopics:
      - {id: objc-localization-localizable-strings, name: "Localizable strings and NSLocalizedString", match: [localizable-strings]}
