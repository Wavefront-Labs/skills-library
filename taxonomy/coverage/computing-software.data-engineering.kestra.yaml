# Coverage spec: kestra. Topics from the Kestra docs (github.com/kestra-io/docs, published at kestra.io/docs).
subject: kestra
scope:
  category: computing-software
  field: data-engineering
  products: [kestra]
sources:
  - "Kestra docs (kestra.io/docs, source github.com/kestra-io/docs)"
topics:
  - id: install-docker
    name: "Run Kestra in a single Docker container"
    source: "https://kestra.io/docs/installation/docker"
    match: [docker, server-local, slim-image]
  - id: install-docker-compose
    name: "Install with Docker Compose and PostgreSQL"
    source: "https://kestra.io/docs/installation/docker-compose"
    match: [docker-compose, postgres, kestra-configuration]
  - id: install-kubernetes
    name: "Deploy on Kubernetes with Helm"
    source: "https://kestra.io/docs/installation/kubernetes"
    match: [kubernetes, helm, kestra-starter, dind]
  - id: install-standalone
    name: "Run the standalone JAR and systemd"
    source: "https://kestra.io/docs/installation/standalone-server"
    match: [standalone, jar, systemd]
  - id: system-requirements
    name: "Software and hardware requirements"
    source: "https://kestra.io/docs/administrator-guide/requirements"
    match: [requirements, read-committed, sizing]
  - id: configuration
    name: "Configuration files and environment variables"
    source: "https://kestra.io/docs/configuration/configuration-basics"
    match: [configuration, environment-variables, sdk-authentication]
  - id: flow-structure
    name: "Flow anatomy, revisions and drafts"
    source: "https://kestra.io/docs/workflow-components/flow"
    match: [flow, flow-properties, revisions, draft]
  - id: task-properties
    name: "Task types and common task properties"
    source: "https://kestra.io/docs/workflow-components/tasks"
    match: [tasks, runif, allowfailure, loglevel]
  - id: flow-inputs
    name: "Typed and validated flow inputs"
    source: "https://kestra.io/docs/workflow-components/inputs"
    match: [inputs, input-types, nested-inputs]
  - id: flow-outputs
    name: "Task and flow outputs"
    source: "https://kestra.io/docs/workflow-components/outputs"
    match: [outputs, outputvalues, flow-outputs]
  - id: flow-variables
    name: "Flow variables, render() and SetVariables"
    source: "https://kestra.io/docs/workflow-components/variables"
    match: [variables, vars, setvariables, render]
  - id: flow-labels
    name: "Labels on flows and executions"
    source: "https://kestra.io/docs/workflow-components/labels"
    match: [labels, labels-task, trigger-labels]
  - id: flow-checks
    name: "Pre-execution checks"
    source: "https://kestra.io/docs/workflow-components/checks"
    match: [checks, block-execution]
  - id: triggers-overview
    name: "Trigger types and shared trigger properties"
    source: "https://kestra.io/docs/workflow-components/triggers"
    match: [triggers, stopafter, failontriggererror, trigger-variables]
  - id: schedule-trigger
    name: "Schedule trigger, cron and timezone"
    source: "https://kestra.io/docs/workflow-components/triggers/schedule-trigger"
    match: [schedule, cron, timezone, trigger-date]
  - id: schedule-recovery-backfill
    name: "Missed schedules and backfill"
    source: "https://kestra.io/docs/workflow-components/triggers/schedule-trigger"
    match: [backfill, recovermissedschedules, catch-up]
  - id: webhook-trigger
    name: "Webhook trigger"
    source: "https://kestra.io/docs/workflow-components/triggers/webhook-trigger"
    match: [webhook, secret-key, fetchtype, trigger-body]
  - id: flow-trigger
    name: "Flow trigger with dependsOn"
    source: "https://kestra.io/docs/workflow-components/triggers/flow-trigger"
    match: [flow-trigger, dependson, satisfaction-mode, upstream-flows]
  - id: polling-trigger
    name: "Polling triggers"
    source: "https://kestra.io/docs/workflow-components/triggers/polling-trigger"
    match: [polling, interval, trigger-rows]
  - id: realtime-trigger
    name: "Realtime triggers and worker failover"
    source: "https://kestra.io/docs/workflow-components/triggers/realtime-trigger"
    match: [realtime, event-driven, termination-grace-period]
  - id: task-retries
    name: "Task retry policies"
    source: "https://kestra.io/docs/workflow-components/retries"
    match: [retry, maxattempts, exponential-backoff, global-retry]
  - id: flowable-flow-retries
    name: "Retries on flowable tasks and flows"
    source: "https://kestra.io/docs/workflow-components/retries"
    match: [retry-flowable, flow-level-retry, behavior]
  - id: error-handling
    name: "errors, allowFailure and allowWarning"
    source: "https://kestra.io/docs/workflow-components/errors"
    match: [errors, allowwarning, error-handler, taskswithstate]
  - id: finally-block
    name: "finally tasks"
    source: "https://kestra.io/docs/workflow-components/finally"
    match: [finally, cleanup, teardown]
  - id: after-execution
    name: "afterExecution tasks"
    source: "https://kestra.io/docs/workflow-components/afterexecution"
    match: [afterexecution, final-state]
  - id: task-timeout
    name: "Task timeouts"
    source: "https://kestra.io/docs/workflow-components/timeout"
    match: [timeout, iso-8601, runnable-tasks]
  - id: concurrency-limits
    name: "Flow concurrency limits"
    source: "https://kestra.io/docs/workflow-components/concurrency"
    match: [concurrency, queue, allowconcurrent, deadlock]
  - id: flow-sla
    name: "Service level agreements"
    source: "https://kestra.io/docs/workflow-components/sla"
    match: [sla, max-duration, execution-assertion]
  - id: subflows
    name: "Subflow task"
    source: "https://kestra.io/docs/workflow-components/subflows"
    match: [subflow, transmitfailed, kill-cascade]
  - id: execution-states
    name: "Execution and task run states"
    source: "https://kestra.io/docs/workflow-components/states"
    match: [execution-states, terminal-states, cancelled, killed]
  - id: flowable-control-tasks
    name: "Flowable tasks for branching and concurrency"
    source: "https://kestra.io/docs/workflow-components/tasks/flowable-tasks"
    match: [flowable, switch, if, dag, workingdirectory]
  - id: loop-task
    name: "Loop and LoopUntil"
    source: "https://kestra.io/docs/workflow-components/tasks/flowable-tasks"
    match: [loop, loopuntil, breakwhen, item-variables]
  - id: pause-task
    name: "Pause and approvals"
    source: "https://kestra.io/docs/workflow-components/tasks/flowable-tasks"
    match: [pause, approval, onresume]
  - id: parallel-sequential
    name: "Parallel and sequential task groups"
    source: "https://kestra.io/docs/how-to-guides/parallel-vs-sequential"
    match: [parallel, sequential, concurrent]
  - id: pebble-syntax
    name: "Pebble expression syntax"
    source: "https://kestra.io/docs/expressions/syntax"
    match: [pebble, expressions, operators, fallback]
  - id: context-variables
    name: "Execution context variables"
    source: "https://kestra.io/docs/expressions/context"
    match: [context, taskrun, envs, globals]
  - id: kv-store
    name: "KV Store"
    source: "https://kestra.io/docs/concepts/kv-store"
    match: [kv-store, kv-function, ttl]
  - id: secrets
    name: "Secrets and the secret() function"
    source: "https://kestra.io/docs/concepts/secret"
    match: [secrets, secret-function, oss]
  - id: namespace-files
    name: "Namespace files"
    source: "https://kestra.io/docs/concepts/namespace-files"
    match: [namespace-files, read-function, include-exclude]
  - id: internal-storage
    name: "Internal storage and fetchType"
    source: "https://kestra.io/docs/concepts/storage"
    match: [internal-storage, fetchtype, ion, execution-context]
  - id: system-flows
    name: "System flows"
    source: "https://kestra.io/docs/concepts/system-flows"
    match: [system-flows, system-namespace, maintenance]
  - id: script-vs-commands
    name: "Script versus Commands tasks"
    source: "https://kestra.io/docs/scripts/commands-vs-scripts"
    match: [script-task, commands-task, inline-code]
  - id: script-files
    name: "Script input and output files"
    source: "https://kestra.io/docs/scripts/input-output-files"
    match: [inputfiles, outputfiles, remote-runners]
  - id: script-outputs-metrics
    name: "Script outputs and metrics"
    source: "https://kestra.io/docs/scripts/outputs-metrics"
    match: [metrics, counter, timer, shell-markers]
  - id: script-dependencies
    name: "Installing script dependencies"
    source: "https://kestra.io/docs/scripts/installing-dependencies"
    match: [beforecommands, pip, requirements, prebuilt-images]
  - id: docker-task-runner
    name: "Docker task runner"
    source: "https://kestra.io/docs/task-runners/types/docker-task-runner"
    match: [task-runner, containerimage, insecure-registries]
  - id: server-components
    name: "Server components and roles"
    source: "https://kestra.io/docs/architecture/server-components"
    match: [architecture, executor, scheduler, worker, indexer]
  - id: high-availability
    name: "High availability"
    source: "https://kestra.io/docs/administrator-guide/high-availability"
    match: [high-availability, replicas, queue-backends, liveness]
  - id: prometheus-metrics
    name: "Prometheus metrics"
    source: "https://kestra.io/docs/administrator-guide/prometheus-metrics"
    match: [prometheus, monitoring, queue-lag]
  - id: purge
    name: "Purging executions, logs and storage"
    source: "https://kestra.io/docs/administrator-guide/purge"
    match: [purge, retention, dry-run]
  - id: backup-restore
    name: "Backup and restore"
    source: "https://kestra.io/docs/administrator-guide/backup-and-restore"
    match: [backup, restore, pg-dump]
  - id: upgrades
    name: "Upgrades and database migration"
    source: "https://kestra.io/docs/administrator-guide/upgrades"
    match: [upgrade, rollback, flyway, rolling-upgrade]
  - id: kestractl
    name: "kestractl command line"
    source: "https://kestra.io/docs/kestra-cli/kestractl"
    match: [kestractl, cli, contexts]
  - id: git-sync
    name: "Git sync and push tasks"
    source: "https://kestra.io/docs/version-control-cicd/git"
    match: [git, syncflows, pushflows, gitops]
  - id: github-actions
    name: "GitHub Actions CI/CD"
    source: "https://kestra.io/docs/version-control-cicd/cicd/github-action"
    match: [github-actions, cicd, validate-flows, deploy-flows]
  - id: replay
    name: "Replaying executions"
    source: "https://kestra.io/docs/how-to-guides/replay"
    match: [replay, recovery, correlation-id]
  - id: playground
    name: "Playground mode"
    source: "https://kestra.io/docs/ui/playground"
    match: [playground, iterative-development, cached-outputs]
