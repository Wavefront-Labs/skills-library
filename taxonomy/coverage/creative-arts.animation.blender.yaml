      - {id: pie-menus, name: Pie menus and pie menu add-ons, match: [pie-menus, pie-menu]}
      - {id: themes-ui-scale, name: Themes, resolution scale and interface preferences, match: [themes, ui-scale, resolution-scale, interface-preferences]}
