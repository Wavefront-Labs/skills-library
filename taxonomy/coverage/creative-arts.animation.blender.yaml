# Canonical coverage spec: Blender.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (the Blender Manual table of contents and
# the Blender Foundation Certified Trainer curriculum), not from what we happened to write.
# Subtopics (depth) come from the Blender Manual's page-level headings under each section: every
# modifier page, every node family, every brush family, every constraint page, every physics
# settings panel, every render settings group, every Python API module.
subject: blender
scope:
  category: creative-arts
  field: animation
  products: [blender]
sources:
  - "Blender 4.x Manual table of contents (docs.blender.org/manual/en/latest) - Getting Started, User Interface, Editors, Scenes & Objects, Modeling, Sculpting & Painting, Grease Pencil, Animation & Rigging, Physics, Rendering, Compositing, Motion Tracking & Masking, Video Editing, Files & Data System, Add-ons, Advanced (Python scripting, command line)"
  - "Blender 4.x Manual page-level headings (docs.blender.org/manual/en/latest) - modifiers/*, sculpt_paint/*/tools, animation/constraints/*, physics/*/settings, render/cycles/render_settings/*, render/eevee/render_settings/*, compositing/types/*, editors/*"
  - "Blender Python API reference (docs.blender.org/api/current) - bpy, bmesh, mathutils, gpu, blf, bpy.app.handlers, bpy.app.timers, add-on tutorial, best practices"
  - "Blender Foundation Certified Trainer (BFCT) programme syllabus - interface, modeling, materials/texturing, lighting, rendering, animation, rigging, simulation, compositing, video editing, scripting"
  - "Blender Studio training courses (studio.blender.org) - Fundamentals, Scripting for Artists, Procedural Shading, Geometry Nodes from Scratch, Stylized Rendering, Character Animation, Rigging"
  - "Blender Extensions Platform (extensions.blender.org) and bundled add-on list (Node Wrangler, Rigify, Bool Tool, Import-Export)"
