# Coverage spec for grafana-mimir, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: grafana-mimir
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [grafana-mimir]
sources:
  - "Grafana Mimir documentation (configure, set-up and manage sections)"
topics:
  - id: blocked-and-limited-queries
    name: "Blocked and limited queries"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-blocked-queries/"
    match: [blocked-queries, limited-queries, query-protection]
  - id: configuration-basics
    name: "Configuration basics"
    source: "https://grafana.com/docs/mimir/latest/configure/about-configurations/"
    match: [configuration, yaml, cli-flags]
  - id: custom-active-series-trackers
    name: "Custom active series trackers"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-custom-trackers/"
    match: [active-series, custom-trackers, ingester]
  - id: dns-service-discovery
    name: "Dns service discovery"
    source: "https://grafana.com/docs/mimir/latest/configure/about-dns-service-discovery/"
    match: [dns, service-discovery, memcached]
  - id: ha-deduplication
    name: "Ha deduplication"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-high-availability-deduplication/"
    match: [high-availability, ha-tracker, deduplication]
  - id: hardware-requirements
    name: "Hardware requirements"
    source: "https://grafana.com/docs/mimir/latest/set-up/hardware-requirements/"
    match: [hardware, disk, iops]
  - id: hash-rings-and-kv-store
    name: "Hash rings and kv store"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-hash-rings/"
    match: [hash-ring, memberlist, consul]
  - id: ingester-circuit-breakers
    name: "Ingester circuit breakers"
    source: "https://grafana.com/docs/mimir/latest/configure/about-ingester-circuit-breakers/"
    match: [circuit-breaker, ingester, push-requests]
  - id: kafka-ingest-storage
    name: "Kafka ingest storage"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-kafka-backend/"
    match: [ingest-storage, kafka, partitions]
  - id: metrics-storage-retention
    name: "Metrics storage retention"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-metrics-storage-retention/"
    match: [retention, compactor, object-storage]
  - id: native-histograms-ingestion
    name: "Native histograms ingestion"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-native-histograms-ingestion/"
    match: [native-histograms, remote-write, ingestion]
  - id: object-storage-backends
    name: "Object storage backends"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-object-storage-backend/"
    match: [object-storage, s3, gcs]
  - id: opentelemetry-collector-to-mimir
    name: "Opentelemetry collector to mimir"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-otel-collector/"
    match: [opentelemetry, otlp, collector]
  - id: out-of-order-samples
    name: "Out of order samples"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-out-of-order-samples-ingestion/"
    match: [out-of-order, ingestion, time-window]
  - id: owned-series-tracking
    name: "Owned series tracking"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-owned-series/"
    match: [owned-series, ingester, series-limits]
  - id: reverse-proxy-ip-logging
    name: "Reverse proxy ip logging"
    source: "https://grafana.com/docs/mimir/latest/configure/about-ip-address-logging/"
    match: [reverse-proxy, ip-logging, x-forwarded-for]
  - id: rolling-updates
    name: "Rolling updates"
    source: "https://grafana.com/docs/mimir/latest/manage/run-production-environment/perform-a-rolling-update/"
    match: [rolling-update, upgrade, ingesters]
  - id: runtime-configuration
    name: "Runtime configuration"
    source: "https://grafana.com/docs/mimir/latest/configure/about-runtime-configuration/"
    match: [runtime-config, overrides, per-tenant-limits]
  - id: scaling-out-and-in
    name: "Scaling out and in"
    source: "https://grafana.com/docs/mimir/latest/manage/run-production-environment/scaling-out/"
    match: [scaling, scale-down, ingesters]
  - id: shuffle-sharding
    name: "Shuffle sharding"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-shuffle-sharding/"
    match: [shuffle-sharding, tenant-isolation, shard-size]
  - id: tenant-ids
    name: "Tenant ids"
    source: "https://grafana.com/docs/mimir/latest/configure/about-tenant-ids/"
    match: [tenant-id, multitenancy, validation]
  - id: tracing
    name: "Tracing"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-tracing/"
    match: [tracing, opentelemetry, otlp]
  - id: tsdb-block-upload
    name: "Tsdb block upload"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-tsdb-block-upload/"
    match: [block-upload, backfill, tsdb]
  - id: versioning-and-compatibility
    name: "Versioning and compatibility"
    source: "https://grafana.com/docs/mimir/latest/configure/about-versioning/"
    match: [versioning, compatibility, deprecation]
  - id: zone-aware-replication
    name: "Zone aware replication"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-zone-aware-replication/"
    match: [zone-aware, replication, availability-zones]
  - id: mimirtool
    name: "Mimirtool CLI"
    source: "https://grafana.com/docs/mimir/latest/manage/tools/mimirtool/"
    match: [mimirtool]
  - id: query-sharding
    name: "Query sharding"
    source: "https://grafana.com/docs/mimir/latest/references/architecture/query-sharding/"
    match: [query-sharding]
  - id: architecture-components
    name: "Architecture components"
    source: "https://grafana.com/docs/mimir/latest/references/architecture/components/"
    match: [architecture, components]
  - id: caching
    name: "Caching and Memcached"
    source: "https://grafana.com/docs/mimir/latest/references/architecture/components/query-frontend/"
    match: [caching, memcached-cache]
  - id: planning-capacity
    name: "Planning capacity"
    source: "https://grafana.com/docs/mimir/latest/manage/run-production-environment/planning-capacity/"
    match: [capacity-planning]
  - id: production-tips
    name: "Production tips"
    source: "https://grafana.com/docs/mimir/latest/manage/run-production-environment/production-tips/"
    match: [production-tips]
  - id: authentication-authorization
    name: "Authentication and authorization"
    source: "https://grafana.com/docs/mimir/latest/manage/secure/authentication-and-authorization/"
    match: [authentication, authorization]
  - id: securing-communications-tls
    name: "Securing communications with TLS"
    source: "https://grafana.com/docs/mimir/latest/manage/secure/securing-communications-with-tls/"
    match: [mimir-tls]
  - id: ruler-and-alertmanager
    name: "Ruler and Alertmanager"
    source: "https://grafana.com/docs/mimir/latest/references/architecture/components/ruler/"
    match: [ruler, mimir-alertmanager]
  - id: helm-chart
    name: "Helm chart deployment"
    source: "https://grafana.com/docs/mimir/latest/set-up/helm-chart/"
    match: [mimir-helm]
  - id: migrate-from-thanos-or-prometheus
    name: "Migrating from Thanos or Prometheus"
    source: "https://grafana.com/docs/mimir/latest/set-up/migrate/migrate-from-thanos-or-prometheus/"
    match: [mimir-migration]
  - id: exemplars
    name: "Exemplars"
    source: "https://grafana.com/docs/mimir/latest/manage/use-exemplars/"
    match: [exemplars]
  - id: monitor-mimir
    name: "Monitoring Mimir"
    source: "https://grafana.com/docs/mimir/latest/manage/monitor-grafana-mimir/"
    match: [mimir-monitoring, mixin]
  - id: mirror-requests-second-cluster
    name: "Mirroring requests to a second cluster"
    source: "https://grafana.com/docs/mimir/latest/configure/mirror-requests-to-a-second-cluster/"
    match: [request-mirroring]
  - id: spread-minimizing-tokens
    name: "Spread-minimizing tokens"
    source: "https://grafana.com/docs/mimir/latest/configure/configure-spread-minimizing-tokens/"
    match: [spread-minimizing-tokens]
  - id: encrypting-data-at-rest
    name: "Encrypting data at rest"
    source: "https://grafana.com/docs/mimir/latest/manage/secure/encrypting-data-at-rest/"
    match: [encryption-at-rest]
  - id: securing-alertmanager
    name: "Securing Alertmanager"
    source: "https://grafana.com/docs/mimir/latest/manage/secure/securing-alertmanager/"
    match: [alertmanager-security]
  - id: query-tee
    name: "Query-tee"
    source: "https://grafana.com/docs/mimir/latest/manage/tools/query-tee/"
    match: [query-tee]
