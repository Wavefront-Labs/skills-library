# Canonical coverage spec: Networking (Cisco IOS, Wireshark, vendor-neutral design, DNS/DHCP).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (Cisco CCNA 200-301 v1.1 and CCNP ENCOR
# 350-401 v1.1 exam topics, CompTIA Network+ N10-009 objectives, the Wireshark User's Guide ToC and
# WCNA exam domains, the ISC BIND 9 and Kea Administrator Reference Manuals, and the RFC families
# they implement), not from what we happened to write.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (exam objective
# sub-bullets, manual chapter sections, RFC sections, CLI sub-commands).
subject: networking
scope:
  category: computing-software
  field: systems-network-administration
  products: [cisco-networking, wireshark, network-design, dns-dhcp]
sources:
  - "Cisco CCNA 200-301 v1.1 exam topics - 1.0 Network Fundamentals (1.1 components, 1.2 topology architectures, 1.3 physical interface and cabling, 1.4 interface and cable issues, 1.5 TCP vs UDP, 1.6 IPv4 addressing and subnetting, 1.7 private IPv4, 1.8-1.9 IPv6 addressing and types, 1.10 client OS IP parameters, 1.11 wireless principles, 1.12 virtualization, 1.13 switching concepts); 2.0 Network Access (2.1 VLANs, 2.2 trunking, 2.3 CDP/LLDP, 2.4 EtherChannel LACP, 2.5 Rapid PVST+, 2.6 wireless architectures and AP modes, 2.7 WLAN physical infrastructure, 2.8 AP and WLC management access, 2.9 WLAN GUI configuration); 3.0 IP Connectivity (3.1 routing table, 3.2 forwarding decision, 3.3 static routing, 3.4 single-area OSPFv2, 3.5 FHRP); 4.0 IP Services (4.1 NAT, 4.2 NTP, 4.3 DHCP and DNS, 4.4 SNMP, 4.5 syslog, 4.6 DHCP client and relay, 4.7 QoS PHB, 4.8 SSH, 4.9 TFTP/FTP); 5.0 Security Fundamentals (5.1 threats, 5.2 security program, 5.3 device access control, 5.4 password policy, 5.5 IPsec VPNs, 5.6 ACLs, 5.7 Layer 2 security, 5.8 AAA, 5.9 wireless security protocols, 5.10 WLAN WPA2 PSK); 6.0 Automation (6.1-6.4 controller-based and SDN, 6.5 REST APIs, 6.6 Ansible/Terraform, 6.7 JSON)"
  - "Cisco CCNP ENCOR 350-401 v1.1 exam topics - 1.0 Architecture (enterprise design tiers, high availability, SD-WAN, SD-Access, QoS, switching mechanisms CEF/TCAM); 2.0 Virtualization (hypervisors, VRF, GRE and IPsec tunnelling, LISP, VXLAN); 3.0 Infrastructure (Layer 2 trunking/EtherChannel/STP and MST, EIGRP vs OSPF, OSPF multi-area and summarisation, eBGP best path and neighbours, policy-based routing, wireless RF, AP modes, roaming, IP services NTP/PTP, NAT/PAT, FHRP HSRP/VRRP, multicast PIM/IGMP); 4.0 Network Assurance (debugs and conditional debugs, ping/traceroute, SNMP, syslog, NetFlow/Flexible NetFlow, SPAN/RSPAN/ERSPAN, IP SLA, Catalyst Center workflows, NETCONF/RESTCONF); 5.0 Security (device access control lines/passwords/AAA, infrastructure security ACLs and CoPP, REST API security, wireless security EAP/WebAuth/PSK, threat defence components, 802.1X/MAB/WebAuth); 6.0 Automation (Python, JSON, YANG, NETCONF/RESTCONF, APIs for Catalyst Center and SD-WAN, EEM applets, Ansible/Chef/Puppet)"
  - "CompTIA Network+ N10-009 exam objectives - 1.0 Networking Concepts (1.1 OSI model, 1.2 appliances/applications/functions, 1.3 cloud concepts, 1.4 ports/protocols/services, 1.5 transmission media and transceivers, 1.6 topologies/architectures/types, 1.7 IPv4 addressing, 1.8 evolving use cases); 2.0 Network Implementation (2.1 routing technologies, 2.2 switching technologies, 2.3 wireless devices and technologies, 2.4 physical installations); 3.0 Network Operations (3.1 organisational processes and documentation, 3.2 network monitoring technologies, 3.3 disaster recovery, 3.4 IPv4/IPv6 network services, 3.5 network access and management methods); 4.0 Network Security (4.1 security concepts, 4.2 attack types, 4.3 security features/defence techniques); 5.0 Network Troubleshooting (5.1 methodology, 5.2 cabling and physical interface issues, 5.3 network services issues, 5.4 performance issues, 5.5 tools and protocols)"
  - "Wireshark User's Guide (wireshark.org/docs/wsug_html_chunked) - 4 Capturing Live Network Data (interfaces, capture options, ring buffers, capture filters, remote capture, link-layer header), 5 File Input/Output and Printing (open/save/merge/import from hex dump/export specified packets/export objects/print), 6 Working With Captured Packets (marking, ignoring, time display formats, time reference, filtering, display filter macros, finding packets, Follow Stream, expert information, TCP analysis), 7 Advanced Topics (packet reassembly, name resolution, checksums, TLS decryption), 8 Statistics (capture file properties, resolved addresses, protocol hierarchy, conversations, endpoints, packet lengths, I/O graphs, service response time, DHCP/BOOTP, ONC-RPC, 29West, flow graph, expert info, HTTP, TCP stream graphs), 9 Telephony (VoIP calls, RTP analysis/player, SIP flows, LTE/MTP3), 10 Wireless (Bluetooth, WLAN traffic), 11 Customizing (preferences, configuration profiles, user table, Decode As, coloring rules, Lua), Appendix D command-line tools (tshark, dumpcap, capinfos, rawshark, editcap, mergecap, text2pcap, reordercap); plus wireshark-filter(4) display filter reference and pcap-filter(7)"
  - "Wireshark Certified Network Analyst (WCNA) exam domains - Wireshark functionality, TCP/IP network communications, network troubleshooting, packet analysis of common protocols (ARP, ICMP, UDP, TCP, DHCP, DNS, HTTP, TLS), network forensics/security (scanning, malware, suspicious traffic), performance analysis (latency, window issues, packet loss)"
  - "ISC BIND 9 Administrator Reference Manual (bind9.readthedocs.io) - 3 Configurations and Zone Files (authoritative, resolver, load balancing, zone file RRs, SOA, TTLs), 4 Advanced DNS Features (notify, dynamic update/nsupdate, IXFR, split DNS/views, TSIG, SIG(0), DNSSEC, DoT/DoH, DNS64, Response Policy Zones, catalog zones, rate limiting), 5 DNSSEC guide (dnssec-policy, key rollovers, validation, troubleshooting with delv), 6 Security Configurations (ACLs, chroot, file system permissions), 7 Troubleshooting (common problems, SERVFAIL, logging), 8 Configuration reference (options, view, zone, logging channels/categories, statistics-channels), 9 rndc/dig/delv/named-checkconf/named-checkzone manual pages"
  - "ISC Kea Administrator Reference Manual (kea.readthedocs.io) - Installation, Kea configuration (JSON, includes, config-backend), Managing Kea (keactrl, systemd), Lease database (memfile/MySQL/PostgreSQL), DHCPv4 server (subnets, pools, shared networks, options and custom option definitions, client classification, host reservations, DDNS, relay/option 82, lease lifetimes), DHCPv6 server (IA_NA/IA_PD prefix delegation, DUIDs, rapid commit), DHCP-DDNS server (D2, TSIG), Control Agent and REST API, Hooks libraries (high availability, lease commands, host commands, flex-id, stat commands), Statistics, Logging, Migrating from ISC DHCP (KEA Migration Assistant keama)"
  - "IETF RFC families - DNS RFC 1034/1035 (concepts and implementation), RFC 2181 (clarifications), RFC 2308 (negative caching), RFC 2136 (UPDATE), RFC 1995/1996 (IXFR/NOTIFY), RFC 8945 (TSIG), RFC 4033-4035 and 9364 (DNSSEC), RFC 5155 (NSEC3), RFC 7858/8484 (DoT/DoH), RFC 7816/9156 (QNAME minimisation), RFC 9460 (SVCB/HTTPS), RFC 8659 (CAA); DHCP RFC 2131/2132 (DHCPv4 and options), RFC 3046 (relay agent information option 82), RFC 8415 (DHCPv6), RFC 4861/4862/8106 (IPv6 ND/SLAAC/RDNSS); email auth RFC 7208 (SPF), 6376 (DKIM), 7489 (DMARC), 8461 (MTA-STS); addressing RFC 1918, 6598, 4193, 6177; QoS RFC 4594/2474"
topics:
  # ============ Cisco IOS & enterprise networking (CCNA 200-301, ENCOR 350-401) ============
  - id: ios-device-management
    name: IOS CLI configuration and file management
    source: CCNA 4.9 / ENCOR 4.0
    match: [ios-cli, running-config, startup-config, ios-file-system]
    subtopics:
      - {id: ios-config-archive-rollback, name: Configuration archive and configure replace rollback, match: [configure-replace, config-archive, config-rollback]}
      - {id: ios-show-filtering, name: Filtering show output with include/section/begin, match: [show-section, output-modifiers]}
      - {id: ios-image-upgrade, name: IOS XE upgrade in install mode, match: [install-mode, ios-xe-upgrade, software-upgrade]}
      - {id: ios-password-recovery, name: Password recovery via ROMMON and config register, match: [password-recovery, rommon, config-register]}
      - {id: ios-tftp-scp-transfer, name: Copying images and configs with TFTP/FTP/SCP and verifying hashes, match: [tftp, scp-server, verify-md5]}
      - {id: ios-commit-confirm, name: Safe remote changes with reload in and commit timers, match: [reload-in, safe-remote-change]}
      - {id: ios-alias-macros, name: CLI aliases and interface range macros, match: [ios-alias, interface-range-macro]}
      - {id: ios-boot-system, name: Boot variables and bundle vs install boot, match: [boot-system, boot-variable]}
      - {id: ios-flash-management, name: Flash housekeeping (dir/delete/install remove inactive), match: [flash-management, install-remove-inactive]}
      - {id: ios-config-diff, name: Comparing configs with show archive config differences, match: [config-diff, show-archive-differences]}
      - {id: ios-zero-touch, name: Zero-touch provisioning and Cisco PnP, match: [zero-touch-provisioning, cisco-pnp]}
      - {id: ios-smart-licensing, name: Smart Licensing Using Policy and boot levels, match: [smart-licensing, license-boot-level]}
      - {id: ios-tech-support, name: Collecting show tech-support/crashinfo/core files for TAC, match: [show-tech-support, crashinfo]}
  - id: interface-cable-issues
    name: Interface and cable issues (collisions/errors/duplex/speed)
