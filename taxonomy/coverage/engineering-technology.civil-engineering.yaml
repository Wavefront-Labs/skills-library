# Canonical coverage spec: civil engineering (whole field), from exam blueprints, BoK and standard textbooks named in sources.
subject: civil-engineering
scope:
  category: engineering-technology
  field: civil-engineering
  products: [civil-3d, hec-ras, plaxis, geotechnical-engineering, hydraulic-hydrologic-design, stormwater-drainage-design, transportation-highway-design, pavement-design, site-grading-earthworks]
sources:
  - "NCEES PE Civil exam specifications (construction, geotechnical, structural, transportation, water resources and environmental depth modules) and FE Civil specification"
  - "ASCE Civil Engineering Body of Knowledge, 3rd edition; ABET general and civil program criteria"
  - "Das Principles of Geotechnical Engineering; Coduto Geotechnical Engineering; Terzaghi Peck and Mesri Soil Mechanics in Engineering Practice"
  - "Chow Open-Channel Hydraulics; Chin Water-Resources Engineering; Mays Hydrology and Water Resources; Chaudhry Open-Channel Flow"
  - "AASHTO A Policy on Geometric Design of Highways and Streets; Highway Capacity Manual; Austroads Guide to Road Design; Garber and Hoel Traffic and Highway Engineering"
  - "FHWA HEC-22 HEC-24 HEC-RAS manuals; USACE HEC-RAS Hydraulic Reference Manual; Autodesk Civil 3D and PLAXIS user documentation"
  - "AASHTO Pavement Design Guide; Huang Pavement Analysis and Design; Nicholas and Hamblen Construction Planning and Methods; Peurifoy Construction Planning Equipment and Methods"
