    source: Premiere Pro/Resolve Edit page - effects and speed changes
    match: [edit-effects]
    subtopics:
      - {id: ef-retime, name: Speed changes, time remapping and frame blending, match: [time-remap]}
      - {id: ef-dissolves, name: Dissolves, dips and transition conventions, match: [dissolves]}
      - {id: ef-nested, name: Nested sequences and compound clips, match: [nested-sequences]}
      - {id: ef-temp-comp, name: Temp comps and split screens in the cut, match: [temp-comp]}
