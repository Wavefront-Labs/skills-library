      - {id: nle-media-management, name: Media management, relinking and consolidation, match: [media-management, relink-media]}
      - {id: nle-bins, name: Bin structure and naming for an animation show, match: [bin-structure]}
  - id: trimming
    name: Trimming and timeline editing tools
