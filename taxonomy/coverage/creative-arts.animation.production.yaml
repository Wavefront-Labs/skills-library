# Canonical coverage spec: Animation production (post, delivery and pipeline crafts).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (Producing Animation chapters, the VES
# Handbook pipeline chapters, the Adobe After Effects / Animate user guide ToCs, the Toon Boom
# Harmony docs ToC, the Substance 3D Painter docs ToC, FFmpeg docs, Netflix/YouTube delivery
# specs, ACES/OCIO docs, audio-post curricula and loudness standards, ElevenLabs docs, and the
# Ayon/OpenPype and ShotGrid developer docs), not from what we happened to write.
# Subtopics (depth) come from those sources' own sub-sections: manual page headings, spec
# sections, chapter sub-sections and API module lists.
subject: animation-production
scope:
  category: creative-arts
  field: animation
  products: [editorial, editing, color, sound-design, voice-tts, vector-graphics, scripting, encode-delivery, texturing, motion-graphics, pipeline]
sources:
  - "Producing Animation, 3rd ed. (Winder, Dowlatabadi, Miller-Zarneke) - chapters on development, budgeting, scheduling, crew planning, pre-production, production (layout, animation, FX, lighting), post-production (editorial, sound, music, colour), outsourcing, delivery and archiving"
  - "The VES Handbook of Visual Effects, 3rd ed. - pipeline and data management chapters (asset management, versioning, naming, storage, render farm, colour management, review, interchange formats Alembic/USD/OpenEXR, digital intermediate and delivery)"
  - "Adobe After Effects User Guide ToC (helpx.adobe.com/after-effects/user-guide.html) - Projects and compositions, Layers and properties, Animation and keyframes (graph editor, interpolation), Text, Shape layers, Masks/mattes/keying, Tracking, 3D, Expressions, Scripting, Essential Graphics/mogrt, Rendering and exporting"
  - "Adobe Animate User Guide ToC (helpx.adobe.com/animate/user-guide.html) - Drawing tools, Symbols and library, Tweening (classic, motion, shape), Asset export, Publishing, JSFL scripting"
  - "Toon Boom Harmony documentation ToC (docs.toonboom.com) - Drawing, Colour palettes, Ink and paint, Rigging with pegs and deformers, Node view, Drawing substitution, Scripting"
  - "Adobe Substance 3D Painter docs ToC (helpx.adobe.com/substance-3d-painter) - Project configuration, Texture sets, UDIM, Baking, Layers and masks, Generators, Smart materials and masks, Anchor points, Exporting and export presets, PBR guide"
  - "FFmpeg documentation (ffmpeg.org/documentation.html) - ffmpeg/ffprobe manuals, filters, codecs (libx264, libx265, prores_ks, dnxhd, libsvtav1), formats (hls, dash, image2), colour tagging; plus x264/x265 rate-control docs and VMAF docs"
  - "Netflix Partner Help Center delivery specs (IMF, ProRes, audio and loudness, timed text style guide), YouTube recommended upload encoding settings, EBU R128 / ITU-R BS.1770 / ATSC A/85, DPP AS-11, SMPTE ST 2067 IMF, DCI DCP spec"
  - "ACES documentation (docs.acescentral.com) - ACES2065-1, ACEScg, ACEScct, IDT/RRT/ODT, CTL; OpenColorIO docs (opencolorio.readthedocs.io) - config authoring, looks, display/view; DaVinci Resolve Reference Manual colour page chapters (primaries, secondaries, qualifiers, windows, tracking, scopes, HDR, gallery, LUTs)"
  - "Audio post-production curricula (Purcell, Dialogue Editing for Motion Pictures; Viers, The Sound Effects Bible; Avid Pro Tools 110/210P post courses) - dialogue edit, ADR, foley, effects, backgrounds, music edit, re-recording mix, stems, M and E, deliverables"
  - "ElevenLabs docs (elevenlabs.io/docs) - text-to-speech, voice settings, voice cloning (instant/professional), pronunciation dictionaries, speech-to-speech, dubbing; Coqui XTTS and Piper docs; Rhubarb Lip Sync docs; Montreal Forced Aligner docs"
  - "Ayon/OpenPype developer docs (ayon.ynput.io), Pyblish docs, Rez docs, Autodesk Flow Production Tracking (ShotGrid) Python API and Toolkit docs, Kitsu docs, OpenUSD docs (openusd.org) composition arcs, Alembic docs, OpenRV docs, OpenTimelineIO docs, MPA/TPN content security best practices"
topics:
