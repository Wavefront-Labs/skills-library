    name: Animation editorial department workflow
    source: Producing Animation/Editorial
    match: [editorial-department, editorial-workflow]
    subtopics:
      - {id: ed-shot-breakdown, name: Breaking the animatic into numbered shots with frame counts, match: [shot-breakdown]}
      - {id: ed-turnover, name: Turnover packages from editorial to layout and animation, match: [editorial-turnover]}
      - {id: ed-cut-in-shots, name: Cutting in layout and animation versions over boards, match: [cut-in-shots]}
      - {id: ed-sweatbox, name: Sweatbox and director review sessions in the cutting room, match: [sweatbox]}
      - {id: ed-change-list, name: Change lists after a recut sent to departments, match: [change-list]}
  - id: animatic-production
    name: Animatic and story reel production
    source: Producing Animation/Story and editorial
    match: [animatic, story-reel]
    subtopics:
      - {id: an-scratch-vo, name: Recording and cutting scratch dialogue, match: [scratch-vo]}
      - {id: an-temp-music, name: Temp music and temp-track risk, match: [temp-music]}
      - {id: an-camera-moves, name: Faking camera moves and pans on boards in the animatic, match: [animatic-camera-moves]}
      - {id: an-animatic-sfx, name: Temp sound effects in the animatic, match: [animatic-sfx]}
  - id: nle-project-setup
