# Coverage spec: docusaurus. Topics from the Docusaurus docs (facebook/docusaurus, website/docs).
subject: docusaurus
scope:
  category: computing-software
  field: web-development
  products: [docusaurus]
sources:
  - "Docusaurus docs (github.com/facebook/docusaurus/tree/main/website/docs)"
topics:
  - id: scaffold-and-project-structure
    name: "Scaffold a site and project structure"
    source: "https://docusaurus.io/docs/installation"
    match: [create-docusaurus, scaffold, installation, project-structure]
  - id: dev-server
    name: "CLI: start the dev server"
    source: "https://docusaurus.io/docs/cli"
    match: [docusaurus-start, dev-server]
  - id: build-and-serve
    name: "CLI: build and serve"
    source: "https://docusaurus.io/docs/cli"
    match: [docusaurus-build, docusaurus-serve]
  - id: clear-and-heading-id-commands
    name: "CLI: clear and write-heading-ids"
    source: "https://docusaurus.io/docs/cli"
    match: [docusaurus-clear, write-heading-ids]
  - id: write-translations-command
    name: "CLI: write-translations"
    source: "https://docusaurus.io/docs/cli"
    match: [write-translations, i18n-json]
  - id: config-file
    name: "Configuration file syntax and site config"
    source: "https://docusaurus.io/docs/configuration"
    match: [docusaurus-config, site-config, site-metadata, custom-fields]
  - id: babel-and-bundler
    name: "Babel and bundler configuration"
    source: "https://docusaurus.io/docs/configuration"
    match: [babel, rspack, swc-loader]
  - id: plugins-and-presets
    name: "Plugins, themes and presets"
    source: "https://docusaurus.io/docs/using-plugins"
    match: [plugins, presets, themes, preset-classic, module-shorthands]
  - id: sidebar-items
    name: "Sidebar item types"
    source: "https://docusaurus.io/docs/sidebar/items"
    match: [sidebar-items, sidebar-category, generated-index, sidebar-shorthand]
  - id: sidebar-collapsing
    name: "Collapsible sidebar categories"
    source: "https://docusaurus.io/docs/sidebar/items"
    match: [collapsible, collapsed]
  - id: autogenerated-sidebars
    name: "Autogenerated sidebars and metadata"
    source: "https://docusaurus.io/docs/sidebar/autogenerated"
    match: [autogenerated, category-json, sidebar-position, number-prefix, category-index]
  - id: sidebar-usage
    name: "Sidebar setup, multiple sidebars, theme options"
    source: "https://docusaurus.io/docs/sidebar"
    match: [sidebarpath, multiple-sidebars, displayed-sidebar, hideable-sidebar]
  - id: doc-pagination
    name: "Doc pagination"
    source: "https://docusaurus.io/docs/sidebar/using-sidebars"
    match: [pagination-next, pagination-prev]
  - id: create-docs
    name: "Create a doc, front matter and tags"
    source: "https://docusaurus.io/docs/create-doc"
    match: [create-doc, doc-tags, doc-front-matter]
  - id: doc-ids-and-slugs
    name: "Doc IDs, slugs and URLs"
    source: "https://docusaurus.io/docs/create-doc"
    match: [doc-id, slug, doc-url]
  - id: docs-versioning
    name: "Docs versioning"
    source: "https://docusaurus.io/docs/versioning"
    match: [docs-version, versions-json, lastversion, docsversiondropdown]
  - id: docs-multi-instance-and-modes
    name: "Docs multi-instance, docs-only and blog-only modes"
    source: "https://docusaurus.io/docs/docs-introduction"
    match: [multi-instance, docs-only-mode, blog-only-mode]
  - id: pages
    name: "Creating pages"
    source: "https://docusaurus.io/docs/creating-pages"
    match: [src-pages, react-page, markdown-page]
  - id: blog-posts
    name: "Blog posts, truncation and dates"
    source: "https://docusaurus.io/docs/blog"
    match: [blog-post, truncate-marker, blog-date]
  - id: blog-authors-tags
    name: "Blog authors, tags and reading time"
    source: "https://docusaurus.io/docs/blog"
    match: [blog-authors, blog-tags, reading-time]
  - id: blog-feeds
    name: "Blog feeds"
    source: "https://docusaurus.io/docs/blog"
    match: [rss, atom, json-feed]
  - id: multiple-blogs
    name: "Multiple blogs"
    source: "https://docusaurus.io/docs/blog"
    match: [multiple-blogs, second-blog]
  - id: admonitions
    name: "Admonitions"
    source: "https://docusaurus.io/docs/markdown-features/admonitions"
    match: [admonitions, custom-admonition]
  - id: tabs
    name: "Tabs"
    source: "https://docusaurus.io/docs/markdown-features/tabs"
    match: [tabs, tabitem, tabs-groupid]
  - id: code-blocks
    name: "Code blocks: titles, themes, languages"
    source: "https://docusaurus.io/docs/markdown-features/code-blocks"
    match: [code-title, prism-theme, additionallanguages, npm2yarn]
  - id: code-highlighting
    name: "Code block line highlighting and magic comments"
    source: "https://docusaurus.io/docs/markdown-features/code-blocks"
    match: [highlight-next-line, magiccomments, line-ranges]
  - id: live-codeblock
    name: "Live code blocks"
    source: "https://docusaurus.io/docs/markdown-features/code-blocks"
    match: [live-codeblock, react-live]
  - id: mdx-and-react
    name: "MDX and React in Markdown"
    source: "https://docusaurus.io/docs/markdown-features/react"
    match: [mdx, mdxcomponents, partials, global-scope]
  - id: headings-and-toc
    name: "Headings, anchors and table of contents"
    source: "https://docusaurus.io/docs/markdown-features/toc"
    match: [heading-ids, table-of-contents, toc-heading-levels]
  - id: markdown-assets
    name: "Assets in Markdown, inline SVG, themed images"
    source: "https://docusaurus.io/docs/markdown-features/assets"
    match: [assets, inline-svg, themedimage]
  - id: markdown-links
    name: "Markdown links"
    source: "https://docusaurus.io/docs/markdown-features/links"
    match: [markdown-links, file-path-links]
  - id: head-metadata
    name: "Head metadata"
    source: "https://docusaurus.io/docs/markdown-features/head-metadata"
    match: [head-metadata, head-tag]
  - id: remark-rehype
    name: "Remark and rehype plugins"
    source: "https://docusaurus.io/docs/markdown-features/plugins"
    match: [remark-plugins, rehype-plugins, custom-remark-plugin]
  - id: math
    name: "Math equations"
    source: "https://docusaurus.io/docs/markdown-features/math-equations"
    match: [katex, math-equations]
  - id: diagrams
    name: "Diagrams"
    source: "https://docusaurus.io/docs/markdown-features/diagrams"
    match: [mermaid, diagrams]
  - id: swizzling
    name: "Swizzling theme components"
    source: "https://docusaurus.io/docs/swizzling"
    match: [swizzle, eject, wrap]
  - id: static-assets
    name: "Static assets"
    source: "https://docusaurus.io/docs/static-assets"
    match: [static-folder, static-directories, usebaseurl]
  - id: search
    name: "Search with Algolia DocSearch"
    source: "https://docusaurus.io/docs/search"
    match: [search, algolia, docsearch]
  - id: seo
    name: "SEO, metadata and robots"
    source: "https://docusaurus.io/docs/seo"
    match: [seo, headtags, robots-txt, noindex]
  - id: i18n-config
    name: "i18n configuration"
    source: "https://docusaurus.io/docs/i18n/tutorial"
    match: [i18n, locales, localedropdown]
  - id: i18n-react
    name: "Translate React code"
    source: "https://docusaurus.io/docs/i18n/tutorial"
    match: [translate-component, translate-function, plurals]
  - id: i18n-content-deploy
    name: "Translate content and deploy locales"
    source: "https://docusaurus.io/docs/i18n/tutorial"
    match: [i18n-content, multi-domain, hreflang]
  - id: deploy-github-pages
    name: "Deploy to GitHub Pages"
    source: "https://docusaurus.io/docs/deployment"
    match: [github-pages, docusaurus-deploy, github-actions]
