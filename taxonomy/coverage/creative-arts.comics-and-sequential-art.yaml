# Canonical coverage spec: comics and sequential art (all products in the field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external structures: the chapter/sub-section lists of the
# standard craft texts (McCloud, Eisner, the DC Comics Guides, Lexicon of Comicana), the Clip Studio
# Paint official user guide contents, WEBTOON CANVAS creator resources, lettering style guides
# (Blambot, Comicraft, Todd Klein) and printer file-preparation guides. Never from the library itself.
# Print production topics sit under the products that own the file (colouring, lettering, CSP export).
subject: comics-and-sequential-art
scope:
  category: creative-arts
  field: comics-and-sequential-art
  products: [comic-scripting, page-layout-and-pencilling, inking, comic-colouring, lettering, cartooning-and-strips, manga, webcomics, clip-studio-paint]
sources:
  - "Scott McCloud, Understanding Comics (1993) chapters - 1 Setting the Record Straight, 2 The Vocabulary of Comics (iconic abstraction, picture plane), 3 Blood in the Gutter (closure, six panel transitions), 4 Time Frames (panel shape/time, motion lines), 5 Living in Line (expressive line), 6 Show and Tell (seven word/picture combinations), 7 The Six Steps, 8 A Word About Color"
  - "Scott McCloud, Making Comics (2006) chapters - 1 Writing with Pictures (choice of moment, frame, image, word, flow), 2 Stories for Humans (character design, facial expressions, body language), 3 The Power of Words, 4 World Building, 5 Tools Techniques and Technology"
  - "Will Eisner, Comics and Sequential Art (1985) and Graphic Storytelling and Visual Narrative (1996) - Imagery, Timing, The Frame, Expressive Anatomy, Writing and Sequential Art, Application"
  - "Dennis O'Neil, The DC Comics Guide to Writing Comics (2001) - full script vs plot (Marvel method), story structure, series and continuity, character, the editor"
  - "Klaus Janson, The DC Comics Guide to Pencilling Comics (2002) and The DC Comics Guide to Inking Comics (2003) - anatomy, perspective, layouts, storytelling, camera; inking tools, line, textures, feathering, corrections"
  - "Mark Chiarello and Todd Klein, The DC Comics Guide to Coloring and Lettering Comics (2004) - colour theory, flatting, separations, digital rendering, print; hand and digital lettering, balloons, captions, SFX, logos"
  - "Gary Martin, The Art of Comic Book Inking; Stan Lee and John Buscema, How to Draw Comics the Marvel Way; Mort Walker, The Lexicon of Comicana; Ivan Brunetti, Cartooning: Philosophy and Practice; Hirohiko Araki, Manga in Theory and Practice"
  - "Clip Studio Paint Official User Guide contents (help.clip-studio.com) - Creating and saving files, Pens and brushes, Rulers, Figures and frame borders, Tones, Text and balloons, 3D, Fill, Using color (Colorize), Materials, Comics and webtoons (story editor, page management, multi-page export, webtoon export)"
  - "WEBTOON CANVAS Creator's Resource Handbook and help-centre specs (image width/height, thumbnails); Tapas creator guides; Kickstarter creator handbook"
  - "Lettering standards - Blambot Comic Book Grammar and Tradition, Comicraft (comicbookfonts.com) font conventions, Todd Klein's lettering blog"
  - "Print production - IngramSpark File Creation Guide (trim, bleed, PDF/X, colour), printer comic specs for saddle-stitch and perfect binding, standard US comic trim"
