# Coverage spec: podman. Topics from the official docs ToC in sources.
subject: podman
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [podman]
sources:
  - "https://docs.podman.io/en/latest/markdown/"
topics:
  - id: commit-container-to-image
    name: "Commit container to image"
    source: "https://docs.podman.io/en/latest/markdown/podman-commit.1.html"
    match: [podman-commit, change, image-format]
  - id: container-checkpoint-and-migration-image
    name: "Container checkpoint and migration image"
    source: "https://docs.podman.io/en/latest/markdown/podman-container-checkpoint.1.html"
    match: [checkpoint, criu, container-migration]
  - id: events-journald-integration
    name: "Events journald integration"
    source: "https://docs.podman.io/en/latest/markdown/podman-events.1.html"
    match: [podman-events, journalctl, journald-identifiers]
  - id: events-monitoring-and-filters
    name: "Events monitoring and filters"
    source: "https://docs.podman.io/en/latest/markdown/podman-events.1.html"
    match: [podman-events, events-logger, journald]
  - id: generate-systemd-deprecated-units
    name: "Generate systemd deprecated units"
    source: "https://docs.podman.io/en/latest/markdown/podman-generate-systemd.1.html"
    match: [generate-systemd, deprecated, unit-files]
  - id: generate-systemd-templates-and-kube-service
    name: "Generate systemd templates and kube service"
    source: "https://docs.podman.io/en/latest/markdown/podman-generate-systemd.1.html"
    match: [generate-systemd, template, env]
  - id: podman-cp-copy-rules
    name: "Podman cp copy rules"
    source: "https://docs.podman.io/en/latest/markdown/podman-cp.1.html"
    match: [podman-cp, copy, tar-stream]
  - id: quadlet-artifact-unit
    name: "Quadlet artifact unit"
    source: "https://docs.podman.io/en/latest/markdown/podman-systemd.unit.5.html"
    match: [quadlet, artifact-unit, oci-artifact]
  - id: quadlet-build-unit
    name: "Quadlet build unit"
    source: "https://docs.podman.io/en/latest/markdown/podman-systemd.unit.5.html"
    match: [quadlet, build-unit, imagetag]
  - id: quadlet-cli-install-and-applications
