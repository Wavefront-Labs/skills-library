# Coverage spec: kustomize. Topics from the official docs in sources.
subject: kustomize
scope:
  category: computing-software
  field: devops-ci-cd
  products: [kustomize]
sources:
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/resource/"
  - "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/bases/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/components/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patchesjson6902/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/openapi/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patchesstrategicmerge/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/images/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/namespace/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/builtins/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/nameprefix/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/namesuffix/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/labels/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/commonlabels/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/commonannotations/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replicas/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/configmapgenerator/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/secretgenerator/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/generatoroptions/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/helmcharts/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replacements/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/vars/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/crds/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/buildmetadata/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/sortoptions/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/build/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/create/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/localize/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/version/"
  - "https://kubectl.docs.kubernetes.io/references/kustomize/glossary/"
topics:
  - id: kustomization-file-structure
    name: "Kustomization file structure"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/"
    match: [kustomization, krm, resources, generators, transformers, validators]
  - id: build-stage-ordering
    name: "Build stage ordering"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/"
    match: [order, resources, generators, transformers, validators, build]
  - id: convenience-fields-as-transformers
    name: "Convenience fields as transformers"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/"
    match: [transformers, plugins, builtin, prefixsuffixtransformer]
  - id: resources-field
    name: "resources field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/resource/"
    match: [resources, kustomization, files, directories]
  - id: remote-resource-urls
    name: "Remote resource URLs"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/resource/"
    match: [remote, git, url, ref, timeout]
  - id: overlays-and-bases
    name: "Overlays and bases"
    source: "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"
    match: [overlay, base, layout, environments]
  - id: bases-field-deprecated
    name: "bases field deprecation"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/bases/"
    match: [bases, deprecated, resources, edit-fix]
  - id: components-field
    name: "components field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/components/"
    match: [components, compose, reusable, kustomization]
  - id: patches-field-overview
    name: "patches field overview"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/"
    match: [patches, strategic-merge, json6902, target]
  - id: patch-target-selectors
    name: "Patch target selectors"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/"
    match: [patches, target, labelselector, annotationselector, regex]
  - id: patch-inline-strategic-merge
    name: "Inline strategic merge patch"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/"
    match: [patches, strategic-merge, inline, deployment]
  - id: patch-json6902
    name: "JSON6902 patches"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/"
    match: [patches, json6902, rfc6902, target, path]
  - id: json6902-operations
    name: "JSON6902 operations"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patchesjson6902/"
    match: [json6902, add, replace, remove, copy, move, test]
  - id: patch-name-and-kind-changes
    name: "Changing name or kind with patches"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/"
    match: [patches, options, allownamechange, allowkindchange]
  - id: patch-custom-resources-openapi
    name: "Patching custom resources"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/openapi/"
    match: [patches, crd, openapi, merge-key, custom-resource]
  - id: patches-strategic-merge-deprecated
    name: "patchesStrategicMerge field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patchesstrategicmerge/"
    match: [patchesstrategicmerge, deprecated, delete, patches]
  - id: images-field
    name: "images field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/images/"
    match: [images, newname, newtag, digest]
  - id: images-edit-set-image-ci
    name: "Set image tags in CI"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/images/"
    match: [images, edit, set-image, ci, git-sha]
  - id: namespace-field
    name: "namespace field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/namespace/"
    match: [namespace, kustomization, transformer]
  - id: namespace-transformer-options
    name: "NamespaceTransformer options"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/builtins/"
    match: [namespacetransformer, unsetonly, setrolebindingsubjects, builtin]
  - id: name-prefix
    name: "namePrefix"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/nameprefix/"
    match: [nameprefix, names, references, transformer]
  - id: name-suffix
    name: "nameSuffix"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/namesuffix/"
    match: [namesuffix, names, hash, configmap]
  - id: labels-field
    name: "labels field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/labels/"
    match: [labels, pairs, selectors, includeselectors]
  - id: labels-selector-safety
    name: "Label changes and selector safety"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/labels/"
    match: [labels, selectors, immutability, deployment, includetemplates]
  - id: common-labels-deprecated
    name: "commonLabels deprecation"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/commonlabels/"
    match: [commonlabels, deprecated, labels, edit-fix]
  - id: common-annotations
    name: "commonAnnotations"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/commonannotations/"
    match: [commonannotations, annotations, metadata]
  - id: replicas-field
    name: "replicas field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replicas/"
    match: [replicas, scaling, deployment, statefulset]
  - id: configmap-generator-sources
    name: "configMapGenerator sources"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/configmapgenerator/"
    match: [configmapgenerator, files, literals, envs, configmap]
  - id: configmap-generator-behavior
    name: "configMapGenerator behavior"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/configmapgenerator/"
    match: [configmapgenerator, behavior, merge, replace, overlay]
  - id: generated-name-hash-suffix
    name: "Generated name hash suffix"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/configmapgenerator/"
    match: [hash, rollout, configmap, secret, name-suffix]
  - id: secret-generator
    name: "secretGenerator"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/secretgenerator/"
    match: [secretgenerator, secret, tls, type, base64]
  - id: generator-options
    name: "generatorOptions"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/generatoroptions/"
    match: [generatoroptions, labels, annotations, immutable, disablenamesuffixhash]
  - id: helm-charts-field
    name: "helmCharts field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/builtins/"
    match: [helmcharts, helm, enable-helm, inflation]
  - id: helm-globals-chart-home
    name: "helmGlobals and chartHome"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/builtins/"
    match: [helmglobals, charthome, confighome, helm]
  - id: helm-inflation-limits
    name: "Helm inflation support limits"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/helmcharts/"
    match: [helm, limits, krm-function, security]
  - id: replacements-overview
    name: "replacements overview"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replacements/"
    match: [replacements, source, targets, fieldpath]
  - id: replacements-field-paths
    name: "replacements field paths"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replacements/"
    match: [replacements, fieldpath, wildcard, list-index, regexp]
  - id: replacements-select-reject
    name: "replacements select and reject"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replacements/"
    match: [replacements, select, reject, regex]
  - id: replacements-delimiter-index
    name: "replacements delimiter and index"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replacements/"
    match: [replacements, delimiter, index, partial-string]
  - id: replacements-source-value-create
    name: "replacements sourceValue and create"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replacements/"
    match: [replacements, sourcevalue, create, options]
  - id: vars-deprecated-migration
    name: "Migrating vars to replacements"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/vars/"
    match: [vars, replacements, migration, edit-fix]
  - id: openapi-field
    name: "openapi field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/openapi/"
    match: [openapi, schema, kustomize-openapi, merge-key]
  - id: crds-field
    name: "crds field"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/crds/"
    match: [crds, custom-resource, namereference, transformer-config]
  - id: build-metadata
    name: "buildMetadata"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/buildmetadata/"
    match: [buildmetadata, managedbylabel, originannotations, transformerannotations]
  - id: sort-options
    name: "sortOptions"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/sortoptions/"
    match: [sortoptions, order, legacy, fifo, output]
  - id: kustomize-build-command
    name: "kustomize build"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/build/"
    match: [kustomize, build, hydrate, cli]
  - id: kubectl-kustomize-integration
    name: "kubectl -k integration"
    source: "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"
    match: [kubectl, apply, diff, delete, kustomize-flag]
  - id: kustomize-create
    name: "kustomize create"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/create/"
    match: [kustomize, create, init, scaffolding]
  - id: kustomize-localize
    name: "kustomize localize"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/localize/"
    match: [localize, remote, offline, alpha]
  - id: kustomize-version
    name: "kustomize version"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/cmd/version/"
    match: [kustomize, version, cli, troubleshooting]
  - id: edit-fix-migration
    name: "kustomize edit fix"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patchesstrategicmerge/"
    match: [edit, fix, migration, deprecations]
  - id: kustomization-root-and-load-restrictions
