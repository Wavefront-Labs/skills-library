    match: [root, load-restrictions, security, paths]
  - id: gitops-layout-practices
    name: "Layout practices for GitOps"
    source: "https://kubectl.docs.kubernetes.io/references/kustomize/glossary/"
    match: [gitops, layout, environments, base, overlays]
