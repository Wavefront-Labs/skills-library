    source: "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"
    match: [resources, patches, compose, replicas, memory]
  - id: images-task-example
    name: "Image override example"
    source: "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"
    match: [images, newname, newtag, registry]
