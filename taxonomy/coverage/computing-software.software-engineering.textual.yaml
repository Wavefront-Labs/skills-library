# Coverage spec: Textual. Topics from the Textual docs table of contents.
subject: Textual
scope:
  category: computing-software
  field: software-engineering
  products: [textual]
sources:
  - "Textual docs (textual.textualize.io)"
topics:
  - id: getting-started
    name: "Getting started and installation"
    source: "https://textual.textualize.io/getting_started/"
    match: [install, getting-started]
  - id: tutorial-stopwatch
    name: "Stopwatch tutorial"
    source: "https://textual.textualize.io/tutorial/"
    match: [tutorial, stopwatch]
  - id: app-class
    name: "The App class"
    source: "https://textual.textualize.io/guide/app/"
    match: [app, lifecycle]
  - id: screens
    name: "Screens and the screen stack"
    source: "https://textual.textualize.io/guide/screens/"
    match: [screens, screen-stack]
  - id: modal-screens
    name: "Modal screens and returning data"
    source: "https://textual.textualize.io/guide/screens/#modal-screens"
    match: [modal, screen-result]
  - id: modes
    name: "App modes"
    source: "https://textual.textualize.io/guide/screens/#modes"
    match: [modes, screens]
  - id: reactivity
    name: "Reactive attributes"
    source: "https://textual.textualize.io/guide/reactivity/"
    match: [reactive, watch]
  - id: data-binding
    name: "Data binding and compute methods"
    source: "https://textual.textualize.io/guide/reactivity/#data-binding"
    match: [data-binding, compute]
  - id: css-guide
    name: "Textual CSS"
    source: "https://textual.textualize.io/guide/CSS/"
    match: [css, stylesheets]
  - id: css-selectors
    name: "Selectors, combinators and specificity"
    source: "https://textual.textualize.io/guide/CSS/#selectors"
    match: [selectors, specificity]
  - id: css-variables-nesting
    name: "CSS variables and nesting"
    source: "https://textual.textualize.io/guide/CSS/#css-variables"
    match: [css-variables, nesting]
  - id: styles-guide
    name: "Styles object and inline styling"
    source: "https://textual.textualize.io/guide/styles/"
    match: [styles, colors]
  - id: layout-guide
    name: "Layout"
    source: "https://textual.textualize.io/guide/layout/"
    match: [layout, vertical, horizontal]
  - id: grid-layout
    name: "Grid layout"
    source: "https://textual.textualize.io/guide/layout/#grid"
    match: [grid, layout]
  - id: docking-layers
    name: "Docking, layers and offsets"
    source: "https://textual.textualize.io/guide/layout/#docking"
    match: [dock, layers, offset]
  - id: widgets-guide
    name: "Custom widgets"
    source: "https://textual.textualize.io/guide/widgets/"
    match: [widget, custom-widget]
  - id: compound-widgets
    name: "Compound widgets and coordination"
    source: "https://textual.textualize.io/guide/widgets/#compound-widgets"
    match: [compose, compound]
  - id: line-api
    name: "Line API rendering"
    source: "https://textual.textualize.io/guide/widgets/#line-api"
    match: [line-api, render-line]
  - id: events-guide
    name: "Events and messages"
    source: "https://textual.textualize.io/guide/events/"
    match: [events, messages]
  - id: custom-messages
    name: "Custom messages and handlers"
    source: "https://textual.textualize.io/guide/events/#custom-messages"
    match: [message-handlers, bubbling]
  - id: actions
    name: "Actions"
    source: "https://textual.textualize.io/guide/actions/"
    match: [actions, action-methods]
  - id: input-guide
    name: "Keyboard, focus and mouse input"
    source: "https://textual.textualize.io/guide/input/"
    match: [keyboard, focus, mouse]
  - id: bindings
    name: "Key bindings"
    source: "https://textual.textualize.io/guide/input/#bindings"
    match: [bindings, keys]
  - id: queries
    name: "DOM queries"
    source: "https://textual.textualize.io/guide/queries/"
    match: [query, dom]
  - id: animation
    name: "Animation"
    source: "https://textual.textualize.io/guide/animation/"
    match: [animate, easing]
  - id: workers
    name: "Workers and concurrency"
    source: "https://textual.textualize.io/guide/workers/"
    match: [workers, async]
  - id: command-palette
    name: "Command palette"
    source: "https://textual.textualize.io/guide/command_palette/"
    match: [command-palette, providers]
  - id: devtools
    name: "Devtools and console"
    source: "https://textual.textualize.io/guide/devtools/"
    match: [devtools, console, serve]
  - id: design-themes
    name: "Themes and design system"
    source: "https://textual.textualize.io/guide/design/"
    match: [theme, design-variables]
  - id: content-markup
    name: "Content and markup"
    source: "https://textual.textualize.io/guide/content/"
    match: [markup, content]
  - id: testing-guide
    name: "Testing apps with the pilot"
    source: "https://textual.textualize.io/guide/testing/"
    match: [testing, pilot]
  - id: snapshot-testing
    name: "Snapshot testing"
    source: "https://textual.textualize.io/guide/testing/#snapshot-testing"
    match: [snapshot, pytest]
  - id: how-to-center
    name: "How to center things"
    source: "https://textual.textualize.io/how-to/center-things/"
    match: [center, align]
  - id: how-to-design-layout
    name: "How to design a layout"
    source: "https://textual.textualize.io/how-to/design-a-layout/"
    match: [design-layout, containers]
  - id: how-to-containers
    name: "How to work with containers"
    source: "https://textual.textualize.io/how-to/work-with-containers/"
    match: [containers, scroll]
  - id: how-to-render-compose
    name: "How to render and compose"
    source: "https://textual.textualize.io/how-to/render-and-compose/"
    match: [render, compose]
  - id: how-to-hatch
    name: "How to package with Hatch"
    source: "https://textual.textualize.io/how-to/package-with-hatch/"
    match: [packaging, hatch]
  - id: widgets-buttons
    name: "Button, Switch, Checkbox and RadioButton"
    source: "https://textual.textualize.io/widgets/button/"
    match: [button, switch, checkbox]
  - id: widgets-text-input
    name: "Input, MaskedInput and TextArea"
    source: "https://textual.textualize.io/widgets/input/"
    match: [input, text-area]
  - id: widgets-selection
    name: "Select, SelectionList and OptionList"
    source: "https://textual.textualize.io/widgets/select/"
    match: [select, option-list]
  - id: widgets-data-table
    name: "DataTable"
    source: "https://textual.textualize.io/widgets/data_table/"
    match: [data-table, table]
  - id: widgets-trees
    name: "Tree and DirectoryTree"
    source: "https://textual.textualize.io/widgets/tree/"
    match: [tree, directory-tree]
  - id: widgets-tabs
    name: "Tabs, TabbedContent and ContentSwitcher"
    source: "https://textual.textualize.io/widgets/tabbed_content/"
    match: [tabs, tabbed-content]
  - id: widgets-markdown
    name: "Markdown and MarkdownViewer"
    source: "https://textual.textualize.io/widgets/markdown/"
    match: [markdown, viewer]
  - id: widgets-logs
    name: "Log and RichLog"
    source: "https://textual.textualize.io/widgets/log/"
    match: [log, rich-log]
  - id: widgets-progress
    name: "ProgressBar, LoadingIndicator and Sparkline"
    source: "https://textual.textualize.io/widgets/progress_bar/"
    match: [progress, sparkline]
  - id: widgets-display
    name: "Label, Static, Digits, Pretty and Rule"
    source: "https://textual.textualize.io/widgets/static/"
    match: [label, static, digits]
  - id: widgets-header-footer
    name: "Header and Footer"
    source: "https://textual.textualize.io/widgets/header/"
    match: [header, footer]
  - id: widgets-list-view
    name: "ListView and ListItem"
    source: "https://textual.textualize.io/widgets/list_view/"
    match: [list-view, list-item]
  - id: widgets-collapsible-toast
    name: "Collapsible and Toast"
    source: "https://textual.textualize.io/widgets/collapsible/"
    match: [collapsible, toast]
  - id: box-model-styles
    name: "Margin, padding, border and box sizing"
    source: "https://textual.textualize.io/styles/margin/"
    match: [margin, padding, border]
  - id: styles-reference
    name: "Styles reference index"
    source: "https://textual.textualize.io/styles/index/"
    match: [styles-reference, dimensions]
  - id: css-types
    name: "CSS types reference"
    source: "https://textual.textualize.io/css_types/index/"
    match: [css-types, scalar]
  - id: events-reference
    name: "Events reference"
    source: "https://textual.textualize.io/events/index/"
    match: [event-reference, mouse-events]
  - id: widget-gallery
    name: "Widget gallery"
    source: "https://textual.textualize.io/widget_gallery/"
    match: [gallery, widgets]
