# Canonical coverage spec: Docker and containers.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (the Docker Certified Associate domains,
# the Docker docs table of contents and the OCI specs), not from what we happened to write.
# Subtopics (depth) come from the sub-structure of those same sources: docs.docker.com manual page
# headings, the Dockerfile reference instruction list, the `docker` CLI sub-command reference and the
# Compose file reference sections.
subject: docker
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [docker]
sources:
  - "Docker Certified Associate (DCA) domains: Orchestration 25%, Image Creation/Management/Registry 20%, Installation and Configuration 15%, Networking 15%, Security 15%, Storage and Volumes 10%"
  - "docs.docker.com manuals table of contents: Get started, Dockerfile reference, Build (BuildKit, Bake, multi-platform, cache, attestations), Compose, Engine (storage drivers, logging, networking, security, daemon), Docker Hub/Scout, Desktop"
  - "OCI specifications: image-spec, runtime-spec, distribution-spec"
  - "Docker security docs: rootless mode, seccomp, AppArmor, user namespaces, content trust, Docker Bench"
  - "Subtopics: docs.docker.com manual page sub-headings, Dockerfile reference instruction list, docker CLI sub-command reference (docker run/build/network/volume/system/swarm/service), Compose file reference sections (services, networks, volumes, secrets, configs, include, profiles, develop)"
topics:
  # --- Images and Dockerfiles (DCA 20%; docs/Build)
  - id: dockerfile-instructions
    name: Dockerfile instructions and their semantics (RUN/CMD/ENTRYPOINT/COPY/ADD)
    source: docs/Dockerfile reference
    match: [dockerfile, entrypoint, cmd, copy, add, dockerfile-instructions]
    subtopics:
      - {id: run-forms, name: RUN shell vs exec form and RUN flags (--mount, --network, --security), match: [run-instruction, run-exec-form, shell-form]}
      - {id: cmd-entrypoint-interaction, name: CMD and ENTRYPOINT interaction table and overriding at run time, match: [cmd-vs-entrypoint, entrypoint-cmd-interaction, entrypoint-override]}
      - {id: copy-vs-add, name: COPY vs ADD, --chown/--chmod/--link, remote URLs and tar auto-extraction, match: [copy-vs-add, copy-chown, add-tar-extraction, copy-link]}
      - {id: workdir-shell-stopsignal-expose, name: WORKDIR, SHELL, STOPSIGNAL, EXPOSE and VOLUME instructions, match: [workdir, shell-instruction, stopsignal, volume-instruction]}
      - {id: onbuild-and-parser-directives, name: ONBUILD triggers and parser directives (syntax, escape), match: [onbuild, parser-directives, escape-directive]}
      - {id: from-platform-flag, name: FROM --platform flag and FROM AS stage naming rules, match: [from-platform-flag]}
      - {id: add-checksum-git, name: ADD --checksum, ADD git URLs and --keep-git-dir, match: [add-checksum, add-git-url, keep-git-dir]}
      - {id: copy-parents-exclude, name: COPY --parents and --exclude, match: [copy-parents, copy-exclude]}
      - {id: run-network-security-flags, name: RUN --network=none/host and --security=insecure entitlements, match: [run-network-none, run-security-insecure]}
  - id: multi-stage-builds
    name: Multi-stage builds
    source: docs/Build/Building/Multi-stage
    match: [multi-stage, multi-stage-build, multi-stage-builds, multistage]
    subtopics:
      - {id: named-stages-target, name: Naming stages and stopping at a stage with --target, match: [named-stages, build-target, target-stage]}
      - {id: copy-from-external-image, name: Using an external image as a stage with COPY --from=image, match: [copy-from-image, external-stage]}
      - {id: stage-inheritance-test-stage, name: Deriving stages from previous stages (test/lint stages), match: [stage-inheritance, test-stage]}
      - {id: stage-skipping-legacy-builder, name: BuildKit stage skipping vs legacy builder behaviour, match: [stage-skipping, legacy-builder]}
      - {id: parallel-stage-builds, name: Parallel independent stages in the BuildKit graph, match: [parallel-stages, build-graph]}
      - {id: build-output-artifacts, name: Exporting build artifacts from a stage with --output type=local, match: [output-type-local, export-artifacts]}
      - {id: conditional-stage-selection, name: Selecting stages by ARG in FROM (base-VARIANT pattern), match: [conditional-stage, stage-selection-arg]}
      - {id: dev-prod-stages, name: Separate dev and prod stages from one Dockerfile, match: [dev-prod-stages]}
  - id: layer-caching
    name: Layer ordering and build cache optimisation
    source: docs/Build/Cache
    match: [layer-caching, build-cache, cache-mount, layer-ordering, cache-invalidation]
    subtopics:
      - {id: dependency-manifest-ordering, name: Copy dependency manifests before source to maximise cache hits, match: [dependency-manifest-first, package-manifest-ordering]}
      - {id: run-cache-mount-sharing, name: RUN --mount=type=cache sharing modes, ids and uid/gid, match: [cache-mount-sharing, cache-mount-id]}
      - {id: no-cache-filter, name: --no-cache and --no-cache-filter for selective rebuilds, match: [no-cache, no-cache-filter]}
      - {id: build-cache-inspection-gc, name: Inspecting and pruning the builder cache (buildx du/prune, gc policy), match: [buildx-du, buildx-prune, cache-gc]}
      - {id: keep-layers-small, name: Keeping layers small (combined RUN, package cache cleanup), match: [apt-cache-cleanup, layer-size-reduction]}
      - {id: cache-key-rules, name: How COPY checksums, RUN text and ARG/ENV changes invalidate cache, match: [cache-key-rules, arg-cache-invalidation]}
      - {id: cache-busting, name: Deliberate cache busting (CACHEBUST arg, ADD remote URL, --no-cache-filter), match: [cache-bust]}
      - {id: cache-miss-debugging, name: Diagnosing cache misses with --progress=plain and build history, match: [cache-miss-debugging, progress-plain]}
  - id: image-slimming
    name: Image slimming, distroless and scratch bases
    source: docs/Build
    match: [image-slimming, distroless, scratch, small-images, image-size, alpine]
    subtopics:
      - {id: distroless-variants, name: Choosing distroless static/base/cc/debug variants, match: [distroless-variants, static-vs-base]}
      - {id: scratch-essentials, name: FROM scratch with CA certs, tzdata and passwd, match: [scratch-ca-certificates, scratch-passwd]}
      - {id: alpine-musl-pitfalls, name: Alpine musl pitfalls and glibc compatibility, match: [musl, alpine-pitfalls, glibc-compat]}
      - {id: wolfi-chainguard, name: Wolfi and Chainguard images, match: [wolfi, chainguard-images]}
      - {id: slim-variants, name: Debian slim variants and when to use them, match: [slim-variant, debian-slim]}
      - {id: strip-binaries-upx, name: Stripping binaries and UPX compression, match: [strip-binaries, upx]}
      - {id: slimtoolkit, name: slimtoolkit (docker-slim) dynamic minification, match: [slimtoolkit, docker-slim]}
      - {id: squash-layers, name: Squashing layers and its tradeoffs, match: [layer-squash, squash]}
  - id: base-image-selection
    name: Base image selection and pinning by digest
    source: docs/Build
    match: [base-image, base-images, digest-pinning, image-pinning]
    subtopics:
      - {id: official-and-verified-images, name: Docker Official Images and Verified Publishers, match: [official-images, verified-publisher, docker-official-images]}
      - {id: tag-plus-digest, name: Pinning tag@sha256 digests and keeping them readable, match: [sha256-digest, tag-plus-digest]}
      - {id: base-image-update-automation, name: Automating base image bumps (Renovate, Dependabot), match: [renovate-docker, dependabot-docker, base-image-updates]}
      - {id: base-image-lifecycle, name: Base image EOL and distro lifecycle planning, match: [base-image-eol, distro-lifecycle]}
      - {id: scout-base-recommendations, name: Docker Scout base image recommendations, match: [scout-recommendations, base-image-recommendation]}
      - {id: ubi-images, name: Red Hat UBI standard/minimal/micro base images, match: [ubi, ubi-minimal]}
      - {id: base-image-comparison, name: Comparing candidate bases by size, CVEs and packages, match: [base-image-comparison]}
      - {id: docker-hardened-images, name: Docker Hardened Images (DHI), match: [docker-hardened-images, dhi]}
  - id: dockerignore-context
    name: .dockerignore and build context
    source: docs/Build/Building/Context
    match: [dockerignore, build-context]
    subtopics:
      - {id: dockerignore-patterns, name: .dockerignore pattern syntax, negation and ** globs, match: [dockerignore-patterns, dockerignore-negation]}
      - {id: per-dockerfile-ignore, name: Per-Dockerfile ignore files (Dockerfile.dockerignore), match: [dockerfile-dockerignore, per-dockerfile-ignore]}
      - {id: remote-build-context, name: Git URL, tarball and stdin build contexts, match: [git-build-context, remote-context, stdin-context]}
      - {id: named-build-contexts, name: Named additional contexts with --build-context, match: [named-build-context, build-context-flag]}
      - {id: context-size-transfer, name: Diagnosing slow context transfer and oversized contexts, match: [context-size, context-transfer]}
      - {id: dockerignore-allowlist, name: Allowlist-style .dockerignore (* then ! exceptions), match: [dockerignore-allowlist]}
      - {id: context-secrets-leak, name: Keeping .git, .env and credentials out of the build context, match: [context-secrets-leak, dockerignore-secrets]}
      - {id: dockerfile-flag-stdin, name: -f Dockerfile outside the context and Dockerfile from stdin, match: [dockerfile-flag, dockerfile-stdin]}
  - id: buildkit-features
    name: BuildKit - secrets, SSH, mounts, heredocs
    source: docs/Build/BuildKit
    match: [buildkit, build-secrets, secret-mount, ssh-mount, bind-mount-build]
    subtopics:
      - {id: secret-env-and-file, name: Secret mounts as files vs env (--secret id=,env=), match: [secret-env, secret-file-mount]}
      - {id: ssh-agent-forwarding, name: SSH agent forwarding with --ssh and known_hosts, match: [ssh-default, ssh-forwarding]}
      - {id: heredocs, name: Heredoc syntax in RUN and COPY, match: [heredoc, heredoc-dockerfile]}
      - {id: run-bind-tmpfs-mounts, name: RUN --mount type=bind and type=tmpfs, match: [run-bind-mount, run-tmpfs-mount]}
      - {id: buildkitd-config, name: buildkitd.toml (gc, mirrors, insecure registries), match: [buildkitd-toml, buildkitd-config]}
      - {id: build-checks, name: docker build --check and Dockerfile lint rules, match: [build-checks, dockerfile-lint-checks]}
      - {id: buildx-debug, name: Interactive debugging of failed builds with buildx debug, match: [buildx-debug, build-debugging]}
      - {id: buildx-history, name: buildx history ls/inspect/logs/export, match: [buildx-history, build-history]}
  - id: multi-platform-builds
    name: Multi-platform/arm64 builds with buildx and QEMU
    source: docs/Build/Multi-platform
    match: [multi-platform, multi-arch, buildx, arm64, qemu, cross-platform]
    subtopics:
      - {id: binfmt-qemu-setup, name: Installing binfmt/QEMU emulation and its limits, match: [binfmt, qemu-emulation]}
      - {id: cross-compile-buildplatform, name: Cross-compiling with --platform=$BUILDPLATFORM stages, match: [cross-compilation, buildplatform]}
      - {id: multi-node-native-builders, name: Multi-node native builders with buildx create --append, match: [multi-node-builder, native-builders, buildx-append]}
      - {id: imagetools-manifest-lists, name: Creating and inspecting manifest lists with imagetools, match: [imagetools, manifest-list]}
      - {id: buildx-drivers, name: Choosing buildx drivers (docker, docker-container, kubernetes, remote), match: [buildx-drivers, docker-container-driver]}
      - {id: push-by-digest-merge, name: One platform per runner, push by digest, merge with imagetools create, match: [push-by-digest, merge-manifests]}
      - {id: load-multi-platform, name: Loading multi-platform images locally with the containerd store, match: [load-multi-platform]}
      - {id: targetarch-args, name: TARGETOS/TARGETARCH/TARGETVARIANT in RUN and download URLs, match: [targetarch, targetos]}
  - id: bake
    name: Docker Bake for multi-target builds
    source: docs/Build/Bake
    match: [bake, docker-bake, buildx-bake]
    subtopics:
      - {id: bake-targets-groups, name: Bake targets, groups and the default group, match: [bake-targets, bake-groups]}
      - {id: bake-variables-functions, name: Bake HCL variables, functions and target inheritance, match: [bake-variables, bake-functions, bake-inherits]}
      - {id: bake-matrix, name: Bake matrix targets, match: [bake-matrix]}
      - {id: bake-compose-input, name: Using a Compose file as Bake input, match: [bake-compose, bake-compose-file]}
      - {id: bake-set-print, name: Overriding with --set and debugging with --print, match: [bake-set, bake-print]}
      - {id: bake-contexts, name: Linking targets with contexts (target references), match: [bake-contexts, bake-target-context]}
      - {id: bake-action-ci, name: docker/bake-action in GitHub Actions with metadata files, match: [bake-action]}
      - {id: bake-output-cache, name: Per-target output, cache-to/from and attest in Bake, match: [bake-output, bake-cache]}
  - id: build-args-env
    name: Build args vs environment variables
    source: docs/Dockerfile reference
    match: [build-args, build-arg, arg, env, environment-variables]
    subtopics:
      - {id: predefined-args, name: Predefined ARGs (HTTP_PROXY, TARGETPLATFORM, BUILDPLATFORM), match: [predefined-args]}
      - {id: arg-before-from-scope, name: ARG before FROM and global ARG scope rules, match: [arg-before-from, arg-scope]}
      - {id: env-persistence-override, name: ENV persistence in the image and runtime -e overrides, match: [env-override, env-persistence]}
      - {id: secrets-in-args-leak, name: Why build args leak via docker history, match: [secrets-in-args]}
      - {id: variable-substitution, name: Dockerfile variable substitution forms (default, alt, substring), match: [dockerfile-variable-substitution, arg-default-value]}
      - {id: build-arg-from-env, name: --build-arg NAME passthrough from the environment and Compose args, match: [build-arg-from-env]}
      - {id: env-path, name: ENV PATH manipulation and multi-key ENV, match: [env-path, env-instruction]}
      - {id: tz-locale-env, name: Timezone and locale ENV (TZ, LANG) in images, match: [tz-env, locale-env]}
  - id: healthcheck-instruction
    name: HEALTHCHECK and container health
    source: docs/Dockerfile reference/HEALTHCHECK
    match: [healthcheck, health-check, container-health]
    subtopics:
      - {id: healthcheck-options, name: --interval/--timeout/--start-period/--start-interval/--retries tuning, match: [healthcheck-options, start-period, start-interval]}
      - {id: healthcheck-commands, name: Health commands without curl (wget, nc, app-native checks), match: [healthcheck-command, healthcheck-without-curl]}
      - {id: healthcheck-none-override, name: HEALTHCHECK NONE, --no-healthcheck and --health-cmd overrides, match: [healthcheck-none, health-cmd]}
      - {id: health-status-inspection, name: Reading State.Health, FailingStreak and health_status events, match: [health-status, failing-streak, health-status-event]}
      - {id: autoheal, name: Restarting unhealthy containers (autoheal), match: [autoheal, restart-unhealthy]}
      - {id: compose-healthcheck, name: healthcheck in Compose (test forms, disable, start_interval), match: [compose-healthcheck]}
      - {id: swarm-healthcheck, name: Healthchecks in Swarm task replacement and rolling updates, match: [swarm-healthcheck]}
      - {id: health-endpoint-design, name: Liveness vs readiness design for container health endpoints, match: [health-endpoint-design, readiness-check]}
  - id: pid1-signals-init
    name: PID 1, signal handling and init (tini)
    source: docs/Engine/Run
    match: [pid-1, pid1, signal-handling, tini, init, graceful-shutdown, zombie-processes]
    subtopics:
      - {id: zombie-reaping, name: Zombie reaping and subreapers without an init, match: [zombie-reaping, subreaper]}
      - {id: signal-forwarding-gosu, name: Dropping privileges and forwarding signals with gosu/su-exec, match: [gosu, su-exec, signal-forwarding]}
      - {id: stop-timeout, name: docker stop timeout and stop grace tuning, match: [stop-timeout, stop-grace]}
      - {id: init-flag, name: The --init flag and compose init true, match: [init-flag, docker-init-flag]}
      - {id: runtime-signal-quirks, name: npm start and JVM signal quirks, match: [npm-start-signals, jvm-sigterm]}
      - {id: shell-form-signals, name: Shell-form CMD swallowing SIGTERM and exec in wrapper scripts, match: [shell-form-signals, exec-in-entrypoint]}
      - {id: entrypoint-script-patterns, name: Entrypoint script patterns (set -e, exec "$@", first-arg checks), match: [entrypoint-script, exec-dollar-at]}
      - {id: dumb-init-s6, name: dumb-init and s6-overlay for multi-process containers, match: [dumb-init, s6-overlay]}
  - id: non-root-user
    name: Running as non-root USER and file ownership
    source: docs/Security
    match: [non-root, user-instruction, uid-gid, file-ownership, rootless-user]
    subtopics:
