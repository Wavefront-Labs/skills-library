      - {id: ghcr-source-label, name: org.opencontainers.image.source for GHCR repo linking, match: [ghcr-source-label]}
  - id: language-specific-images
    name: Language-specific image patterns (Node, Python, Go, Java, .NET)
    source: docs/Language-specific guides
    match: [node-image, python-image, go-image, java-image, dotnet-image, language-images]
    subtopics:
      - {id: node-patterns, name: Node images (npm ci, NODE_ENV, pruning dev deps), match: [node-image-patterns, npm-ci]}
      - {id: python-patterns, name: Python images (venv, uv, bytecode flags), match: [python-venv, uv]}
      - {id: go-patterns, name: Go static binaries with CGO_ENABLED=0, match: [go-static-binary, cgo-enabled]}
      - {id: java-patterns, name: Java images (jlink, layered jars), match: [jlink, spring-boot-layers]}
      - {id: dotnet-patterns, name: .NET sdk/runtime split and publish, match: [dotnet-publish, aspnet-runtime]}
      - {id: rust-patterns, name: Rust images (cargo-chef, musl targets), match: [cargo-chef, rust-musl]}
      - {id: ruby-php-patterns, name: Ruby and PHP-FPM images, match: [ruby-image, php-fpm-image]}
