      - {id: creating-users-in-dockerfile, name: Creating users per distro (adduser/useradd), match: [adduser, useradd-dockerfile]}
      - {id: run-user-group-add, name: docker run --user and --group-add overrides, match: [user-flag, group-add]}
      - {id: unprivileged-ports, name: Binding ports below 1024 as non-root, match: [unprivileged-ports, ip-unprivileged-port-start]}
      - {id: nonroot-writable-dirs, name: Writable directories and COPY --chown for non-root images, match: [nonroot-writable-dirs]}
      - {id: nonroot-tags-65532, name: nonroot image tags and UID 65532 in distroless/Chainguard, match: [uid-65532, nonroot-tag]}
      - {id: openshift-arbitrary-uid, name: OpenShift arbitrary UIDs and group-0 permissions, match: [arbitrary-uid, openshift-uid]}
      - {id: k8s-run-as-user-match, name: Matching image USER with runAsUser and fsGroup, match: [fsgroup, run-as-user]}
  - id: image-labels-metadata
    name: OCI image labels and metadata
