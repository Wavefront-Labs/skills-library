      - {id: nginx-spa, name: Static SPA builds served by unprivileged nginx, match: [nginx-spa, nginx-unprivileged]}
  - id: image-history-inspect
    name: Inspecting image layers and history (dive, inspect)
    source: DCA/Image Management
    match: [image-inspect, image-history, dive, layer-inspection]
    subtopics:
      - {id: docker-history-output, name: Reading docker history output, match: [docker-history]}
      - {id: dive-ci, name: dive efficiency scoring and CI mode, match: [dive-ci, dive-efficiency]}
      - {id: rootfs-diff-ids, name: RootFS layers and diff_ids vs manifest digests, match: [rootfs-layers, diff-ids]}
      - {id: remote-inspect, name: Inspecting remote images without pulling (skopeo, crane), match: [skopeo-inspect, crane-manifest]}
      - {id: layer-extraction, name: Extracting a single layer from an image, match: [layer-extraction, extract-layer]}
      - {id: image-config-inspect, name: Reading image Config (Entrypoint, Env, User, ExposedPorts), match: [image-config-inspect]}
      - {id: image-ls-filters, name: image ls filters, --format, --digests and --tree, match: [image-ls-filter, image-tree]}
      - {id: layer-secrets-audit, name: Auditing layers for leaked secrets and whiteout files, match: [layer-secrets-audit, whiteout]}
  # --- Registries and distribution (DCA 20%; OCI distribution)
  - id: registry-push-pull-tags
    name: Tagging, pushing, pulling and digests
    source: DCA/Registry
    match: [tagging, image-tags, tag-strategy, push, pull, digest, digests]
    subtopics:
