# Coverage spec: supabase. Topics from the official docs ToC (guides, CLI, self-hosting).
subject: supabase
scope:
  category: computing-software
  field: database-administration
  products: [supabase]
sources:
  - "https://supabase.com/docs"
topics:
  - id: rls-policies
    name: "Rls policies"
    source: "https://supabase.com/docs/guides/database/postgres/row-level-security"
    match: [rls, row-level-security, policies]
  - id: postgres-roles
    name: "Postgres roles"
    source: "https://supabase.com/docs/guides/database/postgres/roles"
    match: [roles, postgres-roles, authenticator]
  - id: database-functions
    name: "Database functions"
    source: "https://supabase.com/docs/guides/database/functions"
    match: [functions, security-definer, search-path]
  - id: database-triggers
    name: "Database triggers"
    source: "https://supabase.com/docs/guides/database/postgres/triggers"
    match: [triggers, tg-op, trigger-function]
  - id: postgres-extensions
    name: "Postgres extensions"
    source: "https://supabase.com/docs/guides/database/extensions"
    match: [extensions, extensions-schema, create-extension]
  - id: connection-modes-and-poolers
    name: "Connection modes and poolers"
    source: "https://supabase.com/docs/guides/database/connecting-to-postgres"
    match: [connections, pooler, transaction-mode]
  - id: full-text-search
    name: "Full text search"
    source: "https://supabase.com/docs/guides/database/full-text-search"
    match: [full-text-search, tsvector, tsquery]
  - id: database-webhooks
    name: "Database webhooks"
    source: "https://supabase.com/docs/guides/database/webhooks"
    match: [webhooks, pg-net, http-request]
  - id: email-password-auth
    name: "Email password auth"
    source: "https://supabase.com/docs/guides/auth/passwords"
    match: [email-password, sign-up, password-reset]
  - id: passwordless-magic-link-otp
    name: "Passwordless magic link otp"
    source: "https://supabase.com/docs/guides/auth/auth-email-passwordless"
    match: [magic-link, email-otp, passwordless]
  - id: auth-sessions
    name: "Auth sessions"
    source: "https://supabase.com/docs/guides/auth/sessions"
    match: [sessions, refresh-token, jwt-expiry]
  - id: jwts-and-signing-keys
    name: "Jwts and signing keys"
    source: "https://supabase.com/docs/guides/auth/jwts"
    match: [jwt, jwks, signing-keys]
  - id: multi-factor-auth
    name: "Multi factor auth"
    source: "https://supabase.com/docs/guides/auth/auth-mfa"
    match: [mfa, aal2, totp]
  - id: auth-hooks
    name: "Auth hooks"
    source: "https://supabase.com/docs/guides/auth/auth-hooks"
    match: [auth-hooks, custom-access-token, send-email]
  - id: redirect-urls
    name: "Redirect urls"
    source: "https://supabase.com/docs/guides/auth/redirect-urls"
    match: [redirect-urls, site-url, wildcards]
  - id: anonymous-sign-ins
    name: "Anonymous sign ins"
    source: "https://supabase.com/docs/guides/auth/auth-anonymous"
    match: [anonymous, link-identity, is-anonymous]
  - id: saml-sso
    name: "Saml sso"
    source: "https://supabase.com/docs/guides/auth/sso/auth-sso-saml"
    match: [saml, sso, attribute-mapping]
  - id: social-login-provider-tokens
    name: "Social login provider tokens"
    source: "https://supabase.com/docs/guides/auth/social-login"
    match: [social-login, oauth, provider-tokens]
  - id: storage-buckets-public-private
    name: "Storage buckets public private"
    source: "https://supabase.com/docs/guides/storage/buckets/fundamentals"
    match: [buckets, public-bucket, private-bucket]
  - id: storage-access-control
    name: "Storage access control"
    source: "https://supabase.com/docs/guides/storage/security/access-control"
    match: [access-control, storage-objects, foldername]
  - id: resumable-uploads
    name: "Resumable uploads"
    source: "https://supabase.com/docs/guides/storage/uploads/resumable-uploads"
    match: [resumable-uploads, tus, chunk-size]
  - id: standard-uploads
    name: "Standard uploads"
    source: "https://supabase.com/docs/guides/storage/uploads/standard-uploads"
    match: [uploads, upsert, content-type]
  - id: image-transformations
    name: "Image transformations"
    source: "https://supabase.com/docs/guides/storage/serving/image-transformations"
    match: [image-transformations, resize, imgproxy]
  - id: storage-s3-compatibility
    name: "Storage s3 compatibility"
    source: "https://supabase.com/docs/guides/storage/s3/compatibility"
    match: [s3, s3-protocol, multipart]
  - id: storage-cdn-caching
    name: "Storage cdn caching"
    source: "https://supabase.com/docs/guides/storage/cdn/fundamentals"
    match: [cdn, caching, cf-cache-status]
  - id: signed-urls-and-downloads
    name: "Signed urls and downloads"
    source: "https://supabase.com/docs/guides/storage/serving/downloads"
    match: [signed-url, create-signed-url, download]
  - id: realtime-broadcast
    name: "Realtime broadcast"
    source: "https://supabase.com/docs/guides/realtime/broadcast"
    match: [broadcast, httpsend, broadcast-changes]
  - id: realtime-presence
    name: "Realtime presence"
    source: "https://supabase.com/docs/guides/realtime/presence"
    match: [presence, track, presence-state]
  - id: realtime-postgres-changes
    name: "Realtime postgres changes"
    source: "https://supabase.com/docs/guides/realtime/postgres-changes"
    match: [postgres-changes, publication, replica-identity]
  - id: realtime-authorization
    name: "Realtime authorization"
    source: "https://supabase.com/docs/guides/realtime/authorization"
    match: [authorization, realtime-messages, private-channels]
  - id: realtime-limits
    name: "Realtime limits"
    source: "https://supabase.com/docs/guides/realtime/limits"
    match: [limits, quotas, too-many-joins]
  - id: edge-function-secrets
    name: "Edge function secrets"
    source: "https://supabase.com/docs/guides/functions/secrets"
    match: [secrets, env-file, default-secrets]
  - id: edge-function-deploy
    name: "Edge function deploy"
    source: "https://supabase.com/docs/guides/functions/deploy"
    match: [deploy, verify-jwt, ci]
  - id: edge-function-limits
    name: "Edge function limits"
    source: "https://supabase.com/docs/guides/functions/limits"
    match: [limits, cpu-time, memory]
  - id: edge-function-cors
    name: "Edge function cors"
    source: "https://supabase.com/docs/guides/functions/cors"
    match: [cors, preflight, withsupabase]
  - id: scheduled-edge-functions
    name: "Scheduled edge functions"
    source: "https://supabase.com/docs/guides/functions/schedule-functions"
    match: [pg-cron, schedule, pg-net]
  - id: edge-function-postgres
    name: "Edge function postgres"
    source: "https://supabase.com/docs/guides/functions/connect-to-postgres"
    match: [postgres, drizzle, ssl]
  - id: edge-function-background-tasks
    name: "Edge function background tasks"
    source: "https://supabase.com/docs/guides/functions/background-tasks"
    match: [background-tasks, waituntil, per-worker]
  - id: local-development-workflow
    name: "Local development workflow"
    source: "https://supabase.com/docs/guides/local-development/overview"
    match: [local-development, db-pull, db-push]
  - id: cli-config-api-and-db
    name: "Cli config api and db"
    source: "https://supabase.com/docs/guides/local-development/cli/config"
    match: [config-toml, cli-config, db-pooler]
  - id: cli-config-auth
    name: "Cli config auth"
    source: "https://supabase.com/docs/guides/local-development/cli/config"
    match: [auth-config, rate-limit, webauthn]
  - id: database-seeding
    name: "Database seeding"
    source: "https://supabase.com/docs/guides/local-development/seeding-your-database"
    match: [seeding, seed-sql, sql-paths]
  - id: database-testing-pgtap
    name: "Database testing pgtap"
    source: "https://supabase.com/docs/guides/local-development/testing/overview"
    match: [testing, pgtap, supabase-test-db]
  - id: managing-environments-ci
    name: "Managing environments ci"
    source: "https://supabase.com/docs/guides/deployment/managing-environments"
    match: [environments, staging, github-actions]
  - id: database-migrations
    name: "Database migrations"
    source: "https://supabase.com/docs/guides/deployment/database-migrations"
    match: [migrations, migration-repair, declarative-schema]
  - id: branching
    name: "Branching"
    source: "https://supabase.com/docs/guides/deployment/branching/overview"
    match: [branching, preview-branches, persistent-branches]
  - id: self-hosting-docker
    name: "Self hosting docker"
    source: "https://supabase.com/docs/guides/self-hosting/docker"
    match: [self-hosting, docker-compose, run-sh]
  - id: database-backups-pitr
    name: "Database backups pitr"
    source: "https://supabase.com/docs/guides/database/backups"
    match: [backups, pitr, wal-g]
  - id: vault-secrets
    name: "Vault secrets"
    source: "https://supabase.com/docs/guides/database/vault"
    match: [vault, decrypted-secrets, pgsodium]
