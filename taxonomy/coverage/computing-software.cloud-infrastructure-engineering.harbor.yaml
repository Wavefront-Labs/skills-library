# Coverage spec: harbor. Topics from the Harbor docs (goharbor.io/docs/main).
subject: harbor
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [harbor]
sources:
  - "Harbor docs (goharbor.io/docs/main)"
topics:
  - id: audit-log-skip-and-forwarding
    name: "Audit log skip and forwarding"
    source: "https://goharbor.io/docs/main/administration/audit-log/"
    match: [audit-log, skip-audit-log-database, gdpr-audit-logs]
  - id: velero-backup-and-restore
    name: "Backup and restore with Velero"
    source: "https://goharbor.io/docs/main/administration/backup-restore/"
    match: [velero, backup, restore]
  - id: database-authentication-mode
    name: "Database authentication mode"
    source: "https://goharbor.io/docs/main/administration/configure-authentication/db-auth/"
    match: [database-auth, self-registration, auth-mode]
  - id: ldap-authentication
    name: "LDAP and Active Directory authentication"
    source: "https://goharbor.io/docs/main/administration/configure-authentication/ldap-auth/"
    match: [ldap, active-directory, ldap-groups]
  - id: project-quotas
    name: "Project storage quotas"
    source: "https://goharbor.io/docs/main/administration/configure-project-quotas/"
    match: [project-quota, storage-quota, default-quota]
  - id: proxy-cache-project
    name: "Proxy cache projects"
    source: "https://goharbor.io/docs/main/administration/configure-proxy-cache/"
    match: [proxy-cache, pull-through, docker-hub-rate-limit]
  - id: replication-endpoints
    name: "Replication endpoints"
    source: "https://goharbor.io/docs/main/administration/configuring-replication/create-replication-endpoints/"
    match: [replication-endpoint, registry-endpoint, access-secret]
  - id: replication-rules
    name: "Replication rules"
    source: "https://goharbor.io/docs/main/administration/configuring-replication/create-replication-rules/"
    match: [replication-rule, push-based, pull-based]
  - id: garbage-collection
    name: "Garbage collection"
    source: "https://goharbor.io/docs/main/administration/garbage-collection/"
    match: [garbage-collection, gc, dry-run]
  - id: global-settings-readonly-and-banner
    name: "Global settings read-only and banner"
    source: "https://goharbor.io/docs/main/administration/general-settings/"
    match: [read-only, project-creation, banner-message]
  - id: audit-log-rotation
    name: "Audit log rotation and purge"
    source: "https://goharbor.io/docs/main/administration/log-rotation/"
    match: [log-rotation, audit-log-purge, syslog-endpoint]
  - id: jobservice-dashboard
    name: "Job service dashboard"
    source: "https://goharbor.io/docs/main/administration/jobservice-dashboard/"
    match: [jobservice, job-queues, worker-pool]
  - id: project-roles-and-permissions
    name: "Project roles and permissions"
    source: "https://goharbor.io/docs/main/administration/managing-users/user-permissions-by-role/"
    match: [project-roles, limited-guest, project-admin]
  - id: gdpr-user-deletion
    name: "GDPR-compliant user deletion"
    source: "https://goharbor.io/docs/main/administration/managing-users/"
    match: [gdpr, gdpr-delete-user, gdpr-audit-logs]
  - id: prometheus-metrics
    name: "Prometheus metrics"
    source: "https://goharbor.io/docs/main/administration/metrics/"
    match: [metrics, prometheus, exporter]
  - id: oidc-authentication
    name: "OIDC provider authentication"
    source: "https://goharbor.io/docs/main/administration/configure-authentication/oidc-auth/"
    match: [oidc, sso, group-claim]
  - id: p2p-preheat-providers
    name: "P2P preheat provider instances"
    source: "https://goharbor.io/docs/main/administration/p2p-preheat/manage-preheat-providers/"
    match: [p2p-preheat, dragonfly, kraken]
  - id: sbom-generation
    name: "SBOM generation"
    source: "https://goharbor.io/docs/main/administration/sbom-integration/"
    match: [sbom, spdx, trivy]
  - id: security-hub
    name: "Security Hub vulnerability overview"
    source: "https://goharbor.io/docs/main/administration/security-hub/"
    match: [security-hub, cve-search, vulnerability-overview]
  - id: user-defined-oci-artifacts
    name: "User-defined OCI artifacts"
    source: "https://goharbor.io/docs/main/administration/user-defined-OCI-artifact/"
    match: [oci-artifact, skip-list, artifact-icon]
  - id: system-robot-accounts
    name: "System robot accounts"
    source: "https://goharbor.io/docs/main/administration/robot-accounts/"
    match: [robot-account, system-robot, robot-prefix]
  - id: installer-upgrade-and-migration
    name: "Installer upgrade and migration"
    source: "https://goharbor.io/docs/main/administration/upgrade/"
    match: [upgrade, migrate, harbor-prepare]
  - id: helm-upgrade
    name: "Helm chart upgrade"
    source: "https://goharbor.io/docs/main/administration/upgrade/helm-upgrade/"
    match: [helm-upgrade, helm-rollback, tls-secret]
  - id: installer-rollback
    name: "Roll back an installer upgrade"
    source: "https://goharbor.io/docs/main/administration/upgrade/roll-back-upgrade/"
    match: [rollback, upgrade-rollback, backup-restore]
  - id: trivy-custom-ca-certificates
    name: "Trivy custom CA certificates"
    source: "https://goharbor.io/docs/main/administration/vulnerability-scanning/configure-custom-certs/"
    match: [trivy, custom-ca, web-proxy]
  - id: system-cve-allowlist
    name: "System-wide CVE allowlist"
    source: "https://goharbor.io/docs/main/administration/vulnerability-scanning/configure-system-allowlist/"
    match: [cve-allowlist, deployment-security, system-allowlist]
  - id: additional-vulnerability-scanners
    name: "Additional vulnerability scanners"
    source: "https://goharbor.io/docs/main/administration/vulnerability-scanning/pluggable-scanners/"
    match: [pluggable-scanners, interrogation-services, scanner-adapter]
  - id: stop-scan
    name: "Stop scans"
    source: "https://goharbor.io/docs/main/administration/vulnerability-scanning/stop-scan/"
    match: [stop-scan, stop-scan-all, scan-stopped-webhook]
  - id: scheduled-scans
    name: "Scheduled scan-all"
    source: "https://goharbor.io/docs/main/administration/vulnerability-scanning/schedule-scans/"
    match: [schedule-scans, scan-all, cron]
  - id: https-certificates
    name: "HTTPS certificates for Harbor"
    source: "https://goharbor.io/docs/main/install-config/configure-https/"
    match: [https, openssl, san]
  - id: internal-tls
    name: "Internal TLS between components"
    source: "https://goharbor.io/docs/main/install-config/configure-internal-tls/"
    match: [internal-tls, gencert, harbor-internal-ca]
  - id: scan-individual-artifacts
    name: "Scan individual artifacts and export CVEs"
    source: "https://goharbor.io/docs/main/administration/vulnerability-scanning/scan-individual-artifact/"
    match: [vulnerability-scan, scan-status, export-cves]
  - id: custom-token-service-key
    name: "Custom token service key and certificate"
    source: "https://goharbor.io/docs/main/install-config/customize-token-service/"
    match: [token-service, private-key, root-crt]
  - id: installation-prerequisites
    name: "Installation prerequisites"
    source: "https://goharbor.io/docs/main/install-config/installation-prereqs/"
    match: [prerequisites, system-requirements, docker-compose]
  - id: run-installer-script
    name: "Run the installer script"
    source: "https://goharbor.io/docs/main/install-config/run-installer-script/"
    match: [install-sh, with-trivy, insecure-registry]
  - id: ha-deployment-helm
    name: "High availability with Helm"
    source: "https://goharbor.io/docs/main/install-config/harbor-ha-helm/"
    match: [high-availability, helm, external-postgresql]
  - id: harbor-yml-core-parameters
    name: "harbor.yml core parameters"
    source: "https://goharbor.io/docs/main/install-config/configure-yml-file/"
    match: [harbor-yml, hostname, https]
  - id: harbor-yml-jobservice-logging-proxy
    name: "harbor.yml jobservice logging proxy and cache"
    source: "https://goharbor.io/docs/main/install-config/configure-yml-file/"
    match: [harbor-yml, jobservice-workers, rsyslog]
  - id: harbor-yml-external-services
    name: "harbor.yml external storage database and Redis"
    source: "https://goharbor.io/docs/main/install-config/configure-yml-file/"
    match: [external-database, external-redis, storage-service]
  - id: distributed-tracing
    name: "Distributed tracing"
    source: "https://goharbor.io/docs/main/administration/distributed-tracing/"
    match: [distributed-tracing, opentelemetry, jaeger]
  - id: tag-retention-rules
    name: "Tag retention rules"
    source: "https://goharbor.io/docs/main/working-with-projects/working-with-images/create-tag-retention-rules/"
    match: [tag-retention, retention-policy, dry-run]
  - id: configuration-api-and-env-override
    name: "Configuration API and CONFIG_OVERWRITE_JSON"
    source: "https://goharbor.io/docs/main/install-config/configure-system-settings-cli/"
    match: [configurations-api, config-overwrite-json, auth-mode]
  - id: tag-immutability-rules
    name: "Tag immutability rules"
    source: "https://goharbor.io/docs/main/working-with-projects/working-with-images/create-tag-immutability-rules/"
    match: [tag-immutability, immutable-tags, overwrite-protection]
  - id: project-cve-allowlist
    name: "Per-project CVE allowlist"
    source: "https://goharbor.io/docs/main/working-with-projects/project-configuration/configure-project-allowlist/"
    match: [project-allowlist, cve-allowlist, copy-from-system]
  - id: enforce-content-trust
    name: "Enforce content trust"
    source: "https://goharbor.io/docs/main/working-with-projects/project-configuration/implementing-content-trust/"
    match: [content-trust, cosign-policy, notation-policy]
  - id: cosign-signing
    name: "Signing with Cosign"
    source: "https://goharbor.io/docs/main/working-with-projects/working-with-images/sign-images/"
    match: [cosign, sigstore, image-signing]
  - id: notation-signing
    name: "Signing with Notation"
    source: "https://goharbor.io/docs/main/working-with-projects/working-with-images/sign-images/"
    match: [notation, notary, trust-policy]
  - id: helm-oci-charts
    name: "Helm OCI charts"
    source: "https://goharbor.io/docs/main/working-with-projects/working-with-oci/working-with-helm-oci-charts/"
    match: [helm, oci-chart, helm-push]
