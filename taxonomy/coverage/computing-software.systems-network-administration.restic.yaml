# Coverage spec: restic. Topics from the official docs in sources.
subject: restic
scope:
  category: computing-software
  field: systems-network-administration
  products: [restic]
sources:
  - "https://restic.readthedocs.io/en/stable/"
  - "https://restic.readthedocs.io/en/stable/020_installation.html"
  - "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
  - "https://restic.readthedocs.io/en/stable/040_backup.html"
  - "https://restic.readthedocs.io/en/stable/045_working_with_repos.html"
  - "https://restic.readthedocs.io/en/stable/047_tuning_parameters.html"
  - "https://restic.readthedocs.io/en/stable/050_restore.html"
  - "https://restic.readthedocs.io/en/stable/060_forget.html"
  - "https://restic.readthedocs.io/en/stable/070_encryption.html"
  - "https://restic.readthedocs.io/en/stable/075_scripting.html"
  - "https://restic.readthedocs.io/en/stable/077_troubleshooting.html"
  - "https://restic.readthedocs.io/en/stable/080_examples.html"
  - "https://restic.readthedocs.io/en/stable/REST_backend.html"
  - "https://restic.readthedocs.io/en/stable/cache.html"
  - "https://restic.readthedocs.io/en/stable/design.html"
  - "https://restic.readthedocs.io/en/stable/faq.html"
topics:
  - id: azure-backend
    name: "Azure backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [azure, blob-storage, backend, access-tier, managed-identity]
  - id: b2-backend
    name: "B2 backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [backblaze, b2, backend, application-key]
  - id: backup-basics
    name: "Backup basics"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [backup, snapshot, one-file-system, verbose, paths]
  - id: backup-exit-codes
    name: "Backup exit codes"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [exit-codes, backup, monitoring, partial-snapshot]
  - id: backup-from-stdin
    name: "Backup from stdin"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [stdin, stdin-from-command, database-dump, backup]
  - id: backup-over-ssh-tunnel
    name: "Backup over ssh tunnel"
    source: "https://restic.readthedocs.io/en/stable/080_examples.html"
    match: [ssh-tunnel, reverse-tunnel, rest-server, rclone-serve]
  - id: backup-tags
    name: "Backup tags"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [tags, tag, snapshots, filtering, retention]
  - id: build-from-source
    name: "Build from source"
    source: "https://restic.readthedocs.io/en/stable/020_installation.html"
    match: [build, source, golang, cross-compile]
  - id: check-integrity
    name: "Check integrity"
    source: "https://restic.readthedocs.io/en/stable/045_working_with_repos.html"
    match: [check, read-data, read-data-subset, integrity, verification]
  - id: chunking-deduplication
    name: "Chunking deduplication"
    source: "https://restic.readthedocs.io/en/stable/design.html"
    match: [chunking, deduplication, rabin-fingerprint, polynomial, blob-size]
  - id: compare-snapshots-diff
    name: "Compare snapshots diff"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [diff, snapshots, compare, metadata]
  - id: compression-and-pack-size
    name: "Compression and pack size"
    source: "https://restic.readthedocs.io/en/stable/047_tuning_parameters.html"
    match: [compression, pack-size, tuning, tmpdir, performance]
  - id: connections-and-concurrency
    name: "Connections and concurrency"
    source: "https://restic.readthedocs.io/en/stable/047_tuning_parameters.html"
    match: [connections, concurrency, gomaxprocs, no-scan, read-concurrency]
  - id: copy-between-repos
    name: "Copy between repos"
    source: "https://restic.readthedocs.io/en/stable/045_working_with_repos.html"
    match: [copy, replication, from-repo, chunker-params, deduplication]
  - id: docker-image-niceness
    name: "Docker image niceness"
    source: "https://restic.readthedocs.io/en/stable/020_installation.html"
    match: [docker, container, hostname, nice, ionice]
  - id: empty-password-repos
    name: "Empty password repos"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [insecure-no-password, empty-password, repository]
  - id: encryption-format
    name: "Encryption format"
    source: "https://restic.readthedocs.io/en/stable/design.html"
    match: [encryption, aes-256, poly1305, scrypt, master-key]
  - id: environment-variables
    name: "Environment variables"
    source: "https://restic.readthedocs.io/en/stable/075_scripting.html"
    match: [environment-variables, configuration, cache-dir, host, scripting]
  - id: exclude-patterns
    name: "Exclude patterns"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [exclude, patterns, exclude-file, exclude-caches, iexclude]
  - id: faq-cold-storage
    name: "Faq cold storage"
    source: "https://restic.readthedocs.io/en/stable/faq.html"
    match: [faq, glacier, cold-storage, s3-restore, storage-class]
  - id: faq-multi-host-repos
    name: "Faq multi host repos"
    source: "https://restic.readthedocs.io/en/stable/faq.html"
    match: [faq, multiple-hosts, shared-repository, group-by, deduplication]
  - id: faq-resume-interrupted
    name: "Faq resume interrupted"
    source: "https://restic.readthedocs.io/en/stable/faq.html"
    match: [faq, interrupted-backup, resume, unreferenced-packs, prune]
  - id: feature-flags
    name: "Feature flags"
    source: "https://restic.readthedocs.io/en/stable/047_tuning_parameters.html"
    match: [feature-flags, restic-features, alpha, beta, experimental]
  - id: file-change-detection
    name: "File change detection"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [change-detection, parent-snapshot, ignore-ctime, ignore-inode, group-by]
  - id: files-from-lists
    name: "Files from lists"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [files-from, files-from-raw, files-from-verbatim, include, find]
  - id: find-files-and-blobs
    name: "Find files and blobs"
    source: "https://restic.readthedocs.io/en/stable/045_working_with_repos.html"
    match: [find, search, blob, snapshots, newest]
  - id: forget-grouping-and-tags
    name: "Forget grouping and tags"
    source: "https://restic.readthedocs.io/en/stable/060_forget.html"
    match: [forget, group-by, host, tag, unsafe-allow-remove-all]
  - id: forget-keep-policy
    name: "Forget keep policy"
    source: "https://restic.readthedocs.io/en/stable/060_forget.html"
    match: [forget, retention, keep-daily, keep-within, policy]
  - id: gcs-backend
    name: "Gcs backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [google-cloud-storage, gcs, backend, service-account]
  - id: group-accessible-repo
    name: "Group accessible repo"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [group-access, permissions, setgid, local-backend, sftp]
  - id: init-repository
    name: "Init repository"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [init, repository, repository-version, local-backend]
  - id: inspect-repo-objects
    name: "Inspect repo objects"
    source: "https://restic.readthedocs.io/en/stable/"
    match: [cat, list, repository-objects, masterkey, snapshots]
  - id: install-packages
    name: "Install packages"
    source: "https://restic.readthedocs.io/en/stable/020_installation.html"
    match: [installation, packages, package-manager, windows, macos]
  - id: json-output-scripting
    name: "Json output scripting"
    source: "https://restic.readthedocs.io/en/stable/075_scripting.html"
    match: [json, scripting, automation, json-lines, quiet]
  - id: key-management
    name: "Key management"
    source: "https://restic.readthedocs.io/en/stable/070_encryption.html"
    match: [key, key-add, key-passwd, key-list, key-remove]
  - id: list-snapshots-and-files
    name: "List snapshots and files"
    source: "https://restic.readthedocs.io/en/stable/045_working_with_repos.html"
    match: [snapshots, ls, ncdu, listing, json]
  - id: local-cache
    name: "Local cache"
    source: "https://restic.readthedocs.io/en/stable/cache.html"
    match: [cache, cache-dir, no-cache, performance]
  - id: mount-and-dump
    name: "Mount and dump"
    source: "https://restic.readthedocs.io/en/stable/050_restore.html"
    match: [mount, dump, fuse, tar, zip]
  - id: no-free-space-recovery
    name: "No free space recovery"
    source: "https://restic.readthedocs.io/en/stable/060_forget.html"
    match: [prune, no-free-space, recovery, unsafe-recover-no-free-space]
  - id: non-root-backup-capabilities
    name: "Non root backup capabilities"
    source: "https://restic.readthedocs.io/en/stable/080_examples.html"
    match: [non-root, capabilities, cap-dac-read-search, systemd, setcap]
  - id: pack-and-index-format
    name: "Pack and index format"
    source: "https://restic.readthedocs.io/en/stable/design.html"
    match: [pack-files, index, blob, tree, zstandard]
  - id: prune-tuning
    name: "Prune tuning"
    source: "https://restic.readthedocs.io/en/stable/060_forget.html"
    match: [prune, max-unused, max-repack-size, repack, repository-size]
  - id: rclone-backend
    name: "Rclone backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [rclone, backend, rclone-program, ssh]
  - id: repair-damaged-repo
    name: "Repair damaged repo"
    source: "https://restic.readthedocs.io/en/stable/077_troubleshooting.html"
    match: [repair, troubleshooting, repair-index, repair-snapshots, repair-packs]
  - id: repo-layout-design
    name: "Repo layout design"
    source: "https://restic.readthedocs.io/en/stable/design.html"
    match: [repository-layout, design, snapshots, data, index]
  - id: repository-locks
    name: "Repository locks"
    source: "https://restic.readthedocs.io/en/stable/design.html"
    match: [locks, unlock, retry-lock, exclusive-lock, stale-lock]
  - id: repository-password-sources
    name: "Repository password sources"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [password, password-file, password-command, automation, secrets]
  - id: rest-api
    name: "Rest api"
    source: "https://restic.readthedocs.io/en/stable/REST_backend.html"
    match: [rest-api, http, rest-server, backend-protocol, api-v2]
  - id: rest-server-backend
    name: "Rest server backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [rest-server, rest, backend, https, cacert]
  - id: restore-overwrite-delete
    name: "Restore overwrite delete"
    source: "https://restic.readthedocs.io/en/stable/050_restore.html"
    match: [restore, overwrite, delete, in-place, dry-run]
  - id: restore-snapshot
    name: "Restore snapshot"
    source: "https://restic.readthedocs.io/en/stable/050_restore.html"
    match: [restore, include, exclude, target, sparse]
  - id: rewrite-snapshots
    name: "Rewrite snapshots"
    source: "https://restic.readthedocs.io/en/stable/045_working_with_repos.html"
    match: [rewrite, exclude, include, new-host, new-time]
  - id: s3-backend
    name: "S3 backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [s3, amazon-s3, aws, backend, credentials]
  - id: s3-compatible-storage
    name: "S3 compatible storage"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [s3-compatible, wasabi, alibaba-oss, bucket-lookup, region]
  - id: s3-iam-setup
    name: "S3 iam setup"
    source: "https://restic.readthedocs.io/en/stable/080_examples.html"
    match: [s3, iam, bucket-policy, aws, least-privilege]
  - id: script-exit-codes
    name: "Script exit codes"
    source: "https://restic.readthedocs.io/en/stable/075_scripting.html"
    match: [exit-codes, scripting, repository-exists, lock, automation]
  - id: self-update-binary
    name: "Self update binary"
    source: "https://restic.readthedocs.io/en/stable/020_installation.html"
    match: [self-update, binary, checksum, github-token]
  - id: sftp-backend
    name: "Sftp backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [sftp, ssh, backend, ssh-config, keepalive]
  - id: shell-completion
    name: "Shell completion"
    source: "https://restic.readthedocs.io/en/stable/020_installation.html"
    match: [autocompletion, bash, zsh, fish, powershell]
  - id: skip-unchanged-and-dry-run
    name: "Skip unchanged and dry run"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [dry-run, skip-if-unchanged, backup, preview]
  - id: swift-backend
    name: "Swift backend"
    source: "https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html"
    match: [openstack, swift, keystone, backend]
  - id: upgrade-repo-format
    name: "Upgrade repo format"
    source: "https://restic.readthedocs.io/en/stable/045_working_with_repos.html"
    match: [migrate, upgrade-repo-v2, compression, repository-version]
  - id: windows-vss-snapshots
    name: "Windows vss snapshots"
    source: "https://restic.readthedocs.io/en/stable/040_backup.html"
    match: [windows, vss, use-fs-snapshot, volume-shadow-copy]
