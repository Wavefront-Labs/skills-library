# Coverage spec: mkdocs. Topics from the MkDocs docs (github.com/mkdocs/mkdocs, docs/ folder).
subject: mkdocs
scope:
  category: computing-software
  field: web-development
  products: [mkdocs]
sources:
  - "MkDocs docs (github.com/mkdocs/mkdocs/tree/master/docs: getting-started, user-guide, dev-guide)"
topics:
  # Install and basic workflow
  - id: install
    name: "Install MkDocs with pip"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/installation.md"
    match: [installation, pip-install, windows-path]
  - id: new-project
    name: "Create a new project"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/getting-started.md"
    match: [mkdocs-new, project-scaffold]
  - id: serve
    name: "Preview with mkdocs serve"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/getting-started.md"
    match: [mkdocs-serve, live-reload]
  - id: build
    name: "Build the static site"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/getting-started.md"
    match: [mkdocs-build, site-directory]
  - id: favicon
    name: "Change the favicon"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/getting-started.md"
    match: [favicon]
  # Writing your docs
  - id: file-layout
    name: "File layout and page URLs"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [file-layout, page-urls]
  - id: index-pages
    name: "Index pages and README.md"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [index-pages, readme-md]
  - id: source-files
    name: "Markdown file extensions and dot-files"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [source-file-extensions, dot-files]
  - id: nav-basics
    name: "Configure pages and navigation"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [nav, nav-titles]
  - id: nav-sections
    name: "Navigation sections"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [nav-sections, nesting]
  - id: nav-external
    name: "External links in nav"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [external-links]
  - id: not-in-nav
    name: "Pages deliberately omitted from nav"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [not-in-nav, omitted-files]
  - id: page-title
    name: "How page titles are determined"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [page-title, title-meta]
  - id: internal-links
    name: "Linking between pages"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [internal-links, relative-links]
  - id: toc-options
    name: "toc extension options"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [toc-extension, permalink, baselevel]
  - id: media
    name: "Images and media"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [images, media-files]
  - id: yaml-meta
    name: "YAML style meta-data"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [yaml-front-matter, front-matter]
  - id: mmd-meta
    name: "MultiMarkdown style meta-data"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [multimarkdown]
  - id: template-key
    name: "Per-page template meta-data key"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [page-template, template-key]
  - id: tables
    name: "Tables"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [tables, markdown-tables]
  - id: fenced-code
    name: "Fenced code blocks"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/writing-your-docs.md"
    match: [fenced-code-blocks, code-fences]
  # Project information and config options
  - id: site-url
    name: "site_url and canonical URL"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [site-url, canonical-url]
  - id: repo-edit
    name: "repo_url, repo_name and edit_uri"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [repo-url, edit-uri]
  - id: edit-template
    name: "edit_uri_template"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [edit-uri-template]
  - id: site-meta
    name: "site_description, site_author, copyright"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [site-description, copyright]
  - id: exclude-docs
    name: "exclude_docs"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [exclude-docs]
  - id: draft-docs
    name: "draft_docs"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [draft-docs, drafts]
  - id: validation
    name: "validation severities"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [validation, link-checking]
  - id: absolute-links
    name: "Validation of absolute links"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [absolute-links, relative-to-docs]
  - id: strict
    name: "strict mode"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [strict-mode, warnings]
  - id: build-dirs
    name: "docs_dir and site_dir"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [site-dir, build-directories]
  - id: extra-assets
    name: "extra_css and extra_javascript"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [extra-css, extra-javascript]
  - id: directory-urls
    name: "use_directory_urls"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [use-directory-urls, pretty-urls]
  - id: dev-addr-watch
    name: "dev_addr and watch"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [dev-addr, watch]
  - id: md-extensions
    name: "markdown_extensions"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [markdown-extensions, extension-config]
  - id: relative-tag
    name: "!relative path tag"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [relative-tag, config-dir]
  - id: env-vars
    name: "!ENV environment variables"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [env-variables, env-tag]
  - id: inheritance
    name: "Configuration inheritance"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [inherit, config-inheritance]
  - id: hooks
    name: "hooks"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [hooks, one-off-scripts]
  - id: plugins-config
    name: "plugins configuration"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [plugins, plugin-options]
  - id: plugin-enabled
    name: "plugin enabled option"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [plugin-enabled, conditional-plugins]
  - id: search-basic
    name: "Search plugin: separator and min_search_length"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [search-plugin, min-search-length]
  - id: search-lang
    name: "Search plugin: lang"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [search-languages, lunr-languages]
  - id: search-index
    name: "Search plugin: prebuild_index and indexing"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/configuration.md"
    match: [prebuild-index, indexing]
  # Built-in themes and customizing
  - id: theme-mkdocs
    name: "The mkdocs theme options"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/choosing-your-theme.md"
    match: [mkdocs-theme, color-mode]
  - id: theme-hljs
    name: "highlight.js and analytics options"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/choosing-your-theme.md"
    match: [highlightjs, gtag]
  - id: theme-rtd
    name: "The readthedocs theme options"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/choosing-your-theme.md"
    match: [readthedocs-theme, sidebar]
  - id: theme-third-party
    name: "Third party themes"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/choosing-your-theme.md"
    match: [third-party-themes, theme-catalog]
  - id: customize-css
    name: "Customizing with extra CSS and JS"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/customizing-your-theme.md"
    match: [customize-theme, css-tweak]
  - id: custom-dir
    name: "theme custom_dir"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/customizing-your-theme.md"
    match: [custom-dir, theme-override]
  - id: template-blocks
    name: "Overriding template blocks"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/customizing-your-theme.md"
    match: [template-blocks, super-block]
  # Deploying
  - id: gh-deploy
    name: "GitHub Project Pages with gh-deploy"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/deploying-your-docs.md"
    match: [gh-deploy, project-pages]
  - id: user-pages
    name: "GitHub User and Organization Pages"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/deploying-your-docs.md"
    match: [user-pages, org-pages]
  - id: custom-domain
    name: "GitHub Pages custom domain and CNAME"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/deploying-your-docs.md"
    match: [custom-domain, cname]
  - id: static-hosting
    name: "Other providers and Read the Docs"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/deploying-your-docs.md"
    match: [static-hosting, read-the-docs]
  - id: local-files
    name: "Distributing local files"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/deploying-your-docs.md"
    match: [file-scheme, offline]
  - id: page-404
    name: "404 pages"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/deploying-your-docs.md"
    match: [404-page, not-found]
  # Localization and developer guide
  - id: localize
    name: "Localizing your theme"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/user-guide/localizing-your-theme.md"
    match: [locale, i18n]
  - id: custom-theme
    name: "Creating a custom theme"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/dev-guide/themes.md"
    match: [custom-theme, main-html]
  - id: theme-variables
    name: "Template variables and filters"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/dev-guide/themes.md"
    match: [template-filters, template-variables]
  - id: theme-search
    name: "Search support in themes"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/dev-guide/themes.md"
    match: [theme-search, search-index-json]
  - id: package-theme
    name: "Packaging themes"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/dev-guide/themes.md"
    match: [package-theme, mkdocs-theme-yml]
  - id: theme-translation
    name: "Theme translation workflow"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/dev-guide/translations.md"
    match: [theme-translation, pybabel]
  - id: plugin-dev
    name: "Developing plugins"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/dev-guide/plugins.md"
    match: [base-plugin, config-scheme]
  - id: plugin-events
    name: "Plugin events and priorities"
    source: "https://raw.githubusercontent.com/mkdocs/mkdocs/master/docs/dev-guide/plugins.md"
    match: [plugin-events, event-priority]
