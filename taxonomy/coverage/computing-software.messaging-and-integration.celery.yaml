    name: "Routers and broadcast"
    source: "https://docs.celeryq.dev/en/stable/userguide/routing.html"
    match: [celery-routing-routers]
  - id: celery-routing-priorities
    name: "Message priorities"
    source: "https://docs.celeryq.dev/en/stable/userguide/routing.html"
    match: [celery-routing-priorities]
  - id: celery-routing-amqp
    name: "AMQP primer and celery amqp"
    source: "https://docs.celeryq.dev/en/stable/userguide/routing.html"
    match: [celery-routing-amqp]
