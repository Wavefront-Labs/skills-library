    source: "https://docs.celeryq.dev/en/stable/userguide/periodic-tasks.html"
    match: [celery-beat-operations]
  - id: celery-signals-task
    name: "Task signals"
    source: "https://docs.celeryq.dev/en/stable/userguide/signals.html"
    match: [celery-signals-task]
  - id: celery-signals-worker
    name: "Worker, logging and command signals"
    source: "https://docs.celeryq.dev/en/stable/userguide/signals.html"
    match: [celery-signals-worker]
  - id: celery-conf-file
    name: "Config module and Django namespace"
    source: "https://docs.celeryq.dev/en/stable/userguide/configuration.html"
