# Coverage spec: celery. Topics from the official docs table of contents.
subject: celery
scope:
  category: computing-software
  field: messaging-and-integration
  products: [celery]
sources:
  - "https://docs.celeryq.dev/en/stable/"
topics:
  - id: celery-define-tasks
    name: "Defining tasks and names"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-define-tasks]
  - id: celery-task-request
    name: "Task request context and logging"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-task-request]
  - id: celery-retry
    name: "Retrying tasks"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-retry]
  - id: celery-pydantic
    name: "Pydantic argument validation"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-pydantic]
  - id: celery-task-options
    name: "Task options and semipredicates"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-task-options]
  - id: celery-task-states
    name: "Task states and result backends"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-task-states]
  - id: celery-task-handlers
    name: "Custom task classes and handlers"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-task-handlers]
  - id: celery-best-practices
    name: "Task tips and best practices"
    source: "https://docs.celeryq.dev/en/stable/userguide/tasks.html"
    match: [celery-best-practices]
  - id: celery-calling
    name: "Calling tasks"
    source: "https://docs.celeryq.dev/en/stable/userguide/calling.html"
    match: [celery-calling]
  - id: celery-task-serialization
    name: "Serializers and compression"
    source: "https://docs.celeryq.dev/en/stable/userguide/calling.html"
    match: [celery-task-serialization]
  - id: celery-application
    name: "The Celery application"
    source: "https://docs.celeryq.dev/en/stable/userguide/application.html"
    match: [celery-application]
  - id: celery-first-steps
    name: "First steps with Celery"
    source: "https://docs.celeryq.dev/en/stable/getting-started/first-steps-with-celery.html"
    match: [celery-first-steps]
  - id: celery-task-lock
    name: "Task cookbook single execution lock"
    source: "https://docs.celeryq.dev/en/stable/tutorials/task-cookbook.html"
    match: [celery-task-lock]
  - id: celery-canvas-signatures
    name: "Canvas signatures and partials"
    source: "https://docs.celeryq.dev/en/stable/userguide/canvas.html"
    match: [celery-canvas-signatures]
  - id: celery-canvas-chains
    name: "Canvas chains, callbacks and groups"
    source: "https://docs.celeryq.dev/en/stable/userguide/canvas.html"
    match: [celery-canvas-chains]
  - id: celery-canvas-chords
    name: "Canvas chords"
    source: "https://docs.celeryq.dev/en/stable/userguide/canvas.html"
    match: [celery-canvas-chords]
  - id: celery-canvas-map-chunks
    name: "Canvas map, starmap and chunks"
    source: "https://docs.celeryq.dev/en/stable/userguide/canvas.html"
    match: [celery-canvas-map-chunks]
  - id: celery-canvas-stamping
    name: "Canvas stamping"
    source: "https://docs.celeryq.dev/en/stable/userguide/canvas.html"
