# Canonical coverage spec: General digital literacy (everyday computer skills for non-specialists).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (EU DigComp 2.2 competence areas and
# competences, ICDL/ECDL module syllabi, Northstar Digital Literacy standards, the Microsoft 365
# and Google Workspace learning-centre tables of contents), not from what the library already has.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (ICDL syllabus
# sections and skill-set items, Northstar standard numbers, DigComp 2.2 knowledge/skills examples,
# learning-centre page headings). Round 2 adds the next level: DigComp 2.2 proficiency examples,
# ICDL syllabus items, Northstar indicators and Microsoft/Google/Apple/Mozilla help-centre sub-articles.
subject: general-digital-literacy
scope:
  category: computing-software
  field: general-digital-literacy
  products: [office-suites, email-clients, web-browsers, file-management, basic-troubleshooting, internet-navigation, digital-communication]
sources:
  - "EU DigComp 2.2 (JRC 2022) - 5 areas and 21 competences - 1 Information and data literacy (1.1 browsing/searching/filtering, 1.2 evaluating, 1.3 managing data), 2 Communication and collaboration (2.1 interacting, 2.2 sharing, 2.3 citizenship, 2.4 collaborating, 2.5 netiquette, 2.6 digital identity), 3 Digital content creation (3.1 developing, 3.2 integrating/re-elaborating, 3.3 copyright and licences, 3.4 programming), 4 Safety (4.1 protecting devices, 4.2 personal data and privacy, 4.3 health and well-being, 4.4 environment), 5 Problem solving (5.1 technical problems, 5.2 needs and responses, 5.3 creative use, 5.4 competence gaps); subtopics from its knowledge/skills/attitude examples incl. the AI-system examples"
  - "ICDL/ECDL syllabi (ICDL Foundation) - Computer Essentials 1.0 (computers and devices, desktop/icons/settings, outputs, file management, networks, security and well-being), Online Essentials 1.0 (web browsing concepts, web browsing, web-based information, communication concepts, using e-mail, calendars), Documents/Word Processing 6.0 (using the application, document creation, formatting, objects, mail merge, prepare outputs), Spreadsheets 6.0 (cells, worksheets, formulas and functions, formatting, charts, prepare outputs), Presentation 6.0 (developing, master slide, text, charts, graphical objects, prepare outputs), Online Collaboration 1.0 (cloud computing, online meetings, online learning environments, mobile collaboration), IT Security 2.0 (malware, network security, safe web use, communications, secure data management)"
  - "Northstar Digital Literacy standards (Literacy Minnesota) - Essential Skills - Basic Computer Skills, Internet Basics, Using Email, Windows 11, Mac OS, Information Literacy, Career Search Skills, Supporting K-12 Distance Learning, Your Digital Footprint, Telehealth, Accessing Government Services; Software Skills - Microsoft Word, Microsoft Excel, Microsoft PowerPoint, Google Docs; Using Technology in Daily Life - Social Media, Online Communication; subtopics from the numbered standards in each assessment"
  - "Microsoft 365 learning centre / support ToC (support.microsoft.com) - Word, Excel, PowerPoint, Outlook, OneDrive, Teams, Windows help (Settings, Windows Security, Wi-Fi, printers, sound, accounts, File Explorer, backup), Edge help; Microsoft accessibility guidance (Make your Word/Excel/PowerPoint content accessible)"
  - "Google Workspace learning centre and help centres (support.google.com) - Docs, Sheets, Slides, Drive, Gmail, Calendar, Meet, Chrome (tabs, bookmarks, downloads, profiles, privacy/security, extensions, troubleshooting), Search help, Google Account security; Apple support (Mac basics, iPhone, iCloud, Photos, Finder, Safari, Find My)"
