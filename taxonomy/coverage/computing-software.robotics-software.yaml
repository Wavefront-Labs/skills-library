# Canonical coverage spec: robotics software (ROS 2 ecosystem). Topics from the external sources below.
subject: robotics-software-ros2
scope:
  category: computing-software
  field: robotics-software
  products:
  - ros2-core
  - ros2-navigation-nav2
  - moveit-manipulation
  - robot-simulation-gazebo
  - robot-perception-slam
  - robot-control-and-kinematics
sources:
- ROS 2 documentation tutorials and concepts (docs.ros.org, Humble and Jazzy)
- REP index (ros.org/reps)
- Nav2 documentation (docs.nav2.org)
- MoveIt 2 documentation (moveit.picknik.ai)
- Gazebo documentation (gazebosim.org/docs)
- ros2_control documentation (control.ros.org)
- 'Siciliano et al., Robotics: Modelling, Planning and Control (kinematics, dynamics, control chapters)'
