# Canonical coverage spec for enterprise-architecture, drawn from external sources listed below.
subject: enterprise-architecture
scope:
  category: computing-software
  field: it-governance-risk-compliance
  products:
  - enterprise-architecture
sources:
- 'The Open Group TOGAF Standard 10th Edition table of contents (https://pubs.opengroup.org/togaf-standard/): introduction and core concepts, ADM, ADM techniques, applying the ADM, architecture content,
  capability and governance'
- 'TOGAF Certification Foundation and Practitioner learning objectives (https://www.opengroup.org/togaf/certification): Foundation concept topics and Practitioner scenario topics'
- 'ArchiMate 3.2 Specification table of contents (https://pubs.opengroup.org/architecture/archimate32-doc/): language structure, generic metamodel, layers, cross-layer, motivation, strategy, implementation
  and migration, viewpoints, customisation'
- 'Zachman International framework documentation (https://www.zachman.com/about-the-zachman-framework): 6x6 classification schema'
- 'BIZBOK Guide (https://www.businessarchitectureguild.org/): capability mapping, value streams, information maps, organisation maps'
- 'US FEAF and DoDAF 2.02 (https://www.dodcio.defense.gov/Library/DoD-Architecture-Framework/): reference models and viewpoints'
- 'TOGAF Series Guides on architecture repository, tooling, ADRs practice (https://pubs.opengroup.org/togaf-standard/): supporting guides'
