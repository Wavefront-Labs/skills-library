# Canonical coverage spec for crystal-language, drawn from external sources listed below.
subject: crystal-language
scope:
  category: computing-software
  field: software-engineering
  products:
  - crystal
sources:
- 'Crystal reference book table of contents (https://crystal-lang.org/reference/): syntax and semantics, type system, methods, macros, C bindings, concurrency, compiler, guides'
- 'Crystal standard library API docs index (https://crystal-lang.org/api/): Array, Hash, String, Int, File, IO, HTTP, JSON, YAML, Log, Time, Regex, Process, Channel, Socket, Spec, Benchmark'
- 'Shards documentation (https://github.com/crystal-lang/shards): shard.yml spec and commands'
- Crystal for Rubyists and the Crystal installation and deployment guides (https://crystal-lang.org/reference/)
