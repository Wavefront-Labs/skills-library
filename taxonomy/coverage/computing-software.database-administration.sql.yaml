# Canonical coverage spec: SQL as a language (ISO/IEC 9075 concepts as implemented by PostgreSQL and SQLite).
# Topics come from external structures: PostgreSQL manual Part II "The SQL Language" (lexical structure, data definition,
# data manipulation, queries, data types, functions, indexes, concurrency control), PostgreSQL appendix D SQL conformance,
# SQLite "SQL As Understood By SQLite" language reference, and ISO/IEC 9075 part and feature structure.
# A topic is covered by a skill tag equal to a match keyword. Engine administration lives in the other products.
subject: sql-language
scope:
  category: computing-software
  field: database-administration
  products: [sql, query-optimisation, sqlite, postgresql]
sources:
  - "PostgreSQL manual Part II The SQL Language (postgresql.org/docs/current)"
  - "SQLite language reference (sqlite.org/lang.html)"
  - "ISO/IEC 9075 SQL standard (iso.org) feature taxonomy; PostgreSQL appendix D SQL Conformance"
topics:
  - {id: sql-lexical, name: Literals identifiers and quoting, source: PostgreSQL 4.1 lexical structure, match: [sql-lexical-structure], subtopics: [{id: dollar-quoting, name: Dollar-quoted string constants, match: [dollar-quoting]}, {id: unicode-escapes, name: Unicode escapes in strings and identifiers, match: [unicode-escapes]}]}
  - {id: sql-select, name: SELECT and logical processing order, source: PostgreSQL 7.1 table expressions, match: [sql-select], subtopics: [{id: select-distinct-on, name: SELECT DISTINCT and DISTINCT ON semantics, match: [select-distinct-on]}, {id: limit-offset-fetch, name: LIMIT OFFSET and FETCH FIRST, match: [limit-offset-fetch]}]}
  - {id: sql-joins, name: Join types and semantics, source: PostgreSQL 7.2.1.2 joined tables, match: [sql-joins], subtopics: [{id: natural-and-using-joins, name: NATURAL JOIN and USING pitfalls, match: [natural-and-using-joins]}, {id: cross-join-and-cartesian, name: CROSS JOIN and accidental Cartesian products, match: [cross-join-and-cartesian]}]}
  - {id: sql-aggregation, name: Aggregates GROUP BY and HAVING, source: PostgreSQL 9.21 aggregate functions, match: [sql-aggregation], subtopics: [{id: aggregate-filter-clause, name: FILTER clause on aggregates, match: [aggregate-filter-clause]}, {id: string-agg-array-agg, name: string_agg array_agg and group_concat, match: [string-agg-array-agg]}]}
  - {id: sql-subqueries, name: Subqueries scalar and correlated, source: PostgreSQL 9.24 subquery expressions, match: [sql-subqueries], subtopics: [{id: exists-vs-in-subquery, name: Correlated EXISTS versus IN, match: [exists-vs-in-subquery]}, {id: any-all-subquery-operators, name: ANY SOME and ALL comparison operators, match: [any-all-subquery-operators]}]}
