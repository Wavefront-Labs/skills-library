# Coverage spec: apache-pulsar. Topics from the official docs ToC in sources.
subject: apache-pulsar
scope:
  category: computing-software
  field: messaging-and-integration
  products: [apache-pulsar]
sources:
  - "https://github.com/apache/pulsar-site/blob/main/sidebars.js"
  - "https://github.com/apache/pulsar-site/tree/main/docs"
topics:
  - id: acknowledgment-and-negative-ack
    name: "Acknowledgment and negative ack"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-messaging.md"
    match: [acknowledgment, negative-ack, ack-timeout]
  - id: anti-affinity-namespaces
    name: "Anti affinity namespaces"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-anti-affinity-namespaces.md"
    match: [anti-affinity, failure-domain, create-failure-domain]
  - id: architecture-brokers-bookies-metadata
    name: "Architecture brokers bookies metadata"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-architecture-overview.md"
    match: [architecture, brokers, bookkeeper]
  - id: authorization-roles-and-proxy-roles
    name: "Authorization roles and proxy roles"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/security-authorization.md"
    match: [authorization, super-user-roles, proxy-roles]
  - id: backlog-quotas
    name: "Backlog quotas"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/cookbooks-retention-expiry.md"
    match: [backlog-quota, producer-request-hold, producer-exception]
  - id: basic-authentication
    name: "Basic authentication"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/security-basic-auth.md"
    match: [basic-authentication, htpasswd, basic-auth-conf]
  - id: broker-rolling-upgrade
    name: "Broker rolling upgrade"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-rolling-upgrade.md"
    match: [rolling-upgrade, broker-shutdown, bundle-unload]
  - id: debezium-source-connector
    name: "Debezium source connector"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/io-debezium-source.md"
    match: [debezium, cdc, source-connector]
  - id: delayed-message-delivery
    name: "Delayed message delivery"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-messaging.md"
    match: [delayed-delivery, deliver-after, delayed-delivery-tick-time]
  - id: dispatch-throttling
    name: "Dispatch throttling"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-throttling.md"
    match: [dispatch-throttling, dispatch-rate, rate-period-in-second]
  - id: end-to-end-encryption
    name: "End to end encryption"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/security-encryption.md"
    match: [end-to-end-encryption, crypto-key-reader, session-key]
  - id: functions-concepts-and-guarantees
    name: "Functions concepts and guarantees"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/functions-concepts.md"
    match: [pulsar-functions, function-instance, function-worker]
  - id: geo-replication-setup
    name: "Geo replication setup"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-geo.md"
    match: [geo-replication, clusters-create, allowed-clusters]
  - id: geo-replication-subscriptions-and-deletion
    name: "Geo replication subscriptions and deletion"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-replication.md"
    match: [geo-replication, local-subscriptions, replicated-subscriptions]
  - id: io-connectors-and-guarantees
    name: "Io connectors and guarantees"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/io-overview.md"
    match: [pulsar-io, source-connector, sink-connector]
  - id: jwt-token-authentication
    name: "Jwt token authentication"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/security-jwt.md"
    match: [jwt, token-authentication, tokens-create]
  - id: kafka-client-wrapper
    name: "Kafka client wrapper"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/adaptors-kafka.md"
    match: [kafka-wrapper, pulsar-client-kafka, kafka-migration]
  - id: kafka-sink-connector
    name: "Kafka sink connector"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/io-kafka-sink.md"
    match: [kafka-sink, bootstrap-servers, producer-config-properties]
  - id: load-balancing-and-shedding
    name: "Load balancing and shedding"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-load-balance.md"
    match: [load-balancing, bundle-split, load-shedding]
  - id: message-deduplication
    name: "Message deduplication"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/cookbooks-deduplication.md"
    match: [message-deduplication, broker-deduplication-enabled, set-deduplication]
  - id: message-ttl-expiry
    name: "Message ttl expiry"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/cookbooks-retention-expiry.md"
    match: [message-ttl, expiry, set-message-ttl]
  - id: multi-tenancy-tenants-namespaces
    name: "Multi tenancy tenants namespaces"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-multi-tenancy.md"
    match: [multi-tenancy, tenants, namespaces]
  - id: multiple-advertised-listeners
    name: "Multiple advertised listeners"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-multiple-advertised-listeners.md"
    match: [advertised-listeners, bind-addresses, internal-listener-name]
  - id: namespace-bundles-sizing
    name: "Namespace bundles sizing"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-namespace-bundles.md"
    match: [namespace-bundles, bundle-range, split-bundle]
  - id: namespace-isolation-policy
    name: "Namespace isolation policy"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-isolation-broker.md"
    match: [broker-isolation, ns-isolation-policy, primary-secondary]
  - id: non-persistent-topics
    name: "Non persistent topics"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-messaging.md"
    match: [non-persistent-topics, in-memory, enable-non-persistent-topics]
  - id: oauth2-authentication
    name: "Oauth2 authentication"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/security-oauth2.md"
    match: [oauth2, client-credentials, issuer-url]
  - id: partitioned-topics-and-routing
    name: "Partitioned topics and routing"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-messaging.md"
    match: [partitioned-topics, routing-modes, hashing-scheme]
  - id: pulsar-perf-benchmarking
    name: "Pulsar perf benchmarking"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/performance-pulsar-perf.md"
    match: [pulsar-perf, benchmarking, throughput]
  - id: pulsar-proxy-configuration
    name: "Pulsar proxy configuration"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-proxy.md"
    match: [pulsar-proxy, proxy-conf, broker-service-url]
  - id: pulsar-shell
    name: "Pulsar shell"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/administration-pulsar-shell.md"
    match: [pulsar-shell, config-create, config-use]
  - id: retention-policies
    name: "Retention policies"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/cookbooks-retention-expiry.md"
    match: [retention, set-retention, retention-size]
  - id: retry-letter-and-dead-letter-topics
    name: "Retry letter and dead letter topics"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-messaging.md"
    match: [retry-letter-topic, dead-letter-topic, reconsumelater]
  - id: schema-compatibility-and-autoupdate
    name: "Schema compatibility and autoupdate"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/schema-understand.md"
    match: [schema-compatibility, backward, forward]
  - id: schema-registry-admin
    name: "Schema registry admin"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/admin-api-schemas.md"
    match: [schema-registry, schemas-upload, schemas-get]
  - id: schema-types-and-schemainfo
    name: "Schema types and schemainfo"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/schema-understand.md"
    match: [schema, schema-info, primitive-types]
  - id: standalone-quickstart
    name: "Standalone quickstart"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/getting-started-standalone.md"
    match: [standalone, quickstart, local-development]
  - id: subscription-types-and-modes
    name: "Subscription types and modes"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-messaging.md"
    match: [subscription-types, exclusive, failover]
  - id: system-topics
    name: "System topics"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/concepts-messaging.md"
    match: [system-topics, change-events, transaction-log]
  - id: tiered-storage-offload
    name: "Tiered storage offload"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/tiered-storage-overview.md"
    match: [tiered-storage, offload, managed-ledger-offload-driver]
  - id: tls-transport-encryption
    name: "Tls transport encryption"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/security-tls-transport.md"
    match: [tls, mtls, transport-encryption]
  - id: topic-compaction
    name: "Topic compaction"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/cookbooks-compaction.md"
    match: [topic-compaction, read-compacted, compaction-threshold]
  - id: transactions-java-client
    name: "Transactions java client"
    source: "https://github.com/apache/pulsar-site/blob/main/docs/txn-use.md"
    match: [transactions, transaction-coordinator, enable-transaction]
