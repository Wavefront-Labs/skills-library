    source: "https://learn.jamf.com/en-US/bundle/jamf-pro-documentation-current/page/Computer_Inventory.html"
    match: [compliance-inventory]
    subtopics:
      - {id: compliance-inventory-inventory-collection, name: "Inventory collection", match: [inventory-collection]}
      - {id: compliance-inventory-compliance-reporting, name: "Compliance reporting", match: [compliance-reporting]}
  - id: certificates
    name: "Certificates for Apple devices"
    source: "https://support.apple.com/guide/deployment/certificates-payload-dep8d3a0d7c8/web"
    match: [certificates]
    subtopics:
      - {id: certificates-scep-payload, name: "SCEP payload", match: [scep-payload]}
      - {id: certificates-acme-device-attestation, name: "ACME and device attestation", match: [acme-device-attestation]}
  - id: wifi-vpn
    name: "Wi-Fi and VPN profiles"
    source: "https://developer.apple.com/documentation/devicemanagement/wifi"
    match: [wifi-vpn]
    subtopics:
      - {id: wifi-vpn-wifi-8021x-payload, name: "Wi-Fi 802.1X payload", match: [wifi-8021x-payload]}
      - {id: wifi-vpn-vpn-per-app, name: "VPN and per-app VPN", match: [vpn-per-app]}
  - id: lifecycle
    name: "Device lifecycle"
    source: "https://support.apple.com/guide/deployment/welcome/web"
    match: [lifecycle]
    subtopics:
