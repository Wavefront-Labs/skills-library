# Coverage spec: django-ninja. Topics from the official docs table of contents.
subject: django-ninja
scope:
  category: computing-software
  field: web-development
  products: [django-ninja]
sources:
  - "https://django-ninja.dev/"
  - "https://github.com/vitalik/django-ninja/tree/master/docs/docs"
topics:
  - id: first-api
    name: 'Quick Start: first API'
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/quickstart/index.md"
    match: [first-api]
  - id: ninjaapi-instance
    name: The NinjaAPI Instance
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/api.md"
    match: [ninjaapi-instance]
  - id: docs-viewer
    name: Docs viewer options (docs, docs_url, docs_decorator)
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/api.md"
    match: [docs-viewer]
  - id: http-operations
    name: Defining operations
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/operations.md"
    match: [http-operations]
  - id: operation-options
    name: Operation options
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/operations.md"
    match: [operation-options]
  - id: crud-schemas
    name: Models & Schemas
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/quickstart/models-and-schemas.md"
    match: [crud-schemas]
  - id: url-reverse
    name: URLs & Reverse
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/urls.md"
    match: [url-reverse]
  - id: ninja-settings
    name: Settings
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/settings.md"
    match: [ninja-settings]
  - id: migrate-v1
    name: What's new in Django Ninja 1.0
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/whatsnew_v1.md"
    match: [migrate-v1]
  - id: path-converters
    name: Path parameters and Django path converters
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/path-params.md"
    match: [path-converters]
  - id: path-validation
    name: Path validation, schema grouping, router prefix
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/path-params.md"
    match: [path-validation]
  - id: query-types
    name: 'Query parameters: types, lists, constraints'
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/query-params.md"
    match: [query-types]
  - id: query-schema
    name: Grouping query parameters into a Schema
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/query-params.md"
    match: [query-schema]
  - id: body-schema
    name: Request body
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/body.md"
    match: [body-schema]
  - id: body-multiple
    name: Multiple body parameters and PatchDict
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/body.md"
    match: [body-multiple]
  - id: headers-cookies
    name: Headers and cookies
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/headers-cookies.md"
    match: [headers-cookies]
  - id: form-data
    name: Form data
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/forms.md"
    match: [form-data]
  - id: file-uploads
    name: File uploads
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/files.md"
    match: [file-uploads]
  - id: request-parsers
    name: Request parsers
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/parsers.md"
    match: [request-parsers]
  - id: filter-schema
    name: Filtering
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/filtering.md"
    match: [filter-schema]
  - id: pagination-paginate
    name: Pagination
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/pagination.md"
    match: [pagination-paginate]
  - id: schema-definition
    name: Defining schemas and nesting
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/schemas.md"
    match: [schema-definition]
  - id: schema-aliases
    name: Schema aliases
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/schemas.md"
    match: [schema-aliases]
  - id: schema-resolvers
    name: Resolvers and context
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/schemas.md"
    match: [schema-resolvers]
  - id: files-images
    name: Files and images, self-referencing schemas
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/schemas.md"
    match: [files-images]
  - id: modelschema
    name: ModelSchema
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/model-schema.md"
    match: [modelschema]
  - id: patch-update
    name: Making fields optional / PatchDict
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/model-schema.md"
    match: [patch-update]
  - id: create-schema
    name: create_schema
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/create-schema.md"
    match: [create-schema]
  - id: schema-config
    name: Schema Configuration
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/schema-config.md"
    match: [schema-config]
  - id: response-codes
    name: Responses and status codes
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/responses.md"
    match: [response-codes]
  - id: renderers
    name: Renderers
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/renderers.md"
    match: [renderers]
  - id: temporal-response
    name: Temporal response (headers, cookies, status)
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/temporal-response.md"
    match: [temporal-response]
  - id: authenticators
    name: 'Authentication: built-in authenticators'
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/authentication.md"
    match: [authenticators]
  - id: auth-scope
    name: 'Authentication: applying auth at different levels, async auth'
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/authentication.md"
    match: [auth-scope]
  - id: csrf
    name: CSRF
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/csrf.md"
    match: [csrf]
  - id: exception-handlers
    name: Errors and exception handling
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/errors.md"
    match: [exception-handlers]
  - id: validation-errors
    name: Customizing validation errors
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/errors.md"
    match: [validation-errors]
  - id: routers
    name: Routers
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/routers.md"
    match: [routers]
  - id: decorators
    name: Decorators
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/decorators.md"
    match: [decorators]
  - id: throttling
    name: Throttling
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/throttling.md"
    match: [throttling]
  - id: versioning
    name: Versioning
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/versioning.md"
    match: [versioning]
  - id: async
    name: Async support
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/async.md"
    match: [async]
  - id: testing-client
    name: Testing
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/testing.md"
    match: [testing-client]
  - id: openapi-docs
    name: OpenAPI and interactive docs
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/openapi.md"
    match: [openapi-docs]
  - id: webhooks
    name: Webhooks
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/guide/webhooks.md"
    match: [webhooks]
  - id: project-layout-routers
    name: Project setup & layout
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-1.md"
    match: [tutorial-layout]
  - id: relations-computed-fields
    name: Relations & computed fields
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-2.md"
    match: [tutorial-relations]
  - id: validation
    name: Validation
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-3.md"
    match: [tutorial-validation]
  - id: workflows-patch
    name: Partial updates with PATCH and status transitions
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-3.md"
    match: [tutorial-workflow]
  - id: jwt-auth
    name: JSON Web Tokens from scratch and protecting the API
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-4.md"
    match: [tutorial-auth]
  - id: memberships-permissions
    name: Memberships, roles and object-level permissions
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-4.md"
    match: [tutorial-permissions]
  - id: filterschema-ordering
    name: Filters, search and ordering with FilterSchema
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-5.md"
    match: [filterschema, filter-lookup]
  - id: pagination
    name: Page number and cursor pagination
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-5.md"
    match: [pagination, cursor-pagination]
  - id: file-uploads-forms
    name: File uploads and forms
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-6.md"
    match: [file-upload, multipart]
  - id: absolute-file-urls
    name: Absolute file URLs and deleting attachments
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-6.md"
    match: [build-absolute-uri, file-delete]
  - id: testing
    name: Testing with pytest and TestClient
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-7.md"
    match: [testclient, pytest-django]
  - id: openapi-polish
    name: Describing the API, summaries, fields, hiding endpoints
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-8.md"
    match: [openapi, include-in-schema]
  - id: second-version
    name: A second version and URL namespaces
    source: "https://github.com/vitalik/django-ninja/blob/master/docs/docs/tutorial/part-8.md"
    match: [versioning, url-namespace]
