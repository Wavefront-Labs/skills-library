# Coverage spec for telegraf, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: telegraf
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [telegraf]
sources:
  - "Telegraf v1 documentation (concepts, configuration, commands, administration, parsers and serializers)"
topics:
  - id: agent-collection-scheduling
    name: "Agent collection scheduling"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/agent/"
    match: [agent, interval, round-interval]
  - id: agent-logging
    name: "Agent logging"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/agent/"
    match: [logging, logfile, log-rotation]
  - id: aggregator-options-and-behavior
    name: "Aggregator options and behavior"
    source: "https://docs.influxdata.com/telegraf/v1/configure_plugins/aggregator_processor/"
    match: [aggregators, period, delay]
  - id: choosing-a-parser
    name: "Choosing a parser"
    source: "https://docs.influxdata.com/telegraf/v1/configure_plugins/input_plugins/parse-data/"
    match: [parsers, data-format, json]
  - id: command-line-flags
    name: "Command line flags"
    source: "https://docs.influxdata.com/telegraf/v1/commands/"
    match: [commands, cli, flags]
  - id: common-plugin-options
    name: "Common plugin options"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/plugin-options/"
    match: [plugin-options, alias, name-override]
  - id: config-migrate
    name: "Config migrate"
    source: "https://docs.influxdata.com/telegraf/v1/commands/config/migrate/"
    match: [config-migrate, deprecated-plugins, migration]
  - id: configuration-file-structure
    name: "Configuration file structure"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/file/"
    match: [configuration, toml, global-tags]
  - id: csv-parser
    name: "Csv parser"
    source: "https://docs.influxdata.com/telegraf/v1/data_formats/input/csv/"
    match: [csv, parser, header-row]
  - id: data-pipeline-stages
    name: "Data pipeline stages"
    source: "https://docs.influxdata.com/telegraf/v1/concepts/data-pipeline/"
    match: [data-pipeline, inputs, processors]
  - id: environment-variable-substitution
    name: "Environment variable substitution"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/environment-variables/"
    match: [environment-variables, substitution, etc-default-telegraf]
  - id: external-plugins-execd
    name: "External plugins execd"
    source: "https://docs.influxdata.com/telegraf/v1/configure_plugins/external_plugins/"
    match: [external-plugins, execd, shim]
  - id: generating-configuration
    name: "Generating configuration"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/file/"
    match: [config-generation, input-filter, output-filter]
  - id: graphite-template-patterns
    name: "Graphite template patterns"
    source: "https://docs.influxdata.com/telegraf/v1/data_formats/template-patterns/"
    match: [graphite, templates, template-patterns]
  - id: hot-reload-config
    name: "Hot reload config"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/file/"
    match: [watch-config, reload, sighup]
  - id: json-v2-parser
    name: "Json v2 parser"
    source: "https://docs.influxdata.com/telegraf/v1/data_formats/input/json_v2/"
    match: [json-v2, gjson, json]
  - id: labels-and-selectors
    name: "Labels and selectors"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/labels-selectors/"
    match: [labels, selectors, select-flag]
  - id: linux-systemd-service
    name: "Linux systemd service"
    source: "https://docs.influxdata.com/telegraf/v1/administer/run-as-service/"
    match: [systemd, service, reload]
  - id: metric-filtering
    name: "Metric filtering"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/filtering/"
    match: [filtering, namepass, tagpass]
  - id: metrics-data-model
    name: "Metrics data model"
    source: "https://docs.influxdata.com/telegraf/v1/concepts/metrics/"
    match: [metrics, tags, fields]
  - id: monitoring-with-internal-plugin
    name: "Monitoring with internal plugin"
    source: "https://docs.influxdata.com/telegraf/v1/administer/monitor/"
    match: [monitoring, internal-plugin, self-metrics]
  - id: multiple-configuration-files
    name: "Multiple configuration files"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/file/"
    match: [config-directory, multiple-files, agent-table]
  - id: output-buffering-and-delivery
    name: "Output buffering and delivery"
    source: "https://docs.influxdata.com/telegraf/v1/concepts/data-pipeline/"
    match: [buffer, metric-buffer-limit, disk-buffer]
  - id: output-serializers
    name: "Output serializers"
    source: "https://docs.influxdata.com/telegraf/v1/configure_plugins/output_plugins/serialize-data/"
    match: [serializers, data-format, influx]
  - id: plugin-discovery
    name: "Plugin discovery"
    source: "https://docs.influxdata.com/telegraf/v1/commands/plugins/"
    match: [plugins, plugin-list, usage]
  - id: processor-ordering-and-double-pass
    name: "Processor ordering and double pass"
    source: "https://docs.influxdata.com/telegraf/v1/concepts/data-pipeline/"
    match: [processors, aggregators, processor-order]
  - id: processors-versus-aggregators
    name: "Processors versus aggregators"
    source: "https://docs.influxdata.com/telegraf/v1/configure_plugins/aggregator_processor/"
    match: [processors, aggregators, override-processor]
  - id: remote-configuration-url
    name: "Remote configuration url"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/file/"
    match: [config-url, remote-config, watch-interval]
  - id: scoping-processors-with-filters
    name: "Scoping processors with filters"
    source: "https://docs.influxdata.com/telegraf/v1/configure_plugins/aggregator_processor/"
    match: [processors, metric-filtering, namepass]
  - id: secret-stores
    name: "Secret stores"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/secrets/"
    match: [secretstores, secrets, credentials]
  - id: secrets-command
    name: "Secrets command"
    source: "https://docs.influxdata.com/telegraf/v1/commands/secrets/"
    match: [secrets-command, secret-set, secret-list]
  - id: startup-error-behavior
    name: "Startup error behavior"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/plugin-options/"
    match: [startup-error-behavior, retry, probe]
  - id: test-and-once-modes
    name: "Test and once modes"
    source: "https://docs.influxdata.com/telegraf/v1/administer/troubleshoot/"
    match: [test-mode, once-mode, test-wait]
  - id: timestamp-parsing-formats
    name: "Timestamp parsing formats"
    source: "https://docs.influxdata.com/telegraf/v1/configure_plugins/input_plugins/parse-data/"
    match: [timestamps, timestamp-format, unix]
  - id: tls-options
    name: "Tls options"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/tls/"
    match: [tls, mutual-tls, certificates]
  - id: toml-configuration-pitfalls
    name: "Toml configuration pitfalls"
    source: "https://docs.influxdata.com/telegraf/v1/configuration/toml/"
    match: [toml, table-ordering, inline-tables]
  - id: tracking-metrics-delivery
    name: "Tracking metrics delivery"
    source: "https://docs.influxdata.com/telegraf/v1/concepts/metrics/"
    match: [tracking-metrics, max-undelivered-messages, delivery]
  - id: troubleshooting-telegraf
    name: "Troubleshooting telegraf"
    source: "https://docs.influxdata.com/telegraf/v1/administer/troubleshoot/"
    match: [troubleshooting, debug, pprof]
  - id: windows-service
    name: "Windows service"
    source: "https://docs.influxdata.com/telegraf/v1/administer/run-as-service/"
    match: [windows, service, service-install]
