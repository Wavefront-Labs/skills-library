# Canonical coverage spec: Microsoft Azure.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (Microsoft certification skills-measured
# outlines and the Azure Well-Architected Framework), not from what we happened to write.
# Depth: each topic lists `subtopics` taken from the Microsoft Learn service documentation table of
# contents (How-to guides / Concepts sections) and the AZ-104/305/400/500 skills-measured sub-bullets.
# Depth round 2: next-level subtopics from the Learn service ToCs (how-to guides, tutorials,
# troubleshooting), az CLI command groups and AZ-104/305/400/500 skills-measured sub-bullets.
subject: azure
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [azure]
sources:
  - "AZ-104 Microsoft Azure Administrator skills measured: Manage identities and governance 20-25%, Implement and manage storage 15-20%, Deploy and manage compute 20-25%, Implement and manage virtual networking 15-20%, Monitor and maintain resources 10-15%"
  - "AZ-305 Designing Microsoft Azure Infrastructure Solutions: Design identity, governance and monitoring 25-30%, Design data storage 20-25%, Design business continuity 15-20%, Design infrastructure (compute, application architecture, migrations, network) 30-35%"
  - "AZ-400 Designing and Implementing Microsoft DevOps Solutions: Design and implement processes and communications, Design and implement a source control strategy, Design and implement build and release pipelines, Develop a security and compliance plan, Implement an instrumentation strategy"
  - "AZ-500 Microsoft Azure Security Technologies: Manage identity and access 25-30%, Secure networking 20-25%, Secure compute, storage and databases 20-25%, Manage security operations 25-30%"
  - "Azure Well-Architected Framework pillars: Reliability, Security, Cost Optimization, Operational Excellence, Performance Efficiency (learn.microsoft.com/azure/well-architected)"
  - "Microsoft Learn service documentation tables of contents (How-to guides and Concepts sections per service) for subtopics"
