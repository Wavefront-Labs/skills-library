# Coverage spec: design for form and experience (concept/industrial form design, UX, interaction and UI,
# visual design systems, mood-boarding, experiential/environmental design, prototyping, Figma).
# A topic is covered when an in-scope skill has a tag equal to a `match` keyword, or the keyword
# appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (IDSA/NASAD industrial design curricula, NN/g UX
# topic areas, Interaction Design Foundation literature topics, ISO 9241-210 HCD activities, The Design
# of Everyday Things, This Is Service Design Doing method chapters, NCIDQ exam content areas, SEGD
# wayfinding practice, WCAG 2.2, the Figma Help Center and Autodesk Fusion / SOLIDWORKS help ToCs),
# not from what the library already has.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (curriculum course
# units, NN/g topic article lists, ISO clause activities, book chapter sub-sections, exam content
# sub-areas, help-centre page headings).
subject: design-for-form-and-experience
scope:
  category: creative-arts
  field: design-for-form-and-experience
  products: [concept-design, ux-design, interaction-design, design-systems, mood-boarding, experiential-design, prototyping, figma]
sources:
  - "IDSA (idsa.org) education resources and NASAD Handbook industrial design degree competencies - drawing and visualisation, 3D form, materials and processes, human factors, colour-material-finish, presentation; plus Eissen and Steur 'Sketching' and 'Product Design Rendering' chapter structures"
  - "Autodesk Fusion help (help.autodesk.com/view/fusion360) - Form workspace (T-spline create/modify/symmetry/convert), Canvas, Inspect (zebra/curvature); SOLIDWORKS Help (help.solidworks.com) - Surfaces (boundary, loft, knit, thicken), Sketch Picture, Zebra Stripes and Curvature display"
  - "Nielsen Norman Group topics (nngroup.com/topics) - research methods, interviews, personas, journey mapping, information architecture, usability testing, heuristic evaluation, UX benchmarking/metrics, surveys, writing for the web, navigation, forms, ui-elements, mobile/responsive, accessibility, design systems, prototyping, service design"
  - "Interaction Design Foundation literature topics (interaction-design.org/literature) - human-centred design, design thinking, gestalt principles, visual hierarchy, affordances, micro-interactions, Fitts's law, Hick's law, onboarding, dark patterns, inclusive design, conversational design"
  - "ISO 9241-210:2019 Human-centred design for interactive systems - clause 6/7 activities - plan HCD, understand and specify context of use, specify user requirements, produce design solutions, evaluate designs against requirements"
  - "Don Norman, The Design of Everyday Things (revised 2013) - ch1 affordances/signifiers/mapping/feedback/conceptual models, ch2 gulfs of execution and evaluation, ch4 constraints and forcing functions, ch5 human error (slips and mistakes)"
  - "Stickdorn, Hormess, Lawrence, Schneider - This Is Service Design Doing (2018) - research methods (service safari, contextual interviews), mapping (personas, journey maps, system/ecosystem maps, service blueprints, stakeholder maps), ideation, prototyping (desktop walkthrough, investigative rehearsal), facilitating workshops"
  - "Dan Saffer, Microinteractions (2013) - triggers, rules, feedback, loops and modes; Material Design 3 motion and Apple Human Interface Guidelines; Microsoft Inclusive Design toolkit"
  - "W3C WCAG 2.2 success criteria and WAI-ARIA Authoring Practices; W3C Design Tokens Community Group format; Brad Frost Atomic Design; Nathan Curtis / EightShapes design system governance articles"
  - "NCIDQ Examination content areas (cidq.org) - IDFX building systems, codes, design application; IDPX professional practice, project coordination, contract documents; Practicum code requirements; IES Lighting Handbook illuminance categories; ADA Standards for Accessible Design"
  - "SEGD (segd.org) experiential graphic design resources - wayfinding planning, sign families, message schedules, location plans; exhibition interpretive planning (Serrell, Exhibit Labels)"
  - "Figma Help Center (help.figma.com) ToC - frames and layout, auto layout, components/variants/properties, variables and modes, styles, prototyping (triggers, smart animate, overlays, scroll, flows, conditionals), libraries, branching, Dev Mode, comments/version history, FigJam, vector editing, export, plugins and REST API"
