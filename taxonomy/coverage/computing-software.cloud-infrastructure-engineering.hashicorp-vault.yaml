# Coverage spec for hashicorp-vault: topics from the official documentation table of contents.
subject: hashicorp-vault
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [hashicorp-vault]
sources:
  - "https://developer.hashicorp.com/vault/docs/audit"
  - "https://developer.hashicorp.com/vault/docs/auth/approle"
  - "https://developer.hashicorp.com/vault/docs/auth/jwt"
  - "https://developer.hashicorp.com/vault/docs/auth/kubernetes"
  - "https://developer.hashicorp.com/vault/docs/commands/operator/generate-root"
  - "https://developer.hashicorp.com/vault/docs/commands/operator/init"
  - "https://developer.hashicorp.com/vault/docs/commands/operator/raft"
  - "https://developer.hashicorp.com/vault/docs/commands/operator/rekey"
  - "https://developer.hashicorp.com/vault/docs/concepts/ha"
  - "https://developer.hashicorp.com/vault/docs/concepts/lease"
  - "https://developer.hashicorp.com/vault/docs/concepts/password-policies"
  - "https://developer.hashicorp.com/vault/docs/concepts/policies"
  - "https://developer.hashicorp.com/vault/docs/concepts/response-wrapping"
  - "https://developer.hashicorp.com/vault/docs/concepts/seal"
  - "https://developer.hashicorp.com/vault/docs/concepts/tokens"
