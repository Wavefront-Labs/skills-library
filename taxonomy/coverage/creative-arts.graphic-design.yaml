# Canonical coverage spec: graphic design (all products in the graphic-design field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external, authoritative structures (Adobe Certified Professional
# exam objectives, Adobe and Figma help-centre tables of contents, the standard texts of the craft,
# AIGA competencies, ISO print standards), so the check measures the library against the subject.
# Print production (PDF/X, ISO 12647, proofing, imposition, paper and finishing) sits under
# editorial-layout and adobe-indesign, the products that own print-ready output.
subject: graphic-design
scope:
  category: creative-arts
  field: graphic-design
  products: [typography, brand-identity, editorial-layout, poster-and-campaign-graphics, information-design, commercial-illustration, lettering-and-calligraphy, adobe-illustrator, adobe-indesign, adobe-photoshop]
sources:
  - "Adobe Certified Professional in Visual Design using Adobe Photoshop - exam objectives (1 Working in the design industry, 2 Project setup and interface, 3 Organizing documents (layers, masks, selections), 4 Creating and modifying visual elements (type, adjustments, transforms, filters, retouching), 5 Publishing digital media (export, packaging)); subtopics from Photoshop User Guide (helpx.adobe.com/photoshop/user-guide.html) section headings"
  - "Adobe Certified Professional in Graphic Design and Illustration using Adobe Illustrator - exam objectives (artboards, paths and shapes, colour and swatches, type, brushes and symbols, effects and appearance, image trace, export); subtopics from Illustrator User Guide (helpx.adobe.com/illustrator/user-guide.html) section headings"
  - "Adobe Certified Professional in Print and Digital Media Publication using Adobe InDesign - exam objectives (document setup, parent pages, text and styles, tables, graphics and frames, long documents, data merge, interactive and EPUB output, preflight, package and PDF export); subtopics from InDesign User Guide (helpx.adobe.com/indesign/user-guide.html)"
  - "Figma Help Center table of contents (help.figma.com) - frames and auto layout, components and variants, styles and variables, libraries, exporting, prototyping; used for screen-delivery and design-system subtopics"
  - "Ellen Lupton, Thinking with Type (2nd ed.) - Letter (anatomy, classification, families, type on screen, font formats), Text (kerning, tracking, line spacing, alignment, hierarchy, punctuation, OpenType), Grid (golden section, single and multicolumn grids, modular grids, data tables)"
  - "Robert Bringhurst, The Elements of Typographic Style - rhythm and proportion, harmony and counterpoint, structural forms (headings, lists, tables, notes), etiquette of hyphenation and pagination, analphabetic symbols"
  - "Josef Muller-Brockmann, Grid Systems in Graphic Design - format and type area, column and grid-field construction, typeface and line spacing, image placement within the grid, grid in practice for books catalogues and posters"
  - "Alina Wheeler, Designing Brand Identity (5th ed.) - process phases (conducting research, clarifying strategy, designing identity, creating touchpoints, managing assets); basics (brand architecture, names, taglines, signature, colour, typography, sound, motion); touchpoints and guidelines"
  - "AIGA Designer of 2025 / design competencies and AIGA Standard Form of Agreement for Design Services - briefs, research, presentation and critique, accessibility, intellectual property, professional practice"
  - "ISO 15930 (PDF/X-1a, PDF/X-3, PDF/X-4), ISO 12647-2 process control for offset (paper types, tone value increase, FOGRA39/FOGRA51, GRACoL/G7), ISO 3664 viewing conditions, Ghent Workgroup output suite; Pantone/PMS spot workflow"
  - "Edward Tufte, The Visual Display of Quantitative Information, and Isotype / ISO 7001 public information symbols, SEGD wayfinding practice, WCAG 2.2 contrast for graphics"
  - "Edward Johnston, Writing and Illuminating and Lettering; IAMPETH pointed-pen copperplate and Spencerian instruction; Glyphs and FontForge manuals for type design basics"
