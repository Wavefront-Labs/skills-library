# Coverage spec for PowerDNS Authoritative Server (computing-software / networking-hardware-and-wireless).
subject: PowerDNS
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [powerdns]
sources:
  - "PowerDNS Authoritative documentation (https://github.com/PowerDNS/pdns/tree/master/docs)"
topics:
  - id: gsqlite3-backend
    name: "gsqlite3 backend"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/generic-sqlite3.rst
    match: ["gsqlite3", "sqlite3", "zone2sql"]
  - id: gmysql-backend
    name: "gmysql backend"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/generic-mysql.rst
    match: ["gmysql", "mysql", "mariadb", "innodb"]
  - id: gpgsql-backend
    name: "gpgsql backend and CockroachDB"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/generic-postgresql.rst
    match: ["gpgsql", "postgresql", "prepared-statements"]
  - id: generic-sql-queries
    name: "Generic SQL query overrides"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/generic-sql.rst
    match: ["generic-sql", "basic-query", "query-override"]
  - id: generic-sql-data
    name: "Generic SQL data rules"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/generic-sql.rst
    match: ["records-table", "ordername", "empty-non-terminals"]
  - id: bind-backend
    name: "BIND backend settings"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/bind.rst
    match: ["bind-backend", "bind-config", "named-conf"]
  - id: bind-backend-control
    name: "BIND backend pdns_control commands"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/bind.rst
    match: ["bind-add-zone", "rediscover", "bind-domain-status"]
  - id: lmdb-backend
    name: "LMDB backend"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/lmdb.rst
    match: ["lmdb", "lightning-stream", "lmdb-map-size"]
  - id: pipe-backend
    name: "Pipe backend protocol"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/pipe.rst
    match: ["pipe-backend", "pipe-abi-version", "co-process"]
  - id: remote-backend
    name: "Remote backend connectors"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/remote.rst
    match: ["remote-backend", "remote-connection-string", "json-rpc"]
  - id: geoip-backend
    name: "GeoIP backend settings"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/geoip.rst
    match: ["geoip", "mmdb", "maxmind"]
  - id: geoip-zone-file
    name: "GeoIP YAML zone file"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/geoip.rst
    match: ["placeholders", "custom-mapping", "services"]
  - id: lua2-backend
    name: "lua2 backend"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/lua2.rst
    match: ["lua2", "dns-lookup", "dnsname"]
  - id: tinydns-backend
    name: "tinydns backend"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/backends/tinydns.rst
    match: ["tinydns", "cdb", "tai-adjust"]
  - id: tsig-axfr
    name: "TSIG keys for AXFR"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/tsig.rst
    match: ["tsig", "tsig-allow-axfr", "axfr-master-tsig"]
  - id: catalog-producer
    name: "Catalog zone producer"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/catalog.rst
    match: ["catalog-zone", "producer", "catalog-hash"]
  - id: catalog-consumer
    name: "Catalog zone consumer"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/catalog.rst
    match: ["consumer", "change-primary", "create-secondary"]
  - id: views
    name: "Views and zone variants"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/views.rst
    match: ["views", "zone-variants", "split-horizon"]
  - id: dnsupdate-config
    name: "DNS UPDATE settings"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnsupdate.rst
    match: ["dnsupdate", "rfc2136", "allow-dnsupdate-from"]
  - id: dnsupdate-processing
    name: "DNS UPDATE processing and dhcpd"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnsupdate.rst
    match: ["ddns", "dhcpd", "rcode"]
  - id: primary-mode
    name: "Native and primary operation"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/modes-of-operation.rst
    match: ["primary", "native", "also-notify", "notify"]
  - id: secondary-mode
    name: "Secondary refresh and retry"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/modes-of-operation.rst
    match: ["secondary", "refresh", "xfr-cycle-interval"]
  - id: ixfr
    name: "IXFR retrieval"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/modes-of-operation.rst
    match: ["ixfr", "axfr"]
  - id: lua-axfr-filter
    name: "Lua AXFR filter"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/modes-of-operation.rst
    match: ["axfrfilter", "lua-axfr-script"]
  - id: autoprimary
    name: "Autoprimary and autosecondary"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/modes-of-operation.rst
    match: ["autoprimary", "autosecondary", "supermaster"]
  - id: dnssec-concepts
    name: "DNSSEC key model"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/intro.rst
    match: ["ksk", "zsk", "denial-of-existence"]
  - id: dnssec-ds-cds
    name: "Publishing DS, CDS and CDNSKEY"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/operational.rst
    match: ["ds", "cds", "cdnskey", "go-insecure"]
  - id: dnssec-signaling
    name: "Signaling zone bootstrapping"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/operational.rst
    match: ["rfc9615", "signaling-zone", "bootstrapping"]
  - id: nsec3
    name: "NSEC3 parameters"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/operational.rst
    match: ["nsec3", "set-nsec3", "opt-out"]
  - id: soa-edit
    name: "SOA-EDIT for signed zones"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/operational.rst
    match: ["soa-edit", "rrsig", "soa-edit-spread"]
  - id: online-signing
    name: "Online signing"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/modes-of-operation.rst
    match: ["online-signing", "hidden-primary"]
  - id: presigned-front-signing
    name: "Presigned zones and front-signing"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/modes-of-operation.rst
    match: ["presigned", "front-signing", "opendnssec"]
  - id: dnssec-bind-mode
    name: "DNSSEC with the BIND backend"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/modes-of-operation.rst
    match: ["create-bind-db", "bind-dnssec-db", "hybrid"]
  - id: pkcs11
    name: "PKCS#11 and SoftHSM"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/pkcs11.rst
    match: ["pkcs11", "hsm", "softhsm"]
  - id: p11-kit-forwarding
    name: "PKCS#11 token forwarding"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/dnssec/pkcs11.rst
    match: ["p11-kit", "forwarding", "token"]
  - id: zsk-rollover
    name: "ZSK rollover"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/zskroll.rst
    match: ["zsk", "key-rollover", "activate-key"]
  - id: ksk-rollover
    name: "KSK rollover"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/kskroll.rst
    match: ["ksk", "export-ds", "double-ds"]
  - id: ksk-rollover-cds
    name: "KSK rollover with CDS"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/kskrollcdnskey.rst
    match: ["rfc7344", "set-publish-cds"]
  - id: algorithm-rollover
    name: "Algorithm rollover"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/algoroll.rst
    match: ["algorithm-rollover", "publish-key", "unpublish-key"]
  - id: alias-records
    name: "ALIAS records"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/alias.rst
    match: ["alias", "expand-alias", "apex-cname"]
  - id: svcb-autohints
    name: "SVCB autohints"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/svcb.rst
    match: ["svcb", "https-record", "svc-autohints"]
  - id: edns-cookies
    name: "EDNS cookie secrets"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/edns-cookies.rst
    match: ["edns-cookie", "rfc9018", "secret-rollover"]
  - id: virtual-instances
    name: "Virtual instances"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/guides/virtual-instances.rst
    match: ["virtual-instances", "config-name", "systemd"]
  - id: metadata-transfer
    name: "Metadata for transfers and notification"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/domainmetadata.rst
    match: ["domain-metadata", "allow-axfr-from", "slave-renotify"]
  - id: metadata-dnssec
    name: "Metadata for DNSSEC and zone flags"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/domainmetadata.rst
    match: ["nsec3param", "publish-cds", "enable-lua-records"]
  - id: pdns-control-server
    name: "pdns_control server commands"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdns_control.1.rst
    match: ["pdns-control", "ping", "current-config", "purge"]
  - id: pdns-control-zones-stats
    name: "pdns_control zone and statistics commands"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdns_control.1.rst
    match: ["list-zones", "retrieve", "statistics", "qtypes"]
  - id: pdnsutil-zones
    name: "pdnsutil zone management"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdnsutil.1.rst
    match: ["pdnsutil", "zone-create", "zone-load", "check-all"]
  - id: pdnsutil-dnssec
    name: "pdnsutil DNSSEC commands"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdnsutil.1.rst
    match: ["secure", "rectify", "set-presigned", "algorithms"]
  - id: pdnsutil-keys
    name: "pdnsutil key commands"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdnsutil.1.rst
    match: ["dnssec-keys", "add-key", "import-key", "generate-key"]
  - id: pdnsutil-rrset
    name: "pdnsutil rrset and metadata"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdnsutil.1.rst
    match: ["rrset", "metadata", "nsec3-hash"]
  - id: pdnsutil-tsig-network
    name: "pdnsutil tsigkey, autoprimary, network, views"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdnsutil.1.rst
    match: ["tsigkey", "network", "generate"]
  - id: pdnsutil-tools
    name: "pdnsutil backend and utility tools"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/pdnsutil.1.rst
    match: ["b2b-migrate", "backend-lookup", "hash-password", "ipcipher"]
  - id: http-api-setup
    name: "Enable the HTTP API"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/http-api/index.rst
    match: ["http-api", "webserver", "api-key", "x-api-key"]
  - id: http-api-zones
    name: "Zone API endpoints"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/http-api/zone.rst
    match: ["zones", "rrsets", "changetype", "api-rectify"]
  - id: http-api-tsigkeys
    name: "TSIG keys over the API"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/http-api/tsigkey.rst
    match: ["tsigkeys", "trailing-dot"]
  - id: lua-records-setup
    name: "LUA records setup"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/lua-records/index.rst
    match: ["lua-records", "shared-state", "include"]
  - id: lua-records-health
    name: "LUA health-checked selection"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/lua-records/functions.rst
    match: ["ifportup", "ifurlup", "failover"]
  - id: lua-records-pick
    name: "LUA pick functions"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/lua-records/functions.rst
    match: ["pickrandom", "pickwhashed", "closestmagic"]
  - id: lua-records-geo
    name: "LUA geo and reverse helpers"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/lua-records/functions.rst
    match: ["country", "continent", "asnum", "createreverse"]
  - id: ixfrdist
    name: "ixfrdist redistribution"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/ixfrdist.1.rst
    match: ["ixfrdist", "zone-distribution"]
  - id: ixfrdist-config
    name: "ixfrdist.yml settings"
    source: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/manpages/ixfrdist.yml.5.rst
    match: ["ixfrdist-yml", "work-dir", "axfr-timeout"]
