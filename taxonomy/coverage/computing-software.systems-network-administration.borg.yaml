# Coverage spec for Borg Backup, from the BorgBackup 1.4 documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: borg
scope:
  category: computing-software
  field: systems-network-administration
  products: [borg]
sources:
  - "BorgBackup documentation (borgbackup.readthedocs.io) - usage, deployment, internals, FAQ"
topics:
  - id: quickstart
    name: "quickstart walkthrough"
    source: https://borgbackup.readthedocs.io/en/stable/quickstart.html
    match: [borg-quickstart]
  - id: installation
    name: "installing borg"
    source: https://borgbackup.readthedocs.io/en/stable/installation.html
    match: [borg-install]
  - id: init-and-encryption
    name: "init and encryption modes"
    source: https://borgbackup.readthedocs.io/en/stable/usage/init.html
    match: [borg-init, repokey]
  - id: keyfile-vs-repokey
    name: "keyfile versus repokey"
    source: https://borgbackup.readthedocs.io/en/stable/usage/init.html
    match: [keyfile]
  - id: append-only-repository
    name: "append-only repositories"
    source: https://borgbackup.readthedocs.io/en/stable/usage/init.html
    match: [append-only]
  - id: storage-quota
    name: "repository storage quota"
    source: https://borgbackup.readthedocs.io/en/stable/usage/init.html
    match: [storage-quota]
  - id: key-export-import
    name: "key export and import"
    source: https://borgbackup.readthedocs.io/en/stable/usage/key.html
    match: [key-export, key-import]
  - id: change-passphrase
    name: "change passphrase"
    source: https://borgbackup.readthedocs.io/en/stable/usage/key.html
    match: [change-passphrase]
  - id: paper-and-qr-keys
    name: "paper and QR key backups"
    source: https://borgbackup.readthedocs.io/en/stable/usage/key.html
    match: [paper-key, qr-html]
  - id: create-archive
    name: "create archives"
    source: https://borgbackup.readthedocs.io/en/stable/usage/create.html
    match: [borg-create]
  - id: archive-naming-placeholders
    name: "archive name placeholders"
    source: https://borgbackup.readthedocs.io/en/stable/usage/help.html
    match: [placeholders]
  - id: slashdot-hack
    name: "slashdot path hack"
    source: https://borgbackup.readthedocs.io/en/stable/usage/create.html
    match: [slashdot]
  - id: stdin-backups
    name: "backing up from stdin"
    source: https://borgbackup.readthedocs.io/en/stable/usage/create.html
