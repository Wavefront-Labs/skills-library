# Coverage spec: uv. Topics from the uv docs table of contents.
subject: uv
scope:
  category: computing-software
  field: software-engineering
  products: [uv]
sources:
  - "uv docs (docs.astral.sh/uv)"
topics:
  - id: installation
    name: "Installation"
    source: "https://docs.astral.sh/uv/getting-started/installation/"
    match: [install, standalone-installer]
  - id: first-steps
    name: "First steps"
    source: "https://docs.astral.sh/uv/getting-started/first-steps/"
    match: [first-steps, quickstart]
  - id: features
    name: "Features overview"
    source: "https://docs.astral.sh/uv/getting-started/features/"
    match: [features, overview]
  - id: install-python-guide
    name: "Installing Python guide"
    source: "https://docs.astral.sh/uv/guides/install-python/"
    match: [install-python, python-versions]
  - id: scripts-guide
    name: "Running scripts"
    source: "https://docs.astral.sh/uv/guides/scripts/"
    match: [scripts, inline-metadata]
  - id: tools-guide
    name: "Using tools"
    source: "https://docs.astral.sh/uv/guides/tools/"
    match: [uvx, tool-run]
  - id: projects-guide
    name: "Working on projects"
    source: "https://docs.astral.sh/uv/guides/projects/"
    match: [project-workflow, lockfile]
  - id: publishing-packages
    name: "Publishing packages"
    source: "https://docs.astral.sh/uv/guides/package/"
    match: [publish, build]
  - id: pip-to-project-migration
    name: "Migrating from pip to a uv project"
    source: "https://docs.astral.sh/uv/guides/migration/pip-to-project/"
    match: [migration, requirements-txt]
  - id: docker-integration
    name: "Docker integration"
    source: "https://docs.astral.sh/uv/guides/integration/docker/"
    match: [docker, container-images]
  - id: jupyter-integration
    name: "Jupyter integration"
    source: "https://docs.astral.sh/uv/guides/integration/jupyter/"
    match: [jupyter, notebooks]
  - id: marimo-integration
    name: "marimo integration"
    source: "https://docs.astral.sh/uv/guides/integration/marimo/"
    match: [marimo, notebooks]
  - id: github-actions-integration
    name: "GitHub Actions integration"
    source: "https://docs.astral.sh/uv/guides/integration/github/"
    match: [github-actions, ci]
  - id: gitlab-integration
    name: "GitLab CI/CD integration"
    source: "https://docs.astral.sh/uv/guides/integration/gitlab/"
    match: [gitlab, ci]
  - id: pre-commit-integration
    name: "Pre-commit integration"
    source: "https://docs.astral.sh/uv/guides/integration/pre-commit/"
    match: [pre-commit, hooks]
  - id: pytorch-integration
    name: "PyTorch integration"
    source: "https://docs.astral.sh/uv/guides/integration/pytorch/"
    match: [pytorch, cuda]
  - id: fastapi-integration
    name: "FastAPI integration"
    source: "https://docs.astral.sh/uv/guides/integration/fastapi/"
    match: [fastapi, deployment]
  - id: private-registries-integration
    name: "Private registry integrations (Azure, Google, AWS, JFrog)"
    source: "https://docs.astral.sh/uv/guides/integration/azure/"
    match: [artifactory, codeartifact, azure-artifacts]
  - id: dependency-bots-integration
    name: "Renovate and Dependabot integration"
    source: "https://docs.astral.sh/uv/guides/integration/renovate/"
    match: [renovate, dependabot]
  - id: aws-lambda-integration
    name: "AWS Lambda integration"
    source: "https://docs.astral.sh/uv/guides/integration/aws-lambda/"
    match: [aws-lambda, serverless]
  - id: project-layout
    name: "Project structure and files"
    source: "https://docs.astral.sh/uv/concepts/projects/layout/"
    match: [pyproject, uv-lock, venv]
  - id: project-init
    name: "Creating projects"
    source: "https://docs.astral.sh/uv/concepts/projects/init/"
    match: [uv-init, app-lib-package]
  - id: project-dependencies
    name: "Managing dependencies"
    source: "https://docs.astral.sh/uv/concepts/projects/dependencies/"
    match: [uv-add, dependency-sources, dependency-groups]
  - id: project-run
    name: "Running commands in projects"
    source: "https://docs.astral.sh/uv/concepts/projects/run/"
    match: [uv-run, project-environment]
  - id: project-sync
    name: "Locking and syncing"
    source: "https://docs.astral.sh/uv/concepts/projects/sync/"
    match: [uv-lock, uv-sync, frozen]
  - id: project-config
    name: "Configuring projects"
    source: "https://docs.astral.sh/uv/concepts/projects/config/"
    match: [entry-points, build-isolation, conflicts]
  - id: project-build
    name: "Building distributions"
    source: "https://docs.astral.sh/uv/concepts/projects/build/"
    match: [uv-build, sdist-wheel]
  - id: project-export
    name: "Exporting lockfiles"
    source: "https://docs.astral.sh/uv/concepts/projects/export/"
    match: [uv-export, requirements-export]
  - id: workspaces
    name: "Using workspaces"
    source: "https://docs.astral.sh/uv/concepts/projects/workspaces/"
    match: [workspaces, monorepo]
  - id: tools-concepts
    name: "Tools concepts"
    source: "https://docs.astral.sh/uv/concepts/tools/"
    match: [uv-tool, tool-environments]
  - id: python-versions
    name: "Python versions"
    source: "https://docs.astral.sh/uv/concepts/python-versions/"
    match: [python-discovery, managed-python, python-version-file]
  - id: package-indexes
    name: "Package indexes"
    source: "https://docs.astral.sh/uv/concepts/indexes/"
    match: [index, extra-index-url, index-strategy]
  - id: resolution
    name: "Resolution"
    source: "https://docs.astral.sh/uv/concepts/resolution/"
    match: [resolution, universal-resolution, overrides]
  - id: build-backend
    name: "Build backend"
    source: "https://docs.astral.sh/uv/concepts/build-backend/"
    match: [uv-build-backend, build-system]
  - id: authentication
    name: "Authentication"
    source: "https://docs.astral.sh/uv/concepts/authentication/"
    match: [authentication, credentials]
  - id: auth-cli
    name: "The auth CLI"
    source: "https://docs.astral.sh/uv/concepts/authentication/cli/"
    match: [uv-auth, credential-store]
  - id: http-credentials
    name: "HTTP credentials"
    source: "https://docs.astral.sh/uv/concepts/authentication/http/"
    match: [netrc, basic-auth, tokens]
  - id: git-credentials
    name: "Git credentials"
    source: "https://docs.astral.sh/uv/concepts/authentication/git/"
    match: [git-auth, ssh]
  - id: tls-certificates
    name: "TLS certificates"
    source: "https://docs.astral.sh/uv/concepts/authentication/certificates/"
    match: [tls, native-tls, ssl-cert-file]
  - id: caching
    name: "Caching"
    source: "https://docs.astral.sh/uv/concepts/cache/"
    match: [cache, cache-dir, ci-cache]
  - id: pip-environments
    name: "Using pip-interface environments"
    source: "https://docs.astral.sh/uv/pip/environments/"
    match: [uv-venv, uv-pip]
  - id: pip-packages
    name: "Managing pip-interface packages"
    source: "https://docs.astral.sh/uv/pip/packages/"
    match: [uv-pip-install, uv-pip-sync]
  - id: pip-inspection
    name: "Inspecting environments"
    source: "https://docs.astral.sh/uv/pip/inspection/"
    match: [pip-list, pip-tree, pip-freeze]
  - id: pip-dependencies
    name: "Declaring dependencies in the pip interface"
    source: "https://docs.astral.sh/uv/pip/dependencies/"
    match: [requirements-in, pip-constraints]
  - id: pip-compile
    name: "Locking environments with pip compile"
    source: "https://docs.astral.sh/uv/pip/compile/"
    match: [uv-pip-compile, requirements-txt]
  - id: pip-compatibility
    name: "Compatibility with pip"
    source: "https://docs.astral.sh/uv/pip/compatibility/"
    match: [pip-differences, pip-compat]
  - id: storage
    name: "Storage"
    source: "https://docs.astral.sh/uv/reference/storage/"
    match: [storage-directories, xdg]
  - id: installer-options
    name: "Installer options"
    source: "https://docs.astral.sh/uv/reference/installer/"
    match: [installer-env, install-path]
  - id: build-failures
    name: "Build failures troubleshooting"
    source: "https://docs.astral.sh/uv/reference/troubleshooting/build-failures/"
    match: [build-errors, troubleshooting]
  - id: resolver-internals
    name: "Resolver internals"
    source: "https://docs.astral.sh/uv/reference/internals/resolver/"
    match: [pubgrub, resolver]
