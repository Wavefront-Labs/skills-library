    name: "Litellm key alias pattern and limits"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, key-alias-pattern, upperbound-key-generate-params, default-key-generate-params]
  - id: litellm-key-rotation
    name: "Litellm key rotation"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, key-regenerate, auto-rotate, rotation-interval]
  - id: litellm-key-budget-self-serve-and-restrictions
