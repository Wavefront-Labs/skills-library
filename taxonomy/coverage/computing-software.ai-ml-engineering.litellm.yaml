# Coverage spec: litellm. Topics from the official docs table of contents.
subject: litellm
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [litellm]
sources:
  - "litellm official docs"
topics:
  - id: litellm-proxy-install-quickstart
    name: "Litellm proxy install quickstart"
    source: "https://docs.litellm.ai/docs/proxy/quick_start"
    match: [litellm, proxy, install, quickstart]
  - id: litellm-proxy-config-model-list
    name: "Litellm proxy config model list"
    source: "https://docs.litellm.ai/docs/proxy/quick_start"
    match: [litellm, config-yaml, model-list, litellm-params]
  - id: litellm-proxy-debug-logging
    name: "Litellm proxy debug logging"
    source: "https://docs.litellm.ai/docs/proxy/quick_start"
    match: [litellm, litellm-log, detailed-debug, proxy-debugging]
  - id: litellm-virtual-keys-setup
    name: "Litellm virtual keys setup"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, virtual-keys, master-key, key-generate]
  - id: litellm-key-inheritance-from-owner
    name: "Litellm key inheritance from owner"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, virtual-keys, allowed-routes, key-owner]
  - id: litellm-spend-tracking-key-user-team
    name: "Litellm spend tracking key user team"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, spend-tracking, key-info, team-info]
  - id: litellm-key-model-aliases
    name: "Litellm key model aliases"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, key-aliases, model-alias, upgrade-downgrade]
  - id: litellm-key-custom-header
    name: "Litellm key custom header"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, litellm-key-header-name, authorization-header, api-gateway]
  - id: litellm-overwrite-user-with-key-hash
    name: "Litellm overwrite user with key hash"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, overwrite-user-with-key-hash, end-user-id, abuse-detection]
  - id: litellm-block-unblock-keys
    name: "Litellm block unblock keys"
    source: "https://docs.litellm.ai/docs/proxy/virtual_keys"
    match: [litellm, key-block, key-unblock, disable-key]
