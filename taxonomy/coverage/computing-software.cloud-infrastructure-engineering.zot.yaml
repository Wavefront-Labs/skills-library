# Coverage spec: zot. Topics from the Zot docs (zotregistry.dev, source repo project-zot/project-zot.github.io).
subject: zot
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [zot]
sources:
  - "Zot docs (zotregistry.dev; markdown at github.com/project-zot/project-zot.github.io/docs)"
topics:
  - id: install-and-run
    name: "Installing and running Zot"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/admin-guide/admin-getting-started.md"
    match: [install, podman, minimal-image]
  - id: build-from-source
    name: "Building Zot from source"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/admin-guide/admin-getting-started.md"
    match: [build-from-source, make-binary, binary-minimal]
  - id: container-config-override
    name: "Overriding the container configuration"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/admin-guide/admin-getting-started.md"
    match: [container-config, custom-config, bind-mount]
  - id: config-file
    name: "Configuration file, verify and hot reload"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/admin-guide/admin-configuration.md"
    match: [config-file, hot-reload, zot-verify]
  - id: extensions-model
    name: "Extensions and the full versus minimal image"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/general/extensions.md"
    match: [extensions, mgmt-extension, userprefs]
  - id: http-hardening
    name: "HTTP settings, timeouts and rate limits"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/admin-guide/admin-configuration.md"
    match: [http-config, shutdown-timeout, rate-limiting, fail-delay]
  - id: docker-compat
    name: "Docker schema 2 compatibility mode"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/admin-guide/admin-configuration.md"
    match: [docker-compat, docker2s2, preserve-digest]
  - id: storage-core
    name: "Core storage settings and dedupe"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/storage.md"
    match: [storage-config, dedupe, hydrate-blob-on-read]
  - id: storage-errors
    name: "Storage failure status codes"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/storage.md"
    match: [storage-errors, status-503, fail-closed]
  - id: repository-quotas
    name: "Repository quotas"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/storage.md"
    match: [max-repo-bytes, repository-quota, max-repos]
  - id: garbage-collection
    name: "Garbage collection"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/storage.md"
    match: [garbage-collection, gc-delay, gc-time-window]
  - id: remote-object-storage
    name: "S3, GCS and Azure remote storage"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/storage.md"
    match: [s3-storage, redirect-blob-url, gcs-storage, azure-blob]
  - id: cache-drivers
    name: "Cache drivers BoltDB, DynamoDB and Redis"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/storage.md"
    match: [cache-driver, boltdb, dynamodb, redis-cache]
  - id: storage-subpaths
    name: "Storage subpaths"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/storage.md"
    match: [subpaths, multiple-storage, per-path-config]
  - id: htpasswd-auth
    name: "TLS and htpasswd authentication"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [htpasswd, basic-auth, bcrypt]
  - id: ldap-auth
    name: "LDAP authentication"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [ldap, bind-dn, ldap-groups]
  - id: bearer-auth
    name: "Bearer token authentication and AWS Secrets Manager keys"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [bearer-auth, upstream-token-endpoint, aws-secrets-manager, key-rotation]
  - id: oidc-bearer
    name: "OIDC workload identity and claim mapping"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [bearer-oidc, workload-identity, claim-mapping, cel-expression]
  - id: mutual-tls
    name: "Mutual TLS identity extraction"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [mtls, client-certificates, uri-san-pattern]
  - id: auth-priority
    name: "Authentication evaluation order"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [auth-priority, session-auth, request-flow]
  - id: access-control
    name: "Access control policies"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [access-control, admin-policy, disable-anonymous-catalog]
  - id: per-user-namespaces
    name: "Per-user namespaces"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [username-template, per-user-repos, multi-tenant]
  - id: network-conditions
    name: "Network conditions in CEL"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [cel-conditions, client-ip, x-forwarded-for]
  - id: social-login
    name: "Social login with OpenID and OAuth2"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/authn-authz.md"
    match: [social-login, openid, github-teams, dex-oidc]
  - id: api-keys
    name: "API keys"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/developer-guide/api-user-guide.md"
    match: [api-keys, apikey-endpoint, key-expiry]
  - id: docker-mixed-access
    name: "Docker clients with mixed anonymous access"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/docker.md"
    match: [docker-login, mixed-access, zot-docker-proxy]
  - id: immutable-tags
    name: "Immutable tags"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/immutable-tags.md"
    match: [immutable-tags, write-once, update-action]
  - id: docker-pull-through
    name: "Docker pull-through cache"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/docker.md"
    match: [pull-through-cache, registry-mirrors, docker-hub-mirror]
  - id: containerd-mirror
    name: "containerd mirror configuration"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/containerd.md"
    match: [containerd, registry-mirror, cri-plugin]
  - id: sync-config
    name: "Sync modes and attributes"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/mirroring.md"
    match: [sync-extension, mirror-modes, sync-config, sync-retries]
  - id: sync-streaming
    name: "Background and streaming on-demand sync"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/mirroring.md"
    match: [streaming-sync, on-demand-in-background, sync-staging]
  - id: sync-credential-helpers
    name: "Sync credential helpers"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/mirroring.md"
    match: [credential-helper, aws-ecr, oauth2-credential-helper]
  - id: high-availability
    name: "High availability with sync"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/high-availability.md"
    match: [high-availability, active-standby, failover]
  - id: scale-out
    name: "Scale-out clustering and UI sessions"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/scaleout.md"
    match: [scale-out, cluster-members, siphash, session-driver]
  - id: retention
    name: "Retention policies and dry run"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/retention.md"
    match: [retention, keep-tags, verify-feature, retention-dry-run]
  - id: cve-scanning
    name: "CVE scanning with Trivy"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/cve-scanning.md"
    match: [cve-scanning, trivy, trivy-db]
  - id: cve-ignore-sbom
    name: "CVE ignore files and SBOM generation"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/cve-scanning.md"
    match: [trivy-ignore, sbom, spdx-json]
  - id: cve-queries
    name: "Querying CVEs with zli and GraphQL"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/cve-scanning.md"
    match: [zli-cve, cve-diff, cve-list]
  - id: signature-trust
    name: "Signature verification with the trust extension"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/verifying-signatures.md"
    match: [trust-extension, cosign-keys, notation-certificates]
  - id: sign-and-attach
    name: "Signing and attaching artifacts"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/workflow.md"
    match: [cosign-sign, regctl-artifact, referrers]
  - id: logging-metrics
    name: "Logging and Prometheus metrics"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/monitoring.md"
    match: [prometheus-metrics, audit-log, zxp]
  - id: pprof
    name: "Performance profiling"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/pprofiling.md"
    match: [pprof, cpu-profile, go-tool-pprof]
  - id: zb-benchmark
    name: "Benchmarking with zb"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/benchmarking-with-zb.md"
    match: [zb-benchmark, load-testing, latency-percentiles]
  - id: zli-client
    name: "zli client configuration, images and search"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/user-guides/zli.md"
    match: [zli, zli-config, zli-search, search-subject]
  - id: events
    name: "Events extension"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/events.md"
    match: [events, cloudevents, nats-sink]
  - id: lint-scrub-scheduler
    name: "Lint, scrub and the scheduler"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/admin-guide/admin-configuration.md"
    match: [lint-extension, scrub, scheduler-workers]
  - id: graphql-search
    name: "GraphQL search API"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/graphql.md"
    match: [graphql, search-api, graphql-playground]
  - id: helm-install
    name: "Installing with Helm"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/install-guides/install-guide-k8s.md"
    match: [helm-chart, kubernetes-install, helm-values]
  - id: systemd-install
    name: "Installing on Linux with systemd"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/install-guides/install-guide-linux.md"
    match: [systemd, healthcheck, socket-activation]
  - id: kind-local-registry
    name: "Local registry for kind"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/kind-deploy.md"
    match: [kind-cluster, local-registry, kep-1755]
  - id: client-tools
    name: "Client tools for push and pull"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/user-guides/user-guide-datapath.md"
    match: [skopeo, regctl, oras, crane]
  - id: security-hardening
    name: "Security posture and hardening"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/articles/security-posture.md"
    match: [hardening, security-posture, ca-trust-store]
  - id: architecture
    name: "Architecture and concepts"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/general/architecture.md"
    match: [architecture, metadb, oci-layout]
  - id: api-endpoints
    name: "REST API endpoints"
    source: "https://raw.githubusercontent.com/project-zot/project-zot.github.io/main/docs/developer-guide/api-reference.md"
    match: [rest-api, swagger, mgmt-endpoint]
