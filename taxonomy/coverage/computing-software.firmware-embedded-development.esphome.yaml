# Coverage spec for ESPHome (firmware-embedded-development).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: esphome
scope:
  category: computing-software
  field: firmware-embedded-development
  products: [esphome]
sources:
  - https://esphome.io/components/esphome/
  - https://esphome.io/guides/configuration-types/
  - https://esphome.io/components/wifi/
  - https://esphome.io/components/api/
  - https://esphome.io/components/ota/esphome/
  - https://esphome.io/components/safe_mode/
  - https://esphome.io/components/logger/
  - https://esphome.io/components/deep_sleep/
  - https://esphome.io/components/substitutions/
  - https://esphome.io/components/packages/
  - https://esphome.io/components/external_components/
  - https://esphome.io/components/web_server/
  - https://esphome.io/automations/actions/
topics:
  - id: core-esphome-block
    name: Core esphome block
    source: https://esphome.io/components/esphome/
    match: [esphome, esphome-core]
  - id: node-name-rules
    name: Node name rules
    source: https://esphome.io/components/esphome/
