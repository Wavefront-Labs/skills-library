# Canonical coverage spec: Ada, SPARK and the GNAT/Alire ecosystem.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: ada-language
scope:
  category: computing-software
  field: software-engineering
  products: [ada]
sources:
  - "Ada Reference Manual 2012/2022 table of contents (ada-auth.org/standards)"
  - "learn.adacore.com courses: Introduction to Ada, Advanced Ada, SPARK, Ada for the Embedded C Developer"
  - "GNAT User's Guide, gprbuild User's Guide and Alire documentation (alire.ada.dev)"
  - "SPARK Reference Manual and SPARK User's Guide"
  - "Ravenscar profile (ARM D.13) and Ada 2022 Jorvik profile"
topics:
  - id: ada-lexical
    name: "Lexical elements"
    source: "https://www.ada-auth.org/standards/ ARM 2: Lexical Elements"
    match: [ada-lexical]
    subtopics:
      - {id: ada-lexical-comments-identifiers, name: "Comments and identifiers", match: [comments-identifiers]}
      - {id: ada-lexical-literals-numeric-char, name: "Numeric, character and string literals", match: [literals-numeric-char]}
  - id: ada-scalar-types
    name: "Scalar types"
    source: "ARM 3.5: Scalar Types"
    match: [ada-scalar-types]
    subtopics:
      - {id: ada-scalar-types-integer-modular-types, name: "Integer and modular types", match: [integer-modular-types]}
      - {id: ada-scalar-types-enumeration-types, name: "Enumeration types", match: [enumeration-types]}
      - {id: ada-scalar-types-float-fixed-types, name: "Floating point and fixed point types", match: [float-fixed-types]}
  - id: ada-subtypes
    name: "Subtypes and derived types"
    source: "ARM 3.2.2 and 3.4: subtypes and derived types"
    match: [ada-subtypes]
    subtopics:
      - {id: ada-subtypes-subtypes-constraints, name: "Subtypes and constraints", match: [subtypes-constraints]}
      - {id: ada-subtypes-derived-types-conversion, name: "Derived types and type conversion", match: [derived-types-conversion]}
  - id: ada-arrays
    name: "Arrays"
    source: "ARM 3.6: Array Types"
    match: [ada-arrays]
    subtopics:
      - {id: ada-arrays-constrained-unconstrained-arrays, name: "Constrained and unconstrained arrays", match: [constrained-unconstrained-arrays]}
      - {id: ada-arrays-array-slices-multidim, name: "Slices, concatenation and multidimensional arrays", match: [array-slices-multidim]}
  - id: ada-records
    name: "Records and discriminants"
    source: "ARM 3.7-3.8: Discriminants, Record Types"
    match: [ada-records]
    subtopics:
      - {id: ada-records-record-types-aggregates, name: "Record types and aggregates", match: [record-types-aggregates]}
      - {id: ada-records-discriminants-variant-records, name: "Discriminants and variant records", match: [discriminants-variant-records]}
  - id: ada-access-types
    name: "Access types"
    source: "ARM 3.10: Access Types"
    match: [ada-access-types]
    subtopics:
      - {id: ada-access-types-access-types-allocators, name: "Access types and allocators", match: [access-types-allocators]}
      - {id: ada-access-types-accessibility-anonymous-access, name: "Accessibility rules and anonymous access", match: [accessibility-anonymous-access]}
  - id: ada-strings
    name: "Strings"
    source: "ARM A.4: String Handling"
    match: [ada-strings]
    subtopics:
      - {id: ada-strings-fixed-strings, name: "Fixed-length strings and Ada.Strings.Fixed", match: [fixed-strings]}
      - {id: ada-strings-unbounded-strings, name: "Unbounded and bounded strings", match: [unbounded-strings]}
  - id: ada-control-flow
    name: "Control structures"
    source: "ARM 5: Statements"
    match: [ada-control-flow]
    subtopics:
      - {id: ada-control-flow-if-case-statements, name: "if, case and conditional expressions", match: [if-case-statements]}
      - {id: ada-control-flow-loops-exit, name: "Loops, exit and labels", match: [loops-exit]}
  - id: ada-subprograms
    name: "Subprograms"
    source: "ARM 6: Subprograms"
    match: [ada-subprograms]
    subtopics:
      - {id: ada-subprograms-parameter-modes, name: "Parameter modes and named association", match: [parameter-modes]}
      - {id: ada-subprograms-overloading-expression-functions, name: "Overloading, operators and expression functions", match: [overloading-expression-functions]}
  - id: ada-packages
    name: "Packages"
    source: "ARM 7: Packages"
    match: [ada-packages]
    subtopics:
      - {id: ada-packages-package-spec-body-private, name: "Package specification, body and private part", match: [package-spec-body-private]}
      - {id: ada-packages-child-packages, name: "Child packages and hierarchical units", match: [child-packages]}
  - id: ada-generics
    name: "Generic units"
    source: "ARM 12: Generic Units"
    match: [ada-generics]
    subtopics:
      - {id: ada-generics-generic-packages-subprograms, name: "Generic packages and subprograms", match: [generic-packages-subprograms]}
      - {id: ada-generics-formal-packages-ada-containers-generic, name: "Formal packages and generic constraints", match: [formal-packages-ada-containers-generic]}
  - id: ada-oop
    name: "Object-oriented programming"
    source: "ARM 3.9: Tagged Types and Type Extensions"
    match: [ada-oop]
    subtopics:
      - {id: ada-oop-tagged-types-extension, name: "Tagged types and type extension", match: [tagged-types-extension]}
      - {id: ada-oop-interfaces-abstract-types, name: "Interfaces and abstract types", match: [interfaces-abstract-types]}
  - id: ada-exceptions
    name: "Exceptions"
    source: "ARM 11: Exceptions"
    match: [ada-exceptions]
    subtopics:
      - {id: ada-exceptions-exception-handling, name: "Raising and handling exceptions", match: [exception-handling]}
      - {id: ada-exceptions-exception-occurrence-info, name: "Exception occurrences and messages", match: [exception-occurrence-info]}
  - id: ada-contracts
    name: "Contracts and aspects"
    source: "ARM 6.1.1, 7.3.2, 3.2.4: Pre/Post, Type_Invariant, Predicates"
    match: [ada-contracts]
    subtopics:
      - {id: ada-contracts-pre-post-conditions, name: "Pre and Post conditions", match: [pre-post-conditions]}
      - {id: ada-contracts-type-invariants-predicates, name: "Type invariants and subtype predicates", match: [type-invariants-predicates]}
  - id: ada-tasking
    name: "Tasks and rendezvous"
    source: "ARM 9: Tasks and Synchronization"
    match: [ada-tasking]
    subtopics:
      - {id: ada-tasking-task-types-entries, name: "Task types, entries and rendezvous", match: [task-types-entries]}
      - {id: ada-tasking-task-synchronisation-requeue, name: "Entry families, queues and requeue", match: [task-synchronisation-requeue]}
  - id: ada-protected
    name: "Protected objects"
    source: "ARM 9.4: Protected Units and Protected Objects"
    match: [ada-protected]
    subtopics:
      - {id: ada-protected-protected-objects-entries, name: "Protected objects, functions, procedures and entries", match: [protected-objects-entries]}
      - {id: ada-protected-protected-barriers-requeue, name: "Barriers, entry bodies and requeue", match: [protected-barriers-requeue]}
  - id: ada-select-abort
    name: "Selective accept, delays and abort"
    source: "ARM 9.7-9.8: Select Statements, Abort"
    match: [ada-select-abort]
    subtopics:
      - {id: ada-select-abort-selective-accept-timed-call, name: "Selective accept and timed entry calls", match: [selective-accept-timed-call]}
      - {id: ada-select-abort-abort-atc, name: "Abort and asynchronous transfer of control", match: [abort-atc]}
  - id: ada-real-time
    name: "Time, delays and clocks"
    source: "ARM 9.6, D.8, A.14: Delays, Real_Time, Calendar"
    match: [ada-real-time]
    subtopics:
      - {id: ada-real-time-delay-until-periodic, name: "delay and delay until: periodic tasks", match: [delay-until-periodic]}
      - {id: ada-real-time-calendar-real-time-types, name: "Ada.Calendar and Ada.Real_Time types", match: [calendar-real-time-types]}
  - id: ada-ravenscar
    name: "Ravenscar and Jorvik profiles"
    source: "ARM D.13: Ravenscar Profile; Ada 2022 Jorvik"
    match: [ada-ravenscar]
    subtopics:
      - {id: ada-ravenscar-ravenscar-profile, name: "Ravenscar profile restrictions", match: [ravenscar-profile]}
      - {id: ada-ravenscar-jorvik-profile, name: "Jorvik profile", match: [jorvik-profile]}
  - id: ada-priority-scheduling
    name: "Priorities and scheduling"
    source: "ARM D: Real-Time Systems"
    match: [ada-priority-scheduling]
    subtopics:
      - {id: ada-priority-scheduling-priorities-ceiling-locking, name: "Task priorities and ceiling locking", match: [priorities-ceiling-locking]}
      - {id: ada-priority-scheduling-dispatching-policy-edf, name: "Dispatching policies and Round_Robin/EDF", match: [dispatching-policy-edf]}
  - id: ada-containers
    name: "Containers"
    source: "ARM A.18: Containers"
    match: [ada-containers]
    subtopics:
      - {id: ada-containers-vectors-lists, name: "Vectors and doubly linked lists", match: [vectors-lists]}
      - {id: ada-containers-maps-sets, name: "Hashed/ordered maps and sets", match: [maps-sets]}
  - id: ada-text-io
    name: "Text and file I/O"
    source: "ARM A.10: Input-Output"
    match: [ada-text-io]
    subtopics:
      - {id: ada-text-io-text-io-basics, name: "Text_IO basics", match: [text-io-basics]}
      - {id: ada-text-io-sequential-direct-streams, name: "Sequential, Direct and Stream IO", match: [sequential-direct-streams]}
  - id: ada-aspects-pragmas
    name: "Aspects, pragmas and attributes"
    source: "ARM 13.1 and Annex J, K: Aspect specifications"
    match: [ada-aspects-pragmas]
    subtopics:
      - {id: ada-aspects-pragmas-aspect-specifications, name: "Aspect specifications", match: [aspect-specifications]}
      - {id: ada-aspects-pragmas-representation-clauses, name: "Representation clauses and attribute definition", match: [representation-clauses]}
  - id: ada-low-level
    name: "Low-level programming"
    source: "ARM 13.7-13.9, C.6: System, Unchecked, Volatile"
    match: [ada-low-level]
    subtopics:
      - {id: ada-low-level-system-address-unchecked-conversion, name: "System.Address and Unchecked_Conversion", match: [system-address-unchecked-conversion]}
      - {id: ada-low-level-volatile-atomic-memory-mapped, name: "Volatile, Atomic and memory-mapped registers", match: [volatile-atomic-memory-mapped]}
  - id: ada-interfacing
    name: "Interfacing with C"
    source: "ARM Annex B: Interface to Other Languages"
    match: [ada-interfacing]
    subtopics:
      - {id: ada-interfacing-interfaces-c-import-export, name: "Interfaces.C, Import and Export", match: [interfaces-c-import-export]}
      - {id: ada-interfacing-convention-c-structs-callbacks, name: "C structs, enums, arrays and callbacks", match: [convention-c-structs-callbacks]}
  - id: ada-memory-management
    name: "Memory management and controlled types"
    source: "ARM 13.11, 7.6: Storage Management, Controlled Types"
    match: [ada-memory-management]
    subtopics:
      - {id: ada-memory-management-unchecked-deallocation-pools, name: "Unchecked_Deallocation and storage pools", match: [unchecked-deallocation-pools]}
      - {id: ada-memory-management-controlled-types-finalization, name: "Controlled types and finalization", match: [controlled-types-finalization]}
  - id: ada-iterators
    name: "User-defined indexing and iteration"
    source: "ARM 4.1.6, 5.5.2: User-Defined References, Iterator Types"
    match: [ada-iterators]
    subtopics:
      - {id: ada-iterators-generalized-iteration, name: "Generalized iteration and for-of", match: [generalized-iteration]}
      - {id: ada-iterators-user-defined-literals-indexing, name: "Variable_Indexing, reference types and literals", match: [user-defined-literals-indexing]}
  - id: ada-numerics
    name: "Numerics"
    source: "ARM A.5 and G: Numerics"
    match: [ada-numerics]
    subtopics:
      - {id: ada-numerics-elementary-functions-random, name: "Elementary functions and random numbers", match: [elementary-functions-random]}
      - {id: ada-numerics-big-numbers-decimal, name: "Big numbers and decimal arithmetic", match: [big-numbers-decimal]}
  - id: ada-visibility
    name: "Library units and visibility"
    source: "ARM 8, 10: Visibility, Program Structure"
    match: [ada-visibility]
    subtopics:
      - {id: ada-visibility-with-use-renames, name: "with, use, use type and renames", match: [with-use-renames]}
      - {id: ada-visibility-separate-subunits-limited-with, name: "Subunits and limited with", match: [separate-subunits-limited-with]}
  - id: ada-environment
    name: "Command line, environment and OS"
    source: "ARM A.15-A.17: Command_Line, Directories, Environment"
    match: [ada-environment]
    subtopics:
      - {id: ada-environment-command-line-env-vars, name: "Command line and environment variables", match: [command-line-env-vars]}
      - {id: ada-environment-directories-os-lib, name: "Ada.Directories and GNAT.OS_Lib", match: [directories-os-lib]}
  - id: spark-intro
    name: "SPARK subset and gnatprove"
    source: "SPARK Reference Manual; SPARK User's Guide"
    match: [spark-intro]
    subtopics:
      - {id: spark-intro-spark-mode-subset, name: "SPARK_Mode and the SPARK subset", match: [spark-mode-subset]}
      - {id: spark-intro-gnatprove-usage, name: "Running gnatprove and reading results", match: [gnatprove-usage]}
  - id: spark-flow
    name: "Flow analysis contracts"
    source: "SPARK RM 6.1: Global, Depends, Initializes"
    match: [spark-flow]
    subtopics:
      - {id: spark-flow-global-depends-contracts, name: "Global and Depends contracts", match: [global-depends-contracts]}
      - {id: spark-flow-abstract-state-initializes, name: "Abstract_State, Initializes and Refined_State", match: [abstract-state-initializes]}
  - id: spark-proof
    name: "Proof of absence of run-time errors"
    source: "SPARK UG: Proof, Loop Invariants"
    match: [spark-proof]
    subtopics:
      - {id: spark-proof-loop-invariants-variants, name: "Loop invariants and variants", match: [loop-invariants-variants]}
      - {id: spark-proof-overflow-range-checks-proof, name: "Proving overflow, range and index checks", match: [overflow-range-checks-proof]}
  - id: spark-levels
    name: "Assurance levels"
    source: "SPARK UG: Stone, Bronze, Silver, Gold, Platinum"
    match: [spark-levels]
    subtopics:
      - {id: spark-levels-adoption-levels, name: "Stone, Bronze, Silver, Gold adoption levels", match: [adoption-levels]}
      - {id: spark-levels-proof-debugging-trace, name: "Debugging unproved checks", match: [proof-debugging-trace]}
  - id: spark-ghost-lemma
    name: "Ghost code and lemmas"
    source: "SPARK RM 6.9: Ghost Code"
    match: [spark-ghost-lemma]
    subtopics:
      - {id: spark-ghost-lemma-ghost-code, name: "Ghost entities", match: [ghost-code]}
      - {id: spark-ghost-lemma-lemma-assume-axiomatization, name: "Lemmas, Assume and axiomatization", match: [lemma-assume-axiomatization]}
  - id: gnat-compiler
    name: "GNAT compiler"
    source: "GNAT User's Guide: Compiling"
    match: [gnat-compiler]
    subtopics:
      - {id: gnat-compiler-gnat-compile-switches, name: "gnatmake/gcc switches and warnings", match: [gnat-compile-switches]}
      - {id: gnat-compiler-gnat-pragmas-restrictions, name: "Restrictions and configuration pragmas", match: [gnat-pragmas-restrictions]}
  - id: gnat-gpr
    name: "GPRbuild project files"
    source: "GPRbuild User's Guide"
    match: [gnat-gpr]
    subtopics:
      - {id: gnat-gpr-gpr-project-files, name: "Project files: sources, objects, builder", match: [gpr-project-files]}
      - {id: gnat-gpr-gpr-libraries-aggregates, name: "Library projects, extending, aggregates", match: [gpr-libraries-aggregates]}
  - id: gnat-alire
    name: "Alire package manager"
    source: "Alire documentation (alire.ada.dev)"
    match: [gnat-alire]
    subtopics:
      - {id: gnat-alire-alire-crate-management, name: "Alire: create, build and manage crates", match: [alire-crate-management]}
      - {id: gnat-alire-alire-publish-index, name: "Alire publishing and index", match: [alire-publish-index]}
  - id: gnat-tools
    name: "GNAT tool suite"
    source: "GNAT User's Guide: gnatcheck, gnatpp, gnatmetric, gnattest, gnatdoc"
    match: [gnat-tools]
    subtopics:
      - {id: gnat-tools-gnatformat-gnatpp-gnatcheck, name: "Formatting and static rule checking", match: [gnatformat-gnatpp-gnatcheck]}
      - {id: gnat-tools-gnatdoc-gnatmetric-gnatstub, name: "gnatdoc, gnatmetric and gnatstub", match: [gnatdoc-gnatmetric-gnatstub]}
  - id: gnat-debug-bind
    name: "Debugging, binder and linking"
    source: "GNAT User's Guide: Debugging, gnatbind, gnatlink"
    match: [gnat-debug-bind]
    subtopics:
      - {id: gnat-debug-bind-gdb-debugging, name: "Debugging Ada with GDB", match: [gdb-debugging]}
      - {id: gnat-debug-bind-gnatbind-elaboration-order, name: "Binder, elaboration order and linking", match: [gnatbind-elaboration-order]}
  - id: ada-embedded
    name: "Embedded and bare-metal Ada"
    source: "Ada for the Embedded C Developer; Ada_Drivers_Library"
    match: [ada-embedded]
    subtopics:
      - {id: ada-embedded-bareboard-runtimes, name: "Bare-board runtimes and cross toolchains", match: [bareboard-runtimes]}
      - {id: ada-embedded-interrupt-handlers, name: "Interrupt handling with protected procedures", match: [interrupt-handlers]}
  - id: ada-versions
    name: "Language versions and the standard"
    source: "Ada 83/95/2005/2012/2022 Reference Manual; AARM"
    match: [ada-versions]
    subtopics:
      - {id: ada-versions-ada-2012-2022-features, name: "Ada 2012 and Ada 2022 features", match: [ada-2012-2022-features]}
      - {id: ada-versions-aarm-reading-the-arm, name: "Reading the ARM and AARM", match: [aarm-reading-the-arm]}
  - id: ada-testing
    name: "Testing and coverage"
    source: "AUnit, GNATtest, GNATcoverage"
    match: [ada-testing]
    subtopics:
      - {id: ada-testing-aunit-gnattest, name: "AUnit and GNATtest", match: [aunit-gnattest]}
      - {id: ada-testing-gnatcov-coverage, name: "Coverage with GNATcoverage and contracts as tests", match: [gnatcov-coverage]}
  - id: ada-elaboration
    name: "Elaboration and categorisation"
    source: "ARM 10.2, E.2, 3.11: Elaboration; Pure, Preelaborate"
    match: [ada-elaboration]
    subtopics:
      - {id: ada-elaboration-preelaborate-pure-categories, name: "Pure, Preelaborate and Elaborate_Body", match: [preelaborate-pure-categories]}
      - {id: ada-elaboration-elaboration-order-checks, name: "Elaboration checks and static model", match: [elaboration-order-checks]}
