# Coverage spec: biome. Topics from the official docs.
subject: biome
scope:
  category: computing-software
  field: web-development
  products: [biome]
sources:
  - "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/"
topics:
  - id: why-biome
    name: "Why Biome and design principles"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/introduction/why-biome.mdx"
    match: [design-principles,toolchain]
  - id: comparison
    name: "Comparison with Prettier, ESLint and Oxc"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/introduction/comparison-with-other-tools.mdx"
    match: [comparison,oxc]
  - id: language-support
    name: "Supported languages"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/introduction/language-support.mdx"
    match: [language-support]
  - id: html-super-languages
    name: "Vue, Svelte and Astro support"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/introduction/language-support.mdx"
    match: [vue,svelte,astro]
  - id: markdown
    name: "Markdown support"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/introduction/language-support.mdx"
    match: [markdown,code-fence]
  - id: install
    name: "Installing Biome"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/install-biome.mdx"
    match: [install,standalone-binary]
  - id: install-other
    name: "Homebrew, Docker and releases"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/install-biome.mdx"
    match: [homebrew,docker]
  - id: quick-start
    name: "Quick start"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/quick-start.mdx"
    match: [quick-start]
  - id: migrate-eslint
    name: "Migrate from ESLint"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/migrate-from-other-tools.mdx"
    match: [migrate-eslint]
  - id: migrate-prettier
    name: "Migrate from Prettier and Stylelint"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/migrate-from-other-tools.mdx"
    match: [migrate-prettier,migrate-stylelint]
  - id: upgrade-v2
    name: "Upgrading to Biome v2"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/upgrade-to-biome-v2.mdx"
    match: [upgrade-v2]
  - id: v2-globs
    name: "Glob and includes changes in v2"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/upgrade-to-biome-v2.mdx"
    match: [glob-engine,relative-paths]
  - id: organize-imports
    name: "Import organizer"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/installation/upgrade-to-biome-v2.mdx"
    match: [organize-imports,import-groups]
  - id: config-structure
    name: "Configuration file structure"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/configure-biome.mdx"
    match: [biome-json,language-options]
  - id: config-resolution
    name: "Configuration resolution"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/configure-biome.mdx"
    match: [config-resolution,config-discovery]
  - id: files-includes
    name: "files.includes and force-ignore"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/configure-biome.mdx"
    match: [files-includes,double-bang]
  - id: well-known-files
    name: "Well-known JSON files"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/configure-biome.mdx"
    match: [well-known-files,tsconfig]
  - id: vcs
    name: "VCS integration"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/integrate-with-vcs.mdx"
    match: [vcs,gitignore]
  - id: changed-staged
    name: "Changed and staged files"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/integrate-with-vcs.mdx"
    match: [changed-files,staged]
  - id: monorepo
    name: "Monorepo configuration"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/big-projects.mdx"
    match: [monorepo,root-config]
  - id: extends
    name: "Shared configurations with extends"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/configuration/big-projects.mdx"
    match: [shared-config,extends]
  - id: config-plugins-root
    name: "schema, root and plugins options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [root,schema]
  - id: config-files-vcs
    name: "files and vcs options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [files-maxsize,vcs-root]
  - id: config-linter
    name: "Linter configuration"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [linter-config,rules-preset]
  - id: config-assist
    name: "Assist configuration"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [assist-config,assist-actions]
  - id: config-formatter
    name: "Formatter configuration"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [formatter-config,indentstyle]
  - id: tailwind
    name: "Tailwind configuration"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [tailwind,variantfunctions]
  - id: overrides
    name: "Overrides"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [overrides,per-file-config]
  - id: js-formatter
    name: "JavaScript formatter options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [javascript-formatter,quotestyle]
  - id: js-parser
    name: "JavaScript parser options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [javascript-globals,jsxruntime]
  - id: json-config
    name: "JSON options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [json-formatter,json-parser]
  - id: css-config
    name: "CSS options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [css-formatter,css-modules]
  - id: html-config
    name: "HTML options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [html-config,whitespacesensitivity]
  - id: other-langs-config
    name: "Markdown, YAML, GraphQL and Grit options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [markdown-config,yaml-formatter]
  - id: glob-syntax
    name: "Glob syntax"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/configuration.mdx"
    match: [glob-syntax,globstar]
  - id: formatter-usage
    name: "Formatter CLI and defaults"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/formatter/index.mdx"
    match: [formatter-defaults,biome-format]
  - id: formatter-ignore
    name: "Formatter ignore comments"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/formatter/index.mdx"
    match: [ignore-format,biome-ignore-all]
  - id: formatter-philosophy
    name: "Formatter option philosophy"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/formatter/option-philosophy.md"
    match: [option-philosophy,prettier-challenge]
  - id: prettier-diffs
    name: "Differences with Prettier"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/formatter/differences-with-prettier.md"
    match: [prettier-differences,bogus-nodes]
  - id: linter-overview
    name: "Linter rules and groups"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/index.mdx"
    match: [rule-groups,naming-convention]
  - id: lint-fixes
    name: "Safe and unsafe fixes"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/index.mdx"
    match: [safe-fixes,unsafe-fixes]
  - id: lint-severity
    name: "Rule severity and options"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/index.mdx"
    match: [rule-severity,only-flag]
  - id: lint-domains
    name: "Domains and the scanner"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/index.mdx"
    match: [linter-domains,scanner]
  - id: lint-migrate-suppress
    name: "ESLint migration with suppress"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/index.mdx"
    match: [lint-suppress,suppress-reason]
  - id: suppressions
    name: "Suppression comments"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/analyzer/suppressions.mdx"
    match: [suppressions,inline-suppression]
  - id: range-suppressions
    name: "Range and plugin suppressions"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/analyzer/suppressions.mdx"
    match: [range-suppression,plugin-suppression]
  - id: plugins-overview
    name: "Plugin formats"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/plugins.mdx"
    match: [linter-plugins,plugin-tradeoffs]
  - id: gritql-plugins
    name: "GritQL plugins"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/plugins.mdx"
    match: [gritql-plugin,register-diagnostic]
  - id: plugin-includes
    name: "Plugin includes and resolution"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/plugins.mdx"
    match: [plugin-includes,resolutionkind]
  - id: js-plugins
    name: "JavaScript plugins"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/plugins.mdx"
    match: [javascript-plugin,definerule]
  - id: semantic-model
    name: "Plugin semantic model API"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/plugins.mdx"
    match: [semantic-model,binding]
  - id: domains-frameworks
    name: "Framework domains"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/domains.mdx"
    match: [domain-detection,react-domain]
  - id: domains-test
    name: "Test and Playwright domains"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/domains.mdx"
    match: [test-domain,playwright-domain]
  - id: domains-project
    name: "Project and types domains"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/linter/domains.mdx"
    match: [project-domain,types-domain]
  - id: cli-commands
    name: "check, ci, lint and format commands"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/cli.mdx"
    match: [biome-check,biome-ci]
  - id: cli-selectors
    name: "--only, --skip and changed files"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/cli.mdx"
    match: [skip-flag,since]
  - id: cli-global
    name: "Global CLI flags"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/cli.mdx"
    match: [global-flags,max-diagnostics]
  - id: cli-reporters
    name: "Reporters"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/cli.mdx"
    match: [reporter,sarif]
  - id: cli-config-flags
    name: "Configuration CLI flags"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/cli.mdx"
    match: [cli-config-flags,formatter-flags]
  - id: env-vars
    name: "Environment variables"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/environment-variables.md"
    match: [environment-variables,biome-log-level]
  - id: cli-migrate-search
    name: "migrate, search and inspect"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/cli.mdx"
    match: [biome-search,migrate-stylelint]
  - id: daemon
    name: "Daemon JSON-RPC methods"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/reference/daemon.md"
    match: [daemon,json-rpc]
  - id: ci-github
    name: "CI with GitHub Actions"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/recipes/continuous-integration.mdx"
    match: [github-actions,setup-biome]
  - id: ci-gitlab
    name: "CI with GitLab"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/recipes/continuous-integration.mdx"
    match: [gitlab-ci,code-quality]
  - id: hooks-lefthook-husky
    name: "Lefthook, Husky and lint-staged"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/recipes/git-hooks.mdx"
    match: [lefthook,husky]
  - id: hooks-precommit
    name: "pre-commit and shell hooks"
    source: "https://raw.githubusercontent.com/biomejs/website/main/src/content/docs/en/recipes/git-hooks.mdx"
    match: [pre-commit,shell-hook]
