# Canonical coverage spec for itam-licence-compliance, drawn from external sources listed below.
subject: itam-licence-compliance
scope:
  category: computing-software
  field: it-governance-risk-compliance
  products:
  - itam-licence-compliance
sources:
- 'ISO/IEC 19770-1 ITAM management system, -2 SWID tags, -3 entitlement schema, -5 overview (https://www.iso.org/standard/68291.html): process areas, tag and entitlement topics'
- 'IAITAM CITAM / CSAM bodies of knowledge (https://iaitam.org/): lifecycle, financial, risk, audit and vendor topics'
- 'ITIL 4 IT asset management practice (https://www.axelos.com/): practice scope, lifecycle, CMDB relation'
- 'SPDX specification 2.3 / 3.0 table of contents (https://spdx.github.io/spdx-spec/): documents, packages, files, relationships, licence expressions, licence list'
- 'CycloneDX specification overview (https://cyclonedx.org/specification/overview/): BOM types, components, services, VEX, formulation'
- 'NTIA SBOM minimum elements and CISA SBOM guidance (https://www.ntia.gov/page/software-bill-materials): data fields, automation, practices'
- 'OpenChain ISO/IEC 5230 and 18974 (https://openchainproject.org/): programme requirements'
- 'REUSE specification (https://reuse.software/spec/): licensing metadata in source trees'
- 'OSI approved licence families and FSF licence list / GPL FAQ (https://opensource.org/licenses, https://www.gnu.org/licenses/): licence categories and obligations'
- 'Vendor licensing models: Microsoft, Oracle, IBM PVU, SAP, Adobe, VMware, SaaS (vendor licensing guides)'
- NIST SP 800-88 Rev.1 media sanitisation and hardware lifecycle practice (https://csrc.nist.gov/pubs/sp/800/88/r1/final)
- FinOps Foundation framework, SaaS management (https://www.finops.org/framework/)
