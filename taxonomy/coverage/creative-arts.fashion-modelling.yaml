      - {id: rw-pa-arms, name: Shoulder and arm carriage, match: [arm-carriage]}
      - {id: rw-pa-core, name: Core and pelvis control, match: [core-and-pelvis-control]}
      - {id: rw-pa-eyeline, name: Eyeline and focus point, match: [runway-eyeline]}
  - id: rw-foot-placement
    name: Foot placement and stride
    source: agency runway training curricula
    match: [foot-placement, runway-stride]
    subtopics:
