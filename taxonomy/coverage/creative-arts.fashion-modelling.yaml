# Canonical coverage spec: fashion modelling (all products in the fashion-modelling field).
# Checked by tools/coverage_check.py. A topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external structures: agency model-development and runway
# training curricula, posing and camera-awareness texts, Model Alliance / BFC / Equity welfare
# guidance, the LVMH-Kering models charter, national law on model agencies, minors and health,
# booking and usage-rights references, and body-measurement / sizing standards (ISO 8559, ASTM).
subject: fashion-modelling
scope:
  category: creative-arts
  field: fashion-modelling
  products: [runway-walking, editorial-posing, movement-for-camera, fittings-and-showroom, castings-and-portfolio]
sources:
  - "Agency model-development and runway training curricula (new-faces development, walk training, show-day briefing) as published by major agencies and the Association of Model Agents (UK) - https://www.associationofmodelagents.org"
  - "British Fashion Council - London Fashion Week model welfare and health guidance, Models Charter commitments - https://www.britishfashioncouncil.co.uk"
  - "Model Alliance - RESPECT Program, Fashion Workers Act (New York, S2477A, effective 2025), model health and harassment resources - https://modelalliance.org"
  - "LVMH and Kering Charter on working relations and well-being of models (2017) - https://www.kering.com/en/news/kering-and-lvmh-charter-working-relations-well-being-models"
  - "Equity (UK) Models Network - model terms, rates and code of practice - https://www.equity.org.uk"
  - "CFDA Health Initiative guidelines for models - https://cfda.com"
  - "France Code du travail L7123-2-1 (model medical certificate) and Code de la sante publique L2133-2 (photographie retouchee label) - https://www.legifrance.gouv.fr"
  - "UK Conduct of Employment Agencies and Employment Businesses Regulations 2003 (modelling agency fees, cooling-off) and Children (Performances and Activities) (England) Regulations 2014 - https://www.legislation.gov.uk"
  - "California Family Code 6750-6753 (Coogan trust) and New York Child Performer Education and Trust Act - https://leginfo.legislature.ca.gov"
  - "ISO 8559-1:2017 Size designation of clothes - anthropometric definitions for body measurement - https://www.iso.org/standard/61686.html; ASTM D5585 / D6240 body measurement tables - https://www.astm.org"
  - "Posing and camera-awareness texts - Roberto Valenzuela 'Picture Perfect Posing'; Jeff Smith 'Posing for Portrait and Glamour Photography'; Lindsay Adler 'The Posing Playbook'"
  - "SAG-AFTRA commercials contract and model/digital-replica consent provisions - https://www.sagaftra.org"
