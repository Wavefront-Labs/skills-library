# Coverage spec: garage. Topics from the official docs table of contents.
subject: garage
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [garage]
sources:
  - "garage official docs"
topics:
  - id: single-node-quick-start-config
    name: "Single node quick start config"
    source: "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
    match: [quick-start, single-node, garage-toml, rpc-secret]
  - id: default-access-key-and-bucket
    name: "Default access key and bucket"
    source: "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
    match: [default-access-key, default-bucket, single-node-flag, environment-variables]
  - id: awscli-against-garage
    name: "Awscli against garage"
    source: "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
    match: [awscli, aws-endpoint-url, s3-client, awsrc]
  - id: manual-layout-assign-and-apply
    name: "Manual layout assign and apply"
    source: "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
    match: [garage-layout-assign, layout-apply, node-id, zone-capacity]
  - id: bucket-key-and-permissions-cli
    name: "Bucket key and permissions cli"
    source: "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
    match: [garage-bucket-create, garage-key-create, bucket-allow, api-keys]
  - id: cli-logging-and-troubleshooting
    name: "Cli logging and troubleshooting"
    source: "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
    match: [rust-log, log-level, troubleshooting, garage-cli]
  - id: replication-factor-setting
    name: "Replication factor setting"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [replication-factor, failure-tolerance, zones, cluster-sizing]
  - id: consistency-mode-quorums
    name: "Consistency mode quorums"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [consistency-mode, read-quorum, write-quorum, degraded-mode]
  - id: metadata-and-data-directories
    name: "Metadata and data directories"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [metadata-dir, data-dir, ssd-metadata, node-capacity]
  - id: metadata-snapshots-dir-space
    name: "Metadata snapshots dir space"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [metadata-snapshots-dir, snapshot-disk-space, metadata-snapshot]
  - id: metadata-db-engine-selection
    name: "Metadata db engine selection"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [db-engine, lmdb, sqlite, fjall]
  - id: metadata-and-data-fsync
    name: "Metadata and data fsync"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [metadata-fsync, data-fsync, durability, power-loss]
  - id: metadata-auto-snapshot-interval
    name: "Metadata auto snapshot interval"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [metadata-auto-snapshot-interval, scheduled-snapshots, garage-meta-snapshot, metadata-recovery]
  - id: scrub-disable-and-schedule
    name: "Scrub disable and schedule"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/durability-repairs/"
    match: [disable-scrub, data-scrub, garage-repair-scrub, scrub-tranquility]
  - id: lifecycle-worker-use-local-tz
    name: "Lifecycle worker use local tz"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [use-local-tz, lifecycle-worker, midnight-utc]
  - id: block-size-tuning
    name: "Block size tuning"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [block-size, chunk-size, large-objects, deduplication]
  - id: block-ram-buffer-and-concurrency
    name: "Block ram buffer and concurrency"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [block-ram-buffer-max, block-max-concurrent-reads, block-max-concurrent-writes-per-request, backpressure]
  - id: lmdb-map-size-limit
    name: "Lmdb map size limit"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [lmdb-map-size, metadata-size-limit, virtual-memory, 32-bit]
  - id: zstd-compression-level
    name: "Zstd compression level"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [compression-level, zstd, block-compression, bandwidth]
  - id: rpc-secret-sources
    name: "Rpc secret sources"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [rpc-secret, rpc-secret-file, garage-rpc-secret, shared-secret]
  - id: rpc-bind-and-public-addresses
    name: "Rpc bind and public addresses"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [rpc-bind-addr, rpc-public-addr, rpc-public-addr-subnet, rpc-bind-outgoing]
  - id: bootstrap-peers-list
    name: "Bootstrap peers list"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [bootstrap-peers, garage-node-id, peer-discovery, connect-nodes]
  - id: consul-service-discovery
    name: "Consul service discovery"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [consul-discovery, service-registration, mtls, wan-federation]
  - id: kubernetes-discovery-section
    name: "Kubernetes discovery section"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [kubernetes-discovery, garagenodes-crd, skip-crd, namespace]
  - id: s3-api-section
    name: "S3 api section"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [s3-api, s3-region, root-domain, vhost-style]
  - id: s3-web-section
    name: "S3 web section"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [s3-web, website-root-domain, add-host-to-metrics, static-website]
  - id: admin-api-tokens-and-scopes
    name: "Admin api tokens and scopes"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/admin-api/"
    match: [admin-token, admin-token-create, token-scope, bearer-token]
  - id: garage-json-api-subcommand
    name: "Garage json api subcommand"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/admin-api/"
    match: [garage-json-api, admin-api-v2, rpc-proxy, scripting]
  - id: health-endpoint-and-metrics-access
    name: "Health endpoint and metrics access"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/admin-api/"
    match: [health-endpoint, metrics-require-token, prometheus-metrics, admin-endpoint]
  - id: prometheus-cluster-health-metrics
    name: "Prometheus cluster health metrics"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/monitoring/"
    match: [cluster-healthy, cluster-available, cluster-connected-nodes, prometheus]
  - id: prometheus-api-request-metrics
    name: "Prometheus api request metrics"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/monitoring/"
    match: [api-s3-request-counter, api-s3-error-counter, api-request-duration, histogram]
  - id: log-destination-environment-variables
    name: "Log destination environment variables"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/"
    match: [garage-log-to-syslog, garage-log-to-journald, garage-log-format, no-color]
  - id: cluster-layout-versions-and-staging
    name: "Cluster layout versions and staging"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/layout/"
    match: [cluster-layout, layout-show, layout-revert, staged-changes]
  - id: scripting-layout-changes-safely
    name: "Scripting layout changes safely"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/layout/"
    match: [layout-apply-version, scripted-layout, same-rpc-host, layout-consistency]
  - id: layout-algorithm-prefers-less-data-movement
    name: "Layout algorithm prefers less data movement"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/layout/"
    match: [layout-algorithm, usable-capacity, zone-redundancy, partition-assignment]
  - id: garage-repair-command-syntax
    name: "Garage repair command syntax"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/durability-repairs/"
    match: [garage-repair, repair-yes-flag, repair-all-nodes, repair-operations]
  - id: block-repair-and-resync
    name: "Block repair and resync"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/durability-repairs/"
    match: [garage-repair-blocks, block-resync, block-reference-counter, layout-change-followup]
  - id: inspect-and-purge-lost-blocks
    name: "Inspect and purge lost blocks"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/durability-repairs/"
    match: [garage-block-list-errors, block-retry-now, block-purge, resync-errors]
  - id: metadata-reference-repairs
    name: "Metadata reference repairs"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/durability-repairs/"
    match: [garage-repair-tables, garage-repair-versions, block-refs, block-rc]
  - id: multi-hdd-data-dir-setup
    name: "Multi hdd data dir setup"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/multi-hdd/"
    match: [multi-hdd, data-dir-list, capacity-proportional, hash-slices]
  - id: multi-hdd-adding-and-rebalancing
    name: "Multi hdd adding and rebalancing"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/multi-hdd/"
    match: [multi-hdd, lazy-rebalancing, garage-repair-rebalance, secondary-directories]
  - id: multi-hdd-read-only-locations
    name: "Multi hdd read only locations"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/multi-hdd/"
    match: [read-only-data-dir, drain-drive, remove-data-directory, find-type-f]
  - id: recover-by-removing-a-failed-node
    name: "Recover by removing a failed node"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/recovering/"
    match: [node-failure, layout-remove, availability-zones, three-zone-guarantees]
  - id: replace-failed-data-drive
    name: "Replace failed data drive"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/recovering/"
    match: [disk-replacement, repair-blocks, resync-queue, garage-stats]
  - id: replace-node-with-lost-metadata
    name: "Replace node with lost metadata"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/recovering/"
    match: [layout-assign-replace, new-node-id, lost-metadata, node-replacement]
  - id: recover-corrupted-metadata-db
    name: "Recover corrupted metadata db"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/recovering/"
    match: [corrupted-metadata, snapshot-restore, db-lmdb, repair-tables]
  - id: minor-version-upgrade-procedure
    name: "Minor version upgrade procedure"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/upgrading/"
    match: [upgrading-garage, minor-upgrade, rolling-upgrade, garage-build-info]
  - id: major-version-upgrade-procedure
    name: "Major version upgrade procedure"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/upgrading/"
    match: [major-upgrade, garage-migrate, meta-snapshot-all, cluster-layout-backup]
  - id: docker-container-debugging
    name: "Docker container debugging"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/debugging/"
    match: [docker-debugging, distroless-image, docker-exec, proc-root]
  - id: systemd-service-unit
    name: "Systemd service unit"
    source: "https://garagehq.deuxfleurs.fr/documentation/cookbook/systemd/"
    match: [systemd, dynamic-user, garage-service, journalctl]
  - id: gateway-nodes
    name: "Gateway nodes"
    source: "https://garagehq.deuxfleurs.fr/documentation/cookbook/gateways/"
    match: [gateway-node, layout-assign-gateway, localhost-endpoint, table-resync]
  - id: bucket-as-website
    name: "Bucket as website"
    source: "https://garagehq.deuxfleurs.fr/documentation/cookbook/exposing-websites/"
    match: [website-hosting, garage-bucket-website, index-document, error-document]
  - id: encryption-options
    name: "Encryption options"
    source: "https://garagehq.deuxfleurs.fr/documentation/cookbook/encryption/"
    match: [encryption, sse-c, luks, client-side-encryption]
  - id: k2v-api-enablement
    name: "K2v api enablement"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/k2v/"
    match: [k2v, k2v-api, k2v-client, small-values]
  - id: s3-compatibility-high-level
    name: "S3 compatibility high level"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/s3-compatibility/"
    match: [s3-compatibility, signature-v4, presigned-urls, bucket-versioning]
  - id: s3-unimplemented-endpoints
    name: "S3 unimplemented endpoints"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/s3-compatibility/"
    match: [s3-not-implemented, bucket-policy, object-lock, bucket-acl]
  - id: known-issue-large-objects-and-many-objects
    name: "Known issue large objects and many objects"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/known-issues/"
    match: [known-issues, large-objects, multipart-upload, metadata-performance]
  - id: known-issue-consistency-limits
    name: "Known issue consistency limits"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/known-issues/"
    match: [known-issues, conditional-writes, createbucket-race, worm]
  - id: resync-tuning-and-layout-history
    name: "Resync tuning and layout history"
    source: "https://garagehq.deuxfleurs.fr/documentation/reference-manual/known-issues/"
    match: [resync-tranquility, resync-worker-count, garage-worker-set, layout-history]
  - id: prometheus-grafana-setup
    name: "Prometheus grafana setup"
    source: "https://garagehq.deuxfleurs.fr/documentation/cookbook/monitoring/"
    match: [prometheus-scrape, grafana, admin-api-bind-addr, metrics-endpoint]
  - id: storage-zone-and-capacity-planning
    name: "Storage zone and capacity planning"
    source: "https://garagehq.deuxfleurs.fr/documentation/operations/recovering/"
    match: [zones, capacity, layout-assign-tags, three-zone-deployment]
  - id: garage-cli-config-file-lookup
    name: "Garage cli config file lookup"
    source: "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
    match: [garage-config-file, garage-config-env, config-flag, docker-alias]
