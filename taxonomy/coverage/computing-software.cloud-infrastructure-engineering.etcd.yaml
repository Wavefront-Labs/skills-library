# Coverage spec: etcd. Topics from the official docs in sources.
subject: etcd
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [etcd]
sources:
  - "https://etcd.io/docs/v3.5/learning/api_guarantees/"
  - "https://etcd.io/docs/v3.5/learning/design-auth-v3/"
  - "https://etcd.io/docs/v3.5/op-guide/configuration/"
  - "https://etcd.io/docs/v3.5/op-guide/maintenance/"
  - "https://etcd.io/docs/v3.5/faq/"
  - "https://etcd.io/docs/v3.5/op-guide/failures/"
  - "https://etcd.io/docs/v3.5/dev-guide/api_concurrency_reference_v3/"
  - "https://etcd.io/docs/v3.5/learning/api/"
  - "https://etcd.io/docs/v3.5/upgrades/upgrade_3_5/"
  - "https://etcd.io/docs/v3.5/learning/data_model/"
  - "https://etcd.io/docs/v3.5/op-guide/clustering/"
  - "https://etcd.io/docs/v3.5/dev-internal/discovery_protocol/"
  - "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
  - "https://etcd.io/docs/v3.5/op-guide/security/"
  - "https://etcd.io/docs/v3.5/op-guide/runtime-configuration/"
  - "https://etcd.io/docs/v3.5/op-guide/recovery/"
  - "https://etcd.io/docs/v3.5/op-guide/gateway/"
  - "https://etcd.io/docs/v3.5/learning/glossary/"
  - "https://etcd.io/docs/v3.5/dev-guide/api_grpc_gateway/"
  - "https://etcd.io/docs/v3.5/op-guide/grpc_proxy/"
  - "https://etcd.io/docs/v3.5/op-guide/hardware/"
  - "https://etcd.io/docs/v3.5/op-guide/monitoring/"
  - "https://etcd.io/docs/v3.5/install/"
  - "https://etcd.io/docs/v3.5/op-guide/container/"
  - "https://etcd.io/docs/v3.5/tuning/"
  - "https://etcd.io/docs/v3.5/learning/design-learner/"
  - "https://etcd.io/docs/v3.5/dev-guide/local_cluster/"
  - "https://etcd.io/docs/v3.5/metrics/"
  - "https://etcd.io/docs/v3.5/op-guide/performance/"
  - "https://etcd.io/docs/v3.5/learning/persistent-storage-files/"
  - "https://etcd.io/docs/v3.5/op-guide/authentication/rbac/"
  - "https://etcd.io/docs/v3.5/platforms/aws/"
  - "https://etcd.io/docs/v3.5/op-guide/runtime-reconf-design/"
  - "https://etcd.io/docs/v3.5/dev-guide/limit/"
  - "https://etcd.io/docs/v3.5/upgrades/upgrade_3_4/"
  - "https://etcd.io/docs/v3.5/op-guide/v2-migration/"
  - "https://etcd.io/docs/v3.5/op-guide/versioning/"
  - "https://etcd.io/docs/v3.5/learning/why/"
topics:
  - id: api-guarantees
    name: "Api guarantees"
    source: "https://etcd.io/docs/v3.5/learning/api_guarantees/"
    match: [api-guarantees, linearizability, strict-serializability]
  - id: auth-tokens-and-jwt
    name: "Auth tokens and jwt"
    source: "https://etcd.io/docs/v3.5/learning/design-auth-v3/"
    match: [auth-token, jwt, simple-token]
  - id: auto-compaction
    name: "Auto compaction"
    source: "https://etcd.io/docs/v3.5/op-guide/maintenance/"
    match: [auto-compaction, compaction-mode, periodic]
  - id: client-endpoints-and-load-balancing
    name: "Client endpoints and load balancing"
    source: "https://etcd.io/docs/v3.5/faq/"
    match: [client, endpoints, load-balancing]
  - id: cluster-size-and-quorum
    name: "Cluster size and quorum"
    source: "https://etcd.io/docs/v3.5/faq/"
    match: [cluster-size, quorum, fault-tolerance]
  - id: concurrency-lock-and-election
    name: "Concurrency lock and election"
    source: "https://etcd.io/docs/v3.5/dev-guide/api_concurrency_reference_v3/"
    match: [lock, election, concurrency]
  - id: configuration-flags-and-precedence
    name: "Configuration flags and precedence"
    source: "https://etcd.io/docs/v3.5/op-guide/configuration/"
    match: [configuration, flags, environment-variables]
  - id: data-corruption-checks
    name: "Data corruption checks"
    source: "https://etcd.io/docs/v3.5/op-guide/configuration/"
    match: [corruption, corrupt-check, initial-corrupt-check]
  - id: data-model-mvcc
    name: "Data model mvcc"
    source: "https://etcd.io/docs/v3.5/learning/data_model/"
    match: [data-model, mvcc, revisions]
  - id: defragmentation
    name: "Defragmentation"
    source: "https://etcd.io/docs/v3.5/op-guide/maintenance/"
    match: [defrag, defragmentation, disk-space]
  - id: discovery-service-bootstrap
    name: "Discovery service bootstrap"
    source: "https://etcd.io/docs/v3.5/op-guide/clustering/"
    match: [discovery, discovery-url, etcd-discovery]
  - id: dns-srv-discovery
    name: "Dns srv discovery"
    source: "https://etcd.io/docs/v3.5/op-guide/clustering/"
    match: [dns-srv, discovery-srv, srv-records]
  - id: etcd-faq
    name: "Etcd faq"
    source: "https://etcd.io/docs/v3.5/faq/"
    match: [faq, cluster-size, odd-members]
  - id: etcdctl-compact
    name: "Etcdctl compact"
    source: "https://etcd.io/docs/v3.5/op-guide/maintenance/"
    match: [compact, compaction, revision]
  - id: etcdctl-delete
    name: "Etcdctl delete"
    source: "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
    match: [del, delete, prefix]
  - id: etcdctl-endpoint-health-status
    name: "Etcdctl endpoint health status"
    source: "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
    match: [endpoint, endpoint-health, endpoint-status]
  - id: etcdctl-get-prefix-range-options
    name: "Etcdctl get prefix range options"
    source: "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
    match: [get, prefix, from-key]
  - id: etcdctl-global-flags-and-output
    name: "Etcdctl global flags and output"
    source: "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
    match: [etcdctl-flags, write-out, endpoints]
  - id: etcdctl-lease-commands
    name: "Etcdctl lease commands"
    source: "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
    match: [lease, grant, revoke]
  - id: etcdctl-member-commands
    name: "Etcdctl member commands"
    source: "https://etcd.io/docs/v3.5/op-guide/runtime-configuration/"
    match: [member, member-list, member-add]
  - id: etcdctl-put-and-get
    name: "Etcdctl put and get"
    source: "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
    match: [etcdctl, put, get]
  - id: etcdctl-watch
    name: "Etcdctl watch"
    source: "https://etcd.io/docs/v3.5/dev-guide/interacting_v3/"
    match: [watch, etcdctl, prefix]
  - id: failure-modes
    name: "Failure modes"
    source: "https://etcd.io/docs/v3.5/op-guide/failures/"
    match: [failure-modes, leader-failure, majority-failure]
  - id: force-new-cluster-recovery
    name: "Force new cluster recovery"
    source: "https://etcd.io/docs/v3.5/op-guide/recovery/"
    match: [force-new-cluster, quorum-loss, disaster-recovery]
  - id: gateway-tcp-proxy
    name: "Gateway tcp proxy"
    source: "https://etcd.io/docs/v3.5/op-guide/gateway/"
    match: [gateway, tcp-proxy, etcd-gateway]
  - id: glossary-terms
    name: "Glossary terms"
    source: "https://etcd.io/docs/v3.5/learning/glossary/"
    match: [glossary, raft, term]
  - id: grpc-gateway-json
    name: "Grpc gateway json"
    source: "https://etcd.io/docs/v3.5/dev-guide/api_grpc_gateway/"
    match: [grpc-gateway, json, http]
  - id: grpc-proxy
    name: "Grpc proxy"
    source: "https://etcd.io/docs/v3.5/op-guide/grpc_proxy/"
    match: [grpc-proxy, proxy, watch-coalescing]
  - id: grpc-services-overview
    name: "Grpc services overview"
    source: "https://etcd.io/docs/v3.5/learning/api/"
    match: [grpc, services, kv]
  - id: hardware-recommendations
    name: "Hardware recommendations"
    source: "https://etcd.io/docs/v3.5/op-guide/hardware/"
    match: [hardware, cpu, memory]
  - id: health-and-readiness-endpoints
    name: "Health and readiness endpoints"
    source: "https://etcd.io/docs/v3.5/op-guide/monitoring/"
    match: [health, livez, readyz]
  - id: install-and-containers
    name: "Install and containers"
    source: "https://etcd.io/docs/v3.5/install/"
    match: [install, binary, docker]
  - id: kv-api-range-put-delete
    name: "Kv api range put delete"
    source: "https://etcd.io/docs/v3.5/learning/api/"
    match: [kv-api, range, put]
  - id: leader-election-and-pre-vote
    name: "Leader election and pre vote"
    source: "https://etcd.io/docs/v3.5/op-guide/failures/"
    match: [raft, leader-election, pre-vote]
  - id: learner-members
    name: "Learner members"
    source: "https://etcd.io/docs/v3.5/learning/design-learner/"
    match: [learner, non-voting, member-promote]
  - id: lease-api-and-expiry
    name: "Lease api and expiry"
    source: "https://etcd.io/docs/v3.5/learning/api/"
    match: [lease, lease-api, ttl]
  - id: local-cluster-goreman
    name: "Local cluster goreman"
    source: "https://etcd.io/docs/v3.5/dev-guide/local_cluster/"
    match: [local-cluster, goreman, procfile]
  - id: logging-configuration
    name: "Logging configuration"
    source: "https://etcd.io/docs/v3.5/op-guide/configuration/"
    match: [logging, logger, zap]
  - id: metrics-and-alert-thresholds
    name: "Metrics and alert thresholds"
    source: "https://etcd.io/docs/v3.5/op-guide/monitoring/"
    match: [alerts, prometheus-alerts, wal-fsync]
  - id: monitoring-metrics-endpoint
    name: "Monitoring metrics endpoint"
    source: "https://etcd.io/docs/v3.5/op-guide/monitoring/"
    match: [monitoring, metrics, prometheus]
  - id: performance-and-benchmark
    name: "Performance and benchmark"
    source: "https://etcd.io/docs/v3.5/op-guide/performance/"
    match: [performance, benchmark, throughput]
  - id: persistent-storage-files
    name: "Persistent storage files"
    source: "https://etcd.io/docs/v3.5/learning/persistent-storage-files/"
    match: [data-dir, wal, snap]
  - id: rbac-authentication
    name: "Rbac authentication"
    source: "https://etcd.io/docs/v3.5/op-guide/authentication/rbac/"
    match: [rbac, authentication, roles]
  - id: running-on-aws
    name: "Running on aws"
    source: "https://etcd.io/docs/v3.5/platforms/aws/"
    match: [aws, ec2, ebs]
  - id: runtime-reconfiguration
    name: "Runtime reconfiguration"
    source: "https://etcd.io/docs/v3.5/op-guide/runtime-configuration/"
    match: [runtime-reconfiguration, add-member, remove-member]
  - id: security-model-and-exposure
    name: "Security model and exposure"
    source: "https://etcd.io/docs/v3.5/op-guide/security/"
    match: [security, exposure, metrics-endpoint]
  - id: snapshot-restore
    name: "Snapshot restore"
    source: "https://etcd.io/docs/v3.5/op-guide/recovery/"
    match: [snapshot-restore, restore, etcdutl]
  - id: snapshot-save
    name: "Snapshot save"
    source: "https://etcd.io/docs/v3.5/op-guide/recovery/"
    match: [snapshot, snapshot-save, backup]
  - id: space-quota-and-nospace-alarm
    name: "Space quota and nospace alarm"
    source: "https://etcd.io/docs/v3.5/op-guide/maintenance/"
    match: [quota, nospace, alarm]
  - id: static-cluster-bootstrap
    name: "Static cluster bootstrap"
    source: "https://etcd.io/docs/v3.5/op-guide/clustering/"
    match: [clustering, static-bootstrap, initial-cluster]
  - id: system-limits
    name: "System limits"
    source: "https://etcd.io/docs/v3.5/dev-guide/limit/"
    match: [limits, max-request-bytes, quota-backend-bytes]
  - id: tls-client-and-peer
    name: "Tls client and peer"
    source: "https://etcd.io/docs/v3.5/op-guide/security/"
    match: [tls, security, cert-file]
  - id: transactions-txn
    name: "Transactions txn"
    source: "https://etcd.io/docs/v3.5/learning/api/"
    match: [txn, transaction, compare]
  - id: troubleshooting-common-errors
    name: "Troubleshooting common errors"
    source: "https://etcd.io/docs/v3.5/dev-guide/limit/"
    match: [troubleshooting, errors, request-too-large]
  - id: tuning-disk-and-network-priority
    name: "Tuning disk and network priority"
    source: "https://etcd.io/docs/v3.5/tuning/"
    match: [tuning, ionice, tc]
  - id: tuning-heartbeat-and-election-timeout
    name: "Tuning heartbeat and election timeout"
    source: "https://etcd.io/docs/v3.5/tuning/"
    match: [tuning, heartbeat-interval, election-timeout]
  - id: upgrade-3-3-to-3-4
    name: "Upgrade 3 3 to 3 4"
    source: "https://etcd.io/docs/v3.5/upgrades/upgrade_3_4/"
    match: [upgrade, v3-4, enable-v2]
  - id: upgrade-3-4-to-3-5
    name: "Upgrade 3 4 to 3 5"
    source: "https://etcd.io/docs/v3.5/upgrades/upgrade_3_5/"
    match: [upgrade, rolling-upgrade, v3-5]
  - id: v2-api-deprecation
    name: "V2 api deprecation"
    source: "https://etcd.io/docs/v3.5/op-guide/v2-migration/"
    match: [v2, enable-v2, v2-deprecation]
  - id: versioning-and-support-policy
    name: "Versioning and support policy"
    source: "https://etcd.io/docs/v3.5/op-guide/versioning/"
    match: [versioning, support-policy, release-branches]
  - id: watch-api-semantics
    name: "Watch api semantics"
    source: "https://etcd.io/docs/v3.5/learning/api/"
    match: [watch, watch-api, events]
  - id: why-etcd-use-cases
    name: "Why etcd use cases"
    source: "https://etcd.io/docs/v3.5/learning/why/"
    match: [why-etcd, use-cases, kubernetes]
