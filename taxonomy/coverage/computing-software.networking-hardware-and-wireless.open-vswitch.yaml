    match: ["ovs tcpdump mirror", "ovs-tcpdump", "span-capture"]
  - id: sflow-setup
    name: "sflow setup"
    source: https://docs.openvswitch.org/en/latest/howto/sflow/
    match: ["sflow setup", "sflow", "sflow-collector"]
  - id: netflow-setup
    name: "netflow setup"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt
    match: ["netflow setup", "netflow", "active-timeout"]
  - id: ipfix-sampling
    name: "ipfix sampling"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt
    match: ["ipfix sampling", "ipfix", "flow-sample-collector"]
  - id: stp-and-rstp
    name: "stp and rstp"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt
    match: ["stp and rstp", "stp", "rstp", "spanning-tree"]
  - id: multicast-snooping
    name: "multicast snooping"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt
