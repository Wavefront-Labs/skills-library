# Coverage spec for Open vSwitch (computing-software / networking-hardware-and-wireless).
subject: Open vSwitch
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [open-vswitch]
sources:
  - "ovs-vsctl(8) (http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt)"
  - "ovs-ofctl(8) (http://www.openvswitch.org/support/dist-docs/ovs-ofctl.8.txt)"
  - "ovs-vswitchd(8) (http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.8.txt)"
  - "ovs-vswitchd.conf.db(5) (http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt)"
  - "ovs-actions(7) (https://docs.openvswitch.org/en/latest/ref/ovs-actions.7/)"
  - "ovs-fields(7) (http://www.openvswitch.org/support/dist-docs/ovs-fields.7.txt)"
  - "ovs-dpctl(8) (http://www.openvswitch.org/support/dist-docs/ovs-dpctl.8.txt)"
  - "ovs-appctl(8), ovs-ctl(8), ovs-pki(8), ovs-tcpdump(8) (https://docs.openvswitch.org/en/latest/ref/)"
  - "ovsdb-tool(1), ovsdb-client(1), ovsdb-server(1), ovsdb(7) (https://docs.openvswitch.org/en/latest/ref/ovsdb.7/)"
  - "How-to guides (https://docs.openvswitch.org/en/latest/howto/)"
  - "Deep dive topics including DPDK (https://docs.openvswitch.org/en/latest/topics/)"
  - "Tutorials (https://docs.openvswitch.org/en/latest/tutorials/)"
  - "FAQ (https://docs.openvswitch.org/en/latest/faq/)"
topics:
  - id: bridge-and-port-basics
    name: "bridge and port basics"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt
    match: ["bridge and port basics", "add-br", "add-port", "del-br"]
  - id: fake-vlan-bridge
    name: "fake vlan bridge"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt
    match: ["fake vlan bridge", "fake-bridge", "add-br-parent"]
  - id: vsctl-database-commands
    name: "vsctl database commands"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt
    match: ["vsctl database commands", "vsctl-set", "vsctl-find", "vsctl-list"]
  - id: vsctl-transactions-and-create
    name: "vsctl transactions and create"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt
    match: ["vsctl transactions and create", "transactions", "create-record"]
  - id: vsctl-global-options
    name: "vsctl global options"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt
    match: ["vsctl global options", "no-wait", "may-exist", "emer-reset"]
  - id: controller-and-fail-mode
    name: "controller and fail mode"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt
    match: ["controller and fail mode", "set-controller", "fail-mode"]
  - id: vlan-access-and-trunk-ports
    name: "vlan access and trunk ports"
    source: https://docs.openvswitch.org/en/latest/howto/vlan/
    match: ["vlan access and trunk ports", "vlan-tag", "trunks", "access-port"]
  - id: vlan-mode-values
    name: "vlan mode values"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt
    match: ["vlan mode values", "vlan-mode", "dot1q-tunnel", "native-tagged"]
  - id: bond-modes-and-lacp
    name: "bond modes and lacp"
    source: https://docs.openvswitch.org/en/latest/topics/bonding/
    match: ["bond modes and lacp", "add-bond", "bond-mode", "lacp"]
  - id: bond-delay-and-rebalance
    name: "bond delay and rebalance"
    source: https://docs.openvswitch.org/en/latest/topics/bonding/
    match: ["bond delay and rebalance", "bond-updelay", "rebalance"]
  - id: bond-runtime-inspection
    name: "bond runtime inspection"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.8.txt
    match: ["bond runtime inspection", "bond-show", "lacp-show"]
  - id: gre-tunnel-between-hosts
    name: "gre tunnel between hosts"
    source: https://docs.openvswitch.org/en/latest/howto/tunneling/
    match: ["gre tunnel between hosts", "gre", "tunneling"]
  - id: tunnel-interface-options
    name: "tunnel interface options"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt
    match: ["tunnel interface options", "remote-ip", "tunnel-options"]
  - id: userspace-vxlan-tunnel
    name: "userspace vxlan tunnel"
    source: https://docs.openvswitch.org/en/latest/howto/userspace-tunneling/
    match: ["userspace vxlan tunnel", "vxlan", "tnl-route"]
  - id: patch-ports
    name: "patch ports"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vswitchd.conf.db.5.txt
    match: ["patch ports", "patch-port", "peer"]
  - id: ipsec-tunnels
    name: "ipsec tunnels"
    source: https://docs.openvswitch.org/en/latest/tutorials/ipsec/
    match: ["ipsec tunnels", "ipsec", "psk", "ovs-monitor-ipsec"]
  - id: ingress-policing
    name: "ingress policing"
    source: https://docs.openvswitch.org/en/latest/howto/qos/
    match: ["ingress policing", "ingress-policing", "policing-rate"]
  - id: linux-htb-qos-queues
    name: "linux htb qos queues"
    source: http://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt
    match: ["linux htb qos queues", "linux-htb", "qos-queues"]
  - id: dpdk-qos-policers
    name: "dpdk qos policers"
    source: https://docs.openvswitch.org/en/latest/topics/dpdk/qos/
