# Canonical coverage spec: Amazon Web Services.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (AWS certification exam guides and the
# Well-Architected Framework), not from what we happened to write.
# Subtopics (depth) come from each service's User Guide table of contents on docs.aws.amazon.com
# and the exam-guide task statements under each domain.
subject: aws
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [aws]
sources:
  - "AWS Certified Solutions Architect – Associate (SAA-C03) exam guide: Design Secure Architectures 30%, Resilient 26%, High-Performing 24%, Cost-Optimized 20%"
  - "AWS Certified Solutions Architect – Professional (SAP-C02): Organizational Complexity, New Solutions, Continuous Improvement, Migration & Modernization"
  - "AWS Certified SysOps Administrator – Associate (SOA-C02): Monitoring/Logging/Remediation, Reliability & BC, Deployment/Provisioning/Automation, Security & Compliance, Networking & Content Delivery, Cost & Performance"
  - "AWS Certified Developer – Associate (DVA-C02): Development, Security, Deployment, Troubleshooting & Optimization"
  - "AWS Well-Architected Framework pillars: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, Sustainability"
  - "Per-service User Guide tables of contents on docs.aws.amazon.com (subtopics)"
  - "Depth round 2: each service User Guide second-level ToC entries, AWS CLI v2 command groups (docs.aws.amazon.com/cli/latest/reference), and SAA-C03/SAP-C02/SOA-C02/DVA-C02 task-statement skill bullets"
