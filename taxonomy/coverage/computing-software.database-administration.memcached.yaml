subject: Memcached
scope:
  category: computing-software
  field: database-administration
  products: [memcached]
sources:
  - "https://docs.memcached.org/"
  - "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
topics:
  - id: install
    name: Install from package or source
    source: "https://docs.memcached.org/serverguide/"
    match: [install, package, build-from-source]
  - id: startup-options
    name: Startup flags m d v
    source: "https://docs.memcached.org/serverguide/configuring/"
    match: [startup-options, memory-limit, daemonize]
  - id: init-multi
    name: Multiple instances and init scripts
    source: "https://docs.memcached.org/serverguide/configuring/"
    match: [init-scripts, multiple-instances, sysconfig]
  - id: networking
    name: Bind interfaces and ports
    source: "https://docs.memcached.org/serverguide/configuring/"
    match: [networking, listen, bind]
  - id: connections
    name: Tune connection limit
    source: "https://docs.memcached.org/serverguide/configuring/"
    match: [connection-limit, -c, listen-disabled-num]
  - id: threads
    name: Worker threads sizing
    source: "https://docs.memcached.org/serverguide/configuring/"
    match: [threads, -t, worker-threads]
  - id: inspect-config
    name: Inspect running config stats settings
    source: "https://docs.memcached.org/serverguide/configuring/"
    match: [stats-settings, stats, running-config]
  - id: health-stats
    name: Key health stats
    source: "https://docs.memcached.org/serverguide/maintenance/"
    match: [health-stats, curr-connections, cmd-flush]
  - id: hit-rate
    name: Measure hit rate
    source: "https://docs.memcached.org/serverguide/maintenance/"
    match: [hit-rate, get-hits, get-misses]
  - id: evictions
    name: Diagnose evictions
    source: "https://docs.memcached.org/serverguide/maintenance/"
    match: [evictions, evicted-nonzero, evicted-time]
  - id: slab-imbalance
    name: Diagnose slab imbalance
    source: "https://docs.memcached.org/serverguide/maintenance/"
    match: [slab-imbalance, slab-rebalance, total-pages]
  - id: slab-model
    name: Slab classes and pages
    source: "https://docs.memcached.org/serverguide/performance/"
    match: [slab-allocator, slab-classes, chunk-size]
  - id: item-memory
    name: Estimate item memory
    source: "https://docs.memcached.org/serverguide/performance/"
    match: [item-overhead, sizes-utility, key-size]
  - id: slab-move
    name: Slabs reassign and automove
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [slabs-reassign, slabs-automove, slab-page-mover]
  - id: size-histogram
    name: Item size histogram
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [stats-sizes, track-sizes, size-histogram]
  - id: lru-tuning
    name: Lru tune mode temp ttl
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [lru, lru-tune, segmented-lru]
  - id: lru-crawler
    name: Lru crawler expiry reclaim
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [lru-crawler, expired-items, crawler-reclaimed]
  - id: key-listing
    name: List keys with metadump
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [metadump, mgdump, list-keys]
  - id: expiry
    name: Expiration times
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [exptime, expiration, ttl]
  - id: storage-cmds
    name: Storage command semantics
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [set, add, replace]
  - id: cas
    name: Cas optimistic update
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [cas, gets, check-and-set]
  - id: multiget
    name: Multiget pipelined gets
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [multiget, get, gets]
  - id: counters
    name: Atomic counters incr decr
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [incr, decr, counter]
  - id: touch
    name: Touch and gat ttl refresh
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [touch, gat, gats]
  - id: flush
    name: Flush all and delayed flush
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [flush-all, invalidate, delayed-flush]
  - id: key-limits
    name: Key rules and item size
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [key-length, item-size, i-flag]
  - id: set-failure
    name: Set failure removes old item
    source: "https://docs.memcached.org/serverguide/performance/"
    match: [set-failure, store-no-memory, object-too-large]
  - id: noreply
    name: Noreply risks
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [noreply, fire-and-forget, pipelining]
  - id: errors
    name: Protocol error strings
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [error, client-error, server-error]
  - id: lazy-expiry
    name: Lazy expiration curr items
    source: "https://docs.memcached.org/userguide/faq/"
    match: [curr-items, lazy-expiration, expired-unfetched]
  - id: watchers
    name: Watch log streams
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [watch, watchers, fetchers]
  - id: admin-cmds
    name: Admin runtime commands
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [cache-memlimit, shutdown, verbosity]
  - id: meta-basics
    name: Meta command basics
    source: "https://docs.memcached.org/protocols/meta/"
    match: [meta-commands, mg, ms]
  - id: meta-get
    name: Meta get flags
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [mg, meta-get, flags]
  - id: meta-set
    name: Meta set modes and flags
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [ms, meta-set, mode-switch]
  - id: meta-delete-arith
    name: Meta delete and arithmetic
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [md, ma, meta-delete]
  - id: meta-pipelining
    name: Meta pipelining quiet opaque noop
    source: "https://docs.memcached.org/protocols/meta/"
    match: [pipelining, quiet-mode, opaque]
  - id: binary-keys
    name: Binary keys base64
    source: "https://docs.memcached.org/protocols/meta/"
    match: [base64, binary-keys, b-flag]
  - id: stampede
    name: Stampede protection win flags
    source: "https://docs.memcached.org/protocols/meta/"
    match: [stampede, dogpile, vivify]
  - id: early-recache
    name: Early recache r flag
    source: "https://docs.memcached.org/protocols/meta/"
    match: [early-recache, r-flag, win-flag]
  - id: stale
    name: Serve stale with md invalidate
    source: "https://docs.memcached.org/protocols/meta/"
    match: [stale-while-revalidate, serve-stale, invalidate]
  - id: cas-override
    name: Cas override versioning
    source: "https://docs.memcached.org/protocols/meta/"
    match: [cas-override, e-flag, versioning]
  - id: hot-keys
    name: Probabilistic hot key cache
    source: "https://docs.memcached.org/protocols/meta/"
    match: [hot-keys, local-cache, h-flag]
  - id: tls
    name: Enable tls
    source: "https://docs.memcached.org/features/tls/"
    match: [tls, ssl, encryption]
  - id: tls-refresh
    name: Refresh tls certs
    source: "https://docs.memcached.org/features/tls/"
    match: [tls, refresh-certs, certificates]
  - id: auth
    name: Authentication options
    source: "https://docs.memcached.org/userguide/faq/"
    match: [authentication, sasl, password]
  - id: ddos
    name: Disable udp ddos hardening
    source: "https://docs.memcached.org/advisories/ddos/"
    match: [udp, ddos, amplification]
  - id: udp
    name: Udp protocol frame header
    source: "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"
    match: [udp, udp-protocol, frame-header]
  - id: warm-restart
    name: Warm restart with e flag
    source: "https://docs.memcached.org/features/restart/"
    match: [warm-restart, restart, -e]
  - id: extstore-setup
    name: Extstore enable
    source: "https://docs.memcached.org/features/flashstorage/"
    match: [extstore, flash-storage, ext-path]
  - id: extstore-tuning
    name: Extstore tuning options
    source: "https://docs.memcached.org/features/flashstorage/"
    match: [extstore, ext-threads, ext-wbuf-size]
  - id: extstore-compaction
    name: Extstore pages buckets compaction
    source: "https://docs.memcached.org/features/flashstorage/"
    match: [extstore, compaction, ext-max-frag]
  - id: loki
    name: Tune extstore for loki
    source: "https://docs.memcached.org/advisories/grafanaloki/"
    match: [loki, grafana, extstore]
  - id: proxy-install
    name: Proxy overview and build
    source: "https://docs.memcached.org/features/proxy/"
    match: [proxy, built-in-proxy, enable-proxy]
  - id: proxy-config
    name: Proxy config file structure
    source: "https://docs.memcached.org/features/proxy/configure/"
    match: [proxy-config, pools, routes]
  - id: proxy-routing
    name: Proxy routes prefix and cmap
    source: "https://docs.memcached.org/features/proxy/configure/"
    match: [proxy-routes, route-map, cmap]
  - id: proxy-handlers
    name: Proxy route handlers
    source: "https://docs.memcached.org/features/proxy/reference/"
    match: [route-handlers, route-direct, route-failover]
  - id: proxy-zones
    name: Proxy sets zones failover
    source: "https://docs.memcached.org/features/proxy/configure/"
    match: [zones, local-zone, pool-sets]
  - id: proxy-run
    name: Run proxy tagged ports reload
    source: "https://docs.memcached.org/features/proxy/run/"
    match: [proxy-run, tagged-ports, sighup]
  - id: proxy-settings
    name: Proxy settings limits timeouts
    source: "https://docs.memcached.org/features/proxy/settings-reference/"
    match: [proxy-settings, backend-timeouts, active-req-limit]
  - id: proxy-observe
    name: Proxy stats and watch
    source: "https://docs.memcached.org/features/proxy/run/"
    match: [stats-proxy, watch-proxyevents, proxy-monitoring]
  - id: proxy-internals
    name: Proxy batching behaviour
    source: "https://docs.memcached.org/features/proxy/arch/"
    match: [proxy-internals, batching, worker-threads]
  - id: proxy-topology
    name: Proxy deployment topologies
    source: "https://docs.memcached.org/features/proxy/infrastructure/"
    match: [proxy-deployment, sidecar, middleware]
  - id: timeouts
    name: Troubleshoot client timeouts
    source: "https://docs.memcached.org/troubleshooting/timeouts/"
    match: [timeouts, troubleshooting, mc-conn-tester]
  - id: hardware
    name: Hardware sizing numa swap
    source: "https://docs.memcached.org/serverguide/hardware/"
    match: [hardware, numa, swap]
  - id: capacity
    name: Capacity planning node loss
    source: "https://docs.memcached.org/serverguide/hardware/"
    match: [capacity-planning, node-loss, hit-rate]
  - id: client-scaling
    name: Connection reuse and client scaling
    source: "https://docs.memcached.org/serverguide/performance/"
    match: [persistent-connections, client, connection-churn]
  - id: namespacing
    name: Namespacing by key prefix
    source: "https://docs.memcached.org/userguide/usecases/"
    match: [namespacing, key-prefix, invalidate-by-group]
  - id: loose-lock
    name: Loose lock with add
    source: "https://docs.memcached.org/userguide/usecases/"
    match: [add, loose-lock, stampede]
  - id: soft-expiry
    name: Soft expiration recache
    source: "https://docs.memcached.org/userguide/usecases/"
    match: [soft-expiration, recache, ttl]
  - id: lists
    name: Lists with append prepend
    source: "https://docs.memcached.org/userguide/usecases/"
    match: [append, prepend, lists]
  - id: key-size
    name: Reduce key size
    source: "https://docs.memcached.org/userguide/usecases/"
    match: [key-size, memory-savings, key-compression]
  - id: zero-values
    name: Zero byte and empty values
    source: "https://docs.memcached.org/userguide/usecases/"
    match: [empty-values, zero-byte, get-semantics]
  - id: faq
    name: Design limits faq
    source: "https://docs.memcached.org/userguide/faq/"
    match: [faq, sessions, replication]
