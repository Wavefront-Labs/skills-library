# Coverage spec: pnpm. Topics from the pnpm docs (pnpm/pnpm.io, docs/ folder).
subject: pnpm
scope:
  category: computing-software
  field: software-engineering
  products: [pnpm]
sources:
  - "pnpm docs (pnpm/pnpm.io, docs/ folder, published at https://pnpm.io)"
topics:
  - id: content-addressable-store
    name: "Content-addressable store and hard links"
    source: "https://pnpm.io/motivation"
    match: [content-addressable-store, hard-links, disk-space, install-stages]
  - id: symlinked-node-modules-layout
    name: "Symlinked non-flat node_modules layout"
    source: "https://pnpm.io/symlinked-node-modules-structure"
    match: [symlinked-node-modules, node-modules-pnpm-dir, strict-dependencies, non-flat-node-modules]
  - id: install-pnpm
    name: "Install and self-update pnpm"
    source: "https://pnpm.io/installation"
    match: [install-pnpm, self-update, standalone-installer, supported-platforms]
  - id: install-frozen-lockfile
    name: "Install with frozen or preferred lockfile"
    source: "https://pnpm.io/cli/install"
    match: [pnpm-install, frozen-lockfile, prefer-frozen-lockfile, ci-install]
  - id: install-build-scripts-flags
    name: "Install flags for scripts, hoisting and reporters"
    source: "https://pnpm.io/cli/install"
    match: [allow-build, ignore-scripts, shamefully-hoist, reporter]
  - id: add-dependency-types
    name: "Add dependencies by type"
    source: "https://pnpm.io/cli/add"
    match: [pnpm-add, save-dev, save-optional, save-peer]
  - id: add-aliases-and-protocols
    name: "Add with npm aliases and protocol prefixes"
    source: "https://pnpm.io/cli/add"
    match: [npm-alias, jsr, protocol-prefix, package-url]
  - id: package-sources
    name: "Supported package sources"
    source: "https://pnpm.io/package-sources"
    match: [package-sources, jsr-registry, git-dependencies, git-subdirectory]
  - id: update-dependencies
    name: "Update dependencies"
    source: "https://pnpm.io/cli/update"
    match: [pnpm-update, update-latest, interactive-update, update-patterns]
  - id: remove-dependencies
    name: "Remove dependencies"
    source: "https://pnpm.io/cli/remove"
    match: [pnpm-remove, uninstall-package, remove-recursive]
  - id: run-scripts
    name: "Run package scripts"
    source: "https://pnpm.io/cli/run"
    match: [pnpm-run, run-script, regex-script-selector, if-present]
  - id: scripts-lifecycle-and-processes
    name: "Script lifecycle, hidden scripts and leftover processes"
    source: "https://pnpm.io/scripts"
    match: [hidden-scripts, lifecycle-scripts, dev-preinstall, leftover-processes]
  - id: exec-commands
    name: "Run installed binaries with pnpm exec"
    source: "https://pnpm.io/cli/exec"
    match: [pnpm-exec, shell-mode, run-installed-binary]
  - id: pnx-run-package
    name: "Run a package without installing (pnx, dlx)"
    source: "https://pnpm.io/cli/pnx"
    match: [pnx, pnpm-dlx, pnpx, run-without-installing]
  - id: create-starter-kit
    name: "Create projects from starter kits"
    source: "https://pnpm.io/cli/create"
    match: [pnpm-create, starter-kit, create-package-mapping]
  - id: workspace-setup
    name: "Set up a pnpm workspace"
    source: "https://pnpm.io/workspaces"
    match: [pnpm-workspaces, pnpm-workspace-yaml, monorepo, workspace-packages]
  - id: workspace-protocol
    name: "The workspace: protocol"
    source: "https://pnpm.io/workspaces"
    match: [workspace-protocol, workspace-alias, link-workspace-packages, publish-conversion]
  - id: workspace-injected-dependencies
    name: "Injected workspace dependencies"
    source: "https://pnpm.io/workspaces"
    match: [inject-workspace-packages, injected-dependencies, dedupe-injected-deps]
  - id: filter-name-and-relations
    name: "Filter by package name and relations"
    source: "https://pnpm.io/filtering"
    match: [pnpm-filter, filter-package-name, filter-dependencies, filter-dependents]
  - id: filter-directory-and-changed
    name: "Filter by directory and changed files"
    source: "https://pnpm.io/filtering"
    match: [filter-directory, filter-since, changed-packages, merge-base]
  - id: recursive-commands
    name: "Recursive commands across a workspace"
    source: "https://pnpm.io/cli/recursive"
    match: [pnpm-recursive, workspace-concurrency, topological-order, workspace-root-flag]
  - id: task-orchestration
    name: "Task orchestration with dependsOn"
    source: "https://pnpm.io/workspace-task-orchestration"
    match: [tasks-setting, depends-on, task-graph, task-caching]
  - id: catalogs
    name: "Catalogs for shared versions"
    source: "https://pnpm.io/catalogs"
    match: [catalogs, catalog-protocol, default-catalog, named-catalogs]
  - id: overrides
    name: "Overrides and package extensions"
    source: "https://pnpm.io/settings/dependency-resolution"
    match: [overrides, override-selector, convergence-override, package-extensions]
  - id: patch-dependency
    name: "Patch a dependency"
    source: "https://pnpm.io/cli/patch"
    match: [pnpm-patch, patch-commit, patched-dependencies, allow-unused-patches]
  - id: publish-package
    name: "Publish a package"
    source: "https://pnpm.io/cli/publish"
    match: [pnpm-publish, dist-tag, git-checks, recursive-publish]
  - id: deploy-workspace-package
    name: "Deploy a workspace package"
    source: "https://pnpm.io/cli/deploy"
    match: [pnpm-deploy, deploy-target, deploy-prod, portable-package]
  - id: docker
    name: "pnpm in Docker images"
    source: "https://pnpm.io/docker"
    match: [docker, docker-multi-stage, docker-monorepo, buildkit-cache-mount]
  - id: continuous-integration
    name: "Install pnpm in CI and cache the store"
    source: "https://pnpm.io/continuous-integration"
    match: [continuous-integration, pnpm-setup-action, ci-cache, gitlab-ci]
  - id: git-branch-lockfiles
    name: "Git branch lockfiles"
    source: "https://pnpm.io/git_branch_lockfiles"
    match: [git-branch-lockfile, merge-git-branch-lockfiles, lockfile-merge-conflicts]
  - id: lockfile-structure
    name: "Lockfile structure, integrity and revisions"
    source: "https://pnpm.io/lockfile"
    match: [pnpm-lock-yaml, multi-document-yaml, lockfile-revision, subresource-integrity]
  - id: lockfile-settings
    name: "Lockfile settings"
    source: "https://pnpm.io/settings/store"
    match: [lockfile-setting, lockfile-dir, exclude-links-from-lockfile, peers-suffix-max-length]
  - id: peer-dependencies
    name: "How peer dependencies are resolved"
    source: "https://pnpm.io/how-peers-are-resolved"
    match: [peer-dependencies, peer-resolution, peer-variants, peer-cycles]
  - id: peer-dependency-settings
    name: "Peer dependency settings"
    source: "https://pnpm.io/settings/peer-dependencies"
    match: [auto-install-peers, dedupe-peers, strict-peer-dependencies, peer-dependency-rules]
  - id: hoisting-settings
    name: "Hoisting settings"
    source: "https://pnpm.io/settings/node-modules"
    match: [hoist-pattern, public-hoist-pattern, phantom-dependencies, hoist-workspace-packages]
  - id: node-modules-settings
    name: "node_modules linker and import settings"
    source: "https://pnpm.io/settings/node-modules"
    match: [node-linker, hoisted-linker, virtual-store-dir, modules-dir]
  - id: global-virtual-store
    name: "Global virtual store"
    source: "https://pnpm.io/global-virtual-store"
    match: [global-virtual-store, virtual-store-type, enable-global-virtual-store]
  - id: git-worktrees
    name: "Git worktrees with a shared store"
    source: "https://pnpm.io/git-worktrees"
    match: [git-worktree, bare-repository, multi-agent-development, parallel-checkouts]
  - id: store-management
    name: "Manage the store"
    source: "https://pnpm.io/cli/store"
    match: [pnpm-store, store-prune, store-status, store-path]
  - id: store-location-settings
    name: "Store location and cache settings"
    source: "https://pnpm.io/settings/store"
    match: [store-dir, store-per-disk, store-index-format, cache-dir]
  - id: supply-chain-hardening
    name: "Supply-chain hardening"
    source: "https://pnpm.io/supply-chain-security"
    match: [supply-chain-security, block-exotic-subdeps, trust-policy, strict-dep-builds]
  - id: minimum-release-age
    name: "Minimum release age and trust policy"
    source: "https://pnpm.io/settings/dependency-resolution"
    match: [minimum-release-age, minimum-release-age-exclude, trust-policy-exclude]
  - id: allow-builds
    name: "Allow-list dependency build scripts"
    source: "https://pnpm.io/settings/build"
    match: [allow-builds-map, dangerously-allow-all-builds, migrate-only-built-dependencies]
  - id: audit-vulnerabilities
    name: "Audit for vulnerabilities"
    source: "https://pnpm.io/cli/audit"
    match: [pnpm-audit, audit-fix, audit-level, audit-ignore]
  - id: audit-signatures
    name: "Verify registry signatures"
    source: "https://pnpm.io/cli/audit"
    match: [audit-signatures, registry-signatures, signature-verification]
  - id: pnpmfile-hooks
    name: "Pnpmfile hooks"
    source: "https://pnpm.io/pnpmfile"
    match: [pnpmfile, read-package-hook, update-config-hook, after-all-resolved]
  - id: custom-resolvers-and-fetchers
    name: "Custom resolvers and fetchers"
    source: "https://pnpm.io/pnpmfile"
    match: [custom-resolver, custom-fetcher, can-resolve, pnpmfile-finders]
  - id: config-dependencies
    name: "Config dependencies"
    source: "https://pnpm.io/config-dependencies"
    match: [config-dependencies, pnpm-plugin, shared-config, add-config]
  - id: configuration-files-and-env
    name: "Configuration files and environment variables"
    source: "https://pnpm.io/configuring"
    match: [pnpm-config, config-yaml, global-config, pnpm-config-env]
  - id: registry-authentication
    name: "Registry authentication"
    source: "https://pnpm.io/npmrc"
    match: [npmrc, auth-ini, auth-token, token-helper]
  - id: network-proxy-settings
    name: "Network and proxy settings"
    source: "https://pnpm.io/settings/network"
    match: [https-proxy, http-proxy, no-proxy, fetch-retries]
  - id: package-json-engines-and-runtime
    name: "package.json packageManager, engines and devEngines"
    source: "https://pnpm.io/package_json"
    match: [package-manager-field, dev-engines-package-manager, engines-field, dev-engines-runtime-field]
  - id: runtime-set-node
    name: "Manage Node.js and other runtimes"
    source: "https://pnpm.io/cli/runtime"
    match: [pnpm-runtime, runtime-set, node-version-management, deno-runtime]
  - id: global-packages
    name: "Global packages"
    source: "https://pnpm.io/global-packages"
    match: [global-install, pnpm-add-global, global-bin-dir, global-list]
  - id: typescript-integration
    name: "TypeScript with pnpm"
    source: "https://pnpm.io/typescript"
    match: [typescript, preserve-symlinks, types-packages, types-fixer-plugin]
  - id: only-allow-pnpm
    name: "Enforce pnpm as the package manager"
    source: "https://pnpm.io/only-allow-pnpm"
    match: [only-allow-pnpm, enforce-package-manager, preinstall-guard]
  - id: migrate-from-v10
    name: "Migrate from pnpm v10"
    source: "https://pnpm.io/migration"
    match: [migration, pnpm-v10-to-v11, codemod, settings-migration]
  - id: faq-and-limitations
    name: "FAQ and limitations"
    source: "https://pnpm.io/faq"
    match: [faq, windows-junctions, cross-drive-store, npm-lockfile-ignored]
  - id: production-install
    name: "Install in production"
    source: "https://pnpm.io/production"
    match: [production-install, offline-install, commit-lockfile, prefetch-store]
