# Coverage spec: pydantic. Topics from the official docs table of contents.
subject: pydantic
scope:
  category: computing-software
  field: software-engineering
  products: [pydantic]
sources:
  - "https://docs.pydantic.dev/latest/"
topics:
  - id: pydantic-basic-model
    name: "Basic model usage and data conversion"
    source: "https://docs.pydantic.dev/latest/concepts/models/"
    match: [pydantic-basic-model]
  - id: pydantic-extra-data
    name: "Extra data on models"
    source: "https://docs.pydantic.dev/latest/concepts/models/"
    match: [pydantic-extra-data]
  - id: pydantic-validation-modes
    name: "Validating data: python, JSON and strings modes"
    source: "https://docs.pydantic.dev/latest/concepts/models/"
    match: [pydantic-validation-modes]
  - id: pydantic-forward-annotations
    name: "Forward annotations and model rebuilding"
    source: "https://docs.pydantic.dev/latest/concepts/forward_annotations/"
    match: [pydantic-forward-annotations]
  - id: pydantic-generic-models
    name: "Generic models"
    source: "https://docs.pydantic.dev/latest/concepts/models/"
    match: [pydantic-generic-models]
  - id: pydantic-create-model
    name: "Dynamic model creation"
    source: "https://docs.pydantic.dev/latest/concepts/models/"
    match: [pydantic-create-model]
  - id: pydantic-root-model
    name: "RootModel, private attributes and frozen models"
    source: "https://docs.pydantic.dev/latest/concepts/models/"
    match: [pydantic-root-model]
  - id: pydantic-field-defaults
    name: "Field default values and factories"
    source: "https://docs.pydantic.dev/latest/concepts/fields/"
    match: [pydantic-field-defaults]
  - id: pydantic-field-metadata
    name: "Field constraints, Annotated pattern and field options"
    source: "https://docs.pydantic.dev/latest/concepts/fields/"
    match: [pydantic-field-metadata]
  - id: pydantic-aliases
    name: "Field aliases and AliasPath/AliasChoices"
    source: "https://docs.pydantic.dev/latest/concepts/alias/"
    match: [pydantic-aliases]
  - id: pydantic-model-config
    name: "Model configuration and propagation"
    source: "https://docs.pydantic.dev/latest/concepts/config/"
    match: [pydantic-model-config]
  - id: pydantic-strict-mode
    name: "Strict mode"
    source: "https://docs.pydantic.dev/latest/concepts/strict_mode/"
    match: [pydantic-strict-mode]
