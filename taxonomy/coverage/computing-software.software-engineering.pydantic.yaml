    source: "https://docs.pydantic.dev/latest/errors/errors/"
    match: [pydantic-error-details]
  - id: pydantic-validation-error-types
    name: "Validation error types reference"
    source: "https://docs.pydantic.dev/latest/errors/validation_errors/"
    match: [pydantic-validation-error-types]
  - id: pydantic-cyclic-references
    name: "Cyclic references"
    source: "https://docs.pydantic.dev/latest/examples/cyclic_references/"
    match: [pydantic-cyclic-references]
  - id: pydantic-logfire
