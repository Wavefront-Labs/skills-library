    name: "Field validators"
    source: "https://docs.pydantic.dev/latest/concepts/validators/"
    match: [pydantic-field-validators]
  - id: pydantic-model-validators
    name: "Model validators"
    source: "https://docs.pydantic.dev/latest/concepts/validators/"
    match: [pydantic-model-validators]
  - id: pydantic-validator-errors
    name: "Raising validation errors"
    source: "https://docs.pydantic.dev/latest/concepts/validators/"
    match: [pydantic-validator-errors]
  - id: pydantic-validation-info
    name: "Validation info and context"
    source: "https://docs.pydantic.dev/latest/concepts/validators/"
    match: [pydantic-validation-info]
  - id: pydantic-utility-types
    name: "Utility types"
    source: "https://docs.pydantic.dev/latest/concepts/types/"
    match: [pydantic-utility-types]
  - id: pydantic-custom-types
    name: "Custom types"
    source: "https://docs.pydantic.dev/latest/concepts/types/"
