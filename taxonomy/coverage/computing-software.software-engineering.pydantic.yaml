    source: "https://docs.pydantic.dev/latest/concepts/serialization/"
    match: [pydantic-model-serializers]
  - id: pydantic-polymorphic-serialization
    name: "Serializing subclasses and serialize as any"
    source: "https://docs.pydantic.dev/latest/concepts/serialization/"
    match: [pydantic-polymorphic-serialization]
  - id: pydantic-field-exclusion
