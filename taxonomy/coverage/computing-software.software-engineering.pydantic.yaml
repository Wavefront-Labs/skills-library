    name: "Experimental pipeline API"
    source: "https://docs.pydantic.dev/latest/concepts/experimental/"
    match: [pydantic-pipeline-api]
  - id: pydantic-partial-validation
    name: "Partial validation"
    source: "https://docs.pydantic.dev/latest/concepts/experimental/"
    match: [pydantic-partial-validation]
  - id: pydantic-arguments-schema
