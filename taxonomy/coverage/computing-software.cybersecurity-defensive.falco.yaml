# Coverage spec: falco. Topics from the Falco docs (falco.org/docs).
subject: falco
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [falco]
sources:
  - "Falco docs (falco.org/docs)"
topics:
  - id: rule-structure-and-keys
    name: "Rule structure and keys"
    source: "https://falco.org/docs/concepts/rules/basic-elements/"
    match: [falco-rule, rule-keys, condition]
  - id: macros-lists-and-visibility
    name: "Macros, lists and visibility"
    source: "https://falco.org/docs/concepts/rules/basic-elements/"
    match: [falco-macro, falco-list, list-visibility]
  - id: rule-priority-levels
    name: "Rule priority levels"
    source: "https://falco.org/docs/concepts/rules/basic-elements/"
    match: [priority, severity, warning]
  - id: condition-operators
    name: "Condition operators"
    source: "https://falco.org/docs/concepts/rules/conditions/"
    match: [condition-syntax, comparison-operators, glob]
  - id: pmatch-vs-glob-path-matching
    name: "pmatch versus glob path matching"
    source: "https://falco.org/docs/concepts/rules/conditions/"
    match: [pmatch, glob, path-prefix]
  - id: string-comparison-modifiers
    name: "anyof allof oneof modifiers"
    source: "https://falco.org/docs/concepts/rules/conditions/"
    match: [anyof, allof, oneof]
  - id: transformers-and-val
    name: "Transformers and val()"
    source: "https://falco.org/docs/concepts/rules/conditions/"
    match: [transformers, tolower, basename]
  - id: syscall-events-and-args
    name: "Syscall events direction and args"
    source: "https://falco.org/docs/concepts/rules/conditions/"
    match: [syscall-events, evt-type, evt-dir]
  - id: rule-exceptions
    name: "Rule exceptions"
    source: "https://falco.org/docs/concepts/rules/exceptions/"
    match: [exceptions, exception-fields, comps]
  - id: exception-shortcuts-and-appending
    name: "Exception shortcuts and appending values"
    source: "https://falco.org/docs/concepts/rules/exceptions/"
    match: [exception-shortcuts, override-exceptions, append]
  - id: overriding-append-and-replace
    name: "Overriding with append and replace"
    source: "https://falco.org/docs/concepts/rules/overriding/"
    match: [override, append, replace]
  - id: enable-disable-rules-config
    name: "Enable and disable rules by configuration"
    source: "https://falco.org/docs/concepts/rules/controlling-rules/"
    match: [rules-enable, rules-disable, falco-yaml-rules]
  - id: rule-tags-and-selection
    name: "Rule tags and selective loading"
    source: "https://falco.org/docs/concepts/rules/controlling-rules/"
    match: [rule-tags, tag-filter, cis]
  - id: custom-ruleset-placement
    name: "Custom ruleset placement"
    source: "https://falco.org/docs/concepts/rules/custom-ruleset/"
    match: [custom-rules, rules-d, rules-files]
  - id: helm-rules-loading
    name: "Helm chart rules loading"
    source: "https://falco.org/docs/concepts/rules/default-custom/"
    match: [helm-chart, falcoctl, customrules]
  - id: falcoctl-rules-install
    name: "Installing rules with falcoctl"
    source: "https://falco.org/docs/concepts/rules/default-custom/"
    match: [falcoctl, artifact-install, rules-oci]
  - id: rules-adoption-phases
    name: "Adopting rules in production"
    source: "https://falco.org/docs/concepts/rules/adoption-rules/"
    match: [rules-maturity, maturity-stable, rules-adoption]
  - id: stdout-file-syslog-outputs
    name: "Stdout, file and syslog outputs"
    source: "https://falco.org/docs/concepts/outputs/channels/"
    match: [stdout-output, file-output, syslog-output]
  - id: program-and-http-outputs
    name: "Program and HTTP outputs"
    source: "https://falco.org/docs/concepts/outputs/channels/"
    match: [program-output, http-output, slack-webhook]
  - id: json-output-format
    name: "JSON alert format"
    source: "https://falco.org/docs/concepts/outputs/channels/"
    match: [json-output, output-fields, alert-properties]
  - id: append-output-config
    name: "append_output configuration"
    source: "https://falco.org/docs/concepts/outputs/formatting/"
    match: [append-output, extra-output, extra-fields]
  - id: falcosidekick-forwarding
    name: "Forwarding alerts with Falcosidekick"
    source: "https://falco.org/docs/concepts/outputs/forwarding/"
    match: [falcosidekick, alert-forwarding, http-output]
  - id: metrics-configuration
    name: "Falco metrics configuration"
    source: "https://falco.org/docs/concepts/metrics/"
    match: [falco-metrics, metrics-interval, output-rule]
  - id: dropped-syscall-event-actions
    name: "Dropped syscall event actions"
    source: "https://falco.org/docs/concepts/event-sources/kernel/dropped-events/"
    match: [dropped-events, syscall-event-drops, ring-buffer]
  - id: adaptive-syscall-selection
    name: "Adaptive syscall selection"
    source: "https://falco.org/docs/concepts/event-sources/kernel/tuning/"
    match: [base-syscalls, custom-set, repair]
  - id: kernel-events-architecture
    name: "Kernel events architecture"
    source: "https://falco.org/docs/concepts/event-sources/kernel/architecture/"
    match: [libscap, drivers, api-version]
  - id: cli-validate-and-list
    name: "CLI validate and list options"
    source: "https://falco.org/docs/reference/daemon/cli-arguments/"
    match: [falco-cli, validate-rules, dry-run]
  - id: config-overrides-and-config-files
    name: "Config overrides and config_files"
    source: "https://falco.org/docs/reference/daemon/config-options/"
    match: [config-files, config-d, merge-strategy]
  - id: run-falco-in-docker
    name: "Run Falco in Docker"
    source: "https://falco.org/docs/setup/container/"
    match: [docker-run, modern-ebpf, least-privilege]
  - id: install-falco-packages
    name: "Install Falco from DEB or RPM"
    source: "https://falco.org/docs/setup/packages/"
    match: [falco-deb, falco-rpm, falco-driver-choice]
  - id: deploy-falco-with-helm
    name: "Deploy Falco with Helm"
    source: "https://falco.org/docs/setup/kubernetes/"
    match: [helm-install, helm-upgrade, falcosecurity-charts]
  - id: troubleshoot-dropped-events
    name: "Troubleshooting dropped events"
    source: "https://falco.org/docs/troubleshooting/dropping/"
    match: [buf-size-preset, cpus-for-each-buffer, dropped-events]
  - id: base-syscalls-drop-tests
    name: "Testing base_syscalls for drops"
    source: "https://falco.org/docs/troubleshooting/dropping/"
    match: [base-syscalls, dry-run, dummy-rule]
  - id: missing-container-fields
    name: "Missing container fields"
    source: "https://falco.org/docs/troubleshooting/missing-fields/"
    match: [missing-fields, container-plugin, cri-sockets]
  - id: troubleshoot-startup-failures
    name: "Troubleshooting start-up failures"
    source: "https://falco.org/docs/troubleshooting/start-up-error/"
    match: [start-up-error, kernel-driver, kmod]
  - id: falco-performance-monitoring
    name: "Monitoring Falco performance"
    source: "https://falco.org/docs/troubleshooting/performance/"
    match: [performance, resource-utilization, cpu-rss]
  - id: plugin-capabilities
    name: "Plugin capabilities"
    source: "https://falco.org/docs/concepts/plugins/architecture/"
    match: [falco-plugins, event-sourcing, field-extraction]
  - id: plugin-loading-config
    name: "Plugin loading configuration"
    source: "https://falco.org/docs/concepts/plugins/usage/"
    match: [plugins-config, load-plugins, library-path]
  - id: k8s-audit-events-plugin
    name: "Kubernetes audit events plugin"
    source: "https://falco.org/docs/concepts/event-sources/plugins/kubernetes-audit/"
    match: [k8saudit, kubernetes-audit, k8s-audit]
  - id: cloud-and-okta-plugins
    name: "CloudTrail and Okta plugins"
    source: "https://falco.org/docs/concepts/event-sources/plugins/cloudtrail/"
    match: [cloudtrail, okta, aws-cloudtrail]
  - id: rule-style-and-performance
    name: "Rule style and performance guide"
    source: "https://falco.org/docs/concepts/rules/style-guide/"
    match: [style-guide, evt-type, no-evttype]
  - id: domain-name-fields-fd-sip
    name: "Domain name fields fd.sip.name"
    source: "https://falco.org/docs/concepts/rules/fd-sip-name/"
    match: [fd-sip-name, fd-cip-name, dns-resolution]
  - id: fs-path-fields
    name: "Normalised fs.path fields"
    source: "https://falco.org/docs/concepts/rules/fspath/"
    match: [fs-path, fs-path-name, fs-path-source]
  - id: rules-file-versioning
    name: "Rules file versioning"
    source: "https://falco.org/docs/concepts/rules/versioning/"
    match: [required-engine-version, engine-version, rules-versioning]
