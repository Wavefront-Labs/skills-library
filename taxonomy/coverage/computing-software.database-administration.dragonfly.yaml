# Coverage spec: dragonfly. Topics from the DragonflyDB docs (dragonflydb/documentation).
subject: dragonfly
scope:
  category: computing-software
  field: database-administration
  products: [dragonfly]
sources:
  - "DragonflyDB docs (github.com/dragonflydb/documentation)"
topics:
  - id: run-with-docker
    name: "Run Dragonfly with Docker"
    source: "https://www.dragonflydb.io/docs/getting-started/docker"
    match: [docker, docker-run]
  - id: run-with-docker-compose
    name: "Run Dragonfly with Docker Compose"
    source: "https://www.dragonflydb.io/docs/getting-started/docker-compose"
    match: [docker-compose]
  - id: install-from-binary
    name: "Install from the binary"
    source: "https://www.dragonflydb.io/docs/getting-started/binary"
    match: [binary-install]
  - id: install-native-packages
    name: "Install native packages"
    source: "https://www.dragonflydb.io/docs/getting-started/native-packages"
    match: [native-packages, apt, dnf]
  - id: deploy-with-helm
    name: "Deploy with Helm"
    source: "https://www.dragonflydb.io/docs/getting-started/kubernetes-helm"
    match: [helm, helm-chart]
  - id: server-flags-and-env-vars
    name: "Server flags, flag files and environment variables"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/flags"
    match: [server-flags, dfly-env-vars, flagfile]
  - id: runtime-config-set
    name: "Runtime configuration with CONFIG SET"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/flags"
    match: [config-set, runtime-config]
  - id: snapshot-scheduling
    name: "Scheduled snapshots with snapshot_cron"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/backups"
    match: [snapshot-cron, cron-schedule]
  - id: dbfilename-timestamp
    name: "Snapshot file names and the timestamp macro"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/backups"
    match: [dbfilename, timestamp-macro]
  - id: manual-snapshots
    name: "Manual snapshots with SAVE and BGSAVE"
    source: "https://www.dragonflydb.io/docs/command-reference/server-management/save"
    match: [save, bgsave]
  - id: snapshot-loading
    name: "Automatic snapshot loading at startup"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/backups"
    match: [automatic-loading, startup-load]
  - id: snapshots-to-s3
    name: "Snapshots to S3"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/backups"
    match: [s3-snapshots, s3-bucket]
  - id: s3-credentials
    name: "S3 credentials, endpoints and MinIO"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/backups"
    match: [s3-credentials, s3-endpoint, minio]
  - id: aof-not-supported
    name: "AOF persistence is not supported"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/persistence"
    match: [aof]
  - id: snapshot-compression
    name: "Snapshot compression modes"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/flags"
    match: [compression-mode]
  - id: replication-role
    name: "Checking replication role"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [role]
  - id: configure-replicaof
    name: "Configuring a replica with REPLICAOF"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [replicaof]
  - id: promote-replica
    name: "Promoting a replica"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [replicaof-no-one, failover]
  - id: replication-backlog
    name: "Replication backlog and partial sync"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [replication-backlog, partial-sync]
  - id: replica-expired-keys
    name: "Expired key deletion on replicas"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [replica-delete-expired]
  - id: replication-tls
    name: "Replication over TLS"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [tls-replication, no-tls-on-admin-port]
  - id: replication-lag
    name: "Monitoring replication lag"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [replication-lag]
  - id: cascading-replication
    name: "Cascading replication"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/replication"
    match: [cascaded-replication]
  - id: operator-high-availability
    name: "High availability with the operator"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/high-availability"
    match: [operator-ha, high-availability]
  - id: emulated-cluster
    name: "Emulated cluster mode"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/cluster-mode"
    match: [emulated-cluster]
  - id: multi-shard-cluster
    name: "Multi-shard cluster setup"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/cluster-mode"
    match: [multi-shard-cluster, cluster-mode]
  - id: dflycluster-commands
    name: "DFLYCLUSTER config, slot info and flush commands"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/cluster-mode"
    match: [dflycluster-config, dflycluster-getslotinfo, dflycluster-flushslots]
  - id: slot-migration
    name: "Slot migration status"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/cluster-mode"
    match: [slot-migration, dflycluster-slot-migration-status]
  - id: acl-basics
    name: "ACL basics"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/acl"
    match: [acl, acl-setuser]
  - id: acl-permissions
    name: "ACL key, channel and database permissions"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/acl"
    match: [key-permissions, pubsub-permissions, database-selectors]
  - id: acl-persistence
    name: "ACL file persistence"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/acl"
    match: [aclfile, acl-save]
  - id: acl-log-dryrun
    name: "ACL LOG and DRYRUN"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/acl"
    match: [acl-log, acl-dryrun]
  - id: http-access
    name: "HTTP access and authentication"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/using-http"
    match: [http-api, requirepass, admin-nopass, primary-port-http-enabled, expose-http-api]
  - id: enable-tls
    name: "Enable TLS"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/using-tls"
    match: [tls, tls-cert-file, tls-key-file, certbot]
  - id: tls-client-certs
    name: "TLS client certificates"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/using-tls"
    match: [client-certificate, mutual-tls, tls-ca-cert-file]
  - id: tls-rotation
    name: "TLS certificate rotation"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/using-tls"
    match: [certificate-rotation, config-set-tls, zero-downtime]
  - id: jwt-auth
    name: "JWT authentication"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/flags"
    match: [jwt, jwt-validate, jwt-validate-url]
  - id: prometheus-metrics
    name: "Prometheus metrics endpoint"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/monitoring"
    match: [prometheus, metrics, monitoring, grafana]
  - id: info-memory
    name: "INFO memory fields"
    source: "https://www.dragonflydb.io/docs/command-reference/server-management/info"
    match: [info-memory, rss, used-memory, maxmemory]
  - id: memory-usage
    name: "MEMORY USAGE and MEMORY STATS"
    source: "https://www.dragonflydb.io/docs/command-reference/server-management/memory-usage"
    match: [memory-usage, memory-stats, withoutkey]
  - id: memory-defragment
    name: "MEMORY DEFRAGMENT"
    source: "https://www.dragonflydb.io/docs/command-reference/server-management/memory-defragment"
    match: [memory-defragment, defrag, fragmentation, mem-defrag-threshold]
  - id: memory-arena
    name: "MEMORY ARENA diagnostics"
    source: "https://www.dragonflydb.io/docs/command-reference/server-management/memory-arena"
    match: [memory-arena, allocator, fragmentation-waste, mimalloc]
  - id: slowlog
    name: "SLOWLOG tuning"
    source: "https://www.dragonflydb.io/docs/command-reference/server-management/slowlog-get"
    match: [slowlog, slowlog-log-slower-than, slowlog-max-len, latency]
  - id: client-management
    name: "CLIENT LIST and CLIENT PAUSE"
    source: "https://www.dragonflydb.io/docs/command-reference/server-management/client-list"
    match: [client-list, client-pause, client-kill, maxclients]
  - id: ssd-tiering
    name: "SSD tiering"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/tiering"
    match: [ssd-tiering, tiered-prefix, io-uring, nvme]
  - id: tiering-thresholds
    name: "Tiering thresholds"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/tiering"
    match: [tiered-offload-threshold, tiered-upload-threshold, tiered-min-value-size, experimental-cooling]
  - id: tiering-metrics
    name: "Tiering metrics"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/tiering"
    match: [info-tiered, tiered-pending-read, tiering-metrics, disk-bottleneck]
  - id: lua-script-flags
    name: "Lua script flags"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/scripting"
    match: [lua, script-flags, allow-undeclared-keys, default-lua-flags]
  - id: cache-mode
    name: "Cache mode and STICK"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/flags"
    match: [cache-mode, eviction, stick]
  - id: memcached-mode
    name: "Memcached mode"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/flags"
    match: [memcached, memcached-port]
  - id: migrate-replication
    name: "Migrate from Redis by replication"
    source: "https://www.dragonflydb.io/docs/migration/migrate-from-redis"
    match: [migration, redis-migration, cutover]
  - id: migrate-snapshot
    name: "Migrate from Redis by snapshot"
    source: "https://www.dragonflydb.io/docs/migration/migrate-from-redis"
    match: [rdb-import, snapshot-restore]
  - id: operator-install
    name: "Install the Kubernetes operator"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/operator/installation"
    match: [kubernetes-operator, operator-install, replicas, dragonfly-resource]
  - id: known-limitations
    name: "Known limitations"
    source: "https://www.dragonflydb.io/docs/managing-dragonfly/known-limitations"
    match: [limits, max-keys, ttl-range, max-multi-bulk-len]
