# Coverage spec: vitest. Topics from the Vitest docs (vitest-dev/vitest, docs/ folder).
subject: vitest
scope:
  category: computing-software
  field: qa-testing-engineering
  products: [vitest]
sources:
  - "Vitest docs (raw markdown in github.com/vitest-dev/vitest, docs/ folder)"
topics:
  - id: install-vitest
    name: "Install Vitest and requirements"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/index.md"
    match: [install-vitest, node-requirement, vitest-gitignore]
  - id: first-test
    name: "Write and run a first test"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/index.md"
    match: [first-test, test-file-naming, test-script, run-once]
  - id: config-file-basics
    name: "Configuration file basics"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/index.md"
    match: [vitest-config, vite-config-reuse, define-config]
  - id: cli-run-and-watch
    name: "CLI run and watch modes"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/cli.md"
    match: [vitest-watch, ci-run-mode, filename-filter]
  - id: cli-related-and-list
    name: "CLI related and list commands"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/cli.md"
    match: [vitest-related, lint-staged-vitest, vitest-list]
  - id: cli-doctor
    name: "CLI doctor command"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/cli.md"
    match: [vitest-doctor, pool-benchmark]
  - id: cli-shard-merge-reports
    name: "Sharding and merging blob reports"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/cli.md"
    match: [shard, merge-reports, vitest-blob-label]
  - id: rerun-last-failed-and-changed
    name: "Rerun last failed and since last run"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/cli.md"
    match: [last-failed, since-last-run, results-cache]
  - id: filter-files-names-lines
    name: "Filter by file, name and line"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/filtering.md"
    match: [test-name-pattern, file-filter, line-number-filter]
  - id: only-skip-todo
    name: "Only, skip and todo"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/filtering.md"
    match: [test-only, test-skip, test-todo, allow-only]
  - id: define-test-tags
    name: "Define test tags"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/test-tags.md"
    match: [test-tags, tags-config, strict-tags]
  - id: filter-by-tags-expression
    name: "Filter by tags expression"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/test-tags.md"
    match: [tags-filter, tag-expression, matches-tags]
  - id: parallelism-pools-workers
    name: "Parallelism, pools and workers"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/parallelism.md"
    match: [pool, file-parallelism, max-workers]
  - id: concurrent-tests
    name: "Concurrent tests"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/parallelism.md"
    match: [test-concurrent, describe-concurrent, max-concurrency]
  - id: projects-setup
    name: "Projects setup"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/projects.md"
    match: [test-projects, project-globs, define-project]
  - id: projects-extends-and-limits
