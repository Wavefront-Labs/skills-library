    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/guide/lifecycle.md"
    match: [test-lifecycle, setup-files, hook-order]
  - id: global-setup
    name: "Global setup and provide"
    source: "https://raw.githubusercontent.com/vitest-dev/vitest/main/docs/config/globalsetup.md"
