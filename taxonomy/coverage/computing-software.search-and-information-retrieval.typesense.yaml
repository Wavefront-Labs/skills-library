# Coverage spec: typesense. Topics from the external structures named in `sources`.
subject: typesense
scope:
  category: computing-software
  field: search-and-information-retrieval
  products: [typesense]
sources:
  - "Typesense API documentation 30.2 (typesense.org/docs/30.2/api) - collections, documents, search, curation, synonyms, vector search, analytics, API keys, cluster operations, server configuration"
topics:
  - id: api-key-actions
    name: api key actions
    source: "https://typesense.org/docs/30.2/api/api-keys.html"
    match: [key-actions, resource-verb, permissions]
  - id: authenticate-with-clients
    name: authenticate with clients
    source: "https://typesense.org/docs/30.2/api/authentication.html"
    match: [authentication, client-libraries, x-typesense-api-key]
  - id: basic-stemming
    name: basic stemming
    source: "https://typesense.org/docs/30.2/api/stemming.html"
    match: [stemming, snowball-stemmer, field-locale]
  - id: cluster-metrics-and-stats
    name: cluster metrics and stats
    source: "https://typesense.org/docs/30.2/api/cluster-operations.html"
    match: [metrics-json, stats-json, health-endpoint]
  - id: collection-aliases
    name: collection aliases
    source: "https://typesense.org/docs/30.2/api/collection-alias.html"
    match: [collection-alias, zero-downtime-reindex, aliases-api]
  - id: compact-database-and-clear-cache
    name: compact database and clear cache
    source: "https://typesense.org/docs/30.2/api/cluster-operations.html"
    match: [db-compaction, rocksdb, clear-cache]
  - id: conversation-follow-ups-and-streaming
    name: conversation follow ups and streaming
    source: "https://typesense.org/docs/30.2/api/conversational-search-rag.html"
    match: [conversation-id, conversation-stream, standalone-question]
  - id: conversation-model-setup
    name: conversation model setup
    source: "https://typesense.org/docs/30.2/api/conversational-search-rag.html"
    match: [conversational-search, conversation-model, history-collection]
  - id: conversational-search-queries
    name: conversational search queries
    source: "https://typesense.org/docs/30.2/api/conversational-search-rag.html"
    match: [conversation-search, conversation-model-id, exclude-fields]
  - id: create-api-keys
    name: create api keys
    source: "https://typesense.org/docs/30.2/api/api-keys.html"
    match: [api-keys, search-only-key, key-expiry]
  - id: create-snapshot-backup
    name: create snapshot backup
    source: "https://typesense.org/docs/30.2/api/cluster-operations.html"
    match: [snapshot, backup, snapshot-path]
  - id: curation-diversify-results
    name: curation diversify results
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [mmr-diversity, diversity-lambda, similarity-metric]
  - id: curation-dynamic-filtering
    name: curation dynamic filtering
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [dynamic-filter, remove-matched-tokens, query-placeholder]
  - id: curation-dynamic-sorting
    name: curation dynamic sorting
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [dynamic-sort, sort-by-placeholder, per-store-ranking]
  - id: curation-pin-and-hide-documents
    name: curation pin and hide documents
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [curation-sets, pin-documents, exclude-documents]
  - id: curation-set-management
    name: curation set management
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [curation-set-api, link-curation-sets, curation-items]
  - id: curation-synonyms-and-stemming
    name: curation synonyms and stemming
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [curation-synonyms, curation-stemming, stemming-dictionary]
  - id: curation-tags
    name: curation tags
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [curation-tags, rule-tags, stop-processing]
  - id: curation-v30-migration
    name: curation v30 migration
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [overrides-migration, curations-index, v30-upgrade]
  - id: curation-with-scoped-keys
    name: curation with scoped keys
    source: "https://typesense.org/docs/30.2/api/curation.html"
    match: [curation-scoped-key, rule-filter-by, filter-curated-hits]
  - id: federated-multi-search
    name: federated multi search
    source: "https://typesense.org/docs/30.2/api/federated-multi-search.html"
    match: [federated-search, multi-search, limit-multi-searches]
  - id: geo-polygon-filter
    name: geo polygon filter
    source: "https://typesense.org/docs/30.2/api/geosearch.html"
    match: [geo-polygon, polygon-filter, geopolygon]
  - id: geo-sort-exclude-radius-and-precision
    name: geo sort exclude radius and precision
    source: "https://typesense.org/docs/30.2/api/geosearch.html"
    match: [exclude-radius, geo-precision, geo-tie-break]
  - id: geopoint-radius-search-and-sort
    name: geopoint radius search and sort
    source: "https://typesense.org/docs/30.2/api/geosearch.html"
    match: [geopoint, radius-filter, geo-sort]
  - id: image-search-with-clip
    name: image search with clip
    source: "https://typesense.org/docs/30.2/api/image-search.html"
    match: [image-search, clip, image-embedding]
  - id: join-async-references-and-cascade-delete
    name: join async references and cascade delete
    source: "https://typesense.org/docs/30.2/api/joins.html"
    match: [async-reference, cascade-delete, reference-aliases]
  - id: join-one-to-many-and-many-to-many
    name: join one to many and many to many
    source: "https://typesense.org/docs/30.2/api/joins.html"
    match: [one-to-many, many-to-many, join-filter]
  - id: join-reference-fields
    name: join reference fields
    source: "https://typesense.org/docs/30.2/api/joins.html"
    match: [joins, reference-field, include-fields]
  - id: join-sorting-and-merge-strategies
    name: join sorting and merge strategies
    source: "https://typesense.org/docs/30.2/api/joins.html"
    match: [join-sort, merge-strategy, related-docs-count]
  - id: leader-reelection-and-node-debug
    name: leader reelection and node debug
    source: "https://typesense.org/docs/30.2/api/cluster-operations.html"
    match: [raft-vote, leader-election, debug-endpoint]
  - id: left-join-and-nested-joins
    name: left join and nested joins
    source: "https://typesense.org/docs/30.2/api/joins.html"
    match: [left-join, nested-joins, null-join-filter]
  - id: manage-conversation-models
    name: manage conversation models
    source: "https://typesense.org/docs/30.2/api/conversational-search-rag.html"
    match: [conversation-models-api, conversation-ttl, model-update]
  - id: natural-language-search-models
    name: natural language search models
    source: "https://typesense.org/docs/30.2/api/natural-language-search.html"
    match: [nl-search, nl-search-models, llm-query-parsing]
  - id: natural-language-search-queries
    name: natural language search queries
    source: "https://typesense.org/docs/30.2/api/natural-language-search.html"
    match: [nl-query, parsed-nl-query, nl-model-id]
  - id: natural-language-search-troubleshooting
    name: natural language search troubleshooting
    source: "https://typesense.org/docs/30.2/api/natural-language-search.html"
    match: [nl-query-debug, prompt-cache, nl-fallback]
  - id: retrieve-list-delete-api-keys
    name: retrieve list delete api keys
    source: "https://typesense.org/docs/30.2/api/api-keys.html"
    match: [list-keys, key-prefix, delete-key]
  - id: scoped-search-keys
    name: scoped search keys
    source: "https://typesense.org/docs/30.2/api/api-keys.html"
    match: [scoped-search-key, multi-tenancy, embedded-filter]
  - id: server-configuration-parameters
    name: server configuration parameters
    source: "https://typesense.org/docs/30.2/api/server-configuration.html"
    match: [server-configuration, config-file, environment-variables]
  - id: server-logging-and-analytics-flags
    name: server logging and analytics flags
    source: "https://typesense.org/docs/30.2/api/server-configuration.html"
    match: [logging, slow-requests, access-logging]
  - id: server-networking-tls-and-cors
    name: server networking tls and cors
    source: "https://typesense.org/docs/30.2/api/server-configuration.html"
    match: [api-port, ssl-certificate, cors-domains]
  - id: server-resource-and-search-limits
    name: server resource and search limits
    source: "https://typesense.org/docs/30.2/api/server-configuration.html"
    match: [resource-limits, filter-by-max-ops, thread-pool-size]
  - id: stemming-dictionaries
    name: stemming dictionaries
    source: "https://typesense.org/docs/30.2/api/stemming.html"
    match: [stemming-dictionary, jsonl-import, irregular-plurals]
  - id: stopwords
    name: stopwords
    source: "https://typesense.org/docs/30.2/api/stopwords.html"
    match: [stopwords, stopword-sets, query-time]
  - id: synonym-set-items-api
    name: synonym set items api
    source: "https://typesense.org/docs/30.2/api/synonyms.html"
    match: [synonym-set-items, retrieve-synonym-set, delete-synonym-set]
  - id: synonym-sets-linking-and-search-time
    name: synonym sets linking and search time
    source: "https://typesense.org/docs/30.2/api/synonyms.html"
    match: [synonym-sets-link, search-time-synonyms, collection-patch]
  - id: synonym-sets-one-way-and-multi-way
    name: synonym sets one way and multi way
    source: "https://typesense.org/docs/30.2/api/synonyms.html"
    match: [synonym-sets, one-way-synonym, multi-way-synonym]
  - id: synonyms-v30-migration
    name: synonyms v30 migration
    source: "https://typesense.org/docs/30.2/api/synonyms.html"
    match: [v30-migration, synonyms-index, snapshot-before-upgrade]
  - id: union-search
    name: union search
    source: "https://typesense.org/docs/30.2/api/federated-multi-search.html"
    match: [union-search, remove-duplicates, grouped-union]
  - id: voice-search-query
    name: voice search query
    source: "https://typesense.org/docs/30.2/api/voice-search-query.html"
    match: [voice-query, whisper, multi-search]
