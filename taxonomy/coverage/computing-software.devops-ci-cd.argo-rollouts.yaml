# Coverage spec: argo-rollouts. Topics from the Argo Rollouts docs.
subject: argo-rollouts
scope:
  category: computing-software
  field: devops-ci-cd
  products: [argo-rollouts]
sources:
  - "Argo Rollouts docs"
topics:
  - id: abort-scale-down-behaviour
    name: "abort scale down behaviour"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/scaledown-aborted-rs/"
    match: [abortscaledowndelayseconds, abort, scale-down]
  - id: alb-ingress-traffic-routing
    name: "alb ingress traffic routing"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/alb/"
    match: [aws, alb, ingress]
  - id: alb-ping-pong-zero-downtime
    name: "alb ping pong zero downtime"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/alb/"
    match: [aws, alb, pingpong]
  - id: alb-targetgroup-verification
    name: "alb targetgroup verification"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/alb/"
    match: [aws, alb, targetgroup]
  - id: analysis-dry-run-mode
    name: "analysis dry run mode"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [dryrun, analysis, metrics]
  - id: analysis-nan-infinity-and-empty-results
    name: "analysis nan infinity and empty results"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [nan, infinity, empty-result]
  - id: analysis-resources-overview
    name: "analysis resources overview"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [analysis, analysistemplate, clusteranalysistemplate]
  - id: analysis-secrets-and-shared-secrets
    name: "analysis secrets and shared secrets"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [secretkeyref, sharedsecret, analysis-shared-secret-namespace]
  - id: analysis-template-arguments
    name: "analysis template arguments"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [analysis, args, valuefrom]
  - id: anti-affinity-for-autoscaler-churn
    name: "anti affinity for autoscaler churn"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/anti-affinity/anti-affinity/"
    match: [antiaffinity, cluster-autoscaler, blue-green]
  - id: architecture-and-components
    name: "architecture and components"
    source: "https://argo-rollouts.readthedocs.io/en/stable/architecture/"
    match: [architecture, controller, rollout]
  - id: argocd-gitops-rollback-behaviour
    name: "argocd gitops rollback behaviour"
    source: "https://argo-rollouts.readthedocs.io/en/stable/FAQ/"
    match: [argocd, gitops, rollback]
  - id: background-analysis
    name: "background analysis"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [analysis, background-analysis, startingstep]
  - id: best-practices-and-fit
    name: "best practices and fit"
    source: "https://argo-rollouts.readthedocs.io/en/stable/best-practices/"
    match: [best-practices, applicability, progressive-delivery]
  - id: bluegreen-scale-down-and-preview-replicas
    name: "bluegreen scale down and preview replicas"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/bluegreen/"
    match: [blue-green, scaledowndelayseconds, previewreplicacount]
  - id: bluegreen-strategy-basics
    name: "bluegreen strategy basics"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/bluegreen/"
    match: [blue-green, activeservice, previewservice]
  - id: bluegreen-update-sequence
    name: "bluegreen update sequence"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/bluegreen/"
    match: [blue-green, promotion, prepromotionanalysis]
  - id: canary-dynamic-canary-scale
    name: "canary dynamic canary scale"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/canary/"
    match: [canary, setcanaryscale, matchtrafficweight]
  - id: canary-dynamic-stable-scale
    name: "canary dynamic stable scale"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/canary/"
    match: [canary, dynamicstablescale, abortscaledowndelayseconds]
  - id: canary-header-routes-and-mirroring
    name: "canary header routes and mirroring"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/specification/"
    match: [canary, setheaderroute, setmirrorroute]
  - id: canary-steps-setweight-and-pause
    name: "canary steps setweight and pause"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/canary/"
    match: [canary, steps, setweight]
  - id: choosing-blue-green-or-canary
    name: "choosing blue green or canary"
    source: "https://argo-rollouts.readthedocs.io/en/stable/concepts/"
    match: [blue-green, canary, strategy]
  - id: clusteranalysistemplate-and-template-composition
    name: "clusteranalysistemplate and template composition"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [clusteranalysistemplate, clusterscope, multiple-templates]
  - id: controller-ha-and-scope
    name: "controller ha and scope"
    source: "https://argo-rollouts.readthedocs.io/en/stable/FAQ/"
    match: [ha, leader-elect, controller]
  - id: controller-metrics-and-grafana
    name: "controller metrics and grafana"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/controller-metrics/"
    match: [prometheus, metrics, controller-metrics]
  - id: datadog-metric-provider
    name: "datadog metric provider"
    source: "https://argo-rollouts.readthedocs.io/en/stable/analysis/datadog/"
    match: [datadog, metric-provider, api-v2]
  - id: ephemeral-metadata-labels
    name: "ephemeral metadata labels"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/ephemeral-metadata/"
    match: [ephemeral-metadata, stablemetadata, canarymetadata]
  - id: experiment-crd-lifecycle
    name: "experiment crd lifecycle"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/experiment/"
    match: [experiment, templates, duration]
  - id: experiment-step-in-canary-rollout
    name: "experiment step in canary rollout"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/experiment/"
    match: [experiment, canary-step, specref]
  - id: failure-limit-and-success-conditions
    name: "failure limit and success conditions"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [failurelimit, consecutivesuccesslimit, failurecondition]
  - id: helm-and-kustomize-usage
    name: "helm and kustomize usage"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/helm/"
    match: [helm, kustomize, rollout-transform]
  - id: hpa-integration
    name: "hpa integration"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/hpa-support/"
    match: [hpa, autoscaling, horizontal-pod-autoscaler]
  - id: inconclusive-analysis-and-delays
    name: "inconclusive analysis and delays"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [inconclusive, initialdelay, startingstep]
  - id: inline-analysis-step
    name: "inline analysis step"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [analysis, inline-analysis, steps]
  - id: install-controller-manifests
    name: "install controller manifests"
    source: "https://argo-rollouts.readthedocs.io/en/stable/installation/"
    match: [install, controller, manifests]
  - id: istio-host-level-traffic-splitting
    name: "istio host level traffic splitting"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/istio/"
    match: [istio, virtualservice, host-level]
  - id: istio-subset-level-traffic-splitting
    name: "istio subset level traffic splitting"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/istio/"
    match: [istio, destinationrule, subsets]
  - id: job-metric-provider
    name: "job metric provider"
    source: "https://argo-rollouts.readthedocs.io/en/stable/analysis/job/"
    match: [job, kubernetes-job, metric-provider]
  - id: kubectl-plugin-everyday-commands
    name: "kubectl plugin everyday commands"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/kubectl-plugin/"
    match: [kubectl-argo-rollouts, promote, abort]
  - id: kubectl-plugin-install-and-completion
    name: "kubectl plugin install and completion"
    source: "https://argo-rollouts.readthedocs.io/en/stable/installation/"
    match: [kubectl-plugin, install, completion]
  - id: measurement-retention-and-ttl
    name: "measurement retention and ttl"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/analysis/"
    match: [measurementretention, ttlstrategy, analysisrun]
  - id: metric-provider-and-step-plugins
    name: "metric provider and step plugins"
    source: "https://argo-rollouts.readthedocs.io/en/stable/analysis/plugins/"
    match: [plugin, metric-provider, stepplugins]
  - id: migrate-deployment-to-rollout
    name: "migrate deployment to rollout"
    source: "https://argo-rollouts.readthedocs.io/en/stable/migrating/"
    match: [migration, workloadref, scaledown]
  - id: nginx-ingress-traffic-routing
    name: "nginx ingress traffic routing"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/nginx/"
    match: [nginx, ingress, canary-weight]
  - id: notification-templates-and-triggers
    name: "notification templates and triggers"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/notifications/"
    match: [notifications, templates, custom-triggers]
  - id: notifications-setup-and-subscriptions
    name: "notifications setup and subscriptions"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/notifications/"
    match: [notifications, subscription, slack]
  - id: prometheus-metric-provider
    name: "prometheus metric provider"
    source: "https://argo-rollouts.readthedocs.io/en/stable/analysis/prometheus/"
    match: [prometheus, metric-provider, rangequery]
  - id: restart-rollout-pods
    name: "restart rollout pods"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/restart/"
    match: [restart, restartat, rolling-recreate]
  - id: rollback-window
    name: "rollback window"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/rollback/"
    match: [rollbackwindow, rollback, fast-track]
  - id: rollout-timing-and-history-fields
    name: "rollout timing and history fields"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/specification/"
    match: [minreadyseconds, revisionhistorylimit, progressdeadlineseconds]
  - id: rollouts-dashboard
    name: "rollouts dashboard"
    source: "https://argo-rollouts.readthedocs.io/en/stable/dashboard/"
    match: [dashboard, ui, kubectl-plugin]
  - id: smi-trafficsplit-routing
    name: "smi trafficsplit routing"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/smi/"
    match: [smi, trafficsplit, service-mesh-interface]
  - id: traffic-management-overview
    name: "traffic management overview"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/"
    match: [traffic-management, canaryservice, stableservice]
  - id: traffic-router-plugins
    name: "traffic router plugins"
    source: "https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/plugins/"
    match: [plugin, traffic-router, go-plugin]
  - id: troubleshooting-analysis-and-experiment-not-ending
    name: "troubleshooting analysis and experiment not ending"
    source: "https://argo-rollouts.readthedocs.io/en/stable/FAQ/"
    match: [troubleshooting, analysisrun, experiment]
  - id: upgrade-controller
    name: "upgrade controller"
    source: "https://argo-rollouts.readthedocs.io/en/stable/installation/"
    match: [upgrade, controller, install]
  - id: web-metric-provider
    name: "web metric provider"
    source: "https://argo-rollouts.readthedocs.io/en/stable/analysis/web/"
    match: [web, http, jsonpath]
