    source: "clojure.org reference"
    match: [clojure-embedding]
    subtopics:
      - {id: clojure-embedding-embedding-from-java, name: "Calling Clojure from Java", match: [embedding-from-java]}
      - {id: clojure-embedding-scripting-babashka, name: "Scripting with Babashka and clojure -M", match: [scripting-babashka]}
