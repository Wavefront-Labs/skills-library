    match: [clojure-performance]
    subtopics:
      - {id: clojure-performance-performance-primitives-loops, name: "Primitives and tight loops", match: [performance-primitives-loops]}
      - {id: clojure-performance-performance-laziness-startup, name: "Laziness, allocation and startup time", match: [performance-laziness-startup]}
      - {id: clojure-performance-performance-concurrency-reducers, name: "Parallel processing with reducers", match: [performance-concurrency-reducers]}
  - id: clojure-embedding
