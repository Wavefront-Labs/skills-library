    name: "JVM concurrency interop"
    source: "java.util.concurrent"
    match: [clojure-concurrency-jvm]
    subtopics:
      - {id: clojure-concurrency-jvm-executors-locking-volatile, name: "Executors, locking and volatiles", match: [executors-locking-volatile]}
      - {id: clojure-concurrency-jvm-timeouts-retry-backpressure, name: "Timeouts, retries and backpressure", match: [timeouts-retry-backpressure]}
  - id: clojure-code-organization
    name: "Project structure and idioms"
    source: "clojure.org guides"
    match: [clojure-code-organization]
    subtopics:
      - {id: clojure-code-organization-project-layout-namespaces, name: "Project layout and namespace design", match: [project-layout-namespaces]}
      - {id: clojure-code-organization-idioms-data-oriented, name: "Data-oriented idioms", match: [idioms-data-oriented]}
