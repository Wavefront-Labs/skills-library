# Coverage spec for Jellyfin server administration, from its official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: jellyfin
scope:
  category: computing-software
  field: systems-network-administration
  products: [jellyfin]
sources:
  - "Jellyfin documentation (jellyfin.org/docs) - configuration, backup and migration, troubleshooting, media naming, libraries, metadata, users, networking and plugins"
topics:
  - id: server-path-precedence
    name: "jellyfin server paths and their precedence"
    source: https://jellyfin.org/docs/general/administration/configuration/
    match: [jellyfin, data-directory, config-directory]
  - id: main-configuration-layers
    name: "main configuration layers and options"
    source: https://jellyfin.org/docs/general/administration/configuration/
    match: [jellyfin, configuration, environment-variables]
  - id: database-xml-tuning
    name: "tuning the sqlite database with database.xml"
    source: https://jellyfin.org/docs/general/administration/configuration/
    match: [jellyfin, database-xml, sqlite]
  - id: fallback-and-system-fonts
    name: "fonts for subtitles and cover images"
    source: https://jellyfin.org/docs/general/administration/configuration/
    match: [jellyfin, fonts, fallback-fonts]
  - id: built-in-backup
    name: "built-in backup and restore"
    source: https://jellyfin.org/docs/general/administration/backup-and-restore/
    match: [jellyfin, backup, built-in-backup]
  - id: manual-backup-and-restore
    name: "manual backup and restore"
    source: https://jellyfin.org/docs/general/administration/backup-and-restore/
    match: [jellyfin, backup, restore]
  - id: migrate-linux-install-to-docker
    name: "migrating a linux install to docker"
    source: https://jellyfin.org/docs/general/administration/migrate/
    match: [jellyfin, migration, docker]
  - id: migrating-from-other-servers
    name: "migrating to jellyfin from emby or plex"
    source: https://jellyfin.org/docs/general/administration/migrate/
    match: [jellyfin, migration, emby]
  - id: network-storage-and-nfs
    name: "network storage and nfs"
    source: https://jellyfin.org/docs/general/administration/storage/
    match: [jellyfin, storage, nfs]
  - id: storage-sizing-and-cloud
    name: "sizing storage and using cloud providers"
    source: https://jellyfin.org/docs/general/administration/storage/
    match: [jellyfin, storage, transcode-cache]
  - id: zfs-recordsize-for-jellyfin
    name: "zfs record size for jellyfin"
    source: https://jellyfin.org/docs/general/administration/storage/
