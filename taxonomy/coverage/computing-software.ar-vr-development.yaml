# Canonical coverage spec: AR/VR/XR Development.
subject: ar-vr-development
scope:
  category: computing-software
  field: ar-vr-development
  products:
  - openxr
  - unity-xr
  - unreal-xr
  - webxr
  - mobile-and-spatial-ar
  - xr-design-and-performance
sources:
- Khronos OpenXR 1.1 specification (registry.khronos.org/OpenXR)
- Unity Manual XR section and XR Interaction Toolkit / AR Foundation package manuals
- Unreal Engine documentation Developing for XR Experiences
- W3C WebXR Device API and WebXR module specifications
- Google ARCore developer documentation
- Apple ARKit and visionOS developer documentation
- Meta Horizon developer documentation (design and performance guidelines)
topics:
- id: xr-instance-and-loader
