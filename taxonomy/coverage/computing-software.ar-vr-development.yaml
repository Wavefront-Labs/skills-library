  source: OpenXR 1.1 spec ch. Fundamentals and API Layers
  match:
  - xr-instance-and-loader
  subtopics:
  - id: instance-extensions-enable
    name: Enable extensions when creating an XrInstance
    match:
    - instance-extensions-enable
  - id: api-layers-validation
    name: Use API layers for validation
    match:
    - api-layers-validation
  - id: active-runtime-selection
    name: Select and verify the active OpenXR runtime
    match:
    - active-runtime-selection
- id: xr-system-and-view-config
