# Canonical coverage spec: IT Support / Help Desk (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (CompTIA A+ 220-1201/220-1202 exam objectives,
# ITIL 4 practice guides, HDI Support Center Analyst standards, Microsoft Intune / Microsoft 365 admin
# and Jamf Pro docs tables of contents, Google IT Support Certificate course outline), not from what
# the library happened to contain. Subtopics come from each source's own objective bullets / page headings.
subject: it-support-helpdesk
scope:
  category: computing-software
  field: it-support-helpdesk
  products: [servicenow, intune-mdm, remote-support-tools, desktop-support, troubleshooting-methodology, device-provisioning, user-support-communication]
sources:
  - "CompTIA A+ Core 1 (220-1201) exam objectives - 1.0 Mobile Devices (laptop hardware, mobile device accessories, network connectivity and application support), 2.0 Networking (ports/protocols, SOHO network config, wireless standards, networked host services, network tools), 3.0 Hardware (cables/connectors, RAM, storage, motherboards/CPU/add-on cards, power supplies, printers and multifunction devices), 4.0 Virtualization and Cloud Computing, 5.0 Hardware and Network Troubleshooting (methodology, motherboard/RAM/CPU/power, storage/RAID, video/projector/display, mobile devices, printers, wired/wireless network)"
  - "CompTIA A+ Core 2 (220-1202) exam objectives - 1.0 Operating Systems (Windows editions/installation/upgrade, Microsoft command-line tools, Windows features and tools, Control Panel/Settings, Windows networking, macOS, Linux client, application installation, cloud productivity tools), 2.0 Security (security measures, wireless security, malware, social engineering, SOHO/workstation/mobile security, data destruction, browser security), 3.0 Software Troubleshooting (Windows OS, mobile OS and apps, security issues, malware removal procedure), 4.0 Operational Procedures (documentation and ticketing, change management, backup and recovery, safety, environmental impact, prohibited content/privacy/licensing, communication and professionalism, scripting basics, remote access technologies, AI basics)"
  - "ITIL 4 practice guides (AXELOS/PeopleCert) - Service desk, Incident management, Service request management, Problem management, Change enablement, Knowledge management, Service level management, Service configuration management, IT asset management, Monitoring and event management; ServiceNow ITSM product docs ToC (Incident, Request/Service Catalog, Problem, Change, Knowledge, SLA, CMDB, Service Portal, Virtual Agent, Agent Workspace, Flow Designer); Jira Service Management and Zendesk Support admin docs ToC"
  - "HDI Support Center Analyst (SCA) and Desktop Support Technician (DST) standards - customer service skills, communication and active listening, handling difficult customers, call/chat/email handling, incident logging and documentation, escalation, knowledge-centered service (KCS v6 practices guide from Consortium for Service Innovation), metrics and customer satisfaction"
  - "Microsoft Learn - Microsoft Intune docs ToC (enrollment for Windows/Apple/Android, Windows Autopilot, device compliance, configuration profiles, apps and app protection, endpoint security, remote actions, Windows Update for Business, troubleshooting); Microsoft 365 admin docs ToC (users, licences, passwords/MFA, groups, mailbox management, Teams/OneDrive/SharePoint support); Windows client deployment and troubleshooting docs"
  - "Jamf Pro documentation ToC (computer/mobile enrollment, PreStage enrollment, policies, configuration profiles, smart groups, Self Service, extension attributes, FileVault management, patch management) and Apple Platform Deployment guide (ADE, declarative device management, Platform SSO, privacy preferences)"
  - "Google IT Support Professional Certificate course outline - Technical Support Fundamentals, The Bits and Bytes of Computer Networking, Operating Systems and You (users/permissions, packages, filesystems, process management, remote access, logging), System Administration and IT Infrastructure Services (directory services, data recovery and backups), IT Security"
  - "Depth round 2 subtopics - CompTIA A+ 220-1201/220-1202 objective sub-bullets, ITIL 4 practice guide sections, HDI SCA/DST and KCS v6 practice sections, Microsoft Intune / Microsoft 365 admin / Windows client docs sub-pages, Jamf Pro and Apple Platform Deployment sub-pages, ServiceNow / Jira Service Management / Zendesk admin doc sub-pages, Google IT Support course modules"
