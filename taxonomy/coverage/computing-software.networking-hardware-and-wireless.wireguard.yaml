# Coverage spec: wireguard. Hand-written topics from the official docs.
subject: WireGuard
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [wireguard]
sources:
  - "wireguard.com and wg man pages"
topics:
  - id: wireguard-manual-setup
    name: "Manual interface setup with ip link"
    source: "https://www.wireguard.com/quickstart/"
    match: [ip-link, manual-setup, interface-bringup]
  - id: wireguard-setconf
    name: "wg setconf"
    source: "https://www.wireguard.com/quickstart/"
    match: [wg-setconf, wireguard]
  - id: wireguard-key-gen
    name: "Generating private and public keys"
    source: "https://www.wireguard.com/quickstart/"
    match: [wg-genkey, wg-pubkey, private-key, public-key]
  - id: wireguard-umask
    name: "Protecting key files with umask"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [umask-077, key-management]
  - id: wireguard-genpsk
    name: "Generating preshared keys"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [wg-genpsk, genpsk]
  - id: wireguard-conf-interface
    name: "Interface section"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [wg-conf, interface-section, ini-format]
  - id: wireguard-conf-peer
    name: "Peer section"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [peer-section, endpoint]
  - id: wireguard-allowedips
    name: "AllowedIPs semantics"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [allowedips]
  - id: wireguard-listenport
    name: "ListenPort"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [listenport]
  - id: wireguard-wg-set-peers
    name: "Adding and removing peers"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [add-peer, remove-peer]
  - id: wireguard-wg-set-allowed
    name: "Incremental allowed-ips changes"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [allowed-ips-incremental]
  - id: wireguard-wg-set-runtime
    name: "Runtime reconfiguration"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [wg-set, runtime-reconfiguration, listen-port]
  - id: wireguard-syncconf
    name: "wg syncconf"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [wg-syncconf, no-downtime]
  - id: wireguard-addconf
    name: "wg addconf"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [wg-addconf]
  - id: wireguard-quick-strip
    name: "wg-quick strip"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [wg-quick-strip, config-reload]
  - id: wireguard-show-handshakes
    name: "wg show latest-handshakes"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [wg-show, latest-handshakes]
  - id: wireguard-show-transfer
    name: "wg show transfer and dump"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [transfer, dump, monitoring]
  - id: wireguard-show-hide
    name: "Hiding keys and colour mode"
    source: "https://man7.org/linux/man-pages/man8/wg.8.html"
    match: [wg-hide-keys, wg-color-mode]
  - id: wireguard-quick-address
    name: "wg-quick Address and DNS"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [wg-quick, address, dns, resolvconf]
  - id: wireguard-quick-mtu
    name: "MTU and Table"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [mtu, table]
  - id: wireguard-quick-hooks
    name: "PostUp and PreDown"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [postup, predown]
  - id: wireguard-quick-save
    name: "SaveConfig"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [saveconfig]
  - id: wireguard-kill-switch
    name: "Kill switch with iptables"
    source: "https://www.wireguard.com/netns/"
    match: [kill-switch, iptables]
  - id: wireguard-policy-routing
    name: "Policy routing with ip rule"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [policy-routing, split-tunnel]
  - id: wireguard-full-tunnel
    name: "Full tunnel default route"
    source: "https://www.wireguard.com/netns/"
    match: [default-route, full-tunnel]
  - id: wireguard-fwmark
    name: "fwmark routing"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [fwmark, suppress-prefixlength, ip-rule]
  - id: wireguard-routing-loop
    name: "Avoiding routing loops"
    source: "https://man7.org/linux/man-pages/man8/wg-quick.8.html"
    match: [routing-loop, endpoint-exemption]
  - id: wireguard-netns-containers
    name: "Network namespaces for containers"
    source: "https://www.wireguard.com/netns/"
    match: [network-namespace, ip-netns, container-networking]
  - id: wireguard-netns-docker
    name: "WireGuard in Docker"
    source: "https://www.wireguard.com/netns/"
    match: [docker, wg-in-container, birthplace-namespace]
  - id: wireguard-netns-physical
    name: "Physical interfaces in a namespace"
    source: "https://www.wireguard.com/netns/"
    match: [physical-namespace, wlan0, whole-host-vpn]
  - id: wireguard-netns-exec
    name: "ip netns exec"
    source: "https://www.wireguard.com/netns/"
    match: [ip-netns-exec, dhcpcd, wpa-supplicant]
  - id: wireguard-keepalive
    name: "PersistentKeepalive"
    source: "https://www.wireguard.com/quickstart/"
    match: [persistent-keepalive, keepalive]
  - id: wireguard-nat
    name: "NAT traversal and stateful firewalls"
    source: "https://www.wireguard.com/quickstart/"
    match: [nat-traversal, stateful-firewall, nat-mapping]
  - id: wireguard-psk
    name: "Preshared keys"
    source: "https://www.wireguard.com/protocol/"
    match: [preshared-key, psk, symmetric-key]
  - id: wireguard-post-quantum
    name: "Post-quantum resistance"
    source: "https://www.wireguard.com/protocol/"
    match: [post-quantum, noise-ikpsk2]
  - id: wireguard-handshake
    name: "Handshake protocol"
    source: "https://www.wireguard.com/protocol/"
    match: [handshake, noise-ik, udp]
  - id: wireguard-rekey
    name: "Rekey and reject timers"
    source: "https://www.wireguard.com/protocol/"
    match: [rekey-timeout, reject-after-time, keepalive-timers]
  - id: wireguard-pfs
    name: "Perfect forward secrecy"
    source: "https://www.wireguard.com/protocol/"
    match: [perfect-forward-secrecy]
  - id: wireguard-limit-tcp
    name: "No TCP mode"
    source: "https://www.wireguard.com/known-limitations/"
    match: [tcp-mode, udptunnel, udp2raw]
  - id: wireguard-limit-obfuscation
    name: "Obfuscation"
    source: "https://www.wireguard.com/known-limitations/"
    match: [obfuscation, identity-hiding]
  - id: wireguard-limit-time
    name: "System time dependence"
    source: "https://www.wireguard.com/known-limitations/"
    match: [system-time, wireguard-limitations]
  - id: wireguard-limit-roaming
    name: "Roaming behaviour"
    source: "https://www.wireguard.com/known-limitations/"
    match: [roaming]
  - id: wireguard-userspace
    name: "Userspace implementations"
    source: "https://www.wireguard.com/xplatform/"
    match: [wireguard-go, userspace, wireguard-rs]
  - id: wireguard-uapi
    name: "Cross-platform config protocol"
    source: "https://www.wireguard.com/xplatform/"
    match: [uapi-socket, get-set-protocol, tun, cross-platform]
  - id: wireguard-debug-dynamic
    name: "Dynamic debug"
    source: "https://www.wireguard.com/quickstart/"
    match: [dynamic-debug, dmesg, wireguard-module]
  - id: wireguard-debug-log
    name: "Log levels and troubleshooting"
    source: "https://www.wireguard.com/quickstart/"
    match: [log-level, wg-debug, ifconfig-debug, troubleshooting]
  - id: wireguard-install-linux
    name: "Installation on Linux"
    source: "https://www.wireguard.com/install/"
    match: [wireguard-install, apt-install-wireguard, wireguard-tools, dkms, kmod]
  - id: wireguard-install-other
    name: "Installation on OpenWrt and macOS"
    source: "https://www.wireguard.com/install/"
    match: [openwrt, macos-homebrew]
