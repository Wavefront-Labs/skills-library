      - {id: glove-props, name: Handling props with glove puppets, match: [glove-puppet-props]}
      - {id: glove-fights, name: Glove puppet slapstick and fights, match: [puppet-fight]}
  - id: punch-and-judy
    name: Punch and Judy
    source: WEPA Punch and Judy; College of Punch and Judy Professors
    match: [punch-and-judy]
    subtopics:
      - {id: swazzle, name: Using the swazzle, match: [swazzle]}
