# Canonical coverage spec: puppetry and object theatre (all products in the field).
# Checked by tools/coverage_check.py. A topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from the puppetry manuals, UNIMA encyclopedia entries, company
# practice and TV-puppetry training listed in `sources`, not from the library.
# Ventriloquism lives in comedy-and-variety-performance; clown and mask in circus-arts and theatre.
subject: puppetry-and-object-theatre
scope:
  category: creative-arts
  field: puppetry-and-object-theatre
  products: [hand-and-rod-puppetry, marionette-performance, shadow-puppetry, bunraku-and-tabletop, object-theatre, puppetry-for-camera]
sources:
  - "Marjorie Batchelder, The Puppet Theatre Handbook (1947) - hand puppets, marionettes, shadow figures, stages, lighting, production and performance chapters"
  - "David Currell, The Complete Book of Puppet Theatre (1985; rev. as Puppets and Puppet Theatre 1999) and Making and Manipulating Marionettes (2004) - glove, rod, marionette (controls, stringing, manipulation, trick figures), shadow, staging, lighting, sound, rehearsal"
  - "UNIMA World Encyclopedia of Puppetry Arts (https://wepa.unima.org) - entries on bunraku, wayang kulit, karagoz, nang yai, tholpavakoothu, opera dei pupi, Punch and Judy, toy theatre, object theatre, water puppetry"
  - "Puppeteers of America (https://www.puppeteers.org) - Puppetry Journal technique articles and National Puppetry Festival workshop curriculum"
  - "Penny Francis, Puppetry - A Reader in Theatre Practice (2012); Posner, Orenstein and Bell (eds), The Routledge Companion to Puppetry and Material Performance (2014) - manipulation principles, visible operator, dramaturgy, object and material performance"
  - "Barbara Adachi, Backstage at Bunraku (1985); Donald Keene, Bunraku - The Art of the Japanese Puppet Theatre (1965) - three-man operation, kashira, tayu, shamisen, kurogo"
  - "Basil Jones and Adrian Kohler, Handspring Puppet Company (2009); National Theatre War Horse puppetry notes - large animal puppets, breath, ensemble operation"
  - "Rainer Reusch (ed), Shadow Theatre vols 1-2 (UNIMA 2001); Ward Keeler, Javanese Shadow Plays, Javanese Selves (1987); Fan Pen Chen, Chinese Shadow Theatre (2007)"
  - "Christian Carrignon and Theatre de Cuisine object theatre writings; Agnes Limbos workshops; George Speaight, The History of the English Toy Theatre (1969)"
  - "Jim Henson Company and Sesame Workshop puppeteer training as described in The Muppets Make Puppets (Cheryl Henson, 1994) and Henson workshop notes; Henson Digital Puppetry Studio; Creature Shop animatronic practice"
  - "Glyn Edwards and the College of Punch and Judy Professors - booth, swazzle, bottling, the traditional script"
