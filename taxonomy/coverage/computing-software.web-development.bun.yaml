# Coverage spec: bun. Topics from the Bun docs (oven-sh/bun, docs/ folder).
subject: bun
scope:
  category: computing-software
  field: web-development
  products: [bun]
sources:
  - "Bun docs (raw mdx in github.com/oven-sh/bun, docs/ folder)"
topics:
  - id: add-dependency-groups
    name: "Add packages"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/add.mdx"
    match: [bun-add, dev-dependency, peer-dependency, exact-version, save-prod]
  - id: add-git-tarball-local
    name: "Add dependencies from git repositories"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/add.mdx"
    match: [git-dependency, tarball-dependency, local-path-dependency, ssh-git]
  - id: audit-vulnerabilities
    name: "Scan bun.lock for known vulnerabilities"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/audit.mdx"
    match: [bun-audit, audit-fix, audit-level, ghsa-ignore]
  - id: auto-install
    name: "Run scripts without node_modules using Bun auto-install"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/auto-install.mdx"
    match: [auto-install, prefer-offline, import-version-specifier, no-node-modules]
  - id: bun-build-cli
    name: "Bundle with bun build or Bun.build"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/bundler/index.mdx"
    match: [bun-build, build-api, bundler-target, bundler-naming]
  - id: bundler-loaders
    name: "Pick Bun loaders by extension"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/bundler/loaders.mdx"
    match: [bundler-loaders, import-attributes, file-loader, embed-sqlite]
  - id: bundler-plugins
    name: "Write Bun bundler plugins"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/bundler/plugins.mdx"
    match: [bundler-plugins, on-resolve, on-load, virtual-modules]
  - id: bunfig-runtime-keys
    name: "Configure the Bun runtime in bunfig.toml"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/bunfig.mdx"
    match: [bunfig-toml, preload, define-loader, run-config]
  - id: bunx-run-binaries
    name: "Run package binaries with bunx"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/bunx.mdx"
    match: [bunx, package-executable, bun-flag-placement, npx-alternative]
  - id: catalogs-shared-versions
    name: "Share dependency versions across a monorepo"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/catalogs.mdx"
    match: [catalogs, catalog-protocol, monorepo-versions, workspaces-catalog]
  - id: env-files
    name: "Use .env files in Bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/environment-variables.mdx"
    match: [dotenv, env-file, import-meta-env, env-expansion]
  - id: fetch-options
    name: "Use Bun-specific fetch options"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/networking/fetch.mdx"
    match: [bun-fetch, fetch-proxy, fetch-unix-socket, fetch-session]
  - id: file-io
    name: "Read and write files"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/file-io.mdx"
    match: [bun-file, bun-write, file-sink, node-fs-directories]
  - id: frozen-lockfile-ci
    name: "Make Bun installs reproducible in CI"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/install.mdx"
    match: [frozen-lockfile, bun-ci, reproducible-install, ci-install]
  - id: fullstack-serve
    name: "Build a full-stack Bun app"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/bundler/fullstack.mdx"
    match: [fullstack-server, html-imports, hmr-development, production-bundle]
  - id: html-dev-server
    name: "Serve and build HTML entrypoints with Bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/bundler/html-static.mdx"
    match: [html-dev-server, html-bundling, serve-static-plugins, tailwind-plugin]
  - id: install-bun
    name: "Install Bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/installation.mdx"
    match: [bun-install-methods, install-script, verify-version, command-not-found, uninstall]
  - id: install-bunfig-env
    name: "Configure bun install through bunfig.toml [install] keys and BUN_CONFIG environment variables: registry"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/install.mdx"
    match: [bunfig-install, bun-config-registry, install-env-vars, http-retry]
  - id: install-flags
    name: "Choose the right bun install flags"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/install.mdx"
    match: [bun-install, production, dry-run, omit, backend, offline]
  - id: isolated-installs
    name: "Choose between the isolated and hoisted linkers"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/isolated-installs.mdx"
    match: [isolated-linker, hoisted-linker, phantom-dependencies, config-version]
  - id: lifecycle-scripts-trust
    name: "Control which dependency lifecycle scripts run"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/lifecycle.mdx"
    match: [trusted-dependencies, ignore-scripts, postinstall, lifecycle-scripts]
  - id: link-local-packages
    name: "Develop against a local package"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/link.mdx"
    match: [bun-link, link-protocol, local-development, unlink]
  - id: lockfile-migration
    name: "Work with bun.lock"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/lockfile.mdx"
    match: [bun-lock, migrate-lockfile, bun-lockb, yarn-lockfile]
  - id: minify-drop
    name: "Minify Bun bundles selectively"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/bundler/minifier.mdx"
    match: [minify, drop-console, dead-code-elimination, keep-names]
  - id: minimum-release-age
    name: "Delay adoption of freshly published npm versions"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/install.mdx"
    match: [minimum-release-age, supply-chain, release-cooldown]
  - id: npmrc-config
    name: "Use .npmrc with Bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/npmrc.mdx"
    match: [npmrc, registry-auth-token, env-expansion, ca-certificates]
  - id: outdated-report
    name: "Read the bun outdated table (Current"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/outdated.mdx"
    match: [bun-outdated, outdated-table, outdated-patterns]
  - id: overrides-resolutions
    name: "Pin or replace transitive dependencies with overrides or resolutions"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/overrides.mdx"
    match: [overrides, resolutions, transitive-dependency, version-pin]
  - id: patch-dependency
    name: "Patch a third-party package in place"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/patch.mdx"
    match: [bun-patch, patched-dependencies, patch-commit]
  - id: pm-cache-management
    name: "Manage Bun's package cache"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/pm.mdx"
    match: [bun-pm-cache, cache-prune, cache-pack, bun-pm-fetch]
  - id: pm-inspect
    name: "Inspect installed dependencies with bun pm ls, licenses and diff"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/pm.mdx"
    match: [bun-pm-ls, bun-pm-licenses, bun-pm-diff, pm-diff-versions]
  - id: pm-pack-and-version
    name: "Create a publishable tarball"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/pm.mdx"
    match: [bun-pm-pack, bun-pm-version, version-bump, npm-pack]
  - id: pm-pkg-fields
    name: "Read and edit package.json from scripts"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/pm.mdx"
    match: [bun-pm-pkg, package-json-edit, pkg-fix]
  - id: publish-package
    name: "Publish to npm with bun publish"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/publish.mdx"
    match: [bun-publish, dist-tag, tolerate-republish, publish-config]
  - id: redis-client
    name: "Use Bun's built-in Redis client"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/redis.mdx"
    match: [bun-redis, redis-pubsub, auto-pipelining, valkey]
  - id: remove-packages
    name: "Remove dependencies"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/remove.mdx"
    match: [bun-remove, uninstall-package, remove-filter]
  - id: s3-client
    name: "Use Bun's built-in S3 client with AWS, R2, MinIO and other endpoints"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/s3.mdx"
    match: [bun-s3, s3-presign, s3-multipart, s3-compatible-storage]
  - id: scoped-registries
    name: "Point Bun at a private or scoped npm registry in bunfig.toml"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/scopes-registries.mdx"
    match: [scoped-registry, install-scopes, private-registry, registry-token]
  - id: security-scanner
    name: "Configure and write a Bun security scanner that checks packages at install time: bunfig setting"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/security-scanner-api.mdx"
    match: [security-scanner, install-security, advisory-level, supply-chain-scan]
  - id: serve-basics
    name: "Run an HTTP server with Bun.serve"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/http/server.mdx"
    match: [bun-serve, idle-timeout, server-stop, unix-socket]
  - id: serve-error-handling
    name: "Handle errors in Bun.serve"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/http/error-handling.mdx"
    match: [serve-error-handler, development-mode, node-env-production, error-page]
  - id: serve-routing
    name: "Define Bun.serve routes"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/http/routing.mdx"
    match: [serve-routes, route-params, static-responses, directory-routes]
  - id: serve-tls-sni
    name: "Serve HTTPS from Bun.serve"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/http/tls.mdx"
    match: [serve-tls, mutual-tls, sni, client-certificates]
  - id: serve-websockets
    name: "Build WebSocket servers in Bun.serve"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/http/websockets.mdx"
    match: [websocket-server, pub-sub, backpressure, origin-check]
  - id: shell-scripting
    name: "Script with Bun Shell ($)"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/shell.mdx"
    match: [bun-shell, shell-nothrow, shell-injection, shell-redirects]
  - id: spawn-subprocess
    name: "Run child processes with Bun.spawn and spawnSync"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/child-process.mdx"
    match: [bun-spawn, spawn-sync, subprocess-ipc, spawn-timeout]
  - id: sql-client
    name: "Use Bun.SQL for PostgreSQL, MySQL/MariaDB and SQLite"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/sql.mdx"
    match: [bun-sql, postgres-client, mysql-client, database-url]
  - id: sql-transactions-fragments
    name: "Write transactions, savepoints and dynamic SQL fragments with Bun.SQL"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/sql.mdx"
    match: [sql-transactions, sql-fragments, sql-savepoint, sql-unsafe]
  - id: sqlite-queries
    name: "Query SQLite with bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/sqlite.mdx"
    match: [bun-sqlite, sqlite-statements, sqlite-parameters, safe-integers]
  - id: sqlite-transactions-wal
    name: "Use bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/sqlite.mdx"
    match: [sqlite-transactions, wal-mode, sqlite-extensions, sqlite-update-hooks]
  - id: test-coverage
    name: "Collect coverage with bun test --coverage"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/code-coverage.mdx"
    match: [code-coverage, coverage-threshold, lcov, coverage-ignore]
  - id: test-fake-timers
    name: "Control time in bun test"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/dates-times.mdx"
    match: [fake-timers, set-system-time, test-timezone, advance-timers]
  - id: test-lifecycle-dom
    name: "Set up bun test lifecycle hooks (including aroundEach and global preload setup) and a DOM environment"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/lifecycle.mdx"
    match: [test-hooks, around-each, happy-dom, dom-testing]
  - id: test-mocks
    name: "Mock in bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/mocks.mdx"
    match: [mock-module, spy-on, mock-restore, jest-fn]
  - id: test-modifiers-expect
    name: "Write bun"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/writing-tests.mdx"
    match: [test-modifiers, test-each, expect-poll, test-failing]
  - id: test-parallel-isolation
    name: "Speed up large bun test suites"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/parallel.mdx"
    match: [test-parallel, test-isolate, test-shard, worker-id]
  - id: test-reporters-junit
    name: "Choose bun test reporters"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/reporters.mdx"
    match: [junit-reporter, dots-reporter, ci-annotations, reporter-outfile]
  - id: test-run-flags
    name: "Run bun test"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/index.mdx"
    match: [bun-test, test-discovery, test-name-pattern, flaky-tests]
  - id: test-snapshots
    name: "Use snapshot tests in bun test"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/test/snapshots.mdx"
    match: [snapshot-testing, inline-snapshot, update-snapshots, property-matchers]
  - id: update-dependencies
    name: "Update dependencies with bun update"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/cli/update.mdx"
    match: [bun-update, interactive-update, update-latest, depth-zero]
  - id: upgrade-and-canary
    name: "Upgrade Bun in place"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/installation.mdx"
    match: [bun-upgrade, canary-build, pin-version, stable-channel]
  - id: watch-and-hot
    name: "Choose between bun --watch (hard restart) and --hot (soft reload keeping state)"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/runtime/watch-mode.mdx"
    match: [bun-watch, bun-hot, hot-reload, watch-mode]
  - id: workspace-filter
    name: "Select workspace packages"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/filter.mdx"
    match: [bun-filter, workspace-scripts, dependency-order, parallel-scripts]
  - id: workspaces-monorepo
    name: "Set up Bun workspaces"
    source: "https://raw.githubusercontent.com/oven-sh/bun/main/docs/pm/workspaces.mdx"
    match: [bun-workspaces, workspace-protocol, negative-globs, self-contained-workspace]
