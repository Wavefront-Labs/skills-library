# Canonical coverage spec: Google Cloud Platform.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (Google Cloud certification exam guides and
# the Google Cloud Architecture Framework), not from what we happened to write.
# Subtopics (depth) come from the cloud.google.com product "How-to guides" tables of contents,
# the gcloud command groups for each product, and the exam-guide sub-bullets.
subject: google-cloud
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [google-cloud]
sources:
  - "Google Cloud Associate Cloud Engineer exam guide: Setting up a cloud solution environment, Planning and configuring, Deploying and implementing, Ensuring successful operation, Configuring access and security"
  - "Google Cloud Professional Cloud Architect exam guide: Designing and planning, Managing and provisioning, Security and compliance, Analyzing and optimizing technical and business processes, Managing implementation, Ensuring solution and operations reliability"
  - "Google Cloud Professional Cloud DevOps Engineer exam guide: Bootstrapping a Google Cloud organization, Building and implementing CI/CD pipelines, Applying site reliability engineering practices, Implementing service monitoring strategies, Optimizing service performance"
  - "Google Cloud Professional Cloud Security Engineer exam guide: Configuring access, Securing communications and establishing boundary protection, Ensuring data protection, Managing operations, Supporting compliance requirements"
  - "Google Cloud Architecture Framework pillars: Operational excellence, Security privacy and compliance, Reliability, Cost optimization, Performance optimization, plus System design"
  - "cloud.google.com per-product documentation How-to guides tables of contents (Resource Manager, Compute Engine, GKE, Cloud Run, Cloud Storage, Cloud SQL, VPC, Cloud Load Balancing, Cloud KMS, Cloud Logging, Cloud Monitoring, Cloud Build, Cloud Deploy and others)"
  - "gcloud CLI reference command groups (gcloud compute, gcloud container, gcloud run, gcloud storage, gcloud sql, gcloud kms, gcloud logging, gcloud monitoring, gcloud builds, gcloud deploy, gcloud iam, gcloud org-policies, gcloud access-context-manager)"
