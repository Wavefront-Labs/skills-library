# Canonical coverage spec: F# language and ecosystem.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: fsharp-language
scope:
  category: computing-software
  field: software-engineering
  products: [fsharp]
sources:
  - "F# language reference (learn.microsoft.com/dotnet/fsharp/language-reference)"
  - "F# language specification (fsharp.org/specs/language-spec)"
  - "FSharp.Core library reference (fsharp.github.io/fsharp-core-docs)"
  - "F# style guide and coding conventions (learn.microsoft.com/dotnet/fsharp/style-guide)"
  - "dotnet CLI, F# compiler options, NuGet, Paket, FAKE, Fantomas, Ionide, FSharp.Analyzers.SDK"
  - "Expecto, FsCheck, xUnit, BenchmarkDotNet, Giraffe, Fable, FSharp.Data docs"
topics:
  - id: fsharp-basics
    name: "Basic types, literals and strings"
    source: "F# language reference: Basic Types, Literals, Strings"
    match: [fsharp-basics]
    subtopics:
      - {id: fsharp-basics-numeric-literals, name: "Numeric literals, suffixes and conversions", match: [numeric-literals]}
      - {id: fsharp-basics-string-literals, name: "String literals, verbatim, triple-quoted and interpolated strings", match: [string-literals]}
  - id: fsharp-bindings
    name: "let bindings, mutability and scope"
    source: "F# language reference: Values, Let Bindings, Mutable, Reference Cells"
    match: [fsharp-bindings]
    subtopics:
      - {id: fsharp-bindings-let-immutability, name: "let bindings, shadowing and immutability by default", match: [let-immutability]}
      - {id: fsharp-bindings-mutable-ref-cells, name: "mutable locals, ref cells and closure capture", match: [mutable-ref-cells]}
  - id: fsharp-functions
    name: "Functions, currying and recursion"
    source: "F# language reference: Functions, Recursive Functions, Inline Functions, Operator Overloading"
    match: [fsharp-functions]
    subtopics:
      - {id: fsharp-functions-currying-partial, name: "Currying, partial application and higher-order functions", match: [currying-partial]}
      - {id: fsharp-functions-recursion-tailcalls, name: "Recursion, rec, and, tail calls and accumulators", match: [recursion-tailcalls]}
      - {id: fsharp-functions-inline-functions, name: "inline functions and static member constraints", match: [inline-functions]}
      - {id: fsharp-functions-custom-operators, name: "Defining and overloading operators", match: [custom-operators]}
  - id: fsharp-tuples-records
    name: "Tuples and records"
    source: "F# language reference: Tuples, Records, Anonymous Records"
    match: [fsharp-tuples-records]
    subtopics:
      - {id: fsharp-tuples-records-tuples, name: "Tuples and struct tuples", match: [tuples]}
      - {id: fsharp-tuples-records-records, name: "Records, copy-and-update and structural equality", match: [records]}
      - {id: fsharp-tuples-records-anonymous-records, name: "Anonymous records", match: [anonymous-records]}
  - id: fsharp-unions
    name: "Discriminated unions and enums"
    source: "F# language reference: Discriminated Unions, Enumerations"
    match: [fsharp-unions]
    subtopics:
      - {id: fsharp-unions-discriminated-unions, name: "Discriminated unions and domain modelling", match: [discriminated-unions]}
      - {id: fsharp-unions-single-case-unions, name: "Single-case unions, struct unions and RequireQualifiedAccess", match: [single-case-unions]}
      - {id: fsharp-unions-enums-flags, name: "Enums and flags enums", match: [enums-flags]}
  - id: fsharp-matching
    name: "Pattern matching"
    source: "F# language reference: Pattern Matching, Active Patterns, Match Expressions"
    match: [fsharp-matching]
    subtopics:
