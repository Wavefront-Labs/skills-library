# Canonical coverage spec: arista-eos.
# Topics come from external vendor structures (listed in sources).
subject: arista-eos
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [arista-eos]
sources:
  - "Arista Certified Engineering Associate (ACE-A) and ACE-Professional (ACE-P) exam blueprints - EOS fundamentals, layer 2, layer 3, MLAG, VXLAN/EVPN, automation, CloudVision"
  - "Arista EOS User Manual table of contents - CLI, configuration management, switching, routing, data center bridging, monitoring, programmatic interfaces"
  - "Arista CloudVision documentation (CVP/CVaaS) - TerminAttr onboarding, provisioning, change control, telemetry, Studios"
  - "Arista Validated Design (AVD) and EOS Central design guides - L3 leaf-spine, EVPN-VXLAN, MLAG"
topics:
  - id: cli-modes-privilege
    name: "EOS CLI modes and privilege levels"
    source: "ACE-A / EOS fundamentals"
    match: [cli-modes]
  - id: config-sessions-rollback
    name: "Configuration sessions and commit timers"
    source: "ACE-P / configuration management"
    match: [config-session]
  - id: running-config-management
    name: "Saving, copying and replacing configuration"
    source: "ACE-A / configuration management"
    match: [running-config]
  - id: interface-configuration
    name: "Interface configuration"
    source: "ACE-A / layer 2 and layer 3"
    match: [interface-config]
  - id: vlans
    name: "VLANs and trunks"
    source: "ACE-A / layer 2"
    match: [vlans]
  - id: port-channel-lacp
    name: "Port-channels and LACP"
    source: "ACE-A / layer 2"
    match: [port-channel]
  - id: spanning-tree-mstp
    name: "Spanning tree (MSTP default)"
    source: "ACE-A / layer 2"
    match: [spanning-tree]
  - id: mlag
    name: "MLAG (multi-chassis LAG)"
    source: "ACE-A / MLAG"
    match: [mlag]
  - id: vrf-routing
    name: "VRFs and routing"
    source: "ACE-A / layer 3"
    match: [vrf]
  - id: static-and-ecmp
    name: "Static routes, ECMP and route preference"
    source: "ACE-A / layer 3"
    match: [static-routes]
  - id: ospf
    name: "OSPF"
    source: "ACE-A / layer 3"
