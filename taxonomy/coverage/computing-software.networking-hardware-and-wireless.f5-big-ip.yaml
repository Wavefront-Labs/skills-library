# Coverage spec: f5-big-ip. Topics from the external structures in `sources`.
subject: f5-big-ip
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [f5-big-ip]
sources:
  - "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration) - www.f5.com/pdf/certification/exams/blueprint-tmos-administration.pdf"
  - "F5 301a LTM Specialist, 301b LTM Specialist Maintain and Troubleshoot, 303 ASM Specialist, 304 GTM/DNS Specialist exam objectives (my.f5.com/clouddocs.f5.com certification pages)"
  - "F5 BIG-IP 15.1 manuals ToC - techdocs.f5.com (System Initial Configuration, LTM Implementations, DNS Services, ASM/Advanced WAF, APM, AFM, Device Service Clustering) and clouddocs.f5.com iRules/iControl REST/AS3"
topics:
  - id: vlans-and-tagging
    name: "VLANs and 802.1Q tagging on BIG-IP"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [vlans, vlan-tagging, 802-1q]
  - id: self-ips-and-port-lockdown
    name: "Self IPs and port lockdown"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [self-ip, port-lockdown, allow-service]
  - id: trunks-lacp
    name: "Trunks and LACP link aggregation"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [trunks, lacp, link-aggregation]
  - id: route-domains
    name: "Route domains for overlapping address space"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [route-domains, rd, overlapping-ip]
  - id: default-and-static-routes
    name: "Default gateway and static routes"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [static-routes, default-gateway, management-route]
  - id: licensing-and-provisioning
    name: "Licensing and module provisioning"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [license, provisioning, sys-provision]
  - id: ucs-backup-and-restore
    name: "UCS archives: backup and restore"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [ucs, backup, restore, config-archive]
  - id: users-roles-and-partitions
    name: "Local users, roles and partitions"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [user-roles, partitions, rbac]
  - id: remote-auth-ldap-radius
    name: "Remote authentication: LDAP, RADIUS, TACACS+"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [ldap-auth, radius-auth, remote-roles]
  - id: snmp-and-remote-syslog
    name: "SNMP and remote syslog configuration"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [snmp, remote-syslog, ntp-dns]
  - id: software-volumes-and-upgrades
    name: "Software volumes, hotfixes and upgrades"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [software-install, boot-locations, upgrade]
  - id: virtual-server-types
    name: "Virtual server types: standard, forwarding, performance"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [virtual-server, standard-virtual, forwarding-ip, performance-l4]
  - id: pools-and-pool-members
    name: "Pools and pool members"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [pools, pool-members, priority-groups]
  - id: load-balancing-methods
    name: "Load balancing methods"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [load-balancing, round-robin, least-connections, ratio]
  - id: health-monitors
    name: "Health monitors"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [monitors, http-monitor, send-receive, https-monitor]
  - id: node-and-member-states
    name: "Node and pool member states: enable, disable, force offline"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [member-states, force-offline, connection-draining]
  - id: tcp-profile
    name: "TCP profiles and tuning"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [tcp-profile, tcp-optimization, idle-timeout]
  - id: http-profile
    name: "HTTP profile: headers, X-Forwarded-For and compression"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [http-profile, x-forwarded-for, insert-xff, http-headers]
  - id: client-ssl-profile
    name: "Client SSL profile and TLS termination"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [clientssl, tls-termination, cipher-string, sni]
  - id: server-ssl-profile
    name: "Server SSL profile and re-encryption"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [serverssl, re-encryption, server-side-tls]
  - id: cookie-persistence
    name: "Cookie persistence"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [persistence, cookie-persistence, insert-mode]
  - id: source-addr-and-universal-persistence
    name: "Source address and universal persistence"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [source-addr-persistence, universal-persistence, persist-uie]
  - id: snat-automap
    name: "SNAT and SNAT automap"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [snat, automap, source-address-translation]
  - id: oneconnect
    name: "OneConnect connection reuse"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [oneconnect, connection-pooling, keep-alive]
  - id: irules-events-and-structure
    name: "iRules events, priorities and structure"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [irules, irule-events, event-priority]
  - id: irules-http-routing-and-redirects
    name: "iRules for HTTP routing, redirect and header edits"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [irules-routing, http-redirect, pool-selection]
  - id: irules-data-groups
    name: "Data groups (classes) in iRules"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [data-groups, class-match, address-lists]
  - id: irules-tables-and-session
    name: "iRules table command and session state"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [irules-table, session-table, rate-limiting]
  - id: irules-ssl-sni-and-logging
    name: "iRules for SNI routing, TLS info and safe logging"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [irules-sni, clientssl-handshake, log-local0]
  - id: local-traffic-policies
    name: "Local traffic policies (LTM policies)"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [ltm-policy, local-traffic-policy, policy-rules]
  - id: device-trust-and-config-sync
    name: "Device trust, device groups and config sync"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [device-trust, device-group, config-sync]
  - id: traffic-groups-and-floating-ips
    name: "Traffic groups, floating addresses and failover"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [traffic-groups, floating-ip, ha-group]
  - id: ha-troubleshooting-and-mirroring
    name: "HA troubleshooting: network failover, mirroring and sync failures"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [connection-mirroring, network-failover, sync-troubleshooting]
  - id: tcpdump-and-ssldump
    name: "Packet capture with tcpdump and ssldump"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [tcpdump, ssldump, packet-capture]
  - id: dns-wide-ips-and-pools
    name: "DNS wide IPs, GTM pools and servers"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [wide-ip, gtm-pool, gslb-server]
  - id: dns-listeners-and-profiles
    name: "DNS listeners, DNS profiles and caching"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [dns-listener, dns-profile, dns-cache]
  - id: dns-gslb-load-balancing-topology
    name: "GSLB load balancing methods, topology and persistence"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [gslb-topology, topology-records, dns-persistence]
  - id: dns-monitors-sync-groups-and-iquery
    name: "GTM monitors, sync groups and iQuery"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [iquery, gtm-sync-group, bigip-monitor]
  - id: waf-policy-creation-and-learning
    name: "Advanced WAF policy creation and learning modes"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [advanced-waf, asm-policy, learning-mode]
  - id: waf-attack-signatures-and-staging
    name: "Attack signatures, signature sets and staging"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [attack-signatures, signature-staging, signature-sets]
  - id: apm-access-policy-and-vpe
    name: "APM access policies and the Visual Policy Editor"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [apm, access-policy, visual-policy-editor]
  - id: afm-network-firewall-and-dos
    name: "AFM firewall policies, contexts and DoS protection"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [afm, firewall-policy, dos-protection]
  - id: as3-declarative-deployment
    name: "AS3 declarative application deployment"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [as3, declarative-deployment, application-services]
  - id: icontrol-rest-and-tmsh-scripting
    name: "iControl REST and tmsh scripting"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [icontrol-rest, tmsh, bigip-automation]
  - id: certificate-expiry-and-renewal
    name: "Certificate and key lifecycle: CSR, install, expiry"
    source: "F5 Certified BIG-IP Administrator blueprints (101 Application Delivery Fundamentals, 201 TMOS Administration)"
    match: [csr, certificate-renewal, cert-expiry]
