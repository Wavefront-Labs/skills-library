# Canonical coverage spec: native iOS and Android mobile development.
# Topics come from the external sources listed below, not from existing skills.
subject: mobile-development
scope:
  category: computing-software
  field: software-engineering
  products: [mobile-development]
sources:
  - "Apple Human Interface Guidelines (developer.apple.com/design/human-interface-guidelines)"
  - "App Store Review Guidelines (developer.apple.com/app-store/review/guidelines)"
  - "Swift and SwiftUI documentation (developer.apple.com/documentation, swift.org/documentation)"
  - "Android developer documentation (developer.android.com)"
  - "Google Play Developer Program Policy (support.google.com/googleplay/android-developer)"
  - "OWASP MASVS and MASTG (mas.owasp.org)"
  - "Guide to app architecture (developer.android.com/topic/architecture)"
topics:
  - id: mobile-deep-links
    name: "Deep links, App Links and Universal Links"
    source: "Android app links docs, Apple Universal Links docs"
    match: [deep-links]
  - id: mobile-apns
    name: "Push notifications via APNs and FCM"
    source: "Apple UserNotifications docs, Firebase Cloud Messaging docs"
    match: [push-notifications]
  - id: mobile-certificate-pinning
    name: "Certificate pinning"
    source: "MASVS-NETWORK, Android network security config"
    match: [certificate-pinning]
  - id: mobile-keychain
    name: "Keychain and Keystore secure storage"
    source: "Apple Keychain Services docs, Android Keystore docs"
    match: [keychain]
  - id: mobile-biometric-auth
    name: "Biometric authentication"
    source: "Android BiometricPrompt docs, Apple LocalAuthentication docs"
    match: [biometric-auth]
  - id: mobile-runtime-permissions
    name: "Runtime permissions"
    source: "Android permissions docs, Apple HIG Privacy"
    match: [runtime-permissions]
  - id: mobile-play-integrity
    name: "Play Integrity and App Attest"
    source: "Play Integrity API docs, Apple DeviceCheck docs"
    match: [play-integrity]
  - id: mobile-staged-rollout
    name: "Staged rollouts and phased release"
    source: "Play Console help, App Store Connect help"
    match: [staged-rollout]
  - id: mobile-in-app-purchases
    name: "In-app purchases and subscriptions"
    source: "StoreKit 2 docs, Google Play Billing Library docs"
    match: [in-app-purchases]
  - id: mobile-privacy-manifest
    name: "Privacy manifests and tracking transparency"
    source: "Apple privacy manifest docs, App Tracking Transparency"
    match: [privacy-manifest]
  - id: mobile-localization
    name: "Localization and RTL"
    source: "Apple localization docs, Android localization guide"
    match: [localization]
  - id: mobile-widgets
    name: "Home screen widgets"
    source: "WidgetKit docs, Jetpack Glance docs"
    match: [widgetkit]
  - id: mobile-foreground-service
    name: "Foreground services and background limits"
    source: "Android foreground service docs, background execution limits"
    match: [foreground-service]
  - id: mobile-workmanager
    name: "Deferrable background work"
    source: "WorkManager docs, BGTaskScheduler docs"
    match: [workmanager]
  - id: mobile-crash-reporting
    name: "Crash reporting and symbolication"
    source: "Apple crash report docs, Android vitals"
    match: [symbolication]
  - id: mobile-compose-recomposition
    name: "Jetpack Compose state and recomposition"
    source: "Compose documentation"
    match: [recomposition]
  - id: mobile-swiftui-state
    name: "SwiftUI state and data flow"
    source: "SwiftUI documentation"
    match: [swiftui-state]
  - id: mobile-baseline-profiles
    name: "Baseline Profiles and macrobenchmarks"
    source: "Android performance docs"
    match: [baseline-profiles]
  - id: mobile-leak-detection
    name: "Memory leak detection"
    source: "LeakCanary docs, Xcode Instruments docs"
    match: [leakcanary]
  - id: mobile-camerax
    name: "Camera capture"
    source: "CameraX docs, AVFoundation docs"
    match: [camerax]
  - id: mobile-location
    name: "Location services and geofencing"
    source: "Fused location docs, Core Location docs"
    match: [geofencing]
  - id: mobile-remote-config
    name: "Remote config and feature flags"
    source: "Firebase Remote Config docs"
    match: [remote-config]
  - id: mobile-testflight
    name: "TestFlight and Play testing tracks"
    source: "App Store Connect help, Play Console help"
