    source: "https://www.jaegertracing.io/docs/2.22/getting-started/"
    match: [jaeger, all-in-one, docker-run, in-memory-storage, port-16686]
  - id: jaeger-config-yaml-format
    name: "Jaeger config yaml format"
    source: "https://www.jaegertracing.io/docs/2.22/deployment/configuration/"
