  - id: jaeger-env-vars-and-set-overrides
    name: "Jaeger env vars and set overrides"
    source: "https://www.jaegertracing.io/docs/2.22/deployment/configuration/"
    match: [jaeger, config-env-var, set-flag, jaeger-listen-host, otel-exporter-otlp-endpoint]
  - id: jaeger-storage-extension-config
    name: "Jaeger storage extension config"
    source: "https://www.jaegertracing.io/docs/2.22/deployment/configuration/"
