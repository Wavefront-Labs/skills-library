# Canonical coverage spec: Search and information retrieval (Elasticsearch and OpenSearch).
subject: search-and-information-retrieval
scope:
  category: computing-software
  field: search-and-information-retrieval
  products: [elasticsearch-opensearch]
sources:
  - "Elastic Certified Engineer exam objectives (elastic.co/training) - mappings, analysis, queries, aggregations, cluster operations"
  - "Elasticsearch reference table of contents (elastic.co/guide/en/elasticsearch/reference/current/index.html)"
  - "OpenSearch documentation table of contents (opensearch.org/docs/latest)"
  - "Apache Lucene documentation (lucene.apache.org/core/documentation.html) - analysis, scoring, similarity"
topics:
  - id: es-mappings
    name: "Mappings and field types"
    source: "Elasticsearch reference: Mapping; OpenSearch docs: Mappings and field types"
    match: [es-mappings]
    subtopics:
      - {id: es-mappings-explicit-mapping-creation, name: "Create an index with an explicit mapping", match: [explicit-mapping-creation]}
      - {id: es-mappings-dynamic-mapping-control, name: "Control dynamic mapping behaviour", match: [dynamic-mapping-control]}
      - {id: es-mappings-multi-fields-and-copy-to, name: "Multi-fields and copy_to", match: [multi-fields-and-copy-to]}
      - {id: es-mappings-text-vs-keyword-fields, name: "Choose text versus keyword", match: [text-vs-keyword-fields]}
      - {id: es-mappings-numeric-and-date-types, name: "Numeric, date and range field types", match: [numeric-and-date-types]}
