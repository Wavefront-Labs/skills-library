# Coverage spec: proxmox-ve. Topics from the Proxmox VE admin guide.
subject: proxmox-ve
scope:
  category: computing-software
  field: systems-network-administration
  products: [proxmox-ve]
sources:
  - "Proxmox VE admin guide (pve.proxmox.com/pve-docs)"
topics:
  - id: install-from-iso
    name: "Install from iso"
    source: "https://pve.proxmox.com/pve-docs/chapter-pve-installation.html"
    match: [install, iso, usb]
  - id: repositories-and-no-subscription
    name: "Repositories and no subscription"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [repositories, no-subscription, apt]
  - id: package-updates-full-upgrade
    name: "Package updates full upgrade"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [updates, apt-full-upgrade, rolling-release]
  - id: cpu-microcode-and-firmware-updates
    name: "Cpu microcode and firmware updates"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [microcode, firmware, intel-microcode]
  - id: proxmox-boot-tool-esp-sync
    name: "Proxmox boot tool esp sync"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [proxmox-boot-tool, esp, systemd-boot]
  - id: kernel-cmdline-and-kernel-pinning
    name: "Kernel cmdline and kernel pinning"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [kernel-pin, cmdline, grub-cmdline]
  - id: apply-network-changes-ifupdown2
    name: "Apply network changes ifupdown2"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [ifupdown2, ifreload, interfaces-new]
  - id: linux-bridge-default-vmbr0
    name: "Linux bridge default vmbr0"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [bridge, vmbr0, bridge-ports]
  - id: linux-bond-modes-lacp
    name: "Linux bond modes lacp"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [bond, lacp, 802-3ad]
  - id: vlan-aware-bridge-and-host-vlan
    name: "Vlan aware bridge and host vlan"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [vlan, bridge-vlan-aware, bridge-vids]
  - id: pin-network-interface-names
    name: "Pin network interface names"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [nic-naming, pve-network-interface-pinning, link-file]
  - id: time-sync-chrony
    name: "Time sync chrony"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [ntp, chrony, time-sync]
  - id: external-metric-server
    name: "External metric server"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [metrics, influxdb, graphite]
  - id: disk-health-smartd
    name: "Disk health smartd"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [smart, smartctl, smartd]
  - id: lvm-thin-pools
    name: "Lvm thin pools"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [lvm-thin, thin-pool, vgcreate]
  - id: zfs-create-pools-and-vdevs
    name: "Zfs create pools and vdevs"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [zfs, zpool-create, ashift]
  - id: zfs-raid-level-selection
    name: "Zfs raid level selection"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [raid-level, volblocksize, raidz-padding]
  - id: zfs-replace-failed-disk
    name: "Zfs replace failed disk"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [zpool-replace, resilver, sgdisk]
  - id: zfs-arc-limit-and-zed-mail
    name: "Zfs arc limit and zed mail"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [zfs-arc-max, arc, zed]
  - id: certificates-and-acme-pvenode
    name: "Certificates and acme pvenode"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [certificates, acme, lets-encrypt]
  - id: disable-ksm-memory-merging
    name: "Disable ksm memory merging"
    source: "https://pve.proxmox.com/pve-docs/chapter-sysadmin.html"
    match: [ksm, ksmtuned, allow-ksm]
  - id: cluster-create-with-pvecm
    name: "Cluster create with pvecm"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvecm.html"
    match: [cluster, pvecm-create, cluster-name]
  - id: cluster-join-node
    name: "Cluster join node"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvecm.html"
    match: [pvecm-add, join-cluster, join-information]
  - id: cluster-remove-node
    name: "Cluster remove node"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvecm.html"
    match: [delnode, remove-node, pvecm-delnode]
  - id: qdevice-external-vote
    name: "Qdevice external vote"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvecm.html"
    match: [qdevice, qnetd, corosync-qdevice]
  - id: corosync-conf-editing-and-token
    name: "Corosync conf editing and token"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvecm.html"
    match: [corosync-conf, config-version, token-coefficient]
  - id: cluster-migration-network-and-type
    name: "Cluster migration network and type"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvecm.html"
    match: [migration-network, migration-type, insecure-migration]
  - id: vm-create-and-manage-with-qm
    name: "Vm create and manage with qm"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [qm, qm-create, vmid]
  - id: vm-disk-bus-cache-discard-iothread
    name: "Vm disk bus cache discard iothread"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [disk, virtio-scsi-single, iothread]
  - id: vm-cpu-type-and-resource-limits
    name: "Vm cpu type and resource limits"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [cpu-type, cpulimit, cpuunits]
  - id: vm-numa-and-vcpu-hotplug
    name: "Vm numa and vcpu hotplug"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [numa, hotplug, vcpus]
  - id: vm-memory-ballooning
    name: "Vm memory ballooning"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [ballooning, balloon, memory]
  - id: vm-network-device-virtio-multiqueue
    name: "Vm network device virtio multiqueue"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [net0, virtio-net, multiqueue]
  - id: vm-machine-type-and-versions
    name: "Vm machine type and versions"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [machine-type, q35, ovmf]
  - id: vm-boot-order-and-autostart
    name: "Vm boot order and autostart"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [onboot, boot-order, startup-order]
  - id: qemu-guest-agent-setup
    name: "Qemu guest agent setup"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [qemu-guest-agent, qga, fsfreeze]
  - id: vm-live-migration-requirements
    name: "Vm live migration requirements"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [live-migration, qm-migrate, online-migration]
  - id: vm-clone-and-template
    name: "Vm clone and template"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [clone, template, linked-clone]
  - id: vm-cloud-init-templates
    name: "Vm cloud init templates"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [cloud-init, cloudinit, ipconfig0]
  - id: vm-pci-passthrough-iommu
    name: "Vm pci passthrough iommu"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [pci-passthrough, iommu, vfio]
  - id: resource-mappings-cluster-devices
    name: "Resource mappings cluster devices"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [resource-mapping, mapping-pci, mapping-usb]
  - id: vm-snapshots-and-hibernate
    name: "Vm snapshots and hibernate"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [snapshot, rollback, vmstate]
  - id: vm-disk-move-resize-import
    name: "Vm disk move resize import"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [qm-disk-move, qm-disk-resize, import-from]
  - id: vm-import-from-esxi-and-ovf
    name: "Vm import from esxi and ovf"
    source: "https://pve.proxmox.com/pve-docs/chapter-qm.html"
    match: [esxi-import, ova, ovf]
  - id: ct-templates-with-pveam
    name: "Ct templates with pveam"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, pveam, container-template]
  - id: ct-unprivileged-vs-privileged
    name: "Ct unprivileged vs privileged"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, unprivileged, user-namespaces]
  - id: ct-mount-points-and-bind-mounts
    name: "Ct mount points and bind mounts"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, mount-point, bind-mount]
  - id: ct-restore-simple-vs-advanced
    name: "Ct restore simple vs advanced"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, pct-restore, vzdump-archive]
  - id: ct-cli-day-to-day-pct
    name: "Ct cli day to day pct"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, pct, pct-set]
  - id: ct-debug-start-failures
    name: "Ct debug start failures"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, lxc-start, debug-log]
  - id: ct-migrate-restart-mode
    name: "Ct migrate restart mode"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, pct-migrate, restart-migration]
  - id: ct-autostart-order-and-hookscripts
    name: "Ct autostart order and hookscripts"
    source: "https://pve.proxmox.com/pve-docs/chapter-pct.html"
    match: [lxc, startup-order, onboot]
  - id: vzdump-modes-retention-and-jobs
    name: "Vzdump modes retention and jobs"
    source: "https://pve.proxmox.com/pve-docs/vzdump.1.html"
    match: [vzdump, backup-modes, prune-backups]
  - id: firewall-enable-and-rules
    name: "Firewall enable and rules"
    source: "https://pve.proxmox.com/pve-docs/chapter-pve-firewall.html"
    match: [firewall, pve-firewall, cluster-fw]
  - id: ha-manager-basics-and-watchdog
    name: "Ha manager basics and watchdog"
    source: "https://pve.proxmox.com/pve-docs/chapter-ha-manager.html"
    match: [ha-manager, ha-resource, watchdog]
  - id: api-tokens-privilege-separation
    name: "Api tokens privilege separation"
    source: "https://pve.proxmox.com/pve-docs/chapter-pveum.html"
    match: [api-token, pveum, privsep]
  - id: access-roles-acls-and-pools
    name: "Access roles acls and pools"
    source: "https://pve.proxmox.com/pve-docs/chapter-pveum.html"
    match: [pveum, acl, roles]
  - id: storage-replication-pvesr
    name: "Storage replication pvesr"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvesr.html"
    match: [pvesr, storage-replication, zfs-replication]
  - id: sdn-zones-and-vnets
    name: "Sdn zones and vnets"
    source: "https://pve.proxmox.com/pve-docs/chapter-pvesdn.html"
    match: [sdn, vnet, vlan-zone]
  - id: notification-targets-and-matchers
    name: "Notification targets and matchers"
    source: "https://pve.proxmox.com/pve-docs/chapter-notifications.html"
    match: [notifications, matcher, sendmail]
