# Canonical coverage spec: Web development (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (MDN Learn and reference tables of contents,
# web.dev Learn courses, WCAG 2.2 success criteria, OWASP Top 10 2021 / ASVS 4, and each
# framework's official documentation ToC), not from what the library already has.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (MDN page headings,
# web.dev module lists, WCAG guideline -> success criteria, OWASP category -> CWE groups / ASVS
# requirement sections, framework guide chapter sub-headings).
# NOTE: never use a bare product or path word (react, vue, django, web, development) as a match
# keyword - the id/name whole-word rule would make it hit every skill in the field.
subject: web-development
scope:
  category: computing-software
  field: web-development
  products: [react, nextjs, vue, django, rails, node-express, wordpress, tailwind-css, frontend-development, web-accessibility, web-performance, responsive-design]
sources:
  - "MDN Learn web development + HTML reference ToC (developer.mozilla.org/docs/Web/HTML) - document structure and metadata, content sectioning, text content, tables, forms and constraint validation, multimedia and embedding, responsive images, iframes"
  - "MDN CSS reference and guides ToC (developer.mozilla.org/docs/Web/CSS) - cascade/specificity/layers, box model, flexbox, grid, positioning and stacking context, custom properties, fonts and text, colour, transitions/animations, selectors and nesting, media and container queries, logical properties"
  - "MDN JavaScript Guide + reference (developer.mozilla.org/docs/Web/JavaScript) - modules, classes and prototypes, iterators/generators, keyed and indexed collections, promises/async, error handling, Intl"
  - "MDN Web APIs index (developer.mozilla.org/docs/Web/API) - DOM, Fetch, Streams, WebSocket, Server-sent events, Web Storage, IndexedDB, Cache, Web Workers, Service Worker, Push, Notifications, Canvas, Web Animations, History/Navigation, Intersection/Resize/Mutation observers, Web Components (custom elements, shadow DOM, templates), Clipboard, Geolocation, Media Capture, Permissions, Web Share"
  - "web.dev Learn courses (web.dev/learn) - Learn Performance (critical path, resource hints, images, fonts, JavaScript, code splitting, lazy loading, prefetch/prerender, web workers), Learn Accessibility, Learn PWA (manifest, service workers, caching, offline, installation, updates, Workbox), Learn Forms, Learn CSS, Learn Responsive Design, Core Web Vitals articles (LCP, INP, CLS, TTFB) and measurement (RUM, CrUX, Lighthouse)"
  - "WCAG 2.2 (w3.org/TR/WCAG22) - principles, guidelines 1.1-4.1 and every success criterion incl. 2.2 additions (2.4.11 focus not obscured, 2.5.7 dragging movements, 2.5.8 target size minimum, 3.2.6 consistent help, 3.3.7 redundant entry, 3.3.8 accessible authentication); WAI-ARIA Authoring Practices Guide patterns"
  - "OWASP Top 10 2021 (A01-A10) and OWASP ASVS 4.0.3 chapters (V2 authentication, V3 session management, V4 access control, V5 validation/sanitisation/encoding, V12 files, V13 API, V14 configuration); OWASP Cheat Sheet Series (XSS, CSRF, CSP, SSRF, injection, HTTP headers)"
  - "React docs ToC (react.dev/learn and react.dev/reference) - Describing the UI, Adding interactivity, Managing state, Escape hatches; hooks/components/APIs reference, react-dom APIs, Server Components and Actions, Rules of React"
  - "Next.js App Router docs ToC (nextjs.org/docs/app) - routing (layouts, dynamic, groups, parallel/intercepting, loading/error), data fetching and caching, server actions, rendering (server/client components, streaming, PPR), route handlers, middleware, optimisation (images, fonts, scripts, metadata), authentication, deploying/self-hosting, configuration, testing, instrumentation"
  - "Vue guide ToC (vuejs.org/guide) - Essentials, Components in-depth, Reusability, Built-in components, Scaling up (SFC, tooling, routing, state, testing, SSR), Best practices, TypeScript; Pinia and Vue Router docs; Nuxt docs"
  - "Django documentation ToC (docs.djangoproject.com) - models/migrations/querysets, URL dispatcher, views and CBVs, templates, forms, admin, auth, middleware, sessions, caching, signals, testing, i18n, async, static files, deployment checklist, management commands, file storage; Django REST framework API guide"
  - "Ruby on Rails Guides ToC (guides.rubyonrails.org) - Active Record basics/migrations/validations/callbacks/associations/querying, Action Controller, routing, Action View and form helpers, Active Job, Action Mailer, Active Storage, Action Cable, caching, security, testing, asset pipeline, credentials, upgrading, API-only apps; Hotwire (Turbo, Stimulus) handbooks; Kamal docs"
  - "Node.js docs (nodejs.org/api, nodejs.org/learn) and Express guide ToC (expressjs.com) - routing, middleware, error handling, template engines, static files, behind proxies, production best practices (performance, security); Node modules (ESM/CJS), fs, streams, process/child_process, worker_threads, cluster, test runner, debugging/diagnostics"
  - "WordPress developer handbooks (developer.wordpress.org) - Theme Handbook (template hierarchy, block themes, theme.json, classic themes), Plugin Handbook (hooks, settings API, shortcodes, cron, security, i18n), Block Editor Handbook (block.json, create-block, dynamic blocks, InnerBlocks, patterns, Interactivity API), REST API Handbook, Common APIs (WP_Query, metadata, options, transients), WP-CLI, multisite"
  - "Tailwind CSS docs ToC (tailwindcss.com/docs) - installation, utility-first core concepts, hover/focus and other states, responsive design, dark mode, theme variables and @theme, adding custom styles, functions and directives, detecting classes in source files, upgrade guide v3 to v4"
