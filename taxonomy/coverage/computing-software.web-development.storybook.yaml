# Coverage spec: storybook. Topics from the official Storybook docs table of contents.
subject: storybook
scope:
  category: computing-software
  field: web-development
  products: [storybook]
sources:
  - "Storybook docs (storybook.js.org/docs) Get started, Writing stories, Writing docs, Writing tests, Essentials, Addons, Configure, Builders, Sharing, API"
topics:
  - id: install-storybook
    name: "Install storybook"
    source: "https://storybook.js.org/docs/get-started/install"
    match: [install, create-storybook, setup, cli, getting-started]
  - id: cli-dev-and-build
    name: "Cli dev and build"
    source: "https://storybook.js.org/docs/api/cli-options"
    match: [cli, storybook-dev, storybook-build, port, flags]
  - id: csf-4-overview
    name: "Csf 4 overview"
    source: "https://storybook.js.org/docs/writing-stories/csf"
    match: [csf, csf4, component-story-format, preview-file, story-files]
  - id: csf-define-preview-and-main
    name: "Csf define preview and main"
    source: "https://storybook.js.org/docs/writing-stories/csf/api"
    match: [definepreview, definemain, preview-config, addon-types, csf]
  - id: csf-meta-and-story-functions
    name: "Csf meta and story functions"
    source: "https://storybook.js.org/docs/writing-stories/csf/api"
    match: [meta-story, preview-meta, meta-type, story-function, csf-api]
  - id: csf-story-extend
    name: "Csf story extend"
    source: "https://storybook.js.org/docs/writing-stories/csf/api"
    match: [story-extend, extend, story-reuse, annotations-merge, csf]
  - id: csf-story-names-and-exports
    name: "Csf story names and exports"
    source: "https://storybook.js.org/docs/writing-stories/csf"
    match: [story-names, start-case, includestories, excludestories, non-story-exports]
  - id: custom-render-functions
    name: "Custom render functions"
    source: "https://storybook.js.org/docs/writing-stories/csf"
    match: [render, custom-render, render-function, args-render, csf]
  - id: typescript-stories
    name: "Typescript stories"
    source: "https://storybook.js.org/docs/writing-stories/typescript"
    match: [typescript, meta-storyobj, satisfies, typed-args, csf3-types]
  - id: args-levels
    name: "Args levels"
    source: "https://storybook.js.org/docs/writing-stories/args"
    match: [args, story-args, component-args, global-args, arg-reuse]
  - id: args-url-and-mapping
    name: "Args url and mapping"
    source: "https://storybook.js.org/docs/writing-stories/args"
    match: [args-url, arg-mapping, argtypes-mapping, complex-args, url-args]
  - id: args-use-args-hook
    name: "Args use args hook"
    source: "https://storybook.js.org/docs/writing-stories/args"
    match: [use-args, update-args, story-state, storybook-hooks, preview-api]
  - id: argtypes-and-inference
    name: "Argtypes and inference"
    source: "https://storybook.js.org/docs/api/arg-types"
    match: [argtypes, arg-types, docgen, inference, component-meta]
  - id: decorators-basics
    name: "Decorators basics"
    source: "https://storybook.js.org/docs/writing-stories/decorators"
    match: [decorators, decorator, story-wrapper, context-provider, wrap-story]
  - id: decorator-context-and-order
    name: "Decorator context and order"
    source: "https://storybook.js.org/docs/writing-stories/decorators"
    match: [decorator-context, story-context, decorator-order, globals-in-decorators, hooks]
  - id: parameters-and-inheritance
    name: "Parameters and inheritance"
    source: "https://storybook.js.org/docs/writing-stories/parameters"
    match: [parameters, parameter-inheritance, story-parameters, global-parameters, metadata]
  - id: loaders
    name: "Loaders"
    source: "https://storybook.js.org/docs/writing-stories/loaders"
    match: [loaders, async-data, loaded-context, global-loaders, loader-order]
  - id: tags-built-in-and-custom
    name: "Tags built in and custom"
    source: "https://storybook.js.org/docs/writing-stories/tags"
    match: [tags, built-in-tags, custom-tags, dev-tag, test-tag]
  - id: tags-hide-and-filter
    name: "Tags hide and filter"
    source: "https://storybook.js.org/docs/writing-stories/tags"
    match: [tags-hidefromsidebar, sidebar-filter, hide-stories, internal-stories, setfilter]
  - id: play-function-basics
    name: "Play function basics"
    source: "https://storybook.js.org/docs/writing-stories/play-function"
    match: [play-function, play, canvas, screen, story-interaction]
  - id: play-mount-and-before-each
    name: "Play mount and before each"
    source: "https://storybook.js.org/docs/writing-tests/interaction-testing"
    match: [mount, beforeeach, play-mount, mock-date, cleanup]
  - id: naming-hierarchy-and-sorting
    name: "Naming hierarchy and sorting"
    source: "https://storybook.js.org/docs/writing-stories/naming-components-and-hierarchy"
    match: [story-title, hierarchy, sorting, storysort, sidebar-order]
  - id: stories-for-multiple-components
    name: "Stories for multiple components"
    source: "https://storybook.js.org/docs/writing-stories/stories-for-multiple-components"
    match: [subcomponents, multiple-components, template-component, children-arg, composite-stories]
  - id: mocking-modules-sb-mock
    name: "Mocking modules sb mock"
    source: "https://storybook.js.org/docs/writing-stories/mocking-data-and-modules/mocking-modules"
    match: [sb-mock, automock, mock-modules, spy-only, module-mocking]
  - id: mocking-network-msw
    name: "Mocking network msw"
    source: "https://storybook.js.org/docs/writing-stories/mocking-data-and-modules/mocking-network-requests"
    match: [msw, mock-service-worker, network-mocking, rest-mocking, graphql-mocking]
  - id: mocking-providers
    name: "Mocking providers"
    source: "https://storybook.js.org/docs/writing-stories/mocking-data-and-modules/mocking-providers"
    match: [mock-provider, context-provider, theme-provider, redux-provider, decorator-provider]
  - id: controls-types
    name: "Controls types"
    source: "https://storybook.js.org/docs/essentials/controls"
    match: [controls, control-types, argtypes-control, radio, select]
  - id: controls-configuration
    name: "Controls configuration"
    source: "https://storybook.js.org/docs/essentials/controls"
    match: [controls-parameters, include-exclude, sort-controls, expanded, disable-control]
  - id: controls-conditional
    name: "Controls conditional"
    source: "https://storybook.js.org/docs/essentials/controls"
    match: [conditional-controls, control-if, argtypes-if, arg-visibility, controls-query]
  - id: actions-fn-spies
    name: "Actions fn spies"
    source: "https://storybook.js.org/docs/essentials/actions"
    match: [actions, fn-spy, action-panel, event-handlers, argtypesregex]
  - id: viewport-configuration
    name: "Viewport configuration"
    source: "https://storybook.js.org/docs/essentials/viewport"
    match: [viewport, responsive, initial-viewports, minimal-viewports, viewport-globals]
  - id: backgrounds-and-grid
    name: "Backgrounds and grid"
    source: "https://storybook.js.org/docs/essentials/backgrounds"
    match: [backgrounds, background-colors, grid, backgrounds-globals, canvas-background]
  - id: globals-and-toolbars
    name: "Globals and toolbars"
    source: "https://storybook.js.org/docs/essentials/toolbars-and-globals"
    match: [globals, globaltypes, toolbar, initialglobals, theme-switcher]
  - id: interaction-testing-queries
    name: "Interaction testing queries"
    source: "https://storybook.js.org/docs/writing-tests/interaction-testing"
    match: [interaction-testing, testing-library, canvas-queries, getbyrole, findby]
  - id: interaction-user-event-expect
    name: "Interaction user event expect"
    source: "https://storybook.js.org/docs/writing-tests/interaction-testing"
    match: [userevent, expect-assertions, jest-dom, fn-spy, interactions-panel]
  - id: vitest-addon-setup
    name: "Vitest addon setup"
    source: "https://storybook.js.org/docs/writing-tests/integrations/vitest-addon"
    match: [vitest-addon, storybook-test, browser-mode, playwright, component-tests]
  - id: vitest-addon-options
    name: "Vitest addon options"
    source: "https://storybook.js.org/docs/writing-tests/integrations/vitest-addon"
    match: [storybooktest-plugin, vitest-config, test-tags, configdir, storybookurl]
  - id: tests-in-ci
    name: "Tests in ci"
    source: "https://storybook.js.org/docs/writing-tests/in-ci"
    match: [ci, github-actions, test-storybook-script, playwright-image, continuous-integration]
  - id: a11y-addon-setup
    name: "A11y addon setup"
    source: "https://storybook.js.org/docs/writing-tests/accessibility-testing"
    match: [accessibility, a11y, axe-core, a11y-addon, wcag]
  - id: a11y-test-behavior
    name: "A11y test behavior"
    source: "https://storybook.js.org/docs/writing-tests/accessibility-testing"
    match: [a11y-test, todo-mode, accessibility-ci, vitest-a11y, violations]
  - id: visual-testing-chromatic
    name: "Visual testing chromatic"
    source: "https://storybook.js.org/docs/writing-tests/visual-testing"
    match: [visual-testing, chromatic, baselines, ui-review, visual-regression]
  - id: snapshot-portable-stories
    name: "Snapshot portable stories"
    source: "https://storybook.js.org/docs/writing-tests/snapshot-testing"
    match: [portable-stories, composestories, snapshot-testing, setprojectannotations, vitest-snapshots]
  - id: stories-in-unit-tests
    name: "Stories in unit tests"
    source: "https://storybook.js.org/docs/writing-tests/integrations/stories-in-unit-tests"
    match: [composestory, unit-tests, testing-library, story-reuse, portable-stories-vitest]
  - id: test-coverage
    name: "Test coverage"
    source: "https://storybook.js.org/docs/writing-tests/test-coverage"
    match: [coverage, vitest-coverage, istanbul, v8-coverage, test-coverage]
  - id: autodocs-setup
    name: "Autodocs setup"
    source: "https://storybook.js.org/docs/writing-docs/autodocs"
    match: [autodocs, docs-page, auto-generated-docs, docs-tag, documentation]
  - id: autodocs-custom-template
    name: "Autodocs custom template"
    source: "https://storybook.js.org/docs/writing-docs/autodocs"
    match: [docs-template, custom-docs-page, docs-container, toc, doc-blocks-template]
  - id: mdx-documentation
    name: "Mdx documentation"
    source: "https://storybook.js.org/docs/writing-docs/mdx"
    match: [mdx, mdx-docs, meta-of, docs-blocks, documentation-pages]
  - id: doc-blocks-reference
    name: "Doc blocks reference"
    source: "https://storybook.js.org/docs/writing-docs/doc-blocks"
    match: [doc-blocks, canvas-block, controls-block, source-block, argtypes-block]
  - id: docs-mode-and-code-panel
    name: "Docs mode and code panel"
    source: "https://storybook.js.org/docs/writing-docs/build-documentation"
    match: [docs-mode, code-panel, storysource, source-code, publish-docs]
  - id: main-config-overview
    name: "Main config overview"
    source: "https://storybook.js.org/docs/configure"
    match: [main-config, main-js, storybook-config, config-dir, presets]
  - id: main-config-stories
    name: "Main config stories"
    source: "https://storybook.js.org/docs/api/main-config/main-config-stories"
    match: [stories-glob, storiesspecifier, titleprefix, story-loading, picomatch]
  - id: main-config-features-and-build
    name: "Main config features and build"
    source: "https://storybook.js.org/docs/api/main-config/main-config-features"
    match: [features-flags, build-test, disabledaddons, production-build, feature-toggles]
  - id: main-config-core-security
    name: "Main config core security"
    source: "https://storybook.js.org/docs/api/main-config/main-config-core"
    match: [allowedhosts, core-config, security, insecureiframemessaging, telemetry]
  - id: environment-variables
    name: "Environment variables"
    source: "https://storybook.js.org/docs/configure/environment-variables"
    match: [env-vars, storybook-prefix, dotenv, import-meta-env, process-env]
  - id: styling-and-preview-head
    name: "Styling and preview head"
    source: "https://storybook.js.org/docs/configure/styling-and-css"
    match: [css, global-styles, preview-head, preview-body, css-modules]
  - id: builder-vite
    name: "Builder vite"
    source: "https://storybook.js.org/docs/builders/vite"
    match: [vite-builder, viteconfig, vitefinal, vite-config-path, builder-options]
  - id: builder-webpack
    name: "Builder webpack"
    source: "https://storybook.js.org/docs/builders/webpack"
    match: [webpack-builder, webpackfinal, lazy-compilation, fscache, swc]
  - id: publish-storybook
    name: "Publish storybook"
    source: "https://storybook.js.org/docs/sharing/publish-storybook"
    match: [publish, static-build, storybook-static, chromatic-publish, deploy]
  - id: storybook-composition
    name: "Storybook composition"
    source: "https://storybook.js.org/docs/sharing/storybook-composition"
    match: [composition, refs, composed-storybooks, package-composition, multi-storybook]
  - id: ui-config-and-theming
    name: "Ui config and theming"
    source: "https://storybook.js.org/docs/configure/user-interface/theming"
    match: [manager-config, addons-setconfig, theming, brandimage, sidebar-config]
  - id: writing-addons
    name: "Writing addons"
    source: "https://storybook.js.org/docs/addons/writing-addons"
    match: [addon-development, addon-kit, toolbar-addon, panel-addon, manager-api]
  - id: addon-presets-and-install
    name: "Addon presets and install"
    source: "https://storybook.js.org/docs/addons/writing-presets"
    match: [presets, addon-presets, managerentries, previewannotations, install-addons]
