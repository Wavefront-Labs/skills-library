    source: "Core/Objects"
    match: [ray-memory]
  - id: ray-wait-pipelining
    name: "ray.wait pipelining"
    source: "Core/Patterns"
    match: [ray-wait]
  - id: scheduling-strategies
    name: "Scheduling strategies"
    source: "Core/Scheduling"
    match: [node-affinity]
  - id: placement-groups
    name: "Placement groups"
    source: "Core/Scheduling"
    match: [placement-group]
  - id: runtime-environments
    name: "Runtime environments"
    source: "Core/Handling dependencies"
    match: [runtime-env]
  - id: custom-resources
    name: "Custom resources"
    source: "Core/Resources"
    match: [custom-resources]
  - id: streaming-generators
    name: "Streaming generators"
    source: "Core/Generators"
    match: [streaming-generator]
