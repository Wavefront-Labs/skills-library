# Coverage spec: ray. Topics from the external structures in sources.
subject: ray
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [ray]
sources:
  - "Ray docs ToC (docs.ray.io/en/latest) - Core, Data, Train, Tune, Serve, RLlib"
  - "Ray docs Clusters, KubeRay and Observability ToC"
topics:
  - id: ray-init-and-connect
    name: "ray.init and cluster connect"
    source: "Core/Starting Ray"
    match: [ray-init]
  - id: remote-tasks
    name: "Remote tasks"
    source: "Core/Tasks"
    match: [ray-remote]
  - id: task-resource-options
    name: "Task resource options"
    source: "Core/Resources"
    match: [num-gpus]
  - id: task-retries
    name: "Task fault tolerance"
    source: "Core/Fault tolerance"
    match: [max-retries]
  - id: actors
    name: "Actors"
    source: "Core/Actors"
    match: [ray-actor]
  - id: named-and-detached-actors
    name: "Named and detached actors"
    source: "Core/Actors"
    match: [detached-actor]
  - id: actor-restarts
    name: "Actor fault tolerance"
    source: "Core/Fault tolerance"
    match: [max-restarts]
  - id: async-and-threaded-actors
    name: "Async and threaded actors"
    source: "Core/Actors"
    match: [async-actor]
  - id: object-store-put-get
    name: "Object store put and get"
    source: "Core/Objects"
    match: [ray-put]
