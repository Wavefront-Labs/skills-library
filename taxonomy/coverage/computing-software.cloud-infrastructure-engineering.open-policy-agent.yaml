# Coverage spec: open-policy-agent. Topics from the official documentation pages in sources.
subject: open-policy-agent
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [open-policy-agent]
sources:
  - "https://www.openpolicyagent.org/docs/"
topics:
  - id: building-bundles-with-opa-build
    name: "Building bundles with opa build"
    source: "https://www.openpolicyagent.org/docs/management-bundles"
    match: [opa-build, bundles, optimize]
  - id: bundle-etag-caching-and-long-polling
    name: "Bundle etag caching and long polling"
    source: "https://www.openpolicyagent.org/docs/management-bundles"
    match: [etag, if-none-match, long-polling]
  - id: bundle-service-configuration
    name: "Bundle service configuration"
    source: "https://www.openpolicyagent.org/docs/management-bundles"
    match: [bundles, bundle-service, persist]
  - id: ci-pull-request-check-policies
    name: "Ci pull request check policies"
    source: "https://www.openpolicyagent.org/docs/cicd/pr-checks"
    match: [ci-cd, github-actions, pull-request]
  - id: compiling-policies-to-wasm
    name: "Compiling policies to wasm"
    source: "https://www.openpolicyagent.org/docs/wasm"
    match: [wasm, webassembly, opa-build]
  - id: config-env-vars-and-set-overrides
    name: "Config env vars and set overrides"
    source: "https://www.openpolicyagent.org/docs/configuration"
    match: [configuration, set-file, environment-variables]
  - id: data-api-policy-queries
    name: "Data api policy queries"
    source: "https://www.openpolicyagent.org/docs/rest-api"
    match: [rest-api, data-api, v1-data]
  - id: data-driven-test-cases
    name: "Data driven test cases"
    source: "https://www.openpolicyagent.org/docs/policy-testing"
    match: [parameterized-tests, table-tests, test-cases]
  - id: data-filtering-with-partial-evaluation
    name: "Data filtering with partial evaluation"
    source: "https://www.openpolicyagent.org/docs/filtering"
    match: [data-filtering, partial-evaluation, unknowns]
  - id: decision-log-masking-policy
    name: "Decision log masking policy"
    source: "https://www.openpolicyagent.org/docs/management-decision-logs"
    match: [decision-logs, masking, data-system-log-mask]
  - id: decision-log-service-and-fields
    name: "Decision log service and fields"
    source: "https://www.openpolicyagent.org/docs/management-decision-logs"
    match: [decision-logs, audit, upload-size-limit-bytes]
  - id: discovery-bundles
    name: "Discovery bundles"
    source: "https://www.openpolicyagent.org/docs/management-discovery"
    match: [discovery, discovery-bundle, boot-configuration]
  - id: envoy-custom-response-controls
    name: "Envoy custom response controls"
    source: "https://www.openpolicyagent.org/docs/envoy/primer"
    match: [envoy, ext-authz, response-headers]
  - id: envoy-ext-authz-policy-writing
    name: "Envoy ext authz policy writing"
    source: "https://www.openpolicyagent.org/docs/envoy/primer"
    match: [envoy, ext-authz, jwt]
  - id: hardened-deployment-and-diagnostic-listener
    name: "Hardened deployment and diagnostic listener"
    source: "https://www.openpolicyagent.org/docs/security"
    match: [hardening, diagnostic-addr, sidecar]
  - id: http-api-authorization-with-bundles
    name: "Http api authorization with bundles"
    source: "https://www.openpolicyagent.org/docs/http-api-authorization"
    match: [http-api, authorization, bundles]
  - id: kubernetes-admission-deny-rules
    name: "Kubernetes admission deny rules"
    source: "https://www.openpolicyagent.org/docs/kubernetes/primer"
    match: [kubernetes, admission-control, kube-mgmt]
  - id: linear-fragment-and-data-shapes
    name: "Linear fragment and data shapes"
    source: "https://www.openpolicyagent.org/docs/policy-performance"
    match: [performance, linear-fragment, objects-over-arrays]
  - id: mocking-data-and-functions-with-with
    name: "Mocking data and functions with with"
    source: "https://www.openpolicyagent.org/docs/policy-testing"
    match: [mocking, with-keyword, stubs]
  - id: multiple-bundles-and-roots
    name: "Multiple bundles and roots"
    source: "https://www.openpolicyagent.org/docs/management-bundles"
    match: [bundles, roots, manifest]
  - id: policy-api-and-health-checks
    name: "Policy api and health checks"
    source: "https://www.openpolicyagent.org/docs/rest-api"
    match: [rest-api, policy-api, health-api]
  - id: policy-test-basics
    name: "Policy test basics"
    source: "https://www.openpolicyagent.org/docs/policy-testing"
    match: [opa-test, rego-tests, test-prefix]
  - id: print-and-repl-debugging
    name: "Print and repl debugging"
    source: "https://www.openpolicyagent.org/docs/debugging"
    match: [debugging, repl, print-builtin]
  - id: profiling-with-opa-eval
    name: "Profiling with opa eval"
    source: "https://www.openpolicyagent.org/docs/policy-performance"
    match: [profiling, opa-eval, profile-sort]
  - id: prometheus-metrics-and-tracing
    name: "Prometheus metrics and tracing"
    source: "https://www.openpolicyagent.org/docs/monitoring"
    match: [prometheus, metrics, opentelemetry]
  - id: rego-comprehensions
    name: "Rego comprehensions"
    source: "https://www.openpolicyagent.org/docs/policy-language"
    match: [rego, comprehensions, array-comprehension]
  - id: rego-default-keyword
    name: "Rego default keyword"
    source: "https://www.openpolicyagent.org/docs/policy-language"
    match: [rego, default, deny-by-default]
  - id: rego-else-keyword
    name: "Rego else keyword"
    source: "https://www.openpolicyagent.org/docs/policy-language"
    match: [rego, else, rule-ordering]
  - id: rego-error-tracebacks
    name: "Rego error tracebacks"
    source: "https://www.openpolicyagent.org/docs/debugging"
    match: [debugging, traceback, strict-builtin-errors]
  - id: rego-functions
    name: "Rego functions"
    source: "https://www.openpolicyagent.org/docs/policy-language"
    match: [rego, functions, user-defined-functions]
  - id: rego-iteration-with-some-and-every
    name: "Rego iteration with some and every"
    source: "https://www.openpolicyagent.org/docs/cheatsheet"
    match: [rego, some, every]
  - id: rego-logical-and-or
    name: "Rego logical and or"
    source: "https://www.openpolicyagent.org/docs/cheatsheet"
    match: [rego, logical-and, logical-or]
  - id: rego-rule-types
    name: "Rego rule types"
    source: "https://www.openpolicyagent.org/docs/policy-language"
    match: [rego, rules, partial-set]
  - id: rego-with-keyword
    name: "Rego with keyword"
    source: "https://www.openpolicyagent.org/docs/policy-language"
    match: [rego, with, what-if-queries]
  - id: rule-indexing-statement-forms
    name: "Rule indexing statement forms"
    source: "https://www.openpolicyagent.org/docs/policy-performance"
    match: [rule-indexing, performance, glob-match]
  - id: server-authn-and-authz
    name: "Server authn and authz"
    source: "https://www.openpolicyagent.org/docs/security"
    match: [authentication, authorization, bearer-token]
  - id: server-tls-and-interface-binding
    name: "Server tls and interface binding"
    source: "https://www.openpolicyagent.org/docs/security"
    match: [tls, https, opa-run]
  - id: status-prometheus-metrics
    name: "Status prometheus metrics"
    source: "https://www.openpolicyagent.org/docs/monitoring"
    match: [prometheus, bundle-metrics, decision-log-metrics]
  - id: status-reporting-api
    name: "Status reporting api"
    source: "https://www.openpolicyagent.org/docs/management-status"
    match: [status-api, status-plugin, bundle-status]
  - id: terraform-plan-blast-radius-policy
    name: "Terraform plan blast radius policy"
    source: "https://www.openpolicyagent.org/docs/terraform"
    match: [terraform, plan-json, opa-exec]
  - id: test-coverage-reports
    name: "Test coverage reports"
    source: "https://www.openpolicyagent.org/docs/policy-testing"
    match: [coverage, opa-test, not-covered]
  - id: test-failure-diagnosis-flags
    name: "Test failure diagnosis flags"
    source: "https://www.openpolicyagent.org/docs/policy-testing"
    match: [var-values, fail-on-empty, opa-test]
  - id: watch-config-live-reload
    name: "Watch config live reload"
    source: "https://www.openpolicyagent.org/docs/configuration"
    match: [watch-config, reload, configuration]
