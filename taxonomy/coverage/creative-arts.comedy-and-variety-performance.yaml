# Canonical coverage spec: comedy and variety performance (all products in the field).
# Checked by tools/coverage_check.py. A topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from the stand-up, sketch, burlesque/cabaret, drag and ventriloquism
# instructional canon and training curricula listed in `sources`, not from the library.
# Clowning as a discipline lives in creative-arts.circus-arts (clowning product); improv scene
# work lives in creative-arts.theatre (improv product); sitcom script format lives in film-live-action.
subject: comedy-and-variety-performance
scope:
  category: creative-arts
  field: comedy-and-variety-performance
  products: [stand-up-set-construction, stand-up-performance, sketch-comedy, drag-performance, cabaret-and-variety, ventriloquism, mc-and-hosting]
sources:
  - "Greg Dean, Step by Step to Stand-Up Comedy (2000) - joke structure (setup, target assumption, connector, reinterpretation, punch), joke prospecting, performing, the laugh"
  - "Judy Carter, The Comedy Bible (2001) - attitude, topics, premise, act-outs, the mix, tags, segues, the set, open mics, getting booked, corporate and clean work"
  - "Gene Perret, Comedy Writing Step by Step (1982) and Comedy Writing Workbook - switching, topical monologue writing, joke listing"
  - "Sally Holloway, The Serious Guide to Joke Writing (2010); Logan Murray, Be a Great Stand-Up (2007) - generation methods, compering, persona"
  - "Oliver Double, Getting the Joke - The Inner Workings of Stand-Up Comedy (2nd ed 2014) - persona, audience, delivery, compering, the circuit"
  - "Steve Kaplan, The Hidden Tools of Comedy (2013) - the non-hero, winning, straight line and wavy line, positive action"
  - "Besser, Roberts and Walsh, The Upright Citizens Brigade Comedy Improvisation Manual (2013) - game, base reality, heightening, exploration, peas in a pod, straight man"
  - "The Second City Training Center Comedy Writing and Sketch programmes (https://www.secondcity.com/classes) - sketch writing levels, revue writing, character, sketch for camera; Mike Sacks, Poking a Dead Frog (2014) - writers' room practice"
  - "Jo Weldon, The Burlesque Handbook (2010); Dita Von Teese, Burlesque and the Art of the Teese (2006) - persona, costume, pasties, glove and stocking peels, fans, boas, routine, stage kitten"
  - "Bob Harrington, The Cabaret Artist's Handbook (2006); David Sabella, So You Want to Sing Cabaret (NATS/Rowman 2022) - song selection, patter, arc, musical director, the room"
  - "Sasha Velour, The Big Reveal (2023); Simon Doonan, Drag - The Complete Story (2019); Halberstam and Volcano, The Drag King Book (1999) - persona, makeup, wigs, padding, lip sync, reveals, kings, hosting, pageants"
  - "Paul Winchell, Ventriloquism for Fun and Profit (1954); Douglas Houlden, Ventriloquism for Beginners (1958); Maher Studios course of ventriloquism; Vent Haven Museum resources (https://www.venthaven.org)"
  - "Edinburgh Festival Fringe Society participant resources (https://www.edfringe.com) - registering, venues, marketing, previews"
