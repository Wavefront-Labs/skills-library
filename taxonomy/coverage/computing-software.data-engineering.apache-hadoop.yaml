# Coverage spec for Apache Hadoop (computing-software / data-engineering).
subject: Apache Hadoop
scope:
  category: computing-software
  field: data-engineering
  products: [apache-hadoop]
sources:
  - "Apache Hadoop Documentation, stable (https://hadoop.apache.org/docs/stable/)"
topics:
  - id: hdfs-replica-placement
    name: "HDFS replica placement and rack-aware reads"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsDesign.html
    match: ["replica", "placement", "rack", "replication"]
  - id: hdfs-namenode-checkpoint-triggers
    name: "NameNode FsImage, EditLog and checkpoint triggers"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsUserGuide.html
    match: ["checkpoint", "fsimage", "editlog", "secondary-namenode"]
  - id: hdfs-trash
    name: "HDFS trash and skipTrash"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsDesign.html
    match: ["trash", "skiptrash", "delete"]
  - id: hdfs-safemode
    name: "HDFS Safemode"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsUserGuide.html
    match: ["safemode", "startup"]
  - id: hdfs-permissions-umask-sticky
    name: "HDFS permissions, umask and sticky bit"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsPermissionsGuide.html
    match: ["permissions", "umask", "sticky-bit", "superuser"]
  - id: hdfs-acls
    name: "HDFS ACLs"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsPermissionsGuide.html
    match: ["acl", "setfacl", "getfacl"]
  - id: hdfs-name-and-space-quotas
    name: "HDFS name and space quotas"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsQuotaAdminGuide.html
    match: ["quota", "setquota", "setspacequota"]
  - id: hdfs-storage-type-quotas
    name: "HDFS storage type quotas"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsQuotaAdminGuide.html
    match: ["storage-type", "ssd", "archive", "quota"]
  - id: hdfs-snapshot-administration
    name: "HDFS snapshot administration"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsSnapshots.html
    match: ["snapshot", "allowsnapshot", "createsnapshot"]
  - id: hdfs-snapshot-diff
    name: "HDFS snapshotDiff reports"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsSnapshots.html
    match: ["snapshotdiff", "diff-report"]
  - id: hdfs-upgrade-and-rollback
    name: "HDFS upgrade and rollback"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsUserGuide.html
    match: ["upgrade", "rollback", "finalizeupgrade", "renamereserved"]
  - id: hdfs-ha-qjm-configuration
    name: "HDFS HA with QJM configuration"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HDFSHighAvailabilityWithQJM.html
    match: ["high-availability", "qjm", "journalnode", "nameservices"]
  - id: hdfs-ha-automatic-failover-fencing
    name: "HDFS HA automatic failover and fencing"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HDFSHighAvailabilityWithQJM.html
    match: ["zkfc", "fencing", "sshfence", "failover"]
  - id: hdfs-erasure-coding-policies
    name: "HDFS erasure coding policies"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HDFSErasureCoding.html
    match: ["erasure-coding", "rs-6-3", "hdfs-ec"]
  - id: hdfs-storage-policies
    name: "HDFS storage policies and the Mover"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/ArchivalStorage.html
    match: ["storage-policy", "mover", "archival", "tiering"]
  - id: hdfs-encryption-zones
    name: "HDFS transparent encryption zones"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/TransparentEncryption.html
    match: ["encryption-zone", "kms", "edek", "crypto"]
  - id: hdfs-short-circuit-reads
    name: "HDFS short-circuit local reads"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/ShortCircuitLocalReads.html
    match: ["short-circuit", "domain-socket"]
  - id: hdfs-centralized-cache-management
    name: "HDFS centralized cache management"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/CentralizedCacheManagement.html
    match: ["cacheadmin", "cache-pool", "locked-memory"]
  - id: hdfs-viewfs-mount-tables
    name: "ViewFs mount tables"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/ViewFs.html
    match: ["viewfs", "mount-table", "federation"]
  - id: hdfs-rolling-upgrade
    name: "HDFS rolling upgrade"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsRollingUpgrade.html
    match: ["rolling-upgrade", "downgrade", "shutdowndatanode"]
  - id: hdfs-webhdfs-rest-api
    name: "WebHDFS REST API"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/WebHDFS.html
    match: ["webhdfs", "rest", "redirect"]
  - id: hdfs-datanode-decommission-maintenance
    name: "DataNode decommission and maintenance"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HdfsDataNodeAdminGuide.html
    match: ["decommission", "maintenance", "refreshnodes", "dfs-hosts"]
  - id: hdfs-disk-balancer
    name: "HDFS Disk Balancer"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/HDFSDiskbalancer.html
    match: ["diskbalancer", "intra-node"]
  - id: hdfs-extended-attributes
    name: "HDFS extended attributes"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-hdfs/ExtendedAttributes.html
    match: ["xattr", "setfattr", "getfattr"]
  - id: yarn-capacity-scheduler-queues
    name: "Capacity Scheduler queue configuration"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/CapacityScheduler.html
    match: ["capacity-scheduler", "queues", "refreshqueues"]
  - id: yarn-capacity-scheduler-preemption
    name: "Capacity Scheduler preemption and auto-created queues"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/CapacityScheduler.html
    match: ["preemption", "auto-create-queue"]
  - id: yarn-fair-scheduler-allocation-file
    name: "Fair Scheduler and allocation file"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/FairScheduler.html
    match: ["fair-scheduler", "allocation-file", "drf"]
  - id: yarn-resourcemanager-ha
    name: "ResourceManager HA"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/ResourceManagerHA.html
    match: ["resourcemanager", "ha", "rmadmin", "failover"]
  - id: yarn-node-labels
    name: "YARN node labels"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/NodeLabel.html
    match: ["node-labels", "partitions"]
  - id: yarn-resourcemanager-restart-state-store
    name: "ResourceManager restart and state store"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/ResourceManagerRestart.html
    match: ["rm-restart", "state-store", "recovery"]
  - id: yarn-docker-containers
    name: "YARN Docker containers"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/DockerContainers.html
    match: ["docker", "container-executor"]
  - id: yarn-nodemanager-cgroups-cpu
    name: "NodeManager cgroups CPU limits"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/NodeManagerCgroups.html
    match: ["cgroups", "cpu-limit"]
  - id: yarn-opportunistic-containers
    name: "Opportunistic containers"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/OpportunisticContainers.html
    match: ["opportunistic", "distributed-scheduling"]
  - id: yarn-gpu-scheduling
    name: "GPU scheduling on YARN"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/UsingGpus.html
    match: ["gpu", "nvidia", "resource-plugins"]
  - id: yarn-custom-resource-types
    name: "YARN resource model and custom resource types"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/ResourceModel.html
    match: ["resource-types", "resource-profiles"]
  - id: yarn-nodemanager-health-checks
    name: "NodeManager health checker and disk checker"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/NodeManager.html
    match: ["health-checker", "disk-health", "unhealthy"]
  - id: yarn-reservation-system-concepts
    name: "YARN ReservationSystem"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/ReservationSystem.html
    match: ["reservation", "rdl", "plan"]
  - id: yarn-federation-router-amrmproxy
    name: "YARN Federation Router and AMRMProxy"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/Federation.html
    match: ["federation", "router", "amrmproxy"]
  - id: yarn-federation-state-store-policies
    name: "YARN Federation state store and policies"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/Federation.html
    match: ["federation", "state-store", "policy-manager"]
  - id: yarn-timeline-service-v2-setup
    name: "Timeline Service v2 setup"
    source: https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/TimelineServiceV2.html
    match: ["timeline-service", "hbase", "flow-context"]
  - id: yarn-secure-container-executor
    name: "Secure YARN and LinuxContainerExecutor"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/SecureMode.html
    match: ["linuxcontainerexecutor", "banned-users", "kerberos"]
  - id: hadoop-kerberos-core-security
    name: "Secure mode core and NameNode Kerberos settings"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/SecureMode.html
    match: ["kerberos", "auth-to-local", "rpc-protection"]
  - id: hdfs-secure-datanode-sasl
    name: "Secure DataNodes: privileged ports and SASL"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/SecureMode.html
    match: ["datanode", "sasl", "jsvc", "data-transfer-protection"]
  - id: hadoop-service-level-authorization
    name: "Service-level authorization"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/ServiceLevelAuth.html
    match: ["hadoop-policy", "service-acl", "refreshserviceacl"]
  - id: hadoop-proxy-user-impersonation
    name: "Proxy users and impersonation"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/Superusers.html
    match: ["proxyuser", "impersonation", "doas"]
  - id: hadoop-rack-awareness-script
    name: "Rack awareness configuration"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/RackAwareness.html
    match: ["net-topology", "rack-awareness", "default-rack"]
  - id: hadoop-daemon-environment-hadoop-env
    name: "Daemon environment in hadoop-env.sh"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/ClusterSetup.html
    match: ["hadoop-env", "heapsize", "java-home"]
  - id: hadoop-cluster-startup-commands
    name: "Cluster startup commands and web ports"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/ClusterSetup.html
    match: ["start-dfs", "namenode-format", "workers"]
  - id: hadoop-cluster-setup-key-properties
    name: "Key site configuration properties"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/ClusterSetup.html
    match: ["core-site", "hdfs-site", "yarn-site", "mapred-site"]
  - id: hadoop-fs-rm-du-setrep
    name: "FS shell: rm, du, setrep"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/FileSystemShell.html
    match: ["fs-shell", "rm", "du", "setrep"]
  - id: hadoop-fs-put-get-merge
    name: "FS shell: put, get, cp, getmerge"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/FileSystemShell.html
    match: ["put", "get", "getmerge", "appendtofile"]
  - id: hadoop-fs-inspect-commands
    name: "FS shell: count, stat, test, find, ls"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/FileSystemShell.html
    match: ["count", "stat", "test", "find"]
  - id: mapreduce-encrypted-shuffle
    name: "MapReduce encrypted shuffle"
    source: https://hadoop.apache.org/docs/stable/hadoop-mapreduce-client/hadoop-mapreduce-client-core/EncryptedShuffle.html
    match: ["shuffle", "ssl", "keystore"]
  - id: distcp-update-overwrite-delete
    name: "DistCp update, overwrite, delete and preserve"
    source: https://hadoop.apache.org/docs/stable/hadoop-distcp/DistCp.html
    match: ["distcp", "update", "overwrite"]
  - id: distcp-performance-and-snapshot-diff
    name: "DistCp tuning and snapshot-based sync"
    source: https://hadoop.apache.org/docs/stable/hadoop-distcp/DistCp.html
    match: ["distcp", "bandwidth", "strategy", "diff"]
  - id: hadoop-metrics-key-names
    name: "Hadoop metrics key names"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/Metrics.html
    match: ["metrics", "missingblocks", "rpc-queue"]
  - id: hadoop-credential-provider-api
    name: "Credential provider API"
    source: https://hadoop.apache.org/docs/stable/hadoop-project-dist/hadoop-common/CredentialProviderAPI.html
    match: ["credential", "jceks", "secrets"]
