# Coverage spec for OpenLDAP (computing-software / systems-network-administration).
subject: OpenLDAP
scope:
  category: computing-software
  field: systems-network-administration
  products: [openldap]
sources:
  - "OpenLDAP 2.6 Administrator's Guide (https://www.openldap.org/doc/admin26/)"
  - "OpenLDAP 2.6 man pages (https://www.openldap.org/software/man.cgi)"
topics:
  - id: quick-start-cn-config
    name: "quick start with cn=config"
    source: https://www.openldap.org/doc/admin26/quickstart.html
    match: ["quick start with cn=config", "quick-start", "first-entries", "slapd-ldif"]
  - id: cn-config-structure
    name: "cn=config structure"
    source: https://www.openldap.org/doc/admin26/slapdconf2.html
    match: ["cn=config structure", "cn-config", "olcdatabase", "dynamic-modules"]
  - id: convert-slapd-conf-to-cn-config
    name: "convert slapd.conf to cn=config"
    source: https://www.openldap.org/doc/admin26/slapdconf2.html
    match: ["convert slapd.conf to cn=config", "conversion", "slapd-d", "migrate-config"]
  - id: recover-broken-cn-config
    name: "recover a broken cn=config"
    source: https://www.openldap.org/doc/admin26/slapdconf2.html
    match: ["recover a broken cn=config", "recovery", "slapmodify", "broken-config"]
  - id: slapd-conf-file-format
    name: "slapd.conf file format"
    source: https://www.openldap.org/doc/admin26/slapdconfig.html
    match: ["slapd.conf file format", "slapd-conf", "include", "deprecated-config"]
  - id: slapd-global-directives
    name: "slapd global directives"
    source: https://www.openldap.org/doc/admin26/slapdconfig.html
    match: ["slapd global directives", "global-directives", "idletimeout", "referral"]
  - id: loglevel-configuration
    name: "loglevel configuration"
    source: https://www.openldap.org/doc/admin26/slapdconfig.html
    match: ["loglevel configuration", "loglevel", "olcloglevel", "syslog"]
  - id: slapd-command-line-options
    name: "slapd command line options"
    source: https://www.openldap.org/doc/admin26/runningslapd.html
    match: ["slapd command line options", "command-line", "debug-levels", "stopping-slapd"]
  - id: slapd-listener-urls
    name: "slapd listener urls"
    source: https://www.openldap.org/doc/admin26/runningslapd.html
    match: ["slapd listener urls", "listener-urls", "ldapi", "ldaps"]
  - id: access-control-syntax
    name: "access control syntax"
    source: https://www.openldap.org/doc/admin26/access-control.html
    match: ["access control syntax", "access-control", "what-selector", "access-levels"]
  - id: access-control-who-selectors
    name: "access control who selectors"
    source: https://www.openldap.org/doc/admin26/access-control.html
    match: ["access control who selectors", "who-selectors", "peername", "dnattr"]
  - id: access-control-evaluation-order
    name: "access control evaluation order"
    source: https://www.openldap.org/doc/admin26/access-control.html
    match: ["access control evaluation order", "evaluation-order", "break", "control-keywords"]
  - id: olcaccess-dynamic-rules
    name: "olcAccess dynamic rules"
    source: https://www.openldap.org/doc/admin26/access-control.html
    match: ["olcaccess dynamic rules", "olcaccess", "rule-index", "ldapmodify-acl"]
  - id: access-control-recipes
    name: "access control recipes"
    source: https://www.openldap.org/doc/admin26/access-control.html
    match: ["access control recipes", "acl-recipes", "selfwrite", "ssf-acl"]
  - id: set-acls
    name: "set ACLs"
    source: https://www.openldap.org/doc/admin26/access-control.html
    match: ["set acls", "set-acl", "nested-groups", "this-manager"]
  - id: test-acls-with-slapacl
    name: "test ACLs with slapacl"
    source: https://www.openldap.org/software/man.cgi?query=slapacl&sektion=8&apropos=0&manpath=OpenLDAP+2.6-Release
    match: ["test acls with slapacl", "slapacl", "acl-testing", "dry-run"]
  - id: size-and-time-limits
    name: "size and time limits"
    source: https://www.openldap.org/doc/admin26/limits.html
    match: ["size and time limits", "sizelimit", "timelimit", "soft-hard"]
  - id: per-database-limits
    name: "per-database limits"
    source: https://www.openldap.org/doc/admin26/limits.html
    match: ["per-database limits", "olclimits", "paged-results", "size-unchecked"]
  - id: mdb-backend-setup
    name: "MDB backend setup"
    source: https://www.openldap.org/software/man.cgi?query=slapd-mdb&sektion=5&apropos=0&manpath=OpenLDAP+2.6-Release
    match: ["mdb backend setup", "mdb", "maxsize", "olcdbmaxsize"]
  - id: mdb-indexing
    name: "MDB indexing"
    source: https://www.openldap.org/software/man.cgi?query=slapd-mdb&sektion=5&apropos=0&manpath=OpenLDAP+2.6-Release
    match: ["mdb indexing", "olcdbindex", "index-types", "idlexp"]
  - id: mdb-envflags-and-sync
    name: "MDB envflags and sync"
    source: https://www.openldap.org/software/man.cgi?query=slapd-mdb&sektion=5&apropos=0&manpath=OpenLDAP+2.6-Release
    match: ["mdb envflags and sync", "envflags", "dbnosync", "writemap"]
  - id: backends-overview
    name: "backends overview"
    source: https://www.openldap.org/doc/admin26/backends.html
    match: ["backends overview", "backends", "ldif-backend", "null-backend"]
  - id: ldap-proxy-backend
    name: "LDAP proxy backend"
    source: https://www.openldap.org/software/man.cgi?query=slapd-ldap&sektion=5&apropos=0&manpath=OpenLDAP+2.6-Release
    match: ["ldap proxy backend", "back-ldap", "idassert-bind", "acl-bind"]
  - id: overlay-memberof
    name: "memberof overlay"
    source: https://www.openldap.org/software/man.cgi?query=slapo-memberof&sektion=5&apropos=0&manpath=OpenLDAP+2.6-Release
    match: ["memberof overlay", "memberof", "reverse-group-membership"]
  - id: overlay-refint
    name: "refint overlay"
    source: https://www.openldap.org/software/man.cgi?query=slapo-refint&sektion=5&apropos=0&manpath=OpenLDAP+2.6-Release
    match: ["refint overlay", "refint", "referential-integrity"]
  - id: overlay-unique
