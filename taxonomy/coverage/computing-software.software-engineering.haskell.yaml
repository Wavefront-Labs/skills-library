# Canonical coverage spec: Haskell language and ecosystem.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: haskell-language
scope:
  category: computing-software
  field: software-engineering
  products: [haskell]
sources:
  - "Haskell 2010 Language Report (haskell.org/onlinereport/haskell2010)"
  - "GHC User's Guide (downloads.haskell.org/ghc) - language extensions, flags, RTS, profiling, FFI"
  - "base, containers, text, bytestring, mtl, transformers library docs on Hackage"
  - "Cabal user guide, Stack docs, GHCup, Haskell Language Server docs"
  - "Tasty, HUnit, QuickCheck docs; HLint, Ormolu, Fourmolu docs; community style guides"
topics:
  - id: haskell-syntax
    name: "Lexical structure and layout"
    source: "Haskell 2010 Report ch2-3"
    match: [haskell-syntax]
    subtopics:
      - {id: haskell-syntax-layout-rule-offside, name: "Layout rule and offside indentation", match: [layout-rule-offside]}
      - {id: haskell-syntax-operators-fixity-sections, name: "Operators fixity declarations and sections", match: [operators-fixity-sections]}
      - {id: haskell-syntax-comments-and-pragmas, name: "Comments literate Haskell and pragmas", match: [comments-and-pragmas]}
  - id: haskell-expressions
    name: "Expressions and pattern matching"
    source: "Haskell 2010 Report ch3-4"
    match: [haskell-expressions]
    subtopics:
      - {id: haskell-expressions-guards-where-let, name: "Guards where and let bindings", match: [guards-where-let]}
      - {id: haskell-expressions-case-and-pattern-matching, name: "Case expressions and pattern matching", match: [case-and-pattern-matching]}
      - {id: haskell-expressions-lambdacase-multiwayif-viewpatterns, name: "LambdaCase MultiWayIf and ViewPatterns", match: [lambdacase-multiwayif-viewpatterns]}
  - id: haskell-functions
    name: "Functions and higher-order programming"
    source: "Haskell 2010 Report ch3, Prelude"
    match: [haskell-functions]
    subtopics:
      - {id: haskell-functions-currying-and-partial-application, name: "Currying and partial application", match: [currying-and-partial-application]}
      - {id: haskell-functions-point-free-and-composition, name: "Function composition and point-free style", match: [point-free-and-composition]}
      - {id: haskell-functions-folds-and-higher-order-functions, name: "Folds map filter and higher-order functions", match: [folds-and-higher-order-functions]}
  - id: haskell-lists
    name: "Lists and Data.List"
    source: "Haskell 2010 Report ch6 Prelude, base Data.List"
    match: [haskell-lists]
    subtopics:
      - {id: haskell-lists-list-comprehensions, name: "List comprehensions and ranges", match: [list-comprehensions]}
      - {id: haskell-lists-data-list-functions, name: "Data.List library functions", match: [data-list-functions]}
      - {id: haskell-lists-laziness-and-infinite-lists, name: "Infinite lists and lazy evaluation patterns", match: [laziness-and-infinite-lists]}
  - id: haskell-laziness
    name: "Evaluation strictness and space"
    source: "GHC User's Guide, base Prelude seq, deepseq package"
    match: [haskell-laziness]
    subtopics:
      - {id: haskell-laziness-bang-patterns-and-seq, name: "Strictness with seq bang patterns and strict fields", match: [bang-patterns-and-seq]}
      - {id: haskell-laziness-space-leaks-diagnosis, name: "Diagnosing space leaks", match: [space-leaks-diagnosis]}
      - {id: haskell-laziness-deepseq-and-nf, name: "deepseq NFData and normal form", match: [deepseq-and-nf]}
  - id: haskell-types-basic
    name: "Types type synonyms and algebraic data"
    source: "Haskell 2010 Report ch4"
    match: [haskell-types-basic]
    subtopics:
      - {id: haskell-types-basic-type-signatures-and-inference, name: "Type signatures inference and the monomorphism restriction", match: [type-signatures-and-inference]}
      - {id: haskell-types-basic-newtype-and-type-synonyms, name: "newtype versus type and data", match: [newtype-and-type-synonyms]}
      - {id: haskell-types-basic-algebraic-data-types, name: "Algebraic data types and recursive types", match: [algebraic-data-types]}
      - {id: haskell-types-basic-records-and-field-access, name: "Records field selectors and update syntax", match: [records-and-field-access]}
  - id: haskell-typeclasses
    name: "Type classes and instances"
    source: "Haskell 2010 Report ch4.3, GHC User's Guide deriving"
    match: [haskell-typeclasses]
    subtopics:
      - {id: haskell-typeclasses-defining-classes-and-instances, name: "Defining type classes and instances", match: [defining-classes-and-instances]}
      - {id: haskell-typeclasses-deriving-strategies-and-via, name: "Deriving strategies anyclass newtype and via", match: [deriving-strategies-and-via]}
  - id: haskell-stdclasses
    name: "Standard library classes"
    source: "base Prelude, Data.Semigroup, Data.Foldable"
    match: [haskell-stdclasses]
    subtopics:
      - {id: haskell-stdclasses-eq-ord-show-read, name: "Eq Ord Show and Read", match: [eq-ord-show-read]}
      - {id: haskell-stdclasses-numeric-tower, name: "Numeric types and the Num hierarchy", match: [numeric-tower]}
      - {id: haskell-stdclasses-semigroup-and-monoid, name: "Semigroup and Monoid", match: [semigroup-and-monoid]}
      - {id: haskell-stdclasses-foldable-and-traversable, name: "Foldable and Traversable", match: [foldable-and-traversable]}
  - id: haskell-functor-monad
