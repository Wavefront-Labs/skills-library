    source: "base Control.Exception, Data.Either, Data.Maybe"
    match: [haskell-errors]
    subtopics:
      - {id: haskell-errors-maybe-either-error-values, name: "Maybe and Either for errors", match: [maybe-either-error-values]}
      - {id: haskell-errors-exceptions-control-exception, name: "Exceptions with Control.Exception", match: [exceptions-control-exception]}
      - {id: haskell-errors-bottom-error-undefined-callstacks, name: "error undefined and HasCallStack", match: [bottom-error-undefined-callstacks]}
