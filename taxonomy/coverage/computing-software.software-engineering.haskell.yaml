      - {id: haskell-functor-monad-monads-and-do-notation, name: "Monads and do notation", match: [monads-and-do-notation]}
  - id: haskell-transformers
    name: "Monad transformers and mtl"
    source: "transformers and mtl docs on Hackage"
    match: [haskell-transformers]
    subtopics:
      - {id: haskell-transformers-mtl-state-reader-writer, name: "State Reader and Writer with mtl", match: [mtl-state-reader-writer]}
      - {id: haskell-transformers-transformer-stacks-and-except, name: "Transformer stacks ExceptT and lifting", match: [transformer-stacks-and-except]}
  - id: haskell-io
    name: "Input and output"
    source: "Haskell 2010 Report ch7 System.IO, base System.IO and System.Directory"
    match: [haskell-io]
    subtopics:
      - {id: haskell-io-io-monad-and-main, name: "The IO monad main and sequencing", match: [io-monad-and-main]}
      - {id: haskell-io-files-handles-and-paths, name: "Files handles and paths", match: [files-handles-and-paths]}
  - id: haskell-errors
