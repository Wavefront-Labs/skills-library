# Coverage spec: uptime-kuma. Hand-written topics from the official docs.
subject: Uptime Kuma
scope:
  category: computing-software
  field: systems-network-administration
  products: [uptime-kuma]
sources:
  - "Uptime Kuma GitHub wiki"
topics:
  - id: uptime-kuma-docker-run
    name: "docker run install"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install"
    match: [uptime-kuma-install, docker-run]
  - id: uptime-kuma-compose
    name: "Docker Compose install"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install"
    match: [docker-compose, port-3001]
  - id: uptime-kuma-data-volume
    name: "Persistent data volume"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install"
    match: [data-volume]
  - id: uptime-kuma-sqlite-locks
    name: "SQLite file locking and NFS"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install"
    match: [sqlite-file-locking]
  - id: uptime-kuma-tag-choice
    name: "Choosing an image tag"
    source: "https://github.com/louislam/uptime-kuma/wiki/Docker-Tags"
    match: [docker-tags, louislam-uptime-kuma]
  - id: uptime-kuma-slim
    name: "Slim images"
    source: "https://github.com/louislam/uptime-kuma/wiki/Docker-Tags"
    match: [slim-image]
  - id: uptime-kuma-rootless
    name: "Rootless images"
    source: "https://github.com/louislam/uptime-kuma/wiki/Docker-Tags"
    match: [rootless]
  - id: uptime-kuma-embedded
    name: "Embedded MariaDB and Chromium"
    source: "https://github.com/louislam/uptime-kuma/wiki/Docker-Tags"
    match: [embedded-mariadb, embedded-chromium]
  - id: uptime-kuma-non-docker
    name: "Non-Docker install"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install"
    match: [non-docker, nodejs, npm-run-setup]
  - id: uptime-kuma-pm2
    name: "pm2 process management"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%94%A7-How-to-Install"
    match: [pm2]
  - id: uptime-kuma-systemd
    name: "systemd unit file"
    source: "https://github.com/louislam/uptime-kuma/wiki/Systemd-Unit-File"
    match: [systemd-unit, uptime-kuma-service]
  - id: uptime-kuma-openrc
    name: "OpenRC script"
    source: "https://github.com/louislam/uptime-kuma/wiki/OpenRC-Script"
    match: [openrc]
  - id: uptime-kuma-update-docker
    name: "Updating Docker installs"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%86%99-How-to-Update"
    match: [uptime-kuma-update, docker-pull, force-recreate]
  - id: uptime-kuma-update-git
    name: "Updating Git installs"
    source: "https://github.com/louislam/uptime-kuma/wiki/%F0%9F%86%99-How-to-Update"
    match: [git-checkout, download-dist, pm2-restart]
  - id: uptime-kuma-migration
    name: "v1 to v2 migration"
    source: "https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2"
    match: [uptime-kuma-v2, migration]
  - id: uptime-kuma-breaking
    name: "Breaking changes in v2"
    source: "https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2"
    match: [breaking-changes]
  - id: uptime-kuma-aggregation
    name: "Heartbeat aggregation"
    source: "https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2"
    match: [heartbeat-aggregation]
  - id: uptime-kuma-liquid
    name: "LiquidJS email templates"
    source: "https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2"
    match: [liquidjs]
  - id: uptime-kuma-backup
    name: "Backing up the data directory"
    source: "https://github.com/louislam/uptime-kuma/wiki/Migration-From-v1-To-v2"
    match: [backup-data-directory]
  - id: uptime-kuma-env-basic
    name: "Host, port and data dir variables"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [uptime-kuma-env, data-dir]
  - id: uptime-kuma-env-ssl
    name: "Built-in HTTPS variables"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [ssl-key, ssl-cert]
  - id: uptime-kuma-env-ca
    name: "Trusting self-signed CAs"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [node-extra-ca-certs]
  - id: uptime-kuma-env-proxy
    name: "Notification proxy"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [notification-proxy]
  - id: uptime-kuma-env-origin
    name: "WebSocket origin check"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [ws-origin-check]
  - id: uptime-kuma-mariadb
    name: "MariaDB backend"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [mariadb, uptime-kuma-database, db-type]
  - id: uptime-kuma-db-secrets
    name: "Docker secrets for DB credentials"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [docker-secrets, db-password-file]
  - id: uptime-kuma-sqlite
    name: "SQLite single connection"
    source: "https://github.com/louislam/uptime-kuma/wiki/Environment-Variables"
    match: [sqlite]
  - id: uptime-kuma-reverse-proxy
    name: "Reverse proxy overview"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reverse-Proxy"
    match: [reverse-proxy, websocket]
  - id: uptime-kuma-nginx
    name: "nginx configuration"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reverse-Proxy"
    match: [nginx]
  - id: uptime-kuma-apache
    name: "Apache configuration"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reverse-Proxy"
    match: [apache]
  - id: uptime-kuma-npm
    name: "Nginx Proxy Manager"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reverse-Proxy"
    match: [nginx-proxy-manager]
  - id: uptime-kuma-trust-proxy
    name: "Trust Proxy setting"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reverse-Proxy"
    match: [trust-proxy, x-forwarded-for]
  - id: uptime-kuma-tunnel
    name: "Cloudflare Tunnel"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reverse-Proxy-with-Cloudflare-Tunnel"
    match: [cloudflare-tunnel, cloudflared, zero-trust]
  - id: uptime-kuma-tunnel-token
    name: "Tunnel token"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reverse-Proxy-with-Cloudflare-Tunnel"
    match: [tunnel-token, uptime-kuma-cloudflared-token]
  - id: uptime-kuma-status-page
    name: "Status pages"
    source: "https://github.com/louislam/uptime-kuma/wiki/Status-Page"
    match: [status-page, slug, public-status]
  - id: uptime-kuma-custom-domain
    name: "Custom domains"
    source: "https://github.com/louislam/uptime-kuma/wiki/Status-Page"
    match: [custom-domain, x-forwarded-host]
  - id: uptime-kuma-iframe
    name: "Embedding in an iframe"
    source: "https://github.com/louislam/uptime-kuma/wiki/Status-Page"
    match: [iframe, clickjacking]
  - id: uptime-kuma-badge-status
    name: "Status badge"
    source: "https://github.com/louislam/uptime-kuma/wiki/Badge"
    match: [status-badge, api-badge]
  - id: uptime-kuma-badge-uptime
    name: "Uptime and ping badges"
    source: "https://github.com/louislam/uptime-kuma/wiki/Badge"
    match: [uptime-badge, shields-badge]
  - id: uptime-kuma-badge-cert
    name: "Certificate expiry badge"
    source: "https://github.com/louislam/uptime-kuma/wiki/Badge"
    match: [cert-exp, badge-styles, markdown-badge]
  - id: uptime-kuma-maintenance
    name: "Maintenance windows"
    source: "https://github.com/louislam/uptime-kuma/wiki/Maintenance"
    match: [maintenance, maintenance-window]
  - id: uptime-kuma-maint-schedule
    name: "Maintenance scheduling strategies"
    source: "https://github.com/louislam/uptime-kuma/wiki/Maintenance"
    match: [cron-expression, recurring-maintenance]
  - id: uptime-kuma-maint-notify
    name: "Suppressing notifications and banners"
    source: "https://github.com/louislam/uptime-kuma/wiki/Maintenance"
    match: [suppress-notifications, status-page-banner]
  - id: uptime-kuma-prom-metrics
    name: "Prometheus metrics"
    source: "https://github.com/louislam/uptime-kuma/wiki/Prometheus-Integration"
    match: [prometheus, metrics-endpoint, monitor-status, monitor-response-time]
  - id: uptime-kuma-prom-scrape
    name: "Prometheus scrape config"
    source: "https://github.com/louislam/uptime-kuma/wiki/Prometheus-Integration"
    match: [scrape-config, basic-auth]
  - id: uptime-kuma-api-keys
    name: "API keys"
    source: "https://github.com/louislam/uptime-kuma/wiki/Prometheus-API-Keys"
    match: [api-keys]
  - id: uptime-kuma-docker-monitor
    name: "Docker container monitor"
    source: "https://github.com/louislam/uptime-kuma/wiki/How-to-Monitor-Docker-Containers"
    match: [docker-monitor, container-monitoring]
  - id: uptime-kuma-docker-sock
    name: "Sharing docker.sock"
    source: "https://github.com/louislam/uptime-kuma/wiki/How-to-Monitor-Docker-Containers"
    match: [docker-sock, docker-host]
  - id: uptime-kuma-docker-tls
    name: "Docker TCP and TLS"
    source: "https://github.com/louislam/uptime-kuma/wiki/How-to-Monitor-Docker-Containers"
    match: [docker-tls, tcp-bridge]
  - id: uptime-kuma-false-down
    name: "Debugging false DOWN"
    source: "https://github.com/louislam/uptime-kuma/wiki/Troubleshooting"
    match: [uptime-kuma-down, false-down, curl-from-container, firewall]
  - id: uptime-kuma-ipv6
    name: "IPv6 in Docker"
    source: "https://github.com/louislam/uptime-kuma/wiki/Troubleshooting"
    match: [ipv6, docker-networking]
  - id: uptime-kuma-reset-password
    name: "Reset the admin password"
    source: "https://github.com/louislam/uptime-kuma/wiki/Reset-Password-via-CLI"
    match: [reset-password, npm-run-reset-password, admin-recovery]
  - id: uptime-kuma-notifications
    name: "Notification providers and Apprise"
    source: "https://github.com/louislam/uptime-kuma/wiki/Notification-Methods"
    match: [notification-providers, apprise]
