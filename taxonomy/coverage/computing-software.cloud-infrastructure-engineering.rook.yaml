# Coverage spec: rook. Topics from the official docs table of contents.
subject: rook
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [rook]
sources:
  - "rook official docs"
topics:
  - id: quickstart-operator-and-cluster-deploy
    name: "Quickstart operator and cluster deploy"
    source: "https://rook.io/docs/rook/latest-release/Getting-Started/quickstart/"
    match: [quickstart, rook-operator, crds-yaml, cluster-yaml]
  - id: rook-supported-platforms-and-devices
    name: "Rook supported platforms and devices"
    source: "https://rook.io/docs/rook/latest-release/Getting-Started/Prerequisites/prerequisites/"
    match: [prerequisites, kubernetes-version, raw-devices, lsblk]
  - id: rook-host-lvm-udev-kernel-requirements
    name: "Rook host lvm udev kernel requirements"
    source: "https://rook.io/docs/rook/latest-release/Getting-Started/Prerequisites/prerequisites/"
    match: [prerequisites, lvm2, udev, rbd-module]
  - id: rook-authenticated-registry-pull-secrets
    name: "Rook authenticated registry pull secrets"
    source: "https://rook.io/docs/rook/latest-release/Getting-Started/Prerequisites/authenticated-registry/"
    match: [authenticated-registry, imagepullsecrets, docker-registry, serviceaccount]
  - id: rook-release-cadence-and-support-matrix
    name: "Rook release cadence and support matrix"
    source: "https://rook.io/docs/rook/latest-release/Getting-Started/maintenance-and-support/"
    match: [maintenance, support-matrix, release-cadence, ceph-versions]
  - id: rook-storage-architecture-overview
    name: "Rook storage architecture overview"
    source: "https://rook.io/docs/rook/latest-release/Getting-Started/storage-architecture/"
    match: [architecture, operator, ceph-csi, mds]
  - id: object-store-deployment-scenarios
    name: "Object store deployment scenarios"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Object-Storage-RGW/object-storage/"
    match: [cephobjectstore, rgw, s3, shared-pools]
  - id: cephobjectstore-crd-pools-and-lifecycle
    name: "Cephobjectstore crd pools and lifecycle"
    source: "https://rook.io/docs/rook/latest-release/CRDs/Object-Storage/ceph-object-store-crd/"
    match: [cephobjectstore, metadatapool, datapool, preservepoolsondelete]
  - id: cephobjectstore-crd-protocols-and-keystone
    name: "Cephobjectstore crd protocols and keystone"
    source: "https://rook.io/docs/rook/latest-release/CRDs/Object-Storage/ceph-object-store-crd/"
    match: [protocols, enableapis, swift, urlprefix]
  - id: cephobjectstore-crd-gateway-tls-and-ports
    name: "Cephobjectstore crd gateway tls and ports"
    source: "https://rook.io/docs/rook/latest-release/CRDs/Object-Storage/ceph-object-store-crd/"
    match: [gateway, sslcertificateref, cabundleref, secureport]
  - id: object-bucket-claim-provisioning
    name: "Object bucket claim provisioning"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Object-Storage-RGW/ceph-object-bucket-claim/"
    match: [objectbucketclaim, obc, generatebucketname, bucket-storageclass]
  - id: cephobjectstoreuser-crd-fields
    name: "Cephobjectstoreuser crd fields"
    source: "https://rook.io/docs/rook/latest-release/CRDs/Object-Storage/ceph-object-store-user-crd/"
    match: [cephobjectstoreuser, quotas, capabilities, opmask]
  - id: prometheus-monitoring-for-rook-ceph
    name: "Prometheus monitoring for rook ceph"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Monitoring/ceph-monitoring/"
    match: [prometheus, servicemonitor, ceph-exporter, prometheus-mgr-module]
  - id: mon-health-failover-timing
    name: "Mon health failover timing"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Advanced/ceph-mon-health/"
    match: [mon-failover, quorum, paxos, health-check]
  - id: osd-removal-and-replacement
    name: "Osd removal and replacement"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Advanced/ceph-osd-mgmt/"
    match: [osd-removal, purge-osd, osd-purge-job, replace-ready-for-swap]
  - id: rook-operator-upgrade-procedure
    name: "Rook operator upgrade procedure"
    source: "https://rook.io/docs/rook/latest-release/Upgrade/rook-upgrade/"
    match: [rook-upgrade, operator-image, common-yaml, helm-upgrade-order]
  - id: ceph-version-upgrade-in-rook
    name: "Ceph version upgrade in rook"
    source: "https://rook.io/docs/rook/latest-release/Upgrade/ceph-upgrade/"
    match: [ceph-upgrade, cephversion-image, rolling-upgrade, tentacle]
  - id: ceph-cluster-health-verification-before-upgrade
    name: "Ceph cluster health verification before upgrade"
    source: "https://rook.io/docs/rook/latest-release/Upgrade/health-verification/"
    match: [health-verification, ceph-status, health-ok, active-clean]
  - id: node-maintenance-full-shutdown-procedure
    name: "Node maintenance full shutdown procedure"
    source: "https://rook.io/docs/rook/latest-release/Upgrade/node-maintenance/"
    match: [node-maintenance, noout, scale-down, shutdown]
  - id: rbd-volume-snapshots-and-restore
    name: "Rbd volume snapshots and restore"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Ceph-CSI/ceph-csi-snapshot/"
    match: [volumesnapshot, volumesnapshotclass, snapshotpolicy, csi-snapshotter]
  - id: csi-volume-clone-rbd-and-cephfs
    name: "Csi volume clone rbd and cephfs"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Ceph-CSI/ceph-csi-volume-clone/"
    match: [volume-clone, datasource, persistentvolumeclaim, pvc-clone]
  - id: osd-encryption-kms-and-key-rotation
    name: "Osd encryption kms and key rotation"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/Advanced/key-management-system/"
    match: [encrypted, kms, vault, keyrotation]
  - id: rook-cluster-teardown-and-cleanup-policy
    name: "Rook cluster teardown and cleanup policy"
    source: "https://rook.io/docs/rook/latest-release/Storage-Configuration/ceph-teardown/"
    match: [cleanup, cleanuppolicy, teardown, zap-disk]
  - id: rook-openshift-scc-and-settings
    name: "Rook openshift scc and settings"
    source: "https://rook.io/docs/rook/latest-release/Getting-Started/ceph-openshift/"
    match: [openshift, securitycontextconstraints, operator-openshift, hostpath-requires-privileged]
  - id: rook-ceph-operator-helm-chart
    name: "Rook ceph operator helm chart"
    source: "https://rook.io/docs/rook/latest-release/Helm-Charts/operator-chart/"
    match: [helm, operator-chart, rook-release, crds-enabled]
  - id: rook-ceph-cluster-helm-chart
    name: "Rook ceph cluster helm chart"
    source: "https://rook.io/docs/rook/latest-release/Helm-Charts/ceph-cluster-chart/"
