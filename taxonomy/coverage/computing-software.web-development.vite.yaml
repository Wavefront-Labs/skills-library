# Coverage spec: vite. Topics from the Vite docs (vitejs/vite, docs/ folder: guide, config, API pages).
subject: vite
scope:
  category: computing-software
  field: web-development
  products: [vite]
sources:
  - "Vite docs (raw markdown in github.com/vitejs/vite, docs/ folder)"
topics:
  - id: getting-started
    name: "Scaffold a project and requirements"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/index.md"
    match: [create-vite, scaffold-project, node-version]
  - id: browser-support-targets
    name: "Browser compatibility and build target"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [browser-compatibility, baseline-widely-available, legacy-plugin]
  - id: why-vite-architecture
    name: "Why Vite: unbundled dev and Rolldown"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/why.md"
    match: [vite-architecture, unbundled-esm-dev, rolldown-oxc]
  - id: project-philosophy
    name: "Project philosophy"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/philosophy.md"
    match: [vite-philosophy, lean-core, vite-ecosystem-ci]
  - id: cli-dev-server
    name: "CLI dev server command and flags"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/cli.md"
    match: [vite-dev-command, dev-server-flags, strict-port]
  - id: cli-build-options
    name: "CLI build command and flags"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/cli.md"
    match: [vite-build-command, build-flags, ssr-flag]
  - id: cli-preview
    name: "CLI preview command"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/cli.md"
    match: [vite-preview-command, preview-build]
  - id: typescript-transpile-only
    name: "TypeScript transpile-only and type checking"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [typescript-support, type-checking, tsc-noemit]
  - id: typescript-compiler-options
    name: "TypeScript compiler options Vite honours"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [tsconfig-options, isolated-modules, use-define-for-class-fields]
  - id: client-types
    name: "Client types and asset shims"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [vite-client-types, asset-type-shims]
  - id: html-entry-processing
    name: "index.html as entry and project root"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [html-entry, html-asset-elements, project-root]
  - id: jsx-oxc
    name: "JSX support through Oxc"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [jsx-support, oxc-jsx-options, jsx-inject]
  - id: css-postcss-modules
    name: "CSS imports, PostCSS and CSS modules"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [css-import-inlining, postcss-config, css-modules]
  - id: css-preprocessors
    name: "Sass, Less and Stylus support"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [sass-support, less-support, stylus-support]
  - id: css-inline-query
    name: "CSS inline query and disabling injection"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [css-inline-query, disable-css-injection]
  - id: lightning-css
    name: "Lightning CSS transformer"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [lightningcss, css-transformer, css-minification]
  - id: json-imports
    name: "JSON imports"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [json-import, json-named-exports, json-tree-shaking]
  - id: glob-import
    name: "Glob import"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [import-meta-glob, glob-eager, glob-negative-patterns]
  - id: glob-import-options
    name: "Glob import options"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [glob-import-option, glob-query-option, glob-base-option]
  - id: dynamic-import-variables
    name: "Dynamic import with variables"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [dynamic-import-vars, import-variable-rules]
  - id: webassembly
    name: "WebAssembly imports"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [wasm-import, wasm-init, wasm-url]
  - id: web-workers
    name: "Web workers"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [web-worker, worker-query-suffix, shared-worker]
  - id: content-security-policy
    name: "Content Security Policy nonce"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [csp-nonce, html-csp-nonce, data-uri-csp]
  - id: build-optimizations
    name: "Build optimizations: CSS splitting and preload"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [css-code-splitting, modulepreload, async-chunk-loading, chunk-import-map]
  - id: build-license-file
    name: "License file for bundled dependencies"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [build-license, dependency-licenses, license-md]
  - id: framework-plugins
    name: "Framework plugins"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [framework-plugins, plugin-vue, plugin-react]
  - id: npm-dependency-resolving
    name: "NPM dependency resolving"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/features.md"
    match: [bare-module-imports, dependency-pre-bundling, strong-caching]
  - id: static-asset-imports
    name: "Importing static assets"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/assets.md"
    match: [asset-url-import, assets-include, asset-inlining, raw-import]
  - id: public-directory
    name: "The public directory"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/assets.md"
    match: [public-dir, unhashed-assets, root-absolute-path]
  - id: new-url-import-meta-url
    name: "new URL with import.meta.url"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/assets.md"
    match: [new-url-pattern, import-meta-url, dynamic-asset-url]
  - id: env-variables-vite-prefix
    name: "Env variables and the VITE_ prefix"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/env-and-mode.md"
    match: [import-meta-env, vite-prefix, built-in-constants, env-secrets]
  - id: env-files-loading
    name: ".env files and loading priority"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/env-and-mode.md"
    match: [dotenv-files, env-priority, dotenv-expand]
  - id: modes-and-node-env
    name: "Modes and NODE_ENV"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/env-and-mode.md"
    match: [vite-modes, node-env, staging-mode, mode-flag]
  - id: env-typescript-intellisense
    name: "TypeScript IntelliSense for env variables"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/env-and-mode.md"
    match: [import-meta-env-types, vite-env-dts, strict-import-meta-env]
  - id: html-constant-replacement
    name: "HTML constant replacement"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/env-and-mode.md"
    match: [html-env-replacement, percent-syntax]
  - id: public-base-path
    name: "Public base path"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [base-option, relative-base, base-url-constant]
  - id: rolldown-options-chunking
    name: "Customizing the build with Rolldown options"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [rolldown-options, code-splitting, manual-chunks, custom-build]
  - id: preload-error-handling
    name: "Load error handling"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [vite-preload-error, stale-chunks, dynamic-import-failure]
  - id: build-watch-mode
    name: "Rebuild on files change"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [build-watch, rebuild-on-change, watcher-options]
  - id: multi-page-app
    name: "Multi-page app"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [multi-page-app, html-entry-input, nested-html]
  - id: library-mode
    name: "Library mode"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [library-mode, build-lib, externalize-dependencies, umd-globals]
  - id: library-package-json
    name: "Library package.json and CSS"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [library-exports, library-css, library-env-replacement, css-file-name]
  - id: render-built-url
    name: "Advanced base options and renderBuiltUrl"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/build.md"
    match: [render-built-url, advanced-base-options, cdn-assets]
  - id: dep-prebundling-why
    name: "Why dependency pre-bundling"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/dep-pre-bundling.md"
    match: [pre-bundling-purpose, commonjs-to-esm, lodash-es-requests]
  - id: dep-prebundling-discovery
    name: "Automatic dependency discovery"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/dep-pre-bundling.md"
    match: [auto-dependency-discovery, optimize-deps-include, linked-dependencies]
  - id: dep-cache-invalidation
    name: "Dependency cache and invalidation"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/dep-pre-bundling.md"
    match: [vite-cache-directory, force-rebundle, browser-dependency-cache, lockfile-invalidation]
  - id: using-plugins
    name: "Using plugins"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/using-plugins.md"
    match: [plugins-array, plugin-enforce, plugin-apply, plugin-registry]
  - id: static-deploy-build-preview
    name: "Building and previewing the app"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/static-deploy.md"
    match: [static-deploy, dist-folder, preview-port-4173]
  - id: deploy-github-gitlab-pages
    name: "Deploy to GitHub Pages and GitLab Pages"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/static-deploy.md"
    match: [github-pages, gitlab-pages, base-repo-path]
  - id: deploy-hosting-platforms
    name: "Deploy to Netlify, Vercel, Firebase and Surge"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/static-deploy.md"
    match: [netlify-deploy, vercel-deploy, firebase-hosting, surge-deploy]
  - id: deploy-cloudflare-workers
    name: "Deploy to Cloudflare Workers"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/static-deploy.md"
    match: [cloudflare-vite-plugin, cloudflare-workers, wrangler-deploy]
  - id: performance-browser-plugins
    name: "Performance: browser setup and plugins"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/performance.md"
    match: [dev-performance, disable-cache-devtools, plugin-audit]
  - id: performance-resolve-barrels
    name: "Performance: resolve operations and barrel files"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/performance.md"
    match: [resolve-extensions, explicit-import-paths, barrel-files]
  - id: performance-warmup-native
    name: "Performance: warmup and native tooling"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/performance.md"
    match: [server-warmup, request-waterfall, native-tooling]
  - id: troubleshoot-config-cli
    name: "Troubleshooting: config and CLI errors"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/troubleshooting.md"
    match: [esm-only-package, config-esm, ampersand-path-windows]
  - id: troubleshoot-linux-limits
    name: "Troubleshooting: Linux limits and stalled requests"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/troubleshooting.md"
    match: [stalled-requests, enospc-watchers, inotify-limits]
  - id: troubleshoot-dev-server-network
    name: "Troubleshooting: dev server network issues"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/troubleshooting.md"
    match: [self-signed-cert-caching, header-431, devcontainer-port-forwarding]
  - id: troubleshoot-hmr
    name: "Troubleshooting: HMR"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/troubleshooting.md"
    match: [hmr-not-working, full-reload, circular-dependency-hmr]
  - id: troubleshoot-build-errors
    name: "Troubleshooting: build errors"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/troubleshooting.md"
    match: [file-protocol-cors, case-sensitivity-build, version-skew]
  - id: troubleshoot-deps-and-misc
    name: "Troubleshooting: dependencies and other"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/troubleshooting.md"
    match: [linked-package-stale, cpu-profile, externalized-node-module, cjs-default-import]
  - id: backend-integration-dev
    name: "Backend integration in dev"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/backend-integration.md"
    match: [backend-integration, server-origin, vite-client-script, react-refresh-preamble]
  - id: build-manifest
    name: "Build manifest for backends"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/backend-integration.md"
    match: [vite-manifest, manifest-chunk, is-entry]
  - id: backend-render-tags
    name: "Rendering manifest tags in a backend"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/backend-integration.md"
    match: [render-manifest-tags, imported-chunks, modulepreload-links]
  - id: ssr-dev-middleware
    name: "SSR dev server in middleware mode"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/ssr.md"
    match: [ssr-middleware-mode, ssr-load-module, transform-index-html, ssr-outlet]
  - id: ssr-production-build
    name: "SSR production build and prerendering"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/ssr.md"
    match: [ssr-build, ssr-manifest, prerender-ssg, early-hints]
  - id: ssr-externals-target
    name: "SSR externals, target and conditions"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/ssr.md"
    match: [ssr-external, ssr-no-external, ssr-target-webworker, ssr-resolve-conditions]
  - id: ssr-plugin-cli
    name: "SSR-specific plugin logic"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/ssr.md"
    match: [ssr-plugin-option, configure-server-ssr, ssr-conditional-transform]
  - id: migration-v8-rolldown-oxc
    name: "Migration: Rolldown and Oxc"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/migration.md"
    match: [migrate-from-v7, rolldown-vite, esbuild-to-oxc]
  - id: migration-v8-minify-cjs
    name: "Migration: minifier and CommonJS interop"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/migration.md"
    match: [oxc-minifier, cjs-interop-default, format-sniffing-removed]
  - id: migration-v8-removals
    name: "Migration: removed features and breaking changes"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/guide/migration.md"
    match: [bundle-error, rollup-options-renamed, removed-hooks]
  - id: config-file-basics
    name: "Config file and typing"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/index.md"
    match: [vite-config-file, define-config, satisfies-user-config, config-loader-native]
  - id: config-conditional-async
    name: "Conditional and async config"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/index.md"
    match: [conditional-config, config-function, async-config, is-ssr-build]
  - id: config-load-env
    name: "Using env variables in config"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/index.md"
    match: [load-env, env-in-config, define-app-constant]
  - id: config-debug-vscode
    name: "Debugging config in VS Code"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/index.md"
    match: [debug-config, vite-temp-sourcemaps, vscode-launch-json]
  - id: config-root-base-input
    name: "root, base, mode and input options"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [root-option, base-values, mode-option, input-option]
  - id: config-define-plugins-dirs
    name: "define, plugins, publicDir and cacheDir"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [define-option, plugins-option, public-dir-option, cache-dir]
  - id: resolve-alias-dedupe
    name: "resolve.alias and resolve.dedupe"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [resolve-alias, alias-array-format, resolve-dedupe]
  - id: resolve-conditions-fields
    name: "resolve conditions, mainFields and tsconfigPaths"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [resolve-conditions, resolve-main-fields, resolve-tsconfig-paths]
  - id: html-options
    name: "html.cspNonce and additionalAssetSources"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [html-csp-nonce-option, additional-asset-sources]
  - id: css-options-modules-postcss
    name: "css.modules and css.postcss options"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [css-modules-option, css-postcss-option, scoped-name]
  - id: css-preprocessor-options
    name: "css.preprocessorOptions and devSourcemap"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [preprocessor-options, additional-data, preprocessor-max-workers]
  - id: json-options
    name: "json options and css transformer options"
    source: "https://raw.githubusercontent.com/vitejs/vite/main/docs/config/shared-options.md"
    match: [json-named-exports-option, json-stringify, css-transformer-option]
  - id: oxc-option
