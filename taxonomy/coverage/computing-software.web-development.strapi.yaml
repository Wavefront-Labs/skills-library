# Coverage spec: strapi. Topics from the Strapi CMS docs (strapi/documentation, docusaurus/docs/cms).
subject: strapi
scope:
  category: computing-software
  field: web-development
  products: [strapi]
sources:
  - "Strapi docs (github.com/strapi/documentation/tree/main/docusaurus/docs/cms)"
topics:
  - id: create-project
    name: "Create a project with the CLI"
    source: "https://docs.strapi.io/cms/installation/cli"
    match: [create-strapi, installation, scaffold, non-interactive]
  - id: project-layout
    name: "Project file locations"
    source: "https://docs.strapi.io/cms/project-structure"
    match: [project-structure, src-api, folders]
  - id: dev-commands
    name: "CLI: develop, start, build, console"
    source: "https://docs.strapi.io/cms/cli"
    match: [strapi-develop, strapi-start, strapi-build, strapi-console]
  - id: list-commands
    name: "CLI: listing and generating"
    source: "https://docs.strapi.io/cms/cli"
    match: [routes-list, policies-list, strapi-generate, list-commands]
  - id: admin-users-cli
    name: "CLI: administrator accounts"
    source: "https://docs.strapi.io/cms/cli"
    match: [admin-create-user, reset-password]
  - id: config-dump
    name: "CLI: configuration dump and restore"
    source: "https://docs.strapi.io/cms/cli"
    match: [configuration-dump, configuration-restore]
  - id: data-export-import
    name: "CLI: export and import data"
    source: "https://docs.strapi.io/cms/cli"
    match: [strapi-export, strapi-import]
  - id: data-transfer
    name: "CLI: transfer between instances"
    source: "https://docs.strapi.io/cms/cli"
    match: [strapi-transfer, transfer-token]
  - id: schema-json
    name: "Content-type schema.json"
    source: "https://docs.strapi.io/cms/backend-customization/models"
    match: [schema-json, content-type, single-type, collection-type]
  - id: attribute-validations
    name: "Attribute types and validations"
    source: "https://docs.strapi.io/cms/backend-customization/models"
    match: [attributes, validations, private-field]
  - id: relations-schema
    name: "Relations in the schema"
    source: "https://docs.strapi.io/cms/backend-customization/models"
    match: [relations, inversedby, mappedby]
  - id: components-dynamic-zones
    name: "Components and dynamic zones"
    source: "https://docs.strapi.io/cms/backend-customization/models"
    match: [components, dynamiczone]
  - id: lifecycle-hooks
    name: "Lifecycle hooks"
    source: "https://docs.strapi.io/cms/backend-customization/models"
    match: [lifecycle-hooks, lifecycles, subscribe]
  - id: controllers
    name: "Controllers"
    source: "https://docs.strapi.io/cms/backend-customization/controllers"
    match: [controllers, createcorecontroller, sanitize]
  - id: services
    name: "Services"
    source: "https://docs.strapi.io/cms/backend-customization/services"
    match: [services, createcoreservice]
  - id: routes
    name: "Routes and routers"
    source: "https://docs.strapi.io/cms/backend-customization/routes"
    match: [routes, createcorerouter, custom-router]
  - id: policies
    name: "Policies"
    source: "https://docs.strapi.io/cms/backend-customization/policies"
    match: [policies, policy-context]
  - id: route-middlewares
    name: "Route and API middlewares"
    source: "https://docs.strapi.io/cms/backend-customization/middlewares"
    match: [middlewares, koa-middleware]
  - id: request-context
    name: "Request and response context"
    source: "https://docs.strapi.io/cms/backend-customization/requests-responses"
    match: [ctx, koa, request-context]
  - id: webhooks
    name: "Webhooks"
    source: "https://docs.strapi.io/cms/backend-customization/webhooks"
    match: [webhooks, hmac, signature]
  - id: rest-basics
    name: "REST API endpoints and responses"
    source: "https://docs.strapi.io/cms/api/rest"
    match: [rest-api, endpoints, documentid-response]
  - id: rest-filters
    name: "REST filters"
    source: "https://docs.strapi.io/cms/api/rest/filters"
    match: [filters, operators, qs]
  - id: rest-sort-pagination
    name: "REST sort and pagination"
    source: "https://docs.strapi.io/cms/api/rest/sort-pagination"
    match: [sort, pagination]
  - id: rest-populate
    name: "REST populate and fields"
    source: "https://docs.strapi.io/cms/api/rest/populate-select"
    match: [populate, fields]
  - id: rest-status
    name: "REST draft and published status"
    source: "https://docs.strapi.io/cms/api/rest/status"
    match: [status, draft, published]
  - id: rest-locale
    name: "REST locale parameter"
    source: "https://docs.strapi.io/cms/api/rest/locale"
    match: [locale, i18n-api]
  - id: relations-api
    name: "Managing relations in requests"
    source: "https://docs.strapi.io/cms/api/rest/relations"
    match: [connect, disconnect, set-relations]
  - id: document-service-read
    name: "Document Service: read"
    source: "https://docs.strapi.io/cms/api/document-service"
    match: [document-service, findone, findmany]
  - id: document-service-write
    name: "Document Service: write"
    source: "https://docs.strapi.io/cms/api/document-service"
    match: [create, update, delete, count]
  - id: document-service-publish
    name: "Document Service: publish"
    source: "https://docs.strapi.io/cms/api/document-service"
    match: [publish, unpublish, discarddraft]
  - id: graphql
    name: "GraphQL API"
    source: "https://docs.strapi.io/cms/api/graphql"
    match: [graphql, relay-connection]
  - id: api-config
    name: "API configuration"
    source: "https://docs.strapi.io/cms/configurations/api"
    match: [config-api, strictparams, default-limit]
  - id: server-config
    name: "Server configuration"
    source: "https://docs.strapi.io/cms/configurations/server"
    match: [config-server, proxy, host-port]
  - id: database-config
    name: "Database configuration"
    source: "https://docs.strapi.io/cms/configurations/database"
    match: [config-database, postgres, pool]
  - id: environment
    name: "Environment variables"
    source: "https://docs.strapi.io/cms/configurations/environment"
    match: [env, dotenv, secrets]
  - id: cron
    name: "Cron jobs"
    source: "https://docs.strapi.io/cms/configurations/cron"
    match: [cron, node-schedule]
  - id: lifecycle-functions
    name: "register, bootstrap and destroy"
    source: "https://docs.strapi.io/cms/configurations/functions"
    match: [bootstrap, register, destroy]
  - id: middlewares-config
    name: "Global middleware configuration"
    source: "https://docs.strapi.io/cms/configurations/middlewares"
    match: [config-middlewares, loading-order]
  - id: plugins-config
    name: "Plugins configuration"
    source: "https://docs.strapi.io/cms/configurations/plugins"
    match: [config-plugins]
  - id: admin-config
    name: "Admin panel configuration"
    source: "https://docs.strapi.io/cms/configurations/admin-panel"
    match: [config-admin, admin-url]
  - id: tokens
    name: "API tokens and admin tokens"
    source: "https://docs.strapi.io/cms/features/api-tokens"
    match: [api-token, admin-token, encryption-key]
  - id: rbac
    name: "Admin roles and permissions"
    source: "https://docs.strapi.io/cms/features/rbac"
    match: [rbac, roles]
  - id: users-permissions
    name: "Users and Permissions"
    source: "https://docs.strapi.io/cms/features/users-permissions"
    match: [users-permissions, jwt, registration]
  - id: i18n
    name: "Internationalization"
    source: "https://docs.strapi.io/cms/features/internationalization"
    match: [i18n, localization]
  - id: draft-publish
    name: "Draft and Publish"
    source: "https://docs.strapi.io/cms/features/draft-and-publish"
    match: [draft-and-publish]
  - id: media-library
    name: "Media Library upload configuration"
    source: "https://docs.strapi.io/cms/features/media-library"
    match: [upload, media-library, sharp]
  - id: email
    name: "Email feature"
    source: "https://docs.strapi.io/cms/features/email"
    match: [email, sendgrid, providers]
  - id: preview
    name: "Preview"
    source: "https://docs.strapi.io/cms/features/preview"
    match: [preview, allowedorigins]
  - id: review-workflows
    name: "Review workflows"
    source: "https://docs.strapi.io/cms/features/review-workflows"
    match: [review-workflows]
  - id: sso
    name: "Single sign-on"
    source: "https://docs.strapi.io/cms/features/sso"
    match: [sso, local-auth-lockout]
  - id: custom-fields
    name: "Custom fields"
    source: "https://docs.strapi.io/cms/features/custom-fields"
    match: [custom-fields, customfields-register]
  - id: error-handling
    name: "Error handling"
    source: "https://docs.strapi.io/cms/error-handling"
    match: [errors, applicationerror]
  - id: db-migrations
    name: "Database migrations"
    source: "https://docs.strapi.io/cms/database-migrations"
    match: [migrations, knex]
  - id: db-transactions
    name: "Database transactions"
    source: "https://docs.strapi.io/cms/database-transactions"
    match: [transactions, rollback]
  - id: upgrade
    name: "Upgrade tool"
    source: "https://docs.strapi.io/cms/upgrade-tool"
    match: [upgrade, codemods]
  - id: templates
    name: "Templates"
    source: "https://docs.strapi.io/cms/templates"
    match: [templates, template-flag]
  - id: testing
    name: "Testing with Jest"
    source: "https://docs.strapi.io/cms/testing"
    match: [jest, supertest, testing]
  - id: docker
    name: "Docker development image"
    source: "https://docs.strapi.io/cms/installation/docker"
    match: [docker, dockerfile]
  - id: production-deploy
    name: "Production build and launch"
    source: "https://docs.strapi.io/cms/deployment"
    match: [deployment, production-build]
  - id: typescript
    name: "TypeScript"
    source: "https://docs.strapi.io/cms/typescript"
    match: [typescript, ts-generate-types]
