# Coverage spec for NetBox, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
# One topic per skill; topics follow the documentation pages.
subject: netbox
scope:
  category: computing-software
  field: systems-network-administration
  products: [netbox]
sources:
  - "NetBox documentation (netboxlabs.com/docs/netbox) - installation, configuration parameters, IPAM, DCIM, virtualization, circuits, power, tenancy, wireless, change logging, event rules, webhooks, config contexts, custom fields, validation, scripts, export templates, permissions, REST and GraphQL APIs, tokens, Prometheus, management commands, SSO."
topics:
  - id: api-token-fields
    name: "api token fields"
    source: https://netboxlabs.com/docs/netbox/models/users/token/
    match: [api-tokens, token-v2, allowed-ips]
  - id: application-service-templates
    name: "application service templates"
    source: https://netboxlabs.com/docs/netbox/features/ipam/
    match: [application-service, service-template, ports]
  - id: background-jobs-scheduling
    name: "background jobs scheduling"
    source: https://netboxlabs.com/docs/netbox/features/background-jobs/
    match: [background-jobs, rqworker, scheduled-jobs]
  - id: change-logging-records
    name: "change logging records"
    source: https://netboxlabs.com/docs/netbox/features/change-logging/
    match: [change-log, object-changes, changelog-message]
  - id: changelog-retention-settings
    name: "changelog retention settings"
    source: https://netboxlabs.com/docs/netbox/configuration/miscellaneous/
    match: [changelog-retention, changelog-skip-empty, enforce-global-unique]
  - id: circuits-providers-terminations
    name: "circuits providers terminations"
    source: https://netboxlabs.com/docs/netbox/features/circuits/
    match: [circuits, providers, circuit-termination]
  - id: config-context-merging
    name: "config context merging"
    source: https://netboxlabs.com/docs/netbox/features/context-data/
    match: [config-context, weight, local-context]
  - id: config-context-profiles
    name: "config context profiles"
    source: https://netboxlabs.com/docs/netbox/features/context-data/
    match: [context-profile, json-schema, schema-validation]
  - id: custom-fields-types
    name: "custom fields types"
    source: https://netboxlabs.com/docs/netbox/customization/custom-fields/
    match: [custom-fields, cf-prefix, custom-field-data]
  - id: custom-scripts-basics
    name: "custom scripts basics"
    source: https://netboxlabs.com/docs/netbox/customization/custom-scripts/
    match: [custom-scripts, script-class, run-method]
  - id: custom-validation-rules
    name: "custom validation rules"
    source: https://netboxlabs.com/docs/netbox/customization/custom-validation/
    match: [custom-validators, custom-validation, min-length]
  - id: data-validation-field-choices
    name: "data validation field choices"
    source: https://netboxlabs.com/docs/netbox/configuration/data-validation/
    match: [custom-validators, field-choices, data-validation]
  - id: default-permissions-exempt-view
    name: "default permissions exempt view"
    source: https://netboxlabs.com/docs/netbox/configuration/security/
