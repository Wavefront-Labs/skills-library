# Coverage spec: fastapi. Topics from the FastAPI docs (fastapi/fastapi, docs/en/docs).
subject: fastapi
scope:
  category: computing-software
  field: web-development
  products: [fastapi]
sources:
  - "FastAPI docs (raw markdown in github.com/fastapi/fastapi, docs/en/docs folder)"
topics:
  # Path and query parameters
  - id: path-parameters-and-types
    name: "Declare path parameters with Python types"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/path-params.md"
    match: [path-parameters, type-hints, int-parsing]
  - id: path-route-order-and-enum
    name: "Order path operations and restrict values with Enum"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/path-params.md"
    match: [route-order, enum, predefined-values, str-enum]
  - id: path-convertor-file-path
    name: "Accept file paths in a path parameter"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/path-params.md"
    match: [path-convertor, file-path]
  - id: path-numeric-validation
    name: "Validate numbers in path parameters"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/path-params-numeric-validations.md"
    match: [numeric-validation, ge-gt-le-lt]
  - id: query-parameter-defaults
    name: "Query parameters, defaults and required values"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/query-params.md"
    match: [query-parameters, defaults, optional-parameters, required-parameters, bool, type-conversion]
  - id: query-string-validation
    name: "Validate query strings with Annotated and Query"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/query-params-str-validations.md"
    match: [max-length, min-length, regex-pattern, none, optional-type]
  - id: query-list-values
    name: "Receive multiple query values as a list"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/query-params-str-validations.md"
    match: [list, repeated-parameters]
  - id: query-alias-and-hiding
    name: "Alias, deprecate and hide query parameters"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/query-params-str-validations.md"
    match: [alias, include-in-schema, after-validator, custom-validation]
  # Request body and models
  - id: request-body-model
    name: "Declare a request body with a Pydantic model"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/body.md"
    match: [request-body, basemodel]
  - id: body-multiple-parameters
    name: "Combine multiple body parameters and embed"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/body-multiple-params.md"
    match: [embed, multiple-body-parameters, singular-values]
  - id: body-field-validation
    name: "Validate model attributes with Field"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/body-fields.md"
    match: [field, json-schema-extra]
  - id: body-nested-models
    name: "Nested models, lists, sets and dicts in bodies"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/body-nested-models.md"
    match: [nested-models, httpurl, dict]
  - id: body-partial-updates
    name: "Update data with PUT and partial PATCH"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/body-updates.md"
    match: [patch, put, exclude-unset, model-copy]
  - id: extra-models-inheritance
    name: "Input, output and database models with inheritance and Union"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/extra-models.md"
    match: [inheritance, union, anyof, model-dump, password-hash]
  - id: parameter-models
    name: "Query, header and cookie parameter models"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/query-param-models.md"
    match: [parameter-models, pydantic-model, extra-forbid]
  - id: header-and-cookie-parameters
    name: "Read headers and cookies"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/header-params.md"
    match: [header-parameters, cookie-parameters, convert-underscores, duplicate-headers]
  - id: extra-data-types
    name: "Use UUID, datetime, Decimal and other data types"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/extra-data-types.md"
    match: [data-types, uuid, timedelta, decimal, frozenset]
  - id: jsonable-encoder
    name: "Convert data to JSON compatible values"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/encoder.md"
    match: [jsonable-encoder, serialization]
  - id: request-examples
    name: "Declare request example data"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/schema-extra-example.md"
    match: [examples, openapi-examples, model-config]
  # Responses
  - id: response-model-return-type
    name: "Filter output with response_model and return types"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/response-model.md"
    match: [response-model, return-type, output-model]
  - id: response-model-exclusions
    name: "Exclude unset, default and None values from responses"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/response-model.md"
    match: [exclude-unset, exclude-defaults, exclude-none, response-model-include, response-model-exclude]
  - id: response-status-codes
    name: "Declare response status codes"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/response-status-code.md"
    match: [status-code, http-status, fastapi-status]
  - id: path-operation-docs-config
    name: "Configure tags, summary, description and deprecation"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/path-operation-configuration.md"
    match: [path-operation, docstring, deprecated, response-description]
  - id: custom-response-classes
    name: "HTML, streaming, file and redirect responses"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/custom-response.md"
    match: [response-class, htmlresponse, streamingresponse, fileresponse, redirectresponse, custom-response]
  - id: response-parameter-headers-cookies
    name: "Set cookies, headers and status with a Response parameter"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/response-cookies.md"
    match: [response-parameter, set-cookie, response-headers, change-status-code]
  - id: return-response-directly
    name: "Return a Response directly"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/response-directly.md"
    match: [jsonresponse, return-response]
  - id: additional-openapi-responses
    name: "Document additional responses in OpenAPI"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/additional-responses.md"
    match: [additional-responses, media-type]
  # Errors, forms and files
  - id: http-exceptions
    name: "Return errors with HTTPException"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/handling-errors.md"
    match: [httpexception, error-handling, custom-headers]
  - id: custom-exception-handlers
    name: "Override and add exception handlers"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/handling-errors.md"
    match: [exception-handler, requestvalidationerror]
  - id: form-data
    name: "Receive form fields"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/request-forms.md"
    match: [forms, form-data, python-multipart]
  - id: file-uploads
    name: "Upload files with File and UploadFile"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/request-files.md"
    match: [file-upload, uploadfile, spooled-temporary-file]
  - id: form-models
    name: "Declare form fields with Pydantic models"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/request-form-models.md"
    match: [discriminated-union]
  # Dependency injection
  - id: dependency-basics
    name: "Share logic with Depends"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/dependencies/index.md"
    match: [dependency-injection, depends, shared-logic, type-alias]
  - id: class-dependencies
    name: "Use classes as dependencies"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/dependencies/classes-as-dependencies.md"
    match: [class-dependency, callable]
  - id: sub-dependencies
    name: "Chain sub-dependencies and caching"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/dependencies/sub-dependencies.md"
    match: [sub-dependencies, use-cache, dependency-tree]
  - id: decorator-global-dependencies
    name: "Dependencies in decorators, routers and the whole app"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/dependencies/global-dependencies.md"
    match: [dependencies-list, path-operation-decorator, global-dependencies]
  - id: yield-dependencies
    name: "Dependencies with yield, errors and scope"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/dependencies/dependencies-with-yield.md"
    match: [yield, cleanup, database-session, scope, early-exit, re-raise]
  # Security
  - id: oauth2-bearer-and-login
    name: "OAuth2 password flow with bearer tokens"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/security/first-steps.md"
    match: [oauth2, oauth2passwordbearer, bearer-token, oauth2passwordrequestform, token-endpoint]
  - id: jwt-and-password-hashing
    name: "JWT access tokens and password hashing"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/security/oauth2-jwt.md"
    match: [jwt, pyjwt, pwdlib, argon2, password-hashing]
  - id: http-basic-authentication
    name: "HTTP Basic authentication with safe comparison"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/security/http-basic-auth.md"
    match: [http-basic, httpbasiccredentials, compare-digest, www-authenticate]
  # Application structure and runtime
  - id: bigger-applications
    name: "Structure large apps with APIRouter"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/bigger-applications.md"
    match: [apirouter, include-router, bigger-applications, project-structure]
  - id: background-tasks
    name: "Run background tasks after the response"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/background-tasks.md"
    match: [background-tasks, add-task]
  - id: cors-configuration
    name: "Configure CORS"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/cors.md"
    match: [cors, corsmiddleware, preflight, allow-origins]
  - id: http-middleware
    name: "Write HTTP middleware"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/middleware.md"
    match: [middleware, call-next, execution-order]
  - id: api-metadata-and-docs-urls
    name: "Set API metadata and docs URLs"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/metadata.md"
    match: [metadata, openapi-tags, openapi-url, docs-url, redoc-url]
  - id: static-files
    name: "Serve static files"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/static-files.md"
    match: [static-files, staticfiles]
  - id: settings-environment
    name: "Settings with pydantic-settings and .env"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/settings.md"
    match: [settings, environment-variables, pydantic-settings, dotenv]
  - id: lifespan-events
    name: "Startup and shutdown with lifespan"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/events.md"
    match: [lifespan, startup, shutdown, asynccontextmanager]
  - id: websockets
    name: "WebSocket endpoints"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/websockets.md"
    match: [websockets, websocket, websocketdisconnect, websocketexception]
  - id: sub-applications
    name: "Mount sub applications"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/sub-applications.md"
    match: [sub-application, mount, independent-app]
  # Testing and debugging
  - id: testing-testclient
    name: "Test with TestClient and pytest"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/testing.md"
    match: [testing, testclient, pytest, httpx]
  - id: dependency-overrides
    name: "Override dependencies in tests"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/testing-dependencies.md"
    match: [dependency-overrides, mock]
  - id: debugging
    name: "Debug with uvicorn.run"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/tutorial/debugging.md"
    match: [debugging, breakpoints, name-main]
  # Deployment
  - id: behind-a-proxy
    name: "Run behind a proxy with root_path"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/advanced/behind-a-proxy.md"
    match: [proxy, root-path, forwarded-allow-ips, x-forwarded, openapi-servers]
  - id: docker-deployment
    name: "Build a Docker image for FastAPI"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/deployment/docker.md"
    match: [docker, dockerfile, container, kubernetes, exec-form]
  - id: fastapi-cli
    name: "Use fastapi dev and fastapi run"
    source: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/fastapi-cli.md"
    match: [cli, fastapi-dev, fastapi-run, entrypoint, auto-reload]
