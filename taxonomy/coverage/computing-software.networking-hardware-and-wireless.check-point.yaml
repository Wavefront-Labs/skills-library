    name: "Rulebase hit count, cleanup and rule review"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [hit-count, unused-rules, rulebase-cleanup]
