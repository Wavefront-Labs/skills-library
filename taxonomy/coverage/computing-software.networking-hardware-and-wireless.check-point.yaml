# Coverage spec: check-point. Topics from the external structures in `sources`.
subject: check-point
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [check-point]
sources:
  - "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives - checkpoint.com/training/certification"
  - "Check Point R81.20 Security Management, Gaia, ClusterXL, Site-to-Site VPN, Remote Access VPN, Threat Prevention, Logging and Monitoring Administration Guides - sc1.checkpoint.com/documents/R81.20"
  - "Check Point R81.20 CLI Reference Guide and Management API reference - sc1.checkpoint.com"
topics:
  - id: cpconfig-and-first-time-wizard
    name: "First Time Configuration Wizard and cpconfig"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [cpconfig, first-time-wizard, gateway-install]
  - id: gaia-clish-basics
    name: "Gaia clish and expert mode basics"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [clish, gaia, expert-mode]
  - id: gaia-interfaces-and-routing
    name: "Gaia interfaces, bonding and static routes"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [gaia-interfaces, bond, static-route]
  - id: backup-snapshot-and-migrate-export
    name: "Gaia backup, snapshot and migrate_server"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [backup, snapshot, migrate-export]
  - id: cpinfo-and-support-tools
    name: "cpinfo and diagnostic collection"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [cpinfo, diagnostics, support-package]
  - id: smartconsole-sessions-and-publish
    name: "SmartConsole sessions, publish and discard"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [smartconsole, publish, sessions]
  - id: policy-layers-and-inline-layers
    name: "Policy layers and inline layers"
    source: "Check Point CCSA R81.20 (156-215.81.20) and CCSE R81.20 (156-315.81.20) exam objectives"
    match: [policy-layers, inline-layer, ordered-layers]
