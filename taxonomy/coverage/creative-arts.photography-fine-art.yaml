# Coverage spec: fine-art photography (creative-arts / photography-fine-art).
# Topics come from external, authoritative structures, not from what the library already has:
# the PPA Certified Professional Photographer (CPP) exam content outline, Light Science and Magic,
# Ansel Adams' The Camera / The Negative / The Print, Ilford and Kodak technical datasheets,
# Christopher James' Book of Alternative Photographic Processes, Stroebel's View Camera Technique,
# the Adobe Lightroom Classic user guide ToC, Capture One docs, ICC / ISO permanence standards and
# fine-art printing references. Subtopics follow each source's own sub-sections.
subject: photography-fine-art
scope:
  category: creative-arts
  field: photography-fine-art
  products: [art-photography, conceptual-photography, darkroom-practice, large-format-cameras, adobe-lightroom, fine-art-printing, portfolio-and-exhibition]
sources:
  - "PPA Certified Professional Photographer (CPP) exam content outline (ppa.com/cpp) - camera operation and exposure, lighting (natural, studio, flash, ratios, patterns), composition and design, posing, colour theory and white balance, digital workflow, colour management, output"
  - "Hunter, Biver and Fuqua, Light Science and Magic (5th ed.) - ch.2 light (direction, quality, inverse square), ch.3 surfaces and the family of angles, ch.4 diffuse/direct/polarized reflection, ch.5 surfaces, ch.6 metal, ch.7 glass, ch.8 extremes (white-on-white, black-on-black), ch.9 people, ch.10 the moving subject/flash, ch.11 equipment"
  - "Ansel Adams, The Camera (exposure, lenses, depth of field), The Negative (zone system, previsualization, filters, sensitometry, development control), The Print (enlarging, printing controls, toning, processing and permanence)"
  - "Ilford and Kodak technical datasheets and application notes - film processing, fixer testing, washing (Ilford method), selenium/sepia toning, Multigrade split-grade printing, archival processing sequence; Kodak publications E-4 (C-41) / Z-119 (E-6 Kodak) / RA-4 summary"
  - "Christopher James, The Book of Alternative Photographic Processes (3rd ed.) - salt, cyanotype, Van Dyke brown, kallitype, platinum/palladium, gum bichromate, wet collodion, digital negatives; Steve Anchell, The Darkroom Cookbook (formulas, lith, toners)"
  - "Leslie Stroebel, View Camera Technique (7th ed.) - camera types, movements (rise/fall/shift/tilt/swing, Scheimpflug), focusing, lenses and image circle, exposure (bellows factor, reciprocity), sheet film handling"
  - "Adobe Lightroom Classic user guide ToC (helpx.adobe.com/lightroom-classic) - import, catalogs, Library (keywords, collections, metadata), Develop (profiles, basic, tone curve, HSL/colour grading, detail, lens corrections, transform, masking, healing/remove), photo merge, presets/sync/history, export and publish, Print module, external editing; Capture One user guide (sessions/catalogs, layers, colour editor, styles)"
  - "Fine-art printing references - ICC.1 profile spec and rendering intents; Jeff Schewe, The Digital Print; Epson/Canon pro printer user guides (driver, maintenance, ABW); ISO 18902 (albums, framing and storage materials), ISO 18916 (Photographic Activity Test), ISO 18920 (storage of processed prints), ISO 18941 / Wilhelm Imaging Research lightfastness; AIC and Library of Congress print care guidance"
  - "Portfolio and exhibition practice - Society for Photographic Education and FotoFest/Review Santa Fe portfolio review guidance; museum exhibition standards (AAM, lux levels for photographs); photobook production guides (Aperture, Self Publish Be Happy); US Copyright Office Circular 42 and group registration of photographs"
