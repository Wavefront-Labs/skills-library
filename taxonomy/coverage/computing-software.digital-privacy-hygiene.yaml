# Canonical coverage spec: Digital privacy & personal security hygiene (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (EFF Surveillance Self-Defense, CISA Secure
# Our World, NIST SP 800-63B-4, the Privacy Guides knowledge base and recommendation categories,
# OS vendor security/privacy guides, password-manager and Signal support docs, FTC scam guidance),
# not from what the library already has.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (SSD guide
# Depth round 2 added subtopics from the next level of each source (SSD guide sub-headings, Privacy Guides
# sub-pages, 800-63B sub-sections, CISA guidance, vendor settings articles per OS, password-manager and Signal docs).
# headings, 800-63B section numbers, Privacy Guides page sections, vendor support-article lists).
subject: digital-privacy-hygiene
scope:
  category: computing-software
  field: digital-privacy-hygiene
  products: [password-managers, two-factor-auth, vpn-tools, password-hygiene, device-hardening, privacy-configuration, phishing-awareness]
sources:
  - "EFF Surveillance Self-Defense (ssd.eff.org) - Basics (Your Security Plan, Seven Steps, Creating Strong Passwords, Communicating With Others, Keeping Your Data Safe, Why Metadata Matters, Choosing Your Tools), Tool Guides (Avoid Phishing, Delete Data Securely, Detect Bluetooth Trackers, Lockdown Mode, Enable 2FA, Encrypt iPhone, Encrypt Windows/Mac/Linux, Android and iPhone privacy settings, Manage Your Digital Footprint, Circumvent Censorship, Use Signal, Use Tor, Use WhatsApp), Further Learning (Attending a Protest, Choosing a Password Manager, Choosing a VPN, Signal Groups, Malware, Key Verification, Privacy Breakdown of Mobile Phones, AI Tools, Social Networks, Fingerprinting); subtopics from each guide's section headings"
  - "CISA Secure Our World (cisa.gov/secure-our-world) - use strong passwords and a password manager, turn on MFA, recognize and report phishing, update software; plus CISA personal guidance on phishing-resistant MFA, mobile communications best practice and home network security"
  - "NIST SP 800-63B-4 Digital Identity Guidelines - Authentication and Authenticator Management - 3.1.1 passwords, 3.1.2 look-up secrets, 3.1.3 out-of-band and PSTN restrictions, 3.1.4-3.1.5 OTP, 3.1.6-3.1.7 cryptographic authenticators and syncable authenticators, 3.2.2 rate limiting, 3.2.3 biometrics, 3.2.5 phishing resistance, 4.1 binding, 4.2 recovery (saved and issued recovery codes), 5 session management, Appendix A strength of passwords, Appendix B syncable authenticators"
  - "Privacy Guides (privacyguides.org) - Knowledge Base (Threat Modeling, Common Threats, Account Creation, Account Deletion, Passwords, Multifactor Authentication, Email Security, VPN Overview, DNS Overview, Tor Overview, Private Payments, Android/iOS/Linux/macOS/Windows overviews) and Recommendations (desktop and mobile browsers, browser extensions, DNS resolvers, DNS filtering, email aliasing, email services, cloud storage, data removal services, encryption software, metadata redaction, password managers, MFA tools, real-time communication, security keys, mobile phones, router firmware)"
  - "Vendor docs - Apple Platform Security guide and Apple Personal Safety User Guide (Lockdown Mode, Stolen Device Protection, Safety Check, Advanced Data Protection, Security Keys for Apple Account, Contact Key Verification); Android Help and Google Account Help (Private DNS, Theft Protection, Private Space, Advanced Protection, Privacy Checkup, Results about you); Microsoft Support (Windows Security, BitLocker, Windows Hello, Smart App Control, Memory Integrity, Controlled Folder Access, diagnostic data, Recall)"
  - "Password manager and messenger docs - Bitwarden Help Center (vault, generator, Send, emergency access, organisations, CLI, passkeys, export), 1Password Support (Secret Key, Emergency Kit, Watchtower, item sharing, CLI, SSH agent), KeePassXC User Guide (databases, key files, YubiKey challenge-response, browser integration, auto-type, merge); Signal Support Center (registration lock, safety numbers, disappearing messages, usernames, linked devices, groups, backups and transfer)"
  - "FTC Consumer Advice scam topics and reportfraud.ftc.gov, FBI IC3, APWG reporting, identitytheft.gov recovery steps"
