  - id: kubernetes-install-with-dapr-cli
    name: "Kubernetes install with dapr cli"
    source: "https://github.com/dapr/docs/blob/v1.15/daprdocs/content/en/operations/hosting/kubernetes/kubernetes-deploy.md"
    match: [kubernetes,dapr-cli,dapr-init,dapr-system,install,mtls]
  - id: kubernetes-install-with-helm
    name: "Kubernetes install with helm"
    source: "https://github.com/dapr/docs/blob/v1.15/daprdocs/content/en/operations/hosting/kubernetes/kubernetes-deploy.md"
