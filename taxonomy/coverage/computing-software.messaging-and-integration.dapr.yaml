    name: "Kubernetes upgrade control plane and sidecars"
    source: "https://github.com/dapr/docs/blob/v1.15/daprdocs/content/en/operations/hosting/kubernetes/kubernetes-upgrade.md"
    match: [kubernetes,upgrade,helm,crds,rollout-restart,dapr-upgrade]
