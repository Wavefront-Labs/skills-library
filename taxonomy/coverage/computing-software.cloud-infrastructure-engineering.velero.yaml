# Coverage spec: velero. Topics from the Velero docs (main).
subject: velero
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [velero]
sources:
  - "Velero docs (velero.io/docs/main)"
topics:
  - id: backup-and-restore-workflow
    name: "Backup and restore workflow"
    source: "https://velero.io/docs/main/how-velero-works/"
    match: [backup-workflow, restore-workflow, backupcontroller]
  - id: backup-ttl-and-garbage-collection
    name: "Backup TTL and garbage collection"
    source: "https://velero.io/docs/main/how-velero-works/"
    match: [ttl, garbage-collection, gc-failure]
  - id: object-storage-sync
    name: "Object storage sync"
    source: "https://velero.io/docs/main/how-velero-works/"
    match: [object-storage-sync, source-of-truth, cluster-migration]
  - id: schedule-create-and-trigger
    name: "Schedule create and manual trigger"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [schedule-create, cron, velero-schedule]
  - id: schedule-time-zones
    name: "Schedule time zones"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [cron-tz, time-zone, daylight-saving]
  - id: schedule-pause-and-skip-immediately
    name: "Schedule pause and skipImmediately"
    source: "https://velero.io/docs/main/api-types/schedule/"
    match: [schedule-paused, skipimmediately, lastskipped]
  - id: schedule-owner-references-gitops
    name: "Schedule owner references and GitOps"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [useownerreferencesinbackup, gitops, argocd]
  - id: exclude-item-from-backup-label
    name: "Exclude an item with a label"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [exclude-from-backup, label, velero-io-exclude-from-backup]
  - id: parallel-upload-concurrency
    name: "Parallel files and blocks upload"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [parallel-files-upload, parallel-blocks-upload, gomaxprocs]
  - id: ordered-resources-backup
    name: "Backup ordered resources"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [ordered-resources, backup-order, orderedresources]
  - id: backup-delete-semantics
    name: "Deleting backups"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [backup-delete, velero-backup-delete, orphaned-backup-cr]
  - id: api-pagination-client-page-size
    name: "Kubernetes API pagination"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [client-page-size, pagination, list-api]
  - id: object-storage-immutability-limits
    name: "Object storage immutability limits"
    source: "https://velero.io/docs/main/backup-reference/"
    match: [immutability, object-lock, finalizing]
  - id: backup-storage-locations
    name: "Backup storage locations"
    source: "https://velero.io/docs/main/locations/"
    match: [backup-location, backupstoragelocation, bsl]
  - id: volume-snapshot-locations
    name: "Volume snapshot locations"
    source: "https://velero.io/docs/main/locations/"
    match: [volume-snapshot-location, snapshot-location, vsl]
  - id: bsl-unique-credentials
    name: "BSL with unique credentials"
    source: "https://velero.io/docs/main/locations/"
    match: [bsl-credential, credential-secret, multiple-credentials]
  - id: restore-order-priorities
    name: "Restore resource order"
    source: "https://velero.io/docs/main/restore-reference/"
    match: [restore-order, restore-resource-priorities, velero-server]
  - id: restore-persistent-volumes
    name: "Restoring PVs and PVCs"
    source: "https://velero.io/docs/main/restore-reference/"
    match: [restore-pv, pv-rename, velero-clone]
  - id: restore-change-storage-class
    name: "Change storage class on restore"
    source: "https://velero.io/docs/main/restore-reference/"
    match: [change-storage-class, storageclass-mapping, restoreitemaction]
  - id: restore-change-image-names
    name: "Change image names on restore"
    source: "https://velero.io/docs/main/restore-reference/"
    match: [change-image-name, image-repository, restore-image-mapping]
  - id: restore-namespace-mappings
    name: "Restore into a different namespace"
    source: "https://velero.io/docs/main/restore-reference/"
    match: [namespace-mappings, restore-create, from-backup]
  - id: restore-existing-resource-policy
    name: "Existing resource policy"
    source: "https://velero.io/docs/main/restore-reference/"
    match: [existing-resource-policy, restore-update, non-destructive]
  - id: restore-detailed-workflow
    name: "Detailed restore workflow"
    source: "https://velero.io/docs/main/restore-reference/"
    match: [restore-phases, partiallyfailed, fs-backup-timeout]
  - id: backup-hooks-annotations
    name: "Backup hooks via annotations"
    source: "https://velero.io/docs/main/backup-hooks/"
    match: [backup-hooks, pre-hook, post-hook]
  - id: backup-hook-commands-and-results
    name: "Backup hook commands and results"
    source: "https://velero.io/docs/main/backup-hooks/"
    match: [hook-command, shell-hooks, hooksattempted]
  - id: restore-hooks-init-container
    name: "InitContainer restore hooks"
    source: "https://velero.io/docs/main/restore-hooks/"
    match: [initcontainer-restore-hook, restore-hooks, init-container]
  - id: restore-hooks-exec
    name: "Exec restore hooks"
    source: "https://velero.io/docs/main/restore-hooks/"
    match: [exec-restore-hook, post-hook-restore, wait-for-ready]
  - id: namespace-glob-patterns
    name: "Namespace glob patterns"
    source: "https://velero.io/docs/main/namespace-glob-patterns/"
    match: [namespace-glob, include-namespaces, exclude-namespaces]
  - id: resource-include-exclude-flags
    name: "Resource include and exclude flags"
    source: "https://velero.io/docs/main/resource-filtering/"
    match: [include-resources, exclude-resources, include-namespaces]
  - id: cluster-scoped-resource-filters
    name: "Cluster and namespace scoped filters"
    source: "https://velero.io/docs/main/resource-filtering/"
    match: [include-cluster-resources, include-cluster-scoped-resources, exclude-namespace-scoped-resources]
  - id: label-selector-filtering
    name: "Label selector filtering"
    source: "https://velero.io/docs/main/resource-filtering/"
    match: [label-selector, selector, or-selector]
  - id: resource-policies-configmap
    name: "Resource policies ConfigMap"
    source: "https://velero.io/docs/main/resource-filtering/"
    match: [resource-policies, resource-policies-configmap, resourcepolicy]
  - id: include-exclude-policy
    name: "includeExcludePolicy reusable filters"
    source: "https://velero.io/docs/main/resource-filtering/"
    match: [includeexcludepolicy, includedclusterscopedresources, reusable-filters]
  - id: namespace-selection-by-label
    name: "Namespace selection by label"
    source: "https://velero.io/docs/main/resource-filtering/"
    match: [includednamespacesbylabel, excludednamespacesbylabel, labelselectorlogic]
  - id: volume-policies
    name: "Volume policies"
    source: "https://velero.io/docs/main/resource-filtering/"
    match: [volumepolicies, volume-policy, skip]
  - id: fs-backup-install-node-agent
    name: "File System Backup install"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [file-system-backup, node-agent, use-node-agent]
  - id: fs-backup-repository-password
    name: "Backup repository password"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [velero-repo-credentials, repository-password, backupepository]
  - id: fs-backup-platform-hostpaths
    name: "Node agent platform tweaks"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [node-agent-daemonset, hostpath, openshift]
  - id: fs-backup-opt-in
    name: "FSB opt-in volume annotation"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [backup-volumes, opt-in, fs-backup-annotation]
  - id: fs-backup-opt-out
    name: "FSB opt-out approach"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [default-volumes-to-fs-backup, backup-volumes-excludes, opt-out]
  - id: fs-backup-limitations
    name: "FSB limitations"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [fsb-limitations, emptydir, orphan-pvc]
  - id: fs-restore-helper-config
    name: "FSB restore helper container"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [restore-wait, pod-volume-restore, fs-restore-action-config]
  - id: fs-restore-ownership-loss
    name: "FSB ownership and permission loss"
    source: "https://velero.io/docs/main/file-system-backup/"
    match: [chown, mount-constant-identity, azure-files]
  - id: csi-snapshot-backup-setup
    name: "CSI snapshot backup setup"
    source: "https://velero.io/docs/main/csi/"
    match: [csi, enablecsi, volumesnapshot]
  - id: csi-volumesnapshotclass-selection
    name: "VolumeSnapshotClass selection"
    source: "https://velero.io/docs/main/csi/"
    match: [volumesnapshotclass, csi-volumesnapshot-class, snapshotclass]
  - id: csi-data-movement-overview
    name: "CSI snapshot data movement overview"
    source: "https://velero.io/docs/main/csi-snapshot-data-movement/"
    match: [csi-snapshot-data-movement, velero-fs, velero-block]
  - id: csi-data-movement-setup
    name: "CSI data movement setup"
    source: "https://velero.io/docs/main/csi-snapshot-data-movement/"
    match: [csi-data-movement-setup, node-agent-disable-host-path, csisnapshotmetadataserviceconfigs]
  - id: csi-data-movement-backup-commands
    name: "CSI data movement backup commands"
    source: "https://velero.io/docs/main/csi-snapshot-data-movement/"
    match: [snapshot-move-data, data-mover, backup-type]
  - id: csi-data-movement-mixed-volume-policy
    name: "Mixing data movers via volume policy"
    source: "https://velero.io/docs/main/csi-snapshot-data-movement/"
    match: [mixed-data-movers, volume-policy, datamover-parameter]
  - id: csi-data-movement-restore
    name: "CSI data movement restore"
    source: "https://velero.io/docs/main/csi-snapshot-data-movement/"
    match: [datadownload, restore-data-movement, existing-volume-data-policy]
  - id: in-place-volume-restore
    name: "In-place volume data restore"
    source: "https://velero.io/docs/main/volume-data-inplace-restore/"
    match: [existing-volume-data-policy, in-place-restore, delete-extra-files]
  - id: in-place-restore-preparation
    name: "In-place restore preparation"
    source: "https://velero.io/docs/main/volume-data-inplace-restore/"
    match: [inplace-restore-prep, scale-to-zero, preflight-checks]
  - id: repository-maintenance-jobs
    name: "Repository maintenance jobs"
    source: "https://velero.io/docs/main/repository-maintenance/"
    match: [repository-maintenance, maintenance-job, repo-maintenance-job-configmap]
  - id: backup-repository-config
    name: "Backup repository configuration"
    source: "https://velero.io/docs/main/backup-repository-configuration/"
    match: [backup-repository-configmap, repositoryconfig, cachelimitmb]
  - id: node-agent-configmap-basics
    name: "Node-agent ConfigMap basics"
    source: "https://velero.io/docs/main/supported-configmaps/node-agent-configmap/"
    match: [node-agent-configmap, node-agent-config, rollout-restart]
  - id: node-agent-load-concurrency
    name: "Node-agent load concurrency"
    source: "https://velero.io/docs/main/node-agent-concurrency/"
    match: [loadconcurrency, perNodeConfig, globalconfig]
  - id: node-agent-load-affinity
    name: "Data movement node selection"
    source: "https://velero.io/docs/main/data-movement-node-selection/"
    match: [loadaffinity, node-selection, anti-affinity]
  - id: data-mover-pod-resources
    name: "Data mover pod resources"
    source: "https://velero.io/docs/main/data-movement-pod-resource-configuration/"
    match: [podresources, data-mover-memory, oom]
  - id: data-mover-priority-class
    name: "Data mover priority class"
    source: "https://velero.io/docs/main/data-movement-pod-resource-configuration/"
    match: [priorityclassname, data-mover-priority, node-agent-priority-class]
  - id: data-movement-backup-pvc
    name: "Data movement BackupPVC"
    source: "https://velero.io/docs/main/supported-configmaps/node-agent-configmap/"
    match: [backuppvc, readonly, spcnorelabeling]
  - id: data-movement-restore-pvc-and-cache
    name: "Restore PVC and cache PVC"
    source: "https://velero.io/docs/main/supported-configmaps/node-agent-configmap/"
    match: [restorepvc, ignoredelaybinding, cachepvc]
