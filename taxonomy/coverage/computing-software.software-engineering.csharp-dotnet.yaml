# Canonical coverage spec: C# language, .NET runtime, ASP.NET Core, EF Core and .NET tooling.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: csharp-dotnet-language
scope:
  category: computing-software
  field: software-engineering
  products: [csharp-dotnet]
sources:
  - "Microsoft Learn: C# documentation (learn.microsoft.com/dotnet/csharp) table of contents"
  - "Microsoft Learn: .NET fundamentals, runtime and diagnostics documentation"
  - "Microsoft Learn: ASP.NET Core documentation table of contents"
  - "Microsoft Learn: Entity Framework Core documentation"
  - "dotnet CLI reference, MSBuild reference, NuGet documentation"
  - "xUnit, BenchmarkDotNet, Polly and OpenTelemetry .NET documentation"
topics:
  - id: cs-types
    name: "Type system"
    source: "Microsoft Learn C# fundamentals: Types"
    match: [csharp-type-system]
    subtopics:
      - {id: cs-boxing, name: "Boxing, unboxing and value versus reference types", match: [boxing-unboxing]}
      - {id: cs-nrt, name: "Nullable reference types", match: [nullable-reference-types]}
      - {id: cs-flags, name: "Enums and flags enums", match: [flags-enums]}
      - {id: cs-tuples, name: "Tuples and deconstruction", match: [tuples-deconstruction]}
      - {id: cs-extmethods, name: "Extension methods and extension members", match: [extension-methods]}
  - id: cs-syntax
    name: "Modern C# syntax"
    source: "Microsoft Learn: What's new in C# 12, 13 and 14"
    match: [csharp-modern-syntax]
    subtopics:
      - {id: cs-primary, name: "Primary constructors", match: [primary-constructors]}
      - {id: cs-collexpr, name: "Collection expressions", match: [collection-expressions]}
      - {id: cs-rawstr, name: "Raw string literals", match: [raw-string-literals]}
      - {id: cs-required, name: "Required members and init-only setters", match: [required-members]}
      - {id: cs-field, name: "The field keyword and semi-auto properties", match: [field-keyword]}
  - id: cs-patterns
    name: "Pattern matching and records"
    source: "Microsoft Learn: Pattern matching, Records"
    match: [csharp-pattern-matching-records]
    subtopics:
      - {id: cs-patmatch, name: "Pattern matching and switch expressions", match: [csharp-pattern-matching]}
      - {id: cs-records, name: "Records and value equality", match: [csharp-records]}
      - {id: cs-listpat, name: "List and slice patterns", match: [list-patterns]}
  - id: cs-oop
    name: "Classes and object design"
    source: "Microsoft Learn: Object-oriented programming in C#"
    match: [csharp-oop]
    subtopics:
      - {id: cs-virtual, name: "virtual, override, new and sealed", match: [virtual-override-new]}
      - {id: cs-interfaces, name: "Default interface members", match: [default-interface-members]}
      - {id: cs-operators, name: "Operator overloading and conversions", match: [operator-overloading]}
      - {id: cs-indexers, name: "Indexers and ranges", match: [indexers-ranges]}
  - id: cs-strings
    name: "Strings and text"
    source: "Microsoft Learn: Strings, regular expressions and globalization"
    match: [csharp-strings-text]
    subtopics:
      - {id: cs-interp, name: "Interpolated string handlers", match: [interpolated-string-handlers]}
      - {id: cs-culture, name: "Culture-invariant formatting and comparison", match: [culture-invariant]}
      - {id: cs-regex, name: "Regex source generator", match: [regex-source-generator]}
      - {id: cs-encoding, name: "UTF-8 and text encoding", match: [utf8-encoding]}
  - id: cs-generics
    name: "Generics"
    source: "Microsoft Learn: Generics"
    match: [csharp-generics]
    subtopics:
      - {id: cs-constraints, name: "Constraints and variance", match: [generic-constraints]}
      - {id: cs-genmath, name: "Generic math and static abstract members", match: [generic-math]}
  - id: cs-delegates
