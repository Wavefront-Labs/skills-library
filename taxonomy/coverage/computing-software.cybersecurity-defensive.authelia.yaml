# Coverage spec: authelia. Topics from the official docs in sources.
subject: authelia
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [authelia]
sources:
  - "https://www.authelia.com/overview/prologue/introduction/"
topics:
  - id: access-control-check-policy-cli
    name: "Access control check policy cli"
    source: "https://www.authelia.com/reference/cli/authelia/authelia_access-control_check-policy/"
    match: [check-policy, access-control, cli]
  - id: access-control-default-policy-and-rules
    name: "Access control default policy and rules"
    source: "https://www.authelia.com/configuration/security/access-control/"
    match: [access-control, default-policy, rules]
  - id: access-control-domain-matching
    name: "Access control domain matching"
    source: "https://www.authelia.com/configuration/security/access-control/,"
    match: [access-control, domain, wildcard]
  - id: access-control-query-criteria
    name: "Access control query criteria"
    source: "https://www.authelia.com/configuration/security/access-control/"
    match: [access-control, query, operators]
  - id: access-control-regex-and-named-groups
    name: "Access control regex and named groups"
    source: "https://www.authelia.com/configuration/security/access-control/"
    match: [access-control, domain-regex, regular-expressions]
  - id: access-control-resources-and-methods
    name: "Access control resources and methods"
    source: "https://www.authelia.com/configuration/security/access-control/"
    match: [access-control, resources, methods]
  - id: access-control-rule-order-and-bypass
    name: "Access control rule order and bypass"
    source: "https://www.authelia.com/configuration/security/access-control/"
    match: [access-control, rule-matching, ordering]
  - id: authz-authn-strategies-and-basic-cache
    name: "Authz authn strategies and basic cache"
    source: "https://www.authelia.com/configuration/miscellaneous/server-endpoints-authz/,"
    match: [authn-strategies, cookie-session, header-authorization]
  - id: authz-endpoint-implementations
    name: "Authz endpoint implementations"
    source: "https://www.authelia.com/configuration/miscellaneous/server-endpoints-authz/,"
    match: [forward-auth, ext-authz, auth-request]
  - id: authz-response-headers-and-user-attributes
    name: "Authz response headers and user attributes"
    source: "https://www.authelia.com/configuration/miscellaneous/server-endpoints-authz/,"
    match: [remote-user, remote-groups, trusted-header-sso]
  - id: config-validate-and-template-cli
    name: "Config validate and template cli"
    source: "https://www.authelia.com/reference/cli/authelia/authelia_config_validate/,"
    match: [config-validate, config-template, preflight]
  - id: configuration-files-formats-and-filters
    name: "Configuration files formats and filters"
    source: "https://www.authelia.com/configuration/methods/files/,"
    match: [configuration-files, yaml, toml]
  - id: dev-endpoints-and-csp-template
    name: "Dev endpoints and csp template"
    source: "https://www.authelia.com/configuration/miscellaneous/server/,"
    match: [pprof, expvar, content-security-policy]
  - id: docker-compose-deployment-and-secrets
    name: "Docker compose deployment and secrets"
    source: "https://www.authelia.com/integration/deployment/docker/"
    match: [docker, docker-compose, puid]
  - id: duo-push-notifications
    name: "Duo push notifications"
    source: "https://www.authelia.com/configuration/second-factor/duo/"
    match: [duo, push-notification, mfa]
  - id: elevated-sessions
    name: "Elevated sessions"
    source: "https://www.authelia.com/configuration/identity-validation/elevated-session/"
    match: [elevated-session, identity-validation, one-time-code]
  - id: endpoint-rate-limits
    name: "Endpoint rate limits"
    source: "https://www.authelia.com/configuration/miscellaneous/server-endpoint-rate-limits/"
    match: [rate-limiting, token-bucket, brute-force]
  - id: environment-variables-and-secret-files
    name: "Environment variables and secret files"
    source: "https://www.authelia.com/configuration/methods/environment/,"
    match: [environment-variables, secrets, file-suffix]
  - id: file-user-database
    name: "File user database"
    source: "https://www.authelia.com/configuration/first-factor/file/,"
    match: [file-backend, users-database, yaml]
  - id: filesystem-notifier-and-events
    name: "Filesystem notifier and events"
    source: "https://www.authelia.com/configuration/notifications/file/,"
    match: [notifier, filesystem, notification-events]
  - id: health-endpoints-and-probes
    name: "Health endpoints and probes"
    source: "https://www.authelia.com/configuration/miscellaneous/server/"
    match: [health-check, readiness-probe, liveness-probe]
  - id: kubernetes-deployment-notes
    name: "Kubernetes deployment notes"
    source: "https://www.authelia.com/integration/kubernetes/introduction/,"
    match: [kubernetes, helm-chart, enableservicelinks]
  - id: ldap-backend-connection
    name: "Ldap backend connection"
    source: "https://www.authelia.com/configuration/first-factor/ldap/,"
    match: [ldap, ldaps, starttls]
  - id: ldap-group-search-memberof-mode
    name: "Ldap group search memberof mode"
    source: "https://www.authelia.com/integration/ldap/introduction/,"
    match: [ldap, memberof, group-search-mode]
  - id: ldap-implementations-and-filters
    name: "Ldap implementations and filters"
    source: "https://www.authelia.com/configuration/first-factor/ldap/,"
    match: [ldap, active-directory, freeipa]
  - id: logging-and-troubleshooting
    name: "Logging and troubleshooting"
    source: "https://www.authelia.com/configuration/miscellaneous/logging/,"
    match: [logging, log-level, json-logs]
  - id: ntp-startup-check
    name: "Ntp startup check"
    source: "https://www.authelia.com/configuration/miscellaneous/ntp/"
    match: [ntp, time-sync, totp]
  - id: oidc-authorization-policies
    name: "Oidc authorization policies"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/provider/,"
    match: [openid-connect, authorization-policy, rbac]
  - id: oidc-claims-policies-and-custom-scopes
    name: "Oidc claims policies and custom scopes"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/provider/,"
    match: [openid-connect, claims-policy, custom-scopes]
  - id: oidc-client-consent-modes
    name: "Oidc client consent modes"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/clients/,"
    match: [openid-connect, consent, consent-mode]
  - id: oidc-client-registration
    name: "Oidc client registration"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/clients/"
    match: [openid-connect, oidc-client, client-id]
  - id: oidc-cors-configuration
    name: "Oidc cors configuration"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/provider/"
    match: [openid-connect, cors, allowed-origins]
  - id: oidc-provider-hmac-and-signing-keys
    name: "Oidc provider hmac and signing keys"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/provider/"
    match: [openid-connect, oidc, jwks]
  - id: oidc-provider-pkce-and-hardening
    name: "Oidc provider pkce and hardening"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/provider/,"
    match: [openid-connect, pkce, par]
  - id: oidc-token-lifespans
    name: "Oidc token lifespans"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/provider/,"
    match: [openid-connect, token-lifespan, access-token]
  - id: password-hashing-algorithms-and-cli
    name: "Password hashing algorithms and cli"
    source: "https://www.authelia.com/configuration/first-factor/file/,"
    match: [argon2, argon2id, scrypt]
  - id: password-policy
    name: "Password policy"
    source: "https://www.authelia.com/configuration/security/password-policy/"
    match: [password-policy, zxcvbn, password-strength]
  - id: password-reset-and-change-options
    name: "Password reset and change options"
    source: "https://www.authelia.com/configuration/identity-validation/reset-password/,"
    match: [password-reset, jwt, identity-validation]
  - id: privacy-policy-link-and-acceptance
    name: "Privacy policy link and acceptance"
    source: "https://www.authelia.com/configuration/miscellaneous/privacy-policy/"
    match: [privacy-policy, gdpr, user-acceptance]
  - id: prometheus-metrics-exporter
    name: "Prometheus metrics exporter"
    source: "https://www.authelia.com/configuration/telemetry/metrics/"
    match: [prometheus, metrics, telemetry]
  - id: random-secret-generation-cli
    name: "Random secret generation cli"
    source: "https://www.authelia.com/reference/cli/authelia/authelia_crypto_rand/"
    match: [crypto-rand, secrets, random-string]
  - id: regulation-bans-and-modes
    name: "Regulation bans and modes"
    source: "https://www.authelia.com/configuration/security/regulation/"
    match: [regulation, brute-force, ban]
  - id: server-listener-address-and-tls
    name: "Server listener address and tls"
    source: "https://www.authelia.com/configuration/miscellaneous/server/"
    match: [server-address, listener, tls]
  - id: session-cookie-domains
    name: "Session cookie domains"
    source: "https://www.authelia.com/configuration/session/introduction/"
    match: [session, cookies, authelia-url]
  - id: session-redis-provider
    name: "Session redis provider"
    source: "https://www.authelia.com/configuration/session/redis/,"
    match: [redis, session-provider, stateless]
  - id: session-redis-sentinel-high-availability
    name: "Session redis sentinel high availability"
    source: "https://www.authelia.com/configuration/session/redis/"
    match: [redis-sentinel, high-availability, session-storage]
  - id: session-timeouts-and-remember-me
    name: "Session timeouts and remember me"
    source: "https://www.authelia.com/configuration/session/introduction/"
    match: [session, inactivity, expiration]
  - id: smtp-notifier
    name: "Smtp notifier"
    source: "https://www.authelia.com/configuration/notifications/smtp/"
    match: [smtp, notifier, email]
  - id: storage-bans-cli
    name: "Storage bans cli"
    source: "https://www.authelia.com/reference/cli/authelia/authelia_storage_bans_ip_add/,"
    match: [storage-bans, cli, regulation]
  - id: storage-encryption-key-rotation
    name: "Storage encryption key rotation"
    source: "https://www.authelia.com/reference/cli/authelia/authelia_storage_encryption_check/,"
    match: [storage-encryption, change-key, encryption-check]
  - id: storage-migrations-and-downgrades
    name: "Storage migrations and downgrades"
    source: "https://www.authelia.com/configuration/storage/migrations/,"
    match: [schema-migration, storage-migrate, downgrade]
  - id: storage-postgres-and-sqlite
    name: "Storage postgres and sqlite"
    source: "https://www.authelia.com/configuration/storage/introduction/,"
    match: [storage, postgresql, sqlite]
  - id: totp-and-webauthn-storage-cli
    name: "Totp and webauthn storage cli"
    source: "https://www.authelia.com/reference/cli/authelia/authelia_storage_user_totp_export_png/,"
    match: [totp, webauthn, storage-user]
  - id: totp-settings-and-compatibility
    name: "Totp settings and compatibility"
    source: "https://www.authelia.com/configuration/second-factor/time-based-one-time-password/"
    match: [totp, one-time-password, authenticator-app]
  - id: user-opaque-identifiers-cli
    name: "User opaque identifiers cli"
    source: "https://www.authelia.com/configuration/identity-providers/openid-connect/clients/,"
    match: [openid-connect, subject-identifier, sector-identifier]
  - id: validating-forwarded-authentication
    name: "Validating forwarded authentication"
    source: "https://www.authelia.com/reference/guides/validating-forwarded-authentication/"
    match: [forwarded-headers, validation, x-forwarded-for]
  - id: webauthn-aaguid-filtering-and-metadata
    name: "Webauthn aaguid filtering and metadata"
    source: "https://www.authelia.com/configuration/second-factor/webauthn/,"
    match: [webauthn, aaguid, attestation]
  - id: webauthn-passkeys-and-selection
    name: "Webauthn passkeys and selection"
    source: "https://www.authelia.com/configuration/second-factor/webauthn/"
    match: [webauthn, passkeys, fido2]
