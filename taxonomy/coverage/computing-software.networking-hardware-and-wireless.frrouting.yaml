# Coverage spec: frrouting. Topics from the FRR user guide pages named in `sources`.
subject: frrouting
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [frrouting]
sources:
  - "FRR docs basic page (https://docs.frrouting.org/en/latest/basic.html)"
  - "FRR docs vtysh page (https://docs.frrouting.org/en/latest/vtysh.html)"
  - "FRR docs extlog page (https://docs.frrouting.org/en/latest/extlog.html)"
  - "FRR docs setup page (https://docs.frrouting.org/en/latest/setup.html)"
  - "FRR docs frr-reload page (https://docs.frrouting.org/en/latest/frr-reload.html)"
  - "FRR docs watchfrr page (https://docs.frrouting.org/en/latest/watchfrr.html)"
  - "FRR docs filter page (https://docs.frrouting.org/en/latest/filter.html)"
  - "FRR docs routemap page (https://docs.frrouting.org/en/latest/routemap.html)"
  - "FRR docs zebra page (https://docs.frrouting.org/en/latest/zebra.html)"
  - "FRR docs nexthop_groups page (https://docs.frrouting.org/en/latest/nexthop_groups.html)"
  - "FRR docs static page (https://docs.frrouting.org/en/latest/static.html)"
  - "FRR docs bgp page (https://docs.frrouting.org/en/latest/bgp.html)"
  - "FRR docs evpn page (https://docs.frrouting.org/en/latest/evpn.html)"
  - "FRR docs bmp page (https://docs.frrouting.org/en/latest/bmp.html)"
  - "FRR docs ospfd page (https://docs.frrouting.org/en/latest/ospfd.html)"
  - "FRR docs ospf6d page (https://docs.frrouting.org/en/latest/ospf6d.html)"
  - "FRR docs isisd page (https://docs.frrouting.org/en/latest/isisd.html)"
  - "FRR docs bfd page (https://docs.frrouting.org/en/latest/bfd.html)"
  - "FRR docs pim page (https://docs.frrouting.org/en/latest/pim.html)"
  - "FRR docs vrrp page (https://docs.frrouting.org/en/latest/vrrp.html)"
  - "FRR docs pbr page (https://docs.frrouting.org/en/latest/pbr.html)"
topics:
  - id: administrative-distance-and-route-replace
    name: administrative distance and route replace
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, administrative-distance, kernel-metric, route-replace, import-table]
  - id: bfd-peers-and-integration
    name: bfd peers and integration
    source: "https://docs.frrouting.org/en/latest/bfd.html"
    match: [bfdd, bfd, multihop, echo-mode, profile, authentication, static-route-bfd]
  - id: bgp-address-families-and-activation
    name: bgp address families and activation
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, address-family, activate, ipv6-unicast, safi, bgp-default]
  - id: bgp-as-path-manipulation
    name: bgp as path manipulation
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, as-path, as-path-access-list, prepend, allowas-in, as-override, local-as, regex]
  - id: bgp-best-path-selection
    name: bgp best path selection
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, best-path, med, deterministic-med, compare-routerid, always-compare-med, aigp]
  - id: bgp-bmp-monitoring
    name: bgp bmp monitoring
    source: "https://docs.frrouting.org/en/latest/bmp.html"
    match: [bgpd, bmp, monitoring, telemetry, route-mirroring, loc-rib]
  - id: bgp-communities-and-lists
    name: bgp communities and lists
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, community, community-list, well-known-communities, blackhole, send-community, alias]
  - id: bgp-conditional-advertisement
    name: bgp conditional advertisement
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, conditional-advertisement, advertise-map, exist-map, non-exist-map, add-path]
  - id: bgp-evpn-configuration
    name: bgp evpn configuration
    source: "https://docs.frrouting.org/en/latest/evpn.html"
    match: [bgpd, evpn, vxlan, vni, route-target, type-5, advertise-svi-ip, advertise-pip]
  - id: bgp-graceful-restart-and-shutdown
    name: bgp graceful restart and shutdown
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, graceful-restart, graceful-shutdown, llgr, rfc8203, admin-shutdown]
  - id: bgp-instance-and-policy-defaults
    name: bgp instance and policy defaults
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, router-bgp, router-id, ebgp-requires-policy, import-check, as-notation]
  - id: bgp-l3vpn-route-leaking
    name: bgp l3vpn route leaking
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, l3vpn, route-leaking, rd, route-target, import-vrf, srv6-vpn, mpls-vpn]
  - id: bgp-large-and-extended-communities
    name: bgp large and extended communities
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, large-community, extcommunity, route-target, soo, extcommunity-list]
  - id: bgp-multipath-and-link-bandwidth
    name: bgp multipath and link bandwidth
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, maximum-paths, multipath-relax, link-bandwidth, weighted-ecmp, extcommunity-bandwidth]
  - id: bgp-neighbor-policy-and-soft-reconfig
    name: bgp neighbor policy and soft reconfig
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, neighbor-route-map, prefix-list, filter-list, soft-reconfiguration, clear-bgp, maximum-prefix]
  - id: bgp-neighbor-session-setup
    name: bgp neighbor session setup
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, neighbor, remote-as, update-source, ebgp-multihop, ttl-security, md5-password, local-as]
  - id: bgp-peer-groups-and-listen-ranges
    name: bgp peer groups and listen ranges
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, peer-group, listen-range, dynamic-neighbors, update-groups, optmem-max]
  - id: bgp-roles-and-route-server
    name: bgp roles and route server
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, route-server, bgp-roles, otc, rfc9234, ixp]
  - id: bgp-route-origination
    name: bgp route origination
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, network, redistribute, aggregate-address, summary-only, default-originate, table-map]
  - id: bgp-route-reflector-and-solo
    name: bgp route reflector and solo
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, route-reflector, cluster-id, ibgp, attribute-unchanged, next-hop-self]
  - id: bgp-rpki-origin-validation
    name: bgp rpki origin validation
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, rpki, origin-validation, rtr, aspa, route-map-match-rpki]
  - id: bgp-show-and-debug-commands
    name: bgp show and debug commands
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, show-bgp, debug-bgp, clear-bgp, troubleshooting, update-groups]
  - id: bgp-startup-delay-and-fib-suppression
    name: bgp startup delay and fib suppression
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, update-delay, advertisement-delay, suppress-fib-pending, end-of-rib]
  - id: bgp-timers-and-tcp-tuning
    name: bgp timers and tcp tuning
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, timers, keepalive, hold-time, advertisement-interval, tcp-keepalive, fast-convergence]
  - id: bgp-unnumbered-and-extended-nexthop
    name: bgp unnumbered and extended nexthop
    source: "https://docs.frrouting.org/en/latest/bgp.html"
    match: [bgpd, bgp-unnumbered, interface-neighbor, v6only, extended-nexthop, ipv6-link-local]
  - id: config-versioning-and-profiles
    name: config versioning and profiles
    source: "https://docs.frrouting.org/en/latest/basic.html"
    match: [frr-version, frr-defaults, traditional, datacenter, upgrade]
  - id: daemon-common-startup-options
    name: daemon common startup options
    source: "https://docs.frrouting.org/en/latest/setup.html"
    match: [daemon-options, vrf-default-name, network-namespace, modules, limit-fds]
  - id: daemons-file-and-service-control
    name: daemons file and service control
    source: "https://docs.frrouting.org/en/latest/setup.html"
    match: [daemons-file, systemd, vtysh-enable, network-namespace, service-reload]
  - id: exec-mode-diagnostics
    name: exec mode diagnostics
    source: "https://docs.frrouting.org/en/latest/basic.html"
    match: [show-memory, show-event, cputime-warning, walltime-warning, find, yang]
  - id: extended-logging-targets
    name: extended logging targets
    source: "https://docs.frrouting.org/en/latest/extlog.html"
    match: [log-extended, rfc5424, journald, syslog, structured-data]
  - id: fpm-and-dataplane-plugins
    name: fpm and dataplane plugins
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, fpm, dplane-fpm-nl, dpdk, dataplane, netlink]
  - id: frr-config-and-saving
    name: frr config and saving
    source: "https://docs.frrouting.org/en/latest/basic.html"
    match: [frr-conf, integrated-config, write-memory, vtysh, running-config]
  - id: frr-reload-script
    name: frr reload script
    source: "https://docs.frrouting.org/en/latest/frr-reload.html"
    match: [frr-reload, config-delta, reload, test, overwrite]
  - id: ip-forwarding-sysctls
    name: ip forwarding sysctls
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [sysctl, ip-forward, ipv6-forwarding, arp, ndisc, linux-kernel]
  - id: isis-fast-reroute-and-segment-routing
    name: isis fast reroute and segment routing
    source: "https://docs.frrouting.org/en/latest/isisd.html"
    match: [isisd, isis, lfa, ti-lfa, segment-routing, srv6, flex-algo, mpls-te]
  - id: isis-process-and-interfaces
    name: isis process and interfaces
    source: "https://docs.frrouting.org/en/latest/isisd.html"
    match: [isisd, isis, net, metric-style, circuit-type, overload-bit, lsp-timers, redistribute]
  - id: log-filtering-and-debug-backtrace
    name: log filtering and debug backtrace
    source: "https://docs.frrouting.org/en/latest/basic.html"
    match: [log-filter-text, unique-id, backtrace, debug, filtered-file]
  - id: logging-destinations
    name: logging destinations
    source: "https://docs.frrouting.org/en/latest/basic.html"
    match: [logging, log-file, syslog, log-stdout, log-level, timestamp]
  - id: mpls-labels-and-static-lsp
    name: mpls labels and static lsp
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, mpls, static-lsp, label-manager, dynamic-block, lsr, ler]
  - id: nexthop-group-configuration
    name: nexthop group configuration
    source: "https://docs.frrouting.org/en/latest/nexthop_groups.html"
    match: [nexthop-group, backup-group, resilient, weight, label, vni]
  - id: nexthop-tracking
    name: nexthop tracking
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, nht, nexthop-tracking, resolve-via-default, pbr-nexthop-resolve]
  - id: ospf-external-routes-and-graceful-restart
    name: ospf external routes and graceful restart
    source: "https://docs.frrouting.org/en/latest/ospfd.html"
    match: [ospfd, ospf, redistribute, default-information, summary-address, graceful-restart, helper]
  - id: ospf-interface-settings-and-auth
    name: ospf interface settings and auth
    source: "https://docs.frrouting.org/en/latest/ospfd.html"
    match: [ospfd, ospf, hello-interval, dead-interval, network-type, message-digest, key-chain, pacing]
  - id: ospf-process-and-areas
    name: ospf process and areas
    source: "https://docs.frrouting.org/en/latest/ospfd.html"
    match: [ospfd, ospf, areas, stub, nssa, virtual-link, area-range, spf-throttle]
  - id: ospf6-process-and-interfaces
    name: ospf6 process and interfaces
    source: "https://docs.frrouting.org/en/latest/ospf6d.html"
    match: [ospf6d, ospfv3, ipv6, authentication-trailer, redistribute, graceful-restart]
  - id: pbr-policy-routing
    name: pbr policy routing
    source: "https://docs.frrouting.org/en/latest/pbr.html"
    match: [pbrd, pbr, policy-based-routing, pbr-map, nexthop-group, fwmark]
  - id: pim-igmp-multicast
    name: pim igmp multicast
    source: "https://docs.frrouting.org/en/latest/pim.html"
    match: [pimd, pim, igmp, multicast, rendezvous-point, bsr, msdp, ssm]
  - id: prefix-lists-and-access-lists
    name: prefix lists and access lists
    source: "https://docs.frrouting.org/en/latest/filter.html"
    match: [prefix-list, access-list, ge-le, sequence-numbers, implicit-deny]
  - id: route-map-flow-control
    name: route map flow control
    source: "https://docs.frrouting.org/en/latest/routemap.html"
    match: [route-map, call, on-match, continue, default-deny, optimization]
  - id: route-map-match-and-set
    name: route map match and set
    source: "https://docs.frrouting.org/en/latest/routemap.html"
    match: [route-map, match, set, local-preference, next-hop, metric, tag]
  - id: static-route-multipath-and-floating
    name: static route multipath and floating
    source: "https://docs.frrouting.org/en/latest/static.html"
    match: [staticd, ecmp, floating-static, backup-route, bfd, weight]
  - id: static-routes-configuration
    name: static routes configuration
    source: "https://docs.frrouting.org/en/latest/static.html"
    match: [staticd, ip-route, ipv6-route, blackhole, reject, nexthop-vrf, source-specific, srv6]
  - id: vrrp-virtual-router
    name: vrrp virtual router
    source: "https://docs.frrouting.org/en/latest/vrrp.html"
    match: [vrrpd, vrrp, macvlan, virtual-ip, high-availability, first-hop-redundancy]
  - id: vty-passwords-and-access
    name: vty passwords and access
    source: "https://docs.frrouting.org/en/latest/basic.html"
    match: [vty, password, enable-password, exec-timeout, access-class, line-vty]
  - id: vtysh-usage-and-options
    name: vtysh usage and options
    source: "https://docs.frrouting.org/en/latest/vtysh.html"
    match: [vtysh, vtysh-conf, pager, exec-timeout, ping, traceroute]
  - id: watchfrr-monitoring
    name: watchfrr monitoring
    source: "https://docs.frrouting.org/en/latest/watchfrr.html"
    match: [watchfrr, daemon-restart, show-watchfrr, watchfrr-ignore]
  - id: zebra-ecmp-and-nexthop-weights
    name: zebra ecmp and nexthop weights
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, ecmp, multipath, nexthop-weight, resilient-nexthop-group, nexthop-group]
  - id: zebra-interface-configuration
    name: zebra interface configuration
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, interface, ip-address, link-detect, bandwidth, link-params, te]
  - id: zebra-rib-show-commands
    name: zebra rib show commands
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, show-ip-route, rib, router-id, vrf, json-brief, debug-zebra]
  - id: zebra-route-maps-and-source-address
    name: zebra route maps and source address
    source: "https://docs.frrouting.org/en/latest/zebra.html"
    match: [zebra, ip-protocol-route-map, set-src, route-map-delay-timer, kernel-routes]
