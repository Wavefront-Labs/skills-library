# Canonical coverage spec: Software Engineering (whole field, 15 products).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (SWEBOK v4 knowledge areas, the official
# language/tool documentation tables of contents, the Pro Git book, Fowler's Refactoring catalog,
# the GoF Design Patterns catalog, Google's engineering-practices review guide, platform developer
# guides), not from what we happened to write, so the check measures the library against the subject.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (book chapter
# sub-sections, docs page headings, catalog entries, CLI sub-commands).
subject: software-engineering
scope:
  category: computing-software
  field: software-engineering
  products: [git, python, java, typescript, csharp-dotnet, go, rust, cpp, api-design, software-architecture, refactoring, debugging, code-review, concurrency, mobile-development]
sources:
  - "SWEBOK v4 (IEEE Computer Society) knowledge areas - Software Requirements, Software Architecture (concepts, description/views, styles and patterns, evaluation), Software Design (principles, design patterns, quality analysis), Software Construction (construction for reuse, languages, coding, testing, tooling), Software Testing, Software Maintenance (refactoring, reengineering, migration), Software Configuration Management (version control, release management), Software Quality (reviews), Software Security; sub-areas used for architecture, review and debugging subtopics"
  - "Pro Git, 2nd ed. (Chacon & Straub, git-scm.com/book) - 2 Git Basics (recording changes, viewing history, undoing things, remotes, tagging, aliases), 3 Branching (basic branching and merging, branch management, workflows, remote branches, rebasing), 5 Distributed Git (workflows, contributing, maintaining), 7 Git Tools (revision selection, interactive staging, stashing, signing, searching, rewriting history, reset demystified, advanced merging, rerere, debugging, submodules, bundling, credential storage), 8 Customizing Git (config, attributes, hooks), 10 Git Internals (objects, references, packfiles, refspec, transfer protocols, maintenance and data recovery); plus git-scm.com reference for worktree, sparse-checkout, scalar, maintenance, filter-repo"
  - "Python docs (docs.python.org/3) - Language Reference (data model, execution model, compound statements), Library Reference (logging, pathlib, argparse, datetime/zoneinfo, json, re, collections, itertools, functools, concurrent.futures, multiprocessing, threading, subprocess, unittest.mock, typing), HOWTOs (logging, descriptors, regex, sorting, free-threading); typing spec and mypy docs; Python Packaging User Guide; PEP 8, PEP 621, PEP 703"
  - "dev.java Learn ToC and the Java Language Specification - records, sealed classes, pattern matching, generics, enums, exceptions, lambdas/streams, Optional, modules (JPMS); JDK Tools reference (jcmd, jfr, jmap, jstack, jlink); Maven docs (POM, lifecycle, dependency management/BOM, multi-module); Gradle docs (Kotlin DSL, version catalogs, multi-project builds); Spring Boot / Spring Data / Spring Security reference; JUnit 5 user guide, Mockito, Testcontainers"
  - "TypeScript Handbook and TSConfig reference (typescriptlang.org) - everyday types, narrowing, functions, object types, type manipulation (generics, keyof, typeof, indexed access, conditional, mapped, template literal types), classes, modules, declaration files, project references; Node.js docs (event loop, streams, worker_threads, process, test runner); npm docs (package.json, scripts, workspaces, publish, audit, overrides); MDN JavaScript guide (promises, closures, this, prototypes, iterators/generators)"
  - "Microsoft Learn .NET / C# docs ToC - C# language (nullable reference types, records, pattern matching, LINQ, generics, Span<T>, IDisposable), asynchronous programming, ASP.NET Core fundamentals (middleware, DI, configuration, options, logging, authentication, health checks), EF Core (migrations, change tracking, performance, concurrency, raw SQL), .NET CLI, MSBuild, NuGet (packing, central package management), deployment (trimming, Native AOT), diagnostics tools (dotnet-counters, dotnet-trace, dotnet-dump), BenchmarkDotNet, xUnit testing"
  - "Go docs (go.dev/doc) - Effective Go, The Go Programming Language Specification, go command reference (build, test, mod, work, vet, generate, env), Go Modules Reference, Go blog (errors, context, generics, pipelines, fuzzing, slog, PGO), net/http, encoding/json, database/sql, log/slog, runtime/pprof package docs, govulncheck"
  - "The Rust Programming Language book chapters (ownership, structs/enums, modules, collections, error handling, generics/traits/lifetimes, tests, closures/iterators, smart pointers, fearless concurrency, async, OOP features, patterns, advanced features/unsafe, macros), The Cargo Book (workspaces, features, profiles, build scripts, publishing), The Rustonomicon (unsafe, FFI, Send/Sync), Rust API Guidelines, Clippy docs, tokio tutorial"
  - "C++ Core Guidelines (isocpp) sections R (resource management), C (classes), T (templates/concepts), CP (concurrency), ES (expressions), P (philosophy); cppreference.com language/library sections (templates, constraints/concepts, constexpr, lambdas, optional/variant, ranges, string_view, thread, atomic, memory_order); CMake documentation (targets, presets, toolchains, find_package); GCC/Clang warning and sanitizer docs; SEI CERT C Coding Standard"
  - "API design - Google API Improvement Proposals (AIP-121 resource-oriented design, 131-135 standard methods, 136 custom methods, 132 list/pagination, 160 filtering, 180 backwards compatibility, 185 versioning, 151 long-running operations, 193 errors, 155 request id), Microsoft REST API Guidelines, RFC 9110 HTTP Semantics, RFC 9457 problem details, RFC 8594 Sunset, gRPC docs (core concepts, deadlines, status codes, error handling, streaming), Protocol Buffers language guide, OpenAPI 3.1 spec, GraphQL spec and best practices"
  - "Software architecture - ISO/IEC/IEEE 42010 (architecture description, views, viewpoints), arc42 template, C4 model (context/container/component/code), ATAM (SEI) and quality attribute scenarios, Fundamentals of Software Architecture (Richards & Ford) styles chapters, Domain-Driven Design (Evans) strategic and tactical patterns, microservices.io pattern catalog (saga, outbox, CQRS, event sourcing, API gateway), Release It! stability patterns, Design Patterns (Gamma, Helm, Johnson, Vlissides) creational/structural/behavioral catalog"
  - "Refactoring, 2nd ed. (Fowler, refactoring.com/catalog) - ch3 bad smells, ch6 first set, ch7 encapsulation, ch8 moving features, ch9 organizing data, ch10 simplifying conditional logic, ch11 refactoring APIs, ch12 dealing with inheritance; Working Effectively with Legacy Code (Feathers) - seams, characterisation tests, sprout/wrap, dependency-breaking techniques; Strangler Fig, Branch by Abstraction, Parallel Change (martinfowler.com); The Mikado Method"
  - "Debugging - Why Programs Fail (Zeller) chapters (tracking problems, reproducing, simplifying, scientific debugging, observing facts, tracking origins, isolating causes); GDB manual (breakpoints, watchpoints, catchpoints, examining stack/data, core files, remote debugging); rr record-replay docs; VS Code / debugpy / Delve / JDWP remote debugging docs; Valgrind manual (memcheck, massif); strace/ltrace man pages; Brendan Gregg Systems Performance observability tools"
  - "Code review - Google Engineering Practices (google.github.io/eng-practices) reviewer guide (standard of code review, what to look for, navigating a CL, speed of reviews, how to write comments, handling pushback) and author guide (writing good CL descriptions, small CLs, handling reviewer comments); SWEBOK v4 Software Quality reviews and inspections; GitHub CODEOWNERS and required reviews docs; OWASP Code Review Guide"
  - "Concurrency and performance - Java Concurrency in Practice (thread safety, sharing objects, composing, building blocks, task execution, cancellation, thread pools, liveness hazards, performance and scalability, explicit locks, atomics and nonblocking sync, memory model); The Art of Multiprocessor Programming (Herlihy & Shavit); Systems Performance 2nd ed. (Gregg) - methodologies (USE, workload characterisation), CPU, memory, file system, disk, network chapters, benchmarking; Little's law and queueing theory; k6/Gatling load-testing docs"
  - "Mobile development - Android Developers guides (app fundamentals, activity/process lifecycle, Jetpack Compose state, navigation, WorkManager background work, App Links, app signing and Android App Bundles, Play Console release tracks, accessibility, LeakCanary/baseline profiles); Apple Developer Documentation (UIKit/SwiftUI app life cycle, SwiftUI state, BackgroundTasks, Universal Links, code signing and provisioning, TestFlight, privacy manifests, App Tracking Transparency, StoreKit, APNs); App Store Review Guidelines; Google Play policy; Firebase Cloud Messaging and Crashlytics docs; React Native and Flutter docs"
topics:
  # --- Git (Pro Git book chapters + git-scm reference)
  - id: git-recording-and-undoing
    name: Recording changes, viewing history and undoing things
    source: Pro Git ch2 Git Basics
    match: [git-basics, staging-area, undoing-changes]
    subtopics:
      - {id: git-rec-restore-reset, name: Undo with git restore / reset / revert, match: [git-restore, git-revert, undo-commit]}
      - {id: git-rec-gitignore, name: gitignore patterns and untracking files, match: [gitignore, git-rm-cached]}
      - {id: git-rec-stash, name: Stashing and cleaning, match: [git-stash, git-clean]}
      - {id: git-rec-log-search, name: Searching history with log -S / -G / --grep and pickaxe, match: [git-log-search, pickaxe, git-log]}
      - {id: git-rec-tags, name: Lightweight vs annotated tags and pushing tags, match: [git-tag, annotated-tags]}
      - {id: git-rec-amend, name: Amending the last commit safely, match: [git-commit-amend, amend-commit]}
      - {id: git-rec-diff, name: Viewing staged and unstaged changes with git diff (--staged / --word-diff / --stat), match: [git-diff, word-diff]}
      - {id: git-rec-mv-rm, name: Removing and moving files (git rm / git mv / rename detection), match: [git-mv, rename-detection]}
      - {id: git-rec-log-format, name: Formatting history (log --oneline --graph / --pretty placeholders / --since), match: [git-log-format, pretty-format]}
      - {id: git-rec-remotes, name: Working with remotes (remote add / set-url / rename / show), match: [git-remote, remote-set-url]}
  - id: git-branching-and-merging
    name: Branching, merging and remote branches
    source: Pro Git ch3 Git Branching
    match: [git-merge, git-branching, merge-strategies]
    subtopics:
      - {id: git-br-conflicts, name: Resolving merge conflicts (conflict markers / mergetool / diff3 / zdiff3), match: [merge-conflicts, conflict-resolution, zdiff3]}
      - {id: git-br-strategy-options, name: Merge strategies and options (ort / ours / -X theirs / octopus), match: [merge-strategy-ort, strategy-option-theirs]}
      - {id: git-br-ff, name: Fast-forward vs --no-ff merges and squash merges, match: [fast-forward, no-ff, squash-merge]}
      - {id: git-br-remote-tracking, name: Remote-tracking branches, upstream and fetch --prune, match: [remote-tracking-branches, git-upstream, fetch-prune]}
      - {id: git-br-rebase, name: Rebasing a branch onto another, match: [git-rebase, rebase]}
      - {id: git-br-rerere, name: Reusing recorded resolutions (rerere), match: [rerere]}
      - {id: git-br-switch, name: Creating and switching branches with git switch / checkout -b, match: [git-switch, git-checkout]}
      - {id: git-br-manage, name: Branch management (branch -d / -D / --merged / --no-merged / -m rename), match: [branch-management, delete-branches]}
      - {id: git-br-push-delete, name: Publishing branches and deleting remote branches (push -u / push --delete), match: [push-upstream, delete-remote-branch]}
      - {id: git-br-force-with-lease, name: Safe force pushes with --force-with-lease and --force-if-includes, match: [force-with-lease]}
      - {id: git-br-rebase-onto, name: Transplanting a range with rebase --onto, match: [rebase-onto]}
  - id: git-distributed-workflows
    name: Distributed workflows, contributing and maintaining a project
    source: Pro Git ch5 Distributed Git
    match: [distributed-workflows, git-workflow]
    subtopics:
      - {id: git-dw-fork-pr, name: Forking / integration-manager workflow and syncing a fork, match: [forking-workflow, sync-fork, integration-manager]}
      - {id: git-dw-patches, name: Email patches with format-patch / am / send-email, match: [git-format-patch, git-am]}
      - {id: git-dw-commit-messages, name: Commit message conventions (50/72 / Conventional Commits / trailers), match: [commit-messages, conventional-commits, git-trailers]}
      - {id: git-dw-cherry-pick, name: Cherry-picking and backporting fixes, match: [cherry-pick, backporting]}
      - {id: git-dw-release, name: Preparing a release (describe / shortlog / archive), match: [git-describe, git-archive, git-shortlog]}
      - {id: git-dw-trunk, name: Trunk-based development and branching strategies, match: [trunk-based-development, gitflow, branching-strategy]}
      - {id: git-dw-request-pull, name: Generating pull requests with git request-pull, match: [git-request-pull]}
      - {id: git-dw-range-diff, name: Comparing patch series revisions with git range-diff, match: [git-range-diff]}
      - {id: git-dw-applying, name: Applying contributed patches (git apply --check / am -3), match: [git-apply]}
      - {id: git-dw-notes, name: Annotating commits with git notes, match: [git-notes]}
      - {id: git-dw-maintainer, name: Maintainer integration of topic branches (merge vs rebase vs cherry-pick), match: [integrating-contributions, topic-branches]}
  - id: git-tools-history
