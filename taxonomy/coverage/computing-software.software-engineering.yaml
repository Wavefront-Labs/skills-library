    source: Pro Git ch7 Git Tools (7.4, 7.11, 7.12, 7.14) + git-worktree reference
    match: [git-repository-tools]
    subtopics:
      - {id: git-tr-submodules, name: Submodules (add / update --init --recursive / foreach), match: [git-submodules, submodule]}
      - {id: git-tr-worktree, name: Multiple working trees with git worktree, match: [git-worktree]}
      - {id: git-tr-signing, name: Signing commits and tags with GPG or SSH keys, match: [commit-signing, ssh-signing, gpg-signing]}
      - {id: git-tr-credentials, name: Credential helpers and HTTPS / SSH auth, match: [credential-helper, git-credentials]}
      - {id: git-tr-subtree, name: Subtree merging as a submodule alternative, match: [git-subtree]}
      - {id: git-tr-bundle, name: Bundling repositories for offline transfer, match: [git-bundle]}
      - {id: git-tr-ssh-accounts, name: SSH keys and multiple Git accounts per host (ssh config / core.sshCommand), match: [ssh-config-git, multiple-git-accounts]}
      - {id: git-tr-submodule-maintenance, name: Updating and removing submodules (update --remote / deinit / absorbgitdirs), match: [submodule-update-remote, submodule-deinit]}
      - {id: git-tr-safe-directory, name: safe.directory and dubious ownership errors, match: [safe-directory, dubious-ownership]}
      - {id: git-tr-clone-options, name: Clone options (--depth / --single-branch / --mirror / --reference), match: [shallow-clone, git-clone-mirror]}
  - id: git-customizing
    name: Customizing Git - config, attributes and hooks
    source: Pro Git ch8 Customizing Git
    match: [git-config, git-customization]
    subtopics:
