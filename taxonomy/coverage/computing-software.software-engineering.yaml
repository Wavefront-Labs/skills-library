      - {id: git-th-split-commit, name: Splitting a commit into several during an interactive rebase, match: [split-commit]}
      - {id: git-th-update-refs, name: Stacked branches with rebase --update-refs, match: [update-refs, stacked-branches]}
  - id: git-tools-repositories
