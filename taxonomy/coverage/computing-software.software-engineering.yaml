      - {id: git-cu-line-endings, name: Line endings with core.autocrlf and .gitattributes eol, match: [line-endings, autocrlf, gitattributes]}
      - {id: git-cu-client-hooks, name: Client-side hooks and the pre-commit framework, match: [git-hooks, pre-commit-hooks, pre-commit-framework]}
      - {id: git-cu-server-hooks, name: Server-side hooks and branch protection policy, match: [server-side-hooks, pre-receive, branch-protection]}
      - {id: git-cu-diff-drivers, name: Custom diff and merge drivers (binary / lockfiles), match: [diff-driver, merge-driver]}
      - {id: git-cu-core-config, name: Core settings (core.editor / excludesFile / pull.rebase / init.defaultBranch), match: [pull-rebase, init-default-branch]}
      - {id: git-cu-filters, name: Clean and smudge filters and keyword expansion, match: [clean-smudge-filter]}
      - {id: git-cu-export-ignore, name: Export and linguist attributes in .gitattributes, match: [export-ignore, linguist-attributes]}
      - {id: git-cu-commit-template, name: commit.template and prepare-commit-msg hooks, match: [commit-template, prepare-commit-msg]}
      - {id: git-cu-fsmonitor, name: Performance config (core.fsmonitor / untrackedCache / feature.manyFiles), match: [fsmonitor, untracked-cache]}
      - {id: git-cu-difftool, name: External diff and merge tools (difftool / mergetool config), match: [git-difftool, git-mergetool]}
  - id: git-internals
    name: Git internals, maintenance and data recovery
