      - {id: git-th-mailmap, name: Fixing authorship (mailmap / rewriting author and email), match: [git-mailmap, rewrite-author]}
      - {id: git-th-undo-merge, name: Undoing merges (reset vs revert -m and reverting a revert), match: [revert-merge, undo-merge]}
      - {id: git-th-grep, name: Searching the tree with git grep, match: [git-grep]}
