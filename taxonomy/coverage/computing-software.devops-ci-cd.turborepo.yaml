# Coverage spec: turborepo. Topics from the official docs.
subject: turborepo
scope:
  category: computing-software
  field: devops-ci-cd
  products: [turborepo]
sources:
  - "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/"
topics:
  - id: what-is-turborepo
    name: "What Turborepo is and the monorepo problem"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/index.mdx"
    match: [build-system,incremental-adoption]
  - id: install-turbo
    name: "Global and repository installation"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/getting-started/installation.mdx"
    match: [install-turbo,global-install]
  - id: add-to-existing-repo
    name: "Adding Turborepo to an existing repository"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/getting-started/add-to-existing-repository.mdx"
    match: [existing-repository,gitignore]
  - id: create-turbo-examples
    name: "create-turbo and examples"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/getting-started/examples.mdx"
    match: [examples,starter-template]
  - id: editor-integration
    name: "Editor integration, schema and LSP"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/getting-started/editor-integration.mdx"
    match: [json-schema,turborepo-lsp]
  - id: package-types
    name: "Application and library packages"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/package-types.mdx"
    match: [package-types,application-package]
  - id: internal-packages
    name: "Internal packages and workspace protocol"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/internal-packages.mdx"
    match: [workspace-protocol,compilation-strategies]
  - id: jit-packages
    name: "Just-in-Time internal packages"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/internal-packages.mdx"
    match: [just-in-time]
  - id: compiled-packages
    name: "Compiled internal packages"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/internal-packages.mdx"
    match: [compiled-packages]
  - id: package-and-task-graph
    name: "Package Graph and Task Graph"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/package-and-task-graph.mdx"
    match: [package-graph,task-graph]
  - id: transit-nodes
    name: "Transit Nodes in the Task Graph"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/package-and-task-graph.mdx"
    match: [transit-nodes]
  - id: remote-caching
    name: "Remote Caching with Vercel"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/remote-caching.mdx"
    match: [remote-cache,turbo-link]
  - id: artifact-signing
    name: "Remote cache artifact signatures"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/remote-caching.mdx"
    match: [artifact-signing,hmac-sha256]
  - id: self-hosted-cache
    name: "Self-hosting a Remote Cache and API spec"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/core-concepts/remote-caching.mdx"
    match: [self-hosted-cache,openapi]
  - id: workspace-globs
    name: "Workspace package globs and nested packages"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/structuring-a-repository.mdx"
    match: [workspace-globs,nested-packages]
  - id: root-package-json
    name: "Root package.json and lockfile"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/structuring-a-repository.mdx"
    match: [root-package-json,lockfile]
  - id: package-json-fields
    name: "name, scripts, exports and imports fields"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/structuring-a-repository.mdx"
    match: [exports-field,imports-field]
  - id: structure-pitfalls
    name: "Structuring pitfalls"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/structuring-a-repository.mdx"
    match: [pitfalls,relative-imports]
  - id: task-definitions
    name: "Defining tasks in turbo.json"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/configuring-tasks.mdx"
    match: [tasks-key,task-definition]
  - id: dependson
    name: "dependsOn forms"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/configuring-tasks.mdx"
    match: [dependson,caret-microsyntax]
  - id: outputs
    name: "outputs key"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/configuring-tasks.mdx"
    match: [outputs,negated-globs]
  - id: inputs
    name: "inputs and TURBO_DEFAULT"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/configuring-tasks.mdx"
    match: [inputs,turbo-default]
  - id: root-tasks
    name: "Root tasks"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/configuring-tasks.mdx"
    match: [root-tasks]
  - id: with-and-side-effects
    name: "with key and side-effect tasks"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/configuring-tasks.mdx"
    match: [with-key,side-effects]
  - id: parallel-type-checks
    name: "Parallel dependent type checks"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/configuring-tasks.mdx"
    match: [check-types,cache-correctness]
  - id: caching-basics
    name: "Caching fingerprint and first hit"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/caching.mdx"
    match: [fingerprint,full-turbo]
  - id: worktree-cache
    name: "Git worktree cache sharing"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/caching.mdx"
    match: [git-worktree]
  - id: cached-artifacts
    name: "What gets cached"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/caching.mdx"
    match: [cached-outputs,task-logs]
  - id: hash-inputs
    name: "Global and package hash inputs"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/caching.mdx"
    match: [global-hash,package-hash]
  - id: cache-troubleshooting
    name: "Cache troubleshooting"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/caching.mdx"
    match: [cache-troubleshooting,run-summary]
  - id: running-tasks
    name: "Running tasks from root scripts and global turbo"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/running-tasks.mdx"
    match: [root-scripts,package-scoping]
  - id: filter-package
    name: "Filtering by package and directory"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/running-tasks.mdx"
    match: [package-filter,directory-filter]
  - id: filter-git
    name: "Filtering dependents and by source control"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/running-tasks.mdx"
    match: [dependents,git-filter]
  - id: dev-tasks
    name: "Developing applications and dev tasks"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/developing-applications.mdx"
    match: [dev-task,setup-tasks]
  - id: terminal-ui
    name: "Terminal UI and interactive tasks"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/developing-applications.mdx"
    match: [terminal-ui,keybinds]
  - id: turbo-watch
    name: "turbo watch"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/developing-applications.mdx"
    match: [turbo-watch,teardown]
  - id: env-vars
    name: "env and globalEnv"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/using-environment-variables.mdx"
    match: [env-key,globalenv]
  - id: framework-inference
    name: "Framework Inference"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/using-environment-variables.mdx"
    match: [framework-inference]
  - id: env-modes
    name: "Strict and loose environment modes"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/using-environment-variables.mdx"
    match: [strict-mode,loose-mode]
  - id: env-passthrough
    name: "Passthrough and platform variables"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/using-environment-variables.mdx"
    match: [passthroughenv,platform-environment-variables]
  - id: env-files
    name: ".env files and hashing"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/using-environment-variables.mdx"
    match: [env-files,dotenv]
  - id: env-best-practices
    name: "Environment variable best practices"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/using-environment-variables.mdx"
    match: [env-best-practices,runtime-mutation]
  - id: ci-remote-cache
    name: "CI remote cache variables"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/constructing-ci.mdx"
    match: [turbo-token,turbo-team]
  - id: ci-affected
    name: "The --affected flag"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/constructing-ci.mdx"
    match: [affected,github-actions]
  - id: ci-query-affected
    name: "turbo query affected in CI"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/constructing-ci.mdx"
    match: [turbo-query-affected,exit-code]
  - id: ci-global-turbo
    name: "Pinning turbo before install"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/constructing-ci.mdx"
    match: [turbo-version,standalone-binary]
  - id: ci-best-practices
    name: "CI best practices"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/constructing-ci.mdx"
    match: [ci-best-practices,subcommand-collision]
  - id: managing-dependencies
    name: "Installing dependencies where used"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/managing-dependencies.mdx"
    match: [install-where-used,external-dependencies]
  - id: root-dependencies
    name: "Few dependencies in the root"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/managing-dependencies.mdx"
    match: [root-dependencies,node-modules-location]
  - id: dependency-versions
    name: "Keeping dependency versions in sync"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/managing-dependencies.mdx"
    match: [syncpack,pnpm-catalogs]
  - id: understanding-repo
    name: "turbo ls, run and devtools"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/understanding-your-repository.mdx"
    match: [turbo-ls,turbo-devtools]
  - id: turbo-query
    name: "turbo query GraphQL"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/understanding-your-repository.mdx"
    match: [graphql,direct-dependent-count]
  - id: upgrade-2-codemod
    name: "Upgrading to 2.0 with codemods"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/upgrading.mdx"
    match: [turbo-codemod,migrate]
  - id: upgrade-2-behavior
    name: "2.0 behaviour changes"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/upgrading.mdx"
    match: [scope-flag-removed,root-implicit-dependency]
  - id: create-internal-package
    name: "Creating an internal package"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/creating-an-internal-package.mdx"
    match: [create-internal-package,tsconfig-extends]
  - id: internal-package-practices
    name: "Internal package best practices"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/crafting-your-repository/creating-an-internal-package.mdx"
    match: [single-purpose-packages,shared-code]
  - id: config-global-options
    name: "turbo.json global options"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [global-options,concurrency]
  - id: config-cache-eviction
    name: "cacheDir and cache eviction"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [cachemaxage,cachemaxsize]
  - id: config-agent-guidance
    name: "agentGuidance"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [agentguidance,agents-md]
  - id: config-future-task-level
    name: "Task-level future flags"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [affectedusingtaskinputs,filterusingtasks]
  - id: config-future-other
    name: "Other future flags"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [hashfilepermissions,longersignaturekey]
  - id: config-global-key
    name: "globalConfiguration and observability"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [globalconfiguration,otel]
  - id: config-task-tags
    name: "Task tags and extends"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [task-tags,turbo-extends]
  - id: config-env-patterns
    name: "env wildcards and negation"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [wildcards,pattern-escaping]
  - id: config-inputs-reference
    name: "inputs reference and deferred hashing"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [turbo-root,deferred-hashing]
  - id: config-persistent
    name: "persistent, interactive, interruptible"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [persistent,interruptible]
  - id: config-remote-cache
    name: "remoteCache options"
    source: "https://raw.githubusercontent.com/vercel/turborepo/main/apps/docs/content/docs/reference/configuration.mdx"
    match: [remotecache-config,uploadtimeout]
