    match: [grpc-web, grpc_json_transcoder, protoc, descriptor-set, rest-to-grpc, http-annotations]
  - id: edge-proxy-best-practices
    name: edge proxy best practices
    source: "https://github.com/envoyproxy/envoy/blob/main/docs/root/configuration/best_practices/edge.rst"
    match: [edge-proxy, best-practices, buffer-limits, normalize_path, merge_slashes, headers_with_underscores_action, hardening]
  - id: header-to-metadata-filter
    name: header to metadata filter
    source: "https://github.com/envoyproxy/envoy/blob/main/docs/root/configuration/http/http_filters/header_to_metadata_filter.rst"
    match: [header_to_metadata, request_rules, metadata_namespace, envoy.lb, subset-routing, dynamic-metadata]
  - id: admission-control-filter
    name: admission control filter
    source: "https://github.com/envoyproxy/envoy/blob/main/docs/root/configuration/http/http_filters/admission_control_filter.rst"
    match: [admission_control, sr_threshold, aggression, sampling_window, load-shedding, success_criteria]
  - id: http-compressor-filter
    name: http compressor filter
    source: "https://github.com/envoyproxy/envoy/blob/main/docs/root/configuration/http/http_filters/compressor_filter.rst"
    match: [compressor, gzip, brotli, zstd, content-length, compression, compressorperroute]
