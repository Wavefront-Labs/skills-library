# Coverage spec: backstage. Topics from the official docs.
subject: backstage
scope:
  category: computing-software
  field: devops-ci-cd
  products: [backstage]
sources:
  - "https://backstage.io/docs/"
  - "https://github.com/backstage/backstage/tree/master/docs"
topics:
  - id: auth-github-provider
    name: "GitHub auth provider"
    source: "https://backstage.io/docs/auth/github/provider"
    match: [github-auth, oauth-app, enterprise-instance-url]
  - id: auth-guest-provider
    name: "Guest auth provider"
    source: "https://backstage.io/docs/auth/guest/provider"
    match: [guest-provider, development-auth, sign-in-page-providers]
  - id: auth-providers-overview
    name: "Auth providers overview"
    source: "https://backstage.io/docs/auth/"
    match: [authentication, auth-providers, sign-in-page]
  - id: auth-service-to-service
    name: "Service-to-service auth"
    source: "https://backstage.io/docs/auth/service-to-service-auth"
    match: [service-to-service, plugin-to-plugin, external-access]
  - id: auth-sign-in-resolvers
    name: "Sign-in resolvers"
    source: "https://backstage.io/docs/auth/identity-resolver"
    match: [sign-in-resolvers, identity-resolver, user-entity-matching]
  - id: catalog-api-kind
    name: "API kind"
    source: "https://backstage.io/docs/features/software-catalog/descriptor-format"
    match: [api-kind, openapi, spec-definition]
  - id: catalog-component-kind
    name: "Component kind"
    source: "https://backstage.io/docs/features/software-catalog/descriptor-format"
    match: [component-kind, lifecycle, spec-owner]
  - id: catalog-descriptor-format
    name: "Catalog descriptor format"
    source: "https://backstage.io/docs/features/software-catalog/descriptor-format"
    match: [descriptor-format, catalog-info-yaml, entity-envelope]
  - id: catalog-entity-presentation
    name: "Entity presentation"
    source: "https://backstage.io/docs/features/software-catalog/entity-presentation"
    match: [entity-presentation, display-name, entity-ref-link]
  - id: catalog-github-discovery
    name: "GitHub entity discovery"
    source: "https://backstage.io/docs/integrations/github/discovery"
    match: [github-discovery, catalog-providers, catalog-path]
  - id: catalog-github-org-ingestion
    name: "GitHub org ingestion"
    source: "https://backstage.io/docs/integrations/github/org"
    match: [github-org, org-data, users-and-teams]
  - id: catalog-life-of-entity
    name: "Life of an entity"
    source: "https://backstage.io/docs/features/software-catalog/life-of-an-entity"
    match: [entity-lifecycle, ingestion, stitching]
  - id: catalog-placeholder-substitutions
    name: "Placeholder substitutions"
    source: "https://backstage.io/docs/features/software-catalog/descriptor-format"
    match: [placeholders, text-json-yaml, include-files]
  - id: catalog-relations
    name: "Well-known relations"
    source: "https://backstage.io/docs/features/software-catalog/well-known-relations"
    match: [relations, owned-by, depends-on]
  - id: catalog-rest-api
    name: "Catalog REST API"
    source: "https://backstage.io/docs/features/software-catalog/api"
    match: [catalog-api, entities-by-query, entity-filters]
  - id: catalog-rules
    name: "Catalog location rules"
    source: "https://backstage.io/docs/features/software-catalog/configuration"
    match: [catalog-rules, allowed-kinds, location-rules]
  - id: catalog-static-locations
    name: "Static catalog locations"
    source: "https://backstage.io/docs/features/software-catalog/configuration"
    match: [catalog-locations, url-locations, file-locations]
  - id: catalog-system-resource-domain
    name: "System, Domain and Resource kinds"
    source: "https://backstage.io/docs/features/software-catalog/system-model"
    match: [system-kind, domain-kind, resource-kind]
  - id: catalog-user-group-org
    name: "User and Group entities"
    source: "https://backstage.io/docs/features/software-catalog/descriptor-format"
    match: [user-kind, group-kind, org-structure]
  - id: catalog-well-known-annotations
    name: "Well-known annotations"
    source: "https://backstage.io/docs/features/software-catalog/well-known-annotations"
    match: [annotations, techdocs-ref, project-slug]
  - id: config-app-config-files
    name: "App config files"
    source: "https://backstage.io/docs/conf/"
    match: [app-config, backstage-env, config-loading]
  - id: config-schema-visibility
    name: "Config schema and visibility"
    source: "https://backstage.io/docs/conf/defining"
    match: [config-schema, visibility, frontend-config]
  - id: config-secrets-includes
    name: "Config secrets and includes"
    source: "https://backstage.io/docs/conf/writing"
    match: [env-substitution, file-include, config-secrets]
  - id: deploy-docker-build
    name: "Docker image build"
    source: "https://backstage.io/docs/deployment/docker"
    match: [docker-build, host-build, backend-dockerfile]
  - id: deploy-kubernetes
    name: "Kubernetes deployment"
    source: "https://backstage.io/docs/deployment/k8s"
    match: [kubernetes-deployment, postgres-secret, backstage-namespace]
  - id: deploy-scaling
    name: "Scaling Backstage"
    source: "https://backstage.io/docs/deployment/scaling"
    match: [scaling, multiple-instances, split-backends]
  - id: entity-references
    name: "Entity references"
    source: "https://backstage.io/docs/features/software-catalog/references"
    match: [entity-ref, string-references, kind-namespace-name]
  - id: plugin-analytics
    name: "Plugin analytics"
    source: "https://backstage.io/docs/plugins/analytics"
    match: [analytics-api, capture-events, analytics-context]
  - id: plugin-catalog-integration
    name: "Integrating a plugin with the catalog"
    source: "https://backstage.io/docs/plugins/integrating-plugin-into-software-catalog"
    match: [entity-page, catalog-integration, entity-annotation]
  - id: plugin-create-and-test
    name: "Create and test a plugin"
    source: "https://backstage.io/docs/plugins/create-a-plugin"
    match: [create-plugin, backstage-cli-new, plugin-testing]
  - id: plugin-feature-flags
    name: "Feature flags"
    source: "https://backstage.io/docs/plugins/feature-flags"
    match: [feature-flags, plugin-flags, feature-flagged]
  - id: plugin-new-backend-system
    name: "Backend system basics"
    source: "https://backstage.io/docs/plugins/new-backend-system"
    match: [new-backend-system, create-backend, backend-add]
  - id: plugin-proxy
    name: "Backend proxy"
    source: "https://backstage.io/docs/plugins/proxying"
    match: [proxy-backend, proxy-endpoints, change-origin]
  - id: scaffolder-builtin-actions
    name: "Built-in scaffolder actions"
    source: "https://backstage.io/docs/features/software-templates/builtin-actions"
    match: [scaffolder-actions, action-modules, publish-actions]
  - id: scaffolder-conditional-logic
    name: "Conditional template logic"
    source: "https://backstage.io/docs/features/software-templates/input-examples"
    match: [template-if, conditional-steps, conditional-fields]
  - id: scaffolder-custom-actions
    name: "Custom scaffolder actions"
    source: "https://backstage.io/docs/features/software-templates/writing-custom-actions"
    match: [custom-actions, create-template-action, backend-module]
  - id: scaffolder-default-environment
    name: "Scaffolder default environment"
    source: "https://backstage.io/docs/features/software-templates/configuration"
    match: [default-environment, template-secrets, environment-secrets]
  - id: scaffolder-dry-run-actions
    name: "Dry run support for actions"
    source: "https://backstage.io/docs/features/software-templates/dry-run-testing"
    match: [dry-run, supports-dry-run, ctx-is-dry-run]
  - id: scaffolder-entity-picker-options
    name: "Entity picker options"
    source: "https://backstage.io/docs/features/software-templates/ui-options-examples"
    match: [entity-picker, catalog-filter, ui-options]
  - id: scaffolder-parameters-rjsf
    name: "Template parameters and UI"
    source: "https://backstage.io/docs/features/software-templates/writing-templates"
    match: [template-parameters, json-schema, ui-field]
  - id: scaffolder-publish-defaults
    name: "Scaffolder publish defaults"
    source: "https://backstage.io/docs/features/software-templates/configuration"
    match: [scaffolder-config, default-author, repo-visibility]
  - id: scaffolder-steps-and-outputs
    name: "Steps and outputs"
    source: "https://backstage.io/docs/features/software-templates/writing-templates"
    match: [template-steps, fetch-template, step-outputs]
  - id: scaffolder-template-definition
    name: "Scaffolder template definition"
    source: "https://backstage.io/docs/features/software-templates/writing-templates"
    match: [software-templates, template-yaml, scaffolder]
  - id: scaffolder-templating-filters
    name: "Templating filters"
    source: "https://backstage.io/docs/features/software-templates/templating-extensions"
    match: [nunjucks, parse-repo-url, template-filters]
  - id: search-collators
    name: "Catalog and TechDocs collators"
    source: "https://backstage.io/docs/features/search/collators"
    match: [catalog-collator, techdocs-collator, collator-schedule]
  - id: search-concepts
    name: "Search concepts"
    source: "https://backstage.io/docs/features/search/concepts"
    match: [search-concepts, collators, decorators]
  - id: search-custom-collator
    name: "Custom search collator"
    source: "https://backstage.io/docs/features/search/custom-collators"
    match: [custom-collator, search-collator-module, searchable-content]
  - id: search-engines
    name: "Search engines"
    source: "https://backstage.io/docs/features/search/search-engines"
    match: [search-engine, lunr, postgres-search]
  - id: techdocs-annotation-and-mkdocs
    name: "TechDocs source annotation"
    source: "https://backstage.io/docs/features/techdocs/creating-and-publishing"
    match: [techdocs-ref, mkdocs-yml, docs-as-code]
  - id: techdocs-architecture
    name: "TechDocs architecture"
    source: "https://backstage.io/docs/features/techdocs/architecture"
    match: [techdocs-architecture, techdocs-basic, recommended-deployment]
  - id: techdocs-ci-github-actions
    name: "TechDocs in CI"
    source: "https://backstage.io/docs/features/techdocs/configuring-ci-cd"
    match: [techdocs-ci, github-actions-publish, external-build]
  - id: techdocs-cli-generate-publish
    name: "TechDocs CLI generate and publish"
    source: "https://backstage.io/docs/features/techdocs/cli"
    match: [techdocs-cli, generate-site, publish-docs]
  - id: techdocs-cloud-storage
    name: "TechDocs cloud storage"
    source: "https://backstage.io/docs/features/techdocs/using-cloud-storage"
    match: [techdocs-publisher, aws-s3, google-gcs]
  - id: techdocs-extensions-howto
    name: "TechDocs how-to recipes"
    source: "https://backstage.io/docs/features/techdocs/how-to-guides"
    match: [techdocs-mermaid, plantuml, mkdocs-plugins]
  - id: techdocs-generator-config
    name: "TechDocs generator config"
    source: "https://backstage.io/docs/features/techdocs/configuration"
    match: [techdocs-generator, run-in-docker, mkdocs-config]
