# Canonical coverage spec: chemical engineering (whole field). Topics and subtopics follow the chapter structure of the
# standard textbooks, handbooks, standards and tool manuals named in `sources` (not the library's own contents).
subject: chemical-engineering
scope:
  category: engineering-technology
  field: chemical-engineering
  products: [aspen, process-design, reactor-design, separation-processes, heat-exchanger-design, piping-instrumentation, process-control, process-safety]
sources:
  - "Aspen Plus and Aspen HYSYS user guides and help (AspenTech) - property methods, Data Regression, RadFrac, reactors, sensitivity and optimisation"
  - "Seider Seader Lewin and Widagdo Product and Process Design Principles; Turton et al. Analysis Synthesis and Design of Chemical Processes; Towler and Sinnott Chemical Engineering Design; Peters Timmerhaus and West Plant Design and Economics; Douglas Conceptual Design of Chemical Processes"
  - "NCEES FE Chemical and PE Chemical exam specifications; ABET program criteria for chemical engineering; AIChE body of knowledge"
  - "Fogler Elements of Chemical Reaction Engineering; Levenspiel Chemical Reaction Engineering; Froment Bischoff and De Wilde Chemical Reactor Analysis and Design"
  - "Seader Henley and Roper Separation Process Principles; Perry Chemical Engineers Handbook; Kister Distillation Design; Treybal Mass-Transfer Operations; McCabe Smith and Harriott Unit Operations; Mullin Crystallization"
  - "Kern Process Heat Transfer; Heat Exchanger Design Handbook; TEMA Standards; Kemp Pinch Analysis and Process Integration; Smith Chemical Process Design and Integration"
  - "Crane Technical Paper 410; ASME B31.3; ISA-5.1; ISO 10628; ISA-75.01.01 and IEC 60534-2-1; Darby Chemical Engineering Fluid Mechanics; Karassik Pump Handbook"
  - "Seborg Edgar Mellichamp and Doyle Process Dynamics and Control; Smith and Corripio; Luyben; Skogestad Multivariable Feedback Control; ISA-18.2"
  - "CCPS Guidelines for Hazard Evaluation Procedures and Layer of Protection Analysis; API 520 521 526 2000; IEC 61511; OSHA 29 CFR 1910.119; Seveso III Directive 2012/18/EU; Crowl and Louvar Chemical Process Safety; Lees Loss Prevention in the Process Industries"
