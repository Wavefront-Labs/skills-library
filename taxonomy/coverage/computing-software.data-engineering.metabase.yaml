# Coverage spec: metabase. Topics from the Metabase docs table of contents (metabase.com/docs/latest).
subject: metabase
scope:
  category: computing-software
  field: data-engineering
  products: [metabase]
sources:
  - "Metabase docs (metabase.com/docs/latest)"
topics:
  - id: sql-basic-variables
    name: "SQL basic variables"
    source: "https://www.metabase.com/docs/latest/questions/native-editor/sql-parameters"
    match: [sql-variables, basic-variables, double-braces]
  - id: sql-field-filters
    name: "SQL field filters"
    source: "https://www.metabase.com/docs/latest/questions/native-editor/sql-parameters"
    match: [field-filter, sql-variables, widgets]
  - id: sql-time-grouping-parameters
    name: "SQL time grouping parameters"
    source: "https://www.metabase.com/docs/latest/questions/native-editor/sql-parameters"
    match: [time-grouping, sql-parameters, group-by]
  - id: sql-table-variables
    name: "SQL table variables"
    source: "https://www.metabase.com/docs/latest/questions/native-editor/sql-parameters"
    match: [table-variable, emit-table-alias, sql-snippets]
  - id: sql-optional-variables
    name: "SQL optional variables"
    source: "https://www.metabase.com/docs/latest/questions/native-editor/sql-parameters"
    match: [optional-variables, double-brackets, where-true]
  - id: sql-snippets
    name: "SQL snippets"
    source: "https://www.metabase.com/docs/latest/questions/native-editor/snippets"
    match: [sql-snippets, snippet-syntax, reusable-sql]
  - id: referencing-saved-questions
    name: "Referencing saved questions in SQL"
    source: "https://www.metabase.com/docs/latest/questions/native-editor/referencing-saved-questions-in-queries"
    match: [saved-questions, model-reference, cte]
  - id: custom-expressions
    name: "Custom expressions"
    source: "https://www.metabase.com/docs/latest/questions/query-builder/expressions"
    match: [custom-expressions, custom-column, case]
  - id: query-builder-joins
    name: "Query builder joins"
    source: "https://www.metabase.com/docs/latest/questions/query-builder/join"
    match: [joins, left-outer-join, join-conditions]
  - id: summarize-and-grouping
    name: "Summarize and grouping"
    source: "https://www.metabase.com/docs/latest/questions/query-builder/summarizing-and-grouping"
    match: [summarize, grouping, binning]
  - id: alerts
    name: "Alerts"
    source: "https://www.metabase.com/docs/latest/questions/alerts"
    match: [alerts, goal-line, results-alert]
  - id: exporting-results
    name: "Exporting results"
    source: "https://www.metabase.com/docs/latest/exploration-and-organization/exporting-results"
    match: [export, download-row-limit, csv]
  - id: dashboard-filters
    name: "Dashboard filters"
    source: "https://www.metabase.com/docs/latest/dashboards/filters"
    match: [dashboard-filters, filter-widgets, default-value]
  - id: dashboard-linked-filters
    name: "Dashboard linked filters"
    source: "https://www.metabase.com/docs/latest/dashboards/filters"
    match: [linked-filters, parent-filter, foreign-key]
  - id: dashboard-subscriptions
    name: "Dashboard subscriptions"
    source: "https://www.metabase.com/docs/latest/dashboards/subscriptions"
    match: [subscriptions, dashboard-subscriptions, attachments]
  - id: models
    name: "Models"
    source: "https://www.metabase.com/docs/latest/data-modeling/models/models"
    match: [models, model-metadata, version-history]
  - id: model-persistence
    name: "Model persistence"
    source: "https://www.metabase.com/docs/latest/data-modeling/models/model-persistence"
    match: [model-persistence, persisted-models, warehouse-schema]
  - id: query-transforms
    name: "Query transforms"
    source: "https://www.metabase.com/docs/latest/data-modeling/transforms/query"
    match: [transforms, incremental, checkpoint-column]
  - id: transform-jobs-and-runs
    name: "Transform jobs and runs"
    source: "https://www.metabase.com/docs/latest/data-modeling/transforms/jobs-and-runs"
    match: [transform-jobs, transform-tags, runs]
  - id: semantic-types
    name: "Semantic types"
    source: "https://www.metabase.com/docs/latest/data-modeling/metadata/semantic-types"
    match: [semantic-types, field-types, casting]
  - id: metrics
    name: "Metrics"
    source: "https://www.metabase.com/docs/latest/data-modeling/semantic-layer/metrics"
    match: [metrics, semantic-layer, dimensions]
  - id: segments
    name: "Segments"
    source: "https://www.metabase.com/docs/latest/data-modeling/semantic-layer/segments"
    match: [segments, saved-filters, data-studio]
  - id: database-sync-and-scan
    name: "Database sync and scan"
    source: "https://www.metabase.com/docs/latest/databases/sync-scan"
    match: [sync, scan, fingerprinting]
  - id: database-users-roles-privileges
    name: "Database users, roles and privileges"
    source: "https://www.metabase.com/docs/latest/databases/users-roles-privileges"
    match: [database-privileges, read-only-user, roles]
  - id: ssh-tunnel
    name: "SSH tunnel"
    source: "https://www.metabase.com/docs/latest/databases/ssh-tunnel"
    match: [ssh-tunnel, bastion-host, allowtcpforwarding]
  - id: data-uploads
    name: "Data uploads"
    source: "https://www.metabase.com/docs/latest/databases/uploads"
    match: [uploads, csv-upload, local-infile]
  - id: data-permissions
    name: "Data permissions"
    source: "https://www.metabase.com/docs/latest/permissions/data"
    match: [data-permissions, view-data, create-queries]
  - id: collection-permissions
    name: "Collection permissions"
    source: "https://www.metabase.com/docs/latest/permissions/collections"
    match: [collection-permissions, curate, personal-collections]
  - id: row-and-column-security
    name: "Row and column security"
    source: "https://www.metabase.com/docs/latest/permissions/row-and-column-security"
    match: [row-level-security, column-security, sandboxing]
  - id: impersonation
    name: "Connection impersonation"
    source: "https://www.metabase.com/docs/latest/permissions/impersonation"
    match: [impersonation, database-roles, user-attributes]
  - id: database-routing
    name: "Database routing"
    source: "https://www.metabase.com/docs/latest/permissions/database-routing"
    match: [database-routing, router-database, destination-databases]
  - id: environment-variables
    name: "Environment variables"
    source: "https://www.metabase.com/docs/latest/configuring-metabase/environment-variables"
    match: [environment-variables, mb-prefix, precedence]
  - id: config-file
    name: "Config file"
    source: "https://www.metabase.com/docs/latest/configuring-metabase/config-file"
    match: [config-file, config-yml, env-interpolation]
  - id: query-result-caching
    name: "Query result caching"
    source: "https://www.metabase.com/docs/latest/configuring-metabase/caching"
    match: [caching, cache-policy, adaptive-caching]
  - id: running-on-docker
    name: "Running Metabase on Docker"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/running-metabase-on-docker"
    match: [docker, container, docker-secrets]
  - id: application-database
    name: "Application database"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/configuring-application-database"
    match: [application-database, mb-db-type, connection-uri]
  - id: migrating-from-h2
    name: "Migrating from H2"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/migrating-from-h2"
    match: [h2-migration, load-from-h2, production-database]
  - id: upgrading
    name: "Upgrading Metabase"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/upgrading-metabase"
    match: [upgrading, migrate-down, downgrade]
  - id: backing-up
    name: "Backing up application data"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/backing-up-metabase-application-data"
    match: [backup, h2-file, rds-backups]
  - id: serialization
    name: "Serialization"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/serialization"
    match: [serialization, export-import, entity-id]
  - id: prometheus-monitoring
    name: "Prometheus monitoring"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/observability-with-prometheus"
    match: [prometheus, metrics-endpoint, scrape-config]
  - id: cli-commands
    name: "CLI commands"
    source: "https://www.metabase.com/docs/latest/installation-and-operation/commands"
    match: [cli, reset-password, rotate-encryption-key]
  - id: api-keys
    name: "API keys"
    source: "https://www.metabase.com/docs/latest/people-and-groups/api-keys"
    match: [api-keys, x-api-key, key-groups]
  - id: jwt-sso
    name: "JWT SSO"
    source: "https://www.metabase.com/docs/latest/people-and-groups/authenticating-with-jwt"
    match: [jwt, sso, group-mappings]
  - id: ldap-auth
    name: "LDAP authentication"
    source: "https://www.metabase.com/docs/latest/people-and-groups/ldap"
    match: [ldap, user-search-base, user-filter]
  - id: public-links
    name: "Public links"
    source: "https://www.metabase.com/docs/latest/embedding/public-links"
    match: [public-links, public-sharing, iframe]
  - id: securing-embeds
    name: "Securing embeds"
    source: "https://www.metabase.com/docs/latest/embedding/securing-embeds"
    match: [securing-embeds, guest-embeds, locked-parameters]
