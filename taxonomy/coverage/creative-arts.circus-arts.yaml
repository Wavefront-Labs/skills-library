# Canonical coverage spec: circus arts (all products in the circus-arts field).
# Checked by tools/coverage_check.py. A topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external professional-circus structures: national circus school
# curricula (ENC Montreal, NICA, CNAC), the FEDEC basic instruction manuals (acrobatics, aerials,
# equilibrium, juggling, clown), rigging standards (ANSI/ESTA E1 series, EN 17206) and the
# established juggling/acrobatic progression literature listed in `sources`.
subject: circus-arts
scope:
  category: creative-arts
  field: circus-arts
  products: [aerial-arts, trapeze, acrobatics-and-tumbling, hand-balancing-and-wire, juggling-and-object-manipulation, clowning, circus-act-creation]
sources:
  - "Ecole nationale de cirque (Montreal) DEC in Circus Arts programme - specialisation disciplines (aerials, acrobatics, equilibrium, manipulation, clown/acting) and creation courses - https://ecolenationaledecirque.ca"
  - "NICA (National Institute of Circus Arts, Melbourne) Bachelor of Circus Arts course structure - https://www.nica.com.au"
  - "FEDEC basic circus arts instruction manuals (Caravan/FEDEC 2008-2011) - aerials, acrobatics, equilibrium, juggling, clown, safety and pedagogy chapters - https://www.fedec.eu"
  - "ANSI E1.43 Performer Flying Systems; ANSI E1.4 Manual Counterweight Rigging; ANSI E1.2 Aluminum Trusses; ESTA Technical Standards Program - https://tsp.esta.org"
  - "EN 17206 Entertainment technology - Machinery for stages and other production areas; ETCP Arena Rigger certification candidate handbook (rigging math, bridles, load calculation)"
  - "Juggling literature - Shannon/Klimek siteswap notation, Charlie Dancey Encyclopaedia of Ball Juggling, IJA resources - https://www.juggling.org ; https://libraryofjuggling.com"
  - "Clown pedagogy - Jacques Lecoq The Moving Body; Philippe Gaulier; Jon Davison Clown (2013); Ringling Bros. Clown College curriculum"
  - "Hand-balancing and equilibristics coaching texts - Yuri Mikhailov / Miguel Ruiz handstand progressions; Moscow circus school equilibrium method"
