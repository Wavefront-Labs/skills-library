# Coverage spec: k3s. Topics from the official docs table of contents.
subject: k3s
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [k3s]
sources:
  - "k3s official docs"
topics:
  - id: k3s-quick-start-install-script
    name: "K3s quick start install script"
    source: "https://docs.k3s.io/quick-start"
    match: [k3s, install-script, get-k3s-io]
  - id: k3s-join-agent-node
    name: "K3s join agent node"
    source: "https://docs.k3s.io/quick-start"
    match: [k3s, agent, k3s-url, k3s-token]
  - id: k3s-install-script-env-vars
    name: "K3s install script env vars"
    source: "https://docs.k3s.io/reference/env-variables"
    match: [k3s, install-k3s-exec, install-k3s-version, install-k3s-channel]
  - id: k3s-uninstall
    name: "K3s uninstall"
    source: "https://docs.k3s.io/installation/uninstall"
    match: [k3s, k3s-uninstall-sh, k3s-agent-uninstall-sh]
  - id: k3s-secrets-encryption-at-rest
    name: "K3s secrets encryption at rest"
    source: "https://docs.k3s.io/security/secrets-encryption"
    match: [k3s, secrets-encryption, aescbc, encryption-config]
  - id: k3s-server-roles-etcd-controlplane
    name: "K3s server roles etcd controlplane"
    source: "https://docs.k3s.io/installation/server-roles"
    match: [k3s, cluster-init, disable-apiserver, disable-etcd]
  - id: k3s-ha-embedded-etcd
    name: "K3s ha embedded etcd"
    source: "https://docs.k3s.io/datastore/ha-embedded"
    match: [k3s, embedded-etcd, cluster-init, quorum]
  - id: k3s-convert-sqlite-to-etcd
    name: "K3s convert sqlite to etcd"
    source: "https://docs.k3s.io/datastore/ha-embedded"
    match: [k3s, sqlite, cluster-init, datastore-migration]
  - id: k3s-datastore-options
    name: "K3s datastore options"
    source: "https://docs.k3s.io/datastore"
    match: [k3s, datastore, sqlite, mysql, postgresql]
  - id: k3s-datastore-endpoint-formats
    name: "K3s datastore endpoint formats"
    source: "https://docs.k3s.io/datastore"
    match: [k3s, datastore-endpoint, postgres, mysql, etcd-endpoints]
  - id: k3s-ha-external-database
    name: "K3s ha external database"
    source: "https://docs.k3s.io/datastore/ha"
    match: [k3s, external-database, node-taint, server-token]
  - id: k3s-fixed-registration-address
    name: "K3s fixed registration address"
    source: "https://docs.k3s.io/datastore/ha"
    match: [k3s, tls-san, registration-address, load-balancer]
  - id: k3s-haproxy-keepalived-lb
    name: "K3s haproxy keepalived lb"
    source: "https://docs.k3s.io/datastore/cluster-loadbalancer"
    match: [k3s, haproxy, keepalived, virtual-ip]
  - id: k3s-config-file-yaml
    name: "K3s config file yaml"
    source: "https://docs.k3s.io/installation/configuration"
    match: [k3s, config-yaml, config-yaml-d, k3s-config-file]
  - id: k3s-install-script-flags-vs-config
    name: "K3s install script flags vs config"
    source: "https://docs.k3s.io/installation/configuration"
    match: [k3s, install-k3s-exec, flags, reinstall]
  - id: k3s-network-ports-firewall
    name: "K3s network ports firewall"
    source: "https://docs.k3s.io/installation/requirements"
    match: [k3s, inbound-ports, port-6443, port-8472]
  - id: k3s-os-prerequisites
    name: "K3s os prerequisites"
    source: "https://docs.k3s.io/installation/requirements"
    match: [k3s, firewalld, ufw, cgroups, nm-cloud-setup]
  - id: k3s-hardware-sizing
    name: "K3s hardware sizing"
    source: "https://docs.k3s.io/installation/requirements"
    match: [k3s, server-sizing, agents-per-server, large-clusters]
  - id: k3s-airgap-install
    name: "K3s airgap install"
    source: "https://docs.k3s.io/installation/airgap"
    match: [k3s, airgap, install-k3s-skip-download, default-route]
  - id: k3s-conditional-image-import
    name: "K3s conditional image import"
    source: "https://docs.k3s.io/add-ons/import-images"
    match: [k3s, cache-json, image-import, startup-time]
  - id: k3s-airgap-upgrade
    name: "K3s airgap upgrade"
    source: "https://docs.k3s.io/installation/airgap"
    match: [k3s, airgap-upgrade, k3s-upgrade-image, system-upgrade-controller]
  - id: k3s-auto-deploying-manifests
    name: "K3s auto deploying manifests"
    source: "https://docs.k3s.io/installation/packaged-components"
    match: [k3s, addon, manifests-directory, deploy-controller]
  - id: k3s-disable-packaged-components
    name: "K3s disable packaged components"
    source: "https://docs.k3s.io/installation/packaged-components"
    match: [k3s, disable-flag, skip-file, traefik]
  - id: k3s-registries-yaml-basics
    name: "K3s registries yaml basics"
    source: "https://docs.k3s.io/installation/private-registry"
    match: [k3s, registries-yaml, mirrors, configs]
  - id: k3s-registry-rewrites-wildcard
    name: "K3s registry rewrites wildcard"
    source: "https://docs.k3s.io/installation/private-registry"
    match: [k3s, registry-rewrite, wildcard-mirror, pull-through-cache]
  - id: k3s-troubleshoot-image-pulls
    name: "K3s troubleshoot image pulls"
    source: "https://docs.k3s.io/installation/private-registry"
    match: [k3s, containerd-log, image-pull-error, k3s-images-txt]
  - id: k3s-embedded-registry-mirror
    name: "K3s embedded registry mirror"
    source: "https://docs.k3s.io/installation/registry-mirror"
    match: [k3s, spegel, embedded-registry, peer-to-peer]
  - id: k3s-embedded-registry-security
    name: "K3s embedded registry security"
    source: "https://docs.k3s.io/installation/registry-mirror"
    match: [k3s, spegel-security, latest-tag, image-digest]
  - id: k3s-helmchart-crd
    name: "K3s helmchart crd"
    source: "https://docs.k3s.io/add-ons/helm"
    match: [k3s, helm-controller, helmchart, helm-cattle-io]
  - id: k3s-helmchart-values-from-secrets
    name: "K3s helmchart values from secrets"
    source: "https://docs.k3s.io/add-ons/helm"
    match: [k3s, values-secrets, ignore-updates, basic-auth-repo]
  - id: k3s-upgrade-with-install-script
    name: "K3s upgrade with install script"
    source: "https://docs.k3s.io/upgrades/manual"
    match: [k3s, upgrade, install-k3s-version, install-k3s-skip-start]
  - id: k3s-release-channels
    name: "K3s release channels"
    source: "https://docs.k3s.io/upgrades/manual"
    match: [k3s, release-channel, stable-latest, install-k3s-channel]
  - id: k3s-upgrade-with-binary
    name: "K3s upgrade with binary"
    source: "https://docs.k3s.io/upgrades/manual"
    match: [k3s, binary-upgrade, usr-local-bin-k3s, drain-cordon]
  - id: k3s-etcd-snapshot-scheduled
    name: "K3s etcd snapshot scheduled"
    source: "https://docs.k3s.io/cli/etcd-snapshot"
    match: [k3s, etcd-snapshot, etcd-snapshot-schedule-cron, etcd-snapshot-retention]
  - id: k3s-etcd-snapshot-s3
    name: "K3s etcd snapshot s3"
    source: "https://docs.k3s.io/cli/etcd-snapshot"
    match: [k3s, etcd-s3, s3-bucket, s3-snapshots]
  - id: k3s-etcd-s3-config-secret
    name: "K3s etcd s3 config secret"
    source: "https://docs.k3s.io/cli/etcd-snapshot"
    match: [k3s, etcd-s3-config-secret, s3-config-secret, credential-rotation]
  - id: k3s-etcd-restore-single-server
    name: "K3s etcd restore single server"
    source: "https://docs.k3s.io/cli/etcd-snapshot"
    match: [k3s, cluster-reset, cluster-reset-restore-path, etcd-restore]
  - id: k3s-etcd-restore-multi-server
    name: "K3s etcd restore multi server"
    source: "https://docs.k3s.io/cli/etcd-snapshot"
    match: [k3s, etcd-restore, multi-server, db-directory]
  - id: k3s-etcd-snapshot-restrictions
    name: "K3s etcd snapshot restrictions"
    source: "https://docs.k3s.io/cli/etcd-snapshot"
    match: [k3s, etcd-snapshot-restrictions, snapshot-dir, s3-endpoint]
  - id: k3s-rollback-after-upgrade
    name: "K3s rollback after upgrade"
    source: "https://docs.k3s.io/upgrades/roll-back"
    match: [k3s, rollback, downgrade, datastore-restore]
  - id: k3s-automated-upgrades-plans
    name: "K3s automated upgrades plans"
    source: "https://docs.k3s.io/upgrades/automated"
    match: [k3s, system-upgrade-controller, upgrade-plan, k3s-upgrade]
  - id: k3s-token-formats-and-types
    name: "K3s token formats and types"
    source: "https://docs.k3s.io/cli/token"
    match: [k3s, server-token, agent-token, secure-token-format]
  - id: k3s-token-bootstrap-commands
    name: "K3s token bootstrap commands"
    source: "https://docs.k3s.io/cli/token"
    match: [k3s, token-create, token-rotate, bootstrap-token]
  - id: k3s-secrets-encrypt-rotate-keys
    name: "K3s secrets encrypt rotate keys"
    source: "https://docs.k3s.io/cli/secrets-encrypt"
    match: [k3s, secrets-encrypt, rotate-keys, reencrypt-finished]
  - id: k3s-secrets-encrypt-enable-existing
    name: "K3s secrets encrypt enable existing"
    source: "https://docs.k3s.io/cli/secrets-encrypt"
    match: [k3s, secrets-encrypt-enable, existing-cluster, rotation-stage]
  - id: k3s-secrets-encrypt-status
    name: "K3s secrets encrypt status"
    source: "https://docs.k3s.io/cli/secrets-encrypt"
    match: [k3s, secrets-encrypt-status, encryption-hashes, rotation-stages]
  - id: k3s-certificate-check-rotate
    name: "K3s certificate check rotate"
    source: "https://docs.k3s.io/cli/certificate"
    match: [k3s, certificate-check, certificate-rotate, cert-expiry]
  - id: k3s-custom-ca-certificates
    name: "K3s custom ca certificates"
    source: "https://docs.k3s.io/cli/certificate"
    match: [k3s, custom-ca, generate-custom-ca-certs, server-tls-dir]
  - id: k3s-rotate-ca-certificates
    name: "K3s rotate ca certificates"
    source: "https://docs.k3s.io/cli/certificate"
    match: [k3s, certificate-rotate-ca, cross-signed-ca, rotate-default-ca-certs]
  - id: k3s-service-account-issuer-key-rotation
    name: "K3s service account issuer key rotation"
    source: "https://docs.k3s.io/cli/certificate"
    match: [k3s, service-account-key, service-key, openssl-genrsa]
  - id: k3s-flannel-backends
    name: "K3s flannel backends"
    source: "https://docs.k3s.io/networking/basic-network-options"
    match: [k3s, flannel-backend, wireguard-native, vxlan]
  - id: k3s-custom-cni
    name: "K3s custom cni"
    source: "https://docs.k3s.io/networking/basic-network-options"
    match: [k3s, custom-cni, canal, calico, cilium]
  - id: k3s-egress-selector-mode
    name: "K3s egress selector mode"
    source: "https://docs.k3s.io/networking/basic-network-options"
    match: [k3s, egress-selector-mode, agent-tunnel, agentless-server]
  - id: k3s-dual-stack-ipv6
    name: "K3s dual stack ipv6"
    source: "https://docs.k3s.io/networking/basic-network-options"
    match: [k3s, dual-stack, cluster-cidr, service-cidr, ipv6]
  - id: k3s-coredns-and-cloud-controller
    name: "K3s coredns and cloud controller"
    source: "https://docs.k3s.io/networking/networking-services"
    match: [k3s, coredns, cloud-controller, disable-cloud-controller]
  - id: k3s-traefik-ingress
    name: "K3s traefik ingress"
    source: "https://docs.k3s.io/networking/networking-services"
    match: [k3s, traefik, ingress, loadbalancer-service]
  - id: k3s-network-policy-controller
    name: "K3s network policy controller"
    source: "https://docs.k3s.io/networking/networking-services"
    match: [k3s, network-policy, kube-router, disable-network-policy]
  - id: k3s-servicelb
    name: "K3s servicelb"
    source: "https://docs.k3s.io/networking/networking-services"
    match: [k3s, servicelb, loadbalancer-service, klipper]
  - id: k3s-servicelb-node-pools
    name: "K3s servicelb node pools"
    source: "https://docs.k3s.io/networking/networking-services"
    match: [k3s, enablelb, lbpool, metallb]
  - id: k3s-agent-node-labels-taints-runtime
    name: "K3s agent node labels taints runtime"
    source: "https://docs.k3s.io/cli/agent"
    match: [k3s, node-label, node-taint, container-runtime-endpoint]
