# Coverage spec: immich. Topics from the official Immich docs sections in sources.
subject: immich
scope:
  category: computing-software
  field: systems-network-administration
  products: [immich]
sources:
  - "https://docs.immich.app/"
topics:
  - id: jobs-and-workers-split
    name: "Jobs and workers split"
    source: "https://docs.immich.app/administration/jobs-workers"
    match: [workers, microservices, immich-workers-include]
  - id: job-processing-order
    name: "Job processing order"
    source: "https://docs.immich.app/administration/jobs-workers"
    match: [jobs, pipeline, nightly-tasks]
  - id: maintenance-mode
    name: "Maintenance mode"
    source: "https://docs.immich.app/administration/maintenance-mode"
    match: [maintenance-mode, login-url, restore]
  - id: immich-admin-commands
    name: "immich-admin commands"
    source: "https://docs.immich.app/administration/server-commands"
    match: [immich-admin, grant-admin, list-users]
  - id: reset-admin-password
    name: "Reset the admin password"
    source: "https://docs.immich.app/administration/server-commands"
    match: [reset-admin-password, password-login, lockout]
  - id: change-media-location
    name: "Change media location"
    source: "https://docs.immich.app/administration/server-commands"
    match: [change-media-location, immich-media-location, schema-check]
  - id: reverse-proxy-nginx
    name: "Reverse proxy with nginx and Caddy"
    source: "https://docs.immich.app/administration/reverse-proxy"
    match: [nginx, caddy, reverse-proxy]
  - id: reverse-proxy-traefik
    name: "Reverse proxy with Traefik"
    source: "https://docs.immich.app/administration/reverse-proxy"
    match: [traefik, respondingtimeouts, apache]
  - id: system-integrity-checks
    name: "System integrity checks"
    source: "https://docs.immich.app/administration/system-integrity"
    match: [integrity, checksum, untracked-files]
  - id: storage-folder-checks
    name: "Storage folder checks"
    source: "https://docs.immich.app/administration/system-integrity"
    match: [mount-check, immich-file, ignore-mount-check-errors]
  - id: postgres-standalone-setup
    name: "Pre-existing Postgres setup"
    source: "https://docs.immich.app/administration/postgres-standalone"
    match: [postgres, db-url, vectorchord]
  - id: postgres-without-superuser
    name: "Postgres without superuser"
    source: "https://docs.immich.app/administration/postgres-standalone"
    match: [superuser, earthdistance, create-extension]
  - id: vectorchord-migration
    name: "Migrating to VectorChord"
    source: "https://docs.immich.app/install/upgrading"
    match: [pgvecto-rs, vectorchord, db-storage-type]
  - id: database-backup-and-restore
    name: "Database backup and restore in the UI"
    source: "https://docs.immich.app/administration/backup-and-restore"
    match: [database-dump, restore, backups]
  - id: database-restore-cli
    name: "Database restore from the command line"
    source: "https://docs.immich.app/administration/backup-and-restore"
    match: [pg-dump, psql, db-skip-migrations]
  - id: filesystem-backup-layout
    name: "Filesystem backup layout"
    source: "https://docs.immich.app/administration/backup-and-restore"
    match: [upload-location, library, thumbs]
  - id: backup-ordering
    name: "Backup ordering"
    source: "https://docs.immich.app/administration/backup-and-restore"
    match: [3-2-1, consistency, restore-order]
  - id: borg-backup-script
    name: "Borg backup script"
    source: "https://docs.immich.app/guides/template-backup-script"
    match: [borg, cron, offsite]
  - id: oauth-client-setup
    name: "OAuth client setup"
    source: "https://docs.immich.app/administration/oauth"
    match: [oauth, oidc, redirect-uri]
  - id: oauth-settings-and-claims
    name: "OAuth settings and claims"
    source: "https://docs.immich.app/administration/oauth"
    match: [issuer-url, storage-quota-claim, auto-register]
  - id: oauth-mobile-redirect
    name: "OAuth mobile redirect"
    source: "https://docs.immich.app/administration/oauth"
    match: [mobile-redirect, auto-launch, oauth-callback]
  - id: cli-install-and-login
    name: "Immich CLI install and login"
    source: "https://docs.immich.app/features/command-line-interface"
    match: [immich-cli, api-key, auth-yml]
  - id: cli-upload
    name: "Immich CLI upload"
    source: "https://docs.immich.app/features/command-line-interface"
    match: [upload, recursive, dry-run]
  - id: duplicates-utility
    name: "Duplicates utility"
    source: "https://docs.immich.app/features/duplicates-utility"
    match: [duplicates, deduplicate, clip]
  - id: facial-recognition-tuning
    name: "Facial recognition tuning"
    source: "https://docs.immich.app/features/facial-recognition"
    match: [facial-recognition, dbscan, recognition-distance]
  - id: better-facial-clusters
    name: "Better facial clusters"
    source: "https://docs.immich.app/guides/better-facial-clusters"
    match: [face-clusters, reset-job, minimum-faces]
  - id: hardware-transcoding-setup
    name: "Hardware transcoding setup"
    source: "https://docs.immich.app/features/hardware-transcoding"
    match: [nvenc, qsv, vaapi]
  - id: transcode-policy-settings
    name: "Transcode policy settings"
    source: "https://docs.immich.app/administration/system-settings"
    match: [ffmpeg, transcode-policy, target-resolution]
  - id: ml-hardware-acceleration
    name: "Machine learning hardware acceleration"
    source: "https://docs.immich.app/features/ml-hardware-acceleration"
    match: [cuda, openvino, hwaccel-ml]
  - id: ml-multi-gpu
    name: "Machine learning multi-GPU"
    source: "https://docs.immich.app/features/ml-hardware-acceleration"
    match: [multi-gpu, device-ids, machine-learning-workers]
  - id: remote-machine-learning
    name: "Remote machine learning"
    source: "https://docs.immich.app/guides/remote-machine-learning"
    match: [remote-ml, port-3003, load-balancing]
  - id: smart-search-clip-models
    name: "Smart search CLIP models"
    source: "https://docs.immich.app/features/searching"
    match: [clip, smart-search, siglip]
  - id: external-library-setup
    name: "External library setup"
    source: "https://docs.immich.app/features/libraries"
    match: [external-library, import-paths, read-only]
  - id: external-library-exclusion-patterns
    name: "External library exclusion patterns"
    source: "https://docs.immich.app/features/libraries"
    match: [exclusion-patterns, glob, picomatch]
  - id: external-library-watching
    name: "External library watching and scanning"
    source: "https://docs.immich.app/features/libraries"
    match: [library-watcher, inotify, periodic-scan]
  - id: xmp-sidecars
    name: "XMP sidecars"
    source: "https://docs.immich.app/features/xmp-sidecars"
    match: [xmp, sidecar, metadata]
  - id: monitoring-prometheus-grafana
    name: "Monitoring with Prometheus and Grafana"
    source: "https://docs.immich.app/features/monitoring"
    match: [prometheus, grafana, telemetry]
  - id: structured-logging
    name: "Structured JSON logging"
    source: "https://docs.immich.app/features/monitoring"
    match: [immich-log-format, json-logs, loki]
  - id: partner-sharing
    name: "Partner sharing"
    source: "https://docs.immich.app/features/partner-sharing"
    match: [partner, timeline, one-way]
  - id: albums-and-shared-links
    name: "Albums and shared links"
    source: "https://docs.immich.app/features/sharing"
    match: [shared-album, public-link, editors]
  - id: locked-folder
    name: "Locked folder"
    source: "https://docs.immich.app/features/locked-folder"
    match: [locked-folder, pin, session]
  - id: google-cast
    name: "Google Cast"
    source: "https://docs.immich.app/features/casting"
    match: [chromecast, cast, https]
  - id: tags
    name: "Tags"
    source: "https://docs.immich.app/features/tags"
    match: [tags, hierarchical, keywords]
  - id: supported-formats
    name: "Supported media formats"
    source: "https://docs.immich.app/features/supported-formats"
    match: [heic, raw, formats]
  - id: remote-access-options
    name: "Remote access options"
    source: "https://docs.immich.app/guides/remote-access"
    match: [vpn, tailscale, wireguard]
  - id: custom-map-styles
    name: "Custom map styles"
    source: "https://docs.immich.app/guides/custom-map-styles"
    match: [map, style-json, maptiler]
  - id: custom-storage-locations
    name: "Custom storage locations"
    source: "https://docs.immich.app/guides/custom-locations"
    match: [thumb-location, profile-location, encoded-video-location]
  - id: database-queries
    name: "Database queries"
    source: "https://docs.immich.app/guides/database-queries"
    match: [sql, asset-table, psql]
  - id: upgrading
    name: "Upgrading Immich"
    source: "https://docs.immich.app/install/upgrading"
    match: [upgrade, immich-version, semver]
  - id: system-requirements
    name: "System requirements"
    source: "https://docs.immich.app/install/requirements"
    match: [requirements, ram, docker-compose]
  - id: config-file
    name: "Config file"
    source: "https://docs.immich.app/install/config-file"
    match: [immich-config-file, json, yaml]
  - id: mobile-backup
    name: "Mobile backup"
    source: "https://docs.immich.app/features/mobile-backup"
    match: [mobile-app, background-backup, album-sync]
  - id: scaling-immich
    name: "Scaling Immich"
    source: "https://docs.immich.app/guides/scaling-immich"
    match: [scaling, multiple-instances, redis]
  - id: environment-variables
    name: "Environment variables"
    source: "https://docs.immich.app/install/environment-variables"
    match: [env, db-hostname, redis-hostname]
