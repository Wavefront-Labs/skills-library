# Coverage spec: Desktop UI frameworks (Qt, WPF/WinUI, Electron, Tauri).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: desktop-ui-frameworks
scope:
  category: computing-software
  field: software-engineering
  products: [desktop-ui-frameworks]
sources:
  - "Qt 6 documentation table of contents (doc.qt.io/qt-6) - core, widgets, Qt Quick/QML, model/view, CMake, deployment, QtTest"
  - "Microsoft Learn WPF and Windows App SDK documentation tables of contents (learn.microsoft.com/dotnet/desktop/wpf, learn.microsoft.com/windows/apps)"
  - "Electron documentation (electronjs.org/docs/latest) - process model, IPC, security, distribution, updates, code signing, performance"
  - "Tauri 2 documentation (v2.tauri.app) - commands, security capabilities, plugins, sidecars, updater, distribution"
topics:
  - id: qt-signals-slots
    name: "Qt signals and slots"
    source: "https://doc.qt.io/qt-6/signalsandslots.html"
    match: [qt-signals-slots]
    subtopics:
      - {id: qt-signals-slots-qt-connect-syntax, name: "Qt connect syntax", match: [qt-connect-syntax]}
      - {id: qt-signals-slots-qt-signal-slot-connection-types, name: "Qt connection types", match: [qt-signal-slot-connection-types]}
      - {id: qt-signals-slots-qt-lambda-connections-context, name: "Qt lambda connections with context object", match: [qt-lambda-connections-context]}
  - id: qt-event-loop
    name: "Qt event loop and timers"
    source: "https://doc.qt.io/qt-6/eventsandfilters.html"
    match: [qt-event-loop]
    subtopics:
      - {id: qt-event-loop-qt-event-loop-exec, name: "Qt event loop and processEvents", match: [qt-event-loop-exec]}
      - {id: qt-event-loop-qt-qtimer-usage, name: "QTimer patterns", match: [qt-qtimer-usage]}
  - id: qt-threads
    name: "Qt threading"
    source: "https://doc.qt.io/qt-6/thread-basics.html"
    match: [qt-threads]
    subtopics:
      - {id: qt-threads-qt-movetothread-worker, name: "Qt worker object with moveToThread", match: [qt-movetothread-worker]}
      - {id: qt-threads-qt-qtconcurrent-run, name: "QtConcurrent run and QFuture", match: [qt-qtconcurrent-run]}
      - {id: qt-threads-qt-thread-affinity-rules, name: "Qt thread affinity rules", match: [qt-thread-affinity-rules]}
  - id: qt-qml
    name: "QML and Qt Quick"
    source: "https://doc.qt.io/qt-6/qtqml-index.html"
    match: [qt-qml]
    subtopics:
      - {id: qt-qml-qt-qml-property-bindings, name: "QML property bindings", match: [qt-qml-property-bindings]}
      - {id: qt-qml-qt-qml-register-cpp-types, name: "Expose C++ to QML with QML_ELEMENT", match: [qt-qml-register-cpp-types]}
      - {id: qt-qml-qt-qml-loader-and-components, name: "QML Loader and dynamic components", match: [qt-qml-loader-and-components]}
  - id: qt-model-view
    name: "Qt model/view"
    source: "https://doc.qt.io/qt-6/model-view-programming.html"
    match: [qt-model-view]
    subtopics:
      - {id: qt-model-view-qt-abstractlistmodel, name: "QAbstractListModel subclass", match: [qt-abstractlistmodel]}
      - {id: qt-model-view-qt-qsortfilterproxymodel, name: "QSortFilterProxyModel", match: [qt-qsortfilterproxymodel]}
      - {id: qt-model-view-qt-delegates-custom, name: "Custom item delegates", match: [qt-delegates-custom]}
  - id: qt-cmake
    name: "Qt with CMake"
    source: "https://doc.qt.io/qt-6/cmake-manual.html"
    match: [qt-cmake]
    subtopics:
      - {id: qt-cmake-qt-cmake-find-package, name: "Qt 6 find_package and qt_standard_project_setup", match: [qt-cmake-find-package]}
      - {id: qt-cmake-qt-cmake-autogen, name: "AUTOMOC AUTOUIC AUTORCC", match: [qt-cmake-autogen]}
      - {id: qt-cmake-qt-cmake-qml-module, name: "qt_add_qml_module", match: [qt-cmake-qml-module]}
  - id: qt-resources-i18n
    name: "Qt resources and translations"
    source: "https://doc.qt.io/qt-6/resources.html"
    match: [qt-resources-i18n]
    subtopics:
      - {id: qt-resources-i18n-qt-qrc-resources, name: "Qt resource system (.qrc)", match: [qt-qrc-resources]}
      - {id: qt-resources-i18n-qt-translations-lupdate, name: "Qt translations with lupdate and lrelease", match: [qt-translations-lupdate]}
  - id: qt-deployment
    name: "Qt deployment"
    source: "https://doc.qt.io/qt-6/windows-deployment.html"
    match: [qt-deployment]
    subtopics:
      - {id: qt-deployment-qt-windeployqt, name: "windeployqt", match: [qt-windeployqt]}
      - {id: qt-deployment-qt-macdeployqt, name: "macdeployqt", match: [qt-macdeployqt]}
      - {id: qt-deployment-qt-linux-appimage-deploy, name: "Qt Linux AppImage deployment", match: [qt-linux-appimage-deploy]}
  - id: qt-testing
    name: "Qt testing"
    source: "https://doc.qt.io/qt-6/qtest-overview.html"
    match: [qt-testing]
    subtopics:
      - {id: qt-testing-qt-qtest-unit-tests, name: "QtTest unit tests with CMake", match: [qt-qtest-unit-tests]}
      - {id: qt-testing-qt-qsignalspy-gui-tests, name: "QSignalSpy and GUI event simulation", match: [qt-qsignalspy-gui-tests]}
  - id: qt-creator
    name: "Qt Creator"
    source: "https://doc.qt.io/qtcreator/"
    match: [qt-creator]
    subtopics:
      - {id: qt-creator-qt-creator-kits-debug, name: "Qt Creator kits and debugging", match: [qt-creator-kits-debug]}
      - {id: qt-creator-qt-creator-clazy-analyzers, name: "Qt Creator code analysis with Clazy", match: [qt-creator-clazy-analyzers]}
  - id: qt-widgets-basics
    name: "Qt Widgets basics"
    source: "https://doc.qt.io/qt-6/layout.html"
    match: [qt-widgets-basics]
    subtopics:
      - {id: qt-widgets-basics-qt-layout-managers, name: "Qt layout managers", match: [qt-layout-managers]}
      - {id: qt-widgets-basics-qt-qsettings-persistence, name: "QSettings persistence", match: [qt-qsettings-persistence]}
  - id: wpf-xaml
    name: "WPF XAML fundamentals"
    source: "https://learn.microsoft.com/en-us/dotnet/desktop/wpf/fundamentals/xaml"
    match: [wpf-xaml]
    subtopics:
      - {id: wpf-xaml-wpf-xaml-resources-merged-dictionaries, name: "WPF resources and merged dictionaries", match: [wpf-xaml-resources-merged-dictionaries]}
      - {id: wpf-xaml-wpf-xaml-markup-extensions, name: "WPF markup extensions and namespaces", match: [wpf-xaml-markup-extensions]}
  - id: wpf-dependency-properties
    name: "WPF dependency properties"
    source: "https://learn.microsoft.com/en-us/dotnet/desktop/wpf/advanced/dependency-properties-overview"
    match: [wpf-dependency-properties]
    subtopics:
      - {id: wpf-dependency-properties-wpf-dependencyproperty-register, name: "Register a WPF dependency property", match: [wpf-dependencyproperty-register]}
      - {id: wpf-dependency-properties-wpf-attached-properties, name: "WPF attached properties", match: [wpf-attached-properties]}
      - {id: wpf-dependency-properties-wpf-value-precedence-inheritance, name: "WPF dependency property value precedence", match: [wpf-value-precedence-inheritance]}
  - id: wpf-data-binding
    name: "WPF data binding"
    source: "https://learn.microsoft.com/en-us/dotnet/desktop/wpf/data/"
    match: [wpf-data-binding]
    subtopics:
      - {id: wpf-data-binding-wpf-binding-modes-and-updatesourcetrigger, name: "WPF binding modes and UpdateSourceTrigger", match: [wpf-binding-modes-and-updatesourcetrigger]}
      - {id: wpf-data-binding-wpf-inotifypropertychanged-observablecollection, name: "INotifyPropertyChanged and ObservableCollection", match: [wpf-inotifypropertychanged-observablecollection]}
      - {id: wpf-data-binding-wpf-binding-debugging, name: "Debug WPF bindings", match: [wpf-binding-debugging]}
  - id: wpf-mvvm
    name: "WPF MVVM with CommunityToolkit.Mvvm"
    source: "https://learn.microsoft.com/en-us/dotnet/communitytoolkit/mvvm/"
    match: [wpf-mvvm]
    subtopics:
      - {id: wpf-mvvm-wpf-mvvm-observableobject-generators, name: "CommunityToolkit.Mvvm ObservableProperty", match: [wpf-mvvm-observableobject-generators]}
      - {id: wpf-mvvm-wpf-mvvm-relaycommand, name: "CommunityToolkit.Mvvm RelayCommand", match: [wpf-mvvm-relaycommand]}
      - {id: wpf-mvvm-wpf-mvvm-messenger-di, name: "WPF messenger and dependency injection", match: [wpf-mvvm-messenger-di]}
  - id: wpf-templates-styles
    name: "WPF templates and styles"
    source: "https://learn.microsoft.com/en-us/dotnet/desktop/wpf/controls/control-customization"
    match: [wpf-templates-styles]
    subtopics:
      - {id: wpf-templates-styles-wpf-controltemplate-visualstates, name: "WPF ControlTemplate and VisualStateManager", match: [wpf-controltemplate-visualstates]}
      - {id: wpf-templates-styles-wpf-datatemplate-selectors, name: "WPF DataTemplate and selectors", match: [wpf-datatemplate-selectors]}
  - id: wpf-commands-input
    name: "WPF commands and input"
    source: "https://learn.microsoft.com/en-us/dotnet/desktop/wpf/advanced/commanding-overview"
    match: [wpf-commands-input]
    subtopics:
      - {id: wpf-commands-input-wpf-icommand-routed-commands, name: "WPF ICommand and RoutedCommand", match: [wpf-icommand-routed-commands]}
      - {id: wpf-commands-input-wpf-focus-keyboard-navigation, name: "WPF focus and keyboard navigation", match: [wpf-focus-keyboard-navigation]}
  - id: wpf-performance
    name: "WPF performance and virtualization"
    source: "https://learn.microsoft.com/en-us/dotnet/desktop/wpf/advanced/optimizing-performance-controls"
    match: [wpf-performance]
    subtopics:
      - {id: wpf-performance-wpf-ui-virtualization, name: "WPF UI virtualization", match: [wpf-ui-virtualization]}
      - {id: wpf-performance-wpf-freeze-render-tuning, name: "WPF Freezable and rendering tuning", match: [wpf-freeze-render-tuning]}
  - id: wpf-threading
    name: "WPF threading and Dispatcher"
    source: "https://learn.microsoft.com/en-us/dotnet/desktop/wpf/advanced/threading-model"
    match: [wpf-threading]
    subtopics:
      - {id: wpf-threading-wpf-dispatcher-invoke, name: "WPF Dispatcher.Invoke and BeginInvoke", match: [wpf-dispatcher-invoke]}
      - {id: wpf-threading-wpf-async-ui-patterns, name: "WPF async UI patterns", match: [wpf-async-ui-patterns]}
  - id: winui-msix-packaging
    name: "WinUI 3 packaging"
    source: "https://learn.microsoft.com/en-us/windows/apps/package-and-deploy/"
    match: [winui-msix-packaging]
    subtopics:
      - {id: winui-msix-packaging-winui-msix-packaged-app, name: "WinUI 3 MSIX packaged app", match: [winui-msix-packaged-app]}
      - {id: winui-msix-packaging-winui-unpackaged-self-contained, name: "WinUI 3 unpackaged deployment", match: [winui-unpackaged-self-contained]}
  - id: winui-windows-app-sdk
    name: "Windows App SDK features"
    source: "https://learn.microsoft.com/en-us/windows/apps/windows-app-sdk/"
    match: [winui-windows-app-sdk]
    subtopics:
      - {id: winui-windows-app-sdk-winui-app-lifecycle-notifications, name: "Windows App SDK lifecycle and notifications", match: [winui-app-lifecycle-notifications]}
      - {id: winui-windows-app-sdk-winui-mica-titlebar-windowing, name: "WinUI 3 windowing and Mica", match: [winui-mica-titlebar-windowing]}
  - id: maui-desktop
    name: "MAUI desktop"
    source: "https://learn.microsoft.com/en-us/dotnet/maui/"
    match: [maui-desktop]
    subtopics:
      - {id: maui-desktop-maui-windows-macos-targets, name: "MAUI desktop targets", match: [maui-windows-macos-targets]}
      - {id: maui-desktop-maui-handlers-customisation, name: "MAUI handler customisation", match: [maui-handlers-customisation]}
  - id: electron-process-model
    name: "Electron process model"
    source: "https://www.electronjs.org/docs/latest/tutorial/process-model"
    match: [electron-process-model]
    subtopics:
      - {id: electron-process-model-electron-main-renderer-processes, name: "Electron main and renderer processes", match: [electron-main-renderer-processes]}
      - {id: electron-process-model-electron-utility-process-worker, name: "Electron utilityProcess for heavy work", match: [electron-utility-process-worker]}
  - id: electron-preload-isolation
    name: "Electron preload and context isolation"
    source: "https://www.electronjs.org/docs/latest/tutorial/context-isolation"
    match: [electron-preload-isolation]
    subtopics:
      - {id: electron-preload-isolation-electron-contextbridge-preload, name: "Electron contextBridge preload", match: [electron-contextbridge-preload]}
      - {id: electron-preload-isolation-electron-sandbox-nodeintegration-off, name: "Electron sandbox and nodeIntegration off", match: [electron-sandbox-nodeintegration-off]}
  - id: electron-ipc
    name: "Electron IPC"
    source: "https://www.electronjs.org/docs/latest/tutorial/ipc"
    match: [electron-ipc]
    subtopics:
      - {id: electron-ipc-electron-ipc-invoke-handle, name: "Electron ipcMain.handle and invoke", match: [electron-ipc-invoke-handle]}
      - {id: electron-ipc-electron-ipc-messageport-streams, name: "Electron MessagePort and main-to-renderer messages", match: [electron-ipc-messageport-streams]}
  - id: electron-security
    name: "Electron security checklist"
    source: "https://www.electronjs.org/docs/latest/tutorial/security"
    match: [electron-security]
    subtopics:
      - {id: electron-security-electron-csp-and-navigation-limits, name: "Electron CSP and navigation limits", match: [electron-csp-and-navigation-limits]}
      - {id: electron-security-electron-remote-content-fuses, name: "Electron fuses and remote content", match: [electron-remote-content-fuses]}
  - id: electron-packaging
    name: "Electron packaging"
    source: "https://www.electronjs.org/docs/latest/tutorial/application-distribution"
    match: [electron-packaging]
    subtopics:
      - {id: electron-packaging-electron-forge-makers, name: "Electron Forge makers", match: [electron-forge-makers]}
      - {id: electron-packaging-electron-builder-config, name: "electron-builder configuration", match: [electron-builder-config]}
  - id: electron-auto-update
    name: "Electron auto-update"
    source: "https://www.electronjs.org/docs/latest/tutorial/updates"
    match: [electron-auto-update]
    subtopics:
      - {id: electron-auto-update-electron-updater-flow, name: "electron-updater update flow", match: [electron-updater-flow]}
      - {id: electron-auto-update-electron-update-server-staged-rollout, name: "Electron update hosting and rollout", match: [electron-update-server-staged-rollout]}
  - id: electron-signing
    name: "Electron code signing and notarization"
    source: "https://www.electronjs.org/docs/latest/tutorial/code-signing"
    match: [electron-signing]
    subtopics:
      - {id: electron-signing-electron-macos-notarize, name: "Electron macOS signing and notarization", match: [electron-macos-notarize]}
      - {id: electron-signing-electron-windows-signing, name: "Electron Windows code signing", match: [electron-windows-signing]}
  - id: electron-performance
    name: "Electron performance"
    source: "https://www.electronjs.org/docs/latest/tutorial/performance"
    match: [electron-performance]
    subtopics:
      - {id: electron-performance-electron-startup-lazy-loading, name: "Electron startup performance", match: [electron-startup-lazy-loading]}
      - {id: electron-performance-electron-memory-background-throttling, name: "Electron memory and background throttling", match: [electron-memory-background-throttling]}
  - id: tauri-commands
    name: "Tauri commands and IPC"
    source: "https://v2.tauri.app/develop/calling-rust/"
    match: [tauri-commands]
    subtopics:
      - {id: tauri-commands-tauri-command-invoke, name: "Tauri commands with invoke", match: [tauri-command-invoke]}
      - {id: tauri-commands-tauri-events-channels, name: "Tauri events and channels", match: [tauri-events-channels]}
  - id: tauri-capabilities
    name: "Tauri 2 capabilities and permissions"
    source: "https://v2.tauri.app/security/capabilities/"
    match: [tauri-capabilities]
    subtopics:
      - {id: tauri-capabilities-tauri-capabilities-config, name: "Tauri capability files", match: [tauri-capabilities-config]}
      - {id: tauri-capabilities-tauri-custom-command-permissions, name: "Tauri permissions for custom commands", match: [tauri-custom-command-permissions]}
  - id: tauri-plugins
    name: "Tauri plugins"
    source: "https://v2.tauri.app/plugin/"
    match: [tauri-plugins]
    subtopics:
      - {id: tauri-plugins-tauri-official-plugins, name: "Tauri official plugins", match: [tauri-official-plugins]}
      - {id: tauri-plugins-tauri-write-custom-plugin, name: "Write a custom Tauri plugin", match: [tauri-write-custom-plugin]}
  - id: tauri-sidecar
    name: "Tauri sidecars"
    source: "https://v2.tauri.app/develop/sidecar/"
    match: [tauri-sidecar]
    subtopics:
      - {id: tauri-sidecar-tauri-external-binary-sidecar, name: "Tauri sidecar external binaries", match: [tauri-external-binary-sidecar]}
      - {id: tauri-sidecar-tauri-sidecar-lifecycle-stdout, name: "Tauri sidecar lifecycle and output", match: [tauri-sidecar-lifecycle-stdout]}
  - id: tauri-updater
    name: "Tauri updater"
    source: "https://v2.tauri.app/plugin/updater/"
    match: [tauri-updater]
    subtopics:
      - {id: tauri-updater-tauri-updater-signing-keys, name: "Tauri updater signing keys", match: [tauri-updater-signing-keys]}
      - {id: tauri-updater-tauri-updater-check-install, name: "Tauri updater check and install", match: [tauri-updater-check-install]}
  - id: tauri-bundling
    name: "Tauri bundling and mobile"
    source: "https://v2.tauri.app/distribute/"
    match: [tauri-bundling]
    subtopics:
      - {id: tauri-bundling-tauri-bundle-targets, name: "Tauri bundle targets", match: [tauri-bundle-targets]}
      - {id: tauri-bundling-tauri-mobile-notes, name: "Tauri 2 mobile notes", match: [tauri-mobile-notes]}
  - id: desktop-dpi-scaling
    name: "Desktop DPI scaling"
    source: "https://learn.microsoft.com/en-us/windows/win32/hidpi/high-dpi-desktop-application-development-on-windows"
    match: [desktop-dpi-scaling]
    subtopics:
      - {id: desktop-dpi-scaling-desktop-dpi-awareness-manifest, name: "Windows DPI awareness manifest", match: [desktop-dpi-awareness-manifest]}
      - {id: desktop-dpi-scaling-desktop-dpi-images-and-layout, name: "DPI-independent assets and layout", match: [desktop-dpi-images-and-layout]}
  - id: desktop-accessibility
    name: "Desktop accessibility"
    source: "https://learn.microsoft.com/en-us/windows/win32/winauto/entry-uiauto-win32"
    match: [desktop-accessibility]
    subtopics:
      - {id: desktop-accessibility-desktop-ui-automation-names-roles, name: "UI Automation names and roles", match: [desktop-ui-automation-names-roles]}
      - {id: desktop-accessibility-desktop-keyboard-contrast-testing, name: "Accessibility keyboard, contrast and testing", match: [desktop-keyboard-contrast-testing]}
  - id: desktop-installers
    name: "Desktop installers and signing"
    source: "https://learn.microsoft.com/en-us/windows/msix/"
    match: [desktop-installers]
    subtopics:
      - {id: desktop-installers-desktop-windows-installer-choices, name: "Windows installer choices", match: [desktop-windows-installer-choices]}
      - {id: desktop-installers-desktop-macos-dmg-pkg-distribution, name: "macOS distribution dmg and pkg", match: [desktop-macos-dmg-pkg-distribution]}
  - id: desktop-crash-reporting
    name: "Desktop crash reporting"
    source: "https://docs.sentry.io/platforms/"
    match: [desktop-crash-reporting]
    subtopics:
      - {id: desktop-crash-reporting-desktop-crashpad-minidumps, name: "Crashpad and minidump capture", match: [desktop-crashpad-minidumps]}
      - {id: desktop-crash-reporting-desktop-error-telemetry-privacy, name: "Crash report privacy and consent", match: [desktop-error-telemetry-privacy]}
  - id: desktop-localisation
    name: "Desktop localisation"
    source: "https://learn.microsoft.com/en-us/dotnet/core/extensions/localization"
    match: [desktop-localisation]
    subtopics:
      - {id: desktop-localisation-desktop-resource-files-per-framework, name: "Localisation resources per framework", match: [desktop-resource-files-per-framework]}
      - {id: desktop-localisation-desktop-rtl-formatting-plurals, name: "RTL, number and date formatting", match: [desktop-rtl-formatting-plurals]}
  - id: desktop-settings-storage
    name: "Desktop settings storage"
    source: "https://learn.microsoft.com/en-us/dotnet/api/system.environment.specialfolder"
    match: [desktop-settings-storage]
    subtopics:
      - {id: desktop-settings-storage-desktop-user-data-locations, name: "User data and config locations", match: [desktop-user-data-locations]}
      - {id: desktop-settings-storage-desktop-settings-migration-secrets, name: "Settings versioning and secrets", match: [desktop-settings-migration-secrets]}
