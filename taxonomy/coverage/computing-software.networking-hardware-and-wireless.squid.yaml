# Coverage spec: squid. Topics hand-grouped from the squid.conf directive reference and the Squid wiki.
subject: squid
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [squid]
sources:
  - "Squid configuration directive reference (squid-cache.org/Doc/config)"
  - "Squid wiki ConfigExamples and Features pages"
topics:
  - id: acl-types-and-options
    name: acl types and options
    source: "https://www.squid-cache.org/Doc/config/acl/"
    match: [acl, src, dstdomain, access-control]
  - id: http-access-rule-order
    name: http access rule order
    source: "https://www.squid-cache.org/Doc/config/http_access/"
    match: [http-access, allow-deny, rule-order, access-control]
  - id: reply-access-control
    name: reply access control
    source: "https://www.squid-cache.org/Doc/config/http_reply_access/"
    match: [http-reply-access, reply, access-control]
  - id: http-port-modes
    name: http port modes
    source: "https://www.squid-cache.org/Doc/config/http_port/"
    match: [http-port, intercept, tproxy, accel, ssl-bump]
  - id: https-port-tls-listener
    name: https port tls listener
    source: "https://www.squid-cache.org/Doc/config/https_port/"
    match: [https-port, tls-cert, tls, accelerator]
  - id: cache-dir-storage
    name: cache dir storage
    source: "https://www.squid-cache.org/Doc/config/cache_dir/"
    match: [cache-dir, ufs, aufs, diskd, rock]
  - id: cache-mem-limit
    name: cache mem limit
    source: "https://www.squid-cache.org/Doc/config/cache_mem/"
    match: [cache-mem, memory-cache, hot-objects]
  - id: cache-replacement-and-swap-marks
    name: cache replacement and swap marks
    source: "https://www.squid-cache.org/Doc/config/cache_replacement_policy/"
    match: [cache-replacement-policy, lru, gdsf, lfuda, cache-swap-low]
  - id: object-size-limit
    name: object size limit
    source: "https://www.squid-cache.org/Doc/config/maximum_object_size/"
    match: [maximum-object-size, byte-hit-ratio, cache-tuning]
  - id: refresh-pattern
    name: refresh pattern
    source: "https://www.squid-cache.org/Doc/config/refresh_pattern/"
    match: [refresh-pattern, freshness, min-percent-max, override-expire, ignore-reload]
  - id: cache-allow-deny
    name: cache allow deny
    source: "https://www.squid-cache.org/Doc/config/cache/"
    match: [cache-directive, no-cache, send-hit, store-miss]
  - id: cache-peer-hierarchy
    name: cache peer hierarchy
    source: "https://www.squid-cache.org/Doc/config/cache_peer/"
    match: [cache-peer, parent, sibling, round-robin, carp]
  - id: cache-peer-access-control
    name: cache peer access control
    source: "https://www.squid-cache.org/Doc/config/cache_peer_access/"
    match: [cache-peer-access, peer-selection, acl]
  - id: never-always-direct
    name: never always direct
    source: "https://www.squid-cache.org/Doc/config/never_direct/"
    match: [never-direct, always-direct, forwarding, cache-peer]
  - id: icp-neighbour-queries
    name: icp neighbour queries
    source: "https://www.squid-cache.org/Doc/config/icp_port/"
    match: [icp-port, icp, htcp, neighbour-caches]
  - id: ssl-bump-actions
    name: ssl bump actions
    source: "https://www.squid-cache.org/Doc/config/ssl_bump/"
    match: [ssl-bump, splice, bump, peek, stare, terminate]
  - id: ssl-bump-peek-and-splice
    name: ssl bump peek and splice
    source: "https://wiki.squid-cache.org/Features/SslPeekAndSplice"
    match: [ssl-bump, peek-and-splice, sni, at-step, mimic]
  - id: ssl-bump-ca-and-certgen
    name: ssl bump ca and certgen
    source: "https://wiki.squid-cache.org/ConfigExamples/Intercept/SslBumpExplicit"
    match: [ssl-bump, ca-certificate, sslcrtd-program, security-file-certgen, openssl]
  - id: tls-outgoing-verification
    name: tls outgoing verification
    source: "https://www.squid-cache.org/Doc/config/tls_outgoing_options/"
    match: [tls-outgoing-options, certificate-verification, cafile, min-version]
  - id: auth-param-schemes
    name: auth param schemes
    source: "https://www.squid-cache.org/Doc/config/auth_param/"
    match: [auth-param, basic, digest, negotiate, ntlm]
  - id: ncsa-basic-auth
    name: ncsa basic auth
    source: "https://wiki.squid-cache.org/ConfigExamples/Authenticate/Ncsa"
    match: [ncsa, htpasswd, basic-auth, proxy-auth]
  - id: kerberos-negotiate-auth
    name: kerberos negotiate auth
    source: "https://wiki.squid-cache.org/ConfigExamples/Authenticate/Kerberos"
    match: [kerberos, negotiate, keytab, krb5, single-sign-on]
  - id: ldap-basic-auth
    name: ldap basic auth
    source: "https://wiki.squid-cache.org/ConfigExamples/Authenticate/Ldap"
    match: [ldap, squid-ldap-auth, basic-auth, bind-dn]
  - id: group-based-access
    name: group based access
    source: "https://wiki.squid-cache.org/ConfigExamples/Authenticate/Groups"
    match: [groups, external-acl, winbind, authorization]
  - id: external-acl-helper
    name: external acl helper
    source: "https://www.squid-cache.org/Doc/config/external_acl_type/"
    match: [external-acl-type, helper, ttl, children-max, tag]
  - id: auth-bypass-for-sites
    name: auth bypass for sites
    source: "https://wiki.squid-cache.org/ConfigExamples/Authenticate/Bypass"
    match: [authentication-bypass, http-access, proxy-auth, whitelist]
  - id: delay-pools-classes
    name: delay pools classes
    source: "https://www.squid-cache.org/Doc/config/delay_pools/"
    match: [delay-pools, delay-class, bandwidth-limit, traffic-shaping]
  - id: delay-pool-parameters
    name: delay pool parameters
    source: "https://www.squid-cache.org/Doc/config/delay_parameters/"
    match: [delay-parameters, restore-maximum, bytes-per-second, delay-pools]
  - id: client-delay-pools
    name: client delay pools
    source: "https://www.squid-cache.org/Doc/config/client_delay_pools/"
    match: [client-delay-pools, bandwidth, client-delay-parameters]
  - id: access-log-modules
    name: access log modules
    source: "https://www.squid-cache.org/Doc/config/access_log/"
    match: [access-log, logging, daemon, syslog, acl-filtering]
  - id: logformat-codes
    name: logformat codes
    source: "https://www.squid-cache.org/Doc/config/logformat/"
    match: [logformat, log-format, format-codes, squid-log]
  - id: log-rotation-and-debug
    name: log rotation and debug
    source: "https://www.squid-cache.org/Doc/config/logfile_rotate/"
    match: [logfile-rotate, debug-options, cache-log, squid-k-rotate]
  - id: x-forwarded-for-trust
    name: x forwarded for trust
    source: "https://www.squid-cache.org/Doc/config/follow_x_forwarded_for/"
    match: [follow-x-forwarded-for, indirect-client, trusted-proxy, acl-uses-indirect-client]
  - id: forwarded-for-policy
    name: forwarded for policy
    source: "https://www.squid-cache.org/Doc/config/forwarded_for/"
    match: [forwarded-for, x-forwarded-for, privacy, header]
  - id: request-header-access
    name: request header access
    source: "https://www.squid-cache.org/Doc/config/request_header_access/"
    match: [request-header-access, header-filtering, via, anonymity]
  - id: reverse-proxy-accelerator
    name: reverse proxy accelerator
    source: "https://wiki.squid-cache.org/ConfigExamples/Reverse/BasicAccelerator"
    match: [reverse-proxy, accelerator, originserver, defaultsite]
  - id: reverse-proxy-multiple-backends
    name: reverse proxy multiple backends
    source: "https://wiki.squid-cache.org/ConfigExamples/Reverse/MultipleWebservers"
    match: [reverse-proxy, multiple-backends, cache-peer-access, dstdomain]
  - id: reverse-proxy-https-vhosts
    name: reverse proxy https vhosts
    source: "https://wiki.squid-cache.org/ConfigExamples/Reverse/HttpsVirtualHosting"
    match: [reverse-proxy, https-port, tls-cert, virtual-hosts]
  - id: intercept-linux-redirect
    name: intercept linux redirect
    source: "https://wiki.squid-cache.org/ConfigExamples/Intercept/LinuxRedirect"
    match: [intercept, iptables, redirect, nat]
  - id: tproxy-v4
    name: tproxy v4
    source: "https://wiki.squid-cache.org/Features/Tproxy4"
    match: [tproxy, linux-netfilter, policy-routing, iptables]
  - id: icap-service
    name: icap service
    source: "https://www.squid-cache.org/Doc/config/icap_service/"
    match: [icap, icap-service, content-adaptation, reqmod, respmod]
  - id: adaptation-access
    name: adaptation access
    source: "https://www.squid-cache.org/Doc/config/adaptation_access/"
    match: [adaptation-access, icap, ecap, service-activation]
  - id: ecap-service
    name: ecap service
    source: "https://www.squid-cache.org/Doc/config/ecap_service/"
    match: [ecap, ecap-service, content-adaptation]
  - id: url-rewrite-helper
    name: url rewrite helper
    source: "https://www.squid-cache.org/Doc/config/url_rewrite_program/"
    match: [url-rewrite-program, redirector, helper, rewrite-url]
  - id: store-id-helper
    name: store id helper
    source: "https://www.squid-cache.org/Doc/config/store_id_program/"
    match: [store-id, store-id-program, cache-key, helper]
  - id: dns-and-hostname
    name: dns and hostname
    source: "https://www.squid-cache.org/Doc/config/dns_nameservers/"
    match: [dns-nameservers, visible-hostname, resolver]
  - id: smp-workers
    name: smp workers
    source: "https://www.squid-cache.org/Doc/config/workers/"
    match: [workers, smp, multi-process, rock]
  - id: connect-and-read-timeouts
    name: connect and read timeouts
    source: "https://www.squid-cache.org/Doc/config/connect_timeout/"
    match: [connect-timeout, read-timeout, timeouts]
  - id: collapsed-forwarding
    name: collapsed forwarding
    source: "https://www.squid-cache.org/Doc/config/collapsed_forwarding/"
    match: [collapsed-forwarding, concurrent-requests, cache-miss]
  - id: deny-info-responses
    name: deny info responses
    source: "https://www.squid-cache.org/Doc/config/deny_info/"
    match: [deny-info, error-page, redirect, tcp-reset]
  - id: error-page-directory
    name: error page directory
    source: "https://www.squid-cache.org/Doc/config/error_directory/"
    match: [error-directory, error-pages, custom-errors]
  - id: range-offset-limit
    name: range offset limit
    source: "https://www.squid-cache.org/Doc/config/range_offset_limit/"
    match: [range-offset-limit, range-requests, partial-content]
  - id: quick-abort-retrieval
    name: quick abort retrieval
    source: "https://www.squid-cache.org/Doc/config/quick_abort_min/"
    match: [quick-abort, aborted-downloads, cache-fill]
  - id: snmp-port
    name: snmp port
    source: "https://www.squid-cache.org/Doc/config/snmp_port/"
    match: [snmp, snmp-port, monitoring]
  - id: cache-manager-password
    name: cache manager password
    source: "https://www.squid-cache.org/Doc/config/cachemgr_passwd/"
    match: [cachemgr-passwd, cache-manager, admin-actions]
  - id: persistent-client-connections
    name: persistent client connections
    source: "https://www.squid-cache.org/Doc/config/client_persistent_connections/"
    match: [persistent-connections, keep-alive, client-connections]
  - id: request-body-size-limit
    name: request body size limit
    source: "https://www.squid-cache.org/Doc/config/request_body_max_size/"
    match: [request-body-max-size, upload-limit, post]
  - id: process-user-fd-shutdown
    name: process user fd shutdown
    source: "https://www.squid-cache.org/Doc/config/cache_effective_user/"
    match: [cache-effective-user, max-filedescriptors, shutdown-lifetime, process]
