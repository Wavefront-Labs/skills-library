# Coverage spec: wails. Topics from the official docs table of contents.
subject: wails
scope:
  category: computing-software
  field: software-engineering
  products: [wails]
sources:
  - "Wails docs (wails.io/docs)"
topics:
  - id: wails-a-overview
    name: "Wails introduction"
    source: "https://wails.io/docs/introduction"
    match: [overview]
  - id: wails-a-architecture
    name: "How Wails works"
    source: "https://wails.io/docs/howdoesitwork"
    match: [architecture]
  - id: wails-a-options-lifecycle
    name: "App options and lifecycle"
    source: "https://wails.io/docs/howdoesitwork"
    match: [lifecycle]
  - id: wails-a-binding
    name: "Binding Go methods"
    source: "https://wails.io/docs/howdoesitwork"
    match: [binding]
  - id: wails-a-frontend-calls
    name: "Calling Go from the frontend"
    source: "https://wails.io/docs/howdoesitwork"
    match: [javascript]
  - id: wails-a-installation
    name: "Installation"
    source: "https://wails.io/docs/gettingstarted/installation"
    match: [installation]
  - id: wails-a-project-creation
    name: "Creating a project"
    source: "https://wails.io/docs/gettingstarted/firstproject"
