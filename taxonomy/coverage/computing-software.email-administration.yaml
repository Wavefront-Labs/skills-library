# Canonical coverage spec: Email administration (SMTP/IMAP mail servers).
subject: email-administration
scope:
  category: computing-software
  field: email-administration
  products: [mail-server-administration]
sources:
  - "RFC 5321 SMTP, RFC 5322 message format, RFC 6409 submission, RFC 3501 and 9051 IMAP (rfc-editor.org)"
  - "RFC 6376 DKIM, RFC 7208 SPF, RFC 7489 DMARC, RFC 8617 ARC (rfc-editor.org)"
  - "RFC 8461 MTA-STS, RFC 8460 TLS-RPT, RFC 7672 SMTP DANE (rfc-editor.org)"
  - "Postfix documentation (postfix.org/documentation.html) - READMEs, postconf, postqueue, postsuper"
  - "Dovecot documentation (doc.dovecot.org) - auth, mailbox formats, LMTP, Sieve, quota, replication"
  - "Rspamd (rspamd.com/doc) and SpamAssassin (spamassassin.apache.org/doc.html) documentation"
  - "M3AAWG sender best practices (m3aawg.org) and Google/Yahoo bulk sender requirements"
topics:
  - id: ea-mail-dns-records
    name: "DNS records for a mail domain"
    source: "5321"
    match: [mail-dns-records]
    subtopics:
      - {id: ea-mail-dns-records-mx-record-setup, name: "mx record setup", match: [mx-record-setup]}
      - {id: ea-mail-dns-records-reverse-dns-ptr, name: "reverse dns ptr", match: [reverse-dns-ptr]}
      - {id: ea-mail-dns-records-forward-confirmed-rdns, name: "forward confirmed rdns", match: [forward-confirmed-rdns]}
  - id: ea-smtp-protocol
    name: "SMTP protocol fundamentals"
    source: "5321"
    match: [smtp-protocol]
    subtopics:
      - {id: ea-smtp-protocol-smtp-session-by-hand, name: "smtp session by hand", match: [smtp-session-by-hand]}
      - {id: ea-smtp-protocol-smtp-reply-codes, name: "smtp reply codes", match: [smtp-reply-codes]}
  - id: ea-message-format
    name: "Message format and envelope"
    source: "5322"
    match: [message-format]
    subtopics:
      - {id: ea-message-format-envelope-vs-header-from, name: "envelope vs header from", match: [envelope-vs-header-from]}
      - {id: ea-message-format-header-anatomy-reading, name: "header anatomy reading", match: [header-anatomy-reading]}
  - id: ea-submission-relay
    name: "Submission versus relay"
    source: "6409"
    match: [submission-relay]
    subtopics:
      - {id: ea-submission-relay-submission-port-587, name: "submission port 587", match: [submission-port-587]}
      - {id: ea-submission-relay-smtps-465-implicit-tls, name: "smtps 465 implicit tls", match: [smtps-465-implicit-tls]}
      - {id: ea-submission-relay-relay-vs-submission-policy, name: "relay vs submission policy", match: [relay-vs-submission-policy]}
  - id: ea-postfix-basics
    name: "Postfix core configuration"
    source: "postfix"
    match: [postfix-basics]
    subtopics:
      - {id: ea-postfix-basics-main-cf-essentials, name: "main cf essentials", match: [main-cf-essentials]}
      - {id: ea-postfix-basics-postconf-usage, name: "postconf usage", match: [postconf-usage]}
      - {id: ea-postfix-basics-master-cf-services, name: "master cf services", match: [master-cf-services]}
