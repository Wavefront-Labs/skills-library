# Coverage spec for cortex, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: cortex
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [cortex]
sources:
  - "Cortex documentation (docs in cortexproject/cortex master)"
topics:
  - id: architecture
    name: "Architecture overview"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [architecture, microservices, remote-write]
  - id: multi-tenancy
    name: "Multi-tenancy"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [multi-tenancy]
  - id: distributor
    name: "Distributor"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [distributor, write-path, validation]
  - id: distributor-quorum
    name: "Write quorum"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [quorum, load-balancing]
  - id: ha-tracker
    name: "High availability tracker"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/blocks-storage/compactor.md"
    match: [ha-tracker, deduplication]
  - id: ha-cluster-label
    name: "HA cluster and replica labels"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [cluster-label, consul, etcd]
  - id: hash-ring
    name: "Hash ring"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/gossip-ring-getting-started.md"
    match: [hash-ring, consistent-hashing]
  - id: ring-tokens
    name: "Ring tokens and replication factor"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [tokens, replication-factor]
  - id: ingester-lifecycle
    name: "Ingester lifecycle states"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [ring-states, lifecycler]
  - id: ingester-wal
    name: "Write-ahead log"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/blocks-storage/production-tips.md"
    match: [wal, ingester]
  - id: ingester-failure
    name: "Ingester failure and data loss"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [data-loss, replication]
  - id: compactor
    name: "Compactor"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/blocks-storage/bucket-index.md"
    match: [compactor, compaction]
  - id: compactor-sharding
    name: "Compactor sharding"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/alert-manager-configuration.md"
    match: [sharding]
  - id: bucket-index
    name: "Bucket index"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/blocks-storage/bucket-index.md"
    match: [bucket-index, object-storage]
  - id: store-gateway
    name: "Store gateway"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/blocks-storage/bucket-index.md"
    match: [store-gateway]
  - id: index-header
    name: "Index header"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/blocks-storage/binary-index-header.md"
    match: [index-header, byte-range]
  - id: production-tips
    name: "Blocks storage production tips"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/blocks-storage/production-tips.md"
    match: [production, file-descriptors, disk-sizing]
  - id: query-frontend
    name: "Query frontend"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [query-frontend, splitting, caching]
  - id: query-queueing
    name: "Query queueing and fair scheduling"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [queueing, fair-scheduling]
  - id: query-scheduler
    name: "Query scheduler"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [query-scheduler, queue]
  - id: ruler
    name: "Ruler"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/ruler-tenant-federation.md"
    match: [ruler, rules]
  - id: ruler-api
    name: "Ruler configs API"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [configs-api]
  - id: alertmanager
    name: "Alertmanager"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/alert-manager-configuration.md"
    match: [alertmanager, notifications]
  - id: alertmanager-config
    name: "Alertmanager configuration"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/alert-manager-configuration.md"
    match: [storage-backend, cortextool]
  - id: v1-guarantees
    name: "v1.x compatibility guarantees"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/configuration/v1-guarantees.md"
    match: [compatibility, deprecated-flags, experimental-features]
  - id: scaling-ingesters
    name: "Scaling ingesters"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [scaling, readonly-mode, shutdown-endpoint]
  - id: shuffle-sharding
    name: "Shuffle sharding"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/shuffle-sharding.md"
    match: [shuffle-sharding, tenant-isolation]
  - id: zone-awareness
    name: "Zone-aware replication"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/zone-replication.md"
    match: [zone-awareness, availability-zones]
  - id: rate-limiting
    name: "Ingestion rate limiting"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/rate-limiting.md"
    match: [rate-limiting, ingestion-rate, burst]
  - id: overrides-api
    name: "Runtime overrides API"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/overrides-exporter.md"
    match: [overrides, runtime-config, limits]
  - id: overrides-exporter
    name: "Overrides exporter"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/overrides-exporter.md"
    match: [overrides-exporter, tenant-limits]
  - id: tls
    name: "TLS between components"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/tls.md"
    match: [tls, mtls, grpc]
  - id: tracing
    name: "Tracing"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/open-telemetry-collector.md"
    match: [tracing, jaeger, opentelemetry]
  - id: gossip-ring
    name: "Gossip ring with memberlist"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/gossip-ring-getting-started.md"
    match: [memberlist, gossip]
  - id: kv-migration
    name: "Migrating KV store"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/migration-kv-store-to-memberlist.md"
    match: [migration, multi-kv, mirror]
  - id: otlp
    name: "OpenTelemetry push"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/architecture.md"
    match: [otlp, remote-write]
  - id: parquet
    name: "Parquet mode"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/parquet-mode.md"
    match: [parquet, converter]
  - id: timeout-classification
    name: "Query timeout classification"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/timeout-classification.md"
    match: [timeouts, error-classification]
  - id: federated-rules
    name: "Federated rule groups"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/ruler-tenant-federation.md"
    match: [federation, source-tenants]
  - id: ruler-query-frontend
    name: "Ruler through query frontend"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/rule-evaluations-via-query-frontend.md"
    match: [rule-evaluation, protobuf]
  - id: monitoring
    name: "Monitoring assets"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/operations/monitoring-cortex.md"
    match: [monitoring, dashboards, mixin]
  - id: troubleshooting-write
    name: "Write path troubleshooting"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/operations/troubleshooting.md"
    match: [push-errors, inflight-requests]
  - id: troubleshooting-read
    name: "Read path troubleshooting"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/tracing.md"
    match: [troubleshooting, queries]
  - id: upgrading
    name: "Upgrading a cluster"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/operations/upgrading.md"
    match: [upgrade, rollout-order, changelog]
  - id: query-tee
    name: "Query tee"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/operations/query-auditor.md"
    match: [query-tee, comparison, backends]
  - id: query-auditor
    name: "Query auditor"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/operations/query-auditor.md"
    match: [query-audit, correctness]
  - id: request-mirroring
    name: "Request mirroring"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/operations/requests-mirroring-to-secondary-cluster.md"
    match: [mirroring, shadowing, envoy]
  - id: capacity-planning
    name: "Capacity planning"
    source: "https://github.com/cortexproject/cortex/blob/master/docs/guides/capacity-planning.md"
    match: [capacity-planning, sizing, ingester-memory]
