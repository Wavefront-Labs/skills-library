# Coverage spec for SaltStack (computing-software / cloud-infrastructure-engineering).
subject: SaltStack
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [saltstack]
sources:
  - "Salt Project documentation (https://github.com/saltstack/salt/tree/master/doc)"
topics:
  - id: requisites-require-watch
    name: "require and watch requisites"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/requisites.rst
    match: ["require", "watch", "mod-watch"]
  - id: requisites-onchanges-onfail
    name: "onchanges and onfail requisites"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/requisites.rst
    match: ["onchanges", "onfail", "failhard"]
  - id: requisites-listen-prereq-use
    name: "listen, prereq and use"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/requisites.rst
    match: ["listen", "prereq", "use"]
  - id: requisites-in-and-any-forms
    name: "_in and _any requisite forms"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/requisites.rst
    match: ["require-in", "watch-in", "require-any", "onlyif", "unless", "creates"]
  - id: targeting-glob-regex-list
    name: "Targeting by ID: glob, regex, list"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/targeting/globbing.rst
    match: ["glob", "regex", "pcre", "list", "minion-id"]
  - id: targeting-compound
    name: "Compound targeting"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/targeting/compound.rst
    match: ["compound", "matchers", "boolean"]
  - id: targeting-nodegroups
    name: "Nodegroups"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/targeting/nodegroups.rst
    match: ["nodegroups"]
  - id: targeting-batch
    name: "Batch execution"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/targeting/batch.rst
    match: ["batch", "batch-size", "batch-wait"]
  - id: targeting-grains
    name: "Grain targeting"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/targeting/grains.rst
    match: ["nested-grains", "targeting"]
  - id: targeting-pillar
    name: "Pillar targeting"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/targeting/pillar.rst
    match: ["pillar-cache", "refresh-pillar"]
  - id: targeting-ipcidr
    name: "Subnet and IP targeting"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/targeting/ipcidr.rst
    match: ["ipcidr", "subnet", "cidr"]
  - id: pillar-layout
    name: "Pillar roots, top file and includes"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/pillar/index.rst
    match: ["pillar-roots", "ignore-missing", "include"]
  - id: pillar-merging
    name: "Pillar merging"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/pillar/index.rst
    match: ["pillar-source-merging-strategy", "pillar-merge-lists", "merging"]
  - id: pillar-refresh-inspect
    name: "Refreshing and inspecting pillar"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/pillar/index.rst
    match: ["pillar-items", "pillar-get", "pillar-cache"]
  - id: pillar-in-templates
    name: "Pillar in states and templates"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/pillar/index.rst
    match: ["jinja", "templates"]
  - id: pillar-environments-cli
    name: "Pillar environments and CLI pillar"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/pillar/index.rst
    match: ["pillarenv", "pillar-opts", "pillar-safe-render-error"]
  - id: pillar-tutorial
    name: "Pillar tutorial"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/tutorials/pillar.rst
    match: ["tutorial", "state-apply", "security"]
  - id: grains-static
    name: "Static grains"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/grains/index.rst
    match: ["grains", "static-grains", "grains-items"]
  - id: grains-custom
    name: "Custom grain modules"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/grains/index.rst
    match: ["custom-grains", "sync-grains", "python"]
  - id: grains-precedence
    name: "Grain precedence"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/grains/index.rst
    match: ["precedence", "core-grains"]
  - id: top-file
    name: "State top file"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/top.rst
    match: ["top-file", "environments", "saltenv", "match"]
  - id: top-file-merging
    name: "Top file merging"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/top.rst
    match: ["top-file-merging-strategy", "merge-all"]
  - id: states-include-exclude
    name: "include and exclude"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/include.rst
    match: ["exclude", "relative-include"]
  - id: states-extend
    name: "extend"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/extend.rst
    match: ["extend"]
  - id: states-ordering
    name: "State ordering"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/ordering.rst
    match: ["ordering", "order", "state-auto-order"]
  - id: states-failhard
    name: "failhard"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/failhard.rst
    match: ["error-handling"]
  - id: states-test-mode
    name: "State test mode"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/states/testing.rst
    match: ["test-mode", "dry-run"]
  - id: states-name-names
    name: "name and names"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/tutorials/states_pt3.rst
    match: ["name", "names", "state-id", "environ"]
  - id: jinja-sls
    name: "Jinja in SLS"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/jinja/index.rst
    match: ["templating", "macros", "import-yaml", "filter-by"]
  - id: jinja-filters-debug
    name: "Jinja filters, escaping and debugging"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/jinja/index.rst
    match: ["filters", "escaping", "raw", "debugging", "profile", "yaml-encode"]
  - id: renderers
    name: "Renderer pipelines"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/renderers/index.rst
    match: ["renderers", "shebang", "pipeline", "text-renderer", "data-renderer"]
  - id: renderers-custom
    name: "Custom renderers"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/renderers/index.rst
    match: ["custom-renderer", "sync-renderers"]
  - id: gitfs-setup
    name: "GitFS setup and providers"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/tutorials/gitfs.rst
    match: ["gitfs", "fileserver-backend", "gitfs-remotes", "pygit2", "gitpython", "gitcli"]
  - id: gitfs-remote-settings
    name: "GitFS per-remote settings"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/tutorials/gitfs.rst
    match: ["mountpoint", "per-remote", "per-saltenv", "refspecs"]
  - id: gitfs-branches
    name: "GitFS branches as environments"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/tutorials/gitfs.rst
    match: ["branches", "whitelist", "blacklist"]
  - id: gitfs-auth
    name: "GitFS authentication"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/tutorials/gitfs.rst
    match: ["authentication", "gitlab", "known-hosts"]
  - id: gitfs-refresh
    name: "GitFS refresh on push"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/tutorials/gitfs.rst
    match: ["post-receive", "fileserver-update", "update-interval"]
  - id: reactor
    name: "Reactor configuration"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/reactor/index.rst
    match: ["reactor", "tuning"]
  - id: reactor-types-debug
    name: "Reaction types and debugging"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/reactor/index.rst
    match: ["local", "runner", "wheel", "caller"]
  - id: beacons
    name: "Beacons"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/beacons/index.rst
    match: ["beacons", "interval", "disable-during-state-run", "inotify", "revert"]
  - id: events
    name: "Master event tags"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/event/master_events.rst
    match: ["events", "event-bus", "tags", "presence"]
  - id: mine
    name: "Salt Mine"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/mine/index.rst
    match: ["mine", "mine-functions", "mine-get", "allow-tgt"]
  - id: returners
    name: "Returners"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/returners/index.rst
    match: ["returners", "return", "custom-returner", "master-job-cache", "external-job-cache", "event-return"]
  - id: jobs
    name: "Job management"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/jobs/index.rst
    match: ["jobs", "saltutil", "find-job", "jobs-runner", "lookup-jid", "keep-jobs-seconds"]
  - id: orchestrate
    name: "Orchestrate runner"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/orchestrate/orchestrate_runner.rst
    match: ["orchestrate", "salt-state", "allow-fail", "batch"]
  - id: salt-ssh
    name: "salt-ssh and roster"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/ssh/index.rst
    match: ["salt-ssh", "roster", "ssh-keys", "sudo", "saltfile"]
  - id: salt-ssh-roster-options
    name: "salt-ssh roster options"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/ssh/roster.rst
    match: ["thin-dir", "pre-flight", "roster-defaults", "ssh-options"]
  - id: external-auth
    name: "External authentication"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/topics/eauth/index.rst
    match: ["external-auth", "eauth", "acl", "pam", "ldap", "tokens"]
  - id: publisher-acl
    name: "publisher_acl"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/publisheracl.rst
    match: ["publisher-acl", "non-root"]
  - id: salt-key
    name: "salt-key"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/cli/salt-key.rst
    match: ["salt-key", "keys", "fingerprint", "gen-signature", "aes"]
  - id: salt-cli
    name: "salt and salt-call CLI"
    source: https://raw.githubusercontent.com/saltstack/salt/master/doc/ref/cli/salt.rst
    match: ["salt-cli", "salt-call", "async", "static", "masterless", "retcode-passthrough"]
