subject: n8n
scope:
  category: computing-software
  field: rpa-and-low-code
  products: [n8n]
sources:
  - "n8n documentation, https://docs.n8n.io/"
topics:
  - id: aggregate-node
    name: aggregate node
    source: "https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.aggregate"
    match: [aggregate, group-items, merge-lists]
  - id: backup-and-restore
    name: backup and restore
    source: "https://docs.n8n.io/deploy/host-n8n/keep-n8n-running/backup-and-restore"
    match: [backup, restore, encryption-key]
  - id: choose-branching-patterns
    name: choose branching patterns
    source: "https://docs.n8n.io/administer/use-source-control-and-environments/choose-branching-patterns"
    match: [source-control, branches, environments]
  - id: choose-database
    name: choose database
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/choose-n8ns-database"
    match: [database, postgresql, sqlite]
  - id: code-node-common-issues
    name: code node common issues
    source: "https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.code/common-issues"
    match: [code-node, return-format, require]
  - id: connect-ldap
    name: connect ldap
    source: "https://docs.n8n.io/administer/manage-users-and-access/verify-user-identity/connect-ldap"
    match: [ldap, sso, bind]
  - id: control-concurrency
    name: control concurrency
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/scaling/control-concurrency"
    match: [concurrency, production-limit, queue]
  - id: convert-to-sub-workflows
    name: convert to sub workflows
    source: "https://docs.n8n.io/build/flow-logic/convert-to-sub-workflows"
    match: [sub-workflow, refactor, execute-workflow-trigger]
  - id: credential-overwrites
    name: credential overwrites
    source: "https://docs.n8n.io/administer/manage-credentials/credential-overwrites"
    match: [credentials, oauth, credentials-overwrite-endpoint]
  - id: data-tables
    name: data tables
    source: "https://docs.n8n.io/build/work-with-data/data-tables"
    match: [data-tables, storage, csv-import]
  - id: deployment-env-vars
    name: deployment env vars
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/deployment"
    match: [environment-variables, proxy, n8n-host]
  - id: encryption-key-rotation
    name: encryption key rotation
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/security/rotate-encryption-keys"
    match: [encryption, key-rotation, credentials]
  - id: endpoints-and-metrics-env
    name: endpoints and metrics env
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/endpoints"
    match: [endpoints, metrics, prometheus]
  - id: error-workflows
    name: error workflows
    source: "https://docs.n8n.io/build/flow-logic/handle-errors-gracefully"
    match: [error-workflow, error-trigger, stop-and-error]
  - id: execution-data-pruning
    name: execution data pruning
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/scaling/manage-execution-data"
    match: [execution-data, pruning, sqlite-vacuum]
  - id: executions-env-vars
    name: executions env vars
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/executions"
    match: [executions, timeout, data-pruning]
  - id: expressions-data-transformation
    name: expressions data transformation
    source: "https://docs.n8n.io/build/work-with-data/transform-data/expressions-for-data-transformation"
    match: [expressions, edit-fields, iife]
  - id: http-request-common-issues
    name: http request common issues
    source: "https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.httprequest/common-issues"
    match: [http-request, docker-networking, rate-limits]
  - id: install-docker-compose
    name: install docker compose
    source: "https://docs.n8n.io/deploy/host-n8n/install-options/install-using-docker-compose"
    match: [docker-compose, env-file, postgres]
  - id: install-with-docker
    name: install with docker
    source: "https://docs.n8n.io/deploy/host-n8n/install-options/install-with-docker"
    match: [docker, install, postgresql]
  - id: install-with-npm
    name: install with npm
    source: "https://docs.n8n.io/deploy/host-n8n/install-options/install-with-npm"
    match: [npm, npx, node-js]
  - id: item-linking-errors
    name: item linking errors
    source: "https://docs.n8n.io/build/work-with-data/reference-data/link-data-items/item-linking-errors"
    match: [item-linking, paired-items, multiple-matching-items]
  - id: jmespath-queries
    name: jmespath queries
    source: "https://docs.n8n.io/build/work-with-data/handle-special-data-types/query-json-data"
    match: [jmespath, json, projections]
  - id: logging-setup
    name: logging setup
    source: "https://docs.n8n.io/deploy/host-n8n/keep-n8n-running/set-up-logging"
    match: [logging, log-level, winston]
  - id: looping-over-items
    name: looping over items
    source: "https://docs.n8n.io/build/flow-logic/loop"
    match: [loop, loop-over-items, batch-size]
  - id: merge-node
    name: merge node
    source: "https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.merge"
    match: [merge-node, join, append]
  - id: merging-data
    name: merging data
    source: "https://docs.n8n.io/build/flow-logic/merge-data"
    match: [merge, compare-datasets, code-node]
  - id: node-type-policies
    name: node type policies
    source: "https://docs.n8n.io/administer/manage-users-and-access/control-node-availability"
    match: [node-type-policies, api, allow-deny-delegate]
  - id: organize-work-in-projects
    name: organize work in projects
    source: "https://docs.n8n.io/administer/manage-users-and-access/set-permissions-and-roles-rbac/organize-work-in-projects"
    match: [projects, rbac, move-workflows]
  - id: pin-and-mock-data
    name: pin and mock data
    source: "https://docs.n8n.io/build/work-with-data/pin-and-mock-data"
    match: [pin-data, mock-data, testing]
  - id: project-role-types
    name: project role types
    source: "https://docs.n8n.io/administer/manage-users-and-access/set-permissions-and-roles-rbac/see-available-roles"
    match: [rbac, project-admin, project-editor]
  - id: push-and-pull-changes
    name: push and pull changes
    source: "https://docs.n8n.io/administer/use-source-control-and-environments/push-and-pull-changes"
    match: [source-control, push, pull]
  - id: queue-mode-env-vars
    name: queue mode env vars
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/queue-mode"
    match: [queue-mode, redis, workers]
  - id: reference-previous-nodes
    name: reference previous nodes
    source: "https://docs.n8n.io/build/work-with-data/reference-data/reference-previous-nodes"
    match: [expressions, json, previous-node]
  - id: remove-duplicates-node
    name: remove duplicates node
    source: "https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.removeduplicates"
    match: [remove-duplicates, deduplication, scope]
  - id: require-two-factor-auth
    name: require two factor auth
    source: "https://docs.n8n.io/administer/manage-users-and-access/verify-user-identity/require-two-factor-auth"
    match: [2fa, mfa, authenticator]
  - id: set-up-source-control
    name: set up source control
    source: "https://docs.n8n.io/administer/use-source-control-and-environments/set-up-source-control"
    match: [source-control, git, deploy-key]
  - id: share-credentials-securely
    name: share credentials securely
    source: "https://docs.n8n.io/administer/manage-credentials/share-credentials-securely"
    match: [credentials, sharing, projects]
  - id: ssrf-protection
    name: ssrf protection
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/security/enable-ssrf-protection"
    match: [ssrf, security, http-request]
  - id: stream-logs-to-external-systems
    name: stream logs to external systems
    source: "https://docs.n8n.io/administer/observe-and-log/stream-logs-to-external-systems"
    match: [log-streaming, audit, syslog]
  - id: task-runners-setup
    name: task runners setup
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/set-up-task-runners"
    match: [task-runners, external-mode, code-node]
  - id: track-usage-with-insights
    name: track usage with insights
    source: "https://docs.n8n.io/administer/observe-and-log/track-usage-with-insights"
    match: [insights, time-saved, workflow-roi]
  - id: understand-instance-roles
    name: understand instance roles
    source: "https://docs.n8n.io/administer/manage-users-and-access/understand-instance-roles"
    match: [roles, owner, admin]
