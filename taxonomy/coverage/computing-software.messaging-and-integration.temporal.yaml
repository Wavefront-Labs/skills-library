# Coverage spec: temporal. Topics from the published docs.temporal.io pages in sources.
subject: temporal
scope:
  category: computing-software
  field: messaging-and-integration
  products: [temporal]
sources:
  - "https://docs.temporal.io/"
topics:
  - id: activity-definition-idempotency
    name: "Activity definition idempotency"
    source: "https://docs.temporal.io/activity-definition"
    match: [activity-definition, idempotency, activity-type]
  - id: activity-execution-async-completion
    name: "Activity execution async completion"
    source: "https://docs.temporal.io/activity-execution"
    match: [activity-execution, async-completion, task-token]
  - id: activity-timeouts-and-heartbeats
    name: "Activity timeouts and heartbeats"
    source: "https://docs.temporal.io/encyclopedia/detecting-activity-failures"
    match: [activity-timeouts, start-to-close, schedule-to-close]
  - id: application-failures-handling
    name: "Application failures handling"
    source: "https://docs.temporal.io/encyclopedia/application-failures"
    match: [application-failure, failure-types, non-retryable]
  - id: cancellation-vs-termination
    name: "Cancellation vs termination"
    source: "https://docs.temporal.io/encyclopedia/workflow/cancellation-and-termination"
    match: [cancellation, termination, workflow-cancel]
  - id: child-workflows-and-parent-close-policy
    name: "Child workflows and parent close policy"
    source: "https://docs.temporal.io/child-workflows"
    match: [child-workflows, parent-close-policy, continue-as-new]
  - id: cli-dev-server-setup
    name: "Cli dev server setup"
    source: "https://docs.temporal.io/cli/setup-cli"
    match: [temporal-cli, start-dev, dev-server]
  - id: codec-server-protocol
    name: "Codec server protocol"
    source: "https://docs.temporal.io/codec-server"
    match: [codec-server, encode, decode]
  - id: cron-jobs-legacy
    name: "Cron jobs legacy"
    source: "https://docs.temporal.io/cron-job"
    match: [cron-job, cron-schedule, cron-tz]
  - id: custom-search-attributes
    name: "Custom search attributes"
    source: "https://docs.temporal.io/search-attribute"
    match: [search-attributes, custom-search-attribute, keyword]
  - id: data-converter-and-payload-converter
    name: "Data converter and payload converter"
    source: "https://docs.temporal.io/dataconversion"
    match: [data-converter, payload, payload-converter]
  - id: deadline-exceeded-troubleshooting
    name: "Deadline exceeded troubleshooting"
    source: "https://docs.temporal.io/troubleshooting/deadline-exceeded-error"
    match: [deadline-exceeded, troubleshooting, grpc-health-probe]
  - id: dynamic-configuration
    name: "Dynamic configuration"
    source: "https://docs.temporal.io/references/dynamic-configuration"
    match: [dynamic-configuration, dynamicconfigclient, constraints]
  - id: last-connection-error-troubleshooting
    name: "Last connection error troubleshooting"
    source: "https://docs.temporal.io/troubleshooting/last-connection-error"
    match: [last-connection-error, mtls, certificate-expiry]
  - id: list-filter-syntax
    name: "List filter syntax"
    source: "https://docs.temporal.io/list-filter"
    match: [list-filter, visibility-query, starts-with]
  - id: local-activities
    name: "Local activities"
    source: "https://docs.temporal.io/local-activity"
    match: [local-activity, markerrecorded, workflow-task-heartbeat]
  - id: message-handler-patterns
    name: "Message handler patterns"
    source: "https://docs.temporal.io/handling-messages"
    match: [message-handlers, signal-handler, update-handler]
  - id: monitoring-prometheus-grafana
    name: "Monitoring prometheus grafana"
    source: "https://docs.temporal.io/self-hosted-guide/monitoring"
    match: [monitoring, prometheus, grafana]
  - id: namespaces-and-global-namespaces
    name: "Namespaces and global namespaces"
    source: "https://docs.temporal.io/namespaces"
    match: [namespace, global-namespace, failover]
  - id: nexus-operation-lifecycle
    name: "Nexus operation lifecycle"
    source: "https://docs.temporal.io/nexus/operations"
    match: [nexus-operation, circuit-breaker, schedule-to-close]
  - id: nexus-overview
    name: "Nexus overview"
    source: "https://docs.temporal.io/nexus"
    match: [nexus, nexus-endpoint, nexus-service]
  - id: payload-and-grpc-size-limits
    name: "Payload and grpc size limits"
    source: "https://docs.temporal.io/troubleshooting/blob-size-limit-error"
    match: [blob-size-limit, payload-size, grpc-message-size]
  - id: payload-codec-and-failure-converter
    name: "Payload codec and failure converter"
    source: "https://docs.temporal.io/payload-codec"
    match: [payload-codec, encryption, compression]
  - id: persistence-and-archival
    name: "Persistence and archival"
    source: "https://docs.temporal.io/temporal-service/persistence"
    match: [persistence, cassandra, postgresql]
  - id: production-checklist-self-hosted
    name: "Production checklist self hosted"
    source: "https://docs.temporal.io/self-hosted-guide/production-checklist"
    match: [production-checklist, self-hosted, history-shards]
  - id: retry-policies
    name: "Retry policies"
    source: "https://docs.temporal.io/encyclopedia/retry-policies"
    match: [retry-policy, backoff-coefficient, initial-interval]
  - id: schedule-missed-actions-troubleshooting
    name: "Schedule missed actions troubleshooting"
    source: "https://docs.temporal.io/troubleshooting/schedule-missed-actions"
    match: [schedule-missed-actions, catchup-window, overlap-policy]
  - id: schedules-spec-and-policies
    name: "Schedules spec and policies"
    source: "https://docs.temporal.io/schedule"
    match: [schedule, overlap-policy, catchup-window]
  - id: sending-messages-clients
    name: "Sending messages clients"
    source: "https://docs.temporal.io/sending-messages"
    match: [signal-with-start, update-with-start, startupdate]
  - id: server-services-and-shards
    name: "Server services and shards"
    source: "https://docs.temporal.io/temporal-service/temporal-server"
    match: [temporal-server, frontend-service, history-service]
  - id: service-configuration-persistence-cluster
    name: "Service configuration persistence cluster"
    source: "https://docs.temporal.io/references/service-configuration"
    match: [persistence-config, num-history-shards, datastores]
  - id: service-configuration-tls-auth
    name: "Service configuration tls auth"
    source: "https://docs.temporal.io/references/service-configuration"
    match: [static-configuration, development-yaml, tls]
  - id: signals-updates-queries-choice
    name: "Signals updates queries choice"
    source: "https://docs.temporal.io/encyclopedia/workflow-message-passing"
    match: [signals, updates, queries]
  - id: sticky-execution
    name: "Sticky execution"
    source: "https://docs.temporal.io/sticky-execution"
    match: [sticky-execution, sticky-queue, workflow-cache]
  - id: task-queues-and-partitions
    name: "Task queues and partitions"
    source: "https://docs.temporal.io/task-queue"
    match: [task-queue, partitions, sync-match]
  - id: upgrade-server-procedure
    name: "Upgrade server procedure"
    source: "https://docs.temporal.io/self-hosted-guide/upgrade-server"
    match: [upgrade-server, schema-upgrade, temporal-sql-tool]
  - id: visibility-overview
    name: "Visibility overview"
    source: "https://docs.temporal.io/visibility"
    match: [visibility, visibility-store, count-api]
  - id: worker-deployment-best-practices
    name: "Worker deployment best practices"
    source: "https://docs.temporal.io/best-practices/worker"
    match: [worker-best-practices, worker-tuning, schedule-to-start-latency]
  - id: worker-entities-and-identity
    name: "Worker entities and identity"
    source: "https://docs.temporal.io/workers"
    match: [worker, worker-identity, worker-entity]
  - id: worker-graceful-shutdown
    name: "Worker graceful shutdown"
    source: "https://docs.temporal.io/encyclopedia/workers/worker-shutdown"
    match: [worker-shutdown, graceful-shutdown, workerstoptimeout]
  - id: worker-versioning-concepts
    name: "Worker versioning concepts"
    source: "https://docs.temporal.io/worker-versioning"
    match: [worker-versioning, worker-deployment, build-id]
  - id: worker-versioning-inheritance
    name: "Worker versioning inheritance"
    source: "https://docs.temporal.io/worker-versioning"
    match: [worker-versioning, inheritance, child-workflow]
  - id: workflow-definition-determinism
    name: "Workflow definition determinism"
    source: "https://docs.temporal.io/workflow-definition"
    match: [workflow-definition, determinism, nondeterminism]
  - id: workflow-lifecycle-end-to-end
    name: "Workflow lifecycle end to end"
    source: "https://docs.temporal.io/encyclopedia/architecture/how-temporal-works"
    match: [how-temporal-works, lifecycle, frontend]
  - id: workflow-patching-patched
    name: "Workflow patching patched"
    source: "https://docs.temporal.io/patching"
    match: [patching, patched, workflow-versioning]
  - id: workflow-tasks-and-task-failures
    name: "Workflow tasks and task failures"
    source: "https://docs.temporal.io/tasks"
    match: [workflow-task, activity-task, nexus-task]
  - id: workflow-timeouts
    name: "Workflow timeouts"
    source: "https://docs.temporal.io/encyclopedia/detecting-workflow-failures"
    match: [workflow-timeouts, workflow-execution-timeout, workflow-run-timeout]
