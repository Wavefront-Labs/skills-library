# Coverage spec: micronaut. Topics from the official docs table of contents.
subject: micronaut
scope:
  category: computing-software
  field: web-development
  products: [micronaut]
sources:
  - "https://docs.micronaut.io/latest/guide/"
  - "https://github.com/micronaut-projects/micronaut-core/tree/5.3.x/src/main/docs/guide"
topics:
  - id: defining-beans
    name: Defining Beans
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/beans.adoc"
    match: [defining-beans]
  - id: injection-types
    name: Dependency Injection Types
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/injection.adoc"
    match: [injection-types]
  - id: typed-beans
    name: Limiting Injectable Types
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/typed.adoc"
    match: [typed-beans]
  - id: container-types
    name: Injectable Container Types
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/types.adoc"
    match: [container-types]
  - id: qualifiers
    name: Bean Qualifiers
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/qualifiers.adoc"
    match: [qualifiers]
  - id: scopes
    name: Scopes
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/scopes.adoc"
    match: [scopes]
  - id: factories
    name: Bean Factories
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/factories.adoc"
    match: [factories]
  - id: conditional-beans
    name: Conditional Beans
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/conditionalBeans.adoc"
    match: [conditional-beans]
  - id: bean-replacement
    name: Bean Replacement
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/replaces.adoc"
    match: [bean-replacement]
  - id: life-cycle
    name: Life-Cycle Methods
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/lifecycle.adoc"
    match: [life-cycle]
  - id: graceful-shutdown
    name: Graceful Shutdown
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/gracefulShutdown.adoc"
    match: [graceful-shutdown]
  - id: context-events
    name: Context Events
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/contextEvents.adoc"
    match: [context-events]
  - id: bean-events
    name: Bean Events
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/events.adoc"
    match: [bean-events]
  - id: debugging-di
    name: Debugging Dependency Injection
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/ioc/iocDebugging.adoc"
    match: [debugging-di]
  - id: environments
    name: Application environments and banner
    source: "https://docs.micronaut.io/latest/guide/#environments"
    match: [environments, banner]
  - id: bootstrap
    name: Bootstrap context
    source: "https://docs.micronaut.io/latest/guide/#bootstrap"
    match: [bootstrap]
  - id: property-sources
    name: Property sources and configuration import
    source: "https://docs.micronaut.io/latest/guide/#propertySource"
    match: [property-sources, config-import]
  - id: value-injection
    name: Configuration injection with @Value and @Property
    source: "https://docs.micronaut.io/latest/guide/#valueAnnotation"
    match: [value-annotation, placeholders]
  - id: configuration-properties
    name: Type-safe @ConfigurationProperties
    source: "https://docs.micronaut.io/latest/guide/#configurationProperties"
    match: [configuration-properties]
  - id: type-conversion
    name: Custom type converters, configuration builders and MapFormat
    source: "https://docs.micronaut.io/latest/guide/#customTypeConverter"
    match: [type-converter, configuration-builder]
  - id: immutable-config
    name: Immutable configuration
    source: "https://docs.micronaut.io/latest/guide/#immutableConfig"
    match: [immutable-config]
  - id: each-property
    name: '@EachProperty and @EachBean'
    source: "https://docs.micronaut.io/latest/guide/#eachProperty"
    match: [eachproperty, eachbean]
  - id: expressions
    name: Evaluated expressions
    source: "https://docs.micronaut.io/latest/guide/#evaluatedExpressions"
    match: [expression-language]
  - id: introspection
    name: Bean introspection
    source: "https://docs.micronaut.io/latest/guide/#introspection"
    match: [bean-introspection]
  - id: bean-mappers
    name: Bean mappers
    source: "https://docs.micronaut.io/latest/guide/#beanMappers"
    match: [bean-mappers]
  - id: annotation-metadata
    name: Annotation metadata
    source: "https://docs.micronaut.io/latest/guide/#annotationMetadata"
    match: [annotation-metadata]
  - id: class-import-mixin
    name: Bean import, class import and mixins
    source: "https://docs.micronaut.io/latest/guide/#classImport"
    match: [class-import, mixin]
  - id: around-advice
    name: Writing Around Advice
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/aop/aroundAdvice.adoc"
    match: [around-advice]
  - id: introduction-advice
    name: Introduction Advice and Adapter Advice
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/aop/introductionAdvice.adoc"
    match: [introduction-advice, adapter-advice]
  - id: interceptor-lifecycle
    name: Interceptor Life Cycle
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/aop/interceptorLifecycle.adoc"
    match: [interceptor-lifecycle]
  - id: retry-advice
    name: Retry Advice
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/aop/retry.adoc"
    match: [retry-advice]
  - id: scheduled-tasks
    name: Scheduled Tasks
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/aop/scheduling.adoc"
    match: [scheduled-tasks]
  - id: cache-advice
    name: Cache Advice
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/aop/caching.adoc"
    match: [cache-advice]
  - id: context-propagation
    name: Context Propagation
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/contextPropagation/httpFilterContextPropagation.adoc"
    match: [context-propagation]
  - id: logging-config
    name: Logging
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/logging/loggingConfiguration.adoc"
    match: [logging-config]
  - id: running-server
    name: Running the Server and Specific Port
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/runningServer.adoc"
    match: [running-server, specific-port]
  - id: routing
    name: Routing and Path Variables
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/routing.adoc"
    match: [routing, uri-templates]
  - id: binding
    name: Binding Request Parameters
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/binding.adoc"
    match: [request-binding, request-bean]
  - id: custom-argument-binding
    name: Custom Argument Binding
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/customArgumentBinding.adoc"
    match: [custom-argument-binding, argument-binder]
  - id: request-response
    name: Accessing the Request and Response; Status and Content-Disposition
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/requestResponse.adoc"
    match: [request-response, content-disposition]
  - id: produces-consumes
    name: Produces, Consumes and Plain Text Responses
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/producesAnnotation.adoc"
    match: [produces-annotation, consumes-annotation]
  - id: reactive-server
    name: Reactive Server, Body Annotation and JSON Binding
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/reactiveServer.adoc"
    match: [reactive-server, json-binding]
  - id: async-request-body
    name: Asynchronous Request Body
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/asyncRequestBody.adoc"
    match: [async-request-body]
  - id: error-handling
    name: Error Handling
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/errorHandling.adoc"
    match: [error-handling, exception-handler]
  - id: data-validation
    name: Data Validation
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/datavalidation.adoc"
    match: [data-validation, validation-groups]
  - id: api-versioning
    name: API Versioning
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/apiVersioning.adoc"
    match: [api-versioning]
  - id: filter-methods
    name: Filter methods
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/filters/filtermethods.adoc"
    match: [filter-methods]
  - id: filter-body
    name: Reading the Body in a Filter / Byte Body
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/filters/filterBodyBuffer.adoc"
    match: [filter-body]
  - id: functional-routes
    name: Functional Routes
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/functionalRoutes.adoc"
    match: [functional-routes]
  - id: cors
    name: Cross Origin Resource Sharing
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/serverConfiguration/cors.adoc"
    match: [cors]
  - id: https-dual-protocol
    name: Securing the Server with HTTPS and Dual Protocol
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/serverConfiguration/https.adoc"
    match: [https, dual-protocol]
  - id: thread-pools
    name: Server Thread Pools and Native Transports
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/serverConfiguration/threadPools.adoc"
    match: [thread-pools]
  - id: access-logger
    name: Access Logger
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/serverConfiguration/accessLogger.adoc"
    match: [access-logger]
  - id: websocket
    name: WebSocket Support
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/websocket.adoc"
    match: [websocket]
  - id: uploads
    name: File Uploads and Form Data
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/uploads.adoc"
    match: [uploads]
  - id: sse
    name: Server Sent Events and Reactive Streaming
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpServer/sse.adoc"
    match: [sse]
  - id: declarative-client
    name: Declarative HTTP clients with @Client
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpClient/clientAnnotation.adoc"
    match: [introduction-advice]
  - id: client-request-binding
    name: Client parameters, headers and custom binders
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpClient/clientAnnotation/clientParameters.adoc"
    match: [request-binding]
  - id: client-error-handling
    name: Client error handling, retry and fallback
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpClient/clientAnnotation/clientError.adoc"
    match: [error-handling, fallback]
  - id: low-level-client
    name: Low-level HTTP client
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpClient/lowLevelHttpClient.adoc"
    match: [low-level-client]
  - id: client-streaming
    name: Streaming and Server Sent Events with the client
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpClient/clientAnnotation/clientAnnotationStreaming.adoc"
    match: [json-stream, sse]
  - id: client-filters
    name: Client filters
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpClient/clientFilter.adoc"
    match: [client-filter]
  - id: client-configuration
    name: HTTP client configuration
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/httpClient/lowLevelHttpClient/clientConfiguration.adoc"
    match: [per-client-config]
  - id: custom-endpoints
    name: Building custom management endpoints
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/management/buildingEndpoints.adoc"
    match: [custom-endpoint]
  - id: provided-endpoints
    name: Built-in management endpoints
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/management/providedEndpoints.adoc"
    match: [builtin-endpoints]
  - id: health-endpoint
    name: Health endpoint
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/management/providedEndpoints/healthEndpoint.adoc"
    match: [health-endpoint]
  - id: distributed-configuration
    name: Distributed configuration
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/cloud/cloudConfiguration/distributedConfiguration.adoc"
    match: [distributed-config]
  - id: service-discovery-lb
    name: Service discovery and client-side load balancing
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/cloud/clientSideLoadBalancing.adoc"
    match: [service-discovery, load-balancer-strategy]
  - id: cli-create-projects
    name: 'CLI: creating projects and commands'
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/cli/createProject.adoc"
    match: [create-app, micronaut-cli-yml]
  - id: dev-mode-launch-reload
    name: 'Development mode: launching and what a change does'
    source: "https://github.com/micronaut-projects/micronaut-core/blob/5.3.x/src/main/docs/guide/devMode/devModeLaunch.adoc"
    match: [hot-reload, livereload]
