# Coverage spec for Grafana Alloy, from the official documentation (docs/sources in grafana/alloy).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: grafana-alloy
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [grafana-alloy]
sources:
  - "Grafana Alloy documentation (docs/sources in grafana/alloy)"
topics:
  - id: build-pipelines
    name: "Building Alloy pipelines"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/components/build-pipelines.md"
    match: [pipelines, forward-to, fan-out]
  - id: cluster-flags-run
    name: "Clustering flags for alloy run"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/cli/run.md"
    match: [clusterenabled, clusterjoin-addresses, clusterdiscover-peers]
  - id: clustering-concepts
    name: "Alloy clustering concepts"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/clustering.md"
    match: [clustering, consistent-hashing, gossip]
  - id: clustering-distribute-workload
    name: "Distributing workload across cluster nodes"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/configure/clustering/distribute-workload.md"
    match: [clustering-block, lokisourcekubernetes, pyroscopescrape]
  - id: collect-opentelemetry-otlp
    name: "Collecting and forwarding OpenTelemetry data"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/collect/opentelemetry-data.md"
    match: [otelcolexporterotlp, otelcolexporterotlphttp, otelcolauthbasic]
  - id: collect-prometheus-metrics
    name: "Collecting Prometheus metrics"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/collect/prometheus-metrics.md"
    match: [prometheusscrape-targets, address, scheme]
  - id: component-controller
    name: "The component controller"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/components/component-controller.md"
    match: [component-controller, dag, reevaluation]
  - id: config-syntax
    name: "Alloy configuration syntax"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/syntax.md"
    match: [alloy-syntax, blocks, attributes]
  - id: configure-clustering
    name: "Configure Alloy for clustering"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/configure/clustering/configure-alloy.md"
    match: [clustering-helm, controllertype, statefulset]
  - id: convert-command
    name: "alloy convert"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/cli/convert.md"
    match: [alloy-convert, source-format, convert-report]
  - id: custom-components-declare
    name: "Custom components with declare"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/components/custom-components.md"
    match: [declare, argument, export]
  - id: debug-ui
    name: "The Alloy debug UI"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/troubleshoot/debug.md"
    match: [alloy-ui, debug-ui, graph-page]
  - id: discovery-kubernetes-relabel
    name: "Kubernetes discovery and relabeling"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/components/discovery/discovery.kubernetes.md"
    match: [discoverykubernetes, kubernetes-roles, attach-metadata]
  - id: estimate-resource-usage
    name: "Estimating Alloy resource usage"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/estimate-resource-usage.md"
    match: [resource-usage, sizing, capacity-planning]
  - id: expressions-operators-references
    name: "Operators and component references"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/expressions/operators.md"
    match: [expressions, operators, component-references]
  - id: fmt-validate
    name: "alloy fmt and alloy validate"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/cli/fmt.md"
    match: [alloy-fmt, alloy-validate, fmt-test]
  - id: foreach-dynamic-pipelines
    name: "foreach: a pipeline per item"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/config-blocks/foreach.md"
    match: [foreach, template, collection]
  - id: function-calls
    name: "Function calls in expressions"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/expressions/function_calls.md"
    match: [function-calls, stdlib, sysenv]
  - id: http-server-tls-auth
    name: "Securing the Alloy HTTP server"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/config-blocks/http.md"
    match: [http-block, tls, client-auth-type]
  - id: kubernetes-helm-install
    name: "Alloy on Kubernetes with Helm"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/install/kubernetes.md"
    match: [helm, kubernetes, alloyconfigmap]
  - id: kubernetes-logs-collection
    name: "Collecting Kubernetes logs"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/collect/logs-in-kubernetes.md"
    match: [lokisourcekubernetes, lokisourcekubernetes-events, localfile-match]
  - id: kubernetes-security-rbac
    name: "Alloy permissions on Kubernetes"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/access_permissions/kubernetes.md"
    match: [securitycontext, runasnonroot, readonlyrootfilesystem]
  - id: linux-service-configuration
    name: "Configuring the Alloy Linux service"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/configure/linux.md"
    match: [systemd, config-file, custom-args]
  - id: load-remote-configuration
    name: "Loading configuration from remote sources"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/configure/load-remote-configuration.md"
    match: [importhttp, poll-frequency, importgit]
  - id: logs-and-clustering-troubleshooting
    name: "Alloy logs and clustering problems"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/troubleshoot/debug.md"
    match: [logging-block, logfmt, journalctl]
  - id: loki-source-file-write
    name: "loki.source.file and loki.write"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/components/loki/loki.source.file.md"
    match: [lokisourcefile, lokiwrite, file-match]
  - id: meta-monitoring
    name: "Meta-monitoring Alloy"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/collect/metamonitoring.md"
    match: [prometheusexporterself, meta-monitoring, logging-write-to]
  - id: migrate-from-agent-flow
    name: "Migrating from Grafana Agent Flow"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/migrate/from-flow.md"
    match: [migrate-agent-flow, storagepath, data-alloy]
  - id: migrate-from-agent-static
    name: "Migrating from Grafana Agent Static"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/migrate/from-static.md"
    match: [migrate-agent-static, integrations-next, configexpand-env]
  - id: migrate-from-otel-collector
    name: "Migrating from the OpenTelemetry Collector"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/migrate/from-otelcol.md"
    match: [migrate-otel-collector, configformat-otelcol, otelcol-convert]
  - id: migrate-from-prometheus
    name: "Migrating from Prometheus to Alloy"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/migrate/from-prometheus.md"
    match: [migrate-prometheus, configformat-prometheus, bypass-errors]
  - id: migrate-from-promtail
    name: "Migrating from Promtail to Alloy"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/migrate/from-promtail.md"
    match: [migrate-promtail, lokisourcejournal, lokirelabel]
  - id: modules-import
    name: "Modules and import blocks"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/modules.md"
    match: [modules, importfile, importgit]
  - id: otelcol-batch-memory-limiter
    name: "Batch and memory_limiter processors"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/components/otelcol/otelcol.processor.batch.md"
    match: [otelcolprocessorbatch, otelcolprocessormemory-limiter, send-batch-size]
  - id: prometheus-remote-write-reference
    name: "prometheus.remote_write reference"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/components/prometheus/prometheus.remote_write.md"
    match: [prometheusremote-write, queue-config, wal]
  - id: prometheus-scrape-reference
    name: "prometheus.scrape reference"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/components/prometheus/prometheus.scrape.md"
    match: [prometheusscrape, scrape-interval, native-histograms]
  - id: remotecfg-fleet-management
    name: "remotecfg for remote configuration"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/config-blocks/remotecfg.md"
    match: [remotecfg, alloy-remote-config, fleet-management]
  - id: run-command-flags
    name: "alloy run"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/cli/run.md"
    match: [alloy-run, serverhttplisten-addr, storagepath]
  - id: run-in-docker
    name: "Running Alloy in Docker"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/set-up/install/docker.md"
    match: [docker, grafanaalloy, boringcrypto]
  - id: stdlib-encoding-array-sys
    name: "encoding, array, coalesce, sys and file functions"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/stdlib/encoding.md"
    match: [encodingfrom-json, encodingto-json, encodingfrom-yaml]
  - id: stdlib-string-functions
    name: "string standard library"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/stdlib/string.md"
    match: [stringformat, stringjoin, stringsplit]
  - id: support-bundle-and-component-metrics
    name: "Support bundles and component metrics"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/troubleshoot/support_bundle.md"
    match: [support-bundle, support, component-id]
  - id: tracing-block
    name: "The tracing block"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/reference/config-blocks/tracing.md"
    match: [tracing-block, sampling-fraction, send-traceparent]
  - id: types-and-values
    name: "Alloy types and values"
    source: "https://github.com/grafana/alloy/blob/main/docs/sources/get-started/expressions/types_and_values.md"
    match: [types, secret, capsule]
