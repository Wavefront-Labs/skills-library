# Canonical coverage spec: vendor-neutral cloud architecture and cloud cost optimisation (FinOps).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (FinOps Framework domains/capabilities and
# the FinOps Certified Practitioner outline; the AWS/Azure/Google Well-Architected pillars and
# their best-practice areas, read for their vendor-neutral content; TOGAF ADM phases; the NIST
# and Open Group cloud reference models; Cloud Adoption Framework phases and landing-zone design
# areas; the Azure Architecture Center cloud design pattern catalogue; the Twelve-Factor App),
# not from what the library already has. Provider-specific how-to lives in the aws/azure/
# google-cloud products; this subject is the discipline that sits above them.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (FinOps capability
# pages and their "functional activities", Well-Architected best-practice question areas, TOGAF
# phase steps, CAF methodology sections, the pattern catalogue's entries, each twelve-factor).
subject: cloud-architecture
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [cloud-architecture, cloud-cost-optimisation]
sources:
  - "FinOps Framework (finops.org/framework) - Principles; Personas (core and allied); Phases (Inform, Optimize, Operate); Maturity (Crawl, Walk, Run); Domains - Understand Usage & Cost (Data Ingestion, Allocation, Reporting & Analytics, Anomaly Management), Quantify Business Value (Planning & Estimating, Forecasting, Budgeting, Benchmarking, Unit Economics), Optimize Usage & Cost (Architecting for Cloud, Workload Optimization, Rate Optimization, Licensing & SaaS, Cloud Sustainability), Manage the FinOps Practice (FinOps Practice Operations, Policy & Governance, FinOps Assessment, FinOps Tools & Services, FinOps Education & Enablement, Invoicing & Chargeback, Onboarding Workloads, Intersecting Disciplines); subtopics from each capability page's functional activities and KPIs"
  - "FinOps Certified Practitioner exam outline (FinOps Foundation) - FinOps principles, teams and personas, lifecycle, capabilities, cloud billing terminology (on-demand, amortized, blended/unblended, credits), maturity model, FOCUS specification (focus.finops.org columns and datasets)"
  - "AWS Well-Architected Framework pillars (Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, Sustainability) and their best-practice areas; Azure Well-Architected Framework pillar checklists; Google Cloud Architecture Framework pillars - read for vendor-neutral design principles and questions"
  - "TOGAF Standard 10th Edition - ADM: Preliminary, A Architecture Vision, B Business Architecture, C Information Systems Architectures (Data, Application), D Technology Architecture, E Opportunities & Solutions, F Migration Planning, G Implementation Governance, H Architecture Change Management, Requirements Management; Architecture Principles, Architecture Contracts, Architecture Compliance; TOGAF Series Guide - Using TOGAF for cloud ecosystems"
  - "The Open Group Cloud Ecosystem Reference Model and NIST SP 800-145 / SP 500-292 Cloud Computing Reference Architecture - essential characteristics, service models, deployment models, actors (consumer, provider, broker, auditor, carrier)"
  - "Cloud Adoption Framework (Microsoft CAF methodologies Strategy, Plan, Ready, Adopt, Govern, Secure, Manage; AWS CAF perspectives; Google Cloud Adoption Framework) - landing-zone design areas (billing/tenant, identity, resource organization, network topology and connectivity, security, management, governance, platform automation)"
  - "Azure Architecture Center - Cloud design patterns catalogue (ambassador ... valet key) and architecture styles; AWS Prescriptive Guidance - cloud design patterns"
  - "The Twelve-Factor App (12factor.net) - I Codebase ... XII Admin processes"
