    source: "https://www.rabbitmq.com/docs"
    match: [rmq-consistency]
    subtopics:
      - {id: rmq-consistency-single-active-consumer, name: "Single active consumer", match: [single-active-consumer]}
      - {id: rmq-consistency-consistent-hash-exchange, name: "Consistent hash exchange", match: [consistent-hash-exchange]}
  - id: rmq-maintenance
    name: "Operations and maintenance"
    source: "https://www.rabbitmq.com/docs"
    match: [rmq-maintenance]
    subtopics:
      - {id: rmq-maintenance-maintenance-mode, name: "Maintenance mode", match: [maintenance-mode]}
      - {id: rmq-maintenance-queue-leader-rebalancing, name: "Queue leader rebalancing", match: [queue-leader-rebalancing]}
  - id: rmq-security
