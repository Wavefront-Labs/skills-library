    source: "https://www.rabbitmq.com/docs"
    match: [rmq-security]
    subtopics:
      - {id: rmq-security-default-credentials-hardening, name: "Credential hardening", match: [default-credentials-hardening]}
      - {id: rmq-security-message-and-resource-limits, name: "Resource limits for tenants", match: [message-and-resource-limits]}
