# Canonical coverage spec: aerospace engineering (civil practice; whole field).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
# Topics and subtopics come from external structures named in sources, not from existing skills.
# Scope is civil professional practice: no weapons, munitions or energetic-material formulation.
subject: aerospace-engineering
scope:
  category: engineering-technology
  field: aerospace-engineering
  products: [aerodynamics, computational-fluid-dynamics, ansys-fluent, matlab-simulink, aircraft-structures, propulsion-engineering, flight-dynamics-control, orbital-mechanics, spacecraft-systems-design]
sources:
  - "Anderson, Fundamentals of Aerodynamics and Introduction to Flight (chapter lists)"
  - "Raymer, Aircraft Design: A Conceptual Approach (chapter lists)"
  - "Etkin and Reid, Dynamics of Flight; Nelson, Flight Stability and Automatic Control"
  - "Niu, Airframe Structural Design; Megson, Aircraft Structures for Engineering Students"
  - "Mattingly, Elements of Propulsion; Hill and Peterson, Mechanics and Thermodynamics of Propulsion"
  - "Curtis, Orbital Mechanics for Engineering Students; Vallado, Fundamentals of Astrodynamics and Applications"
  - "Wertz and Larson, Space Mission Analysis and Design; Fortescue et al., Spacecraft Systems Engineering"
  - "Versteeg and Malalasekera, An Introduction to Computational Fluid Dynamics; Blazek, Computational Fluid Dynamics Principles and Applications"
  - "FAA 14 CFR Parts 25 and 33; EASA CS-25; ICAO Annex 16 (regulator structure)"
  - "MathWorks Aerospace Blockset and Control System Toolbox documentation tables of contents"
  - "Ansys Fluent user guide table of contents"
  - "NASA Systems Engineering Handbook; NASA GSFC-STD-7000 (GEVS); CubeSat Design Specification"
