# Canonical coverage spec: theatre (all products in the creative-arts/theatre field).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external, authoritative structures: drama-school acting curricula
# and the technique texts they teach from, stage-management handbooks, USITT/ABTT technical standards,
# design textbooks, directing texts, voice and movement curricula and stage-combat syllabi.
# Note: there is no producing product in this field; company-management and touring tasks sit under
# `stage-management`, and rights/season selection under `dramaturgy` (literary management).
subject: theatre
scope:
  category: creative-arts
  field: theatre
  products: [acting, directing, dramaturgy, improv, voice-and-speech, stage-movement-and-combat, stage-management, scenic-design, lighting-design, costume-design, theatre-sound-design, musical-theatre]
sources:
  - "Stanislavski - An Actor Prepares / An Actor's Work (Benedetti tr.) chapter list - action, magic if, given circumstances, imagination, concentration and circles of attention, relaxation, units and objectives, emotion memory, communion, adaptation, inner motive forces, through-line and super-objective; Building a Character; Method of Physical Actions and Active Analysis (Carnicke, Stanislavsky in Focus)"
  - "Sanford Meisner and Dennis Longwell - Sanford Meisner on Acting chapter sequence (repetition, independent activity, knock at the door, emotional preparation, particularisation, text work); Michael Chekhov - To the Actor (imagination, atmosphere, psychological gesture, qualities, imaginary body and centre, composition); Uta Hagen - Respect for Acting / A Challenge for the Actor (object exercises, substitution, nine questions)"
  - "Drama-school acting curricula (RADA, LAMDA, Juilliard Drama, Federation of Drama Schools core skills) - text, voice, movement, scene study, audition technique, screen and self-tape, professional preparation; Spotlight and Equity audition and self-tape guidance"
  - "Anne Bogart and Tina Landau - The Viewpoints Book (physical and vocal viewpoints, composition); Anne Bogart - A Director Prepares; Peter Brook - The Empty Space; Katie Mitchell - The Director's Craft (facts and questions, events, intentions, rehearsal); David Ball - Backwards and Forwards; Stage Directors and Choreographers Society resources; Intimacy Directors and Coordinators / Theatrical Intimacy Education guidelines"
  - "Literary Managers and Dramaturgs of the Americas (LMDA) resources; Turner and Behrndt - Dramaturgy and Performance; Aristotle - Poetics; Freytag - Technique of the Drama; Liz Lerman Critical Response Process; licensing-house practice (Concord Theatricals, MTI, Nick Hern) for performance rights"
  - "Improvisation texts - Keith Johnstone, Impro (status, spontaneity, narrative skills, masks); Upright Citizens Brigade Comedy Improvisation Manual (base reality, game, heightening, Harold, openings, edits); Halpern, Close and Johnson - Truth in Comedy; Viola Spolin - Improvisation for the Theater; Theatresports format rules"
  - "Voice and speech curricula - Kristin Linklater, Freeing the Natural Voice (progression workbook); Cicely Berry, Voice and the Actor / The Actor and the Text; Patsy Rodenburg, The Right to Speak / Speaking Shakespeare; Edith Skinner, Speak with Distinction; Knight-Thompson Speechwork; International Phonetic Association chart; IDEA (International Dialects of English Archive); VASTA resources"
  - "Movement and combat curricula - Rudolf Laban, The Mastery of Movement (efforts, kinesphere); Jacques Lecoq, The Moving Body (neutral mask, levels of tension, commedia, bouffon); Frantic Assembly Book of Devising; Tadashi Suzuki, The Way of Acting; British Academy of Stage and Screen Combat (BASSC), Society of American Fight Directors (SAFD) skills proficiency test weapon forms (unarmed, rapier and dagger, single sword, broadsword, quarterstaff, knife, smallsword); Alexander Technique and Feldenkrais teacher curricula"
  - "Stage management handbooks - Kincman and Stern, Stage Management (13th ed.) chapter list (pre-production, auditions, rehearsals, prompt book, technical rehearsals, running the show, touring); Soozie Copley and Philippa Killner, Stage Management: A Practical Guide; Pallin, Stage Management - The Essential Handbook; Actors' Equity / UK Equity rehearsal and break rules; Stage Management Association (UK)"
  - "Technical theatre standards - USITT Recommended Practice for Theatrical Drafting (RP-2) and Lighting Graphics (RP-1); ABTT Codes of Practice and Technical Standards for Places of Entertainment (sightlines, flying, pyrotechnics, flame-retardancy, smoke and haze); ESTA/ANSI E1.11 (DMX512-A), E1.31 (sACN), E1.20 (RDM), Art-Net spec; BS 5867 / NFPA 701 flame tests"
  - "Design textbooks - Richard Pilbrow, Stage Lighting Design; Linda Essig, Lighting and the Design Idea; Stanley McCandless, A Method of Lighting the Stage; Steven Louis Shelley, A Practical Guide to Stage Lighting; ETC Eos Family Operations Manual; Lightwright 6 manual; Lynn Pecktal, Designing and Painting for the Theatre; Michael Gillette, Theatrical Design and Production; Pamela Howard, What is Scenography?; Ingham and Covey, The Costume Designer's Handbook; Rebecca Cunningham, The Magic Garment; Kaye and LeBrecht, Sound and Music for the Theatre; Gareth Fry, Sound Design for the Stage; QLab 5 documentation; Meyer Sound and d&b system design guides; Shure/Sennheiser RF coordination guides"
  - "Musical-theatre curricula - Deer and Dal Vera, Acting in Musical Theatre; Joe Deer, Directing in Musical Theatre; Jo Estill Voice Training figures; Jeannette LoVetri Somatic Voicework; Backstage/Playbill audition guidance (16-bar and 32-bar cuts); Broadway swing and dance-captain practice (AEA production contract)"
