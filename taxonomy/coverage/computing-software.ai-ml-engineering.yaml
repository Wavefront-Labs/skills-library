# Canonical coverage spec: AI / ML engineering (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (certification exam guides, official docs
# tables of contents, the Hugging Face course, MLOps maturity models, LLM provider docs, NIST AI RMF),
# not from what the library happened to contain.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (exam task statements,
# docs page sub-headings, API reference sections, course chapter sections).
subject: ai-ml-engineering
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [pytorch, tensorflow-keras, scikit-learn, hugging-face, langchain, mlflow, model-training, mlops, feature-engineering, llm-application-engineering, ml-platform-engineering]
sources:
  - "Google Cloud Professional Machine Learning Engineer exam guide (2024+) - Section 1 architecting low-code ML, 2 collaborating to manage data and models (data exploration, preprocessing, feature store, prototyping, tracking), 3 scaling prototypes into ML models (building, training, choosing hardware), 4 serving and scaling models (batch/online, scaling, A/B), 5 automating and orchestrating ML pipelines (CI/CD/CT, metadata, lineage), 6 monitoring AI solutions (responsible AI, drift, troubleshooting)"
  - "AWS Certified Machine Learning Engineer - Associate (MLA-C01) exam guide - Domain 1 data preparation (ingest, transform, feature engineering, data integrity and bias), Domain 2 ML model development (choose approach, train and refine, analyze performance), Domain 3 deployment and orchestration (deployment infrastructure, scripted infrastructure, CI/CD), Domain 4 monitoring, maintenance and security (inference monitoring, infrastructure cost, security); task statements used as subtopics"
  - "PyTorch documentation ToC (pytorch.org/docs/stable) - Notes (autograd mechanics, AMP, CUDA semantics, reproducibility, serialization, multiprocessing), torch.nn, torch.autograd, torch.optim and lr_scheduler, torch.utils.data, torch.amp, torch.compile, torch.distributed (DDP, FSDP2, DTensor, distributed checkpoint, torchrun), torch.export and ONNX, torch.profiler, torch.library custom ops, torch.utils.checkpoint, torch.func"
  - "TensorFlow and Keras guides (tensorflow.org/guide, keras.io/guides) - Sequential/Functional/subclassing, custom layers and models, training and evaluation with built-ins, writing a training loop from scratch, callbacks, tf.data, distributed training (tf.distribute), mixed precision, XLA, SavedModel, TF Serving, LiteRT/TFLite conversion, Keras 3 multi-backend migration"
  - "scikit-learn User Guide ToC (scikit-learn.org/stable/user_guide) - 1 supervised learning (linear models, SVM, neighbors, trees, ensembles incl. HistGradientBoosting, calibration), 2 unsupervised (clustering, decomposition, outlier detection), 3 model selection and evaluation (CV, tuning, metrics, validation curves, decision threshold), 4 inspection (partial dependence, permutation importance), 6 dataset transformations (pipelines, preprocessing, imputation, feature selection, text feature extraction), 9 model persistence, developing estimators"
  - "Hugging Face LLM Course chapters (huggingface.co/learn) - 1 transformer models, 2 using transformers (pipelines, models, tokenizers), 3 fine-tuning a pretrained model (Trainer, full training loop with Accelerate), 4 sharing models and tokenizers (Hub, model cards), 5 the Datasets library, 6 the Tokenizers library, 7 main NLP tasks, 8 debugging, 11 fine-tuning LLMs (chat templates, SFT, LoRA, evaluation), 12 reasoning; plus Transformers docs (generation strategies, quantization, Optimum/ONNX, TGI)"
  - "LangChain / LangGraph / LangSmith docs (python.langchain.com, langchain-ai.github.io/langgraph) - LCEL and Runnables, chat models, prompt templates, output parsers and structured output, document loaders, text splitters, embeddings and vector stores, retrievers, tools and agents, LangGraph state graphs, persistence and human-in-the-loop, streaming, LangSmith tracing and evaluation"
  - "MLflow docs ToC (mlflow.org/docs/latest) - Tracking (runs, autolog, tracking server and backend/artifact stores), Models (flavors, signatures, pyfunc), Model Registry (versions, aliases, tags), Projects, Deployment (mlflow models serve, build-docker, Kubernetes/SageMaker), MLflow for GenAI (evaluate, tracing, prompt registry)"
  - "MLOps maturity models - Google Cloud 'MLOps continuous delivery and automation pipelines in ML' (level 0/1/2, CT, metadata, feature store, pipeline triggers) and Microsoft Azure MLOps maturity model (levels 0-4); Google 'Rules of ML' and 'ML Test Score' rubric (data, model, infra, monitoring tests)"
  - "Anthropic Claude API docs and OpenAI platform docs - prompt engineering guides, structured outputs, tool use / function calling, embeddings, prompt caching, batch API, streaming, extended thinking, evaluation guides, guardrails (reducing hallucinations, jailbreak and prompt injection mitigation), fine-tuning vs prompting; OWASP Top 10 for LLM Applications 2025"
  - "NIST AI Risk Management Framework 1.0 (AI 100-1) and Generative AI Profile (AI 600-1) - Govern, Map, Measure, Manage functions; test, evaluation, verification and validation (TEVV), trustworthiness characteristics (valid and reliable, safe, secure, explainable, privacy-enhanced, fair), incident tracking"
