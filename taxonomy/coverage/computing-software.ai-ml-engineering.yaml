      - {id: pt-tn-async, name: Asynchronous CUDA execution / streams and synchronization, match: [cuda-streams, cuda-synchronize]}
      - {id: pt-tn-determinism, name: Reproducibility (seeds / deterministic algorithms / cuDNN flags), match: [use-deterministic-algorithms, pytorch-reproducibility]}
      - {id: pt-tn-tf32, name: TF32 and matmul precision settings, match: [tf32, matmul-precision]}
      - {id: pt-tn-promotion, name: Type promotion rules and dtype casting, match: [type-promotion, dtype-casting]}
      - {id: pt-tn-pinned, name: Pinned memory and non_blocking host-to-device copies, match: [pinned-memory, non-blocking-transfer]}
      - {id: pt-tn-channels-last, name: channels_last memory format for conv nets, match: [channels-last-memory-format]}
      - {id: pt-tn-sparse, name: Sparse tensors (COO / CSR) and sparse ops, match: [sparse-tensors]}
      - {id: pt-tn-mps, name: Device-agnostic code across CUDA / MPS / CPU, match: [mps-backend, device-agnostic-code]}
