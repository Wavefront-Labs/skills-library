# Coverage spec: apache-superset. Topics from the official docs (admin_docs and docs in apache/superset).
subject: apache-superset
scope:
  category: computing-software
  field: data-science-and-analytics
  products: [apache-superset]
sources:
  - "https://github.com/apache/superset/tree/master/docs"
topics:
  - id: cache-configuration
    name: "Cache configuration"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/cache.mdx"
    match: [cache, data-cache-config, filter-state]
  - id: cache-warmup-and-thumbnails
    name: "Cache warmup and thumbnails"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/cache.mdx"
    match: [cache-warmup, thumbnails, executors]
  - id: distributed-coordination
    name: "Distributed coordination"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/cache.mdx"
    match: [distributed-coordination, locks, sentinel]
  - id: alerts-reports-setup
    name: "Alerts and reports setup"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/alerts-reports.mdx"
    match: [alerts-reports, playwright, webdriver]
  - id: alerts-reports-slack-webhook-limits
    name: "Alerts and reports Slack, webhook and limits"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/alerts-reports.mdx"
    match: [slack, webhook, execution-budget]
  - id: celery-async-queries
    name: "Celery async queries"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/async-queries-celery.mdx"
    match: [celery, async-queries, flower]
  - id: sql-lab-results-backend
    name: "SQL Lab results backend"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/async-queries-celery.mdx"
    match: [results-backend, s3cache, msgpack]
  - id: aws-iam-database-auth
    name: "AWS IAM database auth"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/aws-iam.mdx"
    match: [aws-iam, aurora, redshift]
  - id: superset-config-file
    name: "Superset config file"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/configuring-superset.mdx"
    match: [superset-config, configuration, hooks]
  - id: secret-key-rotation
    name: "Secret key rotation"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/configuring-superset.mdx"
    match: [secret-key, rotation, re-encrypt-secrets]
  - id: metadata-database
    name: "Metadata database"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/configuring-superset.mdx"
    match: [metadata-database, postgresql, db-upgrade]
  - id: gunicorn-reverse-proxy
    name: "Gunicorn and reverse proxy"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/configuring-superset.mdx"
    match: [gunicorn, proxy-fix, load-balancer]
  - id: oauth-ldap-authentication
    name: "OAuth and LDAP authentication"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/security/oauth.mdx"
    match: [oauth, ldap, auth-type]
  - id: keycloak-oidc-login
    name: "Keycloak OIDC login"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/security/oauth.mdx"
    match: [keycloak, oidc, pkce]
  - id: query-history-pruning
    name: "Query history pruning"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/configuring-superset.mdx"
    match: [prune-query, query-history, retention]
  - id: dashboard-virtualization
    name: "Dashboard virtualization"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/dashboard-performance.mdx"
    match: [dashboard-performance, virtualization, lazy-rendering]
  - id: event-logging-statsd
    name: "Event logging and StatsD"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/event-logging.mdx"
    match: [event-logging, statsd, stats-logger]
  - id: feature-flags
    name: "Feature flags"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/feature-flags.mdx"
    match: [feature-flags, lifecycle, deprecated]
  - id: import-export-datasources
    name: "Import and export datasources"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/importing-exporting-datasources.mdx"
    match: [import-export, datasources, versioned-export]
  - id: cors-and-talisman
    name: "CORS and Talisman"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/networking-settings.mdx"
    match: [cors, talisman, frame-ancestors]
  - id: public-dashboards
    name: "Public dashboards"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/networking-settings.mdx"
    match: [public-role, anonymous-access, standalone]
  - id: ssh-tunneling
    name: "SSH tunneling"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/networking-settings.mdx"
    match: [ssh-tunneling, bastion, bind-address]
  - id: jinja-sql-templating
    name: "Jinja SQL templating"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/sql-templating.mdx"
    match: [jinja, sql-templating, template-processing]
  - id: jinja-macros-and-filters
    name: "Jinja macros and filters"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/sql-templating.mdx"
    match: [macros, filter-values, where-in]
  - id: jinja-template-security
    name: "Jinja template security"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/sql-templating.mdx"
    match: [template-injection, url-param, untrusted-input]
  - id: theming-configuration
    name: "Theming configuration"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/theming.mdx"
    match: [theming, theme-default, ant-design-tokens]
  - id: theme-api-management
    name: "Theme API management"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/theming.mdx"
    match: [theme-api, ui-theme-administration, themes]
  - id: timezone-handling
    name: "Timezone handling"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/timezones.mdx"
    match: [timezones, utc, epoch]
  - id: partition-filter-mapping
    name: "Partition filter mapping"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/partition-filter-mapping.mdx"
    match: [partition-filter-mapping, partition-pruning, transform]
  - id: architecture-components
    name: "Architecture components"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/installation/architecture.mdx"
    match: [architecture, components, cache-layer]
  - id: docker-compose-quickstart
    name: "Docker Compose quickstart"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/installation/docker-compose.mdx"
    match: [docker-compose, quickstart, env-local]
  - id: docker-image-builds
    name: "Docker image builds"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/installation/docker-builds.mdx"
    match: [docker-builds, build-args, lean-image]
  - id: pypi-install
    name: "PyPI install"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/installation/pypi.mdx"
    match: [pypi, pip-install, fab-create-admin]
  - id: upgrading-superset
    name: "Upgrading Superset"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/installation/upgrading-superset.mdx"
    match: [upgrading, superset-init, staging]
  - id: kubernetes-deployment
    name: "Kubernetes deployment"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/installation/kubernetes.mdx"
    match: [kubernetes, helm, operator]
  - id: securing-superset-sessions
    name: "Securing Superset sessions"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/security/securing_superset.mdx"
    match: [securing-superset, session-server-side, hardening]
  - id: built-in-roles-permissions
    name: "Built-in roles and permissions"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/security/security.mdx"
    match: [rbac, roles, gamma]
  - id: row-level-security
    name: "Row level security"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/security/security.mdx"
    match: [row-level-security, rls, base-filter]
  - id: embedded-sdk-dashboards
    name: "Embedded SDK dashboards"
    source: "https://github.com/apache/superset/blob/master/docs/docs/using-superset/embedding.mdx"
    match: [embedding, embedded-sdk, embed-dashboard]
  - id: guest-tokens
    name: "Guest tokens"
    source: "https://github.com/apache/superset/blob/master/docs/docs/using-superset/embedding.mdx"
    match: [guest-token, jwt, service-account]
  - id: dashboard-excel-export
    name: "Dashboard Excel export"
    source: "https://github.com/apache/superset/blob/master/docs/docs/using-superset/exporting-dashboard-data.mdx"
    match: [excel-export, export-storage, data-export]
  - id: granular-export-controls
    name: "Granular export controls"
    source: "https://github.com/apache/superset/blob/master/docs/docs/security/granular-export-controls.mdx"
    match: [granular-export-controls, can-export-data, permissions]
  - id: handlebars-chart
    name: "Handlebars chart"
    source: "https://github.com/apache/superset/blob/master/docs/docs/using-superset/handlebars-chart.mdx"
    match: [handlebars, custom-chart, helpers]
  - id: number-formatting
    name: "Number formatting"
    source: "https://github.com/apache/superset/blob/master/docs/docs/using-superset/number-formatting.mdx"
    match: [number-formatting, d3-format, smart-number]
  - id: map-tiles-configuration
    name: "Map tiles configuration"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/map-tiles.mdx"
    match: [map-tiles, deckgl, mapbox]
  - id: google-sheets-connection
    name: "Google Sheets connection"
    source: "https://github.com/apache/superset/blob/master/docs/admin_docs/configuration/google-sheets.mdx"
    match: [google-sheets, spreadsheet, data-source]
