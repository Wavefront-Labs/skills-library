# Coverage spec: Litestar. Topics from the Litestar docs table of contents.
subject: Litestar
scope:
  category: computing-software
  field: web-development
  products: [litestar]
sources:
  - "Litestar docs (docs.litestar.dev/latest)"
topics:
  - id: application-objects
    name: "Application objects and configuration"
    source: "https://docs.litestar.dev/latest/usage/applications.html"
    match: [litestar-app, app-config]
  - id: startup-shutdown
    name: "Startup, shutdown and lifespan"
    source: "https://docs.litestar.dev/latest/usage/applications.html"
    match: [lifespan, startup]
  - id: application-state
    name: "Application state"
    source: "https://docs.litestar.dev/latest/usage/applications.html"
    match: [app-state, state]
  - id: application-hooks
    name: "Application hooks"
    source: "https://docs.litestar.dev/latest/usage/applications.html"
    match: [on-app-init, before-send]
  - id: routing-overview
    name: "Routing overview and registering routes"
    source: "https://docs.litestar.dev/latest/usage/routing/overview.html"
    match: [routing, register]
  - id: routers-controllers
    name: "Routers, controllers and mounting ASGI apps"
    source: "https://docs.litestar.dev/latest/usage/routing/overview.html"
    match: [router, controller, mount]
  - id: route-handlers
    name: "Route handlers"
    source: "https://docs.litestar.dev/latest/usage/routing/handlers.html"
    match: [route-handler, decorators]
  - id: route-parameters
    name: "Path, query, header and cookie parameters"
    source: "https://docs.litestar.dev/latest/usage/routing/parameters.html"
    match: [parameters, path-params]
  - id: parameter-validation
    name: "Parameter validation, aliasing and layered parameters"
    source: "https://docs.litestar.dev/latest/usage/routing/parameters.html"
    match: [parameter, validation]
  - id: requests-body
    name: "Request body and content types"
    source: "https://docs.litestar.dev/latest/usage/requests.html"
    match: [request, body]
  - id: form-file-uploads
    name: "Form data and file uploads"
    source: "https://docs.litestar.dev/latest/usage/requests.html"
    match: [form-data, uploads]
  - id: responses-media-types
    name: "Response media types and content negotiation"
    source: "https://docs.litestar.dev/latest/usage/responses.html"
    match: [response, media-type]
  - id: response-headers-cookies
    name: "Response status codes, headers and cookies"
    source: "https://docs.litestar.dev/latest/usage/responses.html"
    match: [status-code, headers, cookies]
  - id: asgi-responses
    name: "Returning ASGI applications and third party responses"
    source: "https://docs.litestar.dev/latest/usage/responses.html"
    match: [asgi-app, response]
  - id: dependency-injection
    name: "Dependency injection"
    source: "https://docs.litestar.dev/latest/usage/dependency-injection.html"
    match: [dependency-injection, provide]
  - id: di-yield-overrides
    name: "Dependencies with yield and overrides"
    source: "https://docs.litestar.dev/latest/usage/dependency-injection.html"
    match: [yield, dependency-override]
  - id: dto-overview
    name: "DTO overview and basic use"
    source: "https://docs.litestar.dev/latest/usage/dto/index.html"
    match: [dto, return-dto]
  - id: abstract-dto
    name: "AbstractDTO factories and field marking"
    source: "https://docs.litestar.dev/latest/usage/dto/1-abstract-dto.html"
    match: [abstract-dto, dto-config]
  - id: dto-tutorial
    name: "DTO tutorial"
    source: "https://docs.litestar.dev/latest/tutorials/dto-tutorial/index.html"
    match: [dto-tutorial]
  - id: middleware-using
    name: "Using middleware and call order"
    source: "https://docs.litestar.dev/latest/usage/middleware/using-middleware.html"
    match: [middleware, call-order]
  - id: middleware-builtin
    name: "Built-in middleware"
    source: "https://docs.litestar.dev/latest/usage/middleware/builtin-middleware.html"
    match: [allowed-hosts, compression, rate-limit]
  - id: security-guards
    name: "Guards"
    source: "https://docs.litestar.dev/latest/usage/security/guards.html"
    match: [guards, opt]
  - id: security-jwt
    name: "JWT security backends"
    source: "https://docs.litestar.dev/latest/usage/security/jwt.html"
    match: [jwt, oauth2]
  - id: security-custom-auth
    name: "Custom authentication middleware and excluding endpoints"
    source: "https://docs.litestar.dev/latest/usage/security/abstract-authentication-middleware.html"
    match: [authentication, exclude-from-auth]
  - id: secret-datastructures
    name: "Handling secrets"
    source: "https://docs.litestar.dev/latest/usage/security/secret-datastructures.html"
    match: [secret, secret-string]
  - id: exceptions
    name: "Exceptions and exception handlers"
    source: "https://docs.litestar.dev/latest/usage/exceptions.html"
    match: [exception-handler, http-exception]
  - id: lifecycle-hooks
    name: "Life cycle hooks"
    source: "https://docs.litestar.dev/latest/usage/lifecycle-hooks.html"
    match: [before-request, after-response]
  - id: events
    name: "Events and listeners"
    source: "https://docs.litestar.dev/latest/usage/events.html"
    match: [event-emitter, listener]
  - id: websockets
    name: "WebSockets"
    source: "https://docs.litestar.dev/latest/usage/websockets.html"
    match: [websocket, listener]
  - id: channels
    name: "Channels plugin"
    source: "https://docs.litestar.dev/latest/usage/channels.html"
    match: [channels, pubsub]
  - id: testing-clients
    name: "Test clients"
    source: "https://docs.litestar.dev/latest/usage/testing.html"
    match: [test-client, testing]
  - id: sqlalchemy-plugins
    name: "SQLAlchemy plugins"
    source: "https://docs.litestar.dev/latest/usage/databases/sqlalchemy/plugins/sqlalchemy_plugin.html"
    match: [sqlalchemy, init-plugin]
  - id: sqlalchemy-repository
    name: "SQLAlchemy models and repository"
    source: "https://docs.litestar.dev/latest/usage/databases/sqlalchemy/models_and_repository.html"
    match: [repository, sqlalchemy-models]
  - id: repository-tutorial
    name: "Repository tutorial"
    source: "https://docs.litestar.dev/latest/tutorials/repository-tutorial/index.html"
    match: [repository-tutorial]
  - id: openapi-schema
    name: "OpenAPI schema generation"
    source: "https://docs.litestar.dev/latest/usage/openapi/schema_generation.html"
    match: [openapi, schema]
  - id: openapi-ui
    name: "OpenAPI UI plugins"
    source: "https://docs.litestar.dev/latest/usage/openapi/ui_plugins.html"
    match: [swagger, redoc, ui-plugin]
  - id: templating
    name: "Templating"
    source: "https://docs.litestar.dev/latest/usage/templating.html"
    match: [template, jinja]
  - id: htmx
    name: "HTMX plugin"
    source: "https://docs.litestar.dev/latest/usage/htmx.html"
    match: [htmx]
  - id: static-files-fs
    name: "Static files and file systems"
    source: "https://docs.litestar.dev/latest/usage/static-files.html"
    match: [static-files, fsspec]
  - id: stores
    name: "Stores"
    source: "https://docs.litestar.dev/latest/usage/stores.html"
    match: [store, namespace]
  - id: caching
    name: "Response caching"
    source: "https://docs.litestar.dev/latest/usage/caching.html"
    match: [cache, cache-key]
  - id: logging
    name: "Logging"
    source: "https://docs.litestar.dev/latest/usage/logging.html"
    match: [logging, structlog]
  - id: metrics
    name: "Metrics with OpenTelemetry and Prometheus"
    source: "https://docs.litestar.dev/latest/usage/metrics/index.html"
    match: [opentelemetry, prometheus]
  - id: cli
    name: "Command line interface"
    source: "https://docs.litestar.dev/latest/usage/cli.html"
    match: [cli, autodiscovery]
  - id: custom-types
    name: "Custom types and encoders"
    source: "https://docs.litestar.dev/latest/usage/custom-types.html"
    match: [type-encoders, type-decoders]
  - id: plugins-system
    name: "Plugin protocols"
    source: "https://docs.litestar.dev/latest/usage/plugins/index.html"
    match: [init-plugin, serialization-plugin]
  - id: flash-problem-details
    name: "Flash messages and problem details plugins"
    source: "https://docs.litestar.dev/latest/usage/plugins/flash_messages.html"
    match: [flash-messages, problem-details]
  - id: deployment-docker
    name: "Deployment with Docker"
    source: "https://docs.litestar.dev/latest/topics/deployment/docker.html"
    match: [docker, compose]
  - id: deployment-asgi-supervisor
    name: "Deployment with an ASGI server and Supervisor"
    source: "https://docs.litestar.dev/latest/topics/deployment/manually-with-asgi-server.html"
    match: [uvicorn, gunicorn, supervisor]
  - id: sync-async-explicit
    name: "Sync vs async and explicit declarations"
    source: "https://docs.litestar.dev/latest/topics/sync-vs-async.html"
    match: [sync-vs-async, thread-pool]
  - id: onboarding-fastapi
    name: "Onboarding from FastAPI"
    source: "https://docs.litestar.dev/latest/onboarding/fastapi.html"
    match: [fastapi, migration]
  - id: onboarding-flask
    name: "Onboarding from Flask"
    source: "https://docs.litestar.dev/latest/onboarding/flask.html"
    match: [flask, migration]
