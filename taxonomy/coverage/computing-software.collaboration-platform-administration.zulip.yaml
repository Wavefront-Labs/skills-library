# Coverage spec for Zulip server administration, from the Zulip production documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
# Topics follow the production docs table of contents on zulip.readthedocs.io.
subject: zulip
scope:
  category: computing-software
  field: collaboration-platform-administration
  products: [zulip]
sources:
  - "Zulip production documentation (zulip.readthedocs.io/en/latest/production) - requirements, install, deployment, postgresql, reverse proxies, email, email gateway, ssl certificates, securing, system configuration, settings, upload backends, upgrade, export and import, management commands, troubleshooting, multiple organizations, video calls, mobile push notifications, authentication methods, scim"
topics:
  - id: hardware-requirements-and-scaling
    name: "hardware requirements and scaling"
    source: https://zulip.readthedocs.io/en/latest/production/requirements.html
    match: [zulip-sizing, hardware-requirements, scalability]
  - id: network-ports-and-firewall
    name: "network ports and firewall"
    source: https://zulip.readthedocs.io/en/latest/production/requirements.html
    match: [zulip-firewall, network-requirements, port-4369]
  - id: install-zulip-server
    name: "install zulip server"
    source: https://zulip.readthedocs.io/en/latest/production/install.html
    match: [zulip-install, installer, certbot]
  - id: installer-advanced-options
    name: "installer advanced options"
    source: https://zulip.readthedocs.io/en/latest/production/deployment.html
    match: [installer-options, postgresql-version, no-init-db]
  - id: install-from-git
    name: "install from git"
    source: https://zulip.readthedocs.io/en/latest/production/deployment.html
    match: [install-from-git, zulip-main, git-deployment]
  - id: zulip-notify-deploy-hook
    name: "zulip notify deploy hook"
    source: https://zulip.readthedocs.io/en/latest/production/deployment.html
    match: [deploy-hooks, zulip-notify, upgrade-notification]
  - id: sentry-deploy-hook
    name: "sentry deploy hook"
    source: https://zulip.readthedocs.io/en/latest/production/deployment.html
    match: [sentry-release, deploy-hooks, error-tracking]
  - id: split-services-across-hosts
    name: "split services across hosts"
    source: https://zulip.readthedocs.io/en/latest/production/deployment.html
    match: [standalone-services, puppet-profiles, multi-host-deployment]
  - id: alternate-https-port
    name: "alternate https port"
    source: https://zulip.readthedocs.io/en/latest/production/deployment.html
    match: [alternate-port, nginx-listen-port, external-host]
  - id: outgoing-http-proxy-smokescreen
    name: "outgoing http proxy smokescreen"
    source: https://zulip.readthedocs.io/en/latest/production/deployment.html
    match: [smokescreen, http-proxy, ssrf]
  - id: install-on-existing-server
    name: "install on existing server"
    source: https://zulip.readthedocs.io/en/latest/production/install-existing-server.html
    match: [existing-server, nginx-merge, shared-host]
  - id: remote-postgresql-server
    name: "remote postgresql server"
    source: https://zulip.readthedocs.io/en/latest/production/postgresql.html
    match: [remote-postgresql, standalone-nodb, pg-hba]
  - id: managed-postgresql-rds
    name: "managed postgresql rds"
    source: https://zulip.readthedocs.io/en/latest/production/postgresql.html
    match: [amazon-rds, managed-database, remote-postgres-host]
  - id: postgresql-warm-standby
    name: "postgresql warm standby"
    source: https://zulip.readthedocs.io/en/latest/production/postgresql.html
    match: [warm-standby, wal-g, pg-ctl-promote]
  - id: reverse-proxy-http-and-trusted-ips
    name: "reverse proxy http and trusted ips"
    source: https://zulip.readthedocs.io/en/latest/production/reverse-proxies.html
    match: [reverse-proxy, http-only, loadbalancer-ips]
  - id: nginx-reverse-proxy
    name: "nginx reverse proxy"
    source: https://zulip.readthedocs.io/en/latest/production/reverse-proxies.html
