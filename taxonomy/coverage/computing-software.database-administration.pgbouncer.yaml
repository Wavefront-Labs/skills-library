# Coverage spec: pgbouncer. Topics from the official docs table of contents.
subject: pgbouncer
scope:
  category: computing-software
  field: database-administration
  products: [pgbouncer]
sources:
  - "pgbouncer official docs"
topics:
  - id: pgbouncer-quick-start
    name: "Pgbouncer quick start"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, quick-start, pgbouncer-ini, userlist, setup]
  - id: command-line-switches
    name: "Command line switches"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, cli, daemon, verbose, windows-service]
  - id: pool-modes
    name: "Pool modes"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, pool-mode, session-pooling, transaction-pooling, statement-pooling]
  - id: pool-sizing-settings
    name: "Pool sizing settings"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, pool-size, default-pool-size, min-pool-size, reserve-pool]
  - id: connection-limits
    name: "Connection limits"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, max-client-conn, max-db-connections, max-user-connections, limits]
  - id: listen-addresses-and-sockets
    name: "Listen addresses and sockets"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, listen-addr, listen-port, unix-socket, networking]
  - id: logfile-pidfile-syslog
    name: "Logfile pidfile syslog"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, logging, logfile, pidfile, syslog]
  - id: log-event-settings
    name: "Log event settings"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, log-connections, log-stats, verbose, stats-period]
  - id: auth-type-methods
    name: "Auth type methods"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, auth-type, md5, scram-sha-256, authentication]
  - id: auth-file-format
    name: "Auth file format"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, auth-file, userlist, md5, scram]
  - id: auth-user-and-auth-query
    name: "Auth user and auth query"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, auth-user, auth-query, pg-authid, security-definer]
  - id: scram-secret-for-managed-servers
    name: "Scram secret for managed servers"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, scram, rds, pg-authid, userlist, password]
  - id: hba-file-format
    name: "Hba file format"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, hba, auth-hba-file, peer, pg-hba]
  - id: ldap-and-pam-auth
    name: "Ldap and pam auth"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, ldap, pam, authentication, auth-ldap-options]
  - id: console-access-control
    name: "Console access control"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, admin-users, stats-users, console, access]
  - id: client-tls-sslmode
    name: "Client tls sslmode"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, tls, client-tls, sslmode, certificates]
  - id: client-tls-protocols-and-ciphers
    name: "Client tls protocols and ciphers"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, tls, ciphers, protocols, tls13]
  - id: server-tls-sslmode
    name: "Server tls sslmode"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, tls, server-tls, sslmode, verify-full]
  - id: server-reset-query
    name: "Server reset query"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, server-reset-query, discard-all, session-pooling, state]
  - id: server-connection-checks
    name: "Server connection checks"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, server-check-query, server-check-delay, health, server-connections]
  - id: server-login-retry
    name: "Server login retry"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, server-login-retry, failover, restart, pause]
  - id: client-timeouts
    name: "Client timeouts"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, client-login-timeout, query-wait-timeout, client-idle-timeout, timeouts]
  - id: query-and-transaction-timeouts
    name: "Query and transaction timeouts"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, query-timeout, idle-transaction-timeout, transaction-timeout, timeouts]
  - id: pool-and-autodb-idle-timeouts
    name: "Pool and autodb idle timeouts"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, autodb-idle-timeout, pool-idle-timeout, stats, wildcard-database]
  - id: databases-section-syntax
    name: "Databases section syntax"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, databases-section, connection-string, dbname, forced-user]
  - id: multi-host-load-balancing
    name: "Multi host load balancing"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, load-balance-hosts, host-list, round-robin, server-round-robin]
  - id: dns-resolution-settings
    name: "Dns resolution settings"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, dns, dns-max-ttl, c-ares, resolv-conf]
  - id: prepared-statements-transaction-pooling
    name: "Prepared statements transaction pooling"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, prepared-statements, max-prepared-statements, transaction-pooling, protocol]
  - id: prepared-statements-client-workarounds
    name: "Prepared statements client workarounds"
    source: "https://www.pgbouncer.org/faq.html"
    match: [pgbouncer, prepared-statements, jdbc, php-pdo, faq]
  - id: tracked-and-ignored-startup-parameters
    name: "Tracked and ignored startup parameters"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, track-extra-parameters, ignore-startup-parameters, startup-parameters, search-path]
  - id: peering-and-cancel-requests
    name: "Peering and cancel requests"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, peers, peer-id, cancel-requests, load-balancer]
  - id: so-reuseport-multicore
    name: "So reuseport multicore"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, so-reuseport, multicore, peering, performance]
  - id: network-buffer-and-keepalive-settings
    name: "Network buffer and keepalive settings"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, pkt-buf, tcp-keepalive, sbuf-loopcnt, network]
  - id: users-section
    name: "Users section"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, users-section, per-user, pool-size, timeouts]
  - id: include-directive-and-reload
    name: "Include directive and reload"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, include, reload, sighup, config-file]
  - id: show-pools
    name: "Show pools"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, show-pools, monitoring, maxwait, pool-state]
  - id: show-stats
    name: "Show stats"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, show-stats, metrics, wait-time, monitoring]
  - id: show-clients-and-servers
    name: "Show clients and servers"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, show-clients, show-servers, connections, troubleshooting]
  - id: show-databases-users-config
    name: "Show databases users config"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, show-databases, show-users, show-config, console]
  - id: pause-resume-disable-enable
    name: "Pause resume disable enable"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, pause, resume, disable, enable]
  - id: reconnect-kill-and-wait-close
    name: "Reconnect kill and wait close"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, reconnect, kill, kill-client, wait-close]
  - id: shutdown-and-signals
    name: "Shutdown and signals"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, shutdown, signals, sigterm, sigint]
  - id: zero-downtime-rolling-restart
    name: "Zero downtime rolling restart"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, rolling-restart, upgrade, so-reuseport, wait-for-clients]
  - id: failover-and-switchover
    name: "Failover and switchover"
    source: "https://www.pgbouncer.org/faq.html"
    match: [pgbouncer, failover, switchover, dns, reconnect]
  - id: placement-web-or-database-server
    name: "Placement web or database server"
    source: "https://www.pgbouncer.org/faq.html"
    match: [pgbouncer, deployment, architecture, latency, faq]
  - id: building-pgbouncer
    name: "Building pgbouncer"
    source: "https://www.pgbouncer.org/install.html"
    match: [pgbouncer, install, autoconf, meson, build]
  - id: pgbouncer-on-windows
    name: "Pgbouncer on windows"
    source: "https://www.pgbouncer.org/install.html"
    match: [pgbouncer, windows, service, regservice, event-log]
  - id: admin-console-set-command
    name: "Admin console set command"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, set, runtime-config, show-config, console]
  - id: cert-authentication
    name: "Cert authentication"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, cert, client-certificate, tls, auth-type]
  - id: transaction-pooling-session-state
    name: "Transaction pooling session state"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, transaction-pooling, session-state, reset-query, leaks]
  - id: reserve-pool-behaviour
    name: "Reserve pool behaviour"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, reserve-pool, reserve-pool-size, reserve-pool-timeout, queueing]
  - id: forced-user-and-connect-query
    name: "Forced user and connect query"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, forced-user, connect-query, databases-section, pooling]
  - id: statement-pooling-mode
    name: "Statement pooling mode"
    source: "https://www.pgbouncer.org/usage.html"
    match: [pgbouncer, statement-pooling, pool-mode, autocommit, restrictions]
  - id: connection-reset-and-lifetime-recycling
    name: "Connection reset and lifetime recycling"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, server-lifetime, server-idle-timeout, recycling, close-needed]
  - id: file-descriptor-planning
    name: "File descriptor planning"
    source: "https://www.pgbouncer.org/config.html"
    match: [pgbouncer, file-descriptors, ulimit, max-client-conn, capacity]
