# Coverage spec for Mailcow (email-administration).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: mailcow
scope:
  category: computing-software
  field: email-administration
  products: [mailcow]
sources:
  - https://docs.mailcow.email/
topics:
  - id: installation
    name: Installation procedure
    source: https://docs.mailcow.email/
    match: [installation, generate-config, mailcow-conf]
  - id: requirements
    name: System requirements and supported OS
    source: https://docs.mailcow.email/
    match: [system-requirements, supported-os, ram-sizing]
  - id: firewall
    name: Firewall and ports
    source: https://docs.mailcow.email/
    match: [firewall, ports, docker-user-chain]
  - id: dns-records
    name: DNS records for mail
    source: https://docs.mailcow.email/
    match: [dns, mx-record, spf, dkim, dmarc]
  - id: ptr
    name: Reverse DNS PTR
    source: https://docs.mailcow.email/
    match: [ptr-record]
  - id: srv-autodiscover
    name: SRV and autodiscover DNS
    source: https://docs.mailcow.email/
    match: [srv-records, autodiscover]
  - id: autodiscover-config
    name: Autodiscover and autoconfig
    source: https://docs.mailcow.email/
    match: [autodiscover-config, autoconfig, activesync]
  - id: lets-encrypt
    name: Lets Encrypt ACME
    source: https://docs.mailcow.email/
    match: [lets-encrypt, acme-mailcow, force-renew]
  - id: additional-san
    name: Additional SAN names
    source: https://docs.mailcow.email/
    match: [additional-san, additional-server-names]
  - id: dns-01
    name: DNS-01 challenge certificates
    source: https://docs.mailcow.email/
    match: [dns-01, acme-dns-challenge, wildcard-certificate]
  - id: reverse-proxy
    name: Reverse proxy
    source: https://docs.mailcow.email/
    match: [reverse-proxy, http-bind, enable-ssl-sni]
  - id: custom-nginx
    name: Custom nginx sites
    source: https://docs.mailcow.email/
    match: [nginx-custom-site, webmail-redirect, http-redirect]
  - id: update-script
    name: Update script
    source: https://docs.mailcow.email/
    match: [update-sh, update-channels, release-cycle]
  - id: rollback
    name: Update rollback
    source: https://docs.mailcow.email/
    match: [rollback]
  - id: update-hooks
    name: Update hooks
    source: https://docs.mailcow.email/
    match: [update-hooks]
  - id: backup-script
    name: Backup script
    source: https://docs.mailcow.email/
    match: [backup-script, backup-and-restore-sh]
  - id: backup-cron
    name: Backup cron and rsync
    source: https://docs.mailcow.email/
    match: [cron-backup, rsync-backup, delete-days]
  - id: borgmatic
    name: Borgmatic backups
    source: https://docs.mailcow.email/
    match: [borgmatic, borg-passphrase]
  - id: restore
    name: Restore procedure
    source: https://docs.mailcow.email/
    match: [restore, restore-points, new-system-restore]
  - id: migration
    name: Server migration
    source: https://docs.mailcow.email/
    match: [migration, rsync, new-server]
  - id: cold-standby
    name: Cold standby
    source: https://docs.mailcow.email/
    match: [cold-standby, create-cold-standby, mariabackup]
  - id: deletion-recovery
    name: Mailbox deletion recovery
    source: https://docs.mailcow.email/
    match: [accidental-deletion, mailbox-recovery, maildir-gc-time]
  - id: password-reset
    name: Admin password reset
    source: https://docs.mailcow.email/
    match: [reset-admin-password, mysql-password-reset]
  - id: tfa-reset
    name: Two-factor reset
    source: https://docs.mailcow.email/
    match: [remove-tfa, sogo-tool-preferences]
  - id: two-factor
    name: Two-factor authentication
    source: https://docs.mailcow.email/
    match: [two-factor-authentication, totp, webauthn]
  - id: app-passwords
    name: App passwords
    source: https://docs.mailcow.email/
    match: [app-passwords]
  - id: ldap
    name: LDAP identity provider
    source: https://docs.mailcow.email/
    match: [ldap, identity-provider, bind-dn]
  - id: oidc
    name: Keycloak and generic OIDC
    source: https://docs.mailcow.email/
    match: [keycloak, generic-oidc, authorization-code-flow]
  - id: rspamd-ui
    name: Rspamd UI and history
    source: https://docs.mailcow.email/
    match: [rspamd, rspamd-ui, rspamd-history]
  - id: spam-learning
    name: Spam and ham learning
    source: https://docs.mailcow.email/
    match: [bayes, learn-spam, learn-ham]
  - id: spam-thresholds
    name: Spam thresholds and rejects
    source: https://docs.mailcow.email/
    match: [spam-thresholds, actions-conf, reject-message]
  - id: greylisting
    name: Greylisting and multimap
    source: https://docs.mailcow.email/
    match: [greylisting, multimap]
  - id: dmarc-reporting
    name: DMARC reporting
    source: https://docs.mailcow.email/
    match: [dmarc-reporting, rspamd-dmarc, parsedmarc]
  - id: clamav
    name: ClamAV whitelisting
    source: https://docs.mailcow.email/
    match: [clamav, signature-whitelist, false-positive]
  - id: netfilter
    name: Netfilter bans
    source: https://docs.mailcow.email/
    match: [netfilter, fail2ban-parameters, ban-time]
  - id: blocklist
    name: External blocklist
    source: https://docs.mailcow.email/
    match: [external-firewall, blocklist-endpoint]
  - id: crowdsec
    name: CrowdSec integration
    source: https://docs.mailcow.email/
    match: [crowdsec, firewall-bouncer, ipset]
  - id: watchdog
    name: Watchdog
    source: https://docs.mailcow.email/
    match: [watchdog, watchdog-thresholds, service-health]
  - id: prometheus
    name: Prometheus exporter
    source: https://docs.mailcow.email/
    match: [prometheus-exporter, metrics-endpoint, mailcow-exporter]
  - id: logging
    name: Logging drivers and rotation
    source: https://docs.mailcow.email/
    match: [logging, docker-logging-driver, logrotate]
  - id: troubleshooting
    name: Common problems and logs
    source: https://docs.mailcow.email/
    match: [troubleshooting, unhealthy-container, docker-compose-logs]
  - id: dovecot-conf
    name: Dovecot customisation
    source: https://docs.mailcow.email/
    match: [dovecot-extra-conf, mail-crypt, maildir-encryption]
  - id: shared-folders
    name: Shared and public folders
    source: https://docs.mailcow.email/
    match: [public-folders, shared-acl, acl-anyone]
  - id: expunge
    name: Expunge old mail
    source: https://docs.mailcow.email/
    match: [doveadm-expunge, junk-cleanup, retention-cron]
  - id: fts
    name: Full-text search flatcurve
    source: https://docs.mailcow.email/
    match: [full-text-search, flatcurve, fts-reindex]
  - id: sogo-theme
    name: SOGo custom theme
    source: https://docs.mailcow.email/
    match: [sogo, custom-theme, sogo-conf]
  - id: sender-acl
    name: Sender permissions and ACL
    source: https://docs.mailcow.email/
    match: [send-as, delegation, sender-check]
  - id: aliases
    name: Aliases and catch-all
    source: https://docs.mailcow.email/
    match: [catch-all-alias, alias-domains, temporary-aliases]
  - id: user-spam
    name: User spam filter and tags
    source: https://docs.mailcow.email/
    match: [user-spam-filter, sub-addressing, ui-tags]
  - id: snat
    name: SNAT and IP bindings
    source: https://docs.mailcow.email/
    match: [snat, outgoing-ip, ip-binding]
  - id: ipv6
    name: IPv6 enable and disable
    source: https://docs.mailcow.email/
    match: [ipv6, enable-ipv6, open-relay]
  - id: local-mta
    name: Local MTA coexistence
    source: https://docs.mailcow.email/
    match: [local-mta, relayhost, port-25-conflict]
  - id: unbound
    name: Unbound resolver
    source: https://docs.mailcow.email/
    match: [unbound, dns-forwarder, dnssec]
  - id: redis-debug
    name: Redis debugging
    source: https://docs.mailcow.email/
    match: [redis-cli, redis-monitor]
  - id: mta-sts
    name: MTA-STS
    source: https://docs.mailcow.email/
    match: [mta-sts, mail-tls-policy, dane]
