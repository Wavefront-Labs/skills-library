# Coverage spec: paperless-ngx. Topics from the official docs headings in sources.
subject: paperless-ngx
scope:
  category: computing-software
  field: systems-network-administration
  products: [paperless-ngx]
sources:
  - "https://docs.paperless-ngx.com/"
topics:
  - id: install-script-docker
    name: "Install script docker"
    source: "https://docs.paperless-ngx.com/setup/"
    match: [docker, install-script, docker-compose]
  - id: docker-compose-install
    name: "Docker compose install"
    source: "https://docs.paperless-ngx.com/setup/"
    match: [docker-compose, compose-file, bind-mount]
  - id: usermap-uid-gid
    name: "Usermap uid gid"
    source: "https://docs.paperless-ngx.com/setup/"
    match: [usermap-uid, usermap-gid, rootless]
  - id: consume-dir-polling-nfs
    name: "Consume dir polling nfs"
    source: "https://docs.paperless-ngx.com/setup/"
    match: [inotify, nfs, polling]
  - id: bare-metal-install
    name: "Bare metal install"
    source: "https://docs.paperless-ngx.com/setup/"
    match: [bare-metal, manual-install, dependencies]
  - id: low-power-tuning
    name: "Low power tuning"
    source: "https://docs.paperless-ngx.com/setup/"
    match: [raspberry-pi, performance, task-workers]
  - id: secret-key-required
    name: "Secret key required"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [secret-key, paperless-secret-key, security]
  - id: message-broker-valkey
    name: "Message broker valkey"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [redis, valkey, message-broker]
  - id: database-engine-selection
    name: "Database engine selection"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [postgresql, mariadb, sqlite]
  - id: db-options-ssl-pooling
    name: "Db options ssl pooling"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [paperless-db-options, ssl, connection-pool]
  - id: sqlite-locked-database
    name: "Sqlite locked database"
    source: "https://docs.paperless-ngx.com/troubleshooting/"
    match: [sqlite, db-locked, paperless-db-timeout]
  - id: mariadb-case-and-timezones
    name: "Mariadb case and timezones"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [mariadb, mysql, collation]
  - id: mariadb-collation-mix
    name: "Mariadb collation mix"
    source: "https://docs.paperless-ngx.com/troubleshooting/"
    match: [mariadb, illegal-mix-of-collations, collation]
  - id: postgres-collation-mismatch
    name: "Postgres collation mismatch"
    source: "https://docs.paperless-ngx.com/troubleshooting/"
    match: [postgresql, collation-version-mismatch, glibc]
  - id: tika-gotenberg-office
    name: "Tika gotenberg office"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [tika, gotenberg, office-documents]
  - id: paths-and-folders
    name: "Paths and folders"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [media-root, data-dir, consumption-dir]
  - id: url-allowed-hosts-csrf
    name: "Url allowed hosts csrf"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [paperless-url, allowed-hosts, csrf]
  - id: reverse-proxy-trusted-proxies
    name: "Reverse proxy trusted proxies"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [reverse-proxy, trusted-proxies, x-forwarded-for]
  - id: remote-user-sso
    name: "Remote user sso"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [remote-user, sso, http-remote-user]
  - id: oidc-social-login
    name: "Oidc social login"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [oidc, openid-connect, social-login]
  - id: permissions-model
    name: "Permissions model"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [permissions, users-groups, superuser]
  - id: ocr-mode
    name: "Ocr mode"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [ocr, paperless-ocr-mode, ocrmypdf]
  - id: archive-file-generation
    name: "Archive file generation"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [archive-file, pdfa, paperless-archive-file-generation]
  - id: ocr-languages
    name: "Ocr languages"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [ocr-language, tesseract, paperless-ocr-languages]
  - id: ocr-user-args
    name: "Ocr user args"
    source: "https://docs.paperless-ngx.com/configuration/"
    match: [ocr-user-args, ocrmypdf, unpaper]
  - id: remote-ocr-azure
    name: "Remote ocr azure"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [remote-ocr, azure, document-intelligence]
  - id: consumption-directory
    name: "Consumption directory"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [consumption-directory, consumer, subdirs-as-tags]
  - id: consumer-stability-delay
    name: "Consumer stability delay"
    source: "https://docs.paperless-ngx.com/troubleshooting/"
    match: [stability-delay, filenotfounderror, consumer]
  - id: duplicate-documents
    name: "Duplicate documents"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [duplicates, consumer-delete-duplicates, checksum]
  - id: mail-rules
    name: "Mail rules"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [mail-rules, imap, mail-account]
  - id: mail-oauth
    name: "Mail oauth"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [email-oauth, gmail, outlook]
  - id: matching-algorithms
    name: "Matching algorithms"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [matching-algorithm, tags, correspondents]
  - id: auto-classifier
    name: "Auto classifier"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [auto-matching, classifier, scikit-learn]
  - id: filename-format-storage-paths
    name: "Filename format storage paths"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [filename-format, storage-paths, document-renamer]
  - id: consume-scripts
    name: "Consume scripts"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [pre-consume-script, post-consume-script, hooks]
  - id: workflow-triggers
    name: "Workflow triggers"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [workflows, workflow-triggers, consumption-started]
  - id: workflow-actions
    name: "Workflow actions"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [workflow-actions, password-removal, move-to-trash]
  - id: workflow-webhooks-placeholders
    name: "Workflow webhooks placeholders"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [webhooks, workflow-placeholders, jinja]
  - id: custom-fields
    name: "Custom fields"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [custom-fields, document-link, monetary]
  - id: barcode-splitting-asn
    name: "Barcode splitting asn"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [barcodes, document-splitting, asn]
  - id: barcode-tags-and-values
    name: "Barcode tags and values"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [tag-barcode, barcode-mapping, store-barcode-values]
  - id: double-sided-collation
    name: "Double sided collation"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [collate, double-sided, adf]
  - id: search-syntax
    name: "Search syntax"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [search, full-text-search, tantivy]
  - id: search-index-maintenance
    name: "Search index maintenance"
    source: "https://docs.paperless-ngx.com/administration/"
    match: [document-index, reindex, search-language]
  - id: api-authentication
    name: "Api authentication"
    source: "https://docs.paperless-ngx.com/api/"
    match: [rest-api, api-token, basic-auth]
  - id: api-upload-document
    name: "Api upload document"
    source: "https://docs.paperless-ngx.com/api/"
    match: [post-document, file-upload, api]
  - id: api-custom-field-query
    name: "Api custom field query"
    source: "https://docs.paperless-ngx.com/api/"
    match: [custom-field-query, api-search, autocomplete]
  - id: api-bulk-edit
    name: "Api bulk edit"
    source: "https://docs.paperless-ngx.com/api/"
    match: [bulk-edit, api, set-permissions]
  - id: api-versioning
    name: "Api versioning"
    source: "https://docs.paperless-ngx.com/api/"
    match: [api-version, accept-header, x-api-version]
  - id: exporter-backup
    name: "Exporter backup"
    source: "https://docs.paperless-ngx.com/administration/"
    match: [document-exporter, backup, export]
  - id: importer-restore
    name: "Importer restore"
    source: "https://docs.paperless-ngx.com/administration/"
    match: [document-importer, restore, import]
  - id: upgrade-docker
    name: "Upgrade docker"
    source: "https://docs.paperless-ngx.com/administration/"
    match: [upgrade, docker-compose-pull, backup]
  - id: sanity-checker
    name: "Sanity checker"
    source: "https://docs.paperless-ngx.com/administration/"
    match: [sanity-checker, document-sanity-checker, checksum]
  - id: ai-features-setup
    name: "Ai features setup"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [ai, llm, ollama]
  - id: trash-and-audit-log
    name: "Trash and audit log"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [trash, empty-trash-delay, audit-log]
  - id: document-versions
    name: "Document versions"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [document-versions, merge-as-versions, update-version]
  - id: share-links
    name: "Share links"
    source: "https://docs.paperless-ngx.com/usage/"
    match: [share-links, email-sharing, bundle]
  - id: celery-flower
    name: "Celery flower"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [celery, flower, monitoring]
  - id: v3-migration-checklist
    name: "V3 migration checklist"
    source: "https://docs.paperless-ngx.com/migration-v3/"
    match: [v3-migration, upgrade-checklist, breaking-changes]
  - id: gpg-email-decryption
    name: "Gpg email decryption"
    source: "https://docs.paperless-ngx.com/advanced_usage/"
    match: [gpg, encrypted-email, gpg-agent]
