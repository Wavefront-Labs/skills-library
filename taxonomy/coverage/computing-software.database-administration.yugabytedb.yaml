# Coverage spec for YugabyteDB operations and administration (database-administration).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: yugabytedb
scope:
  category: computing-software
  field: database-administration
  products: [yugabytedb]
sources:
  - https://github.com/yugabyte/yugabyte-db/tree/master/docs/content/stable
topics:
  - id: architecture-and-process-roles
    name: Architecture and process roles
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/architecture/yb-master.md
    match: [yb-master, yb-tserver, architecture, system-catalog, tablets, docdb]
  - id: raft-replication-and-fault-tolerance
    name: Raft replication and fault tolerance
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/architecture/docdb-replication/raft.md
    match: [raft, replication-factor, leader-election, fault-tolerance, tablet-peers, follower-unavailable]
  - id: sharding-and-presplitting
    name: Sharding choices and presplitting
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/architecture/docdb-sharding/sharding.md
    match: [sharding, hash-sharding, range-sharding, presplit, split-into-tablets, split-at-values]
  - id: tablet-splitting-operations
    name: Manual and automatic tablet splitting
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/architecture/docdb-sharding/tablet-splitting.md
    match: [tablet-splitting, automatic-tablet-splitting, split-tablet, post-split-compaction, outstanding-tablet-split-limit]
  - id: tablet-and-memory-limits
    name: Tablet replica limits and memory sizing
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/deploy/checklist.md
    match: [tablet-limits, enforce-tablet-replica-limits, tablet-replicas-per-core-limit, tablet-replicas-per-gib-limit, memory, memory-defaults, tablet-replicas, memory-limit-hard-bytes, ysql-connections]
  - id: storage-engine-and-compaction
    name: Storage engine and compaction
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/architecture/docdb/lsm-sst.md
    match: [lsm, rocksdb, memtable, sst, bloom-filter, tombstones, compaction, packed-rows, storage-format]
  - id: manual-and-scheduled-compaction-ops
    name: Manual and scheduled compaction
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/admin/yb-admin.md
    match: [compact-table, scheduled-full-compaction, auto-compact, disk-space]
  - id: transaction-isolation-and-priorities
    name: Isolation levels and transaction priorities
    source: https://github.com/yugabyte/yugabyte-db/blob/master/docs/content/stable/architecture/transactions/isolation-levels.md
    match: [transactions, isolation-levels, serializable, snapshot-isolation, read-committed, transaction-priority, conflict-resolution, select-for-update]
  - id: read-restart-and-clock-skew
    name: Read restart errors and clock skew
