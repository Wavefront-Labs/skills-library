# Coverage spec: dagger. Topics from the official docs table of contents.
subject: dagger
scope:
  category: computing-software
  field: devops-ci-cd
  products: [dagger]
sources:
  - "Dagger 0.21 docs (docs.dagger.io/0.21)"
topics:
