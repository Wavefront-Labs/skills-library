    name: "Dagger platform overview and use cases"
    source: "https://docs.dagger.io/0.21/"
    match: [overview, use-cases]
  - id: dagger-a-installation
    name: "Installation"
    source: "https://docs.dagger.io/0.21/getting-started/installation"
    match: [install, cli]
  - id: dagger-a-faq
    name: "FAQ"
    source: "https://docs.dagger.io/0.21/introduction/faq"
    match: [faq, telemetry]
  - id: dagger-a-toolchains
    name: "Toolchains"
    source: "https://docs.dagger.io/0.21/introduction/core-concepts/toolchains"
    match: [toolchain]
  - id: dagger-a-checks
    name: "Checks"
    source: "https://docs.dagger.io/0.21/introduction/core-concepts/checks"
    match: [checks, dagger-check]
  - id: dagger-a-functions
    name: "Functions"
    source: "https://docs.dagger.io/0.21/introduction/core-concepts/functions"
    match: [functions]
