    name: "Ephemeral services"
    source: "https://docs.dagger.io/0.21/introduction/features/services"
    match: [services]
  - id: dagger-a-observability
    name: "Observability"
    source: "https://docs.dagger.io/0.21/introduction/features/observability"
    match: [observability, debugging]
  - id: dagger-a-llm
    name: "LLM integration"
    source: "https://docs.dagger.io/0.21/introduction/features/llm"
    match: [llm, mcp]
  - id: dagger-a-sandbox
