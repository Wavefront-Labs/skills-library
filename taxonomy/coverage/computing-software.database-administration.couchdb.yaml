# Coverage spec: couchdb. Topics from the Apache CouchDB docs (apache/couchdb, src/docs/src; moved from apache/couchdb-documentation).
subject: couchdb
scope:
  category: computing-software
  field: database-administration
  products: [couchdb]
sources:
  - "Apache CouchDB docs (github.com/apache/couchdb, src/docs/src)"
topics:
  - id: back-up-databases
    name: "Back up databases by replication, file copy or snapshot"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/backups.rst"
    match: [backup, couch-files, snapshots, shards]
  - id: back-up-config-and-logs
    name: "Back up configuration and logs, log rotation"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/backups.rst"
    match: [log-rotation, ini-files]
  - id: compaction-overview
    name: "Compaction overview and smoosh daemon"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/compaction.rst"
    match: [compaction, smoosh, disk-space]
  - id: smoosh-channels
    name: "Smoosh compaction channels (ratio and slack)"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/compaction.rst"
    match: [channels, ratio, slack]
  - id: smoosh-scheduling-and-migration
    name: "Smoosh scheduling windows and migration from the old daemon"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/compaction.rst"
    match: [strict-window, compaction-daemon, db-fragmentation]
  - id: manual-compaction
    name: "Manual database and view compaction, view cleanup"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/compaction.rst"
    match: [compact-running, view-cleanup, active-tasks]
  - id: disk-io-tuning
    name: "Disk I/O tuning and Erlang async threads"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/performance.rst"
    match: [disk-io, erl-flags, erlang-threads, file-size]
  - id: resource-limits
    name: "File descriptor and open database limits"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/performance.rst"
    match: [ulimit, file-descriptors, max-dbs-open, systemd]
  - id: network-tuning
    name: "Network batching, nodelay and connection limits"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/performance.rst"
    match: [batching, nodelay, socket-options, connection-limit]
  - id: deleted-docs-and-ids
    name: "Deleted documents and document id size"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/performance.rst"
    match: [deleted-documents, document-ids, database-rotation]
  - id: view-performance
    name: "View generation performance and built-in reduces"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/maintenance/performance.rst"
    match: [views, builtin-reduce, stale, stable]
  - id: single-node-setup
    name: "Single node setup"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/setup/single-node.rst"
    match: [single-node, system-databases]
  - id: cluster-ports-and-names
    name: "Cluster ports, firewalls, node names and connectivity"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/setup/cluster.rst"
    match: [firewall, epmd, port-5984, vm-args, node-name, connectivity-test]
  - id: cluster-preparation
    name: "Prepare nodes: uuid, secret, admin, bind address"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/setup/cluster.rst"
    match: [uuid, http-secret, bind-address]
  - id: cluster-setup
    name: "Cluster setup wizard and _cluster_setup API"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/setup/cluster.rst"
    match: [setup-wizard, cluster-setup, enable-cluster, membership, haproxy]
  - id: sharding-basics
    name: "Shards, replicas (q and n), quorum and examining shards"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/sharding.rst"
    match: [sharding, q-n, quorum, shard-map, diagnostics]
  - id: shard-moving
    name: "Move shards between nodes, maintenance mode and shard map editing"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/sharding.rst"
    match: [shard-move, maintenance-mode, dbs-database, changelog, by-node]
  - id: shard-sync-and-placement
    name: "Force shard sync and database placement rules"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/sharding.rst"
    match: [sync-shards, internal-replication, placement, zones]
  - id: resharding
    name: "Split, stop and merge shards"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/sharding.rst"
    match: [resharding, shard-splitting, reshard-api, merge-shards]
  - id: node-management
    name: "Add and remove cluster nodes"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/nodes.rst"
    match: [add-node, remove-node, nodes-database]
  - id: clustered-purge
    name: "Clustered purge internals and checkpoint warnings"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/purging.rst"
    match: [purge, purge-seq, purged-infos-limit, checkpoints]
  - id: weatherreport
    name: "WeatherReport cluster diagnostics"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/troubleshooting.rst"
    match: [weatherreport, cluster-health, troubleshooting]
  - id: tls-erlang-distribution
    name: "TLS for Erlang distribution"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/cluster/tls_erlang_distribution.rst"
    match: [tls, erlang-distribution, no-tls, remsh, couch-dist-conf]
  - id: config-files
    name: "Configuration file chain and ini syntax"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/intro.rst"
    match: [configuration, default-ini, local-ini, couch-ini, ini-syntax]
  - id: config-http-api
    name: "Runtime configuration via the HTTP API"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/intro.rst"
    match: [http-api, config-whitelist, local-node]
  - id: cluster-config
    name: "Cluster and rexi configuration options"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/cluster.rst"
    match: [seedlist, reconnect-interval, rexi, stream-limit]
  - id: server-admins
    name: "Server administrators and valid-user enforcement"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/auth.rst"
    match: [admins, pbkdf2, require-valid-user, anonymous-access]
  - id: session-and-cookie-config
    name: "Session cookie and hash algorithm settings"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/auth.rst"
    match: [cookies, session-timeout, secret, same-site]
  - id: password-policy
    name: "Password hashing iterations and password policy"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/auth.rst"
    match: [iterations, password-regexp, upgrade-hash-on-auth]
  - id: proxy-and-jwt-auth
    name: "Proxy authentication and JWT authentication"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/auth.rst"
    match: [proxy-auth, jwt, roles-claim-path, public-fields]
  - id: auth-lockout
    name: "Automatic user lockout"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/auth.rst"
    match: [lockout, brute-force]
  - id: replicator-scheduler-config
    name: "Replicator scheduler settings"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/replicator.rst"
    match: [scheduler, max-jobs, max-churn]
  - id: replicator-tuning
    name: "Replicator throughput, compression and checkpoint tuning"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/replicator.rst"
    match: [workers, compression, retries, use-checkpoints]
  - id: replicator-security-and-routing
    name: "Replicator TLS, endpoint protocols, connect_to and sockets"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/replicator.rst"
    match: [endpoint-protocols, connect-to, auth-plugins, ibrowse]
  - id: replicator-fair-share
    name: "Replicator fair share allocation"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/config/replicator.rst"
    match: [fair-share, replicator-shares, usage-coeff]
  - id: replicator-database
    name: "The _replicator database and replication documents"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/replication/replicator.rst"
    match: [replicator-database, replication-documents, duplicate-replication]
  - id: replication-monitoring-and-states
    name: "Monitor replications and job states"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/replication/replicator.rst"
    match: [scheduler-jobs, scheduler-docs, job-states, crashing]
  - id: replication-modes-and-cluster
    name: "Normal versus continuous replication and clustered replication"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/replication/replicator.rst"
    match: [continuous, compatibility-mode, failover, additional-replicator-databases]
  - id: replication-credentials
    name: "Replication endpoint credentials"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/replication/replicator.rst"
    match: [basic-auth, authorization-header, ibm-iam]
  - id: replication-delegation-and-filters
    name: "Delegated replication, selectors and winning revisions"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/replication/replicator.rst"
    match: [user-ctx, selector, winning-revs-only]
  - id: admin-operations-and-basic-auth
    name: "Admin-only operations and creating admins"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/intro/security.rst"
    match: [admin, authorization, plaintext-passwords]
  - id: cookie-authentication
    name: "Cookie authentication with _session"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/intro/security.rst"
    match: [cookie-auth, session, authsession, login]
  - id: users-database
    name: "The _users database and user documents"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/intro/security.rst"
    match: [users-database, user-documents, org-couchdb-user, roles]
  - id: password-schemes
    name: "Password schemes and migration"
    source: "https://raw.githubusercontent.com/apache/couchdb/main/src/docs/src/intro/security.rst"
    match: [password-schemes, simple-pbkdf2, derived-key]
