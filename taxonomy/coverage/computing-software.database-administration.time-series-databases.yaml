# Coverage spec: Time-series databases (time-series-databases product).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: time-series-databases
scope:
  category: computing-software
  field: database-administration
  products: [time-series-databases]
sources:
  - "InfluxDB v2 and InfluxDB 3 documentation tables of contents (docs.influxdata.com) - data model, buckets, Flux, InfluxQL, tasks, Telegraf, security, backup, performance"
  - "TimescaleDB documentation (docs.timescale.com) - hypertables, compression, continuous aggregates, policies, jobs, tuning, backup, migration"
  - "Prometheus storage and operating documentation (prometheus.io/docs/prometheus/latest/storage) plus Thanos, Mimir and VictoriaMetrics docs - TSDB blocks, WAL, retention, remote write, cardinality, recording rules, HA"
  - "QuestDB and ClickHouse documentation for time-series modelling"
topics:
  - id: influx-data-model
    name: "InfluxDB data model"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-data-model]
    subtopics:
      - {id: influx-data-model-influxdb-line-protocol, name: "Line protocol format", match: [influxdb-line-protocol]}
      - {id: influx-data-model-influxdb-tags-vs-fields, name: "Tags versus fields", match: [influxdb-tags-vs-fields]}
  - id: influx-buckets-retention
    name: "InfluxDB buckets and retention"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-buckets-retention]
    subtopics:
      - {id: influx-buckets-retention-influxdb-bucket-retention, name: "Bucket retention periods", match: [influxdb-bucket-retention]}
      - {id: influx-buckets-retention-influxdb-shard-group-duration, name: "Shard group duration", match: [influxdb-shard-group-duration]}
  - id: influx-flux
    name: "Flux query language"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-flux]
    subtopics:
      - {id: influx-flux-flux-pipeline-basics, name: "Flux pipeline basics", match: [flux-pipeline-basics]}
      - {id: influx-flux-flux-aggregatewindow, name: "aggregateWindow and downsampling", match: [flux-aggregatewindow]}
      - {id: influx-flux-flux-joins-and-pivot, name: "Flux join and pivot", match: [flux-joins-and-pivot]}
  - id: influx-influxql
    name: "InfluxQL"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-influxql]
    subtopics:
      - {id: influx-influxql-influxql-group-by-time-fill, name: "InfluxQL GROUP BY time and fill", match: [influxql-group-by-time-fill]}
      - {id: influx-influxql-influxql-subqueries-and-cq, name: "Subqueries and continuous queries", match: [influxql-subqueries-and-cq]}
  - id: influx-tasks
    name: "InfluxDB tasks"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-tasks]
    subtopics:
      - {id: influx-tasks-influxdb-tasks-downsampling, name: "Tasks for downsampling", match: [influxdb-tasks-downsampling]}
      - {id: influx-tasks-influxdb-task-troubleshooting, name: "Task failure troubleshooting", match: [influxdb-task-troubleshooting]}
  - id: influx-telegraf
    name: "Telegraf"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-telegraf]
    subtopics:
      - {id: influx-telegraf-telegraf-inputs-outputs, name: "Telegraf inputs and outputs", match: [telegraf-inputs-outputs]}
      - {id: influx-telegraf-telegraf-processors-aggregators, name: "Processors and aggregators", match: [telegraf-processors-aggregators]}
      - {id: influx-telegraf-telegraf-buffering-batching, name: "Telegraf buffering and batching", match: [telegraf-buffering-batching]}
  - id: influx-v3
    name: "InfluxDB 3"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-v3]
    subtopics:
      - {id: influx-v3-influxdb3-sql-datafusion, name: "InfluxDB 3 SQL and DataFusion", match: [influxdb3-sql-datafusion]}
      - {id: influx-v3-influxdb3-parquet-object-storage, name: "InfluxDB 3 Parquet and object storage", match: [influxdb3-parquet-object-storage]}
      - {id: influx-v3-influxdb3-migration-from-v2, name: "Migrating from InfluxDB 2 to 3", match: [influxdb3-migration-from-v2]}
  - id: influx-auth-tokens
    name: "InfluxDB authentication"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-auth]
    subtopics:
      - {id: influx-auth-tokens-influxdb-api-tokens-orgs, name: "API tokens and organisations", match: [influxdb-api-tokens-orgs]}
      - {id: influx-auth-tokens-influxdb-tls-hardening, name: "TLS and network hardening", match: [influxdb-tls-hardening]}
  - id: influx-cardinality
    name: "InfluxDB cardinality"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-cardinality]
    subtopics:
      - {id: influx-cardinality-influxdb-series-cardinality, name: "Series cardinality diagnosis", match: [influxdb-series-cardinality]}
      - {id: influx-cardinality-influxdb-tsi-index, name: "TSI index and memory", match: [influxdb-tsi-index]}
  - id: influx-backup
    name: "InfluxDB backup and HA"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-backup]
    subtopics:
      - {id: influx-backup-influxdb-backup-restore, name: "InfluxDB backup and restore", match: [influxdb-backup-restore]}
      - {id: influx-backup-influxdb-ha-clustering, name: "InfluxDB high availability", match: [influxdb-ha-clustering]}
  - id: influx-write-perf
    name: "InfluxDB performance"
    source: "https://docs.influxdata.com/influxdb/v2/"
    match: [tsdb-influx-performance]
    subtopics:
      - {id: influx-write-perf-influxdb-write-batching-tuning, name: "Write batching and ingest tuning", match: [influxdb-write-batching-tuning]}
      - {id: influx-write-perf-influxdb-query-performance, name: "Query performance", match: [influxdb-query-performance]}
