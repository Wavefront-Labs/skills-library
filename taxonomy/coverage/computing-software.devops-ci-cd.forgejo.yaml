# Coverage spec: forgejo. Topics from the official docs table of contents.
subject: forgejo
scope:
  category: computing-software
  field: devops-ci-cd
  products: [forgejo]
sources:
  - "forgejo official docs"
topics:
  - id: actions-first-workflow-quick-start
    name: "Actions first workflow quick start"
    source: "https://forgejo.org/docs/latest/user/actions/quick-start/"
    match: [actions-quick-start, forgejo-workflows, runs-on, actions-checkout]
  - id: workflow-file-structure
    name: "Workflow file structure"
    source: "https://forgejo.org/docs/latest/user/actions/basic-concepts/"
    match: [workflow-file, on-key, jobs, steps]
  - id: workflow-expressions-and-operators
    name: "Workflow expressions and operators"
    source: "https://forgejo.org/docs/latest/user/actions/basic-concepts/"
    match: [expressions, workflow-context, logical-operators, forgejo-ref-name]
  - id: status-check-and-expression-functions
    name: "Status check and expression functions"
    source: "https://forgejo.org/docs/latest/user/actions/basic-concepts/"
    match: [success-function, always-function, hashfiles, format-function]
  - id: actions-secrets-scopes
    name: "Actions secrets scopes"
    source: "https://forgejo.org/docs/latest/user/actions/basic-concepts/"
    match: [actions-secrets, secrets-key, org-secrets, encrypted-secrets]
  - id: actions-variables-and-naming-rules
    name: "Actions variables and naming rules"
    source: "https://forgejo.org/docs/latest/user/actions/basic-concepts/"
    match: [actions-variables, vars-context, variable-names, variable-precedence]
  - id: automatic-workflow-token
    name: "Automatic workflow token"
    source: "https://forgejo.org/docs/latest/user/actions/basic-concepts/"
    match: [forgejo-token, github-token-alias, workflow-token, automatic-token]
  - id: artifacts-upload-download
    name: "Artifacts upload download"
    source: "https://forgejo.org/docs/latest/user/actions/advanced-features/"
    match: [artifacts, upload-artifact, download-artifact, artifact-retention]
  - id: actions-cache-behaviour
    name: "Actions cache behaviour"
    source: "https://forgejo.org/docs/latest/user/actions/advanced-features/"
    match: [actions-cache, cache-proxy, zstd, podman-pasta]
  - id: job-services-containers
    name: "Job services containers"
    source: "https://forgejo.org/docs/latest/user/actions/advanced-features/"
    match: [job-services, service-containers, docker-backend, container-network]
  - id: log-groups-and-job-summaries
    name: "Log groups and job summaries"
    source: "https://forgejo.org/docs/latest/user/actions/advanced-features/"
    match: [log-grouping, job-summaries, endgroup, markdown-summary]
  - id: differences-from-github-actions
    name: "Differences from github actions"
    source: "https://forgejo.org/docs/latest/user/actions/github-actions/"
    match: [github-actions-compatibility, workflow-differences, enable-openid-connect, runner-default-image]
  - id: workflow-schema-validation
    name: "Workflow schema validation"
    source: "https://forgejo.org/docs/latest/user/actions/troubleshooting/"
    match: [schema-validation, forgejo-runner-validate, validate-repository, pre-commit]
  - id: checkout-persist-credentials
    name: "Checkout persist credentials"
    source: "https://forgejo.org/docs/latest/user/actions/troubleshooting/"
    match: [persist-credentials, actions-checkout, git-credentials, extraheader]
  - id: actions-security-design-runner-selection
    name: "Actions security design runner selection"
    source: "https://forgejo.org/docs/latest/user/actions/security/"
    match: [actions-security, runner-selection, runner-pool, secret-redaction]
  - id: pull-request-token-and-pull-request-target
    name: "Pull request token and pull request target"
    source: "https://forgejo.org/docs/latest/user/actions/security/"
    match: [pull-request-target, pull-request-event, workflow-token-permissions, fork-pull-requests]
  - id: approving-fork-pull-request-workflows
    name: "Approving fork pull request workflows"
    source: "https://forgejo.org/docs/latest/user/actions/security-pull-request/"
    match: [workflow-approval, approve-once, approve-always, trust-management]
  - id: actions-enable-default-url-storage
    name: "Actions enable default url storage"
    source: "https://forgejo.org/docs/latest/admin/actions/"
    match: [actions-enabled, default-actions-url, log-retention-days, artifact-retention-days]
  - id: runner-installation-from-binary
    name: "Runner installation from binary"
    source: "https://forgejo.org/docs/latest/admin/actions/installation/binary/"
    match: [forgejo-runner-install, gpg-verify, runner-user, generate-config]
  - id: runner-podman-socket-setup
    name: "Runner podman socket setup"
    source: "https://forgejo.org/docs/latest/admin/actions/installation/binary/"
    match: [podman-socket, systemd-linger, docker-host, rootless-podman]
  - id: runner-lxc-and-host-environments
    name: "Runner lxc and host environments"
    source: "https://forgejo.org/docs/latest/admin/actions/installation/binary/"
    match: [lxc-runner, lxc-helpers, host-runner, runner-isolation]
  - id: runner-registration-interactive
    name: "Runner registration interactive"
    source: "https://forgejo.org/docs/latest/admin/actions/registration/"
    match: [runner-registration, runner-uuid-token, runner-scope, server-connections]
  - id: runner-offline-registration
    name: "Runner offline registration"
    source: "https://forgejo.org/docs/latest/admin/actions/registration/"
    match: [offline-registration, forgejo-cli-actions-register, runner-secret, ephemeral-runner]
  - id: runner-labels-docker-lxc-host
    name: "Runner labels docker lxc host"
    source: "https://forgejo.org/docs/latest/admin/actions/configuration/"
    match: [runner-labels, runs-on-label, label-types, pinned-images]
  - id: runner-special-labels-and-ipv6
    name: "Runner special labels and ipv6"
    source: "https://forgejo.org/docs/latest/admin/actions/configuration/"
    match: [special-labels, multi-label-runs-on, enable-ipv6, daemon-json]
  - id: runner-container-security-settings
    name: "Runner container security settings"
    source: "https://forgejo.org/docs/latest/admin/actions/security/"
    match: [container-privileged, container-network, valid-volumes, container-options]
  - id: docker-access-from-workflows
    name: "Docker access from workflows"
    source: "https://forgejo.org/docs/latest/admin/actions/docker-access/"
    match: [docker-in-docker, dind, docker-host-automount, docker-build]
  - id: restricting-who-can-run-workflows
    name: "Restricting who can run workflows"
    source: "https://forgejo.org/docs/latest/admin/actions/security/"
    match: [disable-registration, max-creation-limit, runner-scope, branch-protection-bypass]
  - id: release-lifecycle-and-versioning
    name: "Release lifecycle and versioning"
    source: "https://forgejo.org/docs/latest/admin/upgrade/"
    match: [release-lifecycle, lts, semantic-versioning, security-announcements]
  - id: upgrade-preparation-checklist
    name: "Upgrade preparation checklist"
    source: "https://forgejo.org/docs/latest/admin/upgrade/"
    match: [upgrade-preparation, flush-queues, custom-templates, docker-version]
  - id: upgrade-verification-and-troubleshooting
    name: "Upgrade verification and troubleshooting"
    source: "https://forgejo.org/docs/latest/admin/upgrade/"
    match: [upgrade-verification, doctor-check, debug-logging, db-version-guard]
  - id: upgrade-from-gitea-path
    name: "Upgrade from gitea path"
    source: "https://forgejo.org/docs/latest/admin/upgrade/"
    match: [gitea-migration, upgrade-from-gitea, forgejo-v10, two-step-upgrade]
  - id: upgrade-cleanup-hooks-and-pull-patches
    name: "Upgrade cleanup hooks and pull patches"
    source: "https://forgejo.org/docs/latest/admin/upgrade/"
    match: [repository-hooks-cleanup, repo-path, pulls-directory, v16-v17-cleanup]
  - id: backup-what-to-save
    name: "Backup what to save"
    source: "https://forgejo.org/docs/latest/admin/setup/backup/"
    match: [backup, forgejo-backup, secret-key, app-ini-backup]
  - id: restore-from-backup-procedure
    name: "Restore from backup procedure"
    source: "https://forgejo.org/docs/latest/admin/setup/backup/"
    match: [restore, backup-restoration, authorized-keys-cron, rebuild-indexer]
  - id: cli-dump-command
    name: "Cli dump command"
    source: "https://forgejo.org/docs/latest/admin/command-line/"
    match: [forgejo-dump, dump-zip, skip-flags, dump-type]
  - id: cli-doctor-check
    name: "Cli doctor check"
    source: "https://forgejo.org/docs/latest/admin/command-line/"
    match: [forgejo-doctor, doctor-check, doctor-fix, doctor-list]
  - id: database-supported-engines-and-choice
    name: "Database supported engines and choice"
    source: "https://forgejo.org/docs/latest/admin/installation/database-preparation/"
    match: [database-support, sqlite3, mariadb, postgresql, database-recommendation]
  - id: database-mysql-mariadb-setup
    name: "Database mysql mariadb setup"
    source: "https://forgejo.org/docs/latest/admin/installation/database-preparation/"
    match: [mysql-setup, mariadb-setup, utf8mb4-bin, charset-collation]
  - id: database-postgresql-setup
    name: "Database postgresql setup"
    source: "https://forgejo.org/docs/latest/admin/installation/database-preparation/"
    match: [postgresql-setup, pg-hba-conf, scram-sha-256, create-role]
  - id: cache-adapter-recommendation
    name: "Cache adapter recommendation"
    source: "https://forgejo.org/docs/latest/admin/setup/recommendations/"
    match: [cache-adapter, twoqueue, redis-cache, valkey]
  - id: recommended-instance-settings
    name: "Recommended instance settings"
    source: "https://forgejo.org/docs/latest/admin/setup/recommendations/"
    match: [recommended-settings, trust-model, captcha, username-cooldown]
  - id: openssh-sshd-recommendations
    name: "Openssh sshd recommendations"
    source: "https://forgejo.org/docs/latest/admin/setup/recommendations/"
    match: [sshd-config, git-protocol-v2, per-source-penalties, openssh]
  - id: ssh-authorized-keys-command
    name: "Ssh authorized keys command"
    source: "https://forgejo.org/docs/latest/admin/setup/recommendations/"
    match: [authorizedkeyscommand, authorized-keys, forgejo-keys, ssh-scaling]
  - id: reverse-proxy-nginx-basic
    name: "Reverse proxy nginx basic"
    source: "https://forgejo.org/docs/latest/admin/setup/reverse-proxy/"
    match: [nginx, reverse-proxy, merge-slashes, client-max-body-size]
  - id: reverse-proxy-subpath-and-sockets
    name: "Reverse proxy subpath and sockets"
    source: "https://forgejo.org/docs/latest/admin/setup/reverse-proxy/"
    match: [subpath, unix-socket, fastcgi, fcgi-unix]
  - id: logging-sections-and-levels
    name: "Logging sections and levels"
    source: "https://forgejo.org/docs/latest/admin/troubleshooting/logging/"
    match: [log-config, log-modes, logger-access, log-level]
  - id: logging-filters-and-flags
    name: "Logging filters and flags"
    source: "https://forgejo.org/docs/latest/admin/troubleshooting/logging/"
    match: [log-exclusion, log-expression, log-flags, healthz-logs]
  - id: email-smtp-and-sendmail
    name: "Email smtp and sendmail"
    source: "https://forgejo.org/docs/latest/admin/setup/email/"
    match: [mailer, smtp, sendmail, starttls]
  - id: storage-local-and-minio
    name: "Storage local and minio"
    source: "https://forgejo.org/docs/latest/admin/setup/storage/"
    match: [storage-subsystems, minio-storage, s3-storage, storage-path]
  - id: instance-commit-signing-keys
    name: "Instance commit signing keys"
    source: "https://forgejo.org/docs/latest/admin/advanced/signing/"
    match: [commit-signing, signing-key, ssh-signing, gpg-signing]
  - id: signing-operation-policies
    name: "Signing operation policies"
    source: "https://forgejo.org/docs/latest/admin/advanced/signing/"
    match: [signing-policies, initial-commit, crud-actions, merges-signing]
  - id: soft-quota-configuration
    name: "Soft quota configuration"
    source: "https://forgejo.org/docs/latest/admin/advanced/quota/"
    match: [soft-quota, quota-default, quota-api, quota-subjects]
  - id: moderation-and-spam-controls
    name: "Moderation and spam controls"
    source: "https://forgejo.org/docs/latest/admin/advanced/moderation/"
    match: [moderation, abuse-reports, spam-bots, user-purge]
  - id: robots-txt-and-search-engines
    name: "Robots txt and search engines"
    source: "https://forgejo.org/docs/latest/admin/advanced/search-engines/"
    match: [robots-txt, search-engine-indexing, archive-crawling, custom-public-dir]
