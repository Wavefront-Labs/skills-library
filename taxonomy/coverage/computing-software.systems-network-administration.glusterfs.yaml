# Coverage spec for GlusterFS (computing-software / systems-network-administration).
subject: GlusterFS
scope:
  category: computing-software
  field: systems-network-administration
  products: [glusterfs]
sources:
  - "GlusterFS documentation source (https://github.com/gluster/glusterdocs, rendered at https://docs.gluster.org/)"
topics:
  - id: start-stop-glusterd
    name: "Start and stop glusterd"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Start-Stop-Daemon.md
    match: ["glusterd", "systemctl", "daemon"]
  - id: peer-probe-server
    name: "Add a server with peer probe"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Storage-Pools.md
    match: ["peer-probe", "trusted-pool", "port-24007"]
  - id: peer-detach-server
    name: "Remove a server with peer detach"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Storage-Pools.md
    match: ["peer-detach", "peer-status", "pool-list"]
  - id: brick-path-naming
    name: "Brick path naming convention"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Brick-Naming-Conventions.md
    match: ["brick", "naming", "data-directory"]
  - id: brick-lvm-thin-pool
    name: "Brick LVM thin pool"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/formatting-and-mounting-bricks.md
    match: ["lvm", "thin-pool", "pvcreate"]
  - id: brick-xfs-format-mount
    name: "Format and mount a brick with XFS"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/formatting-and-mounting-bricks.md
    match: ["xfs", "mkfs", "fstab"]
  - id: posix-acls
    name: "POSIX ACLs on GlusterFS"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Access-Control-Lists.md
    match: ["acl", "setfacl", "getfacl"]
  - id: create-distributed-volume
    name: "Create a distributed volume"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Volumes.md
    match: ["distributed", "volume-create", "transport"]
  - id: create-replicated-volume
    name: "Create a replicated volume"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Volumes.md
    match: ["replicated", "replica", "force"]
  - id: create-arbiter-volume
    name: "Create an arbiter volume"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/arbiter-volumes-and-quorum.md
    match: ["arbiter", "volume-create", "replica"]
  - id: create-distributed-replicated-volume
    name: "Create a distributed replicated volume"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Volumes.md
    match: ["distributed-replicated", "brick-order", "replica-set"]
  - id: create-dispersed-volume
    name: "Create a dispersed volume"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Volumes.md
    match: ["dispersed", "erasure-coding", "redundancy"]
  - id: start-volume-verify
    name: "Start a volume and check it"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Volumes.md
    match: ["volume-start", "volume-info", "mount-hang"]
  - id: mount-fuse-client
    name: "Mount with the native FUSE client"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Clients.md
    match: ["fuse", "native-client", "backupvolfile-server"]
  - id: fstab-automount
    name: "Automount in fstab"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Clients.md
    match: ["fstab", "netdev", "automount"]
  - id: firewall-ports
    name: "Firewall ports for servers"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Clients.md
    match: ["firewall", "ports", "49152"]
  - id: mount-nfsv3
    name: "Mount over NFSv3"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Setting-Up-Clients.md
    match: ["nfsv3", "mountproto", "nfs-client"]
  - id: expand-volume-add-brick
    name: "Expand a volume with add-brick"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Volumes.md
    match: ["add-brick", "expand", "volume-expand"]
  - id: shrink-volume-remove-brick
    name: "Shrink a volume with remove-brick"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Volumes.md
    match: ["remove-brick", "shrink", "commit"]
  - id: replace-brick-replicated
    name: "Replace a brick in a replicated volume"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Volumes.md
    match: ["replace-brick", "commit-force", "brick-replacement"]
  - id: rebalance-volume
    name: "Rebalance a volume"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Volumes.md
    match: ["rebalance", "fix-layout", "rebalance-status"]
  - id: self-heal-commands
    name: "Self-heal commands"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Volumes.md
    match: ["self-heal", "heal-info", "shd"]
  - id: geo-rep-prerequisites
    name: "Geo-replication prerequisites"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Geo-Replication.md
    match: ["geo-replication", "prerequisites", "meta-volume"]
  - id: geo-rep-mountbroker-setup
    name: "Geo-replication mountbroker setup"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Geo-Replication.md
    match: ["mountbroker", "gluster-mountbroker", "unprivileged"]
  - id: geo-rep-create-session
    name: "Create a geo-replication session"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Geo-Replication.md
    match: ["push-pem", "no-verify", "ssh-port"]
  - id: geo-rep-lifecycle-commands
    name: "Geo-replication start, stop, pause, resume, delete"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Geo-Replication.md
    match: ["lifecycle", "reset-sync-time", "geo-rep-lifecycle-commands"]
  - id: geo-rep-config-options
    name: "Geo-replication config options"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Geo-Replication.md
    match: ["sync-jobs", "rsync-command", "use-tarssh"]
  - id: geo-rep-snapshot-coordination
