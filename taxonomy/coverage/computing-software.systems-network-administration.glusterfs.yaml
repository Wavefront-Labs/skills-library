    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Snapshots.md
    match: ["uss", "snaps-directory", "samba"]
  - id: trash-translator
    name: "Trash translator"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Trash.md
    match: ["trash", "trashcan", "trash-max-filesize"]
  - id: io-uring-bricks
    name: "io_uring on bricks"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/io_uring.md
    match: ["io-uring", "linux-io-uring", "posix"]
  - id: split-brain-detect
    name: "Detect split-brain"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Troubleshooting/resolving-splitbrain.md
