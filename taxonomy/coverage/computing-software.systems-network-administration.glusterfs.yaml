    match: ["faulty", "eoferror", "rsync"]
  - id: quota-enable-limit-usage
    name: "Enable quota and set limits"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Directory-Quota.md
    match: ["limit-usage", "hard-limit", "quota-list"]
  - id: quota-timeouts-alert
    name: "Quota timeouts and alert time"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Directory-Quota.md
    match: ["soft-timeout", "hard-timeout", "alert-time"]
  - id: snapshot-create-manage
    name: "Create and manage snapshots"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Snapshots.md
    match: ["snapshot-create", "thin-lvm", "snapshot"]
  - id: snapshot-config-limits
    name: "Snapshot config and limits"
    source: https://raw.githubusercontent.com/gluster/glusterdocs/master/docs/Administrator-Guide/Managing-Snapshots.md
    match: ["snap-max-hard-limit", "auto-delete", "activate-on-create"]
  - id: user-serviceable-snapshots
