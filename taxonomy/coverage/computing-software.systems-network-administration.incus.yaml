# Coverage spec for Incus (computing-software / systems-network-administration).
subject: Incus
scope:
  category: computing-software
  field: systems-network-administration
  products: [incus]
sources:
  - "Incus documentation (https://github.com/lxc/incus/tree/main/doc)"
topics:
  - id: install-packages
    name: "Install from packages"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/installing.md
    match: ["install", "packages", "apt", "dnf", "pacman", "zabbly"]
  - id: install-source
    name: "Build from source"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/installing.md
    match: ["source-build", "make", "incusd"]
  - id: install-access
    name: "Admin group and subuid"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/installing.md
    match: ["incus-admin", "subuid", "subgid"]
  - id: install-client
    name: "macOS and Windows clients"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/installing.md
    match: ["macos", "windows", "homebrew", "colima"]
  - id: server-init
    name: "Server initialisation"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/initialize.md
    match: ["admin-init", "preseed", "minimal"]
  - id: remotes
    name: "Remote servers"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/remotes.md
    match: ["remote", "default-remote", "keepalive", "client-certificate"]
  - id: client-config
    name: "Client configuration"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/client-config.md
    match: ["client", "config-yml", "incus-conf", "list-format"]
  - id: instance-create
    name: "Create instances"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_create.md
    match: ["launch", "init", "container", "virtual-machine", "oci"]
  - id: instance-iso-agent
    name: "ISO installs and the agent"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_create.md
    match: ["iso", "agent", "empty-instance"]
  - id: instance-config
    name: "Instance options and devices"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_configure.md
    match: ["config-set", "instance-options", "devices", "hotplug", "properties"]
  - id: instance-manage
    name: "Instance lifecycle"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_manage.md
    match: ["list", "info", "start", "stop", "delete", "rebuild", "protection"]
  - id: instance-files
    name: "Instance files"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_access_files.md
    match: ["file", "push", "pull", "sshfs", "file-mount"]
  - id: instance-exec
    name: "Run commands"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/instance-exec.md
    match: ["exec", "interactive", "non-interactive", "environment"]
  - id: instance-console
    name: "Instance console"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_console.md
    match: ["console", "vga", "spice"]
  - id: instance-snapshots
    name: "Instance snapshots"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_backup.md
    match: ["snapshot", "restore", "stateful", "snapshots-schedule"]
  - id: instance-backup-export
    name: "Instance export and import"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/instances_backup.md
    match: ["export", "import", "backup", "instance-only"]
  - id: instance-move-copy
    name: "Move and copy instances"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/move_instances.md
    match: ["move", "copy", "transfer-mode", "target"]
  - id: live-migration
    name: "Live migration"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/move_instances.md
    match: ["live-migration", "migration-stateful", "criu"]
  - id: cloud-init
    name: "cloud-init data"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/cloud-init.md
    match: ["cloud-init", "user-data", "vendor-data", "cloud-images"]
  - id: cloud-init-network
    name: "cloud-init networking"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/cloud-init.md
    match: ["network-config", "netplan", "static-ip"]
  - id: profiles
    name: "Profiles"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/profiles.md
    match: ["profile", "default-profile", "precedence"]
  - id: projects-create
    name: "Create projects"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/projects_create.md
    match: ["project", "features-images", "features-profiles", "restricted"]
  - id: projects-work
    name: "Work with projects"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/projects_work.md
    match: ["switch", "target-project", "root-device"]
  - id: projects-confine
    name: "Confine clients to projects"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/projects_confine.md
    match: ["trust", "confinement", "incus-group"]
  - id: image-remotes
    name: "Image remotes"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/images_remote.md
    match: ["simplestreams", "docker-hub", "fingerprint", "oci"]
  - id: image-manage
    name: "Manage images"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/images_manage.md
    match: ["image-list", "image-info", "image-delete", "image-edit"]
  - id: image-aliases
    name: "Image aliases and export"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/images_manage.md
    match: ["alias", "image-export", "air-gapped"]
  - id: image-publish
    name: "Publish images"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/images_create.md
    match: ["publish", "distrobuilder", "templates"]
  - id: image-copy
    name: "Copy images"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/images_copy.md
    match: ["image-copy", "auto-update", "copy-aliases"]
  - id: image-import
    name: "Import images"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/images_copy.md
    match: ["image-import", "unified-image", "split-image", "incus-image-hash"]
  - id: storage-pools
    name: "Storage pools"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/storage_pools.md
    match: ["storage-pool", "loop-backed", "resize", "create"]
  - id: storage-volumes
    name: "Storage volumes"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/storage_volumes.md
    match: ["storage-volume", "custom-volume", "content-type", "volume-set"]
  - id: storage-buckets
    name: "Storage buckets"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/storage_buckets.md
    match: ["storage-bucket", "s3", "bucket-keys", "object-storage"]
  - id: storage-volume-backup
    name: "Volume snapshots and export"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/storage_backup_volume.md
    match: ["volume-snapshot", "optimized-storage", "compression", "volume-only"]
  - id: storage-drivers
    name: "Storage driver comparison"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/reference/storage_drivers.md
    match: ["drivers", "comparison", "ceph", "linstor", "truenas", "dir"]
  - id: storage-zfs
    name: "ZFS driver"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/reference/storage_zfs.md
    match: ["zfs", "refquota", "zfs-delegate", "zpool"]
  - id: storage-btrfs
    name: "Btrfs driver"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/reference/storage_btrfs.md
    match: ["btrfs", "subvolume", "qgroups"]
  - id: storage-lvm
    name: "LVM driver"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/reference/storage_lvm.md
    match: ["lvm", "thin-pool", "lvmcluster", "sanlock"]
  - id: network-create
    name: "Create networks"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/network_create.md
    match: ["network", "network-create", "bridge", "macvlan", "sriov", "physical", "nic"]
  - id: network-forwards
    name: "Network forwards"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/network_forwards.md
    match: ["network-forward", "port-forward", "snat"]
  - id: network-load-balancers
    name: "Network load balancers"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/network_load_balancers.md
    match: ["load-balancer", "backend", "ovn"]
  - id: network-acls
    name: "Network ACL rules"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/network_acls.md
    match: ["network-acl", "firewall", "ingress", "egress", "address-sets"]
  - id: network-acl-assignment
    name: "ACL assignment and defaults"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/network_acls.md
    match: ["security-acls", "default-action", "logging", "bridge-limitations"]
  - id: network-zones
    name: "Network zones and DNS"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/network_zones.md
    match: ["network-zone", "dns", "axfr", "tsig", "dns-record", "ttl"]
  - id: cluster-form
    name: "Form a cluster"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/cluster_form.md
    match: ["cluster", "bootstrap", "join-token", "preseed", "cluster-add"]
  - id: cluster-manage
    name: "Manage cluster members"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/cluster_manage.md
    match: ["members", "cluster-set", "roles", "event-hub", "max-voters"]
  - id: cluster-evacuation
    name: "Cluster evacuation and healing"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/cluster_manage.md
    match: ["evacuate", "healing", "rebalance", "maintenance"]
  - id: cluster-lifecycle
    name: "Cluster removal, upgrade, certificate"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/howto/cluster_manage.md
    match: ["remove", "force", "upgrade", "blocked", "cluster-certificate"]
  - id: auth-tls
    name: "TLS client trust"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/authentication.md
    match: ["authentication", "tls", "trust-token", "jwt", "encrypted-key"]
  - id: auth-pki
    name: "PKI mode"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/authentication.md
    match: ["pki", "ca", "crl", "trust-ca-certificates"]
  - id: auth-oidc-acme
    name: "OIDC and ACME"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/authentication.md
    match: ["oidc", "acme", "device-authorization", "http-01", "dns-01"]
  - id: authorization
    name: "Authorization and client routing"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/authorization.md
    match: ["authorization", "openfga", "scriptlet", "client-routing", "tls-restricted"]
  - id: metrics
    name: "Metrics and Prometheus"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/metrics.md
    match: ["metrics", "prometheus", "grafana", "loki", "metrics-certificate"]
  - id: rest-api
    name: "REST API"
    source: https://raw.githubusercontent.com/lxc/incus/main/doc/rest-api.md
    match: ["rest-api", "async-operations", "status-codes", "etag", "incus-query"]
