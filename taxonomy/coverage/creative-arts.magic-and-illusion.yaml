# Canonical coverage spec: magic and illusion (all products in the magic-and-illusion field).
# Checked by tools/coverage_check.py. A topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from the standard instructional canon and society curricula listed in
# `sources` (Royal Road chapter list, Tarbell lesson list, Bobo chapters, Fitzkee trilogy, Ortiz,
# Corinda's thirteen steps, Magic Circle / IBM / SAM education material), not from the library.
subject: magic-and-illusion
scope:
  category: creative-arts
  field: magic-and-illusion
  products: [sleight-of-hand, close-up-magic, stage-illusion, mentalism, escapology, magic-performance-and-scripting]
sources:
  - "Hugard and Braue, The Royal Road to Card Magic (1948) - lesson/chapter list (overhand shuffle, riffle shuffle, glide, palm, force, double lift, pass, card control, flourishes)"
  - "Harlan Tarbell, The Tarbell Course in Magic vols 1-8 - lesson list (coins, cards, silks, ropes, cups and balls, mentalism, illusions, stage presentation)"
  - "J.B. Bobo, Modern Coin Magic (1952) - chapters (basic sleights, vanishes, productions, coins across, routines)"
  - "Darwin Ortiz, Strong Magic (1994) and Designing Miracles (2006) - clarity, conviction, interest, magic feeling, method design"
  - "Dariel Fitzkee, Showmanship for Magicians, The Trick Brain, Magic by Misdirection - effect categories and misdirection taxonomy"
  - "Tony Corinda, Thirteen Steps to Mentalism - step list (pencil reading, billets, predictions, book tests, codes, mediumship, publicity)"
  - "Jim Steinmeyer, Hiding the Elephant; Tarbell vol 3-6 illusion lessons - illusion principles, black art, mirrors, Pepper's ghost"
  - "The Magic Circle (https://themagiccircle.co.uk) and International Brotherhood of Magicians (https://www.magician.org) education and code of ethics; Society of American Magicians code"
  - "Harry Houdini Handcuff Secrets; Escapology literature (Brema, Dean); ESTA/HSE stunt safety guidance"
