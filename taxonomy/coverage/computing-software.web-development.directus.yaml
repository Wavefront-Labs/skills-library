# Coverage spec: directus. Topics from the Directus docs (raw markdown, github.com/directus/docs, content/).
subject: directus
scope:
  category: computing-software
  field: web-development
  products: [directus]
sources:
  - "Directus docs (github.com/directus/docs/tree/main/content)"
topics:
  - id: docker-quickstart
    name: "Run Directus with docker run"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/2.create-a-project.md"
    match: [docker-quickstart, docker-run, onboarding]
  - id: docker-compose-sqlite
    name: "Docker Compose with SQLite"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/2.create-a-project.md"
    match: [docker-compose, sqlite-setup, secret]
  - id: rest-fetch-items
    name: "REST: fetch items"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/4.use-the-api.md"
    match: [rest-fetch-items, items-endpoint, default-limit]
  - id: rest-create-item
    name: "REST: create an item"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/4.use-the-api.md"
    match: [rest-create-item, post-items, json-payload]
  - id: user-registration
    name: "Public user registration"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/5.authenticate-user.md"
    match: [user-registration, public-registration, register-endpoint]
  - id: login-bearer
    name: "Login and bearer requests"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/5.authenticate-user.md"
    match: [auth-login, bearer-token, access-token]
  - id: asset-url
    name: "File URLs and importing files"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/6.upload-files.md"
    match: [asset-url, import-file-url, assets-endpoint]
  - id: realtime-connect
    name: "Connect to realtime with the SDK"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/8.connect-to-realtime.md"
    match: [realtime-connect, websockets-enabled, sdk-realtime]
  - id: realtime-subscribe
    name: "Subscribe and send over realtime"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/getting-started/8.connect-to-realtime.md"
    match: [realtime-subscribe, subscribe-event, send-message]
  - id: collection-create
    name: "Create collections and primary keys"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/01.data-model/1.collections.md"
    match: [collection-create, primary-key-type, immutable-names]
  - id: collection-archive
    name: "Archive, manual sort and singletons"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/01.data-model/1.collections.md"
    match: [collection-archive, manual-sort, singleton]
  - id: existing-database
    name: "Introspect an existing database"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/01.data-model/1.collections.md"
    match: [existing-database, introspection, composite-keys]
  - id: field-types
    name: "Field types and creation"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/01.data-model/2.fields.md"
    match: [field-types, field-create, alias-fields]
  - id: field-validation
    name: "Field validation and conditions"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/01.data-model/2.fields.md"
    match: [field-validation, field-conditions, conditional-fields]
  - id: relationship-m2o
    name: "Many-to-one and one-to-many relations"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/01.data-model/5.relationships.md"
    match: [relationship-m2o, relationship-o2m, alias-relation-field]
  - id: relationship-m2m
    name: "Many-to-many and many-to-any relations"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/01.data-model/5.relationships.md"
    match: [relationship-m2m, relationship-m2a, junction-collection]
  - id: token-types
    name: "Token types"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/1.tokens-cookies.md"
    match: [token-types, static-token, session-token]
  - id: policies-roles
    name: "Policies, roles and the public role"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/2.access-control.md"
    match: [policies-roles, public-role, user-status]
  - id: permissions
    name: "Custom permission rules"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/2.access-control.md"
    match: [permissions, custom-permissions, field-presets]
  - id: ip-allowlist
    name: "IP allow list and policy combining"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/2.access-control.md"
    match: [ip-allowlist, policy-combining, additive-permissions]
  - id: token-refresh
    name: "Token refresh and logout"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/4.email-login.md"
    match: [token-refresh, auth-logout, session-cookie-login]
  - id: password-reset
    name: "Password reset flow"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/4.email-login.md"
    match: [password-reset, reset-url, seamless-reset]
  - id: two-factor-auth
    name: "Two-factor authentication"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/5.2fa.md"
    match: [two-factor-auth, tfa-generate, require-2fa]
  - id: seamless-sso
    name: "Seamless SSO with cookies"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/03.auth/7.sso/2.seamless.md"
    match: [seamless-sso, session-cookie-domain, redirect-allow-list]
  - id: filter-rules
    name: "Filter rules and operators"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/2.filter-rules.md"
    match: [filter-rules, filter-operators, logical-operators]
  - id: relational-filter
    name: "Relational filters and dynamic variables"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/2.filter-rules.md"
    match: [relational-filter, dynamic-variables, some-none]
  - id: query-fields
    name: "Query: fields and wildcards"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/3.query-parameters.md"
    match: [query-fields, wildcards, api-search]
  - id: query-sort
    name: "Query: sort, limit, pagination"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/3.query-parameters.md"
    match: [query-sort, query-limit, pagination]
  - id: query-aggregate
    name: "Query: aggregate and group by"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/3.query-parameters.md"
    match: [query-aggregate, group-by, aggregate-functions]
  - id: query-deep
    name: "Query: deep and alias"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/3.query-parameters.md"
    match: [query-deep, query-alias, nested-query]
  - id: query-export
    name: "Query: export, version, backlink"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/3.query-parameters.md"
    match: [query-export, query-version, backlink-parameter]
  - id: api-errors
    name: "API error handling"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/5.errors.md"
    match: [api-errors, error-codes, token-expired]
  - id: sdk-composables
    name: "SDK client and composables"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/6.sdk.md"
    match: [sdk-composables, directus-sdk, sdk-custom-endpoint]
  - id: sdk-login-options
    name: "SDK login options and SSO"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/04.connect/6.sdk.md"
    match: [sdk-login-options, sdk-ldap-login, sdk-sso-login]
  - id: file-upload
    name: "Upload files through the API"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/05.files/1.upload.md"
    match: [file-upload, multipart-upload, storage-location]
  - id: image-transform
    name: "Image transform parameters"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/05.files/5.transform.md"
    match: [image-transform, asset-query-params, focal-point]
  - id: transform-presets
    name: "Transformation presets"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/05.files/5.transform.md"
    match: [transform-presets, sharp-transforms, transformation-keys]
  - id: data-chain
    name: "Flow data chain"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/06.flows/2.data-chain.md"
    match: [data-chain, flow-variables, trigger-accountability]
  - id: flow-event-hook
    name: "Flow event hook trigger"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/06.flows/3.triggers.md"
    match: [flow-event-hook, filter-blocking, action-non-blocking]
  - id: flow-webhook
    name: "Flow webhook, schedule and manual triggers"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/06.flows/3.triggers.md"
    match: [flow-webhook, flow-schedule-cron, flow-manual-trigger]
  - id: flow-condition
    name: "Flow condition and script operations"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/06.flows/4.operations.md"
    match: [flow-condition, run-script, flow-operations]
  - id: flow-create-data
    name: "Flow data operations"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/06.flows/4.operations.md"
    match: [flow-create-data, flow-read-data, flow-update-data]
  - id: realtime-auth-modes
    name: "Realtime authentication modes"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/07.realtime/1.authentication.md"
    match: [realtime-auth-modes, handshake-mode, strict-mode]
  - id: websocket-subscribe
    name: "WebSocket subscriptions"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/07.realtime/2.subscriptions.md"
    match: [websocket-subscribe, subscription-uid, subscription-fields]
  - id: extension-hooks
    name: "Extension hooks"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/09.extensions/2.api-extensions/1.hooks.md"
    match: [extension-hooks, hook-filter, hook-action]
  - id: extension-endpoints
    name: "Extension endpoints"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/09.extensions/2.api-extensions/2.endpoints.md"
    match: [extension-endpoints, custom-routes, express-router]
  - id: extension-sandbox
    name: "Sandboxed extensions and scopes"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/09.extensions/2.api-extensions/5.sandbox.md"
    match: [extension-sandbox, requested-scopes, sandbox-request]
  - id: extension-bundles
    name: "Extension bundles"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/09.extensions/4.bundles.md"
    match: [extension-bundles, bundle-entries, bundle-partial]
  - id: extension-scaffold
    name: "Extension CLI: scaffold, build, validate"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/09.extensions/6.cli.md"
    match: [extension-scaffold, extension-build, extension-validate]
  - id: env-sync-cli
    name: "Environment Sync CLI profiles"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/10.environment-sync/1.quickstart.md"
    match: [env-sync-cli, d6s-profile, credential-store]
  - id: env-sync-pull
    name: "Environment Sync pull, diff, push"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/10.environment-sync/1.quickstart.md"
    match: [env-sync-pull, env-sync-diff, env-sync-push]
  - id: security-system-collections
    name: "Protect system collections"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/14.security/1.best-practices.md"
    match: [security-system-collections, privilege-escalation, flows-hardening]
  - id: public-role-audit
    name: "Audit the public role"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/guides/14.security/1.best-practices.md"
    match: [public-role-audit, public-file-folder, unauthenticated-test]
  - id: config-path
    name: "Configuration files and .env"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/configuration/0.intro.md"
    match: [config-path, config-file-formats, docker-secrets]
  - id: env-type-casting
    name: "Environment variable type casting"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/configuration/0.intro.md"
    match: [env-type-casting, syntax-prefix, double-underscore-nesting]
  - id: database-config
    name: "Database connection settings"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/configuration/database.md"
    match: [database-config, db-client, db-ssl-ca]
  - id: cache-config
    name: "Data cache configuration"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/configuration/cache.md"
