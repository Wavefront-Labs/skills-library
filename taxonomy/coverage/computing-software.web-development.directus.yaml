  - id: version-pinning
    name: "Version pinning and upgrades"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/self-hosting/4.upgrading.md"
    match: [version-pinning, upgrade-directus, breaking-changes]
  - id: self-host-requirements
    name: "Self-hosting requirements"
    source: "https://raw.githubusercontent.com/directus/docs/main/content/self-hosting/2.requirements.md"
