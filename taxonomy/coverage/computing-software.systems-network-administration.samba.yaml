# Coverage spec for Samba (computing-software / systems-network-administration).
subject: Samba
scope:
  category: computing-software
  field: systems-network-administration
  products: [samba]
sources:
  - "Samba man pages (https://www.samba.org/samba/docs/current/man-html/)"
  - "Samba wiki, Setting up Samba as an AD DC (https://wiki.samba.org/index.php/Setting_up_Samba_as_an_Active_Directory_Domain_Controller)"
  - "Samba wiki, Setting up Samba as a Domain Member (https://wiki.samba.org/index.php/Setting_up_Samba_as_a_Domain_Member)"
  - "Samba wiki, Setting up a Share Using Windows ACLs (https://wiki.samba.org/index.php/Setting_up_a_Share_Using_Windows_ACLs)"
  - "Samba wiki, Setting up a Share Using POSIX ACLs (https://wiki.samba.org/index.php/Setting_up_a_Share_Using_POSIX_ACLs)"
  - "Samba wiki, Setting up Samba as a Standalone Server (https://wiki.samba.org/index.php/Setting_up_Samba_as_a_Standalone_Server)"
