      - {id: js-error-logging-serialization, name: "Error chaining logging and serialization", match: [error-serialization]}
  - id: js-packages
    name: "Package exports and publishing"
    source: "Node.js package docs; npm docs"
    match: [exports-field]
    subtopics:
      - {id: js-conditional-exports-dual, name: "Conditional exports and dual ESM/CJS packages", match: [conditional-exports]}
      - {id: js-npm-publish-provenance, name: "Publishing to npm safely", match: [npm-provenance]}
  - id: js-ts-interop
    name: "JSDoc types and migrating to TypeScript"
    source: "TypeScript handbook"
    match: [js-to-ts-migration]
    subtopics:
      - {id: js-jsdoc-typecheck, name: "JSDoc types with checkJs", match: [jsdoc-typecheck]}
      - {id: js-incremental-ts-migration, name: "Incremental TypeScript migration steps", match: [allowjs-migration]}
