    match: [async-iterators]
    subtopics:
      - {id: js-async-generators, name: "Async generators", match: [async-generator]}
      - {id: js-for-await-concurrency, name: "for await with concurrency control", match: [for-await-pattern]}
  - id: js-error-cause
    name: "Error cause and AggregateError"
    source: "ECMA-262 Error objects"
    match: [error-cause]
    subtopics:
