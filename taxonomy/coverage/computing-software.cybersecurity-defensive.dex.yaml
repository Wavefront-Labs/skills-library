    name: "Dex signer vault openbao"
    source: "https://dexidp.io/docs/configuration/tokens/"
    match: [signer, vault, openbao]
  - id: dex-supported-scopes
    name: "Dex supported scopes"
    source: "https://dexidp.io/docs/configuration/custom-scopes-claims-clients/"
    match: [scopes, openid, groups]
  - id: dex-custom-claims-and-federated-claims
    name: "Dex custom claims and federated claims"
    source: "https://dexidp.io/docs/configuration/custom-scopes-claims-clients/"
    match: [claims, federated-claims, groups]
  - id: dex-cross-client-trust-trustedpeers
    name: "Dex cross client trust trustedpeers"
    source: "https://dexidp.io/docs/configuration/custom-scopes-claims-clients/"
