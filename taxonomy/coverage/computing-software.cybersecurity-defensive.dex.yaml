# Coverage spec: dex. Topics from the official docs in sources.
subject: dex
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [dex]
sources:
  - "https://dexidp.io/docs/"
topics:
  - id: dex-install-container-or-binary
    name: "Dex install container or binary"
    source: "https://dexidp.io/docs/getting-started/"
    match: [install, container, binary]
  - id: dex-config-env-expansion-and-gomplate
    name: "Dex config env expansion and gomplate"
    source: "https://dexidp.io/docs/getting-started/"
    match: [configuration, environment, gomplate]
  - id: dex-example-app-test-login
    name: "Dex example app test login"
    source: "https://dexidp.io/docs/getting-started/"
    match: [example-app, testing, login]
  - id: dex-id-token-structure-and-consumers
    name: "Dex id token structure and consumers"
    source: "https://dexidp.io/docs/configuration/tokens/"
    match: [id-token, jwt, claims]
  - id: dex-refresh-tokens-and-rotation
    name: "Dex refresh tokens and rotation"
    source: "https://dexidp.io/docs/configuration/tokens/"
    match: [refresh-tokens, offline-access, rotation]
  - id: dex-expiry-and-rotation-settings
    name: "Dex expiry and rotation settings"
    source: "https://dexidp.io/docs/configuration/tokens/"
    match: [expiry, id-tokens, refresh-tokens]
