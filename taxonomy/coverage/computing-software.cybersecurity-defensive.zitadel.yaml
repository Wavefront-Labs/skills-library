# Coverage spec: zitadel. Topics from the official docs in sources.
subject: zitadel
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [zitadel]
sources:
  - "https://zitadel.com/docs"
topics:
  - id: account-linking-and-idp-redirect
    name: "Account linking and idp redirect"
    source: "https://zitadel.com/docs/concepts/features/account-linking"
    match: [account-linking, identity-providers, login]
  - id: actions-v1-role-on-external-registration
    name: "Actions v1 role on external registration"
    source: "https://zitadel.com/docs/guides/manage/customize/behavior"
    match: [actions, external-authentication, post-creation]
  - id: actions-v2-targets-and-executions
    name: "Actions v2 targets and executions"
    source: "https://zitadel.com/docs/concepts/features/actions_v2"
    match: [actions, webhooks, targets]
  - id: administrator-hardening-dedicated-organization
    name: "Administrator hardening dedicated organization"
    source: "https://zitadel.com/docs/guides/manage/console/administrator-hardening"
    match: [hardening, administrators, break-glass]
  - id: administrator-roles-and-scopes
    name: "Administrator roles and scopes"
    source: "https://zitadel.com/docs/guides/manage/console/administrators,"
    match: [administrators, iam-owner, org-owner]
  - id: audit-trail-and-event-viewer
    name: "Audit trail and event viewer"
    source: "https://zitadel.com/docs/concepts/features/audit-trail"
    match: [audit-log, eventstore, events]
  - id: branding-and-private-labeling
    name: "Branding and private labeling"
    source: "https://zitadel.com/docs/guides/manage/customize/branding,"
    match: [branding, private-labeling, login-ui]
  - id: client-authentication-methods
    name: "Client authentication methods"
    source: "https://zitadel.com/docs/apis/openidoauth/authn-methods"
    match: [client-authentication, client-secret-basic, private-key-jwt]
  - id: configuration-files-and-environment
    name: "Configuration files and environment"
    source: "https://zitadel.com/docs/self-hosting/manage/configure/configure,"
    match: [configuration, defaults-yaml, steps-yaml]
  - id: custom-texts-and-languages
    name: "Custom texts and languages"
    source: "https://zitadel.com/docs/guides/manage/customize/texts,"
    match: [i18n, message-texts, login-texts]
  - id: default-redirect-uri
    name: "Default redirect uri"
    source: "https://zitadel.com/docs/guides/manage/console/default-settings"
    match: [redirect-uri, login, console]
  - id: external-domain-and-instance-not-found
    name: "External domain and instance not found"
    source: "https://zitadel.com/docs/self-hosting/manage/custom-domain"
    match: [external-domain, custom-domain, host-header]
  - id: helm-chart-configuration-and-ingress
    name: "Helm chart configuration and ingress"
    source: "https://zitadel.com/docs/self-hosting/deploy/kubernetes/configuration,"
    match: [kubernetes, helm, ingress]
  - id: helm-database-tls-and-operations
    name: "Helm database tls and operations"
    source: "https://zitadel.com/docs/self-hosting/deploy/kubernetes/database,"
    match: [kubernetes, helm, postgresql]
  - id: http-webhook-notification-provider
    name: "Http webhook notification provider"
    source: "https://zitadel.com/docs/guides/manage/customize/notification-providers"
    match: [webhook, notifications, sms]
  - id: identity-brokering-and-sso
    name: "Identity brokering and sso"
    source: "https://zitadel.com/docs/concepts/features/identity-brokering"
    match: [identity-brokering, federation, oidc]
  - id: init-setup-start-phases
    name: "Init setup start phases"
    source: "https://zitadel.com/docs/self-hosting/manage/updating_scaling,"
    match: [self-hosting, init, setup]
  - id: instance-and-virtual-instances
    name: "Instance and virtual instances"
    source: "https://zitadel.com/docs/concepts/structure/instance"
    match: [instance, virtual-instances, multi-tenancy]
  - id: instance-feature-restrictions
    name: "Instance feature restrictions"
    source: "https://zitadel.com/docs/guides/manage/customize/restrictions"
    match: [restrictions, instance, registration]
  - id: jwks-key-rotation-and-caching
    name: "Jwks key rotation and caching"
    source: "https://zitadel.com/docs/apis/openidoauth/endpoints"
    match: [jwks, signing-keys, key-rotation]
  - id: login-client-service-account
    name: "Login client service account"
    source: "https://zitadel.com/docs/self-hosting/manage/login-client"
    match: [login-v2, service-account, pat]
  - id: login-policy-settings
    name: "Login policy settings"
    source: "https://zitadel.com/docs/guides/manage/console/default-settings"
    match: [login-policy, registration, domain-discovery]
  - id: metrics-and-health-endpoints
    name: "Metrics and health endpoints"
    source: "https://zitadel.com/docs/self-hosting/manage/metrics/overview,"
    match: [metrics, prometheus, opentelemetry]
  - id: multifactor-options-and-force-mfa
    name: "Multifactor options and force mfa"
    source: "https://zitadel.com/docs/guides/manage/console/default-settings"
    match: [mfa, totp, u2f]
  - id: oidc-claims-by-token-type
    name: "Oidc claims by token type"
    source: "https://zitadel.com/docs/apis/openidoauth/claims,"
    match: [oidc, claims, id-token]
  - id: oidc-endpoints-and-discovery
    name: "Oidc endpoints and discovery"
    source: "https://zitadel.com/docs/apis/openidoauth/endpoints"
    match: [oidc, endpoints, discovery]
  - id: oidc-grant-types-supported
    name: "Oidc grant types supported"
    source: "https://zitadel.com/docs/apis/openidoauth/grant-types"
    match: [oauth, grant-types, pkce]
  - id: oidc-reserved-scopes
    name: "Oidc reserved scopes"
    source: "https://zitadel.com/docs/apis/openidoauth/scopes"
    match: [oidc, scopes, audience]
  - id: opaque-versus-jwt-access-tokens
    name: "Opaque versus jwt access tokens"
    source: "https://zitadel.com/docs/concepts/knowledge/opaque-tokens,"
    match: [opaque-tokens, jwt, access-token]
  - id: organizations-and-multi-tenancy
    name: "Organizations and multi tenancy"
    source: "https://zitadel.com/docs/guides/manage/console/organizations-overview"
    match: [organizations, multi-tenancy, registration]
  - id: passkeys-and-domain-binding
    name: "Passkeys and domain binding"
    source: "https://zitadel.com/docs/concepts/features/passkeys,"
    match: [passkeys, webauthn, fido2]
  - id: password-complexity-expiry-lockout
    name: "Password complexity expiry lockout"
    source: "https://zitadel.com/docs/guides/manage/console/default-settings"
    match: [password-policy, lockout, expiry]
  - id: password-hashing-and-verifiers
    name: "Password hashing and verifiers"
    source: "https://zitadel.com/docs/concepts/architecture/secrets"
    match: [password-hashing, bcrypt, argon2]
  - id: postgres-connection-and-managed-databases
    name: "Postgres connection and managed databases"
    source: "https://zitadel.com/docs/self-hosting/manage/database,"
    match: [postgresql, database, dsn]
  - id: production-checklist
    name: "Production checklist"
    source: "https://zitadel.com/docs/self-hosting/manage/productionchecklist"
    match: [production, checklist, high-availability]
  - id: project-grants-and-delegated-roles
    name: "Project grants and delegated roles"
    source: "https://zitadel.com/docs/concepts/structure/granted_projects,"
    match: [project-grants, delegation, b2b]
  - id: projects-applications-and-roles
    name: "Projects applications and roles"
    source: "https://zitadel.com/docs/guides/manage/console/projects-overview,"
    match: [projects, applications, roles]
  - id: redis-cache-configuration
    name: "Redis cache configuration"
    source: "https://zitadel.com/docs/self-hosting/manage/cache,"
    match: [cache, redis, performance]
  - id: refresh-revocation-and-logout
    name: "Refresh revocation and logout"
    source: "https://zitadel.com/docs/apis/openidoauth/endpoints"
    match: [refresh-token, revocation, end-session]
  - id: reverse-proxy-and-login-ui-routing
    name: "Reverse proxy and login ui routing"
    source: "https://zitadel.com/docs/self-hosting/manage/reverseproxy/reverse_proxy,"
    match: [reverse-proxy, traefik, nginx]
  - id: role-assignments-and-external-users
    name: "Role assignments and external users"
    source: "https://zitadel.com/docs/guides/manage/console/roles,"
    match: [role-assignments, authorizations, external-users]
  - id: saml-concepts-for-sso
    name: "Saml concepts for sso"
    source: "https://zitadel.com/docs/guides/integrate/login/saml"
    match: [saml, sso, service-provider]
  - id: secrets-storage-and-masterkey
    name: "Secrets storage and masterkey"
    source: "https://zitadel.com/docs/concepts/architecture/secrets"
    match: [secrets, masterkey, encryption]
  - id: self-service-registration-and-login
    name: "Self service registration and login"
    source: "https://zitadel.com/docs/concepts/features/selfservice"
    match: [self-service, registration, login]
  - id: service-account-client-credentials
    name: "Service account client credentials"
    source: "https://zitadel.com/docs/guides/integrate/service-accounts/client-credentials"
    match: [service-accounts, client-credentials, machine-to-machine]
  - id: service-account-personal-access-token
    name: "Service account personal access token"
    source: "https://zitadel.com/docs/guides/integrate/service-accounts/personal-access-token"
    match: [service-accounts, personal-access-token, pat]
  - id: service-account-private-key-jwt
    name: "Service account private key jwt"
    source: "https://zitadel.com/docs/guides/integrate/service-accounts/private-key-jwt,"
    match: [service-accounts, private-key-jwt, jwt-bearer]
  - id: service-ping-telemetry
    name: "Service ping telemetry"
    source: "https://zitadel.com/docs/self-hosting/manage/service_ping"
    match: [service-ping, telemetry, privacy]
  - id: settings-and-policy-inheritance
    name: "Settings and policy inheritance"
    source: "https://zitadel.com/docs/concepts/structure/policies,"
    match: [policies, default-settings, inheritance]
  - id: smtp-and-sms-notification-providers
    name: "Smtp and sms notification providers"
    source: "https://zitadel.com/docs/guides/manage/console/default-settings,"
    match: [smtp, sms, twilio]
  - id: tls-modes-and-http2
    name: "Tls modes and http2"
    source: "https://zitadel.com/docs/self-hosting/manage/tls_modes,"
    match: [tls, http2, h2c]
  - id: token-exchange-grant
    name: "Token exchange grant"
    source: "https://zitadel.com/docs/apis/openidoauth/endpoints,"
    match: [token-exchange, rfc8693, impersonation]
  - id: token-introspection-for-apis
    name: "Token introspection for apis"
    source: "https://zitadel.com/docs/guides/integrate/token-introspection,"
    match: [introspection, resource-server, api]
  - id: usage-limits-and-audit-retention
    name: "Usage limits and audit retention"
    source: "https://zitadel.com/docs/self-hosting/manage/usage_control"
    match: [limits, quotas, system-api]
  - id: user-metadata-in-tokens
    name: "User metadata in tokens"
    source: "https://zitadel.com/docs/guides/manage/customize/user-metadata,"
    match: [user-metadata, claims, userinfo]
  - id: user-types-human-service-federated
    name: "User types human service federated"
    source: "https://zitadel.com/docs/guides/manage/console/users-overview"
    match: [users, service-accounts, federated-users]
