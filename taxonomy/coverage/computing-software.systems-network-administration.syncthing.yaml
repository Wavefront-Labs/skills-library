# Coverage spec: syncthing. Topics from the official docs ToC in sources.
subject: syncthing
scope:
  category: computing-software
  field: systems-network-administration
  products: [syncthing]
sources:
  - "https://docs.syncthing.net/"
topics:
  - id: versioning-trashcan
    name: "Versioning trashcan"
    source: "https://docs.syncthing.net/users/versioning.html"
    match: [versioning, trashcan, stversions]
  - id: versioning-simple
    name: "Versioning simple"
    source: "https://docs.syncthing.net/users/versioning.html"
    match: [versioning, simple-versioning, keep-versions]
  - id: versioning-staggered
    name: "Versioning staggered"
    source: "https://docs.syncthing.net/users/versioning.html"
    match: [versioning, staggered, maxage]
  - id: versioning-external-command
    name: "Versioning external command"
    source: "https://docs.syncthing.net/users/versioning.html"
    match: [versioning, external-versioning, command]
  - id: versioning-restore-and-paths
    name: "Versioning restore and paths"
    source: "https://docs.syncthing.net/users/versioning.html"
    match: [versioning, fspath, restore]
  - id: stignore-patterns
    name: "Stignore patterns"
    source: "https://docs.syncthing.net/users/ignoring.html"
    match: [stignore, ignore-patterns, glob]
  - id: stignore-include-negation-prefixes
    name: "Stignore include negation prefixes"
    source: "https://docs.syncthing.net/users/ignoring.html"
    match: [stignore, negation, include]
  - id: stignore-escaping-special-characters
    name: "Stignore escaping special characters"
    source: "https://docs.syncthing.net/users/ignoring.html"
    match: [stignore, escape, brackets]
  - id: folder-type-send-only
    name: "Folder type send only"
    source: "https://docs.syncthing.net/users/foldertypes.html"
    match: [folder-types, send-only, override]
  - id: folder-type-receive-only
    name: "Folder type receive only"
    source: "https://docs.syncthing.net/users/foldertypes.html"
    match: [folder-types, receive-only, revert]
  - id: blocks-and-index-database
    name: "Blocks and index database"
    source: "https://docs.syncthing.net/users/syncing.html"
    match: [blocks, block-list, index-database]
  - id: scanning-and-filesystem-watcher
    name: "Scanning and filesystem watcher"
    source: "https://docs.syncthing.net/users/syncing.html"
    match: [scanning, fswatcher, rescan]
  - id: conflict-copies
    name: "Conflict copies"
    source: "https://docs.syncthing.net/users/syncing.html"
    match: [conflicts, sync-conflict, maxconflicts]
  - id: case-sensitivity-conflicts
    name: "Case sensitivity conflicts"
    source: "https://docs.syncthing.net/users/syncing.html"
    match: [case-sensitivity, case-conflict, casesensitivefs]
  - id: temporary-files-and-reserved-names
    name: "Temporary files and reserved names"
    source: "https://docs.syncthing.net/users/syncing.html"
    match: [temporary-files, syncthing-tmp, keeptemporariesh]
  - id: firewall-and-port-forwarding
    name: "Firewall and port forwarding"
    source: "https://docs.syncthing.net/users/firewall.html"
    match: [firewall, port-forwarding, port-22000]
  - id: relay-connections
    name: "Relay connections"
    source: "https://docs.syncthing.net/users/relaying.html"
    match: [relaying, relay, relay-pool]
  - id: proxy-environment-variables
    name: "Proxy environment variables"
    source: "https://docs.syncthing.net/users/proxying.html"
    match: [proxy, all-proxy, socks5]
  - id: reverse-proxy-gui
    name: "Reverse proxy gui"
    source: "https://docs.syncthing.net/users/reverseproxy.html"
    match: [reverse-proxy, nginx, hostcheck]
  - id: gui-listen-address
    name: "Gui listen address"
    source: "https://docs.syncthing.net/users/guilisten.html"
    match: [gui, listen-address, port-8384]
  - id: introducer-devices
    name: "Introducer devices"
    source: "https://docs.syncthing.net/users/introducer.html"
    match: [introducer, device-introduction, auto-add]
  - id: ldap-authentication
    name: "Ldap authentication"
    source: "https://docs.syncthing.net/users/ldap.html"
    match: [ldap, authentication, active-directory]
  - id: ssh-tunnel-sync
    name: "Ssh tunnel sync"
    source: "https://docs.syncthing.net/users/tunneling.html"
    match: [ssh-tunnel, port-forward, tunneling]
  - id: untrusted-encrypted-folders
    name: "Untrusted encrypted folders"
    source: "https://docs.syncthing.net/users/untrusted.html"
    match: [untrusted, encrypted-folder, receive-encrypted]
  - id: decrypt-untrusted-data
    name: "Decrypt untrusted data"
    source: "https://docs.syncthing.net/users/untrusted.html"
    match: [decrypt, untrusted, recovery]
  - id: tuning-for-performance
    name: "Tuning for performance"
    source: "https://docs.syncthing.net/users/tuning.html"
    match: [tuning, performance, concurrency]
  - id: privacy-and-information-leakage
    name: "Privacy and information leakage"
    source: "https://docs.syncthing.net/users/security.html"
    match: [security, global-discovery, usage-reporting]
  - id: discovery-server-stdiscosrv
    name: "Discovery server stdiscosrv"
    source: "https://docs.syncthing.net/users/stdiscosrv.html"
    match: [stdiscosrv, global-discovery, discovery-server]
  - id: relay-server-strelaysrv
    name: "Relay server strelaysrv"
    source: "https://docs.syncthing.net/users/strelaysrv.html"
    match: [strelaysrv, relay-server, relay-pool]
  - id: cli-serve-options
    name: "Cli serve options"
    source: "https://docs.syncthing.net/users/syncthing.html"
    match: [cli, serve-options, log-file]
  - id: cli-subcommands-and-exit-codes
    name: "Cli subcommands and exit codes"
    source: "https://docs.syncthing.net/users/syncthing.html"
    match: [cli, subcommands, exit-codes]
  - id: reset-gui-password
    name: "Reset gui password"
    source: "https://docs.syncthing.net/users/faq.html"
    match: [gui-password, generate, authentication]
  - id: rest-api-authentication
    name: "Rest api authentication"
    source: "https://docs.syncthing.net/dev/rest.html"
    match: [rest-api, api-key, pagination]
  - id: rest-events-polling
    name: "Rest events polling"
    source: "https://docs.syncthing.net/rest/events-get.html"
    match: [rest-events, event-api, long-polling]
  - id: rest-restore-file-versions
    name: "Rest restore file versions"
    source: "https://docs.syncthing.net/rest/folder-versions-get.html"
    match: [rest-api, folder-versions, restore-versions]
  - id: rest-config-endpoints
    name: "Rest config endpoints"
    source: "https://docs.syncthing.net/rest/config.html"
    match: [rest-api, rest-config, patch]
  - id: rest-pending-devices-and-folders
    name: "Rest pending devices and folders"
    source: "https://docs.syncthing.net/rest/cluster-pending-devices-get.html"
    match: [rest-api, pending, cluster]
  - id: rest-completion-and-need
    name: "Rest completion and need"
    source: "https://docs.syncthing.net/rest/db-completion-get.html"
    match: [rest-api, completion, db-need]
  - id: device-num-connections
    name: "Device num connections"
    source: "https://docs.syncthing.net/advanced/device-numconnections.html"
    match: [numconnections, multiple-connections, throughput]
  - id: device-allowed-networks
    name: "Device allowed networks"
    source: "https://docs.syncthing.net/advanced/device-allowednetworks.html"
    match: [allowednetworks, cidr, connection-restrictions]
  - id: max-folder-concurrency
    name: "Max folder concurrency"
    source: "https://docs.syncthing.net/advanced/option-max-concurrency.html"
    match: [maxfolderconcurrency, scan-concurrency, waiting-to-scan]
  - id: connection-limits
    name: "Connection limits"
    source: "https://docs.syncthing.net/advanced/option-connection-limits.html"
    match: [connection-limits, connectionlimitenough, connectionlimitmax]
  - id: folder-marker-stfolder
    name: "Folder marker stfolder"
    source: "https://docs.syncthing.net/users/faq.html"
    match: [folder-marker, stfolder, markername]
  - id: inotify-watch-limits
    name: "Inotify watch limits"
    source: "https://docs.syncthing.net/users/faq.html"
    match: [inotify, filesystem-watcher, linux]
  - id: sync-ownership-and-xattrs
    name: "Sync ownership and xattrs"
    source: "https://docs.syncthing.net/advanced/folder-sync-ownership.html"
    match: [syncownership, syncxattrs, extended-attributes]
  - id: copy-range-method
    name: "Copy range method"
    source: "https://docs.syncthing.net/advanced/folder-copyrangemethod.html"
    match: [copyrangemethod, copy-on-write, reflink]
  - id: auto-normalize-and-ignore-delete
    name: "Auto normalize and ignore delete"
    source: "https://docs.syncthing.net/advanced/folder-autonormalize.html"
    match: [autonormalize, ignoredelete, utf-8]
  - id: seed-initial-sync-by-copy
    name: "Seed initial sync by copy"
    source: "https://docs.syncthing.net/users/faq.html"
    match: [initial-sync, seeding, large-folders]
  - id: database-corruption-and-reset
    name: "Database corruption and reset"
    source: "https://docs.syncthing.net/users/faq.html"
    match: [database, index-reset, troubleshooting]
