# Canonical coverage spec: Cybersecurity (defensive) - whole field.
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (CompTIA Security+ SY0-701 and CySA+ CS0-003
# exam objectives, NIST CSF 2.0 functions/categories, CIS Controls v8 safeguards, MITRE D3FEND
# tactics, NIST SP 800-61/800-63/800-207/SSDF, OWASP projects, SIEM/EDR/scanner vendor docs ToCs),
# not from what the library happened to contain.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (objective bullet
# lists, CIS safeguards, CSF subcategories, D3FEND techniques, vendor docs page headings).
# Depth round 2 (r2-* subtopics): next level of the same sources - Security+ SY0-701 and CySA+ CS0-003
# objective sub-bullets, NIST CSF 2.0 subcategories, CIS Controls v8 safeguards, MITRE D3FEND techniques,
# Splunk/Sentinel/Elastic/Nessus/Qualys/Greenbone docs sub-pages, OWASP ASVS requirements and cheat sheets.
# Out of scope: offensive security (exploit development, attack tooling) and governance/risk/
# compliance programmes (business-finance/risk-management).
subject: cybersecurity-defensive
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [splunk, nessus, security-operations, vulnerability-management, security-architecture, threat-modelling, identity-access-management, network-defence, endpoint-security, cloud-security, application-security, system-hardening, threat-intelligence]
sources:
  - "CompTIA Security+ SY0-701 exam objectives - 1.0 General Security Concepts (1.2 zero trust, deception; 1.4 cryptographic solutions, PKI, certificates), 2.0 Threats/Vulnerabilities/Mitigations (2.5 mitigation techniques), 3.0 Security Architecture (3.1 architecture models, 3.2 enterprise infrastructure - device placement, zones, firewalls, IPS, VPN, SASE, port security, 3.3 data protection, 3.4 resilience and recovery), 4.0 Security Operations (4.1 baselines/hardening/wireless/mobile/app security, 4.2 asset management, 4.3 vulnerability management, 4.4 alerting and monitoring, 4.5 enterprise capabilities - firewall, IDS/IPS, web filter, OS security, DNS filtering, email security, FIM, DLP, NAC, EDR/XDR, 4.6 IAM, 4.7 automation, 4.8 incident response, 4.9 investigation data sources)"
  - "CompTIA CySA+ CS0-003 exam objectives - 1.0 Security Operations (architecture concepts, indicators of malicious activity, tools - Wireshark/tcpdump/SIEM/SOAR/EDR/sandbox/file analysis, threat intelligence and hunting, process improvement), 2.0 Vulnerability Management (scanning methods, output analysis, CVSS prioritisation, controls, response/SLOs/ASM), 3.0 Incident Response and Management (kill chain, Diamond, ATT&CK; detection, evidence acquisition, containment/eradication/recovery; post-incident), 4.0 Reporting and Communication (VM reporting, metrics, IR reporting)"
  - "NIST Cybersecurity Framework 2.0 - Identify (ID.AM, ID.RA, ID.IM), Protect (PR.AA, PR.AT, PR.DS, PR.PS, PR.IR), Detect (DE.CM, DE.AE), Respond (RS.MA, RS.AN, RS.CO, RS.MI), Recover (RC.RP, RC.CO) categories and subcategories"
  - "CIS Critical Security Controls v8 - 1 enterprise asset inventory, 2 software inventory, 3 data protection, 4 secure configuration, 5 account management, 6 access control, 7 continuous vulnerability management, 8 audit log management, 9 email and browser protections, 10 malware defenses, 11 data recovery, 12 network infrastructure management, 13 network monitoring and defense, 16 application software security, 17 incident response; safeguards as subtopics"
  - "MITRE D3FEND matrix - Model, Harden (application/credential/message/platform hardening), Detect (file/identifier/message/network traffic/platform/process/user behaviour analysis), Isolate (execution/network isolation), Deceive (decoy environment/objects), Evict, Restore"
  - "NIST SP 800-61r3 (incident response), SP 800-86 (forensics in IR), SP 800-63B (authenticators), SP 800-207 (zero trust), SP 800-218 SSDF, SP 800-92 (log management), SP 800-40r4 (patch management)"
  - "Vendor docs ToCs - Splunk Enterprise (Getting Data In, Search Reference, Distributed Deployment, Dashboard Studio) and Enterprise Security admin manual; Microsoft Sentinel docs; Elastic Security docs; Tenable Nessus user guide; Qualys VMDR docs; Greenbone/OpenVAS docs; Microsoft Defender for Endpoint and App Control for Business docs; AWS/Azure/GCP security docs"
  - "OWASP - Top 10 2021, API Security Top 10 2023, ASVS 4.0, Cheat Sheet Series, SAMM; Microsoft Threat Modeling / Threat Modeling Manifesto; CIS Benchmarks and DISA STIGs"
