# Canonical coverage spec: Game Design (whole field, all eight craft products).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (book tables of contents and chapter
# sub-sections, the GDC design-track topic taxonomy, published playtesting / user-research method
# lists, the TTRPG Safety Toolkit, the larp design literature), not from what we happened to write.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure.
# Distinct from computing-software game programming (engine code): this spec is design craft.
subject: game-design
scope:
  category: creative-arts
  field: game-design
  products: [systems-and-mechanics, level-design, narrative-design, tabletop-game-design, puzzle-design, playtesting-and-balance, game-mastering, larp-facilitation]
sources:
  - "Schell, The Art of Game Design - A Book of Lenses (3rd ed.) chapters - 2 Experience, 4 Game, 5 Elemental tetrad, 6 Theme, 7 Idea, 8 Iteration, 9 Player, 10 Mind, 11 Motivation, 12 Mechanics (space, time, objects, actions, rules, skill, chance), 13 Balance (twelve types, methodologies), 14 Puzzles (principles), 15 Interface, 16 Interest curves, 17-18 Story and indirect control, 19-21 Worlds characters spaces, 23-24 Other players and communities, 26 Documents, 27 Playtesting, 30 Pitch, 31 Profit, 32-33 Transformation and responsibility"
  - "Salen and Zimmerman, Rules of Play - Unit 2 Rules (constituative, operational, implicit rules; emergent systems; uncertainty; information; feedback loops; game theory; conflict; breaking the rules), Unit 3 Play (meaningful play, pleasure, narrative play, simulation, social play)"
  - "Koster, A Theory of Fun for Game Design - fun as learning patterns, chunking, boredom, the ingredients of a game (preparation, sense of space, core mechanic, range of challenges, abilities required, skill in use)"
  - "Hunicke, LeBlanc and Zubek, MDA - A Formal Approach to Game Design and Game Research (2004); Fullerton, Game Design Workshop (formal elements, dramatic elements, system dynamics, conceptualisation, prototyping, playtesting, functionality / completeness / balance, fun and accessibility)"
  - "Rogers, Level Up! The Guide to Great Video Game Design (2nd ed.) - GDD and ten-pager, the 3Cs (character, camera, controls), writing the story, level design (theme, layout, the Metroidvania, beat charts), combat, enemy design, boss design, mechanics and hazards, power-ups and unlockables, multiplayer, pitching"
  - "Swink, Game Feel - real-time control, simulated space, polish, metaphor, rules; input and response; Jonasson and Purho, Juice it or lose it (GDC Europe 2012)"
  - "Totten, An Architectural Approach to Level Design - spatial types, molding player behavior, landmarks and wayfinding, pacing and intensity; Smith and Worch, What Happened Here? Environmental Storytelling (GDC 2010)"
  - "Heussner, Finley, Hepler and Lemay, The Game Narrative Toolbox; Short and Adams, Procedural Storytelling in Game Design; inkle Ink and Twine documentation; Jenkins, Game Design as Narrative Architecture"
  - "Engelstein and Shalev, Building Blocks of Tabletop Game Design - game structure, turn order, actions, resolution, game end and victory, uncertainty, economics, auctions, worker placement, movement, area control, set collection, card mechanisms; Kobold Guide to Board Game Design (theme, components, playtesting, rulebooks, pitching, publishing); Garfield, Elias and Gutschera, Characteristics of Games"
  - "Schreiber and Romero, Game Balance (2021) and Schreiber, Game Balance Concepts course - cost curves, transitive and intransitive mechanics, probability, spreadsheets and simulation, progression, economies, competitive balance; Drachen, Mirza-Babaei and Nacke, Games User Research - usability testing, RITE, surveys, heuristics, telemetry, physiological measures"
  - "Nicholson, Peeking Behind the Locked Door - A Survey of Escape Room Facilities (2015) and Ask Why - escape-room puzzle structures; Ron Gilbert, Why Adventure Games Suck (1989); Scott Kim puzzle design talks"
  - "Dungeon Master's Guide 5e (2014) parts - Master of Worlds, Master of Adventures, Master of Rules (running the game, combat, encounters, rewards); Shea, Return of the Lazy Dungeon Master; Alexander, So You Want to Be a Game Master (three clue rule, node-based scenario design); Shaw and Bryant, TTRPG Safety Toolkit"
  - "Koljonen, Stenros et al., Larp Design - Creating Role-Play Experiences (2019) sections - vision, structure, characters, workshops, safety, runtime, logistics, debrief; Nordic Larp; Larpwriter Summer School materials"
  - "GDC Vault Design track topic taxonomy - systems, level, narrative, UX and accessibility, monetisation and live ops, multiplayer, prototyping, documentation and pitching"
