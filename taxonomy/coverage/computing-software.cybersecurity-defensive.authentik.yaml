subject: authentik
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [authentik]
sources:
  - "authentik documentation, https://docs.goauthentik.io/"
topics:
  - id: application-entitlements
    name: application entitlements
    source: "https://docs.goauthentik.io/add-secure-apps/applications/manage_apps/"
    match: [entitlements, authorization, property-mappings]
  - id: backup-and-restore
    name: backup and restore
    source: "https://docs.goauthentik.io/sys-mgmt/ops/backup-restore/"
    match: [backup, restore, postgresql]
  - id: bindings-overview
    name: bindings overview
    source: "https://docs.goauthentik.io/add-secure-apps/bindings-overview/"
    match: [bindings, flow-stage-binding, policy-binding]
  - id: blueprint-yaml-tags
    name: blueprint yaml tags
    source: "https://docs.goauthentik.io/customize/blueprints/v1/tags/"
    match: [blueprints, yaml-tags, keyof]
  - id: blueprints-overview
    name: blueprints overview
    source: "https://docs.goauthentik.io/customize/blueprints/"
    match: [blueprints, configuration-as-code, oci]
  - id: collect-user-attributes
    name: collect user attributes
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/flow/collect-user-attributes/"
    match: [prompt-stage, user-write, custom-attributes]
  - id: email-configuration
    name: email configuration
    source: "https://docs.goauthentik.io/install-config/email/"
    match: [email, smtp, test-email]
  - id: example-flows
    name: example flows
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/flow/flows/"
    match: [example-flows, blueprints, enrollment]
  - id: expression-policies
    name: expression policies
    source: "https://docs.goauthentik.io/customize/policies/types/expression/"
    match: [expression-policy, python, pending-user]
  - id: flow-context
    name: flow context
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/flow/context/"
    match: [flow-context, pending-user, prompt-data]
  - id: flow-inspector
    name: flow inspector
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/flow/inspector/"
    match: [flow-inspector, troubleshooting, flow-plan]
  - id: flow-planner
    name: flow planner
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/flow/planner/"
    match: [flow-planner, flow-plan, evaluate-when-planned]
  - id: flows-overview
    name: flows overview
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/flow/"
    match: [flows, stages, designation]
  - id: install-docker-compose
    name: install docker compose
    source: "https://docs.goauthentik.io/install-config/install/docker-compose/"
    match: [docker-compose, install, secret-key]
  - id: install-kubernetes-helm
    name: install kubernetes helm
    source: "https://docs.goauthentik.io/install-config/install/kubernetes/"
    match: [kubernetes, helm, values-yaml]
  - id: manage-applications
    name: manage applications
    source: "https://docs.goauthentik.io/add-secure-apps/applications/manage_apps/"
    match: [applications, providers, launch-url]
  - id: oauth2-device-code-flow
    name: oauth2 device code flow
    source: "https://docs.goauthentik.io/add-secure-apps/providers/oauth2/device_code/"
    match: [device-code, device-authorization-grant, oauth2]
  - id: oauth2-logout-front-back-channel
    name: oauth2 logout front back channel
    source: "https://docs.goauthentik.io/add-secure-apps/providers/oauth2/frontchannel_and_backchannel_logout/"
    match: [backchannel-logout, frontchannel-logout, oidc]
  - id: oauth2-machine-to-machine
    name: oauth2 machine to machine
    source: "https://docs.goauthentik.io/add-secure-apps/providers/oauth2/machine_to_machine/"
    match: [client-credentials, m2m, app-password]
  - id: oauth2-token-exchange
    name: oauth2 token exchange
    source: "https://docs.goauthentik.io/add-secure-apps/providers/oauth2/token_exchange/"
    match: [token-exchange, rfc8693, on-behalf-of]
  - id: outpost-docker-integration
    name: outpost docker integration
    source: "https://docs.goauthentik.io/add-secure-apps/outposts/integrations/docker/"
    match: [outpost, docker, docker-socket-proxy]
  - id: outpost-kubernetes-integration
    name: outpost kubernetes integration
    source: "https://docs.goauthentik.io/add-secure-apps/outposts/integrations/kubernetes/"
    match: [outpost, kubernetes, httproute]
  - id: outposts-overview
    name: outposts overview
    source: "https://docs.goauthentik.io/add-secure-apps/outposts/"
    match: [outposts, proxy-outpost, ldap-outpost]
  - id: policies-overview
    name: policies overview
    source: "https://docs.goauthentik.io/customize/policies/"
    match: [policies, policy-types, geoip]
  - id: policy-bindings-evaluation
    name: policy bindings evaluation
    source: "https://docs.goauthentik.io/customize/policies/bindings/"
    match: [policy-bindings, policy-engine-mode, negate]
  - id: provider-ldap
    name: provider ldap
    source: "https://docs.goauthentik.io/add-secure-apps/providers/ldap/"
    match: [ldap-provider, base-dn, bind-flow]
  - id: provider-oauth2
    name: provider oauth2
    source: "https://docs.goauthentik.io/add-secure-apps/providers/oauth2/"
    match: [oauth2-provider, openid-connect, scopes]
  - id: provider-proxy
    name: provider proxy
    source: "https://docs.goauthentik.io/add-secure-apps/providers/proxy/"
    match: [proxy-provider, forward-auth, outpost]
  - id: provider-radius
    name: provider radius
    source: "https://docs.goauthentik.io/add-secure-apps/providers/radius/"
    match: [radius-provider, eap-tls, pap]
  - id: provider-saml
    name: provider saml
    source: "https://docs.goauthentik.io/add-secure-apps/providers/saml/"
    match: [saml-provider, nameid, property-mappings]
  - id: provider-scim
    name: provider scim
    source: "https://docs.goauthentik.io/add-secure-apps/providers/scim/"
    match: [scim-provider, provisioning, backchannel]
  - id: reverse-proxy-setup
    name: reverse proxy setup
    source: "https://docs.goauthentik.io/install-config/reverse-proxy/"
    match: [reverse-proxy, nginx, traefik]
  - id: security-hardening
    name: security hardening
    source: "https://docs.goauthentik.io/security/security-hardening/"
    match: [hardening, mfa, session-binding]
  - id: stage-account-lockdown
    name: stage account lockdown
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/account_lockdown/"
    match: [account-lockdown, incident-response, revoke-tokens]
  - id: stage-authenticator-sms
    name: stage authenticator sms
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/authenticator_sms/"
    match: [sms-authenticator, twilio, generic-provider]
  - id: stage-authenticator-validate
    name: stage authenticator validate
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/authenticator_validate/"
    match: [authenticator-validation, mfa, webauthn]
  - id: stage-authenticator-webauthn
    name: stage authenticator webauthn
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/authenticator_webauthn/"
    match: [webauthn, passkeys, fido2]
  - id: stage-captcha
    name: stage captcha
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/captcha/"
    match: [captcha-stage, recaptcha, hcaptcha]
  - id: stage-consent
    name: stage consent
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/consent/"
    match: [consent-stage, authorization-flow, consent-header]
  - id: stage-deny
    name: stage deny
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/deny/"
    match: [deny-stage, block-ip-range, inactive-users]
  - id: stage-email
    name: stage email
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/email/"
    match: [email-stage, recovery-flow, custom-templates]
  - id: stage-identification
    name: stage identification
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/identification/"
    match: [identification-stage, user-fields, passkey-autofill]
  - id: stage-mtls
    name: stage mtls
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/mtls/"
    match: [mutual-tls, client-certificates, mtls-stage]
  - id: stage-password
    name: stage password
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/password/"
    match: [password-stage, backends, password-lockout]
  - id: stage-prompt
    name: stage prompt
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/prompt/"
    match: [prompt-stage, field-types, prompt-data]
  - id: stage-user-login
    name: stage user login
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/user_login/"
    match: [user-login-stage, session-duration, network-binding]
  - id: stage-user-write
    name: stage user write
    source: "https://docs.goauthentik.io/add-secure-apps/flows-stages/stages/user_write/"
    match: [user-write-stage, user-creation, enrollment]
  - id: upgrade-authentik
    name: upgrade authentik
    source: "https://docs.goauthentik.io/install-config/upgrade/"
    match: [upgrade, release-notes, outposts]
