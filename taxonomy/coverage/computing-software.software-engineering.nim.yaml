# Canonical coverage spec for nim-language, drawn from external sources listed below.
subject: nim-language
scope:
  category: computing-software
  field: software-engineering
  products:
  - nim
sources:
- 'Nim Tutorial part 1 and part 2 (https://nim-lang.org/docs/tut1.html): basics, control flow, procs, types, and the advanced tutorial topics'
- 'Nim Manual (https://nim-lang.org/docs/manual.html): lexical analysis, types, procs, generics, templates, macros, concepts, effects, pragmas, exceptions, modules, compile-time, memory'
- 'Nim Destructors and Move Semantics (https://nim-lang.org/docs/destructors.html): hooks, ARC/ORC ownership'
- 'Nim Compiler User Guide and Backend integration (https://nim-lang.org/docs/nimc.html): switches, backends, cross compilation, config files'
- 'Nimble package manager docs (https://github.com/nim-lang/nimble): nimble file, tasks, lock files, publishing'
- 'Nim standard library index (https://nim-lang.org/docs/lib.html): os, strutils, sequtils, tables, json, times, httpclient, parseopt, re, pegs, strformat, algorithm, macros, jsffi, asyncdispatch, unittest'
- 'Nim tools docs: docgen, nimpretty, nimsuggest (https://nim-lang.org/docs/docgen.html), Nim by Example and Nim in Action tables of contents (https://nimbyexample.com/)'
