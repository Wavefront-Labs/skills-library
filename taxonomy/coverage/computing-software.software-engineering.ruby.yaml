# Canonical coverage spec: Ruby language (Ruby 3.x, Bundler, RubyGems, standard library).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: ruby-language
scope:
  category: computing-software
  field: software-engineering
  products: [ruby]
sources:
  - "Ruby documentation (ruby-doc.org and docs.ruby-lang.org) - core and standard library reference for Ruby 3.x"
  - "Ruby language syntax documentation (docs.ruby-lang.org/en/master/syntax_rdoc.html)"
  - "Bundler documentation (bundler.io) and RubyGems guides (guides.rubygems.org)"
  - "The community Ruby Style Guide (rubystyle.guide) and RuboCop documentation (docs.rubocop.org)"
  - "Minitest and RSpec documentation"
  - "ruby-lang.org news and NEWS files for 3.0 to 3.4 release changes"
topics:
  - id: ruby-objects
    name: "Objects, types and truthiness"
    source: "Ruby docs - Object, NilClass, Symbol, String, Comparable"
    match: [ruby-objects]
    subtopics:
      - {id: ruby-objects-truthiness, name: "Truthiness nil and safe navigation", match: [truthiness]}
      - {id: ruby-objects-frozen-string-literals, name: "Symbols strings and frozen string literals", match: [frozen-string-literals]}
      - {id: ruby-objects-equality-comparable, name: "Equality eql hash and Comparable", match: [equality-comparable]}
      - {id: ruby-objects-numeric-types, name: "Numeric types Integer Float Rational and BigDecimal", match: [numeric-types]}
  - id: ruby-blocks
    name: "Blocks, procs and lambdas"
    source: "Ruby docs - Proc, Method, syntax/calling_methods and control_expressions"
    match: [ruby-blocks]
    subtopics:
      - {id: ruby-blocks-blocks-yield, name: "Blocks yield and block_given", match: [blocks-yield]}
      - {id: ruby-blocks-proc-vs-lambda, name: "Proc vs lambda semantics", match: [proc-vs-lambda]}
      - {id: ruby-blocks-enumerators-lazy, name: "Enumerators and lazy enumeration", match: [enumerators-lazy]}
  - id: ruby-modules
    name: "Classes, modules and mixins"
    source: "Ruby docs - Module, Class, Kernel; syntax/modules_and_classes"
    match: [ruby-modules]
    subtopics:
      - {id: ruby-modules-mixins-include-prepend, name: "Mixins include prepend extend", match: [mixins-include-prepend]}
      - {id: ruby-modules-method-visibility, name: "Visibility private protected and module_function", match: [method-visibility]}
      - {id: ruby-modules-struct-data, name: "Struct Data and value objects", match: [struct-data]}
      - {id: ruby-modules-refinements, name: "Refinements", match: [refinements]}
  - id: ruby-metaprogramming
    name: "Metaprogramming"
    source: "Ruby docs - Object, Module, BasicObject, Method"
    match: [ruby-metaprogramming]
    subtopics:
      - {id: ruby-metaprogramming-define-method, name: "define_method send and public_send", match: [define-method]}
      - {id: ruby-metaprogramming-method-missing, name: "method_missing and respond_to_missing", match: [method-missing]}
      - {id: ruby-metaprogramming-dsl-instance-eval, name: "Hooks and DSL design instance_eval", match: [dsl-instance-eval]}
  - id: ruby-errors
    name: "Exceptions"
    source: "Ruby docs - Exception hierarchy, syntax/exceptions"
    match: [ruby-errors]
    subtopics:
      - {id: ruby-errors-rescue-ensure, name: "rescue ensure retry and exception hierarchy", match: [rescue-ensure]}
      - {id: ruby-errors-custom-exceptions, name: "Custom exception classes", match: [custom-exceptions]}
      - {id: ruby-errors-timeouts-cleanup, name: "Timeouts catch-throw and resource cleanup", match: [timeouts-cleanup]}
  - id: ruby-collections
    name: "Collections and Enumerable"
    source: "Ruby docs - Array, Hash, Enumerable, Set"
    match: [ruby-collections]
    subtopics:
      - {id: ruby-collections-enumerable, name: "Enumerable methods map select reduce group_by", match: [enumerable]}
      - {id: ruby-collections-hash-defaults, name: "Hash defaults ordering and iteration", match: [hash-defaults]}
      - {id: ruby-collections-array-set, name: "Array operations and Set", match: [array-set]}
  - id: ruby-pattern-matching
    name: "Pattern matching and keyword arguments"
    source: "Ruby docs - syntax/pattern_matching, syntax/calling_methods"
    match: [ruby-pattern-matching]
    subtopics:
      - {id: ruby-pattern-matching-case-in-patterns, name: "case in pattern matching", match: [case-in-patterns]}
      - {id: ruby-pattern-matching-keyword-arguments, name: "Keyword arguments and argument forwarding", match: [keyword-arguments]}
  - id: ruby-concurrency
    name: "Concurrency"
    source: "Ruby docs - Thread, Mutex, Queue, Fiber, Ractor, Process"
    match: [ruby-concurrency]
    subtopics:
      - {id: ruby-concurrency-threads-mutex-gvl, name: "Threads Mutex and the GVL", match: [threads-mutex-gvl]}
      - {id: ruby-concurrency-fibers-scheduler, name: "Fibers and Fiber scheduler", match: [fibers-scheduler]}
      - {id: ruby-concurrency-processes-ractors, name: "Processes and Ractors", match: [processes-ractors]}
  - id: ruby-bundler
    name: "Bundler and gems"
    source: "Bundler documentation (bundler.io), RubyGems guides"
    match: [ruby-bundler]
    subtopics:
      - {id: ruby-bundler-gemfile-bundler, name: "Gemfile Gemfile.lock and bundle exec", match: [gemfile-bundler]}
      - {id: ruby-bundler-building-gems, name: "Building and publishing a gem", match: [building-gems]}
      - {id: ruby-bundler-ruby-version-managers, name: "Ruby version managers and environment", match: [ruby-version-managers]}
  - id: ruby-testing-style
    name: "Testing and style"
    source: "Minitest and RSpec docs; RuboCop and Ruby Style Guide"
    match: [ruby-testing-style]
    subtopics:
      - {id: ruby-testing-style-minitest, name: "Minitest unit tests and assertions", match: [minitest]}
      - {id: ruby-testing-style-rspec, name: "RSpec describe it and matchers", match: [rspec]}
      - {id: ruby-testing-style-rubocop, name: "RuboCop configuration and autocorrect", match: [rubocop]}
  - id: ruby-io-security
    name: "IO, files and security"
    source: "Ruby docs - File, Pathname, IO, Kernel#system, Marshal, ERB"
    match: [ruby-io-security]
    subtopics:
      - {id: ruby-io-security-file-pathname-io, name: "File and Pathname IO", match: [file-pathname-io]}
      - {id: ruby-io-security-system-commands-safely, name: "Running external commands safely", match: [system-commands-safely]}
      - {id: ruby-io-security-unsafe-deserialization, name: "Marshal YAML and ERB deserialisation safety", match: [unsafe-deserialization]}
  - id: ruby-performance
    name: "Performance and profiling"
    source: "Ruby docs - Benchmark, ObjectSpace, GC; YJIT documentation"
    match: [ruby-performance]
    subtopics:
      - {id: ruby-performance-ruby-profiling, name: "Benchmarking and profiling Ruby code", match: [ruby-profiling]}
      - {id: ruby-performance-yjit-upgrades, name: "YJIT and Ruby version upgrades", match: [yjit-upgrades]}
  - {id: ruby-format-strings, name: "Format strings and heredocs", source: "Ruby docs - Kernel#format, format_specifications, syntax/literals", match: [format-strings-heredocs]}
  - {id: ruby-regexp, name: "Regular expressions and named captures", source: "Ruby docs - Regexp, doc/regexp", match: [regexp-named-captures]}
  - {id: ruby-hash-transform, name: "Hash transformation methods", source: "Ruby docs - Hash", match: [hash-transform]}
  - {id: ruby-time, name: "Time, Date and time zones", source: "Ruby docs - Time, Date", match: [time-date-handling]}
  - {id: ruby-json-yaml, name: "JSON and YAML (Psych) serialisation", source: "Ruby docs - JSON, Psych", match: [json-yaml-serialization]}
  - {id: ruby-csv, name: "CSV parsing and generation", source: "Ruby docs - CSV", match: [csv-processing]}
  - {id: ruby-net-http, name: "HTTP clients with Net::HTTP", source: "Ruby docs - Net::HTTP", match: [net-http-client]}
  - {id: ruby-optparse, name: "Command-line tools with OptionParser", source: "Ruby docs - OptionParser", match: [optionparser-cli]}
  - {id: ruby-erb, name: "ERB templating", source: "Ruby docs - ERB", match: [erb-templating]}
  - {id: ruby-logger, name: "Logger stdlib", source: "Ruby docs - Logger", match: [logger-stdlib]}
  - {id: ruby-securerandom, name: "SecureRandom and Digest", source: "Ruby docs - SecureRandom, Digest, OpenSSL", match: [securerandom-digest]}
  - {id: ruby-tempfile, name: "Tempfile, Dir and FileUtils", source: "Ruby docs - Tempfile, FileUtils, Dir", match: [tempfile-fileutils]}
  - {id: ruby-gc, name: "Garbage collector tuning", source: "Ruby docs - GC, ObjectSpace; GC environment variables", match: [gc-tuning]}
  - {id: ruby-rbs, name: "RBS type signatures and TypeProf", source: "ruby/rbs and ruby/typeprof documentation", match: [rbs-type-signatures]}
  - {id: ruby-debug, name: "Debugging with the debug gem", source: "ruby/debug README", match: [debug-gem]}
  - {id: ruby-irb, name: "IRB console workflow", source: "Ruby docs - IRB", match: [irb-console]}
  - {id: ruby-singleton, name: "Singleton classes and the object model", source: "Ruby docs - syntax/modules_and_classes, Object#singleton_class", match: [singleton-classes]}
  - {id: ruby-autoload, name: "Constant lookup and autoload", source: "Ruby docs - Module#autoload, syntax/miscellaneous", match: [constant-lookup-autoload]}
  - {id: ruby-coerce, name: "Operator overloading and coerce", source: "Ruby docs - Numeric#coerce, syntax/methods", match: [operator-overloading-coerce]}
  - {id: ruby-method-objects, name: "Method objects and to_proc", source: "Ruby docs - Method, UnboundMethod, Symbol#to_proc", match: [method-objects-to-proc]}
  - {id: ruby-deconstruct, name: "deconstruct and deconstruct_keys", source: "Ruby docs - syntax/pattern_matching", match: [deconstruct-keys]}
  - {id: ruby-weakmap, name: "ObjectSpace WeakMap and finalizers", source: "Ruby docs - ObjectSpace::WeakMap", match: [weakmap-objectspace]}
  - {id: ruby-encoding, name: "String encodings", source: "Ruby docs - Encoding, String#encode", match: [string-encoding]}
  - {id: ruby-bundler-audit, name: "Gem vulnerability auditing", source: "rubysec/bundler-audit README; Bundler docs", match: [bundler-audit]}
  - {id: ruby-rake, name: "Rake tasks", source: "ruby/rake documentation", match: [rake-tasks]}
  - {id: ruby-simplecov, name: "Test coverage with SimpleCov", source: "SimpleCov README", match: [simplecov-coverage]}
  - {id: ruby-benchmark, name: "Benchmark stdlib and benchmark-ips", source: "Ruby docs - Benchmark", match: [benchmark-stdlib]}
  - {id: ruby-ostruct, name: "OpenStruct and when to avoid it", source: "Ruby docs - OpenStruct", match: [ostruct-pitfalls]}
  - {id: ruby-ranges, name: "Ranges and step iteration", source: "Ruby docs - Range, Numeric#step", match: [ranges-step]}
  - {id: ruby-pack, name: "Binary data with pack and unpack", source: "Ruby docs - packed_data", match: [pack-unpack]}
  - {id: ruby-socket, name: "TCP sockets", source: "Ruby docs - Socket, TCPServer", match: [socket-programming]}
  - {id: ruby-stringio, name: "StringIO for testing IO code", source: "Ruby docs - StringIO", match: [stringio-testing]}
  - {id: ruby-warnings, name: "Warnings and deprecations", source: "Ruby docs - Warning, Kernel#warn; Ruby 3.x NEWS", match: [warning-deprecations]}
  - {id: ruby-tracepoint, name: "TracePoint", source: "Ruby docs - TracePoint", match: [tracepoint-debugging]}
  - {id: ruby-retry, name: "Retry with backoff", source: "Ruby docs - syntax/exceptions", match: [retry-backoff]}
  - {id: ruby-memoization, name: "Memoization patterns", source: "Ruby docs - syntax/assignment (conditional assignment)", match: [memoization-patterns]}
