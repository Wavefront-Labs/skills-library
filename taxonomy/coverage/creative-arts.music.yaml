# Canonical coverage spec: music (all products in the creative-arts/music field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external, authoritative structures (exam-board theory and
# instrument syllabi, the Berklee core curriculum, DAW reference manuals, standard mixing and
# mastering texts), so the check measures the library against the subject, not against itself.
subject: music
scope:
  category: creative-arts
  field: music
  products: [composition, songwriting, arranging, conducting, vocal-performance, keyboard-instruments, guitar-and-fretted, bowed-strings, wind-and-brass, drums-and-percussion, music-production, mixing-mastering, ableton-live, dj-performance]
sources:
  - "ABRSM Music Theory syllabus Grades 1-8 (from 2020) - rhythm and metre, pitch and clefs, keys and scales, intervals, chords and cadences, terms and signs, instruments and voices, melody writing, harmonisation, figured bass, two-part counterpoint, score analysis"
  - "Trinity College London Theory of Music syllabus Grades 1-8 - transposition, ornaments, chord progressions, melody composition, harmonic analysis"
  - "Berklee College of Music core curriculum - Harmony 1-4, Ear Training 1-4, Arranging 1-2, Conducting, Songwriting 1-2, Film Scoring, Music Production and Engineering course outlines"
  - "Ableton Live 12 Reference Manual table of contents - Session View, Arrangement View, Clip View, Audio Clips/Tempo/Warping, Editing MIDI, Instrument/Drum/Effect Racks, Automation, Routing and I/O, Mixing, Grooves, Max for Live, Push, Link, Computer Audio Resources"
  - "Logic Pro User Guide and Pro Tools Reference Guide tables of contents - tracking, comping, editing, Flex/Elastic time, buses and aux sends, bouncing and delivery"
  - "Mike Senior, Mixing Secrets for the Small Studio (2nd ed.) chapter list - monitoring, preparation, balance, compression, equalisation, frequency-selective dynamics, reverb, delay, stereo enhancement, buss processing, automation, mixdown"
  - "Bob Katz, Mastering Audio (3rd ed.) chapter list - monitoring, metering, loudness, EQ, dynamics, limiting, dither and wordlength, sample-rate conversion, mastering for delivery"
  - "AES TD1004.1.15-10 streaming loudness recommendation; ITU-R BS.1770-4 and EBU R128 loudness metering"
  - "Instrument method syllabi - ABRSM/Trinity/RSL Rockschool practical grades for piano, guitar, bass, violin, cello, brass, woodwind, drums and singing; Percussive Arts Society 40 International Drum Rudiments; Arban, Klose and Galamian method tables of contents"
  - "Conducting texts - Max Rudolf, The Grammar of Conducting; Elizabeth Green, The Modern Conductor; RSCM choral leadership guidance"
  - "Songwriting texts - Pat Pattison, Writing Better Lyrics and Songwriting Without Boundaries; Berklee Songwriting 1-2 outlines"
  - "Arranging and orchestration texts - Samuel Adler, The Study of Orchestration; Berklee Arranging 1-2; Rimsky-Korsakov, Principles of Orchestration"
  - "DJ curricula - Point Blank / Scratch DJ Academy course outlines; Pioneer rekordbox and Serato DJ manuals"
