# Coverage spec: keda. Topics from the KEDA docs table of contents.
subject: keda
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [keda]
sources:
  - "KEDA docs (keda.sh/docs/2.17)"
topics:
  - id: activation-vs-scaling-thresholds
    name: "Activation vs scaling thresholds"
    source: "https://keda.sh/docs/2.17/concepts/scaling-deployments/"
    match: [activation, activationthreshold, scale-from-zero]
  - id: admission-webhook-enforcement-settings
    name: "Admission webhook enforcement settings"
    source: "https://keda.sh/docs/2.17/operate/admission-webhooks/"
    match: [failurepolicy, validation-enforcement, cache-miss-to-direct-client]
  - id: admission-webhook-prevention-rules
    name: "Admission webhook prevention rules"
    source: "https://keda.sh/docs/2.17/concepts/admission-webhooks/"
    match: [admission-webhooks, validation, scaledobject-validation]
  - id: authentication-aws-secret-manager
    name: "Authentication aws secret manager"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [aws-secret-manager, awssecretmanager, secretkey]
  - id: authentication-azure-key-vault
    name: "Authentication azure key vault"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [azure-key-vault, azurekeyvault, vaulturi]
  - id: authentication-env-secret-and-token-sources
    name: "Authentication env secret and token sources"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [env, secrettargetref, boundserviceaccounttoken]
  - id: authentication-gcp-secret-manager
    name: "Authentication gcp secret manager"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [gcp-secret-manager, gcpsecretmanager, gcp-pod-identity]
  - id: authentication-hashicorp-vault
    name: "Authentication hashicorp vault"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [hashicorp-vault, hashicorpvault, vault-kubernetes-auth]
  - id: authentication-via-scaledobject-metadata
    name: "Authentication via scaledobject metadata"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [authentication, secret-reference, envfrom]
  - id: cloudevent-types-and-filters
    name: "Cloudevent types and filters"
    source: "https://keda.sh/docs/2.17/operate/cloud-events/"
    match: [includedeventtypes, excludedeventtypes, keda-scaledobject-failed]
  - id: cloudeventsource-emit-keda-events
    name: "Cloudeventsource emit keda events"
    source: "https://keda.sh/docs/2.17/operate/cloud-events/"
    match: [cloudeventsource, cloudevents, eventing-keda-sh]
  - id: cluster-client-reconcile-and-grpc-tuning
    name: "Cluster client reconcile and grpc tuning"
    source: "https://keda.sh/docs/2.17/operate/cluster/"
    match: [kube-api-qps, kube-api-burst, metrics-service-address]
  - id: cluster-high-availability
    name: "Cluster high availability"
    source: "https://keda.sh/docs/2.17/operate/cluster/"
    match: [high-availability, leader-election, enable-aggregator-routing]
  - id: cluster-http-client-settings
    name: "Cluster http client settings"
    source: "https://keda.sh/docs/2.17/operate/cluster/"
    match: [keda-http-default-timeout, keda-http-disable-keep-alive, http-proxy]
  - id: cluster-requirements-capacity-and-firewall
    name: "Cluster requirements capacity and firewall"
    source: "https://keda.sh/docs/2.17/operate/cluster/"
    match: [kubernetes-compatibility, n-2, resource-requests]
  - id: clustertriggerauthentication-scope
    name: "Clustertriggerauthentication scope"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [clustertriggerauthentication, keda-cluster-object-namespace, shared-credentials]
  - id: cooldown-period-and-initial-cooldown
    name: "Cooldown period and initial cooldown"
    source: "https://keda.sh/docs/2.17/reference/scaledobject-spec/"
    match: [cooldownperiod, initialcooldownperiod, scale-to-zero]
  - id: fallback-replicas-on-scaler-failure
    name: "Fallback replicas on scaler failure"
    source: "https://keda.sh/docs/2.17/reference/scaledobject-spec/"
    match: [fallback, failurethreshold, fallback-behavior]
  - id: idle-min-max-replica-counts
    name: "Idle min max replica counts"
    source: "https://keda.sh/docs/2.17/reference/scaledobject-spec/"
    match: [idlereplicacount, minreplicacount, maxreplicacount]
  - id: long-running-executions-in-keda
    name: "Long running executions in keda"
    source: "https://keda.sh/docs/2.17/concepts/scaling-deployments/"
    match: [long-running-jobs, terminationgraceperiodseconds, prestop-hook]
  - id: opentelemetry-metrics-export
    name: "Opentelemetry metrics export"
    source: "https://keda.sh/docs/2.17/integrations/opentelemetry/"
    match: [opentelemetry, otlp, enable-opentelemetry-metrics]
  - id: operator-managed-and-custom-tls-certificates
    name: "Operator managed and custom tls certificates"
    source: "https://keda.sh/docs/2.17/operate/security/"
    match: [kedaorg-certs, enable-cert-rotation, cert-dir]
  - id: pause-scaledobject-autoscaling
    name: "Pause scaledobject autoscaling"
    source: "https://keda.sh/docs/2.17/concepts/scaling-deployments/"
    match: [autoscaling-keda-sh-paused, paused-replicas, pause-autoscaling]
  - id: pod-identity-aws-irsa
    name: "Pod identity aws irsa"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [aws-pod-identity, irsa, rolearn]
  - id: pod-identity-azure-workload
    name: "Pod identity azure workload"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [azure-workload-identity, podidentity, federated-credential]
  - id: polling-interval-and-metrics-caching
    name: "Polling interval and metrics caching"
    source: "https://keda.sh/docs/2.17/reference/scaledobject-spec/"
    match: [pollinginterval, usecachedmetrics, hpa-sync-period]
  - id: prometheus-metrics-from-keda-operator
    name: "Prometheus metrics from keda operator"
    source: "https://keda.sh/docs/2.17/integrations/prometheus/"
    match: [prometheus-metrics, keda-scaler-active, keda-scaler-metrics-value]
  - id: prometheus-metrics-webhooks-metrics-server-dashboard
    name: "Prometheus metrics webhooks metrics server dashboard"
    source: "https://keda.sh/docs/2.17/integrations/prometheus/"
    match: [keda-webhook-metrics, metrics-adapter, grpc-client-metrics]
  - id: query-keda-external-metrics-with-kubectl
    name: "Query keda external metrics with kubectl"
    source: "https://keda.sh/docs/2.17/operate/metrics-server/"
    match: [external-metrics, kubectl-get-raw, externalmetricnames]
  - id: restore-original-replicas-and-hpa-config
    name: "Restore original replicas and hpa config"
    source: "https://keda.sh/docs/2.17/reference/scaledobject-spec/"
    match: [restoretooriginalreplicacount, horizontalpodautoscalerconfig, hpa-behavior]
  - id: restrict-watched-namespaces-and-secret-access
    name: "Restrict watched namespaces and secret access"
    source: "https://keda.sh/docs/2.17/operate/cluster/"
    match: [watch-namespace, keda-restrict-secret-access, cluster-role]
  - id: scaledjob-overview-and-pausing
    name: "Scaledjob overview and pausing"
    source: "https://keda.sh/docs/2.17/concepts/scaling-jobs/"
    match: [scaledjob, jobtargetref, scaling-jobs]
  - id: scaledjob-replica-counts-and-history
    name: "Scaledjob replica counts and history"
    source: "https://keda.sh/docs/2.17/reference/scaledjob-spec/"
    match: [maxreplicacount, minreplicacount, successfuljobshistorylimit]
  - id: scaledjob-rollout-strategy
    name: "Scaledjob rollout strategy"
    source: "https://keda.sh/docs/2.17/reference/scaledjob-spec/"
    match: [rollout-strategy, gradual, propagationpolicy]
  - id: scaledjob-scaling-strategies
    name: "Scaledjob scaling strategies"
    source: "https://keda.sh/docs/2.17/reference/scaledjob-spec/"
    match: [scalingstrategy, accurate, eager]
  - id: scaledobject-scaling-targets
    name: "Scaledobject scaling targets"
    source: "https://keda.sh/docs/2.17/concepts/scaling-deployments/"
    match: [scaledobject, scaletargetref, deployment]
  - id: scaling-modifiers-formula
    name: "Scaling modifiers formula"
    source: "https://keda.sh/docs/2.17/concepts/scaling-deployments/"
    match: [scalingmodifiers, formula, composite-metric]
  - id: transfer-existing-hpa-ownership
    name: "Transfer existing hpa ownership"
    source: "https://keda.sh/docs/2.17/concepts/scaling-deployments/"
    match: [transfer-hpa-ownership, hpa-ownership, validations-keda-sh]
  - id: trigger-fields-and-metric-types
    name: "Trigger fields and metric types"
    source: "https://keda.sh/docs/2.17/reference/scaledobject-spec/"
    match: [triggers, metrictype, averagevalue]
  - id: triggerauthentication-resource
    name: "Triggerauthentication resource"
    source: "https://keda.sh/docs/2.17/concepts/authentication/"
    match: [triggerauthentication, authenticationref, secrettargetref]
  - id: trust-custom-ca-in-keda-operator
    name: "Trust custom ca in keda operator"
    source: "https://keda.sh/docs/2.17/operate/security/"
    match: [ca-dir, custom-ca, unsafessl]
  - id: validatingadmissionpolicy-replica-limits
    name: "Validatingadmissionpolicy replica limits"
    source: "https://keda.sh/docs/2.17/operate/admission-webhooks/"
    match: [validatingadmissionpolicy, cel, replica-limit]
