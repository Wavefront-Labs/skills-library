# Coverage spec for KServe, from the official documentation (docs/ in kserve/website).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: kserve
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [kserve]
sources:
  - "KServe documentation (docs/ in kserve/website)"
topics:
  - id: binary-tensor-data-extension
    name: "Binary Tensor Data Extension (V2)"
    source: "https://github.com/kserve/website/blob/main/docs/concepts/architecture/data-plane/v2-protocol/binary-tensor-data-extension.md"
    match: [binary-tensor-data, binary-data-size]
  - id: canary-rollout
    name: "Canary rollout"
    source: "https://github.com/kserve/website/blob/main/docs/model-serving/predictive-inference/rollout-strategies/canary.md"
    match: [canary, canarytrafficpercent]
  - id: cluster-storage-container
    name: "ClusterStorageContainer"
    source: "https://github.com/kserve/website/blob/main/docs/model-serving/storage/storage-containers/storage-containers.md"
    match: [clusterstoragecontainer, supporteduriformats]
  - id: config-deploy-resources-sidecars
    name: "inferenceservice-config: deploy, resources and sidecars"
    source: "https://github.com/kserve/website/blob/main/docs/admin-guide/configurations.md"
    match: [defaultdeploymentmode, servingkserveiodeploymentmode]
  - id: config-ingress-settings
    name: "inferenceservice-config: ingress settings"
    source: "https://github.com/kserve/website/blob/main/docs/admin-guide/configurations.md"
    match: [inferenceservice-config, ingress-config]
  - id: config-metrics-localmodel-multinode
    name: "inferenceservice-config: metrics, OTel, localModel, multiNode"
    source: "https://github.com/kserve/website/blob/main/docs/admin-guide/configurations.md"
    match: [metricsaggregator, enablemetricaggregation]
  - id: config-storage-credentials
    name: "inferenceservice-config: storageInitializer and credentials"
    source: "https://github.com/kserve/website/blob/main/docs/admin-guide/configurations.md"
    match: [storageinitializer, enablemodelcar]
  - id: control-plane-deployment-modes
    name: "KServe control plane and deployment modes"
    source: "https://github.com/kserve/website/blob/main/docs/concepts/architecture/control-plane.md"
    match: [control-plane, deployment-modes]
  - id: custom-predictor-model-server
    name: "Custom predictor (Python ModelServer)"
    source: "https://github.com/kserve/website/blob/main/docs/model-serving/predictive-inference/frameworks/custom-predictor/custom-predictor.md"
    match: [custom-predictor, modelserver]
