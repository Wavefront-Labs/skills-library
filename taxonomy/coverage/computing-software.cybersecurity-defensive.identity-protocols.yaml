# Canonical coverage spec for identity-protocols, drawn from external sources listed below.
subject: identity-protocols
scope:
  category: computing-software
  field: cybersecurity-defensive
  products:
  - identity-protocols
  - identity-access-management
sources:
- 'OASIS SAML 2.0 Core, Bindings, Profiles, Metadata, Conformance, Security and Privacy Considerations (https://docs.oasis-open.org/security/saml/v2.0/): assertions, protocols, bindings, profiles, metadata,
  signing, encryption and threat sections map to the saml-* topics'
- 'OpenID Connect specifications (https://openid.net/specs/): Core 1.0, Discovery, Dynamic Client Registration, Session Management, RP-Initiated, Front-Channel and Back-Channel Logout, Form Post Response
  Mode, CIBA Core, FAPI 2.0 map to the oidc-* topics'
- 'IETF OAuth RFCs (https://www.rfc-editor.org/): 6749, 6750, 7009, 7515-7519, 7591, 7636, 7662, 8252, 8414, 8628, 8693, 8705, 8707, 9068, 9101, 9126, 9207, 9396, 9449, 9700 map to the oauth-* and jose-*
  topics'
- 'IETF SCIM RFCs 7642, 7643, 7644 (https://www.rfc-editor.org/rfc/rfc7644): schema, resources, protocol, PATCH, filtering, bulk and discovery sections map to the scim-* topics'
