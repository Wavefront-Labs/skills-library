# Canonical coverage spec: literary writing (all products in the literary-writing field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external, authoritative structures: MFA creative-writing workshop
# curricula, the chapter lists of the standard craft texts (Burroway, Browne & King, Oliver,
# Addonizio & Laux, Lamott, Gornick, Gutkind, Swain), the Chicago Manual of Style manuscript chapters,
# publishing-industry guides and platform documentation (KDP, IngramSpark), and the Scrivener 3 manual.
# Note: there is no "publishing" product in this field; querying, contracts and self-publishing for
# book-length fiction sit under `novel-writing`, and literary-magazine submission under `short-fiction`.
subject: literary-writing
scope:
  category: creative-arts
  field: literary-writing
  products: [novel-writing, short-fiction, plot-structure, character-development, prose-style, poetry, worldbuilding, creative-nonfiction, oral-storytelling, developmental-editing, scrivener]
sources:
  - "Janet Burroway, Writing Fiction - A Guide to Narrative Craft (10th ed.) chapters - Whatever Works (the writing process), Seeing Is Believing (showing and telling), Building Character (characterization I), The Flesh Made Word (characterization II, dialogue), Long Ago and Far Away (setting and time), The Tower and the Net (story structure, conflict-crisis-resolution, scene and summary), Call Me Ishmael (point of view), Is and Is Not (comparison, metaphor, symbol), Play It Again Sam (revision)"
  - "Renni Browne and Dave King, Self-Editing for Fiction Writers (2nd ed.) chapters - Show and Tell, Characterization and Exposition, Point of View, Proportion, Dialogue Mechanics, See How It Sounds, Interior Monologue, Easy Beats, Breaking Up Is Easy to Do, Once Is Usually Enough, Sophistication, Voice"
  - "Anne Lamott, Bird by Bird - Short Assignments, Shitty First Drafts, Perfectionism, Character, Plot, Dialogue, Set Design, False Starts, Plot Treatment, How Do You Know When You're Done, Index Cards, Writing Groups, Someone to Read Your Drafts, Writer's Block, Publication"
  - "Dwight V. Swain, Techniques of the Selling Writer - motivation-reaction units, scene (goal, conflict, disaster), sequel (reaction, dilemma, decision), planning the story; Blake Snyder Save the Cat beat sheet; Freytag's pyramid; Randy Ingermanson snowflake method; John Gardner The Art of Fiction (psychic distance)"
  - "Mary Oliver, A Poetry Handbook - Imitation, Sound, The Line (metrical verse and free verse), Some Given Forms, Verse That Is Free, Diction Tone and Voice, Imagery, Revision, Workshops and Solitude; Kim Addonizio and Dorianne Laux, The Poet's Companion - images, metaphor and simile, voice, line, music and rhythm, poetic forms, revision, publication; Paul Fussell Poetic Meter and Poetic Form; Strand and Boland The Making of a Poem (forms)"
  - "Creative nonfiction MFA curricula and texts - Vivian Gornick The Situation and the Story; Phillip Lopate To Show and To Tell; Lee Gutkind You Can't Make This Stuff Up (immersion, interviewing, ethics, fact-checking); Mary Karr The Art of Memoir; Brenda Miller and Suzanne Paola Tell It Slant (lyric, braided, hermit-crab essays)"
  - "The Chicago Manual of Style (18th ed.) - ch. 2 Manuscript Preparation, Manuscript Editing and Proofreading (style sheets, queries, proofreading marks); ch. 12-13 quotations and dialogue; ch. 4 rights and permissions; William Shunn Proper Manuscript Format"
  - "Publishing-industry guides - Jane Friedman The Business of Being a Writer (querying, synopsis, proposals, contracts, self-publishing); Association of American Literary Agents Canon of Ethics; Authors Guild Model Trade Book Contract and contract guide; Amazon KDP Help (manuscript and cover formatting, KDP Select, royalties, metadata); IngramSpark File Creation Guide; Bowker ISBN; BISAC subject headings; Duotrope/Submittable literary-magazine submission practice"
  - "Worldbuilding craft texts - Brandon Sanderson BYU English 318 lectures and Sanderson's Laws of Magic; Orson Scott Card How to Write Science Fiction and Fantasy; Jeff VanderMeer Wonderbook; Mark Rosenfelder The Language Construction Kit"
  - "Oral storytelling - National Storytelling Network resources; Doug Lipman Improving Your Storytelling; Margaret Read MacDonald The Storyteller's Start-Up Book; The Moth storytelling guidelines; Uther The Types of International Folktales (ATU index)"
  - "Developmental editing - Editorial Freelancers Association (EFA) definitions of editing levels and rates chart; Scott Norton Developmental Editing; Susan Bell The Artful Edit; Liz Lerman Critical Response Process; MFA workshop model"
  - "Scrivener 3 User Manual (Literature & Latte) ToC - Binder, Corkboard, Outliner, Scrivenings, Inspector (synopsis, notes, metadata, labels, status, keywords, custom metadata), Collections, Snapshots, Revision Mode, Project and session targets, Composition Mode, Document and project templates, Import and Split, Compile (formats, section types, section layouts, placeholders, replacements, ebook), Backups, Sync with iOS and external folders"
