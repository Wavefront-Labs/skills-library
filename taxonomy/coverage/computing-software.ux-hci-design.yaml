# Canonical coverage spec: UX & HCI Design (whole field).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: ux-hci-design
scope:
  category: computing-software
  field: ux-hci-design
  products: [usability-heuristics, wcag-accessibility, interaction-design, ux-research-methods, design-systems, platform-guidelines]
sources:
  - "Nielsen Norman Group - 10 Usability Heuristics for User Interface Design, heuristic evaluation and severity rating articles (nngroup.com/articles)"
  - "NN/g research method articles - when to use which user-research methods, usability testing 101, card sorting, tree testing, diary studies, interviews, surveys"
  - "W3C WCAG 2.2 (w3.org/TR/WCAG22) - Principles Perceivable, Operable, Understandable, Robust; guidelines 1.1 to 4.1 and conformance requirements"
  - "W3C WAI-ARIA 1.2 and ARIA Authoring Practices Guide patterns (w3.org/WAI/ARIA/apg)"
  - "W3C WAI Understanding WCAG 2.2 and WCAG-EM Website Accessibility Conformance Evaluation Methodology"
  - "ISO 9241-210 human-centred design for interactive systems; ISO 9241-11 usability definition (iso.org)"
  - "Apple Human Interface Guidelines (developer.apple.com/design/human-interface-guidelines)"
  - "Material Design 3 (m3.material.io) - foundations, styles, components"
  - "Design Tokens Community Group format module (designtokens.org)"
  - "Laws of UX (lawsofux.com) and Fitts 1954, Hick 1952 original results"
  - "IAAP Body of Knowledge for CPACC and WAS certifications (accessibilityassociation.org)"
topics:
  - id: uh-visibility-status
    name: "H1 Visibility of system status"
    source: "NN/g 10 heuristics, heuristic 1"
    match: [uh-visibility-status]
    subtopics:
      - {id: uh-visibility-status-status-feedback-response-times, name: "Give timely feedback within the 0.1 / 1 / 10 second limits", match: [response-time-limits]}
      - {id: uh-visibility-status-status-you-are-here-indicators, name: "Show system state and location in the interface", match: [you-are-here]}
      - {id: uh-visibility-status-status-save-and-sync-state, name: "Communicate saving, sync and offline state", match: [save-state-indicator]}
  - id: uh-match-real-world
    name: "H2 Match between system and the real world"
    source: "NN/g heuristic 2"
    match: [uh-match-real-world]
    subtopics:
      - {id: uh-match-real-world-real-world-language-and-labels, name: "Use the users' language in labels and messages", match: [plain-language-labels]}
      - {id: uh-match-real-world-real-world-metaphors-and-conventions, name: "Use metaphors and conventions without breaking them", match: [interface-metaphors]}
  - id: uh-user-control
    name: "H3 User control and freedom"
    source: "NN/g heuristic 3"
    match: [uh-user-control]
    subtopics:
      - {id: uh-user-control-undo-redo-and-emergency-exits, name: "Provide undo, cancel and clearly marked exits", match: [undo-redo-design]}
      - {id: uh-user-control-cancel-and-back-navigation-in-flows, name: "Support back, cancel and resume in multi-step flows", match: [wizard-back-navigation]}
  - id: uh-consistency
    name: "H4 Consistency and standards"
    source: "NN/g heuristic 4"
    match: [uh-consistency]
    subtopics:
      - {id: uh-consistency-internal-consistency-audit, name: "Audit internal consistency of terms, controls and layout", match: [consistency-audit]}
      - {id: uh-consistency-external-conventions-jakobs-law, name: "Follow platform and industry conventions (Jakob's law)", match: [jakobs-law]}
  - id: uh-error-prevention
    name: "H5 Error prevention"
    source: "NN/g heuristic 5"
    match: [uh-error-prevention]
    subtopics:
      - {id: uh-error-prevention-slips-vs-mistakes-prevention, name: "Distinguish slips from mistakes and design against each", match: [slips-and-mistakes]}
      - {id: uh-error-prevention-constraints-defaults-and-confirmations, name: "Apply constraints, defaults and targeted confirmations", match: [input-constraints]}
  - id: uh-recognition-recall
    name: "H6 Recognition rather than recall"
    source: "NN/g heuristic 6"
    match: [uh-recognition-recall]
    subtopics:
      - {id: uh-recognition-recall-recognition-over-recall-patterns, name: "Replace memory demands with visible options", match: [recognition-over-recall]}
      - {id: uh-recognition-recall-progressive-disclosure, name: "Use progressive disclosure to balance visibility and clutter", match: [progressive-disclosure]}
  - id: uh-flexibility-efficiency
    name: "H7 Flexibility and efficiency of use"
    source: "NN/g heuristic 7"
    match: [uh-flexibility-efficiency]
    subtopics:
      - {id: uh-flexibility-efficiency-accelerators-and-shortcuts, name: "Offer accelerators for experts without burdening novices", match: [accelerators]}
      - {id: uh-flexibility-efficiency-personalisation-and-adaptive-defaults, name: "Personalise and adapt defaults carefully", match: [adaptive-defaults]}
  - id: uh-minimalist-design
    name: "H8 Aesthetic and minimalist design"
    source: "NN/g heuristic 8"
    match: [uh-minimalist-design]
    subtopics:
      - {id: uh-minimalist-design-signal-to-noise-and-hierarchy, name: "Raise signal-to-noise with visual hierarchy", match: [visual-hierarchy]}
      - {id: uh-minimalist-design-content-reduction-and-scannability, name: "Make content scannable and cut non-essential text", match: [scannable-content]}
  - id: uh-error-recovery
    name: "H9 Help users recognise, diagnose and recover from errors"
    source: "NN/g heuristic 9"
    match: [uh-error-recovery]
    subtopics:
      - {id: uh-error-recovery-error-message-writing, name: "Write error messages that explain and fix", match: [error-message-writing]}
      - {id: uh-error-recovery-error-states-empty-and-404, name: "Design empty states, 404s and failure pages that recover", match: [empty-states]}
  - id: uh-help-documentation
    name: "H10 Help and documentation"
    source: "NN/g heuristic 10"
    match: [uh-help-documentation]
    subtopics:
      - {id: uh-help-documentation-contextual-help-and-onboarding, name: "Provide contextual help and onboarding", match: [contextual-help]}
      - {id: uh-help-documentation-help-content-structure, name: "Structure help and documentation for task lookup", match: [help-documentation-structure]}
  - id: uh-heuristic-evaluation
    name: "Heuristic evaluation process"
    source: "NN/g how to conduct a heuristic evaluation"
    match: [uh-heuristic-evaluation]
    subtopics:
      - {id: uh-heuristic-evaluation-heuristic-evaluation-procedure, name: "Plan and run a heuristic evaluation", match: [heuristic-evaluation]}
      - {id: uh-heuristic-evaluation-cognitive-walkthrough, name: "Run a cognitive walkthrough for first-time use", match: [cognitive-walkthrough]}
  - id: uh-severity-rating
    name: "Severity rating of usability problems"
    source: "NN/g severity ratings for usability problems"
    match: [uh-severity-rating]
    subtopics:
      - {id: uh-severity-rating-severity-rating-scale, name: "Rate severity by frequency, impact and persistence", match: [severity-rating]}
      - {id: uh-severity-rating-usability-issue-reporting, name: "Write actionable usability issue reports", match: [usability-report]}
  - id: wcag-text-alternatives
    name: "WCAG 1.1 Text alternatives"
    source: "WCAG 2.2 guideline 1.1"
    match: [wcag-text-alternatives]
    subtopics:
      - {id: wcag-text-alternatives-alt-text-decision-tree, name: "Write alt text using the decision tree", match: [alt-text-decision-tree]}
      - {id: wcag-text-alternatives-complex-images-and-captcha-alternatives, name: "Provide alternatives for charts, maps and CAPTCHAs", match: [complex-image-description]}
      - {id: wcag-text-alternatives-icon-and-svg-accessible-names, name: "Name icon buttons and SVG icons accessibly", match: [icon-accessible-name]}
  - id: wcag-time-based-media
    name: "WCAG 1.2 Time-based media"
    source: "WCAG 2.2 guideline 1.2"
    match: [wcag-time-based-media]
    subtopics:
      - {id: wcag-time-based-media-captions-and-transcripts, name: "Provide captions and transcripts", match: [captions-wcag]}
      - {id: wcag-time-based-media-audio-description, name: "Add audio description for video", match: [audio-description]}
      - {id: wcag-time-based-media-media-player-accessibility, name: "Make custom media players accessible", match: [accessible-media-player]}
  - id: wcag-adaptable
    name: "WCAG 1.3 Adaptable"
    source: "WCAG 2.2 guideline 1.3"
    match: [wcag-adaptable]
    subtopics:
      - {id: wcag-adaptable-semantic-html-structure, name: "Use semantic HTML for structure and relationships", match: [semantic-html]}
      - {id: wcag-adaptable-orientation-and-input-purpose, name: "Support orientation and identify input purpose", match: [identify-input-purpose]}
      - {id: wcag-adaptable-meaningful-sequence-and-sensory, name: "Keep meaningful sequence and avoid sensory-only instructions", match: [meaningful-sequence]}
  - id: wcag-distinguishable
    name: "WCAG 1.4 Distinguishable"
    source: "WCAG 2.2 guideline 1.4"
    match: [wcag-distinguishable]
    subtopics:
      - {id: wcag-distinguishable-colour-contrast-thresholds, name: "Meet text and non-text contrast ratios", match: [colour-contrast]}
      - {id: wcag-distinguishable-use-of-colour-and-text-resize, name: "Do not use colour alone; support resize and reflow", match: [use-of-colour]}
      - {id: wcag-distinguishable-text-spacing-and-hover-content, name: "Tolerate text spacing overrides; manage hover/focus content", match: [text-spacing-wcag]}
  - id: wcag-keyboard
    name: "WCAG 2.1 Keyboard accessible"
    source: "WCAG 2.2 guideline 2.1"
    match: [wcag-keyboard]
    subtopics:
      - {id: wcag-keyboard-keyboard-operability-audit, name: "Audit full keyboard operability and no traps", match: [keyboard-operability]}
      - {id: wcag-keyboard-focus-visible-and-not-obscured, name: "Make focus visible and not hidden by sticky UI", match: [focus-visible]}
      - {id: wcag-keyboard-skip-links-and-bypass-blocks, name: "Add skip links and bypass blocks", match: [skip-link]}
  - id: wcag-enough-time
    name: "WCAG 2.2 Enough time and 2.3 seizures"
    source: "WCAG 2.2 guidelines 2.2 and 2.3"
    match: [wcag-enough-time]
    subtopics:
      - {id: wcag-enough-time-timeouts-and-moving-content, name: "Handle time limits, auto-updating and moving content", match: [timing-adjustable]}
      - {id: wcag-enough-time-flashing-and-motion, name: "Avoid flashing content and honour reduced motion", match: [three-flashes]}
  - id: wcag-navigable
    name: "WCAG 2.4 Navigable"
    source: "WCAG 2.2 guideline 2.4"
    match: [wcag-navigable]
    subtopics:
      - {id: wcag-navigable-page-titles-headings-link-purpose, name: "Write page titles, headings and link text", match: [page-titled]}
      - {id: wcag-navigable-multiple-ways-and-consistent-navigation, name: "Provide multiple ways and consistent navigation", match: [multiple-ways]}
  - id: wcag-input-modalities
    name: "WCAG 2.5 Input modalities"
    source: "WCAG 2.2 guideline 2.5"
    match: [wcag-input-modalities]
    subtopics:
      - {id: wcag-input-modalities-target-size-and-pointer-gestures, name: "Meet target size and pointer gesture requirements", match: [target-size-minimum]}
      - {id: wcag-input-modalities-label-in-name-and-motion-actuation, name: "Match visible label and accessible name; offer motion alternatives", match: [label-in-name]}
  - id: wcag-readable-predictable
    name: "WCAG 3.1 Readable and 3.2 Predictable"
    source: "WCAG 2.2 guidelines 3.1 and 3.2"
    match: [wcag-readable-predictable]
    subtopics:
      - {id: wcag-readable-predictable-language-of-page-and-parts, name: "Declare page language and language changes", match: [language-of-page]}
      - {id: wcag-readable-predictable-predictable-focus-and-input, name: "Avoid unexpected context changes on focus or input", match: [on-focus-on-input]}
  - id: wcag-input-assistance
    name: "WCAG 3.3 Input assistance"
    source: "WCAG 2.2 guideline 3.3"
    match: [wcag-input-assistance]
    subtopics:
      - {id: wcag-input-assistance-accessible-form-labels-and-errors, name: "Build accessible labels, instructions and error handling", match: [accessible-form-errors]}
      - {id: wcag-input-assistance-redundant-entry-and-accessible-authentication, name: "Avoid redundant entry; make authentication accessible", match: [redundant-entry]}
      - {id: wcag-input-assistance-error-prevention-legal-financial, name: "Add reversibility to legal and financial submissions", match: [error-prevention-legal]}
  - id: wcag-robust-aria
    name: "WCAG 4.1 Robust and ARIA fundamentals"
    source: "WCAG 2.2 guideline 4.1; WAI-ARIA 1.2"
    match: [wcag-robust-aria]
    subtopics:
      - {id: wcag-robust-aria-name-role-value-and-aria-rules, name: "Apply name, role, value and the five rules of ARIA", match: [name-role-value]}
      - {id: wcag-robust-aria-status-messages-live-regions, name: "Announce status messages with live regions", match: [status-messages]}
      - {id: wcag-robust-aria-aria-states-properties-usage, name: "Use ARIA states and properties correctly", match: [aria-expanded]}
  - id: aria-apg-patterns
    name: "ARIA Authoring Practices patterns"
    source: "W3C ARIA APG patterns"
    match: [aria-apg-patterns]
    subtopics:
      - {id: aria-apg-patterns-apg-dialog-modal, name: "Build an accessible modal dialog", match: [apg-dialog-modal]}
      - {id: aria-apg-patterns-apg-tabs-accordion-disclosure, name: "Implement tabs, accordion and disclosure patterns", match: [apg-tabs]}
      - {id: aria-apg-patterns-apg-combobox-menu-button, name: "Implement combobox, listbox and menu button patterns", match: [apg-combobox]}
      - {id: aria-apg-patterns-apg-keyboard-interaction-model, name: "Use roving tabindex and aria-activedescendant", match: [roving-tabindex]}
  - id: wcag-testing-conformance
    name: "Accessibility testing and conformance"
    source: "WCAG conformance requirements; WCAG-EM"
    match: [wcag-testing-conformance]
    subtopics:
      - {id: wcag-testing-conformance-automated-accessibility-testing, name: "Run automated accessibility tests (axe, Lighthouse)", match: [axe-core]}
      - {id: wcag-testing-conformance-manual-screen-reader-testing, name: "Test with screen readers and keyboard", match: [screen-reader-testing]}
      - {id: wcag-testing-conformance-wcag-conformance-claims-and-vpat, name: "Write conformance statements and VPAT/ACR reports", match: [vpat-acr]}
      - {id: wcag-testing-conformance-accessibility-audit-wcag-em, name: "Run an accessibility audit with WCAG-EM", match: [wcag-em]}
  - id: id-forms
    name: "Form design"
    source: "NN/g form design articles; WCAG 3.3"
    match: [id-forms]
    subtopics:
      - {id: id-forms-form-layout-single-column, name: "Lay out forms in a single column with top-aligned labels", match: [form-layout]}
      - {id: id-forms-inline-validation-timing, name: "Time inline validation to avoid premature errors", match: [inline-validation]}
      - {id: id-forms-form-input-types-and-autofill, name: "Pick input types, inputmode and autocomplete", match: [input-types-inputmode]}
      - {id: id-forms-form-error-recovery-long-forms, name: "Design long forms and checkout with save and review", match: [long-form-design]}
  - id: id-navigation-ia
    name: "Navigation and information architecture"
    source: "NN/g IA and navigation articles"
    match: [id-navigation-ia]
    subtopics:
      - {id: id-navigation-ia-navigation-pattern-selection, name: "Choose navigation patterns by site size and device", match: [navigation-patterns]}
      - {id: id-navigation-ia-information-architecture-card-sort-to-sitemap, name: "Derive information architecture from content and research", match: [information-architecture]}
      - {id: id-navigation-ia-search-and-filter-design, name: "Design site search, facets and filters", match: [search-ux]}
  - id: id-feedback-microinteractions
    name: "Feedback and microinteractions"
    source: "Saffer, Microinteractions; Material motion; NN/g animation"
    match: [id-feedback-microinteractions]
    subtopics:
      - {id: id-feedback-microinteractions-microinteraction-structure, name: "Design microinteractions: trigger, rules, feedback, loops", match: [microinteractions]}
      - {id: id-feedback-microinteractions-animation-purpose-and-timing, name: "Use animation for continuity with sensible timing and easing", match: [ui-animation-timing]}
      - {id: id-feedback-microinteractions-loading-states-skeleton-screens, name: "Use skeleton screens, spinners and progress appropriately", match: [skeleton-screens]}
  - id: id-laws-of-ux
    name: "Laws of UX and human performance"
    source: "Fitts 1954; Hick 1952; Miller 1956; lawsofux.com"
    match: [id-laws-of-ux]
    subtopics:
      - {id: id-laws-of-ux-fitts-law-target-design, name: "Apply Fitts's law to target size and placement", match: [fitts-law]}
      - {id: id-laws-of-ux-hicks-law-and-choice-overload, name: "Apply Hick's law and manage choice overload", match: [hicks-law]}
      - {id: id-laws-of-ux-cognitive-load-and-chunking, name: "Manage cognitive load through chunking and familiarity", match: [cognitive-load]}
  - id: id-affordances
    name: "Affordances, signifiers and feedback"
    source: "Norman, The Design of Everyday Things"
    match: [id-affordances]
    subtopics:
      - {id: id-affordances-affordances-signifiers-mapping, name: "Use affordances, signifiers and natural mapping", match: [affordances-signifiers]}
      - {id: id-affordances-gulf-of-execution-evaluation, name: "Diagnose usability issues with the gulfs of execution and evaluation", match: [gulf-of-execution]}
  - id: id-responsive-touch
    name: "Responsive and touch interaction"
    source: "NN/g mobile UX; WCAG 1.4.10, 2.5"
    match: [id-responsive-touch]
    subtopics:
      - {id: id-responsive-touch-responsive-breakpoints-and-content-first, name: "Design responsively from content, not device widths", match: [responsive-design]}
      - {id: id-responsive-touch-touch-gestures-and-thumb-zones, name: "Design touch gestures and thumb-reachable layouts", match: [touch-gestures]}
  - id: ur-hcd-process
    name: "Human-centred design process"
    source: "ISO 9241-210"
    match: [ur-hcd-process]
    subtopics:
      - {id: ur-hcd-process-iso-9241-210-hcd-activities, name: "Run the ISO 9241-210 human-centred design cycle", match: [iso-9241-210]}
      - {id: ur-hcd-process-iso-9241-11-usability-definition, name: "Measure usability as effectiveness, efficiency and satisfaction", match: [iso-9241-11]}
      - {id: ur-hcd-process-context-of-use-and-stakeholders, name: "Capture context of use and stakeholders", match: [context-of-use]}
  - id: ur-interviews
    name: "User interviews and field methods"
    source: "NN/g user interviews; contextual inquiry"
    match: [ur-interviews]
    subtopics:
      - {id: ur-interviews-user-interview-guide, name: "Write and run a semi-structured user interview", match: [user-interviews]}
      - {id: ur-interviews-contextual-inquiry-field-studies, name: "Observe users in context with contextual inquiry", match: [contextual-inquiry]}
      - {id: ur-interviews-diary-studies, name: "Plan and run a diary study", match: [diary-study]}
  - id: ur-usability-testing
    name: "Usability testing"
    source: "NN/g usability testing 101"
    match: [ur-usability-testing]
    subtopics:
      - {id: ur-usability-testing-usability-test-plan-and-tasks, name: "Plan a usability test with realistic tasks", match: [usability-test-plan]}
      - {id: ur-usability-testing-moderated-testing-and-think-aloud, name: "Moderate sessions and use think-aloud", match: [moderated-usability-testing]}
      - {id: ur-usability-testing-remote-unmoderated-testing, name: "Run remote moderated and unmoderated tests", match: [remote-usability-testing]}
      - {id: ur-usability-testing-analysing-usability-findings, name: "Synthesise usability findings into prioritised fixes", match: [usability-synthesis]}
  - id: ur-surveys-metrics
    name: "Surveys and standardised questionnaires"
    source: "NN/g surveys; Brooke SUS; UEQ"
    match: [ur-surveys-metrics]
    subtopics:
      - {id: ur-surveys-metrics-sus-questionnaire-scoring, name: "Administer and score the System Usability Scale", match: [system-usability-scale]}
      - {id: ur-surveys-metrics-survey-design-questions, name: "Write unbiased survey questions and sample properly", match: [survey-design]}
      - {id: ur-surveys-metrics-task-metrics-and-confidence-intervals, name: "Report task success and time with confidence intervals", match: [task-success-rate]}
  - id: ur-ia-research
    name: "Card sorting and tree testing"
    source: "NN/g card sorting; tree testing"
    match: [ur-ia-research]
    subtopics:
      - {id: ur-ia-research-card-sorting-open-closed, name: "Run open, closed and hybrid card sorts", match: [card-sorting]}
      - {id: ur-ia-research-tree-testing, name: "Validate findability with tree testing", match: [tree-testing]}
  - id: ur-quant-experiments
    name: "Analytics and A/B testing"
    source: "NN/g A/B testing; Kohavi, Trustworthy Online Controlled Experiments"
    match: [ur-quant-experiments]
    subtopics:
      - {id: ur-quant-experiments-ab-testing-ux-pitfalls, name: "Design UX A/B tests and avoid common pitfalls", match: [ab-testing-ux]}
      - {id: ur-quant-experiments-analytics-funnels-and-heatmaps, name: "Use analytics, funnels and heatmaps as evidence", match: [funnel-analysis]}
  - id: ur-personas-journeys
    name: "Personas, journey maps and service blueprints"
    source: "NN/g personas, journey mapping"
    match: [ur-personas-journeys]
    subtopics:
      - {id: ur-personas-journeys-persona-creation-from-research, name: "Create evidence-based personas", match: [user-personas]}
      - {id: ur-personas-journeys-journey-mapping-and-blueprints, name: "Build journey maps and service blueprints", match: [journey-mapping]}
      - {id: ur-personas-journeys-jobs-to-be-done-and-user-stories, name: "Frame needs with jobs-to-be-done and user stories", match: [jobs-to-be-done]}
  - id: ds-tokens
    name: "Design tokens"
    source: "Design Tokens Community Group format"
    match: [ds-tokens]
    subtopics:
      - {id: ds-tokens-design-token-structure-dtcg, name: "Structure design tokens in the DTCG format", match: [design-tokens-format]}
      - {id: ds-tokens-token-tiers-primitive-semantic-component, name: "Layer tokens: primitive, semantic, component", match: [token-tiers]}
      - {id: ds-tokens-style-dictionary-token-pipeline, name: "Transform tokens into platform outputs with Style Dictionary", match: [style-dictionary]}
  - id: ds-components
    name: "Component library design"
    source: "Design system documentation practice"
    match: [ds-components]
    subtopics:
      - {id: ds-components-component-api-design, name: "Design component APIs: props, variants, slots", match: [component-api]}
      - {id: ds-components-component-documentation-guidelines, name: "Document components with usage, a11y and code", match: [component-documentation]}
      - {id: ds-components-visual-regression-testing-components, name: "Test component libraries with visual regression and a11y checks", match: [visual-regression-testing]}
  - id: ds-governance
    name: "Design system governance and versioning"
    source: "Design system practice"
    match: [ds-governance]
    subtopics:
      - {id: ds-governance-design-system-versioning-and-deprecation, name: "Version and deprecate with semantic versioning", match: [semver-design-system]}
      - {id: ds-governance-design-system-contribution-model, name: "Run a contribution and governance model", match: [contribution-model]}
  - id: ds-theming
    name: "Theming and dark mode"
    source: "Material 3 colour roles; CSS custom properties"
    match: [ds-theming]
    subtopics:
      - {id: ds-theming-css-variables-theming-dark-mode, name: "Implement themes and dark mode with CSS custom properties", match: [css-custom-properties-theming]}
      - {id: ds-theming-accessible-colour-palettes, name: "Generate accessible colour scales", match: [accessible-colour-palette]}
  - id: ds-a11y-in-systems
    name: "Accessibility in design systems"
    source: "WCAG; APG; design-system practice"
    match: [ds-a11y-in-systems]
    subtopics:
      - {id: ds-a11y-in-systems-accessible-component-specs, name: "Specify accessibility in component specs", match: [a11y-annotations]}
      - {id: ds-a11y-in-systems-focus-and-state-styles-system, name: "Standardise focus, hover and disabled states", match: [focus-ring-token]}
  - id: pg-apple-hig
    name: "Apple Human Interface Guidelines"
    source: "Apple HIG"
