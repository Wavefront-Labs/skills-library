# Coverage spec for Apache APISIX (computing-software / cloud-infrastructure-engineering).
subject: Apache APISIX
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [apache-apisix]
sources:
  - "Apache APISIX documentation (https://github.com/apache/apisix/tree/master/docs/en/latest)"
topics:
  - id: limit-count-quota
    name: "limit-count quota"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/limit-count.md
    match: ["limit-count", "rate-limiting", "quota"]
  - id: limit-count-redis-policy
    name: "limit-count Redis policies"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/limit-count.md
    match: ["redis", "redis-cluster", "redis-sentinel", "policy"]
  - id: limit-req-leaky-bucket
    name: "limit-req leaky bucket"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/limit-req.md
    match: ["limit-req", "leaky-bucket", "nodelay"]
  - id: limit-conn-concurrency
    name: "limit-conn concurrency"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/limit-conn.md
    match: ["limit-conn", "concurrency"]
  - id: key-auth-setup
    name: "key-auth setup"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/key-auth.md
    match: ["key-auth", "api-key"]
  - id: jwt-auth-setup
    name: "jwt-auth setup"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/jwt-auth.md
    match: ["jwt-auth", "jwt"]
  - id: basic-auth-setup
    name: "basic-auth setup"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/basic-auth.md
    match: ["basic-auth"]
  - id: hmac-auth-signature
    name: "hmac-auth signature"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/hmac-auth.md
    match: ["hmac-auth", "hmac", "signature"]
  - id: proxy-rewrite-uri
    name: "proxy-rewrite URI"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/proxy-rewrite.md
    match: ["proxy-rewrite", "regex-uri", "uri"]
  - id: proxy-rewrite-headers
    name: "proxy-rewrite headers"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/proxy-rewrite.md
    match: ["request-headers", "headers"]
  - id: response-rewrite-body-headers
    name: "response-rewrite"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/response-rewrite.md
    match: ["response-rewrite", "response-headers", "filters"]
  - id: cors-plugin
    name: "cors plugin"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/cors.md
    match: ["cors", "allow-origins", "preflight"]
  - id: ip-restriction
    name: "ip-restriction"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/ip-restriction.md
    match: ["ip-restriction", "whitelist", "cidr"]
  - id: ua-restriction
    name: "ua-restriction"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/ua-restriction.md
    match: ["ua-restriction", "user-agent", "denylist"]
  - id: consumer-restriction
    name: "consumer-restriction"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/consumer-restriction.md
    match: ["consumer-restriction", "allowed-by-methods"]
  - id: uri-blocker
    name: "uri-blocker"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/uri-blocker.md
    match: ["uri-blocker", "block-rules"]
  - id: csrf-protection
    name: "csrf protection"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/csrf.md
    match: ["csrf", "csrf-token"]
  - id: prometheus-metrics-export
    name: "Prometheus metrics export"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/prometheus.md
    match: ["prometheus", "metrics", "export-server"]
  - id: prometheus-labels-metadata
    name: "Prometheus labels and metadata"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/prometheus.md
    match: ["extra-labels", "disabled-labels", "cardinality"]
  - id: public-api-exposure
    name: "public-api exposure"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/public-api.md
    match: ["public-api", "internal-endpoint"]
  - id: redirect-plugin
    name: "redirect plugin"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/redirect.md
    match: ["redirect", "http-to-https", "ret-code"]
  - id: request-id-plugin
    name: "request-id plugin"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/request-id.md
    match: ["request-id", "correlation-id", "ksuid"]
  - id: proxy-cache-config
    name: "proxy-cache config"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/proxy-cache.md
    match: ["proxy-cache", "caching", "cache-zone"]
  - id: proxy-mirror-traffic
    name: "proxy-mirror traffic"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/proxy-mirror.md
    match: ["proxy-mirror", "traffic-mirroring", "sample-ratio"]
  - id: api-breaker-circuit
    name: "api-breaker circuit breaker"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/api-breaker.md
    match: ["api-breaker", "circuit-breaker"]
  - id: traffic-split-canary
    name: "traffic-split canary"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/traffic-split.md
    match: ["traffic-split", "canary", "weighted-upstreams"]
  - id: fault-injection-plugin
    name: "fault-injection"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/fault-injection.md
    match: ["fault-injection", "chaos", "abort"]
  - id: mocking-plugin
    name: "mocking plugin"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/mocking.md
    match: ["mocking", "mock-response"]
  - id: gzip-compression
    name: "gzip compression"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/gzip.md
    match: ["gzip", "compression"]
  - id: http-logger-plugin
    name: "http-logger"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/http-logger.md
    match: ["http-logger", "log-format", "batch-processor"]
  - id: kafka-logger-plugin
    name: "kafka-logger"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/kafka-logger.md
    match: ["kafka-logger", "kafka", "sasl"]
  - id: zipkin-tracing
    name: "zipkin tracing"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/zipkin.md
    match: ["zipkin", "span-version", "jaeger"]
  - id: opentelemetry-tracing
    name: "opentelemetry tracing"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/opentelemetry.md
    match: ["opentelemetry", "otel", "sampler"]
  - id: forward-auth-plugin
    name: "forward-auth"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/forward-auth.md
    match: ["forward-auth", "external-auth", "auth-service"]
  - id: request-validation-schema
    name: "request-validation"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/request-validation.md
    match: ["request-validation", "json-schema", "body-schema"]
  - id: openid-connect-plugin
    name: "openid-connect"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/openid-connect.md
    match: ["openid-connect", "oidc", "bearer-only"]
  - id: grpc-transcode-plugin
    name: "grpc-transcode"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/plugins/grpc-transcode.md
    match: ["grpc-transcode", "grpc", "protobuf"]
  - id: admin-api-access
    name: "Admin API access and methods"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/admin-api.md
    match: ["admin-api", "x-api-key", "pagination", "allow-admin"]
  - id: admin-api-route-attributes
    name: "Route attributes"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/admin-api.md
    match: ["route", "uris", "hosts", "enable-websocket"]
  - id: admin-api-upstream-attributes
    name: "Upstream attributes"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/admin-api.md
    match: ["upstream", "load-balancing", "chash", "pass-host"]
  - id: deploy-traditional-mode
    name: "Traditional deployment mode"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/deployment-modes.md
    match: ["traditional", "deployment-modes", "etcd"]
  - id: deploy-decoupled-mode
    name: "Decoupled deployment mode"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/deployment-modes.md
    match: ["decoupled", "data-plane", "control-plane"]
  - id: deploy-standalone-mode
    name: "Standalone deployment mode"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/deployment-modes.md
    match: ["standalone", "apisix-yaml", "no-etcd"]
  - id: health-check-active
    name: "Active health checks"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/tutorials/health-check.md
    match: ["health-check", "active-health-check", "probe"]
  - id: health-check-passive
    name: "Passive health checks"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/tutorials/health-check.md
    match: ["passive-health-check", "circuit-breaking"]
  - id: stream-proxy-enable
    name: "Enable stream proxy"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/stream-proxy.md
    match: ["stream-proxy", "tcp", "udp", "proxy-mode"]
  - id: stream-route-matching
    name: "Stream route matching"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/stream-proxy.md
    match: ["stream-routes", "sni", "tls-passthrough"]
  - id: mtls-client-to-apisix
    name: "mTLS client to APISIX"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/mtls.md
    match: ["mtls", "client-certificate", "admin-api-mtls"]
  - id: mtls-apisix-to-upstream
    name: "mTLS APISIX to upstream"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/mtls.md
    match: ["upstream-tls", "client-cert"]
  - id: ssl-certificate-sni
    name: "SSL certificates and SNI"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/certificate.md
    match: ["ssl", "certificate", "wildcard", "ssls"]
  - id: debug-mode-basic
    name: "Basic debug mode"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/debug-mode.md
    match: ["debug-mode", "debug-yaml", "apisix-plugins-header"]
  - id: debug-mode-hooks
    name: "Advanced debug hooks"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/debug-mode.md
    match: ["hook-conf", "dynamic-debug"]
  - id: control-api-endpoints
    name: "Control API endpoints"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/control-api.md
    match: ["control-api", "healthcheck", "plugins-reload"]
  - id: router-uri-matching
    name: "Router URI matching"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/router-radixtree.md
    match: ["router", "radixtree", "uri-matching"]
  - id: apisix-variables
    name: "APISIX variables"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/apisix-variable.md
    match: ["variables", "consumer-name", "balancer-ip"]
  - id: global-rule-resource
    name: "Global Rule"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/terminology/global-rule.md
    match: ["global-rules", "global-plugins"]
  - id: plugin-config-reuse
    name: "Plugin Config"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/terminology/plugin-config.md
    match: ["plugin-config", "plugin-configs"]
  - id: secret-references
    name: "Secret references"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/terminology/secret.md
    match: ["secrets", "vault", "secret-manager"]
  - id: consumer-group-shared-plugins
    name: "Consumer Group"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/terminology/consumer-group.md
    match: ["consumer-group", "group-id", "shared-quota"]
  - id: plugin-meta-priority-filter
    name: "Plugin _meta and ordering"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/terminology/plugin.md
    match: ["plugin-order", "meta", "priority"]
  - id: discovery-dns
    name: "DNS discovery"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/discovery/dns.md
    match: ["dns", "srv", "service-discovery"]
  - id: discovery-consul
    name: "Consul discovery"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/discovery/consul.md
    match: ["consul", "fetch-interval"]
  - id: discovery-nacos
    name: "Nacos discovery"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/discovery/nacos.md
    match: ["nacos", "discovery-args", "namespace"]
  - id: discovery-kubernetes
    name: "Kubernetes discovery"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/discovery/kubernetes.md
    match: ["kubernetes", "namespace-selector", "endpoint-slices"]
  - id: nginx-config-snippets
    name: "NGINX configuration snippets"
    source: https://raw.githubusercontent.com/apache/apisix/master/docs/en/latest/customize-nginx-configuration.md
    match: ["nginx-config", "configuration-snippet", "nginx-conf"]
