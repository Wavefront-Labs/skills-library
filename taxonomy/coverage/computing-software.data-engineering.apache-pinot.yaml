# Coverage spec for Apache Pinot, from the official documentation (pinot-contrib/pinot-docs).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: apache-pinot
scope:
  category: computing-software
  field: data-engineering
  products: [apache-pinot]
sources:
  - "Apache Pinot documentation (pinot-contrib/pinot-docs, branch latest)"
topics:
  - id: cluster-architecture
    name: "Cluster architecture and Helix roles"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/architecture.md"
    match: [architecture, helix]
  - id: controller-periodic-tasks
    name: "Controller periodic tasks"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/cluster/controller.md"
    match: [periodic-tasks, retentionmanager]
  - id: broker-routing
    name: "Broker routing and hybrid federation"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/cluster/broker.md"
    match: [broker, federation]
  - id: server-process
    name: "Server process and startup"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/cluster/server.md"
    match: [startserver]
  - id: tenants
    name: "Tenants and instance tags"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/cluster/tenant.md"
    match: [tenant, addtenant]
  - id: ingestion-job-spec
    name: "Segment creation and ingestion job spec"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/table/segment/README.md"
    match: [ingestion-job-spec, launchdataingestionjob]
  - id: deep-store
    name: "Deep store and recovery"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/table/segment/deep-store.md"
    match: [deep-store, peer-download]
  - id: segment-retention
    name: "Segment retention"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/concepts/segment-retention.md"
    match: [retention]
  - id: flush-thresholds
    name: "Realtime segment flush thresholds"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/concepts/segment-threshold.md"
    match: [flush-threshold, segment-threshold]
  - id: time-boundary
    name: "Hybrid table time boundary"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/concepts/time-boundary.md"
    match: [time-boundary]
  - id: schema
    name: "Schema field specs"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/data-modeling/schema.md"
    match: [schema, datetimefieldspecs]
  - id: schema-evolution
    name: "Schema evolution"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/data-modeling/schema-evolution.md"
    match: [schema-evolution]
  - id: forward-index
    name: "Forward index and sorted columns"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/forward-index.md"
    match: [forward-index, sorted-column]
  - id: raw-compression
    name: "RAW forward index compression"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/forward-index.md"
    match: [compressioncodec, codecspec]
  - id: forward-index-disable
    name: "Disabling the forward index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/forward-index.md"
    match: [indexes-forward-disabled]
  - id: dictionary-index
    name: "Dictionary index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/dictionary-index.md"
    match: [dictionary-index, optimizedictionary]
  - id: inverted-index
    name: "Inverted index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/inverted-index.md"
    match: [inverted-index]
  - id: range-index
    name: "Range index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/range-index.md"
    match: [range-index]
  - id: bloom-filter
    name: "Bloom filter"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/bloom-filter.md"
    match: [bloom-filter]
  - id: fst-index
    name: "FST and IFST index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/fst-index.md"
    match: [fst-index, ifst]
  - id: timestamp-index
    name: "Timestamp index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/timestamp-index.md"
    match: [timestamp-index]
  - id: star-tree-index
    name: "Star-tree index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/star-tree-index.md"
    match: [star-tree-index]
  - id: star-tree-functions
    name: "Star-tree functions and predicates"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/star-tree-index.md"
    match: [predicate-support]
  - id: json-index
    name: "JSON index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/json-index.md"
    match: [json-index, json-match]
  - id: text-index
    name: "Text index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/text-search-support.md"
    match: [text-index, text-match]
  - id: geospatial
    name: "Geospatial and H3 index"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/indexing/geospatial-support.md"
    match: [geospatial, h3-index]
  - id: kafka-ingestion
    name: "Kafka ingestion"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/stream-ingestion/import-from-apache-kafka.md"
    match: [kafka, streamconfigs]
  - id: kinesis-ingestion
    name: "Kinesis ingestion"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/stream-ingestion/amazon-kinesis.md"
    match: [kinesis]
  - id: pulsar-ingestion
    name: "Pulsar ingestion"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/stream-ingestion/apache-pulsar.md"
    match: [pulsar]
  - id: upsert
    name: "Upsert modes and primary keys"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/upsert-and-dedup/upsert.md"
    match: [upsert, primarykeycolumns]
  - id: partial-upsert
    name: "Partial upsert strategies"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/upsert-and-dedup/upsert.md"
    match: [partial-upsert]
  - id: upsert-deletes-ttl
    name: "Upsert comparison columns, TTL and deletes"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/upsert-and-dedup/upsert.md"
    match: [comparisoncolumns, deleterecordcolumn]
  - id: dedup
    name: "Dedup"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/upsert-and-dedup/dedup.md"
    match: [dedup, dedupconfig]
  - id: upsert-compaction
    name: "Upsert segment compaction"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/ingestion/upsert-and-dedup/segment-compaction-on-upserts.md"
    match: [upsert-compaction]
  - id: multi-stage-engine
    name: "Multi-stage engine hints and mailboxes"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/querying-and-sql/multi-stage-query/hints.md"
    match: [multi-stage-engine, hints]
  - id: join-optimization
    name: "Optimizing joins"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/querying-and-sql/multi-stage-query/optimizing-joins.md"
    match: [optimizing-joins, semi-join]
  - id: query-options
    name: "Query options"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/querying-and-sql/query-execution-controls/query-options.md"
    match: [query-options]
  - id: query-quotas
    name: "Query quotas"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/querying-and-sql/query-execution-controls/query-quotas.md"
    match: [query-quota, maxqueriespersecond]
  - id: null-handling
    name: "Null handling"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/build-with-pinot/querying-and-sql/null-value-support.md"
    match: [null-handling]
  - id: minion-scheduling
    name: "Minion task scheduling"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/cluster/minion.md"
    match: [task-scheduling, minioninstancetag]
  - id: minion-metrics-plugins
    name: "Minion metrics and plugins"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/basics/components/cluster/minion.md"
    match: [taskgenerator, task-metrics-emitter]
  - id: merge-rollup
    name: "Merge-rollup task"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/minion-merge-rollup-task.md"
    match: [merge-rollup, mergerolluptask]
  - id: purge-task
    name: "Purge task"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/purge-task.md"
    match: [purge-task, recordpurger]
  - id: realtime-to-offline
    name: "Realtime-to-offline task"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/pinot-managed-offline-flows.md"
    match: [realtime-to-offline]
  - id: rebalance
    name: "Rebalancing servers"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/rebalance/rebalance-servers/README.md"
    match: [rebalance, queries-disable]
  - id: instance-assignment
    name: "Instance assignment"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/instance-assignment.md"
    match: [instance-assignment]
  - id: segment-assignment
    name: "Segment assignment"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/segment-assignment.md"
    match: [segment-assignment, replica-group]
  - id: segment-reload
    name: "Segment reload"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/segment-reload.md"
    match: [segment-reload]
  - id: consistent-push
    name: "Consistent push and rollback"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/consistent-push-and-rollback.md"
    match: [consistent-push, segment-lineage]
  - id: tiers-tenants
    name: "Tiered storage across tenants"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/separating-data-storage-by-age/moving-segments-across-tenants.md"
    match: [tierconfigs, tiered-storage]
  - id: tiers-directories
    name: "Tiered storage with multiple directories"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/separating-data-storage-by-age/using-multiple-directories.md"
    match: [tierbased]
  - id: routing-pruning
    name: "Routing and segment pruning"
    source: "https://github.com/pinot-contrib/pinot-docs/blob/latest/operate-pinot/tuning/routing.md"
    match: [segment-pruning, segmentprunertypes]
