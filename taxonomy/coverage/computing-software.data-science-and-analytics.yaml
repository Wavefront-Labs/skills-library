# Canonical coverage spec: Data Science & Analytics (whole field).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: data-science-and-analytics
scope:
  category: computing-software
  field: data-science-and-analytics
  products: [pandas-numpy, statistics-for-practitioners, jupyter-notebooks, data-visualization, experiment-design, bi-tools]
sources:
  - "pandas documentation user guide (pandas.pydata.org/docs/user_guide) - IO tools, indexing, missing data, groupby, merge/join, reshaping, time series, text, categoricals, scaling to large datasets, enhancing performance"
  - "NumPy documentation user guide (numpy.org/doc/stable/user) - array creation, indexing, broadcasting, ufuncs, linear algebra, random Generator, structured arrays"
  - "SciPy reference guide (docs.scipy.org/doc/scipy/reference) - scipy.stats distributions and tests, optimize, interpolate, signal"
  - "statsmodels documentation (statsmodels.org/stable) - regression and linear models, GLM, time series, multiple testing, power"
  - "Jupyter documentation (docs.jupyter.org) and IPython documentation (ipython.readthedocs.io) - magics, kernels, nbformat, nbconvert, widgets; papermill and nbstripout docs"
  - "matplotlib documentation (matplotlib.org/stable) - usage guide, tutorials, gallery, styling, constrained layout, saving; seaborn and Plotly Python documentation"
  - "Trustworthy Online Controlled Experiments (Kohavi, Tang and Xu) chapters - experimentation basics, metrics, sample ratio mismatch, variance reduction, ethics; Causal Inference The Mixtape and Hernan and Robins What If chapter lists"
  - "Tableau Desktop help (help.tableau.com) - data sources and joins, calculations, level of detail expressions, table calculations, parameters, dashboards, extracts"
  - "Microsoft Power BI documentation (learn.microsoft.com/power-bi) and DAX reference (learn.microsoft.com/dax) - data modelling, DAX, Power Query, refresh, row-level security, deployment pipelines"
  - "Exam guides used as outlines - Microsoft PL-300 Power BI Data Analyst skills measured; Tableau Desktop Specialist exam guide"
topics:
  - id: pd-structures
    name: "Series, DataFrame and dtypes"
    source: "pandas user guide - Intro to data structures; Essential basic functionality"
    match: [pd-structures]
    subtopics:
      - {id: pd-structures-dataframe-construction-and-inspection, name: "Build and inspect a DataFrame", match: [dataframe-construction]}
      - {id: pd-structures-dtype-conversion-nullable-types, name: "Convert dtypes and use nullable types", match: [dtype-conversion]}
      - {id: pd-structures-memory-reduction-downcasting, name: "Cut DataFrame memory with downcasting and category", match: [memory-reduction]}
  - id: pd-io
    name: "Reading and writing data"
    source: "pandas user guide - IO tools (text, CSV, HDF5, ...)"
    match: [pd-io]
    subtopics:
      - {id: pd-io-read-csv-robustly, name: "Read CSV files robustly", match: [read-csv-options]}
      - {id: pd-io-chunked-and-columnar-io, name: "Chunked reads and Parquet", match: [chunked-reading]}
      - {id: pd-io-excel-and-database-io, name: "Read Excel and SQL into pandas", match: [read-excel]}
  - id: pd-indexing
    name: "Selection, indexing and filtering"
    source: "pandas user guide - Indexing and selecting data; MultiIndex"
    match: [pd-indexing]
    subtopics:
      - {id: pd-indexing-loc-iloc-boolean-selection, name: "Select with loc, iloc and boolean masks", match: [loc-iloc]}
      - {id: pd-indexing-avoid-setting-with-copy, name: "Avoid SettingWithCopy and chained assignment", match: [setting-with-copy]}
      - {id: pd-indexing-multiindex-and-set-index, name: "Work with set_index and MultiIndex", match: [multiindex]}
  - id: pd-missing
    name: "Missing data and duplicates"
    source: "pandas user guide - Working with missing data; duplicate labels"
    match: [pd-missing]
    subtopics:
      - {id: pd-missing-detect-and-fill-missing, name: "Detect and impute missing values", match: [missing-values]}
      - {id: pd-missing-deduplicate-records, name: "Find and drop duplicate rows", match: [drop-duplicates]}
  - id: pd-groupby
    name: "Group by, aggregate and window"
    source: "pandas user guide - Group by: split-apply-combine; Windowing operations"
    match: [pd-groupby]
    subtopics:
      - {id: pd-groupby-groupby-named-aggregation, name: "Aggregate with groupby named aggregation", match: [groupby-agg]}
      - {id: pd-groupby-groupby-transform-filter, name: "Group-wise transform, filter and rank", match: [groupby-transform]}
      - {id: pd-groupby-rolling-expanding-windows, name: "Rolling and expanding window calculations", match: [rolling-window]}
  - id: pd-merge
    name: "Merge, join and concatenate"
    source: "pandas user guide - Merge, join, concatenate and compare"
    match: [pd-merge]
    subtopics:
      - {id: pd-merge-merge-join-validation, name: "Merge with validation and indicators", match: [pandas-merge]}
      - {id: pd-merge-concat-and-asof-merge, name: "Concatenate frames and merge_asof", match: [pandas-concat]}
  - id: pd-reshape
    name: "Reshaping and pivoting"
    source: "pandas user guide - Reshaping and pivot tables; Melt; Stack and unstack"
    match: [pd-reshape]
    subtopics:
      - {id: pd-reshape-pivot-table-crosstab, name: "Pivot tables and crosstabs", match: [pivot-table]}
      - {id: pd-reshape-melt-stack-wide-long, name: "Convert wide to long with melt and stack", match: [melt-wide-to-long]}
      - {id: pd-reshape-explode-and-json-normalize, name: "Explode lists and flatten nested JSON", match: [explode-lists]}
  - id: pd-timeseries
    name: "Time series and dates"
    source: "pandas user guide - Time series / date functionality; Time deltas"
    match: [pd-timeseries]
    subtopics:
      - {id: pd-timeseries-resample-and-frequency, name: "Resample time series to a new frequency", match: [resample]}
      - {id: pd-timeseries-timezones-and-parsing, name: "Handle time zones and date parsing", match: [tz-localize]}
      - {id: pd-timeseries-shift-lag-diff-pct-change, name: "Lags, differences and growth rates", match: [shift-lag]}
  - id: pd-text-categorical
    name: "Strings and categoricals"
    source: "pandas user guide - Working with text data; Categorical data"
    match: [pd-text-categorical]
    subtopics:
      - {id: pd-text-categorical-string-methods-regex-cleaning, name: "Clean text columns with str methods and regex", match: [str-accessor]}
      - {id: pd-text-categorical-categorical-ordered-data, name: "Use categorical dtype and ordered categories", match: [categorical-dtype]}
  - id: pd-performance
    name: "Performance and scaling pandas"
    source: "pandas user guide - Enhancing performance; Scaling to large datasets"
    match: [pd-performance]
    subtopics:
      - {id: pd-performance-vectorise-instead-of-apply, name: "Vectorise instead of iterrows and apply", match: [vectorization]}
      - {id: pd-performance-scale-beyond-memory, name: "Scale past memory limits", match: [larger-than-memory]}
  - id: np-arrays
