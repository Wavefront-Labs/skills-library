# Canonical coverage spec: fashion design (all products in the fashion-design field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (fashion BA curricula, standard textbooks'
# tables of contents, CLO 3D / Browzwear manual ToCs, tech-pack and textile test standards),
# so the check measures the library against the subject, not itself.
# Scope note: production pattern drafting, grading for production, sewing, shoemaking and millinery
# making live in handcrafts (pattern-drafting, garment-line-sewing, shoemaking, millinery). Here the
# topics are the DESIGNER's tasks: research, form on the stand, drawing, surface, spec and 3D.
subject: fashion-design
scope:
  category: creative-arts
  field: fashion-design
  products: [collection-design, fashion-illustration, draping, textile-and-print-design, knitwear-design, footwear-design, accessory-design, clo-3d]
sources:
  - "Central Saint Martins BA Fashion / Parsons BFA Fashion Design / FIT BFA Fashion Design curricula - research and sketchbook, design development, collection development, fashion drawing, draping, CAD, textiles for fashion, knitwear, footwear and accessories, portfolio, line development, sustainability"
  - "Sorger and Udale, The Fundamentals of Fashion Design (3rd ed.) chapters - research, design development, fabric and colour, construction, collections, career/portfolio"
  - "Renfrew and Renfrew, Developing a Collection (Basics Fashion Design) chapters - research, concept, design, range planning, editing, presentation"
  - "Kiisel, Draping - The Complete Course (2nd ed.) chapter list - tools and dress form, muslin preparation, bodice, darts and seams, princess, skirts, dresses, cowls, bias, collars, pleats/gathers, creative draping, knits, fitting"
  - "Armstrong, Patternmaking for Fashion Design (5th ed.) Part 3 draping chapters and fitting chapter; Aldrich, Metric Pattern Cutting for Womenswear (toile fitting, ease tables, size charts)"
  - "Abling, Fashion Sketchbook; Riegelman, 9 Heads; Szkutnicka, Technical Drawing for Fashion - croquis proportion, poses, garment drawing, flats, rendering, presentation"
  - "Kadolph, Textiles (12th ed.) chapters - fibres, yarns, fabric structures (woven, knit, nonwoven), dyeing and printing, finishes, care and performance; Briggs-Goode, Printed Textile Design; Fogg, Print in Fashion"
  - "Sissons, Basics Fashion Design - Knitwear; Shima Seiki / Stoll machine gauge documentation - yarn, stitch structures, gauges, shaping, colourwork, trims, knit specs"
  - "Choklat, Footwear Design; Motawi, How Shoes Are Made - lasts, shoe styles and anatomy, uppers, soles and heels, materials, construction methods"
  - "Genova, Accessory Design; Sharman, Handbags - bag design, hardware, leather, millinery, eyewear, jewellery, belts and small leather goods"
  - "CLO 3D online manual ToC (support.clo3d.com) - interface, 2D pattern tools, internal lines, arrangement, sewing, simulation, fabric property, avatar and avatar editor, fitting/fit map, trims (buttons, zippers, topstitch), graphics/texture, render, colorway, animation, grading, import/export, CLO-SET tech pack; Browzwear VStitcher docs ToC for equivalents"
  - "Tech-pack and production standards - ASTM D5585/D6240 size tables, ISO 8559 body dimensions, ASTM D5219 POM terminology, AATCC 135/150 dimensional change and AATCC 61/8/16 colourfastness, ISO 3758 care labelling, FTC Care Labeling Rule"
