    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/deno_json.md"
    match: [deno-json-include-exclude-exports, deno-json-permission-sets]
  - id: tasks-basics
    name: "Define and run tasks"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/cli/task.md"
    match: [task-define-and-run]
  - id: tasks-dependencies
    name: "Task dependencies and wildcards"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/cli/task.md"
    match: [task-dependencies-and-wildcards]
