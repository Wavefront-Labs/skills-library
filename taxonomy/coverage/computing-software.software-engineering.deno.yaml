    name: "Data URLs and deferred imports"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/fundamentals/modules.md"
    match: [modules-data-urls-and-deferred]
  - id: import-maps
    name: "Import map imports field"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/fundamentals/modules.md"
    match: [import-map-imports-field]
  - id: config-links-package-json
    name: "deno.json links and package.json"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/deno_json.md"
    match: [deno-json-links-and-package-json]
  - id: config-fmt-lint
    name: "deno.json fmt and lint options"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/deno_json.md"
    match: [deno-json-fmt-options, deno-json-lint-config]
