# Coverage spec: deno. Topics from the Deno runtime docs (denoland/docs, runtime/).
subject: deno
scope:
  category: computing-software
  field: software-engineering
  products: [deno]
sources:
  - "Deno runtime docs (github.com/denoland/docs/tree/main/runtime)"
topics:
  - id: permission-flags
    name: "Permission allow and deny flags"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-allow-deny-flags]
  - id: permission-file-system
    name: "File system permissions"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-file-system]
  - id: permission-network
    name: "Network permissions"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-network]
  - id: permission-env-sys
    name: "Env and system information permissions"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-env-and-sys]
  - id: permission-subprocess
    name: "Subprocess (run) permissions"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-run-subprocesses]
  - id: permission-ffi-import
    name: "FFI and import permissions"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-ffi-and-import]
  - id: permission-audit
    name: "Permission auditing and tracing"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-audit-and-trace]
  - id: permission-runtime-api
    name: "Permissions runtime API"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/reference/permissions.md"
    match: [permissions-runtime-api, permission-broker]
  - id: security-model
    name: "Security model and untrusted code"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/fundamentals/security.md"
    match: [security-model-principles, security-untrusted-code]
  - id: modules-esm
    name: "ES modules and file extensions"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/fundamentals/modules.md"
    match: [modules-esm-and-extensions]
  - id: modules-dynamic
    name: "Dynamic import and import.meta"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/fundamentals/modules.md"
    match: [modules-dynamic-import-and-meta]
  - id: modules-attributes
    name: "Import attributes"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/fundamentals/modules.md"
    match: [modules-import-attributes]
