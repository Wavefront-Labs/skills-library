  - id: packages-private
    name: "Private repositories"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/packages/private_repositories.md"
    match: [packages-private-repositories]
  - id: supply-chain-baseline
    name: "Supply chain baseline"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/packages/supply_chain.md"
