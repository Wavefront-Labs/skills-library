    name: "Writing and running tests"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/test/index.md"
    match: [test-writing-and-running]
  - id: test-steps-hooks
    name: "Test steps, timeouts, retries, test.each and hooks"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/test/index.md"
    match: [test-steps-timeouts-retries, test-each-and-hooks]
  - id: test-selection-permissions
    name: "Test selection, affected tests and per-test permissions"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/test/index.md"
    match: [test-selection-and-affected, test-per-test-permissions]
  - id: test-mocking
    name: "Mocking: spies, stubs and fake time"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/test/mocking.md"
    match: [test-spies-and-stubs, test-fake-time]
  - id: test-snapshots
    name: "Snapshot testing"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/test/snapshots.md"
    match: [test-snapshots]
  - id: test-coverage
    name: "Code coverage"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/test/coverage.md"
    match: [coverage-collect-and-report, coverage-include-exclude-ignore]
  - id: test-doc-sanitizers
    name: "Doc tests and sanitizers"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/test/doc_tests.md"  # sanitizers: runtime/test/sanitizers.md
