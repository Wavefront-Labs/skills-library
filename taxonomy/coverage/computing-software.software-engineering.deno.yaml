    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/packages/index.md"
    match: [packages-vendoring-and-overrides, packages-dev-dependencies-and-overrides-field]
  - id: packages-publish
    name: "Publish to JSR and npm"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/packages/publishing.md"
    match: [packages-publish-jsr-and-npm]
  - id: packages-peers
    name: "Peer dependencies"
    source: "https://raw.githubusercontent.com/denoland/docs/main/runtime/packages/peer_dependencies.md"
