# Canonical coverage spec: Fortinet FortiGate (FortiOS), Security Fabric and FortiManager.
# Topics come from external structures (NSE 4 FortiGate Administrator curriculum, FortiOS Administration Guide ToC, FortiManager guide).
subject: fortinet-fortios
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [fortinet-fortios]
sources:
  - "Fortinet NSE 4 FortiOS Administrator exam objectives: system and network settings, firewall policies and NAT, routing, firewall authentication, SSL inspection, security profiles, IPsec VPN, SSL VPN, SD-WAN, HA, Security Fabric, logging, diagnostics"
  - "docs.fortinet.com FortiOS Administration Guide table of contents: getting started, dashboards, network, system, policy and objects, security profiles, VPN, user and authentication, high availability, SD-WAN, Security Fabric, log and report, diagnostics"
  - "docs.fortinet.com FortiOS CLI Reference: config and diagnose command trees"
  - "docs.fortinet.com FortiManager Administration Guide: device manager, policy and objects, ADOMs, policy packages, installation, revision history"
topics:
  - {id: initial-setup, name: Initial setup of hostname time DNS and admin access, source: FortiOS admin guide - getting started, match: [fortigate-initial-setup]}
  - {id: admin-profiles, name: Administrator accounts profiles and trusted hosts, source: FortiOS admin guide - system administrators, match: [admin-profile]}
