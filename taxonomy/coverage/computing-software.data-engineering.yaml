# Canonical coverage spec: Data Engineering (whole field).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (certification exam guides, official docs
# tables of contents, DAMA-DMBOK knowledge areas, the Fundamentals of Data Engineering chapter list),
# not from what we happened to write, so the check measures the library against the subject.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (exam objective
# bullets, docs page headings, CLI/config reference groups, book chapter sub-sections).
subject: data-engineering
scope:
  category: computing-software
  field: data-engineering
  products: [apache-spark, apache-airflow, dbt, apache-kafka, snowflake, databricks, apache-flink, data-modelling, etl-pipeline-design, streaming-architecture, data-quality, data-warehouse-architecture]
sources:
  - "Databricks Certified Data Engineer Associate exam guide - Databricks Intelligence Platform; Development and Ingestion (notebooks, Databricks Connect, Auto Loader); Data Processing & Transformations (medallion, compute types, Lakeflow/DLT, Spark SQL/PySpark aggregations and joins); Productionizing Data Pipelines (Asset Bundles, Workflows/Jobs, repair and rerun, serverless); Data Governance & Quality (Unity Catalog, privileges, Delta Sharing, Lakehouse Federation, lineage, audit)"
  - "Databricks Certified Data Engineer Professional exam guide - Developing code for data processing (Delta MERGE, CDF, streaming, deduplication), Data ingestion and acquisition, Data transformation/cleansing/quality, Data sharing and federation, Monitoring and alerting (Spark UI, system tables, event logs, query profile), Cost and performance optimisation, Ensuring data security and compliance (row filters, column masks, dynamic views, PII), Data governance, Debugging and deploying (Asset Bundles, CI/CD, testing), Data modelling"
  - "Google Cloud Professional Data Engineer exam guide - 1 Designing data processing systems (security and compliance, reliability and fidelity, flexibility and portability, data migrations); 2 Ingesting and processing the data (planning pipelines, building pipelines, deploying and operationalising pipelines); 3 Storing the data; 4 Preparing and using data for analysis; 5 Maintaining and automating data workloads (resource optimisation, automation and repeatability, organising workloads, monitoring and troubleshooting, failure awareness)"
  - "Apache Spark docs ToC (spark.apache.org/docs/latest) - Cluster mode overview, Submitting applications, Running on YARN/Kubernetes, Configuration, Monitoring (web UI, event log, history server, metrics), Tuning guide (serialization, memory, GC), Job scheduling (dynamic allocation, fair scheduler); SQL/DataFrames/Datasets guide (data sources Parquet/ORC/JSON/CSV/JDBC/Avro/Hive, performance tuning, AQE, hints, built-in functions, window functions); Structured Streaming programming guide; PySpark (pandas API on Spark, Arrow, pandas UDFs), Spark Connect"
  - "Apache Kafka documentation ToC (kafka.apache.org/documentation) - APIs, Configuration (broker/topic/producer/consumer/connect/streams), Design (persistence, efficiency, producer, consumer, message delivery semantics, replication, log compaction, quotas), Operations (basic ops, add/modify/delete topics, balancing leadership, checking consumer position, MirrorMaker geo-replication, expanding the cluster and reassigning partitions, increasing replication factor, monitoring, KRaft, tiered storage), Security (SSL, SASL, authorization/ACLs), Kafka Connect, Kafka Streams"
  - "Apache Airflow docs ToC (airflow.apache.org/docs) - Core concepts (DAGs, DAG runs, tasks, operators, sensors, TaskFlow, executors, XComs, variables, params, pools, priority weights), Authoring and scheduling (cron and timetables, assets/data-aware scheduling, deferrable operators, dynamic task mapping, task groups, branching, trigger rules, setup/teardown), Administration and deployment (logging and monitoring, metrics, database, Helm chart, upgrading), Security, Best practices (top-level code, testing DAGs), Airflow 3 migration"
  - "dbt docs ToC (docs.getdbt.com) - Build your project (models SQL/Python, sources, seeds, snapshots, data tests, unit tests, documentation, exposures, materializations, jinja and macros, packages, hooks and operations, analyses, project variables, environment variables), Node selection syntax, State and defer (Slim CI), dbt Mesh (model contracts, versions, access, groups), Semantic Layer, Deploy (jobs, CI jobs, environments), Best-practice guides (how we structure our dbt projects)"
  - "Snowflake docs ToC (docs.snowflake.com) - Virtual warehouses, Micro-partitions and clustering, Loading data (stages, file formats, COPY INTO, Snowpipe, Snowpipe Streaming), Unloading data, Streams and tasks, Dynamic tables, Time Travel and Fail-safe, Cloning, Secure data sharing, Access control (RBAC), Data governance (masking and row access policies, tags, object dependencies), Cost management (resource monitors, budgets), Query performance (query profile, search optimisation, query acceleration, materialized views), Snowpark, Iceberg tables"
  - "Apache Flink docs ToC (nightlies.apache.org/flink) - Concepts (stateful stream processing, timely stream processing), DataStream API (windows, process functions, working with state, side outputs, async I/O, joins), Table API and SQL, Connectors (Kafka, FileSystem, JDBC, CDC), Fault tolerance (checkpointing, savepoints, state backends, state TTL, schema evolution), Deployment (Kubernetes operator, high availability, memory configuration), Operations (metrics, back pressure)"
  - "DAMA-DMBOK2 knowledge areas - Data Governance, Data Architecture, Data Modeling and Design, Data Storage and Operations, Data Security, Data Integration and Interoperability, Document and Content Management, Reference and Master Data, Data Warehousing and Business Intelligence, Metadata Management, Data Quality"
  - "Fundamentals of Data Engineering (Reis and Housley) chapters - 2 The Data Engineering Lifecycle (undercurrents security, data management, DataOps, data architecture, orchestration, software engineering), 3 Designing Good Data Architecture, 4 Choosing Technologies Across the Lifecycle, 5 Data Generation in Source Systems, 6 Storage, 7 Ingestion, 8 Queries, Modeling and Transformation, 9 Serving Data for Analytics, ML and Reverse ETL, 10 Security and Privacy"
