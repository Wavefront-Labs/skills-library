# Canonical coverage spec: Dart language and ecosystem.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: dart-language
scope:
  category: computing-software
  field: software-engineering
  products: [dart]
sources:
  - "Dart language tour and language specification (dart.dev/language, dart.dev/resources/language/spec)"
  - "Effective Dart guides - Style, Documentation, Usage, Design (dart.dev/effective-dart)"
  - "Dart core libraries (dart:core, dart:async, dart:io, dart:convert, dart:isolate, dart:ffi) API reference (api.dart.dev)"
  - "Dart tools documentation - dart CLI, pub, analyzer, formatter, test, compile (dart.dev/tools)"
  - "pub.dev package versioning, publishing and package layout conventions (dart.dev/tools/pub)"
topics:
  - id: dart-variables-types
    name: "Variables and built-in types"
    source: "Dart language tour - Variables, Built-in types"
    match: [dart-variables-types]
    subtopics:
      - {id: dart-variables-types-final-const-late, name: "var, final, const and late", match: [final-const-late]}
      - {id: dart-variables-types-numbers-strings, name: "num, int, double, String and interpolation", match: [numbers-strings]}
      - {id: dart-variables-types-late-final-const-semantics, name: "var, final, const and late", match: [late-final-const-semantics]}
      - {id: dart-variables-types-numbers-int-double-num, name: "int, double and num", match: [numbers-int-double-num]}
  - id: dart-null-safety
    name: "Sound null safety"
    source: "dart.dev/null-safety"
    match: [dart-null-safety]
    subtopics:
      - {id: dart-null-safety-null-safety-operators, name: "Nullable types, ?., ??, ! and flow analysis", match: [null-safety-operators]}
      - {id: dart-null-safety-null-aware-operators-promotion, name: "Null-aware operators and type promotion", match: [null-aware-operators-promotion]}
  - id: dart-functions
    name: "Functions and parameters"
    source: "Dart language tour - Functions"
    match: [dart-functions]
    subtopics:
      - {id: dart-functions-params-closures, name: "Optional, named and required parameters and closures", match: [params-closures]}
      - {id: dart-functions-closures-tearoffs-typedefs, name: "Closures, tear-offs and function types", match: [closures-tearoffs-typedefs]}
  - id: dart-classes
    name: "Classes and constructors"
    source: "Dart language tour - Classes, Constructors"
    match: [dart-classes]
    subtopics:
      - {id: dart-classes-constructors, name: "Generative, named, factory, const and redirecting constructors", match: [constructors]}
      - {id: dart-classes-getters-operators, name: "Getters, setters, operators and toString", match: [getters-operators]}
      - {id: dart-classes-constructors-factory-redirecting, name: "Constructors: named, factory, redirecting", match: [constructors-factory-redirecting]}
      - {id: dart-classes-getters-setters-operators-call, name: "Getters, setters, operators and call()", match: [getters-setters-operators-call]}
  - id: dart-inheritance
    name: "Inheritance, mixins and class modifiers"
    source: "Dart language tour - Class modifiers, Mixins"
    match: [dart-inheritance]
    subtopics:
      - {id: dart-inheritance-class-modifiers-mixins, name: "sealed, base, final, interface classes and mixins", match: [class-modifiers-mixins]}
      - {id: dart-inheritance-class-modifiers-sealed, name: "Class modifiers: sealed, base, final, interface", match: [class-modifiers-sealed]}
  - id: dart-enums
    name: "Enums"
    source: "Dart language tour - Enumerated types"
    match: [dart-enums]
    subtopics:
      - {id: dart-enums-enhanced-enums, name: "Enhanced enums with fields and methods", match: [enhanced-enums]}
      - {id: dart-enums-enhanced-enums-members, name: "Enhanced enums with fields and methods", match: [enhanced-enums-members]}
  - id: dart-records-patterns
    name: "Records and pattern matching"
    source: "Dart language tour - Records, Patterns"
    match: [dart-records-patterns]
    subtopics:
      - {id: dart-records-patterns-records, name: "Records, destructuring and multiple returns", match: [records]}
      - {id: dart-records-patterns-switch-patterns, name: "Switch expressions, patterns and guards", match: [switch-patterns]}
      - {id: dart-records-patterns-pattern-destructuring-guards, name: "Patterns, destructuring and guards", match: [pattern-destructuring-guards]}
  - id: dart-generics
    name: "Generics"
    source: "Dart language tour - Generics"
    match: [dart-generics]
    subtopics:
      - {id: dart-generics-generics-bounds, name: "Generic classes, methods and bounds", match: [generics-bounds]}
      - {id: dart-generics-bounded-generics-variance, name: "Bounded generics and variance", match: [bounded-generics-variance]}
  - id: dart-extension-methods
    name: "Extension methods and types"
    source: "Dart language tour - Extension methods"
    match: [dart-extension-methods]
    subtopics:
      - {id: dart-extension-methods-extension-methods, name: "Extensions and extension types", match: [extension-methods]}
      - {id: dart-extension-methods-extension-types-inline, name: "Extension types", match: [extension-types-inline]}
  - id: dart-collections
    name: "Collections"
    source: "dart:core collections; Effective Dart - Usage"
    match: [dart-collections]
    subtopics:
      - {id: dart-collections-collection-literals, name: "List, Set, Map, spread and collection if/for", match: [collection-literals]}
      - {id: dart-collections-iterable-operations, name: "Iterable, where, map and lazy evaluation", match: [iterable-operations]}
      - {id: dart-collections-list-map-set-spread-collection-if, name: "Collection literals, spread and collection-if", match: [list-map-set-spread-collection-if]}
  - id: dart-strings-regex
    name: "Strings, regular expressions and characters"
    source: "dart:core String and RegExp"
    match: [dart-strings-regex]
    subtopics:
      - {id: dart-strings-regex-regexp-characters, name: "RegExp, characters and unicode", match: [regexp-characters]}
      - {id: dart-strings-regex-string-buffer-interpolation-runes, name: "StringBuffer, interpolation and runes", match: [string-buffer-interpolation-runes]}
  - id: dart-async
    name: "Futures and async/await"
    source: "dart:async; Dart language tour - Asynchronous programming"
    match: [dart-async]
    subtopics:
      - {id: dart-async-futures-async-await, name: "Future, async/await and error handling", match: [futures-async-await]}
      - {id: dart-async-streams, name: "Streams, StreamController and async*", match: [streams]}
      - {id: dart-async-streams-controllers-subscriptions, name: "Streams, StreamController and subscriptions", match: [streams-controllers-subscriptions]}
      - {id: dart-async-future-wait-timeout-completer, name: "Future.wait, timeout and Completer", match: [future-wait-timeout-completer]}
  - id: dart-isolates
    name: "Isolates and concurrency"
    source: "dart.dev/language/concurrency"
    match: [dart-isolates]
    subtopics:
      - {id: dart-isolates-isolates-compute, name: "Isolate.run, ports and worker isolates", match: [isolates-compute]}
      - {id: dart-isolates-isolate-run-ports, name: "Isolate.run, ports and message passing", match: [isolate-run-ports]}
  - id: dart-exceptions
    name: "Exceptions and errors"
    source: "Dart language tour - Exceptions; Effective Dart - Usage"
    match: [dart-exceptions]
    subtopics:
      - {id: dart-exceptions-exceptions-errors, name: "Exception versus Error, rethrow and custom exceptions", match: [exceptions-errors]}
      - {id: dart-exceptions-try-on-catch-rethrow-stacktrace, name: "try, on, catch, rethrow and Error vs Exception", match: [try-on-catch-rethrow-stacktrace]}
  - id: dart-libraries-imports
    name: "Libraries, imports and packages"
    source: "Dart language tour - Libraries; Effective Dart - Design"
    match: [dart-libraries-imports]
    subtopics:
      - {id: dart-libraries-imports-imports-exports, name: "import, export, show, hide, deferred and part", match: [imports-exports]}
  - id: dart-pub
    name: "Pub packages and dependencies"
    source: "dart.dev/tools/pub"
    match: [dart-pub]
    subtopics:
      - {id: dart-pub-pubspec-dependencies, name: "pubspec.yaml, version constraints and pub commands", match: [pubspec-dependencies]}
      - {id: dart-pub-publishing-packages, name: "Publishing to pub.dev", match: [publishing-packages]}
      - {id: dart-pub-pubspec-constraints-overrides, name: "pubspec constraints, overrides and pub commands", match: [pubspec-constraints-overrides]}
  - id: dart-analysis
    name: "Static analysis and linting"
    source: "dart.dev/tools/analysis"
    match: [dart-analysis]
    subtopics:
      - {id: dart-analysis-analysis-options, name: "analysis_options.yaml, lints and strict modes", match: [analysis-options]}
      - {id: dart-analysis-dart-format-fix, name: "dart format and dart fix", match: [dart-format-fix]}
  - id: dart-testing
    name: "Testing"
    source: "package:test; dart.dev/tools/testing"
    match: [dart-testing]
    subtopics:
      - {id: dart-testing-package-test, name: "package:test groups, matchers and expectations", match: [package-test]}
      - {id: dart-testing-mocking-fakes, name: "Mocking with mocktail and mockito", match: [mocking-fakes]}
      - {id: dart-testing-test-mocking-golden, name: "package:test, mocktail and fakes", match: [test-mocking-golden]}
  - id: dart-codegen
    name: "Code generation"
    source: "build_runner; json_serializable; freezed"
    match: [dart-codegen]
    subtopics:
      - {id: dart-codegen-build-runner-json, name: "build_runner and json_serializable", match: [build-runner-json]}
  - id: dart-json-io
    name: "JSON and IO"
    source: "dart:convert and dart:io"
    match: [dart-json-io]
    subtopics:
      - {id: dart-json-io-dart-convert-json, name: "jsonEncode, jsonDecode and typed models", match: [dart-convert-json]}
      - {id: dart-json-io-file-process-io, name: "File, Directory, Process and stdin/stdout", match: [file-process-io]}
  - id: dart-http
    name: "HTTP clients and servers"
    source: "package:http; dart:io HttpServer; shelf"
    match: [dart-http]
    subtopics:
      - {id: dart-http-http-client-shelf, name: "package:http client and shelf servers", match: [http-client-shelf]}
  - id: dart-cli
    name: "Command-line applications"
    source: "dart create; package:args"
    match: [dart-cli]
    subtopics:
      - {id: dart-cli-cli-args, name: "dart create, package:args and exit codes", match: [cli-args]}
  - id: dart-compilation
    name: "Compilation modes"
    source: "dart.dev/tools/dart-compile"
    match: [dart-compilation]
    subtopics:
      - {id: dart-compilation-dart-compile-targets, name: "JIT, AOT, kernel, JS and Wasm", match: [dart-compile-targets]}
  - id: dart-ffi
    name: "Native interop"
    source: "dart.dev/interop/c-interop"
    match: [dart-ffi]
    subtopics:
      - {id: dart-ffi-ffi-c-interop, name: "dart:ffi, ffigen and native memory", match: [ffi-c-interop]}
  - id: dart-js-interop
    name: "Web interop"
    source: "dart.dev/interop/js-interop"
    match: [dart-js-interop]
    subtopics:
      - {id: dart-js-interop-js-interop-web, name: "package:web and dart:js_interop", match: [js-interop-web]}
  - id: dart-style
    name: "Style and documentation"
    source: "Effective Dart - Style, Documentation"
    match: [dart-style]
    subtopics:
      - {id: dart-style-effective-dart-style, name: "Naming, formatting and doc comments", match: [effective-dart-style]}
      - {id: dart-style-api-design-rules, name: "Effective Dart design rules", match: [api-design-rules]}
  - id: dart-date-time
    name: "Dates and times"
    source: "dart:core DateTime; package:intl"
    match: [dart-date-time]
    subtopics:
      - {id: dart-date-time-datetime-intl, name: "DateTime, Duration, time zones and intl formatting", match: [datetime-intl]}
  - id: dart-numerics-math
    name: "Math and random"
    source: "dart:math"
    match: [dart-numerics-math]
    subtopics:
      - {id: dart-numerics-math-math-random, name: "dart:math, Random.secure and number formatting", match: [math-random]}
  - id: dart-memory-performance
    name: "Performance and profiling"
    source: "dart.dev/tools/dart-devtools"
    match: [dart-memory-performance]
    subtopics:
      - {id: dart-memory-performance-devtools-profiling, name: "DevTools CPU and memory profiling and benchmarking", match: [devtools-profiling]}
  - id: dart-debugging
    name: "Debugging and logging"
    source: "dart.dev/tools/dart-devtools"
    match: [dart-debugging]
    subtopics:
      - {id: dart-debugging-debug-logging, name: "Debugger, breakpoints, assert and logging", match: [debug-logging]}
  - id: dart-ci
    name: "Continuous integration"
    source: "dart-lang/setup-dart"
    match: [dart-ci]
    subtopics:
      - {id: dart-ci-dart-github-actions, name: "GitHub Actions for Dart packages", match: [dart-github-actions]}
  - id: dart-sdk-versions
    name: "SDK versions and migration"
    source: "dart.dev/resources/breaking-changes"
    match: [dart-sdk-versions]
    subtopics:
      - {id: dart-sdk-versions-sdk-migration, name: "SDK constraints and language versions", match: [sdk-migration]}
  - id: dart-design-patterns
    name: "Idioms and patterns"
    source: "Effective Dart - Design"
    match: [dart-design-patterns]
    subtopics:
      - {id: dart-design-patterns-result-typed-errors, name: "Result types, sealed classes and error modelling", match: [result-typed-errors]}
  - id: dart-security
    name: "Security"
    source: "dart.dev security guidance"
    match: [dart-security]
    subtopics:
      - {id: dart-security-dart-security-basics, name: "Secrets, input validation and secure dependencies", match: [dart-security-basics]}
  - id: dart-generators
    name: "Generators and iterables"
    source: "Dart language tour - Generators"
    match: [dart-generators]
