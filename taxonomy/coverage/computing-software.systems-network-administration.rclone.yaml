# Coverage spec for rclone (systems-network-administration).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: rclone
scope:
  category: computing-software
  field: systems-network-administration
  products: [rclone]
sources:
  - https://rclone.org/docs/
  - https://rclone.org/filtering/
  - https://rclone.org/bisync/
  - https://rclone.org/crypt/
  - https://rclone.org/commands/rclone_mount/
  - https://rclone.org/rc/
topics:
  - id: config-file-location-and-format
    name: Config file location and format
    source: https://rclone.org/docs/#config-config-file
    match: [config, config-file, rclone-conf, portable-mode]
  - id: remote-path-syntax
    name: Remote path syntax
    source: https://rclone.org/docs/#syntax-of-remote-paths
    match: [remote-paths, remote-names, quoting]
  - id: connection-strings-and-on-the-fly-remotes
    name: Connection strings and on-the-fly remotes
    source: https://rclone.org/docs/#connection-strings
    match: [connection-strings, on-the-fly-remotes]
  - id: overriding-backend-options-with-override-and-global-variables
    name: Overriding backend options with override and global variables
    source: https://rclone.org/docs/#overriding-config-with-flags
    match: [override-var, global-var, remote-config]
  - id: environment-variables-and-precedence
    name: Environment variables and precedence
    source: https://rclone.org/docs/#environment-variables
    match: [environment-variables, precedence, rclone-config-env]
  - id: config-file-encryption
    name: Config file encryption
    source: https://rclone.org/docs/#configuration-encryption
    match: [config-encryption, rclone-config-pass, secretbox]
  - id: password-command-for-config-encryption
    name: Password command for config encryption
    source: https://rclone.org/docs/#configuration-encryption
    match: [password-command]
  - id: oauth-tokens-and-headless-authorisation
    name: OAuth tokens and headless authorisation
    source: https://rclone.org/remote_setup/
    match: [token, headless, remote-setup]
  - id: server-side-copy-and-move
    name: Server-side copy and move
    source: https://rclone.org/docs/#server-side-copy
    match: [server-side-copy, aged-backups]
  - id: shell-quoting-and-colons-in-file-names
    name: Shell quoting and colons in file names
    source: https://rclone.org/docs/#quoting-and-the-shell
    match: [colon-in-filenames]
  - id: sync-safety-with-dry-run-and-backup-dir
    name: Sync safety with dry-run and backup-dir
    source: https://rclone.org/docs/#sync
    match: [dry-run, backup-dir, sync]
  - id: delete-timing-and-max-delete
    name: Delete timing and max-delete
    source: https://rclone.org/docs/#delete-before
    match: [delete-before, max-delete, immutable]
  - id: track-renames
    name: Track renames
    source: https://rclone.org/docs/#track-renames
    match: [track-renames]
  - id: transfers-checkers-and-parallelism
    name: Transfers, checkers and parallelism
    source: https://rclone.org/docs/#transfers-n
    match: [performance, transfers, checkers]
  - id: multi-thread-streams-and-buffer-memory
    name: Multi-thread streams and buffer memory
    source: https://rclone.org/docs/#multi-thread-streams-n
    match: [multi-thread-streams, max-buffer-memory]
  - id: listing-speed-with-fast-list-and-order-by
    name: Listing speed with fast-list and order-by
    source: https://rclone.org/docs/#fast-list
    match: [fast-list, order-by]
  - id: filter-include-and-exclude-patterns
    name: Filter include and exclude patterns
    source: https://rclone.org/filtering/
    match: [filtering, include, exclude, glob, regex, filter-from, dump-filters]
  - id: files-from-lists
    name: Files-from lists
    source: https://rclone.org/filtering/#files-from-read-list-of-source-file-names
    match: [files-from]
  - id: age-and-size-filters
    name: Age and size filters
    source: https://rclone.org/filtering/#max-age-don-t-transfer-any-file-older-than-this
    match: [min-size, max-age, min-age]
  - id: directory-markers-and-exclude-if-present
    name: Directory markers and exclude-if-present
    source: https://rclone.org/filtering/#exclude-if-present-pattern
    match: [exclude-if-present, directory-filters]
  - id: bisync-first-run-and-resync
    name: Bisync first run and resync
    source: https://rclone.org/bisync/
    match: [bisync, resync, bidirectional-sync]
  - id: bisync-check-access-and-lock-files
    name: Bisync check-access and lock files
    source: https://rclone.org/bisync/#check-access
    match: [check-access, lock-file]
  - id: scheduling-bisync-with-cron
    name: Scheduling bisync with cron
    source: https://rclone.org/bisync/
    match: [cron]
  - id: bisync-conflict-resolution
    name: Bisync conflict resolution
    source: https://rclone.org/bisync/#conflict-resolve
    match: [conflict-resolve, compare]
  - id: bisync-recovery-and-resilient-mode
    name: Bisync recovery and resilient mode
    source: https://rclone.org/bisync/#resilient
    match: [resilient, recover, filters-file]
  - id: logging-to-a-file-and-log-levels
    name: Logging to a file and log levels
    source: https://rclone.org/docs/#logging
    match: [logging, log-file, log-rotation]
  - id: stats-output-and-exit-codes
    name: Stats output and exit codes
    source: https://rclone.org/docs/#exit-code
    match: [stats, exit-codes, metrics]
  - id: bandwidth-limits
    name: Bandwidth limits
    source: https://rclone.org/docs/#bwlimit-bandwidth-spec
    match: [bwlimit, bandwidth, rate-limiting]
  - id: bandwidth-timetables
    name: Bandwidth timetables
    source: https://rclone.org/docs/#bwlimit-bandwidth-spec
    match: [timetable, bwlimit-file]
  - id: crypt-remote-setup
    name: Crypt remote setup
    source: https://rclone.org/crypt/
    match: [crypt, client-side-encryption, filename-encryption, salt]
  - id: crypt-password-change-and-cryptcheck
    name: Crypt password change and cryptcheck
    source: https://rclone.org/crypt/
    match: [password-change, re-encrypt, cryptcheck, cryptdecode]
  - id: mount-basics-and-fuse
    name: Mount basics and FUSE
    source: https://rclone.org/commands/rclone_mount/
    match: [mount, fuse, fusermount, daemon, mount-helper]
  - id: mounting-as-a-systemd-service
    name: Mounting as a systemd service
    source: https://rclone.org/commands/rclone_mount/
    match: [systemd]
  - id: vfs-cache-modes
    name: VFS cache modes
    source: https://rclone.org/commands/rclone_mount/#vfs-file-caching
    match: [vfs, vfs-cache-mode, vfs-cache-max-size, read-ahead, sparse-files]
  - id: vfs-directory-cache-and-polling
    name: VFS directory cache and polling
    source: https://rclone.org/commands/rclone_mount/#vfs-directory-cache
    match: [dir-cache-time, poll-interval, vfs-forget, no-modtime, read-only]
  - id: serve-http-and-webdav
    name: Serve HTTP and WebDAV
    source: https://rclone.org/commands/rclone_serve_webdav/
    match: [serve, webdav, http, htpasswd, tls, baseurl, etag]
  - id: serve-s3
    name: Serve S3
    source: https://rclone.org/commands/rclone_serve_s3/
    match: [serve-s3, auth-key]
  - id: serve-restic
    name: Serve restic
    source: https://rclone.org/commands/rclone_serve_restic/
    match: [serve-restic, append-only, private-repos]
  - id: remote-control-api
    name: Remote control API
    source: https://rclone.org/rc/
    match: [rc, rcd, remote-control, rc-api, async-jobs, rc-htpasswd]
  - id: securing-the-remote-control-server
    name: Securing the remote control server
    source: https://rclone.org/rc/
    match: [security]
  - id: union-backend-policies
    name: Union backend policies
    source: https://rclone.org/union/
    match: [union, upstreams, create-policy, action-policy, search-policy, writeback, mergerfs]
  - id: chunker-overlay
    name: Chunker overlay
    source: https://rclone.org/chunker/
    match: [chunker, chunk-size, overlay, composite-files, hashsums, metadata]
  - id: combine-and-alias-remotes
    name: Combine and alias remotes
    source: https://rclone.org/combine/
    match: [combine, alias, synthetic-directories]
  - id: check-and-verification
    name: Check and verification
    source: https://rclone.org/commands/rclone_check/
    match: [check, checksum, verification]
  - id: dedupe-duplicate-files
    name: Dedupe duplicate files
    source: https://rclone.org/commands/rclone_dedupe/
    match: [dedupe, duplicates]
  - id: docker-volume-plugin
    name: Docker volume plugin
    source: https://rclone.org/docker/
    match: [docker, volume-plugin, managed-plugin, compose, swarm]
  - id: provider-specific-backends-and-their-quirks
    name: Provider-specific backends and their quirks
    source: https://rclone.org/overview/
    match: [provider-quirks, backend-features]
  - id: transfer-retries-and-error-handling
    name: Transfer retries and error handling
    source: https://rclone.org/docs/#retries-int
    match: [retries, low-level-retries]
  - id: checksums-and-modtime-comparison
    name: Checksums and modtime comparison
    source: https://rclone.org/docs/#c-checksum
    match: [size-only, modtime-window]
  - id: copy-sync-and-move-command-differences
    name: Copy, sync and move command differences
    source: https://rclone.org/commands/rclone_sync/
    match: [copy-vs-sync, move]
  - id: ncdu-and-size-inspection
    name: Ncdu and size inspection
    source: https://rclone.org/commands/rclone_ncdu/
    match: [ncdu, rclone-size]
  - id: obscuring-passwords-for-config
    name: Obscuring passwords for config
    source: https://rclone.org/commands/rclone_obscure/
    match: [obscure]
