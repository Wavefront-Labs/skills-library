# Coverage spec: asterisk. Topics from the official Asterisk documentation named in `sources`.
subject: asterisk
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [asterisk]
sources:
  - "Asterisk documentation: PJSIP configuration (https://docs.asterisk.org/Configuration/Channel-Drivers/SIP/Configuring-res_pjsip/)"
  - "Asterisk documentation: Dialplan (https://docs.asterisk.org/Configuration/Dialplan/)"
  - "Asterisk documentation: Applications (https://docs.asterisk.org/Configuration/Applications/)"
  - "Asterisk documentation: Features (https://docs.asterisk.org/Configuration/Features/)"
  - "Asterisk documentation: Interfaces (ARI, AMI, AGI, call files, realtime) (https://docs.asterisk.org/Configuration/Interfaces/)"
  - "Asterisk documentation: Reporting (CDR, CEL) (https://docs.asterisk.org/Configuration/Reporting/)"
  - "Asterisk documentation: Core configuration (https://docs.asterisk.org/Configuration/Core-Configuration/)"
  - "Asterisk documentation: Deployment (https://docs.asterisk.org/Deployment/)"
  - "Asterisk documentation: Operation (https://docs.asterisk.org/Operation/)"
topics:
  - id: ael-asterisk-extension-language
    name: "ael asterisk extension language"
    source: https://docs.asterisk.org/Configuration/Dialplan/Asterisk-Extension-Language-AEL/Introduction-to-AEL/
    match: ["ael asterisk extension language", "ael", "extensions ael", "aelparse", "dialplan", "semantic checks"]
  - id: ajam-http-manager-access
    name: "ajam http manager access"
    source: https://docs.asterisk.org/Configuration/Interfaces/Asterisk-Manager-Interface-AMI/Asynchronous-Javascript-Asterisk-Manager-AJAM/Allow-Manager-Access-via-HTTP/
    match: ["ajam http manager access", "ajam", "ami", "http", "manager conf", "rawman", "mxml"]
  - id: ami-overview-and-event-filtering
    name: "ami overview and event filtering"
    source: https://docs.asterisk.org/Configuration/Interfaces/Asterisk-Manager-Interface-AMI/The-Asterisk-Manager-TCP-IP-API/
    match: ["ami overview and event filtering", "ami", "manager conf", "event filter", "eventfilter", "actions", "events"]
  - id: answer-playback-hangup-and-early-media
    name: "answer playback hangup and early media"
    source: https://docs.asterisk.org/Configuration/Applications/Answer-Playback-and-Hangup-Applications/
    match: ["answer playback hangup and early media", "dialplan", "answer", "playback", "hangup", "progress", "early media"]
  - id: ari-bridges
    name: "ari bridges"
    source: https://docs.asterisk.org/Configuration/Interfaces/Asterisk-REST-Interface-ARI/Introduction-to-ARI-and-Bridges/
    match: ["ari bridges", "ari", "bridges", "mixing", "holding", "dtmf events", "proxy media"]
  - id: ari-channels-and-stasis-events
    name: "ari channels and stasis events"
    source: https://docs.asterisk.org/Configuration/Interfaces/Asterisk-REST-Interface-ARI/Introduction-to-ARI-and-Channels/
    match: ["ari channels and stasis events", "ari", "channels", "stasis", "stasisstart", "local channel", "subscription"]
  - id: ari-configuration-and-getting-started
    name: "ari configuration and getting started"
    source: https://docs.asterisk.org/Configuration/Interfaces/Asterisk-REST-Interface-ARI/Asterisk-Configuration-for-ARI/
    match: ["ari configuration and getting started", "ari", "rest interface", "http conf", "ari conf", "stasis", "websocket"]
  - id: ari-outbound-websockets
    name: "ari outbound websockets"
    source: https://docs.asterisk.org/Configuration/Interfaces/Asterisk-REST-Interface-ARI/ARI-Outbound-Websockets/
    match: ["ari outbound websockets", "ari", "outbound websocket", "websocket client conf", "persistent", "per call", "reconnect"]
  - id: auto-attendant-ivr-menus
