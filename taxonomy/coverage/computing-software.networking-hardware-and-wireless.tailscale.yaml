# Coverage spec for Tailscale, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
# One topic per skill; topics follow the documentation pages.
subject: tailscale
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [tailscale]
sources:
  - "Tailscale documentation (tailscale.com/kb) - policy file, grants and ACLs, tags, subnet routers, exit nodes, SSH, DNS, auth keys, OAuth clients, approval, Tailnet Lock, DERP, app connectors, Serve and Funnel, MDM policies, CLI."
