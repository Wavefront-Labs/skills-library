# Coverage spec: flux. Topics from the Flux docs.
subject: flux
scope:
  category: computing-software
  field: devops-ci-cd
  products: [flux]
sources:
  - "Flux docs (fluxcd.io/flux)"
topics:
  - id: kustomization-prune-and-deletion-policy
    name: "Kustomization prune and deletion policy"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, prune, garbage-collection]
  - id: kustomization-health-checks-and-wait
    name: "Kustomization health checks and wait"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, healthchecks, wait]
  - id: kustomization-depends-on
    name: "Kustomization dependsOn ordering"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, dependson, ordering]
  - id: kustomization-health-check-cel-expressions
    name: "Kustomization CEL health checks"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, healthcheckexprs, cel]
  - id: kustomization-post-build-substitution
    name: "Kustomization post-build variable substitution"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, postbuild, substitute]
  - id: kustomization-patches-and-images
    name: "Kustomization patches and images"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, patches, images]
  - id: kustomization-apply-annotations
    name: "Kustomization apply annotations ssa force prune"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, ssa, merge]
  - id: kustomization-ignore-drift-rules
    name: "Kustomization drift ignore rules"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, ignore, drift]
  - id: sops-age-secrets-with-flux
    name: "SOPS age secrets with Flux"
    source: "https://fluxcd.io/flux/guides/mozilla-sops/"
    match: [sops, age, decryption]
  - id: sops-cloud-kms-and-gpg
    name: "SOPS with cloud KMS and GPG"
    source: "https://fluxcd.io/flux/guides/mozilla-sops/"
    match: [sops, kms, gpg]
  - id: kustomize-secret-generator-sops
    name: "Kustomize secretGenerator with SOPS"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [sops, secretgenerator, kustomize]
  - id: kustomization-service-account-impersonation
    name: "Kustomization ServiceAccount impersonation"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, serviceaccountname, rbac]
  - id: bootstrap-customization-patches
    name: "Bootstrap customization with patches"
    source: "https://fluxcd.io/flux/installation/configuration/bootstrap-customization/"
    match: [bootstrap, kustomize-patches, gotk-components]
  - id: multitenancy-lockdown
    name: "Multi-tenancy lockdown"
    source: "https://fluxcd.io/flux/installation/configuration/multitenancy/"
    match: [multitenancy, no-cross-namespace-refs, default-service-account]
  - id: controller-sharding
    name: "Controller sharding"
    source: "https://fluxcd.io/flux/installation/configuration/sharding/"
    match: [sharding, sharding-key, watch-label-selector]
  - id: vertical-scaling-tuning
    name: "Vertical scaling tuning"
    source: "https://fluxcd.io/flux/installation/configuration/vertical-scaling/"
    match: [vertical-scaling, concurrent, tmpfs]
  - id: workload-identity-controllers
    name: "Controller workload identity"
    source: "https://fluxcd.io/flux/installation/configuration/workload-identity/"
    match: [workload-identity, irsa, aks]
  - id: object-identity-multitenant
    name: "Object identity for tenants"
    source: "https://fluxcd.io/flux/installation/configuration/object-identity/"
    match: [object-identity, serviceaccounts-token, spiffe]
  - id: optional-components-and-network-policies
    name: "Optional components and network policies"
    source: "https://fluxcd.io/flux/installation/configuration/optional-components/"
    match: [components, components-extra, image-automation]
  - id: deploy-key-rotation
    name: "Rotate the Flux deploy key"
    source: "https://fluxcd.io/flux/installation/configuration/deploy-key-rotation/"
    match: [deploy-key, ssh, bootstrap]
  - id: helmrelease-chart-template-vs-chartref
    name: "HelmRelease chart template vs chartRef"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, chart, chartref]
  - id: helmrelease-values-and-valuesfrom
    name: "HelmRelease values and valuesFrom"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, values, valuesfrom]
  - id: helmrelease-install-upgrade-remediation
    name: "HelmRelease remediation and retries"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, remediation, retries]
  - id: helmrelease-force-and-reset
    name: "HelmRelease force and reset annotations"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, forceat, resetat]
  - id: helmrelease-drift-detection
    name: "HelmRelease drift detection"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, driftdetection, drift-correction]
  - id: helmrelease-crd-lifecycle
    name: "HelmRelease CRD lifecycle"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, crds, createreplace]
  - id: helmrelease-post-renderers
    name: "HelmRelease post renderers"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, postrenderers, kustomize-patches]
  - id: helmrelease-dependencies-wait-and-test
    name: "HelmRelease dependsOn, wait strategy and tests"
    source: "https://fluxcd.io/flux/components/helm/helmreleases/"
    match: [helmrelease, dependson, waitstrategy]
  - id: gitrepository-authentication
    name: "GitRepository authentication"
    source: "https://fluxcd.io/flux/components/source/gitrepositories/"
    match: [gitrepository, authentication, ssh]
  - id: gitrepository-ref-and-verification
    name: "GitRepository ref and commit verification"
    source: "https://fluxcd.io/flux/components/source/gitrepositories/"
    match: [gitrepository, ref, semver]
  - id: gitrepository-ignore-sparse-include
    name: "GitRepository ignore, sparse checkout and include"
    source: "https://fluxcd.io/flux/components/source/gitrepositories/"
    match: [gitrepository, ignore, sourceignore]
  - id: oci-artifacts-push-and-consume
    name: "OCI artifacts with flux push and OCIRepository"
    source: "https://fluxcd.io/flux/cheatsheets/oci-artifacts/"
    match: [oci, ocirepository, flux-push-artifact]
  - id: ocirepository-ref-and-layer-selector
    name: "OCIRepository ref and layerSelector"
    source: "https://fluxcd.io/flux/components/source/ocirepositories/"
    match: [ocirepository, semver, layerselector]
  - id: ocirepository-auth-providers
    name: "OCIRepository authentication"
    source: "https://fluxcd.io/flux/components/source/ocirepositories/"
    match: [ocirepository, authentication, imagepullsecret]
  - id: ocirepository-signature-verification
    name: "OCI signature verification"
    source: "https://fluxcd.io/flux/components/source/ocirepositories/"
    match: [ocirepository, cosign, notation]
  - id: helmrepository-http-and-oci
    name: "HelmRepository HTTP and OCI"
    source: "https://fluxcd.io/flux/components/source/helmrepositories/"
    match: [helmrepository, helm, oci]
  - id: helmchart-version-and-reconcile-strategy
    name: "HelmChart version and reconcile strategy"
    source: "https://fluxcd.io/flux/components/source/helmcharts/"
    match: [helmchart, reconcilestrategy, valuesfiles]
  - id: bucket-source-providers
    name: "Bucket source providers"
    source: "https://fluxcd.io/flux/components/source/buckets/"
    match: [bucket, s3, minio]
  - id: alert-and-provider-basics
    name: "Alert and Provider basics"
    source: "https://fluxcd.io/flux/components/notification/alerts/"
    match: [alert, provider, notification-controller]
  - id: alert-event-filtering
    name: "Alert event filtering"
    source: "https://fluxcd.io/flux/components/notification/alerts/"
    match: [alert, inclusionlist, exclusionlist]
  - id: git-commit-status-and-pr-comments
    name: "Git commit status and PR comments"
    source: "https://fluxcd.io/flux/components/notification/providers/"
    match: [commit-status, pullrequestcomment, change_request]
  - id: receiver-webhooks
    name: "Receivers and webhook exposure"
    source: "https://fluxcd.io/flux/components/notification/receivers/"
    match: [receiver, webhook, notification-controller]
  - id: image-repository-scanning
    name: "ImageRepository scanning"
    source: "https://fluxcd.io/flux/components/image/imagerepositories/"
    match: [imagerepository, image-reflector-controller, exclusionlist]
  - id: image-policy-selection
    name: "ImagePolicy selection"
    source: "https://fluxcd.io/flux/components/image/imagepolicies/"
    match: [imagepolicy, semver, numerical]
  - id: image-update-automation-setters
    name: "ImageUpdateAutomation setters"
    source: "https://fluxcd.io/flux/components/image/imageupdateautomations/"
    match: [imageupdateautomation, setters, imagepolicy-marker]
  - id: image-digest-pinning
    name: "Image digest pinning"
    source: "https://fluxcd.io/flux/guides/image-update/"
    match: [digestreflectionpolicy, latest-tag, imagepolicy]
  - id: troubleshooting-flux-resources
    name: "Troubleshooting Flux resources"
    source: "https://fluxcd.io/flux/cheatsheets/troubleshooting/"
    match: [troubleshooting, flux-get, flux-logs]
  - id: monitoring-metrics-events-logs
    name: "Monitoring metrics, events and logs"
    source: "https://fluxcd.io/flux/monitoring/metrics/"
    match: [monitoring, prometheus, gotk_reconcile_duration_seconds]
  - id: flux-upgrade-procedure
    name: "Upgrading Flux"
    source: "https://fluxcd.io/flux/installation/upgrade/"
    match: [upgrade, flux-install, gotk-components]
  - id: bootstrap-git-providers
    name: "Bootstrap with GitHub or generic Git"
    source: "https://fluxcd.io/flux/installation/bootstrap/github/"
    match: [bootstrap, flux-bootstrap-github, flux-bootstrap-git]
  - id: reconcile-suspend-resume
    name: "Reconcile, suspend and resume"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [flux-reconcile, suspend, resume]
  - id: kustomization-remote-clusters
    name: "Kustomization remote cluster deployment"
    source: "https://fluxcd.io/flux/components/kustomize/kustomizations/"
    match: [kustomization, kubeconfig, remote-cluster]
