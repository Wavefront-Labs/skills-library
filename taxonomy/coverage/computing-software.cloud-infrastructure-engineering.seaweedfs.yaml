# Coverage spec for SeaweedFS, from the official wiki (github.com/seaweedfs/seaweedfs/wiki).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: seaweedfs
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [seaweedfs]
sources:
  - "SeaweedFS wiki (github.com/seaweedfs/seaweedfs/wiki)"
topics:
  - id: weed-mini
    name: "weed mini all-in-one"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Quick-Start-with-weed-mini"
    match: [weed-mini, all-in-one, quick-start]
  - id: s3-user-provision
    name: "s3 user and bucket provisioning"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Simplest-S3-Bucket-and-User-Setup"
    match: [s3-user-provision, readwrite-role, access-key]
  - id: anonymous-access
    name: "anonymous public bucket access"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Bucket-Policies"
    match: [anonymous, public-read, s3-bucket-access]
  - id: core-concepts
    name: "masters volumes collections"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Components"
    match: [volume, collection, master]
  - id: master-ha
    name: "master raft high availability"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Failover-Master-Server"
    match: [raft, peers, failover]
  - id: volume-servers
    name: "volume server disks"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Production-Setup"
    match: [weed-volume, multi-disk, max-volumes]
  - id: replication
    name: "replication placement"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Replication"
    match: [replication, placement, xyz]
  - id: volume-ttl
    name: "time to live files"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Store-file-with-a-Time-To-Live"
    match: [ttl, expiry, volume-ttl]
  - id: erasure-coding
    name: "erasure coding"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Erasure-Coding-for-warm-storage"
    match: [erasure-coding, reed-solomon, ec-shards]
  - id: ec-bitrot
    name: "ec bitrot detection"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/EC-Bitrot-Detection"
    match: [bitrot, ec-scrub, ecsum]
  - id: systemd
    name: "systemd service units"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Server-Startup-via-Systemd"
    match: [systemd, service-unit, autostart]
  - id: env-vars
    name: "environment variables"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Environment-Variables"
    match: [environment-variables, weed-prefix, toml-env]
  - id: filer-encryption
    name: "filer data encryption"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Filer-Data-Encryption"
    match: [encryptvolumedata, aes256-gcm, encryption]
  - id: filer-jwt
    name: "filer jwt"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Filer-JWT-Use"
    match: [jwt, bearer, filer-auth]
  - id: filer-store-choice
    name: "choosing a filer store"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Filer-Stores"
    match: [filer-store, leveldb, redis]
  - id: path-specific-store
    name: "path specific filer store"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Path-Specific-Filer-Store"
    match: [path-specific, location, filer-toml]
  - id: path-config
    name: "path specific configuration"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Path-Specific-Configuration"
    match: [fs-configure, filer-conf, locationprefix]
  - id: store-migration
    name: "filer store migration"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Migrate-Between-Filer-Stores"
    match: [migrate, fs-meta-save, fs-meta-load]
  - id: filer-peers
    name: "filer peer sync"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Filer-Store-Replication"
    match: [peer-discovery, embedded-store, metadata-sync]
  - id: filer-sync
    name: "filer cross cluster sync"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Filer-Active-Active-cross-cluster-continuous-synchronization"
    match: [filer-sync, active-active, active-passive]
  - id: filer-cdc
    name: "filer change data capture"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Filer-Change-Data-Capture"
    match: [meta-tail, change-data-capture, subscribe-metadata]
  - id: mount
    name: "fuse mount"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/FUSE-Mount"
    match: [weed-mount, fuse, mountpoint]
  - id: mount-tuning
    name: "mount buffers and quota"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/FUSE-Mount"
    match: [write-buffer, collection-quota, df-logical]
  - id: fstab
    name: "fstab and automount"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/fstab-and-systemd-mount"
    match: [fstab, automount, mount-weed]
  - id: mount-locks
    name: "distributed locks"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Distributed-POSIX-Locks"
    match: [dlm, flock, posix-locks]
  - id: mount-internet
    name: "mount over internet"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Mount-over-the-Internet"
    match: [mtls, filerproxy, remote-mount]
  - id: sftp
    name: "sftp server"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/SFTP-Server"
    match: [sftp, userstorefile, ssh]
  - id: remote-storage
    name: "remote storage mount"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Mount-Remote-Storage"
    match: [remote-configure, remote-mount, cloud-drive]
  - id: remote-cache
    name: "remote cache and uncache"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Cache-Remote-Storage"
    match: [remote-cache, uncache, warm-up]
  - id: s3-gateway
    name: "s3 gateway"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Amazon-S3-API"
    match: [weed-s3, s3-gateway, buckets]
  - id: s3-lifecycle
    name: "s3 lifecycle"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Lifecycle"
    match: [lifecycle, expiration, noncurrent]
  - id: s3-lifecycle-ops
    name: "s3 lifecycle operations"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Lifecycle-Operator-Guide"
    match: [walker, delete-rate, lifecycle-worker]
  - id: s3-conditional
    name: "s3 conditional operations"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Conditional-Operations"
    match: [if-match, if-none-match, conditional-write]
  - id: s3-cors
    name: "s3 cors"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-CORS"
    match: [cors, allowedorigins, preflight]
  - id: s3-object-lock
    name: "s3 object lock"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Object-Lock-and-Retention"
    match: [object-lock, retention, legal-hold]
  - id: s3-versioning
    name: "s3 versioning"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Object-Versioning"
    match: [versioning, version-id, delete-marker]
  - id: s3-quota
    name: "s3 bucket quota"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Bucket-Quota"
    match: [bucket-quota, quota-enforce, read-only-bucket]
  - id: s3-rate-limit
    name: "s3 rate limiting"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Rate-Limiting"
    match: [rate-limit, circuit-breaker, concurrent-uploads]
  - id: s3-proxy
    name: "s3 reverse proxy"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Nginx-Proxy"
    match: [reverse-proxy, externalurl, trusted-proxies]
  - id: s3-credentials
    name: "s3 credentials"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Credentials"
    match: [s3-config, identities, credentials]
  - id: s3-oidc
    name: "oidc and sts"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/OIDC-Integration"
    match: [oidc, sts, iam-config]
  - id: iam-api
    name: "iam api"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Amazon-IAM-API"
    match: [iam-api, embedded-iam, access-keys]
  - id: sse-kms
    name: "sse kms"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Server-Side-Encryption-SSE-KMS"
    match: [sse-kms, kms, key-id]
  - id: sse-c
    name: "sse c"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Server-Side-Encryption-SSE-C"
    match: [sse-c, customer-key, customer-provided]
  - id: aws-cli
    name: "aws cli client"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/AWS-CLI-with-SeaweedFS"
    match: [aws-cli, endpoint-url, presigned]
  - id: s3-clients
    name: "rclone and restic"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/rclone-with-SeaweedFS"
    match: [rclone, restic, s3-client]
  - id: tables
    name: "s3 tables and iceberg"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/S3-Table-Bucket"
    match: [table-bucket, iceberg, rest-catalog]
  - id: filer-backup
    name: "async backup"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Async-Backup"
    match: [filer-backup, sink, meta-backup]
  - id: weed-backup
    name: "volume backup"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Data-Backup"
    match: [weed-backup, mirror, incremental]
  - id: metrics
    name: "prometheus metrics"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/System-Metrics"
    match: [prometheus, metrics-port, push-gateway]
  - id: helm
    name: "helm chart"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Helm-Chart-Recipes"
    match: [helm, kubernetes, values-yaml]
  - id: seaweed-up
    name: "seaweed up deployment"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Deployment-with-seaweed-up"
    match: [seaweed-up, ssh-deploy, cluster-yaml]
  - id: large-files
    name: "large file chunks"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Large-File-Handling"
    match: [chunk-manifest, large-file, cm-true]
  - id: optimization
    name: "volume tuning"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Optimization"
    match: [leveldb-index, preallocate, vol-grow]
  - id: maintenance
    name: "maintenance scripts"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Volume-Management"
    match: [admin-script, vacuum, fix-replication]
  - id: tiered
    name: "tiered storage"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Tiered-Storage"
    match: [tiered-storage, disk-type, dir-idx]
  - id: security
    name: "security toml"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Security-Configuration"
    match: [security-toml, grpc-tls, jwt-signing]
  - id: master-api
    name: "master http api"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Master-Server-API"
    match: [dir-assign, dir-lookup, master-api]
  - id: admin-worker
    name: "admin ui and worker"
    source: "https://github.com/seaweedfs/seaweedfs/wiki/Admin-UI"
    match: [weed-admin, weed-worker, job-types]
