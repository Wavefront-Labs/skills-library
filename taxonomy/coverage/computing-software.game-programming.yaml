# Canonical coverage spec: Game programming (whole field, all eight products).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (engine manuals' tables of contents, the
# Game Programming Patterns and Game Engine Architecture chapter lists, standard texts for physics,
# networking and AI), not from what the library already has.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (manual page
# headings, scripting API class groups, book chapter sub-sections). Round 2 took each topic one level
# deeper (task pages, API members, troubleshooting and procedures from the same sources) to 8-10 subtopics.
subject: game-programming
scope:
  category: computing-software
  field: game-programming
  products: [unity, unreal-engine, godot, gameplay-programming, game-physics, multiplayer-networking, game-engine-architecture, game-ai-programming]
sources:
  - "Unity Manual ToC (docs.unity3d.com/Manual) - GameObjects and components, Prefabs, Scenes, Scripting (order of execution, coroutines, Awaitable, assembly definitions, conditional compilation, IL2CPP, managed code stripping), Input System package, Physics (Rigidbody, colliders, raycasts, joints, 2D physics), Animation (Animator, blend trees, root motion, Timeline), UI (uGUI, UI Toolkit, TextMeshPro), Graphics (URP, Shader Graph, lighting), Asset management (Addressables, AssetBundles), Build and Build Profiles, Profiler and Memory Profiler, Editor extensibility, Unity Test Framework, Netcode for GameObjects, Entities/Burst; Unity Scripting API class groups (MonoBehaviour, ScriptableObject, SceneManager, Physics, Animator, Editor) for subtopics"
  - "Unreal Engine 5 documentation ToC (dev.epicgames.com/documentation/en-us/unreal-engine) - Programming with C++ (gameplay classes, UObject reflection, UPROPERTY/UFUNCTION specifiers, delegates, modules and UnrealBuildTool, smart pointers, subsystems), Blueprints Visual Scripting (Blueprint classes, interfaces, communication, function libraries, macros), Gameplay Framework (GameMode, GameState, PlayerController, Pawn/Character, PlayerState, HUD), Gameplay Ability System, Gameplay Tags, Enhanced Input, Networking and Multiplayer (replication, RPCs, relevancy, Iris), Animation (Animation Blueprints, montages, Control Rig), UMG UI, Asset Management (Primary Asset Labels, soft references), World Partition, AI (Behavior Trees, EQS, StateTree, Smart Objects), Automation testing, Unreal Insights and stat commands, Packaging with BuildCookRun"
  - "Godot Engine 4 documentation ToC (docs.godotengine.org/en/stable) - Getting started (nodes, scenes, instancing, signals), Scripting (GDScript reference, static typing, exported properties, tool mode, autoloads, C#), Physics (CharacterBody, RigidBody, Area, ray-casting, collision layers), 2D (TileMap/TileMapLayer, animation, particles), Animation (AnimationPlayer, AnimationTree, tweens), UI (Control nodes, containers, themes), Navigation, Audio buses, Input (InputMap, InputEvent), File I/O and saving games, Export (export templates, presets, PCK), Performance (profiler, servers), Shaders, Editor plugins, GDExtension, High-level multiplayer"
  - "Game Programming Patterns (Robert Nystrom, gameprogrammingpatterns.com) chapters - Design Patterns Revisited (Command, Flyweight, Observer, Prototype, Singleton, State), Sequencing (Double Buffer, Game Loop, Update Method), Behavioral (Bytecode, Subclass Sandbox, Type Object), Decoupling (Component, Event Queue, Service Locator), Optimization (Data Locality, Dirty Flag, Object Pool, Spatial Partition)"
  - "Game Engine Architecture 3rd ed. (Jason Gregory) chapters - 1 Runtime engine architecture, 3 Fundamentals of software engineering for games, 4 Parallelism and concurrent programming, 5 3D math, 6 Engine support systems (subsystem start-up/shut-down, memory management, containers, strings and hashed ids, engine configuration), 7 Resources and the file system, 8 The game loop and real-time simulation, 9 Human interface devices, 10 Tools for debugging and development, 11 The rendering engine, 12 Animation systems, 13 Collision and rigid body dynamics, 14 Audio, 15 Introduction to gameplay systems, 16 Runtime gameplay foundation systems"
  - "Real-Time Collision Detection (Christer Ericson) chapters - bounding volumes, primitive tests, BVH, spatial partitioning, GJK/SAT, numerical robustness; Game Physics Engine Development (Ian Millington) - particles, rigid bodies, contacts, resolution; Gaffer On Games physics articles (Integration Basics, Fix Your Timestep) and Erin Catto Box2D GDC solver talks"
  - "Networking references - Gaffer On Games networking series (UDP vs TCP, reliability over UDP, snapshot interpolation, state synchronization, deterministic lockstep), Valve Developer Community Source Multiplayer Networking (interpolation, lag compensation, prediction), Gabriel Gambetta Fast-Paced Multiplayer, GGPO documentation"
  - "AI for Games 3rd ed. (Ian Millington) chapters - Movement (kinematic and steering behaviours, flocking), Pathfinding (Dijkstra, A*, world representations, hierarchical pathfinding), Decision making (decision trees, state machines, behaviour trees, fuzzy logic, goal-oriented behaviour, rule-based systems), Tactical and strategic AI (waypoint tactics, influence maps), Board games (minimax, MCTS); Game AI Pro chapters for utility AI and perception"
  - "Game Feel (Steve Swink) and GDC gameplay-programming talks - input response, simulated space, polish and juice; Nystrom Game Programming Patterns for gameplay state"
