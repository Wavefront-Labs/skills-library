# Canonical coverage spec: Grafana LGTM stack (Loki, Grafana, Tempo, Mimir) and Alloy.
# Topics come from the official Grafana Labs documentation tables of contents, not from the library.
subject: grafana-loki-tempo
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [grafana-loki-tempo]
sources:
  - "grafana.com/docs/loki/latest table of contents: query (log queries, metric queries, template functions, logcli), configure, operations (storage, retention, multi-tenancy, caching), alert, reference (HTTP API), setup (Helm install)"
  - "grafana.com/docs/tempo/latest table of contents: TraceQL and TraceQL metrics, metrics-generator, configuration, API, storage (Parquet), compaction, multitenancy, caching, receivers, sampling"
  - "grafana.com/docs/mimir/latest table of contents: architecture, deployment modes, hash ring, configuration parameters and limits, ruler, HA tracker, query sharding, mimirtool, remote write"
  - "grafana.com/docs/alloy/latest table of contents: configuration syntax, component reference (loki, prometheus, discovery, otelcol), clustering, debugging"
  - "grafana.com/docs/grafana/latest/datasources: Loki, Tempo, Prometheus/Mimir data source configuration, trace to logs, trace to metrics, derived fields, exemplars, service map"
topics:
  - {id: metric-queries, name: LogQL metric queries and range aggregations, source: Loki docs - query, match: [logql-metric-queries]}
  - {id: unwrap, name: LogQL unwrap and numeric extraction, source: Loki docs - metric queries, match: [logql-unwrap]}
  - {id: pattern-parser, name: LogQL pattern and regexp parsers, source: Loki docs - log queries, match: [pattern-parser]}
  - {id: line-format, name: LogQL line_format and label_format templates, source: Loki docs - template functions, match: [line-format]}
  - {id: limits-config, name: Loki limits_config and per-tenant overrides, source: Loki docs - configure, match: [loki-limits]}
  - {id: log-deletion, name: Loki compactor log deletion API, source: Loki docs - operations storage, match: [log-deletion]}
  - {id: multi-tenancy, name: Loki multi-tenancy and X-Scope-OrgID, source: Loki docs - operations, match: [loki-multi-tenancy]}
  - {id: query-frontend, name: Loki query frontend splitting and caching, source: Loki docs - operations caching, match: [loki-query-frontend]}
  - {id: loki-ruler, name: Loki ruler recording and alerting rules, source: Loki docs - alert, match: [loki-ruler-rules]}
  - {id: tsdb-index, name: Loki TSDB index and schema v13 migration, source: Loki docs - storage, match: [tsdb-index]}
  - {id: object-storage, name: Loki object storage configuration, source: Loki docs - storage, match: [loki-object-storage]}
  - {id: logcli, name: logcli queries and tail, source: Loki docs - query logcli, match: [logcli]}
  - {id: loki-api, name: Loki HTTP API push and query, source: Loki docs - reference, match: [loki-http-api]}
  - {id: loki-helm, name: Loki Helm chart installation, source: Loki docs - setup, match: [loki-helm-chart]}
  - {id: structured-metadata, name: Loki structured metadata, source: Loki docs - get started, match: [structured-metadata]}
  - {id: logs-drilldown, name: Grafana Logs Drilldown and patterns, source: Loki docs - visualize, match: [logs-drilldown]}
  - {id: traceql-metrics, name: TraceQL metrics queries, source: Tempo docs - TraceQL, match: [traceql-metrics]}
  - {id: metrics-generator, name: Tempo metrics-generator configuration, source: Tempo docs - metrics-generator, match: [tempo-metrics-generator]}
  - {id: tempo-api, name: Tempo HTTP API search and trace lookup, source: Tempo docs - API, match: [tempo-http-api]}
  - {id: vparquet, name: Tempo Parquet block format, source: Tempo docs - configuration, match: [vparquet]}
  - {id: tempo-retention, name: Tempo compactor and retention, source: Tempo docs - configuration, match: [tempo-retention]}
  - {id: tempo-receivers, name: Tempo receivers OTLP Jaeger Zipkin, source: Tempo docs - configuration, match: [tempo-receivers]}
  - {id: tempo-multitenancy, name: Tempo multitenancy, source: Tempo docs - multitenancy, match: [tempo-multitenancy]}
  - {id: tail-sampling, name: Tail sampling with Alloy in front of Tempo, source: Tempo docs - sampling, match: [tail-sampling]}
  - {id: service-graphs, name: Tempo service graphs configuration, source: Tempo docs - metrics-generator, match: [service-graphs]}
  - {id: tempo-caching, name: Tempo caching and query performance, source: Tempo docs - caching, match: [tempo-caching]}
  - {id: mimir-modes, name: Mimir monolithic and microservices modes, source: Mimir docs - architecture, match: [mimir-deployment-modes]}
  - {id: hash-ring, name: Mimir hash ring and memberlist, source: Mimir docs - architecture, match: [hash-ring]}
  - {id: mimir-limits, name: Mimir limits and runtime overrides, source: Mimir docs - configuration, match: [mimir-limits]}
