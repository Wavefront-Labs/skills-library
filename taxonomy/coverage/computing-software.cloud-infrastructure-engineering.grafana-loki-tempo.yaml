  - {id: remote-write, name: Mimir remote write ingestion, source: Mimir docs - configure, match: [mimir-remote-write]}
  - {id: ha-tracker, name: Mimir HA tracker deduplication, source: Mimir docs - high availability, match: [ha-tracker]}
  - {id: query-sharding, name: Mimir query sharding, source: Mimir docs - query-frontend, match: [query-sharding]}
  - {id: alloy-syntax, name: Alloy configuration syntax and components, source: Alloy docs - get started, match: [alloy-syntax]}
  - {id: loki-process, name: Alloy loki.source.file and loki.process stages, source: Alloy docs - component reference, match: [loki-process]}
  - {id: discovery-relabel, name: Alloy discovery.kubernetes and relabeling, source: Alloy docs - component reference, match: [discovery-relabel]}
  - {id: prom-scrape, name: Alloy prometheus.scrape to remote write, source: Alloy docs - component reference, match: [alloy-prometheus-scrape]}
