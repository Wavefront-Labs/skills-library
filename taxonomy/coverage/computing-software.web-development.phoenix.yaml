# Coverage spec: phoenix. Topics from the official Phoenix guides.
subject: phoenix
scope:
  category: computing-software
  field: web-development
  products: [phoenix]
sources:
  - "https://hexdocs.pm/phoenix/overview.html"
topics:
  - id: install-prereqs
    name: "Installation prerequisites"
    source: "https://hexdocs.pm/phoenix/installation.html"
    match: [elixir,erlang,phxnew,inotifytools]
  - id: phx-new-project
    name: "Creating a project with phx.new"
    source: "https://hexdocs.pm/phoenix/up_and_running.html"
    match: [phxnew,phxserver,mixsetup]
  - id: directory-structure
    name: "Project directory structure"
    source: "https://hexdocs.pm/phoenix/directory_structure.html"
    match: [libhello,libhelloweb,assets]
  - id: request-lifecycle-page
    name: "Adding a new page route controller view"
    source: "https://hexdocs.pm/phoenix/request_lifecycle.html"
    match: [route,controller,template]
  - id: endpoint-plugs
    name: "Endpoint plugs and request flow"
    source: "https://hexdocs.pm/phoenix/request_lifecycle.html"
    match: [endpoint,pipeline]
  - id: routing-resources
    name: "Resource routes and phx.routes"
    source: "https://hexdocs.pm/phoenix/routing.html"
    match: [resources,phxroutes]
  - id: verified-routes
    name: "Verified routes with ~p"
    source: "https://hexdocs.pm/phoenix/routing.html"
    match: [verifiedroutes,sigilp]
  - id: scoped-routes
    name: "Scoped routes and aliases"
    source: "https://hexdocs.pm/phoenix/routing.html"
    match: [scope,alias]
  - id: pipelines
    name: "Router pipelines"
    source: "https://hexdocs.pm/phoenix/routing.html"
    match: [pipeline,browser,api]
  - id: function-plugs
    name: "Function plugs"
    source: "https://hexdocs.pm/phoenix/plug.html"
    match: [plug,conn]
  - id: module-plugs
    name: "Module plugs init and call"
    source: "https://hexdocs.pm/phoenix/plug.html"
    match: [moduleplug,init]
  - id: controller-actions
    name: "Controller actions and params"
    source: "https://hexdocs.pm/phoenix/controllers.html"
    match: [action,params,fallback]
  - id: rendering
    name: "Rendering HTML and formats"
    source: "https://hexdocs.pm/phoenix/controllers.html"
    match: [render,formats]
  - id: direct-responses
    name: "Sending responses directly and status"
    source: "https://hexdocs.pm/phoenix/controllers.html"
    match: [text,json,putstatus,contenttype]
  - id: controller-error-pages
    name: "Error pages from controllers"
    source: "https://hexdocs.pm/phoenix/controllers.html"
    match: [errorhtml]
  - id: function-components
    name: "Function components and attrs slots"
    source: "https://hexdocs.pm/phoenix/components.html"
    match: [attr,slot,component]
  - id: heex
    name: "HEEx templates and extensions"
    source: "https://hexdocs.pm/phoenix/components.html"
    match: [heex,sigilh]
  - id: liveview-intro
    name: "LiveView basics"
    source: "https://hexdocs.pm/phoenix/live_view.html"
    match: [liveview,mount,handleevent]
  - id: ecto-schema-gen
    name: "phx.gen.schema and schemas"
    source: "https://hexdocs.pm/phoenix/ecto.html"
    match: [phxgenschema,schema]
  - id: ecto-changesets
    name: "Changesets and validations"
    source: "https://hexdocs.pm/phoenix/ecto.html"
    match: [changeset,validate]
  - id: ecto-repo-persistence
    name: "Repo config and data persistence"
    source: "https://hexdocs.pm/phoenix/ecto.html"
    match: [repo,insert,update]
  - id: ecto-mix-tasks
    name: "Ecto mix tasks"
    source: "https://hexdocs.pm/phoenix/ecto.html"
    match: [ectocreate,ectomigrate,ectorollback]
  - id: contexts-intro
    name: "Contexts concept"
    source: "https://hexdocs.pm/phoenix/contexts.html"
    match: [context]
  - id: first-context
    name: "Your first context with generators"
    source: "https://hexdocs.pm/phoenix/your_first_context.html"
    match: [phxgenhtml,phxgencontext]
  - id: in-context-relationships
    name: "In-context relationships"
    source: "https://hexdocs.pm/phoenix/in_context_relationships.html"
    match: [assoc,manytomany]
  - id: cross-context
    name: "Cross-context boundaries"
    source: "https://hexdocs.pm/phoenix/cross_context_boundaries.html"
    match: [crosscontext,scope]
  - id: gen-auth
    name: "mix phx.gen.auth"
    source: "https://hexdocs.pm/phoenix/mix_phx_gen_auth.html"
    match: [phxgenauth,magiclink,sudomode]
  - id: scopes
    name: "Scopes"
    source: "https://hexdocs.pm/phoenix/scopes.html"
    match: [scope,currentscope]
  - id: api-authentication
    name: "API token authentication"
    source: "https://hexdocs.pm/phoenix/api_authentication.html"
    match: [bearer,apitoken]
  - id: json-api
    name: "JSON APIs and rendering"
    source: "https://hexdocs.pm/phoenix/json_and_apis.html"
    match: [json,phxgenjson]
  - id: action-fallback
    name: "Action fallback and FallbackController"
    source: "https://hexdocs.pm/phoenix/json_and_apis.html"
    match: [actionfallback,changesetjson]
  - id: api-only-apps
    name: "API-only applications"
    source: "https://hexdocs.pm/phoenix/json_and_apis.html"
    match: [noapp,noassets]
  - id: channels-basics
    name: "Channels concepts"
    source: "https://hexdocs.pm/phoenix/channels.html"
    match: [channel,topic,pubsub]
  - id: channels-join-events
    name: "Joining and handling events"
    source: "https://hexdocs.pm/phoenix/channels.html"
    match: [join,handlein,intercept]
  - id: channels-token-auth
    name: "Channels token authentication"
    source: "https://hexdocs.pm/phoenix/channels.html"
    match: [authtoken,usersocket]
  - id: channels-client
    name: "Writing a channels client"
    source: "https://hexdocs.pm/phoenix/writing_a_channels_client.html"
    match: [websocket,vsn]
  - id: presence
    name: "Phoenix Presence"
    source: "https://hexdocs.pm/phoenix/presence.html"
    match: [presence,track]
  - id: testing-basics
    name: "Running tests and tags"
    source: "https://hexdocs.pm/phoenix/testing.html"
    match: [mixtest,tags,partition]
  - id: testing-contexts
    name: "Testing contexts and schemas"
    source: "https://hexdocs.pm/phoenix/testing_contexts.html"
    match: [datacase]
  - id: testing-controllers
    name: "Testing controllers"
    source: "https://hexdocs.pm/phoenix/testing_controllers.html"
    match: [conncase]
  - id: testing-channels
    name: "Testing channels"
    source: "https://hexdocs.pm/phoenix/testing_channels.html"
    match: [channelcase]
  - id: telemetry-overview
    name: "Telemetry events and supervisor"
    source: "https://hexdocs.pm/phoenix/telemetry.html"
    match: [telemetry,metrics]
  - id: telemetry-metrics
    name: "Metrics and reporters"
    source: "https://hexdocs.pm/phoenix/telemetry.html"
    match: [summary,counter,livedashboard]
  - id: telemetry-periodic
    name: "Periodic measurements and custom events"
    source: "https://hexdocs.pm/phoenix/telemetry.html"
    match: [telemetrypoller,execute]
  - id: security-injection
    name: "RCE SQL injection SSRF"
    source: "https://hexdocs.pm/phoenix/security.html"
    match: [rce,sqlinjection,ssrf]
  - id: security-web
    name: "XSS CSRF CORS access control"
    source: "https://hexdocs.pm/phoenix/security.html"
    match: [xss,csrf,cors]
  - id: assets-js-css
    name: "Assets JS packages and esbuild"
    source: "https://hexdocs.pm/phoenix/asset_management.html"
    match: [esbuild,tailwind]
  - id: releases
    name: "Deploying with releases"
    source: "https://hexdocs.pm/phoenix/releases.html"
    match: [mixrelease,phxgenrelease]
  - id: containers
    name: "Deploying with containers"
    source: "https://hexdocs.pm/phoenix/containers.html"
    match: [dockerfile]
  - id: prod-locally
    name: "Running production locally"
    source: "https://hexdocs.pm/phoenix/prod_locally.html"
    match: [mixenv,secret]
  - id: clustering
    name: "Clustering"
    source: "https://hexdocs.pm/phoenix/clustering.html"
    match: [dnscluster,epmd]
  - id: custom-error-pages
    name: "Custom error pages"
    source: "https://hexdocs.pm/phoenix/custom_error_pages.html"
    match: [errorjson,customexceptions]
  - id: file-uploads
    name: "File uploads"
    source: "https://hexdocs.pm/phoenix/file_uploads.html"
    match: [plugupload,multipart]
  - id: swapping-databases
    name: "Swapping databases"
    source: "https://hexdocs.pm/phoenix/swapping_databases.html"
    match: [mysql,sqlite]
  - id: using-ssl
    name: "SSL and HSTS"
    source: "https://hexdocs.pm/phoenix/using_ssl.html"
    match: [https,forcessl,hsts]
