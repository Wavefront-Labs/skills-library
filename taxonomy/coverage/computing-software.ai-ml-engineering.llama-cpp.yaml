# Coverage spec for llama.cpp, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: llama-cpp
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [llama-cpp]
sources:
  - "llama.cpp documentation (README, tools/server, docs/ build and backend pages, tools READMEs, grammars)"
