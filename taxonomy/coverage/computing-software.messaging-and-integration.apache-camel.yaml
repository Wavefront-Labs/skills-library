# Coverage spec for Apache Camel (computing-software / messaging-and-integration).
subject: Apache Camel
scope:
  category: computing-software
  field: messaging-and-integration
  products: [apache-camel]
sources:
  - "Apache Camel manual (https://camel.apache.org/manual/)"
  - "Apache Camel EIPs (https://camel.apache.org/components/next/eips/)"
  - "Apache Camel components (https://camel.apache.org/components/next/)"
  - "Apache Camel languages (https://camel.apache.org/components/next/languages/)"
topics:
  - id: error-handler-types
    name: "Error handler types and redelivery"
    source: https://camel.apache.org/manual/error-handler.html
    match: ["error-handler", "defaulterrorhandler", "onexception", "redelivery"]
  - id: dead-letter-channel
    name: "Dead Letter Channel"
    source: https://camel.apache.org/components/next/eips/dead-letter-channel.html
    match: ["dead-letter-channel", "deadletteruri", "delaypattern", "useoriginalmessage"]
  - id: graceful-shutdown
    name: "Graceful shutdown"
    source: https://camel.apache.org/manual/graceful-shutdown.html
    match: ["shutdown", "shutdownstrategy", "inflight", "timeout"]
  - id: route-startup-ordering
    name: "Route startup ordering and autoStartup"
    source: https://camel.apache.org/manual/configuring-route-startup-ordering-and-autostartup.html
    match: ["startuporder", "autostartup", "route-controller"]
  - id: property-placeholders
    name: "Property placeholders"
    source: https://camel.apache.org/manual/using-propertyplaceholder.html
    match: ["placeholder", "properties-component", "optional-placeholder"]
  - id: variables
    name: "Variables and scopes"
    source: https://camel.apache.org/manual/variables.html
    match: ["variable", "global-variable", "route-variable"]
  - id: stream-caching
    name: "Stream caching"
    source: https://camel.apache.org/manual/stream-caching.html
    match: ["stream-caching", "spoolthreshold", "inputstream"]
  - id: route-templates
    name: "Route templates"
    source: https://camel.apache.org/manual/route-template.html
    match: ["route-template", "templateparameter", "templatedroute"]
  - id: route-configuration
    name: "Route configuration"
    source: https://camel.apache.org/manual/route-configuration.html
    match: ["route-configuration", "routeconfigurationid"]
  - id: route-policy
    name: "RoutePolicy"
    source: https://camel.apache.org/manual/route-policy.html
    match: ["routepolicy", "throttlinginflight", "clusteredroutepolicy"]
  - id: oncompletion
    name: "onCompletion"
    source: https://camel.apache.org/manual/oncompletion.html
    match: ["oncompletion", "unit-of-work", "synchronization"]
  - id: type-converters
    name: "Type converters"
    source: https://camel.apache.org/manual/type-converter.html
    match: ["type-converter", "converter-annotation", "fallbackconverter"]
  - id: thread-pool-profiles
    name: "Threading model and thread pool profiles"
    source: https://camel.apache.org/manual/threading-model.html
    match: ["thread-pool", "threadpoolprofile", "executorservice", "virtual-threads"]
  - id: rest-dsl-basics
    name: "Rest DSL basics"
    source: https://camel.apache.org/manual/rest-dsl.html
    match: ["rest-dsl", "restconfiguration", "inline-routes"]
  - id: testing-modules-and-tools
    name: "Testing modules and tools"
    source: https://camel.apache.org/manual/testing.html
    match: ["testing", "advicewith", "notifybuilder", "camel-test-junit5"]
  - id: camel-jbang-cli
    name: "Camel CLI (JBang)"
    source: https://camel.apache.org/manual/camel-jbang.html
    match: ["camel-jbang", "camel-cli", "camel-run", "camel-export"]
  - id: intercept
    name: "Intercept, interceptFrom, interceptSendToEndpoint"
    source: https://camel.apache.org/components/next/eips/intercept.html
    match: ["intercept", "interceptfrom", "detour"]
  - id: content-based-router-choice
    name: "Choice (content-based router)"
    source: https://camel.apache.org/components/next/eips/choice-eip.html
    match: ["choice", "content-based-router", "when-otherwise"]
  - id: switch
    name: "Switch EIP"
    source: https://camel.apache.org/components/next/eips/switch-eip.html
    match: ["switch", "case-table"]
  - id: message-filter
    name: "Message Filter"
    source: https://camel.apache.org/components/next/eips/filter-eip.html
    match: ["filter", "message-filter"]
  - id: splitter
    name: "Splitter"
    source: https://camel.apache.org/components/next/eips/split-eip.html
    match: ["split", "splitter", "tokenize"]
  - id: aggregator
    name: "Aggregator"
    source: https://camel.apache.org/components/next/eips/aggregate-eip.html
    match: ["aggregate", "aggregator", "completion", "correlation"]
  - id: resequencer
    name: "Resequencer"
    source: https://camel.apache.org/components/next/eips/resequence-eip.html
    match: ["resequence", "resequencer"]
  - id: recipient-list
    name: "Recipient List"
    source: https://camel.apache.org/components/next/eips/recipientList-eip.html
    match: ["recipient-list", "recipientlist"]
  - id: routing-slip
    name: "Routing Slip"
    source: https://camel.apache.org/components/next/eips/routingSlip-eip.html
    match: ["routing-slip", "routingslip"]
  - id: dynamic-router
    name: "Dynamic Router"
    source: https://camel.apache.org/components/next/eips/dynamicRouter-eip.html
    match: ["dynamic-router", "dynamicrouter"]
  - id: multicast
    name: "Multicast"
    source: https://camel.apache.org/components/next/eips/multicast-eip.html
    match: ["multicast", "onprepare"]
  - id: failover-load-balancer
    name: "Load Balancer and failover policy"
    source: https://camel.apache.org/components/next/eips/failoverLoadBalancer-eip.html
    match: ["load-balancer", "failover", "round-robin", "sticky"]
  - id: enrich
    name: "Enrich"
    source: https://camel.apache.org/components/next/eips/enrich-eip.html
    match: ["enrich", "content-enricher"]
  - id: poll-enrich
    name: "Poll Enrich"
    source: https://camel.apache.org/components/next/eips/pollEnrich-eip.html
    match: ["pollenrich", "polling-consumer"]
  - id: claim-check
    name: "Claim Check"
    source: https://camel.apache.org/components/next/eips/claimCheck-eip.html
    match: ["claim-check", "claimcheck"]
  - id: idempotent-consumer
    name: "Idempotent Consumer"
    source: https://camel.apache.org/components/next/eips/idempotentConsumer-eip.html
    match: ["idempotent-consumer", "duplicate-detection"]
  - id: throttler
    name: "Throttler"
    source: https://camel.apache.org/components/next/eips/throttle-eip.html
    match: ["throttle", "throttler", "rate-limit"]
  - id: delayer
    name: "Delayer"
    source: https://camel.apache.org/components/next/eips/delay-eip.html
    match: ["delay", "delayer"]
  - id: circuit-breaker
    name: "Circuit Breaker"
    source: https://camel.apache.org/components/next/eips/circuitBreaker-eip.html
    match: ["circuit-breaker", "resilience4j", "onfallback"]
  - id: saga
    name: "Saga"
    source: https://camel.apache.org/components/next/eips/saga-eip.html
    match: ["saga", "compensation", "lra"]
  - id: wire-tap
    name: "Wire Tap"
    source: https://camel.apache.org/components/next/eips/wireTap-eip.html
    match: ["wire-tap", "wiretap"]
  - id: transactional-client
    name: "Transactional client"
    source: https://camel.apache.org/components/next/eips/transactional-client.html
    match: ["transacted", "transaction", "jta"]
  - id: to-dynamic
    name: "toD dynamic endpoints"
    source: https://camel.apache.org/components/next/eips/toD-eip.html
    match: ["tod", "dynamic-endpoint"]
  - id: loop
    name: "Loop"
    source: https://camel.apache.org/components/next/eips/loop-eip.html
    match: ["loop", "dowhile"]
  - id: validate
    name: "Validate"
    source: https://camel.apache.org/components/next/eips/validate-eip.html
    match: ["validate", "predicatevalidationexception"]
  - id: message-history
    name: "Message History"
    source: https://camel.apache.org/components/next/eips/message-history.html
    match: ["message-history", "troubleshooting"]
  - id: file-consumer
    name: "File component (consumer)"
    source: https://camel.apache.org/components/next/file-component.html
    match: ["file", "readlock", "idempotent", "donefile"]
  - id: ftp-component
    name: "FTP, SFTP and FTPS"
    source: https://camel.apache.org/components/next/ftp-component.html
    match: ["ftp", "sftp", "ftps"]
  - id: timer-component
    name: "Timer component"
    source: https://camel.apache.org/components/next/timer-component.html
    match: ["timer", "period", "fixedrate"]
  - id: quartz-component
    name: "Quartz component"
    source: https://camel.apache.org/components/next/quartz-component.html
    match: ["quartz", "cron"]
  - id: direct-component
    name: "Direct component"
    source: https://camel.apache.org/components/next/direct-component.html
    match: ["direct", "synchronous"]
  - id: seda-component
    name: "SEDA component"
    source: https://camel.apache.org/components/next/seda-component.html
    match: ["seda", "blockingqueue", "concurrentconsumers"]
  - id: http-component
    name: "HTTP client component"
    source: https://camel.apache.org/components/next/http-component.html
    match: ["http", "httpmethod", "throwexceptiononfailure"]
  - id: kafka-component
    name: "Kafka component"
    source: https://camel.apache.org/components/next/kafka-component.html
    match: ["kafka", "groupid", "offsets"]
  - id: jms-component
    name: "JMS component"
    source: https://camel.apache.org/components/next/jms-component.html
    match: ["jms", "request-reply", "connectionfactory"]
  - id: sql-component
    name: "SQL component"
    source: https://camel.apache.org/components/next/sql-component.html
    match: ["sql", "onconsume", "named-parameters"]
  - id: jdbc-component
    name: "JDBC component"
    source: https://camel.apache.org/components/next/jdbc-component.html
    match: ["jdbc", "datasource", "outputtype"]
  - id: mail-component
    name: "Mail component"
    source: https://camel.apache.org/components/next/mail-component.html
    match: ["mail", "imap", "smtp"]
  - id: mock-component
    name: "Mock component"
    source: https://camel.apache.org/components/next/mock-component.html
    match: ["mock", "expectedmessagecount", "assertissatisfied"]
  - id: log-component
    name: "Log component"
    source: https://camel.apache.org/components/next/log-component.html
    match: ["log", "showall", "throughput"]
  - id: controlbus-component
    name: "ControlBus component"
    source: https://camel.apache.org/components/next/controlbus-component.html
    match: ["controlbus", "route-control"]
  - id: simple-language
    name: "Simple language"
    source: https://camel.apache.org/components/next/languages/simple-language.html
    match: ["simple", "expression-language"]
  - id: jsonpath-language
    name: "JSONPath language"
    source: https://camel.apache.org/components/next/languages/jsonpath-language.html
    match: ["jsonpath", "json"]
  - id: xpath-language
    name: "XPath language"
    source: https://camel.apache.org/components/next/languages/xpath-language.html
    match: ["xpath", "xml", "namespaces"]
