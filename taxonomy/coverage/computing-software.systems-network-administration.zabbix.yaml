# Coverage spec: zabbix. Topics from the Zabbix 7.4 manual.
subject: zabbix
scope:
  category: computing-software
  field: systems-network-administration
  products: [zabbix]
sources:
  - "Zabbix 7.4 manual (zabbix.com/documentation/current/en/manual)"
topics:
  - id: sizing-and-requirements
    name: "Installation sizing and requirements"
    source: "https://www.zabbix.com/documentation/current/en/manual/installation/requirements"
    match: [requirements, sizing, database]
  - id: agent2-core-configuration
    name: "Zabbix agent 2 configuration"
    source: "https://www.zabbix.com/documentation/current/en/manual/appendix/config/zabbix_agent2"
    match: [agent2, serveractive, hostname]
  - id: active-vs-passive-checks
    name: "Active versus passive checks"
    source: "https://www.zabbix.com/documentation/current/en/manual/appendix/items/activepassive"
    match: [active, passive, checks]
  - id: item-key-syntax
    name: "Item key syntax and parameters"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/item/key"
    match: [item-key, parameters, quoting]
  - id: item-flexible-and-scheduled-intervals
    name: "Custom item intervals"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/item/custom_intervals"
    match: [interval, flexible, scheduling]
  - id: restricting-agent-checks
    name: "Restricting agent checks with AllowKey and DenyKey"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/restrict_checks"
    match: [allowkey, denykey, restrict]
  - id: snmp-item-setup
    name: "SNMP item setup"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/snmp"
    match: [snmp, oid, snmpv3]
  - id: snmp-walk-and-bulk-requests
    name: "SNMP walk items and bulk requests"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/snmp"
    match: [walk, getbulk, bulk]
  - id: snmp-trap-receiving
    name: "Receiving SNMP traps"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/snmptrap"
    match: [snmptrap, snmptrapd, trapper]
  - id: http-agent-items
    name: "HTTP agent items"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/http"
    match: [http, agent, url]
  - id: calculated-items
    name: "Calculated items"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/calculated"
    match: [calculated, formula, aggregate]
  - id: dependent-items
    name: "Dependent items"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/dependent_items"
    match: [dependent, master, item]
  - id: ssh-items
    name: "SSH items"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/ssh_checks"
    match: [ssh, agentless, key]
  - id: jmx-items
    name: "JMX monitoring"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/jmx_monitoring"
    match: [jmx, java-gateway, mbean]
  - id: external-checks
    name: "External checks"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/external"
    match: [external, script, checks]
  - id: trapper-items-and-zabbix-sender
    name: "Trapper items and zabbix_sender"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/trapper"
    match: [trapper, sender, push]
  - id: zabbix-get-troubleshooting
    name: "Using zabbix_get"
    source: "https://www.zabbix.com/documentation/current/en/manual/concepts/get"
    match: [zabbix_get, agent, troubleshooting]
  - id: script-items
    name: "Script items"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/script"
    match: [script, javascript, httprequest]
  - id: log-monitoring-items
    name: "Log file monitoring"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/zabbix_agent/log_items"
    match: [log, logrt, monitoring]
  - id: internal-items-self-monitoring
    name: "Internal items for self-monitoring"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/internal"
    match: [internal, zabbix, process]
  - id: preprocessing-pipeline
    name: "Item value preprocessing"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/preprocessing"
    match: [preprocessing, transformation, steps]
  - id: javascript-preprocessing
    name: "JavaScript preprocessing"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/preprocessing/javascript"
    match: [javascript, preprocessing, duktape]
  - id: jsonpath-preprocessing
    name: "JSONPath in preprocessing"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/preprocessing/jsonpath_functionality"
    match: [jsonpath, json, extract]
  - id: preprocessing-throttling-and-change
    name: "Throttling and change steps"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/items/preprocessing"
    match: [discard-unchanged, heartbeat, change]
  - id: trigger-expression-syntax
    name: "Trigger expression syntax"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/triggers/expression"
    match: [trigger, expression, function]
  - id: trigger-operators-and-unknown-values
    name: "Trigger operators and unknown values"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/triggers/expression"
    match: [operators, unknown, precedence]
  - id: recovery-expressions-and-hysteresis
    name: "Recovery expressions and hysteresis"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/triggers/expression"
    match: [recovery, hysteresis, flapping]
  - id: trigger-event-generation-and-correlation
    name: "Trigger event generation and tag correlation"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/triggers/trigger"
    match: [problem-event-generation, multiple, correlation]
  - id: tags-and-event-tags
    name: "Tagging and event tags"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/tagging"
    match: [tags, event, tagging]
  - id: trigger-dependencies
    name: "Trigger dependencies"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/triggers/dependencies"
    match: [dependency, trigger, dependencies]
  - id: template-linking-and-nesting
    name: "Template linking and nesting"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/templates/linking"
    match: [template, linking, nesting]
  - id: user-macro-resolution
    name: "User macro resolution"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/macros/usermacros"
    match: [macro, user, precedence]
  - id: user-macro-context
    name: "User macro context"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/macros/usermacros_context"
    match: [macro, context, regex]
  - id: secret-and-vault-macros
    name: "Secret and vault macros"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/macros/secret_macros"
    match: [secret, vault, macro]
  - id: host-groups-and-subgroups
    name: "Host groups"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/hosts/host_groups"
    match: [host, group, subgroup]
  - id: lld-rules-and-lld-macros
    name: "Low-level discovery rules"
    source: "https://www.zabbix.com/documentation/current/en/manual/discovery/low_level_discovery"
    match: [discovery, low-level, lld]
  - id: lld-filters-and-overrides
    name: "LLD filters and overrides"
    source: "https://www.zabbix.com/documentation/current/en/manual/discovery/low_level_discovery"
    match: [filter, override, discovery]
  - id: item-prototypes
    name: "LLD item prototypes"
    source: "https://www.zabbix.com/documentation/current/en/manual/discovery/low_level_discovery/item_prototypes"
    match: [prototype, item, lld]
  - id: network-discovery
    name: "Network discovery rules"
    source: "https://www.zabbix.com/documentation/current/en/manual/discovery/network_discovery"
    match: [network, discovery, ip]
  - id: autoregistration-and-host-metadata
    name: "Active agent autoregistration"
    source: "https://www.zabbix.com/documentation/current/en/manual/discovery/auto_registration"
    match: [autoregistration, metadata, agent]
  - id: proxy-deployment-and-sync
    name: "Proxy deployment and configuration sync"
    source: "https://www.zabbix.com/documentation/current/en/manual/distributed_monitoring/proxies"
    match: [proxy, distributed, sync]
  - id: proxy-groups-load-balancing
    name: "Proxy groups and load balancing"
    source: "https://www.zabbix.com/documentation/current/en/manual/distributed_monitoring/proxies/ha"
    match: [proxy, group, failover]
  - id: actions-and-escalations
    name: "Actions and escalations"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/notifications/action"
    match: [action, escalation, operation]
  - id: recovery-and-update-operations
    name: "Recovery and update operations"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/notifications/action/recovery_operations"
    match: [recovery, update, operation]
  - id: email-and-webhook-media-types
    name: "Email and webhook media types"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/notifications/media/email"
    match: [media, email, webhook]
  - id: user-types-permissions-and-roles
    name: "Users, permissions and roles"
    source: "https://www.zabbix.com/documentation/current/en/manual/config/users_and_usergroups/permissions"
    match: [user, permission, role]
  - id: maintenance-windows
    name: "Maintenance windows"
    source: "https://www.zabbix.com/documentation/current/en/manual/maintenance"
    match: [maintenance, suppression, window]
  - id: web-scenarios
    name: "Web scenarios"
    source: "https://www.zabbix.com/documentation/current/en/manual/web_monitoring"
    match: [web, scenario, http]
  - id: api-tokens-and-authentication
    name: "API tokens"
    source: "https://www.zabbix.com/documentation/current/en/manual/web_interface/frontend_sections/users/api_tokens"
    match: [api, token, auth]
  - id: housekeeping-and-queue
    name: "Housekeeping and queue"
    source: "https://www.zabbix.com/documentation/current/en/manual/web_interface/frontend_sections/administration/housekeeping"
    match: [housekeeping, queue, retention]
  - id: psk-encryption
    name: "PSK encryption"
    source: "https://www.zabbix.com/documentation/current/en/manual/encryption/using_pre_shared_keys"
    match: [psk, encryption, tls]
  - id: server-ha-cluster
    name: "Server high availability"
    source: "https://www.zabbix.com/documentation/current/en/manual/concepts/server/ha"
    match: [high, availability, ha]
  - id: timescaledb-setup
    name: "TimescaleDB setup"
    source: "https://www.zabbix.com/documentation/current/en/manual/appendix/install/timescaledb"
    match: [timescaledb, postgresql, partitioning]
  - id: upgrade-planning
    name: "Upgrade planning"
    source: "https://www.zabbix.com/documentation/current/en/manual/installation/upgrade"
    match: [upgrade, version, packages]
