# Coverage spec for prometheus-operator, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: prometheus-operator
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [prometheus-operator]
sources:
  - "Prometheus Operator documentation (CRD guides, operator, Thanos, RBAC, webhook and troubleshooting pages)"
topics:
  - id: additional-scrape-configs
    name: "Additional scrape configs"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/additional-scrape-config.md"
    match: [additionalscrapeconfigs, extra-scrape-config, secret-scrape-config]
  - id: admission-webhook
    name: "Admission webhook"
    source: "https://prometheus-operator.dev/docs/platform/webhook/"
    match: [admission-webhook, validating-webhook, conversion-webhook]
  - id: aggregate-crd-clusterroles
    name: "Aggregate crd clusterroles"
    source: "https://prometheus-operator.dev/docs/platform/rbac-crd/"
    match: [aggregated-clusterroles, rbac-view-edit-admin, crd-permissions]
  - id: alertmanager-configuration-methods
    name: "Alertmanager configuration methods"
    source: "https://prometheus-operator.dev/docs/developer/alerting/"
    match: [alertmanager-config, alertmanagerconfig-crd, configsecret]
  - id: architecture-and-crds
    name: "Architecture and crds"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/getting-started/design.md"
    match: [prometheus-operator, crds, servicemonitor]
  - id: compatibility-and-requirements
    name: "Compatibility and requirements"
    source: "https://prometheus-operator.dev/docs/getting-started/compatibility/"
    match: [compatibility, kubernetes-version, cel]
  - id: deploy-alertmanager-and-connect
    name: "Deploy alertmanager and connect"
    source: "https://prometheus-operator.dev/docs/platform/platform-guide/"
    match: [deploy-alertmanager, alertmanager-service, nodeport]
  - id: deploy-prometheus-with-rbac
    name: "Deploy prometheus with rbac"
    source: "https://prometheus-operator.dev/docs/platform/platform-guide/"
    match: [deploy-prometheus, serviceaccount, clusterrole]
  - id: endpointslice-migration
    name: "Endpointslice migration"
    source: "https://prometheus-operator.dev/docs/platform/troubleshooting/"
    match: [endpointslice, endpoints-deprecated, servicediscoveryrole]
  - id: exposing-metrics-instrumentation
    name: "Exposing metrics instrumentation"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/exposing-metrics.md"
    match: [instrumentation, client-libraries, instance-exporters]
  - id: exposing-prometheus-and-alertmanager
    name: "Exposing prometheus and alertmanager"
    source: "https://prometheus-operator.dev/docs/platform/exposing-prometheus-and-alertmanager/"
    match: [exposing-services, nodeport-service, kubectl-proxy]
  - id: high-availability
    name: "High availability"
    source: "https://prometheus-operator.dev/docs/platform/high-availability/"
    match: [high-availability, ha-pair, external-labels]
  - id: installation-methods
    name: "Installation methods"
    source: "https://prometheus-operator.dev/docs/getting-started/installation/"
    match: [installation, bundle-yaml, kube-prometheus]
  - id: multiple-operators-controller-id
    name: "Multiple operators controller id"
    source: "https://prometheus-operator.dev/docs/platform/troubleshooting/"
    match: [controller-id-annotation, multiple-operators, terminating-loop]
  - id: network-policies
    name: "Network policies"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/network-policies.md"
    match: [network-policy, alertmanager-mesh-port, node-exporter-networkpolicy]
  - id: operator-flags-and-scoping
    name: "Operator flags and scoping"
    source: "https://prometheus-operator.dev/docs/platform/operator/"
    match: [operator-flags, namespaces, deny-namespaces]
  - id: operator-high-cpu-secret-watch
    name: "Operator high cpu secret watch"
    source: "https://prometheus-operator.dev/docs/platform/troubleshooting/"
    match: [operator-cpu, reconcile-rate, secret-field-selector]
  - id: operator-rbac-clusterrole
    name: "Operator rbac clusterrole"
    source: "https://prometheus-operator.dev/docs/platform/rbac/"
    match: [operator-rbac, statefulsets, prometheus-operated]
  - id: persistent-storage
    name: "Persistent storage"
    source: "https://prometheus-operator.dev/docs/platform/storage/"
    match: [persistent-storage, volumeclaimtemplate, storageclass]
  - id: pod-security-restricted-patch
    name: "Pod security restricted patch"
    source: "https://prometheus-operator.dev/docs/platform/strategic-merge-patch/"
    match: [pod-security-standards, restricted-policy, baseline-policy]
  - id: prometheus-agent
    name: "Prometheus agent"
    source: "https://prometheus-operator.dev/docs/platform/prometheus-agent/"
    match: [prometheusagent, agent-mode, remote-write]
  - id: prometheusrule-and-ruleselector
    name: "Prometheusrule and ruleselector"
    source: "https://prometheus-operator.dev/docs/developer/alerting/"
    match: [prometheusrule, alerting-rules, recording-rules]
  - id: remote-write-mimir-deduplication
    name: "Remote write mimir deduplication"
    source: "https://prometheus-operator.dev/docs/platform/troubleshooting/"
    match: [mimir-deduplication, replica-label, cluster-label]
  - id: resize-volumes
    name: "Resize volumes"
    source: "https://prometheus-operator.dev/docs/platform/storage/"
    match: [volume-resize, statefulset-orphan, spec-paused]
  - id: resource-selectors
    name: "Resource selectors"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/getting-started/design.md"
    match: [resource-selectors, servicemonitorselector, namespace-selector]
  - id: running-exporters-and-default-labels
    name: "Running exporters and default labels"
    source: "https://prometheus-operator.dev/docs/user-guides/running-exporters/"
    match: [exporters, kube-state-metrics, joblabel]
  - id: scrapeclass
    name: "Scrapeclass"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/developer/scrapeclass.md"
    match: [scrapeclass, scrape-class-default, tlsconfig-merge]
  - id: scrapeconfig-crd-and-selection
    name: "Scrapeconfig crd and selection"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/developer/scrapeconfig.md"
    match: [scrapeconfig, scrapeconfig-selector, external-targets]
  - id: scrapeconfig-kubernetes-file-http-sd
    name: "Scrapeconfig kubernetes file http sd"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/developer/scrapeconfig.md"
    match: [kubernetes-sd, file-sd, http-sd]
  - id: servicemonitor-podmonitor-quickstart
    name: "Servicemonitor podmonitor quickstart"
    source: "https://prometheus-operator.dev/docs/developer/getting-started/"
    match: [servicemonitor-example, podmonitor-example, metrics-port-name]
  - id: sharding-topology-and-retention
    name: "Sharding topology and retention"
    source: "https://prometheus-operator.dev/docs/platform/sharding/"
    match: [topology-sharding, shard-retention-policy, zone-aware]
  - id: sharding
    name: "Sharding"
    source: "https://prometheus-operator.dev/docs/platform/sharding/"
    match: [sharding, shards, modulus]
  - id: statefulset-repair-policy
    name: "Statefulset repair policy"
