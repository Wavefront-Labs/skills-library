    match: [repair-policy-for-statefulsets, stuck-rollout, pod-eviction]
  - id: storage-volume-permissions-fsgroup
    name: "Storage volume permissions fsgroup"
    source: "https://prometheus-operator.dev/docs/platform/storage/"
    match: [fsgroup, volume-permissions, security-context]
  - id: strategic-merge-patch-containers
    name: "Strategic merge patch containers"
    source: "https://prometheus-operator.dev/docs/platform/strategic-merge-patch/"
    match: [strategic-merge-patch, spec-containers, additionalargs]
  - id: thanos-ruler
    name: "Thanos ruler"
    source: "https://prometheus-operator.dev/docs/platform/thanos/"
    match: [thanos-ruler, queryendpoints, queryconfig]
  - id: thanos-sidecar
    name: "Thanos sidecar"
    source: "https://prometheus-operator.dev/docs/platform/thanos/"
    match: [thanos-sidecar, objectstorageconfig, object-storage]
  - id: troubleshooting-crd-apply-annotations-too-long
    name: "Troubleshooting crd apply annotations too long"
    source: "https://prometheus-operator.dev/docs/platform/troubleshooting/"
    match: [crd-annotations-too-long, server-side-apply, argocd-server-side]
  - id: troubleshooting-servicemonitor
    name: "Troubleshooting servicemonitor"
    source: "https://prometheus-operator.dev/docs/platform/troubleshooting/"
    match: [troubleshooting, servicemonitor-not-picked-up, target-discovery]
  - id: unmanaged-custom-configuration
    name: "Unmanaged custom configuration"
    source: "https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/custom-configuration.md"
    match: [custom-configuration, unmanaged-config, prometheus-yaml-gz]
