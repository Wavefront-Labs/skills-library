# Canonical coverage spec: conservation and restoration (all products in the field).
# Checked by tools/coverage_check.py. A topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external professional-conservation structures: the AIC Code of
# Ethics and Guidelines for Practice and the AIC specialty-group wikis/catalogs (Paintings
# Conservation Catalog, Book and Paper Group Wiki, Objects and Textile wikis), ECCO/ICON
# professional standards, ICOM-CC working groups, the Getty Conservation Institute, the
# Canadian Conservation Institute Notes and Ten Agents of Deterioration, the NPS Museum Handbook
# Part I chapters, and the CEN/TC 346 and BSI/ISO collection-care standards listed below.
subject: conservation-and-restoration
scope:
  category: creative-arts
  field: conservation-and-restoration
  products: [paintings-conservation, paper-and-books-conservation, textile-conservation, objects-and-sculpture-conservation, condition-reporting, preventive-conservation, art-handling-and-mounting]
sources:
  - "AIC Code of Ethics and Guidelines for Practice (examination, documentation, treatment, preventive care, emergency response, reporting) - https://www.culturalheritage.org/about-conservation/code-of-ethics"
  - "AIC conservation wiki (Paintings Conservation Catalog, BPG Wiki, Objects Specialty Group, Textile Specialty Group, Electronic Media) - https://www.conservation-wiki.com"
  - "ECCO Professional Guidelines (2002-2004) and E.C.C.O. Competences for access to the conservation-restoration profession - https://www.ecco-eu.org"
  - "ICON Professional Standards and PACR accreditation framework (assessment, conservation options, conservation measures, organisation, professional development) - https://www.icon.org.uk"
  - "ICOM-CC Working Groups (Paintings; Graphic Documents; Textiles; Metals; Glass and Ceramics; Stone, Murals and Rock Art; Wood, Furniture and Lacquer; Modern Materials; Documentation; Preventive Conservation; Leather; Photographic Materials; Theory and History) - https://www.icom-cc.org"
  - "Getty Conservation Institute publications and courses (Cleaning of Painted Surfaces, Gels in Conservation, Preventive conservation, Managing collection environments) - https://www.getty.edu/conservation"
  - "Canadian Conservation Institute Notes series and Ten Agents of Deterioration; RE-ORG method (with ICCROM); ABC Method risk assessment - https://www.canada.ca/en/conservation-institute.html"
  - "NPS Museum Handbook Part I chapters (Museum Collections Environment; Biological Infestations; Handling, Packing and Shipping; Storage; Conservation Treatment; Security and Fire Protection; Emergency Planning; Curatorial Health and Safety) and Conserve O Gram series - https://www.nps.gov/subjects/museums"
  - "PAS 198:2012 environmental conditions for cultural collections (succeeded by BS EN 16893:2018 and BS 4971:2017); ISO 11799:2015 document storage requirements; BS EN 15757 RH/T for organic hygroscopic materials; BS EN 16095 condition recording; BS EN 16853 conservation decision making; BS EN 15946 packing principles; BS EN 16648 transport methods; BS EN 15999-1 display cases; BS EN 16790 integrated pest management; BS EN 15898 conservation terminology"
  - "NEDCC Preservation Leaflets; Image Permanence Institute guides (environment, film decay, A-D strips); FADGI technical guidelines for imaging cultural heritage - https://www.nedcc.org ; https://www.imagepermanenceinstitute.org"
  - "Reference texts - Lennard and Ewer Textile Conservation Advances in Practice; Buys and Oakley Conservation and Restoration of Ceramics; Selwyn Metals and Corrosion; Stolow Conservation and Exhibitions; Buck and Gilmore Museum Registration Methods; Hatchfield Pollutants in the Museum Environment; Ellis The Practical Guide to the Care of Books and Paper"
