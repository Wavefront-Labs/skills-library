# Coverage spec: leptos. Topics from the official docs table of contents.
subject: leptos
scope:
  category: computing-software
  field: web-development
  products: [leptos]
sources:
  - "Leptos book (book.leptos.dev)"
topics:
  - id: leptos-a-csr-trunk-setup
    name: "Client-side rendering setup with Trunk"
    source: "https://book.leptos.dev/getting_started/"
    match: [trunk, csr]
  - id: leptos-a-choose-csr-or-ssr
    name: "CSR versus SSR"
    source: "https://book.leptos.dev/getting_started/"
    match: [ssr, csr]
  - id: leptos-a-console-error-panic-hook
    name: "console_error_panic_hook"
    source: "https://book.leptos.dev/getting_started/leptos_dx.html"
    match: [console-error-panic-hook]
  - id: leptos-a-rust-analyzer-config
    name: "rust-analyzer configuration"
    source: "https://book.leptos.dev/getting_started/leptos_dx.html"
    match: [rust-analyzer]
  - id: leptos-a-leptosfmt
    name: "leptosfmt formatter"
    source: "https://book.leptos.dev/getting_started/leptos_dx.html"
    match: [leptosfmt]
  - id: leptos-a-erase-components
    name: "erase_components compile flag"
    source: "https://book.leptos.dev/getting_started/leptos_dx.html"
    match: [erase-components]
  - id: leptos-a-first-component
    name: "A basic component"
    source: "https://book.leptos.dev/view/01_basic_component.html"
    match: [component, mount]
  - id: leptos-a-reactive-values
    name: "Reactive vs static view values"
    source: "https://book.leptos.dev/view/01_basic_component.html"
    match: [reactivity]
  - id: leptos-a-dynamic-attrs
    name: "Dynamic classes styles attributes"
    source: "https://book.leptos.dev/view/02_dynamic_attributes.html"
    match: [class, style, derived-signal]
  - id: leptos-a-props
    name: "Component props"
    source: "https://book.leptos.dev/view/03_components.html"
    match: [props]
  - id: leptos-a-generic-props
    name: "Generic and into props"
    source: "https://book.leptos.dev/view/03_components.html"
    match: [generics, into]
  - id: leptos-a-spread
    name: "Spreading attributes onto components"
    source: "https://book.leptos.dev/view/03_components.html"
    match: [spread]
  - id: leptos-a-iteration
    name: "Iteration with Vec and For"
    source: "https://book.leptos.dev/view/04_iteration.html"
    match: [iteration, for]
  - id: leptos-a-for-complex-data
    name: "Iterating complex data"
    source: "https://book.leptos.dev/view/04b_iteration.html"
    match: [store, memo]
  - id: leptos-a-controlled-inputs
    name: "Controlled inputs and bind"
    source: "https://book.leptos.dev/view/05_forms.html"
    match: [controlled, bind]
  - id: leptos-a-uncontrolled-inputs
    name: "Uncontrolled inputs"
    source: "https://book.leptos.dev/view/05_forms.html"
    match: [uncontrolled, node-ref]
  - id: leptos-b-control-flow-rust
    name: "Conditional rendering with Rust control flow"
    source: "https://book.leptos.dev/view/06_control_flow.html"
    match: [conditional-rendering, match]
  - id: leptos-b-show-component
    name: "Show component and over-rendering"
    source: "https://book.leptos.dev/view/06_control_flow.html"
    match: [show, rerender]
  - id: leptos-b-branch-type-conversion
    name: "View type conversions in branches"
    source: "https://book.leptos.dev/view/06_control_flow.html"
    match: [into-any, either]
  - id: leptos-b-error-boundary
    name: "Error handling with ErrorBoundary"
    source: "https://book.leptos.dev/view/07_errors.html"
    match: [error-boundary]
  - id: leptos-b-parent-child-patterns
    name: "Parent-child communication"
    source: "https://book.leptos.dev/view/08_parent_child.html"
    match: [parent-child, callbacks]
  - id: leptos-b-context-api
    name: "Context API"
    source: "https://book.leptos.dev/view/08_parent_child.html"
    match: [provide-context, prop-drilling]
  - id: leptos-b-children-render-props
    name: "Passing children and render props"
    source: "https://book.leptos.dev/view/09_component_children.html"
    match: [render-props, fragment]
  - id: leptos-b-slots
    name: "Typed children with slots"
    source: "https://book.leptos.dev/view/09_component_children.html"
    match: [slots, slot-macro]
  - id: leptos-b-builder-syntax
    name: "View builder syntax"
    source: "https://book.leptos.dev/view/builder.html"
    match: [builder-syntax, no-macros]
  - id: leptos-b-signal-methods
    name: "Working with signals"
    source: "https://book.leptos.dev/reactivity/working_with_signals.html"
    match: [signals, local-signals]
  - id: leptos-b-derived-closures
    name: "Derived signals and reactivity functions"
    source: "https://book.leptos.dev/reactivity/interlude_functions.html"
    match: [derived-signal, closures]
  - id: leptos-b-effects
    name: "Responding to changes with effects"
    source: "https://book.leptos.dev/reactivity/14_create_effect.html"
    match: [effects, effect-watch]
  - id: leptos-b-testing
    name: "Testing your components"
    source: "https://book.leptos.dev/testing.html"
    match: [testing, e2e]
  - id: leptos-b-resources
    name: "Loading data with resources"
    source: "https://book.leptos.dev/async/10_resources.html"
    match: [resource, local-resource]
  - id: leptos-b-suspense
    name: "Suspense, Await and Transition"
    source: "https://book.leptos.dev/async/11_suspense.html"
    match: [suspense, transition]
  - id: leptos-b-actions
    name: "Mutating data with actions"
    source: "https://book.leptos.dev/async/13_actions.html"
    match: [action, dispatch]
  - id: leptos-c-projecting-children
    name: "Projecting children with StoredValue"
    source: "https://book.leptos.dev/interlude_projecting_children.html"
    match: [stored-value, children]
  - id: leptos-c-clone-into-children
    name: "clone helper for nested children"
    source: "https://book.leptos.dev/interlude_projecting_children.html"
    match: [clone]
  - id: leptos-c-global-state-context
    name: "Global state via context"
    source: "https://book.leptos.dev/15_global_state.html"
    match: [context, global-state]
  - id: leptos-c-global-state-stores
    name: "Global state with stores"
    source: "https://book.leptos.dev/15_global_state.html"
    match: [stores, reactive-stores]
  - id: leptos-c-router-routes
    name: "Defining routes"
    source: "https://book.leptos.dev/router/16_routes.html"
    match: [routes, routing]
  - id: leptos-c-router-nested
    name: "Nested routing"
    source: "https://book.leptos.dev/router/17_nested_routing.html"
    match: [nested-routes, outlet]
  - id: leptos-c-router-params
    name: "Params and queries"
    source: "https://book.leptos.dev/router/18_params_and_queries.html"
    match: [params, query-string]
  - id: leptos-c-router-a
    name: "The A component and navigation"
    source: "https://book.leptos.dev/router/19_a.html"
    match: [links, navigation]
  - id: leptos-c-router-form
    name: "The Form component"
    source: "https://book.leptos.dev/router/20_form.html"
    match: [form, search]
  - id: leptos-c-styling
    name: "Styling"
    source: "https://book.leptos.dev/interlude_styling.html"
    match: [styling, css, tailwind]
  - id: leptos-c-metadata
    name: "Metadata"
    source: "https://book.leptos.dev/metadata.html"
    match: [leptos-meta, head]
  - id: leptos-c-web-sys
    name: "web-sys and NodeRef"
    source: "https://book.leptos.dev/web_sys.html"
    match: [web-sys, noderef]
  - id: leptos-c-cargo-leptos
    name: "cargo-leptos"
    source: "https://book.leptos.dev/ssr/21_cargo_leptos.html"
    match: [cargo-leptos, setup]
  - id: leptos-c-ssr-lifecycle
    name: "Life of a page load"
    source: "https://book.leptos.dev/ssr/22_life_cycle.html"
    match: [lifecycle]
  - id: leptos-c-ssr-modes
    name: "SSR modes"
    source: "https://book.leptos.dev/ssr/23_ssr_modes.html"
    match: [streaming, suspense]
  - id: leptos-c-hydration-bugs
    name: "Hydration bugs"
    source: "https://book.leptos.dev/ssr/24_hydration_bugs.html"
    match: [hydration, debugging]
  - id: leptos-d-leptos-d-server-function-basics
    name: "Server functions"
    source: "https://book.leptos.dev/server/25_server_functions.html"
    match: [server-functions, server]
  - id: leptos-d-leptos-d-server-extractors
    name: "Extractors"
    source: "https://book.leptos.dev/server/26_extractors.html"
    match: [extractors, axum]
  - id: leptos-d-leptos-d-server-state-and-context
    name: "Axum state and context"
    source: "https://book.leptos.dev/server/26_extractors.html"
    match: [axum, state]
  - id: leptos-d-leptos-d-server-response-and-redirect
    name: "Responses and redirects"
    source: "https://book.leptos.dev/server/27_response.html"
    match: [response-options, redirect]
  - id: leptos-d-leptos-d-async-execution-stages
    name: "Async quick reference"
    source: "https://book.leptos.dev/server/28_async_quick_reference.html"
    match: [async, resources]
  - id: leptos-d-leptos-d-progressive-enhancement-design
    name: "Progressive enhancement"
    source: "https://book.leptos.dev/progressive_enhancement/index.html"
