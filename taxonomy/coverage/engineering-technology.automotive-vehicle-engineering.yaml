# Canonical coverage spec: automotive vehicle engineering (civil road vehicles; whole field).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
# Topics and subtopics come from external structures named in sources, not from existing skills.
# Scope is civil automotive engineering only. Safety-critical areas are professional practice guidance.
subject: automotive-vehicle-engineering
scope:
  category: engineering-technology
  field: automotive-vehicle-engineering
  products: [matlab-simulink, vehicle-dynamics, powertrain-design, ev-battery-systems, chassis-suspension-design, crash-safety, nvh, vehicle-electrical-architecture]
sources:
  - "Gillespie, Fundamentals of Vehicle Dynamics (SAE); Milliken and Milliken, Race Car Vehicle Dynamics; Pacejka, Tire and Vehicle Dynamics; Jazar, Vehicle Dynamics (chapter lists)"
  - "Ehsani et al., Modern Electric Hybrid Electric and Fuel Cell Vehicles; Heywood, Internal Combustion Engine Fundamentals; Guzzella and Sciarretta, Vehicle Propulsion Systems (chapter lists)"
  - "Reimpell, Stoll and Betzler, The Automotive Chassis; Limpert, Brake Design and Safety; Happian-Smith, Introduction to Modern Vehicle Design (chapter lists)"
  - "Linden and Reddy, Handbook of Batteries; Plett, Battery Management Systems Vols 1 and 2; Warner, Lithium-Ion Battery Chemistries and Pack Design (chapter lists); UN Manual of Tests and Criteria section 38.3; UN Regulation 100; UN GTR 20; ISO 6469 series"
  - "Kramer, Passive Safety of Vehicles; Huang, Vehicle Crash Mechanics; Euro NCAP, IIHS and NHTSA NCAP protocol overviews; FMVSS 208 214 216 301 and UN Regulations 94 95 and 137 overviews; LS-DYNA user manual contents"
  - "Harrison, Vehicle Refinement; Zwicker and Fastl, Psychoacoustics; Genuit, Sound-Engineering im Automobilbereich; ISO 362 pass-by overview; UN R138 AVAS overview"
  - "Navet and Simonot-Lion, Automotive Embedded Systems Handbook; ISO 11898 CAN; ISO 26262 parts 1-12; ISO/SAE 21434; UN R155 and R156; AUTOSAR specifications overview; ISO 14229 UDS"
  - "MathWorks documentation tables of contents for Simulink, Stateflow, Powertrain Blockset, Vehicle Dynamics Blockset, Model Predictive Control Toolbox, Embedded Coder, AUTOSAR Blockset, Simulink Test and Simulink Real-Time"
