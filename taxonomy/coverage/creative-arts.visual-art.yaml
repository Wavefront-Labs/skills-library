# Canonical coverage spec: visual art (all products in the visual-art field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics and subtopics come from external structures: atelier and BFA foundation curricula, the
# chapter structure of standard studio texts, studio syllabi and official application manuals,
# never from what the library already holds.
subject: visual-art
scope:
  category: creative-arts
  field: visual-art
  products: [drawing, figure-drawing, painting, watercolour-and-gouache, sculpture, printmaking, digital-illustration, procreate, collage-and-mixed-media, installation-and-public-art]
sources:
  - "Charles Bargue and Jean-Leon Gerome, Drawing Course (Cours de dessin, 1866-71; Ackerman/ACR edition 2003) - plate sequence, cast drawing, block-in, shading"
  - "Atelier sight-size curricula (Angel Academy of Art Florence, Florence Academy of Art, Grand Central Atelier) - Bargue copies, cast drawing, cast painting, figure; Darren Rousar, Cast Drawing Using the Sight-Size Approach"
  - "Andrew Loomis, Figure Drawing for All It's Worth and Drawing the Head and Hands; Michael Hampton, Figure Drawing - Design and Invention; Eliot Goldfinger, Human Anatomy for Artists"
  - "BFA foundation drawing / painting / 2D design syllabi (RISD Experimental and Foundation Studies, SAIC, Yale School of Art undergraduate studio) - line, value, perspective, composition, colour"
  - "James Gurney, Color and Light - A Guide for the Realist Painter (2010) chapter list - light sources, light and form, colour and pigments, colour relationships, surface and atmosphere, edges"
  - "James Gurney, Imaginative Realism (2009) - thumbnails, reference, maquettes, compositional design"
  - "Ralph Mayer, The Artist's Handbook of Materials and Techniques (5th ed., rev. Sheehan 1991) chapter list - pigments, oil painting, tempera, watercolour and gouache, acrylic, encaustic, grounds, varnishes, solvents, conservation"
  - "Kurt Wehlte, The Materials and Techniques of Painting - supports, grounds, binders"
  - "Printmaking studio syllabi and texts - Beth Grabowski and Bill Fick, Printmaking - A Complete Guide to Materials and Processes (relief, intaglio, lithography, screenprint, monotype, editioning)"
  - "Sculpture studio syllabi and texts - Edouard Lanteri, Modelling and Sculpting the Human Figure; Nicholas Penny, The Materials of Sculpture; Smooth-On and Polytek mould-making guides; foundry lost-wax process outlines"
  - "Procreate Handbook (procreate.com/handbook) table of contents - interface and gestures, brushes and Brush Studio, colour, layers, selections, transform, adjustments, drawing guide, reference, animation assist, text, share"
  - "Krita Manual (docs.krita.org) and Clip Studio Paint official user guide ToCs - brush engines, layers and masks, selections, colour management, vector line art, assets"
  - "Watercolour texts - Mayer chapter on watercolour; Winsor and Newton and Daniel Smith technical leaflets on paper sizing, pigment staining and granulation"
  - "Public art and mural practice - Americans for the Arts Public Art Network resources, Arts Council England public art guidance, Golden Artist Colors and Nova Color mural technical guides, Mural Arts Philadelphia process"
