# Coverage spec: gateway-api. Topics from the Kubernetes Gateway API docs (kubernetes-sigs/gateway-api, site/content/en).
subject: gateway-api
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [gateway-api]
sources:
  - "Gateway API docs (github.com/kubernetes-sigs/gateway-api, site/content/en)"
topics:
