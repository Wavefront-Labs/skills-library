    name: "Resource model gatewayclass gateway routes"
    source: "https://github.com/kubernetes-sigs/gateway-api/blob/main/site/content/en/docs/concepts/api-overview.md"
    match: [resource-model,gatewayclass,gateway,httproute,api-group,concepts]
  - id: gateway-api-route-types-and-discriminators
    name: "Route types and discriminators"
    source: "https://github.com/kubernetes-sigs/gateway-api/blob/main/site/content/en/docs/concepts/api-overview.md"
    match: [route-types,httproute,grpcroute,tlsroute,tcproute,udproute,routing-discriminator]
  - id: gateway-api-personas-and-rbac-write-permissions
    name: "Personas and rbac write permissions"
    source: "https://github.com/kubernetes-sigs/gateway-api/blob/main/site/content/en/docs/concepts/roles-and-personas.md"
    match: [rbac,personas,roles,ian,chihiro,ana,multi-tenancy]
