    match: [cluster-operator-config, strimzi-env-vars, reconciliation-interval]
  - id: strimzi-leader-election
    name: "strimzi leader election"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [leader-election, operator-replicas, lease]
  - id: strimzi-kafkaconnector-resources
    name: "strimzi kafkaconnector resources"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [kafkaconnector, use-connector-resources, tasksmax]
  - id: strimzi-mirrormaker2-configuration
    name: "strimzi mirrormaker2 configuration"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [mirrormaker2-config, mirror-aliases, offset-sync]
  - id: strimzi-inline-and-external-logging
