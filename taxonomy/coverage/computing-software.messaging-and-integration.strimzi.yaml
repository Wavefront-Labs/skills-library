# Coverage spec for strimzi, from its official documentation (https://strimzi.io/docs/operators/latest/deploying.html).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: strimzi
scope:
  category: computing-software
  field: messaging-and-integration
  products: [strimzi]
sources:
  - "strimzi official documentation (https://strimzi.io/docs/operators/latest/deploying.html)"
topics:
  - id: strimzi-custom-resources-and-operators
    name: "strimzi custom resources and operators"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [custom-resources, operators, reconciliation]
  - id: strimzi-kraft-node-roles
    name: "strimzi kraft node roles"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [kraft, controller-nodes, broker-nodes]
  - id: strimzi-prerequisites-and-oc
    name: "strimzi prerequisites and oc"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [deployment-prerequisites, kubernetes-version, kubectl]
  - id: strimzi-single-cluster-operator
    name: "strimzi single cluster operator"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [cluster-operator-placement, avoid-conflicts, dedicated-namespace]
  - id: strimzi-namespace-watch-options
    name: "strimzi namespace watch options"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [watch-namespaces, strimzi-namespace, watch-strategy]
  - id: strimzi-private-registry-images
    name: "strimzi private registry images"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [container-registry, mirror-images, quay-io]
  - id: strimzi-install-cluster-operator
    name: "strimzi install cluster operator"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [cluster-operator-install, kubectl-apply, install-yaml]
  - id: strimzi-deploy-kafka-example-files
    name: "strimzi deploy kafka example files"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [kafka-deployment, example-files, node-pool-examples]
  - id: strimzi-deploy-kafka-connect
    name: "strimzi deploy kafka connect"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [kafkaconnect, connect-workers, distributed-mode]
  - id: strimzi-connector-plugins
    name: "strimzi connector plugins"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [connector-plugins, source-connector, sink-connector]
  - id: strimzi-deploy-mirrormaker2
    name: "strimzi deploy mirrormaker2"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [mirrormaker2, kafkamirrormaker2, cluster-mirroring]
  - id: strimzi-deploy-http-bridge
    name: "strimzi deploy http bridge"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [http-bridge, kafkabridge, http-clients]
  - id: strimzi-feature-gates
    name: "strimzi feature gates"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [feature-gates, strimzi-feature-gates, alpha-beta-ga]
  - id: strimzi-node-pool-configuration
    name: "strimzi node pool configuration"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [node-pools, kafkanodepool, pool-inheritance]
  - id: strimzi-storage-types
    name: "strimzi storage types"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [kafka-storage, jbod, persistent-storage]
  - id: strimzi-storage-considerations
    name: "strimzi storage considerations"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [block-storage, xfs-ext4, disk-usage]
  - id: strimzi-entity-operator-config
    name: "strimzi entity operator config"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [entity-operator, topicoperator-userop, entityoperator-spec]
  - id: strimzi-cluster-operator-env-vars
    name: "strimzi cluster operator env vars"
