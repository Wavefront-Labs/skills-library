    match: [topic-finalizers, strimzi-use-finalizers, delete-topic-enable]
  - id: strimzi-kafkauser-configuration
    name: "strimzi kafkauser configuration"
    source: https://strimzi.io/docs/operators/latest/deploying.html
    match: [kafkauser, user-operator, acl-rules]
  - id: strimzi-ignored-users-pattern
