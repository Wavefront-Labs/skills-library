    match: [zigbee-ops]
    subtopics:
      - {id: zigbee-ops-zigbee-security-keys, name: "Zigbee security keys", match: [zigbee-security-keys]}
      - {id: zigbee-ops-zigbee2mqtt-bridge, name: "Zigbee2MQTT bridge", match: [zigbee2mqtt-bridge]}
  - id: ble-iot
