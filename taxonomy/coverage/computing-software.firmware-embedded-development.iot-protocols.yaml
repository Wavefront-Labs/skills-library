# Coverage spec: IoT protocols (computing-software / firmware-embedded-development / iot-protocols).
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: firmware-embedded-development.iot-protocols
scope:
  category: computing-software
  field: firmware-embedded-development
  products: [iot-protocols]
sources:
  - "OASIS MQTT 3.1.1 and 5.0 specifications (docs.oasis-open.org/mqtt) - packets, QoS, sessions, topics, properties, security"
  - "IETF RFCs 7252, 7641, 7959, 6690, 8613, 8428, 8949 (CoAP, observe, block-wise, link-format, OSCORE, SenML, CBOR) and RFC 9019 firmware update architecture"
  - "OMA SpecWorks LwM2M specification and registry; LoRa Alliance LoRaWAN L2 specification and Regional Parameters; Thread Group and OpenThread guides; CSA Matter and Zigbee specifications"
  - "Broker manuals (Mosquitto, EMQX, HiveMQ), AWS IoT Core and Azure IoT Hub/DPS developer guides, Eclipse Sparkplug specification, ChirpStack and The Things Stack docs"
topics:
  - id: mqtt-packets
    name: "MQTT control packets"
    source: "https://docs.oasis-open.org/mqtt/mqtt/v3.1.1/os/mqtt-v3.1.1-os.html"
    match: [mqtt-packets]
    subtopics:
      - {id: mqtt-packets-connect-packet, name: "MQTT CONNECT packet", match: [connect-packet]}
      - {id: mqtt-packets-publish-subscribe-packets, name: "PUBLISH and SUBSCRIBE packets", match: [publish-subscribe-packets]}
      - {id: mqtt-packets-keepalive-ping, name: "MQTT keep alive and PINGREQ", match: [keepalive-ping]}
  - id: mqtt-qos-reliability
    name: "MQTT QoS and delivery guarantees"
    source: "https://docs.oasis-open.org/mqtt/mqtt/v3.1.1/os/mqtt-v3.1.1-os.html"
    match: [mqtt-qos-reliability]
    subtopics:
      - {id: mqtt-qos-reliability-qos-flows, name: "MQTT QoS 0, 1, 2 flows", match: [qos-flows]}
      - {id: mqtt-qos-reliability-retained-messages, name: "MQTT retained messages", match: [retained-messages]}
      - {id: mqtt-qos-reliability-last-will, name: "MQTT last will and testament", match: [last-will]}
  - id: mqtt-sessions
    name: "MQTT sessions"
    source: "https://docs.oasis-open.org/mqtt/mqtt/v5.0/mqtt-v5.0.html"
    match: [mqtt-sessions]
    subtopics:
      - {id: mqtt-sessions-clean-session-3-1-1, name: "MQTT 3.1.1 clean session", match: [clean-session-3-1-1]}
      - {id: mqtt-sessions-session-expiry-v5, name: "MQTT 5 session expiry", match: [session-expiry-v5]}
  - id: mqtt-topics
    name: "MQTT topics"
    source: "https://docs.oasis-open.org/mqtt/mqtt/v3.1.1/os/mqtt-v3.1.1-os.html"
    match: [mqtt-topics]
    subtopics:
      - {id: mqtt-topics-topic-filters-wildcards, name: "MQTT topic filters and wildcards", match: [topic-filters-wildcards]}
      - {id: mqtt-topics-topic-design, name: "MQTT topic design", match: [topic-design]}
  - id: mqtt5-features
    name: "MQTT 5 features"
    source: "https://docs.oasis-open.org/mqtt/mqtt/v5.0/mqtt-v5.0.html"
    match: [mqtt5-features]
    subtopics:
      - {id: mqtt5-features-shared-subscriptions, name: "MQTT shared subscriptions", match: [shared-subscriptions]}
      - {id: mqtt5-features-user-properties-reason-codes, name: "MQTT 5 properties and reason codes", match: [user-properties-reason-codes]}
      - {id: mqtt5-features-topic-aliases-flow-control, name: "MQTT 5 topic aliases and flow control", match: [topic-aliases-flow-control]}
  - id: mqtt-security
    name: "MQTT security"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [mqtt-security]
    subtopics:
      - {id: mqtt-security-mqtt-tls-client-certs, name: "MQTT TLS and client certificates", match: [mqtt-tls-client-certs]}
      - {id: mqtt-security-mqtt-auth-acl, name: "MQTT authentication and ACL", match: [mqtt-auth-acl]}
      - {id: mqtt-security-enhanced-auth-v5, name: "MQTT 5 enhanced authentication", match: [enhanced-auth-v5]}
  - id: mosquitto-broker
    name: "Mosquitto broker operations"
    source: "https://mosquitto.org/man/mosquitto-conf-5.html"
    match: [mosquitto-broker]
    subtopics:
      - {id: mosquitto-broker-mosquitto-conf-listeners, name: "Mosquitto listeners and configuration", match: [mosquitto-conf-listeners]}
      - {id: mosquitto-broker-mosquitto-bridge, name: "Mosquitto bridge configuration", match: [mosquitto-bridge]}
      - {id: mosquitto-broker-mosquitto-persistence-logging, name: "Mosquitto persistence and logging", match: [mosquitto-persistence-logging]}
  - id: emqx-broker
    name: "EMQX broker"
    source: "https://docs.emqx.com/en/emqx/latest/"
    match: [emqx-broker]
    subtopics:
      - {id: emqx-broker-emqx-rule-engine, name: "EMQX rule engine and data integration", match: [emqx-rule-engine]}
      - {id: emqx-broker-emqx-clustering, name: "EMQX clustering", match: [emqx-clustering]}
  - id: hivemq-broker
    name: "HiveMQ broker"
    source: "https://docs.hivemq.com/hivemq/latest/user-guide/index.html"
    match: [hivemq-broker]
    subtopics:
      - {id: hivemq-broker-hivemq-extensions, name: "HiveMQ extensions", match: [hivemq-extensions]}
      - {id: hivemq-broker-hivemq-cluster, name: "HiveMQ clustering and operations", match: [hivemq-cluster]}
  - id: mqtt-client-practice
    name: "MQTT client practice"
    source: "https://eclipse.dev/paho/"
    match: [mqtt-client-practice]
    subtopics:
      - {id: mqtt-client-practice-paho-reconnect-patterns, name: "MQTT client reconnect patterns", match: [paho-reconnect-patterns]}
      - {id: mqtt-client-practice-mqtt-over-websockets, name: "MQTT over WebSockets", match: [mqtt-over-websockets]}
  - id: coap-messages
    name: "CoAP messaging"
    source: "https://www.rfc-editor.org/rfc/rfc7252"
    match: [coap-messages]
    subtopics:
      - {id: coap-messages-coap-message-format, name: "CoAP message format", match: [coap-message-format]}
      - {id: coap-messages-coap-confirmable-retransmit, name: "CoAP confirmable retransmission", match: [coap-confirmable-retransmit]}
  - id: coap-observe
    name: "CoAP observe"
    source: "https://www.rfc-editor.org/rfc/rfc7641"
    match: [coap-observe]
    subtopics:
      - {id: coap-observe-coap-observe-registration, name: "CoAP observe registration", match: [coap-observe-registration]}
      - {id: coap-observe-coap-observe-notifications, name: "CoAP observe notifications", match: [coap-observe-notifications]}
  - id: coap-blockwise
    name: "CoAP block-wise transfers"
    source: "https://www.rfc-editor.org/rfc/rfc7959"
    match: [coap-blockwise]
    subtopics:
      - {id: coap-blockwise-coap-block1-block2, name: "CoAP Block1 and Block2", match: [coap-block1-block2]}
      - {id: coap-blockwise-coap-resource-discovery-link-format, name: "CoAP resource discovery", match: [coap-resource-discovery-link-format]}
  - id: coap-security
    name: "CoAP security"
    source: "https://www.rfc-editor.org/rfc/rfc7252#section-9"
    match: [coap-security]
    subtopics:
      - {id: coap-security-coap-dtls, name: "CoAP over DTLS", match: [coap-dtls]}
      - {id: coap-security-oscore-basics, name: "OSCORE object security", match: [oscore-basics]}
  - id: lwm2m-model
    name: "LwM2M data model and registration"
    source: "https://www.openmobilealliance.org/release/LightweightM2M/"
    match: [lwm2m-model]
    subtopics:
      - {id: lwm2m-model-lwm2m-object-model, name: "LwM2M objects, instances and resources", match: [lwm2m-object-model]}
      - {id: lwm2m-model-lwm2m-registration-interface, name: "LwM2M registration interface", match: [lwm2m-registration-interface]}
  - id: lwm2m-operations
    name: "LwM2M device management"
    source: "https://www.openmobilealliance.org/lwm2m/"
    match: [lwm2m-operations]
    subtopics:
      - {id: lwm2m-operations-lwm2m-device-management, name: "LwM2M read write execute and observe", match: [lwm2m-device-management]}
      - {id: lwm2m-operations-lwm2m-bootstrap, name: "LwM2M bootstrap", match: [lwm2m-bootstrap]}
      - {id: lwm2m-operations-lwm2m-firmware-update, name: "LwM2M firmware update object", match: [lwm2m-firmware-update]}
  - id: lorawan-regional
    name: "LoRaWAN regional parameters"
    source: "https://lora-alliance.org/resource_hub/rp2-1-0-4-regional-parameters/"
    match: [lorawan-regional]
    subtopics:
      - {id: lorawan-regional-lorawan-regional-parameters, name: "LoRaWAN regional parameters", match: [lorawan-regional-parameters]}
      - {id: lorawan-regional-lorawan-mac-commands, name: "LoRaWAN MAC commands", match: [lorawan-mac-commands]}
  - id: lorawan-activation
    name: "LoRaWAN activation"
