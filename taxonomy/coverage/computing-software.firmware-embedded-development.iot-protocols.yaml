    match: [lorawan-adr-airtime]
    subtopics:
      - {id: lorawan-adr-airtime-lorawan-adr-algorithm, name: "LoRaWAN adaptive data rate", match: [lorawan-adr-algorithm]}
      - {id: lorawan-adr-airtime-lorawan-duty-cycle-airtime, name: "LoRaWAN duty cycle and airtime", match: [lorawan-duty-cycle-airtime]}
  - id: lorawan-network-servers
    name: "LoRaWAN network servers"
    source: "https://www.chirpstack.io/docs/"
    match: [lorawan-network-servers]
    subtopics:
      - {id: lorawan-network-servers-chirpstack-setup, name: "ChirpStack setup", match: [chirpstack-setup]}
      - {id: lorawan-network-servers-ttn-the-things-stack, name: "The Things Stack (TTN)", match: [ttn-the-things-stack]}
      - {id: lorawan-network-servers-lorawan-payload-codecs, name: "LoRaWAN payload codecs", match: [lorawan-payload-codecs]}
  - id: lorawan-security
    name: "LoRaWAN security"
    source: "https://lora-alliance.org/resource_hub/lorawan-specification-v1-0-4/"
    match: [lorawan-security]
    subtopics:
      - {id: lorawan-security-lorawan-keys-and-mic, name: "LoRaWAN keys and MIC", match: [lorawan-keys-and-mic]}
      - {id: lorawan-security-lorawan-frame-counters, name: "LoRaWAN frame counters", match: [lorawan-frame-counters]}
  - id: thread-network
    name: "Thread network architecture"
    source: "https://www.threadgroup.org/What-is-Thread/Overview"
    match: [thread-network]
    subtopics:
      - {id: thread-network-thread-roles-and-topology, name: "Thread device roles and topology", match: [thread-roles-and-topology]}
      - {id: thread-network-thread-commissioning-meshcop, name: "Thread commissioning (MeshCoP)", match: [thread-commissioning-meshcop]}
      - {id: thread-network-thread-border-router, name: "Thread Border Router", match: [thread-border-router]}
  - id: thread-ipv6
    name: "Thread IPv6 and tools"
    source: "https://openthread.io/guides/thread-primer/ipv6-addressing"
    match: [thread-ipv6]
    subtopics:
      - {id: thread-ipv6-thread-6lowpan-addressing, name: "Thread 6LoWPAN addressing", match: [thread-6lowpan-addressing]}
      - {id: thread-ipv6-openthread-cli, name: "OpenThread CLI", match: [openthread-cli]}
  - id: matter-core
    name: "Matter fabrics and data model"
    source: "https://csa-iot.org/all-solutions/matter/"
    match: [matter-core]
    subtopics:
      - {id: matter-core-matter-fabrics-and-nodes, name: "Matter fabrics, nodes and operational credentials", match: [matter-fabrics-and-nodes]}
      - {id: matter-core-matter-data-model-clusters, name: "Matter data model and clusters", match: [matter-data-model-clusters]}
  - id: matter-commissioning
    name: "Matter commissioning"
    source: "https://csa-iot.org/developer-resource/specifications-download-request/"
    match: [matter-commissioning]
    subtopics:
      - {id: matter-commissioning-matter-commissioning-flow, name: "Matter commissioning flow", match: [matter-commissioning-flow]}
      - {id: matter-commissioning-matter-onboarding-payload, name: "Matter onboarding payload and QR code", match: [matter-onboarding-payload]}
      - {id: matter-commissioning-matter-multi-admin, name: "Matter multi-admin", match: [matter-multi-admin]}
  - id: matter-interaction
    name: "Matter interaction model"
    source: "https://csa-iot.org/developer-resource/specifications-download-request/"
    match: [matter-interaction]
    subtopics:
      - {id: matter-interaction-matter-interaction-model, name: "Matter read write invoke", match: [matter-interaction-model]}
      - {id: matter-interaction-matter-subscriptions, name: "Matter subscriptions", match: [matter-subscriptions]}
