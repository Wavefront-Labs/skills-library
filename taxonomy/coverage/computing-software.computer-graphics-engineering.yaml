# Canonical coverage spec: Computer graphics engineering (whole field).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (API specification chapter lists, the
# learnopengl.com / vkguide.dev tables of contents, Microsoft Direct3D 12 programming guide,
# Real-Time Rendering 4th ed. and PBR 4th ed. chapters, Szeliski's Computer Vision 2nd ed.,
# the OpenCV module/tutorial ToC, three.js manual and WebGPU spec, vendor optimisation guides),
# not from what we happened to write, so the check measures the library against the subject.
# Depth: each topic lists `subtopics` from the source's own sub-structure (spec sections, docs
# page headings, book chapter sub-sections, guide chapter headings).
subject: computer-graphics-engineering
scope:
  category: computing-software
  field: computer-graphics-engineering
  products: [opengl, directx, opencv, webgl-threejs, shader-programming, rendering-techniques, computer-vision, graphics-math, gpu-optimisation]
sources:
  - "OpenGL 4.6 Core Profile specification chapters - 2 Fundamentals, 4 Event Model (sync objects, queries), 5 Shared Objects, 6 Buffer Objects, 7 Programs and Shaders, 8 Textures and Samplers, 9 Framebuffers, 10 Vertex Specification and Drawing, 11 Programmable Vertex Processing, 14 Rasterization, 17 Writing Fragments, 19 Compute Shaders, 20 Debug Output"
  - "Vulkan 1.3 specification chapters - Initialization, Devices and Queues, Command Buffers, Synchronization and Cache Control, Render Pass/Dynamic Rendering, Shaders, Pipelines, Memory Allocation, Resource Creation, Samplers, Resource Descriptors, Queries, Copy Commands, Drawing Commands, Dispatching, Window System Integration, Features/Limits/Formats, Debugging"
  - "learnopengl.com ToC (Getting started, Lighting, Model loading, Advanced OpenGL, Advanced Lighting, PBR, In Practice/Debugging) and vkguide.dev ToC (Initializing Vulkan, Drawing with compute, Graphics pipelines, Textures and engine architecture, GLTF loading, GPU-driven rendering)"
  - "Microsoft Direct3D 12 programming guide ToC (learn.microsoft.com) - Pipelines and shaders, Root signatures, Resource binding, Memory management, Resource barriers, Command queues and lists, Swap chains (DXGI), Indirect drawing, DirectX Raytracing, Mesh shaders, Variable rate shading, Sampler feedback, Debug layer/DRED; HLSL reference; Direct3D 11 programming guide; PIX docs"
  - "Akenine-Moller et al., Real-Time Rendering 4th ed. chapters - 5 Shading Basics, 6 Texturing, 7 Shadows, 8 Light and Color, 9 Physically Based Shading, 10 Local Illumination, 11 Global Illumination, 12 Image-Space Effects, 14 Volumetric and Translucency, 15 Non-Photorealistic Rendering, 16 Polygonal Techniques, 18 Pipeline Optimization, 19 Acceleration Algorithms, 20 Efficient Shading, 21 Virtual and Augmented Reality, 22 Intersection Test Methods"
  - "Pharr, Jakob, Humphreys, Physically Based Rendering 4th ed. chapters - 2 Monte Carlo Integration, 4 Radiometry/Spectra/Color, 5 Cameras and Film, 7 Primitives and Intersection Acceleration, 8 Sampling and Reconstruction, 9 Reflection Models, 11 Volume Scattering, 13 Light Transport I, 14 Light Transport II, 15 Wavefront Rendering on GPUs"
  - "three.js manual and docs ToC (threejs.org) - Fundamentals, Responsive design, Scene graph, Materials, Textures, Lights, Cameras, Shadows, Render targets, Custom BufferGeometry, Picking, Post processing, Loading glTF, Animation system, InstancedMesh, WebXR, Color management, WebGPURenderer/TSL; W3C WebGPU and WGSL specifications; MDN WebGL2 API; React Three Fiber docs"
  - "OpenCV 4.x documentation module/tutorial ToC (docs.opencv.org) - core, imgproc (filtering, geometric transforms, thresholding, histograms, structural analysis), imgcodecs, videoio, highgui, video, calib3d, features2d, objdetect (cascades, ArUco, QR), dnn, photo, stitching, cudaarithm, build/installation guides"
  - "Szeliski, Computer Vision - Algorithms and Applications 2nd ed. chapters - 2 Image Formation, 4 Model Fitting and Optimization, 5 Deep Learning, 6 Recognition, 7 Feature Detection and Matching, 8 Image Alignment and Stitching, 9 Motion Estimation, 10 Computational Photography, 11 Structure from Motion and SLAM, 12 Depth Estimation, 13 3D Reconstruction, 14 Image-Based Rendering"
  - "The Book of Shaders ToC (shaping functions, shapes, patterns, random, noise, cellular noise, fBm), GLSL 4.60 / HLSL / WGSL language specifications, Lengyel Mathematics for 3D Game Programming chapters"
  - "Vendor optimisation guides - Arm Mali GPU Best Practices (CPU overheads, vertex shading, tiling/render passes, fragment shading, textures, compute, system), NVIDIA and AMD RDNA performance guides, Apple Metal best practices"
