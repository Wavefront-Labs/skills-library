# Coverage spec: contour. Topics from the Contour docs (site/content/docs/main).
subject: contour
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [contour]
sources:
  - "Contour docs (github.com/projectcontour/contour, site/content/docs/main)"
topics:
  - id: contour-access-log-formats
    name: "Access log formats"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/access-logging.md"
    match: [access-logging,accesslog-format,json-fields,accesslog-format-string,envoy-access-log,req-without-query]
  - id: contour-architecture-contour-envoy
    name: "Architecture contour envoy"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/architecture.md"
    match: [architecture,xds,bootstrap,leader-election,readiness-probe,controller-runtime,envoy-daemonset]
  - id: contour-aws-nlb-deployment
    name: "Aws nlb deployment"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/deploy-aws-nlb.md"
    match: [aws,nlb,host-ports,source-ip,x-forwarded-for,envoy-service,examples-contour]
  - id: contour-client-certificate-validation
    name: "Client certificate validation"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/tls-termination.md"
    match: [mtls,clientvalidation,casecret,crlsecret,optionalclientcertificate,skipclientcertvalidation,xfcc,forwardclientcertificate]
  - id: contour-config-file-core-fields
    name: "Config file core fields"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/configuration.md"
    match: [config-file,configmap,contour-yaml,accesslog,default-http-versions,enableexternalnameservice,disablepermitinsecure,featureflags]
  - id: contour-cookie-rewriting
    name: "Cookie rewriting"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/cookie-rewriting.md"
    match: [cookierewritepolicies,set-cookie,samesite,secure,pathrewrite,domainrewrite,session-affinity-cookie]
  - id: contour-cors-policy
    name: "Cors policy"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/cors.md"
    match: [corspolicy,cors,alloworigin,allowmethods,maxage,allowcredentials,allowprivatenetwork,preflight]
  - id: contour-dag-and-xds-inspection
    name: "Dag and xds inspection"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/troubleshooting/contour-graph.md"
    match: [dag,graphviz,debug-dag,contour-cli,lds,rds,cds,eds,xds]
  - id: contour-debug-logs-and-pprof
    name: "Debug logs and pprof"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/troubleshooting/contour-debug-log.md"
    match: [debug-logging,kubernetes-debug,envoy-log-level,pprof,port-6060,tls-debugging]
  - id: contour-deployment-models-and-multi-instance
    name: "Deployment models and multi instance"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/deploy-options.md"
    match: [deploy-options,multiple-instances,ingress-class-name,hostnetwork,nodeport,certgen,leader-election-resource-name,secrets-name-suffix]
  - id: contour-envoy-graceful-shutdown-manager
    name: "Envoy graceful shutdown manager"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/redeploy-envoy.md"
    match: [shutdown-manager,prestop,terminationgraceperiodseconds,drain,healthcheck-fail,min-open-connections,redeploy-envoy]
  - id: contour-envoy-overload-manager
    name: "Envoy overload manager"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/overload-manager.md"
    match: [overload-manager,overload-max-heap,shrink-heap,503,envoy-overloaded,readiness,oom]
  - id: contour-envoy-stuck-draining-fix
    name: "Envoy stuck draining fix"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/troubleshooting/envoy-container-draining.md"
    match: [envoy-draining,unready,shutdown-manager,liveness-probe,kubectl-delete,issue-4851]
  - id: contour-extensionservice-for-ext-authz
    name: "Extensionservice for ext authz"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/client-authorization.md"
    match: [extensionservice,ext-authz,grpc,protocol-h2,validation,loadbalancerpolicy,checkrequest-v3]
  - id: contour-fallback-certificate
    name: "Fallback certificate"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/tls-termination.md"
    match: [fallback-certificate,enablefallbackcertificate,sni,legacy-clients,tlscertificatedelegation]
  - id: contour-gateway-api-provisioning-modes
    name: "Gateway api provisioning modes"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/gateway-api.md"
    match: [gateway-api,gatewayclass,gateway,static-provisioning,dynamic-provisioning,gateway-provisioner,gatewayref]
  - id: contour-gateway-api-quickstart-httproute
    name: "Gateway api quickstart httproute"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/gateway-api.md"
    match: [gateway-api,httproute,quickstart,port-forward,kind,gatewayclass]
  - id: contour-gateway-listeners-and-envoy-ports
    name: "Gateway listeners and envoy ports"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/gateway-api.md"
    match: [gateway-listeners,container-port,envoy-service,allowedroutes,projectcontour-https,httpproxy-with-gateway]
  - id: contour-global-external-authorization
    name: "Global external authorization"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/external-authorization.md"
    match: [globalextauth,ext-authz,contour-authserver,global-auth,http-virtual-hosts,authpolicy-disabled]
  - id: contour-global-header-policy-config
    name: "Global header policy config"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/configuration.md"
    match: [policy-config,request-headers,response-headers,applytoingress,header-policy,envoy-variables]
  - id: contour-global-rate-limit-deployment-guide
    name: "Global rate limit deployment guide"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/global-rate-limiting.md"
    match: [global-rate-limit,envoyproxy-ratelimit,redis,extensionservice,h2c,ratelimit-config,defaultglobalratelimitpolicy]
  - id: contour-global-rate-limit-descriptors
    name: "Global rate limit descriptors"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/rate-limiting.md"
    match: [rate-limiting,global-rate-limit,descriptors,ratelimitservice,extensionservice,generickey,remoteaddress,requestheader]
  - id: contour-grpc-routing-and-grpc-web
    name: "Grpc routing and grpc web"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/grpc.md"
    match: [grpc,h2c,upstream-protocol,grpcroute,grpc-web,streaming,timeouts]
  - id: contour-header-rewrite-policies
    name: "Header rewrite policies"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/request-rewriting.md"
    match: [requestheaderspolicy,responseheaderspolicy,header-rewrite,set,remove,host-header,dynamic-headers]
  - id: contour-health-endpoints
    name: "Health endpoints"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/health-checking.md"
    match: [health,healthz,health-port,health-address,port-8000,kubernetes-probes]
  - id: contour-http-health-check-policy
    name: "Http health check policy"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/health-checks.md"
    match: [healthcheckpolicy,active-health-check,expectedstatuses,healthport,intervalseconds,unhealthythresholdcount]
  - id: contour-httpproxy-inclusion-delegation
    name: "Httpproxy inclusion delegation"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/inclusion-delegation.md"
    match: [inclusion,delegation,includes,root-httpproxy,multi-team,orphaned,conditions-concatenation]
  - id: contour-httpproxy-status-and-validity
    name: "Httpproxy status and validity"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/fundamentals.md"
    match: [status,currentstatus,invalid,conditions,validation,502,503,kubectl]
  - id: contour-httpproxy-tls-termination
    name: "Httpproxy tls termination"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/tls-termination.md"
    match: [tls-termination,httpproxy,secretname,sni,permitinsecure,minimumprotocolversion,kubernetes-io-tls]
  - id: contour-ingress-and-service-annotations
    name: "Ingress and service annotations"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/annotations.md"
    match: [annotations,upstream-protocol,max-connections,retry-on,response-timeout,force-ssl-redirect,websocket-routes,per-host-max-connections]
  - id: contour-ingress-class-selection
    name: "Ingress class selection"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/annotations.md"
    match: [ingress-class,ingressclassname,ingress-class-name-flag,annotation-precedence,multiple-contour-instances]
  - id: contour-ingress-resource-behaviour
    name: "Ingress resource behaviour"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/ingress.md"
    match: [ingress-v1,pathtype,defaultbackend,wildcard-hostnames,ingress-tls,applytoingress,implementationspecific]
  - id: contour-ip-allow-deny-filtering
    name: "Ip allow deny filtering"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/ip-filtering.md"
    match: [ipallowpolicy,ipdenypolicy,cidr,rbac-filter,source-peer,source-remote,numtrustedhops,403]
  - id: contour-jwt-local-jwks-and-default-provider
    name: "Jwt local jwks and default provider"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/jwt-verification.md"
    match: [jwt,localjwks,default-provider,jwtverificationpolicy,disabled,inclusion,secret]
  - id: contour-jwt-provider-remote-jwks
    name: "Jwt provider remote jwks"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/jwt-verification.md"
    match: [jwt,jwtproviders,remotejwks,jwtverificationpolicy,issuer,audiences,forwardjwt,401]
  - id: contour-listener-config-hardening
    name: "Listener config hardening"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/configuration.md"
    match: [listener-config,connection-balancer,max-requests-per-io-cycle,http2-max-concurrent-streams,max-request-body-bytes,socket-options,runtime-settings]
  - id: contour-load-balancing-and-session-affinity
    name: "Load balancing and session affinity"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/request-routing.md"
    match: [loadbalancerpolicy,roundrobin,weightedleastrequest,requesthash,cookie,session-affinity,sticky-sessions]
  - id: contour-metrics-and-health-listeners
    name: "Metrics and health listeners"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/configuration.md"
    match: [metrics,prometheus,server-certificate-path,om-enforced-health-listener,overload-max-heap,bootstrap-flags,port-8000,port-8002]
  - id: contour-opentelemetry-tracing
    name: "Opentelemetry tracing"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/tracing.md"
    match: [tracing,opentelemetry,otlp,extensionservice,sampling,customtags,otel-collector]
  - id: contour-path-rewrite-replaceprefix
    name: "Path rewrite replaceprefix"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/request-rewriting.md"
    match: [pathrewritepolicy,replaceprefix,path-rewriting,httpproxy]
  - id: contour-prometheus-metrics-and-dashboards
    name: "Prometheus metrics and dashboards"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/prometheus.md"
    match: [prometheus,metrics,podmonitor,grafana,port-8000,port-8002,kube-prometheus,stats-prometheus]
  - id: contour-proxy-protocol-and-forwarded-proto
    name: "Proxy protocol and forwarded proto"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/proxy-proto.md"
    match: [proxy-protocol,use-proxy-protocol,aws-elb,x-forwarded-proto,https-destination-ports,redirect-loop,client-ip]
  - id: contour-resource-sizing-baselines
    name: "Resource sizing baselines"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/guides/resource-limits.md"
    match: [resource-limits,performance,memory,cpu,iperf3,scale-testing,10k-services]
  - id: contour-route-conditions-and-precedence
    name: "Route conditions and precedence"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/request-routing.md"
    match: [request-routing,conditions,prefix,exact,regex,header-conditions,queryparameter,method-matching,precedence]
  - id: contour-serve-flags-and-precedence
    name: "Serve flags and precedence"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/configuration.md"
    match: [serve-flags,config-path,precedence,leader-election,root-namespaces,watch-namespaces,ingress-class-name,disable-feature]
  - id: contour-slow-start-mode
    name: "Slow start mode"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/slow-start.md"
    match: [slowstartpolicy,slow-start,jvm,warm-up,window,aggression,minweightpercent]
  - id: contour-tcp-health-check-policy
    name: "Tcp health check policy"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/health-checks.md"
    match: [tcpproxy,healthcheckpolicy,tcp-health-check,connect-only]
  - id: contour-timeout-and-retry-policy
    name: "Timeout and retry policy"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/request-routing.md"
    match: [timeoutpolicy,retrypolicy,response-timeout,idle-timeout,pertrytimeout,infinity]
  - id: contour-timeouts-and-cluster-config
    name: "Timeouts and cluster config"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/configuration.md"
    match: [timeouts,request-timeout,idle-timeout,connect-timeout,circuit-breakers,max-requests-per-connection,dns-lookup-family,buffer-limit]
  - id: contour-tls-certificate-delegation
    name: "Tls certificate delegation"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/tls-delegation.md"
    match: [tlscertificatedelegation,wildcard-certificate,targetnamespaces,cross-namespace,tls-cert-namespace,ingress-annotation]
  - id: contour-tls-defaults-config
    name: "Tls defaults config"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/configuration.md"
    match: [tls-config,minimum-protocol-version,cipher-suites,ecdh-curves,fallback-certificate,envoy-client-certificate,ja3,ja4]
  - id: contour-troubleshoot-proxy-http-errors
    name: "Troubleshoot proxy http errors"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/troubleshooting/common-proxy-errors.md"
    match: [troubleshooting,503,response-flags,uf,uh,nr,access-log,envoy-metrics,server-envoy]
  - id: contour-upstream-tls-validation
    name: "Upstream tls validation"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/upstream-tls.md"
    match: [upstream-tls,upstream-protocol,validation,casecret,subjectnames,caching,envoy-client-certificate]
  - id: contour-upstream-weighting-and-mirroring
    name: "Upstream weighting and mirroring"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/request-routing.md"
    match: [weight,canary,traffic-mirroring,multiple-upstreams,requestredirectpolicy,httpproxy]
  - id: contour-virtual-hosts-and-root-namespaces
    name: "Virtual hosts and root namespaces"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/virtual-hosts.md"
    match: [virtualhost,fqdn,root-namespaces,aliases,name-based-virtual-hosting,rbac]
  - id: contour-virtualhost-authorization
    name: "Virtualhost authorization"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/client-authorization.md"
    match: [authorization,extensionref,authpolicy,failopen,responsetimeout,context,ext-authz]
  - id: contour-websockets-and-externalname-routing
    name: "Websockets and externalname routing"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/config/websockets.md"
    match: [enablewebsockets,externalname,enableexternalnameservice,host-header,security-advisory,upstream-protocol-tls]
  - id: contour-xds-grpc-tls-certificates
    name: "Xds grpc tls certificates"
    source: "https://github.com/projectcontour/contour/blob/main/site/content/docs/main/grpc-tls-howto.md"
    match: [grpc-tls,certgen,contourcert,envoycert,certificate-rotation,resources-dir,sni-contour]
