# Coverage spec: pulumi. Topics from the external structures in sources.
subject: pulumi
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [pulumi]
sources:
  - "Pulumi IaC docs ToC (pulumi.com/docs/iac) - Concepts, CLI, Automation API, Testing, Policy, Kubernetes, Packages"
  - "Pulumi ESC docs ToC (pulumi.com/docs/esc) and Pulumi Cloud Deployments, RBAC"
topics:
  - id: pulumi-projects
    name: "Projects and Pulumi.yaml"
    source: "Concepts/Projects"
    match: [pulumi-yaml]
  - id: pulumi-stacks
    name: "Stacks"
    source: "Concepts/Stacks"
    match: [stack-config]
  - id: stack-references
    name: "Stack references"
    source: "Concepts/Stacks"
    match: [stack-reference]
  - id: config-and-secrets
    name: "Configuration"
    source: "Concepts/Configuration"
    match: [pulumi-config]
  - id: secrets-providers
    name: "Secrets providers"
    source: "Concepts/Secrets"
    match: [secrets-provider]
  - id: state-backends
