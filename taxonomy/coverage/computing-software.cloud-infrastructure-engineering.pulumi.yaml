    source: "Resource options"
    match: [depends-on]
  - id: ignore-changes-and-replace-on
    name: "ignoreChanges and replaceOnChanges"
    source: "Resource options"
    match: [ignore-changes]
  - id: aliases-for-refactoring
    name: "Aliases"
    source: "Resource options"
    match: [aliases]
  - id: resource-transforms
    name: "Transforms"
    source: "Resource options"
    match: [transforms]
  - id: inputs-outputs-apply
    name: "Inputs and outputs"
    source: "Concepts/Inputs and outputs"
    match: [output-apply]
  - id: output-all-and-interpolate
    name: "Output.all and interpolate"
