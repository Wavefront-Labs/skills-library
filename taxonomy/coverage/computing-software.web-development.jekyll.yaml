# Coverage spec: jekyll. Topics from the Jekyll docs (github.com/jekyll/jekyll, docs/_docs).
subject: jekyll
scope:
  category: computing-software
  field: web-development
  products: [jekyll]
sources:
  - "Jekyll docs (jekyllrb.com/docs, source github.com/jekyll/jekyll docs/_docs)"
topics:
  - id: install-and-troubleshoot
    name: "Installing Jekyll and fixing install errors (Windows, macOS, Ubuntu, no-sudo)"
    source: "https://jekyllrb.com/docs/installation/"
    match: [windows, install-errors, no-sudo, gem-home]
  - id: upgrading
    name: "Upgrading from Jekyll 3 to 4"
    source: "https://jekyllrb.com/docs/upgrading/3-to-4/"
    match: [upgrade, jekyll-4]
  - id: directory-structure
    name: "Directory structure"
    source: "https://jekyllrb.com/docs/structure/"
    match: [directory-structure, underscore-folders]
  - id: cli
    name: "Command line usage (new, build, serve, clean, doctor)"
    source: "https://jekyllrb.com/docs/usage/"
    match: [jekyll-cli, jekyll-new]
  - id: build-flags
    name: "Build command flags"
    source: "https://jekyllrb.com/docs/configuration/options/"
    match: [build-flags, drafts-flag, future-flag, limit-posts]
  - id: serve-options
    name: "Serve command, livereload and ports"
    source: "https://jekyllrb.com/docs/configuration/options/"
    match: [jekyll-serve, livereload, port-host]
  - id: default-config
    name: "Default configuration and directory settings"
    source: "https://jekyllrb.com/docs/configuration/default/"
    match: [default-config, config-defaults]
  - id: config-precedence
    name: "Configuration precedence and the exclude override trap"
    source: "https://jekyllrb.com/docs/troubleshooting/"
    match: [config-precedence, exclude-override]
  - id: environments
    name: "Environments (JEKYLL_ENV)"
    source: "https://jekyllrb.com/docs/configuration/environments/"
    match: [jekyll-env, production-build]
  - id: exclude-include
    name: "Excluding, including and keeping files"
    source: "https://jekyllrb.com/docs/configuration/options/"
    match: [exclude, include, keep-files]
  - id: markdown-options
    name: "Markdown processors and kramdown options"
    source: "https://jekyllrb.com/docs/configuration/markdown/"
    match: [kramdown, commonmark]
  - id: liquid-config
    name: "Liquid error modes and strictness"
    source: "https://jekyllrb.com/docs/configuration/liquid/"
    match: [liquid-config, error-mode, strict-variables]
  - id: incremental
    name: "Incremental regeneration"
    source: "https://jekyllrb.com/docs/configuration/incremental-regeneration/"
    match: [incremental-build, jekyll-metadata]
  - id: front-matter
    name: "Front matter"
    source: "https://jekyllrb.com/docs/front-matter/"
    match: [front-matter, yaml-header]
  - id: front-matter-defaults
    name: "Front matter defaults"
    source: "https://jekyllrb.com/docs/configuration/front-matter-defaults/"
    match: [front-matter-defaults, defaults-scope]
  - id: assets
    name: "Assets: Sass/SCSS and CoffeeScript"
    source: "https://jekyllrb.com/docs/assets/"
    match: [sass, coffeescript]
  - id: posts
    name: "Writing posts"
    source: "https://jekyllrb.com/docs/posts/"
    match: [posts, post-filename]
  - id: drafts
    name: "Drafts"
    source: "https://jekyllrb.com/docs/posts/"
    match: [drafts, unpublished-posts]
  - id: tags-categories
    name: "Post tags and categories"
    source: "https://jekyllrb.com/docs/posts/"
    match: [post-tags, post-categories]
  - id: excerpts
    name: "Post excerpts"
    source: "https://jekyllrb.com/docs/posts/"
    match: [excerpt, excerpt-separator]
  - id: pages
    name: "Pages"
    source: "https://jekyllrb.com/docs/pages/"
    match: [pages, page-urls]
  - id: permalinks
    name: "Permalinks and placeholders"
    source: "https://jekyllrb.com/docs/permalinks/"
    match: [permalinks, permalink-placeholders]
  - id: collections
    name: "Collections: setup, sorting and Liquid access"
    source: "https://jekyllrb.com/docs/collections/"
    match: [collections, collection-sort-by, site-collections]
  - id: data-files
    name: "Data files (YAML, JSON, CSV, TSV)"
    source: "https://jekyllrb.com/docs/datafiles/"
    match: [data-files, csv-reader]
  - id: static-files
    name: "Static files"
    source: "https://jekyllrb.com/docs/static-files/"
    match: [static-files]
  - id: layouts
    name: "Layouts"
    source: "https://jekyllrb.com/docs/layouts/"
    match: [layouts, layout-inheritance]
  - id: includes
    name: "Includes and include parameters"
    source: "https://jekyllrb.com/docs/includes/"
    match: [include-tag, include-parameters]
  - id: liquid-filters
    name: "Liquid filters (URL, date, text, array, collection query, slugify)"
    source: "https://jekyllrb.com/docs/liquid/filters/"
    match: [relative-url, where-filter, markdownify, slugify]
  - id: liquid-tags
    name: "Liquid tags (highlight, link, post_url)"
    source: "https://jekyllrb.com/docs/liquid/tags/"
    match: [highlight-tag, link-tag, post-url-tag]
  - id: variables
    name: "Site and page variables"
    source: "https://jekyllrb.com/docs/variables/"
    match: [site-variables, page-variables]
  - id: rendering
    name: "Rendering process"
    source: "https://jekyllrb.com/docs/rendering-process/"
    match: [build-phases, rendering-stages]
  - id: pagination
    name: "Pagination"
    source: "https://jekyllrb.com/docs/pagination/"
    match: [jekyll-paginate, paginator-posts]
  - id: plugins-basics
    name: "Installing plugins, plugin types and flags"
    source: "https://jekyllrb.com/docs/plugins/installation/"
    match: [plugins, plugin-types, safe-flag]
  - id: generators
    name: "Generators"
    source: "https://jekyllrb.com/docs/plugins/generators/"
    match: [generators, generator-pages]
  - id: converters
    name: "Converters"
    source: "https://jekyllrb.com/docs/plugins/converters/"
    match: [converter-plugin]
  - id: custom-filters-tags
    name: "Custom Liquid filters and tags"
    source: "https://jekyllrb.com/docs/plugins/filters/"
    match: [custom-filters, custom-tags]
  - id: command-plugins
    name: "Command plugins"
    source: "https://jekyllrb.com/docs/plugins/commands/"
    match: [command-plugins]
  - id: hooks
    name: "Hooks and custom hook owners"
    source: "https://jekyllrb.com/docs/plugins/hooks/"
    match: [hooks, custom-hooks]
  - id: using-themes
    name: "Using gem themes and overriding theme files"
    source: "https://jekyllrb.com/docs/themes/"
    match: [gem-based-themes, theme-override]
  - id: theme-data
    name: "Theme data directory and theme config"
    source: "https://jekyllrb.com/docs/themes/"
    match: [theme-data, theme-config]
  - id: theme-conversion
    name: "Converting a gem theme to a regular theme"
    source: "https://jekyllrb.com/docs/themes/"
    match: [theme-eject, gem-theme-conversion]
  - id: theme-authoring
    name: "Creating and publishing a theme"
    source: "https://jekyllrb.com/docs/themes/"
    match: [new-theme, publish-theme]
  - id: manual-and-git-deploy
    name: "Manual deployment and git post-receive deploy"
    source: "https://jekyllrb.com/docs/deployment/manual/"
    match: [manual-deployment, post-receive-hook]
  - id: github-pages
    name: "GitHub Pages and GitHub Actions deployment"
    source: "https://jekyllrb.com/docs/github-pages/"
    match: [github-pages, github-actions]
  - id: third-party-hosting
    name: "Third-party hosting"
    source: "https://jekyllrb.com/docs/deployment/third-parties/"
    match: [hosting-options, netlify]
  - id: continuous-integration
    name: "Continuous integration with CircleCI and HTML Proofer"
    source: "https://jekyllrb.com/docs/continuous-integration/circleci/"
    match: [circleci, html-proofer]
  - id: troubleshooting
    name: "Troubleshooting baseurl, excerpts, Liquid braces and production builds"
    source: "https://jekyllrb.com/docs/troubleshooting/"
    match: [baseurl-troubleshooting, excerpt-liquid-errors]
