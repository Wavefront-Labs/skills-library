# Coverage spec: renovate. Topics from the official docs.
subject: renovate
scope:
  category: computing-software
  field: devops-ci-cd
  products: [renovate]
sources:
  - "https://docs.renovatebot.com/"
  - "https://github.com/renovatebot/renovate/tree/main/docs/usage"
topics:
  - id: abandoned-packages
    name: "Abandoned packages"
    source: "https://docs.renovatebot.com/configuration-options/#abandonmentthreshold"
    match: [abandonment-threshold, abandoned, deprecated-packages]
  - id: automerge-rules
    name: "Automerge rules"
    source: "https://docs.renovatebot.com/key-concepts/automerge/"
    match: [automerge, auto-merge, automerge-config]
  - id: automerge-type-branch
    name: "Branch automerge"
    source: "https://docs.renovatebot.com/configuration-options/#automergetype"
    match: [automerge-type, branch-automerge, silent-updates]
  - id: base-branch-patterns
    name: "Base branch patterns"
    source: "https://docs.renovatebot.com/configuration-options/#basebranchpatterns"
    match: [base-branch-patterns, release-branches, use-base-branch-config]
  - id: changelog-fetching
    name: "Changelog fetching"
    source: "https://docs.renovatebot.com/key-concepts/changelogs/"
    match: [changelogs, fetch-change-logs, release-notes]
  - id: commit-message-templates
    name: "Commit message templates"
    source: "https://docs.renovatebot.com/configuration-options/#commitmessagetopic"
    match: [commit-message, commit-message-topic, pr-title]
  - id: config-file-locations
    name: "Config file locations"
    source: "https://docs.renovatebot.com/configuration-options/"
    match: [config-file, renovate-json, default-branch]
  - id: config-migration
    name: "Config migration"
    source: "https://docs.renovatebot.com/config-migration/"
    match: [config-migration, migration-pr, legacy-config]
  - id: config-validator
    name: "Config validator"
    source: "https://docs.renovatebot.com/config-validation/"
    match: [config-validator, renovate-config-validator, validation]
  - id: constraints
    name: "Constraints"
    source: "https://docs.renovatebot.com/configuration-options/#constraints"
    match: [constraints, tool-versions, language-constraints]
  - id: custom-datasources
    name: "Custom datasources"
    source: "https://docs.renovatebot.com/configuration-options/#customdatasources"
    match: [custom-datasources, datasource, registry-url-template]
  - id: custom-regex-manager
    name: "Custom regex manager"
    source: "https://docs.renovatebot.com/configuration-options/#custommanagers"
    match: [custom-managers, regex-manager, match-strings]
  - id: dashboard-approval-workflow
    name: "Dashboard approval workflow"
    source: "https://docs.renovatebot.com/configuration-options/#dependencydashboardapproval"
    match: [dependency-dashboard-approval, approval, manual-approval]
  - id: dependency-dashboard
    name: "Dependency dashboard"
    source: "https://docs.renovatebot.com/key-concepts/dashboard/"
    match: [dependency-dashboard, dashboard-issue, deprecated-packages]
  - id: dependency-pinning
    name: "Dependency pinning"
    source: "https://docs.renovatebot.com/dependency-pinning/"
    match: [pinning, pin-dependencies, reproducible-builds]
  - id: docker-digest-pinning
    name: "Docker digest pinning"
    source: "https://docs.renovatebot.com/docker/"
    match: [docker, pin-digests, image-tags]
  - id: encrypted-config-values
    name: "Encrypted config values"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#privatekey"
    match: [encrypted, private-key, pgp-encryption]
  - id: extends-and-presets
    name: "Extends and presets"
    source: "https://docs.renovatebot.com/key-concepts/presets/"
    match: [extends, presets, config-recommended]
  - id: fork-mode
    name: "Fork processing"
    source: "https://docs.renovatebot.com/configuration-options/#forkprocessing"
    match: [fork-processing, fork-token, fork-mode]
  - id: git-author-and-signing
    name: "Git author and signing"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#gitprivatekey"
    match: [git-author, git-private-key, signed-commits]
  - id: global-secrets-and-env
    name: "Secrets and environment"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#customenvvariables"
    match: [secrets, custom-env-variables, allowed-env]
  - id: group-name-grouping
    name: "Grouping updates with groupName"
    source: "https://docs.renovatebot.com/noise-reduction/"
    match: [group-name, grouping, monorepos]
  - id: host-rules
    name: "Host rules for credentials"
    source: "https://docs.renovatebot.com/configuration-options/#hostrules"
    match: [host-rules, credentials, private-registry]
  - id: ignore-deps-and-paths
    name: "Ignoring dependencies and paths"
    source: "https://docs.renovatebot.com/configuration-options/#ignoredeps"
    match: [ignore-deps, ignore-paths, include-paths]
  - id: immortal-prs
    name: "Immortal PRs"
    source: "https://docs.renovatebot.com/key-concepts/pull-requests/"
    match: [immortal-prs, closed-prs, pr-ignore]
  - id: inherit-config
    name: "Inherited organisation config"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#inheritconfig"
    match: [inherit-config, org-config, inherit-config-file-name]
  - id: labels-reviewers-assignees
    name: "Labels, reviewers and assignees"
    source: "https://docs.renovatebot.com/configuration-options/#labels"
    match: [labels, reviewers, assignees]
  - id: lockfile-maintenance
    name: "Lock file maintenance"
    source: "https://docs.renovatebot.com/configuration-options/#lockfilemaintenance"
    match: [lock-file-maintenance, lockfile, refresh]
  - id: merge-confidence
    name: "Merge Confidence"
    source: "https://docs.renovatebot.com/merge-confidence/"
    match: [merge-confidence, confidence-badges, breaking-releases]
  - id: minimum-release-age
    name: "Minimum release age"
    source: "https://docs.renovatebot.com/key-concepts/minimum-release-age/"
    match: [minimum-release-age, cooldown, supply-chain]
  - id: onboarding-pr
    name: "Onboarding pull request"
    source: "https://docs.renovatebot.com/getting-started/installing-onboarding/"
    match: [onboarding, onboarding-pr, installing]
  - id: opentelemetry-tracing
    name: "OpenTelemetry tracing"
    source: "https://docs.renovatebot.com/opentelemetry/"
    match: [opentelemetry, tracing, otlp]
  - id: osv-vulnerability-alerts
    name: "OSV vulnerability alerts"
    source: "https://docs.renovatebot.com/configuration-options/#osvvulnerabilityalerts"
    match: [osv, osv-vulnerability-alerts, vulnerability-fixes]
  - id: package-rules-matching
    name: "Package rules matching"
    source: "https://docs.renovatebot.com/configuration-options/#packagerules"
    match: [package-rules, matchers, rule-merging]
  - id: platform-automerge-merge-queue
    name: "Platform automerge and merge queues"
    source: "https://docs.renovatebot.com/key-concepts/automerge/"
    match: [platform-automerge, merge-queue, merge-trains]
  - id: post-update-options
    name: "Post-update options"
    source: "https://docs.renovatebot.com/configuration-options/#postupdateoptions"
    match: [post-update-options, go-mod-tidy, npm-dedupe]
  - id: post-upgrade-tasks
    name: "Post-upgrade tasks"
    source: "https://docs.renovatebot.com/configuration-options/#postupgradetasks"
    match: [post-upgrade-tasks, allowed-commands, artifacts]
  - id: pr-body-templates
    name: "PR body templates"
    source: "https://docs.renovatebot.com/configuration-options/#prbodytemplate"
    match: [pr-body, pr-header, pr-footer]
  - id: pr-concurrency-limits
    name: "PR concurrency and rate limits"
    source: "https://docs.renovatebot.com/configuration-options/#prhourlylimit"
    match: [pr-concurrent-limit, pr-hourly-limit, branch-concurrent-limit]
  - id: range-strategy
    name: "Range strategy"
    source: "https://docs.renovatebot.com/configuration-options/#rangestrategy"
    match: [range-strategy, pin, widen]
  - id: rebase-when
    name: "Rebase behaviour"
    source: "https://docs.renovatebot.com/configuration-options/#rebasewhen"
    match: [rebase-when, rebasing, branch-updates]
  - id: registry-aliases-and-urls
    name: "Registry aliases and URLs"
    source: "https://docs.renovatebot.com/configuration-options/#registryaliases"
    match: [registry-aliases, registry-urls, default-registry-urls]
  - id: renovate-docker-and-compose
    name: "Renovate for Compose and Kubernetes"
    source: "https://docs.renovatebot.com/docker/"
    match: [docker-compose, kubernetes, managerfilepatterns]
  - id: repository-cache
    name: "Repository and package cache"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#repositorycache"
    match: [repository-cache, cache-dir, redis]
  - id: require-config-and-onboarding
    name: "requireConfig and onboarding"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#requireconfig"
    match: [require-config, onboarding-config, no-config-repos]
  - id: schedule-and-timezone
    name: "Schedule and timezone"
    source: "https://docs.renovatebot.com/configuration-options/#schedule"
    match: [schedule, timezone, cron]
  - id: security-model-self-hosted
    name: "Self-hosted security model"
    source: "https://docs.renovatebot.com/security-and-permissions/"
    match: [security, trust-repository-developers, least-privilege]
  - id: self-hosted-autodiscover
    name: "Autodiscover repositories"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#autodiscover"
    match: [autodiscover, autodiscover-filter, repositories]
  - id: self-hosted-binary-source
    name: "Binary source and tools"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#binarysource"
    match: [binary-source, containerbase, full-image]
  - id: self-hosted-dry-run
    name: "Dry run"
    source: "https://docs.renovatebot.com/self-hosted-configuration/#dryrun"
    match: [dry-run, extract, lookup]
  - id: self-hosted-running-options
    name: "Running Renovate"
    source: "https://docs.renovatebot.com/getting-started/running/"
    match: [self-hosted, distributions, npm-cli]
  - id: semantic-commits
    name: "Semantic commits"
    source: "https://docs.renovatebot.com/semantic-commits/"
    match: [semantic-commits, commit-prefix, conventional-commits]
  - id: separate-major-minor
    name: "Major and minor separation"
    source: "https://docs.renovatebot.com/configuration-options/#separatemajorminor"
    match: [separate-major-minor, update-types, major-updates]
  - id: shareable-preset-hosting
    name: "Shareable preset hosting"
    source: "https://docs.renovatebot.com/config-presets/"
    match: [shareable-presets, preset-hosting, default-json]
  - id: skip-installs-and-ignore-scripts
    name: "Ignore scripts and skip installs"
    source: "https://docs.renovatebot.com/configuration-options/#ignorescripts"
    match: [ignore-scripts, skip-installs, allow-scripts]
  - id: string-pattern-matching
    name: "String pattern matching"
    source: "https://docs.renovatebot.com/string-pattern-matching/"
    match: [pattern-matching, glob, regex]
  - id: versioning-and-extract-version
    name: "Versioning and extractVersion"
    source: "https://docs.renovatebot.com/configuration-options/#extractversion"
    match: [versioning, extract-version, allowed-versions]
  - id: vulnerability-alerts
    name: "Vulnerability alerts"
    source: "https://docs.renovatebot.com/configuration-options/#vulnerabilityalerts"
    match: [vulnerability-alerts, security-prs, dependabot-alerts]
