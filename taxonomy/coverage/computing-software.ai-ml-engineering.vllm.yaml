# Coverage spec: vllm. Topics from the official docs in sources.
subject: vllm
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [vllm]
sources:
  - "https://docs.vllm.ai/en/latest/"
topics:
  - id: api-endpoints-reference
    name: "Online serving endpoints"
    source: "https://docs.vllm.ai/en/latest/serving/online_serving/"
    match: [endpoints, metrics-endpoint, enable-offline-docs]
  - id: autoawq-quantization
    name: "AutoAWQ and AWQ models"
    source: "https://docs.vllm.ai/en/latest/features/quantization/auto_awq/"
    match: [awq, autoawq, auto-awq]
  - id: bitsandbytes-quantization
    name: "BitsAndBytes quantization"
    source: "https://docs.vllm.ai/en/latest/features/quantization/bnb/"
    match: [bitsandbytes, vllm-bnb-plugin, inflight-quantization]
  - id: cli-overview
    name: "vllm CLI overview"
    source: "https://docs.vllm.ai/en/latest/cli/"
    match: [cli, vllm-serve, help]
  - id: conserving-memory
    name: "Conserving memory"
    source: "https://docs.vllm.ai/en/latest/configuration/conserving_memory/"
    match: [conserving-memory, oom, enforce-eager]
  - id: context-extension
    name: "Context length extension (YaRN)"
    source: "https://docs.vllm.ai/en/latest/features/context_extension/"
    match: [context-extension, rope-parameters, yarn]
  - id: context-parallel-deployment
    name: "Context parallel deployment"
    source: "https://docs.vllm.ai/en/latest/serving/context_parallel_deployment/"
    match: [context-parallel, decode-context-parallel, dcp]
  - id: data-parallel-deployment
    name: "Data parallel deployment"
    source: "https://docs.vllm.ai/en/latest/serving/data_parallel_deployment/"
    match: [data-parallel, data-parallel-size, api-server-count]
  - id: disaggregated-prefill
    name: "Disaggregated prefilling"
    source: "https://docs.vllm.ai/en/latest/features/disagg_prefill/"
    match: [disaggregated-prefill, kv-transfer-config, kv-connector]
  - id: distributed-troubleshooting
    name: "Distributed troubleshooting"
    source: "https://docs.vllm.ai/en/latest/serving/distributed_troubleshooting/"
    match: [distributed-troubleshooting, nccl-socket-ifname, ray-status]
  - id: docker-deployment
    name: "Docker deployment"
    source: "https://docs.vllm.ai/en/latest/deployment/docker/"
    match: [docker, vllm-openai, non-root]
  - id: draft-model-speculation
    name: "Draft model speculation"
    source: "https://docs.vllm.ai/en/latest/features/speculative_decoding/draft_model/"
    match: [draft-model, use-heterogeneous-vocab, speculative-config]
  - id: eagle-speculation
    name: "EAGLE draft models"
    source: "https://docs.vllm.ai/en/latest/features/speculative_decoding/eagle/"
    match: [eagle, eagle3, draft-model]
  - id: embedding-models
    name: "Embedding models and pooling"
    source: "https://docs.vllm.ai/en/latest/models/pooling_models/embed/"
    match: [embeddings, pooling, llm-embed]
  - id: environment-variables
    name: "Environment variables"
    source: "https://docs.vllm.ai/en/latest/configuration/env_vars/"
    match: [env-vars, environment-variables, vllm-port]
  - id: expert-parallel-deployment
    name: "Expert parallel deployment"
    source: "https://docs.vllm.ai/en/latest/serving/expert_parallel_deployment/"
    match: [expert-parallel, enable-expert-parallel, all2all-backend]
  - id: fp8-w8a8-llm-compressor
    name: "FP8 W8A8 with LLM Compressor"
    source: "https://docs.vllm.ai/en/latest/features/quantization/llm_compressor/fp8/"
    match: [fp8, w8a8, llm-compressor]
  - id: gguf-models
    name: "GGUF models"
    source: "https://docs.vllm.ai/en/latest/features/quantization/gguf/"
    match: [gguf, vllm-gguf-plugin, repo-id-quant-type]
  - id: gptqmodel-quantization
    name: "GPTQModel quantization"
    source: "https://docs.vllm.ai/en/latest/features/quantization/gptqmodel/"
    match: [gptqmodel, gptq, marlin]
  - id: grpc-serving-probes
    name: "gRPC serving and health probes"
    source: "https://docs.vllm.ai/en/latest/deployment/k8s/"
    match: [grpc, health-checking, grpc-port]
  - id: helm-chart
    name: "Helm chart"
    source: "https://docs.vllm.ai/en/latest/deployment/frameworks/helm/"
    match: [helm, chart, values-yaml]
  - id: int4-w4a16-llm-compressor
    name: "INT4 W4A16 with LLM Compressor"
    source: "https://docs.vllm.ai/en/latest/features/quantization/llm_compressor/int4/"
    match: [int4, w4a16, gptq]
  - id: int8-w8a8-llm-compressor
    name: "INT8 W8A8 with LLM Compressor"
    source: "https://docs.vllm.ai/en/latest/features/quantization/llm_compressor/int8_w8a8/"
    match: [int8, w8a8, smoothquant]
  - id: kubernetes-deployment
    name: "Kubernetes deployment"
    source: "https://docs.vllm.ai/en/latest/deployment/k8s/"
    match: [kubernetes, deployment, probes]
  - id: kv-cache-offloading
    name: "KV cache offloading"
    source: "https://docs.vllm.ai/en/latest/features/kv_offloading_usage/"
    match: [kv-offloading, offloading-connector, cpu-bytes-to-use]
  - id: lora-adapters
    name: "LoRA adapters serving"
    source: "https://docs.vllm.ai/en/latest/features/lora/"
    match: [lora, enable-lora, lora-modules]
  - id: lora-dynamic-loading
    name: "Dynamic LoRA loading and in-place reload"
    source: "https://docs.vllm.ai/en/latest/features/lora/"
    match: [lora-dynamic-loading, load-lora-adapter, vllm-allow-runtime-lora-updating]
  - id: lora-resolver-plugins
    name: "LoRAResolver plugins"
    source: "https://docs.vllm.ai/en/latest/features/lora/"
    match: [lora-resolver, lora-filesystem-resolver, lora-hf-hub-resolver]
  - id: model-resolution
    name: "Model resolution and hf_overrides"
    source: "https://docs.vllm.ai/en/latest/configuration/model_resolution/"
    match: [model-resolution, hf-overrides, architectures]
  - id: modelopt-quantization
    name: "NVIDIA Model Optimizer checkpoints"
    source: "https://docs.vllm.ai/en/latest/features/quantization/modelopt/"
    match: [modelopt, nvfp4, hf-quant-config]
  - id: mtp-speculation
    name: "MTP multi-token prediction"
    source: "https://docs.vllm.ai/en/latest/features/speculative_decoding/mtp/"
    match: [mtp, multi-token-prediction, gemma-4]
  - id: multimodal-inputs
    name: "Multimodal inputs"
    source: "https://docs.vllm.ai/en/latest/features/multimodal_inputs/"
    match: [multimodal, multi-modal-data, limit-mm-per-prompt]
  - id: nginx-load-balancing
    name: "Nginx load balancing"
    source: "https://docs.vllm.ai/en/latest/deployment/nginx/"
    match: [nginx, load-balancer, least-conn]
  - id: ngram-speculation
    name: "N-gram speculation"
    source: "https://docs.vllm.ai/en/latest/features/speculative_decoding/n_gram/"
    match: [ngram, prompt-lookup-max, prompt-lookup-min]
  - id: offline-inference-api
    name: "Offline inference LLM API"
    source: "https://docs.vllm.ai/en/latest/serving/offline_inference/"
    match: [offline-inference, llm-class, generate]
  - id: online-quantization
    name: "Online quantization"
    source: "https://docs.vllm.ai/en/latest/features/quantization/online/"
    match: [online-quantization, fp8-per-tensor, fp8-per-block]
  - id: openai-compatible-server
    name: "OpenAI-compatible server"
    source: "https://docs.vllm.ai/en/latest/serving/online_serving/openai_compatible_server/"
    match: [openai-compatible, api-key, extra-body]
  - id: optimization-levels-startup
    name: "Optimization levels and faster startup"
    source: "https://docs.vllm.ai/en/latest/configuration/optimization/"
    match: [optimization-levels, kv-cache-memory, vllm-cache-root]
  - id: parallelism-strategy
    name: "Choosing a parallelism strategy"
    source: "https://docs.vllm.ai/en/latest/serving/parallelism_scaling/"
    match: [parallelism, tensor-parallel-size, pipeline-parallel-size]
  - id: per-request-metrics
    name: "Per-request metrics"
    source: "https://docs.vllm.ai/en/latest/features/per_request_metrics/"
    match: [per-request-metrics, enable-per-request-metrics, ttft]
  - id: preemption-chunked-prefill
    name: "Preemption and chunked prefill"
    source: "https://docs.vllm.ai/en/latest/configuration/optimization/"
    match: [preemption, chunked-prefill, max-num-batched-tokens]
  - id: prefix-caching
    name: "Automatic prefix caching"
    source: "https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/"
    match: [prefix-caching, enable-prefix-caching, apc]
  - id: prompt-embeds
    name: "Prompt embedding inputs"
    source: "https://docs.vllm.ai/en/latest/features/prompt_embeds/"
    match: [prompt-embeds, enable-prompt-embeds, embedding-inputs]
  - id: quantization-overview
    name: "Quantization overview and hardware support"
    source: "https://docs.vllm.ai/en/latest/features/quantization/"
    match: [quantization, linear-backend, kernel-config]
  - id: quantized-kv-cache
    name: "Quantized KV cache (FP8)"
    source: "https://docs.vllm.ai/en/latest/features/quantization/quantized_kvcache/"
    match: [kv-cache-dtype, fp8-kv-cache, kv-cache-dtype-skip-layers]
  - id: quickstart-install
    name: "Quickstart and install"
    source: "https://docs.vllm.ai/en/latest/getting_started/quickstart/"
    match: [quickstart, install, uv]
  - id: ray-multinode-cluster
    name: "Multi-node serving with Ray"
    source: "https://docs.vllm.ai/en/latest/serving/parallelism_scaling/"
    match: [ray, multi-node, run-cluster]
  - id: reasoning-outputs
    name: "Reasoning outputs"
    source: "https://docs.vllm.ai/en/latest/features/reasoning_outputs/"
    match: [reasoning-parser, reasoning-outputs, reasoning-content]
  - id: reproducibility
    name: "Reproducible results"
    source: "https://docs.vllm.ai/en/latest/usage/reproducibility/"
    match: [reproducibility, batch-invariance, seed]
  - id: serve-config-file
    name: "Serve config file"
    source: "https://docs.vllm.ai/en/latest/configuration/serve_args/"
    match: [config-file, yaml, vllm-serve]
  - id: sleep-mode
    name: "Sleep mode"
    source: "https://docs.vllm.ai/en/latest/features/sleep_mode/"
    match: [sleep-mode, enable-sleep-mode, wake-up]
  - id: speculative-decoding-overview
    name: "Speculative decoding overview and speculative-config"
    source: "https://docs.vllm.ai/en/latest/features/speculative_decoding/"
    match: [speculative-decoding, speculative-config, num-speculative-tokens]
  - id: structured-outputs
    name: "Structured outputs"
    source: "https://docs.vllm.ai/en/latest/features/structured_outputs/"
    match: [structured-outputs, guided-decoding, xgrammar]
  - id: suffix-decoding
    name: "Suffix decoding"
    source: "https://docs.vllm.ai/en/latest/features/speculative_decoding/suffix/"
    match: [suffix-decoding, suffix, arctic-inference]
  - id: tool-calling-basics
    name: "Tool calling basics"
    source: "https://docs.vllm.ai/en/latest/features/tool_calling/"
    match: [tool-calling, enable-auto-tool-choice, tool-call-parser]
  - id: tool-parser-plugin
    name: "Tool parser plugins"
    source: "https://docs.vllm.ai/en/latest/features/tool_calling/"
    match: [tool-parser-plugin, toolparsermanager, register-lazy-module]
  - id: tool-strict-mode
    name: "Strict tool calling"
    source: "https://docs.vllm.ai/en/latest/features/tool_calling/"
    match: [tool-strict-level, strict-tools, structural-tag]
  - id: torchao-quantization
    name: "TorchAO quantization"
    source: "https://docs.vllm.ai/en/latest/features/quantization/torchao/"
    match: [torchao, int8-weight-only, transformers]
  - id: troubleshooting-debug-logging
    name: "Debug logging and hangs"
    source: "https://docs.vllm.ai/en/latest/usage/troubleshooting/"
    match: [troubleshooting, vllm-logging-level, cuda-launch-blocking]
  - id: troubleshooting-errors
    name: "Common startup errors"
    source: "https://docs.vllm.ai/en/latest/usage/troubleshooting/"
    match: [troubleshooting-errors, model-failed-to-be-inspected, torch-compile-error]
