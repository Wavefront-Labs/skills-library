# Coverage spec: opnsense. Topics from the external structures named in `sources`.
subject: opnsense
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [opnsense]
sources:
  - "OPNsense documentation manual (docs.opnsense.org/manual) - table of contents: aliases, firewall settings, gateways, multi-WAN, high availability, IPv6, IPS, trust, users, diagnostics, DHCP, proxy, shaping"
  - "OPNsense Plugins and tools pages (docs.opnsense.org/manual) - dynamic DNS, relayd, snapshots, opnsense tools"
topics:
  - id: alias-dynamic-ipv6-external-openvpn
    name: alias dynamic ipv6 external openvpn
    source: "https://docs.opnsense.org/manual/aliases.html"
    match: [aliases, dynamic-ipv6-host, external-alias]
  - id: alias-geoip
    name: alias geoip
    source: "https://docs.opnsense.org/manual/aliases.html"
    match: [aliases, geoip, ipinfo]
  - id: alias-hosts-networks-ports-mac
    name: alias hosts networks ports mac
    source: "https://docs.opnsense.org/manual/aliases.html"
    match: [aliases, host-alias, network-alias]
  - id: alias-import-export
    name: alias import export
    source: "https://docs.opnsense.org/manual/aliases.html"
    match: [aliases, alias-import, alias-export]
  - id: alias-types-overview
    name: alias types overview
    source: "https://docs.opnsense.org/manual/aliases.html"
    match: [aliases, alias-types, firewall]
  - id: alias-url-tables-and-json
    name: alias url tables and json
    source: "https://docs.opnsense.org/manual/aliases.html"
    match: [aliases, url-table, json-alias]
  - id: authentication-servers-and-password-policy
    name: authentication servers and password policy
    source: "https://docs.opnsense.org/manual/users.html"
    match: [authentication-servers, password-policy, local-database]
  - id: caching-proxy-squid
    name: caching proxy squid
    source: "https://docs.opnsense.org/manual/proxy.html"
    match: [squid, web-proxy, transparent-proxy]
  - id: carp-virtual-ip-operations
    name: carp virtual ip operations
    source: "https://docs.opnsense.org/manual/firewall_vip.html"
    match: [carp, vhid, high-availability]
  - id: config-backup-restore-history
    name: config backup restore history
    source: "https://docs.opnsense.org/manual/backups.html"
    match: [backups, config-restore, config-history]
  - id: dashboard-widgets
    name: dashboard widgets
    source: "https://docs.opnsense.org/manual/dashboard.html"
    match: [dashboard, widgets, lobby]
  - id: dhcp-relay
    name: dhcp relay
    source: "https://docs.opnsense.org/manual/dhcrelay.html"
    match: [dhcrelay, dhcp-relay, agent-information]
  - id: dhcp-server-options
    name: dhcp server options
    source: "https://docs.opnsense.org/manual/dhcp.html"
    match: [dhcp, dnsmasq, kea]
  - id: dynamic-dns-ddclient-plugin
    name: dynamic dns ddclient plugin
    source: "https://docs.opnsense.org/manual/dynamic_dns.html"
    match: [dynamic-dns, os-ddclient, cloudflare]
  - id: firewall-advanced-multiwan-and-routing
    name: firewall advanced multiwan and routing
    source: "https://docs.opnsense.org/manual/firewall_settings.html"
    match: [multiwan, reply-to, sticky-connections]
  - id: firewall-advanced-nat-reflection
    name: firewall advanced nat reflection
    source: "https://docs.opnsense.org/manual/firewall_settings.html"
    match: [nat-reflection, hairpin-nat, firewall-advanced-settings]
  - id: firewall-advanced-state-table-tuning
    name: firewall advanced state table tuning
    source: "https://docs.opnsense.org/manual/firewall_settings.html"
    match: [state-table, firewall-optimization, adaptive-timeouts]
  - id: firewall-diagnostics-aliases-states
    name: firewall diagnostics aliases states
    source: "https://docs.opnsense.org/manual/diagnostics_firewall.html"
    match: [firewall-diagnostics, pf-states, sessions]
  - id: firmware-update-schedule
    name: firmware update schedule
    source: "https://docs.opnsense.org/manual/updates.html"
    match: [firmware, updates, major-upgrade]
  - id: gateway-default-selection
    name: gateway default selection
    source: "https://docs.opnsense.org/manual/gateways.html"
    match: [gateways, default-gateway, priority]
  - id: gateway-groups-multiwan
    name: gateway groups multiwan
    source: "https://docs.opnsense.org/manual/multiwan.html"
    match: [multiwan, gateway-groups, failover]
  - id: gateway-settings-and-troubleshooting
    name: gateway settings and troubleshooting
    source: "https://docs.opnsense.org/manual/gateways.html"
    match: [gateway-monitoring, dpinger, failover-states]
  - id: gui-navigation-and-grids
    name: gui navigation and grids
    source: "https://docs.opnsense.org/manual/gui.html"
    match: [web-gui, navigation, favorites]
  - id: high-availability-sync
    name: high availability sync
    source: "https://docs.opnsense.org/manual/hacarp.html"
    match: [high-availability, carp, config-sync]
  - id: interface-advanced-settings-offloading
    name: interface advanced settings offloading
    source: "https://docs.opnsense.org/manual/interfaces_settings.html"
    match: [hardware-offload, tso, lro]
  - id: interface-diagnostics-packet-capture
    name: interface diagnostics packet capture
    source: "https://docs.opnsense.org/manual/diagnostics_interfaces.html"
    match: [packet-capture, tcpdump, interface-diagnostics]
  - id: interface-diagnostics-ping-traceroute
    name: interface diagnostics ping traceroute
    source: "https://docs.opnsense.org/manual/diagnostics_interfaces.html"
    match: [ping, traceroute, port-probe]
  - id: interface-groups
    name: interface groups
    source: "https://docs.opnsense.org/manual/firewall_groups.html"
    match: [interface-groups, firewall-rules, multiwan]
  - id: ips-interface-and-capture-mode
    name: ips interface and capture mode
    source: "https://docs.opnsense.org/manual/ips.html"
    match: [ids, ips, suricata]
  - id: ips-rulesets-policies-and-rules
    name: ips rulesets policies and rules
    source: "https://docs.opnsense.org/manual/ips.html"
    match: [ids-policies, suricata-rules, rulesets]
  - id: ips-user-rules-alerts-and-custom-yaml
    name: ips user rules alerts and custom yaml
    source: "https://docs.opnsense.org/manual/ips.html"
    match: [suricata-yaml, user-defined-rules, ids-alerts]
  - id: ipv6-interface-modes
    name: ipv6 interface modes
    source: "https://docs.opnsense.org/manual/ipv6.html"
    match: [ipv6-modes, track-interface, slaac]
  - id: ipv6-ndp-ra-dhcpv6-fundamentals
    name: ipv6 ndp ra dhcpv6 fundamentals
    source: "https://docs.opnsense.org/manual/ipv6.html"
    match: [ipv6, ndp, router-advertisement]
  - id: ipv6-troubleshooting-workflow
    name: ipv6 troubleshooting workflow
    source: "https://docs.opnsense.org/manual/ipv6.html"
    match: [ipv6-troubleshooting, wan-ipv6, lan-ipv6]
  - id: neighbors-discovery-and-static-arp
    name: neighbors discovery and static arp
    source: "https://docs.opnsense.org/manual/neighbors.html"
    match: [neighbors, hostwatch, arp]
  - id: normalization-scrub-rules
    name: normalization scrub rules
    source: "https://docs.opnsense.org/manual/firewall_scrub.html"
    match: [normalization, scrub, mss]
  - id: ntp-time-service
    name: ntp time service
    source: "https://docs.opnsense.org/manual/ntpd.html"
    match: [ntp, ntpd, time-servers]
  - id: opnsense-update-revert-patch-tools
    name: opnsense update revert patch tools
    source: "https://docs.opnsense.org/manual/opnsense_tools.html"
    match: [opnsense-update, opnsense-revert, opnsense-patch]
  - id: relayd-load-balancer
    name: relayd load balancer
    source: "https://docs.opnsense.org/manual/relayd.html"
    match: [relayd, load-balancer, virtual-server]
  - id: static-routes-and-routing-table
    name: static routes and routing table
    source: "https://docs.opnsense.org/manual/routes.html"
    match: [static-routes, routing-table, route-flags]
  - id: system-health-rrd-graphs
    name: system health rrd graphs
    source: "https://docs.opnsense.org/manual/systemhealth.html"
    match: [system-health, rrd, reporting]
  - id: traffic-shaper-pipes-queues
    name: traffic shaper pipes queues
    source: "https://docs.opnsense.org/manual/shaping.html"
    match: [traffic-shaping, dummynet, ipfw]
  - id: trust-certificates-and-settings
    name: trust certificates and settings
    source: "https://docs.opnsense.org/manual/certificates.html"
    match: [certificates, trust, certificate-authority]
  - id: trust-crl-and-ocsp
    name: trust crl and ocsp
    source: "https://docs.opnsense.org/manual/certificates.html"
    match: [crl, ocsp, revocation]
  - id: trust-store-internals
    name: trust store internals
    source: "https://docs.opnsense.org/manual/certificates.html"
    match: [trust-store, certctl, openssl]
  - id: two-factor-authentication
    name: two factor authentication
    source: "https://docs.opnsense.org/manual/two_factor.html"
    match: [two-factor, totp, authentication]
  - id: users-groups-privileges
    name: users groups privileges
    source: "https://docs.opnsense.org/manual/users.html"
    match: [users, groups, privileges]
  - id: virtual-ip-types
    name: virtual ip types
    source: "https://docs.opnsense.org/manual/firewall_vip.html"
    match: [virtual-ip, ip-alias, proxy-arp]
  - id: zfs-snapshots-rollback
    name: zfs snapshots rollback
    source: "https://docs.opnsense.org/manual/snapshots.html"
    match: [snapshots, zfs, boot-environments]
