# Coverage spec: skaffold. Topics from the official docs in sources.
subject: skaffold
scope:
  category: computing-software
  field: devops-ci-cd
  products: [skaffold]
sources:
  - "https://skaffold.dev/docs/pipeline-stages/"
  - "https://skaffold.dev/docs/design/config/"
  - "https://skaffold.dev/docs/builders/"
  - "https://skaffold.dev/docs/builders/builder-types/docker/"
  - "https://skaffold.dev/docs/builders/build-environments/local/"
  - "https://skaffold.dev/docs/builders/build-environments/cluster/"
  - "https://skaffold.dev/docs/builders/builder-types/jib/"
  - "https://skaffold.dev/docs/builders/builder-types/buildpacks/"
  - "https://skaffold.dev/docs/builders/builder-types/bazel/"
  - "https://skaffold.dev/docs/builders/builder-types/custom/"
  - "https://skaffold.dev/docs/builders/builder-types/ko/"
  - "https://skaffold.dev/docs/builders/build-environments/cloud-build/"
  - "https://skaffold.dev/docs/builders/cross-platform/"
  - "https://skaffold.dev/docs/taggers/"
  - "https://skaffold.dev/docs/renderers/"
  - "https://skaffold.dev/docs/cli/"
  - "https://skaffold.dev/docs/deployers/kubectl/"
  - "https://skaffold.dev/docs/renderers/kustomize/"
  - "https://skaffold.dev/docs/deployers/helm/"
  - "https://skaffold.dev/docs/deployers/docker/"
  - "https://skaffold.dev/docs/environment/profiles/"
  - "https://skaffold.dev/docs/environment/local-cluster/"
  - "https://skaffold.dev/docs/environment/image-registries/"
  - "https://skaffold.dev/docs/environment/global-config/"
  - "https://skaffold.dev/docs/environment/templating/"
  - "https://skaffold.dev/docs/workflows/dev/"
  - "https://skaffold.dev/docs/workflows/ci-cd/"
  - "https://skaffold.dev/docs/filesync/"
  - "https://skaffold.dev/docs/port-forwarding/"
  - "https://skaffold.dev/docs/log-tailing/"
  - "https://skaffold.dev/docs/testers/"
  - "https://skaffold.dev/docs/verify/"
  - "https://skaffold.dev/docs/lifecycle-hooks/"
  - "https://skaffold.dev/docs/status-check/"
  - "https://skaffold.dev/docs/cleanup/"
  - "https://skaffold.dev/docs/resource-selector/"
  - "https://skaffold.dev/docs/workflows/debug/"
  - "https://skaffold.dev/docs/custom-actions/"
  - "https://skaffold.dev/docs/init/"
  - "https://skaffold.dev/docs/references/cli/"
topics:
  - id: pipeline-stages
    name: "Skaffold pipeline stages"
    source: "https://skaffold.dev/docs/pipeline-stages/"
    match: [pipeline, stages, workflow, dev-loop]
  - id: skaffold-yaml-structure
    name: "skaffold.yaml structure"
    source: "https://skaffold.dev/docs/design/config/"
    match: [skaffold-yaml, apiversion, config, schema]
  - id: multiple-configs-and-modules
    name: "Multiple configs and modules"
    source: "https://skaffold.dev/docs/design/config/"
    match: [modules, multi-config, metadata-name, requires]
  - id: config-dependencies-requires
    name: "Config dependencies with requires"
    source: "https://skaffold.dev/docs/design/config/"
    match: [requires, dependencies, git, google-cloud-storage, remote]
  - id: build-artifacts-and-builders
    name: "Build artifacts and builders"
    source: "https://skaffold.dev/docs/builders/"
    match: [build, artifacts, builders, docker, buildpacks]
  - id: docker-builder
    name: "Docker builder"
    source: "https://skaffold.dev/docs/builders/builder-types/docker/"
    match: [docker, dockerfile, buildargs, cachefrom, buildkit]
  - id: local-build-options
    name: "Local build options"
    source: "https://skaffold.dev/docs/builders/build-environments/local/"
    match: [local, push, concurrency, trymportmissing, useDockerCLI]
  - id: kaniko-cluster-build
    name: "Kaniko cluster builds"
    source: "https://skaffold.dev/docs/builders/build-environments/cluster/"
    match: [kaniko, cluster, in-cluster, pullsecretname]
  - id: jib-builder
    name: "Jib builder"
    source: "https://skaffold.dev/docs/builders/builder-types/jib/"
    match: [jib, maven, gradle, java]
  - id: buildpacks-builder
    name: "Buildpacks builder"
    source: "https://skaffold.dev/docs/builders/builder-types/buildpacks/"
    match: [buildpacks, builder, runimage, project-toml]
  - id: bazel-builder
    name: "Bazel builder"
    source: "https://skaffold.dev/docs/builders/builder-types/bazel/"
    match: [bazel, target, tar, docker-load]
  - id: custom-builder
    name: "Custom build script"
    source: "https://skaffold.dev/docs/builders/builder-types/custom/"
    match: [custom, buildcommand, environment, image]
  - id: ko-builder
    name: "ko builder"
    source: "https://skaffold.dev/docs/builders/builder-types/ko/"
    match: [ko, go, daemonless, ldflags]
  - id: google-cloud-build
    name: "Google Cloud Build environment"
    source: "https://skaffold.dev/docs/builders/build-environments/cloud-build/"
    match: [googlecloudbuild, gcb, cloud-build, gcs]
  - id: multi-platform-builds
    name: "Multi-platform builds"
    source: "https://skaffold.dev/docs/builders/cross-platform/"
    match: [platforms, multi-arch, arm64, amd64]
  - id: tag-policies
    name: "Image tag policies"
    source: "https://skaffold.dev/docs/taggers/"
    match: [tagpolicy, gitcommit, inputdigest, datetime, envtemplate]
  - id: render-command
    name: "skaffold render"
    source: "https://skaffold.dev/docs/renderers/"
    match: [render, manifests, digest-source, hydrate]
  - id: apply-command
    name: "skaffold apply"
    source: "https://skaffold.dev/docs/cli/"
    match: [apply, rendered, deploy, ci]
  - id: kubectl-and-rawyaml-deploy
    name: "kubectl deployer and rawYaml"
    source: "https://skaffold.dev/docs/deployers/kubectl/"
    match: [kubectl, rawyaml, deploy, manifests]
  - id: kustomize-renderer
    name: "Kustomize renderer"
    source: "https://skaffold.dev/docs/renderers/kustomize/"
    match: [kustomize, manifests, overlays, render]
  - id: helm-renderer-and-deployer
    name: "Helm renderer and deployer"
    source: "https://skaffold.dev/docs/deployers/helm/"
    match: [helm, releases, setvaluetemplates, post-renderer]
  - id: docker-deployer
    name: "Docker deployer"
    source: "https://skaffold.dev/docs/deployers/docker/"
    match: [docker, compose, deployer, container]
  - id: profiles-basics
    name: "Profiles"
    source: "https://skaffold.dev/docs/environment/profiles/"
    match: [profiles, patches, activation, environments]
  - id: profile-activation
    name: "Profile activation"
    source: "https://skaffold.dev/docs/environment/profiles/"
    match: [profiles, activation, kubecontext, env, command]
  - id: local-clusters-and-kube-context
    name: "Local clusters and kube-context"
    source: "https://skaffold.dev/docs/environment/local-cluster/"
    match: [local-cluster, minikube, kind, kube-context, docker-desktop]
  - id: default-repo-and-registries
    name: "Default repo and registries"
    source: "https://skaffold.dev/docs/environment/image-registries/"
    match: [default-repo, registry, rewrite, insecure-registries]
  - id: global-skaffold-config
    name: "Global config and skaffold config"
    source: "https://skaffold.dev/docs/environment/global-config/"
    match: [config, global, set, context, user-settings]
  - id: templating-and-env-vars
    name: "Templating and environment variables"
    source: "https://skaffold.dev/docs/environment/templating/"
    match: [templating, go-template, sprig, env, skaffold-env]
  - id: skaffold-dev-loop
    name: "skaffold dev"
    source: "https://skaffold.dev/docs/workflows/dev/"
    match: [dev, watch, inner-loop, trigger]
  - id: skaffold-run-ci
    name: "skaffold run and CI/CD"
    source: "https://skaffold.dev/docs/workflows/ci-cd/"
    match: [run, ci, cd, build-file-output, deploy]
  - id: file-sync-manual-infer
    name: "File sync: manual and infer"
    source: "https://skaffold.dev/docs/filesync/"
    match: [sync, manual, infer, hot-reload]
  - id: file-sync-auto
    name: "File sync: auto mode"
    source: "https://skaffold.dev/docs/filesync/"
    match: [sync, auto, jib, buildpacks]
  - id: port-forwarding
    name: "Port forwarding"
    source: "https://skaffold.dev/docs/port-forwarding/"
    match: [portforward, forwarding, localport, services]
  - id: log-tailing
    name: "Log tailing"
    source: "https://skaffold.dev/docs/log-tailing/"
    match: [logs, tail, logging, json]
  - id: test-structure-and-custom
    name: "Tests: structure and custom"
    source: "https://skaffold.dev/docs/testers/"
    match: [test, structure-tests, container-structure-test, custom]
  - id: verify-post-deploy
    name: "Verify after deploy"
    source: "https://skaffold.dev/docs/verify/"
    match: [verify, integration-test, kubernetescluster, job]
  - id: lifecycle-hooks
    name: "Lifecycle hooks"
    source: "https://skaffold.dev/docs/lifecycle-hooks/"
    match: [hooks, before, after, build, sync, deploy]
  - id: status-check
    name: "Deploy status checking"
    source: "https://skaffold.dev/docs/status-check/"
    match: [status-check, rollout, deadline, progressdeadlineseconds]
  - id: cleanup-and-delete
    name: "Cleanup and skaffold delete"
    source: "https://skaffold.dev/docs/cleanup/"
    match: [delete, cleanup, prune, dry-run]
  - id: resource-selector
    name: "Resource selector"
    source: "https://skaffold.dev/docs/resource-selector/"
    match: [resourceselector, allow, deny, labels, podspec]
  - id: debug-command
    name: "skaffold debug"
    source: "https://skaffold.dev/docs/workflows/debug/"
    match: [debug, delve, jdwp, debugpy, runtimetype]
  - id: custom-actions-exec
    name: "Custom actions and skaffold exec"
    source: "https://skaffold.dev/docs/custom-actions/"
    match: [exec, customactions, containers, timeout]
  - id: skaffold-init
    name: "skaffold init"
    source: "https://skaffold.dev/docs/init/"
    match: [init, bootstrap, generate, detection]
  - id: cli-commands-overview
    name: "Skaffold CLI commands"
    source: "https://skaffold.dev/docs/references/cli/"
    match: [cli, commands, flags, help]
  - id: diagnose-effective-config
    name: "skaffold diagnose"
    source: "https://skaffold.dev/docs/references/cli/"
    match: [diagnose, debugging, effective-config, templating]
