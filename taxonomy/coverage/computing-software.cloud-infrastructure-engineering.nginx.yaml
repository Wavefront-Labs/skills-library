# Canonical coverage spec: NGINX configuration and operations.
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its match keywords. Topics follow the nginx.org documentation module reference and admin guides.
subject: nginx
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [nginx]
sources:
  - "nginx.org docs - ngx_http_core_module, ngx_http_proxy_module, ngx_http_upstream_module (directive references)"
  - "nginx.org docs - ngx_http_ssl_module, ngx_http_limit_req_module, ngx_http_log_module, ngx_http_gzip_module"
  - "nginx.org docs - ngx_stream_core_module, WebSocket proxying, Controlling nginx (signals)"
