# Coverage spec for argo-events, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: argo-events
scope:
  category: computing-software
  field: devops-ci-cd
  products: [argo-events]
sources:
  - "Argo Events documentation (docs/ in argoproj/argo-events)"
topics:
  - id: architecture
    name: "Architecture"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/concepts/architecture.md"
    match: [architecture, cloudevents]
  - id: install-methods
    name: "Installation methods"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/installation.md"
    match: [install, kustomize, helm]
  - id: namespaced-install
    name: "Namespaced install"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventbus/eventbus.md"
    match: [namespaced, managed-namespace]
  - id: validating-webhook
    name: "Validating admission webhook"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/installation.md"
    match: [validating-webhook, immutable-fields]
  - id: quick-start
    name: "Quick start"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/quick_start.md"
    match: [getting-started, port-forward]
  - id: eventbus-resource
    name: "EventBus resource and naming"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/concepts/architecture.md"
    match: [eventbus, eventbusname]
  - id: eventbus-jetstream-managed
    name: "JetStream managed EventBus"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventbus/jetstream.md"
    match: [jetstream, streamconfig, statefulset]
  - id: eventbus-jetstream-exotic
    name: "JetStream exotic EventBus"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventbus/jetstream.md"
    match: [jetstreamexotic, accesssecret]
  - id: eventbus-kafka-config
    name: "Kafka EventBus configuration"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventbus/kafka.md"
    match: [sasl, consumer-group, partitioner]
  - id: eventbus-kafka-topics
    name: "Kafka EventBus topics and scaling"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventbus/kafka.md"
    match: [partitions, trigger-topic, action-topic]
  - id: eventbus-stan
    name: "NATS Streaming EventBus"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventbus/stan.md"
    match: [stan, nats-streaming, deprecated]
  - id: ha-dr
    name: "High availability and disaster recovery"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/dr_ha_recommendations.md"
    match: [disaster-recovery, anti-affinity, pdb]
  - id: eventsource-ha
    name: "EventSource HA"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/ha.md"
    match: [active-active, active-passive]
  - id: sensor-ha
    name: "Sensor HA"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/ha.md"
    match: [leases, leader-election]
  - id: eventsource-filtering
    name: "EventSource filtering"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/filtering.md"
    match: [filter, jsonbody]
  - id: eventsource-multiple-events
    name: "Multiple events and names"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/multiple-events.md"
    match: [eventname, eventsourcename]
  - id: eventsource-services
    name: "EventSource services and health"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/services.md"
    match: [service, clusterip, nodeport]
  - id: event-structure
    name: "Event structure"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/calendar.md"
    match: [event-structure, userpayload]
  - id: webhook-source
    name: "Webhook EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/calendar.md"
    match: [webhook]
  - id: webhook-auth
    name: "Webhook auth"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/webhook-authentication.md"
    match: [authsecret, basicauth, bearer-token]
  - id: webhook-health
    name: "Webhook health endpoint"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/services.md"
    match: [health-check, probe]
  - id: calendar-source
    name: "Calendar EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/calendar-catch-up.md"
    match: [calendar, schedule, interval]
  - id: calendar-catch-up
    name: "Calendar catch-up"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/calendar-catch-up.md"
    match: [catch-up, persistence]
  - id: github-source
    name: "GitHub EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/github.md"
    match: [github-eventsource, personal-access-token]
  - id: kafka-source
    name: "Kafka EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/kafka.md"
    match: [kafka-eventsource, consumergroup]
  - id: msk-iam
    name: "Amazon MSK IAM auth"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/kafka.md"
    match: [amazon-msk, irsa, awsmskiamauth]
  - id: resource-source
    name: "Resource EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/resource.md"
    match: [resource-eventsource, field-selector]
  - id: amqp-source
    name: "AMQP EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/amqp.md"
    match: [amqp-eventsource, rabbitmq]
  - id: minio-source
    name: "Minio EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/setup/minio.md"
    match: [minio-eventsource, bucket-notification]
  - id: generic-source
    name: "Generic EventSource"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/generic.md"
    match: [generic-eventsource, custom-eventsource]
  - id: sensor-filters-overview
    name: "Sensor filters overview"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/filters/intro.md"
    match: [filters, filterslogicaloperator]
  - id: sensor-data-filter
    name: "Sensor data filter"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/filters/data.md"
    match: [data-filter, gjson, comparator]
  - id: sensor-expr-filter
    name: "Sensor expr filter"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/filters/expr.md"
    match: [expr-filter, govaluate, exprlogicaloperator]
  - id: sensor-context-filter
    name: "Sensor context filter"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/filters/time.md"
    match: [context-filter]
  - id: sensor-time-filter
    name: "Sensor time filter"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/filters/time.md"
    match: [time-filter, timezone]
  - id: sensor-script-filter
    name: "Sensor script filter"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/transform.md"
    match: [script-filter, lua]
  - id: trigger-conditions
    name: "Trigger conditions"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/trigger-conditions.md"
    match: [trigger-conditions, boolean-expression]
  - id: trigger-conditions-reset
    name: "Trigger conditions reset"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/trigger-conditions.md"
    match: [conditions-reset, stale-events]
  - id: event-transform
    name: "Event transformation"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/transform.md"
    match: [transform, jq]
  - id: delivery-semantics
    name: "Delivery semantics"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/more-about-sensors-and-triggers.md"
    match: [delivery-guarantee, exactly-once, at-least-once]
  - id: duplicate-dependencies
    name: "Duplicate dependencies"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/more-about-sensors-and-triggers.md"
    match: [duplicate-dependencies, ordering]
  - id: trigger-retry-ratelimit-dlq
    name: "Trigger retry rate limit and DLQ"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/more-about-sensors-and-triggers.md"
    match: [retrystrategy, ratelimit, dlqtrigger]
  - id: trigger-argo-workflow
    name: "Argo Workflow trigger"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/argo-workflow.md"
    match: [argoworkflow-trigger, workflow]
  - id: trigger-k8s-objects
    name: "Kubernetes object trigger"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/k8s-object-trigger.md"
    match: [k8s-trigger, patch]
  - id: trigger-k8s-policy
    name: "Trigger policy and resource labels"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/k8s-object-trigger.md"
    match: [trigger-policy, resource-labels, backoff]
  - id: trigger-http
    name: "HTTP trigger"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/aws-lambda.md"
    match: [http-trigger, payload]
  - id: trigger-serverless
    name: "Serverless HTTP triggers"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/http-trigger.md"
    match: [openfaas, kubeless, knative]
  - id: trigger-kafka
    name: "Kafka trigger"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/kafka-trigger.md"
    match: [kafka-trigger]
  - id: trigger-email
    name: "Email trigger"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/email-trigger.md"
    match: [email-trigger, smtp]
  - id: trigger-slack
    name: "Slack trigger"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/slack-trigger.md"
    match: [slack-trigger, bot-token]
  - id: trigger-slack-rich
    name: "Slack threads and blocks"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/slack-trigger.md"
    match: [threads, block-kit]
  - id: trigger-aws-lambda
    name: "AWS Lambda trigger"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/aws-lambda.md"
    match: [aws-lambda, functionname]
  - id: trigger-custom
    name: "Custom trigger gRPC"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/build-your-own-trigger.md"
    match: [custom-trigger, fetchresource]
  - id: parameterization
    name: "Trigger parameterization"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/triggers/email-trigger.md"
    match: [parameters, contextkey, datakey]
  - id: parameterization-defaults
    name: "Parameter defaults and raw data"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/tutorials/02-parameterization.md"
    match: [default-value, userawdata]
  - id: parameterization-sprig
    name: "Sprig templates and operations"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/sensors/filters/data.md"
    match: [sprig, datatemplate, append]
  - id: trigger-sources
    name: "Trigger sources"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/eventsources/calendar-catch-up.md"
    match: [trigger-source, configmap]
  - id: conditions-tutorial
    name: "Trigger conditions tutorial"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/tutorials/06-trigger-conditions.md"
    match: [switch, multiple-dependencies]
  - id: service-accounts
    name: "Service accounts and RBAC"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/service-accounts.md"
    match: [service-account, least-privilege]
  - id: metrics
    name: "Metrics"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/metrics.md"
    match: [metrics, golden-signals, scrape-config]
  - id: troubleshooting
    name: "Troubleshooting FAQ"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/FAQ.md"
    match: [faq, debugging, log-level]
  - id: lint
    name: "argo-events lint"
    source: "https://github.com/argoproj/argo-events/blob/master/docs/lint.md"
    match: [argo-events-lint, strict]
