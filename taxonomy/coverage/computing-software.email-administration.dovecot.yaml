# Coverage spec: dovecot. Topics from the official docs table of contents.
subject: dovecot
scope:
  category: computing-software
  field: email-administration
  products: [dovecot]
sources:
  - "dovecot official docs"
topics:
  - id: password-scheme-selection-and-encoding
    name: "Password scheme selection and encoding"
    source: "https://doc.dovecot.org/main/core/config/auth/schemes.html"
    match: [password-scheme, doveadm-pw, argon2, bcrypt]
  - id: salted-hash-layout-and-nonplain-mechanisms
    name: "Salted hash layout and nonplain mechanisms"
    source: "https://doc.dovecot.org/main/core/config/auth/schemes.html"
    match: [salted-hash, ssha256, cram-md5, scram-sha-1]
  - id: sql-passdb-query-bind-parameters
    name: "Sql passdb query bind parameters"
    source: "https://doc.dovecot.org/main/core/config/auth/databases/sql.html"
    match: [sql-passdb, passdb-sql-query, bind-parameters, concat-filter]
  - id: sql-passdb-pitfalls-case-and-domains
    name: "Sql passdb pitfalls case and domains"
    source: "https://doc.dovecot.org/main/core/config/auth/databases/sql.html"
    match: [sql-case-sensitivity, username-return, extra-fields, virtual-domain]
  - id: master-users-and-master-passwords
    name: "Master users and master passwords"
    source: "https://doc.dovecot.org/main/core/config/auth/master_users.html"
    match: [master-users, master-passdb, result-success-continue, auth-master-user-separator]
  - id: multiple-passdbs-and-userdbs-fallback
    name: "Multiple passdbs and userdbs fallback"
    source: "https://doc.dovecot.org/main/core/config/auth/multiple.html"
    match: [multiple-passdb, passdb-fallback, system-and-virtual-users, home-directory]
  - id: authentication-penalty-brute-force-slowdown
    name: "Authentication penalty brute force slowdown"
    source: "https://doc.dovecot.org/main/core/config/auth/penalty.html"
    match: [auth-penalty, anvil, nodelay, brute-force]
  - id: static-passdb-and-userdb
    name: "Static passdb and userdb"
    source: "https://doc.dovecot.org/main/core/config/auth/databases/static.html"
    match: [static-passdb, static-userdb, userdb-static-allow-all-users, proxy-setup]
  - id: virtual-users-uid-gid-and-home-design
    name: "Virtual users uid gid and home design"
    source: "https://doc.dovecot.org/main/core/config/auth/users/virtual.html"
    match: [virtual-users, home-directory, vmail-user, uid-gid]
  - id: system-users-passdb-and-userdb-choices
    name: "System users passdb and userdb choices"
    source: "https://doc.dovecot.org/main/core/config/auth/users/system.html"
    match: [system-users, pam, passwd-userdb, nss]
  - id: pop3-server-size-lookups-locking-and-flags
    name: "Pop3 server size lookups locking and flags"
    source: "https://doc.dovecot.org/main/core/config/pop3.html"
    match: [pop3, pop3-fast-size-lookups, pop3-lock-session, pop3-no-flag-updates]
  - id: imap-compress-metadata-preview-and-hibernate
    name: "Imap compress metadata preview and hibernate"
    source: "https://doc.dovecot.org/main/core/config/imap.html"
    match: [imap-compress, imap-metadata, imap-hibernate, special-use]
  - id: post-login-scripting-script-login
    name: "Post login scripting script login"
    source: "https://doc.dovecot.org/main/core/config/post_login_scripting.html"
    match: [post-login, script-login, userdb-keys, imap-alert]
  - id: spam-reporting-with-imap-sieve-spam-folder
    name: "Spam reporting with imap sieve spam folder"
    source: "https://doc.dovecot.org/main/core/config/spam_reporting.html"
    match: [spam-reporting, imap-sieve, junk-special-use, sieve-pipe-bin-dir]
  - id: chrooting-login-auth-and-mail-processes
    name: "Chrooting login auth and mail processes"
    source: "https://doc.dovecot.org/main/core/config/chrooting.html"
    match: [chroot, valid-chroot-dirs, mail-chroot, nosuid]
  - id: quick-configuration-single-vmail-user
    name: "Quick configuration single vmail user"
    source: "https://doc.dovecot.org/main/core/config/quick.html"
    match: [quick-start, vmail, doveconf-n, passwd-file-passdb]
  - id: rootless-install-and-linux-capabilities
    name: "Rootless install and linux capabilities"
    source: "https://doc.dovecot.org/main/core/config/rootless.html"
    match: [rootless, linux-capabilities, non-root, passwd-file]
  - id: ssl-requirement-modes-and-cleartext-auth
    name: "Ssl requirement modes and cleartext auth"
    source: "https://doc.dovecot.org/main/core/config/ssl.html"
    match: [ssl-required, auth-allow-cleartext, logindisabled, tls-modes]
  - id: secured-connection-rules-and-haproxy
    name: "Secured connection rules and haproxy"
    source: "https://doc.dovecot.org/main/core/config/ssl.html"
    match: [secured-connection, haproxy-tls, login-trusted-networks, localhost]
  - id: ssl-multiple-certificates-and-sni
    name: "Ssl multiple certificates and sni"
    source: "https://doc.dovecot.org/main/core/config/ssl.html"
    match: [sni, local-name, multiple-certificates, ecdsa-migration]
  - id: ssl-key-password-chain-and-client-certificates
    name: "Ssl key password chain and client certificates"
    source: "https://doc.dovecot.org/main/howto/ssl/sni_support.html"
    match: [ssl-server-key-password, ssl-server-ca-file, client-certificate, certificate-chain]
  - id: ssl-certificate-creation-and-client-trust
    name: "Ssl certificate creation and client trust"
    source: "https://doc.dovecot.org/main/howto/ssl/cert_create.html"
    match: [self-signed, mkcert, lets-encrypt, private-ca]
  - id: shared-public-mailboxes-namespace
    name: "Shared public mailboxes namespace"
    source: "https://doc.dovecot.org/main/core/config/shared_mailboxes.html"
    match: [public-namespace, shared-mailboxes, mail-index-private-path, subscriptions]
  - id: shared-user-mailboxes-and-sharing-dictionary
    name: "Shared user mailboxes and sharing dictionary"
    source: "https://doc.dovecot.org/main/core/config/shared_mailboxes.html"
    match: [shared-namespace, acl-sharing-map, namespace-list, owner-home]
  - id: mailbox-format-selection-overview
    name: "Mailbox format selection overview"
    source: "https://doc.dovecot.org/main/core/config/mailbox_formats/overview.html"
    match: [mailbox-format, maildir, sdbox, mdbox]
  - id: mail-fsync-mmap-locking-for-clustered-storage
    name: "Mail fsync mmap locking for clustered storage"
    source: "https://doc.dovecot.org/main/core/config/mailbox_formats/overview.html"
    match: [mail-fsync, mmap-disable, lock-method, clustered-filesystem]
  - id: mbox-dirty-sync-and-lazy-writes
    name: "Mbox dirty sync and lazy writes"
    source: "https://doc.dovecot.org/main/core/config/mailbox_formats/mbox.html"
    match: [mbox, mbox-dirty-syncs, mbox-lazy-writes, x-uid-header]
  - id: mail-cache-fields-and-imap-client-types
    name: "Mail cache fields and imap client types"
    source: "https://doc.dovecot.org/main/core/config/mail_cache.html"
    match: [mail-cache, mail-cache-fields, mail-always-cache-fields, mail-never-cache-fields]
  - id: nfs-single-backend-rules-and-mount-options
    name: "Nfs single backend rules and mount options"
    source: "https://doc.dovecot.org/main/core/config/nfs.html"
    match: [nfs, mail-nfs-index, actimeo, nolock]
  - id: performance-tuning-checklist
    name: "Performance tuning checklist"
    source: "https://doc.dovecot.org/main/core/config/optimization.html"
    match: [optimization, mailbox-list-index, auth-cache-size, service-restart-request-count]
  - id: lmtp-server-delivery-configuration
    name: "Lmtp server delivery configuration"
    source: "https://doc.dovecot.org/main/core/config/delivery/lmtp.html"
    match: [lmtp, lmtp-proxy, lmtp-rcpt-check-quota, recipient-delimiter]
  - id: lda-dovecot-lda-delivery-setup
    name: "Lda dovecot lda delivery setup"
    source: "https://doc.dovecot.org/main/core/config/delivery/lda.html"
    match: [dovecot-lda, lda, auth-userdb-socket, mailbox-indexing]
  - id: postfix-lmtp-delivery-and-address-verification
    name: "Postfix lmtp delivery and address verification"
    source: "https://doc.dovecot.org/main/howto/lmtp/postfix.html"
    match: [postfix, lmtp-socket, virtual-transport, reject-unverified-recipient]
  - id: postfix-dovecot-sasl-submission-auth
    name: "Postfix dovecot sasl submission auth"
    source: "https://doc.dovecot.org/main/howto/sasl/postfix.html"
    match: [postfix-sasl, smtpd-sasl, submission-port, permit-sasl-authenticated]
  - id: sieve-pigeonhole-overview-and-extensions
    name: "Sieve pigeonhole overview and extensions"
    source: "https://doc.dovecot.org/main/core/config/sieve/overview.html"
    match: [sieve, pigeonhole, sieve-extensions, fileinto]
  - id: sieve-scripts-not-running-troubleshooting
    name: "Sieve scripts not running troubleshooting"
    source: "https://doc.dovecot.org/main/core/config/sieve/troubleshooting.html"
    match: [sieve-troubleshooting, log-debug, mail-plugins, utf-7-mailbox]
  - id: sieve-postmaster-address-and-empty-domain
    name: "Sieve postmaster address and empty domain"
    source: "https://doc.dovecot.org/main/core/config/sieve/submission.html"
    match: [postmaster-address, empty-domain, auth-username-format, submission-host]
  - id: sieve-spam-and-virus-filtering-patterns
    name: "Sieve spam and virus filtering patterns"
    source: "https://doc.dovecot.org/main/howto/sieve.html"
    match: [sieve-spamtest, sieve-virustest, x-spam-flag, i-ascii-numeric]
  - id: sieve-filter-recipes-forwarding-and-flags
    name: "Sieve filter recipes forwarding and flags"
    source: "https://doc.dovecot.org/main/howto/sieve.html"
    match: [sieve-script, if-elsif, redirect, addflag]
  - id: sieve-extension-settings-vacation-extlists-editheader
    name: "Sieve extension settings vacation extlists editheader"
    source: "https://doc.dovecot.org/main/core/config/sieve/extensions/vacation.html"
    match: [sieve-vacation, sieve-extlists, sieve-editheader, resource-limits]
  - id: pigeonhole-installation-and-version-matching
    name: "Pigeonhole installation and version matching"
    source: "https://doc.dovecot.org/main/installation/sieve.html"
    match: [pigeonhole, managesieve, repo-dovecot-org, autogen]
  - id: doveadm-exit-codes-and-http-api-warning
    name: "Doveadm exit codes and http api warning"
    source: "https://doc.dovecot.org/main/core/admin/doveadm.html"
    match: [doveadm, exit-codes, sysexits, doveadm-http-api]
  - id: dsync-sync-versus-backup-modes
    name: "Dsync sync versus backup modes"
    source: "https://doc.dovecot.org/main/core/man/doveadm-sync.1.html"
    match: [dsync, doveadm-sync, doveadm-backup, two-way-sync]
  - id: dsync-sync-algorithms-and-options
    name: "Dsync sync algorithms and options"
    source: "https://doc.dovecot.org/main/core/man/doveadm-sync.1.html"
    match: [dsync-fast-sync, dsync-full-sync, stateful-sync, dsync-state]
  - id: doveadm-auth-testing-and-cache-flush
    name: "Doveadm auth testing and cache flush"
    source: "https://doc.dovecot.org/main/core/man/doveadm-auth.1.html"
    match: [doveadm-auth, auth-cache-flush, auth-cache-status, auth-info]
  - id: doveadm-user-userdb-lookup
    name: "Doveadm user userdb lookup"
    source: "https://doc.dovecot.org/main/core/man/doveadm-user.1.html"
    match: [doveadm-user, userdb-lookup, auth-userdb-socket, auth-info]
  - id: doveadm-kick-who-session-control
    name: "Doveadm kick who session control"
    source: "https://doc.dovecot.org/main/core/man/doveadm-kick.1.html"
    match: [doveadm-kick, doveadm-who, anvil, disconnect-users]
  - id: doveadm-expunge-and-search-query-cleanup
    name: "Doveadm expunge and search query cleanup"
    source: "https://doc.dovecot.org/main/core/man/doveadm-expunge.1.html"
    match: [doveadm-expunge, search-query, trash-cleanup, doveadm-search]
  - id: doveadm-purge-and-force-resync-repair
    name: "Doveadm purge and force resync repair"
    source: "https://doc.dovecot.org/main/core/man/doveadm-purge.1.html"
    match: [doveadm-purge, refcount, force-resync, mdbox-repair]
  - id: doveadm-quota-get-and-recalc
    name: "Doveadm quota get and recalc"
    source: "https://doc.dovecot.org/main/core/man/doveadm-quota.1.html"
    match: [doveadm-quota, quota-get, quota-recalc, quota-plugin]
  - id: doveadm-mailbox-create-delete-list
    name: "Doveadm mailbox create delete list"
    source: "https://doc.dovecot.org/main/core/man/doveadm-mailbox.1.html"
    match: [doveadm-mailbox, mailbox-create, mailbox-delete, mailbox-list]
  - id: doveadm-acl-rights-and-identifiers
    name: "Doveadm acl rights and identifiers"
    source: "https://doc.dovecot.org/main/core/man/doveadm-acl.1.html"
    match: [doveadm-acl, acl-rights, group-override, acl-debug]
  - id: doveadm-index-and-indexer-queue
    name: "Doveadm index and indexer queue"
    source: "https://doc.dovecot.org/main/core/man/doveadm-index.1.html"
    match: [doveadm-index, doveadm-indexer, indexer-worker, fts-index]
  - id: doveadm-fts-optimize-rescan-and-flatcurve-check
    name: "Doveadm fts optimize rescan and flatcurve check"
    source: "https://doc.dovecot.org/main/core/man/doveadm-fts.1.html"
    match: [doveadm-fts, fts-rescan, fts-optimize, flatcurve]
  - id: doveadm-search-query-syntax-and-examples
    name: "Doveadm search query syntax and examples"
    source: "https://doc.dovecot.org/main/core/man/doveadm-search-query.7.html"
    match: [search-query, doveadm-search, search-keys, saved-on]
  - id: doveadm-rebuild-attachments-and-flag-tools
    name: "Doveadm rebuild attachments and flag tools"
    source: "https://doc.dovecot.org/main/core/man/doveadm-rebuild.1.html"
    match: [doveadm-rebuild, attachment-flags, doveadm-flags, doveadm-move]
  - id: login-processes-security-and-performance-modes
    name: "Login processes security and performance modes"
    source: "https://doc.dovecot.org/main/core/config/login_processes.html"
    match: [login-processes, high-security-mode, high-performance-mode, service-client-limit]
  - id: proxy-passdb-fields-and-authentication-modes
    name: "Proxy passdb fields and authentication modes"
    source: "https://doc.dovecot.org/main/core/config/proxy/overview.html"
    match: [proxy-passdb, proxy-maybe, proxy-mech, login-trusted-networks]
  - id: haproxy-proxy-protocol-and-tls-termination
    name: "Haproxy proxy protocol and tls termination"
    source: "https://doc.dovecot.org/main/core/config/proxy/haproxy.html"
    match: [haproxy, proxy-protocol, send-proxy-v2, haproxy-trusted-networks]
  - id: proxy-forwarding-id-xclient-parameters
    name: "Proxy forwarding id xclient parameters"
    source: "https://doc.dovecot.org/main/core/config/proxy/forwarding.html"
    match: [proxy-forwarding, xclient, imap-id, x-proxy-ttl]
  - id: imap-login-referrals-and-nologin
    name: "Imap login referrals and nologin"
    source: "https://doc.dovecot.org/main/core/config/proxy/referrals.html"
    match: [login-referrals, imap-referral, nologin, destuser]
  - id: login-proxy-failure-states-reading
    name: "Login proxy failure states reading"
    source: "https://doc.dovecot.org/main/admin/login_proxy.html"
    match: [login-proxy, proxy-state, timed-out, imap-states]
  - id: logging-destinations-and-syslog-setup
    name: "Logging destinations and syslog setup"
    source: "https://doc.dovecot.org/main/admin/logging.html"
    match: [logging, syslog-facility, log-path, doveadm-log]
  - id: events-model-categories-and-fields
    name: "Events model categories and fields"
    source: "https://doc.dovecot.org/main/admin/events.html"
    match: [events, event-categories, event-fields, event-hierarchy]
  - id: event-filter-language-syntax
    name: "Event filter language syntax"
    source: "https://doc.dovecot.org/main/core/config/events/filter.html"
    match: [event-filter, category-filter, wildcard-match, ip-filter]
  - id: rawlog-protocol-traffic-capture
    name: "Rawlog protocol traffic capture"
    source: "https://doc.dovecot.org/main/admin/rawlog.html"
    match: [rawlog, rawlog-dir, login-proxy-rawlog-dir, lmtp-rawlog-dir]
  - id: reload-and-graceful-shutdown-of-client-sessions
    name: "Reload and graceful shutdown of client sessions"
    source: "https://doc.dovecot.org/main/admin/running.html"
    match: [doveadm-reload, service-shutdown-clients-timeout, kick-timeout, doveadm-stop]
  - id: health-check-service-for-load-balancers
    name: "Health check service for load balancers"
    source: "https://doc.dovecot.org/main/core/config/health_check.html"
    match: [health-check, health-check-script, passthrough-mode, load-balancer]
  - id: security-hardening-checklist
    name: "Security hardening checklist"
    source: "https://doc.dovecot.org/main/core/config/security.html"
    match: [security, privilege-separation, first-valid-uid, chroot]
