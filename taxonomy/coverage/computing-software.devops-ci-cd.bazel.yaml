# Coverage spec: bazel. Hand-written topics from the official docs.
subject: Bazel
scope:
  category: computing-software
  field: devops-ci-cd
  products: [bazel]
sources:
  - "bazel.build official docs"
topics:
  - id: bazel-remote-cache-flag
    name: "Enable a remote cache with --remote_cache"
    source: "https://bazel.build/remote/caching"
    match: [remote-cache-flag]
  - id: bazel-remote-cache-http
    name: "HTTP caching protocol and bazel-remote server"
    source: "https://bazel.build/remote/caching"
    match: [http-caching-protocol, bazel-remote]
  - id: bazel-remote-cache-upload-local
    name: "Control uploading of local results"
    source: "https://bazel.build/remote/caching"
    match: [upload-local-results]
  - id: bazel-remote-cache-disable
    name: "Disable remote caching per invocation"
    source: "https://bazel.build/remote/caching"
    match: [no-remote-cache]
  - id: bazel-disk-cache-enable
    name: "Enable the local disk cache"
    source: "https://bazel.build/remote/caching"
    match: [disk-cache, disk-cache-flag]
  - id: bazel-disk-cache-disable
    name: "Turn the disk cache off"
    source: "https://bazel.build/remote/caching"
    match: [nodisk-cache]
  - id: bazel-disk-cache-gc
    name: "Disk cache garbage collection"
    source: "https://bazel.build/remote/caching"
    match: [disk-cache-gc, cache-garbage-collection]
  - id: bazel-bazelrc-locations
    name: "Where bazelrc files are read from"
    source: "https://bazel.build/run/bazelrc"
    match: [rc-files, bazelrc]
  - id: bazel-bazelrc-precedence
    name: "Precedence between rc files"
    source: "https://bazel.build/run/bazelrc"
    match: [bazelrc-precedence]
  - id: bazel-bazelrc-ignore
    name: "Ignoring all rc files"
    source: "https://bazel.build/run/bazelrc"
    match: [ignore-all-rc-files, nohome-rc]
  - id: bazel-bazelrc-try-import
    name: "Optional imports with try-import"
    source: "https://bazel.build/run/bazelrc"
    match: [try-import]
  - id: bazel-bazelrc-version-import
    name: "Version-conditional import"
    source: "https://bazel.build/run/bazelrc"
    match: [import-if-bazel-version]
  - id: bazel-named-configs
    name: "Named --config blocks"
    source: "https://bazel.build/run/bazelrc"
    match: [config-flag, named-config, build-config]
  - id: bazel-platform-configs
    name: "Platform-specific configs"
    source: "https://bazel.build/run/bazelrc"
    match: [enable-platform-specific-config]
  - id: bazel-startup-options
    name: "Startup options in rc files"
    source: "https://bazel.build/run/bazelrc"
    match: [startup-options]
  - id: bazel-bzlmod-versions
    name: "Minimal version selection"
    source: "https://bazel.build/external/module"
    match: [minimal-version-selection, module-bazel]
  - id: bazel-single-version-override
    name: "single_version_override"
    source: "https://bazel.build/external/module"
    match: [single-version-override]
  - id: bazel-multiple-version-override
    name: "multiple_version_override"
    source: "https://bazel.build/external/module"
    match: [multiple-version-override]
  - id: bazel-local-path-override
    name: "local_path_override"
    source: "https://bazel.build/external/module"
    match: [local-path-override]
  - id: bazel-yanked-versions
    name: "Yanked module versions"
    source: "https://bazel.build/external/module"
    match: [yanked-versions]
  - id: bazel-inject-module
    name: "Injecting modules at the command line"
    source: "https://bazel.build/external/module"
    match: [inject-module]
  - id: bazel-lockfile-modes
    name: "MODULE.bazel.lock and lockfile modes"
    source: "https://bazel.build/external/lockfile"
    match: [module-bazel-lock, lockfile-mode]
  - id: bazel-module-extensions
    name: "Module extensions in the lockfile"
    source: "https://bazel.build/external/lockfile"
    match: [module-extensions]
  - id: bazel-mod-deps
    name: "bazel mod deps"
    source: "https://bazel.build/external/lockfile"
    match: [bazel-mod-deps]
  - id: bazel-reproducible-builds
    name: "Reproducible dependency resolution"
    source: "https://bazel.build/external/lockfile"
    match: [reproducible-builds]
  - id: bazel-query-deps
    name: "query deps and rdeps"
    source: "https://bazel.build/query/guide"
    match: [deps, rdeps]
  - id: bazel-query-paths
    name: "somepath and allpaths"
    source: "https://bazel.build/query/guide"
    match: [somepath, allpaths]
  - id: bazel-query-filters
    name: "kind and attr filters"
    source: "https://bazel.build/query/guide"
    match: [kind, attr]
  - id: bazel-query-buildfiles
    name: "buildfiles function"
    source: "https://bazel.build/query/guide"
    match: [buildfiles]
  - id: bazel-query-graph
    name: "Graph output for visualisation"
    source: "https://bazel.build/query/guide"
    match: [output-graph]
  - id: bazel-cquery-basics
    name: "Configured target queries"
    source: "https://bazel.build/query/cquery"
    match: [bazel-cquery, configured-targets]
  - id: bazel-cquery-universe
    name: "Universe scope"
    source: "https://bazel.build/query/cquery"
    match: [universe-scope]
  - id: bazel-cquery-select
    name: "Resolving select() with cquery"
    source: "https://bazel.build/query/cquery"
    match: [select]
  - id: bazel-cquery-config
    name: "config() function and exec configuration"
    source: "https://bazel.build/query/cquery"
    match: [config-function, exec-configuration, bazel-config]
  - id: bazel-aquery-basics
    name: "Action graph query"
    source: "https://bazel.build/query/aquery"
    match: [bazel-aquery, action-graph]
  - id: bazel-aquery-mnemonic
    name: "Filtering by mnemonic"
    source: "https://bazel.build/query/aquery"
    match: [mnemonic]
  - id: bazel-aquery-skyframe
    name: "Skyframe state"
    source: "https://bazel.build/query/aquery"
    match: [skyframe-state]
  - id: bazel-aquery-output
    name: "Output formats and commands"
    source: "https://bazel.build/query/aquery"
    match: [output-commands, inputs-outputs-filter]
  - id: bazel-coverage-lcov
    name: "Collecting coverage and the lcov report"
    source: "https://bazel.build/configure/coverage"
    match: [bazel-coverage, lcov]
  - id: bazel-coverage-html
    name: "Generating HTML with genhtml"
    source: "https://bazel.build/configure/coverage"
    match: [genhtml]
  - id: bazel-coverage-filter
    name: "Instrumentation filter"
    source: "https://bazel.build/configure/coverage"
    match: [instrumentation-filter, instrument-test-targets]
  - id: bazel-coverage-combined
    name: "Combined report"
    source: "https://bazel.build/configure/coverage"
    match: [combined-report]
  - id: bazel-test-size
    name: "Test size and default timeouts"
    source: "https://bazel.build/reference/test-encyclopedia"
    match: [test-size, test-timeout]
  - id: bazel-test-sharding
    name: "Test sharding"
    source: "https://bazel.build/reference/test-encyclopedia"
    match: [test-sharding, shard-count]
  - id: bazel-test-env
    name: "Test environment variables"
    source: "https://bazel.build/reference/test-encyclopedia"
    match: [test-env, hermetic-tests]
  - id: bazel-toolchain-resolution
    name: "Toolchain resolution"
    source: "https://bazel.build/extending/toolchains"
    match: [toolchain-resolution, toolchain-type]
  - id: bazel-toolchain-registration
    name: "Registering toolchains"
    source: "https://bazel.build/extending/toolchains"
    match: [register-toolchains, extra-toolchains]
  - id: bazel-toolchain-debug
    name: "Debugging toolchain resolution"
    source: "https://bazel.build/extending/toolchains"
    match: [toolchain-resolution-debug, execution-platform, platforms-flag]
  - id: bazel-labels-syntax
    name: "Label syntax and package names"
    source: "https://bazel.build/concepts/labels"
    match: [bazel-label, package-name, target-name]
  - id: bazel-labels-repos
    name: "Canonical and apparent repo names"
    source: "https://bazel.build/concepts/labels"
    match: [canonical-repo-name, apparent-repo-name]
  - id: bazel-labels-relative
    name: "Relative labels"
    source: "https://bazel.build/concepts/labels"
    match: [relative-labels]
  - id: bazel-output-base
    name: "Output base and user root"
    source: "https://bazel.build/remote/output-directories"
    match: [output-base, output-user-root]
  - id: bazel-output-symlinks
    name: "bazel-bin, bazel-out and bazel-testlogs"
    source: "https://bazel.build/remote/output-directories"
    match: [bazel-bin, bazel-out, bazel-testlogs]
  - id: bazel-output-execroot
    name: "Execroot layout"
    source: "https://bazel.build/remote/output-directories"
    match: [execroot, output-directory, xdg-cache-home]
  - id: bazel-bep-overview
    name: "Build event protocol overview"
    source: "https://bazel.build/remote/bep"
    match: [build-event-protocol, bep]
  - id: bazel-bep-files
    name: "JSON and binary BEP files"
    source: "https://bazel.build/remote/bep"
    match: [build-event-json-file, build-event-binary-file]
  - id: bazel-bep-service
    name: "Build event service backend"
    source: "https://bazel.build/remote/bep"
    match: [bes-backend, build-event-service]
