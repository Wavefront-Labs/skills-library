      - {id: cobol-batch-patterns-master-transaction-update, name: "Master file / transaction file update (match-merge)", match: [master-transaction-update]}
  - id: cobol-pointers-memory
    name: "Pointers and dynamic memory"
    source: "IBM Language Reference: POINTER, ALLOCATE; ISO COBOL: dynamic storage"
    match: [cobol-pointers-memory]
    subtopics:
      - {id: cobol-pointers-memory-pointer-based-storage, name: "USAGE POINTER, BASED items, SET ADDRESS OF and ALLOCATE", match: [pointer-based-storage]}
  - id: cobol-directives
    name: "Compiler directing statements"
    source: "ISO COBOL: COPY, REPLACE, compiler directives; IBM Language Reference: Compiler-directing statements"
    match: [cobol-directives]
    subtopics:
      - {id: cobol-directives-replace-and-conditional-compilation, name: "REPLACE, >>DEFINE and >>IF conditional compilation", match: [replace-and-conditional-compilation]}
  - id: cobol-standards
    name: "Standards and dialects"
    source: "ISO/IEC 1989:2014 and 2002 COBOL; GnuCOBOL dialect configurations"
    match: [cobol-standards]
    subtopics:
      - {id: cobol-standards-dialect-compatibility, name: "COBOL 85, 2002, 2014 and vendor dialect differences", match: [dialect-compatibility]}
  - id: cobol-record-layouts
    name: "Record formats and layouts"
    source: "IBM Language Reference: RECORD clause, RECORDING MODE; z/OS DFSMS data set formats"
    match: [cobol-record-layouts]
    subtopics:
      - {id: cobol-record-layouts-fixed-variable-records, name: "Fixed, variable and multi-format records (RECFM F, FB, V, VB)", match: [fixed-variable-records]}
