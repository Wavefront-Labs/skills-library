# Canonical coverage spec: Dance (whole field, all eight craft products).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (RAD and Cecchetti ballet syllabi, ISTD
# exam syllabi for Modern Theatre, Tap and National, the Graham/Limon/Cunningham/Horton technique
# curricula, choreography texts, IADMS resource papers, Laban/Benesh notation manuals and LMA),
# not from what the library already has.
# Depth: every topic lists `subtopics` taken from the source's own sub-structure (syllabus
# exercise lists, technique class sections, book chapter sub-sections, IADMS paper headings).
# Out of scope here: competitive ballroom and Latin (ISTD Ballroom/Latin) live under
# sports-recreation.gymnastics-and-artistic-sports.dancesport; fitness dance under
# sports-recreation.group-fitness-and-dance-fitness.
subject: dance
scope:
  category: creative-arts
  field: dance
  products: [choreography, ballet, contemporary-dance, jazz-and-commercial-dance, street-and-club-styles, traditional-and-cultural-dance, ensemble-staging, dance-notation]
sources:
  - "Royal Academy of Dance (RAD) graded and vocational syllabi (Grades 1-8, Intermediate Foundation, Intermediate, Advanced Foundation, Advanced 1-2, Solo Seal) - barre, centre practice, pirouettes, adage, allegro 1-4, pointe work, variations, free enchainement, reverence; RAD exam specifications"
  - "Cecchetti Society / ISTD Cecchetti Classical Ballet syllabus - set barre, centre practice and adage, the daily set exercises, port de bras, the eight directions of the body, allegro and batterie; Beaumont & Idzikowski, A Manual of the Theory and Practice of Classical Theatrical Dancing (Cecchetti Method)"
  - "Imperial Society of Teachers of Dancing (ISTD) syllabi - Modern Theatre faculty (jazz-based technique, isolations, leaps, turns), Tap faculty (shuffles, flaps, cramp rolls, time steps, wings, pullbacks), National Dance faculty (Irish, Spanish/flamenco and other national forms)"
  - "Contemporary/modern technique curricula - Martha Graham Center (floor series, contraction and release, spirals, pleadings, falls), Limon Institute (fall and recovery, suspension, successional movement, swings), Cunningham Trust (back curve/upright/arch/twist/tilt, chance procedures, leg work), Horton technique (flat backs, lateral T, hinge, fortifications), release and somatic curricula, Steve Paxton/Contact Quarterly contact improvisation fundamentals"
  - "Choreography texts - Blom and Chaplin, The Intimate Act of Choreography (improvising, forming, motif and development, abstraction, space, time, groups, the creative process); Doris Humphrey, The Art of Making Dances (design in space and time, dynamics, rhythm, words and music, stage areas); Smith-Autard, Dance Composition; Lerman, Critical Response Process; Forsythe, Improvisation Technologies"
  - "International Association for Dance Medicine and Science (IADMS) resource papers and position statements - warm-up and cool-down, flexibility, injury prevention and return to dance, young dancer growth, pointe readiness, dance flooring, nutrition and energy availability, performance anxiety, hypermobility"
  - "Laban Movement Analysis (Body, Effort, Shape, Space; Bartenieff Fundamentals); Hutchinson Guest, Labanotation (staff, direction and level, supports, gestures, timing, motif notation); Benesh Institute, Benesh Movement Notation (stave, positions, travel, scores); Dance Notation Bureau reconstruction and staging practice"
  - "Commercial and street-dance practice - Equity/Spotlight dancer audition guidance, music video and live-tour practice; street-style foundations as taught by originators (breaking toprock/footwork/freezes/power, Boogaloo/popping, Campbellock/locking, house footwork/jacking/lofting, waacking and vogue elements)"
