# Canonical coverage spec: Observability (Prometheus/Grafana stack, OpenTelemetry, SRE practice).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (not from what we happened to write), so
# the check measures the library against the subject, not against itself.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (prometheus.io
# doc sub-headings and config blocks, grafana.com doc sections, opentelemetry.io spec and
# collector component list, SRE Book / Workbook chapter sub-sections).
subject: observability
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [observability, prometheus-grafana, site-reliability-engineering]
sources:
  - "Prometheus Certified Associate (PCA) curriculum (CNCF/Linux Foundation): Observability Concepts 18%, Prometheus Fundamentals 20%, PromQL 28%, Instrumentation & Exporters 16%, Alerting & Dashboarding 18%"
  - "prometheus.io/docs table of contents (Getting started, Configuration, Storage, Federation, Agent mode, Management API, Alertmanager, Pushgateway, Exporters, Client libraries, Best practices)"
  - "prometheus.io/docs sub-headings: configuration.md config blocks (<scrape_config>, <*_sd_config>, <relabel_config>, <remote_write>, <queue_config>, <remote_read>, <tls_config>), querying/functions.md function families, storage.md (compaction, backfilling, out-of-order, snapshots), alerting/configuration.md (route, receivers, inhibit_rules, time_intervals), prometheus/latest/configuration/unit_testing_rules.md"
  - "opentelemetry.io/docs table of contents (Concepts: signals, instrumentation, context propagation, semantic conventions, sampling, resources; Collector: configuration, deployment, scaling, transforming telemetry, troubleshooting, custom collector; Kubernetes: operator, helm)"
  - "opentelemetry-collector-contrib component list (receivers, processors, exporters, connectors, extensions) and OTel specification (trace SDK, metrics SDK, logs SDK, propagators)"
  - "grafana.com/docs table of contents (Dashboards, Panels & visualizations, Alerting, Administration, Data sources, Explore, Setup/Upgrade; Loki, Tempo, Mimir, Pyroscope, Alloy, OnCall/IRM, SLO, Synthetic Monitoring, Faro, Beyla) and each product's Configure / Operate / Query sections"
  - "Google SRE Book (2016) chapter list and chapter sub-sections: Embracing Risk, SLOs, Eliminating Toil, Monitoring Distributed Systems, Automation, Release Engineering, Practical Alerting, Being On-Call, Effective Troubleshooting, Emergency Response, Managing Incidents, Postmortem Culture, Tracking Outages, Testing for Reliability, Load Balancing, Handling Overload, Cascading Failures, Distributed Consensus, Cron, Data Processing Pipelines, Data Integrity, Reliable Product Launches, Accelerating SREs to On-Call, Dealing with Interrupts, Communication and Collaboration"
  - "Google SRE Workbook (2018) chapter list and sub-sections: SRE and DevOps, Implementing SLOs, Monitoring, Alerting on SLOs, Eliminating Toil, Simplicity, On-Call, Incident Response, Postmortem Culture, Managing Load, NALSD, Data Processing Pipelines, Configuration Design, Configuration Specifics, Canarying Releases, Engaging with SRE, Organizational Change"
