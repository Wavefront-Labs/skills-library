# Coverage spec: vitepress. Topics from the official docs.
subject: vitepress
scope:
  category: computing-software
  field: web-development
  products: [vitepress]
sources:
  - "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/"
topics:
  - id: what-is
    name: "What is VitePress"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/what-is-vitepress.md"
    match: [vitepress,static-site-generator]
  - id: getting-started
    name: "Install and scaffold"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/getting-started.md"
    match: [installation,setup-wizard]
  - id: cli
    name: "CLI commands"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/cli.md"
    match: [cli,vitepress-dev,vitepress-build]
  - id: routing
    name: "File-based routing"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/routing.md"
    match: [file-based-routing,project-root]
  - id: clean-urls
    name: "Clean URLs"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/site-config.md"
    match: [clean-urls]
  - id: rewrites
    name: "Route rewrites"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/routing.md"
    match: [rewrites,route-rewrites]
  - id: linking
    name: "Linking between pages"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/routing.md"
    match: [internal-links,linking]
  - id: dead-links
    name: "Dead link handling"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/site-config.md"
    match: [dead-links,ignoredeadlinks]
  - id: dynamic-routes
    name: "Dynamic routes"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/routing.md"
    match: [dynamic-routes,paths-loader]
  - id: site-config
    name: "Site config file"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/site-config.md"
    match: [site-config,config-file,defineconfig]
  - id: metadata
    name: "Site metadata and head"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/site-config.md"
    match: [site-metadata,head-config,titletemplate]
  - id: base
    name: "Base path"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/site-config.md"
    match: [base-path,relative-base]
  - id: frontmatter
    name: "Frontmatter"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/frontmatter.md"
    match: [frontmatter,frontmatter-config]
  - id: markdown-extensions
    name: "Markdown extensions"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/markdown.md"
    match: [custom-containers,header-anchors,tables]
  - id: code-blocks
    name: "Code blocks and Shiki"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/markdown.md"
    match: [code-blocks,shiki,line-numbers]
  - id: code-groups
    name: "Code groups"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/markdown.md"
    match: [code-group,code-tabs]
  - id: snippets
    name: "Import code snippets"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/markdown.md"
    match: [import-code-snippets,snippet-regions]
  - id: file-include
    name: "Markdown file inclusion"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/markdown.md"
    match: [markdown-include,file-inclusion]
  - id: markdown-it
    name: "Markdown-it customization"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/markdown.md"
    match: [markdown-it,markdown-config]
  - id: assets
    name: "Asset handling"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/asset-handling.md"
    match: [static-assets,public-directory]
  - id: assets-cdn
    name: "CDN assets base"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/site-config.md"
    match: [assetsbase,assetsshards]
  - id: vue-md
    name: "Using Vue in Markdown"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/using-vue.md"
    match: [vue-in-markdown,vue-components]
  - id: ssr-compat
    name: "SSR compatibility"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/ssr-compat.md"
    match: [ssr-compat,clientonly]
  - id: data-loading
    name: "Build-time data loaders"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/data-loading.md"
    match: [data-loaders,build-time-data]
  - id: content-loader
    name: "createContentLoader"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/data-loading.md"
    match: [createcontentloader,content-loader]
  - id: cms
    name: "CMS integration"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/cms.md"
    match: [cms,headless-cms]
  - id: custom-theme
    name: "Custom theme"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/custom-theme.md"
    match: [custom-theme,theme-entry]
  - id: extend-theme
    name: "Extending default theme"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/extending-default-theme.md"
    match: [extend-default-theme,custom-css]
  - id: layout-slots
    name: "Layout slots"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/guide/extending-default-theme.md"
    match: [layout-slots]
  - id: runtime-api
    name: "Runtime API"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/runtime-api.md"
    match: [runtime-api,usedata]
  - id: router
    name: "Router hooks"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/runtime-api.md"
    match: [router-hooks,userouter]
  - id: layouts
    name: "Page layouts"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-layout.md"
    match: [doc-layout,page-layout]
  - id: home
    name: "Home page"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-home-page.md"
    match: [home-page,hero]
  - id: nav
    name: "Nav bar"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-nav.md"
    match: [nav,navbar]
  - id: sidebar
    name: "Sidebar"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-sidebar.md"
    match: [sidebar,multiple-sidebars]
  - id: search-local
    name: "Local search"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-search.md"
    match: [local-search,minisearch]
  - id: search-algolia
    name: "Algolia and Ask AI"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-search.md"
    match: [algolia,ask-ai]
  - id: footer
    name: "Footer"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-footer.md"
    match: [footer]
  - id: edit-link
    name: "Edit link"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-edit-link.md"
    match: [editlink]
  - id: last-updated
    name: "Last updated"
