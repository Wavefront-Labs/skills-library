    match: [lastupdated,git-timestamp]
  - id: prev-next
    name: "Prev and next links"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-prev-next-links.md"
    match: [prev-next-links]
  - id: team
    name: "Team page"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-team-page.md"
    match: [team-page,team-members]
  - id: badge
    name: "Badge"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-badge.md"
    match: [badge-component]
  - id: carbon
    name: "Carbon ads"
    source: "https://raw.githubusercontent.com/vuejs/vitepress/main/docs/en/reference/default-theme-carbon-ads.md"
    match: [carbon-ads]
  - id: i18n
    name: "Internationalization"
