# Coverage spec: prefect. Topics from the official docs ToC in sources.
subject: prefect
scope:
  category: computing-software
  field: data-engineering
  products: [prefect]
sources:
  - "https://www.prefect.io/docs/llms.txt"
topics:
  - id: flow-basics-and-final-states
    name: "Flow basics and final states"
    source: "https://docs.prefect.io/v3/concepts/flows"
    match: [flows, flow-run, final-state]
  - id: task-invocation-and-futures
    name: "Task invocation and futures"
    source: "https://docs.prefect.io/v3/concepts/tasks"
    match: [tasks, submit, delay]
  - id: task-caching-policies
    name: "Task caching policies"
    source: "https://docs.prefect.io/v3/concepts/caching"
    match: [caching, cache-policy, cache-key]
  - id: state-types-and-transitions
    name: "State types and transitions"
    source: "https://docs.prefect.io/v3/concepts/states"
    match: [states, state-types, late]
  - id: runtime-context-access
    name: "Runtime context access"
    source: "https://docs.prefect.io/v3/concepts/runtime-context"
    match: [runtime, flow-run, get-run-context]
  - id: artifacts-for-humans
    name: "Artifacts for humans"
    source: "https://docs.prefect.io/v3/concepts/artifacts"
    match: [artifacts, markdown-artifact, link-artifact]
  - id: task-runners-concurrency
    name: "Task runners concurrency"
    source: "https://docs.prefect.io/v3/concepts/task-runners"
    match: [task-runner, threadpool, futures]
  - id: global-concurrency-limits
    name: "Global concurrency limits"
    source: "https://docs.prefect.io/v3/concepts/global-concurrency-limits"
    match: [concurrency, rate-limit, lease]
  - id: tag-based-task-concurrency
    name: "Tag based task concurrency"
    source: "https://docs.prefect.io/v3/concepts/tag-based-concurrency-limits"
    match: [tag-concurrency, tags, slots]
  - id: deployment-schema-and-concurrency
    name: "Deployment schema and concurrency"
    source: "https://docs.prefect.io/v3/concepts/deployments"
    match: [deployments, collision-strategy, entrypoint]
  - id: schedules-cron-interval-rrule
    name: "Schedules cron interval rrule"
    source: "https://docs.prefect.io/v3/concepts/schedules"
    match: [schedules, cron, rrule]
  - id: work-pools-and-queues
    name: "Work pools and queues"
    source: "https://docs.prefect.io/v3/concepts/work-pools"
    match: [work-pool, work-queue, priority]
  - id: worker-start-and-polling
    name: "Worker start and polling"
    source: "https://docs.prefect.io/v3/concepts/workers"
    match: [worker, prefetch, heartbeat]
  - id: variables
    name: "Variables"
    source: "https://docs.prefect.io/v3/concepts/variables"
    match: [variables, json, unset]
  - id: blocks
    name: "Blocks"
    source: "https://docs.prefect.io/v3/concepts/blocks"
    match: [blocks, save, load]
  - id: settings-and-profiles
    name: "Settings and profiles"
    source: "https://docs.prefect.io/v3/concepts/settings-and-profiles"
    match: [settings, profiles, precedence]
  - id: server-database
    name: "Server database"
    source: "https://docs.prefect.io/v3/concepts/server"
    match: [server, postgres, sqlite]
  - id: events-and-resources
    name: "Events and resources"
    source: "https://docs.prefect.io/v3/concepts/events"
    match: [events, follows, resource]
  - id: automations-actions
    name: "Automations actions"
    source: "https://docs.prefect.io/v3/concepts/automations"
    match: [automations, actions, jinja]
  - id: event-trigger-fields
    name: "Event trigger fields"
    source: "https://docs.prefect.io/v3/concepts/event-triggers"
    match: [triggers, posture, for-each]
  - id: cloud-webhooks
    name: "Cloud webhooks"
    source: "https://docs.prefect.io/v3/concepts/webhooks"
    match: [webhooks, jinja, cloud]
  - id: retries-and-backoff
    name: "Retries and backoff"
    source: "https://docs.prefect.io/v3/how-to-guides/workflows/retries"
    match: [retries, retry-delay, jitter]
  - id: flow-parameter-validation
    name: "Flow parameter validation"
    source: "https://docs.prefect.io/v3/how-to-guides/workflows/pass-inputs"
    match: [parameters, validate-parameters, pydantic]
  - id: run-logging
    name: "Run logging"
    source: "https://docs.prefect.io/v3/how-to-guides/workflows/add-logging"
    match: [logging, get-run-logger, log-prints]
  - id: background-tasks
    name: "Background tasks"
    source: "https://docs.prefect.io/v3/how-to-guides/workflows/run-background-tasks"
    match: [background-tasks, delay, task-worker]
  - id: state-change-hooks
    name: "State change hooks"
    source: "https://docs.prefect.io/v3/how-to-guides/workflows/state-change-hooks"
    match: [hooks, on-failure, on-completion]
  - id: testing-workflows
    name: "Testing workflows"
    source: "https://docs.prefect.io/v3/how-to-guides/workflows/test-workflows"
    match: [testing, test-harness, pytest]
  - id: prefect-yaml-deployments
    name: "Prefect yaml deployments"
    source: "https://docs.prefect.io/v3/how-to-guides/deployments/prefect-yaml"
    match: [prefect-yaml, pull-steps, deploy]
  - id: deploy-with-python
    name: "Deploy with python"
    source: "https://docs.prefect.io/v3/how-to-guides/deployments/deploy-via-python"
    match: [deploy, serve, from-source]
  - id: flow-code-storage
    name: "Flow code storage"
    source: "https://docs.prefect.io/v3/how-to-guides/deployments/store-flow-code"
    match: [storage, git-clone, from-source]
  - id: deployment-versioning
    name: "Deployment versioning"
    source: "https://docs.prefect.io/v3/how-to-guides/deployments/versioning"
    match: [versioning, rollback, version]
  - id: job-variables-overrides
    name: "Job variables overrides"
    source: "https://docs.prefect.io/v3/how-to-guides/deployments/customize-job-variables"
    match: [job-variables, env, work-pool]
  - id: secret-blocks
    name: "Secret blocks"
    source: "https://docs.prefect.io/v3/how-to-guides/configuration/store-secrets"
    match: [secrets, secret-block, credentials]
  - id: kubernetes-worker
    name: "Kubernetes worker"
    source: "https://docs.prefect.io/v3/how-to-guides/deployment_infra/kubernetes"
    match: [kubernetes, helm, rbac]
  - id: result-persistence
    name: "Result persistence"
    source: "https://docs.prefect.io/v3/advanced/results"
    match: [results, persist-result, serializer]
  - id: transactions
    name: "Transactions"
    source: "https://docs.prefect.io/v3/advanced/transactions"
    match: [transactions, rollback, commit-mode]
  - id: cancel-flow-runs
    name: "Cancel flow runs"
    source: "https://docs.prefect.io/v3/advanced/cancel-workflows"
    match: [cancellation, cancelling, flow-run]
  - id: interactive-workflows
    name: "Interactive workflows"
    source: "https://docs.prefect.io/v3/advanced/interactive"
    match: [pause, suspend, resume]
  - id: server-in-docker
    name: "Server in docker"
    source: "https://docs.prefect.io/v3/how-to-guides/self-hosted/server-docker"
    match: [docker, server-start, api-url]
  - id: assets
    name: "Assets"
    source: "https://docs.prefect.io/v3/concepts/assets"
    match: [assets, materialize, asset-deps]
  - id: worker-healthchecks
    name: "Worker healthchecks"
    source: "https://docs.prefect.io/v3/advanced/worker-healthchecks"
    match: [healthcheck, worker, probe]
  - id: database-maintenance
    name: "Database maintenance"
    source: "https://docs.prefect.io/v3/advanced/database-maintenance"
    match: [vacuum, retention, postgres]
  - id: server-security-settings
    name: "Server security settings"
    source: "https://docs.prefect.io/v3/advanced/security-settings"
    match: [auth-string, csrf, cors]
