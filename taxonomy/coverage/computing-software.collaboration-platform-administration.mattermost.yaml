# Coverage spec: mattermost. Topics from the external structures named in `sources`.
subject: mattermost
scope:
  category: computing-software
  field: collaboration-platform-administration
  products: [mattermost]
sources:
  - "Mattermost Administration Guide (docs.mattermost.com/administration-guide) - configure, manage, comply, onboard and scale sections"
  - "Mattermost Deployment Guide (docs.mattermost.com/deployment-guide) - backup, DR and encryption"
topics:
  - id: advanced-permissions-schemes
    name: advanced permissions schemes
    source: "https://docs.mattermost.com/administration-guide/onboard/advanced-permissions.html"
    match: [permission-schemes, team-override-scheme, mmctl-permissions]
  - id: backup-and-disaster-recovery
    name: backup and disaster recovery
    source: "https://docs.mattermost.com/deployment-guide/backup-disaster-recovery.html"
    match: [backup, disaster-recovery, active-passive]
  - id: bulk-export-data
    name: bulk export data
    source: "https://docs.mattermost.com/administration-guide/manage/bulk-export-tool.html"
    match: [bulk-export, jsonl, mmctl-export]
  - id: certificate-based-authentication-deprecated
    name: certificate based authentication deprecated
    source: "https://docs.mattermost.com/administration-guide/onboard/certificate-based-authentication.html"
    match: [certificate-based-auth, client-side-cert, experimental-settings]
  - id: channel-export-plugin
    name: channel export plugin
    source: "https://docs.mattermost.com/administration-guide/comply/export-mattermost-channel-data.html"
    match: [channel-export, export-command, csv-export]
  - id: channel-management-access-controls
    name: channel management access controls
    source: "https://docs.mattermost.com/administration-guide/manage/team-channel-members.html"
    match: [channel-management, read-only-channel, guest-permissions]
  - id: cloud-ip-filtering
    name: cloud ip filtering
    source: "https://docs.mattermost.com/administration-guide/manage/cloud-ip-filtering.html"
    match: [ip-filtering, cidr, cloud-enterprise]
  - id: configuration-in-database
    name: configuration in database
    source: "https://docs.mattermost.com/administration-guide/configure/configuration-in-your-database.html"
    match: [config-in-database, mm-config, mmctl-config-migrate]
  - id: custom-branding
    name: custom branding
    source: "https://docs.mattermost.com/administration-guide/configure/custom-branding-tools.html"
    match: [custom-branding, site-name, login-page]
  - id: custom-terms-of-service
    name: custom terms of service
    source: "https://docs.mattermost.com/administration-guide/comply/custom-terms-of-service.html"
    match: [terms-of-service, compliance, enterprise]
  - id: data-retention-policy
    name: data retention policy
    source: "https://docs.mattermost.com/administration-guide/comply/data-retention-policy.html"
    match: [data-retention, retention-policy, compliance]
  - id: elasticsearch-server-setup
    name: elasticsearch server setup
    source: "https://docs.mattermost.com/administration-guide/scale/elasticsearch-setup.html"
    match: [elasticsearch, search-indexing, analysis-icu]
  - id: electronic-discovery-methods
    name: electronic discovery methods
    source: "https://docs.mattermost.com/administration-guide/comply/electronic-discovery.html"
    match: [ediscovery, compliance-api, legal]
  - id: email-template-customization
    name: email template customization
    source: "https://docs.mattermost.com/administration-guide/configure/email-templates.html"
    match: [email-templates, templates-folder, i18n-strings]
  - id: encryption-options
    name: encryption options
    source: "https://docs.mattermost.com/deployment-guide/encryption-options.html"
    match: [encryption, tls, gossip-encryption]
  - id: enterprise-health-check-request
    name: enterprise health check request
    source: "https://docs.mattermost.com/administration-guide/manage/request-server-health-check.html"
    match: [health-check, support-packet, enterprise-support]
  - id: environment-variable-configuration
    name: environment variable configuration
    source: "https://docs.mattermost.com/administration-guide/configure/environment-variables.html"
    match: [environment-variables, config-json, mm-prefix]
  - id: error-codes-licence-limits
    name: error codes licence limits
    source: "https://docs.mattermost.com/administration-guide/manage/admin/error-codes.html"
    match: [error-codes, safety-limits, licensed-users-limit]
  - id: google-sso-openid-connect
    name: google sso openid connect
    source: "https://docs.mattermost.com/administration-guide/onboard/sso-google.html"
    match: [google-sso, openid-connect, oauth-client]
  - id: guest-accounts
    name: guest accounts
    source: "https://docs.mattermost.com/administration-guide/onboard/guest-accounts.html"
    match: [guest-accounts, guest-access, magic-link]
  - id: health-check-probes
    name: health check probes
    source: "https://docs.mattermost.com/administration-guide/manage/configure-health-check-probes.html"
    match: [health-check, system-ping, goroutine-threshold]
  - id: in-product-notices
    name: in product notices
    source: "https://docs.mattermost.com/administration-guide/manage/in-product-notices.html"
    match: [in-product-notices, admin-notices, air-gapped]
  - id: legal-hold-plugin
    name: legal hold plugin
    source: "https://docs.mattermost.com/administration-guide/comply/legal-hold.html"
    match: [legal-hold, litigation-hold, compliance]
  - id: license-key-installation
    name: license key installation
    source: "https://docs.mattermost.com/administration-guide/manage/admin/installing-license-key.html"
    match: [license-key, mmctl-license, edition-and-license]
  - id: migrate-from-other-chat-platforms
    name: migrate from other chat platforms
    source: "https://docs.mattermost.com/administration-guide/onboard/migrating-to-mattermost.html"
    match: [migration-planning, bulk-loading, etl]
  - id: migration-announcement-email
    name: migration announcement email
    source: "https://docs.mattermost.com/administration-guide/onboard/migration-announcement-email.html"
    match: [migration-announcement, end-user-communication, password-reset]
  - id: move-server-migration
    name: move server migration
    source: "https://docs.mattermost.com/administration-guide/onboard/migrating-to-mattermost.html"
    match: [server-migration, new-server, database-restore]
  - id: multi-factor-authentication
    name: multi factor authentication
    source: "https://docs.mattermost.com/administration-guide/onboard/multi-factor-authentication.html"
    match: [mfa, totp, enforce-mfa]
  - id: openid-connect-sso
    name: openid connect sso
    source: "https://docs.mattermost.com/administration-guide/onboard/sso-openidconnect.html"
    match: [openid-connect, oidc, sso]
  - id: plugin-management
    name: plugin management
    source: "https://docs.mattermost.com/administration-guide/configure/manage-plugins.html"
    match: [plugins, marketplace, mmctl]
  - id: product-limits
    name: product limits
    source: "https://docs.mattermost.com/administration-guide/manage/product-limits.html"
    match: [product-limits, hard-limits, attachments]
  - id: push-notification-health-targets
    name: push notification health targets
    source: "https://docs.mattermost.com/administration-guide/scale/push-notification-health-targets.html"
    match: [push-notifications, grafana-dashboard, delivery-rate]
  - id: rate-limiting-settings
    name: rate limiting settings
    source: "https://docs.mattermost.com/administration-guide/configure/rate-limiting-configuration-settings.html"
    match: [rate-limiting, api-throttling, reverse-proxy]
  - id: redis-cache-setup
    name: redis cache setup
    source: "https://docs.mattermost.com/administration-guide/scale/redis.html"
    match: [redis, cache-settings, elasticache]
  - id: saml-okta-setup
    name: saml okta setup
    source: "https://docs.mattermost.com/administration-guide/onboard/sso-saml-okta.html"
    match: [saml, okta, sso]
  - id: smtp-email-setup
    name: smtp email setup
    source: "https://docs.mattermost.com/administration-guide/configure/smtp-email.html"
    match: [smtp, email-notifications, system-console]
  - id: ssl-client-certificate-mutual-tls
    name: ssl client certificate mutual tls
    source: "https://docs.mattermost.com/administration-guide/onboard/ssl-client-certificate.html"
    match: [client-certificates, mutual-tls, nginx-proxy]
  - id: system-statistics-reporting
    name: system statistics reporting
    source: "https://docs.mattermost.com/administration-guide/manage/statistics.html"
    match: [statistics, reporting, team-statistics]
  - id: system-wide-notifications
    name: system wide notifications
    source: "https://docs.mattermost.com/administration-guide/manage/system-wide-notifications.html"
    match: [announcement-banner, system-wide-notifications, banner-dismissal]
  - id: team-management-console
    name: team management console
    source: "https://docs.mattermost.com/administration-guide/manage/team-channel-members.html"
    match: [team-management, archive-team, group-sync]
  - id: telemetry-and-security-update-check
    name: telemetry and security update check
    source: "https://docs.mattermost.com/administration-guide/manage/telemetry.html"
    match: [telemetry, security-update-check, diagnostics-reporting]
  - id: user-provisioning-workflows
    name: user provisioning workflows
    source: "https://docs.mattermost.com/administration-guide/onboard/user-provisioning-workflows.html"
    match: [user-provisioning, deprovisioning, id-attribute]
  - id: user-satisfaction-survey-plugin-deprecated
    name: user satisfaction survey plugin deprecated
    source: "https://docs.mattermost.com/administration-guide/manage/user-satisfaction-surveys.html"
    match: [satisfaction-survey, surveybot, deprecated-plugin]
  - id: user-survey-plugin
    name: user survey plugin
    source: "https://docs.mattermost.com/administration-guide/configure/manage-user-surveys.html"
    match: [user-survey, nps, survey-plugin]
