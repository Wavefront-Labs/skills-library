topics:
  - id: install-openbao
    name: "Install OpenBao"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/install.mdx"
    match: [install, package-manager, container-images, precompiled-binary]
  - id: verify-release-signatures
    name: "Verify release signatures"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/install.mdx"
    match: [checksum, signature, cosign, gpg]
  - id: disable-swap
    name: "Disable swap"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/install.mdx"
    match: [swap, hardening, memory-swap-max, systemd]
  - id: operator-quickstart
    name: "Operator quickstart"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/get-started/operator-qs.mdx"
    match: [operator, init, unseal, audit-device]
  - id: developer-quickstart
    name: "Developer quickstart"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/get-started/developer-qs.mdx"
    match: [developer, kv, bao-addr, bao-token-path]
  - id: dev-server
    name: "Dev server"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/concepts/dev-server.mdx"
    match: [dev-mode, dev-server, in-memory, dev-kv-v1]
  - id: seal-and-unseal
    name: "Seal and unseal"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/concepts/seal.mdx"
    match: [seal, unseal, shamir, root-key]
  - id: auto-unseal-and-recovery-keys
    name: "Auto-unseal and recovery keys"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/concepts/seal.mdx"
    match: [auto-unseal, recovery-keys, rotate-keys, kms]
  - id: seal-migration
    name: "Seal migration"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/concepts/seal.mdx"
    match: [seal-migration, migrate, downtime, disabled]
  - id: seal-stanza-health-checks
    name: "Seal stanza and health checks"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/configuration/seal/index.mdx"
    match: [seal-stanza, health-check, auto-unseal, plugin]
  - id: transit-seal
    name: "Transit seal"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/configuration/seal/transit.mdx"
    match: [transit-seal, key-name, orphan-token, auto-unseal]
  - id: static-key-seal
    name: "Static key seal"
    source: "https://raw.githubusercontent.com/openbao/openbao/main/website/content/docs/configuration/seal/static.mdx"
    match: [static-seal, current-key, previous-key, key-rotation]
