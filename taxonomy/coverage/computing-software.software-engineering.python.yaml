# Canonical coverage spec: Python language, standard library and packaging.
# Topics and subtopics come from the external sources listed below, not from existing skills.
subject: python-language
scope:
  category: computing-software
  field: software-engineering
  products: [python]
sources:
  - "Python Language Reference and Library Reference (docs.python.org/3)"
  - "Python HOWTOs (docs.python.org/3/howto)"
  - "Python Packaging User Guide (packaging.python.org)"
  - "Typing specification (typing.python.org) and typing module docs"
  - "PEPs 484, 517, 561, 621, 634, 654, 695, 703, 735, 779"
topics:
  - {id: py-data-model, name: "Data model and special methods", source: "Language Reference: Data model", match: [py-data-model], subtopics: [
      {id: py-dm-repr, name: "repr, str and format protocols", match: [dunder-repr-str-format]},
      {id: py-dm-getattr, name: "getattr versus getattribute", match: [getattr-getattribute]},
      {id: py-dm-container, name: "Container and sequence protocols", match: [container-protocol]}]}
  - {id: py-classes, name: "Classes and inheritance", source: "Tutorial: Classes; abc module", match: [py-classes], subtopics: [
      {id: py-cls-dataclass, name: "Dataclasses", match: [python-dataclass]},
      {id: py-cls-enum, name: "Enumerations", match: [strenum]},
      {id: py-cls-abc, name: "Abstract base classes", match: [abstract-base-classes]}]}
