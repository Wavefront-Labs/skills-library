# Coverage spec for BookStack, from the BookStack documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: bookstack
scope:
  category: computing-software
  field: collaboration-platform-administration
  products: [bookstack]
sources:
  - "BookStack documentation (bookstackapp.com/docs) - admin and user guides"
topics:
  - id: installation
    name: "installation"
    source: https://www.bookstackapp.com/docs/admin/installation/
    match: [installation, composer]
  - id: ubuntu-scripts
    name: "ubuntu install scripts"
    source: https://www.bookstackapp.com/docs/admin/installation/
    match: [bookstack-install-script]
  - id: docker-install
    name: "docker community images"
    source: https://www.bookstackapp.com/docs/admin/installation/
    match: [bookstack-docker]
  - id: security
    name: "security"
    source: https://www.bookstackapp.com/docs/admin/security/
    match: [security, content-filtering]
  - id: subdirectory
    name: "subdirectory setup"
    source: https://www.bookstackapp.com/docs/admin/subdirectory-setup/
    match: [subdirectory]
  - id: multi-instance
    name: "multiple instances"
    source: https://www.bookstackapp.com/docs/admin/multi-instance/
    match: [multi-instance]
  - id: content-storage
    name: "content storage format"
    source: https://www.bookstackapp.com/docs/admin/content-storage/
    match: [content-storage]
  - id: updates
    name: "updates"
    source: https://www.bookstackapp.com/docs/admin/updates/
    match: [update, git-pull]
  - id: commands
    name: "artisan commands"
    source: https://www.bookstackapp.com/docs/admin/commands/
    match: [artisan, create-admin]
  - id: backup-restore
    name: "backup and restore"
    source: https://www.bookstackapp.com/docs/admin/backup-restore/
    match: [backup, restore]
  - id: debugging
    name: "debugging"
    source: https://www.bookstackapp.com/docs/admin/debugging/
    match: [debugging, laravel-log]
  - id: system-cli
    name: "system cli"
    source: https://www.bookstackapp.com/docs/admin/system-cli/
    match: [system-cli]
  - id: filesystem-permissions
    name: "filesystem permissions"
    source: https://www.bookstackapp.com/docs/admin/filesystem-permissions/
    match: [filesystem-permissions]
  - id: oidc
    name: "openid connect"
    source: https://www.bookstackapp.com/docs/admin/oidc-auth/
    match: [oidc, openid-connect]
  - id: saml2
    name: "saml 2.0"
    source: https://www.bookstackapp.com/docs/admin/saml2-auth/
    match: [saml2]
  - id: ldap
    name: "ldap"
    source: https://www.bookstackapp.com/docs/admin/ldap-auth/
    match: [ldap, active-directory]
  - id: social-auth
    name: "third party and social login"
    source: https://www.bookstackapp.com/docs/admin/third-party-auth/
    match: [social-login]
  - id: email
    name: "email"
    source: https://www.bookstackapp.com/docs/admin/email-webhooks/
    match: [mail, smtp]
  - id: webhooks
    name: "webhooks"
    source: https://www.bookstackapp.com/docs/admin/email-webhooks/
    match: [webhooks]
  - id: visual-customisation
    name: "visual customisation"
    source: https://www.bookstackapp.com/docs/admin/visual-customisation/
    match: [visual-customisation]
  - id: language
    name: "language and locale"
    source: https://www.bookstackapp.com/docs/admin/language-config/
    match: [locale]
  - id: uploads
    name: "file uploads"
    source: https://www.bookstackapp.com/docs/admin/upload-config/
    match: [file-upload-size-limit, storage-type]
  - id: cache-sessions
    name: "caching and sessions"
    source: https://www.bookstackapp.com/docs/admin/cache-session-config/
    match: [cache-driver, session-driver]
  - id: pdf-rendering
    name: "pdf rendering"
    source: https://www.bookstackapp.com/docs/admin/pdf-rendering/
    match: [pdf-export, dompdf]
  - id: utf8mb4
    name: "utf8mb4 emoji support"
    source: https://www.bookstackapp.com/docs/admin/ut8mb4-support/
    match: [utf8mb4]
  - id: hacking-bookstack
    name: "hacking bookstack"
    source: https://www.bookstackapp.com/docs/admin/hacking-bookstack/
    match: [theme-system]
  - id: other-config
    name: "other configuration"
    source: https://www.bookstackapp.com/docs/admin/other-config/
    match: [other-config]
  - id: content-overview
    name: "content overview"
    source: https://www.bookstackapp.com/docs/user/content-overview/
    match: [content-hierarchy]
  - id: organising-content
    name: "organising content"
    source: https://www.bookstackapp.com/docs/user/organising-content/
    match: [shelves]
  - id: getting-around
    name: "getting around"
    source: https://www.bookstackapp.com/docs/user/getting-around/
    match: [navigation]
  - id: search
    name: "searching content"
    source: https://www.bookstackapp.com/docs/user/searching/
    match: [search, search-operators]
  - id: wysiwyg-editor
    name: "wysiwyg editor"
    source: https://www.bookstackapp.com/docs/user/wysiwyg-editor/
    match: [wysiwyg]
  - id: markdown-editor
    name: "markdown editor"
    source: https://www.bookstackapp.com/docs/user/markdown-editor/
    match: [markdown-editor]
  - id: attachments
    name: "attachments"
    source: https://www.bookstackapp.com/docs/user/attachments/
    match: [attachments]
  - id: diagrams
    name: "drawings and diagrams"
    source: https://www.bookstackapp.com/docs/user/diagrams/
    match: [drawio]
  - id: export-import
    name: "exporting and importing"
    source: https://www.bookstackapp.com/docs/user/export-import/
    match: [export, import, portable-zip]
  - id: tags
    name: "content tags"
    source: https://www.bookstackapp.com/docs/user/tags/
    match: [content-tags]
  - id: page-templates
    name: "page templates"
    source: https://www.bookstackapp.com/docs/user/page-templates/
    match: [page-templates]
  - id: roles-permissions
    name: "roles and permissions"
    source: https://www.bookstackapp.com/docs/user/roles-and-permissions/
    match: [roles, permissions, entity-permissions]
  - id: reusing-content
    name: "reusing page content"
    source: https://www.bookstackapp.com/docs/user/reusing-page-content/
    match: [transclusion]
  - id: permalinks
    name: "page permalinks"
    source: https://www.bookstackapp.com/docs/user/content-permalinks/
    match: [permalinks]
  - id: mfa
    name: "multi-factor authentication"
    source: https://www.bookstackapp.com/docs/admin/security/
    match: [mfa]
  - id: trusted-proxies
    name: "trusted proxies"
    source: https://www.bookstackapp.com/docs/admin/security/
    match: [trusted-proxies]
  - id: audit-log
    name: "audit log"
    source: https://www.bookstackapp.com/docs/admin/commands/
    match: [audit-log]
