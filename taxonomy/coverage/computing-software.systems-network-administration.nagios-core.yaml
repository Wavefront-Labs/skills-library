# Coverage spec for Nagios Core (computing-software / systems-network-administration).
subject: Nagios Core
scope:
  category: computing-software
  field: systems-network-administration
  products: [nagios-core]
sources:
  - "Nagios Core 4 documentation (https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/toc.html)"
topics:
  - id: getting-started
    name: "getting started and learning path"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/beginners.html
    match: ["beginners", "learning-path", "quickstart"]
  - id: upgrading
    name: "upgrading from previous versions"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/upgrading.html
    match: ["upgrade", "upgrading", "source-install"]
  - id: verify-config
    name: "verifying configuration"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/verifyconfig.html
    match: ["verify-config", "config-check", "nagios-v"]
  - id: start-stop
    name: "starting and stopping"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/startstop.html
    match: ["start", "stop", "reload", "sighup"]
  - id: object-config-overview
    name: "object configuration overview"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/configobject.html
    match: ["object-configuration", "object-types", "cfg-dir"]
  - id: host-definitions
    name: "host definitions"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/objectdefinitions.html
    match: ["host-definition", "define-host"]
    subtopics:
      - {id: host-parents, name: "host parents", match: ["parents"]}
      - {id: host-initial-state, name: "initial state", match: ["initial-state"]}
  - id: service-definitions
    name: "service definitions"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/objectdefinitions.html
    match: ["service-definition", "define-service"]
  - id: contact-definitions
    name: "contact definitions"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/objectdefinitions.html
    match: ["contact-definition", "define-contact"]
    subtopics:
      - {id: contact-notification-commands, name: "contact notification commands", match: ["notification-commands"]}
  - id: group-definitions
    name: "host, service and contact groups"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/objectdefinitions.html
    match: ["hostgroup", "servicegroup", "contactgroup"]
  - id: command-definitions
    name: "command definitions"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/objectdefinitions.html
    match: ["command-definition", "define-command", "command-line"]
  - id: timeperiod-definitions
    name: "time period definitions"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/timeperiods.html
    match: ["timeperiod", "define-timeperiod"]
    subtopics:
      - {id: timeperiod-precedence, name: "directive precedence", match: ["precedence"]}
      - {id: timeperiod-exclude, name: "exclusions and date exceptions", match: ["exclude", "date-exceptions"]}
  - id: oncall-rotation
    name: "on-call notification rotations"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/oncallrotation.html
    match: ["oncall", "on-call-rotation"]
  - id: object-inheritance
    name: "object inheritance with templates"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/objectinheritance.html
    match: ["templates", "object-inheritance", "register-0"]
    subtopics:
      - {id: additive-inheritance, name: "additive and null inheritance", match: ["additive-inheritance", "null-value"]}
  - id: object-tricks
    name: "time-saving tips for object definitions"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/objecttricks.html
    match: ["wildcards", "exclusion", "object-tricks"]
    subtopics:
      - {id: regexp-matching, name: "regular expression matching", match: ["regexp", "use-regexp-matching"]}
  - id: custom-variables
    name: "custom object variables"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/customobjectvars.html
    match: ["custom-variables", "custom-macros"]
  - id: macros
    name: "macros and how they work"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/macros.html
    match: ["macros", "macro-substitution", "arg-macros"]
    subtopics:
      - {id: on-demand-macros, name: "on-demand macros", match: ["on-demand-macros"]}
      - {id: macro-security, name: "macro cleansing and environment", match: ["illegal-macro-output-chars", "enable-environment-macros"]}
  - id: macro-list
    name: "standard macros available"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/macrolist.html
    match: ["macro-list", "notificationtype", "hoststate"]
  - id: plugins
    name: "plugins"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/plugins.html
    match: ["plugins", "nagios-plugins", "plugin-sources"]
  - id: plugin-api
    name: "plugin API"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/pluginapi.html
    match: ["plugin-api", "plugin-exit-codes", "plugin-output"]
    subtopics:
      - {id: multi-line-output, name: "multi-line plugin output", match: ["multi-line-output", "longserviceoutput"]}
  - id: host-checks
    name: "host checks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/hostchecks.html
    match: ["host-checks"]
  - id: service-checks
    name: "service checks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/servicechecks.html
    match: ["service-checks"]
  - id: active-checks
    name: "active checks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/activechecks.html
    match: ["active-checks"]
  - id: passive-checks
    name: "passive checks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/passivechecks.html
    match: ["passive-checks"]
    subtopics:
      - {id: passive-submission, name: "submitting passive results", match: ["process-service-check-result", "process-host-check-result"]}
  - id: state-types
    name: "state types"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/statetypes.html
    match: ["state-types", "soft-state", "hard-state"]
  - id: network-reachability
    name: "network reachability and DOWN vs UNREACHABLE"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/networkreachability.html
    match: ["network-reachability", "down-vs-unreachable"]
  - id: notifications
    name: "notifications"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/notifications.html
    match: ["notifications", "notification-filters", "notification-methods"]
  - id: cgis
    name: "information on the CGIs"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/cgis.html
    match: ["cgis", "web-interface"]
  - id: cgi-authorization
    name: "CGI authorization"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/cgiauth.html
    match: ["cgi-authorization", "authorized-for-all-hosts", "htpasswd"]
  - id: external-commands
    name: "external commands"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/extcommands.html
    match: ["external-commands", "command-file"]
  - id: event-handlers
    name: "event handlers"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/eventhandlers.html
    match: ["event-handlers", "enable-event-handlers"]
    subtopics:
      - {id: event-handler-example, name: "event handler worked example", match: ["event-handler-example", "restart-httpd"]}
  - id: volatile-services
    name: "volatile services"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/volatileservices.html
    match: ["volatile-services", "is-volatile"]
  - id: freshness
    name: "service and host result freshness checks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/freshness.html
    match: ["freshness", "freshness-checking", "freshness-threshold"]
  - id: distributed-monitoring
    name: "distributed and redundant monitoring"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/distributed.html
    match: ["distributed-monitoring", "redundant-monitoring"]
  - id: flapping
    name: "flap detection"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/flapping.html
    match: ["flap-detection", "flapping"]
    subtopics:
      - {id: flap-thresholds, name: "flap thresholds", match: ["low-flap-threshold", "high-flap-threshold"]}
  - id: escalations
    name: "notification escalations"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/escalations.html
    match: ["escalations", "serviceescalation", "hostescalation"]
  - id: clusters
    name: "monitoring service and host clusters"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/clusters.html
    match: ["clusters", "check-cluster"]
  - id: dependencies
    name: "host and service dependencies"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/dependencies.html
    match: ["dependencies", "servicedependency", "hostdependency"]
  - id: stalking
    name: "state stalking"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/stalking.html
    match: ["stalking", "stalking-options"]
  - id: performance-data
    name: "performance data"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/perfdata.html
    match: ["performance-data", "perfdata"]
    subtopics:
      - {id: perfdata-processing, name: "perfdata files and commands", match: ["service-perfdata-file", "service-perfdata-command"]}
  - id: downtime
    name: "scheduled downtime"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/downtime.html
    match: ["downtime", "scheduled-downtime"]
  - id: adaptive-monitoring
    name: "adaptive monitoring"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/adaptive.html
    match: ["adaptive-monitoring"]
  - id: predictive-dependency-checks
    name: "predictive dependency checks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/dependencychecks.html
    match: ["predictive-dependency-checks"]
  - id: cached-checks
    name: "cached checks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/cachedchecks.html
    match: ["cached-checks", "cached-host-check-horizon"]
  - id: passive-state-translation
    name: "passive host state translation"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/passivestatetranslation.html
    match: ["translate-passive-host-checks", "passive-host-state"]
  - id: security
    name: "security considerations"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/security.html
    match: ["security", "hardening"]
  - id: cgi-security
    name: "enhanced CGI security"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/cgisecurity.html
    match: ["cgi-security", "digest-authentication", "sslrequiressl"]
  - id: tuning
    name: "tuning for maximum performance"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/tuning.html
    match: ["tuning", "max-concurrent-checks", "performance"]
  - id: fast-startup
    name: "fast startup options"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/faststartup.html
    match: ["fast-startup", "precached-object-file"]
  - id: large-installation-tweaks
    name: "large installation tweaks"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/largeinstalltweaks.html
    match: ["large-installation", "use-large-installation-tweaks"]
  - id: nagiostats
    name: "nagiostats utility"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/nagiostats.html
    match: ["nagiostats"]
  - id: mrtg-graphs
    name: "graphing performance statistics with MRTG"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/mrtggraphs.html
    match: ["mrtg", "performance-graphs"]
  - id: logging-debug
    name: "main configuration logging and debugging options"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/configmain.html
    match: ["logging", "debug-level", "log-rotation-method"]
  - id: addons
    name: "Nagios add-ons (NRPE, NSCA, NRDP, NCPA, NDOUtils)"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/addons.html
    match: ["nrpe", "nsca", "nrdp", "ncpa", "ndoutils"]
  - id: monitor-windows
    name: "monitoring a Windows machine"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/monitoring-windows.html
    match: ["monitor-windows", "windows-monitoring"]
  - id: monitor-network-devices
    name: "monitoring a router or switch"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/monitoring-routers.html
    match: ["monitor-router", "monitor-switch", "check-snmp"]
  - id: monitor-public-services
    name: "monitoring publicly available services"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/monitoring-publicservices.html
    match: ["monitor-http", "public-services", "check-http"]
  - id: monitor-linux
    name: "monitoring a Linux/Unix machine"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/monitoring-linux.html
    match: ["monitor-linux", "check-by-ssh"]
  - id: monitor-printers
    name: "monitoring a network printer"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/monitoring-printers.html
    match: ["monitor-printer", "check-hpjd"]
  - id: snmp-traps
    name: "SNMP trap integration"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/int-snmptrap.html
    match: ["snmp-traps", "snmptt"]
  - id: tcp-wrappers
    name: "TCP wrapper alerts integration"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/int-tcpwrappers.html
    match: ["tcp-wrappers", "hosts-deny"]
  - id: main-config-scheduling
    name: "main configuration scheduling and timeouts"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/configmain.html
    match: ["service-inter-check-delay-method", "service-check-timeout", "interval-length"]
  - id: state-retention
    name: "state retention"
    source: https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/configmain.html
    match: ["retain-state-information", "state-retention-file"]
