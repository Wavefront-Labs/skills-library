    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, lock-path, allow-root, permissions, neutral-umask]
  - id: repository-types-and-path
    name: "Repository types and path"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, repo-type, repo-path, posix, cifs]
  - id: repository-encryption
