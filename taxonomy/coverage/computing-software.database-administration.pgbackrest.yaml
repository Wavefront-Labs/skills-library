# Coverage spec: pgbackrest. Topics from the official docs table of contents.
subject: pgbackrest
scope:
  category: computing-software
  field: database-administration
  products: [pgbackrest]
sources:
  - "pgbackrest official docs"
topics:
  - id: pgbackrest-quick-start
    name: "Pgbackrest quick start"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, backup, quick-start, stanza, postgresql]
  - id: config-file-and-sections
    name: "Config file and sections"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, configuration, pgbackrest-conf, sections, stanza]
  - id: config-include-and-env-vars
    name: "Config include and env vars"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, configuration, environment-variables, conf-d, config-include-path]
  - id: option-types-and-reset
    name: "Option types and reset"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, options, option-types, boolean, size, reset]
  - id: stanza-create-and-upgrade
    name: "Stanza create and upgrade"
    source: "https://pgbackrest.org/command.html"
    match: [pgbackrest, stanza-create, stanza-upgrade, repository, major-upgrade]
  - id: archive-command-setup
    name: "Archive command setup"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, archive-push, archive-command, wal-archiving, postgresql-conf]
  - id: check-command
    name: "Check command"
    source: "https://pgbackrest.org/command.html"
    match: [pgbackrest, check, validation, archiving, configuration]
  - id: backup-types
    name: "Backup types"
    source: "https://pgbackrest.org/command.html"
    match: [pgbackrest, backup, full, differential, incremental]
  - id: backup-scheduling-cron
    name: "Backup scheduling cron"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, cron, scheduling, backup, diff]
  - id: start-fast-and-checkpoint
    name: "Start fast and checkpoint"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, start-fast, checkpoint, backup, pg-backup-start]
  - id: backup-resume-and-manifest
    name: "Backup resume and manifest"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, resume, manifest, backup, manifest-save-threshold]
  - id: checksum-page-option
    name: "Checksum page option"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, checksum-page, data-checksums, corruption, backup]
  - id: exclude-option
    name: "Exclude option"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, exclude, backup, delta, pgdata]
  - id: backup-annotations
    name: "Backup annotations"
    source: "https://pgbackrest.org/command.html"
    match: [pgbackrest, annotate, annotation, backup, info]
  - id: full-backup-retention
    name: "Full backup retention"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, retention, repo-retention-full, expire, full-backup]
  - id: differential-backup-retention
    name: "Differential backup retention"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, retention, repo-retention-diff, differential, expire]
  - id: archive-retention-options
    name: "Archive retention options"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, retention, repo-retention-archive, wal-archive, pitr]
  - id: expire-command
    name: "Expire command"
    source: "https://pgbackrest.org/command.html"
    match: [pgbackrest, expire, retention, dry-run, backup-set]
  - id: info-command
    name: "Info command"
    source: "https://pgbackrest.org/command.html"
    match: [pgbackrest, info, backup-status, json, stanza-status]
  - id: info-output-fields
    name: "Info output fields"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, info, backup-labels, wal-range, backup-size]
  - id: monitoring-with-info-json
    name: "Monitoring with info json"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, monitoring, info, json, jq]
  - id: verify-command
    name: "Verify command"
    source: "https://pgbackrest.org/command.html"
    match: [pgbackrest, verify, repository, integrity, backup-set]
  - id: compression-options
    name: "Compression options"
    source: "https://pgbackrest.org/configuration.html"
    match: [pgbackrest, compress-type, compress-level, zstd, lz4]
  - id: process-max-parallelism
    name: "Process max parallelism"
    source: "https://pgbackrest.org/user-guide.html"
    match: [pgbackrest, process-max, parallel, performance, restore]
  - id: timeouts-and-keepalive
    name: "Timeouts and keepalive"
