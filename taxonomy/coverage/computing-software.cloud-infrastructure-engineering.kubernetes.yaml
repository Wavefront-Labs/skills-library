# Canonical coverage spec: Kubernetes.
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears in the skill's id/name.
# Topics come from external, authoritative structures (not from what we happened to write), so
# the check measures the library against the subject, not against itself.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (kubernetes.io
# docs page headings and task pages, kubectl/kubeadm reference sub-commands, CKA/CKAD/CKS
# objective bullets). coverage_check reports the percentage of subtopics with a matching skill.
subject: kubernetes
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [kubernetes]
sources:
  - "CKA curriculum (CNCF): Cluster Architecture/Installation/Configuration 25%, Workloads & Scheduling 15%, Services & Networking 20%, Storage 10%, Troubleshooting 30%"
  - "CKAD curriculum (CNCF): Application Design & Build, Deployment, Observability & Maintenance, Environment/Configuration/Security, Services & Networking"
  - "CKS curriculum (CNCF): Cluster Setup, Cluster Hardening, System Hardening, Minimize Microservice Vulnerabilities, Supply Chain Security, Monitoring/Logging/Runtime Security"
  - "kubernetes.io/docs/concepts table of contents (Workloads, Services/Networking, Storage, Configuration, Security, Policies, Scheduling/Eviction, Cluster Administration, Windows, Extending Kubernetes)"
  - "kubernetes.io/docs/tasks and /docs/reference (kubectl sub-commands, kubeadm sub-commands, kubelet/kube-proxy/kube-apiserver configuration references) for subtopics"
  - "Depth round 2: kubernetes.io task pages and concept sub-headings, kubectl command reference (kubectl.docs.kubernetes.io), API resource field groups (kubernetes.io/docs/reference/kubernetes-api), CKA/CKAD/CKS objective bullets"
  - "Kubernetes SIGs: apps, network, storage, security/auth, scheduling, node, autoscaling, cli, cluster-lifecycle, multicluster, api-machinery, instrumentation, windows"
topics:
  # --- Cluster architecture, installation, configuration (CKA 25%; sig-cluster-lifecycle, sig-node)
  - id: kubeadm-bootstrap
