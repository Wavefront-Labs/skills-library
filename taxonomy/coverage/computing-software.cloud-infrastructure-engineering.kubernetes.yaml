    subtopics:
      - {id: kubeadm-init-config, name: kubeadm init with InitConfiguration/ClusterConfiguration files, match: [kubeadm-init, clusterconfiguration]}
      - {id: kubeadm-join-nodes, name: kubeadm join for workers with tokens and CA hash, match: [kubeadm-join, bootstrap-token]}
      - {id: kubeadm-reset-rejoin, name: kubeadm reset and cleanly re-joining a node, match: [kubeadm-reset, node-rejoin]}
      - {id: kubeadm-init-phases, name: Running and skipping individual kubeadm init/join phases, match: [kubeadm-phases, skip-phases]}
      - {id: kubeadm-token-management, name: kubeadm token create/list/delete and certificate-key for control-plane joins, match: [kubeadm-token, certificate-key]}
      - {id: kubeadm-component-customisation, name: extraArgs/extraVolumes and kubeadm patches for control-plane components, match: [kubeadm-extraargs, kubeadm-patches]}
      - {id: kubeadm-preflight, name: kubeadm preflight checks and --ignore-preflight-errors, match: [kubeadm-preflight, ignore-preflight-errors]}
      - {id: kubelet-tls-bootstrap, name: kubelet TLS bootstrapping and the bootstrap-kubelet.conf kubeconfig, match: [kubelet-tls-bootstrapping, bootstrap-kubeconfig]}
      - {id: kubeadm-config-print-migrate, name: kubeadm config print defaults and config migrate between API versions, match: [kubeadm-config-migrate, kubeadm-config-print]}
      - {id: kubeadm-dry-run, name: kubeadm init --dry-run and inspecting generated manifests, match: [kubeadm-dry-run]}
      - {id: kubeadm-kubeconfig-user, name: kubeadm kubeconfig user for generating admin and user kubeconfigs, match: [kubeadm-kubeconfig-user]}
