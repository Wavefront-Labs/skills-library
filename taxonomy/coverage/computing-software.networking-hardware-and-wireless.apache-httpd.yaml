# Coverage spec: apache-httpd. Topics from the external structures named in `sources`.
subject: apache-httpd
scope:
  category: computing-software
  field: networking-hardware-and-wireless
  products: [apache-httpd]
sources:
  - "Apache HTTP Server 2.4 documentation: https://httpd.apache.org/docs/2.4/ (manual, modules, how-tos, programs)"
topics:
  - id: config-file-syntax-and-structure
    name: config file syntax and structure
    source: "https://httpd.apache.org/docs/2.4/configuring.html"
    match: [config, syntax, include, ifmodule, define]
  - id: config-scopes-and-merge-order
    name: config scopes and merge order
    source: "https://httpd.apache.org/docs/2.4/sections.html"
    match: [config, directory, location, files, merge-order, if]
  - id: httpd-command-line-options
    name: httpd command line options
    source: "https://httpd.apache.org/docs/2.4/programs/httpd.html"
    match: [httpd, cli, configtest, vhosts, modules, debug]
  - id: apachectl-start-stop-graceful
    name: apachectl start stop graceful
    source: "https://httpd.apache.org/docs/2.4/programs/apachectl.html"
    match: [apachectl, restart, graceful, configtest, status]
  - id: modules-dso-loading
    name: modules dso loading
    source: "https://httpd.apache.org/docs/2.4/dso.html"
    match: [modules, dso, loadmodule, apxs, ifmodule]
  - id: htaccess-and-allowoverride
    name: htaccess and allowoverride
    source: "https://httpd.apache.org/docs/2.4/howto/htaccess.html"
    match: [htaccess, allowoverride, allowoverridelist, accessfilename, per-directory]
  - id: config-expressions-ap-expr
    name: config expressions ap expr
    source: "https://httpd.apache.org/docs/2.4/expr.html"
    match: [expressions, ap-expr, if, require-expr, variables, functions]
  - id: mod-macro-templates
    name: mod macro templates
    source: "https://httpd.apache.org/docs/2.4/mod/mod_macro.html"
    match: [mod-macro, macro, use, undefmacro, templates]
  - id: environment-variables-setenvif
    name: environment variables setenvif
    source: "https://httpd.apache.org/docs/2.4/env.html"
    match: [environment-variables, setenv, setenvif, browsermatch, passenv, require-env]
  - id: name-based-virtual-hosts
    name: name based virtual hosts
    source: "https://httpd.apache.org/docs/2.4/vhosts/name-based.html"
    match: [virtual-hosts, name-based, servername, serveralias, default-vhost]
  - id: ip-based-virtual-hosts-and-listen
    name: ip based virtual hosts and listen
    source: "https://httpd.apache.org/docs/2.4/vhosts/ip-based.html"
    match: [virtual-hosts, ip-based, listen, multiple-daemons, ports]
  - id: mass-virtual-hosting
    name: mass virtual hosting
    source: "https://httpd.apache.org/docs/2.4/vhosts/mass.html"
    match: [virtual-hosts, mass-hosting, vhost-alias, virtualdocumentroot, usecanonicalname]
  - id: url-mapping-alias-and-userdir
    name: url mapping alias and userdir
    source: "https://httpd.apache.org/docs/2.4/urlmapping.html"
    match: [url-mapping, documentroot, alias, scriptalias, userdir, symlinks]
  - id: redirects-mod-alias
    name: redirects mod alias
    source: "https://httpd.apache.org/docs/2.4/mod/mod_alias.html"
    match: [redirect, redirectmatch, alias, mod-alias, status-codes]
  - id: directory-index-and-fallback-resource
    name: directory index and fallback resource
    source: "https://httpd.apache.org/docs/2.4/mod/mod_dir.html"
    match: [mod-dir, directoryindex, directoryslash, fallbackresource, front-controller]
  - id: directory-listings-mod-autoindex
    name: directory listings mod autoindex
    source: "https://httpd.apache.org/docs/2.4/mod/mod_autoindex.html"
    match: [mod-autoindex, indexes, indexoptions, indexignore, directory-listing]
  - id: content-negotiation-multiviews-typemaps
    name: content negotiation multiviews typemaps
    source: "https://httpd.apache.org/docs/2.4/content-negotiation.html"
    match: [content-negotiation, multiviews, type-map, languagepriority, vary]
  - id: custom-error-documents
    name: custom error documents
    source: "https://httpd.apache.org/docs/2.4/custom-error.html"
    match: [errordocument, error-pages, redirect-variables, multilingual]
  - id: mod-rewrite-rules-and-conditions
    name: mod rewrite rules and conditions
    source: "https://httpd.apache.org/docs/2.4/mod/mod_rewrite.html"
    match: [mod-rewrite, rewriteengine, rewriterule, rewritecond, backreferences]
  - id: rewriterule-flags
    name: rewriterule flags
    source: "https://httpd.apache.org/docs/2.4/rewrite/flags.html"
    match: [mod-rewrite, rewriterule, flags, end, proxy-flag, passthrough]
  - id: rewritemap-lookups
    name: rewritemap lookups
    source: "https://httpd.apache.org/docs/2.4/mod/mod_rewrite.html"
    match: [mod-rewrite, rewritemap, txt-map, dbm, prg-map]
  - id: rewrite-per-directory-and-htaccess
    name: rewrite per directory and htaccess
    source: "https://httpd.apache.org/docs/2.4/mod/mod_rewrite.html"
    match: [mod-rewrite, per-directory, htaccess, rewritebase, rewriteoptions]
  - id: rewrite-recipes-redirect-and-canonical-host
    name: rewrite recipes redirect and canonical host
    source: "https://httpd.apache.org/docs/2.4/rewrite/remapping.html"
    match: [mod-rewrite, canonical-hostname, trailing-slash, redirect, recipes]
  - id: when-not-to-use-mod-rewrite
    name: when not to use mod rewrite
    source: "https://httpd.apache.org/docs/2.4/rewrite/avoid.html"
    match: [mod-rewrite, alternatives, redirect, proxypass, fallbackresource, if]
  - id: reverse-proxy-proxypass
    name: reverse proxy proxypass
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy.html"
    match: [mod-proxy, reverse-proxy, proxypass, proxypassreverse, proxypassmatch]
  - id: forward-proxy-and-security
    name: forward proxy and security
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy.html"
    match: [mod-proxy, forward-proxy, proxyrequests, proxyvia, connect, proxyremote]
  - id: proxy-worker-parameters-and-timeouts
    name: proxy worker parameters and timeouts
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy.html"
    match: [mod-proxy, workers, connection-pool, timeouts, proxy-http, environment-variables]
  - id: proxy-headers-and-preserve-host
    name: proxy headers and preserve host
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy.html"
    match: [mod-proxy, proxypreservehost, x-forwarded-for, proxyaddheaders, host-header]
  - id: proxy-balancer-load-balancing
    name: proxy balancer load balancing
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy_balancer.html"
    match: [mod-proxy-balancer, load-balancing, balancermember, lbmethod, failover]
  - id: balancer-sticky-sessions-and-manager
    name: balancer sticky sessions and manager
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy_balancer.html"
    match: [mod-proxy-balancer, sticky-sessions, stickysession, balancer-manager, route]
  - id: proxy-fcgi-php-fpm
    name: proxy fcgi php fpm
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy_fcgi.html"
    match: [mod-proxy-fcgi, php-fpm, fastcgi, sethandler, pathinfo]
  - id: websocket-proxying
    name: websocket proxying
    source: "https://httpd.apache.org/docs/2.4/mod/mod_proxy_wstunnel.html"
    match: [websocket, mod-proxy-wstunnel, ws, wss, upgrade, proxy]
  - id: ssl-basic-https-setup
    name: ssl basic https setup
    source: "https://httpd.apache.org/docs/2.4/ssl/ssl_howto.html"
    match: [tls, mod-ssl, https, certificates, sslengine, virtualhost]
  - id: ssl-protocols-and-ciphers
    name: ssl protocols and ciphers
    source: "https://httpd.apache.org/docs/2.4/mod/mod_ssl.html"
    match: [tls, mod-ssl, sslprotocol, sslciphersuite, sslhonorcipherorder, ciphers]
  - id: ssl-ocsp-stapling
    name: ssl ocsp stapling
    source: "https://httpd.apache.org/docs/2.4/ssl/ssl_howto.html"
    match: [tls, mod-ssl, ocsp-stapling, sslusestapling, staplingcache, revocation]
  - id: ssl-client-certificate-auth
    name: ssl client certificate auth
    source: "https://httpd.apache.org/docs/2.4/ssl/ssl_howto.html"
    match: [tls, mod-ssl, client-certificates, sslverifyclient, sslrequire, fakebasicauth]
  - id: ssl-session-cache-and-tickets
    name: ssl session cache and tickets
    source: "https://httpd.apache.org/docs/2.4/mod/mod_ssl.html"
    match: [tls, mod-ssl, sslsessioncache, session-tickets, shmcb, forward-secrecy]
  - id: mod-md-acme-certificates
    name: mod md acme certificates
    source: "https://httpd.apache.org/docs/2.4/mod/mod_md.html"
    match: [mod-md, acme, letsencrypt, mdomain, certificate-renewal, tls-alpn]
  - id: mod-http2
    name: mod http2
    source: "https://httpd.apache.org/docs/2.4/mod/mod_http2.html"
    match: [http2, mod-http2, protocols, h2, h2c, early-hints]
  - id: basic-authentication-setup
    name: basic authentication setup
    source: "https://httpd.apache.org/docs/2.4/howto/auth.html"
    match: [authentication, basic-auth, htpasswd, authuserfile, authtype, require]
  - id: authorization-require-containers
    name: authorization require containers
    source: "https://httpd.apache.org/docs/2.4/mod/mod_authz_core.html"
    match: [authorization, require, requireall, requireany, authmerging, mod-authz-core]
  - id: ip-host-and-variable-access-control
    name: ip host and variable access control
    source: "https://httpd.apache.org/docs/2.4/howto/access.html"
    match: [access-control, require-ip, require-host, require-not, mod-authz-host, migration]
  - id: mod-headers
    name: mod headers
    source: "https://httpd.apache.org/docs/2.4/mod/mod_headers.html"
    match: [mod-headers, header, requestheader, response-headers, always, env-condition]
  - id: mod-expires-caching-headers
    name: mod expires caching headers
    source: "https://httpd.apache.org/docs/2.4/mod/mod_expires.html"
    match: [mod-expires, expiresactive, expiresbytype, cache-control, max-age]
  - id: mod-deflate-compression
    name: mod deflate compression
    source: "https://httpd.apache.org/docs/2.4/mod/mod_deflate.html"
    match: [mod-deflate, gzip, compression, setoutputfilter, vary, breach]
  - id: mod-cache-disk-and-socache
    name: mod cache disk and socache
    source: "https://httpd.apache.org/docs/2.4/caching.html"
    match: [mod-cache, cacheenable, cachequickhandler, htcacheclean, socache, mod-file-cache]
  - id: mpm-event
    name: mpm event
    source: "https://httpd.apache.org/docs/2.4/mod/event.html"
    match: [mpm, event, asyncrequestworkerfactor, keepalive, maxrequestworkers, threads]
  - id: mpm-prefork-and-worker
    name: mpm prefork and worker
    source: "https://httpd.apache.org/docs/2.4/mod/prefork.html"
    match: [mpm, prefork, worker, minspareservers, minsparethreads, serverlimit]
  - id: mpm-common-limits
    name: mpm common limits
    source: "https://httpd.apache.org/docs/2.4/mod/mpm_common.html"
    match: [mpm, maxrequestworkers, serverlimit, listenbacklog, maxconnectionsperchild, gracefulshutdowntimeout]
  - id: mod-ratelimit-bandwidth
    name: mod ratelimit bandwidth
    source: "https://httpd.apache.org/docs/2.4/mod/mod_ratelimit.html"
    match: [mod-ratelimit, bandwidth, throttling, rate-limit, output-filter]
  - id: mod-reqtimeout-slow-clients
    name: mod reqtimeout slow clients
    source: "https://httpd.apache.org/docs/2.4/mod/mod_reqtimeout.html"
    match: [mod-reqtimeout, requestreadtimeout, slowloris, timeouts, 408]
  - id: mod-remoteip-behind-proxy
    name: mod remoteip behind proxy
    source: "https://httpd.apache.org/docs/2.4/mod/mod_remoteip.html"
    match: [mod-remoteip, remoteipheader, trusted-proxy, proxy-protocol, client-ip]
  - id: cgi-setup
    name: cgi setup
    source: "https://httpd.apache.org/docs/2.4/howto/cgi.html"
    match: [cgi, scriptalias, execcgi, mod-cgid, suexec, troubleshooting]
  - id: access-logging-logformat
    name: access logging logformat
    source: "https://httpd.apache.org/docs/2.4/mod/mod_log_config.html"
    match: [logging, logformat, customlog, mod-log-config, conditional-logging, access-log]
  - id: error-log-and-loglevel
    name: error log and loglevel
    source: "https://httpd.apache.org/docs/2.4/logs.html"
    match: [logging, errorlog, loglevel, errorlogformat, per-module-logging, debugging]
  - id: log-rotation-and-piped-logs
    name: log rotation and piped logs
    source: "https://httpd.apache.org/docs/2.4/programs/rotatelogs.html"
    match: [logging, rotatelogs, piped-logs, logrotate, graceful, log-rotation]
  - id: mod-status-monitoring
    name: mod status monitoring
    source: "https://httpd.apache.org/docs/2.4/mod/mod_status.html"
    match: [mod-status, server-status, extendedstatus, monitoring, balancer-manager]
  - id: security-hardening-tips
    name: security hardening tips
    source: "https://httpd.apache.org/docs/2.4/misc/security_tips.html"
    match: [security, hardening, dos, file-permissions, allowoverride, ssi]
