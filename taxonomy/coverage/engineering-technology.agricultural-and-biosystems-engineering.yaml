# Canonical coverage spec: Agricultural and Biosystems Engineering (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal to
# one of its `match` keywords. Topics and subtopics come from external structures (degree curricula,
# licensing exam outlines, textbook chapter lists, standards-body subject areas), not from what the
# library already has.
subject: agricultural-and-biosystems-engineering
scope:
  category: engineering-technology
  field: agricultural-and-biosystems-engineering
  products: [farm-machinery-design, irrigation-design, food-process-engineering, grain-storage-handling, controlled-environment-systems, precision-agriculture-systems]
sources:
  - "NCEES Principles and Practice of Engineering (PE) Agricultural and Biological Engineering exam specifications - subject areas for machinery and power systems, soil and water resources, structures and environment, food and bioprocess engineering, information and electrical systems"
  - "ABET program criteria for Agricultural, Biological and similar engineering programs, and typical accredited curricula (ASABE-affiliated departments)"
  - "ASABE Standards, Engineering Practices and Data (asabe.org) - machinery management (EP496 and D497 family), irrigation, structures and environment, food engineering subject areas"
  - "Srivastava, Goering, Rohrbach & Buckmaster, Engineering Principles of Agricultural Machines (ASABE) - chapter list: tillage, planting, sprayers, harvesting, tractor performance, machine management"
  - "Hunt & Wilson, Farm Power and Machinery Management; Kepner, Bainer & Barger, Principles of Farm Machinery"
  - "Keller & Bliesner, Sprinkle and Trickle Irrigation; Walker & Skogerboe, Surface Irrigation; Hoffman et al., Design and Operation of Farm Irrigation Systems (ASABE); USDA NRCS National Engineering Handbook Part 623 Irrigation and Part 650 Engineering Field Handbook (nrcs.usda.gov)"
  - "FAO Irrigation and Drainage Papers 24, 29, 33, 56, 66 and FAO training materials (fao.org)"
  - "Singh & Heldman, Introduction to Food Engineering; Toledo, Fundamentals of Food Process Engineering; Earle, Unit Operations in Food Processing; Fellows, Food Processing Technology"
  - "Codex Alimentarius general principles of food hygiene and HACCP (codexalimentarius.org); EHEDG and 3-A Sanitary Standards hygienic design subject areas; US FDA low-acid canned food and juice HACCP regulatory framework (fda.gov)"
  - "Chakraverty & Singh, Postharvest Technology and Food Process Engineering; Brooker, Bakker-Arkema & Hall, Drying and Storage of Grains and Oilseeds; Sinha & Muir, Grain Storage; Navarro & Noyes, The Mechanics and Physics of Modern Grain Aeration Management"
  - "Albright, Environmental Control for Animals and Plants; ASHRAE Handbook Fundamentals and Applications (agricultural applications); MWPS Midwest Plan Service handbooks (Structures and Environment Handbook); Nelson, Greenhouse Operation and Management; von Zabeltitz, Integrated Greenhouse Systems for Mild Climates"
  - "Pierce, Precision Agriculture (soil and crop sensing, GNSS, variable rate); Zhang, Precision Agriculture Technology for Crop Farming; ISO 11783 (ISOBUS) and ISO 25119 / ISO 18497 functional safety subject areas for agricultural machinery (iso.org)"
