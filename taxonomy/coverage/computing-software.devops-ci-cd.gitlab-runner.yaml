# Coverage spec for GitLab Runner, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: gitlab-runner
scope:
  category: computing-software
  field: devops-ci-cd
  products: [gitlab-runner]
sources:
  - "docs.gitlab.com/runner"
topics:
  - id: runner-install-linux-repository
    name: "Runner install linux repository"
    source: "https://docs.gitlab.com/runner/install/linux-repository/"
    match: [install, linux, apt, rpm, package-repository]
  - id: runner-install-docker-container
    name: "Runner install docker container"
    source: "https://docs.gitlab.com/runner/install/docker/"
    match: [install, docker, container, volume, session-server]
  - id: runner-install-helm-chart
    name: "Runner install helm chart"
    source: "https://docs.gitlab.com/runner/install/kubernetes/"
    match: [install, kubernetes, helm, rbac, values-yaml]
  - id: runner-register-authentication-token
    name: "Runner register authentication token"
    source: "https://docs.gitlab.com/runner/register/"
    match: [register, authentication-token, glrt, non-interactive]
  - id: runner-register-docker-container
    name: "Runner register docker container"
    source: "https://docs.gitlab.com/runner/register/"
    match: [register, docker, container, config-volume]
  - id: runner-config-toml-global
    name: "Runner config toml global"
    source: "https://docs.gitlab.com/runner/configuration/advanced-configuration/"
    match: [config-toml, concurrent, check-interval, shutdown-timeout, listen-address]
  - id: runner-concurrent-limit-request-concurrency
    name: "Runner concurrent limit request concurrency"
    source: "https://docs.gitlab.com/runner/fleet_scaling/"
    match: [concurrency, concurrent, limit, request-concurrency, job-flow]
  - id: runner-runners-section-options
    name: "Runner runners section options"
    source: "https://docs.gitlab.com/runner/configuration/advanced-configuration/"
    match: [runners-section, output-limit, pre-build-script, clone-url, unhealthy-requests]
  - id: runner-executor-selection
    name: "Runner executor selection"
    source: "https://docs.gitlab.com/runner/executors/"
    match: [executors, executor-choice, maintenance-mode, fleeting]
  - id: runner-shell-executor
    name: "Runner shell executor"
    source: "https://docs.gitlab.com/runner/executors/shell/"
    match: [shell-executor, trusted-builds, host-permissions]
  - id: runner-docker-executor-images
    name: "Runner docker executor images"
    source: "https://docs.gitlab.com/runner/executors/docker/"
    match: [docker-executor, allowed-images, image, allowed-services]
  - id: runner-docker-pull-policy
    name: "Runner docker pull policy"
    source: "https://docs.gitlab.com/runner/executors/docker/"
    match: [pull-policy, always, if-not-present, never, allowed-pull-policies]
  - id: runner-docker-privileged-dind
    name: "Runner docker privileged dind"
    source: "https://docs.gitlab.com/runner/executors/docker/"
    match: [privileged, docker-in-docker, services-privileged, allowed-privileged-services, rootless]
  - id: runner-docker-volumes-network
    name: "Runner docker volumes network"
    source: "https://docs.gitlab.com/runner/executors/docker/"
    match: [docker-volumes, volume-keep, network-mode, network-per-build]
  - id: runner-docker-service-aliases
    name: "Runner docker service aliases"
    source: "https://docs.gitlab.com/runner/executors/docker/"
    match: [services, service-alias, healthcheck, healthcheck-tcp-port]
  - id: runner-kubernetes-pod-model
    name: "Runner kubernetes pod model"
    source: "https://docs.gitlab.com/runner/executors/kubernetes/"
    match: [kubernetes-executor, pod, build-container, helper-container, svc]
  - id: runner-kubernetes-overwrite-allowed
    name: "Runner kubernetes overwrite allowed"
    source: "https://docs.gitlab.com/runner/executors/kubernetes/"
    match: [kubernetes, overwrite, regex, namespace-overwrite, node-selector]
  - id: runner-kubernetes-namespace-per-job
    name: "Runner kubernetes namespace per job"
    source: "https://docs.gitlab.com/runner/executors/kubernetes/"
    match: [namespace-per-job, kubernetes, isolation, clusterrole]
  - id: runner-kubernetes-rbac-permissions
    name: "Runner kubernetes rbac permissions"
    source: "https://docs.gitlab.com/runner/executors/kubernetes/"
    match: [kubernetes, rbac, permissions, pods-log, events]
  - id: runner-kubernetes-retry-limits
    name: "Runner kubernetes retry limits"
    source: "https://docs.gitlab.com/runner/executors/kubernetes/"
    match: [retry-limit, retry-limits, kubernetes-api, backoff, resource-availability]
  - id: runner-kubernetes-pause-pods
    name: "Runner kubernetes pause pods"
    source: "https://docs.gitlab.com/runner/executors/kubernetes/"
    match: [pause-pods, kubernetes-autoscaler, idle-capacity, priority-class]
  - id: runner-kubernetes-concurrent-pvc
    name: "Runner kubernetes concurrent pvc"
    source: "https://docs.gitlab.com/runner/executors/kubernetes/"
    match: [kubernetes, pvc, concurrent-id, persistent-volume, build-dir]
  - id: runner-docker-autoscaler-executor
    name: "Runner docker autoscaler executor"
    source: "https://docs.gitlab.com/runner/executors/docker_autoscaler/"
    match: [docker-autoscaler, fleeting, taskscaler, autoscaling, executor]
  - id: runner-autoscaler-capacity-settings
    name: "Runner autoscaler capacity settings"
    source: "https://docs.gitlab.com/runner/configuration/advanced-configuration/"
    match: [autoscaler, capacity-per-instance, max-use-count, max-instances, instance-ready-command]
  - id: runner-autoscaler-connector
    name: "Runner autoscaler connector"
    source: "https://docs.gitlab.com/runner/configuration/advanced-configuration/"
    match: [connector-config, autoscaler, ssh, keepalive, use-external-addr]
  - id: runner-autoscaler-policy
    name: "Runner autoscaler policy"
    source: "https://docs.gitlab.com/runner/configuration/advanced-configuration/"
    match: [autoscaler-policy, idle-count, idle-time, scale-factor, periods]
  - id: runner-autoscaler-state-storage
    name: "Runner autoscaler state storage"
    source: "https://docs.gitlab.com/runner/configuration/advanced-configuration/"
    match: [state-storage, autoscaler, beta, fleeting]
  - id: runner-instance-executor
    name: "Runner instance executor"
    source: "https://docs.gitlab.com/runner/executors/instance/"
    match: [instance-executor, fleeting, nesting, native-steps, maxsessions]
  - id: runner-cache-config
    name: "Runner cache config"
    source: "https://docs.gitlab.com/runner/configuration/advanced-configuration/"
    match: [cache, runners-cache, s3, gcs, azure]
  - id: runner-cache-speed-up
    name: "Runner cache speed up"
    source: "https://docs.gitlab.com/runner/configuration/speed_up_job_execution/"
    match: [speed-up, registry-mirror, dependency-proxy, docker-hub, pull-through-cache]
  - id: runner-feature-flags
    name: "Runner feature flags"
    source: "https://docs.gitlab.com/runner/configuration/feature-flags/"
    match: [feature-flags, ff, environment-variable, deprecation]
  - id: runner-signals-and-shutdown
    name: "Runner signals and shutdown"
    source: "https://docs.gitlab.com/runner/commands/"
    match: [signals, sigquit, sighup, graceful-shutdown, systemd]
  - id: runner-register-verify-unregister
    name: "Runner register verify unregister"
    source: "https://docs.gitlab.com/runner/commands/"
    match: [commands, verify, unregister, reset-token, lint]
  - id: runner-systemd-env-vars
    name: "Runner systemd env vars"
    source: "https://docs.gitlab.com/runner/configuration/init/"
    match: [systemd, init, environment-variables, service, upstart]
  - id: runner-behind-proxy
    name: "Runner behind proxy"
    source: "https://docs.gitlab.com/runner/configuration/proxy/"
    match: [proxy, http-proxy, https-proxy, cntlm, systemd-drop-in]
  - id: runner-tls-self-signed
    name: "Runner tls self signed"
    source: "https://docs.gitlab.com/runner/configuration/tls-self-signed/"
    match: [tls, self-signed, ca-certificate, tls-ca-file, x509]
  - id: runner-security-executors
    name: "Runner security executors"
    source: "https://docs.gitlab.com/runner/security/"
    match: [security, executors, shell-executor, privileged, docker-security]
  - id: runner-security-pull-policy-credentials
    name: "Runner security pull policy credentials"
    source: "https://docs.gitlab.com/runner/security/"
    match: [security, pull-policy, if-not-present, credential-helpers, docker-auth-config]
  - id: runner-security-hardening
    name: "Runner security hardening"
    source: "https://docs.gitlab.com/runner/security/"
    match: [security, network-segmentation, git-strategy, host-hardening, ephemeral]
  - id: runner-monitoring-metrics
    name: "Runner monitoring metrics"
    source: "https://docs.gitlab.com/runner/monitoring/"
    match: [monitoring, prometheus, metrics, listen-address, pprof]
  - id: runner-fleet-sizing
    name: "Runner fleet sizing"
    source: "https://docs.gitlab.com/runner/fleet_scaling/"
    match: [fleet, capacity-planning, shared-runners, instance-runners, workload]
  - id: runner-custom-executor
    name: "Runner custom executor"
    source: "https://docs.gitlab.com/runner/executors/custom/"
    match: [custom-executor, config-exec, prepare-exec, run-exec, cleanup-exec]
  - id: runner-ssh-executor
    name: "Runner ssh executor"
    source: "https://docs.gitlab.com/runner/executors/ssh/"
    match: [ssh-executor, remote-host, identity-file, maintenance-mode]
  - id: runner-shells
    name: "Runner shells"
    source: "https://docs.gitlab.com/runner/shells/"
    match: [shells, bash, sh, powershell, pwsh]
  - id: runner-gpus
    name: "Runner gpus"
    source: "https://docs.gitlab.com/runner/configuration/gpus/"
    match: [gpus, docker-executor, nvidia, service-gpus]
