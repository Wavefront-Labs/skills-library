# Coverage spec: knative. Topics from the official docs in sources.
subject: knative
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [knative]
sources:
  - "https://knative.dev/docs/"
topics:
  - id: apiserversource
    name: "ApiServerSource"
    source: "https://knative.dev/docs/eventing/sources/apiserversource/"
    match: [apiserversource, kubernetes-events, resources-parameter]
  - id: autoscaler-types
    name: "KPA vs HPA autoscaler"
    source: "https://knative.dev/docs/serving/autoscaling/autoscaler-types/"
    match: [autoscaler-class, kpa, hpa]
  - id: autoscaling-metrics-targets
    name: "Autoscaling metric and target"
    source: "https://knative.dev/docs/serving/autoscaling/autoscaling-metrics/"
    match: [autoscaling-metric, autoscaling-target, rps-target]
  - id: concurrency-limits
    name: "Concurrency soft and hard limits"
    source: "https://knative.dev/docs/serving/autoscaling/concurrency/"
    match: [concurrency, container-concurrency, soft-limit]
  - id: control-plane-ha
    name: "High availability of Serving components"
    source: "https://knative.dev/docs/serving/config-ha/"
    match: [high-availability, leader-election, disable-ha]
  - id: convert-deployment
    name: "Convert a Deployment to a Service"
    source: "https://knative.dev/docs/serving/convert-deployment-to-knative-service/"
    match: [convert-deployment, workload-fit, stateless]
  - id: creating-services
    name: "Creating a Knative Service"
    source: "https://knative.dev/docs/serving/services/creating-services/"
    match: [kn-service-create, knative-service, revision]
  - id: cross-namespace-event-links
    name: "Cross-namespace event links"
    source: "https://knative.dev/docs/eventing/features/cross-namespace-event-links/"
    match: [cross-namespace-event-links, knsubscribe, rbac]
  - id: custom-domains-domainmapping
    name: "Domain names and DomainMapping"
    source: "https://knative.dev/docs/serving/using-a-custom-domain/"
    match: [domainmapping, clusterdomainclaim, config-domain]
  - id: debugging-applications
    name: "Debugging application issues"
    source: "https://knative.dev/docs/serving/troubleshooting/debugging-application-issues/"
    match: [debugging, route-status, revision-status]
  - id: delivery-timeout-retryafter
    name: "Delivery timeout and Retry-After"
    source: "https://knative.dev/docs/eventing/features/delivery-timeout/"
    match: [delivery-timeout, retryaftermax, retry-after]
  - id: encryption-overview
    name: "Serving TLS encryption overview"
    source: "https://knative.dev/docs/serving/encryption/encryption-overview/"
    match: [encryption, tls, cert-manager]
  - id: event-delivery-dead-letter
    name: "Delivery retries and dead letter sink"
    source: "https://knative.dev/docs/eventing/event-delivery/"
    match: [delivery, deadlettersink, backoffpolicy]
  - id: eventing-authorization
    name: "Eventing authorization with EventPolicy"
    source: "https://knative.dev/docs/eventing/features/authorization/"
    match: [eventpolicy, authorization, defaultauthorizationmode]
  - id: eventtype-auto-creation
    name: "EventType auto creation"
    source: "https://knative.dev/docs/eventing/features/eventtype-auto-creation/"
    match: [eventtype, eventtype-auto-create, config-features]
  - id: external-domain-tls
    name: "External domain TLS and wildcard certs"
    source: "https://knative.dev/docs/serving/encryption/external-domain-tls/"
    match: [external-domain-tls, wildcard-certificate, namespace-wildcard-cert-selector]
  - id: feature-flags
    name: "Feature and extension flags"
    source: "https://knative.dev/docs/serving/configuration/feature-flags/"
    match: [feature-flags, config-features, extension-flags]
  - id: func-create-build-run
    name: "Create, build and run a function"
    source: "https://knative.dev/docs/functions/creating-functions/"
    match: [func-create, func-build, func-run]
  - id: func-deploy
    name: "Deploy a function"
    source: "https://knative.dev/docs/functions/deploying-functions/"
    match: [func-deploy, raw-deployer, registry]
  - id: func-install
    name: "Install func and kn func"
    source: "https://knative.dev/docs/functions/install-func/"
    match: [func-cli, kn-func, install-func]
  - id: func-language-packs
    name: "Function language packs"
    source: "https://knative.dev/docs/functions/language-packs/"
    match: [language-packs, func-repository, templates]
  - id: func-remote-build
    name: "On-cluster function builds"
    source: "https://knative.dev/docs/functions/building-functions/"
    match: [on-cluster-build, deploy-remote, tekton]
  - id: func-subscribe
    name: "Subscribe functions to CloudEvents"
    source: "https://knative.dev/docs/functions/subscribing-functions/"
    match: [func-subscribe, function-triggers, filter-flag]
  - id: gradual-rollout
    name: "Gradual rollout duration"
    source: "https://knative.dev/docs/serving/rolling-out-latest-revision/"
    match: [rollout-duration, gradual-rollout, latest-revision]
  - id: http-protocol-redirect
    name: "HTTP to HTTPS redirect"
    source: "https://knative.dev/docs/serving/services/http-protocol/"
    match: [http-protocol, https-redirect, redirected]
  - id: ingress-and-certificate-class
    name: "Ingress class and certificate class"
    source: "https://knative.dev/docs/serving/services/ingress-class/"
    match: [ingress-class, certificate-class, networking-knative-dev-ingress-class]
  - id: internal-tls-and-trust
    name: "Cluster-local and system-internal TLS"
    source: "https://knative.dev/docs/serving/encryption/system-internal-tls/"
    match: [cluster-local-domain-tls, system-internal-tls, ca-bundle]
  - id: job-sink
    name: "JobSink for long-running jobs"
    source: "https://knative.dev/docs/eventing/sinks/job-sink/"
    match: [jobsink, long-running-jobs, batch-job]
  - id: kafka-broker
    name: "Apache Kafka Broker"
    source: "https://knative.dev/docs/eventing/brokers/broker-types/kafka-broker/"
    match: [kafka-broker, kafka, ordered-delivery]
  - id: kafka-source
    name: "KafkaSource"
    source: "https://knative.dev/docs/eventing/sources/kafka-source/"
    match: [kafkasource, kafka-topic, strimzi]
  - id: kpa-panic-mode
    name: "KPA stable and panic windows"
    source: "https://knative.dev/docs/serving/autoscaling/kpa-specific/"
    match: [panic-mode, stable-window, panic-window-percentage]
  - id: parallel-flow
    name: "Parallel flow"
    source: "https://knative.dev/docs/eventing/flows/parallel/"
    match: [parallel, branches, filter-subscriber]
  - id: ping-source
    name: "PingSource"
    source: "https://knative.dev/docs/eventing/sources/ping-source/"
    match: [pingsource, cron-schedule, ceoverrides]
  - id: private-registry-pull-secrets
    name: "Private registry image pull secrets"
    source: "https://knative.dev/docs/serving/deploying-from-private-registry/"
    match: [imagepullsecrets, private-registry, docker-registry-secret]
  - id: private-services
    name: "Cluster-local (private) Services"
    source: "https://knative.dev/docs/serving/services/private-services/"
    match: [private-services, cluster-local, visibility]
  - id: progress-deadline
    name: "Progress deadline"
    source: "https://knative.dev/docs/serving/configuration/deployment/"
    match: [progress-deadline, deployment-failed, slow-image-pull]
  - id: readiness-probes
    name: "Probing in Knative"
    source: "https://knative.dev/docs/serving/services/configure-probing/"
    match: [probing, readiness-probe, liveness-probe]
  - id: request-flow
    name: "HTTP request flow and cold start"
    source: "https://knative.dev/docs/serving/request-flow/"
    match: [request-flow, cold-start, scale-from-zero]
  - id: request-logging
    name: "Request logging"
    source: "https://knative.dev/docs/serving/observability/logging/request-logging/"
    match: [request-logging, enable-request-log, request-log-template]
  - id: requests-limits-queue-proxy
    name: "Resource requests and limits"
    source: "https://knative.dev/docs/serving/services/configure-requests-limits-services/"
    match: [resources, requests-limits, queue-proxy-resources]
  - id: revision-defaults-config
    name: "Revision defaults (config-defaults)"
    source: "https://knative.dev/docs/serving/configuration/config-defaults/"
    match: [config-defaults, revision-timeout-seconds, timeout-seconds]
  - id: revision-garbage-collection
    name: "Revision garbage collection"
    source: "https://knative.dev/docs/serving/revisions/revision-admin-config-options/"
    match: [garbage-collection, config-gc, max-non-active-revisions]
  - id: scale-bounds
    name: "Scale bounds and initial scale"
    source: "https://knative.dev/docs/serving/autoscaling/scale-bounds/"
    match: [scale-bounds, min-scale, max-scale]
  - id: scale-to-zero
    name: "Scale to zero settings"
    source: "https://knative.dev/docs/serving/autoscaling/scale-to-zero/"
    match: [scale-to-zero, enable-scale-to-zero, scale-to-zero-grace-period]
  - id: sequence-flow
    name: "Sequence flow"
    source: "https://knative.dev/docs/eventing/flows/sequence/"
    match: [sequence, flows, channeltemplate]
  - id: server-side-dry-run
    name: "Server-side dry run"
    source: "https://knative.dev/docs/serving/dryrun/"
    match: [dry-run, server-side-dry-run, admission-webhook]
  - id: serving-architecture
    name: "Knative Serving architecture"
    source: "https://knative.dev/docs/serving/architecture/"
    match: [serving-architecture, activator, queue-proxy]
  - id: serving-metrics
    name: "Serving metrics (OpenTelemetry)"
    source: "https://knative.dev/docs/serving/observability/metrics/serving-metrics/"
    match: [serving-metrics, opentelemetry, queue-depth]
  - id: sinkbinding
    name: "SinkBinding"
    source: "https://knative.dev/docs/eventing/custom-event-source/sinkbinding/"
    match: [sinkbinding, k-sink, k-ce-overrides]
  - id: sugar-controller
    name: "Sugar Controller"
    source: "https://knative.dev/docs/eventing/configuration/sugar-configuration/"
    match: [sugar-controller, config-sugar, namespace-selector]
  - id: tag-resolution-digests
    name: "Tag to digest resolution"
    source: "https://knative.dev/docs/serving/tag-resolution/"
    match: [tag-resolution, image-digest, self-signed-certificate]
  - id: target-burst-capacity
    name: "Target burst capacity and activator capacity"
    source: "https://knative.dev/docs/serving/load-balancing/target-burst-capacity/"
    match: [target-burst-capacity, activator-capacity, burst-capacity]
  - id: traffic-management
    name: "Traffic splitting and tags"
    source: "https://knative.dev/docs/serving/traffic-management/"
    match: [traffic-management, traffic-split, revision-tag]
  - id: transport-encryption
    name: "Eventing transport encryption"
    source: "https://knative.dev/docs/eventing/features/transport-encryption/"
    match: [transport-encryption, cert-manager, clusterissuer]
  - id: trigger-filters
    name: "Trigger filters"
    source: "https://knative.dev/docs/eventing/triggers/"
    match: [trigger, filters, exact]
  - id: volumes-persistent
    name: "Volumes and PersistentVolumeClaims"
    source: "https://knative.dev/docs/serving/services/storage/"
    match: [volumes, persistent-volume-claim, podspec-persistent-volume-claim]
  - id: webhook-namespace-exclusion
    name: "Excluding namespaces from the webhook"
    source: "https://knative.dev/docs/serving/webhook-customizations/"
    match: [webhook, webhooks-knative-dev-exclude, namespace-exclusion]
