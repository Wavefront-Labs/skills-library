# Coverage spec for istio: topics from the official documentation table of contents.
subject: istio
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [istio]
sources:
  - "https://istio.io/latest/docs/ambient/getting-started/"
  - "https://istio.io/latest/docs/ops/common-problems/injection/"
  - "https://istio.io/latest/docs/ops/diagnostic-tools/istioctl-analyze/"
  - "https://istio.io/latest/docs/reference/config/networking/destination-rule/"
  - "https://istio.io/latest/docs/reference/config/networking/sidecar/"
  - "https://istio.io/latest/docs/reference/config/networking/virtual-service/"
  - "https://istio.io/latest/docs/setup/additional-setup/config-profiles/"
  - "https://istio.io/latest/docs/setup/install/istioctl/"
  - "https://istio.io/latest/docs/setup/upgrade/canary/"
  - "https://istio.io/latest/docs/tasks/observability/telemetry/"
  - "https://istio.io/latest/docs/tasks/security/authentication/authn-policy/"
  - "https://istio.io/latest/docs/tasks/security/authorization/authz-http/"
  - "https://istio.io/latest/docs/tasks/traffic-management/circuit-breaking/"
  - "https://istio.io/latest/docs/tasks/traffic-management/egress/egress-control/"
  - "https://istio.io/latest/docs/tasks/traffic-management/fault-injection/"
  - "https://istio.io/latest/docs/tasks/traffic-management/ingress/ingress-control/"
  - "https://istio.io/latest/docs/tasks/traffic-management/mirroring/"
  - "https://istio.io/latest/docs/tasks/traffic-management/request-routing/"
  - "https://istio.io/latest/docs/tasks/traffic-management/traffic-shifting/"
topics:
  - id: istioctl-install-default-profile
    name: Install Istio with istioctl
    source: istio documentation
    match: [istioctl-install]
  - id: istio-configuration-profiles
    name: Choose a configuration profile
    source: istio documentation
    match: [istio-profiles]
  - id: istio-minimal-profile-with-separate-gateways
    name: Minimal profile with separately installed gateways
    source: istio documentation
    match: [minimal-profile]
  - id: istio-ambient-mode-install
    name: Install ambient mode
    source: istio documentation
    match: [ambient-mode]
  - id: istio-ambient-waypoint-proxy
    name: Add a waypoint proxy for L7 policy in ambient mode
    source: istio documentation
    match: [waypoint-proxy]
  - id: istio-sidecar-injection-labels
    name: Enable automatic sidecar injection
    source: istio documentation
    match: [sidecar-injection]
  - id: istio-injection-troubleshooting
    name: Troubleshoot sidecar injection failures
    source: istio documentation
    match: [injection-troubleshooting]
  - id: istio-virtualservice-routing
    name: Write VirtualService request routing
    source: istio documentation
    match: [virtualservice-routing]
  - id: istio-destinationrule-subsets
    name: Define DestinationRule subsets
    source: istio documentation
    match: [destinationrule-subsets]
  - id: istio-traffic-shifting-canary
    name: Shift traffic by weight between versions
    source: istio documentation
    match: [traffic-shifting]
  - id: istio-fault-injection
    name: Inject delays and aborts for resilience testing
    source: istio documentation
    match: [fault-injection]
  - id: istio-timeouts-and-retries
    name: Set request timeouts and retries
    source: istio documentation
    match: [timeouts-retries]
  - id: istio-circuit-breaking
    name: Configure circuit breaking
    source: istio documentation
    match: [circuit-breaking]
  - id: istio-outlier-detection
    name: Eject unhealthy endpoints with outlier detection
    source: istio documentation
    match: [outlier-detection]
  - id: istio-traffic-mirroring
    name: Mirror traffic to a shadow version
    source: istio documentation
    match: [traffic-mirroring]
  - id: istio-ingress-gateway-config
    name: Expose a service through an Istio Gateway
    source: istio documentation
    match: [ingress-gateway]
  - id: istio-gateway-tls-termination
    name: Terminate TLS at the ingress gateway
    source: istio documentation
    match: [gateway-tls]
  - id: istio-gateway-api-httproute
    name: Use the Kubernetes Gateway API with Istio
    source: istio documentation
    match: [gateway-api]
  - id: istio-serviceentry-external-services
    name: Register external services with ServiceEntry
    source: istio documentation
    match: [serviceentry]
  - id: istio-outbound-traffic-policy
    name: Restrict egress with REGISTRY_ONLY
    source: istio documentation
    match: [outbound-traffic-policy]
  - id: istio-sidecar-resource-scoping
    name: Limit config scope with the Sidecar resource
    source: istio documentation
    match: [sidecar-resource]
  - id: istio-peerauthentication-strict-mtls
    name: Enforce mTLS with PeerAuthentication
    source: istio documentation
    match: [peerauthentication]
  - id: istio-requestauthentication-jwt
    name: Validate end-user JWTs with RequestAuthentication
    source: istio documentation
    match: [requestauthentication]
  - id: istio-authorizationpolicy-allow-deny
    name: Write AuthorizationPolicy allow and deny rules
    source: istio documentation
    match: [authorizationpolicy]
  - id: istio-authorization-dry-run-audit
    name: Test authorization policies with dry-run
    source: istio documentation
    match: [authz-dry-run]
  - id: istio-ext-authz-custom-action
    name: Delegate authorization to an external service
    source: istio documentation
    match: [ext-authz]
  - id: istio-telemetry-api
    name: Configure the Telemetry API
    source: istio documentation
    match: [telemetry-api]
  - id: istio-access-logging
    name: Enable and filter Envoy access logs
    source: istio documentation
    match: [access-logging]
  - id: istio-metrics-prometheus
    name: Scrape and customise Istio metrics
    source: istio documentation
    match: [istio-metrics]
  - id: istio-distributed-tracing
    name: Make distributed tracing work end to end
    source: istio documentation
    match: [distributed-tracing]
  - id: istio-istioctl-analyze
    name: Validate configuration with istioctl analyze
    source: istio documentation
    match: [istioctl-analyze]
  - id: istio-proxy-status-and-config
    name: Read proxy sync state with istioctl proxy-status
    source: istio documentation
    match: [proxy-status]
  - id: istio-envoy-admin-debugging
    name: Debug with the Envoy admin interface and log levels
    source: istio documentation
    match: [envoy-admin]
  - id: istio-canary-control-plane-upgrade
    name: Upgrade the control plane with revisions
    source: istio documentation
    match: [canary-upgrade]
  - id: istio-revision-tags
    name: Use revision tags for stable injection labels
    source: istio documentation
    match: [revision-tags]
  - id: istio-helm-install
    name: Install Istio with Helm charts
    source: istio documentation
    match: [istio-helm]
  - id: istio-uninstall-and-rollback
    name: Uninstall Istio or roll back a revision
    source: istio documentation
    match: [istio-uninstall]
  - id: istio-cni-plugin
    name: Use the Istio CNI node agent instead of init containers
    source: istio documentation
    match: [istio-cni]
  - id: istio-multicluster-primary-remote
    name: Connect clusters in a multi-cluster mesh
    source: istio documentation
    match: [multicluster]
  - id: istio-plugin-ca-certificates
    name: Plug in your own CA certificates
    source: istio documentation
    match: [plugin-ca]
  - id: istio-workload-entry-vms
    name: Add virtual machines with WorkloadEntry
    source: istio documentation
    match: [workloadentry]
  - id: istio-locality-load-balancing
    name: Configure locality-aware load balancing
    source: istio documentation
    match: [locality-load-balancing]
  - id: istio-load-balancing-algorithms
    name: Select a load balancing algorithm and session affinity
    source: istio documentation
    match: [istio-load-balancing]
  - id: istio-http-header-manipulation
    name: Add, remove and rewrite headers and URIs
    source: istio documentation
    match: [header-manipulation]
  - id: istio-envoyfilter-careful-use
    name: Use EnvoyFilter sparingly and safely
    source: istio documentation
    match: [envoyfilter]
  - id: istio-istiod-resource-tuning
    name: Size and tune istiod
    source: istio documentation
    match: [istiod-tuning]
  - id: istio-workload-certificates-sds
    name: Inspect workload identity and certificate rotation
    source: istio documentation
    match: [workload-certificates]
  - id: istio-authn-troubleshooting-503
    name: Diagnose 503 errors in the mesh
    source: istio documentation
    match: [istio-503-troubleshooting]
  - id: istio-protocol-selection-port-names
    name: Name Service ports so Istio picks the right protocol
    source: istio documentation
    match: [protocol-selection]
