# Coverage spec for Zeek, from the official documentation (https://docs.zeek.org/en/current/).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: zeek
scope:
  category: computing-software
  field: cybersecurity-defensive
  products: [zeek]
sources:
  - "Zeek documentation (https://docs.zeek.org/en/current/)"
topics:
  - id: af-packet-load-balancing
    name: "AF_PACKET load balancing"
    source: "https://docs.zeek.org/en/current/cluster-setup.html"
    match: [af-packet, fanout-id, ethtool-offload, lb-method]
  - id: analyzer-log-dpd
    name: "analyzer.log and dynamic protocol detection"
    source: "https://docs.zeek.org/en/current/reference/logs/analyzer.html"
    match: [analyzer-log, dynamic-protocol-detection, dpd, protocol-violation]
  - id: broker-framework
    name: "Broker framework"
    source: "https://docs.zeek.org/en/current/frameworks/broker.html"
    match: [broker, cluster-topology, data-store, hrw-partitioning]
  - id: build-zeek-from-source
    name: "Build Zeek from source"
    source: "https://docs.zeek.org/en/current/building-from-source.html"
    match: [build-from-source, configure, cross-compile]
  - id: capture-loss-and-reporter-logs
    name: "capture_loss.log and reporter.log"
    source: "https://docs.zeek.org/en/current/reference/logs/capture-loss-and-reporter.html"
    match: [capture-loss, reporter-log, sensor-health, packet-loss]
  - id: cluster-framework-scaling
    name: "Cluster framework scaling"
    source: "https://docs.zeek.org/en/current/frameworks/cluster.html"
    match: [cluster-framework, symmetric-hashing, cluster-in-a-box, shunting]
  - id: cluster-node-roles
    name: "Cluster node roles"
    source: "https://docs.zeek.org/en/current/cluster-setup.html"
    match: [cluster-architecture, manager, logger, proxy, worker]
  - id: config-framework-options
    name: "Config framework options"
    source: "https://docs.zeek.org/en/current/frameworks/configuration.html"
    match: [config-framework, option-keyword, config-files, config-log]
  - id: conn-log-analysis
    name: "conn.log analysis"
    source: "https://docs.zeek.org/en/current/reference/logs/conn.html"
    match: [conn-log, conn-state, history-field, ip-proto]
  - id: container-expiry-attributes
    name: "Container expiry attributes"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/attributes.html"
    match: [table-expiry, create-expire, expire-func, ordered-containers]
  - id: custom-log-stream
    name: "Custom log stream"
    source: "https://docs.zeek.org/en/current/frameworks/logging.html"
    match: [log-stream, create-stream, log-write, extend-info-record]
  - id: dns-log-analysis
    name: "dns.log analysis"
    source: "https://docs.zeek.org/en/current/reference/logs/dns.html"
    match: [dns-log, dns-queries, auth-addl, dns-tunnelling]
  - id: event-groups
    name: "Event groups"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/event-semantics.html"
    match: [event-groups, enable-event-group, module-events, runtime-toggle]
  - id: event-tracing
    name: "Event tracing"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/event-semantics.html"
    match: [event-trace, replay, pcap-anonymisation, base-time]
  - id: file-analysis-lifecycle
    name: "File analysis lifecycle"
    source: "https://docs.zeek.org/en/current/frameworks/file-analysis.html"
    match: [file-analysis, file-events, mime-sniffing, fa-file]
  - id: file-analyzers-hash-extract
    name: "File analyzers: hash, extract, stream"
    source: "https://docs.zeek.org/en/current/frameworks/file-analysis.html"
    match: [file-analyzers, file-extraction, file-hash, file-data-event]
  - id: functions-hooks-events
    name: "Functions, hooks and events"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/statements.html"
    match: [callables, event-handler, hook, schedule]
  - id: http-and-files-logs
    name: "http.log and files.log"
    source: "https://docs.zeek.org/en/current/reference/logs/http.html"
    match: [http-log, files-log, fuid-pivot, file-extraction]
  - id: input-framework-tables
    name: "Input framework tables"
    source: "https://docs.zeek.org/en/current/frameworks/input.html"
    match: [input-framework, add-table, end-of-data, idx-val-records]
  - id: input-reread-stream-modes
    name: "Input reread and stream modes"
    source: "https://docs.zeek.org/en/current/frameworks/input.html"
    match: [input-reread, stream-mode, predicate-filter, force-update]
  - id: install-zeek
    name: "Install Zeek"
    source: "https://docs.zeek.org/en/current/install.html"
    match: [install, docker-image, binary-packages]
  - id: intel-framework-loading
    name: "Intel framework loading"
    source: "https://docs.zeek.org/en/current/frameworks/intel.html"
    match: [intel-framework, intel-read-files, intel-seen, intel-log]
  - id: live-capture-checksums
    name: "Live capture checksums"
    source: "https://docs.zeek.org/en/current/quickstart.html"
    match: [live-capture, checksum-offloading, interface-capture]
  - id: log-filters-and-paths
    name: "Log filters and paths"
    source: "https://docs.zeek.org/en/current/frameworks/logging.html"
    match: [log-filter, add-filter, path-func, default-logdir]
  - id: log-policy-hooks
    name: "Log policy hooks"
    source: "https://docs.zeek.org/en/current/frameworks/logging.html"
    match: [log-policy, log-stream-policy, veto-record, log-delay]
  - id: log-rotation-and-postprocessing
    name: "Log rotation and postprocessing"
    source: "https://docs.zeek.org/en/current/frameworks/logging.html"
    match: [log-rotation, rotation-interval, postprocessor, zeek-archiver]
  - id: log-writers-and-extensions
    name: "Log writers and extensions"
    source: "https://docs.zeek.org/en/current/frameworks/logging.html"
    match: [log-writer, ascii-writer, extension-fields, print-to-log]
  - id: management-framework
    name: "Management framework"
    source: "https://docs.zeek.org/en/current/frameworks/management.html"
    match: [management-framework, zeek-client, controller-agent, deploy-config]
  - id: memory-and-cpu-profiling
    name: "Memory and CPU profiling"
    source: "https://docs.zeek.org/en/current/advanced/troubleshooting.html"
    match: [troubleshooting, jemalloc, perf-flamegraph, state-growth]
  - id: netcontrol-active-response
    name: "NetControl active response"
    source: "https://docs.zeek.org/en/current/frameworks/netcontrol.html"
    match: [netcontrol, drop-address, shunt-flow, catch-and-release]
  - id: netcontrol-rules-and-plugins
    name: "NetControl rules and plugins"
    source: "https://docs.zeek.org/en/current/frameworks/netcontrol.html"
    match: [netcontrol-rule, netcontrol-plugins, openflow, rule-target]
  - id: netmap-and-pf-ring-capture
    name: "Netmap and PF_RING capture"
    source: "https://docs.zeek.org/en/current/cluster-setup.html"
    match: [netmap, pf-ring, flow-balancing, packet-source]
  - id: notice-framework-policy
    name: "Notice framework policy"
    source: "https://docs.zeek.org/en/current/frameworks/notice.html"
    match: [notice-framework, notice-policy, notice-actions, notice-suppression]
  - id: option-change-handlers
    name: "Option change handlers"
    source: "https://docs.zeek.org/en/current/frameworks/configuration.html"
    match: [option-change-handler, set-change-handler, config-set-value]
  - id: packet-analysis-framework
    name: "Packet analysis framework"
    source: "https://docs.zeek.org/en/current/frameworks/packet-analysis.html"
    match: [packet-analysis, packet-analyzer, register-packet-analyzer, link-layer]
  - id: quickstart-pcap-analysis
    name: "Quickstart pcap analysis"
    source: "https://docs.zeek.org/en/current/quickstart.html"
    match: [pcap-analysis, read-pcap, uid-pivot, json-logs]
  - id: runtime-metrics-and-stats-log
    name: "Runtime metrics and stats.log"
    source: "https://docs.zeek.org/en/current/advanced/troubleshooting.html"
    match: [metrics, prometheus-endpoint, stats-log, report-interval]
  - id: script-attributes-core
    name: "Core script attributes"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/attributes.html"
    match: [attributes, redef, default-attribute, optional-fields]
  - id: script-containers
    name: "Tables, sets and vectors"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/types.html"
    match: [table-type, set-type, vector-type, container-types]
  - id: script-declarations-and-redef
    name: "Declarations and redef"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/statements.html"
    match: [redef, module-export, option-declaration, extend-record]
  - id: script-load-and-conditional-directives
    name: "Script load and conditional directives"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/directives.html"
    match: [directives, at-load, at-if, zeekpath]
  - id: script-network-types
    name: "Network and numeric types"
    source: "https://docs.zeek.org/en/current/reference/zeekscript/types.html"
    match: [addr-type, subnet-type, port-type, count-type]
  - id: signature-actions-and-file-magic
    name: "Signature actions and file magic"
    source: "https://docs.zeek.org/en/current/frameworks/signatures.html"
    match: [signature-actions, custom-signature-event, file-magic, file-mime]
  - id: signature-conditions
    name: "Signature conditions"
    source: "https://docs.zeek.org/en/current/frameworks/signatures.html"
    match: [signatures, signature-conditions, payload-regex, load-sigs]
  - id: spicy-protocol-analyzer-quickstart
    name: "Spicy analyzer quickstart"
    source: "https://docs.zeek.org/en/current/advanced/devel/spicy/getting-started.html"
    match: [spicy, evt-file, spicyz, protocol-analyzer]
  - id: ssh-log-analysis
    name: "ssh.log analysis"
    source: "https://docs.zeek.org/en/current/reference/logs/ssh.html"
    match: [ssh-log, lateral-movement, hassh, inbound-outbound]
  - id: ssl-tls-log-analysis
    name: "ssl.log TLS analysis"
    source: "https://docs.zeek.org/en/current/reference/logs/ssl.html"
    match: [ssl-log, tls-versions, next-protocol, alpn]
  - id: storage-framework
    name: "Storage framework"
    source: "https://docs.zeek.org/en/current/frameworks/storage.html"
    match: [storage-framework, storage-backend, sqlite-backend, key-value-store]
  - id: sumstats-framework
    name: "Sumstats framework"
    source: "https://docs.zeek.org/en/current/frameworks/sumstats.html"
    match: [sumstats, observations, reducers, epoch-threshold]
  - id: supervisor-framework
    name: "Supervisor framework"
    source: "https://docs.zeek.org/en/current/frameworks/supervisor.html"
    match: [supervisor, supervisor-mode, node-config, process-supervision]
  - id: systemd-zeek-conf-deployment
    name: "systemd zeek.conf deployment"
    source: "https://docs.zeek.org/en/current/advanced/deployment/systemd.html"
    match: [systemd, zeek-conf, systemd-generator, zeek-target]
  - id: telemetry-framework
    name: "Telemetry framework"
    source: "https://docs.zeek.org/en/current/frameworks/telemetry.html"
    match: [telemetry, metrics-port, prometheus-sd, telemetry-log]
  - id: tls-decryption
    name: "TLS decryption"
    source: "https://docs.zeek.org/en/current/frameworks/tls-decryption.html"
    match: [tls-decryption, sslkeylogfile, tls-keylog, pre-master-secret]
  - id: websocket-api
    name: "WebSocket API"
    source: "https://docs.zeek.org/en/current/advanced/devel/websocket-api.html"
    match: [websocket, external-clients, listen-websocket, use-websocket]
  - id: weird-and-notice-logs
    name: "weird.log and notice.log"
    source: "https://docs.zeek.org/en/current/reference/logs/weird-and-notice.html"
    match: [weird-log, notice-log, protocol-anomalies, alerts]
  - id: zeekctl-cluster-config
    name: "ZeekControl cluster config"
    source: "https://docs.zeek.org/en/current/cluster-setup.html"
    match: [cluster-config, zeekctl-cfg, networks-cfg, zeekctl-install]
  - id: zeekctl-standalone-deploy
    name: "ZeekControl standalone deploy"
    source: "https://docs.zeek.org/en/current/quickstart.html"
    match: [zeekctl, standalone-node, node-cfg, local-zeek]
  - id: zeromq-cluster-backend
    name: "ZeroMQ cluster backend"
    source: "https://docs.zeek.org/en/current/advanced/devel/cluster/backend/zeromq.html"
    match: [zeromq, cluster-backend, xpub-xsub, cluster-publish]
