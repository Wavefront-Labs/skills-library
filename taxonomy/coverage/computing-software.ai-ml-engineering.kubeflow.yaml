# Coverage spec for kubeflow, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: kubeflow
scope:
  category: computing-software
  field: ai-ml-engineering
  products: [kubeflow]
sources:
  - "Kubeflow documentation (content/en/docs/ in kubeflow/website)"
topics:
  - id: katib-concepts-architecture
    name: "Katib concepts architecture"
    source: "https://github.com/kubeflow/website/blob/master/content/en/docs/components/katib/overview.md"
