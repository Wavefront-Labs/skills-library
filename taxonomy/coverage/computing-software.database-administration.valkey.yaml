# Coverage spec: valkey. Topics from the official docs pages in sources.
subject: valkey
scope:
  category: computing-software
  field: database-administration
  products: [valkey]
sources:
  - "https://valkey.io/topics/"
topics:
  - id: acl-command-categories
    name: "Acl command categories"
    source: "https://valkey.io/topics/acl/"
    match: [acl, acl-cat, command-categories, dangerous, subcommands, first-arg, modules]
  - id: acl-users-and-rules
    name: "Acl users and rules"
    source: "https://valkey.io/topics/acl/"
    match: [acl, acl-setuser, auth, users, permissions, selectors, passwords, default-user]
  - id: admin-production-setup
    name: "Admin production setup"
    source: "https://valkey.io/topics/admin/"
    match: [admin, production, overcommit, transparent-huge-pages, maxmemory, upgrade, zero-downtime]
  - id: aof-rewrite-recovery-backup
    name: "Aof rewrite recovery backup"
    source: "https://valkey.io/topics/persistence/"
    match: [aof, bgrewriteaof, valkey-check-aof, aof-load-truncated, backup, auto-aof-rewrite-percentage, appenddirname]
  - id: atomic-slot-migration
    name: "Atomic slot migration"
    source: "https://valkey.io/topics/atomic-slot-migration/"
    match: [atomic-slot-migration, migrateslots, cluster, resharding, hash-slots]
  - id: benchmarking-pitfalls-and-factors
    name: "Benchmarking pitfalls and factors"
    source: "https://valkey.io/topics/benchmark/"
    match: [benchmark, performance-factors, numa, unix-socket, network-bandwidth, reproducibility, connections]
  - id: bitfields
    name: "Bitfields"
    source: "https://valkey.io/topics/bitfields/"
    match: [bitfield, bitfield-ro, counters, integers, incrby]
  - id: bitmaps-setbit-bitcount
    name: "Bitmaps setbit bitcount"
    source: "https://valkey.io/topics/bitmaps/"
    match: [bitmaps, setbit, getbit, bitop, bitcount, bitpos]
  - id: bulk-loading-pipe-mode
    name: "Bulk loading pipe mode"
    source: "https://valkey.io/topics/mass-insertion/"
    match: [mass-insertion, bulk-loading, valkey-cli, pipe-mode, resp, echo]
  - id: client-side-caching-tracking
    name: "Client side caching tracking"
    source: "https://valkey.io/topics/client-side-caching/"
    match: [client-side-caching, tracking, invalidation, bcast, optin, noloop, resp3]
  - id: cpu-profiling-perf-ebpf
    name: "Cpu profiling perf ebpf"
    source: "https://valkey.io/topics/performance-on-cpu/"
    match: [profiling, perf, flamegraph, bcc, ebpf, funccount, pmc, on-cpu, cpu-bottleneck]
  - id: debugging-with-gdb
    name: "Debugging with gdb"
    source: "https://valkey.io/topics/debugging/"
    match: [debugging, gdb, core-dump, gcore, backtrace, crash, make-noopt]
  - id: functions-libraries-fcall
    name: "Functions libraries fcall"
    source: "https://valkey.io/topics/functions-intro/"
    match: [functions, function-load, fcall, libraries, register-function, lua, programmability]
  - id: geospatial-geosearch
    name: "Geospatial geosearch"
    source: "https://valkey.io/topics/geospatial/"
    match: [geospatial, geoadd, geosearch, bypolygon, byradius, location]
  - id: hashes-and-field-expiration
    name: "Hashes and field expiration"
    source: "https://valkey.io/topics/hashes/"
    match: [hashes, hset, hincrby, hexpire, hsetex, hgetex, field-expiration]
  - id: hot-key-tracking
    name: "Hot key tracking"
    source: "https://valkey.io/topics/hotkeys/"
    match: [hotkeys, hot-keys, hotkeys-top-k, sampling, monitoring]
  - id: hyperloglog-pfadd-pfcount
    name: "Hyperloglog pfadd pfcount"
    source: "https://valkey.io/topics/hyperloglogs/"
    match: [hyperloglog, pfadd, pfcount, pfmerge, cardinality, unique-counts]
  - id: keys-and-expiration
    name: "Keys and expiration"
    source: "https://valkey.io/topics/keyspace/"
    match: [keyspace, keys, expire, ttl, persist, scan, glob-patterns]
  - id: keyspace-notifications
    name: "Keyspace notifications"
    source: "https://valkey.io/topics/notifications/"
    match: [keyspace-notifications, notify-keyspace-events, keyevent, expired-events, keyspace, pubsub]
  - id: latency-fork-thp-swap
    name: "Latency fork thp swap"
    source: "https://valkey.io/topics/latency/"
    match: [latency, fork, latest-fork-usec, transparent-huge-pages, swap, smaps, vmstat, iostat]
  - id: latency-monitor
    name: "Latency monitor"
    source: "https://valkey.io/topics/latency-monitor/"
    match: [latency-monitor, latency-monitor-threshold, latency-doctor, latency-history, latency-graph, events]
  - id: latency-troubleshooting-checklist
    name: "Latency troubleshooting checklist"
    source: "https://valkey.io/topics/latency/"
    match: [latency, troubleshooting, slowlog, intrinsic-latency, valkey-cli-latency, slow-commands, keys]
  - id: lists-queues-and-blocking-pops
    name: "Lists queues and blocking pops"
    source: "https://valkey.io/topics/lists/"
    match: [lists, lpush, rpush, lpop, lrange, ltrim, blpop, brpop, lmove, queues]
  - id: lru-lfu-tuning
    name: "Lru lfu tuning"
    source: "https://valkey.io/topics/lru-cache/"
    match: [lru, lfu, maxmemory-samples, lfu-log-factor, lfu-decay-time, morris-counter, eviction-tuning]
  - id: lua-eval-scripting-basics
    name: "Lua eval scripting basics"
    source: "https://valkey.io/topics/eval-intro/"
    match: [eval, lua, scripting, keys, argv, server-call, server-pcall, atomic, effects-replication]
  - id: maxmemory-eviction-policies
    name: "Maxmemory eviction policies"
    source: "https://valkey.io/topics/lru-cache/"
    match: [maxmemory, maxmemory-policy, eviction, allkeys-lru, volatile-ttl, noeviction, mem-not-counted-for-evict]
  - id: memory-optimization-encodings
    name: "Memory optimization encodings"
    source: "https://valkey.io/topics/memory-optimization/"
    match: [memory-optimization, listpack, intset, hash-max-listpack-entries, fragmentation, rss, bucketing]
  - id: persistence-rdb-vs-aof
    name: "Persistence rdb vs aof"
    source: "https://valkey.io/topics/persistence/"
    match: [persistence, rdb, aof, appendonly, appendfsync, snapshot, save, bgsave]
  - id: pipelining
    name: "Pipelining"
    source: "https://valkey.io/topics/pipelining/"
    match: [pipelining, rtt, round-trip, batching, throughput, evalsha, script-load]
  - id: pubsub-channels-and-patterns
    name: "Pubsub channels and patterns"
    source: "https://valkey.io/topics/pubsub/"
    match: [pubsub, subscribe, psubscribe, publish, ssubscribe, spublish, sharded-pubsub, at-most-once]
  - id: rdma-transport
    name: "Rdma transport"
    source: "https://valkey.io/topics/RDMA/"
    match: [rdma, valkey-rdma, rdma-port, rdma-comp-vector, infiniband, module, transport]
  - id: replication-full-sync-tuning
    name: "Replication full sync tuning"
    source: "https://valkey.io/topics/replication/"
    match: [full-sync, repl-diskless-sync, repl-diskless-load, dual-channel-replication, repl-compression, replication-tuning]
  - id: replication-psync-and-ids
    name: "Replication psync and ids"
    source: "https://valkey.io/topics/replication/"
    match: [replication, replicaof, psync, replication-id, offset, backlog, wait, waitaof, replica-announce-ip]
  - id: replication-safety-and-writes
    name: "Replication safety and writes"
    source: "https://valkey.io/topics/replication/"
    match: [replication-safety, min-replicas-to-write, min-replicas-max-lag, writable-replica, persistence-off, expires]
  - id: script-cache-evalsha
    name: "Script cache evalsha"
    source: "https://valkey.io/topics/eval-intro/"
    match: [script-cache, evalsha, script-load, noscript, script-kill, script-flush, sha1]
  - id: security-model
    name: "Security model"
    source: "https://valkey.io/topics/security/"
    match: [security, protected-mode, requirepass, bind, authentication, firewall, injection]
  - id: sets-and-set-operations
    name: "Sets and set operations"
    source: "https://valkey.io/topics/sets/"
    match: [sets, sadd, srem, sismember, sinter, sdiff, sunion, sscan, smembers]
  - id: signals-and-shutdown
    name: "Signals and shutdown"
    source: "https://valkey.io/topics/signals/"
    match: [signals, sigterm, sigint, shutdown, shutdown-timeout, sigusr1, crash]
  - id: sorted-sets-leaderboards
    name: "Sorted sets leaderboards"
    source: "https://valkey.io/topics/sorted-sets/"
    match: [sorted-sets, zadd, zrange, zrank, zincrby, leaderboard, zrangebylex, zrangebyscore]
  - id: strings-and-counters
    name: "Strings and counters"
    source: "https://valkey.io/topics/strings/"
    match: [strings, set, get, incr, incrby, mset, mget, counters, setnx]
  - id: tls-configuration
    name: "Tls configuration"
    source: "https://valkey.io/topics/tls/"
    match: [tls, ssl, tls-port, mtls, tls-replication, tls-cluster, certificates]
  - id: transactions-multi-exec-watch
    name: "Transactions multi exec watch"
    source: "https://valkey.io/topics/transactions/"
    match: [transactions, multi, exec, discard, watch, unwatch, execabort, optimistic-locking, cas]
  - id: valkey-benchmark-usage
    name: "Valkey benchmark usage"
    source: "https://valkey.io/topics/benchmark/"
    match: [valkey-benchmark, benchmark, throughput, pipeline, rand-int, cluster-benchmark, load-testing]
