# Coverage spec: cert-manager. Topics from the cert-manager docs table of contents.
subject: cert-manager
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [cert-manager]
sources:
  - "cert-manager docs (cert-manager.io/docs)"
topics:
  - id: helm-install
    name: "Helm install"
    source: "https://cert-manager.io/docs/installation/helm/"
    match: [helm, crds-enabled, oci-chart]
  - id: kubectl-install
    name: "kubectl apply install"
    source: "https://cert-manager.io/docs/installation/kubectl/"
    match: [kubectl-apply, static-manifest, cmctl-check-api]
  - id: configuring-components
    name: "Configuring components"
    source: "https://cert-manager.io/docs/installation/configuring-components/"
    match: [controllerconfiguration, feature-gates, extraargs]
  - id: upgrading
    name: "Upgrading"
    source: "https://cert-manager.io/docs/installation/upgrade/"
    match: [upgrade, helm-upgrade, crds]
  - id: uninstalling
    name: "Uninstalling"
    source: "https://cert-manager.io/docs/installation/uninstall/"
    match: [uninstall, helm-uninstall, backup]
  - id: signature-verification
    name: "Signature verification"
    source: "https://cert-manager.io/docs/installation/code-signing/"
    match: [cosign, signature, helm-verify]
  - id: best-practice-installation
    name: "Best practice installation options"
    source: "https://cert-manager.io/docs/installation/best-practice/"
    match: [best-practice, network-policy, replicacount]
  - id: selfsigned-issuer
    name: "SelfSigned issuer"
    source: "https://cert-manager.io/docs/configuration/selfsigned/"
    match: [selfsigned, bootstrap-ca, empty-issuer-dn]
  - id: ca-issuer
    name: "CA issuer"
    source: "https://cert-manager.io/docs/configuration/ca/"
    match: [ca-issuer, tls-crt, intermediate-ca]
  - id: vault-issuer
    name: "Vault issuer"
    source: "https://cert-manager.io/docs/configuration/vault/"
    match: [vault, approle, kubernetes-auth]
  - id: cyberark-issuer
    name: "CyberArk (Venafi) issuer"
    source: "https://cert-manager.io/docs/configuration/venafi/"
    match: [venafi, cyberark, tpp]
  - id: acme-issuer
    name: "ACME issuer"
    source: "https://cert-manager.io/docs/configuration/acme/"
    match: [acme, externalaccountbinding, solvers]
  - id: http01-solver
    name: "HTTP01 solver"
    source: "https://cert-manager.io/docs/configuration/acme/http01/"
    match: [http01, ingressclassname, gatewayhttproute]
  - id: dns01-solver
    name: "DNS01 solver"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/"
    match: [dns01, cnamestrategy, delegation]
  - id: dns01-cloudflare
    name: "DNS01 Cloudflare"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/cloudflare/"
    match: [cloudflare, api-token]
  - id: dns01-route53
    name: "DNS01 Route53"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/route53/"
    match: [route53, irsa, ambient-credentials]
  - id: dns01-azuredns
    name: "DNS01 AzureDNS"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/azuredns/"
    match: [azuredns, workload-identity, service-principal]
  - id: dns01-google-clouddns
    name: "DNS01 Google CloudDNS"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/google/"
    match: [clouddns, gcp]
  - id: dns01-rfc2136
    name: "DNS01 RFC-2136"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/rfc2136/"
    match: [rfc2136, tsig, nsupdate]
  - id: dns01-webhook-solver
    name: "DNS01 webhook solver"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/webhook/"
    match: [webhook-solver, groupname, solvername]
  - id: dns01-acme-dns
    name: "DNS01 ACMEDNS"
    source: "https://cert-manager.io/docs/configuration/acme/dns01/acme-dns/"
    match: [acme-dns, acmedns]
  - id: issuer-integrations
    name: "Issuer integrations"
    source: "https://cert-manager.io/docs/configuration/issuers/"
    match: [issuers, external-issuers, in-tree]
  - id: certificate-resource
    name: "Certificate resource"
    source: "https://cert-manager.io/docs/usage/certificate/"
    match: [certificate, duration, renewbefore]
  - id: certificaterequest-resource
    name: "CertificateRequest resource"
    source: "https://cert-manager.io/docs/usage/certificaterequest/"
    match: [certificaterequest, approved, denied]
  - id: ingress-annotations
    name: "Ingress annotations"
    source: "https://cert-manager.io/docs/usage/ingress/"
    match: [ingress-shim, tls-acme, issuer-annotation]
  - id: gateway-api-certificates
    name: "Gateway API certificates"
    source: "https://cert-manager.io/docs/usage/gateway/"
    match: [gateway-api, listener, certificaterefs]
  - id: kubernetes-csr-signing
    name: "Kubernetes CertificateSigningRequests"
    source: "https://cert-manager.io/docs/usage/kube-csr/"
    match: [certificatesigningrequest, signername]
  - id: istio-csr
    name: "istio-csr"
    source: "https://cert-manager.io/docs/usage/istio-csr/"
    match: [istio-csr, istio, mtls]
  - id: csi-driver
    name: "csi-driver"
    source: "https://cert-manager.io/docs/usage/csi-driver/"
    match: [csi-driver, volumeattributes]
  - id: csi-driver-spiffe
    name: "csi-driver-spiffe"
    source: "https://cert-manager.io/docs/usage/csi-driver-spiffe/"
    match: [csi-driver-spiffe, spiffe, trust-domain]
  - id: trust-manager-bundles
    name: "trust-manager bundles"
    source: "https://cert-manager.io/docs/trust/trust-manager/"
    match: [trust-manager, bundle, usedefaultcas]
  - id: approver-policy
    name: "approver-policy"
    source: "https://cert-manager.io/docs/policy/approval/approver-policy/"
    match: [approver-policy, certificaterequestpolicy]
  - id: approval-policy-overview
    name: "Approval policy overview"
    source: "https://cert-manager.io/docs/policy/approval/"
    match: [approval, auto-approval]
  - id: certificate-defaulting
    name: "Certificate defaulting"
    source: "https://cert-manager.io/docs/policy/defaulting/"
    match: [defaulting, kyverno]
  - id: issuing-policy
    name: "Issuing policy"
    source: "https://cert-manager.io/docs/policy/issuing/"
    match: [issuing-policy, issuer]
  - id: prometheus-metrics
    name: "Prometheus metrics"
    source: "https://cert-manager.io/docs/devops-tips/prometheus-metrics/"
    match: [prometheus, metrics, podmonitor]
  - id: backup-and-restore
    name: "Backup and restore resources"
    source: "https://cert-manager.io/docs/devops-tips/backup/"
    match: [backup, restore, velero]
  - id: scaling-cert-manager
    name: "Scaling cert-manager"
    source: "https://cert-manager.io/docs/devops-tips/scaling-cert-manager/"
    match: [scaling, serversideapply, revisionhistorylimit]
  - id: threat-model
    name: "Threat model"
    source: "https://cert-manager.io/docs/devops-tips/threat-modelling/"
    match: [threat-model, rbac, ssrf]
  - id: troubleshooting-acme
    name: "Troubleshooting ACME"
    source: "https://cert-manager.io/docs/troubleshooting/acme/"
    match: [troubleshooting, order, challenge]
  - id: troubleshooting-webhook
    name: "Troubleshooting webhook"
    source: "https://cert-manager.io/docs/troubleshooting/webhook/"
    match: [connection-refused, secureport, hostnetwork]
  - id: faq-renewal-and-secrets
    name: "FAQ renewal and secrets"
    source: "https://cert-manager.io/docs/faq/"
    match: [faq, reissuance, ca-crt]
  - id: cmctl-cli
    name: "cmctl command line tool"
    source: "https://cert-manager.io/docs/reference/cmctl/"
    match: [cmctl, renew, status-certificate]
  - id: annotations-reference
    name: "Annotations reference"
    source: "https://cert-manager.io/docs/reference/annotations/"
    match: [annotations, inject-ca-from]
  - id: acme-orders-and-challenges
    name: "ACME Orders and Challenges"
    source: "https://cert-manager.io/docs/concepts/acme-orders-challenges/"
    match: [max-concurrent-challenges, self-check, acme-lifecycle]
  - id: ca-injector
    name: "CA injector"
    source: "https://cert-manager.io/docs/concepts/ca-injector/"
    match: [cainjector, ca-injector]
  - id: webhook-component
    name: "Webhook component"
    source: "https://cert-manager.io/docs/concepts/webhook/"
    match: [admission, conversion, cert-manager-webhook-ca]
