# Canonical coverage spec: live-action film (all products in the film-live-action field).
# Checked by tools/coverage_check.py — a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (manuals, certification objectives, film-school
# curricula, guild craft texts), so the check measures the library against the subject, not itself.
# Note: there is no "producing" product in this field; line-producing topics (scheduling, budgets,
# call sheets, permits, insurance) sit under `directing`, whose scope is "set leadership from prep
# to picture lock".
subject: film-live-action
scope:
  category: creative-arts
  field: film-live-action
  products: [directing, screenwriting, final-draft, cinematography, cinema-cameras, film-editing, davinci-resolve, premiere-pro, color-grading, production-sound, film-sound-design, documentary]
sources:
  - "American Cinematographer Manual (ASC, 10th/11th ed.) chapter list - cameras, lenses, filters, exposure, lighting, camera support, frame rates, aspect ratios, digital capture/log, VFX plates, HDR"
  - "AFI Conservatory cinematography / directing / screenwriting / editing / producing discipline course outlines (cycle 1-2)"
  - "NFTS MA Directing Fiction, Screenwriting, Cinematography, Editing, Sound Design, Producing and Documentary course outlines"
  - "The Definitive Guide to DaVinci Resolve (Blackmagic official training book) - Cut, Edit, Fusion, Color, Fairlight, Deliver, Media/Project management, Collaboration"
  - "The Colorist Guide to DaVinci Resolve (Blackmagic official training) - primaries, secondaries, tracking, groups, colour management, HDR, noise reduction, LUTs/DCTL"
  - "Adobe Certified Professional in Video Design using Premiere Pro - exam objectives (project setup, organisation, timeline, effects/graphics, audio, export)"
  - "Motion Picture Editors Guild craft areas (assistant editing, picture editing, sound editing, music editing, re-recording) and Walter Murch, In the Blink of an Eye"
  - "Film sound post curricula (dialogue edit, ADR, foley, sound effects/backgrounds, music edit, premix/final mix, loudness and stems, Atmos) per MPSE and Dolby guidelines"
  - "Line producing and production management (Movie Magic Scheduling/Budgeting manuals, PGA Producing Guidelines) - breakdown, scheduling, budgeting, call sheets, permits, insurance, clearances"
  - "Production sound craft (CAS/AMPS guidance, Sound Devices manuals) - recorder/mixer setup, wireless, plants, playback, reports/metadata"
