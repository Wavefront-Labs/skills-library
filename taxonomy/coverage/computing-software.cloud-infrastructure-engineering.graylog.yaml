# Coverage spec for Graylog, from the official docs (go2docs.graylog.org).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: graylog
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [graylog]
sources:
  - "Graylog documentation (go2docs.graylog.org/current)"
topics:
  - id: graylog-stack
    name: "Graylog stack components and log flow"
    source: "https://go2docs.graylog.org/current/planning_your_deployment/the_graylog_stack.htm"
    match: [graylog-stack, data-node-role, mongodb-metadata]
  - id: sizing
    name: "deployment models and sizing"
    source: "https://go2docs.graylog.org/current/planning_your_deployment/graylog_system_architecture.htm"
    match: [sizing, size-estimator, high-iops]
  - id: compat
    name: "version compatibility and support lifecycle"
    source: "https://go2docs.graylog.org/current/downloading_and_installing_graylog/compatibility_matrix.htm"
    match: [compatibility-matrix, supported-os, release-lifecycle]
  - id: install-linux
    name: "Linux package installation"
    source: "https://go2docs.graylog.org/current/downloading_and_installing_graylog/debian_installation.htm"
    match: [debian, ubuntu, package-install, rhel, rpm, almalinux]
  - id: install-multi
    name: "multi-node cluster installation"
    source: "https://go2docs.graylog.org/current/downloading_and_installing_graylog/debian_installation_multi_node.htm"
    match: [multi-node, conventional-model, load-balancer]
  - id: docker
    name: "Docker Compose deployment"
    source: "https://go2docs.graylog.org/current/downloading_and_installing_graylog/docker_installation.htm"
    match: [docker, compose, container]
  - id: data-node
    name: "Data Node management"
    source: "https://go2docs.graylog.org/current/downloading_and_installing_graylog/install_graylog_data_node.htm"
    match: [data-node, managed-opensearch, data-node-ui]
  - id: data-node-config
    name: "datanode.conf properties"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/data_node_configuration_file.htm"
    match: [datanode-conf, opensearch-heap, password-secret]
  - id: data-node-overrides
    name: "OpenSearch configuration overrides"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/data_node_configuration_overrides.htm"
    match: [opensearch-overrides, datanode-conf, allowlist-overrides]
  - id: data-node-certs
    name: "Data Node certificate management"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/manage_certificates_with_data_node.htm"
    match: [certificate-authority, cert-renewal, client-certificate]
  - id: migrate-datanode
    name: "migration to Data Node"
    source: "https://go2docs.graylog.org/current/planning_your_deployment/data_node_in-place_migration.htm"
    match: [in-place-migration, migration-wizard, tls-migration]
  - id: opensearch3
    name: "OpenSearch 3 upgrade"
    source: "https://go2docs.graylog.org/current/upgrading_graylog/upgrade_to_opensearch_3.x_with_data_node.htm"
    match: [opensearch-3, incompatible-indices, data-node-upgrade]
  - id: server-conf
    name: "server.conf and file locations"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/configuration_settings.htm"
    match: [server-conf, file-locations, default-paths, http-bind-address, message-journal, jvm-heap]
  - id: service-users
    name: "service users and groups"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/default_users_and_groups.htm"
    match: [service-accounts, file-ownership, permissions]
  - id: firewall
    name: "ports and outbound connectivity"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/network_connectivity_and_firewall_requirements.htm"
    match: [firewall, ports, outbound-urls]
  - id: url-allowlist
    name: "URL allowlist and HTTP proxy"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/url_allowlist.html"
    match: [url-allowlist, outbound-requests, ssrf-protection, http-proxy, non-proxy-hosts, server-conf]
  - id: mongo-auth
    name: "MongoDB password authentication"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/configure_graylog_to_use_mongodb_password_authentication.htm"
    match: [mongodb-auth, readwrite-role, mongodb-uri]
  - id: web-tls
    name: "web interface TLS"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/secure_graylog_interface_with_tls.htm"
    match: [web-tls, https, pem-keys]
  - id: backup
    name: "backup and restore"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/backup_considerations.htm"
    match: [backup, mongodump, mongorestore]
  - id: cluster-page
    name: "cluster configuration page"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/cluster_configuration.htm"
    match: [cluster-configuration, load-balancer-status, pause-processing]
  - id: upgrade
    name: "upgrade process"
    source: "https://go2docs.graylog.org/current/upgrading_graylog/upgrading_graylog.html"
    match: [upgrade-order, upgrade, rolling-upgrade]
  - id: upgrade-notes
    name: "version upgrade notes"
    source: "https://go2docs.graylog.org/current/upgrading_graylog/upgrade_to_graylog_7.0.htm"
    match: [release-notes-7-0, kafka-clients, mongodb-7]
  - id: index-model
    name: "index sets rotation and retention"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/index_model.html"
    match: [index-set, rotation, deflector]
  - id: index-templates
    name: "index set templates"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/index_set_templates.htm"
    match: [index-set-templates, hot-tier, warm-tier]
  - id: tiering
    name: "data tiering and warm tier"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/data_tiering.htm"
    match: [data-tiering, hot-tier, warm-tier, node-search-cache-size, s3-repository]
  - id: archive
    name: "archiving"
    source: "https://go2docs.graylog.org/current/interacting_with_your_log_data/archiving.html"
    match: [archive, restore-archive, archive-backend]
  - id: data-lake
    name: "Data Lake"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/data_lake.htm"
    match: [data-lake, internal-lake, external-lake, lake-backend, s3-backend, data-lake-journal, lake-retention, lake-retrieve, restored-index]
  - id: data-routing
    name: "stream data routing"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/data_routing.htm"
    match: [data-routing, stream-rules, intake]
  - id: inputs
    name: "inputs overview and launch"
    source: "https://go2docs.graylog.org/current/getting_in_log_data/inputs.htm"
    match: [input-types, input-setup, listener-input]
  - id: input-diagnosis
    name: "input diagnosis and indexer failures"
    source: "https://go2docs.graylog.org/current/getting_in_log_data/input_diagnosis.htm"
    match: [input-diagnosis, bind-error, privileged-ports, indexer-failures, mapper-parsing-exception, field-types]
  - id: input-tls
    name: "TLS on inputs"
    source: "https://go2docs.graylog.org/current/getting_in_log_data/secure_inputs_with_tls.htm"
    match: [input-tls, enable-tls, certificate-key]
  - id: network-inputs
    name: "syslog and Beats inputs"
    source: "https://go2docs.graylog.org/current/getting_in_log_data/syslog_inputs.html"
    match: [syslog, syslog-tcp, syslog-udp, beats, filebeat, winlogbeat]
  - id: agents
    name: "Sidecar Forwarder and Collector"
    source: "https://go2docs.graylog.org/current/getting_in_log_data/graylog_sidecar.html"
    match: [sidecar, collector-configuration, sidecar-tags, forwarder, input-profiles, remote-site, graylog-collector, collector-sources, sidecar-vs-collector]
  - id: cloud-inputs
    name: "AWS and Azure cloud inputs"
    source: "https://go2docs.graylog.org/current/getting_in_log_data/aws_cloudtrail_input.htm"
    match: [aws-inputs, aws-cloudtrail, sqs, aws-s3, kinesis, cloudwatch-logs, azure-event-hubs, consumer-group, sas-policy]
  - id: otel
    name: "OpenTelemetry input"
    source: "https://go2docs.graylog.org/current/getting_in_log_data/opentelemetry__grpc__input.htm"
    match: [opentelemetry, otlp, grpc-input]
  - id: streams-pipelines
    name: "streams and pipelines"
    source: "https://go2docs.graylog.org/current/making_sense_of_your_log_data/pipelines.html"
    match: [streams, default-stream, stream-rules, pipelines, pipeline-rules, stages, slow-pipeline, high-cpu, pipeline-performance]
  - id: lookup
    name: "lookup tables"
    source: "https://go2docs.graylog.org/current/making_sense_of_your_log_data/lookup_tables.html"
    match: [lookup-tables, data-adapters, lookup-cache]
  - id: search
    name: "search syntax"
    source: "https://go2docs.graylog.org/current/making_sense_of_your_log_data/search_syntax_reference.htm"
    match: [search-syntax, query-language, wildcards]
  - id: health
    name: "health module and notifications"
    source: "https://go2docs.graylog.org/current/making_sense_of_your_log_data/health_module.htm"
    match: [health-module, system-notifications, cluster-health]
  - id: observability
    name: "Prometheus metrics and support bundle"
    source: "https://go2docs.graylog.org/current/interacting_with_your_log_data/metrics.html"
    match: [prometheus, metrics, metrics-exporter, support-bundle, diagnostics, system-stats]
  - id: events
    name: "event definitions"
    source: "https://go2docs.graylog.org/current/interacting_with_your_log_data/event_definitions.html"
    match: [event-definitions, events, alerts]
  - id: outputs
    name: "outputs and Kafka"
    source: "https://go2docs.graylog.org/current/interacting_with_your_log_data/outputs.htm"
    match: [outputs, kafka-output, output-framework]
  - id: api
    name: "REST API and access tokens"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/rest_api_access_tokens.htm"
    match: [rest-api, access-tokens, api-browser]
  - id: sso
    name: "SAML OIDC LDAP and header SSO"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/saml_authentication.htm"
    match: [saml, oidc, single-sign-on, ldap, active-directory, group-sync, trusted-header, sso-proxy, trusted-proxies]
  - id: rbac
    name: "roles sharing and teams"
    source: "https://go2docs.graylog.org/current/setting_up_graylog/permission_management.html"
    match: [roles, sharing, teams]
