# Coverage spec: payload-cms. Topics from the official docs table of contents.
subject: payload-cms
scope:
  category: computing-software
  field: web-development
  products: [payload-cms]
sources:
  - "Payload CMS official documentation"
topics:
  - id: access-control-overview
    name: "Access control overview"
    source: "https://payloadcms.com/docs/access-control/overview"
    match: [access-control, default-access, baseaccess, overrideaccess]
  - id: admin-panel-config
    name: "Admin panel config"
    source: "https://payloadcms.com/docs/admin/overview"
    match: [admin-panel, admin-user, admin-routes, admin-options]
  - id: admin-preview-and-live-preview
    name: "Admin preview and live preview"
    source: "https://payloadcms.com/docs/live-preview/overview"
    match: [live-preview, preview-button, draft-preview, iframe-preview]
  - id: array-field
    name: "Array field"
    source: "https://payloadcms.com/docs/fields/array"
    match: [array-field, repeating-rows, rowlabel, minrows]
  - id: auth-api-keys
    name: "Auth api keys"
    source: "https://payloadcms.com/docs/authentication/api-keys"
    match: [api-keys, useapikey, service-account, integration-auth]
  - id: auth-cookies-csrf
    name: "Auth cookies csrf"
    source: "https://payloadcms.com/docs/authentication/cookies"
    match: [cookies, http-only-cookies, csrf, credentials-include]
  - id: auth-custom-strategies
    name: "Auth custom strategies"
    source: "https://payloadcms.com/docs/authentication/custom-strategies"
    match: [custom-strategies, auth-strategy, authenticate, disable-local-strategy]
  - id: auth-email-verification
    name: "Auth email verification"
    source: "https://payloadcms.com/docs/authentication/email"
    match: [email-verification, verify-email, forgot-password, generateemailhtml]
  - id: auth-operations
    name: "Auth operations"
    source: "https://payloadcms.com/docs/authentication/operations"
    match: [auth-operations, login, me, refresh-token, forgot-password]
  - id: auth-overview
    name: "Auth overview"
    source: "https://payloadcms.com/docs/authentication/overview"
    match: [authentication, auth-collection, token-expiration, lockout]
  - id: auth-refresh-tokens
    name: "Auth refresh tokens"
    source: "https://payloadcms.com/docs/authentication/overview"
    match: [refresh-tokens, refreshtokens, autorefresh, long-lived-session]
  - id: auth-server-functions
    name: "Auth server functions"
    source: "https://payloadcms.com/docs/authentication/server-functions"
    match: [server-functions, auth-server-function, login-action, nextjs-auth]
  - id: autosave
    name: "Autosave"
    source: "https://payloadcms.com/docs/versions/autosave"
    match: [autosave, autosave-interval, showsavedraftbutton, debounce]
  - id: blocks-field
    name: "Blocks field"
    source: "https://payloadcms.com/docs/fields/blocks"
    match: [blocks-field, page-builder, blocktype, block-config]
  - id: collection-access-control
    name: "Collection access control"
    source: "https://payloadcms.com/docs/access-control/collections"
    match: [collection-access, read-access, query-constraint, readversions]
  - id: collection-config
    name: "Collection config"
    source: "https://payloadcms.com/docs/configuration/collections"
    match: [collections, collection-config, slug, useastitle]
  - id: collection-hooks
    name: "Collection hooks"
    source: "https://payloadcms.com/docs/hooks/collections"
    match: [collection-hooks, beforechange, afterchange, beforevalidate]
  - id: custom-components-overview
    name: "Custom components overview"
    source: "https://payloadcms.com/docs/custom-components/overview"
    match: [custom-components, component-paths, importmap, server-components]
  - id: custom-endpoints
    name: "Custom endpoints"
    source: "https://payloadcms.com/docs/rest-api/overview"
    match: [custom-endpoints, endpoint-handler, routeparams, root-endpoint]
  - id: database-adapters
    name: "Database adapters"
    source: "https://payloadcms.com/docs/database/overview"
    match: [database-adapters, mongodb-vs-postgres, db-batchprocessing, drizzle]
  - id: database-indexes
    name: "Database indexes"
    source: "https://payloadcms.com/docs/database/indexes"
    match: [indexes, compound-indexes, unique-index, index-true]
  - id: database-migrations
    name: "Database migrations"
    source: "https://payloadcms.com/docs/database/migrations"
    match: [migrations, migrate-create, prodmigrations, push-mode]
  - id: database-transactions
    name: "Database transactions"
    source: "https://payloadcms.com/docs/database/transactions"
    match: [transactions, begintransaction, req-in-hooks, rollback]
  - id: document-locking
    name: "Document locking"
    source: "https://payloadcms.com/docs/admin/locked-documents"
    match: [document-locking, locked-documents, lockdocuments, concurrent-editing]
  - id: drafts
    name: "Drafts"
    source: "https://payloadcms.com/docs/versions/drafts"
    match: [drafts, draft-status, schedulepublish, draft-api]
  - id: email-adapters
    name: "Email adapters"
    source: "https://payloadcms.com/docs/email/overview"
    match: [email, nodemailer, resend, email-adapter]
  - id: environment-variables
    name: "Environment variables"
    source: "https://payloadcms.com/docs/configuration/environment-vars"
    match: [environment-variables, dotenv, next-public, client-bundle]
  - id: field-access-control
    name: "Field access control"
    source: "https://payloadcms.com/docs/access-control/fields"
    match: [field-access, field-permissions, hide-field, role-based]
  - id: field-hooks
    name: "Field hooks"
    source: "https://payloadcms.com/docs/hooks/fields"
    match: [field-hooks, field-beforechange, beforeduplicate, computed-field]
  - id: fields-overview
    name: "Fields overview"
    source: "https://payloadcms.com/docs/fields/overview"
    match: [fields, field-types, validate, condition]
  - id: global-config
    name: "Global config"
    source: "https://payloadcms.com/docs/configuration/globals"
    match: [globals, global-config, singleton, site-settings]
  - id: graphql-api
    name: "Graphql api"
    source: "https://payloadcms.com/docs/graphql/overview"
    match: [graphql, graphql-playground, maxcomplexity, introspection]
  - id: hook-context
    name: "Hook context"
    source: "https://payloadcms.com/docs/hooks/context"
    match: [hook-context, context, infinite-loop, req-context]
  - id: hooks-overview
    name: "Hooks overview"
    source: "https://payloadcms.com/docs/hooks/overview"
    match: [hooks, root-hooks, aftererror, awaited-hooks]
  - id: install-payload
    name: "Install payload"
    source: "https://payloadcms.com/docs/getting-started/installation"
    match: [install, create-payload-app, nextjs, requirements]
  - id: jobs-queue-overview
    name: "Jobs queue overview"
    source: "https://payloadcms.com/docs/jobs-queue/overview"
    match: [jobs-queue, tasks, workflows, payload-jobs]
  - id: jobs-running-queues
    name: "Jobs running queues"
    source: "https://payloadcms.com/docs/jobs-queue/queues"
    match: [run-jobs, jobs-autorun, jobs-run-endpoint, processing-lease]
  - id: jobs-schedules
    name: "Jobs schedules"
    source: "https://payloadcms.com/docs/jobs-queue/schedules"
    match: [job-schedules, cron-schedule, waituntil, handle-schedules]
  - id: jobs-tasks
    name: "Jobs tasks"
    source: "https://payloadcms.com/docs/jobs-queue/tasks"
    match: [job-tasks, task-config, inputschema, task-retries]
  - id: jobs-workflows
    name: "Jobs workflows"
    source: "https://payloadcms.com/docs/jobs-queue/workflows"
    match: [job-workflows, workflow-tasks, durable-execution, concurrency-key]
  - id: join-field
    name: "Join field"
    source: "https://payloadcms.com/docs/fields/join"
    match: [join-field, reverse-relationship, bidirectional, joins-query]
  - id: live-preview-frontend
    name: "Live preview frontend"
    source: "https://payloadcms.com/docs/live-preview/client"
    match: [live-preview-client, uselivepreview, refreshrouteonsave, server-live-preview]
  - id: local-api-access-control
    name: "Local api access control"
    source: "https://payloadcms.com/docs/local-api/access-control"
    match: [overrideaccess, local-api-permissions, user-scoped-queries, trusted-server]
  - id: local-api
    name: "Local api"
    source: "https://payloadcms.com/docs/local-api/overview"
    match: [local-api, getpayload, payload-find, overrideaccess]
  - id: localization
    name: "Localization"
    source: "https://payloadcms.com/docs/configuration/localization"
    match: [localization, locales, fallback-locale, localized-fields]
  - id: mongodb-adapter
    name: "Mongodb adapter"
    source: "https://payloadcms.com/docs/database/mongodb"
    match: [mongodb, mongooseadapter, cosmosdb, compatibilityoptions]
  - id: payload-cli
    name: "Payload cli"
    source: "https://payloadcms.com/docs/configuration/cli"
    match: [cli, payload-cli, generate-types, importmap, json-output]
  - id: payload-config-basics
    name: "Payload config basics"
    source: "https://payloadcms.com/docs/configuration/overview"
    match: [payload-config, buildconfig, secret, db-adapter]
  - id: plugin-redirects-nested-search
    name: "Plugin redirects nested search"
    source: "https://payloadcms.com/docs/plugins/redirects"
    match: [redirects-plugin, nested-docs-plugin, search-plugin, breadcrumbs]
  - id: plugin-seo
    name: "Plugin seo"
    source: "https://payloadcms.com/docs/plugins/seo"
    match: [seo-plugin, meta-fields, generatetitle, plugin-seo]
  - id: plugins-overview
    name: "Plugins overview"
    source: "https://payloadcms.com/docs/plugins/overview"
    match: [plugins, official-plugins, plugin-api, buildconfig-plugins]
  - id: postgres-adapter
    name: "Postgres adapter"
    source: "https://payloadcms.com/docs/database/postgres"
    match: [postgres, postgresadapter, drizzle-push, read-replicas]
  - id: preventing-api-abuse
    name: "Preventing api abuse"
    source: "https://payloadcms.com/docs/production/preventing-abuse"
    match: [api-abuse, rate-limits, graphql-complexity, malicious-uploads]
  - id: production-deployment
    name: "Production deployment"
    source: "https://payloadcms.com/docs/production/deployment"
    match: [deployment, production, secure-cookies, security-headers]
  - id: queries-where
    name: "Queries where"
    source: "https://payloadcms.com/docs/queries/overview"
    match: [queries, where-query, operators, and-or]
  - id: query-depth
    name: "Query depth"
    source: "https://payloadcms.com/docs/queries/depth"
    match: [depth, populate-relationships, defaultdepth, maxdepth]
  - id: query-pagination
    name: "Query pagination"
    source: "https://payloadcms.com/docs/queries/pagination"
    match: [pagination, limit, page, totaldocs]
  - id: relationship-field
    name: "Relationship field"
    source: "https://payloadcms.com/docs/fields/relationship"
    match: [relationship, relationto, polymorphic, filteroptions]
  - id: rest-api
    name: "Rest api"
    source: "https://payloadcms.com/docs/rest-api/overview"
    match: [rest-api, crud-endpoints, api-routes, method-override]
  - id: rich-text-lexical
    name: "Rich text lexical"
    source: "https://payloadcms.com/docs/rich-text/overview"
    match: [rich-text, lexical, richtext-field, editor-config]
  - id: root-components
    name: "Root components"
    source: "https://payloadcms.com/docs/custom-components/root-components"
    match: [root-components, admin-header, before-dashboard, nav-links]
  - id: select-radio-fields
    name: "Select radio fields"
    source: "https://payloadcms.com/docs/fields/select"
    match: [select-field, radio-field, options, enumname]
  - id: sqlite-adapter
    name: "Sqlite adapter"
    source: "https://payloadcms.com/docs/database/sqlite"
    match: [sqlite, sqliteadapter, libsql-turso, wal-mode]
  - id: text-and-number-fields
    name: "Text and number fields"
    source: "https://payloadcms.com/docs/fields/text"
    match: [text-field, number-field, textarea, hasmany]
  - id: trash-soft-delete
    name: "Trash soft delete"
    source: "https://payloadcms.com/docs/trash/overview"
    match: [trash, soft-delete, deletedat, restore-documents]
  - id: typescript-types
    name: "Typescript types"
    source: "https://payloadcms.com/docs/typescript/generating-types"
    match: [typescript, generate-types, payload-types, interfacename]
  - id: upload-collections
    name: "Upload collections"
    source: "https://payloadcms.com/docs/upload/overview"
    match: [uploads, upload-collection, staticdir, mimetypes]
  - id: upload-image-variants
    name: "Upload image variants"
    source: "https://payloadcms.com/docs/upload/transformers"
    match: [image-variants, sharptransformer, image-sizes, transformer-sharp]
  - id: upload-storage-adapters
    name: "Upload storage adapters"
    source: "https://payloadcms.com/docs/upload/storage-adapters"
    match: [storage-adapters, s3-storage, vercel-blob, clientuploads]
  - id: versions-overview
    name: "Versions overview"
    source: "https://payloadcms.com/docs/versions/overview"
    match: [versions, version-history, maxperdoc, readversions]
