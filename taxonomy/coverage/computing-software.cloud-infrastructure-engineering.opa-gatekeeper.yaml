  - id: enforcement-action-dryrun-warn
    name: "Enforcement actions dryrun and warn"
    source: "https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/violations.md"
    match: [dryrun, warn, enforcement-action]
  - id: log-denies
    name: "Logging denied requests"
    source: "https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/violations.md"
