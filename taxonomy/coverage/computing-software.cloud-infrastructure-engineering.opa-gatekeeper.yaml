# Coverage spec for opa-gatekeeper, from the official documentation.
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: opa-gatekeeper
scope:
  category: computing-software
  field: cloud-infrastructure-engineering
  products: [opa-gatekeeper]
sources:
  - "OPA Gatekeeper documentation (website/docs in open-policy-agent/gatekeeper)"
topics:
  - id: constrainttemplate-structure
    name: "ConstraintTemplate structure"
    source: "https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/howto.md"
    match: [constrainttemplate, policy-model]
  - id: constraint-match-field
    name: "Constraint match field"
    source: "https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/howto.md"
    match: [match, kinds, label-selector]
  - id: constraint-parameters-field
    name: "Constraint parameters"
    source: "https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/howto.md"
    match: [parameters, input-parameters]
  - id: v1-templates-structural-schema
    name: "v1 templates and structural schema"
    source: "https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/constrainttemplates.md"
    match: [v1, structural-schema, openapiv3schema]
  - id: rego-v1-syntax
    name: "Rego v1 syntax in templates"
    source: "https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/constrainttemplates.md"
