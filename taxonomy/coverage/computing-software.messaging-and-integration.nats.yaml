# Coverage spec: nats. Topics from the official docs ToC in sources.
subject: nats
scope:
  category: computing-software
  field: messaging-and-integration
  products: [nats]
sources:
  - "https://github.com/nats-io/nats.docs/blob/master/SUMMARY.md"
topics:
  - id: accounts-multi-tenancy
    name: "Accounts multi tenancy"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/securing_nats/accounts.md"
    match: [accounts, multi-tenancy, exports]
  - id: ack-types-and-dead-letters
    name: "Ack types and dead letters"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/developing-with-nats/js/consumers.md"
    match: [ack, nak, term]
  - id: archive-and-report-replication
    name: "Archive and report replication"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/nats_admin/jetstream_admin/replication.md"
    match: [replication, archive-stream, mirror]
  - id: auth-callout-setup
    name: "Auth callout setup"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/securing_nats/auth_callout.md"
    match: [auth-callout, external-auth, issuer]
  - id: client-cluster-connect
    name: "Client cluster connect"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/developing-with-nats/connecting/cluster.md"
    match: [client-connect, cluster, seed-servers]
  - id: client-slow-consumers
    name: "Client slow consumers"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/developing-with-nats/events/slow.md"
    match: [slow-consumer, pending-limits, subscription]
  - id: cluster-route-configuration
    name: "Cluster route configuration"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/clustering/cluster_config.md"
    match: [cluster, routes, cluster-config]
  - id: deterministic-subject-partitioning
    name: "Deterministic subject partitioning"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/subject_mapping.md"
    match: [partitioning, partition-function, sharding]
  - id: drain-before-disconnect
    name: "Drain before disconnect"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/developing-with-nats/receiving/drain.md"
    match: [drain, graceful-shutdown, close]
  - id: gateway-configuration
    name: "Gateway configuration"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/gateways/gateway.md"
    match: [gateway, super-cluster, gateways]
  - id: jetstream-backup-restore
    name: "Jetstream backup restore"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/nats_admin/jetstream_admin/disaster_recovery.md"
    match: [disaster-recovery, backup, restore]
  - id: jetstream-cluster-administration
    name: "Jetstream cluster administration"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/clustering/jetstream_clustering/administration.md"
    match: [jetstream-cluster, raft, replicas]
  - id: jetstream-cluster-troubleshooting
    name: "Jetstream cluster troubleshooting"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/clustering/jetstream_clustering/troubleshooting.md"
    match: [troubleshooting, nats-server-report, server-request]
  - id: jetstream-consumer-config
    name: "Jetstream consumer config"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/jetstream/consumers.md"
    match: [consumers, ack-policy, pull-consumer]
  - id: jetstream-encryption-at-rest
    name: "Jetstream encryption at rest"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/nats_admin/jetstream_admin/encryption_at_rest.md"
    match: [encryption-at-rest, chachapoly, aes]
  - id: jetstream-message-headers
    name: "Jetstream message headers"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/jetstream/headers.md"
    match: [headers, nats-msg-id, deduplication]
  - id: jetstream-source-and-mirror
    name: "Jetstream source and mirror"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/jetstream/source_and_mirror.md"
    match: [source, mirror, replication]
  - id: jetstream-stream-config
    name: "Jetstream stream config"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/jetstream/streams.md"
    match: [jetstream, stream-config, retention]
  - id: jwt-account-resolver
    name: "Jwt account resolver"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/securing_nats/jwt/resolver.md"
    match: [jwt, resolver, full-resolver]
  - id: key-value-store
    name: "Key value store"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/jetstream/key-value-store/README.md"
    match: [key-value, kv, bucket]
  - id: lame-duck-mode-and-signals
    name: "Lame duck mode and signals"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/nats_admin/signals.md"
    match: [lame-duck, signals, reload]
  - id: leaf-node-configuration
    name: "Leaf node configuration"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/leafnodes/leafnode_conf.md"
    match: [leafnodes, leaf-node, remotes]
  - id: message-deduplication-and-acks
    name: "Message deduplication and acks"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/jetstream/model_deep_dive.md"
    match: [deduplication, nats-msg-id, dupe-window]
  - id: monitoring-endpoint
    name: "Monitoring endpoint"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/monitoring.md"
    match: [monitoring, http-port, varz]
  - id: mqtt-support
    name: "Mqtt support"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/mqtt/mqtt_config.md"
    match: [mqtt, mqtt-config, qos1]
  - id: nats-bench
    name: "Nats bench"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/nats-tools/nats_cli/natsbench.md"
    match: [nats-bench, benchmark, throughput]
  - id: nk-keys-and-nkey-auth
    name: "Nk keys and nkey auth"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/nats-tools/nk.md"
    match: [nkeys, nk, ed25519]
  - id: nkey-authentication-config
    name: "Nkey authentication config"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/securing_nats/auth_intro/nkey_auth.md"
    match: [nkey, authorization-users, challenge-signing]
  - id: nsc-operator-account-user
    name: "Nsc operator account user"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/nats-tools/nsc/basics.md"
    match: [nsc, operator, account]
  - id: nsc-revocation
    name: "Nsc revocation"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/nats-tools/nsc/revocation.md"
    match: [revocation, nsc-revocations, activation]
  - id: nsc-signing-keys
    name: "Nsc signing keys"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/nats-tools/nsc/signing_keys.md"
    match: [signing-keys, nkeys, key-rotation]
  - id: object-store
    name: "Object store"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/jetstream/object-store/obj_store.md"
    match: [object-store, files, chunking]
  - id: pub-sub-and-message-size
    name: "Pub sub and message size"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/core-nats/publish-subscribe/pubsub.md"
    match: [pub-sub, fan-out, max-payload]
  - id: queue-groups
    name: "Queue groups"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/core-nats/queue-groups/queue.md"
    match: [queue-groups, load-balancing, work-queue]
  - id: reconnect-buffering
    name: "Reconnect buffering"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/developing-with-nats/reconnect/buffer.md"
    match: [reconnect, reconnect-buffer, fire-and-forget]
  - id: request-reply-and-no-responders
    name: "Request reply and no responders"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/core-nats/request-reply/reqreply.md"
    match: [request-reply, inbox, no-responders]
  - id: rolling-cluster-upgrade
    name: "Rolling cluster upgrade"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/nats_admin/upgrading_cluster.md"
    match: [upgrade, rolling-restart, healthz]
  - id: server-command-line-flags
    name: "Server command line flags"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/running/flags.md"
    match: [nats-server, flags, cli]
  - id: server-logging
    name: "Server logging"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/logging.md"
    match: [logging, log-file, logfile-size-limit]
  - id: server-profiling
    name: "Server profiling"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/nats_admin/profiling.md"
    match: [profiling, pprof, cpu-profile]
  - id: server-slow-consumers
    name: "Server slow consumers"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/nats_admin/slow_consumers.md"
    match: [slow-consumer, varz, slow-consumers-count]
  - id: server-tls-configuration
    name: "Server tls configuration"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/securing_nats/tls.md"
    match: [tls, cert-file, verify]
  - id: service-framework
    name: "Service framework"
    source: "https://github.com/nats-io/nats.docs/blob/master/using-nats/developing-with-nats/services/README.md"
    match: [services, micro, service-discovery]
  - id: subject-mapping-transforms
    name: "Subject mapping transforms"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/subject_mapping.md"
    match: [subject-mapping, transforms, wildcard-function]
  - id: subject-naming-and-wildcards
    name: "Subject naming and wildcards"
    source: "https://github.com/nats-io/nats.docs/blob/master/nats-concepts/subjects.md"
    match: [subjects, subject-hierarchy, wildcards]
  - id: subject-permissions
    name: "Subject permissions"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/securing_nats/authorization.md"
    match: [authorization, permissions, publish-subscribe]
  - id: username-password-and-bcrypt
    name: "Username password and bcrypt"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/securing_nats/auth_intro/username_password.md"
    match: [username-password, bcrypt, nats-server-passwd]
  - id: websocket-support
    name: "Websocket support"
    source: "https://github.com/nats-io/nats.docs/blob/master/running-a-nats-service/configuration/websocket/websocket_conf.md"
    match: [websocket, websocket-config, allowed-connection-types]
