# Coverage spec: vapor. Topics from the official docs.
subject: vapor
scope:
  category: computing-software
  field: web-development
  products: [vapor]
sources:
  - "https://docs.vapor.codes/"
topics:
  - id: install-toolchain
    name: "Install Swift and Vapor toolbox"
    source: "https://docs.vapor.codes/install/linux/"
    match: [swiftly,vapor-toolbox]
  - id: hello-world
    name: "New project build and run"
    source: "https://docs.vapor.codes/getting-started/hello-world/"
    match: [vapor-new,vapor-run]
  - id: folder-structure
    name: "Project folder structure"
    source: "https://docs.vapor.codes/getting-started/folder-structure/"
    match: [folder-structure]
  - id: spm-manifest
    name: "Package.swift manifest"
    source: "https://docs.vapor.codes/getting-started/spm/"
    match: [package-swift,swiftpm]
  - id: xcode-working-dir
    name: "Xcode custom working directory"
    source: "https://docs.vapor.codes/getting-started/xcode/"
    match: [working-directory]
  - id: routing
    name: "Routing and route parameters"
    source: "https://docs.vapor.codes/basics/routing/"
    match: [routing,route-parameters]
  - id: route-groups
    name: "Route groups middleware redirects"
    source: "https://docs.vapor.codes/basics/routing/"
    match: [route-groups,redirect]
  - id: controllers
    name: "Controllers"
    source: "https://docs.vapor.codes/basics/controllers/"
    match: [controllers,routecollection]
  - id: content
    name: "Content and Codable"
    source: "https://docs.vapor.codes/basics/content/"
    match: [content,contentconfiguration]
  - id: validation
    name: "Request validation"
    source: "https://docs.vapor.codes/basics/validation/"
    match: [validatable,validators]
  - id: errors
    name: "Errors and Abort"
    source: "https://docs.vapor.codes/basics/errors/"
    match: [abort,debuggableerror]
  - id: logging
    name: "Logging"
    source: "https://docs.vapor.codes/basics/logging/"
    match: [vapor-logging,log-level]
  - id: environment
    name: "Environments and dotenv"
    source: "https://docs.vapor.codes/basics/environment/"
    match: [dotenv,environment]
  - id: async-await
    name: "Async await"
    source: "https://docs.vapor.codes/basics/async/"
    match: [async-await]
  - id: eventloopfuture
    name: "EventLoopFuture and promises"
    source: "https://docs.vapor.codes/basics/async/"
    match: [eventloopfuture,eventloop]
  - id: middleware
    name: "Middleware"
    source: "https://docs.vapor.codes/advanced/middleware/"
    match: [middleware,cors]
  - id: request
    name: "Request object"
    source: "https://docs.vapor.codes/advanced/request/"
    match: [vapor-request]
  - id: files
    name: "File IO and streaming"
    source: "https://docs.vapor.codes/advanced/files/"
    match: [fileio,filemiddleware]
  - id: server-config
    name: "Server configuration and TLS"
    source: "https://docs.vapor.codes/advanced/server/"
    match: [server-configuration,vapor-tls]
  - id: services
    name: "Services and lifecycle"
    source: "https://docs.vapor.codes/advanced/services/"
    match: [vapor-services,lifecyclehandler]
  - id: sessions
    name: "Sessions"
    source: "https://docs.vapor.codes/advanced/sessions/"
    match: [sessions,sessionsmiddleware]
  - id: websockets
    name: "WebSockets"
    source: "https://docs.vapor.codes/advanced/websockets/"
    match: [websockets]
  - id: commands
    name: "Console commands"
    source: "https://docs.vapor.codes/advanced/commands/"
    match: [vapor-commands]
  - id: queues-jobs
    name: "Queues and jobs"
    source: "https://docs.vapor.codes/advanced/queues/"
    match: [queues,job]
  - id: queues-scheduling
    name: "Scheduled jobs"
    source: "https://docs.vapor.codes/advanced/queues/"
    match: [scheduledjob]
  - id: testing
    name: "Testing"
    source: "https://docs.vapor.codes/advanced/testing/"
    match: [vaportesting,xctvapor]
  - id: tracing
    name: "Distributed tracing"
    source: "https://docs.vapor.codes/advanced/tracing/"
    match: [tracingmiddleware]
  - id: apns
    name: "Apple push notifications"
    source: "https://docs.vapor.codes/advanced/apns/"
    match: [apns]
  - id: fluent-setup
    name: "Fluent setup and drivers"
    source: "https://docs.vapor.codes/fluent/overview/"
    match: [fluent,fluent-drivers]
  - id: fluent-model
    name: "Fluent models"
    source: "https://docs.vapor.codes/fluent/model/"
    match: [fluent-model]
  - id: fluent-schema
    name: "Schema builder"
    source: "https://docs.vapor.codes/fluent/schema/"
    match: [fluent-schema]
  - id: fluent-migration
    name: "Migrations"
    source: "https://docs.vapor.codes/fluent/migration/"
    match: [fluent-migration]
  - id: fluent-query
    name: "Query builder"
    source: "https://docs.vapor.codes/fluent/query/"
    match: [fluent-query]
  - id: fluent-relations
    name: "Relations"
    source: "https://docs.vapor.codes/fluent/relations/"
    match: [fluent-relations]
  - id: fluent-transaction
    name: "Transactions"
    source: "https://docs.vapor.codes/fluent/transaction/"
    match: [fluent-transaction]
  - id: fluent-advanced
    name: "SQL and MongoDB specifics"
    source: "https://docs.vapor.codes/fluent/advanced/"
    match: [fluent-mongodb,sqldatabase]
  - id: authentication
    name: "Authentication"
    source: "https://docs.vapor.codes/security/authentication/"
    match: [authenticatable,guardmiddleware]
  - id: jwt
    name: "JWT"
    source: "https://docs.vapor.codes/security/jwt/"
    match: [vapor-jwt,jwtkit]
  - id: crypto
    name: "Crypto Bcrypt OTP"
    source: "https://docs.vapor.codes/security/crypto/"
    match: [bcrypt,otp]
  - id: passwords
    name: "Password hasher"
    source: "https://docs.vapor.codes/security/passwords/"
    match: [password-hasher]
  - id: leaf
    name: "Leaf templates"
    source: "https://docs.vapor.codes/leaf/overview/"
    match: [leaf]
  - id: leaf-setup
    name: "Leaf setup"
    source: "https://docs.vapor.codes/leaf/getting-started/"
    match: [leaf-setup]
  - id: leaf-tags
    name: "Custom Leaf tags"
    source: "https://docs.vapor.codes/leaf/custom-tags/"
    match: [leaftag]
  - id: redis
    name: "Redis"
    source: "https://docs.vapor.codes/valkey/redis/"
    match: [vapor-redis]
  - id: deploy-docker
    name: "Docker deploy"
    source: "https://docs.vapor.codes/deploy/docker/"
    match: [vapor-docker]
  - id: deploy-heroku
    name: "Heroku deploy"
    source: "https://docs.vapor.codes/deploy/heroku/"
    match: [vapor-heroku]
  - id: deploy-fly
    name: "Fly.io deploy"
    source: "https://docs.vapor.codes/deploy/fly/"
    match: [vapor-fly]
  - id: deploy-nginx
    name: "Nginx proxy"
    source: "https://docs.vapor.codes/deploy/nginx/"
    match: [vapor-nginx]
  - id: deploy-supervisor
    name: "Supervisor"
    source: "https://docs.vapor.codes/deploy/supervisor/"
    match: [supervisor]
  - id: deploy-systemd
    name: "systemd"
    source: "https://docs.vapor.codes/deploy/systemd/"
    match: [systemd]
  - id: deploy-digitalocean
    name: "DigitalOcean deploy"
    source: "https://docs.vapor.codes/deploy/digital-ocean/"
    match: [vapor-digitalocean]
