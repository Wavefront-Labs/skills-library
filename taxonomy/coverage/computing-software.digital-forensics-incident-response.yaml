# Canonical coverage spec: Digital Forensics & Incident Response (whole field).
# Checked by tools/coverage_check.py - a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (NIST SP 800-61r3 and SP 800-86, RFC 3227,
# SANS FOR500/FOR508/FOR572/FOR610 course outlines, GCFE/GCFA/GNFA/GREM exam objectives, and the
# Volatility 3 / Autopsy / The Sleuth Kit / Wireshark / Velociraptor / KAPE / Plaso docs tables of
# contents), not from what the library happened to contain.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (NIST section
# headings, course-day module lists, exam objective bullets, tool plugin / sub-command lists).
# Depth round 2 adds the next level: SP 800-61r3 / 800-86 section tasks, FOR500/508/572/610 module
# sub-bullets, Volatility 3 plugins, TSK tools, Velociraptor artifact categories, KAPE target groups, Plaso parsers.
# Scope is defensive and investigative only.
subject: digital-forensics-incident-response
scope:
  category: computing-software
  field: digital-forensics-incident-response
  products: [volatility, autopsy-sleuthkit, wireshark-forensics, incident-response-process, malware-analysis, disk-memory-forensics, log-analysis, evidence-handling]
sources:
  - "NIST SP 800-61 Rev. 3 (2025) Incident Response Recommendations and Considerations for Cybersecurity Risk Management - CSF 2.0 profile (Govern, Identify, Protect, Detect, Respond, Recover), incident response roles, policies and plans, incident handling (declaration, analysis, prioritization, containment, eradication, recovery), lessons learned and improvement; Rev. 2 lifecycle sections 3.1-3.4 for sub-structure"
  - "NIST SP 800-86 Guide to Integrating Forensic Techniques into Incident Response - sections 3 (process - collection, examination, analysis, reporting), 4 (data files), 5 (operating systems - volatile and non-volatile data), 6 (network traffic), 7 (applications), 8 (multiple sources)"
  - "RFC 3227 Guidelines for Evidence Collection and Archiving - 2.1 order of volatility, 2.2 things to avoid, 2.3 privacy, 2.4 legal, 3 collection procedure (transparency, steps), 4 archiving (chain of custody, where and how to archive), 5 tools"
  - "SANS FOR500 Windows Forensic Analysis course outline - evidence acquisition, registry analysis, shell items (LNK, jump lists, shellbags), USB and BYOD devices, email, Windows event logs, browser forensics, Windows timeline; GIAC GCFE exam objectives"
  - "SANS FOR508 Advanced Incident Response, Threat Hunting and Digital Forensics course outline - incident response and hunting, intrusion analysis (credential theft, lateral movement, persistence, evidence of execution), memory forensics, timeline analysis, anti-forensics detection and enterprise remediation; GIAC GCFA exam objectives"
  - "SANS FOR572 Advanced Network Forensics course outline - off-the-disk and on-the-wire evidence, core protocols (HTTP, DNS, TLS, SMB, email), NetFlow, Zeek, encryption and protocol reverse engineering, commercial tools; GIAC GNFA exam objectives"
  - "SANS FOR610 Reverse-Engineering Malware course outline and GIAC GREM objectives - lab setup, behavioural analysis, static code analysis, malicious documents and scripts, packed and obfuscated malware, .NET analysis"
  - "Volatility 3 documentation (volatility3.readthedocs.io) plugin list - windows.*, linux.*, mac.* plugins, symbol tables, timeliner, yarascan; Autopsy user documentation (sleuthkit.org/autopsy/docs) and The Sleuth Kit tool list (mmls, fsstat, fls, icat, istat, blkls, mactime, tsk_recover); Wireshark User's Guide and tshark/editcap/mergecap/capinfos manual pages; Velociraptor docs (VQL, artifacts, hunts, notebooks); KAPE documentation (targets, modules); Plaso documentation (log2timeline, psort, pinfo, filters)"
