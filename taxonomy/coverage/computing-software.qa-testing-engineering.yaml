# Canonical coverage spec: QA / Testing Engineering (whole field).
# Checked by tools/coverage_check.py: a topic is covered when a skill in scope has a tag equal
# to one of its `match` keywords, or a keyword appears as a whole word in the skill's id/name.
# Topics come from external, authoritative structures (ISTQB syllabi chapter and learning-objective
# lists, the official documentation tables of contents of each tool), not from what we happened to
# write, so the check measures the library against the subject.
# Depth: each topic lists `subtopics` taken from the source's own sub-structure (syllabus learning
# objectives and sub-sections, docs page sub-headings, API/CLI reference groups).
subject: qa-testing-engineering
scope:
  category: computing-software
  field: qa-testing-engineering
  products: [selenium, playwright, cypress, jest-pytest, jmeter-k6, test-automation, test-case-design, exploratory-testing, performance-testing]
sources:
  - "ISTQB Certified Tester Foundation Level (CTFL) syllabus v4.0 - 1 Fundamentals of Testing (objectives, testing vs debugging, seven principles, test activities/testware/roles, traceability, independence), 2 Testing Throughout the SDLC (test-first TDD/ATDD/BDD, DevOps, shift-left, retrospectives, test levels, test types, confirmation and regression testing, maintenance testing), 3 Static Testing (work products, review process, review types, success factors), 4 Test Analysis and Design (EP, BVA, decision tables, state transition, statement/branch coverage, error guessing, exploratory, checklist-based, collaborative user story writing, acceptance criteria, ATDD), 5 Managing Test Activities (test plan, entry/exit criteria, estimation, prioritisation, test pyramid, testing quadrants, risk analysis/control, monitoring/control/metrics, reporting, configuration management, defect management), 6 Test Tools"
  - "ISTQB Advanced Level Test Analyst (CTAL-TA) syllabus v4.0 - test analysis/design/implementation/execution tasks, risk-based testing contribution, domain testing, combinatorial testing (pairwise, classification tree), random testing, scenario-based/use-case testing, experience-based techniques, quality characteristics (functional suitability, usability, compatibility/interoperability), defect prevention, reviewing test basis, keyword-driven automation"
  - "ISTQB Advanced Level Technical Test Analyst (CTAL-TTA) syllabus v4.0 - white-box techniques (statement, decision, MC/DC, multiple condition, basis path, API testing), static analysis (control flow, data flow, maintainability metrics), dynamic analysis (memory leaks, wild pointers, performance), technical quality characteristics (security, reliability, performance efficiency, maintainability, portability), code/architecture review checklists, test automation (keyword-driven, model-based, tool selection, fault seeding)"
  - "Playwright docs ToC (playwright.dev/docs) - Writing tests, Locators, Assertions, Auto-waiting/Actionability, Fixtures, Configuration, Projects, Parallelism and sharding, Retries, Annotations, Test generator, Trace viewer, UI mode, Debugging, Authentication, Network/mock APIs, API testing, Visual comparisons, Components, Emulation, Clock, Aria snapshots, Accessibility testing, Reporters, Global setup/teardown, Continuous Integration, Page object models"
  - "Cypress docs ToC (docs.cypress.io) - Core concepts (Introduction, Querying elements, Retry-ability, Interacting with elements, Variables and aliases, Conditional testing, Test isolation), Guides (Network requests/cy.intercept, Authentication/cy.session, cy.origin cross-origin, Environment variables, Configuration, Custom commands, Plugins/cy.task, Screenshots and videos, Debugging, Component testing), Cypress Cloud (Smart orchestration/parallelization, Flake detection, Test Replay), Best practices"
  - "Selenium docs ToC (selenium.dev/documentation) - WebDriver (Getting started, Drivers/Selenium Manager, Browser options, Elements - locators/finders/interactions/information, Waits, Actions API, BiDi, Interactions - windows/frames/alerts/cookies/print), Grid (getting started, roles, configuration, Docker, observability), Test practices (encouraged - page object models, domain specific language, generating application state, mock external services, avoid sharing state, test independence; discouraged - captchas, file downloads, HTTP response codes, link spidering, two factor)"
  - "pytest docs (docs.pytest.org) How-to guides - assert, fixtures (scope, yield teardown, conftest, parametrized fixtures, autouse, factories), parametrize, markers (skip/xfail/custom), monkeypatch, tmp_path, capsys/caplog, warnings, plugins and hooks, configuration ini/pyproject, pytest-xdist, pytest-cov; Jest docs (Matchers, Asynchronous code, Setup and teardown, Mock functions, Manual mocks, Timer mocks, Snapshot testing, Configuration/coverage, ES modules); JUnit 5 User Guide (annotations, assertions, assumptions, nested tests, display names, parameterized tests, dynamic tests, extension model, tagging/filtering, parallel execution); Mockito docs"
  - "Grafana k6 docs ToC (grafana.com/docs/k6) - Get started, Using k6 (HTTP requests, metrics, checks, thresholds, test lifecycle, options, scenarios and executors, tags and groups, environment variables, modules), Test types (smoke, average-load, stress, soak, spike, breakpoint), Testing guides (API load testing, browser testing, data parameterization with SharedArray, correlation), Results output (end-of-test summary, real-time outputs Prometheus/InfluxDB/JSON/CSV), Extensions (xk6); Apache JMeter User Manual (Building a test plan, Elements of a test plan, Thread groups, Samplers, Logic controllers, Config elements, Timers, Assertions, Pre/post processors, Listeners, Non-GUI mode, Remote/distributed testing, HTML dashboard report, HTTP(S) Test Script Recorder, Best practices, Functions and variables); Locust docs (Writing a locustfile, tasks and wait_time, Configuration, Distributed load generation, Custom load shapes, Running headless)"
