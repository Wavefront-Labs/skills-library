# Coverage spec for Varnish Cache, from the official docs (www.varnish.org/docs).
# A topic is covered when a skill in scope has a tag equal to one of its match keywords.
subject: varnish-cache
scope:
  category: computing-software
  field: systems-network-administration
  products: [varnish-cache]
sources:
  - "Varnish Cache documentation (www.varnish.org/docs)"
topics:
  - id: install-debian-ubuntu
    name: "install debian ubuntu and install rhel compatible"
    source: "https://www.varnish.org/docs/install-guide/install-debian-ubuntu/"
    match: [install-packages, install-packages]
  - id: docker-container-deploy
    name: "docker container deploy and kubernetes helm deploy"
    source: "https://www.varnish.org/docs/install-guide/install-docker/"
    match: [docker, kubernetes]
  - id: quick-start-first-run
    name: "quick start first run"
    source: "https://www.varnish.org/docs/tutorials/starting-varnish/"
    match: [quick-start]
  - id: listen-addresses-and-sockets
    name: "listen addresses and sockets"
    source: "https://www.varnish.org/docs/reference/varnishd/"
    match: [listen-address]
  - id: native-tls
    name: "native tls"
    source: "https://www.varnish.org/docs/tutorials/tls/"
    match: [native-tls]
  - id: systemd-service-config
    name: "systemd service config"
    source: "https://www.varnish.org/docs/tutorials/configuring-varnish-systemd-services/"
    match: [systemd]
  - id: storage-backends
    name: "storage backends and transient storage and sizing"
    source: "https://www.varnish.org/docs/users-guide/storage-backends/"
    match: [stevedore, transient]
  - id: runtime-parameters
    name: "runtime parameters"
    source: "https://www.varnish.org/docs/reference/varnishd/"
    match: [param-set]
  - id: thread-pool-tuning
    name: "thread pool tuning and backend and client timeouts"
    source: "https://www.varnish.org/docs/reference/varnishd/"
    match: [thread-pools, connect-timeout]
  - id: varnishadm-cli-basics
    name: "varnishadm cli basics and cli access security"
    source: "https://www.varnish.org/docs/users-guide/run_cli/"
    match: [varnishadm, secret-file]
  - id: inline-c-and-vmod-safety
    name: "inline c and vmod safety"
    source: "https://www.varnish.org/docs/users-guide/vcl-inline-c/"
    match: [inline-c]
  - id: vcl-language-basics
    name: "vcl language basics and vcl types and expressions"
    source: "https://www.varnish.org/docs/reference/vcl/"
    match: [vcl-syntax, vcl-types]
  - id: request-processing-states
    name: "request processing states"
    source: "https://www.varnish.org/docs/reference/vcl-step/"
    match: [vcl-states]
  - id: backend-request-states
    name: "backend request states"
    source: "https://www.varnish.org/docs/reference/vcl-step/"
    match: [vcl-backend-fetch]
  - id: built-in-vcl-recv-rules
    name: "built in vcl recv rules and built in vcl backend response"
    source: "https://www.varnish.org/docs/tutorials/varnish-builtin-vcl/"
    match: [builtin-vcl, builtin-vcl]
  - id: vcl-hash-key
    name: "vcl hash key"
    source: "https://www.varnish.org/docs/users-guide/vcl-hashing/"
    match: [vcl-hash]
  - id: object-lifetime-ttl-grace-keep
    name: "object lifetime ttl grace keep and grace mode and stale serving"
    source: "https://www.varnish.org/docs/tutorials/object-lifetimes/"
    match: [ttl, grace-mode]
  - id: hit-for-miss-and-hit-for-pass
    name: "hit for miss and hit for pass and cookie handling"
    source: "https://www.varnish.org/docs/users-guide/increasing-your-hitrate/"
    match: [hit-for-miss, cookies]
  - id: vary-and-request-normalization
    name: "vary and request normalization"
    source: "https://www.varnish.org/docs/users-guide/increasing-your-hitrate/"
    match: [vary-header]
  - id: bypass-cache-pass-and-pipe
    name: "bypass cache pass and pipe"
    source: "https://www.varnish.org/docs/tutorials/bypass-cache-urls/"
    match: [return-pass]
  - id: caching-post-requests
    name: "caching post requests"
    source: "https://www.varnish.org/docs/tutorials/caching-post-requests-varnish/"
    match: [post-caching]
  - id: synthetic-responses-and-templates
    name: "synthetic responses and templates"
    source: "https://www.varnish.org/docs/tutorials/vcl-synthetic-output-template-file/"
    match: [synthetic-response]
  - id: http-redirects-in-vcl
    name: "http redirects in vcl and https redirect loops forwarded proto"
    source: "https://www.varnish.org/docs/tutorials/redirect/"
    match: [redirect, x-forwarded-proto]
  - id: compression-gzip
    name: "compression gzip"
    source: "https://www.varnish.org/docs/users-guide/compression/"
    match: [gzip]
  - id: edge-side-includes
    name: "edge side includes"
    source: "https://www.varnish.org/docs/users-guide/esi/"
    match: [esi]
  - id: device-detection
    name: "device detection"
    source: "https://www.varnish.org/docs/users-guide/devicedetection/"
    match: [device-detection]
  - id: vcl-labels-and-separate-vcls
    name: "vcl labels and separate vcls"
    source: "https://www.varnish.org/docs/users-guide/vcl-separate/"
    match: [vcl-label]
  - id: vcl-load-use-discard
    name: "vcl load use discard"
    source: "https://www.varnish.org/docs/reference/varnish-cli/"
    match: [vcl-load]
  - id: vcl-acls
    name: "vcl acls"
    source: "https://www.varnish.org/docs/reference/vcl/"
    match: [acl]
  - id: wordpress-vcl-config
    name: "wordpress vcl config"
    source: "https://www.varnish.org/docs/tutorials/configuring-varnish-wordpress/"
    match: [wordpress]
  - id: backend-definitions
    name: "backend definitions"
    source: "https://www.varnish.org/docs/reference/vcl-backend/"
    match: [backend-declaration]
  - id: multiple-backends-routing
    name: "multiple backends routing"
    source: "https://www.varnish.org/docs/tutorials/multiple-backends/"
    match: [multiple-backends]
  - id: backend-health-probes
    name: "backend health probes and probe basic authentication"
    source: "https://www.varnish.org/docs/reference/vcl-probe/"
    match: [health-probe, probe-request]
  - id: directors-load-balancing
    name: "directors load balancing"
    source: "https://www.varnish.org/docs/reference/vmod_directors/"
    match: [directors]
  - id: shard-director
    name: "shard director"
    source: "https://www.varnish.org/docs/reference/vmod_directors/"
    match: [shard-director]
  - id: http-purge
    name: "http purge"
    source: "https://www.varnish.org/docs/users-guide/purging/"
    match: [purge]
  - id: ban-expressions
    name: "ban expressions and ban lurker friendly bans"
    source: "https://www.varnish.org/docs/tutorials/ban/"
    match: [ban, ban-lurker]
  - id: xkey-tag-purging
    name: "xkey tag purging and soft purge vmod purge"
    source: "https://www.varnish.org/docs/tutorials/cache-invalidation/"
    match: [xkey, soft-purge]
  - id: varnishlog-basics
    name: "varnishlog basics"
    source: "https://www.varnish.org/docs/tutorials/vsl-cheatsheet/"
    match: [varnishlog]
  - id: vsl-query-language
    name: "vsl query language"
    source: "https://www.varnish.org/docs/reference/vsl-query/"
    match: [vsl-query]
  - id: varnishncsa-access-logs
    name: "varnishncsa access logs"
    source: "https://www.varnish.org/docs/tutorials/varnish-access-logs-varnishncsa/"
    match: [varnishncsa]
  - id: varnishstat-counters
    name: "varnishstat counters"
    source: "https://www.varnish.org/docs/tutorials/varnish-monitoring/"
    match: [varnishstat]
  - id: varnishtop-and-varnishhist
    name: "varnishtop and varnishhist and cache hit miss logging"
    source: "https://www.varnish.org/docs/users-guide/operation-statistics/"
    match: [varnishtop, x-cache-header]
  - id: troubleshooting-panics-and-debug
    name: "troubleshooting panics and debug"
    source: "https://www.varnish.org/docs/tutorials/troubleshooting-varnish/"
    match: [panic-show]
  - id: varnishtest-vtc-basics
    name: "varnishtest vtc basics"
    source: "https://www.varnish.org/docs/tutorials/testing-varnish-varnishtest/"
    match: [varnishtest]
  - id: vmod-std-functions
    name: "vmod std functions"
    source: "https://www.varnish.org/docs/reference/vmod_std/"
    match: [vmod-std]
  - id: vmod-proxy-tls-attributes
    name: "vmod proxy tls attributes"
    source: "https://www.varnish.org/docs/reference/vmod_proxy/"
    match: [vmod-proxy]
